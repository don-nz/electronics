    // combinations in natural binary-counting order and applies `fn`.
    // Copied verbatim from digital_knowledge_logic_gates.html's own helper

    function buildTruthRows(n, fn) {
      const rows = [];
      for (let v = 0; v < (1 << n); v++) {
        const inputs = [];
        for (let b = n - 1; b >= 0; b--) inputs.push((v >> b) & 1);
        rows.push({ inputs, z: fn(inputs) });
      }
      return rows;
    }
