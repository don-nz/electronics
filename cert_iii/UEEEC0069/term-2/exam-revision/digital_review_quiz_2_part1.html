<!--
  Exam-style multiple-choice review quiz for UEEEC0069, built from the
  teacher's own photographed "Sample Theory Test 2" pages (Part A —
  Multiple Choice, Q1-52 — plus the first six Part B short-answer/
  calculation questions, Q53-58), cross-checked question-by-question
  against the teacher's own "Answers for the EC0069 Sample Theory Test 2"
  marking guide. Same QUESTIONS[]-driven skeleton as digital_review_quiz_1_
  part1.html/part2.html — see those files' own header comments for the
  full field reference (leftPanel/kind/text/hint/options/correctExplain/
  working) and for the general "how a review quiz in this project is
  built" conventions this file follows throughout.

  Q59-64 (Part B's remaining short-answer questions — the marking guide
  gives answers for them: "Keypad encoding", "Light chaser", "Mux",
  "3.23%", "01110010", "1000" — but NOT their own question text) are
  deliberately NOT included here: the source photos stop at page 16 (which
  ends at Q58's own Figure 11), so Q59-64's actual question wording was
  never captured. Per the user's own direction, this file covers Q1-58 now;
  Q59-64 can be appended later once that missing page is available — do
  NOT guess at their wording in the meantime.

  Figure fidelity: every reference diagram below (Figures 1-4, 6-11) is
  redrawn as a clean schematic block (rect body + labelled pin lines +
  bubble/clock-triangle where the source shows one) using the same
  var(--colour-dff) IC-block convention as every flip-flop/counter symbol
  elsewhere in this project — NOT a pixel-accurate photo reproduction.
  Figure 5 (Q25-30's timing diagram) is shown as a plain data table rather
  than a hand-drawn waveform picture, matching digital_review_quiz_1_
  part1.html's own Q10/Q14/Q18-20/Table-in-text() convention for tabular
  reference data — its own header comment explains why a table (not a
  custom SVG) is this project's standard way to show that kind of content.

  Figure 5's own exact values were reconstructed from the ANSWER KEY's
  arithmetic, not pixel-read off the photo (a ~24-column, 4-row waveform
  photographed at an angle is too error-prone to transcribe digit-by-digit
  with confidence) — same "trust the verified marking guide over a shaky
  photo reading" precedent digital_review_quiz_1_part2.html's own Q54
  comment documents. The key facts the marking guide gives — lowest count
  = 2 (Q26=C), highest = 9 (Q27=A), modulus = 8 (Q28=B), Q3's own output
  frequency = CLK/8 = 10kHz at 80kHz (Q29=A) — only have ONE self-consistent
  explanation: a negative-edge 4-bit binary up-counter free-running an
  8-state cycle 2,3,4,5,6,7,8,9 (then wrapping back to 2), which is exactly
  what's tabulated below. Verified directly: 2=0010, 3=0011, 4=0100, 5=0101,
  6=0110, 7=0111, 8=1000, 9=1001 — Q3 (the MSB) is 0 for six of those eight
  states and 1 for the other two, toggling on a clean 8-clock period either
  way, which is what makes "CLK/8" the right answer regardless of the
  duty-cycle asymmetry.

  Q55-57 (draw-a-circuit questions) are converted into "recognise the
  correct wiring among plausible alternatives" single-select MC, same
  adaptation digital_review_quiz_1_part2.html's own header comment
  describes for every genuinely open-ended question in that file too (this
  project has no free-drawing mechanic) — no extra reference figure is
  drawn for them, since the question is fully expressed in the wording of
  each wiring option.

  Q58's own AND-gate-into-CLEAR redesign (Mod-5 from Figure 11's plain
  up-counter) is likewise converted to picking which TWO outputs feed that
  AND gate, rather than a free redraw — Figure 11 itself (the unmodified
  counter) is still shown via the standard circuit panel so the question
  can reference its real Q0/Q1/Q2 pin names.
-->

    const QUESTIONS = [
      {
        // Q1 — plain text single-select.
        leftPanel: 'none',
        text: () => 'Which statement is <b style="color:var(--colour-ui-primary)">true</b> about <b class="colour-dff">asynchronous</b> and <b class="colour-dff">synchronous</b> inputs to sequential logic devices?',
        hint: () => 'Think about whether a clock has to be involved for each type of input to actually take effect.',
        options: () => shuffle([
          { label: 'Both types of input are read continuously', type: 'wrong' },
          { label: 'Both types of input are only read when the device is triggered', type: 'wrong' },
          { label: 'Asynchronous inputs are read continuously but synchronous inputs are only read when the device is triggered', type: 'correct' },
          { label: 'Asynchronous inputs are read only when the device is triggered but synchronous inputs are read continuously', type: 'wrong' },
        ]),
        correctExplain: () => 'Asynchronous = read continuously; synchronous = only read when triggered',
        working: () => `
    <div class="working-line">An <b style="color:var(--colour-ui-correct)">asynchronous</b> input (like a PRESET/CLEAR) is being watched all the time — it takes effect the instant it's asserted, clock or no clock. A <b style="color:var(--colour-ui-correct)">synchronous</b> input (like D or J/K) only actually changes the output at the moment the device is triggered (an active clock edge) — it's sampled, not continuously read.</div>`
      },
      {
        // Q2 — plain text single-select.
        leftPanel: 'none',
        text: () => 'Which statement is <b style="color:var(--colour-ui-primary)">true</b> about <b class="colour-dff">level-sensitive</b> and <b class="colour-dff">edge-sensitive</b> trigger inputs to logic devices?',
        hint: () => 'One of these is asserted for a whole DURATION, the other only for a single INSTANT.',
        options: () => shuffle([
          { label: 'Both types of trigger input are asserted for the whole time that they\'re the correct logic level', type: 'wrong' },
          { label: 'Both types of trigger input are asserted only on the correct transition between logic levels', type: 'wrong' },
          { label: 'Level sensitive inputs are asserted for the whole time that they\'re the correct logic level but edge sensitive inputs are asserted only on the correct transition between logic levels', type: 'correct' },
          { label: 'Level sensitive inputs are asserted only on the correct transition between logic levels but edge sensitive inputs are asserted for the whole time that they\'re the correct logic level', type: 'wrong' },
        ]),
        correctExplain: () => 'Level-sensitive = asserted for the whole level; edge-sensitive = only at the transition',
        working: () => `
    <div class="working-line">A <b style="color:var(--colour-ui-correct)">level-sensitive</b> input stays asserted for as long as it sits at the correct logic level. An <b style="color:var(--colour-ui-correct)">edge-sensitive</b> input is only asserted for the single instant the signal actually transitions between levels — everything it does before or after that instant is ignored.</div>`
      },
      {
        // Reworked from the source's own single-select "which trigger
        // INPUT NAMES (clock/gate/enable/strobe) are level sensitive"

        // underlying level-vs-edge concept, tied to something more
        // concrete than an abstract list of input-type labels.
        kind: 'multi',
        text: () => `<b style="color:var(--colour-ui-primary)">Click</b> every device below that is <b style="color:var(--colour-ui-primary)">almost always level sensitive</b>.`,
        hint: () => 'A latch stays "transparent" for as long as its own control input sits at the active level. A flip-flop only ever samples its inputs at one precise clock edge.',
        options: () => shuffle([
          { label: 'Gated SR latch', type: 'correct' },
          { label: 'Gated D-type latch', type: 'correct' },
          { label: 'D-type flip-flop' },
          { label: 'J-K flip-flop' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are level sensitive`;
        },
        working: () => `
    <div class="working-line">A <b style="color:var(--colour-ui-correct)">gated SR latch</b> and a <b style="color:var(--colour-ui-correct)">gated D-type latch</b> are both level-sensitive by design — each one stays "transparent" (its output free to follow its data input) for the ENTIRE time its own enable/gate input sits at the active level, not just for an instant.</div>
    <div class="working-total">A <b>D-type flip-flop</b> and a <b>J-K flip-flop</b> are both edge-triggered instead — "flip-flop" itself is the usual giveaway in a device's own name, as opposed to "latch." Their own D/J/K inputs are only ever sampled at one precise clock edge, not read continuously the way a latch's own data input is.</div>`
      },
      {
        // Q4 — plain text single-select.
        leftPanel: 'none',
        text: () => '<b class="colour-dff">Synchronous</b> inputs to logic devices should not be left <b style="color:var(--colour-ui-primary)">floating</b> (ie not connected to anything) because they can',
        hint: () => 'A floating input is electrically undefined — think about what an undefined logic level could randomly do at the wrong moment.',
        options: () => shuffle([
          { label: 'cause the device to dissipate maximum power.', type: 'wrong' },
          { label: 'be asserted at random times when they shouldn\'t be.', type: 'correct' },

        ]),
        correctExplain: () => 'A floating input can be asserted at random, unwanted times',
        working: () => `
    <div class="working-line">A floating input has no defined logic level — it's free to drift with stray noise or capacitive coupling from nearby signals, so it can randomly read as asserted when nothing actually intended that. This is the same floating-input hazard every synchronous/asynchronous control pin in this project's own flip-flop exercises warns about (see Q13's own PRESET/CLEAR question further down).</div>`
      },
      {
        // Q5 — plain text single-select.

        text: () => 'Which one of the following is <b style="color:var(--colour-ui-primary)">NOT</b> an application for D-type and J-K flip flops?',

        options: () => shuffle([
          { label: 'Multiplexers', type: 'correct' },
          { label: 'Frequency dividers', type: 'wrong' },
          { label: 'Counters', type: 'wrong' },
          { label: 'Shift registers', type: 'wrong' },

        correctExplain: () => '<b>Multiplexers</b> — a purely combinational device, built from gates, not flip-flops',
        working: () => `
    <div class="working-line">Frequency dividers, counters and shift registers are all genuinely built from chains of D-type/J-K flip-flops — see Q55-58 further down this file for exactly how. A multiplexer, on the other hand, is a <b style="color:var(--colour-ui-correct)">combinational</b> device (built from gates like AND/OR, no memory involved) — it has no use for a flip-flop at all.</div>`
      },
      {
        // Q6 — Figure 1, shown via the standard circuit panel.
        leftPanel: 'circuit',
        circuitId: 'figure1-circuit',
        circuitLabel: 'Combinational logic block',
        circuitViewBox: '-100 -10 500 200',
        text: () => 'What is the name of the device shown below?',
        hint: () => 'One input, several parallel outputs — think about which conversion needs exactly that shape: ONE quantity in, an N-bit CODE out.',
        options: () => shuffle([
          { label: 'Analog-to-digital converter', type: 'correct' },
          { label: 'Digital-to-analog converter', type: 'wrong' },
          { label: 'Serial-to-parallel data converter', type: 'wrong' },
          { label: 'Parallel-to-serial data converter', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Analog-to-digital converter (ADC)</b> — one analog input, an N-bit digital word out',
        working: () => `
    <div class="working-line">One single input, converging in, fanning out to several parallel output lines — that's exactly the shape of an <b style="color:var(--colour-ui-correct)">ADC</b>: it takes ONE analog quantity and produces an N-bit digital CODE representing it (several output lines, one per bit).</div>
    <div class="working-total">A DAC would run the opposite direction (several digital inputs converging to one analog output). Serial-to-parallel and parallel-to-serial converters both move actual DATA between formats, not an analog quantity into a digital code — The single unlabelled "Input" (not "Serial data" or similar) is the tell that this is an analog quantity, not a bitstream.</div>`
      },
      {
        // Q7-11 refer to Figure 2 — D-type flip-flop, negative-edge CLK,

        leftPanel: 'circuit',
        circuitId: 'figure2-circuit',

        hint: () => 'Asynchronous inputs bypass the clock entirely — which pins on this symbol have nothing to do with the CLK lead at all?',
        options: () => shuffle([
          { label: 'D only', type: 'wrong' },
          { label: 'CLK only', type: 'wrong' },
          { label: 'P and C only', type: 'correct' },
          { label: 'CLK, P & C only', type: 'wrong' },
        ]),
        correctExplain: () => '<b>P and C only</b> — the async PRESET and CLEAR',
        working: () => `
    <div class="working-line"><b style="color:var(--colour-ui-correct)">P</b> (PRESET) and <b style="color:var(--colour-ui-correct)">C</b> (CLEAR) act immediately whenever asserted, completely independent of CLK — that's the definition of asynchronous. D is a synchronous input (only sampled at the active CLK edge — see Q8), and CLK itself is the clock, not an input that's asynchronous to itself.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'figure2-circuit',
        circuitLabel: 'D-type flip-flop',
        circuitViewBox: '-10 -10 290 320',
        text: () => 'Which input or inputs on this D-type flip-flop are <b style="color:var(--colour-ui-primary)">synchronous</b>?',
        hint: () => 'Only one pin here actually waits for a clock edge before it does anything.',
        options: () => shuffle([
          { label: 'D only', type: 'correct' },
          { label: 'CLK only', type: 'wrong' },
          { label: 'P and C only', type: 'wrong' },

        correctExplain: () => '<b>D only</b> — sampled at the active CLK edge, nothing else',
        working: () => `
    <div class="working-line"><b style="color:var(--colour-ui-correct)">D</b> is the only pin here that's actually synchronised to the clock — its value only matters at the instant of the active CLK edge. P and C act asynchronously (see Q7), and CLK is the clock itself, not something synchronised to it.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'figure2-circuit',
        circuitLabel: 'D-type flip-flop',
        circuitViewBox: '-10 -10 290 320',
        text: () => 'Which input or inputs on this D-type flip-flop are <b style="color:var(--colour-ui-primary)">negative edge-triggered</b>?',
        hint: () => 'Look for the inversion bubble sitting right in front of the clock triangle.',
        options: () => shuffle([
          { label: 'D only', type: 'wrong' },
          { label: 'CLK only', type: 'correct' },
          { label: 'P and C only', type: 'wrong' },
          { label: 'CLK, P & C only', type: 'wrong' },

        correctExplain: () => '<b>CLK only</b> — the bubble on the clock triangle marks it negative edge-triggered',
        working: () => `
    <div class="working-line">The bubble sitting directly in front of this symbol's own clock triangle marks <b style="color:var(--colour-ui-correct)">CLK</b> as negative (falling) edge-triggered — Q only updates the instant CLK goes from 1 to 0. P and C aren't edge-triggered at all (they're asynchronous levels, not edges), and D is a level sampled AT that edge, not an edge-triggered input in its own right.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'figure2-circuit',
        circuitLabel: 'D-type flip-flop',

        text: () => 'Which inputs on this D-type flip-flop are <b style="color:var(--colour-ui-primary)">active low</b>?',

        options: () => shuffle([

      },
      {
        leftPanel: 'circuit',
        circuitId: 'figure2-circuit',
        circuitLabel: 'D-type flip-flop',

        leftPanel: 'circuit',
        circuitId: 'figure3-circuit',

    <div class="working-line">J=1 and K=1 together is the J-K flip-flop's own dedicated <b style="color:var(--colour-ui-correct)">Toggle</b> row — on every active CLK edge, Q flips to whatever it currently isn't. Unlike an SR latch's S=R=1 (a genuinely invalid/race condition), J=K=1 on a J-K flip-flop is a well-defined, intentional behaviour — it's the one input combination with no D-type equivalent at all.</div>`
      },

        // Q13 — plain text single-select.
        leftPanel: 'none',
        text: () => 'Unused <b style="color:var(--colour-ui-primary)">active high</b> P and C inputs to D-type and J-K flip flops should be',

          { label: "connected to the circuit's clock signal.", type: 'wrong' },
        ]),
        correctExplain: () => '<b>Connected to common (GND)</b> — the idle level for an active-HIGH input',
        working: () => `
    <div class="working-line">Active-HIGH means asserted by a HIGH level — so its safe, idle level is LOW, which means tying it firmly to the circuit's own <b style="color:var(--colour-ui-correct)">common (GND)</b>. Tying it to Vcc would actually ASSERT it permanently, and leaving it floating risks exactly the random-assertion hazard Q4 covers. Tying it to the clock signal makes no sense at all for a level-based asynchronous input.</div>`
      },
      {
