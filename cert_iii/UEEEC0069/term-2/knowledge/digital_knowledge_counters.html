  Section 4 — "Counters" lesson objectives: define a counter; explain
  overflow (and underflow) for up and down counters; define LSB, MSB, weight
  and modulus; use Mod = 2^n and highest number = 2^n - 1; read a counter's
  clock edge, direction and modulus off a block diagram and timing diagrams;
  explain a truncated modulus (why a Mod-1000 counter still needs ten bits);
  explain cascading and why counter ICs have carry outputs; and interpret
  manufacturers' data for the 4017 (decade/Johnson) and 4029 (presettable
  up/down) counters.

  Same split every other digital_knowledge_*.html quiz uses (see
  digital_knowledge_jk_flip_flop.html's header comment): BUILDING a count
  sequence's output waveforms from a clock is left to the drag-and-build
  exercise ../exercises/counters/digital_counter_timing_diagram.html;
  INTERPRETING a counter's timing diagram in words and numbers is covered
  here (Q15-Q17).

  Same data-driven QUESTIONS[] engine as every other digital_knowledge_*.html
  quiz, using only plain single-select, one 'multi' (Q22) and one 'match'
  (Q4), plus leftPanel:'circuit' for the questions that read something off
  a diagram: Q5-Q7 (a generic 4-bit counter block, negative-edge clocked
  with an active-high clear) and Q15-Q17 (two timing diagrams).

  The three symbols below (ctr-block, ctr-timing-down, ctr-timing-mod) are
  page-local, drawn for this quiz. The timing diagrams were generated by a
  script from the count sequences quoted in Q15/Q17, so every edge lines up
  exactly with its clock pulse. The block is deliberately a GENERIC counter,
  not a specific part number's pinout.

  Question values (bit counts, clock frequency, counts) are original to this
  quiz — the course notes are only the reference for WHAT to cover.
-->

  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';
    DEFAULT_CIRCUIT_VIEWBOX = '-10 -10 290 200';

    const QUESTIONS = [
      {
        // Objective: define a counter (a counter counts its triggers).
        leftPanel: 'none',
        text: () => 'A turnstile sends one pulse to a <b>4-bit counter</b> for every visitor, and the counter started at 0000. After <b>37 visitors</b>, what do its outputs read?',
        hint: () => 'The counter only has four outputs, so it can\'t hold 37. What does it do when it passes its highest number?',
        options: () => shuffle([
          { label: `37 mod 16 = 5 → <b>0101</b>`, type: 'correct' },
          { label: `37 ÷ 16 = 2 (whole part) → <b>0010</b>`, type: 'wrong' },
          { label: `37 − 16 = 21 → <b>10101</b>`, type: 'wrong' },
          { label: `37 mod 10 = 7 → <b>0111</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '37 mod 16 = 5 → 0101',
        working: () => `
    <div class="working-step">Step 1 — a 4-bit counter has 2<sup>4</sup> = 16 counts, then it overflows:</div>
    <div class="working-line">visitors 1-15 → 0001 … 1111; visitor 16 → 0000 (overflow); visitor 32 → 0000 again.</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — what is left after two full laps (32)?</div>
    <div class="working-line">37 − 32 = <b style="color:var(--colour-ui-correct)">5</b> → 0101</div>
    <div class="working-total"><b>10101</b> would need a fifth output that doesn't exist. <b>0010</b> counts the laps, not what's left over. <b>0111</b> divides by 10, which is a decade counter, not a 4-bit binary one.</div>
    <div class="working-line" style="margin-top:.4rem">A counter simply counts its triggers; it remembers the total only up to its modulus — which is why a real people-counter needs enough bits for the biggest crowd.</div>`
      },
      {
        // Objective: overflow on an up counter.
        leftPanel: 'none',
        text: () => 'A <b>4-bit up counter</b> is showing <b>1111</b>. What happens on the next trigger?',
        hint: () => 'It has no fifth output bit to put a 1 in.',
        options: () => shuffle([
          { label: 'It <b>overflows</b> — the count jumps back to its lowest number, <b>0000</b>, and the sequence repeats', type: 'correct' },
          { label: 'It stays at 1111 until it is cleared', type: 'wrong' },
          { label: 'It becomes 10000, using an extra output bit', type: 'wrong' },
          { label: 'It starts counting down from 1111', type: 'wrong' },
        ]),
        correctExplain: () => 'Overflow: jumps back to 0000 and repeats',
        working: () => `
    <div class="working-step">Overflow:</div>
    <div class="working-line">When a counter has reached the <b>highest number</b> in its sequence and is triggered again, it jumps back to the <b>lowest number</b> — that's overflow. 1111 + 1 would be 10000, but only the four bits that exist survive: <b style="color:var(--colour-ui-correct)">0000</b>.</div>
    <div class="working-line" style="margin-top:.4rem">Same idea as a car's mechanical odometer rolling over from 99999 to 00000 — and it's why cascading counters (later) works: the overflow is the signal that the next stage should count.</div>`
      },
      {
        // Objective: overflow (underflow) on a down counter.
        leftPanel: 'none',
        text: () => 'A <b>3-bit down counter</b> is showing <b>000</b>. What is the output after the next trigger?',
        hint: () => 'Counting down from the lowest number wraps round to the highest.',
        options: () => shuffle([
          { label: '<b>111</b> — it jumps to the highest number in its sequence', type: 'correct' },
          { label: '<b>000</b> — it can\'t go lower, so it stays put', type: 'wrong' },
          { label: '<b>001</b> — it reverses direction', type: 'wrong' },
          { label: '<b>100</b> — only the MSB is set', type: 'wrong' },
        ]),
        correctExplain: () => '111 — wraps from lowest to highest',
        working: () => `
    <div class="working-step">Down-counter overflow:</div>
    <div class="working-line">At the <b>lowest</b> number the next trigger sends a down counter to the <b>highest</b> number. For three bits that is 111 (seven). Some manufacturers call this <i>underflow</i>, but the behaviour is identical: the sequence wraps round.</div>
    <div class="working-line" style="margin-top:.4rem">Count down from 000 by one in binary and you borrow from beyond the top bit — leaving all 1s behind.</div>`
      },
      {
        // Objective: LSB/MSB/modulus ideas — how often each output changes.
        leftPanel: 'none',
        kind: 'match',
        columns: () => ['Q₀ (LSB)', 'Q₁', 'Q₃ (MSB)'],
        text: () => `A 4-bit up counter runs through 16 counts. <b style="color:var(--colour-ui-primary)">Match</b> each output to how often it changes.`,
        hint: () => 'Q₀ flips on every count, and each higher output flips half as often as the one below it.',
        options: () => shuffle([
          { label: 'Every count', poolHtml: 'Changes on every count', col: 0 },
          { label: 'Every 2nd count', poolHtml: 'Changes every 2 counts', col: 1 },
          { label: 'Every 8th count', poolHtml: 'Changes every 8 counts', col: 2 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 3 matched correctly' : `${st.opts.length - wrongCount} of ${st.opts.length} matched correctly`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Mismatched:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">Each output flips half as often as the one before it:</div>
    <div class="working-line">Q₀ every 1 count &nbsp; Q₁ every 2 &nbsp; Q₂ every 4 &nbsp; Q₃ every <b style="color:var(--colour-ui-correct)">8</b></div>
    <div class="working-total">That's the same fact as frequency division (Q14): the MSB moves slowest, the LSB fastest. It also shows why the MSB is worth the most — it only changes when the count has travelled a long way.</div>
    ${mistakeLine}`;
        }
      },
      {
        // Objective: clock edge from the block diagram.
        circuitId: 'ctr-block',
        circuitLabel: 'Counter — Block Diagram',
        text: () => 'Which clock edge advances this counter?',
        hint: () => 'Look at the clock input: the triangle says edge-triggered, and there is a small circle on it.',
        options: () => shuffle([
          { label: 'The <b>falling (negative) edge</b> — 1 to 0 on CLK', type: 'correct' },
          { label: 'The <b>rising (positive) edge</b> — 0 to 1 on CLK', type: 'wrong' },
          { label: 'Any time CLK is HIGH — it is level-triggered', type: 'wrong' },
          { label: 'Any time CLK is LOW — it is level-triggered', type: 'wrong' },
        ]),
        correctExplain: () => 'Negative (falling) edge-triggered',
        working: () => `
    <div class="working-step">Reading the clock input:</div>
    <div class="working-line">The <b>triangle</b> marks the input as edge-sensitive (not level), and the <b>bubble</b> means the active edge is the <b>falling</b> one. It's the same convention as on a flip-flop's clock.</div>
    <div class="working-line" style="margin-top:.4rem">Without the bubble it would count on the rising edge.</div>`
      },
      {
        // Objective: clear input behaviour (applied scenario).
        circuitId: 'ctr-block',
        circuitLabel: 'Counter — Block Diagram',
        text: () => 'The counter shows <b>1011</b>. The clear input <b>C</b> is pulsed to logic 1 briefly (between clock edges), then returns to 0. Then <b>3</b> falling clock edges arrive. What do the outputs read?',
        hint: () => 'C has no bubble, so it acts on a HIGH. Does it wait for a clock edge, and what is the count afterwards?',
        options: () => shuffle([
          { label: '<b>0011</b> — cleared immediately to 0000 by the pulse, then 3 counts', type: 'correct' },

          { label: 'Taking RESET to <b>logic 0</b> returns it to its zero count' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are true`;
        },
        working: () => `
    <div class="working-line"><b>Timing:</b> each decoded output is HIGH for one full clock cycle, so at 1 kHz that is 1 ms; the whole sequence of ten takes 10 ms (so the carry-out runs at 100 Hz).</div>
    <div class="working-line"><b>Wrap-round:</b> it is a divide-by-10, so after Q9 it returns to Q0. Cascading two (carry-out of the first driving the clock of the second) gives 10 × 10 = 100.</div>
    <div class="working-line"><b>Not true:</b> the outputs are already decoded — Q3 <i>is</i> the "3" output, no gates needed. And its reset is <b>active-HIGH</b>: a logic 1 clears it; holding it at 0 lets it count.</div>
    <div class="working-total">This decoded output is why the 4017 is the classic LED-chaser/sequencer chip.</div>`
      },
      {
        // Objective: CD4029B datasheet — mode inputs applied.
        leftPanel: 'none',
        text: () => 'A CD4029B has its <b>binary/decade</b> input at logic <b>0</b> and its <b>up/down</b> input at logic <b>0</b>. It shows 0000. What does it show after one clock edge?',
        hint: () => 'Use the datasheet: which logic level selects binary and which selects up? Then count from 0 in that direction.',
        options: () => shuffle([
          { label: '<b>1001</b> — decade mode counting down wraps from 0 to 9', type: 'correct' },
          { label: '<b>1111</b> — binary mode counting down wraps from 0 to 15', type: 'wrong' },
          { label: '<b>0001</b> — counting up in decade mode', type: 'wrong' },
          { label: '<b>0000</b> — the counter holds until a preset is loaded', type: 'wrong' },
        ]),
        correctExplain: () => 'Decade, down: 0000 → 1001',
        working: () => `
    <div class="working-step">Read the two mode inputs from the datasheet:</div>
    <div class="working-line">binary/decade = 0 → <b>decade</b> (BCD, 0 to 9) &nbsp; up/down = 0 → <b>down</b></div>
    <div class="working-line">Counting down from 0 in decade mode wraps to the highest decade number: 9 = <b style="color:var(--colour-ui-correct)">1001</b>.</div>
    <div class="working-total"><b>1111</b> would be binary down (binary/decade = 1). <b>0001</b> would need up/down = 1. It doesn't hold — the clock edge is enough to advance it as long as carry-in and preset-enable are 0.</div>`
      },
      {
        // Objective: using the preset (jam) inputs.
        leftPanel: 'none',
        text: () => 'You want a CD4029B to start counting from <b>0101</b> (5). What do you do with its preset inputs?',
        hint: () => 'The datasheet says a logic 1 on preset enable loads the jam inputs into the counter, without waiting for the clock.',
        options: () => shuffle([
          { label: 'Put <b>0101</b> on the jam inputs, then take <b>preset enable HIGH</b> briefly and back to 0 — the outputs jump to 0101 and counting continues from there', type: 'correct' },
          { label: 'Put 0101 on the jam inputs and keep preset enable at 0 — it loads on the next clock edge', type: 'wrong' },
          { label: 'Put 0101 on the jam inputs and hold preset enable HIGH while the clock runs', type: 'wrong' },
          { label: 'Connect 0101 to the outputs Q₃Q₂Q₁Q₀ from outside', type: 'wrong' },
        ]),
        correctExplain: () => 'Set jam inputs to 0101, pulse preset enable HIGH',
        working: () => `
    <div class="working-step">From the datasheet's description:</div>
    <div class="working-line">A logic 1 on <b>preset enable</b> lets the jam inputs preset the counter to any state, <b>asynchronously</b> with the clock. Advancing is inhibited whenever preset enable is 1.</div>
    <div class="working-line" style="margin-top:.4rem">So: set the number on the jam inputs, pulse preset enable to 1 (outputs = 0101 at once), then return it to 0 so it counts from 5.</div>
    <div class="working-total">Holding it HIGH keeps the counter jammed at 0101. Leaving it at 0 means nothing is loaded — it just counts. The outputs are outputs: driving them from outside isn't how you preset.</div>`
      },
      {
        // Objective: carry-out / carry-in used for cascading (datasheet).
        leftPanel: 'none',
        text: () => 'Two CD4029Bs share one clock. IC1\'s <b>carry-out</b> is wired to IC2\'s <b>carry-in</b> (IC1\'s own carry-in is 0). The datasheet says carry-out is normally 1 and goes to 0 only at the maximum count. How does IC2 know when to count?',
        hint: () => 'Advancement is inhibited when carry-in is 1, and enabled when it is 0.',
        options: () => shuffle([
          { label: 'IC2\'s carry-in is held at <b>1</b> (inhibited) by IC1 almost all the time; only when IC1 is at its <b>maximum count</b> does it drop to 0, so IC2 advances on that one clock edge', type: 'correct' },
          { label: 'IC1\'s carry-out is a slower clock that IC2 counts on its own clock input', type: 'wrong' },
          { label: 'IC1\'s carry-out presets IC2 with the number it holds', type: 'wrong' },
          { label: 'IC2 counts on every clock edge, but only shows its outputs when IC1 overflows', type: 'wrong' },
        ]),
        correctExplain: () => 'Carry-in is 1 (inhibit) until IC1 reaches max count',
        working: () => `
    <div class="working-step">Following the datasheet:</div>
    <div class="working-line">Carry-out = 1 normally → IC2's carry-in = 1 → IC2 <b>inhibited</b> (holds its count).</div>
    <div class="working-line">IC1 reaches its maximum count → carry-out = 0 → IC2's carry-in = 0 → on that clock edge IC2 <b style="color:var(--colour-ui-correct)">advances by one</b> (while IC1 wraps to zero).</div>
    <div class="working-total">So IC2 advances once for every full cycle of IC1 — cascading with no extra gates, which is exactly why counter ICs have carry pins. This is a <b>synchronous</b> cascade (both ICs share the clock); the other approach, feeding one IC's output into the next IC's clock, is a ripple cascade.</div>`
      },
    ];

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
