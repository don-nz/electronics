  operation of an encoder and a decoder (block-diagram level only);
  interpret the truth table of encoders and decoders; explain the
  difference between an encoder and a priority encoder; give typical
  applications for encoders and decoders; interpret manufacturers' data for
  common encoder and decoder ICs (here the 74LS138 decoder, whose datasheet
  is in resources/datasheets, and the 74LS148 priority encoder); and use a
  logic probe to test and measure encoders and decoders.

  Same split every other digital_knowledge_*.html quiz on this site uses:
  CONSTRUCTING a decoder's output waveforms from its inputs is left to the
  drag-and-build exercise
  ../exercises/encoders-decoders/digital_decoder_timing_diagram.html;
  INTERPRETING truth tables and IC data is covered here, and the conceptual
  half of the logic-probe objective is Q21.

  Same data-driven QUESTIONS[] engine as every other digital_knowledge_*.html
  quiz: plain single-select, one 'multi' (Q18) and one 'match' (Q6), plus
  leftPanel:'circuit' for the questions that read something off a diagram:
  Q9-Q11 (a 4-line-to-2-line priority encoder's truth table), Q12-Q13 and
  Q15 (a 74LS138-style 3-to-8 decoder block) and Q16-Q17 (a 74LS148-style
  8-to-3 priority encoder block).

  The three symbols below (dec-138-block, enc-148-block, enc-table) are
  page-local, drawn for this quiz — generic block diagrams labelled the way
  those two ICs' datasheets label their pins, not a package pinout. The
  encoder truth table is drawn as an SVG so it can sit in the left panel.

  Question values (bit counts, input codes, delays) are original to this
  quiz — the course notes are only the reference for WHAT to cover.
-->

    <div class="working-line">5 = 101</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — outputs are active-LOW, so show it inverted:</div>
    <div class="working-line">101 → <b style="color:var(--colour-ui-correct)">010</b></div>
    <div class="working-total">The bubbles on both the inputs and the outputs warn you: a "1" here is shown as LOW. This one-liner catches many students out in exams — always check the bubbles before reading a code. (Input 7 would give 000; input 0 gives 111.)</div>`
      },
      {
        // Insight (datasheet): no input vs input 0 — the group signal.
        circuitId: 'enc-148-block',
        circuitLabel: '8-to-3 Priority Encoder — Block Diagram',
        circuitViewBox: '-5 -5 290 265',
        text: () => 'On a plain 8-to-3 encoder, input 0 asserted gives code 000 — and so does <b>no input asserted at all</b>. How does this IC let a system tell the two cases apart?',
        hint: () => 'There is one output besides A₂, A₁ and A₀.',
        options: () => shuffle([
          { label: 'The extra <b>GS (group signal)</b> output shows whether <i>any</i> input is asserted, so "code only" can be told from "valid code"', type: 'correct' },
          { label: 'The enable input EI goes LOW whenever no input is asserted', type: 'wrong' },
          { label: 'The three code outputs switch to a fourth, unused code', type: 'wrong' },
          { label: 'It can\'t — which is why input 0 is never used', type: 'wrong' },
        ]),
        correctExplain: () => 'The GS (group signal) output',
        working: () => `
    <div class="working-line">With all inputs inactive the code outputs show the same pattern as for input 0, so the code alone is ambiguous. The 74LS148 adds a <b>group signal (GS)</b> output that goes active only when <i>at least one</i> input is asserted — the system reads A₂A₁A₀ only when GS says the code is real.</div>
    <div class="working-total">Some priority encoders simply have no "input 0" line (a 7-input device) so that "all zeros" can mean "nothing pressed". Either way, the designer must know which convention a part uses — it's in the datasheet.</div>`
      },
      {
        // Objective: typical applications.
        leftPanel: 'none',
        kind: 'multi',
        text: () => `Click <b style="color:var(--colour-ui-primary)">every</b> job that suits an <b style="color:var(--colour-ui-primary)">encoder</b> or a <b style="color:var(--colour-ui-primary)">decoder</b>.`,
        hint: () => 'Encoders turn "which line" into a number; decoders turn a number into "which line".',
        options: () => shuffle([
          { label: 'Turning a keypad\'s 12 keys into a 4-bit code', type: 'correct' },
          { label: 'Deciding which of several simultaneous interrupt requests a microprocessor serves first', type: 'correct' },
          { label: 'Selecting one memory chip from the address lines (address decoding)', type: 'correct' },
          { label: 'Driving a "light chaser" by turning on one of eight LEDs for each count', type: 'correct' },
          { label: 'Counting the pulses on a clock line' },
          { label: 'Holding a byte of data steady between clock edges' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> suit an encoder or a decoder`;
        },
        working: () => `
    <div class="working-line"><b>Encoders:</b> keypad/keyboard encoding (a key becomes a code) and, as priority encoders, interrupt handling.</div>
    <div class="working-line"><b>Decoders:</b> address decoding (memory and I/O chip select), "one of eight" LED displays such as a light chaser, and display multiplexing.</div>
    <div class="working-line"><b>Not these:</b> counting pulses is a counter's job and holding a byte is a data latch's (a parallel-in, parallel-out register).</div>`
      },
      {
        // Insight: why there's no such thing as a "priority decoder".
        leftPanel: 'none',
        text: () => 'Priority encoders exist, but there is <b>no such thing as a priority decoder</b>. Why not?',
        hint: () => 'Think about whether a decoder can ever be handed two different codes at once.',
        options: () => shuffle([
          { label: 'A decoder\'s input is <b>one binary number</b>, which can only be one value at a time — it can never receive two competing requests', type: 'correct' },
          { label: 'A decoder\'s outputs are too slow to be given priorities', type: 'wrong' },
          { label: 'Decoders already have enable inputs, which do the same job', type: 'wrong' },
          { label: 'Priority only works on active-LOW signals, and decoders are active-HIGH', type: 'wrong' },
        ]),
        correctExplain: () => 'A decoder can only ever have one binary number as input',
        working: () => `
    <div class="working-line">A conflict needs <b>two lines asserted at once</b>. An encoder has a separate input line for each request, so several can be active together and it needs a rule to pick one. A decoder's inputs are the <i>bits of a single number</i> — any pattern of bits is just one number, so there's never anything to choose between.</div>
    <div class="working-total">Where a decoder does need a rule, the rule is in the enables (and the unused codes), not a priority.</div>`
      },
      {
        // Objective: interpret IC data — propagation delay (datasheet 21 ns).
        leftPanel: 'none',
        text: () => 'The 74LS138 datasheet gives a typical propagation delay of <b>21 ns</b>. In a design the output of one 74LS138 drives the enable of a second one, and you want the second one\'s output. What is the typical total delay from the first one\'s input?',
        hint: () => 'Delays in a chain add up.',
        options: () => shuffle([
          { label: `t = 21 ns + 21 ns = 2 × 21 ns = <b>42 ns</b>`, type: 'correct' },
          { label: `t = 21 ns (only the slower chip counts)`, type: 'wrong' },
          { label: `t = 21 ns ÷ 2 = <b>10.5 ns</b>`, type: 'wrong' },
          { label: `t = 3 levels × 21 ns = <b>63 ns</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '2 × 21 ns = 42 ns',
        working: () => `
    <div class="working-step">Chain the stages:</div>
    <div class="working-line">first chip: 21 ns → second chip: 21 ns → total <b style="color:var(--colour-ui-correct)">42 ns</b></div>
    <div class="working-total">The datasheet's 21 ns is already for the chip as a whole (its three levels of logic inside), so you don't multiply by 3 again. Every extra decoder in a chain adds another 21 ns — the reason designers prefer a single bigger decoder, or enable inputs as in Q14, over long chains in fast systems.</div>`
      },
      {
        // Objective: use a logic probe on a decoder (conceptual half).
        leftPanel: 'none',
        text: () => 'You test a 74LS138 with its select inputs set to <b>101</b> and probe <b>Y₅</b>: the probe reads HIGH. Probing the other outputs shows <b>all eight outputs are HIGH</b>. What is the most likely fault?',
        hint: () => 'A working, enabled decoder always has exactly one output LOW.',
        options: () => shuffle([
          { label: 'The decoder is <b>not enabled</b> — an enable pin is at the wrong level (G1 LOW, or G2A/G2B HIGH), so every output is held HIGH', type: 'correct' },
          { label: 'The probe is faulty — it cannot read active-LOW outputs', type: 'wrong' },
          { label: 'The select inputs are wired backwards — Y₅ should be HIGH for 101', type: 'wrong' },
          { label: 'The decoder is working normally — HIGH is the asserted level on every output', type: 'wrong' },
        ]),
        correctExplain: () => 'Enable inputs not satisfied — all outputs held HIGH',
        working: () => `
    <div class="working-step">Predict, then probe:</div>
    <div class="working-line">Enabled, select = 101 → Y₅ should be <b>LOW</b>, the other seven HIGH.</div>
    <div class="working-line">Reading: all eight HIGH → no output selected at all → the chip isn't enabled. Check G1 is HIGH and both G2A and G2B are LOW.</div>
    <div class="working-total">A swapped select wire would still give exactly <i>one</i> LOW output — just the wrong one. "Nothing selected" points to the enables; "wrong one selected" points to the select wiring.</div>`
      },
      {
        // Objective: applications of active-LOW outputs — driving an LED.
        leftPanel: 'none',
        text: () => 'A decoder\'s outputs are <b>active-LOW</b> and you want the selected output to light an LED. How should the LED be connected?',
        hint: () => 'The selected output is the one that goes LOW. Which way will current flow?',
        options: () => shuffle([
          { label: 'LED <b>anode through a resistor to +5 V</b>, <b>cathode to the output</b> — when the output goes LOW, current flows and the LED lights', type: 'correct' },
          { label: 'LED anode to the output, cathode through a resistor to ground — the LED lights when the output goes LOW', type: 'wrong' },
          { label: 'LED anode to the output, cathode to +5 V — the HIGH outputs light all the unselected LEDs', type: 'wrong' },
          { label: 'Either way works — the decoder doesn\'t care which way the LED is connected', type: 'wrong' },
        ]),
        correctExplain: () => 'Anode via resistor to +5 V; cathode to the output (sinking current)',
        working: () => `
    <div class="working-step">Active-LOW outputs sink current:</div>
    <div class="working-line">The output pulls its pin LOW to select. So the LED must be wired <b>between +5 V (through a resistor) and the output</b>: LOW pulls current through it, HIGH leaves it dark.</div>
    <div class="working-total">The TTL LS-series also sinks much more current (about 8 mA) than it sources (0.4 mA — see the datasheet's IOL / IOH figures), which is exactly why active-LOW outputs are the usual way to drive LEDs.</div>`
      },
    ];

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
