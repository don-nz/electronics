<!--
  Week 9 — "RS Flip-Flops" lesson objectives: recognise the circuit and
  schematic symbol of NOR and NAND RS flip-flops, write the truth table for
  both, give applications where the RS flip-flop is used as a latch, explain
  the difference between combinational and sequential logic, explain active-
  HIGH vs active-LOW combinational/sequential inputs, and explain
  asynchronous vs synchronous inputs. Deliberately stops short of two of the
  lesson's own objectives: drawing a timing diagram from a given set of S/R
  levels (already covered, far better than a multi-choice quiz ever could,
  by the existing ../exercises/flip-flops/digital_flip_flop_nor_nand.html
  drag-and-build exercise — this quiz exists purely to round out the
  CONCEPTUAL objectives around it, not duplicate it) and using a logic
  probe/DMM to physically test a real circuit (needs actual hardware, same
  "conceptual quiz stops short of the hands-on objective" split established
  by digital_knowledge_boolean_algebra.html and digital_knowledge_logic_
  combos.html) — though Q10 below DOES cover the conceptual half of that
  objective (what a steady vs changing probe reading on a LATCH's output
  actually means), just not the physical probe-handling skill itself.

  Same data-driven QUESTIONS[] engine as every other digital_knowledge_*.html
  quiz, trimmed to only the kinds this one actually uses: plain single-select
  (no 'kind' field) throughout, plus leftPanel:'circuit' for Q1/Q2's own
  schematic-recognition pair (a circuitId swap between the NOR-built and
  NAND-built latch symbols) and, later, for every other question about a
  specific latch's behaviour (Q3/Q4/Q7/Q9/Q10 show the NOR IEC symbol,
  Q5/Q6 the NAND one, Q8 the gate-level NOR latch so the feedback is visible) — no 'multi'/'truth'/'match'/'bits' kinds needed
  here, matching the site's established "only carry the engine features
  actually used" convention.

  The two SR-latch IEC symbols (Q1/Q2's own circuitId targets) are copied
  inline from ../exercises/flip-flops/digital_flip_flop_nor_nand.html (def
  ids nor-sr-latch-iec/nand-sr-latch-iec, both styled via var(--colour-dff)
  — same convention as that file and the D-type PRESET/CLEAR exercise) —
  the canonical copy is in assets/shapes (cross-file <use> doesn't work under file://).

  CIRCUIT_SVG_ID = 'circuitRefSvg' (only override needed) — no
  DEFAULT_CIRCUIT_VIEWBOX (viewBox never changes between Q1/Q2, both symbols
  share the same -10 -10 310 240 box already), no SUMMARY_CIRCUIT_REF
  (summary just hides the panel, same as the shared default).
-->

      <line x1="9.5" y1="69.5" x2="100.5" y2="44" stroke="var(--colour-series)" stroke-width="2" />
      <line x1="100" y1="44.7" x2="100" y2="16" stroke="var(--colour-series)" stroke-width="2" />
      <circle cx="100" cy="16" r="2" fill="var(--colour-series)" style="stroke: var(--colour-series)"

  <script>Shapes.use('flip-flops', 'logic-gates');</script>
  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';
    DEFAULT_CIRCUIT_VIEWBOX = '-10 -10 310 240';

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see digital_knowledge_boolean_algebra.html's header
    // comment for the fuller field reference this file's engine follows.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: recognise the circuit/schematic symbol — NOR-built,
        // active-HIGH (unbarred inputs).
        circuitId: 'nor-sr-latch-iec',
        circuitLabel: 'SR Latch — Unbarred Inputs',
        text: () => 'The schematic symbol shown has plain, unbarred <b class="colour-dff">S</b> and <b class="colour-dff">R</b> inputs. Which gates is this latch actually built from internally?',
        hint: () => 'Unbarred inputs are asserted by driving them HIGH — that\'s the tell for which of the two cross-coupled gate types is used here.',
        options: () => shuffle([
          { label: 'Two cross-coupled <b>NOR</b> gates', type: 'correct' },
          { label: 'Two cross-coupled <b>NAND</b> gates', type: 'wrong' },
          { label: 'Two cross-coupled <b>AND</b> gates', type: 'wrong' },
          { label: 'A single <b>XOR</b> gate', type: 'wrong' },
        ]),
        correctExplain: () => 'Two cross-coupled <b>NOR</b> gates (active-HIGH S/R)',
        working: () => `
    <div class="working-step">Reading the symbol:</div>
    <div class="working-line">No overline on <b class="colour-dff">S</b> or <b class="colour-dff">R</b> means they're <b>active-HIGH</b> — each one is asserted by driving it to logic 1. A cross-coupled <b>NOR</b> latch is exactly the active-HIGH construction: apply a HIGH to either input and the corresponding NOR gate forces its own output LOW, which is what actually sets/resets the latch.</div>
    <div class="working-line" style="margin-top:.4rem">A cross-coupled <b>NAND</b> latch is the mirror image — active-LOW, and always drawn with the overline shown in the next question. AND/XOR gates aren't used to build an SR latch at all; a latch needs the OUTPUT fed back into the OTHER gate's input, which only works with an inverting gate type (NOR or NAND).</div>`
      },
      {
        // Objective: recognise the circuit/schematic symbol — NAND-built,
        // active-LOW (barred inputs) — and tie the bar notation directly
        // to the active-HIGH/active-LOW objective.
        circuitId: 'nand-sr-latch-iec',
        circuitLabel: 'SR Latch — Barred Inputs',
        text: () => 'This time <b class="colour-dff">S</b> and <b class="colour-dff">R</b> are both shown with an overline — <span style="text-decoration:overline">S</span> and <span style="text-decoration:overline">R</span>. What does that tell you about this latch?',
        hint: () => 'The overline is the standard notation for an active-LOW input. Which of the two cross-coupled gate types is asserted by a LOW level?',
        options: () => shuffle([
          { label: 'It\'s built from two cross-coupled <b>NAND</b> gates, and <span style="text-decoration:overline">S</span>/<span style="text-decoration:overline">R</span> are asserted by driving them LOW', type: 'correct' },
          { label: 'It\'s built from two cross-coupled <b>NOR</b> gates, and <span style="text-decoration:overline">S</span>/<span style="text-decoration:overline">R</span> are asserted by driving them HIGH', type: 'wrong' },
          { label: 'It\'s the same NOR latch as the previous question — the bar is just a labelling style with no electrical meaning', type: 'wrong' },
          { label: 'It means the <b class="colour-dff">Q</b> and <span style="text-decoration:overline">Q</span> outputs have swapped places', type: 'wrong' },
        ]),
        correctExplain: () => '<b>NAND</b>-based latch, <span style="text-decoration:overline">S</span>/<span style="text-decoration:overline">R</span> asserted LOW',
        working: () => `
    <div class="working-step">Reading the bar notation:</div>
    <div class="working-line">An overline over an input's name always means <b>active-LOW</b> — asserted by a logic 0, not a logic 1. A cross-coupled <b>NAND</b> latch is the active-LOW construction: pull either input LOW and that NAND gate is forced HIGH, which sets/resets the latch.</div>
    <div class="working-line" style="margin-top:.4rem">This isn't just a labelling choice — it changes how you'd actually drive the circuit, and (as the next couple of questions cover) it flips which raw input combination counts as Hold vs Invalid compared to the NOR version.</div>`
      },
      {
        // Objective: write the truth table — NOR/active-HIGH, the Set row.
        circuitId: 'nor-sr-latch-iec',
        circuitLabel: 'NOR-Based SR Latch (Active-HIGH)',
        text: () => 'For a NOR-based (active-HIGH) SR latch, what happens when <b class="colour-dff">S</b> = 1 and <b class="colour-dff">R</b> = 0?',
        hint: () => 'Only one input is asserted here — which one, and what does asserting it do to Q?',
        options: () => shuffle([
          { label: '<b>Set</b> — Q goes (or stays) HIGH', type: 'correct' },
          { label: '<b>Reset</b> — Q goes (or stays) LOW', type: 'wrong' },
          { label: '<b>Hold</b> — Q stays exactly where it was', type: 'wrong' },
          { label: '<b>Invalid</b> — both outputs forced HIGH, undefined', type: 'wrong' },
        ]),
        correctExplain: () => 'Set — Q → 1',
        working: () => `
    <div class="working-step">S = 1, R = 0:</div>
    <div class="working-line"><b class="colour-dff">S</b> asserted (R is not) is the definition of <b>Set</b> — the latch's Q output goes HIGH (or stays HIGH if it already was), regardless of whatever Q was doing beforehand.</div>
    <div class="working-step" style="margin-top:.6rem">Inside the latch — two cross-coupled NOR gates:</div>
    <svg viewBox="0 0 320 285" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:360px;display:block;margin:.3rem 0" font-family="'Share Tech Mono', monospace">
      <text x="2" y="12" font-size="12" style="fill: var(--colour-label)">① S = 1 forces the lower NOR low</text>
      <use href="#gate-nor-trad-lg" transform="translate(92,24) scale(1.8)" />
      <text x="86" y="43" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)">Q = ?</text>
      <text x="86" y="72" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)">S = 1</text>
      <text x="222" y="58" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)"><tspan style="text-decoration:overline">Q</tspan> = 0</text>
      <text x="2" y="107" font-size="12" style="fill: var(--colour-label)">② …which lets the upper NOR go high</text>
      <use href="#gate-nor-trad-lg" transform="translate(92,119) scale(1.8)" />
      <text x="86" y="138" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)">R = 0</text>
      <text x="86" y="167" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)"><tspan style="text-decoration:overline">Q</tspan> = 0</text>
      <text x="222" y="153" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)">Q = 1</text>
      <text x="2" y="202" font-size="12" style="fill: var(--colour-label)">③ …and Q = 1 feeds back to hold it</text>
      <use href="#gate-nor-trad-lg" transform="translate(92,214) scale(1.8)" />
      <text x="86" y="233" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)">Q = 1</text>
      <text x="86" y="262" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)">S = 1</text>
      <text x="222" y="248" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)"><tspan style="text-decoration:overline">Q</tspan> = 0</text>
    </svg>
    <div class="working-line">A NOR gate's output is HIGH only when <b>both</b> its inputs are LOW. S = 1 on the lower gate pulls <span style="text-decoration:overline">Q</span> LOW whatever Q was; that LOW and R = 0 are both LOW inputs to the upper gate, so Q rises to 1 — the latch has been <b>set</b>.</div>
    <div class="working-step" style="margin-top:.6rem">The same two gates, joined as the complete latch (the output of each feeds an input of the other):</div>
    <svg viewBox="-20 -2 185 128" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:360px;display:block;margin:.3rem 0" font-family="'Share Tech Mono', monospace">
      <use href="#nor-latch-internal" />
    </svg>`
      },
      {
        // Objective: write the truth table — NOR/active-HIGH, the Hold
        // row, chosen deliberately as the question that also sets up the
        // combinational-vs-sequential objective a few questions later.
        circuitId: 'nor-sr-latch-iec',
        circuitLabel: 'NOR-Based SR Latch (Active-HIGH)',
        text: () => 'For a NOR-based (active-HIGH) SR latch, what happens when <b class="colour-dff">S</b> = 0 and <b class="colour-dff">R</b> = 0?',
        hint: () => 'Neither input is asserted here — with nothing telling the latch to change, what does it do?',
        options: () => shuffle([
          { label: '<b>Hold</b> — Q stays exactly where it was', type: 'correct' },
          { label: '<b>Set</b> — Q goes (or stays) HIGH', type: 'wrong' },
          { label: '<b>Reset</b> — Q goes (or stays) LOW', type: 'wrong' },
          { label: 'Q always resets to LOW by default', type: 'wrong' },
        ]),
        correctExplain: () => 'Hold — Q stays exactly where it was',
        working: () => `
    <div class="working-step">S = 0, R = 0:</div>
    <div class="working-line">With neither input asserted, there's nothing forcing Q either way — it simply <b>holds</b> whatever value it last had. This is the whole point of a latch: it has <b>memory</b>. A purely combinational circuit has no "last value" to hold onto at all — its output is only ever a function of whatever the inputs are doing right now.</div>
    <div class="working-step" style="margin-top:.6rem">Inside the latch — why nothing changes (shown for Q = 1):</div>
    <svg viewBox="0 0 320 285" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:360px;display:block;margin:.3rem 0" font-family="'Share Tech Mono', monospace">
      <text x="2" y="12" font-size="12" style="fill: var(--colour-label)">① upper NOR: both inputs LOW → HIGH</text>
      <use href="#gate-nor-trad-lg" transform="translate(92,24) scale(1.8)" />
      <text x="86" y="43" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)"><tspan style="text-decoration:overline">Q</tspan> = 0</text>
      <text x="86" y="72" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)">R = 0</text>
      <text x="222" y="58" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)">Q = 1</text>
      <text x="2" y="107" font-size="12" style="fill: var(--colour-label)">② lower NOR: Q is HIGH → stays LOW</text>
      <use href="#gate-nor-trad-lg" transform="translate(92,119) scale(1.8)" />
      <text x="86" y="138" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)">Q = 1</text>
      <text x="86" y="167" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)">S = 0</text>
      <text x="222" y="153" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)"><tspan style="text-decoration:overline">Q</tspan> = 0</text>
      <text x="2" y="202" font-size="12" style="fill: var(--colour-label)">③ …and <tspan style="text-decoration:overline">Q</tspan> = 0 feeds back: Q stays HIGH</text>
      <use href="#gate-nor-trad-lg" transform="translate(92,214) scale(1.8)" />
      <text x="86" y="233" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)"><tspan style="text-decoration:overline">Q</tspan> = 0</text>
      <text x="86" y="262" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)">R = 0</text>
      <text x="222" y="248" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)">Q = 1</text>
    </svg>
    <div class="working-line">Each gate's output is the very input that keeps the other gate's output where it is, so the pair <b>locks itself</b> in place. With S = R = 0 nothing from outside disturbs the loop. (If Q had been 0, the same two gates hold the opposite way round, with <span style="text-decoration:overline">Q</span> = 1.)</div>
    <div class="working-step" style="margin-top:.6rem">The same two gates, joined as the complete latch — the feedback lines are what hold the state:</div>
    <svg viewBox="-20 -2 185 128" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:360px;display:block;margin:.3rem 0" font-family="'Share Tech Mono', monospace">
      <use href="#nor-latch-internal" />
    </svg>`
      },
      {
        // Objective: write the truth table — NAND/active-LOW's Invalid
        // row, deliberately contrasted against the NOR latch's own
        // Invalid row (S=R=1) to drive home the active-HIGH/active-LOW
        // objective with a concrete, easily-confused example.
        circuitId: 'nand-sr-latch-iec',
        circuitLabel: 'NAND-Based SR Latch (Active-LOW)',
        text: () => 'For a NAND-based (active-LOW) latch, which raw input combination is the <b>Invalid</b>/undefined state (both outputs forced HIGH)?',
        hint: () => 'Invalid is always "both inputs asserted at once" — but asserted means something different here than it did for the NOR latch.',
        options: () => shuffle([
          { label: '<span style="text-decoration:overline">S</span> = 0, <span style="text-decoration:overline">R</span> = 0 (both asserted)', type: 'correct' },
          { label: '<span style="text-decoration:overline">S</span> = 1, <span style="text-decoration:overline">R</span> = 1 (both idle)', type: 'wrong' },
          { label: '<span style="text-decoration:overline">S</span> = 1, <span style="text-decoration:overline">R</span> = 0', type: 'wrong' },
          { label: '<span style="text-decoration:overline">S</span> = 0, <span style="text-decoration:overline">R</span> = 1', type: 'wrong' },
        ]),
        correctExplain: () => 'S̄ = 0, R̄ = 0 (both asserted)',
        working: () => `
    <div class="working-step">Active-LOW means asserted = 0:</div>
    <div class="working-line">Invalid is always "both inputs asserted simultaneously" — for this NAND latch that means <span style="text-decoration:overline">S</span> = 0 AND <span style="text-decoration:overline">R</span> = 0. Notice this is the exact OPPOSITE bit pattern from the NOR latch's own Invalid state (S = 1, R = 1) — the raw 1s-and-0s flip completely between the two versions, even though the underlying BEHAVIOUR (Set/Reset/Hold/Invalid) is identical. <span style="text-decoration:overline">S</span> = 1, <span style="text-decoration:overline">R</span> = 1 (both idle) is this latch's own <b>Hold</b> state, not Invalid — another pattern that's flipped from the NOR version.</div>`
      },
      {
        // Objective: write the truth table — NAND/active-LOW, the Set row,
        // as the active-LOW counterpart of Q3 (same behaviour, opposite
        // raw bits), with the gate-level working showing why.
        circuitId: 'nand-sr-latch-iec',
        circuitLabel: 'NAND-Based SR Latch (Active-LOW)',
        text: () => 'For a NAND-based (active-LOW) SR latch, what happens when <span style="text-decoration:overline">S</span> = 0 and <span style="text-decoration:overline">R</span> = 1?',
        hint: () => 'Remember that asserted means LOW for this latch — which input is being asserted here, and what does asserting it do to Q?',
        options: () => shuffle([
          { label: '<b>Set</b> — Q goes (or stays) HIGH', type: 'correct' },
          { label: '<b>Reset</b> — Q goes (or stays) LOW', type: 'wrong' },
          { label: '<b>Invalid</b> — both outputs forced HIGH, undefined', type: 'wrong' },
          { label: '<b>Hold</b> — Q stays exactly where it was', type: 'wrong' },
        ]),
        correctExplain: () => 'Set — Q goes (or stays) HIGH',
        working: () => `
    <div class="working-step"><span style="text-decoration:overline">S</span> = 0, <span style="text-decoration:overline">R</span> = 1:</div>
    <div class="working-line"><span style="text-decoration:overline">S</span> is asserted (it's LOW) and <span style="text-decoration:overline">R</span> is idle (HIGH). Asserting <span style="text-decoration:overline">S</span> is the definition of <b>Set</b> — the latch's Q output goes HIGH (or stays HIGH if it already was), regardless of what Q was doing beforehand. It's the same behaviour as the NOR latch's S = 1, R = 0 — only the raw bits are flipped.</div>
    <div class="working-step" style="margin-top:.6rem">Inside the latch — two cross-coupled NAND gates:</div>
    <svg viewBox="0 0 320 285" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:360px;display:block;margin:.3rem 0" font-family="'Share Tech Mono', monospace">
      <text x="2" y="12" font-size="12" style="fill: var(--colour-label)">① <tspan style="text-decoration:overline">S</tspan> = 0 forces the upper NAND high</text>
      <use href="#gate-nand-trad-lg" transform="translate(92,24) scale(1.8)" />
      <text x="86" y="43" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)"><tspan style="text-decoration:overline">S</tspan> = 0</text>
      <text x="86" y="72" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)"><tspan style="text-decoration:overline">Q</tspan> = ?</text>
      <text x="222" y="58" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)">Q = 1</text>
      <text x="2" y="107" font-size="12" style="fill: var(--colour-label)">② …which lets the lower NAND go low</text>
      <use href="#gate-nand-trad-lg" transform="translate(92,119) scale(1.8)" />
      <text x="86" y="138" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)">Q = 1</text>
      <text x="86" y="167" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)"><tspan style="text-decoration:overline">R</tspan> = 1</text>
      <text x="222" y="153" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)"><tspan style="text-decoration:overline">Q</tspan> = 0</text>
      <text x="2" y="202" font-size="12" style="fill: var(--colour-label)">③ …and <tspan style="text-decoration:overline">Q</tspan> = 0 feeds back to hold it</text>
      <use href="#gate-nand-trad-lg" transform="translate(92,214) scale(1.8)" />
      <text x="86" y="233" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-text)"><tspan style="text-decoration:overline">S</tspan> = 0</text>
      <text x="86" y="262" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)"><tspan style="text-decoration:overline">Q</tspan> = 0</text>
      <text x="222" y="248" font-size="15" font-weight="bold" style="fill: var(--colour-ui-correct)">Q = 1</text>
    </svg>
    <div class="working-line">A NAND gate's output is LOW only when <b>both</b> its inputs are HIGH, so a single LOW input forces the output HIGH whatever the other input is doing. <span style="text-decoration:overline">S</span> = 0 on the upper gate therefore forces Q HIGH straight away; that HIGH and <span style="text-decoration:overline">R</span> = 1 are both HIGH inputs to the lower gate, so <span style="text-decoration:overline">Q</span> falls to 0 — the latch has been <b>set</b>. That LOW then feeds back to the upper gate, so Q would stay HIGH even if <span style="text-decoration:overline">S</span> returned to 1.</div>
    <div class="working-line" style="margin-top:.4rem">Notice the difference from the NOR latch: there, S feeds the gate that makes <span style="text-decoration:overline">Q</span> and the effect reaches Q a gate later. Here <span style="text-decoration:overline">S</span> feeds the gate that makes Q directly — the asserted input acts on its own output first.</div>
    <div class="working-step" style="margin-top:.6rem">The same two gates, joined as the complete latch (the output of each feeds an input of the other):</div>
    <svg viewBox="-20 -2 185 128" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:360px;display:block;margin:.3rem 0" font-family="'Share Tech Mono', monospace">
      <use href="#nand-latch-internal" />
    </svg>`
      },
      {
        // Objective: give applications where the RS flip-flop is used as

        circuitId: 'nor-sr-latch-iec',
        circuitLabel: 'SR Latch',
        text: () => 'Which of these is a genuine real-world use of an SR latch specifically because it\'s a <b>latch</b> — something that holds a state once set, until deliberately changed?',
        hint: () => 'Think about what a mechanical switch actually does electrically in the instant it\'s pressed — it rarely makes a single clean contact.',

          { label: 'Amplifying a small AC signal to drive a loudspeaker', type: 'wrong' },
          { label: 'Dividing an incoming clock frequency by two', type: 'wrong' },

        correctExplain: () => 'Switch/pushbutton debouncing',
        working: () => `
    <div class="working-step">Why debouncing needs a latch:</div>
    <div class="working-line">A mechanical switch's contacts physically bounce for a few milliseconds before settling — without a latch, that reads as dozens of rapid ON/OFF pulses instead of one clean press. Wiring the switch to Set the latch on first contact means the latch's own Q output goes HIGH once and <b>stays</b> HIGH through all the bouncing that follows — exactly the "holds a state" behaviour a latch is for.</div>
    <div class="working-line" style="margin-top:.4rem">Amplification is an analog function, not sequential logic at all. Frequency division needs a device that actually toggles on every CLOCK edge (a T flip-flop/counter stage) — a different sequential building block, not what makes an SR latch specifically a <em>latch</em>. Gray code conversion is a fixed combinational mapping — no memory involved.</div>`
      },
      {
        // Objective: explain combinational vs sequential logic.
        circuitId: 'nor-sr-latch-trad',
        circuitLabel: 'SR Latch — Gate Level (note the feedback)',
        text: () => 'What is the key difference between <b>combinational</b> logic and <b>sequential</b> logic?',
        hint: () => 'Think back to the Hold state a couple of questions ago — what did the SR latch need to know that a plain AND/OR/NOT network never does?',
        options: () => shuffle([
          { label: 'Sequential logic\'s output depends on the current inputs AND the circuit\'s own previous state (it has memory) — combinational logic\'s output depends ONLY on the current inputs', type: 'correct' },
          { label: 'Combinational logic\'s output depends on its previous state — sequential logic\'s output depends only on the current inputs', type: 'wrong' },
          { label: 'Combinational logic can only ever have one output; sequential logic can have many', type: 'wrong' },
          { label: 'Sequential logic is built only from NAND and NOR gates; combinational logic can use any of the seven gate types', type: 'wrong' },
        ]),
        correctExplain: () => 'Sequential logic has memory; combinational logic doesn\'t',
        working: () => `
    <div class="working-step">The defining test:</div>
    <div class="working-line">Feed a combinational circuit (any AND/OR/NOT/XOR network) the same inputs twice, and you get the same output twice — every time, with no exceptions. Feed an SR latch S = 0, R = 0 twice and you can get <em>either</em> Q = 1 or Q = 0, depending entirely on what happened <em>before</em> — that dependence on history is exactly what "sequential" means. The SR latch's own Hold state IS that memory in action.</div>`
      },
      {
        // Objective: explain asynchronous vs synchronous inputs.
        circuitId: 'nor-sr-latch-iec',
        circuitLabel: 'SR Latch',
        text: () => '<b class="colour-dff">S</b> and <b class="colour-dff">R</b> on this latch are described as <b>asynchronous</b> inputs. What does that mean?',

        correctExplain: () => 'Asynchronous = takes effect immediately, no clock involved',
        working: () => `
    <div class="working-step">Asynchronous vs synchronous:</div>
    <div class="working-line">"Asynchronous" literally means "not synchronised to a clock" — an asynchronous input like this latch's own S/R changes Q the moment it's asserted, with no clock edge to wait for (there isn't even a clock input on this symbol at all). A <b>synchronous</b> input, by contrast — like the D input on the D-type flip-flop coming up next — is only SAMPLED at a clock edge; changing it between edges has no effect until the next one arrives.</div>
    <div class="working-line" style="margin-top:.4rem">Response speed isn't the distinguishing factor (an asynchronous input is if anything the FASTER of the two, precisely because it doesn't wait for a clock) — it's whether a clock gates the input at all.</div>`
      },
      {
        // Objective: (conceptual half of) using a logic probe to test a

        options: () => shuffle([

        correctExplain: () => 'Q is holding a previous Set command',
        working: () => `
    <div class="working-step">Interpreting a steady reading:</div>
    <div class="working-line">With S = R = 0 (Hold), neither input is telling Q to do anything — so a steady HIGH can only mean Q was Set to HIGH at some earlier point and has simply stayed there since. That's a direct, practical demonstration of the memory objective from earlier: the reading itself is proof the circuit is <b>sequential</b>, not evidence against it — a combinational circuit's output could ALSO sit steady, but only ever because its <em>current</em> inputs say so, not because of anything that happened in the past.</div>
    <div class="working-line" style="margin-top:.4rem">A steady reading is completely normal for a latch and doesn't indicate a fault by itself — you'd only suspect a real problem if toggling S or R failed to change Q the way the truth table predicts.</div>`
