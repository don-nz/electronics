<!--
  Week 12 — "Multivibrators" lesson objectives: explain the basic principle
  of a multivibrator (block-diagram level only), explain the difference
  between bistable, astable and monostable devices and give applications for
  each, give the common alternate name for a monostable, say which two
  components set a monostable's pulse width, draw/interpret a monostable
  timing diagram, explain retriggerable vs non-retriggerable, interpret
  manufacturers' data for common monostable ICs, and use a logic probe to
  test/measure monostable ICs.

  Same split every other digital_knowledge_*.html quiz on this site uses
  (see digital_knowledge_jk_flip_flop.html's own header comment): drawing a
  timing diagram from a given trigger waveform is left to the drag-and-build
  exercise ../exercises/multivibrators/digital_monostable_timing_diagram.html
  (a multi-choice quiz can't do that nearly as well), and using a logic probe
  on real hardware needs actual hardware — though Q21 below DOES cover the
  conceptual half of that objective (what a probe reading on Q confirms),
  and Q9-Q12 cover INTERPRETING a monostable timing diagram in words and
  numbers rather than drawing one.

  Same data-driven QUESTIONS[] engine as every other digital_knowledge_*.
  html quiz, trimmed to only the kinds this one actually uses: plain
  single-select, two 'multi' (Q4, Q13), one 'match' (Q3), plus leftPanel:'circuit'
  for the questions that read something off a diagram — Q2/Q5/Q6 (block
  diagrams: astable, positive-edge monostable, negative-edge monostable) and
  Q15/Q20 (a generic monostable IC wired up with its own timing resistor and
  capacitor). Every other question omits circuitId and gets no panel.

  The four symbols below (mv-astable-block, mv-mono-pos-block, mv-mono-neg-
  block, mv-mono-ic) are page-local, drawn for this quiz — there's no
  multivibrator section in ../../../assets/shapes yet, so if a second
  multivibrator page ever needs them, promote them there first (flip-flops.
  html is the closest sibling) and re-copy. The IC drawing is deliberately
  a GENERIC monostable (pins labelled TRIG, CLR, Rx/Cx, Cx, Q, Q-bar) rather
  than a specific part number's pinout, so it never asserts anything about a
  real IC's pins that a datasheet might contradict — the exact part's own
  pin names and timing equation are what the data-interpretation questions
  (Q15-Q20) are testing students to look up, not something to bake into the
  diagram. The resistor, capacitor and junction dot are copied from
  ../../../assets/shapes/circuit-components.html (resistor-box-shape, cap-
  shape, junction-dot-shape).

  CIRCUIT_SVG_ID = 'circuitRefSvg' and DEFAULT_CIRCUIT_VIEWBOX (the block
  diagrams' own -10 -10 290 200) are the only overrides — the IC wiring
  diagram is taller, so Q15/Q20 pass their own circuitViewBox.
-->

  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';
    DEFAULT_CIRCUIT_VIEWBOX = '-10 -10 290 200';

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see digital_knowledge_rs_flip_flop.html's header comment
    // for the fuller field reference this file's engine follows.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: basic principle of a multivibrator, block-diagram level.
        circuitId: 'generic-mv-out',
        circuitLabel: 'Multivibrator — Block Diagram',
        circuitViewBox: '-10 -10 600 170',
        text: () => 'At block-diagram level, what does the output of <b>any</b> multivibrator do?',
        hint: () => 'Think digital: a multivibrator is built to produce logic signals, not smoothly varying ones.',
        options: () => shuffle([
          { label: 'It switches between <b>two logic levels</b> — HIGH and LOW — spending its time at one or the other', type: 'correct' },
          { label: 'It follows its input voltage up and down, just scaled by a gain', type: 'wrong' },
          { label: 'It settles at one of <b>three</b> logic levels: HIGH, LOW or in between', type: 'wrong' },
          { label: 'It holds a steady DC level and only ever changes when the supply is switched off', type: 'wrong' },
        ]),
        correctExplain: () => 'Switches between two logic levels',
        working: () => `
    <div class="working-step">The one idea all three types share:</div>
    <div class="working-line">Bistable, astable and monostable multivibrators are all two-level devices — their output is either HIGH or LOW (apart from the instant it takes to change). What separates the three types is only <b>how long they are willing to sit at each level, and what makes them move</b>.</div>
    <div class="working-line" style="margin-top:.4rem">The odd name dates from 1919: an early valve version of this circuit produced a square wave, and a square wave is rich in harmonics — "multi-vibrator" is literally "many vibrations".</div>`
      },
      {
        // Objective: recognise an astable at block-diagram level.
        circuitId: 'mv-astable-block',
        circuitLabel: 'Multivibrator — Block Diagram',
        text: () => 'This block has <b>no input at all</b> — just a single output carrying a squarewave. Which type of multivibrator is it?',
        hint: () => 'Nothing outside the block is telling it when to switch. What kind of device does that?',
        options: () => shuffle([
          { label: '<b>Astable</b> — it free-runs, switching back and forth continuously with no trigger', type: 'correct' },
          { label: '<b>Monostable</b> — it waits for a trigger, then produces one pulse', type: 'wrong' },
          { label: '<b>Bistable</b> — it holds either level until it is told to change', type: 'wrong' },
          { label: 'It can\'t be identified — the diagram needs a trigger input to mean anything', type: 'wrong' },
        ]),
        correctExplain: () => 'Astable — free-running, no trigger needed',
        working: () => `
    <div class="working-step">Reading the block:</div>
    <div class="working-line">A trigger input exists so that something OUTSIDE the device can tell it when to act. An astable has no such need: it has <b>no stable state</b>, so it can never settle — it just keeps flipping between HIGH and LOW on its own, as long as it has power. That's why its block diagram has an output and nothing else.</div>
    <div class="working-line" style="margin-top:.4rem">In other words an astable is a self-starting <b>squarewave oscillator</b>.</div>`
      },
      {
        // Objective: difference between bistable/astable/monostable.
        leftPanel: 'none',
        kind: 'match',
        columns: () => ['Bistable', 'Astable', 'Monostable'],
        text: () => `<b style="color:var(--colour-ui-primary)">Match</b> each multivibrator type to the number of stable output states it has.`,
        hint: () => 'The prefix tells you: bi = two, mono = one, and "a" means "without".',
        options: () => shuffle([
          { label: 'Two stable states', poolHtml: 'Two stable states', col: 0 },
          { label: 'No stable states', poolHtml: 'No stable states', col: 1 },
          { label: 'One stable state', poolHtml: 'One stable state', col: 2 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 3 matched correctly' : `${st.opts.length - wrongCount} of ${st.opts.length} matched correctly`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Mismatched:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">A "stable state" is a level the output can sit at indefinitely:</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Bistable</b> — two. Either level will be held forever, until a trigger moves it to the other. (Every flip-flop and latch from weeks 9-11.)</div>

        text: () => 'A 74LS122 datasheet specifies an external timing resistor from <b>5 kΩ to 260 kΩ</b>. A technician fits a <b>330 kΩ</b> resistor. What\'s the problem?',
        hint: () => 'What does a datasheet\'s allowed range actually promise?',
        options: () => shuffle([
          { label: 'It\'s <b>outside the specified range</b>, so the pulse width is no longer guaranteed to follow the equation or to be stable', type: 'correct' },
          { label: 'Nothing — a bigger resistor just gives a longer pulse exactly as the formula says', type: 'wrong' },
          { label: 'The IC will be destroyed instantly by the extra resistance', type: 'wrong' },
          { label: 'The device switches from monostable to astable operation', type: 'wrong' },
        ]),
        correctExplain: () => 'Outside the datasheet range — behaviour no longer guaranteed',
        working: () => `
    <div class="working-step">What a datasheet range means:</div>
    <div class="working-line">The manufacturer only tests, and only guarantees, the timing equation <b>within the stated component range</b>. Outside it (here, above 260 kΩ) the pulse may be longer or shorter than calculated, drift with temperature, or simply be unreliable — typically because the tiny leakage currents inside the IC begin to compete with the very small charging current through such a large resistor.</div>
    <div class="working-line" style="margin-top:.4rem">It probably won't be damaged — it just stops being predictable, which is arguably worse because the fault is intermittent.</div>`
      },
      {
        // Objective: interpret the wired IC — clear tied to the supply.
        circuitId: 'mv-mono-ic',
        circuitLabel: 'Monostable IC — Timing Components',
        circuitViewBox: '0 0 320 340',
        text: () => 'On this monostable IC the <span style="text-decoration:overline">CLR</span> pin (small circle) is wired straight to <b>+5 V</b>. Why?',
        hint: () => 'The circle means this input is active-LOW. Where does an active-LOW input need to sit when you want it OFF?',
        options: () => shuffle([
          { label: 'It\'s <b>active-LOW</b>, so holding it HIGH keeps the clear function permanently <b>inactive</b> and the IC free to work normally', type: 'correct' },
          { label: 'It\'s active-HIGH, so +5 V keeps the monostable permanently cleared and ready', type: 'wrong' },
          { label: 'The pin is the IC\'s supply input and must be wired to +5 V', type: 'wrong' },
          { label: 'The pin sets the pulse width, and +5 V gives the longest pulse', type: 'wrong' },
        ]),
        correctExplain: () => 'Active-LOW input tied HIGH = clear permanently disabled',
        working: () => `
    <div class="working-step">Same rule as PRESET/CLEAR on the flip-flops:</div>
    <div class="working-line">The bubble marks <span style="text-decoration:overline">CLR</span> as <b>active-LOW</b> — it only clears the IC when pulled LOW. If you don't need a clear, you hold it firmly at its <b>idle level</b>, which for an active-LOW pin means <b style="color:var(--colour-ui-correct)">tied HIGH, here straight to +5 V</b>.</div>
    <div class="working-line" style="margin-top:.4rem">Leaving it floating is the same mistake as on a flip-flop: noise could pull it low and randomly cut a pulse short. The pulse width itself is set only by Rx and Cx.</div>`
      },
      {
        // Objective: (conceptual half of) using a logic probe to test a
        // monostable IC.
        leftPanel: 'none',
        text: () => 'A monostable\'s Q is probed with a logic probe. Q reads LOW. When the trigger button is pressed, the probe\'s HIGH lamp lights for about 2 s, then goes out and Q reads LOW again — every time the button is pressed. What does that confirm?',
        hint: () => 'Think about which state is stable and which is only temporary.',
        options: () => shuffle([
          { label: 'The device is working as a monostable: it rests LOW, each trigger sends Q HIGH for its set time (~2 s), then it returns LOW by itself', type: 'correct' },
          { label: 'The device is faulty — Q should stay HIGH once triggered', type: 'wrong' },
          { label: 'The device is an astable that happens to be triggered by the button', type: 'wrong' },
          { label: 'The probe is faulty — a one-shot should produce only a brief flicker, never a visible 2 s HIGH', type: 'wrong' },
        ]),
        correctExplain: () => 'Correct monostable behaviour — one timed pulse per trigger',
        working: () => `
    <div class="working-step">Interpreting the probe reading:</div>
    <div class="working-line">LOW at rest, one HIGH of fixed length per trigger, then back to LOW with no further trigger is the complete signature of a monostable working properly. A <b>~2 s</b> pulse is long enough to read straight off the probe's lamp.</div>
    <div class="working-line" style="margin-top:.4rem">If the pulse is only microseconds or milliseconds long, you can't see a lamp come on and go off — that's why most logic probes include a <b>pulse indicator</b> that stretches short pulses so they're visible. You'd suspect a fault if Q never rose, never fell back by itself, or the length was wildly different from what R × C predicts.</div>`
      },
    ];

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
