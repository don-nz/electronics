<!--
  Week 10 — "The D-Type Flip Flop" lesson objectives: explain level-
  sensitive vs edge-sensitive trigger inputs, explain positive- vs
  negative-edge-triggered clock inputs, recognise the D-type's schematic
  symbol, predict its output for a given set of inputs, explain the
  floating-PRESET/CLEAR problem and how to prevent it, give applications
  for the D-type flip-flop, interpret manufacturers' data for common D-type
  ICs, and use a logic probe to test/measure sequential logic. Deliberately
  stops short of two of the lesson's own objectives, matching the split
  digital_knowledge_rs_flip_flop.html already established for its own
  lesson: drawing/interpreting a timing diagram from a given set of P/C/CLK/
  D levels (already covered, far better than a multi-choice quiz ever
  could, by the existing ../exercises/flip-flops/digital_dtype_preset_
  clear_diagram.html drag-and-build exercise — this quiz exists purely to
  round out the CONCEPTUAL objectives around it) and using a logic probe to
  physically test a real circuit (needs actual hardware) — though Q9 below
  DOES cover the conceptual half of that objective (what a steady probe
  reading between clock edges actually tells you about an edge-triggered
  device), just not the physical probe-handling skill itself.

  Same data-driven QUESTIONS[] engine as every other digital_knowledge_*.
  html quiz, trimmed to only the kinds this one actually uses: plain
  single-select (no 'kind' field) throughout, plus leftPanel:'circuit' for
  Q3/Q4's own schematic-recognition pair (a circuitId swap between the
  positive-edge and negative-edge D-type IEC body) — no 'multi'/'truth'/
  'match'/'bits' kinds needed here, same reasoning digital_knowledge_rs_
  flip_flop.html's own header comment gives for its own kind selection.

  The two D-type IEC body symbols (Q3/Q4's own circuitId targets) are
  copied inline from ../../../../assets/shapes/flip-flops.html (def ids
  dff-pos-edge-iec/dff-neg-edge-iec — the PLAIN body, no PRESET/CLEAR,
  since objective 3 only asks to recognise the D-type symbol itself, not
  a specific PRESET/CLEAR variant of it) — edit that master file first if
  the symbols ever need to change, then re-copy here (cross-file <use>
  doesn't work under file://, same reasoning as every other page that
  reuses a shape from that master).

  CIRCUIT_SVG_ID = 'circuitRefSvg' (only override needed) — no

  symbols share the same -10 -10 290 200 box already), no
  SUMMARY_CIRCUIT_REF (summary just hides the panel, same as the shared
  default).
-->

        <line x1="-135" y1="-45" x2="-75" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="-60" y="-34" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">D</text>
        <line x1="-135" y1="45" x2="-75" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <path d="M -75 30 L -55 45 L -75 60" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="-48" y="52" font-size="20" font-weight="bold" style="fill: var(--colour-dff)">CLK</text>
        <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>
        <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
       </g>

      <!-- ══════════════════ D-TYPE BODY, IEC (negative edge) ══════════════════ -->
      <g id="dff-neg-edge-iec">
       <g transform="translate(135,90)">
        <rect x="-75" y="-90" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
        <line x1="-135" y1="-45" x2="-75" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="-60" y="-34" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">D</text>
        <line x1="-135" y1="45" x2="-93" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <circle cx="-84" cy="45" r="8" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
        <path d="M -75 30 L -55 45 L -75 60" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="-48" y="52" font-size="20" font-weight="bold" style="fill: var(--colour-dff)">CLK</text>
        <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>
        <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
       </g>

  <div class="crumb" id="crumb" data-current="D-Type Flip-Flops"></div>
  <header>

    <p>Conceptual Questions · D-Type Flip-Flops · Edge-Triggering, PRESET/CLEAR &amp; Applications</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <!-- LEFT: static reference circuit (leftPanel:'circuit', Q3/Q4 only —
         every other question omits circuitId and gets no panel at all). -->
    <div class="circuit-col">
      <div class="circuit-panel" style="cursor:default" id="circuitPanelDiv">

          <use id="circuitRefUse" href="#dff-pos-edge-iec" />

    <!-- RIGHT: question -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->

          <div class="q-header">
            <div class="q-num" id="qNum"></div>

          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">

            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see digital_knowledge_rs_flip_flop.html's header comment
    // for the fuller field reference this file's engine follows.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: explain level-sensitive vs edge-sensitive trigger inputs.
        text: () => 'What is the difference between a <b>level-sensitive</b> and an <b>edge-sensitive</b> trigger input on a sequential logic device?',
        hint: () => 'Think about WHEN the input is actually "looked at" — for the whole duration of a level, or only at one specific instant?',
        options: () => shuffle([
          { label: 'A level-sensitive input responds for as long as it sits at the active level; an edge-sensitive input only responds at the exact instant the signal transitions', type: 'correct' },
          { label: 'A level-sensitive input only responds at the exact instant the signal transitions; an edge-sensitive input responds for as long as it sits at the active level', type: 'wrong' },
          { label: 'Level-sensitive inputs are used on latches only, edge-sensitive inputs are used on combinational gates only', type: 'wrong' },
          { label: 'There is no real difference — both terms describe the same behaviour', type: 'wrong' },
        ]),
        correctExplain: () => 'Level-sensitive responds for the whole active level; edge-sensitive responds only at the transition instant',
        working: () => `
    <div class="working-step">The key distinction:</div>
    <div class="working-line">A <b>level-sensitive</b> (transparent) input — like a basic SR latch's S/R, or a gated D-latch's own D input while EN is active — keeps affecting the output for the ENTIRE time it sits at its active level. An <b>edge-sensitive</b> input — like a D-type flip-flop's CLK — is only sampled at one precise moment: the instant the signal transitions from LOW-to-HIGH or HIGH-to-LOW. Everything the input does in between two edges is ignored.</div>`
      },
      {
        // Objective: explain positive- vs negative-edge-triggered clock inputs.
        text: () => 'What is the difference between a <b>positive edge-triggered</b> and a <b>negative edge-triggered</b> clock input?',
        hint: () => 'Both are edge-sensitive — the question is WHICH transition direction counts as the active edge.',
        options: () => shuffle([
          { label: 'Positive edge-triggered samples the data input on the LOW-to-HIGH (rising) transition of CLK; negative edge-triggered samples it on the HIGH-to-LOW (falling) transition', type: 'correct' },
          { label: 'Positive edge-triggered only works with active-HIGH data inputs; negative edge-triggered only works with active-LOW data inputs', type: 'wrong' },
          { label: 'Positive edge-triggered devices are faster than negative edge-triggered devices', type: 'wrong' },
          { label: 'Positive edge-triggered samples data continuously while CLK is HIGH; negative edge-triggered samples continuously while CLK is LOW', type: 'wrong' },
        ]),
        correctExplain: () => 'Positive = triggers on the rising edge; negative = triggers on the falling edge',
        working: () => `
    <div class="working-step">Reading the schematic symbol:</div>
    <div class="working-line">Both are still edge-sensitive (see the previous question) — this is purely about WHICH edge. A positive (rising) edge-triggered flip-flop updates its output the instant CLK goes from 0 to 1; a negative (falling) edge-triggered one updates the instant CLK goes from 1 to 0. On the IEC block symbol, the small inversion bubble on the CLK lead is exactly what distinguishes the two — no bubble means positive-edge, a bubble means negative-edge (the next two questions cover reading that symbol directly).</div>`
      },
      {
        // Objective: recognise the schematic symbol — positive edge (no bubble).
        circuitId: 'dff-pos-edge-iec',
        circuitLabel: 'D Flip-Flop — No CLK Bubble',
        text: () => 'The CLK lead on this D-type flip-flop symbol has a clock triangle but <b>no inversion bubble</b>. What does that tell you?',
        hint: () => 'No bubble on a clock input is the same "no bubble = active-HIGH-ish" convention used everywhere else on a schematic symbol — just applied to an edge direction instead of a level.',
        options: () => shuffle([
          { label: 'It\'s <b>positive (rising) edge-triggered</b> — Q updates the instant CLK goes from 0 to 1', type: 'correct' },
          { label: 'It\'s <b>negative (falling) edge-triggered</b> — Q updates the instant CLK goes from 1 to 0', type: 'wrong' },
          { label: 'It\'s level-sensitive — Q follows D for the whole time CLK is HIGH', type: 'wrong' },
          { label: 'The clock input is disabled/not connected', type: 'wrong' },
        ]),
        correctExplain: () => 'Positive (rising) edge-triggered',
        working: () => `
    <div class="working-step">Reading the symbol:</div>
    <div class="working-line">The small triangle (">") on the CLK lead marks it as edge-sensitive (as opposed to a plain line, which would mean level-sensitive). With no inversion bubble in front of that triangle, the active edge is the rising one — CLK going from 0 to 1. Add a bubble in front of the triangle (next question) and the active edge flips to falling instead.</div>`
      },
      {
        // Objective: recognise the schematic symbol — negative edge (bubble).
        circuitId: 'dff-neg-edge-iec',
        circuitLabel: 'D Flip-Flop — CLK Bubble',
        text: () => 'This time there\'s a small circle (inversion bubble) on the CLK lead, right before the clock triangle. What does that tell you?',
        hint: () => 'Same bubble convention as an active-LOW input anywhere else on a schematic — just applied to the edge direction here instead of a level.',
        options: () => shuffle([
          { label: 'It\'s <b>negative (falling) edge-triggered</b> — Q updates the instant CLK goes from 1 to 0', type: 'correct' },
          { label: 'It\'s <b>positive (rising) edge-triggered</b> — Q updates the instant CLK goes from 0 to 1', type: 'wrong' },
          { label: 'It means the D input is active-LOW instead of active-HIGH', type: 'wrong' },
          { label: 'It means this flip-flop has no PRESET/CLEAR inputs', type: 'wrong' },
        ]),
        correctExplain: () => 'Negative (falling) edge-triggered',
        working: () => `
    <div class="working-step">Reading the symbol:</div>
    <div class="working-line">The bubble in front of the clock triangle inverts which transition counts as "active" — instead of triggering on the rising edge like the previous symbol, this one triggers on the falling edge (CLK going from 1 to 0). The bubble says nothing at all about the D input's own polarity, or whether PRESET/CLEAR exist — it only ever describes the CLK lead it's sitting on.</div>`
      },
      {
        // Objective: predict a D-type flip-flop's output for a given set of inputs.
        text: () => 'A positive edge-triggered D flip-flop has D = 1. While CLK is LOW, D briefly drops to 0 and then goes back to 1 — all before CLK ever rises. When CLK finally rises, what is Q?',
        hint: () => 'Only one moment in time actually matters here — which one?',
        options: () => shuffle([
          { label: 'Q = 1 (D\'s value AT the rising edge is 1 — everything D did beforehand is irrelevant)', type: 'correct' },
          { label: 'Q = 0 (D dipped to 0 at some point, so the flip-flop "remembers" that dip)', type: 'wrong' },
          { label: 'Q becomes unstable/undefined, since D changed twice before the edge', type: 'wrong' },
          { label: 'Q won\'t update at all until D stops changing entirely', type: 'wrong' },
        ]),
        correctExplain: () => 'Q = 1 — only D\'s value at the active edge matters',
        working: () => `
    <div class="working-step">Edge-triggered means exactly this:</div>
    <div class="working-line">An edge-triggered flip-flop only samples D at the single instant of the active clock edge — every other change to D, no matter how many times it happens, is completely ignored as long as it happens BETWEEN edges. Since D = 1 at the moment CLK rises, Q takes that value: Q = 1. The brief dip to 0 has no effect on the output at all.</div>`
      },
      {
        // Objective: explain the floating PRESET/CLEAR problem and prevention.
        text: () => 'A D-type flip-flop\'s active-LOW <span style="text-decoration:overline">PRE</span> and <span style="text-decoration:overline">CLR</span> pins are left completely unconnected (floating) in a real circuit. What problem can this cause?',
        hint: () => 'An unconnected CMOS/TTL input doesn\'t just "read as idle" by default — what does it actually do?',
        options: () => shuffle([
          { label: 'A floating input can pick up noise and drift to whatever level it likes, so the pin may randomly read as asserted (LOW) and unexpectedly force Q — an unreliable, unrepeatable fault', type: 'correct' },
          { label: 'Nothing — unused inputs are always safe to leave disconnected on any digital IC', type: 'wrong' },
          { label: 'The IC will simply ignore both pins permanently and behave as if they don\'t exist', type: 'wrong' },
          { label: 'The flip-flop will refuse to respond to its D or CLK inputs until PRE/CLR are connected', type: 'wrong' },
        ]),
        correctExplain: () => 'A floating input can pick up noise and randomly assert',
        working: () => `
    <div class="working-step">Why floating is dangerous:</div>
    <div class="working-line">An unconnected digital input isn't reliably HIGH or LOW — it's high-impedance, so it's free to pick up stray noise, capacitive coupling from nearby signals, or just drift on its own. For an active-LOW pin like <span style="text-decoration:overline">PRE</span>/<span style="text-decoration:overline">CLR</span>, that means it can randomly sit at (or briefly dip to) a LOW level and unexpectedly force Q — an intermittent fault that's genuinely hard to diagnose because it isn't consistent.</div>
    <div class="working-line" style="margin-top:.4rem">The fix: never leave an unused PRESET/CLEAR floating — tie it firmly to its own IDLE level instead (HIGH, for an active-LOW pin, typically via a pull-up resistor or a direct tie to V<sub>CC</sub>) so it can never drift into its asserted state by accident.</div>`
      },
      {
        // Objective: give applications for the D-type flip-flop.
        text: () => 'Tying <span style="text-decoration:overline">Q</span> straight back into the D input of a D-type flip-flop, then feeding it a clock, produces what well-known application?',
        hint: () => 'On every active edge, Q takes whatever value D had — and D is now whatever Q\'s OPPOSITE was a moment ago.',
        options: () => shuffle([
          { label: 'A divide-by-2 frequency divider — Q toggles on every active clock edge, so its output frequency is exactly half the clock\'s', type: 'correct' },
          { label: 'A combinational AND gate — Q becomes the logical AND of D and CLK', type: 'wrong' },
          { label: 'An amplifier — Q becomes a higher-voltage copy of D', type: 'wrong' },
          { label: 'A BCD-to-7-segment decoder', type: 'wrong' },
        ]),
        correctExplain: () => 'Divide-by-2 frequency divider (toggle configuration)',
        working: () => `
    <div class="working-step">Tracing it through:</div>
    <div class="working-line">Feed <span style="text-decoration:overline">Q</span> back into D: whatever Q is NOW becomes D's value, which the flip-flop then loads into Q on the NEXT active edge — meaning Q flips to its own opposite every single edge. Two edges to complete one full HIGH-then-LOW cycle on Q means Q's frequency is exactly half of CLK's own — a genuine, very standard D-type application (this "toggle" wiring is also exactly how a T flip-flop is built from a D-type). Other common D-type applications include data storage/registers and synchronising an asynchronous input to a clock domain.</div>`
      },
      {
        // Objective: interpret manufacturers' data for common D-type ICs.
        text: () => 'A manufacturer\'s datasheet for a D-type flip-flop IC lists a pin as "<span style="text-decoration:overline">CLR</span>" and states: "<span style="text-decoration:overline">CLR</span> = L: Q = L (asynchronous)". How should you interpret this pin from that datasheet entry alone?',
        hint: () => 'Two separate things are being told to you here: the bar over the name, and the word "asynchronous".',
        options: () => shuffle([
          { label: 'It\'s an active-LOW CLEAR that forces Q LOW immediately, independent of the clock, whenever the pin is pulled LOW', type: 'correct' },
          { label: 'It\'s an active-HIGH CLEAR that forces Q LOW only on the next clock edge', type: 'wrong' },
          { label: 'It\'s an active-LOW PRESET that forces Q HIGH immediately whenever the pin is pulled LOW', type: 'wrong' },
          { label: 'The bar means this pin is internally disconnected and can be ignored', type: 'wrong' },
        ]),
        correctExplain: () => 'Active-LOW CLEAR, asynchronous (overrides the clock)',
        working: () => `
    <div class="working-step">Reading the datasheet entry:</div>
    <div class="working-line">The overline on the pin name is the datasheet's own way of marking it active-LOW — asserted by a LOW level, same convention as the schematic symbol's own bubble. "CLEAR" (not PRESET) means asserting it forces Q LOW, not HIGH. "Asynchronous" is the datasheet explicitly confirming this pin bypasses the clock entirely — Q changes the instant <span style="text-decoration:overline">CLR</span> goes LOW, with no need to wait for any CLK edge. Being able to pull exactly this out of a plain datasheet line — polarity, function, and sync/async — is the actual skill this objective is testing.</div>`
      },
      {
        // Objective: (conceptual half of) using a logic probe to test a
        // sequential circuit — what a steady vs changing reading actually
        // tells you, without the hands-on probe-handling skill itself.
        text: () => 'You probe the Q output of a positive edge-triggered D flip-flop while CLK sits LOW. D is toggling rapidly the whole time, but the probe on Q shows one steady, unchanging level throughout. What does this confirm?',
        hint: () => 'CLK never rose during this observation — what does an edge-triggered device do in that case, no matter what D is up to?',
        options: () => shuffle([
          { label: 'The flip-flop really is edge-triggered — Q only updates AT a rising CLK edge, so it correctly ignores everything D does while CLK stays LOW', type: 'correct' },
          { label: 'The flip-flop is faulty — Q should track D continuously regardless of CLK', type: 'wrong' },
          { label: 'The D input must be internally disconnected, since it\'s having no visible effect at all', type: 'wrong' },
          { label: 'The probe itself is faulty — a steady reading always indicates a broken connection', type: 'wrong' },
        ]),
        correctExplain: () => 'Confirms edge-triggered behaviour — Q ignores D between edges',
        working: () => `
    <div class="working-step">Interpreting a steady reading:</div>
    <div class="working-line">This is exactly the predicted behaviour from earlier in this quiz, now framed as something you'd actually observe on a bench: with no rising edge occurring, an edge-triggered D flip-flop has no reason to update Q at all, no matter how much D changes in the meantime. A steady Q here isn't a fault — it's the practical, probe-visible signature of "edge-triggered" as opposed to "level-sensitive" (a level-sensitive/transparent device would instead show Q tracking D's rapid changes directly).</div>
    <div class="working-line" style="margin-top:.4rem">You'd only suspect a real fault if toggling CLK through an actual rising edge failed to make Q pick up D's then-current value.</div>`
      },
    ];

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
