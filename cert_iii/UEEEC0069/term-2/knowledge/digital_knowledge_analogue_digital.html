<!--
  Section 8 — "Analog to digital and digital to analog converters" lesson
  objectives: explain the need for ADCs and DACs; define and explain the
  principle of analog-to-digital and digital-to-analog conversion; list
  typical applications; draw the schematic symbols; list and explain the
  performance characteristics of ADCs (range, resolution, conversion time,
  sampling rate) and DACs (resolution, settling time, linearity); list the
  ADC structures and their comparative advantages and disadvantages;
  interpret manufacturers' data for common 8-bit ADCs and DACs; explain
  quantisation error and quantisation noise and its audible effect; and use
  an oscilloscope to test and measure DACs and ADCs.

  Same split every other digital_knowledge_*.html quiz on this site uses:
  CONSTRUCTING the ADC's output bits from a sampled analogue input is left
  to the drag-and-build exercise
  ../exercises/analogue-digital/digital_adc_output_builder.html;
  INTERPRETING performance figures, symbols and structures is covered here,
  and the conceptual half of the oscilloscope objective is Q26.

  Same data-driven QUESTIONS[] engine as every other digital_knowledge_*.html
  quiz: plain single-select, one 'multi' (Q25) and one 'match' (Q12), plus
  leftPanel:'circuit' for the questions that read something off a diagram:
  Q20 (a 4-bit DAC symbol), Q21 (a 6-bit ADC symbol) and Q23 (a DAC's
  staircase output against its ideal straight line).

  Resolution follows the course's own convention — percentage resolution =
  1 / (2^n - 1) x 100, and step size = range / (2^n - 1). Some datasheets
  divide by 2^n instead; the working notes say so wherever the two differ.
  The three symbols below (adc-symbol, dac-symbol, dac-ramp) are page-local,
  drawn for this quiz.

  Question values (voltages, rates, bit counts) are original to this quiz —
  the course notes are only the reference for WHAT to cover.
-->

  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';
    DEFAULT_CIRCUIT_VIEWBOX = '-5 -45 300 225';

    const QUESTIONS = [
      {
        // Objective: the need for ADCs and DACs.
        leftPanel: 'none',
        text: () => 'A digital recorder captures sound from a <b>microphone</b> and plays it back through a <b>loudspeaker</b>. Where do the converters go?',
        hint: () => 'The microphone and speaker deal in voltages that vary smoothly; the recorder deals in binary numbers.',
        options: () => shuffle([
          { label: 'An <b>ADC</b> between the microphone and the digital system; a <b>DAC</b> between the digital system and the speaker', type: 'correct' },
          { label: 'A <b>DAC</b> after the microphone and an <b>ADC</b> before the speaker', type: 'wrong' },
          { label: 'An <b>ADC</b> at both ends, because the signal is always converted on the way through', type: 'wrong' },
          { label: 'No converters are needed — a digital system can store the microphone voltage directly', type: 'wrong' },
        ]),
        correctExplain: () => 'ADC at the microphone, DAC at the speaker',
        working: () => `
    <div class="working-step">The real world is analogue; digital systems are not:</div>
    <div class="working-line">A microphone gives a <b>continuously varying voltage</b>. A digital system can only store and process <b>numbers</b>. The <b>ADC</b> (analogue-to-digital converter) turns the voltage into numbers on the way in.</div>
    <div class="working-line" style="margin-top:.4rem">A loudspeaker also needs a smoothly varying voltage, so the <b>DAC</b> (digital-to-analogue converter) turns the numbers back into a voltage on the way out.</div>
    <div class="working-total">Every phone, sound card and digital multimeter is built around this pair. The converters are the bridge between the analogue world and the digital one.</div>`
      },
      {
        // Objective: principle of A/D conversion — code from a voltage.
        leftPanel: 'none',
        text: () => 'An 8-bit ADC has a range of <b>0 to 5.1 V</b>, so each step is <b>20 mV</b>. A sampled input of <b>2.0 V</b> is converted. What binary number does it output?',
        hint: () => 'The output is the number of steps that fit into the input voltage.',
        options: () => shuffle([
          { label: `code = V<sub>in</sub> ÷ step = 2.0 V ÷ 0.020 V = 100 → <b>01100100</b>`, type: 'correct' },
          { label: `code = V<sub>in</sub> × step = 2.0 × 0.020 = 0.04 → <b>00000000</b>`, type: 'wrong' },
          { label: `code = range ÷ V<sub>in</sub> = 5.1 ÷ 2.0 = 2.55 → <b>00000010</b>`, type: 'wrong' },
          { label: `code = 100 read with the bits reversed → <b>00100110</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '2.0 V ÷ 20 mV = 100 = 01100100',
        working: () => `
    <div class="working-step">Step 1 — how many 20 mV steps are in 2.0 V?</div>
    <div class="working-line">2.0 ÷ 0.020 = <b style="color:var(--colour-ui-correct)">100</b></div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — write 100 in 8-bit binary:</div>
    <div class="working-line">100 = 64 + 32 + 4 → 0 1 1 0 0 1 0 0 = <b style="color:var(--colour-ui-correct)">01100100</b></div>
    <div class="working-total">The ADC's output is a binary number proportional to the size of the analogue input — exactly the definition of A/D conversion. <b>00100110</b> is 38: the bits are right but the MSB-first order is wrong.</div>`
      },
      {
        // Objective: ADC resolution (percentage, course formula).
        leftPanel: 'none',
        text: () => 'What is the <b>resolution</b>, as a percentage of full range, of a <b>14-bit</b> ADC?',
        hint: () => 'Resolution = 1 ÷ (number of steps) × 100, where an n-bit converter has 2<sup>n</sup> − 1 steps across its range.',
        options: () => shuffle([
          { label: `1 ÷ (2<sup>14</sup> − 1) × 100 = 1 ÷ 16383 × 100 ≈ <b>0.0061%</b>`, type: 'correct' },
          { label: `1 ÷ 14 × 100 ≈ <b>7.14%</b>`, type: 'wrong' },
          { label: `1 ÷ (14 − 1) × 100 ≈ <b>7.69%</b>`, type: 'wrong' },
          { label: `1 ÷ (2 × 14) × 100 ≈ <b>3.57%</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '1 ÷ 16383 × 100 ≈ 0.0061%',
        working: () => `
    <div class="working-step">Step 1 — steps across the range:</div>
    <div class="working-line">2<sup>14</sup> − 1 = 16384 − 1 = <b>16383</b></div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — each step as a percentage:</div>
    <div class="working-line">1 ÷ 16383 × 100 ≈ <b style="color:var(--colour-ui-correct)">0.0061%</b></div>
    <div class="working-total"><b>7.14%</b> and <b>7.69%</b> divide by the number of <i>bits</i> instead of the number of <i>steps</i>. A better (higher) resolution means a <b>smaller</b> percentage: the ADC can tell apart much smaller portions of the same input. (Some datasheets divide by 2<sup>n</sup> instead; for 14 bits the answer is still 0.0061%.)</div>`
      },
      {
        // Objective: step size.
        leftPanel: 'none',
        text: () => 'An 8-bit ADC has a range of <b>0 to 5.1 V</b>. By how much must the input voltage change to alter the output code by <b>one step</b>?',
        hint: () => 'Divide the range by the number of steps across it.',
        options: () => shuffle([
          { label: `step = range ÷ (2<sup>n</sup> − 1) = 5.1 V ÷ 255 = <b>20 mV</b>`, type: 'correct' },
          { label: `step = range ÷ bits = 5.1 V ÷ 8 ≈ <b>638 mV</b>`, type: 'wrong' },
          { label: `step = range ÷ (2 × bits) = 5.1 V ÷ 16 ≈ <b>319 mV</b>`, type: 'wrong' },
          { label: `step = range × (2<sup>n</sup> − 1) = 5.1 × 255 ≈ <b>1300 V</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '5.1 V ÷ 255 = 20 mV per step',
        working: () => `
    <div class="working-step">Step 1 — steps across the range:</div>
    <div class="working-line">2<sup>8</sup> − 1 = 255</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — voltage per step:</div>
    <div class="working-line">5.1 V ÷ 255 = <b style="color:var(--colour-ui-correct)">0.020 V = 20 mV</b></div>
    <div class="working-total">That's the ADC's resolution in volts: input changes smaller than about 20 mV may not change the output at all. A 12-bit ADC on the same range would have a step of 5.1 ÷ 4095 ≈ 1.25 mV — about 16 times finer.</div>`
      },
      {
        // Objective: ADC range — using the range well.
        leftPanel: 'none',
        text: () => 'A sensor outputs <b>0 to 2.5 V</b>. It is connected to an 8-bit ADC whose range is <b>0 to 5 V</b>. Roughly how many different output codes will the sensor signal actually use?',
        hint: () => 'The signal only covers part of the ADC\'s range.',
        options: () => shuffle([
          { label: `2.5 V ÷ 5 V × 256 ≈ <b>128 codes</b> — only half the range, so one bit of resolution is wasted`, type: 'correct' },
          { label: `<b>256 codes</b> — an 8-bit ADC always uses every code`, type: 'wrong' },
          { label: `2.5 V ÷ 5 V × 8 = <b>4 codes</b>`, type: 'wrong' },
          { label: `2.5 V × 255 ≈ <b>638 codes</b> — each volt gives 255 codes`, type: 'wrong' },
        ]),
        correctExplain: () => 'About 128 codes — half the range, one bit lost',
        working: () => `
    <div class="working-step">Fraction of the range used:</div>
    <div class="working-line">2.5 ÷ 5 = ½ → about half of the 256 codes = <b style="color:var(--colour-ui-correct)">128</b></div>
    <div class="working-total">A signal that uses only half the range loses a bit of resolution (128 = 2<sup>7</sup>, so it acts like a 7-bit converter). That's why the ADC's <b>range</b> figure matters: match it to your signal, or amplify the signal to fill it. <b>638</b> would need more than eight bits.</div>`
      },
      {
        // Objective: why sample-and-hold — change during conversion.
        leftPanel: 'none',
        text: () => 'A <b>1 kHz</b> sinewave of <b>5 V peak</b> is fed straight into an ADC with a <b>100 µs</b> conversion time and no sample-and-hold. The worst-case rate of change of a sinewave is 2π f V<sub>p</sub>. By about how much can the input move <b>during one conversion</b>?',
        hint: () => 'Multiply the steepest slope (volts per second) by the conversion time.',
        options: () => shuffle([
          { label: `ΔV = 2π × f × V<sub>p</sub> × t = 2π × 1000 × 5 × 100 µs ≈ <b>3.1 V</b>`, type: 'correct' },
          { label: `ΔV = f × V<sub>p</sub> × t = 1000 × 5 × 100 µs = <b>0.5 V</b>`, type: 'wrong' },
          { label: `ΔV = 2π × f × t = 2π × 1000 × 100 µs ≈ <b>0.63 V</b>`, type: 'wrong' },
          { label: `ΔV = 2 × V<sub>p</sub> = <b>10 V</b> (the full swing)`, type: 'wrong' },
        ]),
        correctExplain: () => 'About 3.1 V of change during one conversion',
        working: () => `
    <div class="working-step">Step 1 — steepest slope:</div>
    <div class="working-line">2π × 1000 × 5 ≈ 31,400 V/s</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — change in 100 µs:</div>
    <div class="working-line">31,400 × 0.0001 ≈ <b style="color:var(--colour-ui-correct)">3.1 V</b></div>
    <div class="working-total">3.1 V of movement would ruin an 8-bit conversion that resolves 20 mV. That's why an ADC must <b>sample</b> the input — freeze it with a sample-and-hold circuit — before converting, so the voltage can't change and upset the conversion.</div>`
      },
      {
        // Objective: conversion time and sampling rate.
        leftPanel: 'none',
        text: () => 'An ADC takes <b>25 µs</b> to sample the input and convert it to a digital number, and it can only start a new conversion when the last has finished. What is its <b>maximum sampling rate</b>?',
        hint: () => 'Sampling rate = conversions per second.',
        options: () => shuffle([
          { label: `rate = 1 ÷ conversion time = 1 ÷ 25 µs = <b>40 kSa/s</b>`, type: 'correct' },
          { label: `rate = the number itself = <b>25 kSa/s</b>`, type: 'wrong' },
          { label: `rate = 2 ÷ conversion time = 2 ÷ 25 µs = <b>80 kSa/s</b>`, type: 'wrong' },
          { label: `rate = 1 ÷ (2 × conversion time) = 1 ÷ 50 µs = <b>20 kSa/s</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '1 ÷ 25 µs = 40 kSa/s',
        working: () => `
    <div class="working-step">One conversion every 25 µs:</div>
    <div class="working-line">1 ÷ 0.000025 s = <b style="color:var(--colour-ui-correct)">40,000 samples per second</b> = 40 kSa/s</div>
    <div class="working-total">A shorter conversion time allows a higher sampling rate — the two specifications are linked. In practice the sampling rate is a bit lower, because the ADC also needs time to acquire each new sample.</div>`
      },
      {
        // Objective: minimum sampling rate for a single sinewave.
        leftPanel: 'none',
        text: () => 'An ADC is used to digitise a pure <b>20 kHz</b> sinewave. What is the <b>minimum</b> sampling rate it must use to be able to reconstruct it?',
        hint: () => 'The sampling rate must be at least twice the signal frequency (the Nyquist criterion).',
        options: () => shuffle([
          { label: `fs ≥ 2 × f = 2 × 20 kHz = <b>40 kSa/s</b>`, type: 'correct' },
          { label: `fs ≥ f = <b>20 kSa/s</b>`, type: 'wrong' },
          { label: `fs ≥ f ÷ 2 = <b>10 kSa/s</b>`, type: 'wrong' },
          { label: `fs ≥ 4 × f = <b>80 kSa/s</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '2 × 20 kHz = 40 kSa/s',
        working: () => `
    <div class="working-step">The sampling rule:</div>
    <div class="working-line">fs ≥ 2 × f<sub>max</sub> = 2 × 20,000 = <b style="color:var(--colour-ui-correct)">40,000 Sa/s</b></div>
    <div class="working-total">Fewer than two samples per cycle and the ADC can't tell what the wave was doing between samples. This minimum is the <b>Nyquist–Shannon</b> sampling theorem (named for Harry Nyquist and Claude Shannon). Real systems go somewhat above it — CD audio samples at 44.1 kSa/s for sound up to 20 kHz.</div>`
      },
      {
        // Objective: minimum sampling rate for a complex signal.
        leftPanel: 'none',

        text: () => 'To test a <b>4-bit DAC</b>, a counter steps its inputs through 0000 to 1111 and an oscilloscope watches the output. You expect a rising staircase of 16 equal steps. Instead you see <b>two identical, half-height staircases</b> of 8 steps each per counter cycle. What is the likeliest fault?',
        hint: () => 'Half the height means the largest-weighted input is contributing nothing.',
        options: () => shuffle([
          { label: 'The <b>MSB input is stuck LOW</b> (or disconnected) — the other three bits give two 0-to-7 ramps', type: 'correct' },
          { label: 'The <b>LSB input is stuck LOW</b> — the output would then have only 8 distinct levels, but over the full height', type: 'wrong' },
          { label: 'The <b>MSB input is stuck HIGH</b> — the output would be a single ramp starting at half height', type: 'wrong' },
          { label: 'The <b>reference voltage is too low</b> — all 16 steps would still be there, just smaller', type: 'wrong' },
        ]),
        correctExplain: () => 'MSB stuck LOW (or disconnected)',
        working: () => `
    <div class="working-step">Work out each possible fault:</div>
    <div class="working-line">MSB stuck LOW: the counter's 0-7 and 8-15 both look like 0-7 → <b style="color:var(--colour-ui-correct)">two half-height ramps</b> ✔</div>
    <div class="working-line">MSB stuck HIGH: every code looks like 8-15 → one ramp starting at half height.</div>
    <div class="working-line">LSB stuck LOW: codes pair up (0,1 → same level) → 8 levels over the full height.</div>
    <div class="working-line">Reference too low: still 16 steps, just smaller.</div>
    <div class="working-total">The scope picture is a fingerprint: the <b>height</b> and <b>count</b> of the steps tell you which bit is at fault. For an ADC the same idea applies in reverse: feed it a slow ramp and watch which output bit stops changing.</div>`
      },
    ];

    resetQuiz();
    initQuizFromURL();
