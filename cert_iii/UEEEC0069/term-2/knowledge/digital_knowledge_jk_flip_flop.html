<!--
  Week 11 — "The J-K Flip Flop" lesson objectives: recognise the J-K's
  schematic symbol, predict its output for a given set of inputs, explain
  the floating-PRESET/CLEAR problem and how to prevent it, give
  applications for the J-K flip-flop, interpret manufacturers' data for
  common J-K ICs, and use a logic probe to test/measure sequential logic.
  This lesson doesn't repeat week 10's own level-sensitive/edge-sensitive
  and positive/negative-edge-triggered objectives (already covered there,
  and a J-K's edge behaviour is read off the CLK lead exactly the same way
  a D-type's is — see digital_knowledge_dtype_flip_flop.html's own Q1-Q4 if
  that ever needs revisiting), so this quiz is correspondingly shorter and
  doesn't re-ask them.

  Deliberately stops short of two of the lesson's own objectives, the same
  split every flip-flop knowledge quiz on this site uses (see digital_
  knowledge_rs_flip_flop.html / digital_knowledge_dtype_flip_flop.html's
  own header comments): drawing/interpreting a timing diagram from a given
  set of P/C/CLK/J/K levels (already covered, far better than a multi-
  choice quiz ever could, by the existing ../exercises/flip-flops/digital_
  jk_preset_clear_diagram.html drag-and-build exercise) and using a logic
  probe to physically test a real circuit (needs actual hardware) — though
  Q8 below DOES cover the conceptual half of that objective (what a
  probe reading on Q actually confirms about toggle-mode operation), just
  not the physical probe-handling skill itself.

  Same data-driven QUESTIONS[] engine as every other digital_knowledge_*.
  html quiz, trimmed to only the kinds this one actually uses: plain
  single-select (no 'kind' field) throughout, plus leftPanel:'circuit' for
  Q1/Q2's own schematic-recognition pair (a circuitId swap between the
  positive-edge and negative-edge J-K IEC body) — same reasoning the two
  sibling quizzes' own header comments give for their own kind selection.

  The two J-K IEC body symbols (Q1/Q2's own circuitId targets) are copied
  inline from ../../../../assets/shapes/flip-flops.html (def ids jk-pos-edge-
  iec/jk-neg-edge-iec — the PLAIN body, no PRESET/CLEAR, since objective 1
  only asks to recognise the J-K symbol itself, not a specific PRESET/CLEAR
  variant of it — same reasoning digital_knowledge_dtype_flip_flop.html's
  own header comment gives for its own choice of plain-body ids) — edit
  that master file first if the symbols ever need to change, then re-copy
  here (cross-file <use> doesn't work under file://).

  CIRCUIT_SVG_ID = 'circuitRefSvg' (only override needed) — no
  DEFAULT_CIRCUIT_VIEWBOX (viewBox never changes between Q1/Q2, both
  symbols share the same -10 -10 290 200 box already, same box the D-type
  quiz's own plain bodies use since both are the same 270×180 footprint),
  no SUMMARY_CIRCUIT_REF (summary just hides the panel, same as the shared
  default).
-->

<body>

       <g transform="translate(135,90)">
        <rect x="-75" y="-90" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
        <line x1="-135" y1="-60" x2="-75" y2="-60" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="-60" y="-49" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">J</text>
        <line x1="-135" y1="0" x2="-93" y2="0" style="stroke: var(--colour-dff)" stroke-width="2" />
        <circle cx="-84" cy="0" r="8" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
        <path d="M -75 -15 L -55 0 L -75 15" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="-48" y="7" font-size="20" font-weight="bold" style="fill: var(--colour-dff)">CLK</text>
        <line x1="-135" y1="60" x2="-75" y2="60" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="-60" y="71" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">K</text>
        <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>
        <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
       </g>
      </g>
    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="J-K Flip-Flops"></div>
  <header>
    <h1>Digital Electronics</h1>
    <p>Conceptual Questions · J-K Flip-Flops · Toggle Mode, PRESET/CLEAR &amp; Applications</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <!-- LEFT: static reference circuit (leftPanel:'circuit', Q1/Q2 only —
         every other question omits circuitId and gets no panel at all). -->
    <div class="circuit-col">
      <div class="circuit-panel" style="cursor:default" id="circuitPanelDiv">
        <div class="panel-label" id="circuitRefLabel">Reference Circuit</div>
        <svg id="circuitRefSvg" viewBox="-10 -10 290 200" xmlns="http://www.w3.org/2000/svg" style="max-width:320px;margin:0 auto">
          <use id="circuitRefUse" href="#jk-pos-edge-iec" />
        </svg>
      </div>
    </div>

    <!-- RIGHT: question -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->
        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>

          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>

          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>

          </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see digital_knowledge_rs_flip_flop.html's header comment
    // for the fuller field reference this file's engine follows.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: recognise the schematic symbol — positive edge (no bubble).
        circuitId: 'jk-pos-edge-iec',
        circuitLabel: 'J-K Flip-Flop — No CLK Bubble',
        text: () => 'This J-K flip-flop symbol has a clock triangle on CLK but <b>no inversion bubble</b>. Reading J at top, CLK in the middle and K at bottom, what does the missing bubble tell you?',
        hint: () => 'Same "no bubble" convention as the D-type\'s own CLK lead — it\'s purely about which edge direction is active.',
        options: () => shuffle([
          { label: 'It\'s <b>positive (rising) edge-triggered</b> — J and K are sampled the instant CLK goes from 0 to 1', type: 'correct' },
          { label: 'It\'s <b>negative (falling) edge-triggered</b> — J and K are sampled the instant CLK goes from 1 to 0', type: 'wrong' },
          { label: 'It means J and K are both active-LOW inputs', type: 'wrong' },
          { label: 'It means this device has no PRESET/CLEAR inputs at all', type: 'wrong' },
        ]),
        correctExplain: () => 'Positive (rising) edge-triggered',
        working: () => `
    <div class="working-step">Reading the symbol:</div>
    <div class="working-line">A J-K flip-flop is edge-triggered exactly the same way a D-type is — the clock triangle marks CLK as edge-sensitive, and with no inversion bubble in front of it, the active edge is the rising one. J and K are only ever "looked at" for the single instant CLK goes from 0 to 1; nothing they do between edges has any effect on Q. The bubble says nothing about J/K's own polarity or about PRESET/CLEAR — it only ever describes the CLK lead.</div>`
      },
      {
        // Objective: recognise the schematic symbol — negative edge (bubble).
        circuitId: 'jk-neg-edge-iec',
        circuitLabel: 'J-K Flip-Flop — CLK Bubble',
        text: () => 'This time there\'s a small circle (inversion bubble) on the CLK lead, right before the clock triangle. What does that tell you?',
        hint: () => 'Same bubble convention as an active-LOW input anywhere else — just applied to the edge direction here instead of a level.',
        options: () => shuffle([
          { label: 'It\'s <b>negative (falling) edge-triggered</b> — J and K are sampled the instant CLK goes from 1 to 0', type: 'correct' },
          { label: 'It\'s <b>positive (rising) edge-triggered</b> — J and K are sampled the instant CLK goes from 0 to 1', type: 'wrong' },
          { label: 'It means J is now active-LOW instead of active-HIGH', type: 'wrong' },
          { label: 'It means Toggle mode (J=K=1) is disabled on this device', type: 'wrong' },
        ]),
        correctExplain: () => 'Negative (falling) edge-triggered',
        working: () => `
    <div class="working-step">Reading the symbol:</div>
    <div class="working-line">The bubble in front of the clock triangle inverts which transition counts as active — this device samples J and K on the falling edge (CLK going from 1 to 0) instead of the rising edge. It has no bearing on J or K's own polarity, and every J-K truth table row — Hold, Set, Reset, and Toggle — still works exactly the same way; only WHEN it's evaluated changes.</div>`
      },
      {
        // Objective: predict a JK-type flip-flop's output — Hold/Set/Reset.
        text: () => 'A positive edge-triggered J-K flip-flop currently has Q = 0. At the moment CLK rises, J = 1 and K = 0. What is Q immediately after this edge?',
        hint: () => 'Only one input is asserted here — which J-K rule applies?',
        options: () => shuffle([
          { label: 'Q = 1 (<b>Set</b> — J=1, K=0)', type: 'correct' },
          { label: 'Q = 0 (<b>Reset</b> — J=1, K=0)', type: 'wrong' },
          { label: 'Q stays at 0 (<b>Hold</b> — J=1, K=0)', type: 'wrong' },
          { label: 'Q toggles to 1 because exactly one of J/K is asserted (<b>Toggle</b>)', type: 'wrong' },
        ]),
        correctExplain: () => 'Q = 1 — Set (J=1, K=0)',
        working: () => `
    <div class="working-step">J-K truth table, sampled at the active edge:</div>
    <div class="working-line">J=1, K=0 is the <b>Set</b> condition — Q goes to 1 on the active edge, regardless of whatever Q was doing beforehand. Toggle is a completely separate row of the table (J=1 AND K=1 together) — having only one of the two asserted is never enough to trigger it.</div>`
      },
      {
        // Objective: predict a JK-type flip-flop's output — Toggle, the
        // one genuinely new rule vs a D-type (see this file's own header
        // comment for why this quiz doesn't repeat week 10's edge-
        // triggering questions but DOES give Toggle its own question).
        text: () => 'A positive edge-triggered J-K flip-flop currently has Q = 1. At the moment CLK rises, J = 1 and K = 1. What is Q immediately after this edge?',
        hint: () => 'J=1 AND K=1 together is the one J-K input combination that has no equivalent on a D-type flip-flop at all.',
        options: () => shuffle([
          { label: 'Q = 0 (<b>Toggle</b> — J=K=1 flips Q to its own complement)', type: 'correct' },
          { label: 'Q = 1 (<b>Hold</b> — Q is unchanged)', type: 'wrong' },
          { label: 'Q becomes undefined/invalid, the same as S=R=1 on an SR latch', type: 'wrong' },
          { label: 'Q = 1 (<b>Set</b> — Q is forced HIGH)', type: 'wrong' },
        ]),
        correctExplain: () => 'Q = 0 — Toggle flips Q to its complement',
        working: () => `
    <div class="working-step">Why J=K=1 is special:</div>
    <div class="working-line">Unlike an SR latch, where S=R=1 together is an undefined race condition that's deliberately avoided, a J-K flip-flop is specifically DESIGNED so that J=K=1 is a valid, well-defined <b>Toggle</b>: Q flips to whatever it currently ISN'T. Since Q was 1 before this edge, Toggle drives it to 0. This is the one input combination with no D-type equivalent — it's what makes a J-K a genuinely different (and more capable) device, not just a D-type with extra pins.</div>`
      },
      {
        // Objective: explain the floating PRESET/CLEAR problem and prevention.
        text: () => 'A J-K flip-flop\'s active-LOW <span style="text-decoration:overline">PRE</span> and <span style="text-decoration:overline">CLR</span> pins are left completely unconnected (floating) in a real circuit. What problem can this cause?',
        hint: () => 'An unconnected CMOS/TTL input doesn\'t just "read as idle" by default — what does it actually do?',
        options: () => shuffle([
          { label: 'A floating input can pick up noise and drift to whatever level it likes, so the pin may randomly read as asserted (LOW) and unexpectedly force Q — an unreliable, unrepeatable fault', type: 'correct' },
          { label: 'Nothing — unused inputs are always safe to leave disconnected on any digital IC', type: 'wrong' },
          { label: 'The IC will simply ignore both pins permanently and behave as if they don\'t exist', type: 'wrong' },
          { label: 'The flip-flop will refuse to respond to J, K or CLK until PRE/CLR are connected', type: 'wrong' },
        ]),
        correctExplain: () => 'A floating input can pick up noise and randomly assert',
        working: () => `
    <div class="working-step">Why floating is dangerous:</div>
    <div class="working-line">An unconnected digital input is high-impedance, not reliably HIGH or LOW — it's free to pick up stray noise or capacitive coupling from nearby signals. For an active-LOW pin like <span style="text-decoration:overline">PRE</span>/<span style="text-decoration:overline">CLR</span>, that means it can randomly sit at (or briefly dip to) a LOW level and unexpectedly force Q — an intermittent fault that's genuinely hard to diagnose because it isn't consistent. This is exactly the same hazard (and the same fix) as on a D-type flip-flop.</div>
    <div class="working-line" style="margin-top:.4rem">The fix: never leave an unused PRESET/CLEAR floating — tie it firmly to its own IDLE level instead (HIGH, for an active-LOW pin, typically via a pull-up resistor or a direct tie to V<sub>CC</sub>) so it can never drift into its asserted state by accident.</div>`
      },
      {
        // Objective: give applications for the J-K flip-flop.
        text: () => 'Tying J and K both permanently HIGH (J = K = 1) and feeding the flip-flop a clock produces what well-known application?',
        hint: () => 'With J=K=1 locked in, every single active edge does the same one thing to Q.',
        options: () => shuffle([
          { label: 'A divide-by-2 frequency divider — Q toggles on every active clock edge, the basic building block of a binary ripple counter', type: 'correct' },
          { label: 'A combinational AND gate — Q becomes the logical AND of J and K', type: 'wrong' },
          { label: 'A switch debouncer — Q holds steady through contact bounce', type: 'wrong' },
          { label: 'A BCD-to-7-segment decoder', type: 'wrong' },
        ]),
        correctExplain: () => 'Divide-by-2 frequency divider / ripple-counter building block',
        working: () => `
    <div class="working-step">Why locking J=K=1 does this:</div>
    <div class="working-line">With J and K both permanently asserted, every single active clock edge lands on the Toggle row of the truth table — Q flips to its own complement each time, with no other input left to change that. Two edges make one full HIGH-then-LOW cycle on Q, so Q's frequency is exactly half of CLK's: a genuine divide-by-2 stage. Chaining several of these, each one's Q feeding the next stage's CLK, is exactly how a binary ripple counter is built — this "locked-toggle" wiring is by far the most common real-world use of a J-K flip-flop, alongside general data-storage/register applications shared with D-type devices.</div>
    <div class="working-line" style="margin-top:.4rem">Debouncing is an SR latch application, not a J-K one — it relies on Hold behaviour with S/R never both asserted, not on Toggle.</div>`
      },
      {
        // Objective: interpret manufacturers' data for common J-K ICs.
        text: () => 'A manufacturer\'s datasheet for a J-K flip-flop IC lists a pin as "<span style="text-decoration:overline">PRE</span>" and states: "<span style="text-decoration:overline">PRE</span> = L: Q = H (asynchronous)". How should you interpret this pin from that datasheet entry alone?',
        hint: () => 'Two separate things are being told to you here: the bar over the name, and the word "asynchronous".',
        options: () => shuffle([
          { label: 'It\'s an active-LOW PRESET that forces Q HIGH immediately, independent of the clock, whenever the pin is pulled LOW', type: 'correct' },
          { label: 'It\'s an active-HIGH PRESET that forces Q HIGH only on the next clock edge', type: 'wrong' },
          { label: 'It\'s an active-LOW CLEAR that forces Q LOW immediately whenever the pin is pulled LOW', type: 'wrong' },
          { label: 'The bar means this pin is internally disconnected and can be ignored', type: 'wrong' },
        ]),
        correctExplain: () => 'Active-LOW PRESET, asynchronous (overrides the clock)',
        working: () => `
    <div class="working-step">Reading the datasheet entry:</div>
    <div class="working-line">The overline on the pin name marks it active-LOW — asserted by a LOW level, same convention as the schematic symbol's own bubble. "PRESET" (not CLEAR) means asserting it forces Q HIGH, not LOW. "Asynchronous" is the datasheet explicitly confirming this pin bypasses the clock entirely and J/K entirely — Q changes the instant <span style="text-decoration:overline">PRE</span> goes LOW, with no need to wait for a CLK edge or care what J/K are doing. Pulling exactly this out of a plain datasheet line — polarity, function, and sync/async — is the actual skill this objective is testing.</div>`
      },
      {
        // Objective: (conceptual half of) using a logic probe to test a
        // sequential circuit — what a probe reading actually confirms
        // about toggle-mode operation, without the hands-on probe-
        // handling skill itself.
        text: () => 'You wire a J-K flip-flop with J = K = 1 permanently and feed it a clean 1 kHz clock. Probing Q shows it toggling steadily at 500 Hz. What does this confirm?',
        hint: () => 'Two active edges happen for every one full cycle you see on Q — what does that ratio tell you?',
        options: () => shuffle([
          { label: 'The flip-flop is correctly Toggling on every active clock edge — exactly the divide-by-2 behaviour J=K=1 is supposed to produce', type: 'correct' },
          { label: 'The flip-flop is faulty — Q should match CLK\'s own 1 kHz frequency exactly', type: 'wrong' },
          { label: 'J and K must actually be at 0, not 1, since Q is changing more slowly than CLK', type: 'wrong' },
          { label: 'The probe itself is faulty — a frequency mismatch always indicates a broken connection', type: 'wrong' },
        ]),
        correctExplain: () => 'Confirms correct divide-by-2 Toggle operation',
        working: () => `
    <div class="working-step">Interpreting the probe reading:</div>
    <div class="working-line">This is exactly the predicted behaviour from the applications question earlier, now framed as something you'd actually observe on a bench: with J=K=1 locked in, Q flips on every active edge, so it takes TWO clock edges (one full CLK cycle) to produce ONE full cycle on Q. Seeing Q at exactly half of CLK's frequency — 500 Hz from a 1 kHz clock — is the correct, expected signature of Toggle mode working properly, not a fault.</div>
    <div class="working-line" style="margin-top:.4rem">You'd only suspect a real fault if Q's frequency DIDN'T land at half of CLK's, or if Q stopped changing altogether.</div>`
      },
    ];

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
