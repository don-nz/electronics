  between serial and parallel data transfer and state the advantages and
  disadvantages of each; explain the basic principle of the four shift
  registers (serial-in/serial-out, serial-in/parallel-out, parallel-in/
  serial-out, parallel-in/parallel-out) at block-diagram level; list
  applications for each; give the alternate name for a parallel-in,
  parallel-out register (a data latch); interpret manufacturers' data for
  common shift-register ICs (here the 74LS164 and 74LS194A); and use a
  logic probe to test sequential logic ICs.

  Same split every other digital_knowledge_*.html quiz on this site uses:
  BUILDING a register's output waveform from a clock and a data input is
  left to the drag-and-build exercise
  ../exercises/shift-registers/digital_shift_register_timing_diagram.html;
  INTERPRETING a shift register's timing diagram in words and numbers is
  covered here (Q14/Q15), and the conceptual half of the logic-probe
  objective is Q21.

  Same data-driven QUESTIONS[] engine as every other digital_knowledge_*.html
  quiz: plain single-select, one 'multi' (Q19) and one 'match' (Q12), plus
  leftPanel:'circuit' for the questions that read something off a diagram:
  Q4 (a 12-bit serial-in/serial-out block), Q5 (a 4-bit serial-in/parallel-out
  block, negative-edge clocked), Q7/Q8 (a 4-bit parallel-in/parallel-out
  block) and Q14/Q15 (a 3-stage register's timing diagram).

  The four symbols below (sr-siso-block, sr-sipo-neg-block, sr-pipo-block,

  <script>

    const QUESTIONS = [
      {
        // Objective: serial vs parallel transfer — time taken (serial).
        leftPanel: 'none',
        text: () => 'A byte (8 bits) is sent <b>serially</b> down a single wire at <b>2 Mbit/s</b>. How long does the whole byte take?',
        hint: () => 'In serial transfer the bits go one at a time, so each one needs its own slot.',
        options: () => shuffle([
          { label: `t = bits ÷ rate = 8 ÷ 2 Mbit/s = <b>4 µs</b>`, type: 'correct' },
          { label: `t = 1 ÷ rate = 1 ÷ 2 Mbit/s = <b>0.5 µs</b>`, type: 'wrong' },
          { label: `t = bits × rate = 8 × 2 = <b>16 µs</b>`, type: 'wrong' },
          { label: `t = bits ÷ rate = 8 ÷ 2 = <b>4 ms</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '8 ÷ 2 Mbit/s = 4 µs',
        working: () => `
    <div class="working-step">Step 1 — each bit takes one slot:</div>
    <div class="working-line">slot = 1 ÷ 2,000,000 = 0.5 µs</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — eight slots one after another:</div>
    <div class="working-line">8 × 0.5 µs = <b style="color:var(--colour-ui-correct)">4 µs</b></div>
    <div class="working-total"><b>0.5 µs</b> is only one bit. <b>16</b> multiplies when it should divide. <b>4 ms</b> forgets that Mbit/s is millions of bits per second.</div>
    <div class="working-line" style="margin-top:.4rem">Sent in <b>parallel</b> on eight wires, all eight bits would arrive together in one slot (0.5 µs) — eight times faster for the same clock rate, at the price of eight wires plus common.</div>`
      },
      {
        // Objective: advantages/disadvantages — serial wins on wiring.
        leftPanel: 'none',
        text: () => 'A temperature sensor 30 m from the controller must send a 12-bit reading. Cable is expensive and the reading is only needed once a second. Which transfer method suits, and why?',
        hint: () => 'Speed isn\'t the constraint here. What does each method cost in wires?',
        options: () => shuffle([
          { label: '<b>Serial</b> — one data wire (plus common) instead of twelve, and one second is plenty of time to send the bits one by one', type: 'correct' },
          { label: '<b>Parallel</b> — all twelve bits arrive together, and extra conductors cost almost nothing over 30 m', type: 'wrong' },
          { label: '<b>Parallel</b> — it needs only one clock wire, so it uses less cable than serial', type: 'wrong' },
          { label: '<b>Serial</b> — it is always faster than parallel, so it is the best choice for any distance', type: 'wrong' },
        ]),
        correctExplain: () => 'Serial — far fewer wires, speed isn\'t critical',
        working: () => `
    <div class="working-step">The trade-off:</div>
    <div class="working-line"><b>Parallel</b> sends every bit of the word at once, so it is <b>faster</b> — but it needs one wire per bit (plus common).</div>
    <div class="working-line"><b>Serial</b> sends the bits one after another down <b>one wire</b> — slower, but cheap to cable over a distance.</div>
    <div class="working-total">With a once-a-second reading and a long cable, wiring cost matters far more than speed. That's why long links (and the cables on your own desk) are serial, while the short buses inside a computer are parallel.</div>`
      },
      {
        // Objective: how shift registers are built.
        leftPanel: 'none',
        text: () => 'Inside a shift register, how are the flip-flops joined so that data moves along when the clock ticks?',
        hint: () => 'Every stage must pass on what it was holding just before the clock edge.',
        options: () => shuffle([
          { label: 'A chain of <b>D-type flip-flops</b> sharing one clock, with the <b>Q of each one wired to the D of the next</b>', type: 'correct' },
          { label: 'A chain of <b>SR latches</b> with every S input wired to the same data line', type: 'wrong' },
          { label: 'A chain of <b>J-K flip-flops</b> with J = K = 1 so each one toggles', type: 'wrong' },
          { label: 'A single flip-flop whose output is read faster and faster', type: 'wrong' },
        ]),
        correctExplain: () => 'D-type flip-flops, each Q feeding the next D, shared clock',
        working: () => `
    <div class="working-step">Why D-types work so well:</div>
    <div class="working-line">A D-type copies its D input to Q on the active clock edge and then holds it. Wire the Q of one into the D of the next, give them all the same clock, and at each edge <b>every stage takes what its neighbour was holding a moment earlier</b> — the pattern moves one place along.</div>
    <div class="working-line" style="margin-top:.4rem">Toggling flip-flops (J = K = 1) would flip regardless of the data, which is how counters work, not shift registers.</div>`
      },
      {
        // Objective: SISO block — delay = stages ÷ clock.
        circuitId: 'sr-siso-block',
        circuitLabel: 'Shift Register — Block Diagram',
        text: () => 'This 12-bit serial-in, serial-out register is clocked at <b>3 kHz</b>. A bit enters at Data in. How long before it reaches Data out?',
        hint: () => 'The bit moves one stage per clock pulse. How many stages does it cross, and how long is one clock period?',
        options: () => shuffle([
          { label: `t = stages ÷ f = 12 ÷ 3 kHz = <b>4 ms</b>`, type: 'correct' },
          { label: `t = (stages − 1) ÷ f = 11 ÷ 3 kHz ≈ <b>3.67 ms</b>`, type: 'wrong' },
          { label: `t = 1 ÷ f = 1 ÷ 3 kHz ≈ <b>0.33 ms</b>`, type: 'wrong' },
          { label: `t = stages × f = 12 × 3 kHz = <b>36 kHz</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '12 ÷ 3 kHz = 4 ms',
