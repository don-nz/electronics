<!--
  Section 7 — "Multiplexers and demultiplexers" lesson objectives: define
  time-division multiplexing; explain the basic operation of a multiplexer
  and a demultiplexer (block-diagram level only); interpret the truth table
  of multiplexers and demultiplexers; give typical applications for both;
  interpret manufacturers' data for common multiplexer and demultiplexer ICs
  (here the 74LS153 dual 4-input mux, the 74LS151 8-input mux and the
  74LS154 4-to-16 decoder/demultiplexer — all three datasheets are in
  resources/datasheets); and use a logic probe to test them.

  Same split every other digital_knowledge_*.html quiz on this site uses:
  CONSTRUCTING a multiplexer's output waveform from its select and data
  inputs is left to the drag-and-build exercise
  ../exercises/multiplexers/digital_multiplexer_timing_diagram.html;
  INTERPRETING truth tables and IC data is covered here, and the conceptual
  half of the logic-probe objective is Q21.

  Same data-driven QUESTIONS[] engine as every other digital_knowledge_*.html
  quiz: plain single-select, one 'multi' (Q20) and one 'match' (Q8), plus
  leftPanel:'circuit' for the questions that read something off a diagram:
  Q3 (a time-division multiplexing slot diagram), Q4 (a 4-input mux block),
  Q7 (a 1-to-4 demux block), Q9/Q10 (the long mux truth table with × entries)
  and Q11 (the compact truth table).

  The five symbols below (mux4-block, demux4-block, tdm-diagram, mux-table-
  long, mux-table-compact) are page-local, drawn for this quiz. The truth
  tables are SVG so they can sit in the left panel; the long one is
  generated, not typed, so its rows can't disagree with the compact one.

  Question values (bit rates, scan rates, data patterns) are original to this
  quiz — the course notes are only the reference for WHAT to cover.
-->

        // Objective: define time-division multiplexing.
        leftPanel: 'none',
        text: () => 'Four sensors share <b>one cable</b> back to the control room. Each sensor is connected to the cable alone for a short slot, in turn, over and over. What is this technique called, and what defines it?',
        hint: () => 'The sharing is done by dividing up <i>time</i>, not by adding more wires.',
        options: () => shuffle([
          { label: '<b>Time-division multiplexing</b> — the sensors take turns having the cable to themselves for short periods', type: 'correct' },
          { label: '<b>Time-division multiplexing</b> — all four sensors send at once and the control room separates them by voltage level', type: 'wrong' },
          { label: '<b>Demultiplexing</b> — one sensor\'s data is copied to all four wires', type: 'wrong' },
          { label: '<b>Parallel transfer</b> — each sensor has its own bit position in a word', type: 'wrong' },
        ]),
        correctExplain: () => 'Time-division multiplexing — taking turns on the shared cable',
        working: () => `
    <div class="working-step">The idea:</div>
    <div class="working-line">Rather than run four cables, the four devices <b>share one</b> by each using it <i>alone</i> for a brief slot, then handing it on. At the far end a demultiplexer, running in step, sends each slot back to the right destination.</div>
    <div class="working-total">It works because digital data is so much faster than it needs to be — the slots are short enough that nobody notices the gaps. This is how a single fibre can carry thousands of phone calls.</div>`
      },
      {
        // Objective: TDM — bandwidth shared between devices.
        leftPanel: 'none',
        text: () => 'A shared link carries <b>10 Mbit/s</b> in total. It is divided <b>equally</b> by time-division multiplexing among <b>5</b> devices. What data rate does each device get?',
        hint: () => 'Each device gets the link for an equal fraction of the time.',
        options: () => shuffle([
          { label: `rate = total ÷ devices = 10 Mbit/s ÷ 5 = <b>2 Mbit/s</b>`, type: 'correct' },
          { label: `rate = total × devices = 10 × 5 = <b>50 Mbit/s</b>`, type: 'wrong' },
          { label: `rate = devices ÷ total = 5 ÷ 10 = <b>0.5 Mbit/s</b>`, type: 'wrong' },
          { label: `rate = total = <b>10 Mbit/s</b> — each device gets the full link`, type: 'wrong' },
        ]),
        correctExplain: () => '10 Mbit/s ÷ 5 = 2 Mbit/s each',
        working: () => `
    <div class="working-step">Step 1 — each device has the link 1 slot in 5:</div>
    <div class="working-line">fraction of time = 1 ÷ 5</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — share of the capacity:</div>
    <div class="working-line">10 Mbit/s ÷ 5 = <b style="color:var(--colour-ui-correct)">2 Mbit/s</b></div>
    <div class="working-total"><b>10 Mbit/s</b> is the rate <i>while a device holds the link</i>, but it holds it only a fifth of the time. In real systems some of each frame is also used for synchronisation, so the useful rate is slightly less.</div>`
      },
      {
        // Objective: TDM — reading the slot diagram.
        circuitId: 'tdm-diagram',
        circuitLabel: 'Time-Division Multiplexing',
        circuitViewBox: '0 0 394 106',
        text: () => 'Three devices A, B and C share a cable in repeating slots, numbered 1 to 9 in the diagram. Whose data is carried in <b>slot 7</b>, and how many slots pass before A transmits again?',
        hint: () => 'The pattern repeats every three slots.',
        options: () => shuffle([
          { label: '<b>A</b> in slot 7, then A again after <b>3</b> slots (slot 10)', type: 'correct' },
          { label: '<b>B</b> in slot 7, then B again after 3 slots', type: 'wrong' },
          { label: '<b>A</b> in slot 7, then A again after <b>7</b> slots', type: 'wrong' },
          { label: '<b>C</b> in slot 7, since 7 is odd', type: 'wrong' },
        ]),
        correctExplain: () => 'Slot 7 is A\'s; A repeats every 3 slots',
        working: () => `
    <div class="working-step">Follow the repeating pattern A B C:</div>
    <div class="working-line">slots 1-3: A B C &nbsp; 4-6: A B C &nbsp; 7-9: <b style="color:var(--colour-ui-correct)">A</b> B C</div>
    <div class="working-total">Slot 7 is the first of the third group, so it's A's. The frame length is 3 slots, so each device gets one slot in every three — a third of the capacity, which links back to the previous question.</div>`
      },
      {
        // Objective: basic operation of a multiplexer (reading the select code).
        circuitId: 'mux4-block',
        circuitLabel: '4-Input Multiplexer — Block Diagram',
        text: () => 'The data inputs read <b>I₀ = 1, I₁ = 1, I₂ = 0, I₃ = 1</b>, and the select inputs are <b>S₁ = 1, S₀ = 0</b>. What does the output Z show?',
        hint: () => 'Read the select inputs as a binary number with S₁ as the most significant bit, then pick the input with that number.',
        options: () => shuffle([
          { label: '<b>Z = 0</b> — S₁S₀ = 10 = 2, so I₂ is selected', type: 'correct' },
          { label: '<b>Z = 1</b> — reading the select bits backwards (S₀S₁ = 01) picks I₁', type: 'wrong' },
          { label: '<b>Z = 1</b> — the select code is ignored and I₀ is passed', type: 'wrong' },
          { label: '<b>Z = 1</b> — the inputs are ORed together: 1 + 1 + 0 + 1', type: 'wrong' },
        ]),
        correctExplain: () => 'Z = 0 — select 10 = 2 chooses I₂',
        working: () => `
    <div class="working-step">Step 1 — the select number:</div>
    <div class="working-line">S₁S₀ = 1 0 = 2 in binary (S₁ is the MSB)</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — copy that input to Z:</div>
    <div class="working-line">I₂ = 0 → <b style="color:var(--colour-ui-correct)">Z = 0</b></div>
    <div class="working-total">Reading S₀ first would pick I₁ = 1 — a very common slip. A multiplexer takes data from <b>just one</b> input, chosen by the select number, and copies it to the single output; the other three are ignored whatever they are doing.</div>`
      },
      {
        // Objective: size of a multiplexer — select lines.
        leftPanel: 'none',
        text: () => 'A multiplexer must choose between <b>16</b> data inputs. How many <b>select</b> inputs does it need?',
        hint: () => 'The select lines carry a binary number that must be able to number every input.',
        options: () => shuffle([
          { label: `selects = log<sub>2</sub>(inputs) = log<sub>2</sub> 16 = <b>4</b>`, type: 'correct' },
          { label: `selects = inputs ÷ 2 = 16 ÷ 2 = <b>8</b>`, type: 'wrong' },
          { label: `selects = inputs − 1 = 16 − 1 = <b>15</b>`, type: 'wrong' },
          { label: `selects = inputs ÷ 8 = 16 ÷ 8 = <b>2</b>`, type: 'wrong' },
        ]),
        correctExplain: () => 'log₂ 16 = 4 select inputs',
        working: () => `
    <div class="working-step">Find n with 2<sup>n</sup> = 16:</div>
    <div class="working-line">2<sup>3</sup> = 8 (too few), 2<sup>4</sup> = <b style="color:var(--colour-ui-correct)">16</b> ✔ → 4 select lines</div>
    <div class="working-total">The same arithmetic as the encoders and decoders last week: <i>n</i> select lines choose between 2<sup>n</sup> inputs. A 4-input mux has 2 selects, an 8-input mux 3, a 16-input mux 4.</div>`
      },
      {
        // Objective: alternate names.
        leftPanel: 'none',
        text: () => 'Besides "multiplexer" and "demultiplexer", which pair of descriptive names do datasheets and textbooks also use?',
        hint: () => 'One selects among several data sources; the other sends data to one of several destinations.',
        options: () => shuffle([
          { label: 'A multiplexer is a <b>data selector</b>; a demultiplexer is a <b>data distributor</b>', type: 'correct' },
          { label: 'A multiplexer is a <b>data distributor</b>; a demultiplexer is a <b>data selector</b>', type: 'wrong' },
          { label: 'A multiplexer is a <b>data latch</b>; a demultiplexer is a <b>data buffer</b>', type: 'wrong' },
          { label: 'A multiplexer is an <b>encoder</b>; a demultiplexer is a <b>decoder</b>', type: 'wrong' },
        ]),
        correctExplain: () => 'Data selector / data distributor',
        working: () => `
    <div class="working-line">The 74LS153 and 74LS151 datasheets in your resources are literally titled "Data Selector/Multiplexer". A multiplexer <b>selects</b> which of several sources reaches the output; a demultiplexer <b>distributes</b> one source to whichever of several outputs is chosen. (Often shortened to "mux" and "demux".)</div>
    <div class="working-total">Encoders and decoders are close relatives, but they convert between a <i>number</i> and a line; muxes and demuxes carry <i>data</i> along the chosen path.</div>`
      },
      {
        // Objective: basic operation of a demultiplexer.
        circuitId: 'demux4-block',
        circuitLabel: '1-to-4 Demultiplexer — Block Diagram',
        text: () => 'In this demultiplexer, the data input <b>D = 1</b> and the select inputs are <b>S₁ = 1, S₀ = 1</b>. The idle level of an unselected output is 0. What do the outputs <b>Y₃ Y₂ Y₁ Y₀</b> show?',
        hint: () => 'The select number chooses where the data goes; everything else stays idle.',
        options: () => shuffle([
          { label: '<b>1000</b> — S₁S₀ = 11 = 3, so the data goes to Y₃ and the others stay 0', type: 'correct' },
          { label: '<b>1111</b> — the data is copied to every output', type: 'wrong' },
          { label: '<b>0001</b> — the data goes to Y₀, the first output', type: 'wrong' },
          { label: '<b>0111</b> — the data goes to every output except the selected one', type: 'wrong' },
        ]),
        correctExplain: () => '1000 — data copied to Y₃ only',
        working: () => `
    <div class="working-line">S₁S₀ = 11 = 3 → the demultiplexer copies D to output <b>Y₃</b>. The other three outputs stay at their idle level (0 here).</div>
    <div class="working-total">It's the mirror image of a multiplexer: <b>one shared input, copied to just one of several outputs</b>. At the end of a time-division link a demux, driven in step with the sending mux, hands each slot to the right place.</div>`
      },
      {
        // Objective: mux / demux / decoder / encoder — match.
        leftPanel: 'none',
        kind: 'match',
        columns: () => ['Multiplexer', 'Demultiplexer', 'Decoder', 'Encoder'],
        text: () => `<b style="color:var(--colour-ui-primary)">Match</b> each device to its pattern.`,
        hint: () => 'Ask what the inputs and outputs are: data lines or numbers?',
        options: () => shuffle([
          { label: 'Many data in, one out', poolHtml: 'Several data inputs, one output chosen by a select number', col: 0 },
          { label: 'One data in, many out', poolHtml: 'One data input copied to one of several outputs', col: 1 },
          { label: 'Number in, one line', poolHtml: 'A binary number in, one of many output lines asserted', col: 2 },

    <div class="working-total">A demultiplexer is really a decoder whose enable input carries the data — the 74LS154 datasheet uses the same chip as both.</div>
    ${mistakeLine}`;

      },
      {
        // Objective: interpret the truth table — the long form with × entries.
        circuitId: 'mux-table-long',
        circuitLabel: 'Truth Table',
        circuitViewBox: '0 0 302 272',
        text: () => 'Which device does this truth table describe, and what do the many × entries tell you?',
        hint: () => 'Look at which inputs actually influence Z in each row.',
        options: () => shuffle([

        correctExplain: () => '4-input multiplexer; × = input not selected, so irrelevant',
        working: () => `

      {
        // Objective: interpret the truth table — one row.

        working: () => `

    <div class="working-total">Two rows per select code (I₁ = 0 → Z = 0 and I₁ = 1 → Z = 1) × four select codes = the 8 rows of the table. Without ×s you would need many more (next question).</div>`

      {

    <div class="working-total">The multiplexer is acting as a <b>lookup table</b>: its select inputs address one of four stored answers. Any function of two variables can be made this way, and a 74LS151 (3 selects, 8 data inputs) can make any function of three variables — one chip in place of a handful of gates.</div>`

      {
        // Objective: interpret IC data — demultiplexing with the 74LS154.
        leftPanel: 'none',
        text: () => 'The 74LS154 datasheet says it demultiplexes by passing data in on one strobe input (G1) <b>with the other strobe (G2) held low</b>. Its outputs are active-LOW and the select code is 0110. How does the <b>selected output</b> behave?',

          { label: 'It stays HIGH all the time — G1 can\'t carry data on this chip', type: 'wrong' },
          { label: 'All sixteen outputs follow the data together', type: 'wrong' },
        ]),
        correctExplain: () => 'The selected output follows the data unchanged (two inversions cancel)',
        working: () => `
    <div class="working-step">From the datasheet:</div>

    <div class="working-line">So with G2 = LOW: G1 = LOW → output 6 LOW; G1 = HIGH → output 6 HIGH. That is the data, passed through <b>unchanged</b>.</div>
    <div class="working-total">Compare last week's 74LS138 with an <i>active-HIGH</i> enable: its demux output came out <i>inverted</i>. Active-LOW enable plus active-LOW output gives two inversions, which cancel — a nice example of why you must read the bubbles.</div>`
      },
      {
        // Objective: interpret IC data — 74LS154 strobes.
        leftPanel: 'none',
        text: () => 'A 74LS154 has select code 1001, <b>G1 = 0</b> and <b>G2 = 1</b>. What do its 16 outputs do?',
        hint: () => 'Check the datasheet\'s statement about what happens when either strobe is high.',
        options: () => shuffle([
          { label: '<b>All 16 outputs are HIGH</b> — a HIGH on either strobe disables the chip', type: 'correct' },

          { label: '<b>All 16 outputs are LOW</b> — a disabled chip asserts everything', type: 'wrong' },
          { label: '<b>Output 6 is LOW</b> — the select bits are read in reverse order', type: 'wrong' },
        ]),
        correctExplain: () => 'All outputs HIGH — G2 is HIGH so the chip is disabled',
        working: () => `
    <div class="working-line">The datasheet: "When either strobe input is high, all outputs are high." Here G2 = 1, so the chip is disabled whatever the select code is.</div>
    <div class="working-total">Both strobes must be LOW to enable it — the same "all enables must be satisfied" rule as the 74LS138 of last week. If nothing seems to be selected on the bench, check the strobes first.</div>`
      },
      {
        // Objective: interpret IC data — 74LS153 pin count.
        leftPanel: 'none',
        text: () => 'The 74LS153 contains <b>two</b> 4-input multiplexers in one 16-pin package. The select inputs A and B are <b>common to both</b>. Which pin count adds up to 16?',
        hint: () => 'Count data inputs, selects, strobes, outputs, and the two power pins.',
        options: () => shuffle([
          { label: `8 data + 2 select + 2 strobe + 2 output + V<sub>CC</sub> + GND = <b>16</b>`, type: 'correct' },

          { label: `8 data + 2 select + 2 strobe + 2 output = <b>14</b> — with no power pins`, type: 'wrong' },
          { label: `4 data + 2 select + 1 strobe + 1 output + 2 power = <b>10</b> — a single mux`, type: 'wrong' },
        ]),
        correctExplain: () => '8 + 2 + 2 + 2 + 2 = 16 pins',
        working: () => `
    <div class="working-step">Add them up:</div>
    <div class="working-line">data inputs: 4 per mux × 2 = <b>8</b> &nbsp; selects (shared A, B): <b>2</b> &nbsp; strobes: <b>2</b> &nbsp; outputs: <b>2</b> &nbsp; power: <b>2</b></div>
    <div class="working-line">8 + 2 + 2 + 2 + 2 = <b style="color:var(--colour-ui-correct)">16</b></div>
    <div class="working-total">Sharing the select pins is what lets the chip fit in a 16-pin package — but it also means both multiplexers always choose the <i>same</i> input number, which is exactly what you want when switching two related signals (such as the two halves of a 2-bit word).</div>`
      },
      {
        // Objective: interpret IC data — strobe behaviour (74LS153).
        leftPanel: 'none',
        text: () => 'On one section of a 74LS153, the select inputs are B A = 10, the data input <b>C2 = 1</b>, and the <b>strobe G = 1</b>. What is that section\'s output Y?',

          { label: '<b>Y is undefined</b> — the strobe makes the output float', type: 'wrong' },

        correctExplain: () => 'Y = 0 — strobe HIGH forces the output LOW',
        working: () => `

      },
      {
        // Objective: interpret IC data — 74LS151 complementary outputs.
        leftPanel: 'none',
        text: () => 'A 74LS151 (8-input multiplexer) is enabled with select inputs <b>C B A = 110</b> and data input <b>D6 = 1</b>. What do its two outputs <b>Y and W</b> show?',

    <div class="working-line">8 × 1 ms = <b style="color:var(--colour-ui-correct)">8 ms</b></div>
    <div class="working-total">A counter plus a multiplexer is a parallel-to-serial converter built from standard parts: the counter scans the select code, and each data input takes its turn at the output — time-division multiplexing in miniature (and an alternative to a parallel-in, serial-out shift register).</div>`
      },
      {
        // Application: display multiplexing — scan rate.
        leftPanel: 'none',
        text: () => 'A 4-digit display shares one set of segment lines. A demultiplexer enables <b>one digit at a time</b> in turn. To avoid visible flicker, each digit must be refreshed at <b>60 Hz</b>. What scan rate (digit selections per second) does the circuit need?',

          { label: `rate = refresh = <b>60 Hz</b> — one scan covers all four digits`, type: 'wrong' },
          { label: `rate = digits + refresh = 4 + 60 = <b>64 Hz</b>`, type: 'wrong' },
        ]),
        correctExplain: () => '4 × 60 Hz = 240 Hz',
        working: () => `
    <div class="working-step">Step 1 — one full scan lights each digit once:</div>
    <div class="working-line">60 scans per second</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — each scan makes 4 digit selections:</div>

    <div class="working-total">At 15 Hz the digits would flicker badly. Your eye averages the fast on/off flashing into a steady glow (persistence of vision) — the display is cheaper to wire because 4 digits share the segment lines, at the cost of each digit being lit only a quarter of the time.</div>`
      },
      {
        // Objective: typical applications.
        leftPanel: 'none',
        kind: 'multi',
        text: () => `Click <b style="color:var(--colour-ui-primary)">every</b> job that suits a <b style="color:var(--colour-ui-primary)">multiplexer or demultiplexer</b>.`,
        hint: () => 'Think of choosing one of several signals, or sharing one line between several.',
        options: () => shuffle([
          { label: 'Sending several channels over one cable by time-division multiplexing', type: 'correct' },

          { label: 'Producing any logic function of two or three variables from one chip', type: 'correct' },

      },
