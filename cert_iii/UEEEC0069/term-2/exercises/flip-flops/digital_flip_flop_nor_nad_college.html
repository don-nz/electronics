<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Electronics — SR Latch Waveform Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --colour-bg: #f8f9fa;
      --colour-panel: #ffffff;
      --colour-border: #d0d5dd;
      --colour-text: #1d2939;
      --colour-text-strong: #002664;
      --colour-label: #475467;
      --colour-label-rgb: 71, 84, 103;
      --colour-grid: rgba(0, 38, 100, 0.04);

      --colour-ui-primary: #002664;
      --colour-ui-primary-rgb: 0, 38, 100;
      --colour-ui-correct: #087443;
      --colour-ui-correct-rgb: 8, 116, 67;
      --colour-ui-wrong: #d92d20;
      --colour-ui-wrong-rgb: 217, 45, 32;

      --colour-input-a: #4338ca;
      --colour-input-b: #0f766e;
      --colour-output-z: #0284c7;

      --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Public Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'Share Tech Mono', monospace, sans-serif;

      --radius-lg: 6px;
      --radius-sm: 4px;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    body.dark-theme {
      --colour-bg: #121824;
      --colour-panel: #1a2232;
      --colour-border: #2e3c54;
      --colour-text: #e2e8f0;
      --colour-text-strong: #ffffff;
      --colour-label: #94a3b8;
      --colour-label-rgb: 148, 163, 184;
      --colour-grid: rgba(255, 255, 255, 0.03);

      --colour-ui-primary: #38bdf8;
      --colour-ui-primary-rgb: 56, 189, 248;
      --colour-ui-correct: #34d399;
      --colour-ui-correct-rgb: 52, 211, 153;
      --colour-ui-wrong: #f87171;
      --colour-ui-wrong-rgb: 248, 113, 113;

      --colour-input-a: #818cf8;
      --colour-input-b: #2dd4bf;
      --colour-output-z: #38bdf8;

      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--colour-bg);
      color: var(--colour-text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: linear-gradient(var(--colour-grid) 1px, transparent 1px), linear-gradient(90deg, var(--colour-grid) 1px, transparent 1px);
      background-size: 40px 40px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    header {
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 700px;
    }

    header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--colour-ui-primary);
    }

    header p {
      margin-top: .4rem;
      color: var(--colour-label);
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--colour-text);
      background: var(--colour-panel);
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-card);
    }

    .theme-toggle:hover {
      border-color: var(--colour-ui-primary);
    }

    .main-wrap {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .card {
      background: var(--colour-panel);
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-card);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .card-top-bar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .rule-card {
      font-size: .85rem;
      line-height: 1.6;
    }

    .rule-card .rule-row {
      display: flex;
      gap: .5rem;
      margin: .35rem 0;
    }

    .rule-card .rule-cond {
      flex: none;
      width: 8.5rem;
      font-family: var(--font-mono);
      font-weight: bold;
    }

    .legend-row {
      display: flex;
      gap: 1.2rem;
      margin-top: .8rem;
      font-size: .78rem;
      font-weight: 600;
      color: var(--colour-label);
    }

    .legend-swatch {
      display: inline-block;
      width: 1.1rem;
      height: 3px;
      margin-right: .3rem;
      vertical-align: middle;
      border-radius: 2px;
    }

    .gate-toggle-card {
      font-size: .85rem;
    }

    .gate-toggle-label {
      color: var(--colour-label);
      margin-bottom: .6rem;
      font-weight: 600;
    }

    .gate-toggle {
      display: flex;
      gap: .8rem;
      flex-wrap: wrap;
    }

    .gate-toggle-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      padding: .6rem 1.1rem;
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-lg);
      background: transparent;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--colour-label);
      transition: background .15s, color .15s, border-color .15s;
    }

    .gate-toggle-btn svg {
      width: 10rem;
      height: auto;
      display: block;
    }

    .gate-toggle-btn.active {
      border-color: var(--colour-ui-primary);
      background: rgba(var(--colour-ui-primary-rgb), .12);
      color: var(--colour-ui-primary);
    }

    .gate-toggle-btn:not(.active):hover {
      background: rgba(var(--colour-ui-primary-rgb), .06);
      color: var(--colour-text);
    }

    .wb-track-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
    }

    .wb-track-label {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--colour-text-strong);
      width: 20px;
      text-align: center;
    }

    .wb-track-row svg {
      flex: 1;
      height: 48px;
      background: rgba(var(--colour-label-rgb), 0.05);
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-sm);
    }

    .wb-track-path {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wb-grid-line {
      stroke: var(--colour-border);
      stroke-width: 1;
      stroke-dasharray: 2, 2;
      opacity: 0.6;
    }

    .wb-track-s { stroke: var(--colour-input-a); }
    .wb-track-r { stroke: var(--colour-input-b); }
    .wb-track-q { stroke: var(--colour-output-z); }

    .wb-palette {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1.2rem 0;
      flex-wrap: wrap;
    }

    .wb-piece-btn {
      background: var(--colour-panel);
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-sm);
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .wb-piece-btn:hover:not(:disabled) {
      border-color: var(--colour-ui-primary);
      background: rgba(var(--colour-ui-primary-rgb), 0.08);
    }

    .wb-piece-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .wb-piece-btn svg {
      width: 42px;
      height: 28px;
    }

    .wb-piece-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--colour-label);
    }

    .result-banner {
      display: none;
      padding: .65rem 1rem;
      border-radius: var(--radius-sm);
      font-size: .82rem;
      font-family: var(--font-body);
      font-weight: 600;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1rem;
    }

    .result-banner.correct {
      display: flex;
      background: rgba(var(--colour-ui-correct-rgb), .12);
      border: 1px solid rgba(var(--colour-ui-correct-rgb), .4);
      color: var(--colour-ui-correct);
    }

    .result-banner.wrong {
      display: flex;
      background: rgba(var(--colour-ui-wrong-rgb), .12);
      border: 1px solid rgba(var(--colour-ui-wrong-rgb), .4);
      color: var(--colour-ui-wrong);
    }

    .btn-row {
      display: flex;
      gap: .6rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
      width: 100%;
    }

    .btn {
      padding: .6rem 0;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
      border: 1px solid;
      flex: 1;
      min-width: 105px;
      text-align: center;
    }

    .btn-prev {
      background: rgba(var(--colour-label-rgb), .1);
      border-color: rgba(var(--colour-label-rgb), .4);
      color: var(--colour-label);
    }

    .btn-prev:hover:not(:disabled) {
      background: rgba(var(--colour-label-rgb), .2);
    }

    .btn-prev:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-check {
      background: rgba(var(--colour-ui-correct-rgb), .15);
      border-color: rgba(var(--colour-ui-correct-rgb), .5);
      color: var(--colour-ui-correct);
    }

    .btn-check:hover:not(:disabled) {
      background: rgba(var(--colour-ui-correct-rgb), .25);
    }

    .btn-check:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: rgba(var(--colour-ui-primary-rgb), .12);
      border-color: rgba(var(--colour-ui-primary-rgb), .4);
      color: var(--colour-ui-primary);
    }

    .btn-secondary:hover {
      background: rgba(var(--colour-ui-primary-rgb), .22);
    }

    /* Print Worksheet — .print-only is invisible on screen, shown only via
       @media print below. #printWorksheet (a direct child of <body>, NOT
       nested inside .main-wrap) is built fresh by printDiagramNow() right
       before window.print(): page title/description, the current S/R
       diagram with Q left as a blank grid, then a page-break and the same
       diagram again with the correct Q filled in as the solution. */
    .print-only { display: none; }

    @media print {
      /* Force light regardless of whichever theme is active on screen —
         body.dark-theme has higher specificity than a bare :root rule, so
         it's redefined here too (same values), not just :root, or dark
         mode would still win. */
      :root, body.dark-theme {
        --colour-bg: #ffffff;
        --colour-panel: #ffffff;
        --colour-text: #000000;
        --colour-text-strong: #000000;
        --colour-border: #999999;
        --colour-label: #444444;
      }
      body > *:not(#printWorksheet) { display: none !important; }
      body { background: #fff; background-image: none; padding: 0; display: block; }
      #printWorksheet {
        display: block !important;
        color: #000;
        font-family: var(--font-body);
        max-width: 700px;
        margin: 2rem auto;
      }
      #printWorksheet h1 { font-size: 1.3rem; margin: 0 0 .3rem; font-family: var(--font-display); }
      #printWorksheet .print-subtitle { font-size: .8rem; color: #444; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: .05em; }
      #printWorksheet .print-description { margin-bottom: 1.2rem; }
      #printWorksheet .print-diagram-section { page-break-inside: avoid; }
      /* Solution starts on its own fresh page — a detachable teacher's
         copy when printed double-sided or handed out separately. */
      #printWorksheet .print-solution { page-break-before: always; }
      #printWorksheet .print-solution h2 { font-size: 1.1rem; margin-bottom: .8rem; }
      #printWorksheet .wb-track-row svg { width: 100%; height: auto; background: none; border: 1px solid #999; }
      #printWorksheet .wb-track-label { color: #000; }
      #printWorksheet .wb-grid-line { stroke: #999; stroke-dasharray: none; opacity: 1; }
    }
      #qbarRow { display: none; }
    #qbarRow.shown { display: flex; }
  </style>
</head>

<body>

      </filter>

      <g transform="translate(135,90)">

        <line x1="-135" y1="-45" x2="-75" y2="-45" style="stroke: var(--colour-output-z)" stroke-width="2" />
        <text x="-60" y="-34" font-size="25" font-weight="bold" style="fill: var(--colour-output-z)">S</text>
        <line x1="-135" y1="45" x2="-75" y2="45" style="stroke: var(--colour-output-z)" stroke-width="2" />
        <text x="-60" y="55" font-size="25" font-weight="bold" style="fill: var(--colour-output-z)">R</text>

        <line x1="-135" y1="-45" x2="-75" y2="-45" style="stroke: var(--colour-output-z)" stroke-width="2" />
        <text x="-60" y="-34" font-size="25" font-weight="bold" style="fill: var(--colour-output-z)"><tspan style="text-decoration: overline">S</tspan></text>
        <line x1="-135" y1="45" x2="-75" y2="45" style="stroke: var(--colour-output-z)" stroke-width="2" />

        <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-output-z)" stroke-width="2" />
        <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-output-z)">Q</text>
        <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-output-z)" stroke-width="2" />
        <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-output-z)"><tspan style="text-decoration: overline">Q</tspan></text>

      </g>

  <header>
    <h1>Digital Electronics</h1>
    <p>SR Latch — Build the Q Output</p>
  </header>

  <div class="main-wrap">
    <div class="card-top-bar">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark and light theme">
        <span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span>
      </button>
    </div>

    <div class="card rule-card">
      <div style="margin-bottom: 0.4rem;">An unclocked <b>SR latch</b> follows one rule at every instant<span id="ruleGateNote"></span>:</div>

      </div>
      <div class="wb-track-row">

        <svg id="rTrack"></svg>
      </div>
      <div class="wb-track-row">
        <div class="wb-track-label">Q</div>
        <svg id="qTrack"></svg>
      </div>
      <div class="wb-track-row" id="qbarRow">
        <div class="wb-track-label"><span style="text-decoration:overline">Q</span></div>
        <svg id="qbarTrack"></svg>
      </div>

      <div class="wb-palette" id="palette"></div>

      <div class="result-banner" id="resultBanner"><span id="resultIcon"></span>&nbsp;<span id="resultText"></span></div>

      <div class="btn-row">
        <button class="btn btn-prev" id="undoBtn" onclick="doUndo()">← Undo</button>

        <button class="btn btn-secondary" id="restartBtn" onclick="doRestart()">↺ Retry</button>
        <button class="btn btn-secondary" id="newBtn" onclick="doNewDiagram()">🎲 New Diagram</button>
        <button class="btn btn-secondary" id="printBtn" onclick="printDiagramNow()">🖨 Print Worksheet</button>
      </div>

  </div>

  <!-- Print Worksheet — direct child of <body> (NOT nested inside
       .main-wrap), populated by printDiagramNow() below. Invisible on
       screen (.print-only), shown only via the browser's Print /
       Save-as-PDF. -->
  <div id="printWorksheet" class="print-only"></div>

  <script>
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-theme');
      localStorage.setItem('tafe-quiz-theme', isDark ? 'dark' : 'light');
      updateThemeToggleUI(isDark);
    }

    function updateThemeToggleUI(isDark) {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (icon && label) {
        icon.textContent = isDark ? '☀️' : '🌙';
        label.textContent = isDark ? 'Light Mode' : 'Dark Mode';
      }
    }

    (function initTheme() {
      const saved = localStorage.getItem('tafe-quiz-theme');
      const isDark = saved === 'dark';
      if (isDark) {
        document.body.classList.add('dark-theme');
      } else {
        document.body.classList.remove('dark-theme');
      }
      updateThemeToggleUI(isDark);
    })();

    function wbCursor(builder) {
      let col = 0, level = 0;
      for (const p of builder.pieces) {
        if (p.type === 'flat') col += p.width;
        else if (p.type === 'rise') { col += 1; level = 1; }
        else if (p.type === 'fall') { col += 1; level = 0; }
      }
      return { col, level };
    }

    function wbCanPlace(builder, piece, n) {
      const cur = wbCursor(builder);
      const w = (piece.type === 'flat') ? piece.width : 1;
      if (cur.col + w > n) return false;
      if (piece.type === 'rise' && cur.level === 1) return false;
      if (piece.type === 'fall' && cur.level === 0) return false;
      return true;
    }

    function wbPlace(builder, piece, n) {
      if (!wbCanPlace(builder, piece, n)) return false;
      builder.pieces.push(piece);
      return true;
    }

    function wbUndo(builder) {
      return builder.pieces.pop();
    }

    function wbUserLevels(builder) {
      const levels = [];
      let lvl = 0;
      for (const p of builder.pieces) {
        if (p.type === 'flat') {
          for (let k = 0; k < p.width; k++) levels.push(lvl);
        } else if (p.type === 'rise') {
          lvl = 1;
          levels.push(lvl);
        } else if (p.type === 'fall') {
          lvl = 0;
          levels.push(lvl);
        }
      }
      return levels;
    }

    function wbCheck(builder, targetTrack) {
      const u = wbUserLevels(builder);
      const results = u.map((val, idx) => val === targetTrack[idx]);
      const correctCount = results.filter(Boolean).length;
      return {
        allCorrect: correctCount === targetTrack.length && u.length === targetTrack.length,
        correctCount,
        total: targetTrack.length,
        results
      };
    }

    function renderGridLinesHTML(n, colW, h, y0, y1, w) {
      let gridHtml = '';
      gridHtml += `<line class="wb-grid-line" x1="0" y1="${y1}" x2="${w}" y2="${y1}" />`;
      gridHtml += `<line class="wb-grid-line" x1="0" y1="${y0}" x2="${w}" y2="${y0}" />`;
      for (let i = 1; i < n; i++) {
        const x = i * colW;
        gridHtml += `<line class="wb-grid-line" x1="${x}" y1="0" x2="${x}" y2="${h}" />`;
      }
      return gridHtml;
    }

    function renderReadOnlyTrackSVG(svg, track, opts) {
      const N = track.length;
      const W = 500, H = 40, padY = 6;
      const colW = W / N;
      const y0 = H - padY, y1 = padY;

      let d = `M 0 ${track[0] === 1 ? y1 : y0}`;
      for (let i = 0; i < N; i++) {
        const xStart = i * colW;
        const xEnd = (i + 1) * colW;
        const y = track[i] === 1 ? y1 : y0;
        d += ` L ${xStart} ${y} L ${xEnd} ${y}`;
      }

      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      let html = renderGridLinesHTML(N, colW, H, y0, y1, W);
      html += `<path class="${opts.className}" d="${d}" />`;
      svg.innerHTML = html;
    }

    function renderQTrackSVG(svg, builder, n, opts) {
      const W = 500, H = 40, padY = 6;
      const colW = W / n;
      const y0 = H - padY, y1 = padY;
      let d = '', curCol = 0, curLvl = 0;

      for (const p of builder.pieces) {
        const xStart = curCol * colW;
        if (p.type === 'flat') {
          const xEnd = (curCol + p.width) * colW;
          const y = curLvl === 1 ? y1 : y0;
          d += d ? ` L ${xStart} ${y} L ${xEnd} ${y}` : `M ${xStart} ${y} L ${xEnd} ${y}`;
          curCol += p.width;
        } else if (p.type === 'rise') {
          const xEnd = (curCol + 1) * colW;
          d += d ? ` L ${xStart} ${y0} L ${xStart} ${y1} L ${xEnd} ${y1}` : `M ${xStart} ${y0} L ${xStart} ${y1} L ${xEnd} ${y1}`;
          curLvl = 1;
          curCol += 1;
        } else if (p.type === 'fall') {
          const xEnd = (curCol + 1) * colW;
          d += d ? ` L ${xStart} ${y1} L ${xStart} ${y0} L ${xEnd} ${y0}` : `M ${xStart} ${y1} L ${xStart} ${y0} L ${xEnd} ${y0}`;
          curLvl = 0;
          curCol += 1;
        }
      }

      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      let html = '';

      if (opts.results) {
        opts.results.forEach((ok, i) => {
          const color = ok ? 'rgba(8, 116, 67, 0.2)' : 'rgba(217, 45, 32, 0.25)';
          html += `<rect x="${i * colW}" y="0" width="${colW}" height="${H}" fill="${color}" />`;
        });
      }

      html += renderGridLinesHTML(n, colW, H, y0, y1, W);

      if (curCol < n && !opts.results) {
        html += `<line x1="${curCol * colW}" y1="0" x2="${curCol * colW}" y2="${H}" stroke="var(--colour-ui-primary)" stroke-width="1.5" stroke-dasharray="3,3" />`;
      }

      if (d) {
        html += `<path class="wb-track-path wb-track-q" d="${d}" />`;
      }

      // After Check: redraw the student's wrong columns (and any riser that
      // only exists because an earlier column was wrong) in red, then lay the
      // FULL correct waveform over it in green, risers included, so the
      // green lines always trace the complete solution and anything red is
      // the student's own departure from it.
      if (opts.results && opts.correctLevels) {
        const cl = opts.correctLevels;
        const lvlY = (l) => (l === 1 ? y1 : y0);
        const seg = (c, prev, cur) => {
          const xs = c * colW, xe = xs + colW;
          return prev === cur ? `M ${xs} ${lvlY(cur)} L ${xe} ${lvlY(cur)} ` : `M ${xs} ${lvlY(prev)} L ${xs} ${lvlY(cur)} L ${xe} ${lvlY(cur)} `;
        };
        let col = 0, lvl = 0, red = '';
        const place = (cols, newLvl) => {
          for (let k = 0; k < cols; k++, col++) {
            const prev = k === 0 ? lvl : newLvl;
            const cprev = col === 0 ? 0 : cl[col - 1];
            if (!opts.results[col] || prev !== cprev) red += seg(col, prev, newLvl);
          }
          lvl = newLvl;
        };
        for (const p of builder.pieces) {
          if (p.type === 'flat') place(p.width, lvl);
          else if (p.type === 'rise') place(1, 1);
          else if (p.type === 'fall') place(1, 0);
        }
        let green = '', prevC = 0;
        cl.forEach((v, i) => { green += seg(i, prevC, v); prevC = v; });
        if (red) html += `<path class="wb-track-path" style="stroke: var(--colour-ui-wrong)" d="${red}" />`;
        html += `<path class="wb-track-path" style="stroke: var(--colour-ui-correct)" d="${green}" />`;
      }

      svg.innerHTML = html;
    }

    function renderPiecePalette(container, opts) {
      container.innerHTML = '';
      opts.pieces.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'wb-piece-btn';
        btn.disabled = opts.isDisabled(p);
        btn.onclick = () => opts.onPick(p);

        let iconSvg = '', labelText = '';
        if (p.type === 'flat') {
          labelText = `Flat (${p.width})`;
          iconSvg = `<svg viewBox="0 0 40 20"><line x1="0" y1="10" x2="40" y2="10" stroke="var(--colour-output-z)" stroke-width="3"/></svg>`;
        } else if (p.type === 'rise') {
          labelText = 'Step Up';
          iconSvg = `<svg viewBox="0 0 40 20"><path d="M 0 16 L 0 4 L 40 4" fill="none" stroke="var(--colour-output-z)" stroke-width="3"/></svg>`;
        } else if (p.type === 'fall') {
          labelText = 'Step Down';
          iconSvg = `<svg viewBox="0 0 40 20"><path d="M 0 4 L 0 16 L 40 16" fill="none" stroke="var(--colour-output-z)" stroke-width="3"/></svg>`;
        }

        btn.innerHTML = `${iconSvg}<span class="wb-piece-label">${labelText}</span>`;
        container.appendChild(btn);
      });
    }

    const N = 20;
    const PIECES = [
      { type: 'flat', width: 1 }, { type: 'flat', width: 2 }, { type: 'flat', width: 3 },
      { type: 'rise' }, { type: 'fall' },
    ];

    const GATE_CONFIG = {
      nor: {
        assert: 1, idle: 0, sLabel: 'S', rLabel: 'R', latchName: 'NOR',
        rules: [
          ['S = 1, R = 0', '<b>Set</b> — Q goes (or stays) HIGH'],
          ['S = 0, R = 1', '<b>Reset</b> — Q goes (or stays) LOW'],
          ['S = 0, R = 0', '<b>Hold</b> — Q stays exactly where it was'],
          ['S = 1, R = 1', 'Invalid — never shown here'],
        ],
      },
      nand: {
        assert: 0, idle: 1, sLabel: "S'", rLabel: "R'", latchName: 'NAND',
        rules: [
          ["S' = 0, R' = 1", '<b>Set</b> — Q goes (or stays) HIGH'],
          ["S' = 1, R' = 0", '<b>Reset</b> — Q goes (or stays) LOW'],
          ["S' = 1, R' = 1", '<b>Hold</b> — Q stays exactly where it was'],
          ["S' = 0, R' = 0", 'Invalid — never shown here'],
        ],
      },
    };
    let gateType = 'nor';

    const MIN_Q_TRANSITIONS = 4;
    function generateSRPair(n, assert, idle) {
      const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
      let best = null, bestTransitions = -1;
      for (let attempt = 0; attempt < 30; attempt++) {
        const S = new Array(n).fill(idle), R = new Array(n).fill(idle);
        let sLevel = idle, rLevel = idle, qLevel = 0, qTransitions = 0;
        let col = randInt(1, 3);
        while (col < n) {
          const canToggleS = sLevel === assert || rLevel === idle;
          const canToggleR = rLevel === assert || sLevel === idle;
          let pick;
          if (canToggleS && canToggleR) {
            const preferred = qLevel === 0 ? 'S' : 'R';
            pick = Math.random() < 0.75 ? preferred : (preferred === 'S' ? 'R' : 'S');
          } else {
            pick = canToggleS ? 'S' : 'R';
          }
          if (pick === 'S') sLevel = sLevel === assert ? idle : assert; else rLevel = rLevel === assert ? idle : assert;
          const sAsserted = sLevel === assert, rAsserted = rLevel === assert;
          const newQ = sAsserted ? 1 : (rAsserted ? 0 : qLevel);
          if (newQ !== qLevel) qTransitions++;
          qLevel = newQ;
          for (let i = col; i < n; i++) { S[i] = sLevel; R[i] = rLevel; }
          col += randInt(1, 3);
        }
        if (qTransitions >= MIN_Q_TRANSITIONS) return { S, R };
        if (qTransitions > bestTransitions) { best = { S, R }; bestTransitions = qTransitions; }
      }
      return best;
    }

    function deriveQ(S, R, assert) {
      const Q = [];
      let prev = 0;
      for (let i = 0; i < S.length; i++) {
        const sAsserted = S[i] === assert, rAsserted = R[i] === assert;
        let q;
        if (sAsserted && !rAsserted) q = 1;
        else if (rAsserted && !sAsserted) q = 0;
        else q = prev;
        Q.push(q);
        prev = q;
      }
      return Q;
    }

    function renderRuleCard() {
      const cfg = GATE_CONFIG[gateType];
      document.getElementById('ruleGateNote').textContent = ` (built from two cross-coupled ${cfg.latchName} gates)`;
      document.getElementById('ruleRows').innerHTML = cfg.rules.map(([cond, desc]) =>
        `<div class="rule-row"><span class="rule-cond">${cond}</span><span>${desc}</span></div>`
      ).join('');
      document.getElementById('legendS').textContent = cfg.sLabel;
      document.getElementById('legendR').textContent = cfg.rLabel;
      document.getElementById('sTrackLabel').textContent = cfg.sLabel;
      document.getElementById('rTrackLabel').textContent = cfg.rLabel;
    }

    function pickGateType(type) {
      if (type === gateType) return;
      gateType = type;
      document.getElementById('gateBtnNor').classList.toggle('active', type === 'nor');
      document.getElementById('gateBtnNand').classList.toggle('active', type === 'nand');
      document.getElementById('gateBtnNor').setAttribute('aria-pressed', String(type === 'nor'));
      document.getElementById('gateBtnNand').setAttribute('aria-pressed', String(type === 'nand'));
      renderRuleCard();
      doNewDiagram();
    }

    let S, R, correctQ, builder, checked, lastResult;

    function doNewDiagram() {
      const cfg = GATE_CONFIG[gateType];
      ({ S, R } = generateSRPair(N, cfg.assert, cfg.idle));
      correctQ = deriveQ(S, R, cfg.assert);
      builder = { pieces: [] };
      checked = false;
      lastResult = null;
      render();
    }

    function doRestart() {
      builder = { pieces: [] };
      checked = false;
      lastResult = null;
      render();
    }

    function doUndo() {
      if (checked) return;
      wbUndo(builder);
      render();
    }

    function pickPiece(piece) {
      if (checked) return;
      wbPlace(builder, piece, N);
      render();
    }

    function doCheck() {
      if (checked) return;
      if (wbCursor(builder).col !== N) return;
      lastResult = wbCheck(builder, correctQ);
      checked = true;
      render();
    }

    function render() {
      renderReadOnlyTrackSVG(document.getElementById('sTrack'), S, { className: 'wb-track-path wb-track-s' });
      renderReadOnlyTrackSVG(document.getElementById('rTrack'), R, { className: 'wb-track-path wb-track-r' });
      renderQTrackSVG(document.getElementById('qTrack'), builder, N, checked ? { results: lastResult.results, correctLevels: correctQ } : {});

      // Q-bar is revealed once Check has been pressed — it's just Q flipped.
      const qbarRow = document.getElementById('qbarRow');
      qbarRow.classList.toggle('shown', checked);
      if (checked) {
        renderReadOnlyTrackSVG(document.getElementById('qbarTrack'), correctQ.map(v => 1 - v), { className: 'wb-track-path wb-track-q' });
      }

      renderPiecePalette(document.getElementById('palette'), {
        pieces: PIECES,
        onPick: pickPiece,
        isDisabled: (p) => checked || !wbCanPlace(builder, p, N),
      });

      const cursor = wbCursor(builder);
      document.getElementById('checkBtn').disabled = checked || cursor.col !== N;
      document.getElementById('undoBtn').disabled = checked || builder.pieces.length === 0;

      const banner = document.getElementById('resultBanner');
      if (checked) {
        banner.className = 'result-banner ' + (lastResult.allCorrect ? 'correct' : 'wrong');
        document.getElementById('resultIcon').textContent = lastResult.allCorrect ? '✓' : '✗';
        document.getElementById('resultText').textContent = lastResult.allCorrect
          ? `All ${lastResult.total} columns correct! Q-bar (below) is simply Q flipped.`
          : `${lastResult.correctCount} of ${lastResult.total} columns correct — red columns are wrong.`;
      } else {
        banner.className = 'result-banner';
      }
    }

    // Builds the print worksheet fresh (current gate type's S/R labels
    // and rule text, current S/R diagram, current correct Q): page title/
    // description, then the given tracks with Q left as a blank grid (for
    // the student to draw by hand), then a page-break and the same tracks
    // again with the correct Q filled in as the solution. Standalone port
    // of waveform-builder.js's own buildPrintDiagram() — this file has its
    // own independent render primitives (W=500/H=40/padY=6), so it's
    // rewritten here against THOSE rather than shared verbatim.
    function buildPrintDiagramLocal() {
      const host = document.getElementById('printWorksheet');
      if (!host) return;
      const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const cfg = GATE_CONFIG[gateType];
      let html = '';

      const h1 = document.querySelector('header h1'), sub = document.querySelector('header p');
      if (h1) html += `<h1>${esc(h1.textContent)}</h1>`;
      if (sub) html += `<div class="print-subtitle">${esc(sub.textContent)}</div>`;

      const descEl = document.querySelector('.rule-card');
      if (descEl) {
        const clone = descEl.cloneNode(true);
        clone.querySelectorAll('.menu-link').forEach(el => el.remove());
        html += `<div class="print-description ${esc(descEl.className)}">${clone.innerHTML}</div>`;
      }

      const givenTracks = [
        { label: cfg.sLabel, svgEl: document.getElementById('sTrack') },
        { label: cfg.rLabel, svgEl: document.getElementById('rTrack') },
      ];
      const givenRowsHTML = givenTracks.map(t =>
        `<div class="wb-track-row"><div class="wb-track-label">${esc(t.label)}</div><svg viewBox="${t.svgEl.getAttribute('viewBox')}" preserveAspectRatio="none">${t.svgEl.innerHTML}</svg></div>`
      ).join('');

      const W = 500, H = 40, padY = 6;
      const colW = W / N, y0 = H - padY, y1 = padY;
      const blankGrid = renderGridLinesHTML(N, colW, H, y0, y1, W);
      html += `<div class="print-diagram-section">
        <div class="wb-tracks-wrap">${givenRowsHTML}
          <div class="wb-track-row"><div class="wb-track-label">Q</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${blankGrid}</svg></div>
        </div>
      </div>`;

      const solId = 'printSolutionTrack';
      html += `<div class="print-diagram-section print-solution">
        <h2>Solution</h2>
        <div class="wb-tracks-wrap">${givenRowsHTML}
          <div class="wb-track-row"><div class="wb-track-label">Q</div><svg id="${solId}"></svg></div>
        </div>
      </div>`;

      host.innerHTML = html;
      const solSvg = document.getElementById(solId);
      if (solSvg) renderReadOnlyTrackSVG(solSvg, correctQ, { className: 'wb-track-path wb-track-q' });
    }

    // window.print() has no reliable effect on Android's Chromium-based
    // mobile browsers (confirmed by Don across Chrome AND Arc Search —
    // both silently do nothing there); iOS Safari opens its native
    // print/share sheet fine. There's no JS-observable way to tell
    // whether window.print() actually did anything, so this always shows
    // a short toast alongside it as a fallback instruction — redundant/
    // harmless where print DID open, essential where it silently didn't.
    function printDiagramNow() {
      buildPrintDiagramLocal();
      window.print();
      const toast = document.createElement('div');
      toast.textContent = "Worksheet ready. If a Print dialog didn't just open, use your browser's own menu (Share → Print, or ⋮ → Print).";
      toast.style.cssText = 'position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);max-width:90vw;background:#1e293b;color:#fff;padding:.7rem 1.1rem;border-radius:8px;font-size:.8rem;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 6000);
    }

    renderRuleCard();

    // ── "Answers" mode ── Before the student has placed anything, the Check button
    // reads "Answers" and shows the finished solution (no student-entered values).
    // Once they start building, it becomes the normal Check button and the Print
    // Worksheet button is hidden (a printed blank worksheet is only useful before
    // the puzzle is attempted). Retry / New Diagram return to the starting state.
    let answersShown = false;
    const __render = render;
    render = function () { __render(); applyAnswersUI(); };
    const __doCheck = doCheck;
    doCheck = function () {
      if (checked) return;
      if (builder.pieces.length === 0) { showAnswers(); return; }
      __doCheck();
    };
    const __doRestart = doRestart;
    doRestart = function () { answersShown = false; __doRestart(); };
    const __doNewDiagram = doNewDiagram;
    doNewDiagram = function () { answersShown = false; __doNewDiagram(); };

    function showAnswers() {
      builder = { pieces: [] };
      let lvl = 0, c = 0;
      while (c < N) {
        const x = correctQ[c];
        if (x !== lvl) { wbPlace(builder, { type: x ? 'rise' : 'fall' }, N); lvl = x; c++; }
        else {
          let w = 1;
          while (w < 3 && c + w < N && correctQ[c + w] === lvl) w++;
          wbPlace(builder, { type: 'flat', width: w }, N); c += w;
        }
      }
      answersShown = true;
      lastResult = wbCheck(builder, correctQ);
      checked = true;
      render();
    }

    function applyAnswersUI() {
      const atStart = builder.pieces.length === 0 && !checked;
      const cb = document.getElementById('checkBtn');
      cb.textContent = atStart ? 'Answers' : 'Check';
      if (atStart) cb.disabled = false;
      const pb = document.getElementById('printBtn');
      if (pb) pb.style.display = (builder.pieces.length > 0 && !answersShown) ? 'none' : '';
      if (answersShown) {
        document.getElementById('resultBanner').className = 'result-banner correct';
        document.getElementById('resultIcon').textContent = '👁';
        document.getElementById('resultText').textContent = 'Answers shown — press Retry to have a go yourself, or New Diagram for a fresh puzzle.';
      }
    }

    doNewDiagram();
  </script>
</body>

</html>
