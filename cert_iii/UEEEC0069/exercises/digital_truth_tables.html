<!--
  Split out of digital_knowledge_logic_combos.html (its old Q8-Q12) into its
  own standalone practice quiz — a second, longer staged truth-table
  build-up for students who want extra reps on the technique beyond the
  one worked into the main Combinational Logic knowledge quiz.

  Same data-driven QUESTIONS[] engine as digital_knowledge_logic_combos.html
  (see that file, and ultimately digital_knowledge_logic_gates.html, for the
  fuller field reference), trimmed further: no 'multi' kind or shapeGrid
  left-panel here at all, since every question in this file is either a
  staged truth-table build-up (kind:'truth') or a single fixed-value
  predict-output question — both driven by `leftPanel:'circuit'`.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine. Same
  headerGroups()/highlightLabels()/groupBreakAfter()/trailingLabels()
  staged-truth-table mechanism as digital_knowledge_logic_combos.html
  (already generalized into the shared renderTruth() during that
  migration, so this file needed no further engine changes) — this file's
  own buildStagedRows() (byte-identical to logic_combos.html's own) stays
  page-local, same reasoning as every other file's gate-logic content.
  Needs only CIRCUIT_SVG_ID='circuitRefSvg' — no other globals.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../assets/theme-init.js"></script>
  <script src="../../assets/quiz-engine.js"></script>
  <title>Digital Truth Tables — Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/quiz-common.css">
  <script src="../../assets/breadcrumb.js" defer></script>
  <style>
    .colour-bjt { color: var(--colour-bjt); }

    /* Read-only input columns (C/B/A/...) in the truth-table questions —
       same look as the bits-table's fixed "Value" column, themed. */
    .truth-input-cell { font-weight: 700; color: var(--colour-text); background: rgba(var(--colour-label-rgb), .04); }

    /* highlightLabels() marks which already-known column(s) are actually
       needed to derive the current fillable column. Rather than making
       those columns pop, everything else (not needed this pass — a given
       input that isn't feeding this gate yet, or a later stage that
       hasn't been reached) is dimmed instead, so the relevant columns
       stay in their normal, readable styling and only the irrelevant ones
       recede. groupBreakAfter() draws the double-line divider between
       "raw inputs", "staged outputs" and "final output", matching the ‖
       notation from the in-class table. */
    /* !important: the shared .bits-table tbody td:first-child rule in
       quiz-common.css (bold + full colour, for the "Value"-style leftmost
       column) is more specific than a single class, and would otherwise
       win over this on the C column specifically — C is always first. */
    .truth-dim { font-weight: 400 !important; color: var(--colour-label) !important; opacity: .5; }
    .truth-group-end { border-right: 3px double var(--colour-border); }
  </style>
</head>

<body>
  <!-- Hidden defs: gate symbols (copied from ../../assets/shapes/logic-gates.svg
       and re-themed to var(--colour-bjt) instead of that master file's
       hardcoded #ffb454 — edit shapes there first for any future gate
       quiz, then copy+re-theme into each quiz's own <defs> block; see that
       file's header comment for why it can't just be <use>'d directly
       from here (file:// blocks cross-file SVG <use>/fetch())), plus the
       one combinational network (Q1-Q8) built from those same gate
       primitives. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" font-family="'Share Tech Mono', monospace">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>

      <!-- ── shared leads ── -->
      <g id="gate-lead-in2">
        <line x1="-24" y1="-8" x2="-8" y2="-8" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="-24" y1="8" x2="-8" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />
      </g>
      <g id="gate-lead-in1">
        <line x1="-24" y1="0" x2="-8" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
      </g>
      <g id="gate-lead-in2-or">
        <line x1="-24" y1="-8" x2="-4.6" y2="-8" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="-24" y1="8" x2="-4.6" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />
      </g>
      <g id="gate-lead-out">
        <line x1="24" y1="0" x2="44" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
      </g>
      <g id="gate-lead-out-inv">
        <circle cx="28" cy="0" r="4" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
        <line x1="32" y1="0" x2="44" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
      </g>

      <!-- ── shared bodies ── -->
      <path id="gate-and-body" d="M -8,-16 L 8,-16 A 16,16 0 0 1 8,16 L -8,16 Z"
        fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
      <path id="gate-or-body" d="M -8,-16 Q 8,-16 24,0 Q 8,16 -8,16 Q 1,0 -8,-16 Z"
        fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
      <path id="gate-tri-body" d="M -8,-16 L -8,16 L 24,0 Z"
        fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />

      <!-- ── composed gates (traditional symbols only — this quiz never
           asks about IEC shapes) ── -->
      <g id="gate-and-trad"><use href="#gate-lead-in2" /><use href="#gate-and-body" /><use href="#gate-lead-out" /></g>
      <g id="gate-or-trad"><use href="#gate-lead-in2-or" /><use href="#gate-or-body" /><use href="#gate-lead-out" /></g>
      <g id="gate-nor-trad"><use href="#gate-lead-in2-or" /><use href="#gate-or-body" /><use href="#gate-lead-out-inv" /></g>
      <g id="gate-not-trad"><use href="#gate-lead-in1" /><use href="#gate-tri-body" /><use href="#gate-lead-out-inv" /></g>

      <!-- ── Q1-Q8 Z = OR( NOR(A,B), AND(B, NOT(C)) ) — 4 gates across up
           to 3 levels deep (A/B's path is 2 levels via NOR->OR; C's path
           is 3 levels via NOT->AND->OR). B is tapped (junction dot) to
           feed both the NOR gate and, further down, the AND gate.

           All the wiring/gates live once in combo-4gate-base (not used
           directly by any question — no A/B/C or W/X/Y text of its own).
           combo-4gate-generic (Q1-Q4, staged) and combo-4gate/-ex2/-ex3/
           -ex4 (Q5-Q8, one fixed-value example each) all just <use> that
           base and add their own input labels — this keeps every variant
           permanently in sync; a wiring fix only ever needs to happen in
           one place instead of five. ── -->
      <g id="combo-4gate-base">
        <!-- ══ A → NOR gate top input ══ -->
        <line x1="-15" y1="-41.2" x2="66.4" y2="-41.2" style="stroke: var(--colour-series)" stroke-width="2" />

        <!-- ══ B → NOR gate bottom input, tapped (dot) down to also feed the AND gate's top input ══ -->
        <line x1="-15" y1="-18.8" x2="66.4" y2="-18.8" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="45" cy="-18.8" r="3" style="fill: var(--colour-series)" />
        <line x1="45" y1="-18.8" x2="45" y2="13.8" style="stroke: var(--colour-series)" stroke-width="2" />
        <line x1="45" y1="13.8" x2="196.4" y2="13.8" style="stroke: var(--colour-series)" stroke-width="2" />

        <g transform="translate(100,-30) scale(1.4)"><use href="#gate-nor-trad" /></g>

        <!-- ══ C → NOT gate input ══ -->
        <line x1="-15" y1="50" x2="73.6" y2="50" style="stroke: var(--colour-series)" stroke-width="2" />

        <g transform="translate(100,50) scale(1.1)"><use href="#gate-not-trad" /></g>

        <!-- ══ NOT gate output (X) → AND gate bottom input (bend) ══ -->
        <line x1="148.4" y1="50" x2="148.4" y2="36.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <line x1="148.4" y1="36.2" x2="196.4" y2="36.2" style="stroke: var(--colour-series)" stroke-width="2" />

        <g transform="translate(230,25) scale(1.4)"><use href="#gate-and-trad" /></g>

        <!-- ══ NOR gate output (W) → OR gate top input (bend) ══ -->
        <line x1="161.6" y1="-30" x2="161.6" y2="-11.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <line x1="161.6" y1="-11.2" x2="306.4" y2="-11.2" style="stroke: var(--colour-series)" stroke-width="2" />

        <!-- ══ AND gate output (Y) → OR gate bottom input (bend) ══ -->
        <line x1="291.6" y1="25" x2="291.6" y2="11.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <line x1="291.6" y1="11.2" x2="306.4" y2="11.2" style="stroke: var(--colour-series)" stroke-width="2" />

        <g transform="translate(340,0) scale(1.4)"><use href="#gate-or-trad" /></g>

        <!-- ══ OR gate output → Z ══ -->
        <line x1="401.6" y1="0" x2="430" y2="0" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="430" cy="0" r="3" style="fill: var(--colour-signal)" />
        <text x="436" y="8" font-size="24" font-weight="bold" style="fill: var(--colour-signal)">Z</text>
      </g>

      <!-- Q1-Q4: base wiring + plain A/B/C labels + W/X/Y stage labels. -->
      <g id="combo-4gate-generic">
        <use href="#combo-4gate-base" />
        <text x="-18" y="-41.2" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">A</text>
        <text x="-18" y="-18.8" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">B</text>
        <text x="172" y="-24" font-size="18" font-weight="bold" style="fill: var(--colour-signal)">W</text>
        <text x="-18" y="50" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">C</text>
        <text x="155" y="60" font-size="18" font-weight="bold" style="fill: var(--colour-signal)">X</text>
        <text x="305" y="35" text-anchor="middle" font-size="18" font-weight="bold" style="fill: var(--colour-signal)">Y</text>
      </g>

      <!-- Q5: same base wiring as combo-4gate-generic, fixed A/B/C values
           baked into the labels and no W/X/Y stage labels. -->
      <g id="combo-4gate">
        <use href="#combo-4gate-base" />
        <text x="-18" y="-41.2" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">A = 0</text>
        <text x="-18" y="-18.8" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">B = 1</text>
        <text x="-18" y="50" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">C = 0</text>
      </g>

      <!-- Q6/Q7: same base wiring again, two more fixed A/B/C combinations
           to reinforce the technique with different values (not just a
           repeat of Q5's own inputs). Q8 (below, combo-4gate-ex4) reuses
           the same A=0/B=0 pair as Q7 but leaves C unspecified — that's
           deliberate, not a mistake. -->
      <g id="combo-4gate-ex2">
        <use href="#combo-4gate-base" />
        <text x="-18" y="-41.2" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">A = 1</text>
        <text x="-18" y="-18.8" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">B = 1</text>
        <text x="-18" y="50" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">C = 1</text>
      </g>
      <g id="combo-4gate-ex3">
        <use href="#combo-4gate-base" />
        <text x="-18" y="-41.2" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">A = 0</text>
        <text x="-18" y="-18.8" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">B = 0</text>
        <text x="-18" y="50" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">C = 1</text>
      </g>

      <!-- Q8: A and B fixed, C deliberately left unspecified ("C = ?") —
           the question is about recognising Z doesn't depend on C at all
           in this case, not about computing Z from a concrete C. -->
      <g id="combo-4gate-ex4">
        <use href="#combo-4gate-base" />
        <text x="-18" y="-41.2" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">A = 0</text>
        <text x="-18" y="-18.8" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">B = 0</text>
        <text x="-18" y="50" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">C = ?</text>
      </g>
    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="Truth Tables"></div>
  <header>
    <h1>Digital Electronics</h1>
    <p>Practice · Staged Truth-Table Build-Up · 4-Gate Combinational Circuit</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <!-- LEFT: static reference circuit (every question here uses one). -->
    <div class="circuit-col">
      <div class="circuit-panel" style="cursor:default" id="circuitPanelDiv">
        <div class="panel-label" id="circuitRefLabel">Reference Circuit</div>
        <svg id="circuitRefSvg" viewBox="-75 -85 555 155" xmlns="http://www.w3.org/2000/svg" style="max-width:340px;margin:0 auto">
          <use id="circuitRefUse" href="#combo-4gate-generic" />
        </svg>
      </div>
    </div>

    <!-- RIGHT: question -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->
        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="bits-wrap" id="qTruth" style="display:none">
            <table class="bits-table">
              <thead>
                <tr id="truthGroupHeads"></tr>
                <tr id="truthColLabels"></tr>
              </thead>
              <tbody id="truthBody"></tbody>
            </table>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';

    // Fixed top header-row groups for the staged build-up questions
    // (Q1-Q4) — the same five labels stay put across all four, whichever
    // column is the fillable one for that particular question.
    const GATE4_HEADER_GROUPS = [
      { label: 'Inputs', span: 3 },
      { label: 'Stage 1', span: 1 },
      { label: 'Stage 2', span: 1 },
      { label: 'Stage 3', span: 1 },
      { label: 'Stage 4', span: 1 },
    ];
    // Per-stage logic for combo-4gate: Z = OR( NOR(A,B), AND(B, NOT(C)) ).
    // Kept as named functions (rather than inlined per question) since all
    // four staged questions and the final worked example need to compute
    // some prefix of this same chain.
    function GATE4_W(a, b) { return (a === 0 && b === 0) ? 1 : 0; }   // NOR(A,B)
    function GATE4_X(c) { return c === 1 ? 0 : 1; }                    // NOT(C)
    function GATE4_Y(b, x) { return (b === 1 && x === 1) ? 1 : 0; }    // AND(B,X)
    function GATE4_Z(w, y) { return (w === 1 || y === 1) ? 1 : 0; }    // OR(W,Y)

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see digital_knowledge_logic_gates.html's header comment
    // for the fuller field reference. This file adds one thing that file
    // doesn't need: leftPanel:'circuit' (circuitId/circuitLabel), a single
    // static reference diagram, borrowed from the BJT quizzes' pattern.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: build up the truth table for a 4-gate combinational
        // circuit one gate-stage at a time — the same in-class technique
        // used for a simpler 3-gate circuit in the main Combinational
        // Logic knowledge quiz, applied here to a network with two
        // separate paths that only converge at the final gate. Closes
        // with one worked example (below) using fixed input values, the
        // same single-pass check used throughout this site's
        // combinational-logic quizzes. Only B and A feed the first (NOR)
        // gate, so only those two columns are highlighted — C isn't
        // needed yet.
        circuitId: 'combo-4gate-generic',
        circuitLabel: '4-Gate Combinational Circuit',
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A'],
        highlightLabels: () => ['B', 'A'],
        groupBreakAfter: () => [2],
        headerGroups: () => GATE4_HEADER_GROUPS,
        outputLabel: () => 'W',
        trailingLabels: () => ['X', 'Y', 'Z'],
        text: () => 'Using columns <b style="color:var(--colour-ui-primary)">B</b> and <b style="color:var(--colour-ui-primary)">A</b>, work out <b style="color:var(--colour-ui-primary)">W</b> — output of the <b style="color:var(--colour-bjt)">NOR gate</b>.',
        hint: () => 'W is NOR(A,B) — the opposite of OR: W is 1 only when BOTH A and B are 0. C doesn\'t feed this gate at all.',
        options: () => buildStagedRows(
          (c, b, a) => [],
          (c, b, a) => GATE4_W(a, b),
          () => [null, null, null]
        ),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">W = NOR(A, B):</div>
    <div class="working-line">A NOR gate is an OR gate with its output inverted. W is <b style="color:var(--colour-ui-correct)">1</b> only when both A and B are 0 — any other combination makes the OR stage 1, which the NOR's bubble then flips to <b style="color:var(--colour-bjt)">0</b>.</div>
    ${truthMistakeLine('C B A', st)}`
      },
      {
        // Staged build-up 2 of 4 — an entirely separate path (C -> NOT)
        // that doesn't depend on W at all, despite W now being shown as a
        // read-only reference column alongside it.
        circuitId: 'combo-4gate-generic',
        circuitLabel: '4-Gate Combinational Circuit',
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A', 'W'],
        highlightLabels: () => ['C'],
        groupBreakAfter: () => [2],
        headerGroups: () => GATE4_HEADER_GROUPS,
        outputLabel: () => 'X',
        trailingLabels: () => ['Y', 'Z'],
        text: () => 'Using column <b style="color:var(--colour-ui-primary)">C</b>, work out <b style="color:var(--colour-ui-primary)">X</b> — output of the <b style="color:var(--colour-bjt)">NOT gate</b>.',
        hint: () => 'X is just NOT(C). A and B — and even W, which you just built — play no part in this gate at all.',
        options: () => buildStagedRows(
          (c, b, a) => [GATE4_W(a, b)],
          (c, b, a) => GATE4_X(c),
          () => [null, null]
        ),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">X = NOT(C):</div>
    <div class="working-line">The NOT gate simply inverts C — X is <b style="color:var(--colour-ui-correct)">1</b> when C is 0, and <b style="color:var(--colour-bjt)">0</b> when C is 1.</div>
    <div class="working-line" style="margin-top:.4rem">Notice this path doesn't touch A, B or W at all — it runs in parallel until the two paths finally meet at the last gate.</div>
    ${truthMistakeLine('C B A W', st)}`
      },
      {
        // Staged build-up 3 of 4 — the two paths start to merge: B (a raw
        // input, already known) combines with X (the path just built).
        circuitId: 'combo-4gate-generic',
        circuitLabel: '4-Gate Combinational Circuit',
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A', 'W', 'X'],
        highlightLabels: () => ['B', 'X'],
        groupBreakAfter: () => [2],
        headerGroups: () => GATE4_HEADER_GROUPS,
        outputLabel: () => 'Y',
        trailingLabels: () => ['Z'],
        text: () => 'Using <b style="color:var(--colour-ui-primary)">B</b> and the <b style="color:var(--colour-ui-primary)">X</b> (just built), work out <b style="color:var(--colour-ui-primary)">Y</b> — output of the <b style="color:var(--colour-bjt)">AND gate</b>.',
        hint: () => 'Y is B AND X. C and A already did their job upstream (feeding W and X), and W itself isn\'t needed until the very last gate.',
        options: () => buildStagedRows(
          (c, b, a) => { const w = GATE4_W(a, b); const x = GATE4_X(c); return [w, x]; },
          (c, b, a, extras) => GATE4_Y(b, extras[1]),
          () => [null]
        ),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">Y = B AND X:</div>
    <div class="working-line">Y is <b style="color:var(--colour-ui-correct)">1</b> only on rows where both B and X are 1 — every other row gives <b style="color:var(--colour-bjt)">0</b>.</div>
    ${truthMistakeLine('C B A W X', st)}`
      },
      {
        // Staged build-up 4 of 4 — the final OR gate only depends on W
        // and Y; X did its job feeding Y and isn't connected here.
        circuitId: 'combo-4gate-generic',
        circuitLabel: '4-Gate Combinational Circuit',
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A', 'W', 'X', 'Y'],
        highlightLabels: () => ['W', 'Y'],
        groupBreakAfter: () => [2, 5],
        headerGroups: () => GATE4_HEADER_GROUPS,
        outputLabel: () => 'Z',
        text: () => 'Finally, use <b style="color:var(--colour-ui-primary)">W</b> and <b style="color:var(--colour-ui-primary)">Y</b> to work out <b style="color:var(--colour-ui-primary)">Z</b> — output of the final <b style="color:var(--colour-bjt)">NOT gate</b>.',
        hint: () => 'Z is W OR Y. X on its own isn\'t connected to this last gate — only Y, which already used X to get here.',
        options: () => buildStagedRows(
          (c, b, a) => { const w = GATE4_W(a, b); const x = GATE4_X(c); const y = GATE4_Y(b, x); return [w, x, y]; },
          (c, b, a, extras) => GATE4_Z(extras[0], extras[2])
        ),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">Z = W OR Y:</div>
    <div class="working-line">Z is <b style="color:var(--colour-ui-correct)">1</b> whenever W is 1, Y is 1, or both — and <b style="color:var(--colour-bjt)">0</b> only when both W and Y are 0.</div>
    ${truthMistakeLine('C B A W X Y', st)}`
      },
      {
        // Objective: predict the output for given fixed input values —
        // same network as the staged build-up above, worked in a single
        // pass without the scaffolding, matching how digital_knowledge_
        // logic_combos.html follows its own staged sequences with a
        // fixed-value predict-output question.
        circuitId: 'combo-4gate',
        circuitLabel: '4-Gate Combinational Circuit',
        text: () => 'For the circuit shown, with <span style="color:var(--colour-signal)">A = 0</span>, <span style="color:var(--colour-signal)">B = 1</span> and <span style="color:var(--colour-signal)">C = 0</span>, what is the output <span style="color:var(--colour-signal)">Z</span>?',
        hint: () => 'Work through both paths separately first — NOR(A,B) on top, NOT(C) then AND with B on the bottom — then combine them at the final OR gate.',
        options: () => shuffle([
          { label: '0', type: 'wrong' },
          { label: '1', type: 'correct' },
          { label: 'Cannot be determined — too many inputs for one output', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Z = 1</b>',
        working: () => `
    <div class="working-step">Top path — the NOR gate:</div>
    <div class="working-line">A NOR B = 0 NOR 1 = NOT(0 OR 1) = NOT(1) = <b style="color:var(--colour-bjt)">0</b> = W.</div>
    <div class="working-step" style="margin-top:.6rem">Bottom path — the NOT gate:</div>
    <div class="working-line">NOT(C) = NOT(0) = <b style="color:var(--colour-bjt)">1</b> = X.</div>
    <div class="working-step" style="margin-top:.6rem">Bottom path — the AND gate:</div>
    <div class="working-line">B AND X = 1 AND 1 = <b style="color:var(--colour-bjt)">1</b> = Y.</div>
    <div class="working-step" style="margin-top:.6rem">Final — the OR gate:</div>
    <div class="working-line">W OR Y = 0 OR 1 = <b style="color:var(--colour-ui-correct)">1</b> = Z.</div>
    <div class="working-line" style="margin-top:.4rem">Two separate paths, each with their own gates, that only combine at the very last step — trace each one all the way through before combining them.</div>`
      },
      {
        // Objective: same technique as Q5, reinforced with a second set
        // of input values — deliberately chosen so every stage (W, X, Y,
        // Z) lands on 0, the opposite spread from Q5's mix of 0s and 1s.
        circuitId: 'combo-4gate-ex2',
        circuitLabel: '4-Gate Combinational Circuit',
        text: () => 'Same circuit, different inputs. With <span style="color:var(--colour-signal)">A = 1</span>, <span style="color:var(--colour-signal)">B = 1</span> and <span style="color:var(--colour-signal)">C = 1</span>, what is the output <span style="color:var(--colour-signal)">Z</span>?',
        hint: () => 'Work through both paths separately first — NOR(A,B) on top, NOT(C) then AND with B on the bottom — then combine them at the final OR gate.',
        options: () => shuffle([
          { label: '0', type: 'correct' },
          { label: '1', type: 'wrong' },
          { label: 'Cannot be determined — too many inputs for one output', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Z = 0</b>',
        working: () => `
    <div class="working-step">Top path — the NOR gate:</div>
    <div class="working-line">A NOR B = 1 NOR 1 = NOT(1 OR 1) = NOT(1) = <b style="color:var(--colour-bjt)">0</b> = W.</div>
    <div class="working-step" style="margin-top:.6rem">Bottom path — the NOT gate:</div>
    <div class="working-line">NOT(C) = NOT(1) = <b style="color:var(--colour-bjt)">0</b> = X.</div>
    <div class="working-step" style="margin-top:.6rem">Bottom path — the AND gate:</div>
    <div class="working-line">B AND X = 1 AND 0 = <b style="color:var(--colour-bjt)">0</b> = Y.</div>
    <div class="working-step" style="margin-top:.6rem">Final — the OR gate:</div>
    <div class="working-line">W OR Y = 0 OR 0 = <b style="color:var(--colour-bjt)">0</b> = Z.</div>
    <div class="working-line" style="margin-top:.4rem">Every stage happens to land on 0 this time — don't let that make you second-guess a correctly-traced 0 just because Q5's answer was 1.</div>`
      },
      {
        // Objective: same technique again, a third input combination —
        // this time only the top (NOR) path is actually responsible for
        // Z; the bottom path computes all the way through to Y but Y
        // turns out to be 0, so it doesn't end up mattering. Reinforces
        // that OR only needs ONE side to be 1.
        circuitId: 'combo-4gate-ex3',
        circuitLabel: '4-Gate Combinational Circuit',
        text: () => 'One more set of inputs. With <span style="color:var(--colour-signal)">A = 0</span>, <span style="color:var(--colour-signal)">B = 0</span> and <span style="color:var(--colour-signal)">C = 1</span>, what is the output <span style="color:var(--colour-signal)">Z</span>?',
        hint: () => 'Work through both paths separately first — NOR(A,B) on top, NOT(C) then AND with B on the bottom — then combine them at the final OR gate.',
        options: () => shuffle([
          { label: '0', type: 'wrong' },
          { label: '1', type: 'correct' },
          { label: 'Cannot be determined — too many inputs for one output', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Z = 1</b>',
        working: () => `
    <div class="working-step">Top path — the NOR gate:</div>
    <div class="working-line">A NOR B = 0 NOR 0 = NOT(0 OR 0) = NOT(0) = <b style="color:var(--colour-ui-correct)">1</b> = W.</div>
    <div class="working-step" style="margin-top:.6rem">Bottom path — the NOT gate:</div>
    <div class="working-line">NOT(C) = NOT(1) = <b style="color:var(--colour-bjt)">0</b> = X.</div>
    <div class="working-step" style="margin-top:.6rem">Bottom path — the AND gate:</div>
    <div class="working-line">B AND X = 0 AND 0 = <b style="color:var(--colour-bjt)">0</b> = Y.</div>
    <div class="working-step" style="margin-top:.6rem">Final — the OR gate:</div>
    <div class="working-line">W OR Y = 1 OR 0 = <b style="color:var(--colour-ui-correct)">1</b> = Z.</div>
    <div class="working-line" style="margin-top:.4rem">This time the top path alone decides the answer — Y is 0, so it contributes nothing, but Z is still 1 because OR only needs <em>one</em> side to be 1.</div>`
      },
      {
        // Objective: conceptual follow-up to Q7 — instead of computing Z
        // from a concrete C, recognise that with A=0 and B=0 specifically,
        // Z doesn't depend on C AT ALL, and explain why. This is the same
        // OR-absorption idea Q7's working already highlighted (W=1 alone
        // forces Z=1), now asked directly as the point of the question
        // rather than as a side note.
        circuitId: 'combo-4gate-ex4',
        circuitLabel: '4-Gate Combinational Circuit',
        text: () => 'With <span style="color:var(--colour-signal)">A = 0</span> and <span style="color:var(--colour-signal)">B = 0</span>, <b style="color:var(--colour-ui-primary)">C</b> has deliberately been left blank. <b style="color:var(--colour-ui-primary)">Why</b> does it not matter what <b style="color:var(--colour-ui-primary)">C</b> is in this situation?',
        hint: () => 'Start by working out W using only A and B — does that result alone already tell you what Z has to be, before C even gets a chance to matter?',
        options: () => shuffle([
          { label: 'C is irrelevant due to it being passed into a NOT gate. NOT gates are not considered in the final output.', type: 'wrong' },
          { label: 'Two wrongs always make a right.', type: 'wrong' },
          { label: 'With both A and B being 0, the output of the NOR gate is 1.  That 1 feeds directly into the final OR gate.  If either input of a OR gate is 1, the output is always 1.', type: 'correct' },
          { label: 'B is already supplying a value to the AND gate', type: 'wrong' },
        ]),
        correctExplain: () => 'The NOR gate\'s output alone already forces <b>Z = 1</b>',
        working: () => `
    <div class="working-step">Work out W first:</div>
    <div class="working-line">A NOR B = 0 NOR 0 = NOT(0 OR 0) = NOT(0) = <b style="color:var(--colour-ui-correct)">1</b> = W.</div>
    <div class="working-step" style="margin-top:.6rem">That's already enough to know Z:</div>
    <div class="working-line">Z = W OR Y. Once W is 1, <b>Z = 1 OR Y = 1</b> no matter what Y turns out to be — and Y is the only place C's path (NOT → AND) can possibly reach the output. C genuinely cannot change the answer here.</div>
    <div class="working-step" style="margin-top:.6rem">Why the other options fall short:</div>
    <div class="working-line">Being fed into a NOT gate doesn't make a signal irrelevant — a NOT gate inverts its input, it doesn't discard it; C = 0 and C = 1 give different X values either way. "If B = 0, C is never used" and "B is already supplying a value to the AND gate" are both circling the right gate (they correctly notice B = 0 forces the AND gate's own output to 0, regardless of C) — but neither one finishes the job by tracing that result on to the <em>final</em> OR gate, which is the actual reason Z is fixed. Notice this also means C would still matter with a different A — e.g. A = 1, B = 0 makes W = 0, and now Z = W OR Y really would depend on C again.</div>`
      },
    ];

    // Builds the staged build-up-the-truth-table rows (Q1-Q4) — always the
    // same 8 rows in C,B,A counting order (unlike a free-bit-per-column
    // generator, these extra columns are DERIVED from c,b,a — e.g.
    // W = NOR(A,B) — so they must stay fixed per row rather than varying
    // independently). `extraFn(c,b,a)` returns the array of already-known
    // staged column values to display; `zFn(c,b,a,extras)` returns the
    // correct value for the one fillable column this question is asking
    // for. `trailingFn(c,b,a,extras,z)` (optional) returns further
    // already-known columns to display AFTER the fillable one — read-only
    // reference values, shown the same plain way as the given inputs
    // (used by Q1 to preview X/Y/Z ahead of time).
    function buildStagedRows(extraFn, zFn, trailingFn) {
      const rows = [];
      for (let v = 0; v < 8; v++) {
        const c = (v >> 2) & 1, b = (v >> 1) & 1, a = v & 1;
        const extras = extraFn(c, b, a);
        const z = zFn(c, b, a, extras);
        const trailing = trailingFn ? trailingFn(c, b, a, extras, z) : [];
        rows.push({ inputs: [c, b, a, ...extras], z, trailing });
      }
      return rows;
    }

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
