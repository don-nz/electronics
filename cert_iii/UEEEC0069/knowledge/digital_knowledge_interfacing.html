<!--
  Section 9 — "Interfacing techniques" lesson objectives (photographed
  textbook pages, 10 objectives): describe the need for interfacing
  circuitry; identify BJT/MOSFET buffer/driver circuits and explain their
  operation; choose suitable replacement components for a faulty buffer/
  driver circuit; state two devices providing electrical isolation; identify
  isolation circuits and describe their operation; identify switch-to-input
  circuits; describe switch bounce; identify RC debounce circuits with
  hysteresis; identify comparator circuits for transducer interfacing; use a
  DMM to test interfacing circuits.

  The final objective (DMM bench measurement) is deliberately DEFERRED —
  needs physical hardware, matching the exact same split already established
  by digital_knowledge_logic_families.html/digital_knowledge_digital_
  displays.html for their own bench-measurement objectives. The remaining 9
  objectives are covered across Q1-19.

  Q2-Q12 all reference ONE persistent circuit diagram — Figure 3 from the
  photographed Section 9-4/9-5 pages (a 74LS NAND gate driving a BC547 BJT,
  which switches a 12V/360mW lamp) — reusing the teacher's own worked
  example verbatim: IC=IL=PL/VL=30mA, IB(min)=IC/β=300µA (β=100, a
  deliberately worst-case low figure for the BC547's 110-800 range),
  IR1=(VOH−VBE)/R1=309µA (confirming R1=6k8 is appropriate since
  IR1>IB(min)), the 74LS's own IOH=400µA capability check, and
  PQ1=IC×VCE(sat)=30mA×0.6V=18mW against the BC547's 500mW rating. Q7
  (worst-case design philosophy) and Q10 (VCE(sat)/suitability) both quote
  the source text's own explicit reasoning for why VOH/β=100/VCE(sat) were
  chosen over "typical" figures, rather than inventing new content.

  The circuit's symbols are copied directly from this project's own master
  shape files (self-contained per-file, since cross-file <use>/fetch() is
  blocked under file://): gate-nand-trad from logic-gates.svg, bjt-npn-shape
  from bjt-symbols.svg, resistor-box-shape/ground-shape from circuit-
  components.svg. Two genuinely new shapes — lamp-shape and switch-spst-
  shape — were added to circuit-components.svg itself first (reusable,
  generic passive components, same footing as the existing battery/resistor/
  ground shapes there) rather than staying one-off.

  Q14/Q15 (relay/optocoupler operation) and Q17 (comparator) each use a
  small self-contained inline <svg> built fresh directly in that question's
  own text() string — same "prove it once before promoting" precedent as
  digital_knowledge_digital_displays.html's own Q1 LED symbol: these
  compound symbols (coil+isolated-contacts, LED+phototransistor+isolation
  boundary, op-amp comparator triangle) are specific to this one topic and
  not yet proven to recur, unlike lamp/switch which are generic enough to
  earn a shared home immediately.

  Data-driven QUESTIONS[] engine, using 'multi' (Q7, Q13) — no 'match'/
  'fill'/'bits'/'truth', nothing here needs those mechanics.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine from the
  start (project convention for all new quizzes) — just the standard
  QUESTIONS[] data and the trailing initQuizNav()/resetQuiz()/
  initQuizFromURL() bootstrap. leftPanel:'circuit' is static throughout
  (no per-question circuit swapping — one diagram serves Q2-Q12).
-->

    const QUESTIONS = [
      {
        text: () => 'Why can\'t a logic gate\'s output usually drive a lamp, motor, or relay coil DIRECTLY?',
        hint: () => 'Think about what a logic gate output can actually provide, in terms of both current and voltage, compared to what a typical DC load needs.',
        options: () => shuffle([
          { label: 'A logic gate\'s output can only source/sink a small current at a fixed low voltage — nowhere near enough for a typical DC load\'s current or voltage requirements', type: 'correct' },
          { label: 'Logic gates can only output AC signals, never a steady DC level', type: 'wrong' },
          { label: 'A logic gate has no output at all until an external transistor is added', type: 'wrong' },
          { label: 'Connecting any load directly to a logic gate immediately destroys it', type: 'wrong' },
        ]),
        correctExplain: () => 'Logic outputs can\'t supply the current/voltage a typical DC load needs',
        working: () => `
    <div class="working-line">Digital control systems (logic gates, microprocessors) are designed to switch other <em>logic-level</em> signals — small currents, low voltages. Real-world loads like lamps, motors, solenoids and relay coils typically need far more current, and sometimes a completely different supply voltage, than a logic output was ever designed to provide.</div>
    <div class="working-total">Interfacing circuitry bridges that gap: it lets a small, safe logic-level signal control a much larger load current/voltage without exceeding the logic device's own ratings.</div>`

        leftPanel: 'circuit',
        text: () => 'In Figure 3, what is the role of <b class="colour-resistor">R1</b>?',
        hint: () => 'R1 sits directly in the path of the current flowing INTO the BJT\'s base.',
        options: () => shuffle([
          { label: 'It limits the <b class="colour-current">base current</b> flowing into <b class="colour-bjt">Q1</b> to a safe, controlled value', type: 'correct' },

          { label: 'It protects the <b>74LS</b> gate\'s output from the 12 V rail', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">R1</b> limits the <b class="colour-current">base current</b> into <b class="colour-bjt">Q1</b>',
        working: () => `
    <div class="working-line">R1 sits between the logic gate's output and <b class="colour-bjt">Q1</b>'s base. If R1 were too small, excessive base current could flow and stress both the gate output and the BJT; if it's too big, it won't let enough base current flow to fully turn Q1 on — which in turn limits how much <b class="colour-current">collector current</b> the lamp can draw. Checking R1's value is exactly how this circuit is verified in the following questions.</div>`
      },
      {
        leftPanel: 'circuit',
        text: () => 'Why does the <b style="color:var(--colour-signal)">lamp</b> itself NOT need its own series current-limiting resistor, the way an LED would?',
        hint: () => 'Think about what determines a DC load\'s own operating current, compared to an LED.',
        options: () => shuffle([
          { label: 'DC loads like lamps, motors and relays have their own internal resistance and are self-limiting in terms of their own operating current — a series resistor is unnecessary', type: 'correct' },
          { label: 'The lamp is rated for an unlimited current', type: 'wrong' },
          { label: 'The <b class="colour-bjt">BJT</b> itself acts as the lamp\'s current-limiting resistor', type: 'wrong' },
          { label: 'A 12 V lamp never actually draws any current', type: 'wrong' },
        ]),
        correctExplain: () => 'DC loads are <b>self-limiting</b> — they set their own operating current',
        working: () => `
    <div class="working-line">An LED is a very low-resistance junction device — without an external series resistor, it would try to draw far more current than it can survive. A lamp, motor or relay coil is different: it has its own real operating resistance, so its own current is already set by its own construction and its rated supply voltage. That's also why these DC loads don't need to be connected to the logic device's own supply rail at all — they can run from any convenient supply voltage.</div>`
      },
      {
        leftPanel: 'circuit',
        text: () => 'The lamp is rated <b style="color:var(--colour-signal)">360 mW</b> at <b style="color:var(--colour-signal)">12 V</b>. Using <b class="colour-current">I<sub>C</sub></b> = <b class="colour-current">I<sub>L</sub></b> = P<sub>L</sub>/V<sub>L</sub>, what is <b class="colour-current">I<sub>C</sub></b>?',
        hint: () => 'Just Ohm\'s-law-style power/voltage division — no BJT properties needed yet.',
        options: () => shuffle([
          { label: `<b class="colour-current">I<sub>C</sub></b> = ${frac('360 mW', '12 V')} = <b>30 mA</b>`, type: 'correct' },
          { label: `<b class="colour-current">I<sub>C</sub></b> = ${frac('12 V', '360 mW')} ≈ <b>33.3 mA<sup>-1</sup></b>`, type: 'wrong' },
          { label: `<b class="colour-current">I<sub>C</sub></b> = 360 mW × 12 V = <b>4.32 W</b>`, type: 'wrong' },
