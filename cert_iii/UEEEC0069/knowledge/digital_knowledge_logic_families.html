<!--
  Week 5 — "Logic Families" lesson objectives (photographed lesson-note
  page, 13 objectives): identify logic family/sub-family from part number;
  state TTL/CMOS power-supply requirements; define propagation delay,
  power dissipation, max clock speed, fanout, unit load and noise margin;
  identify those characteristics for commercial TTL/CMOS given data;
  identify TTL sub-family advantages/disadvantages given data; state
  TTL-vs-CMOS advantages/disadvantages given data; identify input/output
  voltage & current specs for TTL/CMOS given data; recall 74ALS/4000-series
  voltage specs from memory (no data given); define sinking/sourcing;
  choose an appropriate substitute IC given data; recognise TTL/4000-series
  CMOS are not readily compatible; identify TTL→CMOS interfacing
  strategies; use a DMM/logic probe to test mixed-family circuits.

  The final objective (DMM/logic-probe bench measurement) is deliberately
  DEFERRED — needs physical hardware, matching the same split already
  established by digital_knowledge_logic_combos.html (fault-finding
  objectives) and digital_knowledge_boolean_algebra.html (its own DMM/
  logic-probe objective). The remaining 12 objectives are all genuinely
  testable as knowledge/data-interpretation questions, so all 12 are
  covered here (Q1-Q16 — several objectives get 2 questions: part-number
  identification, datasheet timing/power reading, TTL-vs-CMOS advantages/
  disadvantages, and recalling standard voltage specs each split across a
  TTL question and a CMOS question).

  Filename note: this file replaces an empty placeholder that had been
  created as "ditital_knowledge_logic_families.html" (typo) — renamed to
  match every other file's "digital_knowledge_*" convention; the old
  empty stub was never linked from anywhere, so nothing else needed
  updating for the rename itself.

  UNLIKE every other digital_knowledge_*.html file, this quiz has NO
  circuit diagrams, gate shapes, or any SVG content at all — "logic
  families" is about IC nomenclature, datasheet specs, and interfacing,
  none of which has a natural circuit-diagram reference. So the whole
  circuit-panel/leftPanel apparatus (circuitId, circuitRefSvg, the hidden
  defs <svg>, swapLeftPanel) that every sibling file carries has been
  left out entirely, matching the project's "only carry the engine
  features actually used" convention (see digital_knowledge_boolean_
  algebra.html's own header comment for the same principle applied to
  kind:'truth'/'bits'). This file is permanently single-column.

  Data-driven QUESTIONS[] engine, trimmed to only 'multi' and 'match'
  (kind:'match' ported from digital_knowledge_logic_gates.html/boolean_
  algebra.html — columns() here are plain STRINGS, not {shapeId}, since
  there's nothing to draw; renderMatch() already supports either). No
  'truth' or 'bits' kind — nothing in this quiz produces a table of
  0s/1s to fill in.

  Two questions (Q5, Q10) embed a small fictional datasheet excerpt using
  quiz-common.css's shared .mock-datasheet component (same "Meridian
  Semiconductor" branding as bjt_knowledge_basics.html's own datasheet
  card) — a plain HTML table inside .mock-datasheet-legend, since that
  component has no dedicated table sub-class of its own.

  Numeric values used throughout (TTL: VIH=2.0V/VIL=0.8V/VOH=2.4-2.7V/
  VOL=0.4-0.5V; CMOS 4000-series: VIH≈0.7×VDD/VIL≈0.3×VDD/VOH≈VDD/VOL≈0V,
  3-15V supply range; TTL sub-family tpd/power figures for 74/74LS/74S/
  74ALS) are the standard, widely-taught textbook figures for these
  families (the same numbers found in Floyd's Digital Fundamentals and
  equivalent texts) — presented as "typical/standard" values for teaching
  purposes, not a specific manufacturer's exact datasheet decimals.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine. Simplest
  migration in the project so far — no circuit panel, no shapeGrid, no
  configurable globals needed at all; just the standard multi/match
  QUESTIONS[] data and the trailing initQuizNav()/resetQuiz()/
  initQuizFromURL() bootstrap.
-->

<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"

<body>
  <div class="crumb" id="crumb" data-current="Logic Families"></div>
  <header>
    <h1>Digital Electronics</h1>
    <p>Conceptual Questions · Logic Families · TTL &amp; CMOS · Datasheets &amp; Interfacing</p>
  </header>

  <div class="quiz-wrap single-col" id="quizWrap">

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->
        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>

              <div class="q-text" id="qText"></div>

          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>

  </div>

  <script>
    function dsTable(rows, cols) {
      return `<table class="ds-table"><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${
        rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')
      }</tbody></table>`;
    }
    const TIMING_DATASHEET = `
    <div class="mock-datasheet">
      <div class="mock-datasheet-header">
        <span class="mock-datasheet-brand">MERIDIAN SEMICONDUCTOR</span>
        <span class="mock-datasheet-partno">MS7400 · QUAD 2-INPUT NAND GATE</span>
      </div>
      <div class="mock-datasheet-legend">${dsTable([
        ['74 (Standard)', '10 ns', '10 mW'],
        ['74LS', '9 ns', '2 mW'],
        ['74ALS', '4 ns', '1.2 mW'],
      ], ['Sub-family', 't<sub>pd</sub> (typ)', 'Power / gate'])}</div>
    </div>`;
    const ELECTRICAL_DATASHEET = `
    <div class="mock-datasheet">
      <div class="mock-datasheet-header">
        <span class="mock-datasheet-brand">MERIDIAN SEMICONDUCTOR</span>
        <span class="mock-datasheet-partno">MS7400-ALS · ELECTRICAL CHARACTERISTICS (V<sub>CC</sub> = 5 V)</span>
      </div>
      <div class="mock-datasheet-legend">${dsTable([
        ['V<sub>OH</sub> (min)', '2.7 V'],
        ['V<sub>OL</sub> (max)', '0.5 V'],
        ['I<sub>OH</sub> (max)', '−0.4 mA'],
        ['I<sub>OL</sub> (max)', '8 mA'],
      ], ['Parameter', 'Value'])}</div>
    </div>`;

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — 'multi' and 'match' only (see file header comment for why
    // 'truth'/'bits' and the whole circuit-panel apparatus are absent here).
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: identify logic family/sub-family from part number (TTL side).
        text: () => 'A datasheet lists a quad AND gate under part number <b class="colour-signal">74ALS08</b>. What logic family and sub-family does this belong to?',
        hint: () => 'The "74" prefix always means TTL. The letters between "74" and the function number identify the specific TTL sub-family.',
        options: () => shuffle([
          { label: 'TTL — Advanced Low-power Schottky (ALS)', type: 'correct' },
          { label: 'CMOS — 4000 series', type: 'wrong' },
          { label: 'TTL — Low-power Schottky (LS)', type: 'wrong' },
          { label: 'CMOS — High-speed CMOS, TTL-compatible (HCT)', type: 'wrong' },
        ]),
        correctExplain: () => 'TTL — <b class="colour-gain">Advanced Low-power Schottky (ALS)</b>',
        working: () => `
    <div class="working-line">A "74" prefix is the standard marker for the <b class="colour-gain">TTL</b> family. The letters immediately after it (before the function number, "08") identify the sub-family — here, <b class="colour-gain">ALS</b> = Advanced Low-power Schottky.</div>
    <div class="working-total">CMOS parts use different numbering entirely: either the 4000-series (e.g. CD4011B) or a "74" prefix with CMOS-specific letters like HC/HCT — never bare "74" or "74LS/ALS/S", which are always TTL.</div>`
      },
      {
        // Objective: identify logic family/sub-family from part number (CMOS side, including the TTL-compatible HCT wrinkle).
        text: () => 'Now a different part number: <b class="colour-signal">74HCT00</b>. What family and sub-family is this?',
        hint: () => 'The "74" prefix is shared with TTL numbering here — but the letters tell a different story. HCT specifically stands for High-speed CMOS, TTL-compatible.',
        options: () => shuffle([
          { label: 'CMOS — High-speed CMOS with TTL-compatible inputs (HCT)', type: 'correct' },
          { label: 'TTL — High-speed (H)', type: 'wrong' },
          { label: 'CMOS — standard 4000-series (B)', type: 'wrong' },
          { label: 'TTL — Schottky (S)', type: 'wrong' },
        ]),
        correctExplain: () => 'CMOS — <b class="colour-gain">High-speed CMOS, TTL-compatible (HCT)</b>',
        working: () => `
    <div class="working-line">Despite sharing the "74" prefix with TTL numbering, <b class="colour-gain">HC</b> and <b class="colour-gain">HCT</b> parts are CMOS devices. <b class="colour-gain">HC</b> needs CMOS-level inputs; <b class="colour-gain">HCT</b> is the same CMOS internals but built to reliably recognise TTL-level input voltages — a detail that matters a lot later in this quiz, when TTL needs to drive a CMOS input.</div>
    <div class="working-total">This is different again from 4000-series CMOS (its own completely separate numbering, e.g. CD4011B) — three different numbering schemes can all describe CMOS parts.</div>`
      },
      {
        // Objective: state TTL/CMOS power-supply requirements.
        text: () => 'Which statement correctly compares the power-supply requirements of commercial-grade TTL and 4000-series CMOS?',
        hint: () => 'One of these families is built around a single fixed rail voltage; the other tolerates a much wider range.',
        options: () => shuffle([
          { label: 'TTL needs a fixed 5 V ±5% supply; 4000-series CMOS tolerates a much wider range, roughly 3 V to 15 V', type: 'correct' },
          { label: 'Both families tolerate the same wide 3–15 V supply range', type: 'wrong' },
          { label: 'TTL tolerates 3–15 V; 4000-series CMOS needs a fixed 5 V supply', type: 'wrong' },
          { label: 'Both families require a fixed 5 V ±5% supply', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-gain">TTL</b>: fixed 5 V ±5%. <b class="colour-gain">4000-series CMOS</b>: 3–15 V.',
        working: () => `
    <div class="working-line">TTL's internal switching thresholds are calibrated around a 5 V rail, so it needs that supply held within ±5% (4.75–5.25 V) to work reliably.</div>
    <div class="working-total">CMOS's complementary MOSFET switching structure scales with whatever supply it's given — its thresholds are a fraction of VDD, not a fixed voltage — so 4000-series CMOS happily runs anywhere from about 3 V to 15 V. This flexibility is one of CMOS's practical advantages.</div>`
      },
      {
        // Objective: define propagation delay, power dissipation, max clock
        // speed, fanout, unit load, noise margin.
        kind: 'match',
        columns: () => ['Propagation delay', 'Power dissipation', 'Max clock speed', 'Fanout', 'Unit load', 'Noise margin'],
        text: () => 'Match each performance characteristic to its correct definition.',
        hint: () => 'Two of these are about SPEED, two are about how many gates can be connected together, one is about POWER, and one is about immunity to unwanted noise.',
        options: () => shuffle([
          { label: 'The time delay between an input changing and the corresponding output responding', col: 0 },
          { label: 'The power a gate consumes while operating, usually quoted per gate at a stated supply voltage', col: 1 },
          { label: 'The highest clock frequency a device can reliably switch at', col: 2 },
          { label: 'The maximum number of standard inputs a single output can reliably drive', col: 3 },
          { label: 'A standardised reference amount of input loading current, used to express fanout as a number of "loads"', col: 4 },
          { label: 'The safety margin between a guaranteed output level and the minimum input level still recognised correctly — resistance to noise-induced errors', col: 5 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 6 correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} correctly matched`;
        },
        working: () => `
    <div class="working-line"><b class="colour-gain">Propagation delay</b> and <b class="colour-gain">max clock speed</b> are both about SPEED — how fast a gate responds, and how fast a whole device can be clocked before that delay causes errors.</div>
    <div class="working-line"><b class="colour-gain">Fanout</b> and <b class="colour-gain">unit load</b> go together — fanout is a number of "loads" a gate can drive, and a unit load is the standard reference current that number is counted in.</div>
    <div class="working-line"><b class="colour-gain">Power dissipation</b> is simply how much power each gate burns while running.</div>
    <div class="working-total"><b class="colour-gain">Noise margin</b> is the odd one out — it's not about speed, power, or loading at all, but about how much unwanted noise a signal can pick up before a receiving gate misreads it.</div>`
      },
      {
        // Objective: identify performance characteristics for commercial
        // TTL/CMOS given data (power dissipation half).
        text: () => `Using the datasheet excerpt below, which sub-family offers the LOWEST power dissipation per gate?${TIMING_DATASHEET}`,
        hint: () => 'Read the "Power / gate" column directly — no calculation needed, just find the smallest number.',
        options: () => shuffle([
          { label: '74ALS (1.2 mW)', type: 'correct' },
          { label: '74LS (2 mW)', type: 'wrong' },
          { label: '74 — Standard (10 mW)', type: 'wrong' },
          { label: 'All three are identical', type: 'wrong' },
        ]),
        correctExplain: () => '74ALS — 1.2 mW per gate, the lowest of the three.',
        working: () => `
    <div class="working-total">Reading straight off the table: 10 mW (Standard) → 2 mW (LS) → 1.2 mW (ALS). Each TTL generation trades some circuit complexity for lower power — ALS is the lowest of these three.</div>`
      },
      {
        // Objective: identify performance characteristics for commercial
        // TTL/CMOS given data (propagation delay half) — same table,
        // reinforcing that 74ALS wins on BOTH axes, not just one.
        text: () => `Same datasheet excerpt again: which sub-family has the FASTEST (shortest) propagation delay?${TIMING_DATASHEET}`,
        hint: () => 'Read the "tpd (typ)" column — smallest number wins.',
        options: () => shuffle([
          { label: '74ALS (4 ns)', type: 'correct' },
          { label: '74LS (9 ns)', type: 'wrong' },
          { label: '74 — Standard (10 ns)', type: 'wrong' },
          { label: 'They\'re all equally fast', type: 'wrong' },
        ]),
        correctExplain: () => '74ALS — 4 ns, the fastest of the three.',
        working: () => `
    <div class="working-total">Notice 74ALS wins on BOTH power (previous question) AND speed here — it isn't always a straight trade-off between the two. Advanced low-power Schottky processing genuinely improved both figures over standard TTL, which is exactly why it became such a popular general-purpose choice.</div>`
      },
      {
        // Objective: TTL sub-family advantages/disadvantages compared with each other.
        text: () => 'Compared with standard 74-series TTL, what is the key trade-off of the <b class="colour-gain">74S</b> (Schottky) sub-family?',
        hint: () => 'Schottky diodes inside the gate prevent transistor saturation, which is what makes this sub-family fast — but that circuitry isn\'t free.',
        options: () => shuffle([
          { label: 'Much faster switching, but noticeably higher power dissipation per gate', type: 'correct' },
          { label: 'Slower switching, but lower power dissipation', type: 'wrong' },
          { label: 'Faster switching AND lower power, with no trade-off at all', type: 'wrong' },
          { label: 'Identical speed and power to standard TTL', type: 'wrong' },
        ]),
        correctExplain: () => 'Much faster (≈3 ns), but noticeably more power-hungry (≈19 mW/gate).',
        working: () => `
    <div class="working-line">74S uses Schottky-clamped transistors to avoid the slow "saturation" delay that limits standard TTL, giving a big speed boost (roughly 3 ns vs standard TTL's ~10 ns).</div>
    <div class="working-total">That speed comes at a real power cost — around 19 mW per gate, almost double standard TTL. "Faster AND lower power with no trade-off" describes 74ALS (previous questions), not 74S — different sub-families sit at different points on the speed/power trade-off, and it's worth knowing which is which.</div>`
      },
      {
        // Objective: TTL-vs-CMOS advantages given data (general knowledge fact).
        text: () => 'Which of these is a genuine, well-known ADVANTAGE of CMOS logic over TTL?',
        hint: () => 'Think about what CMOS\'s complementary transistor pairs are doing when the output ISN\'T switching.',
        options: () => shuffle([
          { label: 'Vastly lower static power dissipation — CMOS draws almost no current when its outputs aren\'t switching', type: 'correct' },
          { label: 'CMOS is immune to electrostatic discharge (ESD) damage, unlike TTL', type: 'wrong' },
          { label: 'CMOS has a narrower, more restrictive supply voltage range than TTL', type: 'wrong' },
          { label: 'CMOS always switches faster than TTL at every clock speed', type: 'wrong' },
        ]),
        correctExplain: () => 'Vastly lower static (quiescent) power dissipation.',
        working: () => `
    <div class="working-total">CMOS's complementary pull-up/pull-down transistor pair means only ONE of the pair conducts in any steady state — almost no current flows except briefly while switching. TTL's internal transistors, by contrast, draw current continuously. This is CMOS's headline advantage, not immunity to ESD (the opposite is true — see the next question) or speed at every frequency (older CMOS was often slower than TTL; only more modern high-speed CMOS families close that gap).</div>`
      },
      {
        // Objective: TTL-vs-CMOS disadvantages given data.
        text: () => 'What is a well-known DISADVANTAGE of CMOS devices compared with TTL, particularly relevant when handling them?',
        hint: () => 'CMOS gate inputs present an extremely high impedance — that cuts both ways.',
        options: () => shuffle([
          { label: 'Their extremely high input impedance makes them vulnerable to damage from electrostatic discharge (ESD)', type: 'correct' },
          { label: 'They draw far more static current than TTL', type: 'wrong' },
          { label: 'They require a much more tightly regulated supply voltage than TTL', type: 'wrong' },
          { label: 'They cannot be used at low clock speeds', type: 'wrong' },
        ]),
        correctExplain: () => 'High input impedance leaves CMOS gate inputs vulnerable to ESD damage.',
        working: () => `
    <div class="working-total">The same extremely high input impedance that gives CMOS its low static power draw also means an input pin has almost no path to safely bleed away a static charge — a brief ESD event can punch through the gate's thin oxide layer and destroy it. This is exactly why CMOS parts are handled with anti-static precautions (wrist straps, conductive foam) that TTL doesn't need nearly as strictly.</div>`
      },
      {
        // Objective: input/output voltage & current specs given data.
        text: () => `Using the datasheet excerpt below, what is the maximum current this gate can SINK at its output while still guaranteeing a valid LOW?${ELECTRICAL_DATASHEET}`,
        hint: () => 'IOL is the current spec that applies while the output is LOW.',
        options: () => shuffle([
          { label: '8 mA (IOL max)', type: 'correct' },
          { label: '0.4 mA (IOH max)', type: 'wrong' },
          { label: '0.5 V (VOL max — a voltage, not a current)', type: 'wrong' },
          { label: '2.7 V (VOH min — a voltage, not a current)', type: 'wrong' },
        ]),
        correctExplain: () => 'I<sub>OL</sub>(max) = 8 mA.',
        working: () => `
    <div class="working-total">The subscript tells you which state each spec applies to: <b class="colour-current">I<sub>OL</sub></b> is the current rating while the output is LOW (sinking current in from the load), <b class="colour-current">I<sub>OH</sub></b> while it's HIGH (sourcing current out to the load). Reading the table directly: I<sub>OL</sub>(max) = 8 mA.</div>`
      },
      {
        // Objective: recall (not read from data) 74ALS/TTL voltage specs.
        text: () => 'Without referring to a datasheet: what are the STANDARD input threshold voltages for 74ALS-series (and TTL-compatible logic generally), at V<sub>CC</sub> = 5 V?',
        hint: () => 'These two numbers are worth memorising outright — they show up across almost every TTL-compatible family.',
        options: () => shuffle([
          { label: 'V<sub>IH</sub>(min) = 2.0 V, V<sub>IL</sub>(max) = 0.8 V', type: 'correct' },
          { label: 'V<sub>IH</sub>(min) = 3.5 V, V<sub>IL</sub>(max) = 1.5 V', type: 'wrong' },
          { label: 'V<sub>IH</sub>(min) = 0.8 V, V<sub>IL</sub>(max) = 2.0 V', type: 'wrong' },
          { label: 'V<sub>IH</sub>(min) = 5 V, V<sub>IL</sub>(max) = 0 V', type: 'wrong' },
        ]),
        correctExplain: () => 'V<sub>IH</sub>(min) = 2.0 V, V<sub>IL</sub>(max) = 0.8 V.',
        working: () => `
    <div class="working-total">Any input above 2.0 V is guaranteed to be read as HIGH; any input below 0.8 V is guaranteed to be read as LOW (the 0.8–2.0 V gap in between is the undefined region a valid logic signal should never sit in). Option B's numbers (3.5 V / 1.5 V) are the CMOS values, not TTL's — a common mix-up tested again in the next question.</div>`
      },
      {
        // Objective: recall 4000-series CMOS voltage specs from memory.
        text: () => 'And for 4000-series CMOS at V<sub>DD</sub> = 5 V — recalling the standard specs, not reading them off a sheet — approximately what are its input thresholds?',
        hint: () => 'CMOS input thresholds aren\'t fixed voltages like TTL\'s — they scale as a fraction of the supply rail.',
        options: () => shuffle([
          { label: 'V<sub>IH</sub>(min) ≈ 3.5 V (≈0.7×V<sub>DD</sub>), V<sub>IL</sub>(max) ≈ 1.5 V (≈0.3×V<sub>DD</sub>)', type: 'correct' },
          { label: 'V<sub>IH</sub>(min) = 2.0 V, V<sub>IL</sub>(max) = 0.8 V — identical to TTL', type: 'wrong' },
          { label: 'V<sub>IH</sub>(min) ≈ 1.5 V, V<sub>IL</sub>(max) ≈ 3.5 V', type: 'wrong' },
          { label: 'V<sub>IH</sub>(min) ≈ 4.95 V, V<sub>IL</sub>(max) ≈ 0.05 V', type: 'wrong' },
        ]),
        correctExplain: () => 'V<sub>IH</sub>(min) ≈ 3.5 V, V<sub>IL</sub>(max) ≈ 1.5 V at V<sub>DD</sub> = 5 V.',
        working: () => `
    <div class="working-line">CMOS thresholds scale with V<sub>DD</sub> rather than sitting at fixed voltages — roughly 70% of V<sub>DD</sub> for V<sub>IH</sub>(min) and 30% for V<sub>IL</sub>(max), which is why the same 4000-series part has DIFFERENT threshold voltages depending what supply it's run from.</div>
    <div class="working-total">Option D's numbers (≈4.95 V / ≈0.05 V) describe CMOS's OUTPUT levels, not inputs — CMOS outputs swing almost rail-to-rail, but its input thresholds sit further in from the rails, exactly as shown in the correct answer.</div>`
      },
      {
        // Objective: define sinking and sourcing.
        text: () => 'A logic output is HIGH, with current flowing OUT of the output pin into the load. Is this the gate SINKING or SOURCING current?',
        hint: () => 'Think of the pin as a source of water: is current flowing out of the tap, or draining down into it?',
        options: () => shuffle([
          { label: 'SOURCING — current flows out of the pin', type: 'correct' },
          { label: 'SINKING — current flows out of the pin', type: 'wrong' },
          { label: 'SOURCING — current flows into the pin', type: 'wrong' },
          { label: 'Neither term applies when the output is HIGH', type: 'wrong' },
        ]),
        correctExplain: () => 'SOURCING — the gate is supplying (sourcing) current out to the load.',
        working: () => `
    <div class="working-total"><b class="colour-current">Sourcing</b>: the output is HIGH, acting like a current source pushing current OUT into the load (this is what I<sub>OH</sub> specifies). <b class="colour-current">Sinking</b>: the output is LOW, and the load's current instead flows IN to the pin, down to ground inside the device (this is what I<sub>OL</sub> specifies — the same spec read off the datasheet a few questions ago).</div>`
      },
      {
        // Objective: choose an appropriate substitute given data.
        text: () => 'You need to replace a faulty <b class="colour-signal">74LS08</b> (quad 2-input AND gate) on an all-TTL board, want LOWER power consumption, and must keep the same pinout and function. Which is the most appropriate substitute?',
        hint: () => 'Staying within the same TTL family avoids any voltage-compatibility risk with the rest of the board — you just need a lower-power TTL sub-family with the same part number suffix.',
        options: () => shuffle([
          { label: '74ALS08 — same TTL family and function, in a lower-power sub-family', type: 'correct' },
          { label: '74HC08 — a general-purpose CMOS replacement', type: 'wrong' },
          { label: 'CD4081B — a 4000-series CMOS quad AND gate', type: 'wrong' },
          { label: '7408 — standard TTL', type: 'wrong' },
        ]),
        correctExplain: () => '74ALS08 — same family, same function, genuinely lower power.',
        working: () => `
    <div class="working-line">74ALS08 keeps the same function ("08" = quad 2-input AND) and the same TTL family, so it drops straight in with no voltage-compatibility concerns anywhere else on the board — and, as established earlier in this quiz, ALS is TTL's lowest-power sub-family.</div>
    <div class="working-total">The CMOS options (74HC08, CD4081B) aren't guaranteed to interface cleanly with the rest of an all-TTL board without extra care (see the next two questions) — and plain 7408 (standard TTL) is a valid function/pinout match, but doesn't achieve the lower-power goal at all.</div>`
      },
      {
        // Objective: recognise TTL and 4000-series CMOS are not readily compatible.
        text: () => 'Why are standard TTL outputs NOT reliably compatible with 4000-series CMOS inputs, even though both commonly run from a 5 V supply?',
        hint: () => 'Compare TTL\'s guaranteed HIGH output level against CMOS\'s HIGH input threshold — the two numbers you recalled a couple of questions ago.',
        options: () => shuffle([
          { label: 'TTL\'s guaranteed HIGH output (V<sub>OH</sub>(min) ≈ 2.4–2.7 V) can fall below CMOS\'s HIGH input threshold (V<sub>IH</sub>(min) ≈ 3.5 V), so a valid TTL HIGH may not register as HIGH at a CMOS input', type: 'correct' },
          { label: 'TTL and CMOS ICs use physically incompatible pin layouts', type: 'wrong' },
          { label: 'CMOS cannot run from a 5 V supply at all', type: 'wrong' },
          { label: 'TTL outputs cannot sink or source any current', type: 'wrong' },
        ]),
        correctExplain: () => 'TTL\'s VOH(min) can sit below CMOS\'s VIH(min) — a marginal TTL HIGH may be misread as LOW.',
        working: () => `
    <div class="working-total">This is exactly the gap between the two threshold sets recalled earlier in this quiz: TTL only guarantees its HIGH output reaches about 2.4–2.7 V, but 4000-series CMOS needs an input above roughly 3.5 V to reliably register HIGH. A TTL output sitting anywhere in that gap looks like a valid HIGH to the TTL device that produced it, but risks being read as an invalid or even LOW input by the CMOS device receiving it.</div>`
      },
      {
        // Objective: identify interfacing strategies for TTL driving CMOS.
        kind: 'multi',
        text: () => '<b style="color:var(--colour-ui-primary)">Select</b> the valid strategies for letting a TTL output reliably drive a 4000-series CMOS input.',
        hint: () => 'One option physically pulls the voltage higher; the other swaps in a device built specifically to bridge the two families.',
        options: () => shuffle([
          { label: 'Add a pull-up resistor from the TTL output to VDD, pulling its HIGH level closer to the full supply rail', type: 'correct' },
          { label: 'Use a 74HCT buffer/gate between the TTL output and the CMOS input — HCT is designed to accept TTL input levels and produce full CMOS output levels', type: 'correct' },
          { label: 'Simply run a longer wire between the two devices', type: 'wrong' },
          { label: 'Reduce the CMOS device\'s supply voltage to 0 V', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> — a pull-up resistor, or an HCT buffer stage`;
        },
        working: (st) => {
          const wrongL = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-line">A <b class="colour-gain">pull-up resistor</b> to VDD gives the TTL output's HIGH state somewhere to be pulled toward beyond its own guaranteed VOH(min) — cheap and simple, and enough to close the gap identified in the previous question.</div>
    <div class="working-line">A <b class="colour-gain">74HCT</b> device is purpose-built for exactly this handoff — it reliably recognises a TTL-level HIGH at its input, then produces a proper full-swing CMOS output.</div>
    <div class="working-step" style="margin-top:.6rem">Why options ${wrongL} are wrong:</div>
    <div class="working-line">Wire length has no effect on DC voltage levels — it doesn't fix a threshold mismatch. And reducing the CMOS supply to 0 V wouldn't "meet TTL halfway" — it would simply turn the CMOS device off entirely.</div>`;
        }
      },
    ];

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
