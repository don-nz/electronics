<!--
  TEMPLATE FILE — read before cloning for a new weekly quiz.

  This file uses a data-driven quiz engine: a single `QUESTIONS` array (in the
  <script>, search "QUESTIONS —") drives one generic HTML panel and a generic
  set of engine functions (renderQuestion, checkAnswer, nextQuestion, etc).
  There is deliberately NO per-question HTML or per-question JS function.

  When cloning this file for a new quiz — even one that starts with just ONE
  image and ONE question — KEEP THIS STRUCTURE. Do not revert to a hardcoded
  per-question panel just because there's only one entry. The whole point of
  this architecture is that adding question 2, 3, splitting a question into
  two, or reordering them later is a pure edit of the QUESTIONS array, with
  zero HTML/JS restructuring. Starting with one question and hardcoding it
  "for now" recreates exactly the problem this file was refactored to avoid.

  A `leftPanel` field per question ('none' | 'shapeGrid') swaps the left-hand
  column between nothing (question collapses to a single centred column) and
  a grid of clickable boxes — either SVG shapes (set `shapeId` on the option)
  or plain text labels (set `label` only, no `shapeId` — see Q1's gate-name
  boxes). Add new left-panel modes the same way: a new string value, a new
  container div, one more branch in swapLeftPanel().

  A `kind` field per question selects the interaction:
    (unset)  single-select, A/B/C/D, one correct answer
    'multi'  multi-select — any number of options toggled on (shapeGrid or
             plain text options both support this)
    'match'  click-to-assign sort into a set of labelled columns — usually
             two (see the BJT quiz's logic-state question), but this file's
             Q2/Q3 generalise it further: `columns()` can return any number
             of targets, and each one can be plain text OR `{ shapeId }` to
             render an SVG shape as the column header instead (Q2 — matching
             gate names to their symbols). Pool/option items can likewise
             carry a `shapeId` to render as a shape instead of their text
             label (Q3 — matching IEC symbols to their traditional
             counterparts). The grid lays itself out at up to 4 columns per
             row regardless of column count.
    'bits'   click-to-toggle table of 0/1 cells (see the BJT quiz's binary
             counting question for a worked example)
    'truth'  a truth table: fixed/read-only input columns (`inputLabels()`)
             plus one click-cyclable output column (`outputLabel()`) that
             cycles blank → 0 → 1 → blank per cell. Each option is
             `{ inputs: [...], z }`. Optionally offers an input-count toggle
             (see Q4/Q5/Q7–Q10 — 2-input/3-input OR/AND/NOR/NAND/XOR/XNOR):
             add `inputCounts()` (array of choices) and `defaultInputCount()`,
             and make `inputLabels` and `options` take the count `n` as an
             argument instead of being called plain — the engine detects the
             toggle via `data.inputCounts` and switches calling convention
             accordingly. Switching the toggle rebuilds the table and clears
             the answer. Q6 (NOT) omits the toggle entirely, since a NOT gate
             is strictly single-input — see GATE_FN/buildTruthRows() below
             for the shared row-generation logic used by all seven.
  This file uses 'multi', 'match' and 'truth'; nothing else needs to change
  to add another question of any of these kinds.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine — the LAST
  file in the whole cert_iii migration to move over, and also the original
  source `kind:'truth'` was reverse-engineered from earlier this project
  (see quiz-engine.js's own header comment). Genuinely the simplest
  migration of the batch: no config globals needed at all (no circuit
  panel, and this file's own SHAPE_VIEWBOX/MATCH_COL_TITLE_MAX_WIDTH usage
  already matched the shared defaults exactly). Only `GATE_FN`/
  `buildTruthRows()` — this file's own gate-logic content — stayed
  page-local, same reasoning as every other truth-table file's own
  content. Note: despite the header comment above listing 'bits' in the
  general kind-field reference, this file's own QUESTIONS[] never actually
  uses kind:'bits' — `renderBits()`/`clickBit()`/the `n%2` bitFromClicks()
  variant were all dead code, safely dropped rather than preserved.
-->

<body>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — the template. Add, remove, split or reorder questions by
    // editing this array only — nothing in the engine below needs to change.
    //
    // Each entry:
    //   leftPanel           'none' (default) | 'shapeGrid' — which left-hand
    //                       panel to show for this question
    //   kind                'multi' | 'match' | 'bits' — see the file-level
    //                       comment at the top for what each does; omit for
    //                       ordinary single-select
    //   text()              question prompt (HTML string)
    //   hint()              hint shown under the prompt (HTML string)
    //   options()           returns a shuffled array of
    //                       { label, type: 'correct'|'wrong', shapeId? }
    //                       (shapeId is only used by leftPanel:'shapeGrid' —
    //                       it names a <g id="..."> in the hidden defs <svg>
    //                       near the top of <body>; omit shapeId to render
    //                       the box as plain text instead, using `label`)
    //   correctExplain(st)  short HTML fragment used in the result banner
    //   working(st)         full worked-solution HTML shown after answering
    //
    // text/hint/options take no arguments; correctExplain/working receive the
    // question's live state `st` so they can report on what was actually
    // selected/shuffled — ordinary questions can just ignore the argument.
    // All fields are functions (even when static) so a question can freely
    // start simple and later reference live values without changing shape.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Multi-select shape-grid with plain-text boxes (no shapeId) — the
        // seven real logic gates mixed in with other digital building-block
        // names that a student might mistakenly lump in as "gates."
        leftPanel: 'shapeGrid',
        kind: 'multi',
        text: () => `The <span style="color:var(--colour-ui-primary)">seven</span> standard logic gates are mixed in with some other digital building-block names below. <span style="color:var(--colour-ui-primary)">Click</span> every box that names one of the seven <span style="color:var(--colour-ui-primary)">logic gates</span>.`,
        hint: () => 'The seven gates are the fundamental building blocks (AND-type and OR-type functions, plus their inverted forms). The other terms describe circuits built <em>from</em> gates — useful digital building blocks, but not gates themselves.',
        options: () => shuffle([
          { label: 'AND',  type: 'correct' },
          { label: 'OR',   type: 'correct' },
          { label: 'NOT',  type: 'correct' },
          { label: 'NAND', type: 'correct' },
          { label: 'NOR',  type: 'correct' },
          { label: 'XOR',  type: 'correct' },
          { label: 'XNOR', type: 'correct' },
          { label: 'BUFFER',     type: 'wrong' },
          { label: 'COMPARATOR', type: 'wrong' },
          { label: 'MULTIPLEXER',type: 'wrong' },
          { label: 'DECODER',    type: 'wrong' },
          { label: 'FLIP-FLOP',  type: 'wrong' }
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(n => n).join(', ');
          return `Boxes <b>${nums}</b> are the seven logic gates`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">The seven logic gates — boxes ${correctNums}:</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">AND</b>, <b style="color:var(--colour-ui-correct)">OR</b> and <b style="color:var(--colour-ui-correct)">NOT</b> are the three basic functions. <b style="color:var(--colour-ui-correct)">NAND</b> and <b style="color:var(--colour-ui-correct)">NOR</b> are AND/OR with an inverted (NOT) output. <b style="color:var(--colour-ui-correct)">XOR</b> (exclusive-OR) and <b style="color:var(--colour-ui-correct)">XNOR</b> (exclusive-NOR) output true only when their inputs <em>differ</em> (or agree, for XNOR).</div>
    <div class="working-step" style="margin-top:.6rem">Not gates — boxes ${wrongNums}:</div>
    <div class="working-line">A <b style="color:var(--colour-ui-wrong)">buffer</b> just passes its input straight through (no logic decision made). A <b style="color:var(--colour-ui-wrong)">comparator</b>, <b style="color:var(--colour-ui-wrong)">multiplexer</b> and <b style="color:var(--colour-ui-wrong)">decoder</b> are all more complex circuits <em>built from</em> multiple gates. A <b style="color:var(--colour-ui-wrong)">flip-flop</b> stores a single bit and needs a clock signal — it's a memory element, not a gate.</div>`;
        }
      },
      {
        // kind:'match' with shape-based columns — 7 gate symbols (BUFFER
        // excluded, since it makes no logic decision) shown as column
        // headers via columns()'s `{ shapeId }` form; the grid wraps at 4
        // per row, giving the requested 4/3 layout for 7 columns.
        leftPanel: 'none',
        kind: 'match',
        columns: () => [
          { shapeId: 'gate-and-trad' },
          { shapeId: 'gate-or-trad' },
          { shapeId: 'gate-not-trad' },
          { shapeId: 'gate-nand-trad' },
          { shapeId: 'gate-nor-trad' },
          { shapeId: 'gate-xor-trad' },
          { shapeId: 'gate-xnor-trad' }
        ],
        text: () => `The seven logic gates are shown below using their <span style="color:var(--colour-ui-primary)">traditional</span> symbols. <span style="color:var(--colour-ui-primary)">Place</span> each gate's name in the box underneath its symbol.`,
        hint: () => `Look at the shape of the body first (flat-backed vs pointed vs triangular), then check for a small bubble on the output — that bubble always means the same thing: the output is inverted. If you change your mind, click a placed name to send it back to the pool.`,
        options: () => shuffle([
          { label: 'AND',  col: 0 },
          { label: 'OR',   col: 1 },
          { label: 'NOT',  col: 2 },
          { label: 'NAND', col: 3 },
          { label: 'NOR',  col: 4 },
          { label: 'XOR',  col: 5 },
          { label: 'XNOR', col: 6 }
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 7 gates named correctly' : `${st.opts.length - wrongCount} of ${st.opts.length} gates named correctly`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Misplaced:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">Reading each symbol:</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">AND</b> — flat back, rounded (D-shaped) front. <b style="color:var(--colour-ui-correct)">OR</b> — curved, concave back and a pointed front. <b style="color:var(--colour-ui-correct)">NOT</b> — a triangle with a bubble on its output.</div>
    <div class="working-line" style="margin-top:.4rem"><b style="color:var(--colour-ui-correct)">NAND</b> and <b style="color:var(--colour-ui-correct)">NOR</b> are just the AND/OR body with that same bubble added on the output. <b style="color:var(--colour-ui-correct)">XOR</b> and <b style="color:var(--colour-ui-correct)">XNOR</b> are the OR/NOR body with one extra curved line across the input side.</div>
    <div class="working-line" style="margin-top:.4rem">However many bodies or extra lines a symbol has, the bubble always means the same thing: the gate's output is inverted.</div>
    ${mistakeLine}`;
        }
      },
      {
        // kind:'match' with the pool itself made of shapes (opt.shapeId) —
        // the columns are the traditional symbols from Q2; the pool holds
        // the modern IEC/rectangular equivalents, which the student matches
        // up rather than typing/placing a name.
        leftPanel: 'none',
        kind: 'match',
        columns: () => [
          { shapeId: 'gate-and-trad' },
          { shapeId: 'gate-or-trad' },
          { shapeId: 'gate-not-trad' },
          { shapeId: 'gate-nand-trad' },
          { shapeId: 'gate-nor-trad' },
          { shapeId: 'gate-xor-trad' },
          { shapeId: 'gate-xnor-trad' }
        ],
        text: () => `Each traditional gate symbol also has a <span style="color:var(--colour-ui-primary)">modern IEC</span> (rectangular) equivalent. <span style="color:var(--colour-ui-primary)">Match</span> each new symbol below to the traditional one it represents.`,
        hint: () => `Every IEC symbol is the same rectangle — what changes is the qualifying symbol inside it ("&" for AND-type, "≥1" for OR-type, "=1" for XOR-type, "1" for NOT) and whether there's a bubble on the output. If you change your mind, click a placed symbol to send it back to the pool.`,
        options: () => shuffle([
          { label: 'AND',  shapeId: 'gate-and-iec',  col: 0 },
          { label: 'OR',   shapeId: 'gate-or-iec',   col: 1 },
          { label: 'NOT',  shapeId: 'gate-not-iec',  col: 2 },
          { label: 'NAND', shapeId: 'gate-nand-iec', col: 3 },
          { label: 'NOR',  shapeId: 'gate-nor-iec',  col: 4 },
          { label: 'XOR',  shapeId: 'gate-xor-iec',  col: 5 },
          { label: 'XNOR', shapeId: 'gate-xnor-iec', col: 6 }
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 7 symbols matched correctly' : `${st.opts.length - wrongCount} of ${st.opts.length} symbols matched correctly`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Mismatched:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">Reading the IEC symbols:</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">&amp;</b> = AND-type (AND / NAND). <b style="color:var(--colour-ui-correct)">≥1</b> = OR-type (OR / NOR) — "1 or more inputs high". <b style="color:var(--colour-ui-correct)">=1</b> = XOR-type (XOR / XNOR) — "exactly 1 input high". <b style="color:var(--colour-ui-correct)">1</b> = NOT — a single input passed through (inverted, since NOT always has a bubble).</div>
    <div class="working-line" style="margin-top:.4rem">Same rule as the traditional symbols: the bubble on the output is what turns AND into NAND, OR into NOR, and XOR into XNOR — the rectangle and qualifying symbol inside it stay the same either way.</div>
    ${mistakeLine}`;
        }
      },
      {
        // kind:'truth' — read-only input columns, all rows in natural
        // binary-counting order (a truth table shouldn't shuffle), plus one
        // click-cyclable output column (blank → 0 → 1 → blank per cell).
        //
        // This question also has a 2-input/3-input TOGGLE — see
        // inputCounts()/defaultInputCount() below. Because of that,
        // inputLabels() and options() take the current input count `n` as an
        // argument (every other 'truth' field is called the same way as
        // other kinds' fields; only these two differ, and only because this
        // question needs them to). Rows are generated generically from `n`
        // rather than hand-written, since "OR of n inputs" is well-defined
        // for any n: Z is 0 only when every input is 0.
        leftPanel: 'none',
        kind: 'truth',
        inputCounts: () => [2, 3],
        defaultInputCount: () => 2,
        inputLabels: (n) => ['C', 'B', 'A'].slice(3 - n),
        inputsHeading: () => '<span class="colour-bjt" style="font-size:1.02rem">OR</span> Logic Gate Inputs',
        outputHeading: () => 'Output',
        outputLabel: () => 'Z',
        text: (st) => `Complete the <span style="color:var(--colour-ui-primary)">truth table</span> for a <span style="color:var(--colour-ui-primary)">${st.n}-input OR</span> gate. Tap a cell in the Z column to cycle it 0 → 1 → blank.`,
        hint: () => `An OR gate's output is 1 if ANY input is 1 — the only row where that's not true is the one where every input is 0.`,
        options: (n) => buildTruthRows(n, GATE_FN.or),
        correctExplain: truthCorrectExplain,
        working: (st) => {
          const labels = ['C', 'B', 'A'].slice(3 - st.n).join(' ');
          const allZeroRow = new Array(st.n).fill(0).join(' ');
          return `
    <div class="working-step">OR gate logic:</div>
    <div class="working-line">Z = ${labels.split(' ').join(' + ')} (OR). Z is <b style="color:var(--colour-ui-correct)">1</b> whenever at least one input is 1 — that's every row except ${labels} = ${allZeroRow}, where Z is <b style="color:var(--colour-bjt)">0</b>.</div>
    <div class="working-line" style="margin-top:.4rem">This is the opposite of an AND gate, whose output is only 1 when <em>every</em> input is 1.</div>
    ${truthMistakeLine(labels, st)}`;
        }
      },
      {
        // Q5 — AND, same 2/3-input toggle pattern as Q4.
        leftPanel: 'none',
        kind: 'truth',
        inputCounts: () => [2, 3],
        defaultInputCount: () => 2,
        inputLabels: (n) => ['C', 'B', 'A'].slice(3 - n),
        inputsHeading: () => '<span class="colour-bjt" style="font-size:1.02rem">AND</span> Logic Gate Inputs',
        outputHeading: () => 'Output',
        outputLabel: () => 'Z',
        text: (st) => `Complete the <span style="color:var(--colour-ui-primary)">truth table</span> for a <span style="color:var(--colour-ui-primary)">${st.n}-input AND</span> gate. Tap a cell in the Z column to cycle it 0 → 1 → blank.`,
        hint: () => `An AND gate's output is 1 only when EVERY input is 1 — every other row is 0.`,
        options: (n) => buildTruthRows(n, GATE_FN.and),
        correctExplain: truthCorrectExplain,
        working: (st) => {
          const labels = ['C', 'B', 'A'].slice(3 - st.n).join(' ');
          const allOnesRow = new Array(st.n).fill(1).join(' ');
          return `
    <div class="working-step">AND gate logic:</div>
    <div class="working-line">Z = ${labels.split(' ').join(' · ')} (AND). Z is <b style="color:var(--colour-ui-correct)">1</b> only on the row where ${labels} = ${allOnesRow} — every other row is <b style="color:var(--colour-bjt)">0</b>.</div>
    <div class="working-line" style="margin-top:.4rem">This is the opposite of an OR gate, whose output is 1 as soon as <em>any</em> input is 1.</div>
    ${truthMistakeLine(labels, st)}`;
        }
      },
      {
        // Q6 — NOT. A NOT gate is strictly single-input, so this question
        // has no toggle at all: inputCounts/defaultInputCount are simply
        // omitted, which tells the engine (and renderTruth()) to call
        // inputLabels()/options() plain, exactly like Q1–Q3's non-toggle
        // kinds. st.n stays undefined for this question — fine, since
        // nothing here reads it.
        leftPanel: 'none',
        kind: 'truth',
        inputLabels: () => ['A'],
        inputsHeading: () => '<span class="colour-bjt" style="font-size:1.02rem">NOT</span> Logic Gate Input',
        outputHeading: () => 'Output',
        outputLabel: () => 'Z',
        text: () => `Complete the <span style="color:var(--colour-ui-primary)">truth table</span> for a <span style="color:var(--colour-ui-primary)">NOT</span> gate. Tap the cell in the Z column to cycle it 0 → 1 → blank.`,
        hint: () => `A NOT gate (inverter) just flips its single input — 0 becomes 1, and 1 becomes 0.`,
        options: () => buildTruthRows(1, GATE_FN.not),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">NOT gate logic:</div>
    <div class="working-line">Z = <span style="text-decoration:overline">A</span> (NOT). Z is simply the opposite of A — A=0 gives Z=<b style="color:var(--colour-ui-correct)">1</b>, A=1 gives Z=<b style="color:var(--colour-bjt)">0</b>.</div>
    <div class="working-line" style="margin-top:.4rem">This is the only one of the seven gates with just a single input — every other gate takes two or more.</div>
    ${truthMistakeLine('A', st)}`
      },
      {
        // Q7 — NOR (OR with the output inverted).
        leftPanel: 'none',
        kind: 'truth',
        inputCounts: () => [2, 3],
        defaultInputCount: () => 2,
        inputLabels: (n) => ['C', 'B', 'A'].slice(3 - n),
        inputsHeading: () => '<span class="colour-bjt" style="font-size:1.02rem">NOR</span> Logic Gate Inputs',
        outputHeading: () => 'Output',
        outputLabel: () => 'Z',
        text: (st) => `Complete the <span style="color:var(--colour-ui-primary)">truth table</span> for a <span style="color:var(--colour-ui-primary)">${st.n}-input NOR</span> gate. Tap a cell in the Z column to cycle it 0 → 1 → blank.`,
        hint: () => `A NOR gate is an OR gate with the output inverted — it's 1 only on the one row where every input is 0.`,
        options: (n) => buildTruthRows(n, GATE_FN.nor),
        correctExplain: truthCorrectExplain,
        working: (st) => {
          const labels = ['C', 'B', 'A'].slice(3 - st.n).join(' ');
          const allZeroRow = new Array(st.n).fill(0).join(' ');
          return `
    <div class="working-step">NOR gate logic:</div>
    <div class="working-line">Z = ${labels.split(' ').join(' + ')} (OR), inverted. Z is <b style="color:var(--colour-ui-correct)">1</b> only on the row where ${labels} = ${allZeroRow} — every other row is <b style="color:var(--colour-bjt)">0</b>.</div>
    <div class="working-line" style="margin-top:.4rem">NOR is the exact opposite of OR: everywhere OR outputs 1, NOR outputs 0, and vice versa.</div>
    ${truthMistakeLine(labels, st)}`;
        }
      },
      {
        // Q8 — NAND (AND with the output inverted).
        leftPanel: 'none',
        kind: 'truth',
        inputCounts: () => [2, 3],
        defaultInputCount: () => 2,
        inputLabels: (n) => ['C', 'B', 'A'].slice(3 - n),
        inputsHeading: () => '<span class="colour-bjt" style="font-size:1.02rem">NAND</span> Logic Gate Inputs',
        outputHeading: () => 'Output',
        outputLabel: () => 'Z',
        text: (st) => `Complete the <span style="color:var(--colour-ui-primary)">truth table</span> for a <span style="color:var(--colour-ui-primary)">${st.n}-input NAND</span> gate. Tap a cell in the Z column to cycle it 0 → 1 → blank.`,
        hint: () => `A NAND gate is an AND gate with the output inverted — it's 0 only on the one row where every input is 1.`,
        options: (n) => buildTruthRows(n, GATE_FN.nand),
        correctExplain: truthCorrectExplain,
        working: (st) => {
          const labels = ['C', 'B', 'A'].slice(3 - st.n).join(' ');
          const allOnesRow = new Array(st.n).fill(1).join(' ');
          return `
    <div class="working-step">NAND gate logic:</div>
    <div class="working-line">Z = ${labels.split(' ').join(' · ')} (AND), inverted. Z is <b style="color:var(--colour-bjt)">0</b> only on the row where ${labels} = ${allOnesRow} — every other row is <b style="color:var(--colour-ui-correct)">1</b>.</div>
    <div class="working-line" style="margin-top:.4rem">NAND is the exact opposite of AND: everywhere AND outputs 1, NAND outputs 0, and vice versa.</div>
    ${truthMistakeLine(labels, st)}`;
        }
      },
      {
        // Q9 — XOR. Generalises to n inputs via parity (odd count of 1s) —
        // see GATE_FN.xor.
        leftPanel: 'none',
        kind: 'truth',
        inputCounts: () => [2, 3],
        defaultInputCount: () => 2,
        inputLabels: (n) => ['C', 'B', 'A'].slice(3 - n),
        inputsHeading: () => '<span class="colour-bjt" style="font-size:1.02rem">XOR</span> Logic Gate Inputs',
        outputHeading: () => 'Output',
        outputLabel: () => 'Z',
        text: (st) => `Complete the <span style="color:var(--colour-ui-primary)">truth table</span> for a <span style="color:var(--colour-ui-primary)">${st.n}-input XOR</span> gate. Tap a cell in the Z column to cycle it 0 → 1 → blank.`,
        hint: (st) => st.n === 2
          ? `A 2-input XOR gate's output is 1 only when its inputs differ (one 0, one 1).`
          : `XOR generalises to more than 2 inputs by parity: Z is 1 when an ODD number of inputs are 1.`,
        options: (n) => buildTruthRows(n, GATE_FN.xor),
        correctExplain: truthCorrectExplain,
        working: (st) => {
          const labels = ['C', 'B', 'A'].slice(3 - st.n).join(' ');
          const parityLine = st.n === 2
            ? `Z is <b style="color:var(--colour-ui-correct)">1</b> only when the two inputs differ (0,1 or 1,0) — when they agree (0,0 or 1,1), Z is <b style="color:var(--colour-bjt)">0</b>.`
            : `Z is <b style="color:var(--colour-ui-correct)">1</b> whenever an <em>odd</em> number of inputs are 1 (one or all three) — otherwise Z is <b style="color:var(--colour-bjt)">0</b>.`;
          return `
    <div class="working-step">XOR (exclusive-OR) gate logic:</div>
    <div class="working-line">${parityLine}</div>
    <div class="working-line" style="margin-top:.4rem">Unlike a plain OR gate, XOR excludes the case where every input is 1 (for 2 inputs) or, more generally, excludes any row with an even count of 1s.</div>
    ${truthMistakeLine(labels, st)}`;
        }
      },
      {
        // Q10 — XNOR (XOR with the output inverted; even parity).
        leftPanel: 'none',
        kind: 'truth',
        inputCounts: () => [2, 3],
        defaultInputCount: () => 2,
        inputLabels: (n) => ['C', 'B', 'A'].slice(3 - n),
        inputsHeading: () => '<span class="colour-bjt" style="font-size:1.02rem">XNOR</span> Logic Gate Inputs',
        outputHeading: () => 'Output',
        outputLabel: () => 'Z',
        text: (st) => `Complete the <span style="color:var(--colour-ui-primary)">truth table</span> for a <span style="color:var(--colour-ui-primary)">${st.n}-input XNOR</span> gate. Tap a cell in the Z column to cycle it 0 → 1 → blank.`,
        hint: (st) => st.n === 2
          ? `A 2-input XNOR gate's output is 1 only when its inputs agree (both 0 or both 1).`
          : `XNOR generalises to more than 2 inputs by parity: Z is 1 when an EVEN number of inputs are 1 (including zero).`,
        options: (n) => buildTruthRows(n, GATE_FN.xnor),
        correctExplain: truthCorrectExplain,
        working: (st) => {
          const labels = ['C', 'B', 'A'].slice(3 - st.n).join(' ');
          const parityLine = st.n === 2
            ? `Z is <b style="color:var(--colour-ui-correct)">1</b> only when the two inputs agree (0,0 or 1,1) — when they differ (0,1 or 1,0), Z is <b style="color:var(--colour-bjt)">0</b>.`
            : `Z is <b style="color:var(--colour-ui-correct)">1</b> whenever an <em>even</em> number of inputs are 1 (zero or two) — otherwise Z is <b style="color:var(--colour-bjt)">0</b>.`;
          return `
    <div class="working-step">XNOR gate logic:</div>
    <div class="working-line">${parityLine}</div>
    <div class="working-line" style="margin-top:.4rem">XNOR is the exact opposite of XOR: everywhere XOR outputs 1, XNOR outputs 0, and vice versa.</div>
    ${truthMistakeLine(labels, st)}`;
        }
      }
    ];

    // Shared by every 'truth' question (Q4–Q10): generates all 2^n input
    // combinations in natural binary-counting order and applies `fn` (the
    // gate's logic) to get each row's correct Z. Used with `fn` from GATE_FN
    // below so every gate's row-building is one line at the call site.
    function buildTruthRows(n, fn) {
      const rows = [];
      for (let v = 0; v < (1 << n); v++) {
        const inputs = [];
        for (let b = n - 1; b >= 0; b--) inputs.push((v >> b) & 1);
        rows.push({ inputs, z: fn(inputs) });
      }
      return rows;
    }
    // One-input-array-in, one-bit-out logic for each of the 7 gates used
    // across Q4–Q10. XOR/XNOR generalise to n inputs via parity (odd/even
    // count of 1s) — the standard generalisation, since 2-input XOR is just
    // "an odd number of inputs are 1" restated.
    const GATE_FN = {
      or:   (inputs) => inputs.includes(1) ? 1 : 0,
      and:  (inputs) => inputs.every(x => x === 1) ? 1 : 0,
      not:  (inputs) => inputs[0] === 1 ? 0 : 1,
      nor:  (inputs) => inputs.includes(1) ? 0 : 1,
      nand: (inputs) => inputs.every(x => x === 1) ? 0 : 1,
      xor:  (inputs) => inputs.filter(x => x === 1).length % 2 === 1 ? 1 : 0,
      xnor: (inputs) => inputs.filter(x => x === 1).length % 2 === 0 ? 1 : 0
    };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
