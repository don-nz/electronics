<!--
  TEMPLATE FILE — read before cloning for a new weekly quiz.

  This file uses a data-driven quiz engine: a single `QUESTIONS` array (in the
  <script>, search "QUESTIONS —") drives one generic HTML panel and a generic
  set of engine functions (renderQuestion, checkAnswer, nextQuestion, etc).
  There is deliberately NO per-question HTML or per-question JS function.

  When cloning this file for a new quiz — even one that starts with just ONE
  question — KEEP THIS STRUCTURE. Do not revert to a hardcoded per-question
  panel just because there's only one entry.

  Built on the shared cert_iii/assets/quiz-engine.js engine from the start
  (project convention for all new quizzes).

  History: this file originally held a 3-bit Gray code rotary-encoder disk
  question — that content turned out to belong under "codes" instead (see
  digital_knowledge_digital_codes.html, which now owns it), not number
  systems proper. Q1 here is a fresh start: a kind:'bits' revision question
  ported verbatim from digital_knowledge_basics.html's own Q5 (binary
  representation of 4 random decimal values, click-to-cycle entry table) —
  a deliberate revision-then-forward bridge into this quiz's own new
  content, per the user's own framing. leftPanel is 'none' — no circuit
  diagram is relevant to number-base conversion, so (matching digital_
  knowledge_logic_families.html's own precedent) the whole circuit-col/
  leftPanel apparatus is left out entirely rather than carried unused.
  qOptions/qMatch/qBits panels are all still included in the markup below
  even though only 'bits' is used so far, so future number-systems
  questions (hex, octal, ASCII, etc) can add 'multi'/'match' kinds without
  any HTML restructuring.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../assets/theme-init.js"></script>
  <script src="../../assets/quiz-engine.js"></script>
  <title>Digital Electronics Knowledge Quiz — Number Systems</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/quiz-common.css">
  <script src="../../assets/breadcrumb.js" defer></script>
</head>

<body>
  <div class="crumb" id="crumb" data-current="Number Systems"></div>
  <header>
    <h1>Digital Electronics</h1>
    <p>Number Systems · Binary &amp; Decimal Conversion</p>
  </header>

  <div class="quiz-wrap single-col" id="quizWrap">

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->
        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="bits-wrap" id="qBits" style="display:none">
            <table class="bits-table">
              <thead>
                <tr>
                  <th rowspan="2">Value</th>
                  <th>2<sup>3</sup></th>
                  <th>2<sup>2</sup></th>
                  <th>2<sup>1</sup></th>
                  <th>2<sup>0</sup></th>
                </tr>
                <tr>
                  <th>8</th>
                  <th>4</th>
                  <th>2</th>
                  <th>1</th>
                </tr>
              </thead>
              <tbody id="bitsBody"></tbody>
            </table>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // kind:'bits' — click-to-toggle binary entry table (see renderBits()/
        // clickBit() in quiz-engine.js). Every cell starts blank and each
        // click cycles it blank -> 0 -> 1 -> blank. Ported verbatim from
        // digital_knowledge_basics.html's own Q5 — a revision question that
        // doubles as the on-ramp into this quiz's own number-systems content.
        // `options()` picks 4 unique random decimal values (0-15) each
        // attempt; `cor` (built in resetQuiz) is the correct 4-bit pattern
        // for each row.
        leftPanel: 'none',
        kind: 'bits',
        text: () => `Fill in the <span style="color:var(--colour-ui-primary)">binary representation</span> of each decimal value below. Every cell starts blank — click it to cycle 0, then 1, then back to blank.`,
        hint: () => 'Each column heading is a power of two (8, 4, 2, 1). Work out which of those add up to the target value — those columns are 1, everything else is 0.',
        options: () => shuffle(Array.from({ length: 16 }, (_, v) => v)).slice(0, 4).map(value => ({ value })),
        correctExplain: (st) => {
          let correct = 0, total = 0;
          st.clicks.forEach((row, r) => row.forEach((n, c) => { total++; if (bitFromClicks(n) === st.cor[r][c]) correct++; }));
          return correct === total ? 'All bits correct' : `${correct} of ${total} bits correct`;
        },
        working: (st) => {
          const rows = st.opts.map((row, r) => {
            const bits = st.cor[r];
            return `<div class="working-line">${row.value} = <b style="color:var(--colour-current)">${bits.join('')}</b> &nbsp; (8×${bits[0]} + 4×${bits[1]} + 2×${bits[2]} + 1×${bits[3]} = ${bits[0]*8 + bits[1]*4 + bits[2]*2 + bits[3]})</div>`;
          }).join('');
          return `<div class="working-step">Binary breakdown for each value:</div>${rows}`;
        }
      }
    ];

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
</html>
