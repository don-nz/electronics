<!--
  Continues from digital_knowledge_logic_gates.html — covers the
  "Combinational Logic" lesson objectives: identifying combinational
  circuits, predicting the output of a gate network (up to 3 inputs/3
  levels) for given input levels, building the complete truth table for
  such a network, the four reasons combinational logic is used over relay
  logic, and implementing NOT from a single NAND or NOR gate. Deliberately
  stops short of the lesson's fault-finding objectives (identifying a
  faulty node, which gate caused it, DMM/logic-probe verification) — those
  need a dedicated digital fault-finding UI that doesn't exist yet
  anywhere in this site, and belong in their own follow-up quiz, matching
  the existing split between conceptual-primer and troubleshooter quizzes
  elsewhere (e.g. bjt_knowledge_biasing.html vs bjt_npn_troubleshoot.html).
  A second, longer staged truth-table build-up (a 4-gate network, extra
  practice beyond the one worked into this quiz's own Q6-Q9) has moved out
  to ../practice/digital_truth_tables.html.

  Same data-driven QUESTIONS[] engine as digital_knowledge_logic_gates.html,
  trimmed to only the kinds this quiz actually uses ('multi' and 'truth' —
  no 'match' or 'bits' here) plus one addition: a `leftPanel:'circuit'`
  mode (borrowed from the BJT quizzes) that shows a single static reference
  circuit via `circuitId`/`circuitLabel`, for the "predict the output"
  questions and the staged truth-table build-ups. See
  digital_knowledge_logic_gates.html's header comment for the fuller field
  reference this file's engine still follows.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine. This file's
  own staged-build-up truth questions (data.highlightLabels()/
  groupBreakAfter()/trailingLabels()) prompted generalising the shared
  renderTruth() beyond what digital_knowledge_boolean_algebra.html's
  single-pass truth question needed — all three are optional per question,
  so boolean_algebra.html's own migration (done earlier this session) needed
  no changes. This file's own `buildStagedRows()` (row builder taking
  extraFn/zFn/trailingFn — different shape from boolean_algebra.html's
  simpler buildTableRows(fn), and from logic_gates.html's array-based
  buildTruthRows(n,fn)) stays page-local, same reasoning as every other
  file's own gate-logic content. Needs CIRCUIT_SVG_ID='circuitRefSvg' —
  no other globals (SHAPE_VIEWBOX/MATCH_COL_TITLE_MAX_WIDTH defaults
  already match this file's own shapeGrid viewBox and match column max
  width; no SUMMARY_CIRCUIT_REF, summary always shows swapLeftPanel('none')).
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="../../assets/quiz-engine.js"></script>
  <title>Digital Electronics Knowledge Quiz 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/quiz-common.css">
  <script src="../../assets/breadcrumb.js" defer></script>
  <style>
    .colour-bjt { color: var(--colour-bjt); }

    /* Read-only input columns (A/B/C) in the truth-table questions — same
       look as the bits-table's fixed "Value" column, themed (the sibling
       quiz's copy of this rule hardcodes rgba(255,255,255,.02), which
       doesn't adapt to light mode). */
    .truth-input-cell { font-weight: 700; color: var(--colour-text); background: rgba(var(--colour-label-rgb), .04); }

    /* Staged truth-table build-up (Q6–Q8) — highlightLabels() marks which
       already-known column(s) are actually needed to derive the current
       fillable column. Rather than making those columns pop, everything
       else (not needed this pass — a given input that isn't feeding this
       gate yet, or a later stage that hasn't been reached) is dimmed
       instead, so the relevant columns stay in their normal, readable
       styling and only the irrelevant ones recede. groupBreakAfter() draws
       the double-line divider between "raw inputs", "staged outputs" and
       "final output", matching the ‖ notation from the in-class table. */
    /* !important: the shared .bits-table tbody td:first-child rule in
       quiz-common.css (bold + full colour, for the "Value"-style leftmost
       column) is more specific than a single class, and would otherwise
       win over this on the C column specifically — C is always first. */
    .truth-dim { font-weight: 400 !important; color: var(--colour-label) !important; opacity: .5; }
    .truth-group-end { border-right: 3px double var(--colour-border); }

    /* Q5's 6 tied-input gate shapes — a clean 3x2 grid on desktop, and
       still a tidy 2x3 on phones rather than the shared 4-column default's
       lopsided 4-then-2 split. */
    #shapeGridCells { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 480px) {
      #shapeGridCells { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body>
  <!-- Hidden defs: gate symbols (copied from ../../assets/shapes/logic-gates.svg
       and re-themed to var(--colour-bjt) instead of that master file's
       hardcoded #ffb454 — edit shapes there first for any future gate
       quiz, then copy+re-theme into each quiz's own <defs> block; see that
       file's header comment for why it can't just be <use>'d directly
       from here (file:// blocks cross-file SVG <use>/fetch())), plus two
       new groups this quiz needs: "tied-*" (a 2-input gate with both
       inputs bridged together, for Q5) and the various combinational
       networks (Q3, Q6-Q9) built from those same gate primitives. A
       second, longer staged truth-table build-up (a 4-gate network) used
       to live here too — it's moved to its own standalone practice quiz:
       ../practice/digital_truth_tables.html. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" font-family="'Share Tech Mono', monospace">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>

      <!-- ── shared leads ── -->
      <g id="gate-lead-in2">
        <line x1="-24" y1="-8" x2="-8" y2="-8" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="-24" y1="8" x2="-8" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />
      </g>
      <g id="gate-lead-in1">
        <line x1="-24" y1="0" x2="-8" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />

      <g id="gate-lead-in2-or">

        <line x1="-24" y1="8" x2="-4.6" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />

      </g>
      <g id="gate-lead-out-inv">

        <line x1="32" y1="0" x2="44" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />

      <path id="gate-and-body" d="M -8,-16 L 8,-16 A 16,16 0 0 1 8,16 L -8,16 Z"

      <path id="gate-or-body" d="M -8,-16 Q 8,-16 24,0 Q 8,16 -8,16 Q 1,0 -8,-16 Z"
        fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
      <path id="gate-tri-body" d="M -8,-16 L -8,16 L 24,0 Z"
        fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />

      <!-- ── composed gates (traditional symbols only — this quiz never
           asks about IEC shapes) ── -->
      <g id="gate-and-trad"><use href="#gate-lead-in2" /><use href="#gate-and-body" /><use href="#gate-lead-out" /></g>
      <g id="gate-nand-trad"><use href="#gate-lead-in2" /><use href="#gate-and-body" /><use href="#gate-lead-out-inv" /></g>

      <g id="gate-not-trad"><use href="#gate-lead-in1" /><use href="#gate-tri-body" /><use href="#gate-lead-out-inv" /></g>

      <!-- ── Q5: a 2-input gate with both inputs bridged to a single
           external signal "A" — tests whether tying the inputs together
           turns that gate into a NOT (only true for the inverting ones). ── -->
      <g id="tied-and">
        <g transform="translate(8,0)">
          <line x1="-24" y1="0" x2="-16" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />

          <line x1="-16" y1="-8" x2="-8" y2="-8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-16" y1="8" x2="-8" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <use href="#gate-and-body" /><use href="#gate-lead-out" />
        </g>
        <text x="-27" y="5" font-size="20" text-anchor="middle" style="fill: var(--colour-label)">A</text>
      </g>
      <g id="tied-nand">
        <g transform="translate(8,0)">
          <line x1="-24" y1="0" x2="-16" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-16" y1="-8" x2="-16" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-16" y1="-8" x2="-8" y2="-8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-16" y1="8" x2="-8" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <use href="#gate-and-body" /><use href="#gate-lead-out-inv" />
        </g>
        <text x="-27" y="5" font-size="20" text-anchor="middle" style="fill: var(--colour-label)">A</text>
      </g>
      <g id="tied-or">
        <g transform="translate(8,0)">
          <line x1="-24" y1="0" x2="-14" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-14" y1="-8" x2="-14" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-14" y1="-8" x2="-4.6" y2="-8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-14" y1="8" x2="-4.6" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <use href="#gate-or-body" /><use href="#gate-lead-out" />
        </g>
        <text x="-27" y="5" font-size="20" text-anchor="middle" style="fill: var(--colour-label)">A</text>
      </g>
      <g id="tied-nor">
        <g transform="translate(8,0)">
          <line x1="-24" y1="0" x2="-14" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-14" y1="-8" x2="-14" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-14" y1="-8" x2="-4.6" y2="-8" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-14" y1="8" x2="-4.6" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />

        </g>
        <text x="-27" y="5" font-size="20" text-anchor="middle" style="fill: var(--colour-label)">A</text>
      </g>
      <g id="tied-xor">
        <g transform="translate(8,0)">

          <line x1="-14" y1="-8" x2="-14" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />

        </g>
        <text x="-27" y="5" font-size="20" text-anchor="middle" style="fill: var(--colour-label)">A</text>
      </g>
      <g id="tied-xnor">
        <g transform="translate(8,0)">
          <line x1="-24" y1="0" x2="-14" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
          <line x1="-14" y1="-8" x2="-14" y2="8" style="stroke: var(--colour-bjt)" stroke-width="2" />

          <use href="#gate-or-body" /><use href="#gate-lead-out-inv" />
        </g>
        <text x="-27" y="5" font-size="20" text-anchor="middle" style="fill: var(--colour-label)">A</text>
      </g>

      <!-- ── Q3: 2-level network, Z = NOT(A AND B), shown with A=0, B=1 ── -->
      <g id="combo-2level-a" transform="translate(0,-20)">
        <!-- ══ A, B → AND gate inputs ══ -->
        <line x1="-15" y1="-2.8" x2="61.6" y2="-2.8" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="-18" y="-2.8" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">A = 0</text>
        <line x1="-15" y1="22.8" x2="61.6" y2="22.8" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="-18" y="22.8" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">B = 1</text>

        <g transform="translate(100,10) scale(1.6)"><use href="#gate-and-trad" /></g>

        <!-- ══ AND gate output → NOT gate input ══ -->
        <line x1="170.4" y1="10" x2="241.6" y2="10" style="stroke: var(--colour-series)" stroke-width="2" />

        <g transform="translate(280,10) scale(1.6)"><use href="#gate-not-trad" /></g>

        <!-- ══ NOT gate output → Z ══ -->
        <line x1="350.4" y1="10" x2="380" y2="10" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="380" cy="10" r="3" style="fill: var(--colour-signal)" />
        <text x="386" y="14" font-size="24" font-weight="bold" style="fill: var(--colour-signal)">Z</text>
      </g>

      <!-- ── Q9: 3-level network, Z = NOT((A AND B) OR C), shown with
           A=1, B=1, C=0 ── -->
      <g id="combo-3level">
        <!-- ══ A, B → AND gate inputs ══ -->
        <line x1="-15" y1="-41.2" x2="66.4" y2="-41.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="-18" y="-41.2" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">A = 1</text>
        <line x1="-15" y1="-18.8" x2="66.4" y2="-18.8" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="-18" y="-18.8" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">B = 1</text>

        <g transform="translate(100,-30) scale(1.4)"><use href="#gate-and-trad" /></g>

        <!-- ══ AND gate output → OR gate top input (bend) ══ -->
        <line x1="161.6" y1="-30" x2="161.6" y2="-1.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <line x1="161.6" y1="-1.2" x2="166.4" y2="-1.2" style="stroke: var(--colour-series)" stroke-width="2" />

        <!-- ══ C → OR gate bottom input ══ -->
        <line x1="-15" y1="21.2" x2="166.4" y2="21.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="-18" y="21.2" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">C = 0</text>

        <g transform="translate(200,10) scale(1.4)"><use href="#gate-or-trad" /></g>

        <!-- ══ OR gate output → NOT gate input ══ -->
        <line x1="261.6" y1="10" x2="336.4" y2="10" style="stroke: var(--colour-series)" stroke-width="2" />

        <g transform="translate(370,10) scale(1.4)"><use href="#gate-not-trad" /></g>

        <!-- ══ NOT gate output → Z ══ -->
        <line x1="431.6" y1="10" x2="460" y2="10" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="460" cy="10" r="3" style="fill: var(--colour-signal)" />
        <text x="466" y="18" font-size="24" font-weight="bold" style="fill: var(--colour-signal)">Z</text>
      </g>

      <!-- Same network as combo-3level, but with plain A/B/C labels (no
           fixed values) — used by the staged build-up and full-truth-table
           questions, whose tables cover all 8 input combinations, not just
           the one specific case combo-3level shows. -->
      <g id="combo-3level-generic">
        <!-- ══ A, B → AND gate inputs ══ -->
        <line x1="-15" y1="-41.2" x2="66.4" y2="-41.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="-18" y="-41.2" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">A</text>
        <line x1="-15" y1="-18.8" x2="66.4" y2="-18.8" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="-18" y="-18.8" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">B</text>

        <g transform="translate(100,-30) scale(1.4)"><use href="#gate-and-trad" /></g>

        <!-- ══ AND gate output (X) → OR gate top input (bend) ══ -->
        <line x1="161.6" y1="-30" x2="161.6" y2="-1.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <line x1="161.6" y1="-1.2" x2="166.4" y2="-1.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="172" y="-20" font-size="18" font-weight="bold" style="fill: var(--colour-signal)">X</text>

        <!-- ══ C → OR gate bottom input ══ -->
        <line x1="-15" y1="21.2" x2="166.4" y2="21.2" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="-18" y="21.2" text-anchor="end" dominant-baseline="middle" font-size="20" style="fill: var(--colour-signal)">C</text>

        <g transform="translate(200,10) scale(1.4)"><use href="#gate-or-trad" /></g>

        <!-- ══ OR gate output (Y) → NOT gate input ══ -->
        <line x1="261.6" y1="10" x2="336.4" y2="10" style="stroke: var(--colour-series)" stroke-width="2" />
        <text x="299" y="1" text-anchor="middle" font-size="18" font-weight="bold" style="fill: var(--colour-signal)">Y</text>

        <g transform="translate(370,10) scale(1.4)"><use href="#gate-not-trad" /></g>

  </svg>

  <div class="crumb" id="crumb" data-current="Combinational Logic"></div>
  <header>
    <h1>Digital Electronics</h1>
    <p>Conceptual Questions · Combinational Logic · Predicting Outputs &amp; Truth Tables</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <!-- LEFT: static reference circuit (leftPanel:'circuit') or shape grid
         (leftPanel:'shapeGrid') — never both at once. -->
    <div class="circuit-col">
      <div class="circuit-panel" style="cursor:default" id="circuitPanelDiv">
        <div class="panel-label" id="circuitRefLabel">Reference Circuit</div>
        <svg id="circuitRefSvg" viewBox="-75 -85 555 155" xmlns="http://www.w3.org/2000/svg" style="max-width:340px;margin:0 auto">
          <use id="circuitRefUse" href="#combo-2level-a" />
        </svg>
      </div>
      <div id="qShapeGridPanel" style="display:none">
        <div class="panel-label">Click the gates to select your answer</div>

    <!-- RIGHT: question -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">

          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>

        <div class="q-panel" id="qPanel">
          <div class="q-header">

                <tr id="truthColLabels"></tr>
              </thead>

          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>

            <div class="working-title">Worked Solution</div>

          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';

    // Fixed top header-row groups for the staged build-up questions
    // (Q6-Q8) — the same four labels stay put across all three, whichever
    // column is the fillable one for that particular question.
    const STAGED_HEADER_GROUPS = [
      { label: 'Inputs', span: 3 },
      { label: 'Stage 1', span: 1 },
      { label: 'Stage 2', span: 1 },
      { label: 'Stage 3', span: 1 },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see digital_knowledge_logic_gates.html's header comment
    // for the fuller field reference. This file adds one thing that file
    // doesn't need: leftPanel:'circuit' (circuitId/circuitLabel), a single
    // static reference diagram, borrowed from the BJT quizzes' pattern.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: identify combinational logic circuits (definition).
        text: () => 'Which of these best defines a <b style="color:var(--colour-ui-primary)">combinational logic</b> circuit?',
        hint: () => 'Think about whether the circuit needs to \'remember\' anything, or whether its output could be worked out fresh from the inputs alone at any instant.',
        options: () => shuffle([
          { label: 'A circuit whose output depends only on the current combination of its inputs', type: 'correct' },
          { label: 'A circuit whose output depends on the order in which its inputs changed over time', type: 'wrong' },
          { label: 'A circuit that stores a value and only updates it when a clock pulse arrives', type: 'wrong' },
          { label: 'A circuit that can produce a different output each time it\'s powered on, even with the same inputs', type: 'wrong' },
        ]),
        correctExplain: () => 'A combinational circuit\'s output depends <b style="color:var(--colour-ui-primary)">only</b> on its current inputs',
        working: () => `
    <div class="working-step">Combinational vs sequential:</div>
    <div class="working-line">A <b class="colour-bjt">combinational</b> logic circuit is built entirely from gates with no feedback and no memory element — its output at any instant is a pure function of whatever the inputs are at that same instant. Change the inputs, and the output responds immediately (aside from tiny gate propagation delays).</div>
    <div class="working-step" style="margin-top:.6rem">Why the others describe sequential logic instead:</div>
    <div class="working-line">A circuit whose output depends on input <em>history</em>, needs a <em>clock</em>, or can give different outputs from the <em>same</em> inputs is <b class="colour-bjt">sequential</b> logic — a later topic. Combinational logic never "remembers" anything.</div>`
      },
      {
        // Objective: identify combinational logic circuits (applied to
        // real scenarios). Uses described systems rather than schematic
        // symbols, since sequential-logic symbols (latches, flip-flops)
        // haven't been taught yet — this still directly tests "does the
        // output depend only on current inputs" without needing them.
        kind: 'multi',
        text: () => '<b style="color:var(--colour-ui-primary)">Click</b> every system below that is an example of <b class="colour-bjt">combinational</b> logic. There are <b style="color:var(--colour-ui-correct)">3 correct</b> systems among the 5 shown.',
        hint: () => 'Ask yourself: does the output depend only on the inputs right now, or does it also depend on something that happened earlier — a stored state, a previous press, a timer?',
        options: () => shuffle([
          { label: 'A car\'s high-beam warning light, lit whenever the headlights are on AND high-beam is selected', type: 'correct' },
          { label: 'A doorbell chime that keeps sounding for 2 seconds after the button is released, then stops', type: 'wrong' },
          { label: 'A 3-input majority-vote circuit that outputs 1 whenever two or more of its three inputs are 1', type: 'correct' },
          { label: 'A light switch circuit where flicking the switch turns the light on, and flicking it again turns it off', type: 'wrong' },
          { label: 'A seatbelt warning light, lit whenever the ignition is on AND the driver\'s seatbelt is unbuckled', type: 'correct' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are combinational`;
        },
        working: (st) => {
          const correctL = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          const wrongL = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Combinational — options ${correctL}:</div>
    <div class="working-line">Each of these combines its current input conditions with plain AND/OR logic — no memory of anything that happened previously is needed to work out the output right now.</div>
    <div class="working-step" style="margin-top:.6rem">Not combinational — options ${wrongL}:</div>
    <div class="working-line">The doorbell needs a timer to keep sounding after the button is released — its output depends on the past, not just the present. The toggle switch needs to remember which position it was last in to know which way "flicking it" should act. Both need a memory element, making them <b class="colour-bjt">sequential</b> logic.</div>`;
        }
      },
      {
        // Objective: predict the output for given input levels — simplest
        // case, 2 inputs, 2 levels.
        circuitId: 'combo-2level-a',
        circuitLabel: '2-Level Combinational Circuit',
        text: () => 'For the circuit shown, with  <span style="color:var(--colour-signal)">A = 0</span> and <span style="color:var(--colour-signal)">B = 1</span>, what is the output <span style="color:var(--colour-signal)">Z</span>?',
        hint: () => 'Work through it one gate at a time: find the first gate\'s output first, then feed that result into the second gate.',
        options: () => shuffle([
          { label: '0', type: 'wrong' },
          { label: '1', type: 'correct' },
          { label: 'Cannot be determined without a clock signal', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Z = 1</b>',
        working: () => `
    <div class="working-step">Level 1 — the AND gate:</div>
    <div class="working-line">A AND B = 0 AND 1 = <b style="color:var(--colour-bjt)">0</b>.</div>
    <div class="working-step" style="margin-top:.6rem">Level 2 — the NOT gate:</div>
    <div class="working-line">NOT(0) = <b style="color:var(--colour-ui-correct)">1</b> = Z.</div>
    <div class="working-line" style="margin-top:.4rem">A common mistake is stopping after the AND gate and answering 0 — always trace the signal all the way through <em>every</em> level to the final output.</div>`
      },
      {
        // Objective: list and explain four reasons for using combinational
        // logic circuits.
        kind: 'multi',
        text: () => '<b style="color:var(--colour-ui-primary)">Select</b> the four main reasons for using combinational logic circuits.',
        hint: () => 'Combinational logic gets used at several different levels — not just for directly controlling equipment, but for working with gates and signals themselves too.',
        options: () => shuffle([
          { label: 'To build one gate\'s function out of other gates — e.g. combining an AND gate and a NOT gate to make the equivalent of a NAND gate', type: 'correct' },
          { label: 'To implement a logic function (truth table) that none of the seven standard gates provides by itself', type: 'correct' },
          { label: 'To implement common digital building blocks, such as an adder or a multiplexer', type: 'correct' },
          { label: 'To control real-world electrical, mechanical, or electromechanical equipment', type: 'correct' },
          { label: 'To store a value so it can still be read back after the input that produced it has changed', type: 'wrong' },
          { label: 'To synchronise several circuits so they all change state together on a clock edge', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const letters = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${letters}</b> — gate-building, custom truth tables, building blocks, and equipment control`;
        },
        working: (st) => {
          const wrongL = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">The four reasons:</div>
    <div class="working-line"><b class="colour-bjt">Building one gate from others</b> — e.g. an AND gate feeding a NOT gate behaves exactly like a single NAND gate, which is handy if NAND gates aren't available but AND and NOT ones are. <b class="colour-bjt">Custom truth tables</b> — sometimes a design needs an output pattern that doesn't match any single standard gate, so several gates are combined to produce exactly that pattern. <b class="colour-bjt">Building blocks</b> — gates are combined into standard reusable subsystems, such as an adder (combines two bits into a sum and a carry) or a multiplexer (selects one of several inputs to pass through). <b class="colour-bjt">Equipment control</b> — combinational logic directly drives real physical outputs, e.g. a warning light that switches on only when two or more separate safety conditions are met at once.</div>
    <div class="working-step" style="margin-top:.6rem">Why options ${wrongL} are wrong:</div>
    <div class="working-line">Reading back a value after its input has changed means the circuit is <em>remembering</em> something — that needs a memory element, making it <b class="colour-bjt">sequential</b> logic, not combinational. Synchronising circuits to a clock edge is also a sequential-logic concern; combinational logic has no clock and no concept of "edges" at all — its output just follows the inputs directly.</div>`;
        }
      },
      {
        // Objective: draw the circuit that implements NOT using a single
        // NAND or NOR gate — tested here as recognition (tying both
        // inputs of an inverting gate together), the same underlying idea
        // as drawing it.
        leftPanel: 'shapeGrid',
        kind: 'multi',
        text: () => '<b style="color:var(--colour-ui-primary)">Click</b> every gate configuration below that correctly implements a <b style="color:var(--colour-ui-primary)">NOT</b> function, using a single gate with both its inputs tied together. There are <b style="color:var(--colour-ui-correct)">2 correct</b> configurations among the 6 shown.',
        hint: () => 'Work out what each gate outputs when both its inputs are forced to carry the same signal, A — only an inverting gate flips that single signal into NOT A.',
        options: () => shuffle([
          { label: 'AND, tied', type: 'wrong', shapeId: 'tied-and' },
          { label: 'NAND, tied', type: 'correct', shapeId: 'tied-nand' },
          { label: 'OR, tied', type: 'wrong', shapeId: 'tied-or' },
          { label: 'NOR, tied', type: 'correct', shapeId: 'tied-nor' },
          { label: 'XOR, tied', type: 'wrong', shapeId: 'tied-xor' },
          { label: 'XNOR, tied', type: 'wrong', shapeId: 'tied-xnor' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Shapes <b>${nums}</b> — NAND and NOR, tied — correctly give NOT A`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Correctly implement NOT — shapes ${correctNums}:</div>
    <div class="working-line">NAND(A, A) = NOT(A AND A) = NOT(A). NOR(A, A) = NOT(A OR A) = NOT(A). Tying the inputs of either inverting gate together produces a clean NOT A.</div>
    <div class="working-step" style="margin-top:.6rem">Do not implement NOT — shapes ${wrongNums}:</div>
    <div class="working-line">AND(A, A) = A and OR(A, A) = A — tying the inputs of a non-inverting gate together just reproduces A unchanged (a "buffer"), not a NOT. XOR(A, A) = 0 and XNOR(A, A) = 1, always — both collapse to a fixed constant regardless of A, which isn't an inversion (or any useful function of A) at all.</div>`;
        }
      },
      {
        // Staged build-up 1 of 3 — teacher's in-class technique for
        // tackling a multi-level truth table: fill in one internal gate's
        // output at a time, working left to right through the network,
        // rather than trying to compute the final output directly. Same
        // combo-3level-generic circuit as the (now-later) full truth-table
        // question. Only B and A feed the first AND gate, so only those
        // two columns are highlighted — C isn't needed yet.
        circuitId: 'combo-3level-generic',
        circuitLabel: '3-Level Combinational Circuit',
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A'],
        highlightLabels: () => ['B', 'A'],
        groupBreakAfter: () => [2],
        headerGroups: () => STAGED_HEADER_GROUPS,
        outputLabel: () => 'X',
        trailingLabels: () => ['Y', 'Z'],
        text: () => 'Build the table up one gate-stage at a time. First, using columns <b style="color:var(--colour-ui-primary)">B</b> and <b style="color:var(--colour-ui-primary)">A</b>, work out <b style="color:var(--colour-ui-primary)">X</b> — the output of the first <b style="color:var(--colour-bjt)">AND gate</b> — for every row.',
        hint: () => 'X is just A AND B. C doesn\'t feed this gate at all, so ignore it for now.',
        options: () => buildStagedRows(
          (c, b, a) => [],
          (c, b, a) => (b === 1 && a === 1) ? 1 : 0,
          () => [null, null]
        ),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">X = B AND A:</div>
    <div class="working-line">X is <b style="color:var(--colour-ui-correct)">1</b> only on rows where both B and A are 1 — every other row gives <b style="color:var(--colour-bjt)">0</b>. C plays no part in this first stage.</div>
    ${truthMistakeLine('C B A', st)}`
      },
      {
        // Staged build-up 2 of 3 — X is now known (carried over as a
        // read-only reference column) and combines with C at the OR gate.
        circuitId: 'combo-3level-generic',
        circuitLabel: '3-Level Combinational Circuit',
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A', 'X'],
        highlightLabels: () => ['C', 'X'],
        groupBreakAfter: () => [2],
        headerGroups: () => STAGED_HEADER_GROUPS,
        outputLabel: () => 'Y',
        trailingLabels: () => ['Z'],
        text: () => 'Now use the columns  <b style="color:var(--colour-ui-primary)">C</b> and <b style="color:var(--colour-ui-primary)">X</b> (you just built) to work out <b style="color:var(--colour-ui-primary)">Y</b> — the output of the <b style="color:var(--colour-bjt)">OR gate</b>.',
        hint: () => 'Y is X OR C. B and A have already done their job feeding X, so they\'re not needed again here.',
        options: () => buildStagedRows(
          (c, b, a) => [(b === 1 && a === 1) ? 1 : 0],
          (c, b, a, extras) => (extras[0] === 1 || c === 1) ? 1 : 0,
          () => [null]
        ),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">Y = X OR C:</div>
    <div class="working-line">Y is <b style="color:var(--colour-ui-correct)">1</b> whenever X is 1, C is 1, or both — and <b style="color:var(--colour-bjt)">0</b> only when both X and C are 0.</div>
    ${truthMistakeLine('C B A X', st)}`
      },
      {
        // Staged build-up 3 of 3 — the final NOT gate only depends on Y,
        // so only Y is highlighted here (confirmed with the user — X is
        // shown for context but isn't actually needed for this last step).
        circuitId: 'combo-3level-generic',
        circuitLabel: '3-Level Combinational Circuit',
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A', 'X', 'Y'],
        highlightLabels: () => ['Y'],
        groupBreakAfter: () => [2, 4],
        headerGroups: () => STAGED_HEADER_GROUPS,
        outputLabel: () => 'Z',
        text: () => 'Finally, use column <b style="color:var(--colour-ui-primary)">Y</b> to work out <b style="color:var(--colour-ui-primary)">Z</b> — the output of the <b style="color:var(--colour-bjt)">NOT gate</b>..',
        hint: () => 'The last gate is a single-input NOT gate fed only by Y — X isn\'t connected to it, so it can\'t affect Z.',
        options: () => buildStagedRows(
          (c, b, a) => { const x = (b === 1 && a === 1) ? 1 : 0; const y = (x === 1 || c === 1) ? 1 : 0; return [x, y]; },
          (c, b, a, extras) => extras[1] === 1 ? 0 : 1
        ),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">Z = NOT(Y):</div>
    <div class="working-line">Z simply inverts Y — <b style="color:var(--colour-ui-correct)">1</b> when Y is 0, and <b style="color:var(--colour-bjt)">0</b> when Y is 1. X isn\'t needed here at all; it already did its job producing Y.</div>
    ${truthMistakeLine('C B A X Y', st)}`
      },
      {
        // Objective: predict the output for given input levels — full
        // spec, 3 inputs, 3 levels.
        circuitId: 'combo-3level',
        circuitLabel: '3-Level Combinational Circuit',
        text: () => 'For the circuit shown, with <span style="color:var(--colour-signal)">A = 1</span>, <span style="color:var(--colour-signal)">B = 1</span> and <span style="color:var(--colour-signal)">C = 0</span>, what is the output <span style="color:var(--colour-signal)">Z</span>?',
        hint: () => 'There are three levels here — work through them strictly in order: the AND gate first, then the OR gate, then the final NOT.',
        options: () => shuffle([
          { label: '0', type: 'correct' },
          { label: '1', type: 'wrong' },
          { label: 'Cannot be determined — too many inputs for one output', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Z = 0</b>',
        working: () => `
    <div class="working-step">Level 1 — the AND gate:</div>
    <div class="working-line">A AND B = 1 AND 1 = <b style="color:var(--colour-bjt)">1</b>.</div>
    <div class="working-step" style="margin-top:.6rem">Level 2 — the OR gate:</div>
    <div class="working-line">(A AND B) OR C = 1 OR 0 = <b style="color:var(--colour-bjt)">1</b>.</div>
    <div class="working-step" style="margin-top:.6rem">Level 3 — the NOT gate:</div>
    <div class="working-line">NOT(1) = <b style="color:var(--colour-ui-correct)">0</b> = Z.</div>
    <div class="working-line" style="margin-top:.4rem">Three inputs and three gate-levels is exactly the upper limit this course covers — the same level-by-level method scales to any combinational network, however many gates it has.</div>`
      },
    ];

    // Builds the staged build-up-the-truth-table rows (Q6–Q8) — always the
    // same 8 rows in C,B,A counting order, with any extra reference
    // columns DERIVED from c,b,a — e.g. X = B AND A — so they must stay
    // fixed per row rather than varying independently. `extraFn(c,b,a)`
    // returns the array of already-known staged column values to display;
    // `zFn(c,b,a,extras)` returns the correct value for the one fillable
    // column this question is asking for. `trailingFn(c,b,a,extras,z)`
    // (optional) returns further already-known columns to display AFTER
    // the fillable one — read-only reference values, shown the same plain
    // way as the given inputs (used by Q6 to preview Y/Z ahead of time).
    function buildStagedRows(extraFn, zFn, trailingFn) {
      const rows = [];
      for (let v = 0; v < 8; v++) {
        const c = (v >> 2) & 1, b = (v >> 1) & 1, a = v & 1;
        const extras = extraFn(c, b, a);
        const z = zFn(c, b, a, extras);
        const trailing = trailingFn ? trailingFn(c, b, a, extras, z) : [];
        rows.push({ inputs: [c, b, a, ...extras], z, trailing });
      }
      return rows;
    }

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
