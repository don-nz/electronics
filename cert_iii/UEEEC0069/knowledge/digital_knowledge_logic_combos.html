<!--
  Continues from digital_knowledge_logic_gates.html — covers the
  "Combinational Logic" lesson objectives: identifying combinational
  circuits, predicting the output of a gate network (up to 3 inputs/3
  levels) for given input levels, building the complete truth table for
  such a network, the four reasons combinational logic is used over relay
  logic, and implementing NOT from a single NAND or NOR gate. Deliberately
  stops short of the lesson's fault-finding objectives (identifying a
  faulty node, which gate caused it, DMM/logic-probe verification) — those
  need a dedicated digital fault-finding UI that doesn't exist yet
  anywhere in this site, and belong in their own follow-up quiz, matching
  the existing split between conceptual-primer and troubleshooter quizzes
  elsewhere (e.g. bjt_knowledge_biasing.html vs bjt_npn_troubleshoot.html).

  Same data-driven QUESTIONS[] engine as digital_knowledge_logic_gates.html,
  trimmed to only the kinds this quiz actually uses ('multi' and 'truth' —
  no 'match' or 'bits' here) plus one addition: a `leftPanel:'circuit'`
  mode (borrowed from the BJT quizzes) that shows a single static reference
  circuit via `circuitId`/`circuitLabel`, for the two "predict the output"
  questions. See digital_knowledge_logic_gates.html's header comment for
  the fuller field reference this file's engine still follows.
-->

  <script>
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see digital_knowledge_logic_gates.html's header comment
    // for the fuller field reference. This file adds one thing that file
    // doesn't need: leftPanel:'circuit' (circuitId/circuitLabel), a single
    // static reference diagram, borrowed from the BJT quizzes' pattern.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: identify combinational logic circuits (definition).
        text: () => 'Which of these best defines a <b style="color:var(--colour-ui-primary)">combinational logic</b> circuit?',
        hint: () => 'Think about whether the circuit needs to \'remember\' anything, or whether its output could be worked out fresh from the inputs alone at any instant.',
        options: () => shuffle([
          { label: 'A circuit whose output depends only on the current combination of its inputs', type: 'correct' },
          { label: 'A circuit whose output depends on the order in which its inputs changed over time', type: 'wrong' },
          { label: 'A circuit that stores a value and only updates it when a clock pulse arrives', type: 'wrong' },
          { label: 'A circuit that can produce a different output each time it\'s powered on, even with the same inputs', type: 'wrong' },
        ]),
        correctExplain: () => 'A combinational circuit\'s output depends <b style="color:var(--colour-ui-primary)">only</b> on its current inputs',
        working: () => `
    <div class="working-step">Combinational vs sequential:</div>
    <div class="working-line">A <b class="colour-bjt">combinational</b> logic circuit is built entirely from gates with no feedback and no memory element — its output at any instant is a pure function of whatever the inputs are at that same instant. Change the inputs, and the output responds immediately (aside from tiny gate propagation delays).</div>
    <div class="working-step" style="margin-top:.6rem">Why the others describe sequential logic instead:</div>
    <div class="working-line">A circuit whose output depends on input <em>history</em>, needs a <em>clock</em>, or can give different outputs from the <em>same</em> inputs is <b class="colour-bjt">sequential</b> logic — a later topic. Combinational logic never "remembers" anything.</div>`
      },
      {
        // Objective: identify combinational logic circuits (applied to
        // real scenarios). Uses described systems rather than schematic
        // symbols, since sequential-logic symbols (latches, flip-flops)
        // haven't been taught yet — this still directly tests "does the
        // output depend only on current inputs" without needing them.
        kind: 'multi',
        text: () => '<b style="color:var(--colour-ui-primary)">Click</b> every system below that is an example of <b class="colour-bjt">combinational</b> logic. There are <b style="color:var(--colour-ui-correct)">3 correct</b> systems among the 5 shown.',
        hint: () => 'Ask yourself: does the output depend only on the inputs right now, or does it also depend on something that happened earlier — a stored state, a previous press, a timer?',
        options: () => shuffle([
          { label: 'A car\'s high-beam warning light, lit whenever the headlights are on AND high-beam is selected', type: 'correct' },
          { label: 'A doorbell chime that keeps sounding for 2 seconds after the button is released, then stops', type: 'wrong' },
          { label: 'A 3-input majority-vote circuit that outputs 1 whenever two or more of its three inputs are 1', type: 'correct' },
          { label: 'A light switch circuit where flicking the switch turns the light on, and flicking it again turns it off', type: 'wrong' },
          { label: 'A seatbelt warning light, lit whenever the ignition is on AND the driver\'s seatbelt is unbuckled', type: 'correct' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are combinational`;
        },
        working: (st) => {
          const correctL = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          const wrongL = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Combinational — options ${correctL}:</div>
    <div class="working-line">Each of these combines its current input conditions with plain AND/OR logic — no memory of anything that happened previously is needed to work out the output right now.</div>
    <div class="working-step" style="margin-top:.6rem">Not combinational — options ${wrongL}:</div>
    <div class="working-line">The doorbell needs a timer to keep sounding after the button is released — its output depends on the past, not just the present. The toggle switch needs to remember which position it was last in to know which way "flicking it" should act. Both need a memory element, making them <b class="colour-bjt">sequential</b> logic.</div>`;
        }
      },
      {
        // Objective: predict the output for given input levels — simplest
        // case, 2 inputs, 2 levels.
        circuitId: 'combo-2level-a',
        circuitLabel: '2-Level Combinational Circuit',
        text: () => 'For the circuit shown, with <b>A = 0</b> and <b>B = 1</b>, what is the output <b>Y</b>?',
        hint: () => 'Work through it one gate at a time: find the first gate\'s output first, then feed that result into the second gate.',
        options: () => shuffle([
          { label: '0', type: 'wrong' },
          { label: '1', type: 'correct' },
          { label: 'Cannot be determined without a clock signal', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Y = 1</b>',
        working: () => `
    <div class="working-step">Level 1 — the AND gate:</div>
    <div class="working-line">A AND B = 0 AND 1 = <b style="color:var(--colour-bjt)">0</b>.</div>
    <div class="working-step" style="margin-top:.6rem">Level 2 — the NOT gate:</div>
    <div class="working-line">NOT(0) = <b style="color:var(--colour-ui-correct)">1</b> = Y.</div>
    <div class="working-line" style="margin-top:.4rem">A common mistake is stopping after the AND gate and answering 0 — always trace the signal all the way through <em>every</em> level to the final output.</div>`
      },
      {
        // Objective: predict the output for given input levels — full
        // spec, 3 inputs, 3 levels.
        circuitId: 'combo-3level',
        circuitLabel: '3-Level Combinational Circuit',
        text: () => 'For the circuit shown, with <b>A = 1</b>, <b>B = 1</b> and <b>C = 0</b>, what is the output <b>Y</b>?',
        hint: () => 'There are three levels here — work through them strictly in order: the AND gate first, then the OR gate, then the final NOT.',
        options: () => shuffle([
          { label: '0', type: 'correct' },
          { label: '1', type: 'wrong' },
          { label: 'Cannot be determined — too many inputs for one output', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Y = 0</b>',
        working: () => `
    <div class="working-step">Level 1 — the AND gate:</div>
    <div class="working-line">A AND B = 1 AND 1 = <b style="color:var(--colour-bjt)">1</b>.</div>
    <div class="working-step" style="margin-top:.6rem">Level 2 — the OR gate:</div>
    <div class="working-line">(A AND B) OR C = 1 OR 0 = <b style="color:var(--colour-bjt)">1</b>.</div>
    <div class="working-step" style="margin-top:.6rem">Level 3 — the NOT gate:</div>
    <div class="working-line">NOT(1) = <b style="color:var(--colour-ui-correct)">0</b> = Y.</div>
    <div class="working-line" style="margin-top:.4rem">Three inputs and three gate-levels is exactly the upper limit this course covers — the same level-by-level method scales to any combinational network, however many gates it has.</div>`
      },
      {
        // Objective: develop the complete truth table for a combinational
        // circuit — same network as the previous question, all 8 rows.
        kind: 'truth',
        inputLabels: () => ['A', 'B', 'C'],
        inputsHeading: () => '<span class="colour-bjt" style="font-size:1.02rem">Combinational Circuit</span> Inputs',
        outputHeading: () => 'Output',
        outputLabel: () => 'Y',
        text: () => 'Complete the truth table for the <b>same circuit</b> as the previous question: <b>Y = NOT((A AND B) OR C)</b>. Tap a cell in the Y column to cycle it 0 → 1 → blank.',
        hint: () => 'Build it up column by column: work out A AND B first, then OR that with C, then invert the result for Y.',
        options: () => buildTruthRows(3, COMBO_FN),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">Y = NOT((A AND B) OR C):</div>
    <div class="working-line">Y is <b style="color:var(--colour-bjt)">0</b> whenever A AND B are both 1, OR C is 1 (or both) — because that makes the OR gate's output 1, which the final NOT then flips to 0. Y is <b style="color:var(--colour-ui-correct)">1</b> only on the rows where A AND B are NOT both 1, AND C is 0.</div>
    ${truthMistakeLine('A B C', st)}`
      },
      {
        // Objective: list and explain four reasons for using combinational
        // logic (over relay/switch-based logic).
        kind: 'multi',
        text: () => '<b style="color:var(--colour-ui-primary)">Select</b> the four main reasons combinational (electronic) logic is used in modern control systems instead of electromechanical relay logic.',
        hint: () => 'Think about what problems relays have — moving parts, physical size, switching speed — and how solid-state logic compares on each.',
        options: () => shuffle([
          { label: 'Cost — fewer components are needed to implement complex logic than an equivalent relay-based circuit', type: 'correct' },
          { label: 'Speed — electronic switching is far faster than mechanical relay contacts', type: 'correct' },
          { label: 'Reliability — no moving parts to wear out, arc, or need physical maintenance', type: 'correct' },
          { label: 'Size — solid-state logic circuits are far more compact than the equivalent relay wiring', type: 'correct' },
          { label: 'Combinational logic can store a value in memory, unlike relay logic', type: 'wrong' },
          { label: 'Combinational logic never needs to be tested once it has been installed', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-bjt">Cost, Speed, Reliability</b> and <b class="colour-bjt">Size</b> are the four reasons',
        working: (st) => {
          const wrongL = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">The four reasons:</div>
    <div class="working-line"><b class="colour-bjt">Cost</b> — a handful of gates replaces a rack of relays and switches for the same logic function. <b class="colour-bjt">Speed</b> — gates switch electronically in nanoseconds; relay contacts take milliseconds to physically move. <b class="colour-bjt">Reliability</b> — no contacts to wear out, pit, or arc over time. <b class="colour-bjt">Size</b> — a chip full of gates takes a fraction of the space of the equivalent relay wiring.</div>
    <div class="working-step" style="margin-top:.6rem">Why options ${wrongL} are wrong:</div>
    <div class="working-line">Storing a value in memory is a <b class="colour-bjt">sequential</b> logic job, not combinational's. And every logic circuit — combinational or otherwise — still needs to be tested and verified once installed; nothing about combinational logic makes that unnecessary.</div>`;
        }
      },
      {
        // Objective: draw the circuit that implements NOT using a single
        // NAND or NOR gate — tested here as recognition (tying both
        // inputs of an inverting gate together), the same underlying idea
        // as drawing it.
        leftPanel: 'shapeGrid',
        kind: 'multi',
        text: () => '<b style="color:var(--colour-ui-primary)">Click</b> every gate configuration below that correctly implements a <b style="color:var(--colour-ui-primary)">NOT</b> function, using a single gate with both its inputs tied together. There are <b style="color:var(--colour-ui-correct)">2 correct</b> configurations among the 6 shown.',
        hint: () => 'Work out what each gate outputs when both its inputs are forced to carry the same signal, A — only an inverting gate flips that single signal into NOT A.',
        options: () => shuffle([
          { label: 'AND, tied', type: 'wrong', shapeId: 'tied-and' },
          { label: 'NAND, tied', type: 'correct', shapeId: 'tied-nand' },
          { label: 'OR, tied', type: 'wrong', shapeId: 'tied-or' },
          { label: 'NOR, tied', type: 'correct', shapeId: 'tied-nor' },
          { label: 'XOR, tied', type: 'wrong', shapeId: 'tied-xor' },
          { label: 'XNOR, tied', type: 'wrong', shapeId: 'tied-xnor' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Shapes <b>${nums}</b> — NAND and NOR, tied — correctly give NOT A`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Correctly implement NOT — shapes ${correctNums}:</div>
    <div class="working-line">NAND(A, A) = NOT(A AND A) = NOT(A). NOR(A, A) = NOT(A OR A) = NOT(A). Tying the inputs of either inverting gate together produces a clean NOT A.</div>
    <div class="working-step" style="margin-top:.6rem">Do not implement NOT — shapes ${wrongNums}:</div>
    <div class="working-line">AND(A, A) = A and OR(A, A) = A — tying the inputs of a non-inverting gate together just reproduces A unchanged (a "buffer"), not a NOT. XOR(A, A) = 0 and XNOR(A, A) = 1, always — both collapse to a fixed constant regardless of A, which isn't an inversion (or any useful function of A) at all.</div>`;
        }
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // Trimmed from digital_knowledge_logic_gates.html's engine: no 'match'
    // or 'bits' kinds (unused here), plus one addition — leftPanel:'circuit'.
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isTruth(data) { return data.kind === 'truth'; }

    // ── kind:'truth' shared helpers (see digital_knowledge_logic_gates.html
    // for the fuller version this is adapted from — this file has no
    // input-count toggle, since its one 'truth' question is fixed at 3
    // inputs, matching the lesson's own "up to three inputs" spec exactly). ──
    function zFromClicks(n) { const m = n % 3; return m === 0 ? null : m - 1; }
    function buildTruthRows(n, fn) {
      const rows = [];
      for (let v = 0; v < (1 << n); v++) {
        const inputs = [];
        for (let b = n - 1; b >= 0; b--) inputs.push((v >> b) & 1);
        rows.push({ inputs, z: fn(inputs) });
      }
      return rows;
    }
    // Y = NOT((A AND B) OR C) — the same network as Q3/Q4's circuits.
    function COMBO_FN(inputs) {
      const [a, b, c] = inputs;
      const and = (a === 1 && b === 1) ? 1 : 0;
      const or = (and === 1 || c === 1) ? 1 : 0;
      return or === 1 ? 0 : 1;
    }
    function truthCorrectExplain(st) {
      const wrongCount = st.opts.filter((o, i) => zFromClicks(st.clicks[i]) !== st.cor[i]).length;
      return wrongCount === 0 ? `All ${st.opts.length} rows correct` : `${st.opts.length - wrongCount} of ${st.opts.length} rows correct`;
    }
    function truthMistakeLine(labels, st) {
      const mistakes = st.opts
        .map((o, i) => ({ o, i }))
        .filter(({ i }) => zFromClicks(st.clicks[i]) !== st.cor[i])
        .map(({ o }) => `${labels} = ${o.inputs.join(' ')}`);
      return mistakes.length
        ? `<div class="working-step" style="margin-top:.6rem">Incorrect rows:</div><div class="working-line">${mistakes.join(', ')}</div>`
        : '';
    }

    function isAnswerCorrect(data, st) {
      if (isTruth(data)) return st.clicks.every((n, r) => zFromClicks(n) === st.cor[r]);
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (isTruth(data)) {
        const correct = st.clicks.filter((n, r) => zFromClicks(n) === st.cor[r]).length;
        return `${correct} / ${st.opts.length} rows correct`;
      }
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      const asLabel = i => data.leftPanel === 'shapeGrid' ? (i + 1) : LETTERS[i];
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(asLabel).join(', ') : '—';
    }
    function fillCorrectSelection(i) {
      const data = QUESTIONS[i], st = Q[i];
      if (isTruth(data)) st.clicks = st.cor.map(z => z + 1);
      else if (isMulti(data)) st.sel = [...st.cor];
      else st.sel = st.cor;
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderShapeGrid() {
      const st = Q[cur];
      const c = document.getElementById('shapeGridCells'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const cell = document.createElement('div'); cell.className = 'shape-cell';
        const selected = st.sel.includes(i);
        if (st.ans) {
          if (opt.type === 'correct') cell.classList.add(selected ? 'correct' : 'missed');
          else cell.classList.add(selected ? 'wrong' : 'dimmed');
        } else {
          if (selected) cell.classList.add('selected');
          cell.addEventListener('click', () => selectOption(i));
        }
        const content = opt.shapeId
          ? `<svg viewBox="-32 -36 96 76"><use href="#${opt.shapeId}"/></svg>`
          : `<div class="shape-cell-text">${opt.label}</div>`;
        cell.innerHTML = `<span class="shape-num">${i + 1}</span>${content}`;
        c.appendChild(cell);
      });
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur], multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        const selected = multi ? st.sel.includes(i) : i === st.sel;
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (opt.type === 'correct') {
            const missed = multi && !selected;
            btn.classList.add(missed ? 'missed' : 'correct');
            btn.innerHTML += `<span class="result-icon">${missed ? '○' : '✓'}</span>`;
          } else if (selected) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
          else btn.classList.add('dimmed');
        } else {
          if (selected) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function renderTruth() {
      const st = Q[cur], data = QUESTIONS[cur];
      const inputLabels = data.inputLabels();
      document.getElementById('truthInputHead').colSpan = inputLabels.length;
      document.getElementById('truthInputHead').innerHTML = data.inputsHeading();
      document.getElementById('truthOutputHead').textContent = data.outputHeading();
      document.getElementById('truthColLabels').innerHTML =
        inputLabels.map(l => `<th>${l}</th>`).join('') + `<th>${data.outputLabel()}</th>`;

      const body = document.getElementById('truthBody');
      body.innerHTML = '';
      st.opts.forEach((row, r) => {
        const tr = document.createElement('tr');
        row.inputs.forEach(v => {
          const td = document.createElement('td');
          td.textContent = String(v);
          td.className = 'truth-input-cell';
          tr.appendChild(td);
        });
        const zTd = document.createElement('td');
        const z = zFromClicks(st.clicks[r]);
        zTd.textContent = z === null ? '' : String(z);
        if (st.ans) {
          zTd.className = 'bits-cell' + (z === st.cor[r] ? ' correct' : ' wrong');
        } else {
          zTd.className = 'bits-cell';
          zTd.addEventListener('click', () => clickTruthZ(r));
        }
        tr.appendChild(zTd);
        body.appendChild(tr);
      });
    }

    function clickTruthZ(r) {
      const st = Q[cur];
      if (st.ans) return;
      st.clicks[r]++;
      renderQuestion();
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text(st);
      document.getElementById('qHint').innerHTML = data.hint(st);

      document.getElementById('qTruth').style.display = isTruth(data) ? 'block' : 'none';
      document.getElementById('qOptions').style.display = isTruth(data) ? 'none' : '';
      if (isTruth(data)) {
        renderTruth();
      } else if (data.leftPanel === 'shapeGrid') {
        document.getElementById('qOptions').innerHTML = '';
        renderShapeGrid();
      } else {
        renderOptions();
      }

      if (data.circuitId) {
        document.getElementById('circuitRefUse').setAttribute('href', '#' + data.circuitId);
        document.getElementById('circuitRefLabel').textContent = data.circuitLabel || 'Reference Circuit';
      }

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => data.leftPanel === 'shapeGrid' ? i + 1 : LETTERS[i]).join(', ')}`
          : (data.leftPanel === 'shapeGrid' ? 'Click the boxes above to select your answer.' : 'Click every option that applies.');
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (
        isTruth(data) ? !st.clicks.every(n => zFromClicks(n) !== null) :
        (multi ? st.sel.length === 0 : st.sel === null)
      );
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      swapLeftPanel(data.leftPanel === 'shapeGrid' ? 'shapeGrid' : (data.circuitId ? 'circuit' : 'none'));
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isTruth(data)) { if (!st.clicks.every(n => zFromClicks(n) !== null)) return; }
      else if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        const data = QUESTIONS[i];
        Q[i].ans = false;
        if (isTruth(data)) { Q[i].clicks = Q[i].opts.map(() => 0); }
        else Q[i].sel = isMulti(data) ? [] : null;
      }
      renderQuestion();
    }

    function swapLeftPanel(mode) {
      document.getElementById('circuitPanelDiv').style.display = mode === 'circuit' ? '' : 'none';
      document.getElementById('qShapeGridPanel').style.display = mode === 'shapeGrid' ? 'block' : 'none';
      document.getElementById('quizWrap').classList.toggle('single-col', mode === 'none');
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        if (isTruth(data)) {
          const opts = data.options();
          const cor = opts.map(row => row.z);
          return { ans: false, cor, opts, clicks: opts.map(() => 0) };
        }
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      swapLeftPanel('none');
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text(st)}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) { fillCorrectSelection(i); Q[i].ans = true; }
      goToQuestion(n);
      if (answered) { fillCorrectSelection(cur); checkAnswer(); }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        fillCorrectSelection(i);
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
    }
  </script>
