<!--
  Section 8 — "Digital displays" lesson objectives (photographed textbook
  pages, 17 objectives): draw the LED schematic symbol and identify anode/
  cathode; explain the series resistor's purpose; calculate a series
  resistor's value given LED operating parameters and supply EMF; explain
  the circuit operating an LED from a logic gate; explain why an LED must
  be current-SUNK not sourced by a logic gate; list equipment using LED
  seven-segment displays; label the segments in a seven-segment display;
  state each segment's condition for digits 0-9; explain common-anode vs
  common-cathode displays; explain decoder/driver ICs; list LED
  seven-segment advantages/disadvantages; list equipment using LCDs;
  explain reflective vs transmissive LCD operation; state the electrical
  requirement to turn on an LCD segment; explain the circuit operating an
  LCD segment from an XOR gate; list LCD advantages/disadvantages; use a
  DMM/logic probe to test displays.

  The final objective (DMM/logic-probe bench measurement) is deliberately
  DEFERRED — needs physical hardware, matching the exact same split
  already established by digital_knowledge_logic_families.html (and
  digital_knowledge_logic_combos.html/boolean_algebra.html before it) for
  their own bench-measurement objectives. The remaining 16 objectives are
  all genuinely testable as knowledge/calculation/data-interpretation
  questions, covered across Q1-17 (the segments-condition objective gets
  2 questions — one forward lookup digit→segments, one reverse
  segments→digit — since it's explicitly a two-directional skill).

  Resistor calculation (Q3) reuses the teacher's own worked example
  verbatim (VS=5V, LED forward voltage=1.8V, ILED=7mA → R=(5−1.8)/0.007≈
  457Ω, not an E12 preferred value, so 390Ω or 470Ω is used in practice)
  from the photographed Section 8-6 page, including that page's own
  reasoning for why either nearby preferred value is an acceptable
  substitute (the resulting current/brightness difference is too small
  for the human eye to perceive).

  Seven-segment lettering (Q7) reuses the teacher's own Figure 14
  convention exactly: segments labelled a-g starting from the top,
  clockwise (a=top, b=upper-right, c=lower-right, d=bottom,
  e=lower-left, f=upper-left, g=middle) — this is the specific
  "letter allocation to remember" the user flagged from that photo.
  Segment-pattern questions (Q8/Q9) use the standard textbook 7-segment
  truth table for a common font (the same widely-taught figures as
  Floyd's Digital Fundamentals), not a specific manufacturer's datasheet.

  UNLIKE most digital_knowledge_*.html files, this quiz mostly has no
  circuit diagrams or gate shapes needing the full circuit-panel/
  leftPanel apparatus — matching digital_knowledge_logic_families.html's
  own precedent (see that file's header comment for the same reasoning).
  Two exceptions:
    - Q1 embeds a small self-contained inline <svg> directly in that
      question's own text() string — light enough not to need any of the
      shared circuit-panel machinery, but still genuinely visual for an
      objective that literally says "draw the schematic symbol."
    - Q7 (segment lettering) DOES use the full leftPanel:'circuit' +
      kind:'fill' apparatus — originally built as a kind:'match' with
      the letters a-g as fixed columns and position descriptions as pool
      items, then inverted at the user's own request so the seven-
      segment "8" itself is the visual target and the letters a-g are
      the pool items being placed onto it, matching how the teacher's
      own Figure 14 photo actually presents this (labels placed onto a
      drawing of the display, not a table). Reuses the exact slot-box/
      fill-pool mechanic already proven in jfet_knowledge_basics.html/
      mosfet_knowledge_basics.html's own terminal-labelling questions —
      see this file's own SLOT_IDS/RENDER_EXTRA for the (much simpler,
      single fixed diagram, no circuitConfig swap needed) wiring.

  Data-driven QUESTIONS[] engine, using 'multi', 'match' and one 'fill'
  (Q7) — no 'truth'/'bits', nothing here produces a table of 0s/1s to
  fill in.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine from the
  start (project convention for all new quizzes) — just the standard
  QUESTIONS[] data, Q7's own small SLOT_IDS/RENDER_EXTRA wiring, and the
  trailing initQuizNav()/resetQuiz()/initQuizFromURL() bootstrap.
-->

  <script>
    // Small self-contained LED symbol for Q1 — NOT a master-shape copy

    const LED_SYMBOL_SVG = `

        <text x="10" y="75" fill="var(--colour-text)" font-size="16" font-weight="bold" text-anchor="start">X</text>
        <text x="140" y="75" fill="var(--colour-text)" font-size="16" font-weight="bold" text-anchor="end">Y</text>
      </svg>

    // Q7's seven-segment fill diagram — 7 fixed slot ids, one per segment
    // (a-g), in the same order the teacher's own Figure 14 letters them.

    <div class="working-line">A <b>reflective</b> LCD (a basic watch or calculator display) has a mirrored backing layer — it uses whatever ambient light is already available, passing through the liquid crystal twice (in, reflect, out), and needs no power at all just to be visible. It goes dark in a genuinely dark room, the same way a printed page does.</div>
    <div class="working-total">A <b>transmissive</b> LCD (a laptop or phone screen) instead has its own backlight behind the panel, shining light THROUGH it toward the viewer — fully usable in the dark, but that backlight is a real, continuous power cost a reflective display never pays.</div>`
      },
      {
        // Objective: state the electrical requirement to turn on an LCD segment.
        text: () => 'What kind of voltage must be applied across an LCD segment to turn it on?',
        hint: () => 'Think about what happens to a liquid crystal material — and to the display itself — if it\'s left under a steady, unchanging DC voltage for a long time.',
        options: () => shuffle([
          { label: 'An AC voltage — a sustained DC voltage would chemically damage the liquid crystal material over time', type: 'correct' },
          { label: 'A steady DC voltage, the higher the better', type: 'wrong' },
          { label: 'No voltage at all — LCD segments switch using light alone', type: 'wrong' },
          { label: 'A single, momentary DC pulse, with no voltage needed afterward', type: 'wrong' },
        ]),
        correctExplain: () => 'An <b>AC</b> voltage — sustained DC would degrade the liquid crystal.',
        working: () => `
    <div class="working-total">A continuous DC voltage across a liquid crystal segment drives an electrochemical (electrolysis-like) process that permanently damages the material — visible as a "ghost" image burned into the display over time. Driving the segment with AC instead (equal time spent with the voltage each way round) achieves the same electric-field effect needed to turn the segment on, with zero net DC component over time.</div>`
      },
      {
        // Objective: explain the circuit operating an LCD segment from an XOR gate.
        text: () => 'An LCD segment is driven from an XOR gate, with one input tied to the display\'s common "backplane" square-wave signal and the other input carrying the segment\'s ON/OFF data. How does this actually turn the segment on or off?',
        hint: () => 'Work through XOR\'s own truth table: when do the two inputs genuinely differ, and when do they match?',
        options: () => shuffle([
          { label: 'When segment data and backplane DIFFER, the XOR output is the opposite of the backplane — creating a genuine voltage difference across the segment (ON). When they MATCH, the XOR output tracks the backplane exactly, leaving no voltage difference (OFF)', type: 'correct' },
          { label: 'The XOR gate simply passes the backplane signal straight through, unaffected by the data input', type: 'wrong' },
          { label: 'The segment lights whenever the backplane signal alone is HIGH, regardless of the data input', type: 'wrong' },
          { label: 'XOR permanently disables the segment whenever the data input is HIGH', type: 'wrong' },
        ]),
        correctExplain: () => 'Data≠backplane → segment ON (real voltage difference); data=backplane → segment OFF.',
        working: () => `
    <div class="working-line">The backplane is a continuously alternating square wave, common to every segment. XORing it with a segment's own ON/OFF data bit produces an output that either EXACTLY MATCHES the backplane (when data=0) or is EXACTLY INVERTED from it (when data=1).</div>
    <div class="working-total">When the segment's own drive output matches the backplane, both sides of the segment sit at the same voltage at every instant — zero voltage difference, segment OFF. When XOR inverts it (data=1), the segment electrode is always the OPPOSITE polarity to the backplane — a genuine, continuously-alternating voltage difference across the segment, which is what turns it visibly ON. This gives proper AC drive (satisfying the previous question) with a simple single gate per segment.</div>`
      },
      {
        kind: 'match',
        // Objective: list LCD advantages/disadvantages.
        columns: () => ['Advantage', 'Disadvantage'],
        text: () => 'Each statement below describes a property of LCDs. <b style="color:var(--colour-ui-primary)">Place</b> each one under Advantage or Disadvantage.',
        hint: () => 'LCDs don\'t generate their own light (unless backlit) — think about what that saves, and what it costs, compared with a display that does.',
        options: () => shuffle([
          { label: 'Extremely low power consumption, especially in reflective mode', col: 0 },
          { label: 'Good readability in bright ambient light or direct sunlight (reflective mode)', col: 0 },
          { label: 'Slower switching response than an LED display', col: 1 },
          { label: 'A reflective LCD is difficult or impossible to read in the dark without an added backlight', col: 1 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} correctly matched`;
        },
        working: () => `
    <div class="working-line">LCDs don't generate their own light (in reflective mode) — that's exactly why they draw so little power and stay easily readable in bright light, the mirror-image <b>advantages</b> to an LED display's own weak points.</div>
    <div class="working-total">The same lack of a built-in light source is the source of the <b>disadvantages</b>: a reflective LCD is hard to read in the dark without adding a backlight (which then costs power, eroding the low-power advantage), and the liquid crystal material itself physically reorients more slowly than an LED can switch, giving LCDs a visibly slower response.</div>`
      },
    ];

    // Q7 is the only kind:'fill' question in this quiz — show/hide its
    // pool the same way every other fill-mechanic file in this project
    // does. No circuitConfig swap needed (unlike the JFET/MOSFET terminal-
    // labelling files): this quiz only ever shows the one static diagram.
    RENDER_EXTRA = () => {
      const fill = isFill(QUESTIONS[cur]);
      document.getElementById('fillPoolWrap').style.display = fill ? '' : 'none';
      if (fill) {
        const placed = Q[cur].slotPlaced;
        SLOT_IDS.forEach((slotId, i) => {
          const bar = document.getElementById('bar' + slotId.slice(4));
          if (bar) bar.classList.toggle('placed', placed[i] !== null);
        });
      }
    };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
