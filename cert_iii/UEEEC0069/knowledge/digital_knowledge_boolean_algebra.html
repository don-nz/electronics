<!--
  Week 4 — "Boolean Algebra" lesson objectives: describing similarities/
  differences between Boolean and conventional algebra, writing the
  Boolean expression for each of the seven logic gates, developing the
  Boolean expression for a combinational circuit (up to three inputs and
  three stages), writing a truth table from a sum-of-products expression,
  stating DeMorgan's theorems, simplifying expressions using DeMorgan's
  theorems, and analysing a combinational circuit by writing its output
  expression, simplifying it to sum-of-products form, and writing its
  truth table. Deliberately stops short of the lesson's practical
  objective (using a DMM and logic probe to test/verify a real circuit) —
  that needs physical hardware, not a knowledge quiz, matching the
  existing split between conceptual-primer quizzes and hands-on/
  troubleshooter content elsewhere on this site (e.g.
  digital_knowledge_logic_combos.html similarly deferred its own
  fault-finding objectives to a dedicated future quiz).

  Same data-driven QUESTIONS[] engine as digital_knowledge_logic_combos.html
  (itself cloned from digital_knowledge_logic_gates.html), trimmed to only
  the kinds this quiz actually uses: 'multi', 'truth' (single-pass, not
  staged — see Q5) and 'match' (ported in from digital_knowledge_logic_gates.
  html for the seven-gate-expression question, Q2 — this quiz's one addition
  beyond what logic_combos.html itself carries), plus leftPanel:'circuit'
  for the three questions with a reference circuit diagram. No 'bits' kind
  and no leftPanel:'shapeGrid' — unused here, so left out entirely, matching
  the site's established "only carry the engine features actually used"
  convention.

  Boolean notation used throughout: "·" for AND, "+" for OR, and an
  overline (CSS class .ovl, text-decoration:overline) for NOT/complement —
  applied to a <span> wrapping whatever the bar needs to cover, so it works
  identically for a single variable (Ā) or a whole grouped sub-expression
  (overline over "A + B"). Deliberately avoided any expression needing a
  NESTED overline (a bar-within-a-bar) anywhere in this file — two
  independent text-decoration:overline elements stacked inside one another
  isn't guaranteed to render as two cleanly separated bars across browsers,
  so every worked example here only ever negates plain, not-already-barred
  content.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine — the first
  file to actually exercise kind:'truth' there (added this same session,
  reverse-engineered from this file's own then-local renderTruth()/
  truthCorrectExplain()/truthMistakeLine()/zFromClicks(), byte-identical to
  what's now shared). Needs only CIRCUIT_SVG_ID='circuitRefSvg' — no
  DEFAULT_CIRCUIT_VIEWBOX (viewBox never changes), no SHAPE_VIEWBOX/
  MATCH_COL_TITLE_MAX_WIDTH overrides (this file's own match question
  already used the shared engine's exact default values), no
  SUMMARY_CIRCUIT_REF (summary always shows swapLeftPanel('none'), same as
  the shared default). This migration is also what prompted a shared-engine
  fix: renderQuestion()'s leftPanel default now falls back to 'circuit'
  only when a question actually carries a circuitId (this file mixes
  circuit and non-circuit questions using ONLY circuitId presence to
  decide, never an explicit leftPanel field on most questions) rather than
  defaulting bare to 'circuit', which would have shown an empty circuit
  panel on every non-circuit question.
-->

      <!-- ── Q3: 2-stage network, Z = Ā · B — every wire endpoint below is
           computed directly from each gate's own translate(tx,ty)

           (-24,∓8)/(44,0), a 1-input gate's at local (-24,0)/(44,0); world

  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see digital_knowledge_logic_gates.html's header comment
    // for the fuller field reference this file's engine follows. This file
    // uses: default (single-select), 'multi', 'truth' (single-pass, via
    // buildTableRows below — no staging, unlike logic_combos.html's own
    // 'truth' questions, since "write a truth table from a given SOP
    // expression" is a one-shot skill, not a multi-gate build-up), 'match'
    // (ported from digital_knowledge_logic_gates.html for Q2), and
    // leftPanel:'circuit' (borrowed from the BJT quizzes, same as
    // logic_combos.html) for Q3/Q4/Q9.
    // ══════════════════════════════════════════════════════════════════════

    // Q5's own truth-table row builder — a fixed 3-input (C, B, A) table,
    // built from a named-argument boolean function rather than the
    // array-based (inputs) => z convention digital_knowledge_logic_gates.
    // html's buildTruthRows(n, fn) uses, since reading the expression as
    // named C/B/A variables matches how this lesson's own algebra notation
    // reads. Page-local (not part of the shared quiz-engine.js) — same
    // reasoning as GATE_FN/buildTruthRows staying local to logic_gates.html:
    // every file's own truth-table CONTENT differs too much to share.
    function buildTableRows(fn) {
      const rows = [];
      for (let v = 0; v < 8; v++) {
        const c = (v >> 2) & 1, b = (v >> 1) & 1, a = v & 1;
        rows.push({ inputs: [c, b, a], z: fn(c, b, a) });
      }
      return rows;
    }

    const QUESTIONS = [
      {
        // Objective: describe similarities/differences, Boolean vs
        // conventional algebra.
        kind: 'multi',
        text: () => 'Boolean algebra and conventional (ordinary) algebra share some ideas but differ in important ways. <b style="color:var(--colour-ui-primary)">Select</b> every statement below that correctly describes Boolean algebra. There are <b style="color:var(--colour-ui-correct)">4 correct</b> statements among the 6 shown.',
        hint: () => 'Think about what values a variable is allowed to take, and what the + and · symbols actually mean here, compared with ordinary arithmetic.',
        options: () => shuffle([
          { label: 'A Boolean variable can only ever be 0 or 1 — conventional algebra variables can take any real number', type: 'correct' },
          { label: 'Just like conventional algebra, Boolean algebra has variables, constants, and operators that combine into expressions you can simplify', type: 'correct' },
          { label: 'In Boolean algebra, 1 + 1 = 1, not 2 — "+" means OR here, not arithmetic addition', type: 'correct' },
          { label: 'Both algebras obey a distributive law — e.g. A·(B + C) = A·B + A·C works in Boolean algebra just like conventional algebra\'s a(b+c) = ab+ac', type: 'correct' },
          { label: 'Both algebras include subtraction and division as basic operations', type: 'wrong' },
          { label: 'The commutative law (A + B = B + A) holds in conventional algebra but not in Boolean algebra', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> — restricted to 0/1, but still algebraic`;
        },
        working: (st) => {
          const wrongL = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">The key difference:</div>
    <div class="working-line">Boolean variables are restricted to exactly two values, <b class="colour-bjt">0</b> and <b class="colour-bjt">1</b> — conventional algebra's variables can be any real number. "+" means <b class="colour-bjt">OR</b> and "·" means <b class="colour-bjt">AND</b>, not arithmetic sum/product — which is why 1 + 1 = 1 (still just "true"), not 2.</div>
    <div class="working-step" style="margin-top:.6rem">The key similarity:</div>
    <div class="working-line">Despite that restriction, Boolean algebra is still a genuine algebra — it has its own commutative, associative and distributive laws (matching conventional algebra's own laws in <em>form</em>, even though the values and operators mean something different), and expressions built from variables and operators can be manipulated and simplified the same way.</div>
    <div class="working-step" style="margin-top:.6rem">Why options ${wrongL} are wrong:</div>
    <div class="working-line">Boolean algebra has no subtraction or division — there's no Boolean value that "undoes" OR or AND the way subtraction undoes addition. And the commutative law holds in <em>both</em> algebras: A + B = B + A is just as true in Boolean algebra as a + b = b + a is in conventional algebra.</div>`;
        }
      },
      {
        // Objective: write the Boolean expression for each of the seven
        // logic gates — kind:'match' with shape-based columns (ported from
        // digital_knowledge_logic_gates.html's own Q2, which does the same
        // thing for gate NAMES rather than expressions).
        leftPanel: 'none',
        kind: 'match',
        columns: () => [
          { shapeId: 'gate-and-trad' },
          { shapeId: 'gate-or-trad' },
          { shapeId: 'gate-not-trad' },
          { shapeId: 'gate-nand-trad' },
          { shapeId: 'gate-nor-trad' },
          { shapeId: 'gate-xor-trad' },
          { shapeId: 'gate-xnor-trad' }
        ],
        text: () => 'Each of the seven logic gates has its own Boolean expression. <span style="color:var(--colour-ui-primary)">Place</span> each expression in the box under the gate it belongs to.',
        hint: () => 'Start with the three basic gates — AND uses ·, OR uses +, NOT uses an overline. Every other gate is just one of those three with an overline added over the whole thing, to invert the output. If you change your mind, click a placed expression to send it back to the pool.',
        options: () => shuffle([
          { label: 'A · B', col: 0 },
          { label: 'A + B', col: 1 },
          { label: '<span class="ovl">A</span>', col: 2 },
          { label: '<span class="ovl">A · B</span>', col: 3 },
          { label: '<span class="ovl">A + B</span>', col: 4 },
          { label: 'A ⊕ B', col: 5 },
          { label: '<span class="ovl">A ⊕ B</span>', col: 6 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 7 expressions placed correctly' : `${st.opts.length - wrongCount} of ${st.opts.length} expressions placed correctly`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Misplaced:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">The three basic gates:</div>
    <div class="working-line"><b class="colour-bjt">AND</b> = A · B. <b class="colour-bjt">OR</b> = A + B. <b class="colour-bjt">NOT</b> = <span class="ovl">A</span> — an overline over whatever it's inverting.</div>
    <div class="working-step" style="margin-top:.6rem">The inverting gates — just add an overline:</div>
    <div class="working-line"><b class="colour-bjt">NAND</b> = <span class="ovl">A · B</span> (AND, inverted). <b class="colour-bjt">NOR</b> = <span class="ovl">A + B</span> (OR, inverted). <b class="colour-bjt">XOR</b> = A ⊕ B (true when the inputs <em>differ</em>). <b class="colour-bjt">XNOR</b> = <span class="ovl">A ⊕ B</span> (XOR, inverted — true when the inputs <em>agree</em>).</div>
    <div class="working-line" style="margin-top:.4rem">Same rule every time: the overline always means "take everything underneath it, and invert the result" — whether that's a single variable or a whole expression.</div>
    ${mistakeLine}`;
        }
      },
      {
        // Objective: develop the Boolean expression for a combinational
        // circuit — simplest case, 2 inputs, 2 stages.
        circuitId: 'expr-2stage',
        circuitLabel: '2-Stage Combinational Circuit',
        text: () => 'For the circuit shown, what is the Boolean expression for the output <span style="color:var(--colour-signal)">Z</span>?',
        hint: () => 'Trace it stage by stage: first write the expression for the NOT gate\'s output, then combine that result with B at the AND gate.',
        options: () => shuffle([
          { label: '<span class="ovl">A</span> · B', type: 'correct' },
          { label: 'A · B', type: 'wrong' },
          { label: '<span class="ovl">A · B</span>', type: 'wrong' },
          { label: '<span class="ovl">A</span> + B', type: 'wrong' },
        ]),
        correctExplain: () => 'Z = <span class="ovl">A</span> · B',
        working: () => `
    <div class="working-step">Stage 1 — the NOT gate:</div>
    <div class="working-line">The NOT gate only sees A, so its output is simply <b style="color:var(--colour-ui-correct)"><span class="ovl">A</span></b>.</div>
    <div class="working-step" style="margin-top:.6rem">Stage 2 — the AND gate:</div>
    <div class="working-line">The AND gate combines that result with B: Z = <b style="color:var(--colour-ui-correct)"><span class="ovl">A</span> · B</b>.</div>
    <div class="working-line" style="margin-top:.4rem">A common mistake is writing <span class="ovl">A · B</span> — that puts the overline over the <em>whole product</em>, as if the NOT gate came <em>after</em> the AND gate instead of before it. Always match the overline's reach to what the NOT gate actually sees as its input.</div>`
      },
      {
        // Objective: develop the Boolean expression for a combinational
        // circuit — full spec, 3 inputs, 3 stages.
        circuitId: 'expr-3stage',
        circuitLabel: '3-Stage Combinational Circuit',
        text: () => 'For the circuit shown, what is the Boolean expression for the output <span style="color:var(--colour-signal)">Z</span>?',
        hint: () => 'Work through the three stages strictly in order: the OR gate first (A, B), then AND with C, then the final NOT.',
        options: () => shuffle([
          { label: '<span class="ovl">(A + B) · C</span>', type: 'correct' },
          { label: '(A + B) · C', type: 'wrong' },
          { label: '<span class="ovl">A + B</span> · C', type: 'wrong' },
          { label: 'A + B · C', type: 'wrong' },
        ]),
        correctExplain: () => 'Z = <span class="ovl">(A + B) · C</span>',
        working: () => `
    <div class="working-step">Stage 1 — the OR gate:</div>
    <div class="working-line">A + B.</div>
    <div class="working-step" style="margin-top:.6rem">Stage 2 — the AND gate:</div>
    <div class="working-line">(A + B) · C — the parentheses matter here: C is ANDed with the <em>whole</em> OR result, not just B.</div>
    <div class="working-step" style="margin-top:.6rem">Stage 3 — the NOT gate:</div>
    <div class="working-line">The final NOT gate inverts everything that came before it: Z = <b style="color:var(--colour-ui-correct)"><span class="ovl">(A + B) · C</span></b>.</div>
    <div class="working-line" style="margin-top:.4rem">Three inputs and three gate-stages is exactly the upper limit this course covers — the same level-by-level method scales to any combinational network, however many gates it has.</div>`
      },
      {
        // Objective: write a truth table from a sum-of-products Boolean
        // expression. Single-pass (all 8 rows fillable at once) — unlike
        // digital_knowledge_logic_combos.html's staged truth questions
        // (which build up a multi-gate network's output one internal stage
        // at a time), this is a one-shot skill: given a finished SOP
        // expression, evaluate it directly for every input combination.
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A'],
        headerGroups: () => [{ label: 'Inputs', span: 3 }, { label: 'Output', span: 1 }],
        outputLabel: () => 'Z',
        text: () => 'Build the truth table for <b>Z = A · B + <span class="ovl">A</span> · C</b>.',
        hint: () => 'Z is 1 whenever EITHER product term is 1. Check A·B first, then <span class="ovl">A</span>·C, and OR the two results together for each row.',
        options: () => buildTableRows((c, b, a) => ((a === 1 && b === 1) || (a === 0 && c === 1)) ? 1 : 0),
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-step">Z = A·B + <span class="ovl">A</span>·C:</div>
    <div class="working-line">This is a <b class="colour-bjt">sum-of-products</b> expression — two AND terms (products) combined with OR (the sum). Z is <b style="color:var(--colour-ui-correct)">1</b> on any row where A·B is 1, OR <span class="ovl">A</span>·C is 1 — and <b style="color:var(--colour-bjt)">0</b> only when both terms are 0.</div>
    <div class="working-line" style="margin-top:.4rem">Notice the two terms never need A to agree — A·B needs A = 1, while <span class="ovl">A</span>·C needs A = 0 — so exactly one of the two terms can possibly be 1 on any given row (never both at once here).</div>
    ${truthMistakeLine('C B A', st)}`
      },
      {
        // Objective: state DeMorgan's theorems.
        kind: 'multi',
        text: () => '<b style="color:var(--colour-ui-primary)">Select</b> the two correct statements of DeMorgan\'s theorems.',
        hint: () => 'Both theorems do the same two things at once: they flip AND to OR (or OR to AND), AND they move the overline from covering the whole expression to covering each variable separately.',
        options: () => shuffle([
          { label: '<span class="ovl">A · B</span> = <span class="ovl">A</span> + <span class="ovl">B</span>', type: 'correct' },
          { label: '<span class="ovl">A + B</span> = <span class="ovl">A</span> · <span class="ovl">B</span>', type: 'correct' },
          { label: '<span class="ovl">A · B</span> = <span class="ovl">A</span> · <span class="ovl">B</span>', type: 'wrong' },
          { label: '<span class="ovl">A + B</span> = <span class="ovl">A</span> + <span class="ovl">B</span>', type: 'wrong' },
          { label: '<span class="ovl">A</span> + <span class="ovl">B</span> = A · B', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are DeMorgan's theorems`;
        },
        working: (st) => {
          const wrongL = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">DeMorgan's two theorems:</div>
    <div class="working-line"><b class="colour-bjt">Theorem 1</b>: <span class="ovl">A · B</span> = <span class="ovl">A</span> + <span class="ovl">B</span> — breaking a NAND apart flips AND into OR. <b class="colour-bjt">Theorem 2</b>: <span class="ovl">A + B</span> = <span class="ovl">A</span> · <span class="ovl">B</span> — breaking a NOR apart flips OR into AND.</div>
    <div class="working-step" style="margin-top:.6rem">Why options ${wrongL} are wrong:</div>
    <div class="working-line">The two options that keep the same operator (· stays ·, + stays +) never actually apply the theorem — the whole point of DeMorgan's is that the operator flips when the overline moves. The remaining option drops the overline on the right-hand side entirely, which changes what's being claimed — <span class="ovl">A</span> + <span class="ovl">B</span> actually equals <span class="ovl">A · B</span> (still barred), not A · B (unbarred).</div>`;
        }
      },
      {
        // Objective: simplify a Boolean expression using DeMorgan's —
        // theorem 1 direction (NOR-form starting point).
        text: () => 'Simplify <b>Z = <span class="ovl">A + B</span></b> using DeMorgan\'s theorem.',
        hint: () => 'Apply DeMorgan\'s directly: flip the + to a ·, and move the overline from the whole expression onto each variable separately.',
        options: () => shuffle([
          { label: '<span class="ovl">A</span> · <span class="ovl">B</span>', type: 'correct' },
          { label: '<span class="ovl">A</span> + <span class="ovl">B</span>', type: 'wrong' },
          { label: 'A · B', type: 'wrong' },
          { label: '<span class="ovl">A</span> + B', type: 'wrong' },
        ]),
        correctExplain: () => 'Z = <span class="ovl">A</span> · <span class="ovl">B</span>',
        working: () => `
    <div class="working-step">Applying DeMorgan's theorem:</div>
    <div class="working-line"><span class="ovl">A + B</span> = <span class="ovl">A</span> · <span class="ovl">B</span> — the overline moves off the whole sum and onto each variable individually, and + becomes ·.</div>
    <div class="working-line" style="margin-top:.4rem">Keeping the + unchanged (giving <span class="ovl">A</span> + <span class="ovl">B</span>) is the single most common mistake here — that expression is NOT equal to the original; it's a different function entirely. Dropping the overline altogether (A · B) loses the inversion completely.</div>`
      },
      {
        // Objective: simplify a Boolean expression using DeMorgan's —
        // theorem 2 direction (NAND-form starting point).
        text: () => 'Simplify <b>Z = <span class="ovl">A · B</span></b> using DeMorgan\'s theorem.',
        hint: () => 'Apply DeMorgan\'s directly: flip the · to a +, and move the overline from the whole expression onto each variable separately.',
        options: () => shuffle([
          { label: '<span class="ovl">A</span> + <span class="ovl">B</span>', type: 'correct' },
          { label: '<span class="ovl">A</span> · <span class="ovl">B</span>', type: 'wrong' },
          { label: 'A + B', type: 'wrong' },
          { label: '<span class="ovl">A</span> · B', type: 'wrong' },
        ]),
        correctExplain: () => 'Z = <span class="ovl">A</span> + <span class="ovl">B</span>',
        working: () => `
    <div class="working-step">Applying DeMorgan's theorem:</div>
    <div class="working-line"><span class="ovl">A · B</span> = <span class="ovl">A</span> + <span class="ovl">B</span> — the overline moves off the whole product and onto each variable individually, and · becomes +.</div>
    <div class="working-line" style="margin-top:.4rem">Keeping the · unchanged (giving <span class="ovl">A</span> · <span class="ovl">B</span>) is the single most common mistake here — that expression is NOT equal to the original; it's a different function entirely. Dropping the overline altogether (A + B) loses the inversion completely.</div>`
      },
      {
        // Objective: analyse a combinational circuit — write its output
        // expression, simplify it using DeMorgan's, and express the
        // result in sum-of-products form. Deliberately combines Q3/Q4's
        // skill (develop the expression from a circuit) with Q7/Q8's
        // skill (simplify using DeMorgan's) into one integration question —
        // the truth-table half of this same objective is covered
        // separately by Q5.
        circuitId: 'expr-nand-and',
        circuitLabel: 'NAND–AND Combinational Circuit',
        text: () => 'For the circuit shown, write the output <span style="color:var(--colour-signal)">Z</span> as a simplified <b>sum-of-products</b> expression.',
        hint: () => 'First write the raw expression stage by stage (NAND, then AND with C). Then apply DeMorgan\'s theorem to the NAND\'s output, and distribute C across the result to reach sum-of-products form.',
        options: () => shuffle([
          { label: '<span class="ovl">A</span> · C + <span class="ovl">B</span> · C', type: 'correct' },
          { label: '<span class="ovl">A · B</span> · C', type: 'wrong' },
          { label: '<span class="ovl">A</span> + <span class="ovl">B</span> · C', type: 'wrong' },
          { label: 'A · B · <span class="ovl">C</span>', type: 'wrong' },
        ]),
        correctExplain: () => 'Z = <span class="ovl">A</span> · C + <span class="ovl">B</span> · C',
        working: () => `
    <div class="working-step">Step 1 — the raw expression:</div>
    <div class="working-line">The NAND gate gives <span class="ovl">A · B</span>; the AND gate combines that with C: Z = <span class="ovl">A · B</span> · C.</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — apply DeMorgan's theorem:</div>
    <div class="working-line"><span class="ovl">A · B</span> = <span class="ovl">A</span> + <span class="ovl">B</span>, so Z = (<span class="ovl">A</span> + <span class="ovl">B</span>) · C.</div>
    <div class="working-step" style="margin-top:.6rem">Step 3 — distribute C to reach sum-of-products:</div>
    <div class="working-line">(<span class="ovl">A</span> + <span class="ovl">B</span>) · C = <span class="ovl">A</span> · C + <span class="ovl">B</span> · C — same distributive law as conventional algebra's a(b+c) = ab+ac. Two product terms, ORed together: sum-of-products, and about as simple as this expression gets.</div>
    <div class="working-line" style="margin-top:.4rem">Not distributing C across both terms (leaving <span class="ovl">A</span> + <span class="ovl">B</span> · C) is a common stopping-too-early mistake — DeMorgan's alone gets you to the right operators, but you still need the distributive law to actually reach sum-of-products form.</div>`
      },
    ];

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
