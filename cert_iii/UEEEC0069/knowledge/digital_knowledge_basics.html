<!--
  TEMPLATE FILE — read before cloning for a new weekly quiz.

  This file uses a data-driven quiz engine: a single `QUESTIONS` array (in the
  <script>, search "QUESTIONS —") drives one generic HTML panel and a generic
  set of engine functions (renderQuestion, checkAnswer, nextQuestion, etc).
  There is deliberately NO per-question HTML or per-question JS function.

  MIGRATED to the shared engine, `assets/quiz-engine.js` (loaded via a plain
  <script src> in <head>, BEFORE this file's own inline <script> — see that
  file's own header comment for the load-order reasoning and the exact
  bootstrap call shape). This was Phase 2 of a wider cert_iii-quiz migration
  (see the project's own "assets/quiz-engine.js migration assessment"),
  synthesized as the union of this file's own engine and bjt_knowledge_
  basics.html's — the two had independently drifted apart (this file gained
  kind:'match'/'bits' the other never got; the other gained leftPanel:'viz',
  a zoom modal, and an xy-ruler dev overlay this file never needed) despite
  being cloned from the same original template.

  The `kind:'match'` HTML markup changed as part of this migration: the old
  hardcoded 2-column structure (`matchColTitle0`/`matchColItems0`/
  `matchColTitle1`/`matchColItems1`, `onclick="assignToColumn(0)"` inline on
  each column) is now the generic N-column version — a single empty
  `<div class="match-columns" id="matchColumns">`, populated dynamically by
  the shared renderMatch() from whatever `data.columns()` returns (this
  file's own 2-string-column question still works unchanged, just via the
  general path instead of a file-specific hardcoded one).

  When cloning this file for a new quiz, keep the two-script-tag structure
  (quiz-engine.js, then your own inline QUESTIONS[] + bootstrap calls) — do
  NOT copy the old inline engine functions back in.

  A `leftPanel` field per question ('none' | 'shapeGrid') swaps the left-hand
  column between nothing (question collapses to a single centred column) and
  a grid of clickable shapes (see Q1's waveforms or Q7's IC packages). Add new
  left-panel modes the same way: a new string value, a new container div, one
  more branch in swapLeftPanel() (now in quiz-engine.js — keep it defensive/
  null-checked when you do).

  A `kind:'multi'` field per question switches it from single-select
  (A/B/C/D, one correct answer) to multi-select (any number of options can be
  toggled on; correctness is a set match) — works for both shapeGrid
  questions (see Q1/Q7) and plain text-option questions (see the ESD
  prevention question). Leave `kind` unset for ordinary single-select
  questions.
-->

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — the template. Add, remove, split or reorder questions by
    // editing this array only — nothing in the engine below needs to change.
    //
    // Each entry:
    //   leftPanel           'none' (default) | 'shapeGrid' — which left-hand
    //                       panel to show for this question
    //   kind                'multi' for multi-select (any number of options
    //                       toggled on); omit for ordinary single-select
    //   text()              question prompt (HTML string)
    //   hint()              hint shown under the prompt (HTML string)
    //   options()           returns a shuffled array of
    //                       { label, type: 'correct'|'wrong', shapeId? }
    //                       (shapeId is only used by leftPanel:'shapeGrid' —
    //                       it names a <g id="..."> in the hidden defs <svg>
    //                       near the top of <body>)
    //   correctExplain(st)  short HTML fragment used in the result banner
    //   working(st)         full worked-solution HTML shown after answering
    //
    // text/hint/options take no arguments; correctExplain/working receive the
    // question's live state `st` ({ sel, ans, cor, opts }) so they can report
    // on what was actually selected/shuffled — ordinary questions can just
    // ignore the argument. All fields are functions (even when static) so a
    // question can freely start simple and later reference live values
    // without changing shape.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Multi-select shape-grid: 4 digital waveforms vs 3 analog waveforms.
        // Deliberately includes two "trap" cases so students can't shortcut
        // to a "square = digital, curvy = analog" heuristic: the sawtooth
        // (sharp edges, but still continuously-varying = analog) and the
        // stepped/quantised sine (curved envelope, but only discrete levels
        // = digital) — the real test is discreteness of levels, not shape.
        leftPanel: 'shapeGrid',
        kind: 'multi',
        text: () => `Click every wave that can be <span style="color:var(--colour-ui-primary)">achieved</span> with a <span style="color:var(--colour-ui-primary)">digital</span> signal.`,
        hint: () => 'Don\'t just look for a "square" shape — a signal is digital if it\'s restricted to a fixed set of discrete levels, however many steps that takes, and analog if it can pass through any value in between. A curved envelope built from steps is still digital; a sharp-edged ramp that passes through every voltage is still analog.',
        options: () => shuffle([
          { label: 'Digital, clean square wave',       type: 'correct', shapeId: 'wave-digital-1' },
          { label: 'Digital, uneven duty cycle',       type: 'correct', shapeId: 'wave-digital-2' },
          { label: 'Digital, single transition',       type: 'correct', shapeId: 'wave-digital-3' },
          { label: 'Digital, stepped/quantised sine',  type: 'correct', shapeId: 'wave-digital-stepped' },
          { label: 'Analog, sine wave',                type: 'wrong',  shapeId: 'wave-analog-sine' },
          { label: 'Analog, sawtooth ramp',            type: 'wrong',  shapeId: 'wave-analog-sawtooth' },
          { label: 'Analog, triangle wave',            type: 'wrong',  shapeId: 'wave-analog-triangle' }
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(n => n).join(', ');
          return `Waveforms <b>${nums}</b> are digital`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Digital — waveforms ${correctNums}:</div>
    <div class="working-line">Each is restricted to a <b style="color:var(--colour-ui-correct)">fixed set of discrete levels</b> — it can never sit at any value except those. The clean square wave, uneven duty cycle and single transition all use just two levels (e.g. 0V / 5V) with sharp jumps between them. The <b>stepped/quantised sine</b> is the important extra case: its overall envelope curves like a sine wave, but at every instant it's still sitting on one of a fixed set of steps — it never smoothly slides between them. That's exactly what a digitised (sampled) version of an analog signal looks like, and it's still digital even though it isn't a simple square wave.</div>
    <div class="working-step" style="margin-top:.6rem">Analog — waveforms ${wrongNums}:</div>
    <div class="working-line">The sine and triangle waves obviously vary continuously. The <b>sawtooth</b> is the trap in the other direction: it has sharp vertical drops, which can look "digital" at a glance — but the rising ramp passes through <em>every</em> voltage between its minimum and maximum, so it's just as analog as the sine wave.</div>
    <div class="working-line" style="margin-top:.4rem">The takeaway: a waveform's <em>shape</em> (square vs curvy, sharp vs smooth) doesn't decide digital vs analog — only whether it's confined to discrete levels does. In principle even a clean square wave could be an analog voltage that just happens to be shaped that way (e.g. from a function generator, or summed from sine-wave harmonics) — in fact a square wave can genuinely be built by adding together enough odd-numbered sine harmonics (Fourier synthesis), no digital circuitry involved at all.</div>
    <div class="working-line" style="margin-top:.4rem">That doesn't change the answer here, though: the question only asks whether each shape <em>can be achieved</em> by a digital signal — not whether digital is the <em>only</em> way to achieve it. A real digital signal genuinely does look exactly like the square/stepped shapes above, so those are correct regardless of whether analog methods could also produce something similar. A true, perfectly smooth sine, triangle or ramp is the one thing no digital signal can ever exactly reproduce — at best it can only be approximated with more and more steps.</div>`;
        }
      },
      {
        leftPanel: 'none',
        text: () => `Which of the following is a genuine <span style="color:var(--colour-ui-primary)">advantage</span> of digital electronics over analog electronics?`,
        hint: () => 'Think about what happens when noise or interference is added to a signal that only needs to be read as one of two levels, versus a signal whose exact voltage matters.',
        options: () => shuffle([
          { label: 'Digital signals are far more resistant to noise, since only two levels need to be distinguished', type: 'correct' },
          { label: 'Digital circuits are always physically smaller than an equivalent analog circuit', type: 'wrong' },
          { label: 'Digital signals can represent infinitely precise values, unlike analog signals', type: 'wrong' },
          { label: 'Digital circuits never need a power supply', type: 'wrong' }
        ]),
        correctExplain: () => 'Digital signals are much more <b>noise-resistant</b>',
        working: () => `
    <div class="working-line">A receiver only has to decide "is this closer to 0 or closer to 1?" — so a fair amount of noise can be added to a digital signal without changing that decision. An analog signal has no such margin: any noise added directly corrupts the value it represents, since the exact voltage <em>is</em> the information.</div>
    <div class="working-step" style="margin-top:.6rem">Why the others are wrong:</div>
    <div class="working-line">Circuit size depends on the specific design, not the analog/digital choice. Precision is actually the opposite of what's stated — digital values are limited by the number of bits used (a fixed resolution), whereas an analog signal can in principle vary continuously. And every circuit, digital or analog, needs a power supply.</div>`
      },
      {
        // kind:'match' — click-to-assign sort into two columns (see
        // renderMatch()/selectPoolItem()/assignToColumn()/unassignItem() in
        // the engine below). `columns()` names the two target columns;
        // each option carries `col: 0|1` for which one it belongs in.
        leftPanel: 'none',
        kind: 'match',
        columns: () => ['Logic-1', 'Logic-0'],
        text: () => `Digital electronics uses several different words for the same two logic states, depending on context. <span style="color:var(--colour-ui-primary)">Place</span> each term below into the column for the logic state it describes.`,
        hint: () => 'Think about where you\'ve seen each word used before: a light switch, a boolean value in programming, an SR latch. Each pair (e.g. On / Off) describes the same two states, just in a different context. If you change your mind, click on the term to return it to the top.',
        options: () => shuffle([
          { label: 'High (Hi)', col: 0 },
          { label: 'True',      col: 0 },
          { label: 'Closed',    col: 0 },
          { label: 'Set',       col: 0 },
          { label: 'On',        col: 0 },
          { label: 'Low (Lo)',  col: 1 },
          { label: 'False',     col: 1 },
          { label: 'Open',      col: 1 },
          { label: 'Reset',     col: 1 },
          { label: 'Off',       col: 1 }
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 10 terms sorted correctly' : `${st.opts.length - wrongCount} of ${st.opts.length} terms sorted correctly`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Mislabelled:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">Logic-1 / High:</div>
    <div class="working-line"><b style="color:var(--colour-current)">High (Hi)</b>, <b style="color:var(--colour-current)">True</b>, <b style="color:var(--colour-current)">Closed</b> (a switch conducting), <b style="color:var(--colour-current)">Set</b> (an SR latch's active output) and <b style="color:var(--colour-current)">On</b> all describe the same state as Logic-1.</div>
    <div class="working-step" style="margin-top:.6rem">Logic-0 / Low:</div>
    <div class="working-line"><b style="color:var(--colour-bjt)">Low (Lo)</b>, <b style="color:var(--colour-bjt)">False</b>, <b style="color:var(--colour-bjt)">Open</b> (a switch not conducting), <b style="color:var(--colour-bjt)">Reset</b> (an SR latch's inactive output) and <b style="color:var(--colour-bjt)">Off</b> all describe the same state as Logic-0.</div>
    <div class="working-line" style="margin-top:.4rem">Which word gets used just depends on context — a switch is "closed" or "open," a latch is "set" or "reset," a light is "on" or "off" — but they all boil down to the same two logic states.</div>
    ${mistakeLine}`;
        }
      },
      {
        leftPanel: 'none',
        text: () => `In standard TTL logic, which <span style="color:var(--colour-ui-primary)">voltage range</span> is typically recognised as <span style="color:var(--colour-ui-primary)">Logic-1 (High)</span>?`,
        hint: () => 'TTL logic typically runs from a 5V supply. Logic-0 sits close to 0V; Logic-1 sits close to the supply rail.',
        options: () => shuffle([
          { label: 'Approximately 2V to 5V', type: 'correct' },
          { label: 'Approximately 0V to 0.8V', type: 'wrong' },
          { label: 'Exactly 3.3V only', type: 'wrong' },
          { label: 'Any voltage above 12V', type: 'wrong' }
        ]),
        correctExplain: () => 'Logic-1 (High) is roughly <b>2V to 5V</b>',
        working: () => `
    <div class="working-line">Standard TTL logic (running from a 5V supply) treats <b style="color:var(--colour-current)">0V–0.8V as Logic-0</b> and <b style="color:var(--colour-current)">2V–5V as Logic-1</b>. The gap between 0.8V and 2V is an undefined/invalid region — a real signal shouldn't sit there for long.</div>
    <div class="working-step" style="margin-top:.6rem">Why the others are wrong:</div>
    <div class="working-line">0V–0.8V is actually the Logic-0 range, not Logic-1. 3.3V is a valid logic-1 <em>reading</em> but far too narrow — plenty of other voltages within 2V–5V also count. And 12V is well above the 5V supply rail this logic family uses at all.</div>`
      },
      {
        // kind:'bits' — click-to-toggle binary entry table (see renderBits()/
        // clickBit() in the engine below). Every cell starts blank and each
        // click cycles it blank -> 0 -> 1 -> blank (matching
        // digital_knowledge_logic_gates.html's truth-table output toggle).
        // `options()` picks 4 unique random decimal values (0-15) each
        // attempt; `cor` (built in resetQuiz) is the correct 4-bit pattern
        // for each row.
        leftPanel: 'none',
        kind: 'bits',
        text: () => `Fill in the <span style="color:var(--colour-ui-primary)">binary representation</span> of each decimal value below. Every cell starts blank — click it to cycle 0, then 1, then back to blank.`,
        hint: () => 'Each column heading is a power of two (8, 4, 2, 1). Work out which of those add up to the target value — those columns are 1, everything else is 0.',
        options: () => shuffle(Array.from({ length: 16 }, (_, v) => v)).slice(0, 4).map(value => ({ value })),
        correctExplain: (st) => {
          let correct = 0, total = 0;
          st.clicks.forEach((row, r) => row.forEach((n, c) => { total++; if (bitFromClicks(n) === st.cor[r][c]) correct++; }));
          return correct === total ? 'All bits correct' : `${correct} of ${total} bits correct`;
        },
        working: (st) => {
          const rows = st.opts.map((row, r) => {
            const bits = st.cor[r];
            return `<div class="working-line">${row.value} = <b style="color:var(--colour-current)">${bits.join('')}</b> &nbsp; (8×${bits[0]} + 4×${bits[1]} + 2×${bits[2]} + 1×${bits[3]} = ${bits[0]*8 + bits[1]*4 + bits[2]*2 + bits[3]})</div>`;
          }).join('');
          return `<div class="working-step">Binary breakdown for each value:</div>${rows}`;
        }
      },
      {
        leftPanel: 'none',
        text: () => `Which <span style="color:var(--colour-ui-primary)">IC package type</span> is most commonly used for digital ICs in the lab (e.g. the 7400-series logic ICs)?`,
        hint: () => 'Think of the classic black rectangular chip with two rows of pins along its long edges, that plugs straight into a breadboard.',
        options: () => shuffle([
          { label: 'DIP / DIL (Dual In-line Package)', type: 'correct' },
          { label: 'TO-220', type: 'wrong' },
          { label: 'SMA diode package', type: 'wrong' },
          { label: 'BGA (Ball Grid Array)', type: 'wrong' }
        ]),
        correctExplain: () => '<b>DIP / DIL</b> (Dual In-line Package)',
        working: () => `
    <div class="working-line">The <b style="color:var(--colour-bjt)">DIP</b> (also called <b style="color:var(--colour-bjt)">DIL</b>, Dual In-Line) package is the standard through-hole chip with two parallel rows of pins — exactly the shape used for 7400-series logic ICs on a breadboard.</div>
    <div class="working-step" style="margin-top:.6rem">Why the others are wrong:</div>
    <div class="working-line"><b>TO-220</b> is a power-transistor/regulator package (like the ones used for voltage regulators), <b>SMA</b> is a small surface-mount diode package, and <b>BGA</b> is a modern high-pin-count package (used for CPUs and similar) with solder balls underneath instead of pins — none of these are the breadboard-friendly digital IC package.</div>`
      },
      {
        // Multi-select shape-grid: same DIP body reused 8 ways (notch present/
        // absent × dot present/absent/mispositioned). Exactly 2 valid markings
        // (notch alone, or notch+matching dot); 6 invalid.
        leftPanel: 'shapeGrid',
        kind: 'multi',
        text: () => `Which of these IC package illustrations follow standard industry conventions for indicating <span style="color:var(--colour-ui-primary)">Pin 1</span>? Click every shape that qualifies.`,
        hint: () => 'There are 2 valid shapes among the 8 shown. Pin 1 is always the pin immediately next to the notch (the semi-circular cutout in the top edge) — the top-left pin, when the notch is at the top. The notch by itself is already enough to identify it. A dot is sometimes added as a second marker, but only counts if it lines up with that same pin. No notch and no correctly-placed dot means pin 1 can\'t be identified at all.',
        options: () => shuffle([
          { label: 'Notch only, no dot',              type: 'correct', shapeId: 'dip-notch-nodot' },
          { label: 'Notch, dot agrees (top-left)',     type: 'correct', shapeId: 'dip-notch-dot-tl' },
          { label: 'Notch, dot top-right',             type: 'wrong',   shapeId: 'dip-notch-dot-tr' },
          { label: 'Notch, dot bottom-left',           type: 'wrong',   shapeId: 'dip-notch-dot-bl' },
          { label: 'Notch, dot bottom-right',          type: 'wrong',   shapeId: 'dip-notch-dot-br' },
          { label: 'No notch, dot top-right',          type: 'wrong',   shapeId: 'dip-nonotch-dot-tr' },
          { label: 'No notch, dot bottom-left',        type: 'wrong',   shapeId: 'dip-nonotch-dot-bl' },
          { label: 'No notch, dot bottom-right',       type: 'wrong',   shapeId: 'dip-nonotch-dot-br' }
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(n => n).join(', ');
          return `Shapes <b>${nums}</b> show a valid pin-1 marking`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Valid — shapes ${correctNums}:</div>
    <div class="working-line">The <b style="color:var(--colour-ui-correct)">notch</b> alone is a fully valid marking — no dot is needed, since pin 1 is already understood to be the top-left pin next to it. A <b style="color:var(--colour-ui-correct)">dot that agrees</b> with the notch (also top-left) simply confirms the same pin using the second method — still valid.</div>
    <div class="working-step" style="margin-top:.6rem">Invalid — shapes ${wrongNums}:</div>
    <div class="working-line">A dot anywhere <em>other</em> than the notch-indicated corner <b style="color:var(--colour-ui-wrong)">contradicts</b> the notch rather than confirming it — a real package would never be marked this way, so it can't be trusted. Without a notch at all, a dot on its own doesn't follow the standard convention (which anchors pin 1 to the notch position) — so pin 1 can't be reliably identified.</div>`;
        }
      },
      {
        leftPanel: 'none',
        text: () => `What is meant by the term '<span style="color:var(--colour-ui-primary)">electrostatic charge</span>'?`,
        hint: () => 'The word \'static\' is the clue — this charge isn\'t flowing anywhere, it\'s just sitting on a surface.',
        options: () => shuffle([
          { label: 'A build-up of static electric charge on the surface of an object, due to an imbalance of electrons', type: 'correct' },
          { label: 'The continuous flow of electrons through a conductor', type: 'wrong' },
          { label: 'The charge temporarily stored inside a capacitor while a circuit is powered', type: 'wrong' },
          { label: 'A charge that only exists while current is flowing', type: 'wrong' }
        ]),
        correctExplain: () => 'A <b>static build-up of charge</b> from an electron imbalance',
        working: () => `
    <div class="working-line">Electrostatic charge is a build-up of electric charge sitting <b style="color:var(--colour-current)">on the surface</b> of an object — caused by an imbalance between the number of electrons and protons there. It doesn't flow anywhere on its own; it just sits until it finds a path to discharge.</div>
    <div class="working-step" style="margin-top:.6rem">Why the others are wrong:</div>
    <div class="working-line">A continuous flow of electrons is <em>current</em>, not a static charge. A capacitor's stored charge is deliberately held by a powered circuit and released in a controlled way — quite different from an unwanted static build-up. And electrostatic charge exists whether or not current is flowing anywhere else — that's exactly why it's called "static."</div>`
      },
      {
        leftPanel: 'none',
        text: () => `What is the main way that electrostatic charges <span style="color:var(--colour-ui-primary)">build up</span> on a person or object?`,
        hint: () => 'Think about the classic example of getting a static shock after walking across a carpeted room.',
        options: () => shuffle([
          { label: 'Friction between two materials (e.g. walking across carpet, or sliding off a chair)', type: 'correct' },
          { label: 'Exposure to sunlight', type: 'wrong' },
          { label: 'Connecting to mains earth', type: 'wrong' },
          { label: 'Running current through a resistor', type: 'wrong' }
        ]),
        correctExplain: () => '<b>Friction</b> between two materials (triboelectric charging)',
        working: () => `
    <div class="working-line">Rubbing or sliding two different materials against each other — like shoes on carpet, or a chair sliding across clothing — transfers electrons from one surface to the other. This is called <b style="color:var(--colour-current)">triboelectric charging</b>, and it's the main real-world source of ESD build-up.</div>
    <div class="working-step" style="margin-top:.6rem">Why the others are wrong:</div>
    <div class="working-line">Sunlight and resistor heating aren't charge-building mechanisms here. Connecting to earth actually does the <em>opposite</em> of building charge — it's the standard way to safely drain a static charge away.</div>`
      },
      {
        leftPanel: 'none',
        text: () => `What happens during an <span style="color:var(--colour-ui-primary)">Electrostatic Discharge (ESD)</span> event, and why can it <span style="color:var(--colour-ui-primary)">damage</span> electronic components?`,
        hint: () => 'ESD happens in a fraction of a second — think about how much voltage can build up on your body, and what an almost-instant current spike could do to microscopic circuitry.',
        options: () => shuffle([
          { label: 'A sudden, very high-voltage current spike flows through the component as the charge equalises, which can instantly destroy delicate internal structures', type: 'correct' },
          { label: 'A small, safe current flows slowly over several seconds, gently warming the component', type: 'wrong' },
          { label: "The component's internal resistance temporarily increases, causing it to overheat over time", type: 'wrong' },
          { label: 'ESD only affects components that are already faulty', type: 'wrong' }
        ]),
        correctExplain: () => 'A near-instant, <b>very high-voltage current spike</b>',
        working: () => `
    <div class="working-line">When a charged object (like a person) touches a component, the charge equalises almost instantly — producing a brief but very high-voltage current spike. Sensitive components (especially CMOS/MOSFET gates) have extremely thin internal insulating layers that this spike can punch straight through, destroying the device instantly or leaving hidden damage that fails later.</div>
    <div class="working-step" style="margin-top:.6rem">Why the others are wrong:</div>
    <div class="working-line">ESD is fast, not slow — there's no gentle multi-second warming involved. It's a voltage/current spike doing physical damage, not a gradual resistance change. And ESD can damage perfectly good components; it doesn't require anything to already be faulty.</div>`
      },
      {
        // Multi-select, plain text options (no shape grid) — the ESD
        // prevention checklist. Demonstrates kind:'multi' without leftPanel:
        // 'shapeGrid': any question can be multi-select, shapes or not.
        leftPanel: 'none',
        kind: 'multi',
        text: () => `Which of the following are effective ways to <span style="color:var(--colour-ui-primary)">minimise ESD damage</span> when repairing electronic equipment? Click every correct measure.`,
        hint: () => 'Effective ESD precautions all do one of two things: safely drain charge to earth before it builds up, or keep sensitive components away from anything that could shock them.',
        options: () => shuffle([
          { label: 'Wear a grounded anti-static wrist strap', type: 'correct' },
          { label: 'Work on an anti-static mat connected to earth', type: 'correct' },
          { label: 'Store sensitive components in anti-static bags until needed', type: 'correct' },
          { label: 'Touch a grounded metal surface before handling components', type: 'correct' },
          { label: 'Work on a carpeted floor to stay comfortable', type: 'wrong' },
          { label: 'Wear clothing made from synthetic materials like nylon or polyester', type: 'wrong' },
          { label: "Run a heater to keep the room's air very dry", type: 'wrong' },
          { label: "Handle ICs by their pins, since the body shouldn't be touched", type: 'wrong' }
        ]),
        correctExplain: (st) => {
          const letters = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${letters}</b> are effective ESD precautions`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Effective — options ${correctNums}:</div>
    <div class="working-line">A <b style="color:var(--colour-ui-correct)">grounded wrist strap</b> and <b style="color:var(--colour-ui-correct)">earthed anti-static mat</b> continuously bleed away any charge before it can build up. <b style="color:var(--colour-ui-correct)">Anti-static bags</b> shield stored components from external fields and discharge paths. <b style="color:var(--colour-ui-correct)">Touching a grounded surface first</b> is the minimum precaution when no other equipment is available.</div>
    <div class="working-step" style="margin-top:.6rem">Ineffective or harmful — options ${wrongNums}:</div>
    <div class="working-line"><b style="color:var(--colour-ui-wrong)">Carpet</b> and <b style="color:var(--colour-ui-wrong)">synthetic clothing</b> are both classic triboelectric charge generators — they make ESD more likely, not less. <b style="color:var(--colour-ui-wrong)">Dry air</b> lets charge build up faster (humidity actually helps it dissipate), so deliberately drying the room is counter-productive. And ICs should always be handled by their <b style="color:var(--colour-ui-wrong)">body/edges</b>, never by the pins — touching the pins directly exposes the most sensitive part of the device to exactly the shock you're trying to avoid.</div>`;
        }
      }
    ];

    // ══════════════════════════════════════════════════════════════════════

    resetQuiz();
    initQuizFromURL();
