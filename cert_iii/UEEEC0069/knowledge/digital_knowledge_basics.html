<!--
  TEMPLATE FILE — read before cloning for a new weekly quiz.

  This file uses a data-driven quiz engine: a single `QUESTIONS` array (in the
  <script>, search "QUESTIONS —") drives one generic HTML panel and a generic
  set of engine functions (renderQuestion, checkAnswer, nextQuestion, etc).
  There is deliberately NO per-question HTML or per-question JS function.

  When cloning this file for a new quiz — even one that starts with just ONE
  image and ONE question — KEEP THIS STRUCTURE. Do not revert to a hardcoded
  per-question panel just because there's only one entry. The whole point of
  this architecture is that adding question 2, 3, splitting a question into
  two, or reordering them later is a pure edit of the QUESTIONS array, with
  zero HTML/JS restructuring. Starting with one question and hardcoding it
  "for now" recreates exactly the problem this file was refactored to avoid.

  A `leftPanel` field per question ('none' | 'shapeGrid') swaps the left-hand
  column between nothing (question collapses to a single centred column) and
  a grid of clickable shapes (see Q1's waveforms or Q7's IC packages). Add new
  left-panel modes the same way: a new string value, a new container div, one
  more branch in swapLeftPanel().

  A `kind:'multi'` field per question switches it from single-select
  (A/B/C/D, one correct answer) to multi-select (any number of options can be
  toggled on; correctness is a set match) — works for both shapeGrid
  questions (see Q1/Q7) and plain text-option questions (see the ESD
  prevention question). Leave `kind` unset for ordinary single-select
  questions.
-->

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — the template. Add, remove, split or reorder questions by
    // editing this array only — nothing in the engine below needs to change.
    //
    // Each entry:
    //   leftPanel           'none' (default) | 'shapeGrid' — which left-hand
    //                       panel to show for this question
    //   kind                'multi' for multi-select (any number of options
    //                       toggled on); omit for ordinary single-select
    //   text()              question prompt (HTML string)
    //   hint()              hint shown under the prompt (HTML string)
    //   options()           returns a shuffled array of
    //                       { label, type: 'correct'|'wrong', shapeId? }
    //                       (shapeId is only used by leftPanel:'shapeGrid' —
    //                       it names a <g id="..."> in the hidden defs <svg>
    //                       near the top of <body>)
    //   correctExplain(st)  short HTML fragment used in the result banner
    //   working(st)         full worked-solution HTML shown after answering
    //
    // text/hint/options take no arguments; correctExplain/working receive the
    // question's live state `st` ({ sel, ans, cor, opts }) so they can report
    // on what was actually selected/shuffled — ordinary questions can just
    // ignore the argument. All fields are functions (even when static) so a
    // question can freely start simple and later reference live values
    // without changing shape.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Multi-select shape-grid: 4 digital waveforms vs 3 analog waveforms.
        // Deliberately includes two "trap" cases so students can't shortcut
        // to a "square = digital, curvy = analog" heuristic: the sawtooth
        // (sharp edges, but still continuously-varying = analog) and the
        // stepped/quantised sine (curved envelope, but only discrete levels
        // = digital) — the real test is discreteness of levels, not shape.
        leftPanel: 'shapeGrid',
        kind: 'multi',
        text: () => `Click every wave that can be <span style="color:var(--colour-ui-primary)">achieved</span> with a <span style="color:var(--colour-ui-primary)">digital</span> signal.`,
        hint: () => 'Don\'t just look for a "square" shape — a signal is digital if it\'s restricted to a fixed set of discrete levels, however many steps that takes, and analog if it can pass through any value in between. A curved envelope built from steps is still digital; a sharp-edged ramp that passes through every voltage is still analog.',
        options: () => shuffle([
          { label: 'Digital, clean square wave',       type: 'correct', shapeId: 'wave-digital-1' },
          { label: 'Digital, uneven duty cycle',       type: 'correct', shapeId: 'wave-digital-2' },
          { label: 'Digital, single transition',       type: 'correct', shapeId: 'wave-digital-3' },
          { label: 'Digital, stepped/quantised sine',  type: 'correct', shapeId: 'wave-digital-stepped' },
          { label: 'Analog, sine wave',                type: 'wrong',  shapeId: 'wave-analog-sine' },
          { label: 'Analog, sawtooth ramp',            type: 'wrong',  shapeId: 'wave-analog-sawtooth' },
          { label: 'Analog, triangle wave',            type: 'wrong',  shapeId: 'wave-analog-triangle' }
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(n => n).join(', ');
          return `Waveforms <b>${nums}</b> are digital`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Digital — waveforms ${correctNums}:</div>
    <div class="working-line">Each is restricted to a <b style="color:var(--colour-ui-correct)">fixed set of discrete levels</b> — it can never sit at any value except those. The clean square wave, uneven duty cycle and single transition all use just two levels (e.g. 0V / 5V) with sharp jumps between them. The <b>stepped/quantised sine</b> is the important extra case: its overall envelope curves like a sine wave, but at every instant it's still sitting on one of a fixed set of steps — it never smoothly slides between them. That's exactly what a digitised (sampled) version of an analog signal looks like, and it's still digital even though it isn't a simple square wave.</div>
    <div class="working-step" style="margin-top:.6rem">Analog — waveforms ${wrongNums}:</div>
    <div class="working-line">The sine and triangle waves obviously vary continuously. The <b>sawtooth</b> is the trap in the other direction: it has sharp vertical drops, which can look "digital" at a glance — but the rising ramp passes through <em>every</em> voltage between its minimum and maximum, so it's just as analog as the sine wave.</div>
    <div class="working-line" style="margin-top:.4rem">The takeaway: a waveform's <em>shape</em> (square vs curvy, sharp vs smooth) doesn't decide digital vs analog — only whether it's confined to discrete levels does. In principle even a clean square wave could be an analog voltage that just happens to be shaped that way (e.g. from a function generator, or summed from sine-wave harmonics) — in fact a square wave can genuinely be built by adding together enough odd-numbered sine harmonics (Fourier synthesis), no digital circuitry involved at all.</div>
    <div class="working-line" style="margin-top:.4rem">That doesn't change the answer here, though: the question only asks whether each shape <em>can be achieved</em> by a digital signal — not whether digital is the <em>only</em> way to achieve it. A real digital signal genuinely does look exactly like the square/stepped shapes above, so those are correct regardless of whether analog methods could also produce something similar. A true, perfectly smooth sine, triangle or ramp is the one thing no digital signal can ever exactly reproduce — at best it can only be approximated with more and more steps.</div>`;
        }
      },
      {
        leftPanel: 'none',
        text: () => `Which of the following is a genuine <span style="color:var(--colour-ui-primary)">advantage</span> of digital electronics over analog electronics?`,
        hint: () => 'Think about what happens when noise or interference is added to a signal that only needs to be read as one of two levels, versus a signal whose exact voltage matters.',
        options: () => shuffle([
          { label: 'Digital signals are far more resistant to noise, since only two levels need to be distinguished', type: 'correct' },
          { label: 'Digital circuits are always physically smaller than an equivalent analog circuit', type: 'wrong' },
          { label: 'Digital signals can represent infinitely precise values, unlike analog signals', type: 'wrong' },
          { label: 'Digital circuits never need a power supply', type: 'wrong' }
        ]),
        correctExplain: () => 'Digital signals are much more <b>noise-resistant</b>',
        working: () => `
    <div class="working-line">A receiver only has to decide "is this closer to 0 or closer to 1?" — so a fair amount of noise can be added to a digital signal without changing that decision. An analog signal has no such margin: any noise added directly corrupts the value it represents, since the exact voltage <em>is</em> the information.</div>
    <div class="working-step" style="margin-top:.6rem">Why the others are wrong:</div>
    <div class="working-line">Circuit size depends on the specific design, not the analog/digital choice. Precision is actually the opposite of what's stated — digital values are limited by the number of bits used (a fixed resolution), whereas an analog signal can in principle vary continuously. And every circuit, digital or analog, needs a power supply.</div>`
      },
      {
        // kind:'match' — click-to-assign sort into two columns (see
        // renderMatch()/selectPoolItem()/assignToColumn()/unassignItem() in
        // the engine below). `columns()` names the two target columns;
        // each option carries `col: 0|1` for which one it belongs in.
        leftPanel: 'none',
        kind: 'match',
        columns: () => ['Logic-1', 'Logic-0'],
        text: () => `Digital electronics uses several different words for the same two logic states, depending on context. <span style="color:var(--colour-ui-primary)">Place</span> each term below into the column for the logic state it describes.`,
        hint: () => 'Think about where you\'ve seen each word used before: a light switch, a boolean value in programming, an SR latch. Each pair (e.g. On / Off) describes the same two states, just in a different context. If you change your mind, click on the term to return it to the top.',
        options: () => shuffle([
          { label: 'High (Hi)', col: 0 },
          { label: 'True',      col: 0 },
          { label: 'Closed',    col: 0 },
          { label: 'Set',       col: 0 },
          { label: 'On',        col: 0 },
          { label: 'Low (Lo)',  col: 1 },
          { label: 'False',     col: 1 },
          { label: 'Open',      col: 1 },
          { label: 'Reset',     col: 1 },
          { label: 'Off',       col: 1 }
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 10 terms sorted correctly' : `${st.opts.length - wrongCount} of ${st.opts.length} terms sorted correctly`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Mislabelled:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">Logic-1 / High:</div>
    <div class="working-line"><b style="color:var(--colour-current)">High (Hi)</b>, <b style="color:var(--colour-current)">True</b>, <b style="color:var(--colour-current)">Closed</b> (a switch conducting), <b style="color:var(--colour-current)">Set</b> (an SR latch's active output) and <b style="color:var(--colour-current)">On</b> all describe the same state as Logic-1.</div>
    <div class="working-step" style="margin-top:.6rem">Logic-0 / Low:</div>
    <div class="working-line"><b style="color:var(--colour-bjt)">Low (Lo)</b>, <b style="color:var(--colour-bjt)">False</b>, <b style="color:var(--colour-bjt)">Open</b> (a switch not conducting), <b style="color:var(--colour-bjt)">Reset</b> (an SR latch's inactive output) and <b style="color:var(--colour-bjt)">Off</b> all describe the same state as Logic-0.</div>
    <div class="working-line" style="margin-top:.4rem">Which word gets used just depends on context — a switch is "closed" or "open," a latch is "set" or "reset," a light is "on" or "off" — but they all boil down to the same two logic states.</div>
    ${mistakeLine}`;
        }
      },
      {
        leftPanel: 'none',
        text: () => `In standard TTL logic, which <span style="color:var(--colour-ui-primary)">voltage range</span> is typically recognised as <span style="color:var(--colour-ui-primary)">Logic-1 (High)</span>?`,
        hint: () => 'TTL logic typically runs from a 5V supply. Logic-0 sits close to 0V; Logic-1 sits close to the supply rail.',
        options: () => shuffle([
          { label: 'Approximately 2V to 5V', type: 'correct' },
          { label: 'Approximately 0V to 0.8V', type: 'wrong' },
          { label: 'Exactly 3.3V only', type: 'wrong' },
          { label: 'Any voltage above 12V', type: 'wrong' }
        ]),
        correctExplain: () => 'Logic-1 (High) is roughly <b>2V to 5V</b>',
        working: () => `
    <div class="working-line">Standard TTL logic (running from a 5V supply) treats <b style="color:var(--colour-current)">0V–0.8V as Logic-0</b> and <b style="color:var(--colour-current)">2V–5V as Logic-1</b>. The gap between 0.8V and 2V is an undefined/invalid region — a real signal shouldn't sit there for long.</div>
    <div class="working-step" style="margin-top:.6rem">Why the others are wrong:</div>
    <div class="working-line">0V–0.8V is actually the Logic-0 range, not Logic-1. 3.3V is a valid logic-1 <em>reading</em> but far too narrow — plenty of other voltages within 2V–5V also count. And 12V is well above the 5V supply rail this logic family uses at all.</div>`
      },
      {
        // kind:'bits' — click-to-toggle binary entry table (see renderBits()/
        // clickBit() in the engine below). Every cell starts blank and each
        // click cycles it blank -> 0 -> 1 -> blank (matching
        // digital_knowledge_logic_gates.html's truth-table output toggle).
        // `options()` picks 4 unique random decimal values (0-15) each
        // attempt; `cor` (built in resetQuiz) is the correct 4-bit pattern
        // for each row.
        leftPanel: 'none',
        kind: 'bits',
        text: () => `Fill in the <span style="color:var(--colour-ui-primary)">binary representation</span> of each decimal value below. Every cell starts blank — click it to cycle 0, then 1, then back to blank.`,
        hint: () => 'Each column heading is a power of two (8, 4, 2, 1). Work out which of those add up to the target value — those columns are 1, everything else is 0.',
        options: () => shuffle(Array.from({ length: 16 }, (_, v) => v)).slice(0, 4).map(value => ({ value })),
        correctExplain: (st) => {
          let correct = 0, total = 0;

        // Multi-select, plain text options (no shape grid) — the ESD

    <div class="working-line"><b style="color:var(--colour-ui-wrong)">Carpet</b> and <b style="color:var(--colour-ui-wrong)">synthetic clothing</b> are both classic triboelectric charge generators — they make ESD more likely, not less. <b style="color:var(--colour-ui-wrong)">Dry air</b> lets charge build up faster (humidity actually helps it dissipate), so deliberately drying the room is counter-productive. And ICs should always be handled by their <b style="color:var(--colour-ui-wrong)">body/edges</b>, never by the pins — touching the pins directly exposes the most sensitive part of the device to exactly the shock you're trying to avoid.</div>`;

    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // Nothing here should need to change when questions are added/reordered.
    // ══════════════════════════════════════════════════════════════════════

    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    // kind:'multi' questions allow any number of selections; kind:'match'
    // questions sort every option into one of two columns; kind:'bits' fills
    // in a table of binary digits by click-cycling each cell; everything
    // else is single-select (A/B/C/D...). `sel`/`cor` are a single index for
    // single-select, an array of indices for multi, or (for match) `cor` is
    // an array of correct column-per-option and live placement lives in
    // `st.place` (array of column-per-option, null = still in the pool). For
    // bits, `cor` is a 2D array [row][col] of correct 0/1 values and live
    // input lives in `st.clicks` (2D array [row][col] of click counts —
    // every cell starts blank, each click cycles it: blank -> 0 -> 1 -> blank).
    function isMulti(data) { return data.kind === 'multi'; }
    function isMatch(data) { return data.kind === 'match'; }
    function isBits(data) { return data.kind === 'bits'; }
    // Every cell starts blank (n=0 -> null); each click cycles blank -> 0 -> 1 -> blank,
    // matching digital_knowledge_logic_gates.html's truth-table output toggle (zFromClicks()).
    function bitFromClicks(n) { const m = n % 3; return m === 0 ? null : m - 1; }
    function isAnswerCorrect(data, st) {
      if (isBits(data)) return st.clicks.every((row, r) => row.every((n, c) => bitFromClicks(n) === st.cor[r][c]));
      if (isMatch(data)) return st.place.every((p, i) => p === st.cor[i]);
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (isBits(data)) {
        let correct = 0, total = 0;
        st.clicks.forEach((row, r) => row.forEach((n, c) => { total++; if (bitFromClicks(n) === st.cor[r][c]) correct++; }));
        return `${correct} / ${total} bits correct`;
      }
      if (isMatch(data)) {
        const correctCount = st.place.filter((p, i) => p === st.cor[i]).length;
        return `${correctCount} / ${st.opts.length} correctly sorted`;
      }
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      const asLabel = i => data.leftPanel === 'shapeGrid' ? (i + 1) : LETTERS[i];
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(asLabel).join(', ') : '—';
    }
    // Fills in the fully-correct answer for a question without marking it
    // answered — used by jump()/jumpToSummary() to fast-forward prior
    // questions. Works across all four kinds.
    function fillCorrectSelection(i) {
      const data = QUESTIONS[i], st = Q[i];
      if (isBits(data)) st.clicks = st.cor.map(row => row.map(bit => bit + 1)); // clicks bit+1 -> bitFromClicks() lands on 0/1 (0 would land on blank)
      else if (isMatch(data)) st.place = st.cor.slice();
      else if (isMulti(data)) st.sel = [...st.cor];
      else st.sel = st.cor;
    }

    let Q = [];   // per-question live state: { sel, ans, cor, opts, place? }
    let cur = 0;  // 0-based index into QUESTIONS

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderShapeGrid() {
      const st = Q[cur];
      const c = document.getElementById('shapeGridCells'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const cell = document.createElement('div'); cell.className = 'shape-cell';
        const selected = st.sel.includes(i);
        if (st.ans) {
          if (opt.type === 'correct') cell.classList.add(selected ? 'correct' : 'missed');
          else cell.classList.add(selected ? 'wrong' : 'dimmed');
        } else {
          if (selected) cell.classList.add('selected');
          cell.addEventListener('click', () => selectOption(i));
        }
        cell.innerHTML = `<span class="shape-num">${i + 1}</span><svg viewBox="-32 -36 96 76"><use href="#${opt.shapeId}"/></svg>`;
        c.appendChild(cell);
      });
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur], multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        const selected = multi ? st.sel.includes(i) : i === st.sel;
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (opt.type === 'correct') {
            // The correct answer is always shown correct/green — whether or
            // not it was selected — matching the single-select convention.
            // For multi-select, a correct option the student didn't pick is
            // "missed" (amber) rather than plain wrong (red).
            const missed = multi && !selected;
            btn.classList.add(missed ? 'missed' : 'correct');
            btn.innerHTML += `<span class="result-icon">${missed ? '○' : '✓'}</span>`;
          } else if (selected) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
          else btn.classList.add('dimmed');
        } else {
          if (selected) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    // ── kind:'match' — click a pool chip to "pick it up" (st.sel = its
    // index), then click a column to drop it there. Click a placed chip to
    // send it back to the pool. No drag events at all, so it behaves
    // identically on mouse, touch and keyboard.
    function renderMatch() {
      const st = Q[cur], data = QUESTIONS[cur];
      const cols = data.columns();
      document.getElementById('matchColTitle0').textContent = cols[0];
      document.getElementById('matchColTitle1').textContent = cols[1];

      // While a term is picked up, only that same chip (to allow cancelling
      // the pick) and the two columns stay clickable — every other pool word
      // and every already-placed word are locked, so a student can't
      // accidentally swap their pick or clear a previous answer mid-placement.
      const picking = st.sel !== null;
      const poolHasItems = st.opts.some((_, i) => st.place[i] === null);
      // When nothing is picked yet (and the pool isn't empty), flash the pool
      // itself to prompt the student to pick a word — the mirror image of
      // the column glow that prompts them to place one once it's picked.
      const needsPick = !st.ans && !picking && poolHasItems;
      document.getElementById('matchPoolRow').classList.toggle('needs-pick', needsPick);
      document.getElementById('matchPool').classList.toggle('needs-pick', needsPick);

      const pool = document.getElementById('matchPool');
      pool.innerHTML = '';
      st.opts.forEach((opt, i) => {
        if (st.place[i] !== null) return;
        const chip = document.createElement('button');
        const isPicked = st.sel === i;
        chip.className = 'match-chip' + (isPicked ? ' picked' : '');
        chip.textContent = opt.label;
        chip.disabled = st.ans || (picking && !isPicked);
        if (!chip.disabled) chip.addEventListener('click', (e) => { e.stopPropagation(); selectPoolItem(i); });
        pool.appendChild(chip);
      });

      [0, 1].forEach(colIdx => {
        const container = document.getElementById('matchColItems' + colIdx);
        container.innerHTML = '';
        st.opts.forEach((opt, i) => {
          if (st.place[i] !== colIdx) return;
          const chip = document.createElement('button');
          chip.className = 'match-chip';
          chip.textContent = opt.label;
          if (st.ans) {
            chip.disabled = true;
            chip.classList.add(st.place[i] === st.cor[i] ? 'correct' : 'wrong');
          } else {
            chip.disabled = picking;
            if (!chip.disabled) chip.addEventListener('click', (e) => { e.stopPropagation(); unassignItem(i); });
          }
          container.appendChild(chip);
        });
        container.closest('.match-column').classList.toggle('droppable', !st.ans && picking);
      });
    }

    function selectPoolItem(i) {
      const st = Q[cur];
      if (st.ans) return;
      st.sel = (st.sel === i) ? null : i;
      renderQuestion();
    }

    function assignToColumn(colIdx) {
      const st = Q[cur];
      if (st.ans || st.sel === null) return;
      st.place[st.sel] = colIdx;
      st.sel = null;
      renderQuestion();
    }

    function unassignItem(i) {
      const st = Q[cur];
      if (st.ans) return;
      st.place[i] = null;
      renderQuestion();
    }

    // ── kind:'bits' — every cell starts blank; each click cycles blank -> 0 -> 1 -> blank.
    function renderBits() {
      const st = Q[cur];
      const body = document.getElementById('bitsBody');
      body.innerHTML = '';
      st.opts.forEach((row, r) => {
        const tr = document.createElement('tr');
        const valTd = document.createElement('td');
        valTd.textContent = row.value;
        tr.appendChild(valTd);
        for (let c = 0; c < 4; c++) {
          const td = document.createElement('td');
          const bit = bitFromClicks(st.clicks[r][c]);
          td.textContent = bit === null ? '' : String(bit);
          if (st.ans) {
            td.className = 'bits-cell ' + (bit === st.cor[r][c] ? 'correct' : 'wrong');
          } else {
            td.className = 'bits-cell';
            td.addEventListener('click', () => clickBit(r, c));
          }
          tr.appendChild(td);
        }
        body.appendChild(tr);
      });
    }

    function clickBit(r, c) {
      const st = Q[cur];
      if (st.ans) return;
      st.clicks[r][c]++;
      renderQuestion();
    }

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      document.getElementById('qMatch').style.display = isMatch(data) ? 'flex' : 'none';
      document.getElementById('qBits').style.display = isBits(data) ? 'block' : 'none';
      document.getElementById('qOptions').style.display = (isMatch(data) || isBits(data)) ? 'none' : '';
      if (isMatch(data)) {
        renderMatch();
      } else if (isBits(data)) {
        renderBits();
      } else if (data.leftPanel === 'shapeGrid') {
        document.getElementById('qOptions').innerHTML = '';
        renderShapeGrid();
      } else {
        renderOptions();
      }

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => data.leftPanel === 'shapeGrid' ? (i + 1) : LETTERS[i]).join(', ')}`
          : (data.leftPanel === 'shapeGrid' ? 'Click the shapes above to select your answer.' : 'Click every option that applies.');
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (
        isMatch(data) ? !st.place.every(p => p !== null) :
        isBits(data) ? !st.clicks.every(row => row.every(n => bitFromClicks(n) !== null)) : // every cell must be filled in (not blank)
        (multi ? st.sel.length === 0 : st.sel === null)
      );
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      swapLeftPanel(data.leftPanel || 'none');
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMatch(data)) { if (!st.place.every(p => p !== null)) return; }
      else if (isBits(data)) { if (!st.clicks.every(row => row.every(n => bitFromClicks(n) !== null))) return; }
      else if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); } }

    // Going back re-opens the previous question for a fresh answer — so it and
    // every question after it (all now "ahead" of where the student is) are
    // cleared back to unanswered, rather than staying locked from before.
    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        const data = QUESTIONS[i];
        Q[i].ans = false;
        if (isMatch(data)) { Q[i].place = Q[i].opts.map(() => null); Q[i].sel = null; }
        else if (isBits(data)) { Q[i].clicks = Q[i].opts.map(() => [0, 0, 0, 0]); }
        else Q[i].sel = isMulti(data) ? [] : null;
      }
      renderQuestion();
    }

    function swapLeftPanel(mode) {
      document.getElementById('qShapeGridPanel').style.display = mode === 'shapeGrid' ? 'block' : 'none';
      document.querySelector('.circuit-col').style.display = mode === 'shapeGrid' ? '' : 'none';
      document.getElementById('quizWrap').classList.toggle('single-col', mode !== 'shapeGrid');
    }

    function goToQuestion(n) { // 1-based, for URL/jump compatibility
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isBits(data)) {
          const cor = opts.map(row => [3, 2, 1, 0].map(shift => (row.value >> shift) & 1));
          return { ans: false, cor, opts, clicks: opts.map(() => [0, 0, 0, 0]) };
        }
        if (isMatch(data)) {
          const cor = opts.map(o => o.col);
          return { sel: null, ans: false, cor, opts, place: opts.map(() => null) };
        }
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      swapLeftPanel('none');
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    // Only show the back link if there's actually somewhere to go back to —
    // history.length is 1 when this page was opened directly (new tab, bookmark,
    // double-click) rather than reached by clicking a link from a menu page.
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      // Default every question before the target to correctly-answered, so
      // progress dots and back-navigation see a consistent, completed history.
      for (let i = 0; i < n - 1; i++) { fillCorrectSelection(i); Q[i].ans = true; }
      goToQuestion(n);
      if (answered) { fillCorrectSelection(cur); checkAnswer(); }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        fillCorrectSelection(i);
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
    }
  </script>
</body>
