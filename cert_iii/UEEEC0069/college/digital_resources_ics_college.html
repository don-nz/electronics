    /* Package-outline colour — its own token (not a reuse of --colour-bjt,
       which stays on the gate symbols) so the DIP body reads as "the chip"
       and the gates read as "what's inside it". Dark-mode default (this
       project's usual :root) is a cool silver, evoking black-plastic-
       package-with-printed-markings without literally being black on a
       dark page; light mode overrides to a near-black, matching a real
       IC's actual body colour — same override pattern quiz-common.css
       itself documents (dark in :root, light under
       :root). */
    body.dark-theme { --colour-ic-outline: #c7d2e0; }
    :root { --colour-ic-outline: #0f172a; }

    .intro {
      color: var(--colour-label);

      line-height: 1.5;
      max-width: 640px;
      margin: 0 auto 1.2rem;
      text-align: center;
    }

      gap: .8rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .ic-card {
      position: relative;
      background: rgba(var(--colour-label-rgb), .08);

/*
  NSW TAFE college theme — the single source for the self-contained teacher pages
  (cert_iii/UEEEC0069/college/*_college.html). tools/build_college.py inlines this into
  each generated page, so a college page is the student page's own markup and script
  with this stylesheet instead of assets/quiz-common.css.

  It was lifted from the hand-made college pages (TAFE colour palette, Public Sans,
  .main-wrap / .card-top-bar layout, light and dark themes, print rules) and then
  extended with rules for the classes the shared engines draw with, so the college
  pages no longer need a hand-made copy of the waveform code. To change how the
  college pages look, edit this file and rebuild.
*/

:root {
  --colour-bg: #f8f9fa;
  --colour-panel: #ffffff;
  --colour-border: #d0d5dd;
  --colour-text: #1d2939;
  --colour-text-strong: #002664;
  --colour-label: #475467;
  --colour-label-rgb: 71, 84, 103;
  --colour-grid: rgba(0, 38, 100, 0.04);

  --colour-ui-primary: #002664;
  --colour-ui-primary-rgb: 0, 38, 100;
  --colour-ui-correct: #087443;
  --colour-ui-correct-rgb: 8, 116, 67;
  --colour-ui-wrong: #d92d20;
  --colour-ui-wrong-rgb: 217, 45, 32;

  --colour-input-a: #4338ca;
  --colour-input-b: #0f766e;
  --colour-output-z: #0284c7;

  --colour-dff: #0d80c3;
  --colour-jfet: #7e22ce;
  --colour-bjt: #b45309;
  --colour-switch: #0369a1;

  --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Public Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'Share Tech Mono', monospace, sans-serif;

  --radius-lg: 6px;
  --radius-sm: 4px;
  --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
}

body.dark-theme {
  --colour-bg: #121824;
  --colour-panel: #1a2232;
  --colour-border: #2e3c54;
  --colour-text: #e2e8f0;
  --colour-text-strong: #ffffff;
  --colour-label: #94a3b8;
  --colour-label-rgb: 148, 163, 184;
  --colour-grid: rgba(255, 255, 255, 0.03);

  --colour-ui-primary: #38bdf8;
  --colour-ui-primary-rgb: 56, 189, 248;
  --colour-ui-correct: #34d399;
  --colour-ui-correct-rgb: 52, 211, 153;
  --colour-ui-wrong: #f87171;
  --colour-ui-wrong-rgb: 248, 113, 113;

  --colour-input-a: #818cf8;
  --colour-input-b: #2dd4bf;
  --colour-output-z: #38bdf8;

  --colour-dff: #54c0ff;
  --colour-jfet: #c084fc;
  --colour-bjt: #ffb454;
  --colour-switch: #38bdf8;

  --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3);
}

* {

  margin: 0;
  padding: 0;
}

body {

  background-size: 40px 40px;

}

header {

.hint-toggle-btn {

  border: 1px solid var(--colour-border);
  border-radius: var(--radius-lg);
  background: transparent;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: .7rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--colour-label);

}
.hint-toggle-btn:not(.active):hover { background: rgba(var(--colour-ui-primary-rgb), .06); color: var(--colour-text); }
.hint-toggle-btn[data-hint="edges"].active { border-color: var(--colour-switch); color: var(--colour-switch); background: color-mix(in srgb, var(--colour-switch) 14%, transparent); }
.out-toggle-card { font-size: .82rem; margin-bottom: 1.2rem; }
.out-toggle-btn { min-width: 3.6rem; }
.out-toggle-btn.active { border-color: var(--colour-output-z); color: var(--colour-output-z); background: color-mix(in srgb, var(--colour-output-z) 14%, transparent); }

.wb-tracks-wrap { position: relative; }
.wb-hint-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

.wb-track-row {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 0.6rem;
}

.wb-track-label {

  font-size: 1.1rem;

  stroke-width: 1;

}

.wb-track-p { stroke: var(--colour-jfet); }
.wb-track-c { stroke: var(--colour-bjt); }
.wb-track-clk { stroke: var(--colour-switch); }

/* Print Worksheet — .print-only is invisible on screen, shown only via
   @media print below. #printWorksheet (a direct child of <body>, NOT
   nested inside .main-wrap) is built fresh by printDiagramNow() right
   before window.print(): page title/description, the current Trigger/Q
   diagram with Q left as a blank grid, then a page-break and the same
   diagram again with the correct Q filled in as the solution. */
.print-only { display: none; }

@media print {
  /* Force light regardless of whichever theme is active on screen —
     body.dark-theme has higher specificity than a bare :root rule, so
     it's redefined here too (same values), not just :root, or dark
     mode would still win. */
  :root, body.dark-theme {
    --colour-bg: #ffffff;
    --colour-panel: #ffffff;
    --colour-text: #000000;
    --colour-text-strong: #000000;
    --colour-border: #999999;
    --colour-label: #444444;
  }
  body > *:not(#printWorksheet) { display: none !important; }
  body { background: #fff; background-image: none; padding: 0; display: block; }
  #printWorksheet {
    display: block !important;
    color: #000;
    font-family: var(--font-body);
    max-width: 700px;
    margin: 2rem auto;
  }
  #printWorksheet h1 { font-size: 1.3rem; margin: 0 0 .3rem; font-family: var(--font-display); }
  #printWorksheet .print-subtitle { font-size: .8rem; color: #444; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: .05em; }
  #printWorksheet .print-description { margin-bottom: 1.2rem; }
  #printWorksheet .print-diagram-section { page-break-inside: avoid; }
  /* Solution starts on its own fresh page when printed double-sided or handed out separately. */
  #printWorksheet .print-solution { page-break-before: always; }
  #printWorksheet .print-solution h2 { font-size: 1.1rem; margin-bottom: .8rem; }
  #printWorksheet .wb-track-row svg { width: 100%; height: auto; background: none; border: 1px solid #999; }
  #printWorksheet .wb-track-label { color: #000; }
  #printWorksheet .wb-grid-line { stroke: #999; stroke-dasharray: none; opacity: 1; }
}

/* Copyright line (college copies are self-contained, so inline) */
.site-copyright {
  margin: 3rem auto 1.5rem;
  padding: 0 1rem;
  text-align: center;
  font-size: 0.7rem;
  color: var(--colour-label);
  opacity: 0.8;
}

/* ── page-structure rules shared by the waveform-builder pages ── */
.wb-track-label { width: 2.6rem; }
.extra-row { display: none; }
.extra-row.shown { display: flex; }
/* the student pages space their cards with margin-bottom; .main-wrap already spaces them with a gap */
.main-wrap > .card { margin-bottom: 0; }
.rule-card > div:first-of-type { margin-bottom: 0.4rem; }
.rule-card > div:nth-last-of-type(2) { margin-top: 0.4rem; }

/* ── classes assets/waveform-builder.js draws with (the student theme styles these from quiz-common.css) ── */
.wb-grid-baseline { stroke: rgba(var(--colour-label-rgb), .4); }
.wb-track-path.wb-track-s { stroke: var(--colour-input-a); }
.wb-track-path.wb-track-r { stroke: var(--colour-input-b); }
.wb-track-path.wb-track-p { stroke: var(--colour-jfet); }
.wb-track-path.wb-track-c { stroke: var(--colour-bjt); }
.wb-track-path.wb-track-clk { stroke: var(--colour-switch); }
.wb-track-path.wb-track-d { stroke: var(--colour-input-a); }
.wb-progress-shade { fill: var(--colour-ui-primary); opacity: .1; }
.wb-q-path { fill: none; stroke-width: 2; stroke-linejoin: round; }
.wb-q-path.wb-col-building { stroke: var(--colour-output-z); }
.wb-q-path.wb-col-correct { stroke: var(--colour-ui-correct); }
.wb-q-path.wb-col-wrong { stroke: var(--colour-ui-wrong); }
.wb-piece-icon { width: 40px; height: 28px; overflow: visible; }
.wb-piece-icon line, .wb-piece-icon polyline {
  fill: none; stroke: var(--colour-output-z); stroke-width: 2.5;
  stroke-linecap: round; stroke-linejoin: round;
}
@media (max-width: 480px) {
  .wb-track-label { width: 1.6rem; font-size: .8rem; }
  .wb-piece-icon { width: 32px; height: 24px; }
}
@media print {
  #printWorksheet .print-wave-row svg { width: 100%; height: auto; background: none; border: 1px solid #999; }
}

// Dark/light toggle for the college pages (the student pages use assets/theme-init.js instead).
// The preference is the same localStorage key the hand-made college pages used.
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark-theme');
  localStorage.setItem('tafe-quiz-theme', isDark ? 'dark' : 'light');
  updateThemeToggleUI(isDark);
}

function updateThemeToggleUI(isDark) {
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (icon && label) {
    icon.textContent = isDark ? '☀️' : '🌙';
    label.textContent = isDark ? 'Light Mode' : 'Dark Mode';
  }
}

(function initTheme() {
  const isDark = localStorage.getItem('tafe-quiz-theme') === 'dark';
  document.body.classList.toggle('dark-theme', isDark);
  updateThemeToggleUI(isDark);
})();

</script>

      { id: 'ic-7408', part: '7408', desc: 'Quad 2-Input AND Gate', vb: '-84 -138 168 276' },
      { id: 'ic-7432', part: '7432', desc: 'Quad 2-Input OR Gate', vb: '-84 -138 168 276' },
      { id: 'ic-7486', part: '7486', desc: 'Quad 2-Input XOR Gate', vb: '-84 -138 168 276' },
      { id: 'ic-7447', part: '7447', desc: 'BCD-to-7-Segment Decoder/Driver', vb: '-90 -156 180 312' },
      { id: 'ic-7474', part: '7474', desc: 'Dual D Flip-Flop', vb: '-90 -138 180 276' },
      { id: 'ic-7476', part: '7476', desc: 'Dual JK Flip-Flop', vb: '-90 -156 180 312' },
      { id: 'ic-74139', part: '74139', desc: 'Dual 2-to-4 Line Decoder/Demultiplexer', vb: '-90 -156 180 312' },
      { id: 'ic-74147', part: '74147', desc: '10-to-4 Line Priority Encoder', vb: '-90 -156 180 312' },
      { id: 'ic-74151', part: '74151', desc: '8-Input Multiplexer with Strobe', vb: '-90 -156 180 312' },
      { id: 'ic-74193', part: '74193', desc: '4-Bit Synchronous Up/Down Counter (Binary)', vb: '-90 -156 180 312' },
      { id: 'ic-74194', part: '74194', desc: '4-Bit Bidirectional Universal Shift Register', vb: '-90 -156 180 312' },
      { id: 'ic-74221', part: '74221', desc: 'Dual Non-Retriggerable Monostable Multivibrator', vb: '-90 -156 180 312' },
      { id: 'ic-4n25', part: '4N25', desc: 'Optocoupler (LED + Phototransistor)', vb: '-62 -75 124 150' },
      { id: 'ic-lsd5365', part: 'LSD5365', desc: '7-Segment LED Display, Common Anode/Cathode', vb: '-58 -80 116 160' },
    ];

    const grid = document.getElementById('icGrid');
    ICS.forEach(ic => {
      const card = document.createElement('div');
      card.className = 'ic-card';
      card.title = 'Click to open full size in a new tab';
      card.onclick = () => openIcTab(ic);
      card.innerHTML =
        `<svg viewBox="${ic.vb}"><use href="#${ic.id}" /></svg>` +
        `<div class="ic-card-part">${ic.part}</div>` +
        `<div class="ic-card-desc">${ic.desc}</div>`;
      grid.appendChild(card);
    });

    // DEV: ?xy=1 overlays a magenta coordinate ruler on the zoomed IC —
    // same look/behaviour as quiz-engine.js's own xyRuler (see that file's
    // buildXYRuler), reimplemented here rather than reused because it's
    // wired to a single page-wide CIRCUIT_SVG_ID/#xyRuler, not a click-
    // any-of-N gallery whose viewBox changes with whichever IC is open.
    // Built fresh each time the viewer opens (viewBox differs per IC)
    // rather than cached — this is a rarely-used dev-only overlay, not
    // worth optimising.
    const xyOn = new URLSearchParams(location.search).get('xy') === '1';
    // Ticks are anchored to absolute multiples of 10 (not viewBox-relative
    // offsets like quiz-engine.js's own buildXYRuler does) — these IC
    // viewBoxes don't start on a round number (e.g. "-84 -138 168 276"),
    // so stepping from offX/offY directly would never land on a multiple
    // of 50 and no major-tick label would ever appear.
    function buildXYRulerSVG(vbStr) {
      const [offX, offY, W, H] = vbStr.split(' ').map(Number);
      const hy = offY + H - 10, vx = offX + 10, col = '#ff00ff';
      let svg = `<line x1="${offX}" y1="${hy}" x2="${offX + W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let gx = Math.ceil(offX / 10) * 10; gx <= offX + W; gx += 10) {
        const major = (gx % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${gx}" y1="${hy - len}" x2="${gx}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${gx}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${gx}</text>`;
      }
      svg += `<line x1="${vx}" y1="${offY}" x2="${vx}" y2="${offY + H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let gy = Math.ceil(offY / 10) * 10; gy <= offY + H; gy += 10) {
        const major = (gy % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${vx}" y1="${gy}" x2="${vx + len}" y2="${gy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${vx + 13}" y="${gy + 3}" fill="${col}" font-size="8" text-anchor="start">${gy}</text>`;
      }
      return svg;
    }

    // Clicking a chip: open this same page in a new tab with ?ic=<id> (see the header comment).
    function openIcTab(ic) {
      const u = new URL(location.href);
      u.search = '?ic=' + encodeURIComponent(ic.id) + (xyOn ? '&xy=1' : '');
      u.hash = '';
      window.open(u.href, '_blank');
    }

    // Viewer mode (this tab was opened with ?ic=<id>): only that chip's diagram, as large as the window allows.
    // The svg has a viewBox and no fixed size, so it scales to whichever of width or height runs out first.
    (function showViewer() {
      const id = new URLSearchParams(location.search).get('ic');
      const ic = id && ICS.find(x => x.id === id);
      if (!ic) { document.body.classList.remove('viewer-mode'); return; }   // unknown id: just show the gallery
      document.title = `${ic.part} — ${ic.desc}`;
      const v = document.createElement('div');
      v.id = 'icViewer';
      v.innerHTML = `<div class="viewer-bar"><span class="viewer-title"></span><button type="button" class="viewer-close">✕ Close</button></div>` +
        `<svg id="viewerSvg" viewBox="${ic.vb}" xmlns="http://www.w3.org/2000/svg"><use href="#${ic.id}" />${xyOn ? buildXYRulerSVG(ic.vb) : ''}</svg>`;
      v.querySelector('.viewer-title').textContent = `${ic.part} — ${ic.desc}`;
      document.body.appendChild(v);
      // close the tab if this page opened it; otherwise (opened by link or typed in) go back to the gallery
      const close = () => { window.close(); setTimeout(() => { location.href = location.pathname; }, 150); };
      v.querySelector('.viewer-close').onclick = close;
      document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    })();
  </script>
