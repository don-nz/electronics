  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

/* ══════════════════════════════════════════════════════════════════════
   Cert III — shared stylesheet for interactive quiz pages.

   Theme system: every colour/font/radius/shadow is a CSS custom property,
   defined once for dark (the default — the original cyberpunk look, values
   unchanged) and once more under :root[data-theme="light"] (a generic
   "clean institutional" look — NOT modelled on any specific real
   institution's brand). Toggling data-theme on <html> switches themes;
   no other selector in this file should ever hardcode a colour, font-family,
   border-radius or shadow value directly — add a variable instead.
   ══════════════════════════════════════════════════════════════════════ */

:root {
    /* ---- surfaces & text ---- */
    --colour-bg: #0f172a;
    --colour-panel: #121824;
    --colour-border: #1e2d4a;
    --colour-text: #e2e8f0;
    --colour-text-strong: #d0e4f0;
    --colour-label: #5a7a9a;
    --colour-label-rgb: 90, 122, 154;
    --colour-grid: rgba(0, 229, 255, 0.06);
    /* highlighter-marker fill behind revealed values on the circuit walkthroughs (see addRevealHighlight) */
    --colour-highlight: rgba(255, 214, 0, 0.20);
    /* resistor-network grouping colours (R1,2,3 / R5,6,7 …) used by the resistor walkthroughs and quizzes */
    --colour-resistor-combo1: #f209ea;
    --colour-resistor-combo2: #ffd700;
    --colour-resistor-combo3: #3d7dff;
    --colour-resistor-combo4: #14ffd4;
    --colour-resistor-combo5: #7b2ff7;
    --colour-resistor-total: #00ffff;

    /* ---- UI accent / feedback colours ---- */
    --colour-ui-primary: #00e5ff;
    --colour-ui-primary-rgb: 0, 229, 255;
    --colour-ui-correct: #00ff99;
    --colour-ui-correct-rgb: 0, 255, 153;
    --colour-ui-wrong: #ff3d9a;
    --colour-ui-wrong-rgb: 255, 61, 154;
    --colour-ui-restart: #ff6b35;
    --colour-ui-restart-rgb: 255, 107, 53;
    --colour-ui-summary: #a78bfa;
    --colour-ui-summary-rgb: 167, 139, 250;

    /* ---- domain / circuit-diagram colours (used inline in SVGs + .colour-* utility classes) ---- */
    --colour-ammeter-fill: #081a08;
    --colour-bjt: #ffb454;
    --colour-bjt-rgb: 255, 180, 84;
    --colour-bjt-labels: #ffb454;
    --colour-ammeter-fill: #081a08;
    --colour-dff: #54c0ff;
    --colour-dff-rgb: 84, 192, 255;
    --colour-dff-labels: #5c54ff;
    --colour-switch: #38bdf8;
    --colour-switch-labels: #38bdf8;
    --colour-jfet: #c084fc;
    --colour-jfet-rgb: 192, 132, 252;
    --colour-jfet-labels: #c084fc;
    --colour-mosfet: #16c771;
    --colour-mosfet-rgb: 22, 199, 113;
    --colour-mosfet-labels: #16c771;
    /* Rotary-encoder disk "face" (Gray-code and binary explorer diagrams)
       — a background circle drawn behind the wedges. Superseded the
       earlier --colour-disk-ink approach (lightening the wedge ink itself
       in dark mode): the reviewed fix instead keeps wedges literal
       black in both themes and lightens the disk's own face/background
       circle, closer to how a real light-grey encoder disk would look
       under dim light — so plain black reads correctly against it in
       either theme without needing its own theme-aware colour. */
    --colour-disk-face: #cbd5e1;
    --colour-capacitor: #3d7dff;
    --colour-capacitor-labels: #3d7dff;
    --colour-current: #39ff14;
    /* Animated current-FLOW lines (e.g. bjt_fault_current_flow.html) — a
       separate token from --colour-current on purpose: that one is also
       used for small filled ammeter shapes, where its light-theme value
       reads fine, but the same colour on a thin dashed line was too weak
       against the light panel background. Dark mode reuses the shared
       neon green unchanged (it already read clearly there). */
    --colour-flow: var(--colour-current);
    --colour-diode: #ff9933;
    --colour-diode-labels: #ff9933;
    --colour-down: #44f585;
    --colour-gain: #a78bfa;
    --colour-power: #93c5fd;
    --colour-gnd: #2f8f5b;
    --colour-ground: var(--colour-gnd);
    --colour-ideal: #a78bfa;
    --colour-meter-fill: #200808;
    --colour-node: #f8f8f5;
    --colour-progress: #00ff99;
    --colour-red: #ff3333;
    --colour-resistor: #00e5ff;
    --colour-resistor-labels: #e436de;
    /* Meter "ghost" — the arrow + change shown beside a meter that has moved from its healthy value.
       Up reads as "in the black" (the theme's strongest text colour), down as "in the red". */
    --colour-ghost-up: var(--colour-text-strong);
    --colour-ghost-down: var(--colour-red);
    /* Impedance / input & output resistance values (Rin, Rout, Zin, Zout…) — the resistor-label
       magenta family, pushed toward pink so the two stay distinguishable side by side. */
    --colour-impedance-labels: #ff7ac0;
    /* Corner frequencies — f1 (lower) and f2 (upper) each get their own hue, apart from the capacitor
       blue and gain purple they used to borrow: teal for f1, lime for f2. */
    --colour-f1-labels: #2dd4bf;
    --colour-f2-labels: #a3e635;
    --colour-scope: #a6aebe;
    --colour-scope-fill: #200808;
    --colour-scope-labels: #a6aebe;
    --colour-scope-input: #ffcc00;
    --colour-scope-output: #00ffff;
    --colour-section: #0a72da;
    --colour-series: #00e5ff;
    --colour-signal: #ffd166;
    --colour-signal-labels: #ffd166;
    --colour-supply: #ff4444;
    --colour-vce: #ff9d4d;
    --colour-voltage-label: #ff6b6b;
    --colour-input-a: #818cf8;
    --colour-input-b: #2dd4bf;
    --colour-input-c: #a3e635;
    --colour-output-z: #67b8eb;
    --colour-up: #f69090;


    /* ---- fonts ---- */
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Orbitron', sans-serif;
    --font-body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    /* ---- radii & card shadow ---- */
    --radius-lg: 4px;
    --radius-sm: 3px;
    --shadow-card: none;

    /* ---- glows (neon text/box-shadows — dark-theme-only effects) ---- */
    --glow-header: none;
    --glow-transfer-title: 0 0 16px rgba(0, 229, 255, .5);
    --glow-menu-link: 0 0 5px rgba(0, 229, 255, .35);
    --glow-menu-link-hover: 0 0 8px rgba(0, 255, 153, .45);
    --glow-progress-active: 0 0 6px rgba(0, 229, 255, .6);
    --glow-modal: 0 0 60px rgba(0, 229, 255, .08);
    --glow-match-pool-weak: 0 0 10px rgba(0, 229, 255, .35);
    --glow-match-pool-strong: 0 0 20px rgba(0, 229, 255, .7);
    --glow-match-title-weak: 0 0 10px rgba(0, 229, 255, .45);
    --glow-match-title-strong: 0 0 18px rgba(0, 229, 255, .8);
    --glow-slider-thumb: 0 0 8px rgba(255, 255, 255, .8);
    --glow-slider-thumb-active: 0 0 12px var(--colour-bjt), 0 0 24px rgba(255, 180, 84, .4);
}

/* ── Light theme — generic "clean institutional" look, deliberately not
   modelled on any specific real institution's brand. Blue is used as the
   primary accent precisely because it carries no single-institution
   association (unlike, say, a specific red used by a real RTO). ── */
:root[data-theme="light"] {
    --colour-bg: #f1f5f9;
    --colour-panel: #f1f5f9;
    --colour-border: #e2e8f0;
    --colour-text: #1e293b;
    --colour-text-strong: #0f172a;
    --colour-label: #64748b;
    --colour-label-rgb: 100, 116, 139;
    --colour-grid: transparent;
    --colour-highlight: rgba(255, 235, 59, 0.40);
    --colour-resistor-combo1: #a606a0;
    --colour-resistor-combo2: #a68b00;
    --colour-resistor-combo3: #1d4ed8;
    --colour-resistor-combo4: #0f766e;
    --colour-resistor-combo5: #6d28d9;
    --colour-resistor-total: #0e7490;

    --colour-ui-primary: #2563eb;
    --colour-ui-primary-rgb: 37, 99, 235;
    --colour-ui-correct: #16a34a;
    --colour-ui-correct-rgb: 22, 163, 74;
    --colour-ui-wrong: #dc2626;
    --colour-ui-wrong-rgb: 220, 38, 38;
    --colour-ui-restart: #d97706;
    --colour-ui-restart-rgb: 217, 119, 6;
    --colour-ui-summary: #7c3aed;
    --colour-ui-summary-rgb: 124, 58, 237;

    --colour-ammeter-fill: #f0fdf4;
    --colour-bjt: #b45309;
    --colour-bjt-rgb: 180, 83, 9;
    --colour-bjt-labels: #b45309;
    --colour-switch: #0369a1;
    --colour-switch-labels: #0369a1;
    --colour-dff: #0d80c3;
    --colour-dff-rgb: 14, 131, 199;
    --colour-dff-labels: #0e83c7;

    --colour-jfet: #7e22ce;
    --colour-jfet-rgb: 126, 34, 206;
    --colour-jfet-labels: #7e22ce;
    --colour-mosfet: #228451;
    --colour-mosfet-rgb: 34, 132, 81;
    --colour-mosfet-labels: #228451;
    --colour-disk-face: #ffffff;
    --colour-capacitor: #1d4ed8;
    --colour-capacitor-labels: #1d4ed8;
    --colour-current: #16a34a;
    --colour-flow: #0afcb0;
    --colour-diode: #c2410c;
    --colour-diode-labels: #c2410c;
    --colour-down: #079a3d;
    --colour-gain: #7c3aed;
    --colour-power: #1e3a8a;
    --colour-gnd: #15803d;
    --colour-ideal: #7c3aed;
    --colour-meter-fill: #fef2f2;
    --colour-node: #0f172a;
    --colour-progress: #16a34a;
    --colour-red: #dc2626;
    --colour-resistor: #0284c7;
    --colour-resistor-labels: #a21caf;
    --colour-impedance-labels: #be185d;
    --colour-f1-labels: #0f766e;
    --colour-f2-labels: #4d7c0f;
    --colour-scope: #475569;
    --colour-scope-fill: #fef2f2;
    --colour-scope-labels: #475569;
    --colour-section: #1d4ed8;
    --colour-series: #0284c7;
    --colour-signal: #a16207;
    --colour-signal-labels: #a16207;
    --colour-supply: #b91c1c;
    --colour-vce: #c2410c;
    --colour-voltage-label: #dc2626;
    --colour-input-a: #4338ca;
    --colour-input-b: #0f766e;
    --colour-input-c: #4d7c0f;
    --colour-output-z: #0d5bf7;
    --colour-up: #b91c1c;

    --font-mono: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    --radius-lg: 8px;
    --radius-sm: 6px;
    --shadow-card: 0 4px 12px rgba(0, 0, 0, .05);

    --glow-header: none;
    --glow-transfer-title: none;
    --glow-menu-link: none;
    --glow-menu-link-hover: none;
    --glow-progress-active: none;
    --glow-modal: none;
    --glow-match-pool-weak: none;
    --glow-match-pool-strong: none;
    --glow-match-title-weak: none;
    --glow-match-title-strong: none;
    --glow-slider-thumb: 0 1px 4px rgba(0, 0, 0, .25);
    --glow-slider-thumb-active: 0 1px 6px rgba(0, 0, 0, .35);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--colour-bg);
    color: var(--colour-text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    background-image: linear-gradient(var(--colour-grid) 1px, transparent 1px), linear-gradient(90deg, var(--colour-grid) 1px, transparent 1px);
    background-size: 40px 40px;
}

.crumb-row {
    width: 100%;
    max-width: clamp(900px, 80vw, 1200px);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    /* flex-start, not space-between — the row itself is often much wider
       than the actual question content centred beneath it (single-col
       quiz pages cap that content at 700px), so space-between used to
       fling the toggle out to the row's far edge, well past the content
       it's supposed to sit near. flex-start keeps it right next to the
       breadcrumb text instead. */
    justify-content: flex-start;
    gap: .75rem;
}

.crumb {
    min-width: 0;
    font-size: .68rem;
    letter-spacing: .15em;
    text-transform: uppercase;
}

.crumb a {
    color: var(--colour-label);
    text-decoration: none;
    transition: color .15s;
}

.crumb a:hover {
    color: var(--colour-ui-primary);
}

.crumb span {
    color: var(--colour-ui-primary);
}

header {
    text-align: center;
    margin-bottom: 2rem;
    width: 100%;
}

header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 900;
    letter-spacing: .12em;
    color: var(--colour-ui-primary);
    text-shadow: var(--glow-header);
    text-transform: uppercase;
}

header p {
    margin-top: .5rem;
    color: var(--colour-label);
    font-size: .75rem;
    letter-spacing: .2em;
    text-transform: uppercase;
}

.quiz-wrap {
    width: 100%;
    max-width: clamp(900px, 80vw, 1200px);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

/* Below the two-column breakpoint, show the question above the diagram —
   the question text often refers to "the diagram below", which is only
   true once the two columns stack in source order (circuit-col first). */
.circuit-col { order: 2; }

.questions-col { order: 1; }

/* Optional Example 1/2/3/Randomise mode-switcher (see
   coupling_circuit_analysis.html/bjt_npn_voltage_divider.html for the
   pattern) — a top-level sibling of .circuit-col/.questions-col inside
   .quiz-wrap, NOT nested inside .circuit-col, specifically so it can be
   positioned independently of the circuit diagram at each breakpoint.
   Below the two-column breakpoint it goes first (above the question, same
   reasoning as circuit-col/questions-col's own order above — you want to
   pick your values before reading a question that already assumes them).
   Purely additive: pages with no .mode-toggle in their markup never
   reference this rule at all. */
.mode-toggle { order: 0; }

.card {
    background: var(--colour-panel);
    border: 1px solid var(--colour-border);
    border-radius: var(--radius-lg);
    padding: 1.6rem;
    box-shadow: var(--shadow-card);
}

.circuit-panel {
    background: rgba(var(--colour-label-rgb), .08);
    border: 1px solid var(--colour-border);
    border-radius: var(--radius-lg);
    padding: .8rem;
    position: relative;
    cursor: zoom-in;
}

/* Light mode's rgba-tinted panel reads as a muddy grey box against the
   diagram fill — swap it for a crisp, purpose-built off-white instead. */
:root[data-theme="light"] .circuit-panel {
    background: #f8fafc;
    border-color: #e2e8f0;
}

.circuit-panel svg {
    width: 100%;
    height: auto;
    display: block;
}

/* Thin cyan traces that read crisply on a dark background wash out on
   light canvases — bump every diagram stroke ~25-30% heavier in light
   mode, banded by its original weight so relative line hierarchy holds. */
:root[data-theme="light"] svg [stroke-width="0.75"] { stroke-width: 1; }
:root[data-theme="light"] svg [stroke-width="0.8"] { stroke-width: 1.05; }
:root[data-theme="light"] svg [stroke-width="1"],
:root[data-theme="light"] svg [stroke-width="1.0"] { stroke-width: 1.3; }
:root[data-theme="light"] svg [stroke-width="1.2"] { stroke-width: 1.55; }
:root[data-theme="light"] svg [stroke-width="1.5"] { stroke-width: 1.9; }
:root[data-theme="light"] svg [stroke-width="1.8"] { stroke-width: 2.3; }
:root[data-theme="light"] svg [stroke-width="2"] { stroke-width: 2.5; }
:root[data-theme="light"] svg [stroke-width="2.5"] { stroke-width: 3.1; }
:root[data-theme="light"] svg [stroke-width="3"] { stroke-width: 3.7; }

.panel-label {
    font-size: .58rem;
    letter-spacing: .18em;
    color: var(--colour-label);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 6px;
}

.shape-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: .7rem;
}

.shape-cell {
    position: relative;
    min-width: 0;
    background: rgba(var(--colour-label-rgb), .08);
    border: 2px solid var(--colour-border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    padding: .5rem .3rem .3rem;
    transition: border-color .15s, background .15s;
}

.shape-cell svg {
    width: 100%;
    height: auto;
    display: block;
}

.shape-cell:hover { border-color: rgba(var(--colour-ui-primary-rgb), .5); }

.shape-cell.selected {
    border-color: var(--colour-ui-primary);
    background: rgba(var(--colour-ui-primary-rgb), .08);
}

.shape-cell.correct {
    border-color: var(--colour-ui-correct);
    background: rgba(var(--colour-ui-correct-rgb), .1);
}

.shape-cell.wrong {
    border-color: var(--colour-ui-wrong);
    background: rgba(var(--colour-ui-wrong-rgb), .1);
}

.shape-cell.missed {
    border-color: var(--colour-ui-restart);
    background: rgba(var(--colour-ui-restart-rgb), .08);
}

.shape-cell.dimmed { opacity: .4; }

.shape-cell .shape-num {
    position: absolute;
    top: 3px;
    left: 6px;
    font-family: var(--font-display);
    font-size: .62rem;
    font-weight: 700;
    color: var(--colour-label);
}

.selected-list {
    font-size: .78rem;
    color: var(--colour-label);
    font-family: var(--font-display);
    letter-spacing: .04em;
}

.q-panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.q-header {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
}

.q-num {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--colour-ui-primary);
    white-space: nowrap;
    padding-top: .15rem;
}

.q-text {
    color: var(--colour-text-strong);
    font-size: .9rem;
    font-weight: bold;
    line-height: 1.5;
}

.q-hint {
    font-size: .75rem;
    color: var(--colour-label);
    font-weight: normal;
    margin-top: .3rem;
}

.options {
    display: flex;
    flex-direction: column;
    gap: .6rem;
}

.option-btn {
    width: 100%;
    padding: .7rem 1rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--colour-border);
    background: rgba(var(--colour-label-rgb), .04);
    color: var(--colour-text);
    font-family: var(--font-body);
    font-size: .82rem;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    display: flex;
    align-items: center;
    gap: .7rem;
}

.option-btn:hover:not(:disabled) {
    border-color: rgba(var(--colour-ui-primary-rgb), .4);
    background: rgba(var(--colour-ui-primary-rgb), .05);
}

.option-btn.selected {
    border-color: rgba(var(--colour-ui-primary-rgb), .6);
    background: rgba(var(--colour-ui-primary-rgb), .08);
    color: var(--colour-ui-primary);
}

.option-btn.correct {
    border-color: var(--colour-ui-correct);
    background: rgba(var(--colour-ui-correct-rgb), .08);
    color: var(--colour-ui-correct);
}

.option-btn.wrong {
    border-color: var(--colour-ui-wrong);
    background: rgba(var(--colour-ui-wrong-rgb), .08);
    color: var(--colour-ui-wrong);
}

.option-btn.dimmed { opacity: .35; }

.option-letter {
    font-family: var(--font-display);
    font-size: .7rem;
    font-weight: 700;
    min-width: 22px;
}

.result-icon { font-size: 1.1rem; margin-left: auto; }

.result-banner {
    display: none;
    padding: .65rem 1rem;
    border-radius: var(--radius-sm);
    font-size: .78rem;
    font-family: var(--font-display);
    align-items: center;
    gap: .6rem;
    line-height: 1.5;
}

.result-banner.correct {
    display: flex;
    background: rgba(var(--colour-ui-correct-rgb), .08);
    border: 1px solid rgba(var(--colour-ui-correct-rgb), .3);
    color: var(--colour-ui-correct);
}

.result-banner.wrong {
    display: flex;
    background: rgba(var(--colour-ui-wrong-rgb), .08);
    border: 1px solid rgba(var(--colour-ui-wrong-rgb), .3);
    color: var(--colour-ui-wrong);
}

.working-box {
    display: none;
    background: rgba(var(--colour-label-rgb), .06);
    border: 1px solid var(--colour-border);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.3rem;
}

.working-box.visible { display: block; }

.working-title {
    font-family: var(--font-display);
    font-size: .62rem;
    letter-spacing: .2em;
    color: var(--colour-label);
    text-transform: uppercase;
    margin-bottom: .7rem;
    padding-bottom: .4rem;
    border-bottom: 1px solid var(--colour-border);
}

.working-label {
    font-size: .72rem;
    color: var(--colour-label);
    margin: .5rem 0 .1rem;
}

.working-step {
    font-family: var(--font-mono);
    font-size: .85rem;
    color: var(--colour-ui-primary);
    padding-top: .4rem;
    padding-bottom: .2rem;
    margin: .5rem 0 .1rem;
    border-top: 1px solid var(--colour-border);
}

.working-line { font-size: .8rem; line-height: 1.7; }
/* answer key (engine-generated, see answerKeyHtml() in quiz-engine.js) */
.answer-key-heading { margin-top: .9rem; }
.answer-key-group { margin: .35rem 0 .2rem; }
.answer-key-title { font-size: .78rem; font-weight: 700; color: var(--colour-ui-primary); }
.answer-key { margin: .15rem 0 .35rem .4rem; padding: 0; list-style: none; font-size: .8rem; line-height: 1.55; }
.answer-key li { margin: .1rem 0; padding-left: 1.2rem; position: relative; }
.answer-key li::before { content: '•'; position: absolute; left: .25rem; color: var(--colour-label); }
.answer-key li.ak-correct { color: var(--colour-ui-correct); }
.answer-key li.ak-correct::before { content: '✓'; color: var(--colour-ui-correct); font-weight: 700; left: 0; }
.answer-key li.ak-wrong { color: var(--colour-ui-wrong); }
.answer-key li.ak-wrong::before { content: '✗'; color: var(--colour-ui-wrong); font-weight: 700; left: 0; }
.answer-key li.ak-missed { color: var(--colour-ui-restart); }
.answer-key li.ak-missed::before { content: '○'; color: var(--colour-ui-restart); font-weight: 700; left: 0; }
.answer-key-num { font-size: .72rem; color: var(--colour-label); }

.working-total {
    margin-top: .5rem;
    border-top: 1px solid var(--colour-text);
    padding: .5rem 0 .5rem 1.5rem;
    font-size: .95rem;
    font-family: var(--font-mono);
}

.working-formula-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    line-height: 1;
    padding: .5rem 0 .5rem 1.5rem;
    font-size: .82rem;
    font-family: var(--font-mono);
}

.working-frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 4px;
}

.working-frac .num {
    border-bottom: 1.5px solid currentColor;
    padding: 0 6px 2px;
    text-align: center;
    width: 100%;
}

.working-frac .den {
    padding: 2px 6px 0;
    text-align: center;
    width: 100%;
}

.working-sqrt {
    display: inline-flex;
    align-items: stretch;
    vertical-align: middle;
    margin: 0 2px;
}

.working-sqrt .sqrt-sign {
    display: flex;
    align-items: flex-end;
    font-size: 1.35em;
    line-height: 1;
    padding-right: 1px;
}

.working-sqrt .sqrt-body {
    border-top: 1.5px solid currentColor;
    padding: 2px 4px 0 3px;
    align-self: stretch;
}

.transfer-title {
    width: 100%;
    text-align: center;
    font-family: var(--font-display);
    font-size: clamp(0.6rem, 1.6vw, 0.76rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--colour-ui-primary);
    text-shadow: var(--glow-transfer-title);
    text-transform: uppercase;
    margin-bottom: 0.8rem;
}

.q5-visualizer {
    --q5v-magenta: #ff007f;
    --q5v-cyan: #00f0ff;
    --q5v-orange: #ff8c00;
    --q5v-red: #ff3344;
    --q5v-green: #00ff66;
    --q5v-dim: #a0aab8;
    width: 100%;
    border-radius: var(--radius-lg);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 0;
    background: rgba(var(--colour-label-rgb), .08);
    border: 1px solid var(--colour-border);
}

:root[data-theme="light"] .q5-visualizer {
    --q5v-magenta: #be185d;
    --q5v-cyan: #0e7490;
    --q5v-orange: #c2410c;
    --q5v-red: #dc2626;
    --q5v-green: #15803d;
    --q5v-dim: #64748b;
}

.q5-visualizer .q5v-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
}

.q5-visualizer .q5v-header-title {
    font-family: var(--font-display);
    font-size: 0.58rem;
    letter-spacing: 1.5px;
    color: var(--q5v-dim);
    text-transform: uppercase;
}

.q5-visualizer .q5v-reset {
    background: rgba(var(--colour-label-rgb), .1);
    border: 1px solid rgba(var(--colour-label-rgb), .3);
    color: var(--colour-text);
    padding: 3px 9px;
    border-radius: 5px;
    font-size: 0.65rem;
    cursor: pointer;
    font-family: var(--font-mono);
    transition: background 0.2s;
}

.q5-visualizer .q5v-reset:hover { background: rgba(var(--colour-label-rgb), .2); }

.q5-visualizer .q5v-box {
    border-radius: 7px;
    padding: 8px 11px;
    background: rgba(var(--colour-label-rgb), .05);
}

.q5-visualizer .q5v-box-magenta { border: 2px dashed var(--q5v-magenta); }

.q5-visualizer .q5v-box-cyan { border: 2px dashed var(--q5v-cyan); }

.q5-visualizer .q5v-box-neutral { border: 2px dashed var(--colour-border); }

.q5-visualizer .q5v-box-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.q5-visualizer .q5v-box-title {
    font-weight: 800;
    font-size: 0.7rem;
    letter-spacing: 1px;
    margin-bottom: 1px;
}

.q5-visualizer .q5v-box-magenta .q5v-box-title { color: var(--q5v-magenta); }

.q5-visualizer .q5v-box-cyan    .q5v-box-title { color: var(--q5v-cyan); }

.q5-visualizer .q5v-box-neutral .q5v-box-title { color: var(--colour-text); }

.q5-visualizer .q5v-box-sub {
    font-size: 0.6rem;
    color: var(--q5v-dim);
    font-family: var(--font-mono);
    margin-bottom: 5px;
}

.q5-visualizer .q5v-vol {
    font-weight: bold;
    font-size: 0.82rem;
    white-space: nowrap;
}

.vc-track-container {
    position: relative;
    width: 100%;
    height: 48px;
    margin-top: 6px;
    background: var(--colour-panel);
    border-radius: 6px;
    border: 1px solid rgba(255, 0, 127, 0.3);
    overflow: hidden;
}

:root[data-theme="light"] .vc-track-container { border-color: rgba(190, 24, 93, 0.3); }

.vc-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--q5v-magenta);
    transition: width 0.1s ease-out;
}

.vc-indicator-val {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.78rem;
    font-weight: bold;
    white-space: nowrap;
    transition: left 0.1s ease-out, color 0.15s ease-out, text-shadow 0.15s ease-out;
}

.q5-visualizer .q5v-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 13px;
    border-radius: 7px;
    outline: none;
    cursor: pointer;
    margin-top: 2px;
    border: 1px solid rgba(var(--colour-label-rgb), .25);
}

#q5-slide-E { background: var(--colour-panel); }

.q5-visualizer .q5v-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--colour-panel);
    cursor: pointer;
    box-shadow: var(--glow-slider-thumb);
    border: 2px solid var(--colour-bg);
    transition: background 0.15s, box-shadow 0.15s;
}

.q5-visualizer .q5v-slider:active::-webkit-slider-thumb {
    background: var(--colour-bjt);
    box-shadow: var(--glow-slider-thumb-active);
}

.q5-visualizer .q5v-slider::-moz-range-thumb {
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--colour-panel);
    cursor: pointer;
    box-shadow: var(--glow-slider-thumb);
    border: 2px solid var(--colour-bg);
    transition: background 0.15s, box-shadow 0.15s;
}

.q5-visualizer .q5v-slider:active::-moz-range-thumb {
    background: var(--colour-bjt);
    box-shadow: var(--glow-slider-thumb-active);
}

.q5-visualizer .q5v-slider-range {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--colour-label);
    margin-top: 4px;
    padding: 0 2px;
}

.q5-visualizer .q5v-slider-wrap { position: relative; }

.q5-visualizer .q5v-slider-zero-tick {
    position: absolute;
    top: calc(50% + 3px);
    width: 2px;
    height: 20px;
    background: var(--colour-border);
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.q5-visualizer .q5v-schematic {
    position: relative;
    width: 100%;
    aspect-ratio: 540 / 220;
}

.q5-visualizer .q5v-schematic svg { width: 100%; height: 100%; }

.q5-visualizer .q5v-wire { transition: stroke 0.3s ease, stroke-width 0.3s ease; }

.q5-visualizer .q5v-flow { stroke-dasharray: 6, 6; }

.vb-line-slider {
    position: absolute;
    top: 50%;
    left: 19.4%;
    width: 45.7%;
    height: 18px;
    transform: translateY(-50%);
    -webkit-appearance: none;
    background: transparent;
    outline: none;
    cursor: pointer;
    z-index: 10;
}

.vb-line-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--colour-panel);
    border: 3px solid var(--colour-bjt);
    box-shadow: 0 0 12px var(--colour-bjt);
    cursor: pointer;
}

.vb-line-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--colour-panel);
    border: 3px solid var(--colour-bjt);
    box-shadow: 0 0 12px var(--colour-bjt);
    cursor: pointer;
}

@keyframes q5vFlowDown {
    from { stroke-dashoffset: 24; }
    to { stroke-dashoffset: 0; }
}

@keyframes q5vFlowRight {
    from { stroke-dashoffset: 24; }
    to { stroke-dashoffset: 0; }
}

.q5-visualizer .q5v-badge {
    text-align: center;
    padding: 8px 11px;
    border-radius: 7px;
    font-weight: bold;
    font-size: 0.72rem;
    line-height: 1.5;
    transition: all 0.3s;
}

.q5-visualizer .q5v-badge-header {
    font-size: 0.76rem;
    margin-bottom: 3px;
    padding-bottom: 2px;
    border-bottom: 1px solid rgba(var(--colour-label-rgb), .25);
}

.q5-visualizer .q5v-badge-line { margin: 2px 0; font-weight: 600; }

.q5-visualizer .q5v-active {
    background: rgba(0, 255, 102, 0.10);
    border: 1px solid var(--q5v-green);
    color: var(--q5v-green);
}

.q5-visualizer .q5v-alert {
    background: rgba(255, 51, 68, 0.12);
    border: 1px solid var(--q5v-red);
    color: var(--q5v-red);
}

.q5-visualizer .q5v-warning {
    background: rgba(255, 140, 0, 0.12);
    border: 1px solid var(--q5v-orange);
    color: var(--q5v-orange);
}

.q5-visualizer .q5v-saturated {
    background: rgba(255, 0, 127, 0.10);
    border: 1px solid var(--q5v-magenta);
    color: var(--q5v-magenta);
}

:root[data-theme="light"] .q5-visualizer .q5v-active { background: rgba(21, 128, 61, 0.10); }

:root[data-theme="light"] .q5-visualizer .q5v-alert { background: rgba(220, 38, 38, 0.12); }

:root[data-theme="light"] .q5-visualizer .q5v-warning { background: rgba(194, 65, 12, 0.12); }

:root[data-theme="light"] .q5-visualizer .q5v-saturated { background: rgba(190, 24, 93, 0.10); }

/* ── Worked-solution colour convention ──────────────────────────────
   In each working-formula-row, wrap ONLY the LHS subject symbol (e.g. V_B,
   I_E) in one of these — never the whole row. Substituted values, units
   and operators stay unwrapped (plain --colour-text). The final answer in
   a working-line.total gets .colour-result instead. ──────────────────── */

.colour-voltage { color: var(--colour-voltage-label); }

.colour-supply { color: var(--colour-supply); }

.colour-current { color: var(--colour-current); }

.colour-result { color: var(--colour-text); }

.colour-bjt { color: var(--colour-bjt-labels); }
.colour-switch { color: var(--colour-switch-labels); }
.colour-jfet { color: var(--colour-jfet-labels); }

.colour-mosfet { color: var(--colour-mosfet-labels); }

.colour-resistor { color: var(--colour-resistor-labels); }

.colour-impedance { color: var(--colour-impedance-labels); }

.colour-f1 { color: var(--colour-f1-labels); }
.colour-f2 { color: var(--colour-f2-labels); }

.btn-row {
    display: flex;
    gap: .45rem;
    flex-wrap: wrap;
    align-items: center;
}

.btn {
    /* Sized to its own label + padding, not a fixed width — a uniform
       96px fit "Restart"/"Next →" fine but left wide empty margins on
       "Prev"/"Check" while sometimes not being wide enough for a longer
       label like "Print Worksheet" (or its own text wrapping to 2 lines
       instead). With several buttons often showing in the same row, that
       wasted width was pushing the row wider than it needed to be,
       forcing an earlier wrap onto a second line than the buttons'
       actual combined content required. */
    padding: .42rem 1rem;
    border-radius: var(--radius-sm);
    font-family: var(--font-mono);
    font-size: .64rem;
    letter-spacing: .02em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .15s;
    border: 1px solid;
    text-align: center;
    white-space: nowrap;
}

/* Check/Next/See-Summary are the SAME conceptual "move forward" action,
   just at different points in a question's lifecycle (only one is ever
   visible at once) — all three get the bolder "primary CTA" treatment:
   stronger fill, solid (not translucent) border, a glow echoing the same
   filter:url(#glow) look already used on the circuit diagrams elsewhere
   in these quizzes, and a taller tap target for easier thumb-tapping on
   phones. Prev/Restart stay in the quieter outlined style so the primary
   action visually stands out against them, not just against the page. */
.btn-check, .btn-next, .btn-summary {
    font-weight: 700;
    padding: .58rem 1.1rem;
    border-width: 2px;
}

.btn-check {
    background: rgba(var(--colour-ui-correct-rgb), .22);
    border-color: var(--colour-ui-correct);
    color: var(--colour-ui-correct);
    box-shadow: 0 0 10px rgba(var(--colour-ui-correct-rgb), .45);
}

.btn-check:hover:not(:disabled) { background: rgba(var(--colour-ui-correct-rgb), .34); }

.btn-check:disabled { opacity: .35; cursor: default; box-shadow: none; }

.btn-shuffle {
    background: rgba(var(--colour-ui-restart-rgb), .1);
    border-color: rgba(var(--colour-ui-restart-rgb), .4);
    color: var(--colour-ui-restart);
    margin-left: auto;
}

.btn-shuffle:hover { background: rgba(var(--colour-ui-restart-rgb), .2); }

.btn-next {
    background: rgba(var(--colour-ui-primary-rgb), .22);
    border-color: var(--colour-ui-primary);
    color: var(--colour-ui-primary);
    box-shadow: 0 0 10px rgba(var(--colour-ui-primary-rgb), .45);
}

.btn-next:hover { background: rgba(var(--colour-ui-primary-rgb), .34); }

.btn-prev {
    background: rgba(var(--colour-label-rgb), .1);
    border-color: rgba(var(--colour-label-rgb), .4);
    color: var(--colour-label);
}

.btn-prev:hover { background: rgba(var(--colour-label-rgb), .2); }

.btn-summary {
    background: rgba(var(--colour-ui-summary-rgb), .24);
    border-color: var(--colour-ui-summary);
    color: var(--colour-ui-summary);
    box-shadow: 0 0 10px rgba(var(--colour-ui-summary-rgb), .4);
}

.btn-summary:hover { background: rgba(var(--colour-ui-summary-rgb), .36); }

.summary-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .5rem 0 .8rem;
    border-bottom: 1px solid var(--colour-border);
    margin-bottom: 1rem;
}

.summary-title {
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 700;
    color: var(--colour-ui-primary);
    letter-spacing: .15em;
    text-transform: uppercase;
}

.summary-values {
    background: rgba(var(--colour-label-rgb), .06);
    border: 1px solid var(--colour-border);
    border-radius: var(--radius-lg);
    padding: .8rem 1rem;
    margin-bottom: 1.2rem;
    font-size: .82rem;
    line-height: 2.1;
}

.summary-item {
    border: 1px solid var(--colour-border);
    border-radius: var(--radius-lg);
    padding: .9rem 1rem;
    margin-bottom: 1rem;
    background: rgba(var(--colour-label-rgb), .05);
}

.summary-item-head {
    display: flex;
    align-items: baseline;
    gap: .6rem;
    margin-bottom: .3rem;
}

.summary-qnum {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--colour-ui-primary);
    font-size: .85rem;
    white-space: nowrap;
}

.summary-question {
    font-size: .82rem;
    color: var(--colour-text-strong);
    font-weight: bold;
    line-height: 1.4;
}

.summary-answer {
    font-size: .74rem;
    margin: .45rem 0;
    font-family: var(--font-display);
    letter-spacing: .04em;
}

.progress-wrap {
    display: flex;
    gap: .4rem;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
}

.progress-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid var(--colour-border);
    background: transparent;
    transition: background .2s, border-color .2s;
}

.progress-dot.done {
    background: var(--colour-ui-correct);
    border-color: var(--colour-ui-correct);
}

.progress-dot.active {
    background: var(--colour-ui-primary);
    border-color: var(--colour-ui-primary);
    box-shadow: var(--glow-progress-active);
}

.progress-label {
    font-size: .65rem;
    color: var(--colour-label);
    margin-left: .4rem;
    letter-spacing: .1em;
}

.menu-link {
    margin-left: auto;
    font-size: .65rem;
    color: var(--colour-ui-primary);
    text-decoration: none;
    letter-spacing: .08em;
    padding: .15rem .5rem;
    border-radius: .25rem;
    border: 1px solid var(--colour-ui-primary);
    box-shadow: var(--glow-menu-link);
    transition: color .2s, border-color .2s, box-shadow .2s;
    white-space: nowrap;
}

.menu-link:hover {
    color: var(--colour-ui-correct);
    border-color: var(--colour-ui-correct);
    box-shadow: var(--glow-menu-link-hover);
}

.zoom-hint {
    position: absolute;
    bottom: .6rem;
    right: .7rem;
    font-family: var(--font-display);
    font-size: .55rem;
    letter-spacing: .12em;
    color: var(--colour-label);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: .35rem;
    pointer-events: none;
    opacity: .7;
}

.zoom-hint svg {
    width: 13px;
    height: 13px;
    fill: var(--colour-label);
}

.diagram-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(5, 8, 16, .88);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 1.2rem;
}

:root[data-theme="light"] .diagram-modal { background: rgba(15, 23, 42, .5); }

.diagram-modal.open { display: flex; }

.modal-inner {
    position: relative;
    background: var(--colour-panel);
    border: 1px solid var(--colour-border);
    border-radius: 6px;
    padding: .8rem;
    max-width: min(92vw, 900px);
    max-height: 92vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: .5rem;
    box-shadow: var(--glow-modal);
    cursor: zoom-out;
}

.modal-inner svg {
    width: 100%;
    height: auto;
    max-height: calc(92vh - 5rem);
    display: block;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: .4rem;
    border-bottom: 1px solid var(--colour-border);
}

.modal-title {
    font-family: var(--font-display);
    font-size: .65rem;
    letter-spacing: .18em;
    color: var(--colour-label);
    text-transform: uppercase;
}

.modal-close {
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    background: rgba(var(--colour-ui-wrong-rgb), .08);
    border: 1px solid rgba(var(--colour-ui-wrong-rgb), .35);
    color: var(--colour-ui-wrong);
    border-radius: var(--radius-sm);
    padding: .3rem .7rem;
    transition: background .15s;
}

.modal-close:hover { background: rgba(var(--colour-ui-wrong-rgb), .18); }

.mode-toggle {
    display: flex;
    align-items: center;
    gap: .7rem;
    margin-bottom: .8rem;
    font-family: var(--font-mono);
}

.mode-seg {
    display: inline-flex;
    border: 1px solid var(--colour-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    flex-wrap: wrap;
}

.mode-seg button {
    font-family: var(--font-mono);
    font-size: .66rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    padding: .4rem .95rem;
    border: none;
    background: transparent;
    color: var(--colour-label);
    transition: background .15s, color .15s;
}

.mode-seg button+button { border-left: 1px solid var(--colour-border); }

.mode-seg button.active {
    background: rgba(var(--colour-ui-primary-rgb), .12);
    color: var(--colour-ui-primary);
}

.mode-seg button:not(.active):hover {
    background: rgba(var(--colour-ui-primary-rgb), .04);
    color: var(--colour-text);
}

.cideal { color: var(--colour-ideal); }

.ccap { color: var(--colour-capacitor-labels); }

.csignal { color: var(--colour-signal); }

.cdiode { color: var(--colour-diode-labels); }

.colour-gain { color: var(--colour-gain); }
.colour-power { color: var(--colour-power); }

.option-btn span:not(.option-letter):not(.result-icon) { flex: 1; min-width: 0; }

.working-section {
    font-size: .95rem;
    color: var(--colour-section);
    padding-bottom: .4rem;
    margin: .5rem 0 .1rem;
}

.diagnosis-block {
    border-left: 2px solid var(--colour-ui-primary);
    padding-left: 0.8rem;
    margin: 0.3rem 0 0.9rem;
}

.symptom-item { margin-bottom: 0.55rem; }

.symptom-item:last-child { margin-bottom: 0; }

.symptom-title {
    font-size: .82rem;
    font-weight: 600;
    line-height: 1.5;
}

.symptom-body {
    font-size: .78rem;
    color: var(--colour-label);
    line-height: 1.6;
    margin-top: .15rem;
}

.summary-readings {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .35rem 1.1rem;
    font-size: .8rem;
    border-top: 1px solid var(--colour-border);
    border-bottom: 1px solid var(--colour-border);
    padding: .45rem .1rem;
    margin: .4rem 0;
}

.sr-label {
    font-size: .7rem;
    color: var(--colour-label);
    white-space: nowrap;
    letter-spacing: .03em;
}

.sr-item { white-space: nowrap; }

.colour-ground { color: var(--colour-ground); }

.colour-vce { color: var(--colour-vce); }

.working-line.step {
    margin-top: .5rem;
    padding-top: .5rem;
    border-top: 1px solid var(--colour-border);
    font-size: .85rem;
}

.colour-cap { color: var(--colour-capacitor-labels); }

.colour-signal { color: var(--colour-signal); }

.colour-diode { color: var(--colour-diode-labels); }

.opt-content {
    display: flex;
    flex-direction: column;
    gap: .18rem;
    flex: 1;
}

.opt-label { line-height: 1.4; }

.opt-sub { font-size: .72rem; color: var(--colour-label); }

.option-btn.selected .opt-sub, .option-btn.correct .opt-sub, .option-btn.wrong .opt-sub { color: inherit; opacity: .75; }

.scope-wrap {
    margin-bottom: .6rem;
    border: 1px solid var(--colour-border);
    border-radius: var(--radius-sm);
    overflow: hidden;
}

.scope-legend {
    display: flex;
    gap: 1.2rem;
    padding: .3rem .5rem;
    background: rgba(var(--colour-label-rgb), .08);
    border-top: 1px solid var(--colour-border);
    font-size: .68rem;
}

.scope-legend-ch {
    display: flex;
    align-items: center;
    gap: .35rem;
}

.scope-legend-line { width: 18px; height: 2px; }

.option-btn.missed {
    border-color: var(--colour-ui-restart);
    background: rgba(var(--colour-ui-restart-rgb), .08);
    color: var(--colour-ui-restart);
}

.bits-table { width: 100%; border-collapse: collapse; }

.bits-table th, .bits-table td {
    border: 1px solid var(--colour-border);
    padding: .55rem .4rem;
    text-align: center;
    font-size: .82rem;
    font-family: var(--font-mono);
}

.bits-table thead th {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: .05em;
    color: var(--colour-ui-primary);
    background: rgba(var(--colour-ui-primary-rgb), .06);
}

.bits-table tbody td:first-child {
    font-weight: 700;
    color: var(--colour-text);
    background: rgba(var(--colour-label-rgb), .04);
}

.bits-cell {
    cursor: pointer;
    user-select: none;
    font-weight: 700;
    font-size: .95rem;
    transition: background .15s, color .15s;
}

.bits-cell:hover:not(.correct):not(.wrong) { background: rgba(var(--colour-ui-primary-rgb), .1); }

.bits-cell.correct {
    background: rgba(var(--colour-ui-correct-rgb), .12);
    color: var(--colour-ui-correct);
    cursor: default;
}

.bits-cell.wrong {
    background: rgba(var(--colour-ui-wrong-rgb), .12);
    color: var(--colour-ui-wrong);
    cursor: default;
}

/* kind:'switches' — a row of individual toggle-switch pills, one per bit
   (e.g. a BCD input). Same border/bg tokens as .option-btn/.bits-cell,
   not a bespoke component, so it reads as part of the same answer-input
   family everywhere else in the quiz engine. */
.switch-row {
    display: flex;
    justify-content: center;
    gap: .6rem;
    flex-wrap: wrap;
    margin: 1rem 0;
}

.switch-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .3rem;
    min-width: 56px;
    padding: .6rem .5rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--colour-border);
    background: rgba(var(--colour-label-rgb), .04);
    color: var(--colour-text);
    font-family: var(--font-mono);
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
}

.switch-btn:hover:not(:disabled) {
    border-color: rgba(var(--colour-ui-primary-rgb), .4);
    background: rgba(var(--colour-ui-primary-rgb), .05);
}

.switch-btn .switch-label {
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--colour-label);
}

.switch-btn .switch-value {
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1;
}

.switch-btn.on {
    border-color: rgba(var(--colour-ui-primary-rgb), .6);
    background: rgba(var(--colour-ui-primary-rgb), .1);
    color: var(--colour-ui-primary);
}

.switch-btn.correct {
    border-color: var(--colour-ui-correct);
    background: rgba(var(--colour-ui-correct-rgb), .1);
    color: var(--colour-ui-correct);
    cursor: default;
}

.switch-btn.wrong {
    border-color: var(--colour-ui-wrong);
    background: rgba(var(--colour-ui-wrong-rgb), .1);
    color: var(--colour-ui-wrong);
    cursor: default;
}

/* Clickable table-column-header answer mechanic (originated in
   digital_review_quiz_1_part1.html's Q10/Q14/Q18-20, promoted here so any
   quiz can reuse it): the column headings themselves ARE the multi- or
   single-select options — no separate button list. Any table tagged
   class="col-answer-table" gets this styling; the page's own RENDER_EXTRA
   hook is still responsible for toggling these classes onto th.col-select
   (and the matching td.col-cell in that column) from Q[cur].sel/cor on
   every render — see that file's own comment for the exact JS pattern. */
.col-answer-table th.col-select { cursor: pointer; transition: background .15s, color .15s; user-select: none; }
.col-answer-table th.col-select:hover:not(.correct):not(.wrong):not(.missed):not(.dimmed) {
    background: rgba(var(--colour-ui-primary-rgb), .08);
    color: var(--colour-ui-primary);
}
.col-answer-table th.col-select.selected {
    background: rgba(var(--colour-ui-primary-rgb), .12);
    color: var(--colour-ui-primary);
}
.col-answer-table th.col-select.correct {
    background: rgba(var(--colour-ui-correct-rgb), .12);
    color: var(--colour-ui-correct);
}
.col-answer-table th.col-select.wrong {
    background: rgba(var(--colour-ui-wrong-rgb), .12);
    color: var(--colour-ui-wrong);
}
.col-answer-table th.col-select.missed {
    background: rgba(var(--colour-ui-restart-rgb), .12);
    color: var(--colour-ui-restart);
}
.col-answer-table th.col-select.dimmed { opacity: .45; cursor: default; }

/* Whole-column highlight — the same state classes as th.col-select,
   applied to that column's <td> cells too, just without the pointer
   cursor/hover since the cells themselves aren't clickable. */
.col-answer-table td.col-cell.selected { background: rgba(var(--colour-ui-primary-rgb), .12); }
.col-answer-table td.col-cell.correct { background: rgba(var(--colour-ui-correct-rgb), .12); }
.col-answer-table td.col-cell.wrong { background: rgba(var(--colour-ui-wrong-rgb), .12); }
.col-answer-table td.col-cell.missed { background: rgba(var(--colour-ui-restart-rgb), .12); }
.col-answer-table td.col-cell.dimmed { opacity: .45; }

/* Non-selectable "given" columns (e.g. a truth table's own input columns)
   — shaded to read as fixed reference data, distinct from the clickable
   answer columns. */
.col-answer-table th.static-col, .col-answer-table td.static-col {
    background: rgba(var(--colour-label-rgb), .1);
    color: var(--colour-label);
}

/* Mobile-only 3-column card reflow — opt-in via a SECOND class,
   col-answer-grid, alongside col-answer-table (see digital_review_
   quiz_1_part1.html's Q14 for the reference use). Only for tables with
   exactly one data row and one value per column (e.g. "click every
   Boolean expression below that's wrong") — a single long expression
   per column wraps badly once squeezed into 1/6th of a phone's width in
   a horizontally-scrolled row. Genuine multi-row tables (truth tables,
   spec-comparison tables) must NOT get this class — they still need
   real table rows and stay on the horizontal-scroll fallback instead.
   thead/tbody/tr get display:contents (drops their own box, promotes
   the th/td cells to be direct grid children); nth-child then places
   each of the (always exactly 6) th/td pairs as a 2-row "card" — header
   above its own value — snaking through a 3-column grid (2 rows of 3
   cards). */
@media (max-width: 480px) {
    .col-answer-table.col-answer-grid,
    .col-answer-table.col-answer-grid thead,
    .col-answer-table.col-answer-grid tbody,
    .col-answer-table.col-answer-grid tr {
        display: contents;
    }
    .col-answer-table.col-answer-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: .5rem .4rem;
    }
    .col-answer-table.col-answer-grid th.col-select:nth-child(1) { grid-area: 1 / 1; }
    .col-answer-table.col-answer-grid th.col-select:nth-child(2) { grid-area: 1 / 2; }
    .col-answer-table.col-answer-grid th.col-select:nth-child(3) { grid-area: 1 / 3; }
    .col-answer-table.col-answer-grid th.col-select:nth-child(4) { grid-area: 3 / 1; }
    .col-answer-table.col-answer-grid th.col-select:nth-child(5) { grid-area: 3 / 2; }
    .col-answer-table.col-answer-grid th.col-select:nth-child(6) { grid-area: 3 / 3; }
    .col-answer-table.col-answer-grid tbody td:nth-child(1) { grid-area: 2 / 1; }
    .col-answer-table.col-answer-grid tbody td:nth-child(2) { grid-area: 2 / 2; }
    .col-answer-table.col-answer-grid tbody td:nth-child(3) { grid-area: 2 / 3; }
    .col-answer-table.col-answer-grid tbody td:nth-child(4) { grid-area: 4 / 1; }
    .col-answer-table.col-answer-grid tbody td:nth-child(5) { grid-area: 4 / 2; }
    .col-answer-table.col-answer-grid tbody td:nth-child(6) { grid-area: 4 / 3; }
}

/* th.col-drop — a kind:'match' variant of the same idea: the table's own
   column headings double as the match DROP TARGETS instead of the
   standard #matchColumns box grid (hidden entirely on pages that use
   this). Mirrors .match-column/.match-col-title/.droppable's look below
   so it reads as the same interaction, just relocated into a real table
   header — see digital_review_quiz_1_part1.html's Q27 for the reference
   RENDER_EXTRA implementation (assignToColumn()/unassignItem() called
   unmodified from a click on the th instead of a .match-column div). */
.col-answer-table th.col-drop {
    cursor: pointer;
    vertical-align: top;
    padding-top: .5rem;
    transition: background .15s;
}
.match-col-title-mini {
    font-family: var(--font-display);
    font-size: .62rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--colour-label);
    margin-bottom: .35rem;
}
.match-col-slot {
    min-height: 1.8rem;
    min-width: 0;
}
.match-col-slot .match-chip { width: 100%; min-width: 0; }
.col-answer-table th.col-drop.droppable { background: rgba(var(--colour-ui-primary-rgb), .1); }
.col-answer-table th.col-drop.droppable .match-col-title-mini {
    color: var(--colour-ui-primary);
    animation: matchTitlePulse 1.1s ease-in-out infinite;
}

/* Click-a-region-of-the-diagram-itself answer mechanic (originated in
   digital_review_quiz_1_part1.html's Q29 — 4 separate <use> instances,
   one per selectable sub-circuit, each independently clickable since a
   single <use href="#wholeDiagram"> instance's referenced content can't
   be addressed individually). A coloured drop-shadow glow is used for
   state instead of recolouring, since this kind of diagram's own
   strokes are usually already explicit (var(--colour-series) etc.) and
   won't take an inherited override. */
.circuit-select { cursor: pointer; transition: filter .15s, opacity .15s; }
.circuit-select:hover:not(.correct):not(.wrong):not(.missed):not(.dimmed) {
    filter: drop-shadow(0 0 6px var(--colour-ui-primary));
}
.circuit-select.selected { filter: drop-shadow(0 0 6px var(--colour-ui-primary)); }
.circuit-select.correct { filter: drop-shadow(0 0 8px var(--colour-ui-correct)); }
.circuit-select.wrong { filter: drop-shadow(0 0 8px var(--colour-ui-wrong)); }
.circuit-select.missed { filter: drop-shadow(0 0 8px var(--colour-ui-restart)); }
.circuit-select.dimmed { opacity: .4; }

/* .circuit-select-bg — a real sibling rect (NOT inside the <use>'s own
   shadow tree, so plain descendant selectors can actually reach it,
   unlike anything drawn inside the referenced circuit itself) that
   shades the WHOLE loop's footprint on selection, not just its thin wire
   strokes. The drop-shadow filter above traces alpha, so it was nearly
   invisible against a loop that's otherwise just unfilled 2px lines —
   especially at phone size, in either theme. This fills a solid, clearly
   visible block behind the whole circuit instead; the drop-shadow glow
   stays layered on top as a subtle edge accent. */
.circuit-select-bg { fill: transparent; transition: fill .15s; }
.circuit-select:hover:not(.correct):not(.wrong):not(.missed):not(.dimmed) .circuit-select-bg {
    fill: rgba(var(--colour-ui-primary-rgb), .1);
}
.circuit-select.selected .circuit-select-bg { fill: rgba(var(--colour-ui-primary-rgb), .16); }
.circuit-select.correct .circuit-select-bg { fill: rgba(var(--colour-ui-correct-rgb), .18); }
.circuit-select.wrong .circuit-select-bg { fill: rgba(var(--colour-ui-wrong-rgb), .18); }
.circuit-select.missed .circuit-select-bg { fill: rgba(var(--colour-ui-restart-rgb), .18); }

.match-wrap {
    display: flex;
    flex-direction: column;
    gap: .8rem;
}

.match-pool-row {
    display: flex;
    align-items: stretch;
    gap: .5rem;
}

.match-pool-arrow {
    flex: 0 0 auto;
    width: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--colour-ui-primary);
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
}

.match-pool-row.needs-pick .match-pool-arrow {
    opacity: 1;
    animation: matchPoolArrowNudge .8s ease-in-out infinite;
}

@keyframes matchPoolArrowNudge {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(4px); }
}

.match-pool {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: .5rem;
    padding: .7rem;
    background: rgba(var(--colour-label-rgb), .05);
    border: 2px dashed var(--colour-border);
    border-radius: var(--radius-lg);
    min-height: 3rem;
    transition: border-color .15s, background .15s;
}

.match-pool.needs-pick {
    border-color: var(--colour-ui-primary);
    border-style: solid;
    background: rgba(var(--colour-ui-primary-rgb), .06);
    animation: matchPoolPulse 1.1s ease-in-out infinite;
}

@keyframes matchPoolPulse {
    0%, 100% { box-shadow: var(--glow-match-pool-weak); }
    50% { box-shadow: var(--glow-match-pool-strong); }
}

.match-chip {
    padding: .4rem .8rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--colour-border);
    background: rgba(var(--colour-label-rgb), .06);
    color: var(--colour-text);
    font-family: var(--font-body);
    font-size: .78rem;
    cursor: pointer;
    transition: border-color .15s, background .15s, box-shadow .15s;
}

.match-chip:hover:not(:disabled) { border-color: rgba(var(--colour-ui-primary-rgb), .5); }

.match-chip:disabled:not(.correct):not(.wrong) { opacity: .35; cursor: default; }

.order-chip { display: flex; align-items: center; width: 100%; text-align: left; padding: .35rem .5rem; white-space: nowrap; }
.order-num {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 1.6em; height: 1.6em; margin-right: .5em; flex: none;
    border-radius: 50%; border: 1px dashed var(--colour-border);
    font-size: .78em; font-weight: 700; color: var(--colour-label);
    vertical-align: middle;
}
.order-num.set { background: var(--colour-ui-primary); border: 1px solid transparent; color: #fff; }

.match-chip.picked {
    border-color: var(--colour-ui-primary);
    background: rgba(var(--colour-ui-primary-rgb), .12);
    box-shadow: 0 0 8px rgba(var(--colour-ui-primary-rgb), .3);
}

:root[data-theme="light"] .match-chip.picked { box-shadow: none; }

.match-chip.correct {
    border-color: var(--colour-ui-correct);
    background: rgba(var(--colour-ui-correct-rgb), .1);
    color: var(--colour-ui-correct);
    cursor: default;
}

.match-chip.wrong {
    border-color: var(--colour-ui-wrong);
    background: rgba(var(--colour-ui-wrong-rgb), .1);
    color: var(--colour-ui-wrong);
    cursor: default;
}

/* Checked with nothing placed: dashed outline marks "unassigned", on top of
   the .wrong colours (match chips/placeholders, bits/truth cells, fill slots). */
.match-chip.unassigned { border-style: dashed; font-style: italic; font-size: .72rem; padding-inline: .35rem; overflow-wrap: anywhere; }
.bits-cell.unassigned { font-weight: 400; }
.unassigned { outline: 1px dashed var(--colour-ui-wrong); outline-offset: -3px; }
.match-chip.unassigned { outline: none; }

.match-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .8rem;
}

.match-column {
    min-width: 0;
    border: 2px solid var(--colour-border);
    border-radius: var(--radius-lg);
    padding: .6rem;
    min-height: 8rem;
    background: rgba(var(--colour-label-rgb), .04);
    cursor: pointer;
    transition: border-color .15s, background .15s;
}

.match-col-arrow {
    text-align: center;
    font-size: 1rem;
    line-height: 1rem;
    height: 1rem;
    color: var(--colour-ui-primary);
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
}

.match-column.droppable .match-col-arrow {
    opacity: 1;
    animation: matchArrowBounce .8s ease-in-out infinite;
}

@keyframes matchArrowBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}

.match-col-title {
    font-family: var(--font-display);
    font-size: .68rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--colour-label);
    margin-bottom: .5rem;
    text-align: center;
    padding: .35rem .5rem;
    border: 1px solid var(--colour-border);
    border-radius: var(--radius-sm);
    transition: border-color .15s, background .15s, box-shadow .15s, color .15s;
}

.match-column.droppable .match-col-title {
    border-color: var(--colour-ui-primary);
    background: rgba(var(--colour-ui-primary-rgb), .12);
    color: var(--colour-ui-primary);
    animation: matchTitlePulse 1.1s ease-in-out infinite;
}

@keyframes matchTitlePulse {
    0%, 100% { box-shadow: var(--glow-match-title-weak); }
    50% { box-shadow: var(--glow-match-title-strong); }
}

.match-col-items {
    display: flex;
    flex-direction: column;
    gap: .4rem;
    min-height: 2rem;
    min-width: 0;
}

.match-col-items .match-chip { width: 100%; min-width: 0; text-align: left; }

/* Match-chip variant for shape pool items (an SVG icon chip needs less
   padding around it than a text label does) — was duplicated verbatim in
   digital_knowledge_logic_gates.html and digital_review_quiz_1_part1.html
   before being centralised here. */
.match-chip-shape { padding: .15rem .3rem; }
.match-col-items .match-chip-shape { width: auto; margin: 0 auto; }

.shape-cell-text {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 72px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: .92rem;
    letter-spacing: .03em;
    color: var(--colour-text);
    text-align: center;
    padding: .3rem;
    overflow-wrap: break-word;
    word-break: break-word;
    hyphens: auto;
}

.shape-cell.selected .shape-cell-text { color: var(--colour-ui-primary); }

.shape-cell.correct .shape-cell-text { color: var(--colour-ui-correct); }

.shape-cell.wrong .shape-cell-text { color: var(--colour-ui-wrong); }

.shape-cell.missed .shape-cell-text { color: var(--colour-ui-restart); }

/* ── Mock datasheet excerpt — an ORIGINAL, fictionally-branded panel styled
   like a generic manufacturer datasheet (header + package/pinout diagrams +
   legend), used where a question wants students to read a pinout from a
   reference rather than being told it directly. Not a copy of any real
   manufacturer's document — the tabular "ratings/characteristics" layout
   this mimics is an industry-wide, functional convention, not one company's
   protected expression. ── */
.mock-datasheet {
    font-weight: normal;
    font-size: .72rem;
    line-height: 1.5;
    text-transform: none;
    letter-spacing: normal;
    color: var(--colour-text);
    background: var(--colour-panel);
    border: 1px solid var(--colour-ui-primary);
    border-radius: var(--radius-lg);
    padding: .8rem 1rem;
    margin-top: .75rem;
}

.mock-datasheet-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: .3rem .8rem;
    border-bottom: 1px solid var(--colour-ui-primary);
    padding-bottom: .4rem;
    margin-bottom: .6rem;
}

.mock-datasheet-brand {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--colour-text-strong);
    font-size: .78rem;
}

.mock-datasheet-partno {
    font-family: var(--font-mono);
    font-size: .66rem;
    color: var(--colour-label);
}

.mock-datasheet-diagrams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .6rem;
    align-items: start;
    margin-bottom: .6rem;
}

.mock-datasheet-diagram-col { min-width: 0; text-align: center; }

.mock-datasheet-diagram-col svg { display: block; margin: 0 auto; }

.mock-datasheet-caption {
    font-size: .6rem;
    color: var(--colour-label);
    margin-top: .3rem;
    text-transform: uppercase;
    letter-spacing: .04em;
}

.mock-datasheet-legend { font-size: .68rem; }

.site-copyright {
    margin: 3rem auto 1.5rem;
    padding: 0 1rem;
    text-align: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.7rem;
    color: var(--colour-label);
    opacity: 0.8;
}

.site-copyright a {
    color: inherit;
    text-decoration: underline;
}

.theme-toggle {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .45rem .9rem;
    font-family: var(--font-body);
    font-size: .8rem;
    font-weight: 600;
    line-height: 1;
    background: var(--colour-panel);
    border: 1px solid var(--colour-border);
    border-radius: 10px;
    color: var(--colour-text-strong);
    cursor: pointer;
    box-shadow: var(--shadow-card);
    transition: border-color .15s, box-shadow .15s;
}

.theme-toggle:hover { border-color: var(--colour-ui-primary); }

/* Fallback ONLY for pages with no #crumb to sit inline next to — position
   is all this needs to override now that the button sizes itself from
   its own padding/content rather than a fixed circle diameter. */
.theme-toggle.theme-toggle-fixed {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 500;
}

/* Each state (sun+"Light Mode", moon+"Dark Mode") is one element so the
   icon and its label move as a unit — shows the mode you'd SWITCH TO,
   not the current one. */
.theme-toggle-state { display: inline-flex; align-items: center; gap: .4rem; }
.theme-toggle-icon { font-size: 1.1rem; line-height: 1; }

.theme-toggle-state-moon { display: none; }

:root[data-theme="light"] .theme-toggle-state-sun { display: none; }

:root[data-theme="light"] .theme-toggle-state-moon { display: inline-flex; }

@media (min-width: 900px) {
  .quiz-wrap { display: grid; grid-template-columns: minmax(340px, 52%) 1fr; gap: 1.2rem; align-items: start; }
  .circuit-col { order: 0; position: sticky; top: 1.5rem; }
  .questions-col { order: 0; min-width: 0; }
  .questions-col .card { padding: 1rem 1.1rem; }
  .questions-col .option-btn { padding: .5rem .7rem; font-size: .76rem; }
  .questions-col .q-text { font-size: .86rem; }
  .questions-col .result-banner { font-size: .72rem; padding: .5rem .8rem; }
  .questions-col .btn { font-size: .64rem; }
  .questions-col .working-box { padding: .85rem 1rem; }
  .questions-col .options { gap: .4rem; }
  /* leftPanel:'none' questions collapse to a single centred column */
  .quiz-wrap.single-col { grid-template-columns: 1fr; }
  .quiz-wrap.single-col .questions-col { max-width: 700px; margin: 0 auto; width: 100%; }

  /* When a page HAS a .mode-toggle as a DIRECT CHILD of .quiz-wrap (a
     sibling of circuit-col/questions-col, NOT nested inside circuit-col —
     see coupling_circuit_analysis.html), give it its own row above
     circuit-col in the left column, with questions-col spanning both rows
     on the right. The child combinator (:has(> .mode-toggle), not the
     bare descendant :has(.mode-toggle)) matters here: several older
     quizzes (bjt_npn_voltage_divider.html and its siblings in
     bjt/biasing_circuits/, plus a couple of the reviews/ worksheets)
     already have a .mode-toggle, but nested INSIDE circuit-col, same
     structure this file used to have before being restructured for this
     exact reason. grid-area only affects DIRECT grid items, so on those
     pages a nested .mode-toggle contributes nothing to the "mode" area —
     with the bare descendant selector, :has() would still match (it looks
     at descendants, not just children), defining the extra row/area
     anyway with nothing placed in it, leaving an empty gap above their
     circuit diagram. The child combinator makes this rule apply ONLY to
     pages actually restructured to match (right now just this one) —
     every other quiz-wrap, mode-toggle or not, is completely unaffected.
     The three grid-area assignments themselves are ALSO scoped inside
     this same :has() block, not applied unconditionally — a distinct
     custom-ident grid-area on several different elements implicitly
     defines its own named grid line pair even with no grid-template-areas
     to match against, and it turns out (verified: caused a real 2-column
     -> 4-column-with-two-0px-phantom-columns regression on the OLD-pattern
     pages before this was scoped) that's NOT a safe no-op the way
     "falls back to auto placement" made it sound like it should be. */
  .quiz-wrap:has(> .mode-toggle) {
    grid-template-areas: "mode questions" "circuit questions";
    /* min-content pins the mode row to the toggle's own height. Without it the tall
       questions-col, which spans both rows, spreads its extra height across BOTH auto
       rows, pushing the circuit down and leaving its sticky travel almost nothing to
       move in. 1fr gives the circuit row all the remaining height, so the circuit
       stays in view beside the worked solution as the page scrolls. */
    grid-template-rows: min-content 1fr;
  }
  .quiz-wrap:has(> .mode-toggle) > .circuit-col { grid-area: circuit; }
  .quiz-wrap:has(> .mode-toggle) > .questions-col { grid-area: questions; }
  .quiz-wrap:has(> .mode-toggle) > .mode-toggle { grid-area: mode; }
}

/* ══════════════════════════════════════════════════════════════════════
   Waveform builder — shared with assets/waveform-builder.js. First used
   by UEEEC0069/exercises/digital_flip_flop_diagram.html (SR-latch Q
   construction); S/R/Q colours reuse the existing input-A/input-B/output-Z
   convention from the truth-table/logic-gate files.
   ══════════════════════════════════════════════════════════════════════ */
.wb-track-row { display: flex; align-items: center; gap: .7rem; margin-bottom: .5rem; }
.wb-track-row:last-child { margin-bottom: 0; }
.wb-track-label {
  width: 1.4rem; flex: none; text-align: center; font-weight: 700;
  font-size: .95rem; color: var(--colour-text-strong);
}
.wb-track-row svg { flex: 1; min-width: 0; width: 100%; height: auto; display: block; overflow: visible; }

.wb-grid-line { stroke: rgba(var(--colour-label-rgb), .18); stroke-width: 1; }
.wb-grid-baseline { stroke: rgba(var(--colour-label-rgb), .4); }

.wb-track-path { fill: none; stroke-width: 2; stroke-linejoin: round; }
.wb-track-path.wb-track-s { stroke: var(--colour-input-a); }
.wb-track-path.wb-track-r { stroke: var(--colour-input-b); }
.wb-track-path.wb-track-p { stroke: var(--colour-jfet); }
.wb-track-path.wb-track-c { stroke: var(--colour-bjt); }
.wb-track-path.wb-track-clk { stroke: var(--colour-switch); }
.wb-track-path.wb-track-d { stroke: var(--colour-input-a); }

.wb-progress-shade { fill: var(--colour-ui-primary); opacity: .1; }
.wb-q-path { fill: none; stroke-width: 2; stroke-linejoin: round; }
.wb-q-path.wb-col-building { stroke: var(--colour-output-z); }
.wb-q-path.wb-col-correct { stroke: var(--colour-ui-correct); }
.wb-q-path.wb-col-wrong { stroke: var(--colour-ui-wrong); }

.wb-palette { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
.wb-piece-btn {
  display: flex; flex-direction: column; align-items: center; gap: .15rem;
  background: rgba(var(--colour-label-rgb), .08);
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-lg);
  padding: .45rem .6rem;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.wb-piece-btn:hover:not(:disabled) { border-color: var(--colour-ui-primary); background: rgba(var(--colour-ui-primary-rgb), .12); }
.wb-piece-btn:disabled { opacity: .3; cursor: default; }
.wb-piece-icon { width: 40px; height: 28px; overflow: visible; }
.wb-piece-icon line, .wb-piece-icon polyline {
  fill: none; stroke: var(--colour-output-z); stroke-width: 2.5;
  stroke-linecap: round; stroke-linejoin: round;
}
.wb-piece-label { font-size: .62rem; letter-spacing: .04em; color: var(--colour-label); text-transform: uppercase; }

@media (max-width: 480px) {
  .wb-track-label { width: 1.1rem; font-size: .8rem; }
  .wb-piece-btn { padding: .35rem .45rem; }
  .wb-piece-icon { width: 32px; height: 24px; }
}

/* ══════════════════════════════════════════════════════════════════════
   Print Worksheet — see quiz-engine.js's own buildPrintWorksheet() for
   the JS half (opt-in: a page adds a #printWorksheet div as a DIRECT
   CHILD of <body>, plus a "Print Worksheet" button calling
   buildPrintWorksheet() then window.print()). First used by
   coupling/basics/coupling_circuit_analysis.html.

   .print-only is invisible on screen and shown ONLY in print (or Print
   Preview) — the reverse of quiz-common.css's usual classes. On screen,
   #printWorksheet just sits there empty/hidden; nothing about it is
   visible until printing actually happens.
   ══════════════════════════════════════════════════════════════════════ */
.print-only { display: none; }

@media print {
  @page { margin: 1.5cm; }

  /* Force light/white regardless of whichever theme is active on screen
     — printing the dark theme's near-black background under white text
     would waste ink and (worse) print pages of near-invisible text if a
     printer/PDF renderer drops the background fill. Only the STRUCTURAL
     variables are forced; the semantic accent colours (colour-voltage,
     colour-resistor, colour-gain, etc) are left as whichever theme is
     active — both this project's light AND dark accent palettes are
     vivid/mid-saturation, not pale, so either reads fine on white paper
     without needing every single accent variable duplicated here too. */
  :root {
    --colour-bg: #ffffff;
    --colour-panel: #ffffff;
    --colour-text: #000000;
    --colour-text-strong: #000000;
    --colour-border: #999999;
    --colour-label: #444444;
  }

  /* #printWorksheet must be a direct child of <body> (see quiz-engine.js's
     own comment on buildPrintWorksheet()) — this hides every OTHER direct
     child (header, breadcrumb, theme toggle, the whole interactive
     .quiz-wrap, the zoom modal, everything) in one rule, so no page needs
     to hand-tag its own interactive chrome with a .no-print class. */
  body > *:not(#printWorksheet) { display: none !important; }
  body { background: #fff; }

  #printWorksheet {
    display: block !important;
    color: #000;
    font-family: var(--font-mono, 'Share Tech Mono', monospace);
  }
  #printWorksheet h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
  #printWorksheet .print-subtitle { font-size: .8rem; color: #444; margin-bottom: 1rem; }

  #printWorksheet .print-circuit { margin-bottom: 1.5rem; }
  #printWorksheet .print-circuit-label { font-weight: bold; font-size: .8rem; margin-bottom: .3rem; }
  #printWorksheet .print-circuit svg { width: 100%; height: auto; max-height: 9cm; }
  #printWorksheet .print-question .print-circuit { margin: .4rem 0 .4rem 1rem; }
  #printWorksheet .print-question .print-circuit svg { width: 9cm; max-width: 100%; max-height: 5cm; }

  #printWorksheet .print-question { margin-bottom: 1rem; page-break-inside: avoid; font-size: .9rem; }
  #printWorksheet .print-qnum { font-weight: bold; }
  #printWorksheet .print-options { margin: .3rem 0 0 1.5rem; }
  /* Blank ruled lines, not multiple-choice options — the printed
     worksheet is for working the calculation out on paper, not picking
     an answer (that's what the on-screen quiz is for). Same count and
     roughly the same height as the on-screen options they replace (one
     line + margin each), so a question that had 4 options still gets
     roughly the same amount of writing space it always did. */
  #printWorksheet .print-blank-line { height: 1.1rem; margin-bottom: .25rem; border-bottom: 1px solid #999; max-width: 500px; }

  /* Answer areas generated by printAnswerArea() in quiz-engine.js */
  #printWorksheet .print-choices { margin: .35rem 0 0 1rem; }
  #printWorksheet .print-choice { margin: .2rem 0; }
  #printWorksheet .print-box { display: inline-block; width: .8rem; height: .8rem; border: 1px solid #000; margin-right: .4rem; vertical-align: -.1rem; }
  #printWorksheet .print-shape { width: 2.6cm; height: 1.8cm; vertical-align: middle; }
  #printWorksheet .print-table { border-collapse: collapse; margin: .4rem 0 0 1rem; }
  #printWorksheet .print-table th, #printWorksheet .print-table td { border: 1px solid #000; padding: .25rem .6rem; text-align: center; min-width: 1.6rem; }
  #printWorksheet .print-cell { min-width: 2.2rem; height: 1.2rem; }
  #printWorksheet .print-tall { height: 4cm; min-width: 3cm; }
  #printWorksheet .print-pool { margin: .4rem 0 .4rem 1rem; display: flex; flex-wrap: wrap; gap: .4rem; }
  #printWorksheet .print-term { border: 1px solid #000; border-radius: 4px; padding: .15rem .5rem; }
  #printWorksheet .print-slots { margin: .4rem 0 0 1rem; display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; }
  #printWorksheet .print-blank-inline { display: inline-block; width: 3cm; border-bottom: 1px solid #000; }

  /* Answer key starts on its own fresh page when printed double-sided or handed out
     separately. */
  #printWorksheet .print-answers { page-break-before: always; }
  #printWorksheet .print-answers h2 { font-size: 1.1rem; margin-bottom: 1rem; }
  #printWorksheet .print-answer { margin-bottom: 1.1rem; page-break-inside: avoid; font-size: .85rem; }
  #printWorksheet .print-correct { font-weight: bold; }
  #printWorksheet .print-working { margin-top: .3rem; }
  #printWorksheet .answer-key-title { font-weight: bold; margin-top: .3rem; }
  #printWorksheet .answer-key { margin: .1rem 0 .3rem 1.3rem; }

  /* working-box/working-frac etc are the SAME classes the interactive
     working-solution HTML already uses (correctExplain()/working() are
     literally the same functions) — carry just enough of their styling
     into print so stacked fractions/formula rows/etc still render
     legibly instead of falling back to unstyled inline text. */
  #printWorksheet .working-frac { display: inline-flex; flex-direction: column; text-align: center; vertical-align: middle; margin: 0 .2rem; }
  #printWorksheet .working-frac .num { border-bottom: 1px solid #000; padding: 0 .2rem; }
  #printWorksheet .working-frac .den { padding: 0 .2rem; }
  #printWorksheet .working-sqrt { display: inline-flex; vertical-align: middle; }
  #printWorksheet .working-sqrt .sqrt-body { border-top: 1px solid #000; padding: 0 .2rem; }
  #printWorksheet .working-formula-row, #printWorksheet .working-line, #printWorksheet .working-step, #printWorksheet .working-total { margin: .2rem 0; }

  /* waveform-builder.js's own buildPrintDiagram() (digital_dtype_preset_
     clear_diagram.html, digital_flip_flop_nor_nand.html, etc) — the
     description block reuses whatever page-local class the source element
     had (e.g. .rule-card), so its own rule-row/legend-row CSS already
     applies unmodified; only the diagram layout itself is new here. */
  #printWorksheet .print-description { margin-bottom: 1.2rem; }
  #printWorksheet .print-diagram-section { page-break-inside: avoid; }
  /* Second copy of the tracks (the answer key) starts on its own fresh
     page — same detachable-section pattern as .print-answers
     above. */
  #printWorksheet .print-solution { page-break-before: always; }
  #printWorksheet .print-solution h2 { font-size: 1.1rem; margin-bottom: .8rem; }
  #printWorksheet .print-wave-row svg { width: 100%; height: auto; display: block; }
  #printWorksheet .wb-track-label { color: #000; }
  #printWorksheet .wb-grid-line { stroke: #999; }
}

/* ══════════════════════════════════════════════════════════════════════
   Resistor-network worked solutions (resistor quizzes + total-resistance
   walkthroughs): step labels, labelled formula rows, stacked fractions and
   the group colour classes .c1…c5 (R1,2,3 / R5,6,7 …), .cs series, .cv
   voltage, .cr result, .ct total. Scoped to .working-box so other pages' own
   .step-label etc. are unaffected.
   ══════════════════════════════════════════════════════════════════════ */
.working-box .step-label { font-family: 'Orbitron', sans-serif; font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 1rem 0 .5rem; padding-bottom: .3rem; border-bottom: 1px solid var(--colour-border); }
.working-box .step-label:first-of-type { margin-top: 0; }
.working-box .wline { font-size: .8rem; line-height: 1.7; }
.working-box .wline.total { margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--colour-border); font-size: .85rem; }
.working-box .wlabel { font-size: .72rem; color: var(--colour-label); margin: .5rem 0 .1rem; }
.working-box .formula-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1; padding: .5rem 0; font-size: .82rem; }
.working-box .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 4px; }
.working-box .frac .num { border-bottom: 1.5px solid currentColor; padding: 0 6px 2px; text-align: center; width: 100%; }
.working-box .frac .den { padding: 2px 6px 0; text-align: center; width: 100%; }
.working-box .c1 { color: var(--colour-resistor-combo1); }
.working-box .c2 { color: var(--colour-resistor-combo2); }
.working-box .c3 { color: var(--colour-resistor-combo3); }
.working-box .c4 { color: var(--colour-resistor-combo4); }
.working-box .c5 { color: var(--colour-resistor-combo5); }
.working-box .cs { color: var(--colour-series); }
.working-box .cv { color: var(--colour-red); }
.working-box .cr { color: var(--colour-ui-correct); }
.working-box .ct { color: var(--colour-resistor-total); }
