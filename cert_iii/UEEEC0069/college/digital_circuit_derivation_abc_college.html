.summary-values { border: 1px solid var(--colour-border); border-radius: 4px; padding: .8rem 1rem; margin-bottom: 1.2rem; font-size: .82rem; line-height: 2.1; }
.hint-help-btn { display: inline-block; margin-top: .6rem; padding: .45rem .9rem; font-family: 'Share Tech Mono', monospace; font-size: .9rem; font-weight: bold; color: var(--colour-ui-primary); background: rgba(var(--colour-ui-primary-rgb), .08); border: 1px solid var(--colour-ui-primary); border-radius: 4px; cursor: pointer; transition: background .15s, color .15s; }
.hint-help-btn:hover { background: rgba(var(--colour-ui-primary-rgb), .18); color: var(--colour-ui-correct); }

/* ══════════════════════════════════════════════════════════════════════
   Meter ghosts — the up/down arrow and delta beside a meter or ammeter in the fault
   simulators and fault-finding quizzes. Pages only choose the class (ghost-up or
   ghost-down on the <text>); colours, weight and sizes all live here so every page matches.
   Markup: <text class="ghost-text ghost-up"><tspan class="ghost-arrow">⬆</tspan>
           <tspan class="ghost-delta">+0.62V</tspan></text>
   ══════════════════════════════════════════════════════════════════════ */
.ghost-text { font-weight: 700; font-family: 'Share Tech Mono', monospace; }
.ghost-up { fill: var(--colour-ghost-up); }
.ghost-down { fill: var(--colour-ghost-down); }
.ghost-arrow { font-size: 18px; }
.ghost-delta { font-size: 13px; }


    /* Dedicated per-file tokens for the A/B/C input signals — their own
       label text AND the wire segment running straight from that label
       to the first gate it feeds. Deliberately NOT reusing
       --colour-ideal/--colour-current (quiz-common.css's shared tokens,
       meant for other quiz types' own unrelated ideal-vs-actual/current
       diagrams) — --colour-current is literally identical to
       --colour-ui-correct in light theme (#16a34a both), and
       --colour-ideal is identical to --colour-ui-summary in both themes,
       so either one silently doubles as an existing UI-state colour
       instead of a signal identity of its own. Chosen to sit in the gaps
       between every hue already claimed on this page (cyan/blue =
       primary+wires, green = correct, red/pink = wrong, orange = restart
       + gate symbols, amber/gold = signal/Z, purple = summary): indigo,
       teal, and lime. */
    .progress-wrap { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; }
    /* Standard weight — a plain single-variable NOT bar, not deliberately
       thinned. The NAND-vs-plain-NOT distinction is carried by
       .ovl-outer/.ovl-outer2 being thicker than this (below), not by
       this being thinner than normal. */
    .ovl { text-decoration: overline; text-decoration-thickness: .09em; }
    /* Same bar, thickened — used everywhere sym() builds a single-variable
       NOT (Q2 onward: G1/G2/Z/step1/step2's pool chips, circuit boxes, and
       correctExplain banners), never for Q1's own SLOT_POOL bars (already
       fine at .ovl's own thickness, left untouched). User found the plain
       .ovl weight hard to read at a glance on a phone specifically in
       these more crowded, multi-tier boxes. */
    .ovl-thick { text-decoration: overline; text-decoration-thickness: .16em; }
    /* A raised, second overline over an already-negated sub-expression —
       used in pool chips, the correctExplain banner, and the
       foreignObject answer boxes on the circuit, ALL confirmed clean.
       Deliberately NOT used in any wrapping/multi-line prose (working
       panels, question prompts) — isolated with a standalone test page
       (kept in scratchpad) that ANY box-generating inline element here
       (border-top, box-shadow, background-image, even bare
       display:inline-block with no visible styling at all) causes a real
       Chromium rendering bug: an unrelated word earlier in the SAME
       wrapping paragraph — nowhere near the span itself — picks up a
       phantom underline, specifically right at that line's wrap point.
       ::before + position:absolute (this rule) doesn't dodge it either;
       every technique tried produced the same artifact. Prose that needs
       to show this double-negation instead uses the word "NOT (...)" and
       points at "the box above" rather than re-rendering the bar inline —
       see Q2/Q3/Q4's working text and Q5's question prompt. */
    /* padding-top:4px LOOKED separated in isolated testing earlier this
       session but turned out to visually merge into one bar on the real
       page — measured via getBoundingClientRect() that the outer bar and
       the inner .ovl text sat only ~1.7px apart despite the 4px padding
       being correctly applied (confirmed via getComputedStyle, not
       assumed). Re-isolated with a dedicated padding-top comparison test
       (4px/8px/12px side by side, kept in scratchpad) rather than
       tweaking the live file blind — 4px and 8px were both still
       ambiguous at this font-size, 12px was the first value that read as
       unmistakably two separate lines rather than one thick-ish one. */
    /* Real bug, iPhone Safari AND iOS Chrome (same WebKit engine under
       the hood) — reported by the user with a screenshot: any circuit
       answer box whose selected option used this raised bar rendered its
       ENTIRE value giant and displaced well outside its own box, while
       identical content in the (non-flex, not-in-a-foreignObject) pool
       chips was always fine. This rule used to be
       `position:relative` + a `content:''` `::before` pseudo-element with
       `position:absolute` to draw the bar — the ONLY place in the whole
       file combining position:relative/absolute with content living
       inside a foreignObject AND as a direct child of a flex container
       (.circuit-answer-html). Both are separately known categories of
       WebKit foreignObject bug (this session already found two others:
       percentage sizing, and dominant-baseline centring). Rather than
       guess which exact combination triggers it, removed the whole
       position:absolute pattern — a plain `border-top` directly on the
       element itself draws an identical line at the very top of the
       padding box with no `position` property involved at all. This is
       the SAME technique the Chromium wrapping-prose phantom-underline
       bug (see .ovl-thick's comment above) ruled out earlier in the
       session — but that bug was specifically about wrapping multi-line
       prose, a context .ovl-outer/.ovl-outer2 are deliberately never
       used in, so it doesn't apply here. */
    .ovl-outer { display: inline-block; padding-top: 12px; border-top: 3px solid currentColor; line-height: 1; }
    /* A THIRD tier, for when an expression that already carries its own
       .ovl-outer bar (e.g. G1's own answer) gets wrapped in yet another
       NOT on top of that (Q4, once G1/G2 are substituted back in as
       their real answers rather than shown as bare symbols). SAME
       padding-top as .ovl-outer (not more) — each tier's bar sits at the
       very top of its OWN box, so the gap to the tier immediately below
       is just that tier's own padding-top, full stop; it doesn't need to
       additionally account for how tall the nested tier below it turns
       out to be (that box starts fresh right where this padding ends,
       and ITS bar is drawn at ITS OWN top). Matching the two values is
       what keeps the 3rd-to-2nd gap the same size as the 2nd-to-1st gap
       — deliberately equal spacing, not "however much clearance the
       inner stack happens to need". Same 3px thickness as .ovl-outer too
       — both tiers are "a NAND's own bar", just at different heights
       when one wraps the other; the thickness contrast that matters is
       NAND-bar vs plain-NOT-bar, not tier vs tier. */
    .ovl-outer2 { display: inline-block; padding-top: 12px; border-top: 3px solid currentColor; line-height: 1; }
    /* padding-top is a fixed px value, not em-relative, so the SAME 12px
       reads as generously spaced next to the pool chips' own small
       (~12.5px) font but visibly cramped inside the circuit's own answer
       boxes, whose font grew to 28px in a later round (12px is a much
       smaller fraction of a bigger letter). Scoped here rather than
       changed on the shared base rule above — the pool/prose spacing is
       already correct at 12px and shouldn't move. Measured via
       getBoundingClientRect(), not guessed: at equal padding-top values
       the gap ABOVE .ovl-outer2 (governed by .ovl-outer2's own
       padding-top) consistently rendered ~1.1px larger than the gap
       above .ovl-outer (governed by .ovl-outer's own padding-top) at
       every value tried — a small, constant rendering asymmetry, not
       proportional noise — so the two values below are deliberately NOT
       equal; 22/20 was the pair that measured genuinely identical gaps
       (11.25px each), not just close. */
    .circuit-answer-html .ovl-outer { padding-top: 22px; }
    .circuit-answer-html .ovl-outer2 { padding-top: 20px; }
    /* Single-column throughout — the circuit lives inside the question
       card itself (see body markup), not a separate side panel. */
    .circuit-row { display: flex; align-items: center; gap: .5rem; }
    .circuit-panel {
      flex: 1;
      max-width: 660px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid var(--colour-ui-primary);
      cursor: default;
    }
    /* quiz-common.css's own light-theme override
       (:root .circuit-panel { border-color: #e2e8f0; })
       has higher specificity than a plain .circuit-panel rule and silently
       wins in light theme otherwise — matching specificity here, later in
       the cascade, wins it back so the border is the real
       --colour-ui-primary blue, not a pale wash. */
    :root .circuit-panel { border-color: var(--colour-ui-primary); }
    /* Back to the shared width:100% (no fixed pixel width, no
       overflow-x:auto) now that the circuit's own viewBox is cropped
       tightly to its actual content (getBBox() measured, not guessed) —
       the earlier fixed-900px-+ horizontal-scroll approach existed only
       to compensate for a viewBox with a lot of unused canvas around a
       small drawing; a tight viewBox scales up cleanly on its own. */
    .circuit-panel svg { margin: 0 auto; }
    /* No static box-shadow on the base rule — options-box has none in its
       own idle state either. The glow exists only inside the pulse
       animation below, matching options-box's "no shadow until active"
       pattern. NOT reusing matchPoolPulse itself — its
       --glow-match-pool-weak/strong variables are deliberately "none" in
       light theme (options-box's own light-theme cue is its dashed→solid
       border switch instead), but this panel's border is already
       always-solid-blue with no such switch to fall back on, so building
       the pulse straight from --colour-ui-primary-rgb (a real value in
       both themes) keeps it visible in both. */
    @keyframes circuitPanelPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(var(--colour-ui-primary-rgb), .12); }
      50% { box-shadow: 0 0 0 7px rgba(var(--colour-ui-primary-rgb), .35); }
    }
    .circuit-panel.needs-pick { animation: circuitPanelPulse 1.1s ease-in-out infinite; }
    /* Left of the box, same side as .fill-pool-arrow, so the flashing cue
       always appears in the same place regardless of which box (pool or
       circuit) it's currently pointing at. */
    .circuit-arrow {
      flex: 0 0 auto;
      font-size: 1rem;
      color: var(--colour-ui-primary);
      opacity: 0;
      transition: opacity .15s;
    }
    .circuit-arrow.needs-pick {
      opacity: 1;
      animation: fillArrowBounce .8s ease-in-out infinite;
    }
    /* Highlighted box around the MC options (Q5 only now) — plain/dashed
       normally, solid blue + pulsing while no option is picked yet. The
       .fill-pool box below reuses this exact same treatment for the
       Q1-Q4 chip pool. */
    .options-box {
      padding: .8rem;
      border: 2px dashed var(--colour-border);
      border-radius: var(--radius-lg);
      background: rgba(var(--colour-label-rgb), .05);
      transition: border-color .15s, background .15s;
    }
    .options-box.needs-pick {
      border-color: var(--colour-ui-primary);
      border-style: solid;
      background: rgba(var(--colour-ui-primary-rgb), .06);
      animation: matchPoolPulse 1.1s ease-in-out infinite;
    }
    .fill-pool-wrap { margin-top: .8rem; }
    .fill-pool-row { display: flex; align-items: center; gap: .5rem; }
    .fill-pool-arrow { font-size: 1rem; color: var(--colour-ui-primary); opacity: 0; transition: opacity .15s; }
    .fill-pool-row.needs-pick .fill-pool-arrow { opacity: 1; animation: fillArrowBounce .8s ease-in-out infinite; }
    @keyframes fillArrowBounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    .fill-pool {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: .5rem;
      padding: .8rem;
      border: 2px dashed var(--colour-border);
      border-radius: var(--radius-lg);
      background: rgba(var(--colour-label-rgb), .05);
      min-height: 3rem;
      transition: border-color .15s, background .15s;
    }
    .fill-pool.needs-pick {
      border-color: var(--colour-ui-primary);
      border-style: solid;
      background: rgba(var(--colour-ui-primary-rgb), .06);
      animation: matchPoolPulse 1.1s ease-in-out infinite;
    }
    /* Pool chips are often single letters (A/B, negated via overline, not
       extra characters) so they'd otherwise all size to the same cramped
       ~36px — double that and centre the label in the extra space. Long
       expression chips (Q2-Q4) simply exceed this min-width naturally. */
    .fill-pool .match-chip { min-width: 72px; text-align: center; }
    /* Solid (not translucent) fill is deliberate: these boxes sit directly
       on top of a wire, and a see-through fill let the wire visually cross
       right through the text sitting on top of it. An opaque panel-
       coloured patch cleanly masks the wire behind the label. */
    .circuit-slot-box { fill: var(--colour-panel); stroke: var(--colour-ui-primary); stroke-width: 1.5px; stroke-dasharray: 4,3; cursor: pointer; }
    .circuit-slot-box.filled { stroke-dasharray: none; }
    /* Fill stays the same opaque --colour-panel for .correct/.wrong too —
       a translucent tint let the wire underneath show straight through
       the box as a strikethrough line across the text. Correctness is
       carried entirely by the (now solid, undashed) stroke colour and the
       text colour instead. */
    .circuit-slot-box.correct { stroke: var(--colour-ui-correct); }
    .circuit-slot-box.wrong { stroke: #ff3d66; }
    /* Locked-in (checked) boxes are no longer clickable — slotClicked()
       already no-ops once st.ans is true, so the pointer cursor shouldn't
       keep implying they're interactive. */
    .circuit-slot-box.correct, .circuit-slot-box.wrong { cursor: default; }
    /* Same idea as .circuit-slot-box, just sized for a full expression
       instead of a single letter. */
    .circuit-answer-box { fill: var(--colour-panel); stroke: var(--colour-ui-primary); stroke-width: 2px; stroke-dasharray: 6,4; cursor: pointer; }
    .circuit-answer-box.filled { stroke-dasharray: none; }
    .circuit-answer-box.correct { stroke: var(--colour-ui-correct); }
    .circuit-answer-box.wrong { stroke: #ff3d66; }
    .circuit-answer-box.correct, .circuit-answer-box.wrong { cursor: default; }
    /* Once a fill question is no longer the one being asked (answered AND
       the quiz has moved on), its box drops the border/background and
       leaves just the plain coloured text sitting on the wire — the box
       chrome only matters while a question is still asking for input.
       Declared after the .correct/.wrong stroke rules above so it wins
       on source order despite matching specificity; only ever added by
       updateReveal()'s past-question lock branch, never for the current
       question. */
    .circuit-slot-box.plain, .circuit-answer-box.plain { fill: none; stroke: none; }
    /* EVERY fill-question box (Q1's 4 signal slots included) renders via
       <foreignObject> + this HTML class, not native SVG <text> — Q1
       started out on native <text>/dominant-baseline:middle, but that
       centred negated ("NOT A"-style, with a text-decoration overline)
       and plain letters inconsistently on iOS Safari specifically (the
       overline sat noticeably higher than a plain letter in the same
       size box). Flexbox align-items:center in an ordinary HTML div
       doesn't have that baseline-metric quirk, so Q1 moved onto the same
       mechanism the other boxes already used for their multi-tier
       overlines. See .ovl-outer / .ovl-outer2 below for those. */
    /* width/height deliberately NOT 100% — iOS Safari doesn't reliably
       resolve percentage sizing for a foreignObject's HTML content, which
       showed up as the answer text rendering at native (unscaled) size in
       roughly the wrong place entirely, ignoring the foreignObject's own
       box. Each box sets its own explicit pixel width/height inline
       (matching its own <foreignObject width/height>) instead. */
    .circuit-answer-html {
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-body); font-size: 28px; font-weight: 700;
      color: var(--colour-ui-primary); text-align: center; line-height: 1;
      pointer-events: none;
    }
    .circuit-answer-html.correct { color: var(--colour-ui-correct); }
    .circuit-answer-html.wrong { color: #ff3d66; }
    /* Q1's boxes are smaller (single letter, not a full expression) —
       tuned to its own box size separately from the shared 28px above. */
    .circuit-slot-html { font-size: 30px; }
    /* Optional caption row above the truth table's own group/column
       headers, showing the formula the table is actually verifying — only
       rendered when a kind:'truth' question supplies data.formula(), so
       older/other truth questions without one are unaffected. Local to
       this file since .bits-table itself is shared (quiz-common.css) and
       used by other quiz files that don't have this row at all. */
    .truth-formula-cell {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .03em;
      color: var(--colour-ui-primary);
      background: rgba(var(--colour-ui-primary-rgb), .1);
      border-bottom: 2px solid var(--colour-ui-primary);
    }
  
/*
  NSW TAFE college theme — the single source for the self-contained teacher pages
  (cert_iii/UEEEC0069/college/*_college.html). tools/build_college.py inlines this into
  each generated page, so a college page is the student page's own markup and script
  with this stylesheet instead of assets/quiz-common.css.

  It was lifted from the hand-made college pages (TAFE colour palette, Public Sans,
  .main-wrap / .card-top-bar layout, light and dark themes, print rules) and then
  extended with rules for the classes the shared engines draw with, so the college
  pages no longer need a hand-made copy of the waveform code. To change how the
  college pages look, edit this file and rebuild.
*/

:root {
  --colour-bg: #f8f9fa;
  --colour-panel: #ffffff;
  --colour-border: #d0d5dd;
  --colour-text: #1d2939;
  --colour-text-strong: #002664;
  --colour-label: #475467;
  --colour-label-rgb: 71, 84, 103;
  --colour-grid: rgba(0, 38, 100, 0.04);

  --colour-ui-primary: #002664;
  --colour-ui-primary-rgb: 0, 38, 100;
  --colour-ui-correct: #087443;
  --colour-ui-correct-rgb: 8, 116, 67;
  --colour-ui-wrong: #d92d20;
  --colour-ui-wrong-rgb: 217, 45, 32;

  --colour-input-a: #4338ca;
  --colour-input-b: #0f766e;
  --colour-output-z: #0284c7;

  --colour-dff: #0d80c3;
  --colour-jfet: #7e22ce;
  --colour-bjt: #b45309;
  --colour-switch: #0369a1;

  --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Public Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'Share Tech Mono', monospace, sans-serif;

  --radius-lg: 6px;
  --radius-sm: 4px;
  --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
}

body.dark-theme {
  --colour-bg: #121824;
  --colour-panel: #1a2232;
  --colour-border: #2e3c54;
  --colour-text: #e2e8f0;
  --colour-text-strong: #ffffff;
  --colour-label: #94a3b8;
  --colour-label-rgb: 148, 163, 184;
  --colour-grid: rgba(255, 255, 255, 0.03);

  --colour-ui-primary: #38bdf8;
  --colour-ui-primary-rgb: 56, 189, 248;
  --colour-ui-correct: #34d399;
  --colour-ui-correct-rgb: 52, 211, 153;
  --colour-ui-wrong: #f87171;
  --colour-ui-wrong-rgb: 248, 113, 113;

  --colour-input-a: #818cf8;
  --colour-input-b: #2dd4bf;
  --colour-output-z: #38bdf8;

  --colour-dff: #54c0ff;
  --colour-jfet: #c084fc;
  --colour-bjt: #ffb454;
  --colour-switch: #38bdf8;

  --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--colour-bg);
  color: var(--colour-text);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem;
  background-image: linear-gradient(var(--colour-grid) 1px, transparent 1px), linear-gradient(90deg, var(--colour-grid) 1px, transparent 1px);
  background-size: 40px 40px;
  transition: background-color 0.25s ease, color 0.25s ease;
}

header {
  margin-bottom: 1.5rem;
  width: 100%;
  max-width: 700px;
  text-align: left;   /* stated outright: quiz-engine pages carry quiz-common.css underneath, which centres it */
}

header h1 {
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--colour-ui-primary);
  text-shadow: none;
  text-transform: none;
}

header p {
  margin-top: .4rem;
  color: var(--colour-label);
  font-size: .82rem;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 0.75rem;
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--colour-text);
  background: var(--colour-panel);
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-card);
}

.theme-toggle:hover {
  border-color: var(--colour-ui-primary);
}

.back-link {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--colour-ui-primary);
  text-decoration: none;
  padding: 0.35rem 0.1rem;
}

.back-link:hover {
  text-decoration: underline;
}

.main-wrap.wide { max-width: 1000px; }   /* galleries, e.g. the IC reference */
.main-wrap {
  width: 100%;
  max-width: 700px;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
}

.card {
  background: var(--colour-panel);
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-card);
  transition: background 0.25s ease, border-color 0.25s ease;
}

.card-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-bottom: 0.5rem;
}

.rule-card {
  font-size: .85rem;
  line-height: 1.6;
}

.rule-card .rule-row {
  display: flex;
  gap: .5rem;
  margin: .35rem 0;
}

.rule-card .rule-cond {
  flex: none;
  width: 8.5rem;
  font-family: var(--font-mono);
  font-weight: bold;
}

.legend-row {
  display: flex;
  gap: 1rem;
  row-gap: .4rem;
  flex-wrap: wrap;
  margin-top: .8rem;
  font-size: .78rem;
  font-weight: 600;
  color: var(--colour-label);
}

.legend-swatch {
  display: inline-block;
  width: 1.1rem;
  height: 3px;
  margin-right: .3rem;
  vertical-align: middle;
  border-radius: 2px;
}

.gate-toggle-card {
  font-size: .85rem;
}

.gate-toggle-label {
  color: var(--colour-label);
  margin-bottom: .6rem;
  font-weight: 600;
}

.gate-toggle {
  display: grid;
  grid-template-columns: repeat(2, max-content);
  gap: .8rem;
  justify-content: center;
}

.gate-toggle-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .3rem;
  padding: .6rem 1.1rem;
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-lg);
  background: transparent;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: .7rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--colour-label);
  text-align: center;
  transition: background .15s, color .15s, border-color .15s;
}

.gate-toggle-btn svg {
  width: 9rem;
  height: auto;
  display: block;
}

.gate-toggle-btn.active {
  border-color: var(--colour-ui-primary);
  background: rgba(var(--colour-ui-primary-rgb), .12);
  color: var(--colour-ui-primary);
}

.gate-toggle-btn:not(.active):hover {
  background: rgba(var(--colour-ui-primary-rgb), .06);
  color: var(--colour-text);
}

.hint-toggle-card { font-size: .85rem; }
.hint-toggle-label { color: var(--colour-label); margin-bottom: .6rem; font-weight: 600; }
.hint-toggle { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
.hint-toggle-btn {
  padding: .5rem 1.1rem;
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-lg);
  background: transparent;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: .7rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--colour-label);
  transition: background .15s, color .15s, border-color .15s;
}
.hint-toggle-btn:not(.active):hover { background: rgba(var(--colour-ui-primary-rgb), .06); color: var(--colour-text); }
.hint-toggle-btn[data-hint="edges"].active { border-color: var(--colour-switch); color: var(--colour-switch); background: color-mix(in srgb, var(--colour-switch) 14%, transparent); }
.out-toggle-card { font-size: .82rem; margin-bottom: 1.2rem; }
.out-toggle-btn { min-width: 3.6rem; }
.out-toggle-btn.active { border-color: var(--colour-output-z); color: var(--colour-output-z); background: color-mix(in srgb, var(--colour-output-z) 14%, transparent); }

.wb-tracks-wrap { position: relative; }
.wb-hint-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

.wb-track-row {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 0.6rem;
}

.wb-track-label {
  font-family: var(--font-mono);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--colour-text-strong);
  width: 20px;
  text-align: center;
}

.wb-track-row svg {
  flex: 1;
  height: 48px;
  background: rgba(var(--colour-label-rgb), 0.05);
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-sm);
}

.wb-track-path {
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.wb-grid-line {
  stroke: var(--colour-border);
  stroke-width: 1;
  stroke-dasharray: 2, 2;
  opacity: 0.6;
}

.wb-track-p { stroke: var(--colour-jfet); }
.wb-track-c { stroke: var(--colour-bjt); }
.wb-track-clk { stroke: var(--colour-switch); }
.wb-track-d { stroke: var(--colour-input-a); }
.wb-track-q { stroke: var(--colour-output-z); }

.wb-palette {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  margin: 1.2rem 0;
  flex-wrap: wrap;
}

.wb-piece-btn {
  background: var(--colour-panel);
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-sm);
  padding: 0.4rem 0.6rem;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
}

.wb-piece-btn:hover:not(:disabled) {
  border-color: var(--colour-ui-primary);
  background: rgba(var(--colour-ui-primary-rgb), 0.08);
}

.wb-piece-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.wb-piece-btn svg {
  width: 42px;
  height: 28px;
}

.wb-piece-label {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--colour-label);
}

.result-banner {
  display: none;
  padding: .65rem 1rem;
  border-radius: var(--radius-sm);
  font-size: .82rem;
  font-family: var(--font-body);
  font-weight: 600;
  align-items: center;
  gap: .6rem;
  margin-bottom: 1rem;
}

.result-banner.correct {
  display: flex;
  background: rgba(var(--colour-ui-correct-rgb), .12);
  border: 1px solid rgba(var(--colour-ui-correct-rgb), .4);
  color: var(--colour-ui-correct);
}

.result-banner.wrong {
  display: flex;
  background: rgba(var(--colour-ui-wrong-rgb), .12);
  border: 1px solid rgba(var(--colour-ui-wrong-rgb), .4);
  color: var(--colour-ui-wrong);
}

.btn-row {
  display: flex;
  gap: .6rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 0.5rem;
  width: 100%;
}

.btn {
  padding: .6rem 0;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .03em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .15s;
  border: 1px solid;
  flex: 1;
  min-width: 105px;
  text-align: center;
}

.btn-prev {
  background: rgba(var(--colour-label-rgb), .1);
  border-color: rgba(var(--colour-label-rgb), .4);
  color: var(--colour-label);
}

.btn-prev:hover:not(:disabled) {
  background: rgba(var(--colour-label-rgb), .2);
}

.btn-prev:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.btn-check {
  background: rgba(var(--colour-ui-correct-rgb), .15);
  border-color: rgba(var(--colour-ui-correct-rgb), .5);
  color: var(--colour-ui-correct);
}

.btn-check:hover:not(:disabled) {
  background: rgba(var(--colour-ui-correct-rgb), .25);
}

.btn-check:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.btn-secondary {
  background: rgba(var(--colour-ui-primary-rgb), .12);
  border-color: rgba(var(--colour-ui-primary-rgb), .4);
  color: var(--colour-ui-primary);
}

.btn-secondary:hover {
  background: rgba(var(--colour-ui-primary-rgb), .22);

/* Print Worksheet — .print-only is invisible on screen, shown only via

/*
  Shared QUESTIONS[]-driven quiz engine for cert_iii quiz pages.

  Extracted from bjt_knowledge_basics.html and digital_knowledge_basics.html,
  which had independently grown apart after both being cloned from the same
  original template — this file is a genuine SYNTHESIS of the two (the union
  of every `kind`/`leftPanel` mode either one used), not a copy of either.
  See the "assets/quiz-engine.js migration assessment" — this is Phase 2:
  the two `*_basics.html` template files, proving the extraction before it's
  rolled out to the rest of cert_iii's ~27 other quiz pages.

  LOAD ORDER MATTERS: include this with a plain, non-deferred
  `<script src="path/to/quiz-engine.js"><\/script>` in <head> (same pattern as
  theme-init.js — NOT breadcrumb.js's `defer`, since deferred execution can
  run AFTER an inline body script that calls these functions, throwing
  "not defined"). This file only declares functions/globals at the top
  level — it never touches the DOM until one of its functions is actually
  called — so it's safe to load before <body> exists.

  Each page's own inline <script> (after this one) still needs to:
    1. Define `const QUESTIONS = [...]` (all page-specific content lives here)
    2. Define any page-specific helpers its own QUESTIONS reference
       (fmtO0/fmtA/frac-style formatters, custom visualizer widgets, etc.)
    3. Call `initQuizNav()`, then whatever produces the first render for that
       page (usually `resetQuiz()`; bjt_knowledge_basics.html instead calls
       its own `setMode('example1')`, which calls resetQuiz() internally
       after applying its own circuit-value setup), then `initQuizFromURL()`.

  SUPPORTED so far (the union of what all migrated files actually use —
  Phase 2: the two `*_basics.html` templates; Phase 3 so far:
  bjt_knowledge_ac_params_formulas.html):
  `kind`: unset (single-select) | 'multi' | 'match' (plain, `matchByLabel`,
  or `reusablePool` — see below) | 'bits' | 'truth' (see below) | 'fill'
  (see below) | 'switches' (see below).
  `leftPanel`: unset/'circuit' (a static circuit-panel div, optionally swapped
  per-question via showCircuitRef(data.circuitId, data.circuitLabel,
  data.circuitViewBox, data.circuitLoad, data.circuitAmmeter) if the page has
  a #circuitRefUse/#circuitRefLabel to target — see the CIRCUIT_SVG_ID/
  DEFAULT_CIRCUIT_VIEWBOX/CIRCUIT_REF_EXTRA/SUMMARY_CIRCUIT_REF globals below
  for pages whose reference circuit swaps per question rather than staying
  static) | 'viz' (a named file-specific panel div — see swapLeftPanel(),
  still requires the page to define its own #q5VizPanel-equivalent and drive
  it) | 'shapeGrid' | 'none'. Zoom modal (openModal/closeModal) and the dev
  xy-ruler overlay (buildXYRuler/setXY) are both included, both fully
  defensive — pages without a #diagramModal/CIRCUIT_SVG_ID element simply
  never trigger them.

  Per-question circuit swapping (bjt_knowledge_ac_params_ce.html and its
  whole sibling family) uses four more configurable globals, all optional:
  - `CIRCUIT_SVG_ID` (default `'circuitSvg'`) — the reference `<svg>`'s own
    id. bjt_knowledge_basics.html's single always-static circuit uses the
    default; the ac_parameters family's swappable one uses `'circuitRefSvg'`
    instead — set this before resetQuiz() if your page matches that family.
  - `DEFAULT_CIRCUIT_VIEWBOX` — fallback viewBox when a question's own
    `circuitViewBox` is unset.
  - `CIRCUIT_REF_EXTRA` — optional `(id, loadTerminal, ammeter) => void`,
    called after every circuit/viewBox swap. Each ac_parameters file's own
    ammeter-badge/load-terminal-toggle dispatch is genuinely different (one
    ammeter id vs two, gated by which circuit id is showing, a dead
    `loadTerminal` param in some files and a live one in others) — kept as a
    per-page hook rather than forced into one generic shape.
  - `SUMMARY_CIRCUIT_REF` — optional `{id, label, viewBox}`. If set,
    showSummary() calls `swapLeftPanel('circuit')` then shows this specific
    circuit instead of hiding the panel via `swapLeftPanel('none')` — for
    pages where each question shows a different circuit and there's a
    natural "default" one to settle the review page on. The explicit
    swapLeftPanel('circuit') call matters for any page that ALSO uses
    leftPanel:'shapeGrid' on some questions — otherwise the shapeGrid panel
    from the last-viewed question would stay visible on the summary page.
  - `printFigure(st)` / `printAnswerFigure(st)` — optional per-question
    functions returning an HTML string (an <img>, an <svg>) that the print
    worksheet places under the question / above its worked solution. For
    pages whose per-question picture is not the shared circuit <svg> (e.g.
    filter_gain_quiz.html's canvas graph, rendered to an image).
  - `RENDER_EXTRA` — optional `() => void`, called at the end of every
    renderQuestion(). For per-file logic that needs to run on EVERY render
    regardless of the current question — e.g. bjt_knowledge_ac_params_
    ce.html's own re′/Zb/Zin/Zout progressive-reveal badges, which persist
    once their own question is answered independent of which question is
    currently showing (a genuinely different lifecycle than
    CIRCUIT_REF_EXTRA, which only fires when the circuit itself swaps).
  - `RESET_EXTRA` — optional `() => void`, called at the very START of
    every resetQuiz() call, including "Restart" clicks, not just the first
    load. For per-file setup that must happen before the Q[] array is
    (re)built — e.g. digital_gate_identification.html's own
    `shuffle(QUESTIONS)`, which reorders the QUESTIONS array itself (each
    of the 7 gates lives in a fixed slot) rather than shuffling each
    question's own options, so every playthrough covers all 7 gates
    exactly once in a random order.

  `kind:'match'` has two duplicate-value-aware sub-modes, both opt-in per
  question (plain match — exact one-option-per-column — is still the
  default when neither flag is set):
  - `matchByLabel: true` — several pool options may share byte-identical
    text (e.g. three circuits with the same calculated value); grading
    checks the LABEL sitting in each column, not which specific option
    instance landed there, while still requiring exactly one chip per
    column (matchColumnCorrect()). See bjt_knowledge_ac_params_formulas.html
    Q5 (its own re′/RB/Zb match question) for why this was needed — the
    default exact-index check would mark a fully-correct swap of two
    identical-looking chips as wrong.
  - `reusablePool: true` — a genuinely different mechanic: ONE pool option
    can be assigned to SEVERAL columns at once, and the pool never empties.
    State moves from per-OPTION (`st.place[i] = column`) to per-COLUMN
    (`st.assign[colIdx] = option index`); `options()` gives `{label, cols:
    [colIdx, ...]}` (the columns that option validly fills) instead of a
    single `col` number. Own render path (renderMatchReusable() etc.) rather
    than branching inside the plain one — the pool-never-empties behaviour
    is different enough that merging them would hurt both. See
    bjt_knowledge_ac_params_formulas.html's own Zout question (one formula
    assigned to 3 circuits at once).

  - `order: true` — "put the steps in order": a kind:'match' whose columns are
    the numbered slots ("Step 1" ... "Step n") and whose chips are the steps.
    Grading is FAIR rather than a single fixed sequence: each option carries a
    `key` and `after: [keys]` (the steps it needs first), and an order is
    correct when every step sits alone in a slot AND in a later slot than
    everything it `after`-depends on — so two independent steps may swap.
    `col` (the slot in one canonical valid order) is still given on each
    option: it feeds the answer key and fast-forward, not the grading.
    Optional `numbered: true` drops the slot boxes altogether: just the list of
    steps, and clicking one gives it the next number (1, 2, 3 ...) shown beside
    it; clicking a numbered step takes its number back and closes the gap. Same
    state (`st.place` = slot index) and the same grading either way — add
    `keepPicker: true` to keep the coloured numbered list after Check, and
    `prefilled: [html, ...]` shows already-given steps as locked, numbered
    chips at the top of the list (1, 2, ...), and the steps to click are then
    numbered after them — for a derivation whose first line is handed over;
    `orderCols` (default 3) for how many steps sit side by side — keep the
    chip labels short (a symbol, no description) so they fit on a phone.
    Optional `matchMaxCols` sets the column-grid width of the slot boxes
    (default 4, 2 on phones). See orderChipOk(). First used by coupling_circuit_analysis.html Q1.

  Shape-based rendering (leftPanel:'shapeGrid' cells, match column titles,
  match:'shapeId' chips) uses two configurable globals, `SHAPE_VIEWBOX` and
  `MATCH_COL_TITLE_MAX_WIDTH` — override them in your own inline script
  BEFORE calling resetQuiz()/initQuizNav() if your file's own shapes use a
  different coordinate scale than the default (bjt_knowledge_basics.html's
  small BJT symbols / digital_knowledge_basics.html's waveforms & DIP
  packages, both on a `-32 -36 96 76` viewBox — bjt_knowledge_ac_params_
  formulas.html's own mini circuit thumbnails need `0 0 140 200` instead,
  and set both globals accordingly). For a file that mixes MULTIPLE shape
  families at once (e.g. bjt_knowledge_amp_config.html's tall circuit
  schematics alongside its own separate wide/short waveform shapes), set
  a per-question `shapeViewBox` field on the QUESTIONS[] entry instead —
  all three shape-rendering call sites (renderShapeGrid, the match
  column-title SVG, matchChipContent) check `data.shapeViewBox` first and
  fall back to the SHAPE_VIEWBOX global, so only questions that need a
  different scale from the file's own default have to say so.

  `kind:'truth'` — an interactive truth table: read-only input columns in
  natural binary-counting row order, plus one click-cyclable output column
  (blank -> 0 -> 1 -> blank per cell, via zFromClicks()/clickTruthZ() — the
  same click-cycle shape as `kind:'bits'`'s own bitFromClicks(), kept as its
  own separately-named function since the two kinds are conceptually
  different tables). `st.opts` is an array of `{ inputs: [...], z }` rows,
  built by `data.options()`. See renderTruth()'s own header comment for the
  two header shapes it supports (`data.headerGroups()` fixed grouped header
  vs `data.inputsHeading()`/`outputHeading()` plus an optional
  `data.inputCounts()` 2-or-3-input toggle) and which project files use
  which. `truthCorrectExplain(st)`/`truthMistakeLine(labels, st)` are
  shared, gate-agnostic helpers every 'truth' question's own
  correctExplain()/working() can call directly — the actual gate-logic
  data (which rows produce which Z, e.g. GATE_FN/buildTruthRows in
  digital_knowledge_logic_gates.html) stays page-local, same as
  AMP_CIRCUITS/GRID_CIRCUITS for shapeGrid — every file's own truth-table
  CONTENT is different enough (single gate vs multi-gate staged network)
  that centralising it wouldn't fit every file.

  `kind:'fill'` — a non-consuming pool of items (a chip stays pickable
  after being placed, never removed from the pool) placed onto one-or-more
  slot(s) elsewhere on the page, addressed by `data.slotIds` (an array of
  DOM element ids) and SLOT index — not by pool-item index, so a slot's
  correctness is independent of which/how-many pool items exist, and the
  same pool item can be placed into more than one slot if a question ever
  needs that. Each slot element `elId` needs a sibling text target
  `elId + 'Text'` for its rendered content, and `onclick="slotClicked(N)"`
  wired directly in the page's own markup (N = the slot's 0-based index
  within THAT question's own `slotIds` array, not a global index).
  `st.slotPlaced` is an array (one per slot) of the placed pool-item index
  or null. First (and so far only) used by
  digital_circuit_derivation_ab.html for a single persistent circuit
  diagram spanning every question, progressively revealed as fill
  questions are answered — that reveal/visibility logic
  (updateReveal()/RENDER_EXTRA) and the "always show this one circuit,
  never swapLeftPanel('none') it away" behaviour (a page-local no-op
  swapLeftPanel() override) are both page-local, since no other file
  shares that architecture yet.

  `kind:'switches'` — a bank of individual toggle switches, one per bit,
  each starting OFF and flipping 0<->1 on click (no blank third state — a
  physical switch is never genuinely unset, unlike a 'bits'/'truth' table
  cell). `data.switchLabels()` gives each switch's label (e.g. a 4-bit BCD
  input: `['A3','A2','A1','A0']`); `data.options()` gives the single
  correct bit array, MSB-first matching switchLabels' own order — there's
  only ever one bank of switches per question, not per-row values like
  'bits'. Correctness is per-bit (`st.switches` vs `st.cor`); the engine
  has no idea what the bits MEAN or decode to — any derived output a
  question wants to show (e.g. a live 7-segment glyph reacting to the
  current switch state) is entirely page-local, read from `Q[cur].switches`
  via `RENDER_EXTRA` on every render. First used by
  digital_bcd_decoder_practice.html (a 7447 BCD-to-7-segment exercise:
  given a target digit, set the 4 BCD switches, Check reveals the actual
  decoded segment pattern).

  Every function that runs on EVERY render regardless of the current
  question's own kind (the qMatch/qBits/qOptions display toggles inside
  renderQuestion(), and swapLeftPanel()'s per-mode panel toggles) null-checks
  its target element first — a page that never uses 'match'/'bits'/'viz'
  doesn't need to carry those containers in its own markup just to avoid a
  crash. The kind-specific render functions themselves (renderMatch(),
  renderBits(), renderShapeGrid()) are NOT defensive — if the current
  question's own `kind` needs one of these, its container genuinely must
  exist, and a missing one is a real authoring bug worth throwing on rather
  than silently swallowing.
*/

const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

// Coordinate scale for shapeGrid cells / match column titles / match:shapeId
// chips — override both before calling resetQuiz() if your page's own
// shapes use a different scale (see this file's own header comment).
let SHAPE_VIEWBOX = '-32 -36 96 76';
let MATCH_COL_TITLE_MAX_WIDTH = 80;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Generic stacked-fraction helper (numerator over denominator) — identical
// across every file that had its own copy of this; genuinely file-agnostic.
function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }

// Square root with the bar drawn over everything inside it, like frac() does for the
// fraction line: sqrt(`${a}² + ${b}²`). The radical sign is sized to the content.
function sqrt(inner) { return `<span class="working-sqrt"><span class="sqrt-sign">√</span><span class="sqrt-body">${inner}</span></span>`; }

// Formats a number to AT MOST `decimals` places, trimming trailing zeros
// (and a trailing decimal point) — e.g. trimNum(1.750, 3) -> "1.75",
// trimNum(0, 2) -> "0", trimNum(-2, 1) -> "-2". Same parseFloat(x.toFixed(n))
// trick several bespoke files (e.g. jfet_self_bias.html's own fmtV/fmtA)
// already used locally — shared here so every quiz's meter/badge value text
// follows one consistent convention instead of each file re-rolling it.
function trimNum(v, decimals) { return parseFloat(v.toFixed(decimals)).toString(); }

// kind:'multi' questions allow any number of selections; kind:'match'
// questions sort every option into one of N columns; kind:'bits' fills in a
// table of binary digits by click-cycling each cell; everything else is
// single-select (A/B/C/D...). `sel`/`cor` are a single index for single-
// select, an array of indices for multi, or (for match) `cor` is an array of
// correct column-per-option and live placement lives in `st.place` (array of
// column-per-option, null = still in the pool). For bits, `cor` is a 2D
// array [row][col] of correct 0/1 values and live input lives in
// `st.clicks` (2D array of click counts — every cell starts blank, each
// click cycles it: blank -> 0 -> 1 -> blank).
function isMulti(data) { return data.kind === 'multi'; }
function isMatch(data) { return data.kind === 'match'; }
function isBits(data) { return data.kind === 'bits'; }
function isTruth(data) { return data.kind === 'truth'; }
function isFill(data) { return data.kind === 'fill'; }
function isSwitches(data) { return data.kind === 'switches'; }
function bitFromClicks(n) { const m = n % 3; return m === 0 ? null : m - 1; }
// 'truth' cells cycle the same blank→0→1→blank way as 'bits' cells — kept as
// its own identically-implemented function (not an alias) since the two
// kinds' semantics are conceptually different (a truth table's Z column vs
// a fixed bit pattern) and every prior kind in this engine gets its own
// same-shaped helper, even when the logic happens to match.
function zFromClicks(n) { const m = n % 3; return m === 0 ? null : m - 1; }
// Shared, gate-agnostic correctExplain() for any 'truth' question.
function truthCorrectExplain(st) {
  const wrongCount = st.opts.filter((o, i) => zFromClicks(st.clicks[i]) !== st.cor[i]).length;
  return wrongCount === 0 ? `All ${st.opts.length} rows correct` : `${st.opts.length - wrongCount} of ${st.opts.length} rows correct`;
}
// Shared "list the wrong rows" working() fragment — `labels` is the
// space-joined input column labels (e.g. "C B A" or "A"), given by the question since column labels/order are genuinely per-question.
function truthMistakeLine(labels, st) {
  const mistakes = st.opts
    .map((o, i) => ({ o, i }))
    .filter(({ i }) => zFromClicks(st.clicks[i]) !== st.cor[i])
    .map(({ o }) => `${labels} = ${o.inputs.join(' ')}`);
  return mistakes.length
    ? `<div class="working-step" style="margin-top:.6rem">Incorrect rows:</div><div class="working-line">${mistakes.join(', ')}</div>`
    : '';
}

// True when the student pressed Check having entered nothing at all — shown
// as "Not answered" (and marked wrong) instead of being silently graded.
// 'switches' is never unanswered: every switch always holds a real 0/1.
function isUnanswered(data, st) {
  if (isBits(data)) return st.clicks.every(row => row.every(n => bitFromClicks(n) === null));
  if (isTruth(data)) return st.clicks.every(n => zFromClicks(n) === null);
  if (isFill(data)) return st.slotPlaced.every(p => p === null);
  if (isSwitches(data)) return false;
  if (isMatch(data)) return data.reusablePool ? st.assign.every(a => a === null) : st.place.every(p => p === null);
  return isMulti(data) ? st.sel.length === 0 : st.sel === null;
}

// kind:'match' + order:true — is step i placed alone in its slot, with every
// step it depends on (opt.after = [keys]) sitting in an EARLIER slot?
function orderChipOk(st, i) {
  const p = st.place[i];
  if (p === null) return false;
  if (st.opts.filter((_, k) => st.place[k] === p).length !== 1) return false;
  return (st.opts[i].after || []).every(key => {
    const k = st.opts.findIndex(o => o.key === key);
    return k !== -1 && st.place[k] !== null && st.place[k] < p;
  });
}

function isAnswerCorrect(data, st) {
  if (isBits(data)) return st.clicks.every((row, r) => row.every((n, c) => bitFromClicks(n) === st.cor[r][c]));
  if (isTruth(data)) return st.clicks.every((n, r) => zFromClicks(n) === st.cor[r]);
  // cor[slot] === -1 means no pool option targets that slot at all — a
  // slot that should CORRECTLY stay empty (e.g. a segment that's OFF for
  // a given digit), not an unanswered one. Every existing kind:'fill'
  // question provides one option per slot, so cor[slot] is never -1 for
  // them and this branch never changes their behaviour.
  if (isFill(data)) return st.slotPlaced.every((p, slot) => st.cor[slot] === -1 ? p === null : p === st.cor[slot]);
  if (isSwitches(data)) return st.switches.every((b, i) => b === st.cor[i]);
  if (isMatch(data)) {
    if (data.reusablePool) return st.assign.every((_, c) => isColumnCorrectReusable(st, c));
    if (data.matchByLabel) return st.corLabel.every((_, c) => matchColumnCorrect(st, c));
    if (data.order) return st.opts.every((_, i) => orderChipOk(st, i));
    return st.place.every((p, i) => p === st.cor[i]);
  }
  if (!isMulti(data)) return st.sel === st.cor;
  const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

function selectedLabel(data, st) {
  if (isUnanswered(data, st)) return 'Not answered';
  if (isBits(data)) {
    let correct = 0, total = 0;
    st.clicks.forEach((row, r) => row.forEach((n, c) => { total++; if (bitFromClicks(n) === st.cor[r][c]) correct++; }));
    return `${correct} / ${total} bits correct`;
  }
  if (isTruth(data)) {
    const correct = st.clicks.filter((n, r) => zFromClicks(n) === st.cor[r]).length;
    return `${correct} / ${st.opts.length} rows correct`;
  }
  if (isFill(data)) {
    const correctCount = st.slotPlaced.filter((p, slot) => p === st.cor[slot]).length;
    return `${correctCount} / ${st.slotPlaced.length} correctly placed`;
  }
  if (isSwitches(data)) return st.switches.join('');
  if (isMatch(data)) {
    if (data.reusablePool) {
      const correctCount = st.assign.filter((_, c) => isColumnCorrectReusable(st, c)).length;
      return `${correctCount} / ${st.assign.length} correctly placed`;
    }
    if (data.matchByLabel) {
      const correctCount = st.corLabel.filter((_, c) => matchColumnCorrect(st, c)).length;
      return `${correctCount} / ${st.corLabel.length} correctly placed`;
    }
    if (data.order) return `${st.opts.filter((_, i) => orderChipOk(st, i)).length} / ${st.opts.length} steps in a valid place`;
    const correctCount = st.place.filter((p, i) => p === st.cor[i]).length;
    return `${correctCount} / ${st.opts.length} correctly sorted`;
  }
  const asLabel = i => data.leftPanel === 'shapeGrid' ? (i + 1) : LETTERS[i];
  if (!isMulti(data)) {
    if (st.sel == null || !st.opts[st.sel]) return 'Not answered';
    return data.leftPanel === 'shapeGrid' ? `Circuit ${asLabel(st.sel)}` : st.opts[st.sel].label;
  }
  return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(asLabel).join(', ') : 'Not answered';
}

// Fills in the fully-correct answer for a question without marking it
// answered — used by jump()/jumpToSummary() to fast-forward prior questions.
// Works across every kind.
function fillCorrectSelection(i) {
  const data = QUESTIONS[i], st = Q[i];
  if (isBits(data)) st.clicks = st.cor.map(row => row.map(bit => bit + 1)); // clicks bit+1 -> bitFromClicks() lands on 0/1 (0 would land on blank)
  else if (isTruth(data)) st.clicks = st.cor.map(z => z + 1); // same +1 trick as bits: zFromClicks(z+1) lands back on z
  else if (isFill(data)) st.slotPlaced = st.cor.map(c => c === -1 ? null : c); // -1 = correctly-empty slot, not a real pool-item index
  else if (isSwitches(data)) st.switches = st.cor.slice();
  else if (isMatch(data)) {
    if (data.reusablePool) st.assign = st.assign.map((_, c) => st.opts.findIndex(o => o.cols.includes(c)));
    else st.place = st.cor.slice();
  }
  else if (isMulti(data)) st.sel = [...st.cor];
  else st.sel = st.cor;
}

let Q = [];   // per-question live state: { sel, ans, cor, opts, place?, clicks? }
let cur = 0;  // 0-based index into QUESTIONS

function buildProgressDots() {
  document.getElementById('progressDots').innerHTML =
    QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
}

function updateProgress() {
  QUESTIONS.forEach((_, i) => {
    const d = document.getElementById('dot-' + i);
    d.className = 'progress-dot';
    if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
  });
  document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
}

// ── leftPanel:'shapeGrid' ──
function renderShapeGrid() {
  const st = Q[cur], data = QUESTIONS[cur], multi = isMulti(data);
  const c = document.getElementById('shapeGridCells'); c.innerHTML = '';
  st.opts.forEach((opt, i) => {
    const cell = document.createElement('div'); cell.className = 'shape-cell';
    const selected = multi ? st.sel.includes(i) : i === st.sel;
    if (st.ans) {
      if (opt.type === 'correct') {
        // Single-select: the correct circuit is always shown correct/green
        // regardless of pick, matching renderOptions()'s convention. Multi:
        // a correct one the student didn't pick is "missed" (amber).
        const missed = multi && !selected;
        cell.classList.add(missed ? 'missed' : 'correct');
      }
      else cell.classList.add(selected ? 'wrong' : 'dimmed');
    } else {
      if (selected) cell.classList.add('selected');
      cell.addEventListener('click', () => selectOption(i));
    }
    const content = opt.shapeId
      ? `<svg viewBox="${data.shapeViewBox || SHAPE_VIEWBOX}"><use href="#${opt.shapeId}"/></svg>`
      : `<div class="shape-cell-text">${opt.label}</div>`;
    cell.innerHTML = `<span class="shape-num">${i + 1}</span>${content}`;
    c.appendChild(cell);
  });
}

function renderOptions() {
  const st = Q[cur], data = QUESTIONS[cur], multi = isMulti(data);
  const c = document.getElementById('qOptions'); c.innerHTML = '';
  st.opts.forEach((opt, i) => {
    const btn = document.createElement('button'); btn.className = 'option-btn';
    const selected = multi ? st.sel.includes(i) : i === st.sel;
    btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
    if (st.ans) {
      btn.disabled = true;
      if (opt.type === 'correct') {
        // The correct answer is always shown correct/green — whether or not
        // it was selected — matching the single-select convention. For
        // multi-select, a correct option the student didn't pick is
        // "missed" (amber) rather than plain wrong (red).
        const missed = multi && !selected;
        btn.classList.add(missed ? 'missed' : 'correct');
        btn.innerHTML += `<span class="result-icon">${missed ? '○' : '✓'}</span>`;
      } else if (selected) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
      else btn.classList.add('dimmed');
    } else {
      if (selected) btn.classList.add('selected');
      btn.addEventListener('click', () => selectOption(i));
    }
    c.appendChild(btn);
  });
}

function selectOption(i) {
  const st = Q[cur], data = QUESTIONS[cur];
  if (st.ans) return;
  if (isMulti(data)) {
    const pos = st.sel.indexOf(i);
    if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
  } else {
    st.sel = i;
  }
  renderQuestion();
}

// ── kind:'match' — click a pool chip to "pick it up" (st.sel = its index),
// then click a column to drop it there. Click a placed chip to send it back
// to the pool. No drag events at all, so it behaves identically on mouse,
// touch and keyboard. columns() may return any number of targets, each
// either a plain string (a text pill) or `{ shapeId }` (rendered as an SVG
// shape via matchChipContent() instead). Pool/placed chips work the same
// way via opt.shapeId.
function matchChipContent(opt, constrained, viewBox) {
  if (!opt.shapeId) return opt.label;
  const svgStyle = constrained ? 'width:100%;max-width:92px;height:auto;display:block' : 'width:92px;height:auto;display:block';
  return `<svg viewBox="${viewBox || SHAPE_VIEWBOX}" style="${svgStyle}"><use href="#${opt.shapeId}"/></svg>`;
}

// kind:'match' + order:true + numbered:true — no slot boxes: click a step to
// give it the next number, click a numbered step to take its number back (the
// later numbers close up). st.place[i] is still the 0-based slot, so grading,
// the answer key and fast-forward all work unchanged.
function renderOrderList() {
  const st = Q[cur], data = QUESTIONS[cur];
  document.getElementById('matchColumns').style.display = 'none';
  const nothingYet = st.place.every(p => p === null);
  document.getElementById('matchPoolRow').classList.toggle('needs-pick', !st.ans && nothingYet);
  const pool = document.getElementById('matchPool');
  pool.classList.toggle('needs-pick', !st.ans && nothingYet);
  pool.innerHTML = '';
  // short chips sit in a fixed grid (default 3 across, `orderCols` to change) so the list stays compact, phones included
  pool.style.display = 'grid';
  pool.style.gridTemplateColumns = `repeat(${data.orderCols || 3}, 1fr)`;
  // `prefilled` steps are given: locked chips numbered 1..k above the list, so clickable steps are numbered from k + 1
  const given = data.prefilled || [];
  given.forEach((label, n) => {
    const chip = document.createElement('div');
    chip.className = 'match-chip order-chip picked';
    chip.style.cursor = 'default';
    chip.innerHTML = `<span class="order-num set">${n + 1}</span><span>${label}</span>`;   // span keeps the spaces (the chip is a flex row)
    pool.appendChild(chip);
  });
  st.opts.forEach((opt, i) => {
    const chip = document.createElement('button');
    const placed = st.place[i] !== null;
    chip.className = 'match-chip order-chip' + (placed ? ' picked' : '');
    chip.innerHTML = `<span class="order-num${placed ? ' set' : ''}">${placed ? st.place[i] + 1 + given.length : ''}</span>${opt.label}`;
    if (st.ans) {
      chip.disabled = true;
      chip.classList.remove('picked');
      chip.classList.add(orderChipOk(st, i) ? 'correct' : 'wrong');
    } else {
      chip.addEventListener('click', (e) => { e.stopPropagation(); orderToggle(i); });
    }
    pool.appendChild(chip);
  });
}

function orderToggle(i) {
  const st = Q[cur];
  if (st.ans) return;
  if (st.place[i] === null) {
    st.place[i] = st.place.filter(p => p !== null).length;   // next number
  } else {
    const n = st.place[i];
    st.place[i] = null;
    st.place.forEach((p, k) => { if (p !== null && p > n) st.place[k] = p - 1; });   // close the gap
  }
  renderQuestion();
}

function renderMatch() {
  const st = Q[cur], data = QUESTIONS[cur];
  if (data.order && data.numbered) return renderOrderList();
  const cols = data.columns();

  const picking = st.sel !== null;
  const poolHasItems = st.opts.some((_, i) => st.place[i] === null);
  // When nothing is picked yet (and the pool isn't empty), flash the pool
  // itself to prompt the student to pick a word — the mirror image of the
  // column glow that prompts them to place one once it's picked.
  const needsPick = !st.ans && !picking && poolHasItems;
  document.getElementById('matchPoolRow').classList.toggle('needs-pick', needsPick);
  document.getElementById('matchPool').classList.toggle('needs-pick', needsPick);

  const pool = document.getElementById('matchPool');
  pool.innerHTML = '';
  pool.style.display = ''; pool.style.gridTemplateColumns = '';   // a numbered-order question may have made it a grid
  st.opts.forEach((opt, i) => {
    if (st.place[i] !== null) return;
    const chip = document.createElement('button');
    const isPicked = st.sel === i;
    chip.className = 'match-chip' + (isPicked ? ' picked' : '') + (opt.shapeId ? ' match-chip-shape' : '');
    chip.innerHTML = matchChipContent(opt, false, data.shapeViewBox);
    chip.disabled = st.ans || (picking && !isPicked);
    // Checked with this chip never placed: flag it as unassigned (decoys that
    // should stay in the pool are left as plain dimmed chips).
    if (st.ans && st.cor[i] !== null) chip.classList.add('wrong', 'unassigned');
    if (!chip.disabled) chip.addEventListener('click', (e) => { e.stopPropagation(); selectPoolItem(i); });
    pool.appendChild(chip);
  });

  const colsEl = document.getElementById('matchColumns');
  colsEl.innerHTML = '';
  colsEl.style.display = '';   // a numbered-order question may have hidden it
  const maxCols = window.innerWidth < 500 ? 2 : (data.matchMaxCols || 4);
  colsEl.style.gridTemplateColumns = `repeat(${Math.min(cols.length, maxCols)}, 1fr)`;
  cols.forEach((col, colIdx) => {
    const colDiv = document.createElement('div');
    colDiv.className = 'match-column';
    colDiv.addEventListener('click', () => assignToColumn(colIdx));

    const arrow = document.createElement('div'); arrow.className = 'match-col-arrow'; arrow.textContent = '▼';
    const title = document.createElement('div'); title.className = 'match-col-title';
    title.innerHTML = (typeof col === 'string') ? col : `<svg viewBox="${data.shapeViewBox || SHAPE_VIEWBOX}" style="width:100%;max-width:${MATCH_COL_TITLE_MAX_WIDTH}px;display:block;margin:0 auto"><use href="#${col.shapeId}"/></svg>`;
    const items = document.createElement('div'); items.className = 'match-col-items';

    st.opts.forEach((opt, i) => {
      if (st.place[i] !== colIdx) return;
      const chip = document.createElement('button');
      chip.className = 'match-chip' + (opt.shapeId ? ' match-chip-shape' : '');
      chip.innerHTML = matchChipContent(opt, true, data.shapeViewBox);
      if (st.ans) {
        chip.disabled = true;
        chip.classList.add((data.order ? orderChipOk(st, i) : st.place[i] === st.cor[i]) ? 'correct' : 'wrong');
      } else {
        chip.disabled = picking;
        if (!chip.disabled) chip.addEventListener('click', (e) => { e.stopPropagation(); unassignItem(i); });
      }
      items.appendChild(chip);
    });

    if (st.ans) {
      const expected = st.cor.filter(c => c === colIdx).length;
      const placed = st.opts.filter((_, i) => st.place[i] === colIdx).length;
      for (let k = placed; k < expected; k++) items.appendChild(unassignedChip());
    }

    colDiv.append(arrow, title, items);
    colDiv.classList.toggle('droppable', !st.ans && picking);
    colsEl.appendChild(colDiv);
  });
}

// Stand-in shown in a column that the student left empty once the question
// is checked — the "unassigned" counterpart to a correct/wrong placed chip.
function unassignedChip() {
  const chip = document.createElement('span');
  chip.className = 'match-chip wrong unassigned';
  chip.textContent = 'Unassigned';
  return chip;
}

function selectPoolItem(i) {
  const st = Q[cur];
  if (st.ans) return;
  st.sel = (st.sel === i) ? null : i;
  renderQuestion();
}

function assignToColumn(colIdx) {
  const st = Q[cur];
  if (st.ans || st.sel === null) return;
  if (QUESTIONS[cur].order && st.place.includes(colIdx)) return;   // order mode: one step per slot — send the occupant back first
  st.place[st.sel] = colIdx;
  st.sel = null;
  renderQuestion();
}

function unassignItem(i) {
  const st = Q[cur];
  if (st.ans) return;
  st.place[i] = null;
  renderQuestion();
}

// matchColumnCorrect(st, c) — is exactly one item sitting under column c,
// and does its LABEL (not its specific option identity) match what that
// column expects? Used instead of the default exact place[i]===cor[i]
// check for `matchByLabel` questions, where several pool options can share
// byte-identical text — any one of those interchangeable chips is a valid
// fill for any of their shared columns, not just the one it happened to
// start out mapped to before shuffle. Still requires exactly ONE chip per
// column, so stacking two chips onto one column and leaving another empty
// is correctly marked wrong, not accidentally rewarded.
function matchColumnCorrect(st, c) {
  const placedHere = st.opts.filter((o, i) => st.place[i] === c);
  return placedHere.length === 1 && placedHere[0].label === st.corLabel[c];
}

// ── kind:'match', reusablePool:true — a genuinely different mechanic from
// the standard one-option-per-column match above: the pool never empties
// (an option can be assigned to several columns at once), so state is keyed
// per COLUMN (st.assign[colIdx] = option index or null) instead of per
// OPTION (st.place[i] = column index). options() gives {label, cols:
// [colIdx, ...]} — the list of columns that option is a correct fill for.
function isColumnCorrectReusable(st, c) {
  const optIdx = st.assign[c];
  return optIdx !== null && st.opts[optIdx].cols.includes(c);
}
function renderMatchReusable() {
  const st = Q[cur], data = QUESTIONS[cur];
  const cols = data.columns();

  const picking = st.sel !== null;
  const needsPick = !st.ans && !picking;
  document.getElementById('matchPoolRow').classList.toggle('needs-pick', needsPick);
  document.getElementById('matchPool').classList.toggle('needs-pick', needsPick);

  const pool = document.getElementById('matchPool');
  pool.innerHTML = '';
  st.opts.forEach((opt, i) => {
    const chip = document.createElement('button');
    const isPicked = st.sel === i;

    chip.innerHTML = matchChipContent(opt, false, data.shapeViewBox);
    chip.disabled = st.ans || (picking && !isPicked);
    if (!chip.disabled) chip.addEventListener('click', (e) => { e.stopPropagation(); selectPoolItemReusable(i); });
    pool.appendChild(chip);
  });

  const colsEl = document.getElementById('matchColumns');
  colsEl.innerHTML = '';
  const maxCols = window.innerWidth < 500 ? 2 : 4;

  cols.forEach((col, colIdx) => {
    const colDiv = document.createElement('div');

    const title = document.createElement('div'); title.className = 'match-col-title';
    title.innerHTML = (typeof col === 'string') ? col : `<svg viewBox="${data.shapeViewBox || SHAPE_VIEWBOX}" style="width:100%;max-width:${MATCH_COL_TITLE_MAX_WIDTH}px;display:block;margin:0 auto"><use href="#${col.shapeId}"/></svg>`;
    const items = document.createElement('div'); items.className = 'match-col-items';

      chip.innerHTML = matchChipContent(opt, true, data.shapeViewBox);

      }

}
function assignToColumnReusable(colIdx) {

// ── kind:'bits' — a fixed 4-bit-wide binary entry table (the only shape
// needed so far — see digital_knowledge_basics.html). Every cell starts
// blank; each click cycles blank -> 0 -> 1 -> blank.
function renderBits() {
  const st = Q[cur];
  const body = document.getElementById('bitsBody');
  body.innerHTML = '';
  st.opts.forEach((row, r) => {
    const tr = document.createElement('tr');
    const valTd = document.createElement('td');
    valTd.textContent = row.value;
    tr.appendChild(valTd);
    for (let c = 0; c < 4; c++) {

// ── kind:'truth' — a staged/interactive truth table: read-only input
// columns (natural binary-counting row order — a truth table shouldn't
// shuffle) plus one click-cyclable output column (blank -> 0 -> 1 -> blank
// per cell, via zFromClicks/clickTruthZ). st.opts is an array of
// { inputs: [...], z } rows; data.options() (or data.options(n) — see
// below) builds them.
//
// Two header shapes exist across the project's truth-table files, and this
// function supports BOTH, branching on which fields a question provides:
//   - data.headerGroups() -> [{label, span}, ...] fixed grouped header row
//     (targets #truthGroupHeads) — the more common shape (boolean_algebra/
//     logic_combos/truth_tables.html), for staged/multi-gate build-ups
//     where the columns naturally fall into named groups ("Inputs",
//     "Stage 1", "Output", etc).
//   - data.inputsHeading()/data.outputHeading() -> single "Inputs"/"Output"
//     header cells (targets #truthInputHead/#truthOutputHead), optionally
//     paired with data.inputCounts()/data.defaultInputCount()/a 2-or-3-input
//     TOGGLE (targets #truthToggle) — digital_knowledge_logic_gates.html's
//     own single-gate-at-a-time shape, where inputLabels()/options() take
//     the current input count `n` as an argument instead of being called
//     plain (every other 'truth' field is called the same way as other
//     kinds' fields; only these two differ, and only for this shape).
// Either way, data.inputLabels() (or data.inputLabels(n)) and
// data.outputLabel() feed the shared #truthColLabels row, and the row body
// itself (targets #truthBody) is rendered identically regardless of shape.

  // digital_truth_tables.html) optionally dim already-irrelevant columns
  // and draw a double-line divider between column groups (raw inputs |
  // staged outputs | final output), and/or show extra read-only reference
  // columns AFTER the fillable Z column (e.g. previewing a later stage's
  // own output ahead of time). All three are optional per question — a
  // single-pass 'truth' question (no staging) simply omits them and
  // nothing is highlighted/dimmed/trailing.
  const highlight = data.highlightLabels ? data.highlightLabels() : [];
  const breaks = data.groupBreakAfter ? data.groupBreakAfter() : [];
  const trailingLabels = data.trailingLabels ? data.trailingLabels() : [];
  const colClass = i => (highlight.length && !highlight.includes(inputLabels[i]) ? ' truth-dim' : '') + (breaks.includes(i) ? ' truth-group-end' : '');
  const trailingClass = highlight.length ? ' truth-dim' : '';

  if (data.headerGroups) {
    const groupHeadsEl = document.getElementById('truthGroupHeads');
    if (groupHeadsEl) groupHeadsEl.innerHTML = data.headerGroups().map(g => `<th colspan="${g.span}">${g.label}</th>`).join('');
  } else {
    const inputHeadEl = document.getElementById('truthInputHead');
    if (inputHeadEl) { inputHeadEl.colSpan = inputLabels.length; inputHeadEl.innerHTML = data.inputsHeading(); }
    const outputHeadEl = document.getElementById('truthOutputHead');
    if (outputHeadEl) outputHeadEl.textContent = data.outputHeading();
    const toggle = document.getElementById('truthToggle');

        data.inputCounts().forEach(n => {

          btn.textContent = n + '-input';

    }
  }

  const colLabelsEl = document.getElementById('truthColLabels');
  if (colLabelsEl) {
    colLabelsEl.innerHTML = inputLabels.map((l, i) => `<th class="${colClass(i)}">${l}</th>`).join('') +
      `<th>${data.outputLabel()}</th>` +
      trailingLabels.map(l => `<th class="${trailingClass}">${l}</th>`).join('');
  }

  const body = document.getElementById('truthBody');
  body.innerHTML = '';
  st.opts.forEach((row, r) => {
    const tr = document.createElement('tr');

    if (st.ans) {
      if (z === null) zTd.textContent = '—';
      zTd.className = 'bits-cell' + (z === st.cor[r] ? ' correct' : ' wrong') + (z === null ? ' unassigned' : '');
    } else {
      zTd.className = 'bits-cell';
      zTd.addEventListener('click', () => clickTruthZ(r));
    }
    tr.appendChild(zTd);
    (row.trailing || []).forEach(v => {
      const td = document.createElement('td');
      td.textContent = v === null ? '' : String(v);
      td.className = 'truth-input-cell' + trailingClass;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

function clickTruthZ(r) {
  const st = Q[cur];
  if (st.ans) return;
  st.clicks[r]++;
  renderQuestion();
}

// Only relevant for questions with data.inputCounts (the 2/3-input toggle
// shape) — switching input count rebuilds the table from scratch for the
// new n and clears any existing answer, since the previous table's clicks
// don't mean anything once the row count itself has changed.
function setTruthInputCount(n) {
  const st = Q[cur], data = QUESTIONS[cur];
  if (st.n === n) return;
  st.n = n;
  st.opts = data.options(n);
  st.cor = st.opts.map(row => row.z);
  st.clicks = st.opts.map(() => 0);
  st.ans = false;
  renderQuestion();
}

// ── kind:'fill' — a non-consuming pool of items (a chip stays pickable

// index — not by pool-item index, so a slot's correctness is independent
// of which/how-many pool items exist, and the same pool item can be

// element `elId` needs a sibling text target `elId + 'Text'` for its
// rendered content. `st.slotPlaced` is an array (one per slot) of the

// reveal logic is entirely page-local (see its own updateReveal(), called
// via RENDER_EXTRA) since no other file shares this "one diagram spans
// every question" architecture yet. The needs-pick pulse styling targets

// null-checked/defensive; `fillPool`/`fillPoolRow` are core to the
// mechanic itself, same non-defensive convention as `matchPool`.
function renderFill() {
  const st = Q[cur], data = QUESTIONS[cur];
  const picking = st.sel !== null;
  const needsPick = !st.ans && !picking && st.slotPlaced.some((p, slot) => p === null && st.cor[slot] !== -1);
  const circuitNeedsPick = !st.ans && picking;
  const poolRowEl = document.getElementById('fillPoolRow');
  if (poolRowEl) poolRowEl.classList.toggle('needs-pick', needsPick);
  const circuitPanelEl = document.getElementById('circuitPanel');
  if (circuitPanelEl) circuitPanelEl.classList.toggle('needs-pick', circuitNeedsPick);
  const circuitArrowEl = document.getElementById('circuitArrow');
  if (circuitArrowEl) circuitArrowEl.classList.toggle('needs-pick', circuitNeedsPick);

  const pool = document.getElementById('fillPool');
  pool.classList.toggle('needs-pick', needsPick);
  pool.innerHTML = '';
  st.opts.forEach((opt, i) => {
    const chip = document.createElement('button');

    chip.innerHTML = opt.poolHtml;

function selectFillItem(i) {

  st.sel = (st.sel === i) ? null : i;
  renderQuestion();
}
function slotClicked(slot) {

    if (st.slotPlaced[slot] !== null) { st.slotPlaced[slot] = null; renderQuestion(); }

  st.sel = null;
  renderQuestion();
