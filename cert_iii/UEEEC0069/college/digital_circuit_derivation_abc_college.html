// ── answer key appended to every worked solution of a sort/pick question ──
// 'match': one bullet list per column with the statements that belong there
// (plus a list of any decoys that belong nowhere). 'multi': the correct
// selections and the ones that are not. Everything is derived from the same
// options() data the question already has, so no page needs to write it.
// A question can opt out with `noAnswerKey: true`.
function answerKeyHtml(data, st) {
  if (data.noAnswerKey || !st.opts) return '';
  const vb = data.shapeViewBox || SHAPE_VIEWBOX;
  // status: 'correct' (the student got this one right), 'wrong', 'missed' (left
  // unplaced / not picked though it applies) or '' (neutral — nothing to judge)
  const item = (o, i, status) => {
    const cls = status ? ` class="ak-${status}"` : '';
    if (o.shapeId) return `<li${cls}><svg viewBox="${vb}" style="width:64px;height:auto;vertical-align:middle"><use href="#${o.shapeId}"/></svg>${data.leftPanel === 'shapeGrid' ? ` <span class="answer-key-num">${i + 1}</span>` : ''}</li>`;
    return `<li${cls}>${o.label}</li>`;
  };
  const list = (title, entries) => entries.length
    ? `<div class="answer-key-group"><div class="answer-key-title">${title}</div><ul class="answer-key">${entries.join('')}</ul></div>` : '';
  const colTitle = c => typeof c === 'string' ? c : `<svg viewBox="${vb}" style="width:72px;height:auto;vertical-align:middle"><use href="#${c.shapeId}"/></svg>`;
  let groups = '';
  let heading = '';
  if (isMatch(data) && data.order && data.numbered) {
    // numbered-order question: show one valid order in the same grid as the pool, number beside each step
    const given = data.prefilled || [];
    const cells = given.map((label, n) => `<div class="match-chip order-chip"><span class="order-num set">${n + 1}</span><span>${label}</span></div>`).join('') +
      st.opts.slice().sort((x, y) => x.col - y.col)
      .map((o, n) => `<div class="match-chip order-chip"><span class="order-num set">${n + 1 + given.length}</span>${o.label}</div>`).join('');
    return `<div class="working-step answer-key-heading">One valid order:</div>` +
      `<div class="order-key" style="display:grid;grid-template-columns:repeat(${data.orderCols || 3},1fr);gap:.5rem;margin-top:.4rem">${cells}</div>`;
  }
  if (isMatch(data)) {
    heading = data.order ? 'One valid order' : 'Where each one belongs';
    const cols = data.columns();
    cols.forEach((c, ci) => {
      const here = st.opts.map((o, i) => ({ o, i })).filter(({ o }) => data.reusablePool ? (o.cols || []).includes(ci) : o.col === ci);
      const status = i => {
        if (data.reusablePool) {
          if (st.assign[ci] === i) return 'correct';
          return isColumnCorrectReusable(st, ci) ? '' : (st.assign[ci] === null ? 'missed' : 'wrong');
        }
        if (data.matchByLabel) {
          const placedHere = st.opts.filter((_, k) => st.place[k] === ci).length;
          return matchColumnCorrect(st, ci) ? 'correct' : (placedHere === 0 ? 'missed' : 'wrong');
        }
        const placed = st.place[i];
        if (data.order) return placed === null ? 'missed' : (orderChipOk(st, i) ? 'correct' : 'wrong');
        return placed === null ? 'missed' : (placed === ci ? 'correct' : 'wrong');
      };
      groups += list(colTitle(c), here.map(({ o, i }) => item(o, i, status(i))));
    });
    if (!data.reusablePool) {
      const none = st.opts.map((o, i) => ({ o, i })).filter(({ o }) => o.col === null || o.col === undefined);
      groups += list('Not in any column', none.map(({ o, i }) => item(o, i, st.place[i] === null ? 'correct' : 'wrong')));
    }
  } else if (isMulti(data)) {
    heading = 'The selectable answers';
    const picked = i => st.sel.includes(i);
    const yes = st.opts.map((o, i) => ({ o, i })).filter(({ o }) => o.type === 'correct');
    const no = st.opts.map((o, i) => ({ o, i })).filter(({ o }) => o.type !== 'correct');
    groups += list('Correct', yes.map(({ o, i }) => item(o, i, picked(i) ? 'correct' : 'missed')));
    groups += list('Not correct', no.map(({ o, i }) => item(o, i, picked(i) ? 'wrong' : '')));
  }
  return groups ? `<div class="working-step answer-key-heading">${heading}:</div>${groups}` : '';
}
function workingHtml(data, st) { return data.working(st) + answerKeyHtml(data, st); }

function renderQuestion() {
  const data = QUESTIONS[cur], st = Q[cur];
  const multi = isMulti(data);

  document.getElementById('qNum').textContent = 'Q' + (cur + 1);
  document.getElementById('qText').innerHTML = data.text(st);
  document.getElementById('qHint').innerHTML = data.hint(st);

  const qMatchEl = document.getElementById('qMatch');
  if (qMatchEl) qMatchEl.style.display = isMatch(data) ? 'flex' : 'none';
  const qBitsEl = document.getElementById('qBits');
  if (qBitsEl) qBitsEl.style.display = isBits(data) ? 'block' : 'none';
  const qTruthEl = document.getElementById('qTruth');
  if (qTruthEl) qTruthEl.style.display = isTruth(data) ? 'block' : 'none';
  const qSwitchesEl = document.getElementById('qSwitches');
  if (qSwitchesEl) qSwitchesEl.style.display = isSwitches(data) ? 'flex' : 'none';
  const qOptionsEl = document.getElementById('qOptions');
  if (qOptionsEl) qOptionsEl.style.display = (isMatch(data) || isBits(data) || isTruth(data) || isFill(data) || isSwitches(data) || data.leftPanel === 'shapeGrid') ? 'none' : '';
  const qOptionsBoxEl = document.getElementById('qOptionsBox');
  if (qOptionsBoxEl) qOptionsBoxEl.style.display = (isFill(data) || isTruth(data)) ? 'none' : '';

  if (isMatch(data)) {
    if (data.reusablePool) renderMatchReusable(); else renderMatch();
  } else if (isBits(data)) {
    renderBits();
  } else if (isTruth(data)) {
    renderTruth();
  } else if (isFill(data)) {
    renderFill();
  } else if (isSwitches(data)) {
    renderSwitches();
  } else if (data.leftPanel === 'shapeGrid') {
    renderShapeGrid();
  } else {
    renderOptions();
  }

  const selList = document.getElementById('qSelectedList');
  if (selList) {
    if (multi) {
      selList.style.display = '';
      const asLabel = i => data.leftPanel === 'shapeGrid' ? (i + 1) : LETTERS[i];
      selList.textContent = st.sel.length
        ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(asLabel).join(', ')}`
        : (data.leftPanel === 'shapeGrid' ? 'Click the shapes above to select your answer.' : 'Click every option that applies.');
    } else {
      selList.style.display = 'none';
    }
  }

  const banner = document.getElementById('qBanner');
  if (st.ans) {
    const ok = isAnswerCorrect(data, st);
    banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
    document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
    const blank = !ok && isUnanswered(data, st);
    // For the table/placement kinds correctExplain() is a score ("0 of 16 bits
    // correct"), which reads oddly after "Not answered" — point at the solution.
    const scoreKind = isBits(data) || isTruth(data) || isFill(data) || isMatch(data);
    document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}`
      : blank ? (scoreKind ? '<b>Not answered.</b> The correct answers are shown in the worked solution below.' : `<b>Not answered.</b> The correct answer is ${data.correctExplain(st)}`)
      : `The correct answer is ${data.correctExplain(st)}`;
  } else {
    banner.className = 'result-banner';
  }

  const working = document.getElementById('qWorking');
  working.className = 'working-box' + (st.ans ? ' visible' : '');
  document.getElementById('qWorkingContent').innerHTML = st.ans ? workingHtml(data, st) : '';

  document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
  const check = document.getElementById('qCheck');
  check.style.display = st.ans ? 'none' : 'inline-block';
  // Check is always clickable once a question is on screen. Pressing it
  // with nothing (or only part) entered grades what is there: a blank
  // question reads "Not answered" and counts wrong, and unfilled parts of a
  // match/fill/bits/truth question show as unassigned beside the correct
  // and wrong ones. The worked solution is shown either way.
  check.disabled = st.ans;
  const isLast = cur === QUESTIONS.length - 1;
  document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
  document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

  // Optional Example 1/2/3/Randomise mode-switcher (.mode-toggle — see
  // coupling_circuit_analysis.html/bjt_npn_voltage_divider.html for the
  // pattern) only makes sense before the student has committed to any
  // answer: switching values mid-quiz has no way to carry existing
  // progress forward, it just silently resets everything via setMode()'s
  // own resetQuiz() call. So it shows only while the whole attempt is
  // still blank, and hides the moment ANYTHING is answered — including
  // questions other than the current one, since a page could jump/deep-
  // link to a later question. Backing all the way to a truly fresh Q1
  // (backQuestion() clears cur..end) naturally re-shows it, same as a
  // Restart would. A no-op on every other page — querySelector just
  // returns null if there's no .mode-toggle in the markup.
  const modeToggle = document.querySelector('.mode-toggle');
  if (modeToggle) modeToggle.style.display = Q.every(q => !q.ans) ? '' : 'none';

  // Print Worksheet button (.print-worksheet-btn — see
  // coupling_circuit_analysis.html's own buildPrintWorksheet() comment)
  // gets the exact same "before quiz started" rule as .mode-toggle above,
  // and for the same underlying reason: it's meant for printing a BLANK
  // worksheet before attempting it, not a snapshot of progress mid-quiz.
  const printBtn = document.querySelector('.print-worksheet-btn');
  if (printBtn) printBtn.style.display = Q.every(q => !q.ans) ? '' : 'none';

  // Default to 'circuit' only when the question actually carries a
  // circuitId — most files always set leftPanel explicitly whenever a
  // circuit shows (so this never mattered before), but some files (e.g.
  // digital_knowledge_boolean_algebra.html) mix circuit and non-circuit
  // questions and only set circuitId, never leftPanel, on the ones that
  // need it — defaulting bare to 'circuit' would show an empty circuit
  // panel on every OTHER question in that file.
  const panelMode = data.leftPanel || (data.circuitId ? 'circuit' : 'none');
  swapLeftPanel(panelMode);
  if (panelMode === 'circuit') showCircuitRef(data.circuitId, data.circuitLabel, data.circuitViewBox, data.circuitLoad, data.circuitAmmeter);
  // Once the answer is displayed the worked solution carries the same
  // information (answerKeyHtml), so the pick/place widgets are hidden to stop
  // the page repeating itself. A shape grid stays: it is the figure itself.
  // `keepPicker: true` on a question keeps them; `noAnswerKey: true` has no
  // key to replace them, so they stay too.
  const hidePicker = st.ans && !data.noAnswerKey && !data.keepPicker &&
    (isMatch(data) || (isMulti(data) && data.leftPanel !== 'shapeGrid'));
  if (hidePicker) {
    if (qMatchEl) qMatchEl.style.display = 'none';
    if (qOptionsEl) qOptionsEl.style.display = 'none';
    const sl = document.getElementById('qSelectedList');
    if (sl) sl.style.display = 'none';
  }
  if (RENDER_EXTRA) RENDER_EXTRA();
  updateProgress();
}

function checkAnswer() {
  const st = Q[cur], data = QUESTIONS[cur];
  if (st.ans) return;
  st.ans = true;
  renderQuestion();
  document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function scrollToQuestionTop() {
  document.getElementById('qPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); scrollToQuestionTop(); } }

// Going back re-opens the previous question for a fresh answer — so it and
// every question after it (all now "ahead" of where the student is) are
// cleared back to unanswered, rather than staying locked from before.
function backQuestion() {
  if (cur <= 0) return;
  cur--;
  for (let i = cur; i < QUESTIONS.length; i++) {
    const data = QUESTIONS[i];
    Q[i].ans = false;
    if (isMatch(data)) {
      if (data.reusablePool) Q[i].assign = Q[i].assign.map(() => null);
      else Q[i].place = Q[i].opts.map(() => null);
      Q[i].sel = null;
    }
    else if (isBits(data)) { Q[i].clicks = Q[i].opts.map(() => [0, 0, 0, 0]); }
    else if (isTruth(data)) { Q[i].clicks = Q[i].opts.map(() => 0); }
    else if (isFill(data)) { Q[i].slotPlaced = Q[i].cor.map(() => null); Q[i].sel = null; }
    else Q[i].sel = isMulti(data) ? [] : null;
  }
  renderQuestion();
  scrollToQuestionTop();
}

// mode: 'circuit' (default, a static .circuit-panel) | 'viz' (a page-defined
// #q5VizPanel-style widget) | 'shapeGrid' | 'none' (collapses the whole
// layout to a single centred column via .quiz-wrap.single-col). Every
// target is null-checked — a page only needs to carry the containers for
// the modes it actually uses.
function swapLeftPanel(mode) {
  const circuitPanel = document.querySelector('.circuit-panel');
  if (circuitPanel) circuitPanel.style.display = mode === 'circuit' ? '' : 'none';
  const vizPanel = document.getElementById('q5VizPanel');
  if (vizPanel) vizPanel.style.display = mode === 'viz' ? 'block' : 'none';
  const shapeGridPanel = document.getElementById('qShapeGridPanel');
  if (shapeGridPanel) shapeGridPanel.style.display = mode === 'shapeGrid' ? 'block' : 'none';
  const circuitCol = document.querySelector('.circuit-col');
  if (circuitCol) circuitCol.style.display = mode === 'none' ? 'none' : '';
  const quizWrap = document.getElementById('quizWrap');
  if (quizWrap) quizWrap.classList.toggle('single-col', mode === 'none');
}

// Circuit-reference config for pages whose reference SVG swaps to a
// different viewBox per question (rather than a single always-the-same
// static one) and/or reveals extra per-question badges (ammeter/load-
// terminal toggles) alongside the circuit swap — override before calling
// resetQuiz() if your page needs them.
let CIRCUIT_SVG_ID = 'circuitSvg';    // the reference <svg>'s own id — bjt_knowledge_basics.html's default; the ac_parameters family uses 'circuitRefSvg' instead
let DEFAULT_CIRCUIT_VIEWBOX = null;   // fallback viewBox when a question doesn't specify its own
let CIRCUIT_REF_EXTRA = null;         // optional (id, loadTerminal, ammeter) => void, called after the base circuit/viewBox swap — for pages with their own ammeter/load-terminal badges (each file's own dispatch is genuinely different, so this stays a per-page hook rather than a generic config shape)
let SUMMARY_CIRCUIT_REF = null;       // optional { id, label, viewBox } — if set, showSummary() shows this specific circuit instead of hiding the panel via swapLeftPanel('none')
let RENDER_EXTRA = null;              // optional () => void, called at the end of every renderQuestion() — for per-file "runs on every render" logic quiz-engine.js can't know about, e.g. progressive-reveal value badges (re′/Zb/Zin/Zout) that persist once their own question is answered, independent of which question is currently on screen
let RESET_EXTRA = null;               // optional () => void, called at the very START of every resetQuiz() (including on "Restart" clicks, not just the first load) — e.g. digital_gate_identification.html's own `shuffle(QUESTIONS)`, which shuffles the QUESTIONS array's ORDER itself (each of the 7 gates appears in a fixed slot, one per gate) rather than each question's own options, so every playthrough covers all 7 exactly once in a random order. When RESET_EXTRA reorders QUESTIONS like this, resetQuiz() itself automatically SKIPS calling it whenever the URL already has a ?q=N param (see resetQuiz()'s own comment) — no per-page opt-in needed, it's a plain "is ?q= present" check done once in the shared engine — so ?q=N stays a reliable, repeatable deep-link to "the Nth question as written" for debugging/sharing, while a plain load/Restart still shuffles normally
let SUMMARY_EXTRA = null;            // optional () => void, called at the end of showSummary() — e.g. interactive-circuit.js uses it to set the inline circuit's label/viewBox for the summary page

// For leftPanel:'circuit' questions that reference a DIFFERENT circuit per
// question (rather than always the same static one) — swaps which <use>
// target the reference SVG points at, and its viewBox if the page uses
// CIRCUIT_SVG_ID/DEFAULT_CIRCUIT_VIEWBOX. Defensive: pages with only one
// static circuit (no per-question circuitId) simply never have anything
// call this.
function showCircuitRef(id, label, viewBox, loadTerminal, ammeter) {
  const use = document.getElementById('circuitRefUse');
  if (!use) return;
  use.setAttribute('href', '#' + id);
  const labelEl = document.getElementById('circuitRefLabel');
  if (labelEl) labelEl.textContent = label || 'Reference Circuit';
  const svgEl = document.getElementById(CIRCUIT_SVG_ID);
  if (svgEl) svgEl.setAttribute('viewBox', viewBox || DEFAULT_CIRCUIT_VIEWBOX || svgEl.getAttribute('viewBox'));
  if (CIRCUIT_REF_EXTRA) CIRCUIT_REF_EXTRA(id, loadTerminal, ammeter);
  if (xyOn) buildXYRuler();
}

function goToQuestion(n) { // 1-based, for URL/jump compatibility
  cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
  document.getElementById('summaryPanel').style.display = 'none';
  document.getElementById('qPanel').style.display = 'flex';
  renderQuestion();
  scrollToQuestionTop();
}

function resetQuiz() {
  // A URL that already carries ?q=N is a deliberate deep-link — debugging
  // one specific question, or a link someone shared pointing at it — so
  // RESET_EXTRA (almost always `() => shuffle(QUESTIONS)`, reordering the
  // whole array) is skipped in that case, leaving QUESTIONS in its own
  // original fixed order: ?q=N then reliably means "the Nth question as
  // written," the same thing every load, rather than whatever a random
  // shuffle happened to put in that position. A plain load/Restart with no
  // ?q= in the URL still shuffles normally. Every other RESET_EXTRA use
  // (a per-question reset, a mode-specific setup) is unaffected — this
  // only changes behaviour for pages whose RESET_EXTRA reorders QUESTIONS.
  const fixedOrderRequested = new URLSearchParams(location.search).has('q');
  if (RESET_EXTRA && !fixedOrderRequested) RESET_EXTRA();
  Q = QUESTIONS.map(data => {
    if (isTruth(data)) {
      // 'truth' questions may offer an input-count toggle (see
      // data.inputCounts) — if so, options() takes the current count as an
      // argument instead of being called plain, since the rows themselves
      // depend on it. Checked BEFORE the generic `data.options()` call
      // below, since calling it plain here would pass undefined as `n`.
      const n = data.inputCounts ? data.defaultInputCount() : undefined;
      const opts = data.inputCounts ? data.options(n) : data.options();
      const cor = opts.map(row => row.z);
      return { ans: false, cor, opts, clicks: opts.map(() => 0), n };
    }
    const opts = data.options();
    if (isBits(data)) {
      const cor = opts.map(row => [3, 2, 1, 0].map(shift => (row.value >> shift) & 1));
      return { ans: false, cor, opts, clicks: opts.map(() => [0, 0, 0, 0]) };
    }
    if (isSwitches(data)) {
      const cor = opts; // data.options() returns the correct bit array directly for this kind — no per-row shape needed, there's only ever one switch bank
      return { ans: false, cor, switches: cor.map(() => 0) }; // every switch starts OFF — the student sets them, they aren't pre-filled like a 'bits'/'truth' blank cell
    }
    if (isFill(data)) {
      // `col` is normally a single slot index, but may also be an array of
      // slot indices — for a pool item that's the correct fill for several
      // slots at once (e.g. one reusable "N" chip correct in 3 different
      // layers), rather than needing a separate near-duplicate option per
      // slot just to give each one its own scalar `col`.
      const cor = data.slotIds.map((_, slotIdx) => opts.findIndex(o => Array.isArray(o.col) ? o.col.includes(slotIdx) : o.col === slotIdx));
      return { sel: null, ans: false, cor, opts, slotPlaced: cor.map(() => null) };
    }
    if (isMatch(data)) {
      if (data.reusablePool) {
        const cols = data.columns();
        return { sel: null, ans: false, opts, assign: cols.map(() => null) };
      }
      const cor = opts.map(o => o.col);
      const corLabel = [];
      opts.forEach(o => { corLabel[o.col] = o.label; });
      return { sel: null, ans: false, cor, corLabel, opts, place: opts.map(() => null) };
    }
    if (isMulti(data)) {
      const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
      return { sel: [], ans: false, cor, opts };
    }
    return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
  });
  cur = 0;
  document.getElementById('summaryPanel').style.display = 'none';
  document.getElementById('qPanel').style.display = 'flex';
  renderQuestion();
}

function showSummary() {
  document.getElementById('qPanel').style.display = 'none';
  document.getElementById('summaryPanel').style.display = 'block';
  if (SUMMARY_CIRCUIT_REF) { swapLeftPanel('circuit'); showCircuitRef(SUMMARY_CIRCUIT_REF.id, SUMMARY_CIRCUIT_REF.label, SUMMARY_CIRCUIT_REF.viewBox); }
  else swapLeftPanel('none');
  const items = QUESTIONS.map((data, i) => {
    const st = Q[i];
    const ans = selectedLabel(data, st);
    const ok = isAnswerCorrect(data, st);
    const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
    const mark = ok ? '✓' : '✗';
    return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text(st)}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? workingHtml(data, st) : ''}</div>
    </div>`;
  }).join('');
  document.getElementById('summaryContent').innerHTML = items;
  QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
  document.getElementById('progressLabel').textContent = 'Complete';
  if (SUMMARY_EXTRA) SUMMARY_EXTRA();
}

// ── zoom modal — fully defensive; pages without a #diagramModal simply
// never have anything call these (no onclick="openModal()" exists there).
function openModal() {
  const src = document.getElementById(CIRCUIT_SVG_ID), dst = document.getElementById('modalSvg');
  if (!src || !dst) return;
  dst.innerHTML = src.innerHTML; dst.setAttribute('viewBox', src.getAttribute('viewBox'));
  // Pages whose reference circuit swaps per question (CIRCUIT_SVG_ID ===
  // 'circuitRefSvg') also sync the modal's own title from circuitRefLabel;
  // pages with a single static circuit (and their own #modalVoltLabel-style
  // title, updated elsewhere) simply don't have a #modalTitle to find.
  const modalTitle = document.getElementById('modalTitle'), refLabel = document.getElementById('circuitRefLabel');
  if (modalTitle && refLabel) modalTitle.textContent = refLabel.textContent;
  document.getElementById('diagramModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  const modal = document.getElementById('diagramModal');
  if (!modal) return;
  modal.classList.remove('open');
  const dst = document.getElementById('modalSvg');
  if (dst) dst.innerHTML = '';
  document.body.style.overflow = '';
}
function handleModalClick(e) { if (e.target.closest('.modal-close')) return; closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── print worksheet — fully defensive, opt-in like the zoom modal above:
// pages without a #printWorksheet element simply never call this (no
// "Print Worksheet" button exists there). #printWorksheet MUST be a
// DIRECT CHILD of <body> (a sibling of the page's header/.quiz-wrap, not
// nested inside either) — quiz-common.css's own @media print rule hides
// every OTHER direct child of <body> and shows only this one, so a page
// that nests it inside .quiz-wrap would have it hidden along with
// everything else in that container.
//
// Builds one flat, all-questions-at-once view from the SAME QUESTIONS[]
// data the interactive quiz already has: the circuit (if this page has
// one) as it CURRENTLY stands — whichever Example/Randomise values are
// active, since it just clones #circuitSvg's live innerHTML the same way
// openModal() does — then every question's text + (for the ordinary
// single/multi-select kind only — see below) a set of BLANK ruled lines,
// one per option the question actually has, for the student to work the
// answer out on paper — this is deliberately NOT a multiple-choice
// printout (the on-screen quiz already is one; the point of a printed
// worksheet is practising the calculation itself) — then a separate
// answer-key section with each question's correctExplain()+working(),
// styled to start on a fresh printed page (.print-answers has
// page-break-before:always).
//
// Only single/multi-select questions get blank lines — match/bits/truth/
// fill/switches/shapeGrid kinds don't have a natural "blank lines" shape
// (a drag-and-match board, a bit-click grid, a wired switch bank...), so
// for those this only prints the question text in the worksheet section;
// the answer key section still covers every kind, since
// correctExplain()/working() are exactly the same functions the
// interactive "Correct!" state already calls.
//
// The answer key borrows fillCorrectSelection() (see its own comment) to
// put each question's REAL st into "correctly answered" shape before
// calling correctExplain()/working() — then restores st's original
// fields straight after, so a student's own in-progress interactive
// answers on screen are never disturbed by printing.
// Blank "answer area" for one question on the printed worksheet. Choice
// questions print their options with tick boxes; table/placement kinds print
// the empty grid or the term list, so the paper version can actually be
// attempted. A page whose options are long calculation lines can set
// PRINT_BLANK_LINES = true to get ruled lines instead (working-out space).
let PRINT_BLANK_LINES = false;
function printAnswerArea(data, st) {
  const mark = '<span class="print-box"></span>';
  if (isBits(data)) {
    const head = document.querySelector('#qBits thead');
    let h = '<table class="print-table">' + (head ? head.outerHTML : '<thead><tr><th>Value</th><th colspan="4">Bits</th></tr></thead>') + '<tbody>';
    st.opts.forEach(row => { h += `<tr><td>${row.value}</td>${'<td class="print-cell"></td>'.repeat(4)}</tr>`; });
    return h + '</tbody></table>';
  }
  if (isTruth(data)) {
    const labels = data.inputCounts ? data.inputLabels(st.n) : data.inputLabels();
    const trailing = data.trailingLabels ? data.trailingLabels() : [];
    let h = '<table class="print-table"><thead><tr>' + labels.map(l => `<th>${l}</th>`).join('') + `<th>${data.outputLabel()}</th>` + trailing.map(l => `<th>${l}</th>`).join('') + '</tr></thead><tbody>';
    st.opts.forEach(row => {
      h += '<tr>' + row.inputs.map(v => `<td>${v}</td>`).join('') + '<td class="print-cell"></td>' + (row.trailing || []).map(v => `<td>${v === null ? '' : v}</td>`).join('') + '</tr>';
    });
    return h + '</tbody></table>';
  }
  if (isMatch(data) && data.order) {
    // ordering question: 18+ slot columns would run off the page, so print the steps as a list,
    // each with an empty box to write its step number in
    const given = (data.prefilled || []).map((label, n) => `<span class="print-slot"><span class="print-box" style="min-width:1.8em;height:1.4em">${n + 1}</span> ${label}</span>`).join('');
    return `<div class="print-slots">${given}${st.opts.map(o => `<span class="print-slot"><span class="print-box" style="min-width:1.8em;height:1.4em"></span> ${o.label}</span>`).join('')}</div>`;
  }
  if (isMatch(data)) {
    const cols = data.columns();
    const chip = o => o.shapeId ? `<svg viewBox="${data.shapeViewBox || SHAPE_VIEWBOX}" class="print-shape"><use href="#${o.shapeId}"/></svg>` : o.label;
    const colHead = c => typeof c === 'string' ? c : `<svg viewBox="${data.shapeViewBox || SHAPE_VIEWBOX}" class="print-shape"><use href="#${c.shapeId}"/></svg>`;
    return `<div class="print-pool">${st.opts.map(o => `<span class="print-term">${chip(o)}</span>`).join('')}</div>` +
      `<table class="print-table print-match"><thead><tr>${cols.map(c => `<th>${colHead(c)}</th>`).join('')}</tr></thead><tbody><tr>${cols.map(() => '<td class="print-cell print-tall"></td>').join('')}</tr></tbody></table>`;
  }
  if (isFill(data)) {
    return `<div class="print-pool">${st.opts.map(o => `<span class="print-term">${o.poolHtml}</span>`).join('')}</div>` +
      `<div class="print-slots">${data.slotIds.map((_, s) => `<span class="print-slot">Slot ${s + 1}: <span class="print-blank-inline"></span></span>`).join('')}</div>`;
  }
  if (isSwitches(data)) {
    return `<div class="print-slots">${data.switchLabels().map(l => `<span class="print-slot">${l}: <span class="print-box"></span> 0 <span class="print-box"></span> 1</span>`).join('')}</div>`;
  }
  if (!st.opts) return '';
  if (PRINT_BLANK_LINES) return '<div class="print-options">' + st.opts.map(() => '<div class="print-blank-line"></div>').join('') + '</div>';
  const grid = data.leftPanel === 'shapeGrid';
  const label = (o, i) => o.shapeId
    ? `<svg viewBox="${data.shapeViewBox || SHAPE_VIEWBOX}" class="print-shape"><use href="#${o.shapeId}"/></svg>`
    : o.label;
  return '<div class="print-options print-choices">' + st.opts.map((o, i) =>
    `<div class="print-choice">${mark}<b>${grid ? i + 1 : LETTERS[i]}.</b> ${label(o, i)}</div>`).join('') + '</div>';
}

// Adds the "Print Worksheet" button and the #printWorksheet host to any page
// that doesn't already carry its own — called from initQuizNav() so every
// engine page gets printing without per-page markup. A page with its own
// .print-worksheet-btn / #printWorksheet / printWorksheetNow() keeps them.
function installPrintWorksheet() {
  if (typeof QUESTIONS === 'undefined' || document.querySelector('.print-worksheet-btn')) return;
  const check = document.getElementById('qCheck');
  if (!check || !check.parentNode) return;
  const btn = document.createElement('button');
  btn.className = 'btn print-worksheet-btn';
  btn.textContent = '🖨 Print Worksheet';
  // Images in the worksheet (printFigure) are data: URLs that decode asynchronously; Chromium's
  // print preview snapshots the page immediately, so wait for them before opening the dialog
  // (Firefox waits on its own, which is why this only showed up in Chromium).
  btn.addEventListener('click', () => {
    buildPrintWorksheet();
    const host = document.getElementById('printWorksheet');
    const imgs = host ? [...host.querySelectorAll('img')] : [];
    if (!imgs.length) { qeTriggerPrint(); return; }
    Promise.all(imgs.map(im => (im.decode ? im.decode() : Promise.resolve()).catch(() => {}))).then(qeTriggerPrint);
  });
  check.parentNode.appendChild(btn);
  if (!document.getElementById('printWorksheet')) {
    const host = document.createElement('div');
    host.id = 'printWorksheet';
    host.className = 'print-only';
    document.body.appendChild(host);
  }
}

function buildPrintWorksheet() {
  const host = document.getElementById('printWorksheet');
  if (!host) return;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  let html = '';

  const h1 = document.querySelector('header h1'), sub = document.querySelector('header p');
  if (h1) html += `<h1>${esc(h1.textContent)}</h1>`;
  if (sub) html += `<div class="print-subtitle">${esc(sub.textContent)}</div>`;

  // One shared reference circuit (printed once, above the questions) when the
  // page keeps a single static circuit; per-question circuits (circuitId
  // swapped by showCircuitRef) are printed under their own question instead.
  // The panel may be hidden while this runs (e.g. Q1 has no circuit), so the
  // check is on the questions' configuration, not on what is on screen now.
  const perQuestion = QUESTIONS.some(d => d.circuitId);
  const circuitSvg = document.getElementById(CIRCUIT_SVG_ID) || document.querySelector('.circuit-panel svg');
  const usesCircuit = QUESTIONS.some(d => d.leftPanel === 'circuit' || d.circuitId);
  if (circuitSvg && usesCircuit && !perQuestion) {
    const label = document.querySelector('.panel-label');
    html += `<div class="print-circuit">
      ${label ? `<div class="print-circuit-label">${esc(label.textContent)}</div>` : ''}
      <svg viewBox="${circuitSvg.getAttribute('viewBox')}" xmlns="http://www.w3.org/2000/svg">${circuitSvg.innerHTML}</svg>
    </div>`;
  }

  html += '<div class="print-questions">';
  QUESTIONS.forEach((data, i) => {
    const st = Q[i];
    html += `<div class="print-question"><span class="print-qnum">Q${i + 1}.</span> <span class="print-qtext">${data.text(st)}</span>`;
    if (data.circuitId && circuitSvg) {
      const vb = data.circuitViewBox || DEFAULT_CIRCUIT_VIEWBOX || circuitSvg.getAttribute('viewBox');
      html += `<div class="print-circuit"><svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg"><use href="#${data.circuitId}"/></svg></div>`;
    }
    if (data.printFigure) html += `<div class="print-circuit">${data.printFigure(st)}</div>`;
    html += printAnswerArea(data, st);
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="print-answers"><h2>Worked Solutions &amp; Answers</h2>';
  QUESTIONS.forEach((data, i) => {
    const st = Q[i];
    const snapshot = { sel: st.sel, clicks: st.clicks, slotPlaced: st.slotPlaced, switches: st.switches, assign: st.assign, place: st.place };
    fillCorrectSelection(i);
    html += `<div class="print-answer"><span class="print-qnum">Q${i + 1}.</span> <span class="print-correct">${data.correctExplain(st)}</span>${data.printAnswerFigure ? `<div class="print-circuit">${data.printAnswerFigure(st)}</div>` : ''}<div class="print-working">${workingHtml(data, st)}</div></div>`;
    Object.assign(st, snapshot);
  });
  html += '</div>';

  host.innerHTML = html;
}
window.buildPrintWorksheet = buildPrintWorksheet;

// Call this INSTEAD of a bare window.print() after buildPrintWorksheet() —
// same helper/same reasoning as waveform-builder.js's own qeTriggerPrint()
// sibling (kept duplicated rather than shared, since a page using
// quiz-engine.js never also loads waveform-builder.js or vice versa — see
// that file's own header comment): Android's Chromium-based mobile
// browsers (confirmed by Don across Chrome AND Arc Search) have no
// reliable window.print() support at all, unlike iOS Safari. Since
// there's no way to detect whether it actually did anything, this always
// shows a short toast alongside it as a fallback instruction.
function qeTriggerPrint() {
  window.print();
  const toast = document.createElement('div');
  toast.textContent = "Worksheet ready. If a Print dialog didn't just open, use your browser's own menu (Share → Print, or ⋮ → Print).";
  toast.style.cssText = 'position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);max-width:90vw;background:#1e293b;color:#fff;padding:.7rem 1.1rem;border-radius:8px;font-size:.8rem;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 6000);
}
window.qeTriggerPrint = qeTriggerPrint;

function goBack(e) { e.preventDefault(); history.back(); }

function jump(n, answered) {
  if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
  // Default every question before the target to correctly-answered, so
  // progress dots and back-navigation see a consistent, completed history.
  for (let i = 0; i < n - 1; i++) { fillCorrectSelection(i); Q[i].ans = true; }
  goToQuestion(n);
  if (answered) { fillCorrectSelection(cur); checkAnswer(); }
}
window.jump = jump;

function jumpToSummary() {
  QUESTIONS.forEach((_, i) => {
    if (Q[i].ans) return;
    fillCorrectSelection(i);
    Q[i].ans = true;
  });
  showSummary();
}
window.jumpToSummary = jumpToSummary;

/* ─── DEV: xy ruler overlay — defensive; pages without #xyRuler/CIRCUIT_SVG_ID
   simply never call setXY(1) themselves (nothing wires it to a control).
   Rebuilt on every call (no build-once cache) rather than cached after the
   first build — pages whose reference circuit swaps viewBox per question
   (see showCircuitRef's own `if (xyOn) buildXYRuler()`) need a fresh ruler
   each time or it drifts out of alignment; a cache would only ever be a
   micro-optimisation for a rarely-used dev-only overlay, not worth the
   staleness risk. Offset-aware (vb.x/vb.y) so it works identically whether
   CIRCUIT_SVG_ID's viewBox starts at 0,0 or not. ── */
let xyOn = false;
function buildXYRuler() {
  const g = document.getElementById('xyRuler');
  const svgEl = document.getElementById(CIRCUIT_SVG_ID);
  if (!g || !svgEl) return;
  const vb = svgEl.viewBox.baseVal;
  const offX = vb.x, offY = vb.y, W = vb.width, H = vb.height;
  const hy = offY + H - 10, vx = offX + 10, col = '#ff00ff';
  let svg = `<line x1="${offX}" y1="${hy}" x2="${offX + W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
  for (let x = 0; x <= W; x += 10) {
    const gx = offX + x, major = (Math.round(gx) % 50 === 0), len = major ? 10 : 5;
    svg += `<line x1="${gx}" y1="${hy - len}" x2="${gx}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
    if (major) svg += `<text x="${gx}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${Math.round(gx)}</text>`;
  }
  svg += `<line x1="${vx}" y1="${offY}" x2="${vx}" y2="${offY + H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
  for (let y = 0; y <= H; y += 10) {
    const gy = offY + y, major = (Math.round(gy) % 50 === 0), len = major ? 10 : 5;
    svg += `<line x1="${vx}" y1="${gy}" x2="${vx + len}" y2="${gy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
    if (major) svg += `<text x="${vx + 13}" y="${gy + 3}" fill="${col}" font-size="8" text-anchor="start">${Math.round(gy)}</text>`;
  }
  g.innerHTML = svg;
}
function setXY(on) {
  xyOn = on;
  const g = document.getElementById('xyRuler');
  if (!g) return;
  if (on) buildXYRuler();
  g.setAttribute('display', on ? 'inline' : 'none');
}
window.setXY = setXY;

// ── Bootstrap helpers — call explicitly from each page's own inline script,

// own setup to happen BETWEEN "build the progress dots" and "do the first
// render" — see this file's own header comment for the exact call shape

function initQuizNav() {
  buildProgressDots();

  // history.length is 1 when this page was opened directly (new tab,
  // bookmark, double-click) rather than reached by clicking a link from a
  // menu page.
  if (history.length > 1) {
    const menuLink = document.getElementById('menuLink');
    if (menuLink) menuLink.style.display = '';
  }
}
function initQuizFromURL() {
  const p = new URLSearchParams(location.search);
  if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
  if (p.has('xy')) setXY(+p.get('xy') === 1);
}

  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';

    // `<O>X</O>` = a NOT bar over one variable, `<OO>…</OO>` = a raised NAND bar over a sub-expression,
    // `<OOO>…</OOO>` = a third, higher bar (same helper and classes as digital_circuit_derivation_ab.html)
    function sym(template) {
      const poolHtml = template
        .replace(/<OOO>/g, '<span class="ovl-outer2">').replace(/<\/OOO>/g, '</span>')
        .replace(/<OO>/g, '<span class="ovl-outer">').replace(/<\/OO>/g, '</span>')
        .replace(/<O>/g, '<span class="ovl-thick">').replace(/<\/O>/g, '</span>');
      return { poolHtml };
    }
    function exprPool(items) {
      return () => shuffle(items.map(it => ({ ...it, ...(it.correct ? { col: 0 } : {}) })));
    }
    const G1_IN = 'A·B·<O>C</O>', G2_IN = '<O>B</O>·C';
    const G1_TPL = `<OO>${G1_IN}</OO>`, G2_TPL = `<OO>${G2_IN}</OO>`;
    const FINAL = `(${G1_IN}) + (${G2_IN})`;

    const QUESTIONS = [
      {
        kind: 'fill',
        slotIds: ['andBox', 'slotCbar', 'slotBbar'],
        text: () => 'This circuit is built from three ICs: a 7408 AND, a 7402 (NOR gates used as inverters) and a 7400 NAND. Start with the first level — the output of every gate that the inputs go through first: <b style="color:var(--colour-ui-primary)">place</b> the 7408 AND\'s output and the two 7402 inverter outputs on the circuit.',
        hint: () => 'The AND gate has no output bubble, so its output is just its two inputs ANDed. Each 7402 NOR has its two inputs tied together, so it works as an inverter: its output is the opposite of the input it gets.',
        options: () => shuffle([
          { ...sym('A·B'), col: 0 },
          { label: 'NOT C', poolHtml: '<span class="ovl">C</span>', col: 1 },
          { label: 'NOT B', poolHtml: '<span class="ovl">B</span>', col: 2 },
          { label: 'C', poolHtml: 'C' },
          sym('<OO>A·B</OO>'),
          sym('A + B'),
          { label: 'B', poolHtml: 'B' },
          { label: 'NOT A', poolHtml: '<span class="ovl">A</span>' },
        ]),
        correctExplain: (st) => {
          const wrong = st.slotPlaced.filter((p, slot) => p !== st.cor[slot]).length;
          return wrong === 0 ? 'All 3 first-level outputs placed correctly' : `${st.slotPlaced.length - wrong} of ${st.slotPlaced.length} placed correctly`;
        },
        working: () => `
    <div class="working-line">The <b>7408 AND</b> (pin 3) gets A and B straight from the inputs and has no bubble, so its output is simply <b>A·B</b>. It feeds the top NAND.</div>
    <div class="working-line" style="margin-top:.4rem">The top 7402 inverter (pin 1) gets C, so its output is <b style="text-decoration:overline">C</b>, which feeds the top NAND. The bottom inverter (pin 4) gets B, so its output is <b style="text-decoration:overline">B</b>, which feeds the bottom NAND.</div>
    <div class="working-line" style="margin-top:.4rem">C itself also goes straight to the bottom NAND, without passing through a gate, so it needs no working out. Nothing in this circuit inverts A, so <span style="text-decoration:overline">A</span> is not used.</div>`,
      },
      {
        kind: 'fill',
        slotIds: ['g1Box', 'g2Box'],
        text: () => 'With the first level confirmed, what is the output of each <b>7400 NAND</b> — the <b>top</b> one (pins 1, 2 → 3, inputs A·B and NOT C) and the <b>bottom</b> one (pins 13, 12 → 11, inputs NOT B and C)? <b style="color:var(--colour-ui-primary)">Place</b> each answer directly on the circuit.',
        hint: () => 'Each NAND ANDs its inputs and then inverts the whole result — don\'t forget that final bar on either one.',
        options: () => shuffle([
          { ...sym(G1_TPL), col: 0 },
          { ...sym(G2_TPL), col: 1 },
          sym(G1_IN),
          sym(G2_IN),
          sym('<OO>A·B·C</OO>'),
          sym('<OO>B·<O>C</O></OO>'),
        ]),
        correctExplain: (st) => {
          const wrong = st.slotPlaced.filter((p, slot) => p !== st.cor[slot]).length;
          return wrong === 0 ? 'Top NAND = ' + sym(G1_TPL).poolHtml + ',  bottom NAND = ' + sym(G2_TPL).poolHtml : `${st.slotPlaced.length - wrong} of ${st.slotPlaced.length} correct`;
        },
        working: () => `
    <div class="working-line">Top NAND (pin 3): AND its inputs — (A·B) and <span class="ovl-thick">C</span> make ${sym(G1_IN).poolHtml} — then invert the whole thing (the raised bar in the box above).</div>
    <div class="working-line" style="margin-top:.4rem">Bottom NAND (pin 11): AND <span class="ovl-thick">B</span> and C to get ${sym(G2_IN).poolHtml}, then invert.</div>
    <div class="working-line" style="margin-top:.4rem">Leaving off a NAND's final bar, or inverting the wrong input, are the common mistakes.</div>`,
      },
      {
        kind: 'fill',
        slotIds: ['zBox'],
        text: () => 'Both NAND outputs feed the <b>final NAND</b> (pins 4, 5 → 6). Substituting them in, what is <b>Z</b> before any simplification?',
        hint: () => 'Same NAND rule again: AND the two inputs, then one bar over everything.',
        options: exprPool([
          { ...sym(`<OOO>(${G1_TPL})·(${G2_TPL})</OOO>`), correct: true },
          sym(`(${G1_TPL})·(${G2_TPL})`),
          sym(`<OOO>(${G1_TPL})</OOO>·<OOO>(${G2_TPL})</OOO>`),
          sym(`(${G1_TPL}) + (${G2_TPL})`),
        ]),
        correctExplain: () => 'Z = ' + sym(`<OOO>(${G1_TPL})·(${G2_TPL})</OOO>`).poolHtml,
        working: () => `<div class="working-total">AND the two NAND outputs together, then invert: that is the third, highest bar in the box above, over the bars the two NAND outputs already carry. This is the raw expression; the next two questions simplify it.</div>`,
      },
      {
        kind: 'fill',
        slotIds: ['step1Box'],
        text: () => 'Apply <b>De Morgan\'s law</b> to Z\'s outer NOT. What do you get? <b style="color:var(--colour-ui-primary)">Place</b> your answer on the circuit.',
        hint: () => 'NOT (X AND Y) = NOT X OR NOT Y — the AND flips to OR, and each side gets its own NOT. Don\'t cancel anything yet.',
        options: exprPool([
          { ...sym(`<OOO>(${G1_TPL})</OOO> + <OOO>(${G2_TPL})</OOO>`), correct: true },
          sym(`<OOO>(${G1_TPL})</OOO>·<OOO>(${G2_TPL})</OOO>`),
          sym(`(${G1_TPL}) + (${G2_TPL})`),
          sym(`(${G1_TPL})·(${G2_TPL})`),
        ]),
        correctExplain: () => 'Z = ' + sym(`<OOO>(${G1_TPL})</OOO> + <OOO>(${G2_TPL})</OOO>`).poolHtml,
        working: () => `<div class="working-total">De Morgan's law: NOT (X AND Y) = NOT X OR NOT Y. The AND between the two NAND outputs becomes OR, and each side gets its own separate bar. Each term is now a <b>double</b> negation, which the next question cancels.</div>`,
      },
      {
        kind: 'fill',
        slotIds: ['step2Box'],
        text: () => 'Each term is now NOT of a NAND output — a double negation. Cancelling it, what does <b>Z</b> simplify to?',
        hint: () => 'NOT(NOT(anything)) cancels straight back to that thing.',
        options: exprPool([
          { ...sym(FINAL), correct: true },
          sym('(A·B·C) + (B·<O>C</O>)'),
          sym(`(${G1_IN})·(${G2_IN})`),
          sym('(<O>A</O>+<O>B</O>+C)·(B+<O>C</O>)'),
        ]),
        correctExplain: () => 'Z = ' + sym(FINAL).poolHtml,
        working: () => `
    <div class="working-line">NOT(NOT(${sym(G1_IN).poolHtml})) = ${sym(G1_IN).poolHtml}, and NOT(NOT(${sym(G2_IN).poolHtml})) = ${sym(G2_IN).poolHtml}.</div>
    <div class="working-total">Z = ${sym(FINAL).poolHtml} — a sum of products, one product term from each first-level NAND. That is the "NAND-NAND realises sum-of-products" pattern again.</div>`,
      },
      {
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A'],
        headerGroups: () => [{ label: 'Inputs', span: 3 }, { label: 'Output', span: 1 }],
        outputLabel: () => 'Z',
        text: () => 'Complete the truth table for <b>Z = A·B·NOT C + NOT B·C</b> — the column you would check against your measured outputs when you build it.',
        hint: () => 'Z is 1 when A and B are 1 with C at 0, OR when B is 0 with C at 1. Check each row against both terms.',
        options: () => {
          const rows = [];
          for (let v = 0; v < 8; v++) {
            const c = (v >> 2) & 1, b = (v >> 1) & 1, a = v & 1;
            rows.push({ inputs: [c, b, a], z: ((a & b & (1 - c)) | ((1 - b) & c)) });
          }
          return rows;
        },
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-line">The <b>A·B·<span class="ovl-thick">C</span></b> term is 1 in just one row: C B A = 0 1 1.</div>
    <div class="working-line" style="margin-top:.4rem">The <b><span class="ovl-thick">B</span>·C</b> term is 1 whenever B = 0 and C = 1: rows 1 0 0 and 1 0 1.</div>
    <div class="working-total">So Z = 1 in rows 011, 100 and 101, and 0 everywhere else. If a measured output disagrees, trace that row's signals through the gates to find the fault.</div>
    ${truthMistakeLine('C B A', st)}`,
      },
    ];

    // Diagram reveal: a fill question's box(es) show once it is being asked or has been answered, and an
    // answered question's boxes keep the correct value (same as digital_circuit_derivation_ab.html)
    function updateReveal() {
      const data = QUESTIONS[cur];
      document.getElementById('fillPoolWrap').style.display = isFill(data) ? '' : 'none';
      document.getElementById('circuitArrow').style.display = isFill(data) ? '' : 'none';
      if (!isFill(data)) document.getElementById('circuitPanel').classList.remove('needs-pick');
      QUESTIONS.forEach((qData, i) => {
        if (!isFill(qData)) return;
        const st = Q[i];
        const visible = (i === cur) || st.ans;
        qData.slotIds.forEach((elId) => { document.getElementById(elId).setAttribute('display', visible ? 'inline' : 'none'); });
        if (i === cur) return;
        qData.slotIds.forEach((elId, slot) => {
          const box = document.getElementById(elId), txt = document.getElementById(elId + 'Text');
          if (st.ans) {
            txt.innerHTML = st.opts[st.cor[slot]].poolHtml;
            box.classList.remove('wrong'); box.classList.add('filled', 'correct', 'plain');
            txt.classList.remove('wrong'); txt.classList.add('correct');
          } else {
            box.classList.remove('filled', 'correct', 'wrong', 'plain');
            txt.innerHTML = '';
            txt.classList.remove('correct', 'wrong');
          }
        });
      });
      if (xyOn) buildXYRuler();
    }
    function swapLeftPanel() {}           // the one circuit is always visible (see the _ab page)
    RENDER_EXTRA = () => updateReveal();

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
