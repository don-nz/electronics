/*
  NSW TAFE college theme — the single source for the self-contained teacher pages
  (cert_iii/UEEEC0069/college/*_college.html). tools/build_college.py inlines this into
  each generated page, so a college page is the student page's own markup and script
  with this stylesheet instead of assets/quiz-common.css.

  It was lifted from the hand-made college pages (TAFE colour palette, Public Sans,
  .main-wrap / .card-top-bar layout, light and dark themes, print rules) and then
  extended with rules for the classes the shared engines draw with, so the college
  pages no longer need a hand-made copy of the waveform code. To change how the
  college pages look, edit this file and rebuild.
*/

:root {
  --colour-bg: #f8f9fa;
  --colour-panel: #ffffff;
  --colour-border: #d0d5dd;
  --colour-text: #1d2939;
  --colour-text-strong: #002664;
  --colour-label: #475467;
  --colour-label-rgb: 71, 84, 103;
  --colour-grid: rgba(0, 38, 100, 0.04);

  --colour-ui-primary: #002664;
  --colour-ui-primary-rgb: 0, 38, 100;
  --colour-ui-correct: #087443;
  --colour-ui-correct-rgb: 8, 116, 67;
  --colour-ui-wrong: #d92d20;
  --colour-ui-wrong-rgb: 217, 45, 32;

  --colour-input-a: #4338ca;
  --colour-input-b: #0f766e;
  --colour-output-z: #0284c7;

  --colour-dff: #0d80c3;
  --colour-jfet: #7e22ce;
  --colour-bjt: #b45309;
  --colour-switch: #0369a1;

  --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Public Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'Share Tech Mono', monospace, sans-serif;

  --radius-lg: 6px;
  --radius-sm: 4px;
  --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
}

body.dark-theme {
  --colour-bg: #121824;
  --colour-panel: #1a2232;
  --colour-border: #2e3c54;
  --colour-text: #e2e8f0;
  --colour-text-strong: #ffffff;
  --colour-label: #94a3b8;
  --colour-label-rgb: 148, 163, 184;
  --colour-grid: rgba(255, 255, 255, 0.03);

  --colour-ui-primary: #38bdf8;
  --colour-ui-primary-rgb: 56, 189, 248;
  --colour-ui-correct: #34d399;
  --colour-ui-correct-rgb: 52, 211, 153;
  --colour-ui-wrong: #f87171;
  --colour-ui-wrong-rgb: 248, 113, 113;

  --colour-input-a: #818cf8;
  --colour-input-b: #2dd4bf;
  --colour-output-z: #38bdf8;

  --colour-dff: #54c0ff;
  --colour-jfet: #c084fc;
  --colour-bjt: #ffb454;
  --colour-switch: #38bdf8;

  --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--colour-bg);
  color: var(--colour-text);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem;
  background-image: linear-gradient(var(--colour-grid) 1px, transparent 1px), linear-gradient(90deg, var(--colour-grid) 1px, transparent 1px);
  background-size: 40px 40px;
  transition: background-color 0.25s ease, color 0.25s ease;
}

header {
  margin-bottom: 1.5rem;
  width: 100%;
  max-width: 700px;
  text-align: left;   /* stated outright: quiz-engine pages carry quiz-common.css underneath, which centres it */
}

header h1 {
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--colour-ui-primary);
  text-shadow: none;
  text-transform: none;
}

header p {
  margin-top: .4rem;
  color: var(--colour-label);
  font-size: .82rem;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 0.75rem;
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--colour-text);
  background: var(--colour-panel);
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-card);
}

.theme-toggle:hover {
  border-color: var(--colour-ui-primary);
}

.back-link {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--colour-ui-primary);
  text-decoration: none;
  padding: 0.35rem 0.1rem;
}

.back-link:hover {
  text-decoration: underline;
}

.main-wrap.wide { max-width: 1000px; }   /* galleries, e.g. the IC reference */

  width: 100%;
  max-width: 700px;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
}

.card {
  background: var(--colour-panel);
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-card);
  transition: background 0.25s ease, border-color 0.25s ease;
}

.card-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-bottom: 0.5rem;
}

.rule-card {
  font-size: .85rem;
  line-height: 1.6;
}

.rule-card .rule-row {
  display: flex;
  gap: .5rem;
  margin: .35rem 0;
}

.rule-card .rule-cond {

  width: 8.5rem;
  font-family: var(--font-mono);
  font-weight: bold;
}

.legend-row {

  gap: 1rem;
  row-gap: .4rem;
  flex-wrap: wrap;
  margin-top: .8rem;
  font-size: .78rem;
  font-weight: 600;
  color: var(--colour-label);
}

.legend-swatch {

  width: 1.1rem;
  height: 3px;
  margin-right: .3rem;
  vertical-align: middle;
  border-radius: 2px;
}

.gate-toggle-card {
  font-size: .85rem;
}

.gate-toggle-label {
  color: var(--colour-label);
  margin-bottom: .6rem;
  font-weight: 600;
}

.gate-toggle {

  justify-content: center;

.gate-toggle-btn {

  flex-direction: column;
  align-items: center;
  gap: .3rem;
  padding: .6rem 1.1rem;

  border-radius: var(--radius-lg);

.gate-toggle-btn.active {

.gate-toggle-btn:not(.active):hover {

}

.hint-toggle-card { font-size: .85rem; }
.hint-toggle-label { color: var(--colour-label); margin-bottom: .6rem; font-weight: 600; }
.hint-toggle { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
.hint-toggle-btn {
  padding: .5rem 1.1rem;
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-lg);
  background: transparent;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: .7rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--colour-label);
  transition: background .15s, color .15s, border-color .15s;
}
.hint-toggle-btn:not(.active):hover { background: rgba(var(--colour-ui-primary-rgb), .06); color: var(--colour-text); }
.hint-toggle-btn[data-hint="edges"].active { border-color: var(--colour-switch); color: var(--colour-switch); background: color-mix(in srgb, var(--colour-switch) 14%, transparent); }
.out-toggle-card { font-size: .82rem; margin-bottom: 1.2rem; }
.out-toggle-btn { min-width: 3.6rem; }
.out-toggle-btn.active { border-color: var(--colour-output-z); color: var(--colour-output-z); background: color-mix(in srgb, var(--colour-output-z) 14%, transparent); }

.wb-tracks-wrap { position: relative; }
.wb-hint-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

.wb-track-row {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 0.6rem;
}

.wb-track-label {
  font-family: var(--font-mono);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--colour-text-strong);
  width: 20px;
  text-align: center;
}

.wb-track-row svg {
  flex: 1;
  height: 48px;
  background: rgba(var(--colour-label-rgb), 0.05);
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-sm);
}

.wb-track-path {
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.wb-grid-line {
  stroke: var(--colour-border);
  stroke-width: 1;
  stroke-dasharray: 2, 2;
  opacity: 0.6;
}

.wb-track-p { stroke: var(--colour-jfet); }
.wb-track-c { stroke: var(--colour-bjt); }
.wb-track-clk { stroke: var(--colour-switch); }
.wb-track-d { stroke: var(--colour-input-a); }
.wb-track-q { stroke: var(--colour-output-z); }

.wb-palette {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  margin: 1.2rem 0;
  flex-wrap: wrap;
}

.wb-piece-btn {
  background: var(--colour-panel);
  border: 1px solid var(--colour-border);
  border-radius: var(--radius-sm);
  padding: 0.4rem 0.6rem;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
}

.wb-piece-btn:hover:not(:disabled) {
  border-color: var(--colour-ui-primary);
  background: rgba(var(--colour-ui-primary-rgb), 0.08);
}

.wb-piece-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.wb-piece-btn svg {
  width: 42px;
  height: 28px;
}

.wb-piece-label {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--colour-label);
}

.result-banner {
  display: none;
  padding: .65rem 1rem;
  border-radius: var(--radius-sm);
  font-size: .82rem;
  font-family: var(--font-body);
  font-weight: 600;
  align-items: center;
  gap: .6rem;
  margin-bottom: 1rem;
}

.result-banner.correct {
  display: flex;
  background: rgba(var(--colour-ui-correct-rgb), .12);
  border: 1px solid rgba(var(--colour-ui-correct-rgb), .4);
  color: var(--colour-ui-correct);

.result-banner.wrong {
  display: flex;
  background: rgba(var(--colour-ui-wrong-rgb), .12);
  border: 1px solid rgba(var(--colour-ui-wrong-rgb), .4);

.btn-row {
  display: flex;
  gap: .6rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 0.5rem;

  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .03em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .15s;
  border: 1px solid;
  flex: 1;
  min-width: 105px;
  text-align: center;
}

.btn-prev {
  background: rgba(var(--colour-label-rgb), .1);
  border-color: rgba(var(--colour-label-rgb), .4);
  color: var(--colour-label);
}

.btn-prev:hover:not(:disabled) {
  background: rgba(var(--colour-label-rgb), .2);
}

.btn-prev:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.btn-check {
  background: rgba(var(--colour-ui-correct-rgb), .15);
  border-color: rgba(var(--colour-ui-correct-rgb), .5);
  color: var(--colour-ui-correct);
}

.btn-check:hover:not(:disabled) {
  background: rgba(var(--colour-ui-correct-rgb), .25);
}

.btn-check:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.btn-secondary {

  border-color: rgba(var(--colour-ui-primary-rgb), .4);
  color: var(--colour-ui-primary);

  background: rgba(var(--colour-ui-primary-rgb), .22);

/* Print Worksheet — .print-only is invisible on screen, shown only via
   @media print below. #printWorksheet (a direct child of <body>, NOT
   nested inside .main-wrap) is built fresh by printDiagramNow() right
   before window.print(): page title/description, the current Trigger/Q
   diagram with Q left as a blank grid, then a page-break and the same
   diagram again with the correct Q filled in as the solution. */
.print-only { display: none; }

@media print {
  /* Force light regardless of whichever theme is active on screen —
     body.dark-theme has higher specificity than a bare :root rule, so
     it's redefined here too (same values), not just :root, or dark
     mode would still win. */
  :root, body.dark-theme {
    --colour-bg: #ffffff;
    --colour-panel: #ffffff;
    --colour-text: #000000;
    --colour-text-strong: #000000;
    --colour-border: #999999;
    --colour-label: #444444;
  }
  body > *:not(#printWorksheet) { display: none !important; }
  body { background: #fff; background-image: none; padding: 0; display: block; }
  #printWorksheet {
    display: block !important;
    color: #000;
    font-family: var(--font-body);
    max-width: 700px;
    margin: 2rem auto;
  }
  #printWorksheet h1 { font-size: 1.3rem; margin: 0 0 .3rem; font-family: var(--font-display); }
  #printWorksheet .print-subtitle { font-size: .8rem; color: #444; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: .05em; }
  #printWorksheet .print-description { margin-bottom: 1.2rem; }
  #printWorksheet .print-diagram-section { page-break-inside: avoid; }
  /* Solution starts on its own fresh page when printed double-sided or handed out separately. */
  #printWorksheet .print-solution { page-break-before: always; }
  #printWorksheet .print-solution h2 { font-size: 1.1rem; margin-bottom: .8rem; }
  #printWorksheet .wb-track-row svg { width: 100%; height: auto; background: none; border: 1px solid #999; }
  #printWorksheet .wb-track-label { color: #000; }
  #printWorksheet .wb-grid-line { stroke: #999; stroke-dasharray: none; opacity: 1; }
}

/* Copyright line (college copies are self-contained, so inline) */
.site-copyright {
  margin: 3rem auto 1.5rem;
  padding: 0 1rem;
  text-align: center;
  font-size: 0.7rem;
  color: var(--colour-label);
  opacity: 0.8;
}

/* ── page-structure rules shared by the waveform-builder pages ── */
.wb-track-label { width: 2.6rem; }
.extra-row { display: none; }
.extra-row.shown { display: flex; }
/* the student pages space their cards with margin-bottom; .main-wrap already spaces them with a gap */
.main-wrap > .card { margin-bottom: 0; }
.rule-card > div:first-of-type { margin-bottom: 0.4rem; }
.rule-card > div:nth-last-of-type(2) { margin-top: 0.4rem; }

/* ── classes assets/waveform-builder.js draws with (the student theme styles these from quiz-common.css) ── */
.wb-grid-baseline { stroke: rgba(var(--colour-label-rgb), .4); }
.wb-track-path.wb-track-s { stroke: var(--colour-input-a); }
.wb-track-path.wb-track-r { stroke: var(--colour-input-b); }
.wb-track-path.wb-track-p { stroke: var(--colour-jfet); }
.wb-track-path.wb-track-c { stroke: var(--colour-bjt); }
.wb-track-path.wb-track-clk { stroke: var(--colour-switch); }
.wb-track-path.wb-track-d { stroke: var(--colour-input-a); }
.wb-progress-shade { fill: var(--colour-ui-primary); opacity: .1; }
.wb-q-path { fill: none; stroke-width: 2; stroke-linejoin: round; }
.wb-q-path.wb-col-building { stroke: var(--colour-output-z); }
.wb-q-path.wb-col-correct { stroke: var(--colour-ui-correct); }
.wb-q-path.wb-col-wrong { stroke: var(--colour-ui-wrong); }
.wb-piece-icon { width: 40px; height: 28px; overflow: visible; }
.wb-piece-icon line, .wb-piece-icon polyline {
  fill: none; stroke: var(--colour-output-z); stroke-width: 2.5;
  stroke-linecap: round; stroke-linejoin: round;

@media (max-width: 480px) {
  .wb-track-label { width: 1.6rem; font-size: .8rem; }
  .wb-piece-icon { width: 32px; height: 24px; }
}
@media print {
  #printWorksheet .print-wave-row svg { width: 100%; height: auto; background: none; border: 1px solid #999; }

  <script>
/* ══════════════════════════════════════════════════════════════════════
   inplace-zoom.js — zoom an <svg> diagram where it sits (no pop-up).

   InPlaceZoom.attach(svg, { tapToZoom, wrap, group, onChange, barIn, barBefore })
     - −, %, + and reset buttons are added to the svg's parent (top-right).
       Zooms in to 200% and out to 50% (smaller than its panel); +/− step 10%.
     - group: diagrams given the same group name share ONE set of buttons
       (on the first one attached) and always share a zoom level — zooming any
       of them zooms them all; each still pans on its own.
     - While zoomed: drag (mouse or one finger) pans; wheel / pinch zooms.
       Unzoomed, the wheel and a one-finger swipe scroll the page as normal.
       Ctrl+wheel (a laptop trackpad pinch) zooms at any time.
     - tapToZoom: a plain tap/click zooms 2× around that spot and the next tap
       zooms back out — for diagrams with nothing tappable inside them (the
       quiz circuit panels). Leave it off for interactive diagrams (the
       breadboard simulators), where taps belong to the page.
     - wrap: put the svg in its own box, with the buttons in a strip ABOVE it
       rather than over its corner (for drawings whose labels reach the top
       edge, and when the svg's parent holds other content too).
     - barIn / barBefore: put the buttons inside barIn (before barBefore) — a
       toolbar the page already has — instead of on the diagram.
     - Drags that start on a slider, button, link or other form control are
       left to it (never pan) — e.g. a range input laid over a drawing.
     - onChange(scale): called after every zoom/pan/reset (e.g. to re-place
       pop-ups that are positioned from the drawing).
     - A drag never fires the page's own click handlers (the click that ends
       a pan is swallowed), so panning across tappable holes is safe.
     - Zooming works by narrowing the svg's own viewBox, so lines and text stay
       sharp. If anything else changes the viewBox (a quiz swapping figures
       per question), that becomes the new full view and the zoom resets.
       The full view is kept in svg.dataset.baseViewBox (print uses it).

   InPlaceZoom.attachUnit(el, { barAbove })
     - Zooms a whole block of the page (several diagrams and whatever sits
       between them) as ONE unit, so the gaps scale with the diagrams. Same
       buttons (top-right of el), drag/wheel/pinch rules and 50%–200% range;
       scales el's contents with a CSS transform and clips to el's box.
       Taps are left to the page (like tapToZoom off). barAbove: buttons in a
       strip just above el instead of over its top-right corner.

   quiz-engine.js attaches this automatically to every quiz circuit panel
   that used to open the zoom pop-up; other pages include this file and call
   attach() themselves.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  if (window.InPlaceZoom) return;

  const MAX = 2, MIN = 0.5, TAP_SCALE = 2, DRAG_PX = 6;
  // +/− move in 10% steps on a 10% grid (so 100% is always reachable);
  // wheel/pinch are smooth but settle on 100% when they pass within 4% of it.
  const stepScale = (s, dir) => Math.round(s * 10 + dir) / 10;
  const settle = s => { s = Math.min(MAX, Math.max(MIN, s)); return Math.abs(s - 1) < 0.04 ? 1 : s; };

  function injectStyle() {
    if (document.getElementById('inplaceZoomStyle')) return;
    const st = document.createElement('style');
    st.id = 'inplaceZoomStyle';
    st.textContent = `
.ipz-controls { position:absolute; right:.5rem; top:.5rem; display:flex; gap:.3rem; z-index:5; }
.ipz-controls.ipz-row { position:static; justify-content:flex-end; margin:0 0 .3rem; }
.ipz-controls button {
  width:2rem; height:2rem; padding:0; border-radius:6px; cursor:pointer;
  font:700 1.05rem/1 system-ui, sans-serif;
  background:var(--colour-panel, #fff); color:var(--colour-text, #1e293b);
  border:1px solid var(--colour-border, #cbd5e1); opacity:.85;
  display:flex; align-items:center; justify-content:center;
}
.ipz-controls button:hover { opacity:1; }
.ipz-controls button:disabled { opacity:.35; cursor:default; }
.ipz-controls .ipz-level { min-width:2.6rem; width:auto; font-size:.7rem; cursor:default; opacity:.7; padding:0 .3rem; }
svg.ipz-tap { cursor:zoom-in; }
svg.ipz-zoomed, .ipz-stage.ipz-zoomed { cursor:grab; }
svg.ipz-tap.ipz-zoomed { cursor:zoom-out; }
svg.ipz-panning, .ipz-stage.ipz-panning { cursor:grabbing !important; }
@media print { .ipz-controls { display:none; } }`;
    document.head.appendChild(st);
  }

  function parseVB(s) {
    const v = (s || '').trim().split(/[\s,]+/).map(Number);
    return v.length === 4 && v.every(isFinite) && v[2] > 0 && v[3] > 0 ? { x: v[0], y: v[1], w: v[2], h: v[3] } : null;
  }

  const groups = {};                               // group name → [controllers]

  function attach(svg, opts) {
    if (!svg || svg._ipz) return svg && svg._ipz;
    opts = opts || {};
    injectStyle();

    let base = parseVB(svg.getAttribute('viewBox'));
    if (!base) {                                   // no viewBox — use the drawn size
      const r = svg.getBoundingClientRect();
      base = { x: 0, y: 0, w: r.width || 300, h: r.height || 150 };
      svg.setAttribute('viewBox', `0 0 ${base.w} ${base.h}`);
    }
    let scale = 1, vx = base.x, vy = base.y, lastSet = svg.getAttribute('viewBox');
    svg.dataset.baseViewBox = lastSet;

    // ── controls ── (opts.wrap: give the svg its own box first, so the buttons
    // sit in the diagram's corner even when its parent holds other content)
    if (opts.wrap) {
      const w = document.createElement('div');
      w.className = 'ipz-wrap';
      w.style.position = 'relative';
      svg.parentNode.insertBefore(w, svg);
      w.appendChild(svg);
    }
    const host = svg.parentElement;
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    host.querySelectorAll(':scope > .zoom-hint').forEach(h => { h.style.display = 'none'; });
    const members = opts.group ? (groups[opts.group] = groups[opts.group] || []) : null;
    const hasBar = !members || members.length === 0;  // grouped: only the first gets buttons
    const bar = document.createElement('div');
    bar.className = 'ipz-controls';
    bar.innerHTML = '<button type="button" class="ipz-out" title="Zoom out" aria-label="Zoom out">−</button>'
      + '<button type="button" class="ipz-level" disabled aria-live="polite">100%</button>'
      + '<button type="button" class="ipz-in" title="Zoom in" aria-label="Zoom in">+</button>'
      + '<button type="button" class="ipz-reset" title="Reset zoom" aria-label="Reset zoom">⟲</button>';
    if (hasBar) {
      if (opts.barIn) {                                                            // a spot the page chose (e.g. a toolbar)
        bar.style.position = 'static';
        opts.barIn.insertBefore(bar, opts.barBefore || null);
      } else if (opts.wrap) { bar.classList.add('ipz-row'); host.insertBefore(bar, svg); }  // own strip above the diagram
      else host.appendChild(bar);                                                  // over its top-right corner
    }
    // Keep button clicks away from the panel's own onclick (and from the page).
    bar.addEventListener('click', e => e.stopPropagation());
    bar.addEventListener('pointerdown', e => e.stopPropagation());
    const bOut = bar.querySelector('.ipz-out'), bIn = bar.querySelector('.ipz-in'),
          bReset = bar.querySelector('.ipz-reset'), bLevel = bar.querySelector('.ipz-level');
    if (opts.tapToZoom) svg.classList.add('ipz-tap');

    function clamp() {                           // zoomed out below 100%: keep it centred
      const w = base.w / scale, h = base.h / scale;
      vx = w >= base.w ? base.x - (w - base.w) / 2 : Math.min(Math.max(vx, base.x), base.x + base.w - w);
      vy = h >= base.h ? base.y - (h - base.h) / 2 : Math.min(Math.max(vy, base.y), base.y + base.h - h);
    }
    function apply() {
      clamp();
      const w = base.w / scale, h = base.h / scale;
      lastSet = Math.abs(scale - 1) < 0.001 ? `${base.x} ${base.y} ${base.w} ${base.h}`
                            : `${+vx.toFixed(3)} ${+vy.toFixed(3)} ${+w.toFixed(3)} ${+h.toFixed(3)}`;
      svg.setAttribute('viewBox', lastSet);
      const zoomed = scale > 1.001;
      svg.classList.toggle('ipz-zoomed', zoomed);
      // Zoomed: one finger pans the diagram. Unzoomed: one finger scrolls the page.
      svg.style.touchAction = zoomed ? 'none' : 'pan-x pan-y';
      bOut.disabled = scale <= MIN + 0.001;
      bReset.disabled = Math.abs(scale - 1) < 0.001;
      bIn.disabled = scale >= MAX - 0.001;
      bLevel.textContent = Math.round(scale * 100) + '%';
      if (opts.onChange) opts.onChange(scale);
    }
    // Screen point → svg user units (allows for preserveAspectRatio letterboxing).
    function toUser(cx, cy) {
      const m = svg.getScreenCTM();
      if (!m) return { x: vx + base.w / scale / 2, y: vy + base.h / scale / 2 };
      const p = new DOMPoint(cx, cy).matrixTransform(m.inverse());
      return { x: p.x, y: p.y };
    }
    function zoomAt(cx, cy, newScale, fromGroup) {
      newScale = settle(newScale);
      if (cx == null) {                            // buttons: zoom about the middle of the view
        const r = svg.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      }
      const p = toUser(cx, cy);
      const w0 = base.w / scale, h0 = base.h / scale, w1 = base.w / newScale, h1 = base.h / newScale;
      vx = p.x - (p.x - vx) * (w1 / w0);
      vy = p.y - (p.y - vy) * (h1 / h0);
      scale = newScale;
      apply();
      if (members && !fromGroup) members.forEach(m => { if (m !== ctrl) m._zoom(scale); });
    }
    function reset(fromGroup) {
      scale = 1; vx = base.x; vy = base.y; apply();
      if (members && fromGroup !== true) members.forEach(m => { if (m !== ctrl) m._reset(); });
    }

    bIn.addEventListener('click', () => zoomAt(null, null, stepScale(scale, +1)));
    bOut.addEventListener('click', () => zoomAt(null, null, stepScale(scale, -1)));
    bReset.addEventListener('click', () => reset());

    // ── someone else changed the viewBox → new full view ──
    new MutationObserver(() => {
      const now = svg.getAttribute('viewBox');
      if (now === lastSet) return;
      const b = parseVB(now);
      if (!b) return;
      base = b; svg.dataset.baseViewBox = now; scale = 1; vx = b.x; vy = b.y; lastSet = now;
      apply();
    }).observe(svg, { attributes: true, attributeFilter: ['viewBox'] });

    // ── wheel ──
    svg.addEventListener('wheel', e => {
      if (!e.ctrlKey && Math.abs(scale - 1) < 0.001) return;   // unzoomed: let the page scroll
      e.preventDefault();
      const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025));
      zoomAt(e.clientX, e.clientY, scale * f);
    }, { passive: false });

    // ── pointers: drag to pan, two fingers to pinch ──
    const pts = new Map();
    let dragged = false, startX = 0, startY = 0, pinch = null;
    svg.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest && e.target.closest('input, select, textarea, button, a, label')) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { dragged = false; startX = e.clientX; startY = e.clientY; }
      if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: scale };
        dragged = true;
      }
    });
    svg.addEventListener('pointermove', e => {
      const prev = pts.get(e.pointerId);
      if (!prev) return;
      const cur = { x: e.clientX, y: e.clientY };
      pts.set(e.pointerId, cur);
      if (pts.size >= 2 && pinch) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.s * d / pinch.d);
        return;
      }
      if (scale <= 1.001) return;                  // nothing to pan
      if (!dragged && Math.hypot(cur.x - startX, cur.y - startY) < DRAG_PX) return;
      if (!dragged) { dragged = true; try { svg.setPointerCapture(e.pointerId); } catch (_) {} svg.classList.add('ipz-panning'); }
      const m = svg.getScreenCTM();
      const k = m ? 1 / m.a : base.w / scale / (svg.getBoundingClientRect().width || 1);
      vx -= (cur.x - prev.x) * k;
      vy -= (cur.y - prev.y) * k;
      apply();
    });
    function up(e) {
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (pts.size === 0) svg.classList.remove('ipz-panning');
    }
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', up);

    // A drag/pinch must not count as a tap on whatever it ended over.
    svg.addEventListener('click', e => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; return; }
      if (opts.tapToZoom) {
        e.stopPropagation();
        if (Math.abs(scale - 1) >= 0.001) reset(); else zoomAt(e.clientX, e.clientY, TAP_SCALE);
      }
    }, true);

    const ctrl = {
      reset: () => reset(),
      zoomAt: (s) => zoomAt(null, null, s),
      get scale() { return scale; },
      _zoom: (s) => zoomAt(null, null, s, true),  // from another group member
      _reset: () => reset(true),
    };
    if (members) { members.push(ctrl); if (members.length > 1) zoomAt(null, null, members[0].scale, true); }
    apply();
    return (svg._ipz = ctrl);
  }

  // ── a whole block as one unit (CSS transform on a stage inside el) ──
  function attachUnit(el, opts) {
    if (!el || el._ipz) return el && el._ipz;
    opts = opts || {};
    injectStyle();
    const stage = document.createElement('div');
    stage.className = 'ipz-stage';
    stage.style.transformOrigin = '0 0';
    // fill el and be the box absolutely-placed children measure from, zoomed or not
    // (a transform would otherwise switch their containing block mid-zoom)
    stage.style.position = 'relative';
    stage.style.height = '100%';
    while (el.firstChild) stage.appendChild(el.firstChild);
    el.appendChild(stage);
    if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
    el.style.overflow = 'hidden';

    const bar = document.createElement('div');
    bar.className = 'ipz-controls';
    bar.innerHTML = '<button type="button" class="ipz-out" title="Zoom out" aria-label="Zoom out">−</button>'
      + '<button type="button" class="ipz-level" disabled aria-live="polite">100%</button>'
      + '<button type="button" class="ipz-in" title="Zoom in" aria-label="Zoom in">+</button>'
      + '<button type="button" class="ipz-reset" title="Reset zoom" aria-label="Reset zoom">⟲</button>';
    if (opts.barAbove) { bar.classList.add('ipz-row'); el.parentNode.insertBefore(bar, el); }  // own strip above el
    else el.appendChild(bar);                                                                  // over el's top-right corner
    bar.addEventListener('click', e => e.stopPropagation());
    bar.addEventListener('pointerdown', e => e.stopPropagation());
    const bOut = bar.querySelector('.ipz-out'), bIn = bar.querySelector('.ipz-in'),
          bReset = bar.querySelector('.ipz-reset'), bLevel = bar.querySelector('.ipz-level');

    let scale = 1, tx = 0, ty = 0;
    const W = () => stage.offsetWidth, H = () => stage.offsetHeight;  // unscaled size (transforms don't change layout)
    function clamp() {
      const w = W() * scale, h = H() * scale;
      tx = w <= W() ? (W() - w) / 2 : Math.min(0, Math.max(W() - w, tx));
      ty = h <= H() ? (H() - h) / 2 : Math.min(0, Math.max(H() - h, ty));
    }
    function apply() {
      clamp();
      const one = Math.abs(scale - 1) < 0.001;
      stage.style.transform = one ? '' : `translate(${tx}px, ${ty}px) scale(${scale})`;
      const zoomed = scale > 1.001;
      stage.classList.toggle('ipz-zoomed', zoomed);
      stage.style.touchAction = zoomed ? 'none' : 'pan-x pan-y';
      bOut.disabled = scale <= MIN + 0.001;
      bReset.disabled = one;
      bIn.disabled = scale >= MAX - 0.001;
      bLevel.textContent = Math.round(scale * 100) + '%';
    }
    // client point → position inside the stage's unscaled box
    function local(cx, cy) {
      const r = stage.getBoundingClientRect();     // includes the transform
      return { x: (cx - r.left) / scale, y: (cy - r.top) / scale };
    }
    function zoomAt(cx, cy, newScale) {
      newScale = settle(newScale);
      const box = el.getBoundingClientRect();
      if (cx == null) { cx = box.left + box.width / 2; cy = box.top + box.height / 2; }
      const p = local(cx, cy), sr = stage.getBoundingClientRect();
      const ox = sr.left - tx, oy = sr.top - ty;   // stage origin with no transform
      tx = (cx - ox) - p.x * newScale;
      ty = (cy - oy) - p.y * newScale;
      scale = newScale;
      apply();
    }
    function reset() { scale = 1; tx = ty = 0; apply(); }
    bIn.addEventListener('click', () => zoomAt(null, null, stepScale(scale, +1)));
    bOut.addEventListener('click', () => zoomAt(null, null, stepScale(scale, -1)));
    bReset.addEventListener('click', reset);

    stage.addEventListener('wheel', e => {
      if (!e.ctrlKey && Math.abs(scale - 1) < 0.001) return;
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, scale * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)));
    }, { passive: false });

    const pts = new Map();
    let dragged = false, sx = 0, sy = 0, pinch = null;
    stage.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest && e.target.closest('input, select, textarea, button, a, label')) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { dragged = false; sx = e.clientX; sy = e.clientY; }
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: scale }; dragged = true; }
    });
    stage.addEventListener('pointermove', e => {
      const prev = pts.get(e.pointerId);
      if (!prev) return;
      const cur = { x: e.clientX, y: e.clientY };
      pts.set(e.pointerId, cur);
      if (pts.size >= 2 && pinch) {
        const [a, b] = [...pts.values()];
        zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
        return;
      }
      if (scale <= 1.001) return;
      if (!dragged && Math.hypot(cur.x - sx, cur.y - sy) < DRAG_PX) return;
      if (!dragged) { dragged = true; try { stage.setPointerCapture(e.pointerId); } catch (_) {} stage.classList.add('ipz-panning'); }
      tx += cur.x - prev.x; ty += cur.y - prev.y;
      apply();
    });
    function up(e) { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) stage.classList.remove('ipz-panning'); }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
    stage.addEventListener('click', e => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; }
    }, true);

    apply();
    return (el._ipz = { reset, zoomAt: s => zoomAt(null, null, s), get scale() { return scale; } });
  }

  window.InPlaceZoom = { attach, attachUnit };
})();

</script>

  <script>
// Dark/light toggle for the college pages (the student pages use assets/theme-init.js instead).
// The preference is the same localStorage key the hand-made college pages used.
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark-theme');
  localStorage.setItem('tafe-quiz-theme', isDark ? 'dark' : 'light');
  updateThemeToggleUI(isDark);
}

function updateThemeToggleUI(isDark) {
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (icon && label) {
    icon.textContent = isDark ? '☀️' : '🌙';
    label.textContent = isDark ? 'Light Mode' : 'Dark Mode';
  }
}

(function initTheme() {

  document.body.classList.toggle('dark-theme', isDark);
  updateThemeToggleUI(isDark);
})();

</script>
  <script>
    // ── 74193 counter simulator ────────────────────────────────────────────────
    // State: cnt (0-15, the 4-bit count Q_D Q_C Q_B Q_A), clk (the clock level), and the levels at the control pins:
    // cIn (C, clear — active HIGH), ldIn (LD-bar, load — active LOW), andIn/andOut (the AND gate of the Mod-6 up
    // counter). Every wire that carries a changed level to a pin is a "net": the level is sent along it (a visible
    // sweep) and only takes effect when it ARRIVES. A small discrete-event engine models propagation delay.
    const SPEEDS = { normal: { gate: 780, wire: 2304, clear: 780 }, fast: { gate: 380, wire: 1140, clear: 380 } };   // wire: the time a level takes to travel the longest wire
    let speed = 'normal';
    let direction = 'up', mod = 16;   // (named 'direction', not 'dir': inline onclick handlers see the button's own .dir property first)
    let cnt = 0, cIn = 0, ldIn = 1, clk = 0, andIn = [0, 0], andOut = 0, boSent = 1;
    let pendingCnt = null, pendingAnd = null, flights = {}, events = [], seq = 0, loopOn = false;
    let phase = 'idle', auto = false, autoTimer = null;

    const HIGH = 'var(--colour-ui-correct)', LOW = 'var(--colour-label)';
    const col = (v) => v ? HIGH : LOW;

    // ── pin badges: a small 0 / 1 pops up at a pin when the level there CHANGES, holds for a beat, then the next part reacts ──
    const STEP = { normal: 520, fast: 260, turbo: 0 };      // turbo (where there is one) is for running the count up quickly: no badges, no beat
    const stepMs = () => STEP[speed] || 0;
    const ARRIVE_PAUSE = () => (stepMs() ? 150 : 0);        // the dot has gone and the line is complete for a moment before the badge pops up
    let pinLv = {};                                         // each pin's last known level: a badge only shows when it changes
    const badge = (id, x, y) => `<g id="b-${id}" visibility="hidden" transform="translate(${x},${y})"><g class="pin-inner"><rect x="-11" y="-11" width="22" height="22" rx="5" style="stroke: var(--colour-panel)" stroke-width="2" /><text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" style="fill: var(--colour-panel)"></text></g></g>`;
    function flashPin(id, val) {
      const ms = stepMs() * 0.9, g = document.getElementById('b-' + id), changed = pinLv[id] !== val;
      pinLv[id] = val;
      if (!g || !ms || !changed) return;
      const inner = g.firstChild;
      inner.firstChild.style.fill = col(val); inner.lastChild.textContent = val;
      g.setAttribute('visibility', 'visible');
      inner.classList.remove('pin-pop'); void inner.getBoundingClientRect(); inner.classList.add('pin-pop');   // restart the pop
      if (g._hide) g._hide.dead = true;
      g._hide = sched(ms, () => g.setAttribute('visibility', 'hidden'));
    }
    const hideBadges = () => document.querySelectorAll('#simSvg [id^="b-"]').forEach(g => g.setAttribute('visibility', 'hidden'));
    const beat = (fn) => { const u = stepMs(); if (u) sched(u, fn); else fn(); };   // hold for one beat (the badge shows), then carry on
    // the dot riding at the leading edge of a travelling line; it vanishes on reaching the pin
    const dotSvg = (id) => `<circle id="d-${id}" r="7" stroke-width="2.5" style="display:none; stroke: var(--colour-panel)" />`;
    function sweepDot(id, ov, f, now) {
      const dot = document.getElementById('d-' + id); if (!dot) return;
      if (!f) { dot.style.display = 'none'; return; }
      const L = ov.getTotalLength(), p = Math.max(0, Math.min(1, (now - f.t0) / (f.t1 - f.t0)));
      if (p >= 1) { dot.style.display = 'none'; return; }
      const pt = ov.getPointAtLength(L * p);
      dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); dot.style.fill = col(f.val); dot.style.display = '';
    }
    const bit = (n, b) => (n >> b) & 1;
    const bin = (n) => [3, 2, 1, 0].map(b => bit(n, b)).join('');
    const names = (b) => 'ABCD'[b];
    const loadVal = () => mod - 1;                           // down Mod-6/8: the value LOADed on underflow (D inputs)
    const startCount = () => direction === 'up' ? 0 : (mod === 16 ? 15 : loadVal());
    const hasClear = () => direction === 'up' && mod !== 16;       // C driven by the circuit (else tied LOW)
    const hasLoad = () => direction === 'down' && mod !== 16;      // LD-bar driven by BO-bar (else held HIGH)
    const boLevel = () => (direction === 'down' && cnt === 0 && clk === 0) ? 0 : 1;   // borrow out (active LOW): at 0 while the clock is LOW
    const coLevel = () => (direction === 'up' && cnt === 15 && clk === 0) ? 0 : 1;    // carry out (active LOW): at 15 while the clock is LOW

    // geometry (viewBox starts at x=20)
    const CX0 = 140, CX1 = 470, CY0 = 170, CY1 = 330;     // the chip
    const PINX = [365, 310, 255, 200];                      // output / data pin x for bit 0 (QA) .. bit 3 (QD)
    const NETS = {                                          // wire paths
      fb: 'M 200,130 L 80,130 L 80,372 L 420,372 L 420,330',                 // Mod-8 up: QD junction -> left -> along the bottom -> up into C
      fbC: 'M 255,125 L 72,125 L 72,315 L 100,315',                           // Mod-6 up: QC -> AND lower input
      fbB: 'M 310,145 L 90,145 L 90,297 L 100,297',                           // Mod-6 up: QB -> AND upper input
      andC: 'M 134,306 L 134,372 L 420,372 L 420,330',                        // Mod-6 up: AND output -> C
      bo: 'M 105,265 L 80,265 L 80,45 L 420,45 L 420,170',                    // down Mod-6/8: BO-bar -> LD-bar
    };
    const netsForConfig = () => hasClear() ? (mod === 8 ? ['fb'] : ['fbC', 'fbB', 'andC']) : hasLoad() ? ['bo'] : [];

    const TEXT = {
      'up-8': 'Here the <b>74193</b> counts <b>up</b> on the clock input <b>CU</b>, and the <b>QD</b> output (the most significant bit) is wired back to the <b>C</b> (clear) input. When the count reaches <b>8 (1000)</b>, QD goes HIGH — see where that 1 travels, and what it does when it gets there.',
      'up-6': 'The <b>74193</b> counts <b>up</b> on <b>CU</b>. <b>QC</b> and <b>QB</b> feed an <b>AND gate</b> whose output drives the <b>C</b> (clear) input. At <b>6 (0110)</b> both are HIGH, so the AND gate goes HIGH — follow the 1s to see what clears the counter.',
      'up-16': 'The <b>74193</b> counts <b>up</b> on <b>CU</b> with nothing wired back: <b>C</b> is tied LOW so it never clears. It counts <b>0 – 15</b> and wraps. Watch <b><span class="ov">CO</span></b> (carry out) at 15 — it goes LOW while the clock is LOW, the pulse that clocks the next counter in a cascade.',
      'down-8': 'The <b>74193</b> counts <b>down</b> on <b>CD</b> (CU is held HIGH). The borrow output <b><span class="ov">BO</span></b> is wired to <b><span class="ov">LD</span></b> (load), and the data inputs are tied to <b>0111 (7)</b>. When the count reaches 0 and the clock goes LOW, BO goes LOW — see what happens next.',
      'down-6': 'The <b>74193</b> counts <b>down</b> on <b>CD</b> (CU is held HIGH). The borrow output <b><span class="ov">BO</span></b> is wired to <b><span class="ov">LD</span></b> (load), and the data inputs are tied to <b>0101 (5)</b>. When the count reaches 0 and the clock goes LOW, BO goes LOW — see what happens next.',
      'down-16': 'The <b>74193</b> counts <b>down</b> on <b>CD</b> (CU is held HIGH) with nothing reloaded: <b><span class="ov">LD</span></b> is held HIGH. It counts <b>15 – 0</b> and wraps. Watch <b><span class="ov">BO</span></b> (borrow out) at 0 — it goes LOW while the clock is LOW, the pulse that clocks the next counter in a cascade.',
    };

    function buildSvg() {
      const up = direction === 'up', clkY = up ? 215 : 260;
      let s = '';
      // 5V: Vcc always; LD-bar when it is not driven by BO-bar; the unused clock input (CD for up, CU for down)
      const ldOn5V = !hasLoad();
      s += `<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" style="stroke: var(--colour-ui-correct)">
              <path d="M 455,170 L 455,120 L 500,120 L 500,${up ? 260 : 215} L 470,${up ? 260 : 215}" />
              ${ldOn5V ? '<path d="M 420,170 L 420,120 L 455,120" />' : ''}
            </g>
            <circle cx="455" cy="120" r="4" style="fill: var(--colour-ui-correct)" />${ldOn5V ? '<circle cx="420" cy="120" r="4" style="fill: var(--colour-ui-correct)" />' : ''}
            <text x="510" y="126" font-size="16" font-weight="bold" style="fill: var(--colour-ui-correct)">5V</text>`;
      // chip
      s += `<rect x="${CX0}" y="${CY0}" width="${CX1 - CX0}" height="${CY1 - CY0}" rx="4" style="fill: var(--colour-panel); stroke: var(--colour-border)" stroke-width="3" />`;
      // GND, and C tied LOW when nothing drives it
      s += `<g fill="none" stroke-width="3" style="stroke: var(--colour-label)">
              <path d="M 455,${CY1} L 455,385" /><path d="M 440,385 L 470,385" /><path d="M 446,392 L 464,392" /><path d="M 451,399 L 459,399" />
              ${hasClear() ? '' : '<path d="M 420,330 L 420,385 L 455,385" />'}
            </g>${hasClear() ? '' : '<circle cx="455" cy="385" r="4" style="fill: var(--colour-label)" />'}`;
      // carry / borrow stubs on the left (coloured when they are doing something)
      s += `<path id="stub-co" d="M 105,205 L ${CX0},205" fill="none" stroke-width="3" />
            <path id="stub-bo" d="M 105,265 L ${CX0},265" fill="none" stroke-width="3" />`;
      if (up && mod === 16) s += `<text id="coTxt" x="100" y="211" text-anchor="end" font-size="16" font-weight="bold"></text>`;
      if (!up && mod === 16) s += `<text id="boTxt" x="100" y="271" text-anchor="end" font-size="16" font-weight="bold"></text>`;
      // data inputs (tied to the load value when LD-bar is used) and pin names
      const dv = hasLoad() ? loadVal() : null;
      for (let b = 0; b < 4; b++) {
        const x = PINX[b], c = dv === null ? 'var(--colour-label)' : col(bit(dv, b));
        s += `<path d="M ${x},${CY1} L ${x},350" fill="none" stroke-width="3" style="stroke: ${c}" />`;
        if (dv !== null) s += `<text x="${x}" y="372" text-anchor="middle" font-size="20" font-weight="bold" style="fill: ${c}">${bit(dv, b)}</text>`;
      }
      if (dv !== null) s += `<text x="282" y="400" text-anchor="middle" font-size="13" style="fill: var(--colour-label)">D = ${bin(dv)} (${dv}) loaded when <tspan class="ov">LD</tspan> goes LOW</text>`;
      const lab = (x, y, t, anchor) => `<text x="${x}" y="${y}" text-anchor="${anchor || 'middle'}" font-size="13" style="fill: var(--colour-label)">${t}</text>`;
      s += [3, 2, 1, 0].map(b => lab(PINX[b], 192, `Q<tspan baseline-shift="sub" font-size="9">${names(b)}</tspan>`)).join('');
      s += [3, 2, 1, 0].map(b => lab(PINX[b], 322, `D<tspan baseline-shift="sub" font-size="9">${names(b)}</tspan>`)).join('');
      s += lab(CX0 + 8, 209, '<tspan style="text-decoration:overline">CO</tspan>', 'start') + lab(CX0 + 8, 269, '<tspan style="text-decoration:overline">BO</tspan>', 'start');
      s += lab(420, 192, '<tspan style="text-decoration:overline">LD</tspan>') + lab(455, 192, 'Vcc');
      s += lab(CX1 - 24, 219, 'CU', 'end') + lab(CX1 - 24, 264, 'CD', 'end') + lab(420, 322, 'C') + lab(455, 322, 'GND');
      // active-edge notch on the clock input, the clock wire, and the CLK / AUTO CLK switches
      s += `<path d="M ${CX1},${clkY - 8} L ${CX1 - 10},${clkY} L ${CX1},${clkY + 8}" fill="none" stroke-width="2" style="stroke: var(--colour-label)" />`;
      s += `<path id="w-clk" d="M ${CX1},${clkY} L 520,${clkY}" fill="none" stroke-width="3" />`;
      s += `<g class="sw" id="swClk" tabindex="0" role="button" aria-label="Send a clock pulse">
              <rect class="sw-box" x="520" y="${clkY - 22}" width="100" height="44" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-border)" stroke-width="2" />
              <text x="570" y="${clkY + 6}" text-anchor="middle" font-size="18" font-weight="bold" style="fill: var(--colour-text)">CLK</text>
            </g>
            <g class="sw" id="swAuto" tabindex="0" role="button" aria-pressed="false" aria-label="Auto clock">
              <rect class="sw-box" x="520" y="${clkY + 30}" width="100" height="44" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-border)" stroke-width="2" />
              <text x="570" y="${clkY + 58}" text-anchor="middle" font-size="16" font-weight="bold" style="fill: var(--colour-text)">AUTO CLK</text>
            </g>`;
      // output stubs + arrow heads + digits
      for (let b = 0; b < 4; b++) {
        const x = PINX[b];
        s += `<path id="w-q${b}" d="M ${x},${CY0} L ${x},108" fill="none" stroke-width="3" stroke-linecap="round" />
              <polygon id="a-q${b}" points="${x - 7},110 ${x},96 ${x + 7},110" />
              <text id="dig${b}" x="${x}" y="78" text-anchor="middle" font-size="30" font-weight="bold"></text>`;
      }
      s += `<text x="282" y="30" text-anchor="middle" font-size="14" style="fill: var(--colour-label)">Binary count output</text>`;
      // the AND gate of the Mod-6 up counter
      if (up && mod === 6) {
        s += `<path d="M 100,288 L 116,288 A 18,18 0 0 1 116,324 L 100,324 Z" style="fill: var(--colour-panel); stroke: var(--colour-border)" stroke-width="3" />
              <text x="110" y="311" text-anchor="middle" font-size="14" style="fill: var(--colour-label)">&amp;</text>
              <circle cx="255" cy="125" r="5" id="j-c" /><circle cx="310" cy="145" r="5" id="j-b" />`;
      }
      if (up && mod === 8) s += `<circle cx="200" cy="130" r="5" id="j-d" /><text x="88" y="150" font-size="12" style="fill: var(--colour-label)">feedback</text>`;
      // the wires that carry a changed level to a pin, with a travelling sweep on top
      const ids = netsForConfig();
      s += `<g fill="none" stroke-linejoin="round" stroke-linecap="round">` +
        ids.map(id => `<path id="w-${id}" d="${NETS[id]}" stroke-width="3" /><path id="o-${id}" d="${NETS[id]}" stroke-width="4.5" />${dotSvg(id)}`).join('') + `</g>`;
      // the value at the pin being driven
      if (hasClear()) s += `<text id="pinTxt" x="412" y="400" text-anchor="end" font-size="20" font-weight="bold"></text>`;
      if (hasLoad()) s += `<text id="pinTxt" x="428" y="72" text-anchor="start" font-size="20" font-weight="bold"></text>`;
      // the 0 / 1 badges: the clock pin, C, LD-bar, the AND gate's pins and BO-bar
      s += badge('ck', 495, clkY) + badge('c', 420, 352) + badge('ld', 420, 150) + badge('a1', 86, 315) + badge('a2', 86, 297) + badge('ao', 134, 336) + badge('bo', 122, 265);
      document.getElementById('simSvg').innerHTML = s;
      const g = document.getElementById('swClk'), a = document.getElementById('swAuto');
      g.addEventListener('click', pulse);
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pulse(); } });
      a.addEventListener('click', toggleAuto);
      a.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAuto(); } });
    }

    // ── event engine (same shape as the SR latch simulator) ──
    function sched(dt, fn) {
      const e = { t: performance.now() + dt, fn, dead: false, id: ++seq };
      events.push(e); startLoop(); return e;
    }
    function startLoop() { if (!loopOn) { loopOn = true; requestAnimationFrame(tick); } }
    function tick() {
      const now = performance.now();
      events.sort((a, b) => a.t - b.t);
      while (events.length && events[0].t <= now) {
        const e = events.shift();
        if (!e.dead) e.fn();
      }
      events = events.filter(e => !e.dead);
      render(now);
      if (events.length || Object.keys(flights).length) requestAnimationFrame(tick); else loopOn = false;
    }
    const busy = () => events.length > 0 || Object.keys(flights).length > 0 || !!pendingCnt || !!pendingAnd;
    const jitter = (ms) => ms * (0.9 + 0.2 * Math.random());

    // A clock pulse: HIGH for a moment, then LOW. The rising edge counts (up or down) after the propagation delay;
    // the carry / borrow outputs act while the clock is LOW.
    function pulse() {
      if (busy()) return false;               // wait for the circuit to settle first
      clk = 1;
      flashPin('ck', 1);
      phase = 'clocked';
      const gate = jitter(SPEEDS[speed].gate);
      const next = direction === 'up' ? (cnt + 1) & 15 : (cnt - 1) & 15;
      pendingCnt = { val: next, ev: sched(gate, () => applyCount(next, 'count')) };
      sched(gate * 1.35, () => { clk = 0; flashPin('ck', 0); onSignals(); });
      startLoop(); render(performance.now());
      return true;
    }
    function applyCount(v, why) {
      const old = cnt;
      cnt = v; pendingCnt = null;
      phase = why === 'count' ? 'counted' : why;           // 'counted' | 'clear' | 'load'
      if (why === 'count') {
        if (hasClear() && mod === 8 && cnt === 8) phase = 'eight';
        if (hasClear() && mod === 6 && cnt === 6) phase = 'six';
        if (hasLoad() && cnt === 0) phase = 'zero';
      }
      if (why === 'clear') phase = 'cleared';
      if (why === 'load') phase = 'loaded';
      if (hasClear() && mod === 8 && bit(cnt, 3) !== bit(old, 3)) sendNet('fb', bit(cnt, 3));
      if (hasClear() && mod === 6) {
        if (bit(cnt, 2) !== bit(old, 2)) sendNet('fbC', bit(cnt, 2));
        if (bit(cnt, 1) !== bit(old, 1)) sendNet('fbB', bit(cnt, 1));
      }
      onSignals();
    }
    // borrow out -> LD-bar: whenever BO-bar changes, send the new level along its wire
    function onSignals() {
      if (hasLoad()) {
        const b = boLevel();
        if (b !== boSent) { boSent = b; if (b === 0) phase = 'borrow'; flashPin('bo', b); beat(() => sendNet('bo', b)); }
      }
    }
    function sendNet(id, val) {
      const now = performance.now(), dur = SPEEDS[speed].wire, tok = ++seq;
      flights[id] = { val, t0: now, t1: now + dur, tok };
      sched(dur + ARRIVE_PAUSE(), () => arrive(id, val, tok));
    }
    function arrive(id, val, tok) {
      if (flights[id] && flights[id].tok === tok) delete flights[id];
      if (id === 'fb' || id === 'andC') { cIn = val; flashPin('c', val); beat(clearCheck); }
      else if (id === 'fbC') { andIn[0] = val; flashPin('a1', val); beat(reevalAnd); }
      else if (id === 'fbB') { andIn[1] = val; flashPin('a2', val); beat(reevalAnd); }
      else if (id === 'bo') { ldIn = val; flashPin('ld', val); beat(loadCheck); }
    }
    function reevalAnd() {
      const target = andIn[0] && andIn[1] ? 1 : 0;
      if (pendingAnd) { if (pendingAnd.val === target) return; pendingAnd.ev.dead = true; pendingAnd = null; }
      if (target !== andOut) {
        pendingAnd = { val: target, ev: sched(jitter(SPEEDS[speed].gate * 0.6), () => { andOut = target; pendingAnd = null; if (target === 1) phase = 'andHigh'; flashPin('ao', target); beat(() => sendNet('andC', target)); }) };
      }
    }
    function clearCheck() {                    // C is active HIGH: an asynchronous clear
      if (cIn === 1 && cnt !== 0) {
        phase = 'clearing';
        pendingCnt = { val: 0, ev: sched(jitter(SPEEDS[speed].clear), () => applyCount(0, 'clear')) };
      } else if (cIn === 0) phase = 'released';
    }
    function loadCheck() {                     // LD-bar is active LOW: an asynchronous load of D
      if (ldIn === 0 && cnt !== loadVal()) {
        phase = 'loading';
        pendingCnt = { val: loadVal(), ev: sched(jitter(SPEEDS[speed].clear), () => applyCount(loadVal(), 'load')) };
      } else if (ldIn === 1) phase = 'released';
    }

    // ── drawing ──
    function render(now) {
      now = now || performance.now();
      for (let b = 0; b < 4; b++) {
        const v = bit(cnt, b), c = col(v);
        document.getElementById('w-q' + b).setAttribute('stroke', c);
        document.getElementById('a-q' + b).style.fill = c;
        const d = document.getElementById('dig' + b);
        d.textContent = v; d.style.fill = c;
        // this digit is about to change (the counter is still "thinking"): blink the old value
        d.classList.toggle('out-flash', !!(pendingCnt && bit(pendingCnt.val, b) !== v));
      }
      // carry / borrow stubs
      const co = coLevel(), bo = boLevel();
      document.getElementById('stub-co').setAttribute('stroke', direction === 'up' && mod === 16 ? col(co) : 'var(--colour-label)');
      document.getElementById('stub-bo').setAttribute('stroke', direction === 'down' ? col(bo) : 'var(--colour-label)');
      const coT = document.getElementById('coTxt'), boT = document.getElementById('boTxt');
      if (coT) { coT.innerHTML = '<tspan class="ov">CO</tspan> = ' + co; coT.style.fill = col(co); }
      if (boT) { boT.innerHTML = '<tspan class="ov">BO</tspan> = ' + bo; boT.style.fill = col(bo); }
      // junction dots follow the output they are on
      const jd = document.getElementById('j-d'); if (jd) jd.style.fill = col(bit(cnt, 3));
      const jc = document.getElementById('j-c'); if (jc) jc.style.fill = col(bit(cnt, 2));
      const jb = document.getElementById('j-b'); if (jb) jb.style.fill = col(bit(cnt, 1));
      // wires: colour = the level at the pin they drive; the sweep shows a changed level travelling along them
      const destLevel = { fb: cIn, andC: cIn, fbC: andIn[0], fbB: andIn[1], bo: ldIn };
      netsForConfig().forEach(id => {
        document.getElementById('w-' + id).setAttribute('stroke', col(destLevel[id]));
        const ov = document.getElementById('o-' + id), f = flights[id];
        if (f) {
          const L = ov.getTotalLength(), p = Math.max(0, Math.min(1, (now - f.t0) / (f.t1 - f.t0)));
          ov.setAttribute('stroke', col(f.val));
          ov.setAttribute('stroke-dasharray', L);
          ov.setAttribute('stroke-dashoffset', L * (1 - p));
          ov.style.display = '';
        } else ov.style.display = 'none';
        sweepDot(id, ov, f, now);
      });
      const pt = document.getElementById('pinTxt');
      if (pt) {
        const lvl = hasClear() ? cIn : ldIn, f = hasClear() ? (flights.fb || flights.andC) : flights.bo;
        pt.innerHTML = (hasClear() ? 'C' : '<tspan class="ov">LD</tspan>') + ' = ' + lvl; pt.style.fill = col(lvl);
        // the value at the pin is about to change: in the final stretch of the sweep, blink the (old) value
        pt.classList.toggle('fb-flash', !!(f && (f.t1 - now) <= Math.min(800, SPEEDS[speed].wire * 0.6)));
      }
      // clock + auto switches
      document.getElementById('w-clk').setAttribute('stroke', col(clk));
      document.querySelector('#swClk rect').style.fill = clk ? 'rgba(var(--colour-ui-primary-rgb), .22)' : 'var(--colour-panel)';
      document.querySelector('#swAuto rect').style.fill = auto ? 'rgba(var(--colour-ui-primary-rgb), .22)' : 'var(--colour-panel)';
      renderStatus();
    }

    function statusBody() {
      const ov = (t) => `<span class="ov">${t}</span>`;
      const dn = direction === 'down';
      switch (phase) {
        case 'clocked': return `A <b>clock pulse</b> arrives. On its rising edge the counter ${dn ? 'subtracts' : 'adds'} 1 — but the outputs only change after a short <b>propagation delay</b> (the blinking digits are about to change).`;
        case 'counted': break;
        case 'eight': return '<b>QD has gone HIGH</b> — the count is 8 (1000). That 1 now <b>travels along the feedback wire</b> from QD to the <b>C (clear)</b> input. Until it arrives the counter has no idea anything is wrong.';
        case 'six': return '<b>QC and QB are both HIGH</b> — the count is 6 (0110). Their 1s now <b>travel along their wires</b> to the AND gate.';
        case 'andHigh': return 'Both AND inputs are 1, so the <b>AND gate output goes HIGH</b>. That 1 now travels along the wire to the <b>C (clear)</b> input.';
        case 'clearing': return 'The 1 has reached <b>C</b>. Clear is asserted, so the counter <b>resets to 0000</b> — straight away, without waiting for a clock pulse (the blinking digits are about to drop to 0).';
        case 'cleared': return mod === 8
          ? 'The counter is back at <b>0000</b>, so <b>QD is 0</b> again. That 0 now travels along the feedback wire to C…'
          : 'The counter is back at <b>0000</b>, so <b>QC and QB are 0</b> again. Their 0s travel to the AND gate, then on to C…';
        case 'released': return hasClear()
          ? `The 0 has reached <b>C</b>, releasing the clear. The counter is ready to count again from 0. Because ${mod} never lasts, it only ever settles on <b>0 – ${mod - 1}</b>: that is <b>Mod-${mod}</b>.`
          : `${ov('LD')} has gone HIGH again, so the load is released. The counter counts down again from <b>${loadVal()}</b>, so it only ever runs <b>${loadVal()} – 0</b>: that is <b>Mod-${mod}</b>.`;
        case 'zero': return `The count has reached <b>0</b>. The clock is still HIGH, so ${ov('BO')} is still HIGH. Wait for the clock to go LOW…`;
        case 'borrow': return `The count is 0 and the clock is LOW, so <b>${ov('BO')} (borrow out) goes LOW</b>. That 0 now <b>travels along the wire</b> from ${ov('BO')} to ${ov('LD')}.`;
        case 'loading': return `The 0 has reached ${ov('LD')}. <b>Load is asserted</b>, so the counter copies the D inputs — <b>${bin(loadVal())} (${loadVal()})</b> — straight away, without waiting for a clock pulse (the blinking digits are about to change).`;
        case 'loaded': return `The counter now holds <b>${bin(loadVal())}</b>, so ${ov('BO')} is HIGH again. That 1 travels back along the wire to ${ov('LD')} to release the load…`;
      }
      // idle / settled states
      if (direction === 'up' && mod === 16 && cnt === 15 && clk === 0) return `The count is <b>15 (1111)</b> and the clock is LOW, so <b>${ov('CO')} (carry out) is LOW</b>. That is the pulse a next counter in a cascade would be clocked with. The next clock pulse takes the count round to 0.`;
      if (direction === 'down' && mod === 16 && cnt === 0 && clk === 0) return `The count is <b>0 (0000)</b> and the clock is LOW, so <b>${ov('BO')} (borrow out) is LOW</b> — the pulse a next counter in a cascade would be clocked with. The next clock pulse takes the count round to 15.`;
      if (!dn && hasClear() && cnt === mod - 1) return `The count is ${cnt} (${bin(cnt)}), the highest number it can settle on. Send another pulse and watch what happens.`;
      return `Click <b>CLK</b> (or <b>AUTO CLK</b>) to ${dn ? 'subtract' : 'add'} 1 on each rising edge of the clock.`;
    }
    // While the signals are travelling the text stays still (it would change too fast to read); the explanation of the
    // settled state appears when the click has finished.
    function renderStatus() {
      const settling = busy();
      document.getElementById('simStatus').innerHTML =
        `<div>Count = <b>${cnt}</b> (<b>${bin(cnt)}</b>)${settling ? ' · <i>settling…</i>' : ''}</div><div style="margin-top:.35rem">${settling ? '<i>Watch the signals travel through the circuit…</i>' : statusBody()}</div>`;
    }

    function setConfig(d, m) {
      direction = d; mod = m;
      ['up', 'down'].forEach(k => { const b = document.getElementById('dir-' + k); b.classList.toggle('active', k === direction); b.setAttribute('aria-pressed', String(k === direction)); });
      [6, 8, 16].forEach(k => { const b = document.getElementById('mod-' + k); b.classList.toggle('active', k === mod); b.setAttribute('aria-pressed', String(k === mod)); });
      document.getElementById('subtitle').textContent = `Mod-${mod} ${direction === 'up' ? 'Up' : 'Down'}-Counter · 74193 · Simulator`;
      document.getElementById('introText').innerHTML = TEXT[direction + '-' + mod] + ' Click <b>CLK</b> to send a clock pulse (or <b>AUTO CLK</b> to keep sending them).';
      document.getElementById('resetBtn').textContent = '↺ Reset to ' + startCount();
      stopAuto();
      initState(); buildSvg(); render();
    }
    function initState() {
      events.forEach(e => e.dead = true); events = [];
      cnt = startCount(); cIn = 0; ldIn = 1; clk = 0; andIn = [0, 0]; andOut = 0; boSent = 1;
      pendingCnt = null; pendingAnd = null; flights = {}; phase = 'idle';
      pinLv = { ck: 0, c: 0, ld: 1, a1: 0, a2: 0, ao: 0, bo: 1 };
      hideBadges();
    }
    function resetSim() { initState(); render(); }
    function setSpeed(s) {
      speed = s;
      ['normal', 'fast'].forEach(k => document.getElementById('spd-' + k).classList.toggle('active', k === s));
    }
    function stopAuto() { auto = false; clearInterval(autoTimer); }
    function toggleAuto() {
      if (auto) stopAuto();
      else { auto = true; autoTimer = setInterval(() => { if (!busy()) pulse(); }, 900); }
      const a = document.getElementById('swAuto'); if (a) a.setAttribute('aria-pressed', String(auto));
      render();
    }

    setConfig('up', 16);      // opens on Up, Mod-16 (the plain free-running counter)
  </script>
