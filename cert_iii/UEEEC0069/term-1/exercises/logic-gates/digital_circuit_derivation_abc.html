<!--
  "Step through the circuit" derivation exercise for the PRACTICAL TEST circuit (the teacher's Figure 6 / Table 6):
  a 3-input circuit built from three ICs —
    7408 AND:            G0 = A·B                       (pins 1, 2 -> 3)
    7402 NOR as NOT (x2): C' and B'                     (gate 1: inputs 2+3 tied -> 1; gate 2: inputs 5+6 tied -> 4)
    7400 NAND:           G1 = NOT(A·B·C')               (pins 1, 2 -> 3)
                         G2 = NOT(B'·C)                 (pins 13, 12 -> 11)
                         Z  = NOT(G1·G2) = A·B·C' + B'·C (pins 4, 5 -> 6)
  Truth table (C B A -> Z): 000 0, 001 0, 010 0, 011 1, 100 1, 101 1, 110 0, 111 0 — matches the MEASURED column
  of the photographed Table 6 (the handwritten "theoretical" column there had a 1 in row 010, which is wrong).
  The 7402 pin numbers come from the 7402 pinout (1Y = 1, 1A/1B = 2/3, 2Y = 4, 2A/2B = 5/6); the handwritten
  sheet's "1 2" / "3 4" pin notes are ambiguous, so check against what is actually built.

  Same architecture as digital_circuit_derivation_ab.html (the _ab sibling this file's name was reserved for):
  ONE persistent circuit progressively revealed as the questions are answered (updateReveal(), driven by each
  fill question's own .ans flag), every answer landing in a box on its own wire. Q1 labels the 5 gate inputs,
  Q2 places all three first-level outputs at once (AND, top NAND, bottom NAND — like the _ab page's Q2), Q3-Q5
  build and simplify Z, and Q6 is the 3-input truth table. It is purely solving the circuit's equation. The styles are copied from the _ab page unchanged.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../../assets/theme-init.js"></script>
  <script src="../../../../assets/shapes.js"></script>
  <script src="../../../../assets/quiz-engine.js"></script>
  <title>Digital Electronics — Step Through the Practical Circuit (A, B, C)</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../assets/quiz-common.css">
  <script src="../../../../assets/breadcrumb.js" defer></script>
  <style>
    /* Dedicated per-file tokens for the A/B/C input signals — their own
       label text AND the wire segment running straight from that label
       to the first gate it feeds. Deliberately NOT reusing
       --colour-ideal/--colour-current (quiz-common.css's shared tokens,
       meant for other quiz types' own unrelated ideal-vs-actual/current
       diagrams) — --colour-current is literally identical to
       --colour-ui-correct in light theme (#16a34a both), and
       --colour-ideal is identical to --colour-ui-summary in both themes,
       so either one silently doubles as an existing UI-state colour
       instead of a signal identity of its own. Chosen to sit in the gaps
       between every hue already claimed on this page (cyan/blue =
       primary+wires, green = correct, red/pink = wrong, orange = restart
       + gate symbols, amber/gold = signal/Z, purple = summary): indigo,
       teal, and lime. */
    .progress-wrap { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; }
    /* Standard weight — a plain single-variable NOT bar, not deliberately
       thinned. The NAND-vs-plain-NOT distinction is carried by
       .ovl-outer/.ovl-outer2 being thicker than this (below), not by
       this being thinner than normal. */
    .ovl { text-decoration: overline; text-decoration-thickness: .09em; }
    /* Same bar, thickened — used everywhere sym() builds a single-variable
       NOT (Q2 onward: G1/G2/Z/step1/step2's pool chips, circuit boxes, and
       correctExplain banners), never for Q1's own SLOT_POOL bars (already
       fine at .ovl's own thickness, left untouched). User found the plain
       .ovl weight hard to read at a glance on a phone specifically in
       these more crowded, multi-tier boxes. */
    .ovl-thick { text-decoration: overline; text-decoration-thickness: .16em; }
    /* A raised, second overline over an already-negated sub-expression —
       used in pool chips, the correctExplain banner, and the
       foreignObject answer boxes on the circuit, ALL confirmed clean.
       Deliberately NOT used in any wrapping/multi-line prose (working
       panels, question prompts) — isolated with a standalone test page
       (kept in scratchpad) that ANY box-generating inline element here
       (border-top, box-shadow, background-image, even bare
       display:inline-block with no visible styling at all) causes a real
       Chromium rendering bug: an unrelated word earlier in the SAME
       wrapping paragraph — nowhere near the span itself — picks up a
       phantom underline, specifically right at that line's wrap point.
       ::before + position:absolute (this rule) doesn't dodge it either;
       every technique tried produced the same artifact. Prose that needs
       to show this double-negation instead uses the word "NOT (...)" and
       points at "the box above" rather than re-rendering the bar inline —
       see Q2/Q3/Q4's working text and Q5's question prompt. */
    /* padding-top:4px LOOKED separated in isolated testing earlier this
       session but turned out to visually merge into one bar on the real
       page — measured via getBoundingClientRect() that the outer bar and
       the inner .ovl text sat only ~1.7px apart despite the 4px padding
       being correctly applied (confirmed via getComputedStyle, not
       assumed). Re-isolated with a dedicated padding-top comparison test
       (4px/8px/12px side by side, kept in scratchpad) rather than
       tweaking the live file blind — 4px and 8px were both still
       ambiguous at this font-size, 12px was the first value that read as
       unmistakably two separate lines rather than one thick-ish one. */
    /* Real bug, iPhone Safari AND iOS Chrome (same WebKit engine under
       the hood) — reported by the user with a screenshot: any circuit
       answer box whose selected option used this raised bar rendered its
       ENTIRE value giant and displaced well outside its own box, while
       identical content in the (non-flex, not-in-a-foreignObject) pool
       chips was always fine. This rule used to be
       `position:relative` + a `content:''` `::before` pseudo-element with
       `position:absolute` to draw the bar — the ONLY place in the whole
       file combining position:relative/absolute with content living
       inside a foreignObject AND as a direct child of a flex container
       (.circuit-answer-html). Both are separately known categories of
       WebKit foreignObject bug (this session already found two others:
       percentage sizing, and dominant-baseline centring). Rather than
       guess which exact combination triggers it, removed the whole
       position:absolute pattern — a plain `border-top` directly on the
       element itself draws an identical line at the very top of the
       padding box with no `position` property involved at all. This is
       the SAME technique the Chromium wrapping-prose phantom-underline
       bug (see .ovl-thick's comment above) ruled out earlier in the
       session — but that bug was specifically about wrapping multi-line
       prose, a context .ovl-outer/.ovl-outer2 are deliberately never
       used in, so it doesn't apply here. */
    .ovl-outer { display: inline-block; padding-top: 12px; border-top: 3px solid currentColor; line-height: 1; }
    /* A THIRD tier, for when an expression that already carries its own
       .ovl-outer bar (e.g. G1's own answer) gets wrapped in yet another
       NOT on top of that (Q4, once G1/G2 are substituted back in as
       their real answers rather than shown as bare symbols). SAME
       padding-top as .ovl-outer (not more) — each tier's bar sits at the
       very top of its OWN box, so the gap to the tier immediately below
       is just that tier's own padding-top, full stop; it doesn't need to
       additionally account for how tall the nested tier below it turns
       out to be (that box starts fresh right where this padding ends,
       and ITS bar is drawn at ITS OWN top). Matching the two values is
       what keeps the 3rd-to-2nd gap the same size as the 2nd-to-1st gap
       — deliberately equal spacing, not "however much clearance the
       inner stack happens to need". Same 3px thickness as .ovl-outer too
       — both tiers are "a NAND's own bar", just at different heights
       when one wraps the other; the thickness contrast that matters is
       NAND-bar vs plain-NOT-bar, not tier vs tier. */
    .ovl-outer2 { display: inline-block; padding-top: 12px; border-top: 3px solid currentColor; line-height: 1; }
    /* padding-top is a fixed px value, not em-relative, so the SAME 12px
       reads as generously spaced next to the pool chips' own small
       (~12.5px) font but visibly cramped inside the circuit's own answer
       boxes, whose font grew to 28px in a later round (12px is a much
       smaller fraction of a bigger letter). Scoped here rather than
       changed on the shared base rule above — the pool/prose spacing is
       already correct at 12px and shouldn't move. Measured via
       getBoundingClientRect(), not guessed: at equal padding-top values
       the gap ABOVE .ovl-outer2 (governed by .ovl-outer2's own
       padding-top) consistently rendered ~1.1px larger than the gap
       above .ovl-outer (governed by .ovl-outer's own padding-top) at
       every value tried — a small, constant rendering asymmetry, not
       proportional noise — so the two values below are deliberately NOT
       equal; 22/20 was the pair that measured genuinely identical gaps
       (11.25px each), not just close. */
    .circuit-answer-html .ovl-outer { padding-top: 22px; }
    .circuit-answer-html .ovl-outer2 { padding-top: 20px; }
    /* Single-column throughout — the circuit lives inside the question
       card itself (see body markup), not a separate side panel. */
    .circuit-row { display: flex; align-items: center; gap: .5rem; }
    .circuit-panel {
      flex: 1;
      max-width: 660px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid var(--colour-ui-primary);
      cursor: default;
    }
    /* quiz-common.css's own light-theme override
       (:root[data-theme="light"] .circuit-panel { border-color: #e2e8f0; })
       has higher specificity than a plain .circuit-panel rule and silently
       wins in light theme otherwise — matching specificity here, later in
       the cascade, wins it back so the border is the real
       --colour-ui-primary blue, not a pale wash. */
    :root[data-theme="light"] .circuit-panel { border-color: var(--colour-ui-primary); }
    /* Back to the shared width:100% (no fixed pixel width, no
       overflow-x:auto) now that the circuit's own viewBox is cropped
       tightly to its actual content (getBBox() measured, not guessed) —
       the earlier fixed-900px-+ horizontal-scroll approach existed only
       to compensate for a viewBox with a lot of unused canvas around a
       small drawing; a tight viewBox scales up cleanly on its own. */
    .circuit-panel svg { margin: 0 auto; }
    /* No static box-shadow on the base rule — options-box has none in its
       own idle state either. The glow exists only inside the pulse
       animation below, matching options-box's "no shadow until active"
       pattern. NOT reusing matchPoolPulse itself — its
       --glow-match-pool-weak/strong variables are deliberately "none" in
       light theme (options-box's own light-theme cue is its dashed→solid
       border switch instead), but this panel's border is already
       always-solid-blue with no such switch to fall back on, so building
       the pulse straight from --colour-ui-primary-rgb (a real value in
       both themes) keeps it visible in both. */
    @keyframes circuitPanelPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(var(--colour-ui-primary-rgb), .12); }
      50% { box-shadow: 0 0 0 7px rgba(var(--colour-ui-primary-rgb), .35); }
    }
    .circuit-panel.needs-pick { animation: circuitPanelPulse 1.1s ease-in-out infinite; }
    /* Left of the box, same side as .fill-pool-arrow, so the flashing cue
       always appears in the same place regardless of which box (pool or
       circuit) it's currently pointing at. */
    .circuit-arrow {
      flex: 0 0 auto;
      font-size: 1rem;
      color: var(--colour-ui-primary);
      opacity: 0;
      transition: opacity .15s;
    }
    .circuit-arrow.needs-pick {
      opacity: 1;
      animation: fillArrowBounce .8s ease-in-out infinite;
    }
    /* Highlighted box around the MC options (Q5 only now) — plain/dashed
       normally, solid blue + pulsing while no option is picked yet. The
       .fill-pool box below reuses this exact same treatment for the
       Q1-Q4 chip pool. */
    .options-box {
      padding: .8rem;
      border: 2px dashed var(--colour-border);
      border-radius: var(--radius-lg);
      background: rgba(var(--colour-label-rgb), .05);
      transition: border-color .15s, background .15s;
    }
    .options-box.needs-pick {
      border-color: var(--colour-ui-primary);
      border-style: solid;
      background: rgba(var(--colour-ui-primary-rgb), .06);
      animation: matchPoolPulse 1.1s ease-in-out infinite;
    }
    .fill-pool-wrap { margin-top: .8rem; }
    .fill-pool-row { display: flex; align-items: center; gap: .5rem; }
    .fill-pool-arrow { font-size: 1rem; color: var(--colour-ui-primary); opacity: 0; transition: opacity .15s; }
    .fill-pool-row.needs-pick .fill-pool-arrow { opacity: 1; animation: fillArrowBounce .8s ease-in-out infinite; }
    @keyframes fillArrowBounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    .fill-pool {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: .5rem;
      padding: .8rem;
      border: 2px dashed var(--colour-border);
      border-radius: var(--radius-lg);
      background: rgba(var(--colour-label-rgb), .05);
      min-height: 3rem;
      transition: border-color .15s, background .15s;
    }
    .fill-pool.needs-pick {
      border-color: var(--colour-ui-primary);
      border-style: solid;
      background: rgba(var(--colour-ui-primary-rgb), .06);
      animation: matchPoolPulse 1.1s ease-in-out infinite;
    }
    /* Pool chips are often single letters (A/B, negated via overline, not
       extra characters) so they'd otherwise all size to the same cramped
       ~36px — double that and centre the label in the extra space. Long
       expression chips (Q2-Q4) simply exceed this min-width naturally. */
    .fill-pool .match-chip { min-width: 72px; text-align: center; }
    /* Solid (not translucent) fill is deliberate: these boxes sit directly
       on top of a wire, and a see-through fill let the wire visually cross
       right through the text sitting on top of it. An opaque panel-
       coloured patch cleanly masks the wire behind the label. */
    .circuit-slot-box { fill: var(--colour-panel); stroke: var(--colour-ui-primary); stroke-width: 1.5px; stroke-dasharray: 4,3; cursor: pointer; }
    .circuit-slot-box.filled { stroke-dasharray: none; }
    /* Fill stays the same opaque --colour-panel for .correct/.wrong too —
       a translucent tint let the wire underneath show straight through
       the box as a strikethrough line across the text. Correctness is
       carried entirely by the (now solid, undashed) stroke colour and the
       text colour instead. */
    .circuit-slot-box.correct { stroke: var(--colour-ui-correct); }
    .circuit-slot-box.wrong { stroke: #ff3d66; }
    /* Locked-in (checked) boxes are no longer clickable — slotClicked()
       already no-ops once st.ans is true, so the pointer cursor shouldn't
       keep implying they're interactive. */
    .circuit-slot-box.correct, .circuit-slot-box.wrong { cursor: default; }
    /* Same idea as .circuit-slot-box, just sized for a full expression
       instead of a single letter. */
    .circuit-answer-box { fill: var(--colour-panel); stroke: var(--colour-ui-primary); stroke-width: 2px; stroke-dasharray: 6,4; cursor: pointer; }
    .circuit-answer-box.filled { stroke-dasharray: none; }
    .circuit-answer-box.correct { stroke: var(--colour-ui-correct); }
    .circuit-answer-box.wrong { stroke: #ff3d66; }
    .circuit-answer-box.correct, .circuit-answer-box.wrong { cursor: default; }
    /* Once a fill question is no longer the one being asked (answered AND
       the quiz has moved on), its box drops the border/background and
       leaves just the plain coloured text sitting on the wire — the box
       chrome only matters while a question is still asking for input.
       Declared after the .correct/.wrong stroke rules above so it wins
       on source order despite matching specificity; only ever added by
       updateReveal()'s past-question lock branch, never for the current
       question. */
    .circuit-slot-box.plain, .circuit-answer-box.plain { fill: none; stroke: none; }
    /* EVERY fill-question box (Q1's 4 signal slots included) renders via
       <foreignObject> + this HTML class, not native SVG <text> — Q1
       started out on native <text>/dominant-baseline:middle, but that
       centred negated ("NOT A"-style, with a text-decoration overline)
       and plain letters inconsistently on iOS Safari specifically (the
       overline sat noticeably higher than a plain letter in the same
       size box). Flexbox align-items:center in an ordinary HTML div
       doesn't have that baseline-metric quirk, so Q1 moved onto the same
       mechanism the other boxes already used for their multi-tier
       overlines. See .ovl-outer / .ovl-outer2 below for those. */
    /* width/height deliberately NOT 100% — iOS Safari doesn't reliably
       resolve percentage sizing for a foreignObject's HTML content, which
       showed up as the answer text rendering at native (unscaled) size in
       roughly the wrong place entirely, ignoring the foreignObject's own
       box. Each box sets its own explicit pixel width/height inline
       (matching its own <foreignObject width/height>) instead. */
    .circuit-answer-html {
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-body); font-size: 28px; font-weight: 700;
      color: var(--colour-ui-primary); text-align: center; line-height: 1;
      pointer-events: none;
    }
    .circuit-answer-html.correct { color: var(--colour-ui-correct); }
    .circuit-answer-html.wrong { color: #ff3d66; }
    /* Q1's boxes are smaller (single letter, not a full expression) —
       tuned to its own box size separately from the shared 28px above. */
    .circuit-slot-html { font-size: 30px; }
    /* Optional caption row above the truth table's own group/column
       headers, showing the formula the table is actually verifying — only
       rendered when a kind:'truth' question supplies data.formula(), so
       older/other truth questions without one are unaffected. Local to
       this file since .bits-table itself is shared (quiz-common.css) and
       used by other quiz files that don't have this row at all. */
    .truth-formula-cell {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .03em;
      color: var(--colour-ui-primary);
      background: rgba(var(--colour-ui-primary-rgb), .1);
      border-bottom: 2px solid var(--colour-ui-primary);
    }
  </style>
</head>

<body>
  <!-- Hidden defs: only the gate primitives (no swappable circuit — the
       one circuit lives directly in the visible circuit-panel below,
       since it's never replaced with a different one). -->

  <div class="crumb" id="crumb" data-current="Practical Test Circuit"></div>
  <header>
    <h1>Digital Electronics</h1>
    <p>Practical Test Circuit · 7408 · 7402 · 7400 · Derive, Simplify & Verify</p>
  </header>

  <div class="quiz-wrap single-col" id="quizWrap">

    <!-- RIGHT (now the only column): question, with the persistent circuit
         embedded directly inside the question card — see file header
         comment for why the circuit needs to stay visible/revealed across
         every question rather than living in a separate side panel. -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->
        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>

          <!-- Fill-in pool — shown for every kind:'fill' question (Q1-Q4),
               sits ABOVE the circuit (matching digital_knowledge_logic_
               gates.html's own Q2 pool-above-targets layout). -->
          <div class="fill-pool-wrap" id="fillPoolWrap" style="display:none">
            <div class="fill-pool-row" id="fillPoolRow">
              <div class="fill-pool-arrow">▶</div>
              <div class="fill-pool" id="fillPool"></div>
            </div>
          </div>

          <!-- Points at the circuit instead of the pool once a chip is
               picked and awaiting a slot click. Same side (left) and same
               ▶ glyph as .fill-pool-arrow, so the cue always appears in
               the same place regardless of which box it's pointing at. -->
          <div class="circuit-row" id="circuitRow">
            <div class="circuit-arrow" id="circuitArrow" style="display:none">▶</div>
            <div class="circuit-panel" id="circuitPanel">
              <div class="panel-label">Reference Circuit</div>
              <svg id="circuitRefSvg" viewBox="-10 0 1510 650" xmlns="http://www.w3.org/2000/svg">
                <g id="mainCircuit">
            <!-- ==================== INPUT WIRES ==================== -->
            <text x="10" y="80" font-size="36" font-weight="bold" text-anchor="start" style="fill: var(--colour-input-a)">A</text>
            <text x="10" y="171" font-size="36" font-weight="bold" text-anchor="start" style="fill: var(--colour-input-b)">B</text>
            <text x="10" y="291" font-size="36" font-weight="bold" text-anchor="start" style="fill: var(--colour-input-c)">C</text>
            <!-- A: to the AND gate's top input (slotA) -->
            <line x1="40" y1="70" x2="300" y2="70" style="stroke: var(--colour-input-a)" stroke-width="2.6" />
            <line x1="300" y1="70" x2="300" y2="120" style="stroke: var(--colour-input-a)" stroke-width="2.6" />            
            <line x1="300" y1="120" x2="360" y2="120" style="stroke: var(--colour-input-a)" stroke-width="2.6" />
            <!-- B: to the AND gate's bottom input (slotB), and down to the B-bar inverter -->
            <line x1="40" y1="160" x2="360" y2="160" style="stroke: var(--colour-input-b)" stroke-width="2.6" />
            <polyline points="150,160 150,480 252,480" fill="none" style="stroke: var(--colour-input-b)" stroke-width="2.6" />
            <circle cx="150" cy="160" r="7" style="fill: var(--colour-input-b)" />
            <!-- C: to the C-bar inverter (hopping over B's down-branch), and down to G2's bottom input (slotC) -->
            <path d="M 40,280 L 142,280 A 8,8 0 0 1 158,280 L 252,280" fill="none" style="stroke: var(--colour-input-c)" stroke-width="2.6" />
            <polyline points="100,280 100,560 700,560" fill="none" style="stroke: var(--colour-input-c)" stroke-width="2.6" />
            <circle cx="100" cy="280" r="7" style="fill: var(--colour-input-c)" />

            <!-- ==================== GATE-TO-GATE WIRES ==================== -->
            <!-- AND output -> G1 top input (Q3's box sits above the straight run) -->
            <polyline points="530,140 680,140 680,240 700,240" fill="none" style="stroke: var(--colour-series)" stroke-width="2.6" />
            <!-- C-bar -> G1 bottom input (slotCbar) -->
            <line x1="388" y1="280" x2="700" y2="280" style="stroke: var(--colour-series)" stroke-width="2.6" />
            <!-- B-bar -> G2 top input (slotBbar) -->
            <polyline points="388,480 600,480 600,520 700,520" fill="none" style="stroke: var(--colour-series)" stroke-width="2.6" />
            <!-- G1 / G2 outputs -> the final NAND -->
            <polyline points="870,260 1000,260 1000,380 1010,380" fill="none" style="stroke: var(--colour-series)" stroke-width="2.6" />
            <polyline points="870,540 1000,540 1000,420 1010,420" fill="none" style="stroke: var(--colour-series)" stroke-width="2.6" />
            <!-- Z -->
            <line x1="1180" y1="400" x2="1450" y2="400" style="stroke: var(--colour-output-z)" stroke-width="2.6" />
            <circle cx="1450" cy="400" r="7" style="fill: var(--colour-output-z)" />
            <text x="1462" y="412" font-size="36" font-weight="bold" text-anchor="start" style="fill: var(--colour-output-z)">Z</text>

            <!-- ==================== GATES ==================== -->
            <g transform="translate(420,140) scale(2.5)"><use href="#gate-and-trad" /></g>
            <g transform="translate(300,280) scale(2)"><use href="#gate-not-trad" /></g>
            <g transform="translate(300,480) scale(2)"><use href="#gate-not-trad" /></g>
            <g transform="translate(760,260) scale(2.5)"><use href="#gate-nand-trad" /></g>
            <g transform="translate(760,540) scale(2.5)"><use href="#gate-nand-trad" /></g>
            <g transform="translate(1070,400) scale(2.5)"><use href="#gate-nand-trad" /></g>

            <!-- ==================== IC NUMBERS AND PIN NUMBERS ==================== -->
            <g font-size="20" font-weight="bold" text-anchor="middle" style="fill: var(--colour-label)">
              <text x="420" y="94">7408</text>
              <text x="300" y="238">7402</text>
              <text x="300" y="438">7402</text>
              <text x="760" y="214">7400</text>
              <text x="760" y="494">7400</text>
              <text x="1070" y="354">7400</text>
            </g>

            <g id="zBox" class="circuit-answer-box" transform="translate(1192,290)" onclick="slotClicked(0)">
              <rect width="250" height="90" rx="6" />
              <foreignObject x="0" y="0" width="250" height="90"><div xmlns="http://www.w3.org/1999/xhtml" id="zBoxText" class="circuit-answer-html" style="width:250px;height:90px"></div></foreignObject>

  <script>Shapes.use('logic-gates');</script>
  <script>
    CIRCUIT_SVG_ID = 'circuitRefSvg';

    // `<O>X</O>` = a NOT bar over one variable, `<OO>…</OO>` = a raised NAND bar over a sub-expression,
    // `<OOO>…</OOO>` = a third, higher bar (same helper and classes as digital_circuit_derivation_ab.html)
    function sym(template) {
      const poolHtml = template
        .replace(/<OOO>/g, '<span class="ovl-outer2">').replace(/<\/OOO>/g, '</span>')
        .replace(/<OO>/g, '<span class="ovl-outer">').replace(/<\/OO>/g, '</span>')
        .replace(/<O>/g, '<span class="ovl-thick">').replace(/<\/O>/g, '</span>');
      return { poolHtml };
    }
    function exprPool(items) {
      return () => shuffle(items.map(it => ({ ...it, ...(it.correct ? { col: 0 } : {}) })));
    }
    const G1_IN = 'A·B·<O>C</O>', G2_IN = '<O>B</O>·C';
    const G1_TPL = `<OO>${G1_IN}</OO>`, G2_TPL = `<OO>${G2_IN}</OO>`;
    const FINAL = `(${G1_IN}) + (${G2_IN})`;

    const QUESTIONS = [
      {
        kind: 'fill',
        slotIds: ['slotA', 'slotB', 'slotCbar', 'slotBbar', 'slotC'],
        text: () => 'This is the circuit for the <b>practical test</b>: a 7408 AND, a 7402 (NOR gates used as inverters) and a 7400 NAND. Before working out any outputs, <b style="color:var(--colour-ui-primary)">label</b> the 5 highlighted gate inputs with the signal that arrives there.',
        hint: () => 'Trace each highlighted wire back to its source — does it come straight from A, B or C, or has it passed through an inverter first?',
        options: () => shuffle([
          { label: 'A', poolHtml: 'A', col: 0 },
          { label: 'B', poolHtml: 'B', col: 1 },
          { label: 'NOT C', poolHtml: '<span class="ovl">C</span>', col: 2 },
          { label: 'NOT B', poolHtml: '<span class="ovl">B</span>', col: 3 },
          { label: 'C', poolHtml: 'C', col: 4 },
          { label: 'NOT A', poolHtml: '<span class="ovl">A</span>' },
        ]),
        correctExplain: (st) => {
          const wrong = st.slotPlaced.filter((p, slot) => p !== st.cor[slot]).length;
          return wrong === 0 ? 'All 5 inputs labelled correctly' : `${st.slotPlaced.length - wrong} of ${st.slotPlaced.length} labelled correctly`;
        },
        working: () => `
    <div class="working-line">The <b>7408 AND</b> gets <b>A</b> and <b>B</b> straight from the inputs.</div>
    <div class="working-line" style="margin-top:.4rem">C goes through the top inverter, so the first NAND's bottom input is <b style="text-decoration:overline">C</b>. B also branches down through the bottom inverter, so the second NAND's top input is <b style="text-decoration:overline">B</b>.</div>
    <div class="working-line" style="margin-top:.4rem">C also branches straight down to the second NAND's bottom input, un-inverted: <b>C</b>. Nothing in this circuit inverts A, so <span style="text-decoration:overline">A</span> is not used.</div>`,
      },
      {
        kind: 'fill',
        slotIds: ['andBox', 'g1Box', 'g2Box'],
        text: () => 'With those signals confirmed, what is the output of each first-level gate — the <b>7408 AND</b> (inputs A and B), the <b>top 7400 NAND</b> (inputs A·B and NOT C) and the <b>bottom 7400 NAND</b> (inputs NOT B and C)? <b style="color:var(--colour-ui-primary)">Place</b> each answer directly on the circuit.',
        hint: () => 'The AND gate has no output bubble: just AND its inputs. Each NAND ANDs its inputs and then inverts the whole result — don\'t forget that final bar on either NAND.',
        options: () => shuffle([
          { ...sym('A·B'), col: 0 },
          { ...sym(G1_TPL), col: 1 },
          { ...sym(G2_TPL), col: 2 },
          sym('<OO>A·B</OO>'),
          sym(G1_IN),
          sym(G2_IN),
          sym('<OO>A·B·C</OO>'),
          sym('<OO>B·<O>C</O></OO>'),
        ]),
        correctExplain: (st) => {
          const wrong = st.slotPlaced.filter((p, slot) => p !== st.cor[slot]).length;
          return wrong === 0 ? 'AND = A·B,  top NAND = ' + sym(G1_TPL).poolHtml + ',  bottom NAND = ' + sym(G2_TPL).poolHtml : `${st.slotPlaced.length - wrong} of ${st.slotPlaced.length} correct`;
        },
        working: () => `
    <div class="working-line">The <b>AND</b> gate (pin 3) has no bubble, so its output is simply <b>A·B</b>, which feeds the top NAND.</div>
    <div class="working-line" style="margin-top:.4rem">Top NAND (pin 3): AND its inputs — (A·B) and <span class="ovl-thick">C</span> make ${sym(G1_IN).poolHtml} — then invert the whole thing (the raised bar in the box above).</div>
    <div class="working-line" style="margin-top:.4rem">Bottom NAND (pin 11): AND <span class="ovl-thick">B</span> and C to get ${sym(G2_IN).poolHtml}, then invert.</div>
    <div class="working-line" style="margin-top:.4rem">Leaving off a NAND's final bar, or putting a bar on the AND gate's output, are the common mistakes.</div>`,
      },
      {
        kind: 'fill',
        slotIds: ['zBox'],
        text: () => 'Both NAND outputs feed the <b>final NAND</b> (pins 4, 5 → 6). Substituting them in, what is <b>Z</b> before any simplification?',
        hint: () => 'Same NAND rule again: AND the two inputs, then one bar over everything.',
        options: exprPool([
          { ...sym(`<OOO>(${G1_TPL})·(${G2_TPL})</OOO>`), correct: true },
          sym(`(${G1_TPL})·(${G2_TPL})`),
          sym(`<OOO>(${G1_TPL})</OOO>·<OOO>(${G2_TPL})</OOO>`),
          sym(`(${G1_TPL}) + (${G2_TPL})`),
        ]),
        correctExplain: () => 'Z = ' + sym(`<OOO>(${G1_TPL})·(${G2_TPL})</OOO>`).poolHtml,
        working: () => `<div class="working-total">AND the two NAND outputs together, then invert: that is the third, highest bar in the box above, over the bars the two NAND outputs already carry. This is the raw expression; the next two questions simplify it.</div>`,
      },
      {
        kind: 'fill',
        slotIds: ['step1Box'],
        text: () => 'Apply <b>De Morgan\'s law</b> to Z\'s outer NOT. What do you get? <b style="color:var(--colour-ui-primary)">Place</b> your answer on the circuit.',
        hint: () => 'NOT (X AND Y) = NOT X OR NOT Y — the AND flips to OR, and each side gets its own NOT. Don\'t cancel anything yet.',
        options: exprPool([
          { ...sym(`<OOO>(${G1_TPL})</OOO> + <OOO>(${G2_TPL})</OOO>`), correct: true },
          sym(`<OOO>(${G1_TPL})</OOO>·<OOO>(${G2_TPL})</OOO>`),
          sym(`(${G1_TPL}) + (${G2_TPL})`),
          sym(`(${G1_TPL})·(${G2_TPL})`),
        ]),
        correctExplain: () => 'Z = ' + sym(`<OOO>(${G1_TPL})</OOO> + <OOO>(${G2_TPL})</OOO>`).poolHtml,
        working: () => `<div class="working-total">De Morgan's law: NOT (X AND Y) = NOT X OR NOT Y. The AND between the two NAND outputs becomes OR, and each side gets its own separate bar. Each term is now a <b>double</b> negation, which the next question cancels.</div>`,
      },
      {
        kind: 'fill',
        slotIds: ['step2Box'],
        text: () => 'Each term is now NOT of a NAND output — a double negation. Cancelling it, what does <b>Z</b> simplify to?',
        hint: () => 'NOT(NOT(anything)) cancels straight back to that thing.',
        options: exprPool([
          { ...sym(FINAL), correct: true },
          sym('(A·B·C) + (B·<O>C</O>)'),
          sym(`(${G1_IN})·(${G2_IN})`),
          sym('(<O>A</O>+<O>B</O>+C)·(B+<O>C</O>)'),
        ]),
        correctExplain: () => 'Z = ' + sym(FINAL).poolHtml,
        working: () => `
    <div class="working-line">NOT(NOT(${sym(G1_IN).poolHtml})) = ${sym(G1_IN).poolHtml}, and NOT(NOT(${sym(G2_IN).poolHtml})) = ${sym(G2_IN).poolHtml}.</div>
    <div class="working-total">Z = ${sym(FINAL).poolHtml} — a sum of products, one product term from each first-level NAND. That is the "NAND-NAND realises sum-of-products" pattern again.</div>`,
      },
      {
        kind: 'truth',
        inputLabels: () => ['C', 'B', 'A'],
        headerGroups: () => [{ label: 'Inputs', span: 3 }, { label: 'Output', span: 1 }],
        outputLabel: () => 'Z',
        text: () => 'Complete the truth table for <b>Z = A·B·NOT C + NOT B·C</b> — the column you would check against your measured outputs in the practical.',
        hint: () => 'Z is 1 when A and B are 1 with C at 0, OR when B is 0 with C at 1. Check each row against both terms.',
        options: () => {
          const rows = [];
          for (let v = 0; v < 8; v++) {
            const c = (v >> 2) & 1, b = (v >> 1) & 1, a = v & 1;
            rows.push({ inputs: [c, b, a], z: ((a & b & (1 - c)) | ((1 - b) & c)) });
          }
          return rows;
        },
        correctExplain: truthCorrectExplain,
        working: (st) => `
    <div class="working-line">The <b>A·B·<span class="ovl-thick">C</span></b> term is 1 in just one row: C B A = 0 1 1.</div>
    <div class="working-line" style="margin-top:.4rem">The <b><span class="ovl-thick">B</span>·C</b> term is 1 whenever B = 0 and C = 1: rows 1 0 0 and 1 0 1.</div>
    <div class="working-total">So Z = 1 in rows 011, 100 and 101, and 0 everywhere else. If a measured output disagrees, trace that row's signals through the gates to find the fault.</div>
    ${truthMistakeLine('C B A', st)}`,
      },
    ];

    // Diagram reveal: a fill question's box(es) show once it is being asked or has been answered, and an
    // answered question's boxes keep the correct value (same as digital_circuit_derivation_ab.html)
    function updateReveal() {
      const data = QUESTIONS[cur];
      document.getElementById('fillPoolWrap').style.display = isFill(data) ? '' : 'none';
      document.getElementById('circuitArrow').style.display = isFill(data) ? '' : 'none';
      if (!isFill(data)) document.getElementById('circuitPanel').classList.remove('needs-pick');
      QUESTIONS.forEach((qData, i) => {
        if (!isFill(qData)) return;
        const st = Q[i];
        const visible = (i === cur) || st.ans;
        qData.slotIds.forEach((elId) => { document.getElementById(elId).setAttribute('display', visible ? 'inline' : 'none'); });
        if (i === cur) return;
        qData.slotIds.forEach((elId, slot) => {
          const box = document.getElementById(elId), txt = document.getElementById(elId + 'Text');
          if (st.ans) {
            txt.innerHTML = st.opts[st.cor[slot]].poolHtml;
            box.classList.remove('wrong'); box.classList.add('filled', 'correct', 'plain');
            txt.classList.remove('wrong'); txt.classList.add('correct');
          } else {
            box.classList.remove('filled', 'correct', 'wrong', 'plain');
            txt.innerHTML = '';
            txt.classList.remove('correct', 'wrong');
          }
        });
      });
      if (xyOn) buildXYRuler();
    }
    function swapLeftPanel() {}           // the one circuit is always visible (see the _ab page)
    RENDER_EXTRA = () => updateReveal();

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
