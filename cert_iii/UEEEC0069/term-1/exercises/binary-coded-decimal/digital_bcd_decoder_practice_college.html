<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Electronics — BCD to 7-Segment Decoder Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --colour-bg: #f8f9fa;
      --colour-panel: #ffffff;
      --colour-border: #d0d5dd;
      --colour-text: #1d2939;
      --colour-text-strong: #002664;
      --colour-label: #475467;
      --colour-label-rgb: 71, 84, 103;
      --colour-grid: rgba(0, 38, 100, 0.04);

      --colour-ui-primary: #002664;
      --colour-ui-primary-rgb: 0, 38, 100;
      --colour-ui-correct: #087443;
      --colour-ui-correct-rgb: 8, 116, 67;
      --colour-ui-error: #d92d20;
      --colour-ui-error-rgb: 217, 45, 32;
      --colour-diode: #d97706;

      --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Public Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'Share Tech Mono', monospace, sans-serif;

      --radius-lg: 6px;
      --radius-sm: 4px;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    body.dark-theme {
      --colour-bg: #121824;
      --colour-panel: #1a2232;
      --colour-border: #2e3c54;
      --colour-text: #e2e8f0;
      --colour-text-strong: #ffffff;
      --colour-label: #94a3b8;
      --colour-label-rgb: 148, 163, 184;
      --colour-grid: rgba(255, 255, 255, 0.03);

      --colour-ui-primary: #38bdf8;
      --colour-ui-primary-rgb: 56, 189, 248;
      --colour-ui-correct: #34d399;
      --colour-ui-correct-rgb: 52, 211, 153;
      --colour-ui-error: #f87171;
      --colour-ui-error-rgb: 248, 113, 113;
      --colour-diode: #fbbf24;

      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--colour-bg);
      color: var(--colour-text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: linear-gradient(var(--colour-grid) 1px, transparent 1px), linear-gradient(90deg, var(--colour-grid) 1px, transparent 1px);
      background-size: 40px 40px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    header { margin-bottom: 1.2rem; width: 100%; max-width: 640px; }

    header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--colour-ui-primary);
    }

    header p {
      margin-top: .4rem;
      color: var(--colour-label);
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--colour-text);
      background: var(--colour-panel);
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-card);
      white-space: nowrap;
    }

    .theme-toggle:hover { border-color: var(--colour-ui-primary); }

    .main-wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 1.5rem; }

    .card {
      background: var(--colour-panel);
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-lg);
      padding: 1.6rem;
      box-shadow: var(--shadow-card);
      transition: background 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .card-top-bar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin-bottom: 1rem;
    }

    .q-header { display: flex; align-items: flex-start; gap: 1rem; }
    .q-text { color: var(--colour-text-strong); font-size: .9rem; font-weight: bold; line-height: 1.5; }
    .q-hint { font-size: .75rem; color: var(--colour-label); font-weight: normal; margin-top: .3rem; }

    .decoder-label {
      font-family: var(--font-mono);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--colour-label);
    }

    .decoder-top-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 1.8rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }

    .decoder-col { display: flex; flex-direction: column; align-items: center; gap: .5rem; }

    .decoder-panel { display: flex; flex-direction: column; align-items: center; gap: .4rem; margin: 1rem 0; }

    .decoder-display-wrap { width: 110px; }
    .decoder-display-wrap svg { width: 100%; height: auto; display: block; }

    .segment-bar { fill: var(--colour-border); transition: fill .15s; }
    .segment-bar.lit { fill: var(--colour-diode); }
    .segment-bar.lit-correct { fill: var(--colour-ui-correct); }
    .segment-bar.lit-wrong { fill: var(--colour-ui-error); }

    .switch-row { display: flex; justify-content: center; gap: .35rem; flex-wrap: wrap; }

    .switch-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      min-width: 42px;
      padding: .45rem .3rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--colour-border);
      background: rgba(var(--colour-label-rgb), .04);
      color: var(--colour-text);
      font-family: var(--font-mono);
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }

    .switch-btn:hover:not(:disabled) { border-color: rgba(var(--colour-ui-primary-rgb), .4); background: rgba(var(--colour-ui-primary-rgb), .05); }
    .switch-btn .switch-label { font-size: .62rem; font-weight: 700; letter-spacing: .04em; color: var(--colour-label); }
    .switch-btn .switch-value { font-size: 1.1rem; font-weight: 700; line-height: 1; }
    .switch-btn.on { border-color: rgba(var(--colour-ui-primary-rgb), .6); background: rgba(var(--colour-ui-primary-rgb), .1); color: var(--colour-ui-primary); }
    .switch-btn.correct { border-color: var(--colour-ui-correct); background: rgba(var(--colour-ui-correct-rgb), .1); color: var(--colour-ui-correct); cursor: default; }
    .switch-btn.wrong { border-color: var(--colour-ui-error); background: rgba(var(--colour-ui-error-rgb), .1); color: var(--colour-ui-error); cursor: default; }

    .segment-bits-row { display: flex; justify-content: center; gap: .35rem; flex-wrap: wrap; }

    .segment-bit-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .2rem;
      min-width: 26px;
      padding: .3rem .2rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--colour-border);
      background: rgba(var(--colour-label-rgb), .04);
      font-family: var(--font-mono);
    }

    .segment-bit-label { font-size: .62rem; font-weight: 700; letter-spacing: .04em; color: var(--colour-label); text-transform: uppercase; }
    .segment-bit-value { font-size: 1.05rem; font-weight: 700; color: var(--colour-text); transition: color .15s; }
    .segment-bit-value.on { color: var(--colour-diode); }

    .result-banner {
      display: none;
      padding: .65rem 1rem;
      border-radius: var(--radius-sm);
      font-size: .78rem;
      font-family: var(--font-display);
      align-items: center;
      gap: .6rem;
      line-height: 1.5;
      margin-top: 1rem;
    }

    .result-banner.correct { display: flex; background: rgba(var(--colour-ui-correct-rgb), .08); border: 1px solid rgba(var(--colour-ui-correct-rgb), .3); color: var(--colour-ui-correct); }
    .result-banner.wrong { display: flex; background: rgba(var(--colour-ui-error-rgb), .08); border: 1px solid rgba(var(--colour-ui-error-rgb), .3); color: var(--colour-ui-error); }

    .working-box { display: none; background: rgba(var(--colour-label-rgb), .06); border: 1px solid var(--colour-border); border-radius: var(--radius-lg); padding: 1.1rem 1.3rem; margin-top: 1rem; }
    .working-box.visible { display: block; }
    .working-title { font-family: var(--font-display); font-size: .62rem; letter-spacing: .2em; color: var(--colour-label); text-transform: uppercase; margin-bottom: .7rem; padding-bottom: .4rem; border-bottom: 1px solid var(--colour-border); }
    .working-line { font-size: .8rem; line-height: 1.7; }
    .working-total { margin-top: .5rem; border-top: 1px solid var(--colour-text); padding: .5rem 0 .5rem 1.5rem; font-size: .95rem; font-family: var(--font-mono); }
    .colour-result { color: var(--colour-text); }

    .btn-row { display: flex; gap: 1rem; justify-content: center; margin-top: 1.2rem; width: 100%; flex-wrap: wrap; }

    .btn {
      padding: .65rem 0;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
      border: 1px solid;
      width: 130px;
      text-align: center;
    }

    .btn-check, .btn-next { background: rgba(var(--colour-ui-primary-rgb), .15); border-color: rgba(var(--colour-ui-primary-rgb), .5); color: var(--colour-ui-primary); }
    .btn-check:hover:not(:disabled), .btn-next:hover { background: rgba(var(--colour-ui-primary-rgb), .25); }
    .btn-check:disabled { opacity: .35; cursor: not-allowed; }
  </style>
</head>

<body>
  <header>
    <h1>Digital Electronics</h1>
    <p>7447 BCD-to-7-Segment Decoder · Set the BCD Switches</p>
  </header>

  <div class="main-wrap">
    <div class="card">
      <div class="card-top-bar">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark and light theme">
          <span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span>
        </button>
      </div>

      <div id="qPanel">
        <div class="q-header">
          <div>
            <div class="q-text" id="qText"></div>
            <div class="q-hint" id="qHint"></div>
          </div>
        </div>

        <div class="decoder-top-row">
          <div class="decoder-col">
            <div class="decoder-label">Target</div>
            <div class="decoder-display-wrap">
              <svg viewBox="-15 -25 175 240" xmlns="http://www.w3.org/2000/svg">
                <g transform="scale(0.7)">
                  <rect id="targetA" class="segment-bar" x="70" y="20" width="60" height="15" rx="6" />
                  <rect id="targetF" class="segment-bar" x="55" y="40" width="15" height="95" rx="6" />
                  <rect id="targetB" class="segment-bar" x="130" y="40" width="15" height="95" rx="6" />
                  <rect id="targetG" class="segment-bar" x="70" y="142" width="60" height="15" rx="6" />
                  <rect id="targetE" class="segment-bar" x="55" y="163" width="15" height="95" rx="6" />
                  <rect id="targetC" class="segment-bar" x="130" y="163" width="15" height="95" rx="6" />
                  <rect id="targetD" class="segment-bar" x="70" y="265" width="60" height="15" rx="6" />
                </g>
              </svg>
            </div>
          </div>

          <div class="decoder-col">
            <div id="qSwitches" class="switch-row"></div>
            <div class="segment-bits-row" id="segmentBitsRow">
              <div class="segment-bit-cell"><span class="segment-bit-label">a</span><span class="segment-bit-value" id="segBitA">0</span></div>
              <div class="segment-bit-cell"><span class="segment-bit-label">b</span><span class="segment-bit-value" id="segBitB">0</span></div>
              <div class="segment-bit-cell"><span class="segment-bit-label">c</span><span class="segment-bit-value" id="segBitC">0</span></div>
              <div class="segment-bit-cell"><span class="segment-bit-label">d</span><span class="segment-bit-value" id="segBitD">0</span></div>
              <div class="segment-bit-cell"><span class="segment-bit-label">e</span><span class="segment-bit-value" id="segBitE">0</span></div>
              <div class="segment-bit-cell"><span class="segment-bit-label">f</span><span class="segment-bit-value" id="segBitF">0</span></div>
              <div class="segment-bit-cell"><span class="segment-bit-label">g</span><span class="segment-bit-value" id="segBitG">0</span></div>
            </div>
          </div>
        </div>

        <div class="decoder-panel">
          <div class="decoder-label" id="actualLabel">Actual Output — press Check</div>
          <div class="decoder-display-wrap">
            <svg viewBox="-15 -25 175 240" xmlns="http://www.w3.org/2000/svg">
              <g transform="scale(0.7)">
                <rect id="actualA" class="segment-bar" x="70" y="20" width="60" height="15" rx="6" />
                <rect id="actualF" class="segment-bar" x="55" y="40" width="15" height="95" rx="6" />
                <rect id="actualB" class="segment-bar" x="130" y="40" width="15" height="95" rx="6" />
                <rect id="actualG" class="segment-bar" x="70" y="142" width="60" height="15" rx="6" />
                <rect id="actualE" class="segment-bar" x="55" y="163" width="15" height="95" rx="6" />
                <rect id="actualC" class="segment-bar" x="130" y="163" width="15" height="95" rx="6" />
                <rect id="actualD" class="segment-bar" x="70" y="265" width="60" height="15" rx="6" />
              </g>
            </svg>
          </div>
        </div>

        <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
        <div class="working-box" id="qWorking">
          <div class="working-title">Worked Solution</div>
          <div id="qWorkingContent"></div>
        </div>
        <div class="btn-row">
          <button class="btn btn-check" id="qCheck" onclick="checkAnswer()">Check</button>
          <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SEGMENTS = {
      0: ['a', 'b', 'c', 'd', 'e', 'f'],
      1: ['b', 'c'],
      2: ['a', 'b', 'd', 'e', 'g'],
      3: ['a', 'b', 'c', 'd', 'g'],
      4: ['b', 'c', 'f', 'g'],
      5: ['a', 'c', 'd', 'f', 'g'],
      6: ['a', 'c', 'd', 'e', 'f', 'g'],
      7: ['a', 'b', 'c'],
      8: ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
      9: ['a', 'b', 'c', 'd', 'f', 'g'],
    };
    const BAR_LETTERS = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];
    const SWITCH_LABELS = ['A3', 'A2', 'A1', 'A0'];

    function bcdBits(n) { return [8, 4, 2, 1].map(w => (n & w) ? 1 : 0); }

    function decodeSegments(bits) {
      const value = bits[0] * 8 + bits[1] * 4 + bits[2] * 2 + bits[3];
      return SEGMENTS[value] || [];
    }

    function setDisplay(prefix, litSegments, litClass) {
      BAR_LETTERS.forEach(l => {
        const bar = document.getElementById(prefix + l.toUpperCase());
        if (!bar) return;
        bar.classList.remove('lit', 'lit-correct', 'lit-wrong');
        if (litSegments.includes(l)) bar.classList.add(litClass || 'lit');
      });
    }

    function question(digit) {
      return {
        digit,
        cor: bcdBits(digit),
        text: `Set the BCD switches so the 7447 decoder drives the display to show <b style="color:var(--colour-ui-primary)">${digit}</b>.`,
        hint: `Write ${digit} as a 4-bit binary number — A3 is the MSB, A0 is the LSB. That 4-bit code is what you set on the switches.`,
        correctExplain: `A3 A2 A1 A0 = ${bcdBits(digit).join(' ')}`,
        working: `
    <div class="working-line">${digit} written as a 4-bit binary number (A3 is the MSB, A0 is the LSB):</div>
    <div class="working-total">A3 A2 A1 A0 = <span class="colour-result">${bcdBits(digit).join(' ')}</span></div>
    <div class="working-line" style="margin-top:.6rem">The 7447 decodes that BCD input into segments <b>${SEGMENTS[digit].join(', ')}</b> — lighting up a ${digit}.</div>`,
      };
    }

    function randomDigit(excluding) {
      let digit;
      do { digit = Math.floor(Math.random() * 10); } while (digit === excluding);
      return digit;
    }

    function isCorrect(st, data) { return st.switches.every((b, i) => b === data.cor[i]); }

    let data = question(randomDigit(-1));
    let st = { ans: false, switches: [0, 0, 0, 0] };

    function renderSwitches() {
      const c = document.getElementById('qSwitches'); c.innerHTML = '';
      SWITCH_LABELS.forEach((label, i) => {
        const btn = document.createElement('button');
        btn.className = 'switch-btn';
        const val = st.switches[i];
        btn.innerHTML = `<span class="switch-label">${label}</span><span class="switch-value">${val}</span>`;
        if (st.ans) {
          btn.disabled = true;
          btn.classList.add(val === data.cor[i] ? 'correct' : 'wrong');
        } else {
          btn.classList.toggle('on', val === 1);
          btn.addEventListener('click', () => toggleSwitch(i));
        }
        c.appendChild(btn);
      });
    }
    function toggleSwitch(i) {
      if (st.ans) return;
      st.switches[i] = st.switches[i] ? 0 : 1;
      renderQuestion();
    }

    function renderSegmentBits() {
      const lit = decodeSegments(st.switches);
      BAR_LETTERS.forEach(l => {
        const el = document.getElementById('segBit' + l.toUpperCase());
        const on = lit.includes(l);
        el.textContent = on ? '1' : '0';
        el.classList.toggle('on', on);
      });
    }

    function renderQuestion() {
      document.getElementById('qText').innerHTML = data.text;
      document.getElementById('qHint').innerHTML = data.hint;

      setDisplay('target', SEGMENTS[data.digit]);
      setDisplay('actual', st.ans ? decodeSegments(st.switches) : [], st.ans ? (isCorrect(st, data) ? 'lit-correct' : 'lit-wrong') : 'lit');
      document.getElementById('actualLabel').textContent = st.ans ? 'Actual Output' : 'Actual Output — press Check';

      renderSwitches();
      renderSegmentBits();

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isCorrect(st, data);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain}` : `The correct answer is ${data.correctExplain}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working : '';

      document.getElementById('qCheck').style.display = st.ans ? 'none' : 'inline-block';
      document.getElementById('qNext').style.display = st.ans ? 'inline-block' : 'none';
    }

    function checkAnswer() {
      if (st.ans) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() {
      data = question(randomDigit(data.digit));
      st = { ans: false, switches: [0, 0, 0, 0] };
      renderQuestion();
      document.getElementById('qPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-theme');
      localStorage.setItem('tafe-quiz-theme', isDark ? 'dark' : 'light');
      updateThemeToggleUI(isDark);
    }
    function updateThemeToggleUI(isDark) {
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('themeLabel').textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }
    (function initTheme() {
      const isDark = localStorage.getItem('tafe-quiz-theme') === 'dark';
      document.body.classList.toggle('dark-theme', isDark);
      updateThemeToggleUI(isDark);
    })();

    renderQuestion();
  </script>
</body>

</html>
