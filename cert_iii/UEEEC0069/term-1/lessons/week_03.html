<head>

        rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/nav-common.css">
    <script src="../../../assets/breadcrumb.js" defer></script>
</head>

<body>
    <div class="crumb" id="crumb" data-current="Week 3"></div>
    <header>
        <h1>Week 3</h1>
        <p>Digital Electronics · Logic Gate Combinations</p>
    </header>

    <div class="back-link-row">
        <a id="backLink" class="back-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
    </div>

    <div class="section-label">Knowledge Quizzes</div>
    <nav class="nav">
        <a class="nav-item" href="../knowledge/digital_knowledge_logic_combos.html">
            <span class="nav-item-icon">⏚</span>
            <span class="nav-item-text">
                <span class="nav-item-name">Logic Gate Combinations</span>
                <span class="nav-item-desc">Digital Electronics · Logic Gate Combinations · Knowledge Quiz</span>
            </span>
        </a>
    </nav>

    <button class="section-toggle" style="margin-top:1.8rem" aria-expanded="false" aria-controls="nav-week-exercises" onclick="toggleSection(this)">
        <span class="section-toggle-icon"></span>
        <span>Exercises</span>
    </button>
    <nav class="nav" id="nav-week-exercises" hidden>
        <a class="nav-item" href="../exercises/logic-gates/digital_truth_tables.html">
            <span class="nav-item-icon">⏚</span>
            <span class="nav-item-text">

            </span>
        </a>
    </nav>

    <footer>Electronics // UEEEC0069 // Week 3</footer>
    <script>
        function goBack(e) { e.preventDefault(); history.back(); }
        if (history.length > 1) { document.getElementById('backLink').style.display = ''; }

        // Exercises submenu: same collapsible toggle as the UEEEC0069 main
        // menu; open/closed state kept in sessionStorage for this tab.
        function navStateKey(id) { return 'nav-expanded:' + location.pathname + ':' + id; }
        function toggleSection(btn) {
            const target = document.getElementById(btn.getAttribute('aria-controls'));
            const wasExpanded = btn.getAttribute('aria-expanded') === 'true';
            btn.setAttribute('aria-expanded', String(!wasExpanded));
            target.hidden = wasExpanded;
            try { sessionStorage.setItem(navStateKey(target.id), String(!wasExpanded)); } catch (e) { }
        }
        document.querySelectorAll('.section-toggle[aria-controls]').forEach(btn => {
            let wasExpanded;
            try { wasExpanded = sessionStorage.getItem(navStateKey(btn.getAttribute('aria-controls'))) === 'true'; } catch (e) { wasExpanded = false; }
            if (wasExpanded) {
                btn.setAttribute('aria-expanded', 'true');
                document.getElementById(btn.getAttribute('aria-controls')).hidden = false;
            }
        });
    </script>
</body>

</html>
