<!--
  IC/component pinout reference sheet — digitised from the teacher's own
  photographed lab reference page (7400/7402/7404/7408/7432/7486 basic TTL
  gates, 7447 BCD-to-7-segment decoder, 7474 dual D flip-flop, 7476 dual JK
  flip-flop, 4011 CMOS quad NAND, 4N25 optocoupler, LSD5365 7-segment
  display). Not a quiz — a static click-to-zoom gallery, since the whole
  point is a quick lab lookup, not testing.

  Deliberately its own small page, not built on assets/quiz-engine.js —
  there are no questions, no QUESTIONS[] state, nothing to check. It DOES
  reuse quiz-common.css wholesale for shared tokens/chrome (crumb, header,
  buttons) and specifically the .diagram-modal/.modal-inner/.modal-header/
  .modal-title/.modal-close rules already used as the "zoom modal" on every
  quiz page's circuit panel — see quiz-engine.js's own openModal()/
  closeModal() for the pattern this page's small hand-rolled openIcModal()/
  closeModal() below copies (can't reuse those functions directly: they're
  wired to a single per-question CIRCUIT_SVG_ID, not a click-any-of-N
  gallery).

  Each IC is one <g id="ic-xxxx"> in the hidden defs below: a numbered DIP
  outline (see dipPins() in the one-off Python generator this was authored
  with — not part of the page, just how the repetitive pin-stub markup was
  produced) plus either the real gate symbols (copied from
  assets/shapes/logic-gates.html — cross-file <use> doesn't work under
  file://, so this is a local copy, same convention as every other page's
  shapeGrid defs) or full per-pin text labels for the ICs where every pin
  matters (7447/7474/7476). The simple gate ICs (7400/7402/7404/7408/7432/
  7486/4011) deliberately only number the 4 corner pins (1/7/8/14, +5V/GND)
  and leave the other 10 as bare stubs — matching the source photo's own
  level of detail, which shows package layout, not full per-pin wiring.

  7447's BCD input pins are labelled A0-A3 (not the datasheet's B/C/D/A) —
  this matches the teacher's own photographed sheet, treating the 4-bit BCD
  input as a binary word A3 A2 A1 A0 (A0 = LSB), consistent with this
  course's own number-systems teaching. Segment outputs (a-g) are the
  standard 7447 pin order, unchanged.

  4N25 and LSD5365 pin reads (pins 2/5 on the 4N25, pin 3 on the LSD5365)
  were less certain from the source photo than the rest — flagged to the
  teacher for a direct check against the photo/datasheet rather than
  guessed silently, since a wrong pinout here is a real lab-hardware risk,
  not just a typo.
-->

    /* Package-outline colour — its own token (not a reuse of --colour-bjt,
       which stays on the gate symbols) so the DIP body reads as "the chip"
       and the gates read as "what's inside it". Dark-mode default (this
       project's usual :root) is a cool silver, evoking black-plastic-
       package-with-printed-markings without literally being black on a
       dark page; light mode overrides to a near-black, matching a real
       IC's actual body colour — same override pattern quiz-common.css
       itself documents (dark in :root, light under
       :root[data-theme="light"]). */
    :root { --colour-ic-outline: #c7d2e0; }
    :root[data-theme="light"] { --colour-ic-outline: #0f172a; }

    .intro {
      color: var(--colour-label);
      font-size: .85rem;
      line-height: 1.5;
      max-width: 640px;
      margin: 0 auto 1.2rem;
      text-align: center;
    }

    .ic-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: .8rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .ic-card {
      position: relative;
      background: rgba(var(--colour-label-rgb), .08);
      border: 2px solid var(--colour-border);
      border-radius: var(--radius-lg);
      cursor: zoom-in;
      padding: .6rem .5rem .5rem;
      transition: border-color .15s, background .15s;
      text-align: center;
    }

    .ic-card:hover {
      border-color: rgba(var(--colour-ui-primary-rgb), .5);
    }

    .ic-card svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .ic-card-part {
      font-family: var(--font-display);
      font-size: .8rem;
      font-weight: bold;
      color: var(--colour-ui-primary);
      margin-top: .3rem;
    }

    .ic-card-desc {
      font-size: .62rem;
      color: var(--colour-label);
      margin-top: .1rem;
      line-height: 1.3;
    }

    /* Shared IC-diagram styling — every ic-* <g> in the defs below draws
       with these classes so light/dark theming is automatic, same pattern
       as quiz-common.css's own token convention. */
    .ic-body {
      fill: none;
      stroke: var(--colour-ic-outline);
      stroke-width: 2;
    }

    .ic-pin {
      fill: var(--colour-ic-outline);
      opacity: .55;
    }

    .ic-pin-num {
      font-size: 9px;
      fill: var(--colour-label);
    }

    .ic-pin-label {
      font-size: 9px;
      font-weight: bold;
      fill: var(--colour-text);
    }

    .ic-barrier {
      stroke: rgba(var(--colour-label-rgb), .4);
      stroke-width: 1.5;
      stroke-dasharray: 4, 3;
    }

    .ovl {
      text-decoration: overline;
      text-decoration-thickness: .09em;
    }

    .modal-inner svg {
      max-height: calc(92vh - 5rem);
    }
  </style>
</head>

      card.className = 'ic-card';
      card.title = 'Click to zoom';
      card.onclick = () => openIcModal(ic);
      card.innerHTML =
        `<svg viewBox="${ic.vb}"><use href="#${ic.id}" /></svg>` +
        `<div class="ic-card-part">${ic.part}</div>` +
        `<div class="ic-card-desc">${ic.desc}</div>`;
      grid.appendChild(card);
    });

    // DEV: ?xy=1 overlays a magenta coordinate ruler on the zoomed IC —
    // same look/behaviour as quiz-engine.js's own xyRuler (see that file's
    // buildXYRuler), reimplemented here rather than reused because it's
    // wired to a single page-wide CIRCUIT_SVG_ID/#xyRuler, not a click-
    // any-of-N gallery whose viewBox changes with whichever IC is open.
    // Rebuilt fresh on every openIcModal() call (viewBox differs per IC)
    // rather than cached — this is a rarely-used dev-only overlay, not
    // worth optimising.
    const xyOn = new URLSearchParams(location.search).get('xy') === '1';
    // Ticks are anchored to absolute multiples of 10 (not viewBox-relative
    // offsets like quiz-engine.js's own buildXYRuler does) — these IC
    // viewBoxes don't start on a round number (e.g. "-84 -138 168 276"),
    // so stepping from offX/offY directly would never land on a multiple
    // of 50 and no major-tick label would ever appear.
    function buildXYRulerSVG(vbStr) {
      const [offX, offY, W, H] = vbStr.split(' ').map(Number);
      const hy = offY + H - 10, vx = offX + 10, col = '#ff00ff';
      let svg = `<line x1="${offX}" y1="${hy}" x2="${offX + W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let gx = Math.ceil(offX / 10) * 10; gx <= offX + W; gx += 10) {
        const major = (gx % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${gx}" y1="${hy - len}" x2="${gx}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${gx}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${gx}</text>`;
      }
      svg += `<line x1="${vx}" y1="${offY}" x2="${vx}" y2="${offY + H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let gy = Math.ceil(offY / 10) * 10; gy <= offY + H; gy += 10) {
        const major = (gy % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${vx}" y1="${gy}" x2="${vx + len}" y2="${gy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${vx + 13}" y="${gy + 3}" fill="${col}" font-size="8" text-anchor="start">${gy}</text>`;
      }
      return svg;
    }

    function openIcModal(ic) {
      const dst = document.getElementById('modalSvg');
      dst.innerHTML = `<use href="#${ic.id}" />` + (xyOn ? buildXYRulerSVG(ic.vb) : '');
      dst.setAttribute('viewBox', ic.vb);
      document.getElementById('modalTitle').textContent = `${ic.part} — ${ic.desc}`;
      document.getElementById('diagramModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('diagramModal').classList.remove('open');
      document.getElementById('modalSvg').innerHTML = '';
      document.body.style.overflow = '';
    }
    function handleModalClick(e) { if (e.target.closest('.modal-close')) return; closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>

</html>
