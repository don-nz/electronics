<!--
  Exam equation sheet reference — digitised from the teacher's own printed
  "Exam equation sheet for EC0066 & EC0069" handout (2 pages, ~89 formulas
  spanning number systems/resolution, DAC scaling, dB gain, BJT/JFET/MOSFET
  DC bias, differential amplifiers, AC voltage gain, input/output
  resistance, loading, max output swing, power, AC fundamentals and f1
  roll-off). Not a quiz — a static lookup sheet, same convention as
  ../../UEEEC0069/resources/digital_resources_ics.html (reuses quiz-common.
  css wholesale for chrome/tokens, no quiz-engine.js — nothing to check).

  User's own request: "create a single webpage that contains these
  formulas... I'd like to keep colour coding for component types and the
  frac format where possible." Two design choices this drove:

  1. Colour coding is applied PER SYMBOL, not per formula — every occurrence
     of a resistor-type symbol (R, RB1, RB2, RC, RE, RL, RG, RD, RS, RIN,
     RREF, RT, Rin, Rout, Zin, Zb...) is wrapped in the same `.t-r` class
     used site-wide via --colour-resistor-labels; capacitor/reactance terms
     (C, CC, XC) get `.t-c`/--colour-capacitor-labels; voltage terms get
     `.t-v`/--colour-voltage-label; current terms get `.t-i`/--colour-
     current; the two transistor SMALL-SIGNAL parameters (β, re) get
     `.t-b`/--colour-bjt-labels; the JFET/MOSFET transconductance term (Gm)
     gets `.t-g`/--colour-jfet-labels. Deliberately NOT coloured: dimension-
     less/derived quantities that aren't themselves a physical component or
     node (Resolution, Modulus, AV/AP/AT/dB gains, CMRR, η, phase, f, XL/XC's
     own f/L terms) — the user's own phrasing was "component types", and
     colouring literally everything (including plain numbers and "×") would
     defeat the purpose of using colour as a scan aid at all. A small legend
     at the top states the mapping explicitly.

  2. "Frac format" — reuses quiz-common.css's own `.working-frac`/`.num`/
     `.den` classes (the exact same stacked-fraction rendering already used
     in every quiz's own worked-solution panels, via assets/quiz-engine.js's
     `frac(num, den)` helper) for every formula that's a genuine division on
     the source sheet. A local `frac()` is redefined here identically (this
     page doesn't load quiz-engine.js, so it isn't available to import) —
     kept byte-for-byte compatible with the shared one specifically so this
     page's fraction rendering matches every other page's, not a look-alike
     reimplementation.

  Content is data-driven (a `SECTIONS` array of {title, formulas:[{html,
  note?}]}), rendered once at load — with ~89 formulas, hand-writing the
  repeated card/grid wrapper markup per entry would be far more error-prone
  than one render loop plus small `R()/Cp()/Vt()/It()/Bt()/Gt()` colour-span
  helpers and a `frac()`/`par()` (parallel-bars, "∥") helper. Verified after
  writing: `SECTIONS.reduce((n,s)=>n+s.formulas.length,0) === 89`, matching
  a manual recount of the two source photos row-by-row.

  One entry, "β = Vf/Vout", is transcribed EXACTLY as printed despite
  reading oddly out of context (unclear what it's meant to represent —
  doesn't match the standard β=IC/IB definition two cards over), flagged
  with an on-page note rather than silently "corrected" (same policy as
  digital_resources_ics.html's own flagged-uncertain-pinout note).

  "f = 1s/P" (Timing, Counters & Phase section) — confirmed with the user:
  the everyday frequency = 1/period identity, with the sheet's own symbol
  P for period. Rendered as f = 1/P with a plain (non-hedged) note stating
  that reading.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../assets/theme-init.js"></script>
  <title>Exam Equation Sheet — EC0066 &amp; EC0069</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/quiz-common.css">
  <script src="../../assets/breadcrumb.js" defer></script>
  <style>
    /* .back-link-row/.back-link aren't in quiz-common.css (only in
       nav-common.css, used by the index/topic-nav pages) — reproduced here
       with quiz-common.css's own tokens so this content page's back button
       looks identical to those, without pulling in a whole second
       stylesheet just for one pill button. */
    .back-link-row {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto .8rem;
      text-align: right;
    }

    .back-link {
      display: inline-block;
      font-size: .65rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--colour-ui-primary);
      text-decoration: none;
      padding: .15rem .6rem;
      border-radius: .25rem;
      border: 1px solid var(--colour-ui-primary);
      box-shadow: 0 0 8px rgba(var(--colour-ui-primary-rgb), .3);
      transition: color .2s, border-color .2s, box-shadow .2s;
    }

    .back-link:hover {
      color: var(--colour-ui-correct);
      border-color: var(--colour-ui-correct);
      box-shadow: 0 0 8px rgba(var(--colour-ui-correct-rgb), .3);
    }

    .intro {
      color: var(--colour-label);
      font-size: .85rem;
      line-height: 1.5;
      max-width: 720px;
      margin: 0 auto 1rem;
      text-align: center;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .5rem .9rem;
      max-width: 900px;
      margin: 0 auto 1.6rem;
      padding: .7rem 1rem;
      background: rgba(var(--colour-label-rgb), .06);
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-lg);
      font-size: .78rem;
      font-family: var(--font-mono);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: .35rem;
    }

    .legend-swatch {
      width: .7rem;
      height: .7rem;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .eq-section {
      max-width: 1100px;
      margin: 0 auto 1.8rem;
    }

    .eq-section-title {
      font-family: var(--font-display);
      font-size: clamp(.85rem, 2.4vw, 1.05rem);
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--colour-ui-primary);
      text-transform: uppercase;
      text-shadow: var(--glow-header);
      margin-bottom: .7rem;
      padding-bottom: .35rem;
      border-bottom: 1px solid var(--colour-border);
    }

    .eq-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: .7rem;
    }

    .eq-card {
      background: var(--colour-panel);
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-lg, 10px);
      padding: .8rem .9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 3.4rem;
    }

    .eq-formula {
      font-size: 1.02rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: .01em;
    }

    .eq-note {
      margin-top: .45rem;
      font-size: .68rem;
      font-weight: 400;
      font-style: italic;
      color: var(--colour-label);
      letter-spacing: normal;
    }

    .t-r { color: var(--colour-resistor-labels); }
    .t-c { color: var(--colour-capacitor-labels); }
    .t-v { color: var(--colour-voltage-label); }
    .t-i { color: var(--colour-current); }
    .t-b { color: var(--colour-bjt-labels); }
    .t-g { color: var(--colour-jfet-labels); }

    @media (max-width: 480px) {
      .eq-formula { font-size: .88rem; }
      .eq-card { padding: .7rem .6rem; }
      .eq-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>

<body>
  <div class="crumb" id="crumb" data-current="Exam Equation Sheet"></div>
  <header>
    <h1>Exam Equation Sheet</h1>
    <p>EC0066 &amp; EC0069 · Quick Reference</p>
  </header>

  <div class="back-link-row">
    <a id="backLink" class="back-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
  </div>

  <p class="intro">Every formula from the teacher's own printed equation sheet, grouped by topic. Colour coding marks
    component/quantity TYPE, not correctness — see the legend below.</p>

  <div class="legend" id="legend"></div>
  <div id="sheetContent"></div>

  <footer>Electronics // UEEEC0066 &amp; UEEEC0069 // Resources</footer>

  <script>
    const R = s => `<span class="t-r">${s}</span>`;
    const Cp = s => `<span class="t-c">${s}</span>`;
    const Vt = s => `<span class="t-v">${s}</span>`;
    const It = s => `<span class="t-i">${s}</span>`;
    const Bt = s => `<span class="t-b">${s}</span>`;
    const Gt = s => `<span class="t-g">${s}</span>`;
    const frac = (num, den) => `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
    const par = (...xs) => xs.join(' ∥ ');

    const SECTIONS = [
      {
        title: 'Number Systems, Resolution & DAC Scaling',
        formulas: [
          { html: `Resolution = ${frac('1', '2<sup>n</sup> − 1')} × 100` },
          { html: `Resolution = ${frac(Vt('V<sub>STEP</sub>'), Vt('V<sub>Full-scale</sub>'))} × 100` },
          { html: `Resolution = ${frac(Vt('V<sub>STEP</sub>'), Vt('V<sub>in(max)</sub>') + ' − ' + Vt('V<sub>in(min)</sub>'))}` },
          { html: `Highest number = 2<sup>n</sup> − 1` },
          { html: `Modulus = 2<sup>n</sup>` },
          { html: `${It('I<sub>FS</sub>')} = ${frac(Vt('V<sub>REF</sub>'), R('R<sub>REF</sub>'))} × ${frac('255', '256')}` },
          { html: `${It('I<sub>STEP</sub>')} = ${frac(It('I<sub>FS</sub>'), '255')}` },
          { html: `${It('I<sub>L</sub>')} = ${frac('P<sub>L</sub>', Vt('V<sub>L</sub>'))}` },
        ]
      },
      {
        title: 'Decibels & Multistage Gain',
        formulas: [
          { html: `A<sub>V(dB)</sub> = 20 Log(${frac(Vt('V<sub>out</sub>'), Vt('V<sub>in</sub>'))})` },
          { html: `A<sub>P(dB)</sub> = 10 Log(${frac('P<sub>out</sub>', 'P<sub>in</sub>')})` },
          { html: `CMRR = 20 Log(${frac('A<sub>v(Diff)</sub>', 'A<sub>v(CM)</sub>')})` },
          { html: `A<sub>T</sub> = A<sub>v(1)</sub> × A<sub>v(2)</sub> × A<sub>v(n)</sub>` },
          { html: `A<sub>T(dB)</sub> = A<sub>1(dB)</sub> + A<sub>2(dB)</sub> + A<sub>n(dB)</sub>` },
          { html: `A<sub>V(at fn)</sub> = A<sub>V(max)</sub> × 0.707` },
          { html: `A<sub>V</sub> = ${frac(Vt('V<sub>out</sub>'), Vt('V<sub>in</sub>'))}` },
          { html: `A<sub>vCL</sub> = ${frac(R('R<sub>f</sub>'), R('R<sub>1</sub>'))}` },
          { html: `A<sub>vCL</sub> = ${frac(R('R<sub>f</sub>'), R('R<sub>1</sub>'))} + 1` },
        ]
      },
      {
        title: 'Transistor Beta & Feedback',
        formulas: [
          { html: `${Bt('β')} = ${frac(It('I<sub>C</sub>'), It('I<sub>B</sub>'))}` },
          { html: `${Bt('β')} = ${frac(Vt('V<sub>f</sub>'), Vt('V<sub>out</sub>'))}`, note: 'As printed on the source sheet — worth double-checking against the original; doesn\'t match the standard β = IC/IB definition above.' },
          { html: `${Bt('β<sub>TOTAL</sub>')} = ${Bt('β<sub>1</sub>')} × ${Bt('β<sub>2</sub>')} × ${Bt('β<sub>n</sub>')}` },
          { html: `A<sub>vCL</sub> = ${frac('A<sub>vOL</sub>', '1 + A<sub>vOL</sub> × ' + Bt('β'))}` },
          { html: `Loop gain = A${Bt('β')}` },
        ]
      },
      {
        title: 'Timing, Counters & Phase',
        formulas: [
          { html: `t<sub>w</sub> = 0.7RC` },
          { html: `f = ${frac('1', 'P')}`, note: 'P = period. Frequency = 1 ÷ period (as printed: f = 1s/P).' },
          { html: `Phase difference = ${frac('time difference', 'period')} × 360°` },
        ]
      },
      {
        title: 'BJT DC Bias',
        formulas: [
          { html: `${Vt('V<sub>B</sub>')} = ${Vt('V<sub>CC</sub>')} × ${frac(R('R<sub>B2</sub>'), R('R<sub>B1</sub>') + ' + ' + R('R<sub>B2</sub>'))}` },
          { html: `${Vt('V<sub>E</sub>')} = ${Vt('V<sub>B</sub>')} − 0.6V` },
          { html: `${Vt('V<sub>E</sub>')} = ${Vt('V<sub>B</sub>')} + 0.6V` },
          { html: `${Vt('V<sub>CB</sub>')} = ${Vt('V<sub>C</sub>')} − ${Vt('V<sub>B</sub>')}` },
          { html: `${Vt('V<sub>CE</sub>')} = ${Vt('V<sub>C</sub>')} − ${Vt('V<sub>E</sub>')}` },
          { html: `${Vt('V<sub>C</sub>')} = ${Vt('V<sub>CC</sub>')} − (${It('I<sub>C</sub>')} × ${R('R<sub>C</sub>')})` },
          { html: `${It('I<sub>E</sub>')} = ${It('I<sub>B</sub>')} + ${It('I<sub>C</sub>')}` },
          { html: `${It('I<sub>E</sub>')} = ${frac(Vt('V<sub>E</sub>'), R('R<sub>E</sub>'))}` },
          { html: `${It('I<sub>B</sub>')} = ${frac(Vt('V<sub>CC</sub>') + ' − ' + Vt('V<sub>B</sub>'), R('R<sub>B</sub>'))}` },
          { html: `${It('I<sub>C1</sub>')} = ${It('I<sub>R1</sub>')} = ${frac(Vt('V<sub>CC</sub>') + ' − ' + Vt('V<sub>B1</sub>'), R('R<sub>1</sub>'))}` },
          { html: `${Bt('re')} = ${frac('26mV', It('I<sub>E</sub>'))}` },
        ]
      },
      {
        title: 'JFET / MOSFET DC Bias',
        formulas: [
          { html: `${Vt('V<sub>G</sub>')} = ${Vt('V<sub>DD</sub>')} × ${frac(R('R<sub>G2</sub>'), R('R<sub>G1</sub>') + ' + ' + R('R<sub>G2</sub>'))}` },
          { html: `${Vt('V<sub>DG</sub>')} = ${Vt('V<sub>D</sub>')} − ${Vt('V<sub>G</sub>')}` },
          { html: `${Vt('V<sub>DS</sub>')} = ${Vt('V<sub>D</sub>')} − ${Vt('V<sub>S</sub>')}` },
          { html: `${Vt('V<sub>D</sub>')} = ${Vt('V<sub>DD</sub>')} − (${It('I<sub>DS</sub>')} × ${R('R<sub>D</sub>')})` },
          { html: `${Vt('V<sub>S</sub>')} = ${Vt('V<sub>G</sub>')} − ${Vt('V<sub>GS</sub>')}` },
          { html: `${It('I<sub>DS</sub>')} = ${frac(Vt('V<sub>S</sub>'), R('R<sub>S</sub>'))}` },
        ]
      },
      {
        title: 'Differential Amplifier',
        formulas: [
          { html: `${It('I<sub>T</sub>')} = ${frac(Vt('V<sub>EE</sub>'), R('R<sub>E</sub>'))}` },
          { html: `${It('I<sub>T</sub>')} = ${frac(Vt('V<sub>E1</sub>') + ' − ' + Vt('V<sub>EE</sub>'), R('R<sub>E</sub>'))}` },
          { html: `${It('I<sub>T</sub>')} = ${frac(Vt('V<sub>CC</sub>') + ' − ' + Vt('V<sub>E</sub>'), R('R<sub>E</sub>'))}` },
          { html: `${It('I<sub>C1</sub>')} = ${It('I<sub>C2</sub>')} = ${frac(It('I<sub>T</sub>'), '2')}` },
          { html: `${Vt('V<sub>C1</sub>')} = ${Vt('V<sub>C2</sub>')} = −${Vt('V<sub>EE</sub>')} + ${Vt('V<sub>RC1</sub>')}` },
          { html: `A<sub>V(Diff)</sub> = ${frac(R('R<sub>C</sub>'), '2 × ' + Bt('re'))}` },
          { html: `A<sub>V(CM)</sub> = ${frac(R('R<sub>C</sub>'), '2 × ' + R('R<sub>E</sub>'))}` },
        ]
      },
      {
        title: 'AC Voltage Gain — BJT',
        formulas: [
          { html: `A<sub>v(Unloaded)</sub> = ${frac(R('R<sub>C</sub>'), Bt('re'))}` },
          { html: `A<sub>v(Unloaded)</sub> = ${frac(R('R<sub>C</sub>'), R('R<sub>E</sub>') + ' + ' + Bt('re'))}` },
          { html: `A<sub>v(Loaded)</sub> = ${frac(par(R('R<sub>C</sub>'), R('R<sub>L</sub>')), Bt('re'))}` },
          { html: `A<sub>v(Loaded)</sub> = ${frac(par(R('R<sub>C</sub>'), R('R<sub>L</sub>')), R('R<sub>E</sub>') + ' + ' + Bt('re'))}` },
          { html: `A<sub>v(Unloaded)</sub> = ${frac(R('R<sub>E</sub>'), R('R<sub>E</sub>') + ' + ' + Bt('re'))}`, note: 'Emitter follower / common collector.' },
        ]
      },
      {
        title: 'AC Voltage Gain — FET',
        formulas: [
          { html: `A<sub>v(Unloaded)</sub> = ${Gt('Gm')} × ${R('R<sub>D</sub>')}` },
          { html: `A<sub>v(Loaded)</sub> = ${Gt('Gm')} × ${par(R('R<sub>D</sub>'), R('R<sub>L</sub>'))}` },
          { html: `A<sub>v(Unloaded)</sub> = ${frac(Gt('Gm') + ' × ' + R('R<sub>S</sub>'), '1 + (' + Gt('Gm') + ' × ' + R('R<sub>S</sub>') + ')')}`, note: 'Source follower / common drain.' },
          { html: `${Gt('Gm')} = ${frac('Δ' + It('I<sub>DS</sub>'), 'Δ' + Vt('V<sub>GS</sub>'))}` },
        ]
      },
      {
        title: 'Input / Output Resistance',
        formulas: [
          { html: `Rin = ${R('R<sub>G</sub>')}` },
          { html: `Rin = ${par(R('R<sub>G1</sub>'), R('R<sub>G2</sub>'))}` },
          { html: `Rin = ${par(R('R<sub>B1</sub>'), R('R<sub>B2</sub>'), Bt('β') + ' × ' + Bt('re'))}` },
          { html: `Rin = ${par(R('R<sub>B1</sub>'), R('R<sub>B2</sub>'), Bt('β') + ' × (' + R('R<sub>E</sub>') + ' + ' + Bt('re') + ')')}` },
          { html: `Zin = ${par(R('R<sub>B1</sub>'), '2 × ' + Bt('β') + ' × ' + Bt('re'))}` },
          { html: `Rout = ${R('R<sub>C</sub>')}` },
          { html: `Rout = ${R('R<sub>D</sub>')}` },
          { html: `Rout ≈ ${frac('1', Gt('Gm'))}` },
          { html: `Rout = ${par(R('R<sub>E</sub>'), '(' + Bt('re') + ' + ' + frac(par(R('R<sub>B1</sub>'), R('R<sub>B2</sub>')), Bt('β')) + ')')}` },
        ]
      },
      {
        title: 'Loading & Signal Transfer',
        formulas: [
          { html: `${Vt('V<sub>in</sub>')} = ${Vt('V<sub>s(Unloaded)</sub>')} × ${frac('Rin', 'Rout<sub>(source)</sub> + Rin')}` },
          { html: `${Vt('V<sub>out(Loaded)</sub>')} = ${Vt('V<sub>out(Unloaded)</sub>')} × ${frac(R('R<sub>L</sub>'), 'Rout + ' + R('R<sub>L</sub>'))}` },
          { html: `${Vt('V<sub>in(max)</sub>')} = ${frac(Vt('V<sub>out(max)</sub>'), 'Av')}` },
        ]
      },
      {
        title: 'Maximum Output Swing',
        formulas: [
          { html: `${Vt('V<sub>out(max)</sub>')} = (${Vt('V<sub>CC</sub>')} − ${Vt('V<sub>C</sub>')}) × 2` },
          { html: `${Vt('V<sub>out(max)</sub>')} = ${Vt('V<sub>C</sub>')} × 2` },
          { html: `${Vt('V<sub>out(max)</sub>')} = (${Vt('V<sub>CC</sub>')} − ${Vt('V<sub>E</sub>')}) × 2` },
          { html: `${Vt('V<sub>out(max)</sub>')} = ${Vt('V<sub>E</sub>')} × 2` },
          { html: `${Vt('V<sub>out(max)</sub>')} = (${Vt('V<sub>DD</sub>')} − ${Vt('V<sub>D</sub>')}) × 2` },
          { html: `${Vt('V<sub>out(max)</sub>')} = ${Vt('V<sub>D</sub>')} × 2` },
          { html: `${Vt('V<sub>out(max)</sub>')} = (${Vt('V<sub>DD</sub>')} − ${Vt('V<sub>S</sub>')}) × 2` },
          { html: `${Vt('V<sub>out(max)</sub>')} = ${Vt('V<sub>S</sub>')} × 2` },
        ]
      },
      {
        title: 'Power & Efficiency',
        formulas: [
          { html: `P<sub>DC</sub> = I<sub>S(ave)</sub> × ${Vt('V<sub>S</sub>')}` },
          { html: `P<sub>out</sub> = ${frac('(' + Vt('V<sub>Load(rms)</sub>') + ')<sup>2</sup>', R('R<sub>L</sub>'))}` },
          { html: `P<sub>out(max)</sub> = ${frac('(' + Vt('V<sub>Load(max rms)</sub>') + ')<sup>2</sup>', R('R<sub>L</sub>'))}` },
          { html: `η = ${frac('P<sub>out</sub>', 'P<sub>in</sub>')} × 100` },
        ]
      },
      {
        title: 'AC Fundamentals',
        formulas: [
          { html: `${Vt('V<sub>RMS</sub>')} = ${Vt('V<sub>p</sub>')} × 0.707` },
          { html: `${It('I<sub>RMS</sub>')} = ${It('I<sub>p</sub>')} × 0.707` },
          { html: `X<sub>L</sub> = 2πfL` },
          { html: `X<sub>C</sub> = ${frac('1', '2πf' + Cp('C'))}` },
        ]
      },
      {
        title: 'Frequency Response — f1 Roll-Off',
        formulas: [
          { html: `f<sub>1</sub> = ${frac('1', '2πR<sub>T</sub>' + Cp('C<sub>C</sub>'))}` },
          { html: `f<sub>1</sub> = ${frac('1', '2πR<sub>IN</sub>' + Cp('C<sub>C</sub>'))}` },
        ]
      },
      {
        title: 'Miscellaneous',
        formulas: [
          { html: `R = ${frac('V<sub>R</sub>', 'I<sub>LED</sub>')}`, note: 'LED current-limiting resistor.' },
        ]
      },
    ];

    const LEGEND = [
      { cls: 't-r', label: 'Resistor / Resistance' },
      { cls: 't-c', label: 'Capacitor / Reactance' },
      { cls: 't-v', label: 'Voltage' },
      { cls: 't-i', label: 'Current' },
      { cls: 't-b', label: 'BJT parameter (β, re)' },
      { cls: 't-g', label: 'FET parameter (Gm)' },
    ];

    document.getElementById('legend').innerHTML = LEGEND.map(l =>
      `<span class="legend-item"><span class="legend-swatch" style="background:var(--colour-${l.cls === 't-r' ? 'resistor-labels' : l.cls === 't-c' ? 'capacitor-labels' : l.cls === 't-v' ? 'voltage-label' : l.cls === 't-i' ? 'current' : l.cls === 't-b' ? 'bjt-labels' : 'jfet-labels'})"></span>${l.label}</span>`
    ).join('');

    document.getElementById('sheetContent').innerHTML = SECTIONS.map(sec => `
      <div class="eq-section">
        <div class="eq-section-title">${sec.title}</div>
        <div class="eq-grid">
          ${sec.formulas.map(f => `<div class="eq-card"><div class="eq-formula">${f.html}</div>${f.note ? `<div class="eq-note">${f.note}</div>` : ''}</div>`).join('')}
        </div>
      </div>
    `).join('');

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) { document.getElementById('backLink').style.display = ''; }
  </script>
</body>

</html>
