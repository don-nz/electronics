<!--
  MIGRATED to the shared engine/styles, this session, at the user's own
  request: "I have brought in a quiz I wrote last year that was on a
  subject already completed... Can you update this so it uses the common
  styles, engine and has the same back button and option to just check the
  answer to see the correct value?" The original file (a hand-built,
  bespoke quiz predating assets/quiz-engine.js entirely — its own custom
  CSS design tokens, its own hand-rolled Check/Next/Back/Restart engine,
  its own zoom-modal) already had a Check-then-reveal pattern and a menu
  link, so the FUNCTIONAL behaviour asked for already existed; the ask was
  specifically to bring the STYLING and ENGINE in line with every other
  quiz in this project (quiz-common.css, assets/quiz-engine.js, the
  standard ← Back link via initQuizNav()).

  This is a content-preserving STYLE/ENGINE port, not a content rewrite —
  every question's own wording, correct answer, wrong-option values and
  worked-solution reasoning are carried over unchanged from the original;
  only the presentation (colour-coded frac() formulas matching every other
  quiz's own convention) and the underlying mechanics changed. 19 questions
  across 7 circuit diagrams, same order as the original QUESTION_DEFS
  (open, inverting, non-inverting, summing, comparator, night-light).

  ONE deliberate architecture change, forced by the shared engine's own
  design: the original toggled annotations (revealed values, flashing
  highlight rings) ON TOP OF a small, fixed set of shared SVG groups as
  questions were answered — a feature the shared engine doesn't have (every
  other quiz in this project instead gives each question its own fully-
  baked STATIC circuitId, swapped via circuitId/circuitLabel/circuitViewBox,
  with computed values living in the text/hint/working() panel rather than
  appearing on the diagram itself). Ported to that same convention here:
  each of the 7 circuit TOPOLOGIES below is its own static `fig-op-*` circuit
  (component values always shown as GIVEN labels, matching every other
  quiz's own convention, rather than hidden until revealed), and the two
  cases where the original literally showed a MODIFIED circuit get their
  own separate variant — `fig-op-comparator-r2mod` (R2 changed 4kΩ→12kΩ,
  comp_4 only) — rather than one circuit mutating live. Flashing highlight
  rings and the "hide the panel label on the identify-this-circuit
  question" trick are dropped (no directly equivalent engine feature); the
  panel-label trick is approximated instead by giving each circuit's own
  FIRST (identify) question circuitLabel:'Reference Circuit' (the engine's
  own fallback default for an empty label) and only naming the circuit for
  later questions in that same group, once it's already been identified.

  Colour mapping from the original's own bespoke --col-* tokens to this
  project's shared quiz-common.css tokens: wires/junctions → --colour-series,
  resistor boxes/names → --colour-resistor/--colour-resistor-labels
  (component VALUES stay plain --colour-text, matching every other quiz's
  own R-label-vs-value convention), the op-amp triangle body/±terminals →
  --colour-switch, supply rails (+12V/−12V/+Vcc/−Vee/+9V) → --colour-supply,
  signal sources (Vin terminals) → --colour-voltage-label, output labels →
  --colour-signal, common/ground → --colour-gnd, AvOL/AvCL gain figures →
  --colour-gain, the chip part number (LM741/TL072) → --colour-label.
-->
