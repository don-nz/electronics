<!--
  Total Resistance Calculation Quiz 3 — brought into the shared framework (quiz-engine.js, quiz-common.css) from the original
  hand-built page in quiz/resistor/. The circuit drawing, example value sets, wrong-answer logic and
  worked solutions are the original's; the question order, hints and per-question annotation states
  (CIRCUIT_STATES) are unchanged. What the diagram shows at each question is applied by
  applyCircuitState() from RENDER_EXTRA: the "enter" state on arrival and the "reveal" state once
  answered.

  This is the step-by-step walkthrough for resistor_quiz_3.html: each question combines resistors
  (COMBINE_STEPS) and the diagram swaps to the next layout (layout0…) as steps are solved. Arriving
  with ?r1…&vs=…&return=quiz3 shows the same circuit as the quiz and offers a way back.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>Total Resistance Calculation Quiz 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
</head>

<body>
  <div class="crumb" id="crumb" data-current="Total Resistance Calculation Quiz 3"></div>
  <header>
    <h1>Total Resistance Calculation Quiz 3</h1>
    <p>Step-by-Step Simplification · Total Resistance</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="mode-toggle">
      <div class="mode-seg" id="modeSeg">
        <button id="modeExample1" class="active" onclick="setMode('example1')">Example 1</button>
        <button id="modeExample2" onclick="setMode('example2')">Example 2</button>
        <button id="modeExample3" onclick="setMode('example3')">Example 3</button>
        <button id="modeRandomise" onclick="setMode('randomise')">Randomise</button>
      </div>
    </div>

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()" title="Click to zoom">
        <div class="panel-label">Circuit Diagram — <span id="panelVoltLabel">20 V</span> Source</div>
        <div class="zoom-hint">
          <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none" />
            <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <line x1="6" y1="8" x2="10" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="8" y1="6" x2="8" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Zoom
        </div>
        <svg id="circuitSvg" viewBox="0 0 480 700" xmlns="http://www.w3.org/2000/svg"
           font-family="'Share Tech Mono',monospace">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- ════════════════════ SHARED FRAME ════════════════════ -->

        <!-- (left rail + battery) — identical in every layout, lives outside the toggle -->
        <!-- groups. Unlike quiz4's helper, quiz3's outer loop never resizes between steps -->
        <!-- (only the R2∥R3 and R4∥R5 banks change internally), so the ENTIRE left rail — -->
        <!-- not just the battery's immediate wires — can be shared. -->
        <line x1="70" y1="90"  x2="70" y2="300" style="stroke: var(--colour-series)"/><!-- top rail down to battery+ -->
        <g id="batteryGroup" transform="translate(70,300)">
          <line x1="-22" y1="0" x2="22" y2="0" style="stroke: var(--colour-red)" stroke-width="4"/>
          <line x1="-12" y1="30" x2="12" y2="30" style="stroke: var(--colour-red)" stroke-width="2"/>
          <text x="34" y="5" style="fill: var(--colour-red)" font-size="16" font-weight="bold">+</text>
          <text x="34" y="36" style="fill: var(--colour-red)" font-size="16" font-weight="bold">−</text>
          <text x="-30" y="-12" style="fill: var(--colour-supply)" font-size="15" text-anchor="end" font-weight="bold">E</text>
          <text id="battLabel" x="-30" y="50" style="fill: var(--colour-supply)" font-size="15" text-anchor="end" font-weight="bold">20V</text>
        </g>
        <line x1="70" y1="330" x2="70" y2="610" style="stroke: var(--colour-series)"/><!-- battery− down to bottom rail -->

        <!-- ══════════════════════════════════════════════════════════════
             Each <g class="circuit-layout"> below is a SELF-CONTAINED
             mini-diagram for one stage of the simplification. Only one is
             shown at a time (showLayout() in the script toggles display).
             All element ids are prefixed L0-…L3- to avoid collisions.
             Layout0 mirrors resistor_quiz_3.html's circuit exactly (same
             textbook topology) — keep the two in sync if either changes.
             ══════════════════════════════════════════════════════════════ -->

        <!-- ════════════════════ LAYOUT 0 ════════════════════ -->

        <!-- full circuit, nothing combined yet; Q1 asks about R2∥R3 -->
        <g id="layout0" class="circuit-layout">
          <line x1="70"  y1="90"  x2="140" y2="90"  style="stroke: var(--colour-series)"/><!-- Top-left corner across to R1 -->
          <line x1="240" y1="90"  x2="300" y2="90"  style="stroke: var(--colour-series)"/><!-- R1 across to centre spine -->
          <line x1="300" y1="610" x2="240" y2="610" style="stroke: var(--colour-series)"/><!-- Centre spine across to R6 -->
          <line x1="140" y1="610" x2="70"  y2="610" style="stroke: var(--colour-series)"/><!-- R6 across to bottom-left corner -->

          <line x1="300" y1="90"  x2="300" y2="170" style="stroke: var(--colour-series)"/><!-- Spine down to Group 1 top rail -->
          <line x1="230" y1="170" x2="230" y2="212" style="stroke: var(--colour-series)"/><!-- Group 1 top rail down to R2 -->
          <line x1="370" y1="170" x2="370" y2="212" style="stroke: var(--colour-series)"/><!-- Group 1 top rail down to R3 -->
          <line x1="230" y1="287" x2="230" y2="329" style="stroke: var(--colour-series)"/><!-- R2 down to Group 1 bottom rail -->
          <line x1="370" y1="287" x2="370" y2="329" style="stroke: var(--colour-series)"/><!-- R3 down to Group 1 bottom rail -->
          <line x1="300" y1="329" x2="300" y2="400" style="stroke: var(--colour-series)"/><!-- Spine, Group 1 to Group 2 -->
          <line x1="230" y1="400" x2="230" y2="442" style="stroke: var(--colour-series)"/><!-- Group 2 top rail down to R4 -->
          <line x1="370" y1="400" x2="370" y2="442" style="stroke: var(--colour-series)"/><!-- Group 2 top rail down to R5 -->
          <line x1="230" y1="517" x2="230" y2="559" style="stroke: var(--colour-series)"/><!-- R4 down to Group 2 bottom rail -->
          <line x1="370" y1="517" x2="370" y2="559" style="stroke: var(--colour-series)"/><!-- R5 down to Group 2 bottom rail -->
          <line x1="300" y1="559" x2="300" y2="610" style="stroke: var(--colour-series)"/><!-- Group 2 bottom rail down to R6 -->
          <line x1="230" y1="170" x2="370" y2="170" style="stroke: var(--colour-series)"/><!-- Group 1 top rail (R2 to R3) -->
          <line x1="230" y1="329" x2="370" y2="329" style="stroke: var(--colour-series)"/><!-- Group 1 bottom rail (R2 to R3) -->
          <line x1="230" y1="400" x2="370" y2="400" style="stroke: var(--colour-series)"/><!-- Group 2 top rail (R4 to R5) -->
          <line x1="230" y1="559" x2="370" y2="559" style="stroke: var(--colour-series)"/><!-- Group 2 bottom rail (R4 to R5) -->

          <!-- ── NODES (A, B, C) — matches resistor_quiz_3.html's layout exactly ── -->
          <circle cx="300" cy="170" r="5" style="fill: var(--colour-series)"/>
          <g id="L0-nodeA" transform="translate(320,151)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="-4" y="4" style="fill: var(--colour-node)" font-size="15" font-weight="bold">A</text>
          </g>
          <circle cx="300" cy="329" r="5" style="fill: var(--colour-series)"/>
          <g id="L0-nodeB1" transform="translate(280,350)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="-4" y="4" style="fill: var(--colour-node)" font-size="15" font-weight="bold">B</text>
          </g>
          <circle cx="300" cy="400" r="5" style="fill: var(--colour-series)"/>
          <g id="L0-nodeB2" transform="translate(320,380)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="-4" y="4" style="fill: var(--colour-node)" font-size="15" font-weight="bold">B</text>
          </g>
          <circle cx="300" cy="559" r="5" style="fill: var(--colour-series)"/>
          <g id="L0-nodeC" transform="translate(324,580)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="-4" y="4" style="fill: var(--colour-node)" font-size="15" font-weight="bold">C</text>
          </g>

          <g id="L0-r1Group" transform="translate(140,74)">
            <rect id="L0-box-r1" x="0" y="0" width="100" height="32" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L0-nm-r1" x="50" y="-10" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="15" font-weight="bold">R1</text>
            <text id="L0-lbl-r1" x="50" y="52" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">100Ω</text>
          </g>
          <g id="L0-r2Group" transform="translate(214,212)">
            <rect id="L0-box-r2" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor-combo1)" stroke-width="2" filter="url(#glow)"/>
            <text id="L0-nm-r2" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R2</text>
            <text id="L0-lbl-r2" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">50Ω</text>
          </g>
          <g id="L0-r3Group" transform="translate(354,212)">
            <rect id="L0-box-r3" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor-combo1)" stroke-width="2" filter="url(#glow)"/>
            <text id="L0-nm-r3" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R3</text>
            <text id="L0-lbl-r3" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">200Ω</text>
          </g>
          <g id="L0-r4Group" transform="translate(214,442)">
            <rect id="L0-box-r4" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L0-nm-r4" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R4</text>
            <text id="L0-lbl-r4" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">80Ω</text>
          </g>
          <g id="L0-r5Group" transform="translate(354,442)">
            <rect id="L0-box-r5" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L0-nm-r5" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R5</text>
            <text id="L0-lbl-r5" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">80Ω</text>
          </g>
          <g id="L0-r6Group" transform="translate(140,594)">
            <rect id="L0-box-r6" x="0" y="0" width="100" height="32" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L0-nm-r6" x="50" y="-10" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="15" font-weight="bold">R6</text>
            <text id="L0-lbl-r6" x="50" y="52" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">30Ω</text>
          </g>
        </g>

        <!-- ════════════════════ LAYOUT 1 ════════════════════ -->

        <!-- R2∥R3 combined into R23 (Q1 solved); Q2 asks about R4∥R5 -->
        <g id="layout1" class="circuit-layout" display="none">
          <line x1="70"  y1="90"  x2="140" y2="90"  style="stroke: var(--colour-series)"/><!-- Top-left corner across to R1 -->
          <line x1="240" y1="90"  x2="300" y2="90"  style="stroke: var(--colour-series)"/><!-- R1 across to centre spine -->
          <line x1="300" y1="610" x2="240" y2="610" style="stroke: var(--colour-series)"/><!-- Centre spine across to R6 -->
          <line x1="140" y1="610" x2="70"  y2="610" style="stroke: var(--colour-series)"/><!-- R6 across to bottom-left corner -->
          <line x1="300" y1="90"  x2="300" y2="205" style="stroke: var(--colour-series)"/><!-- Spine down to R2,3 box top -->
          <line x1="300" y1="295" x2="300" y2="400" style="stroke: var(--colour-series)"/><!-- R2,3 box bottom down to Group 2 top rail -->
          <line x1="230" y1="400" x2="230" y2="442" style="stroke: var(--colour-series)"/><!-- Group 2 top rail down to R4 -->
          <line x1="370" y1="400" x2="370" y2="442" style="stroke: var(--colour-series)"/><!-- Group 2 top rail down to R5 -->
          <line x1="230" y1="517" x2="230" y2="559" style="stroke: var(--colour-series)"/><!-- R4 down to Group 2 bottom rail -->
          <line x1="370" y1="517" x2="370" y2="559" style="stroke: var(--colour-series)"/><!-- R5 down to Group 2 bottom rail -->
          <line x1="300" y1="559" x2="300" y2="610" style="stroke: var(--colour-series)"/><!-- Group 2 bottom rail down to R6 -->
          <line x1="230" y1="400" x2="370" y2="400" style="stroke: var(--colour-series)"/><!-- Group 2 top rail (R4 to R5) -->
          <line x1="230" y1="559" x2="370" y2="559" style="stroke: var(--colour-series)"/><!-- Group 2 bottom rail (R4 to R5) -->

          <!-- ── NODES (B, C) — Node A no longer exists (R2,3 is now a single path, not a -->
          <!-- branch); the two B instances collapse to one, at the surviving branch point. ── -->
          <circle cx="300" cy="400" r="5" style="fill: var(--colour-series)"/>
          <g id="L1-nodeB" transform="translate(320,380)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="-4" y="4" style="fill: var(--colour-node)" font-size="15" font-weight="bold">B</text>
          </g>
          <circle cx="300" cy="559" r="5" style="fill: var(--colour-series)"/>
          <g id="L1-nodeC" transform="translate(324,580)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="-4" y="4" style="fill: var(--colour-node)" font-size="15" font-weight="bold">C</text>
          </g>

          <g id="L1-r1Group" transform="translate(140,74)">
            <rect id="L1-box-r1" x="0" y="0" width="100" height="32" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L1-nm-r1" x="50" y="-10" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="15" font-weight="bold">R1</text>
            <text id="L1-lbl-r1" x="50" y="52" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">100Ω</text>
          </g>
          <g id="L1-r23Group" transform="translate(281,205)">
            <rect id="L1-box-r23" x="0" y="0" width="38" height="90" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor-combo1)" stroke-width="2" filter="url(#glow)"/>
            <text id="L1-nm-r23" x="-6" y="49" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="15" font-weight="bold">R<tspan baseline-shift="sub" font-size="10">2,3</tspan></text>
            <text id="L1-lbl-r23" x="44" y="49" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">—</text>
          </g>
          <g id="L1-r4Group" transform="translate(214,442)">
            <rect id="L1-box-r4" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L1-nm-r4" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R4</text>
            <text id="L1-lbl-r4" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">80Ω</text>
          </g>
          <g id="L1-r5Group" transform="translate(354,442)">
            <rect id="L1-box-r5" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L1-nm-r5" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R5</text>
            <text id="L1-lbl-r5" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">80Ω</text>
          </g>
          <g id="L1-r6Group" transform="translate(140,594)">
            <rect id="L1-box-r6" x="0" y="0" width="100" height="32" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L1-nm-r6" x="50" y="-10" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="15" font-weight="bold">R6</text>
            <text id="L1-lbl-r6" x="50" y="52" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">30Ω</text>
          </g>
        </g>

        <!-- ════════════════════ LAYOUT 2 ════════════════════ -->

        <!-- R4∥R5 combined into R45 (Q2 solved); Q3 asks about R1+R23 -->
        <g id="layout2" class="circuit-layout" display="none">
          <line x1="70"  y1="90"  x2="140" y2="90"  style="stroke: var(--colour-series)"/><!-- Top-left corner across to R1 -->
          <line x1="240" y1="90"  x2="300" y2="90"  style="stroke: var(--colour-series)"/><!-- R1 across to centre spine -->
          <line x1="300" y1="610" x2="240" y2="610" style="stroke: var(--colour-series)"/><!-- Centre spine across to R6 -->
          <line x1="140" y1="610" x2="70"  y2="610" style="stroke: var(--colour-series)"/><!-- R6 across to bottom-left corner -->
          <line x1="300" y1="90"  x2="300" y2="205" style="stroke: var(--colour-series)"/><!-- Spine down to R2,3 box top -->
          <line x1="300" y1="295" x2="300" y2="435" style="stroke: var(--colour-series)"/><!-- R2,3 box bottom down to R4,5 box top -->
          <line x1="300" y1="525" x2="300" y2="610" style="stroke: var(--colour-series)"/><!-- R4,5 box bottom down to R6 stub -->

          <!-- No nodes — both banks are now single boxes, so the circuit is a plain -->
          <!-- series loop (R1 → R2,3 → R4,5 → R6) with no branch points left. -->

          <g id="L2-r1Group" transform="translate(140,74)">
            <rect id="L2-box-r1" x="0" y="0" width="100" height="32" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L2-nm-r1" x="50" y="-10" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="15" font-weight="bold">R1</text>
            <text id="L2-lbl-r1" x="50" y="52" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">100Ω</text>
          </g>
          <g id="L2-r23Group" transform="translate(281,205)">
            <rect id="L2-box-r23" x="0" y="0" width="38" height="90" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L2-nm-r23" x="-6" y="49" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="15" font-weight="bold">R<tspan baseline-shift="sub" font-size="10">2,3</tspan></text>
            <text id="L2-lbl-r23" x="44" y="49" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">—</text>
          </g>
          <g id="L2-r45Group" transform="translate(281,435)">
            <rect id="L2-box-r45" x="0" y="0" width="38" height="90" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor-combo2)" stroke-width="2" filter="url(#glow)"/>
            <text id="L2-nm-r45" x="-6" y="49" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="15" font-weight="bold">R<tspan baseline-shift="sub" font-size="10">4,5</tspan></text>
            <text id="L2-lbl-r45" x="44" y="49" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">—</text>
          </g>
          <g id="L2-r6Group" transform="translate(140,594)">
            <rect id="L2-box-r6" x="0" y="0" width="100" height="32" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L2-nm-r6" x="50" y="-10" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="15" font-weight="bold">R6</text>
            <text id="L2-lbl-r6" x="50" y="52" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">30Ω</text>
          </g>
        </g>

  <script>
// ── Example value sets — mirrors resistor_quiz_3.html's own three sets ──
const EXAMPLE_SETS = {
  example1: { r1:100, r2:50, r3:200, r4:80, r5:80,  r6:30, vs:20 },
  example2: { r1:120, r2:39, r3:150, r4:47, r5:82,  r6:27, vs:24 },
  example3: { r1:180, r2:56, r3:220, r4:68, r5:120, r6:33, vs:36 }
};
let quizMode = 'example1';
let V = { ...EXAMPLE_SETS.example1 };

// Number of questions in the chain.
// If you add or remove questions, update this AND CIRCUIT_STATES[],
// QUESTION_BUILDERS[], the buildQnOptions/checkQn function sets, and
// the matching HTML panels (q1Panel…qnPanel, q1Check…qnCheck, etc.).
const QUIZ_QUESTION_COUNT = 3;
const QIDS = Array.from({length: QUIZ_QUESTION_COUNT}, (_,i) => 'q'+(i+1));

// ══════════════════════════════════════════════════════════════════════
// QUESTION TEXT — edit here to change questions and hints
// ══════════════════════════════════════════════════════════════════════
const LEGACY_QS = [
  {
    text: 'What is R<sub>2,3</sub> = R2 ∥ R3 (in parallel)?',
    hint: 'R2 and R3 are in parallel with each other — combine them with the reciprocal formula.'
  },
  {
    text: 'What is R<sub>4,5</sub> = R4 ∥ R5 (in parallel)?',
    hint: 'R4 and R5 are in parallel with each other — combine them with the reciprocal formula.'
  },
  {
    text: 'All remaining values — R1, R<sub>2,3</sub>, R<sub>4,5</sub> and R6 — are in series. What is the total resistance R<sub>T</sub>?',
    hint: 'Add all four values together for the final total resistance.'
  }
];

// ══════════════════════════════════════════════════════════════════════
// END CIRCUIT CONFIGURATION
// ══════════════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════════════
// CIRCUIT SIMULATION
// Rewrite this section for a new circuit topology.
// ══════════════════════════════════════════════════════════════════════

// ── E12 pool + generator for Randomise mode ──
const E12_BASE=[10,12,15,18,22,27,33,39,47,56,68,82];
const E12=[]; [1,10].forEach(m=>E12_BASE.forEach(v=>E12.push(v*m)));
function pickN(arr,n){const a=[...arr],r=[];for(let i=0;i<n;i++){r.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);}return r;}
function randomValues(){
  const a=pickN(E12,6);
  const vsOpts=[20,30,40,50,60,80,100];
  return { r1:a[0],r2:a[1],r3:a[2],r4:a[3],r5:a[4],r6:a[5],
           vs:vsOpts[Math.floor(Math.random()*vsOpts.length)] };
}

function fmtO(v){return v>=1000?(v/1000).toFixed(2)+' kΩ':v.toFixed(2)+' Ω';}
function fmtO0(v){return v>=1000?(v/1000).toFixed(2)+'kΩ':v+'Ω';}
function fmtA(a){const x=Math.abs(a);if(x>=1)return a.toFixed(3)+' A';if(x>=0.001)return (a*1000).toFixed(2)+' mA';return (a*1e6).toFixed(1)+' µA';}
function fmtASplit(a){const x=Math.abs(a);if(x>=1)return {num:a.toFixed(3),unit:'A'};if(x>=0.001)return {num:(a*1000).toFixed(2),unit:'mA'};return {num:(a*1e6).toFixed(1),unit:'µA'};}
function fmtV(v){const a=Math.abs(v);if(a>=1)return v.toFixed(2)+' V';if(a>=0.001)return (v*1000).toFixed(2)+' mV';return (v*1e6).toFixed(1)+' µV';}
function frac(num,den){return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;}

// ── COMBINE_STEPS: the data-driven step list — this is what to edit to  ──
// ── rearrange the quiz. Each step combines exactly two values (raw       ──
// ── resistors and/or earlier results) into one named result.             ──
// a/b: keys into VALUES (raw r1…r6, or an earlier step's key).
// op: 'series' (add) or 'parallel' (reciprocal-sum).
// count: how many ORIGINAL resistors this result represents — drives the
//        combined box's size in the SVG (see BOX_SCALE) and must match
//        whatever box you draw for layoutAfter.
// layoutAfter: which <g id="layoutN"> becomes visible once this step is solved.
// cls: the .c1…c5 colour class for this step's group colour, used in the
// worked-solution text. The matching SVG colour lives on each step's input
// boxes (in the layout where that question is asked) and its result box
// (in the layout where it's first shown) — see the layout<N> groups.
// labelLayouts: every layout that draws this result's OWN value-label box —
// usually just [layoutAfter], but a result that survives to be an input to
// a LATER (non-adjacent) step, like R35 here (created in step 1, but not
// consumed until step 4), has extra copies of its box in the layouts in
// between too, and every copy needs its text kept in sync.
// The final step (rt) combines FOUR values (a,b,c,d) instead of two — R1,
// R2,3, R4,5 and R6 are all in series with nothing left to pair up, so it's
// a straight 4-way sum rather than another binary combine. op is always
// 'series' when c/d are present; buildStepOptions/showStepWorking
// special-case it (see combineMany).
const COMBINE_STEPS = [
  { key:'r23', label:'R<sub>2,3</sub>', a:'r2', b:'r3', aLabel:'R2', bLabel:'R3', op:'parallel', count:2, layoutAfter:1, cls:'c1', labelLayouts:[1,2] },
  { key:'r45', label:'R<sub>4,5</sub>', a:'r4', b:'r5', aLabel:'R4', bLabel:'R5', op:'parallel', count:2, layoutAfter:2, cls:'c2', labelLayouts:[2,3] },
  { key:'rt',  label:'R<sub>T</sub>',   a:'r1', b:'r23', c:'r45', d:'r6', aLabel:'R1', bLabel:'R2,3', cLabel:'R4,5', dLabel:'R6', op:'series', count:6, layoutAfter:3, cls:'ct', labelLayouts:[3] },
];
// Box-size multiplier for a combined resistor, by how many originals it
// represents (n=2 → 20% larger, n=3 → 30% larger, etc). A single,
// uncombined resistor (n=1) is always drawn at its normal 1.0 size.
function boxScale(n){ return n<=1 ? 1 : 1+0.1*n; }

// ── derived (recomputed whenever the value set changes) ──
let VALUES={};
function combine(op,a,b){ return op==='series' ? a+b : 1/(1/a+1/b); }
// N-way version (N>=3) — used for any step with a c and/or d input.
function combineMany(op,vals){ return op==='series' ? vals.reduce((s,v)=>s+v,0) : 1/vals.reduce((s,v)=>s+1/v,0); }
function stepTermKeys(step){ return [step.a,step.b,step.c,step.d].filter(Boolean); }
function stepTermLabels(step){ return [step.aLabel,step.bLabel,step.cLabel,step.dLabel].filter(Boolean); }
function recompute(){
  VALUES = {r1:V.r1,r2:V.r2,r3:V.r3,r4:V.r4,r5:V.r5,r6:V.r6};
  COMBINE_STEPS.forEach(step=>{
    const keys=stepTermKeys(step);
    VALUES[step.key] = keys.length>2
      ? combineMany(step.op, keys.map(k=>VALUES[k]))
      : combine(step.op,VALUES[step.a],VALUES[step.b]);
  });
}

// ── mode switching ──
// Which layout(s) each raw resistor's value label appears in — needed
// because R1…R6 are drawn once per layout they still appear in individually.
const RAW_LABEL_LAYOUTS = {
  r1:[0,1,2], r2:[0], r3:[0], r4:[0,1], r5:[0,1], r6:[0,1,2],
};
function refreshLabels(){
  Object.keys(RAW_LABEL_LAYOUTS).forEach(key=>{
    RAW_LABEL_LAYOUTS[key].forEach(n=>{
      const el=document.getElementById('L'+n+'-lbl-'+key); if(el) el.textContent=fmtO0(V[key]);
    });
  });
  COMBINE_STEPS.forEach(step=>{
    step.labelLayouts.forEach(n=>{
      const el=document.getElementById('L'+n+'-lbl-'+step.key);
      if(el) el.textContent=fmtO(VALUES[step.key]);
    });
  });
  document.getElementById('panelVoltLabel').textContent=V.vs+' V';
  document.getElementById('battLabel').textContent=V.vs+'V';
  const mt=document.getElementById('modalVoltLabel');
  if(mt) mt.textContent=`Circuit Diagram — ${V.vs} V Source`;
}
function setMode(mode){
  quizMode=mode;
  V = (mode==='randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
  recompute();
  refreshLabels();
  ['example1','example2','example3','randomise'].forEach(m=>{
    const b=document.getElementById('mode'+m.charAt(0).toUpperCase()+m.slice(1));
    if(b) b.classList.toggle('active',m===mode);
  });
  resetQuiz();   // rebuilds options for the new values and returns to Q1
}

// Applies an explicit value set (used when arriving here via quiz 3's "help"
// link, so this walkthrough shows the exact same circuit instance quiz 3 was
// asking about). The Example/Randomise toggle is hidden entirely in this case
// — those values must match quiz 3, so the student can't switch away from them.
function applyValues(vals){
  quizMode='custom';
  V=vals;
  recompute();
  refreshLabels();
  const toggle=document.getElementById('modeToggle');
  if(toggle) toggle.style.display='none';
  resetQuiz();
}

// Set from ?return=<quizId> — when present, the summary screen shows a link back to that quiz.
let returnTo=null;
const RETURN_URLS={ quiz3:'resistor_quiz_3.html' };
// Page heading swaps to name the quiz that sent the student here (e.g. "...Quiz 3"),
// falling back to "...Quiz 3" (this walkthrough's own name) when visited standalone.
const RETURN_TITLES={ quiz3:'3' };


// ── generic option builder — derives distractors from step.op, so adding/
// reordering COMBINE_STEPS entries needs no changes here ──
function buildStepOptions(step){
  const a=VALUES[step.a], b=VALUES[step.b];
  const correct=VALUES[step.key];
  let wrong1,wrong2,wrong3;
  const terms=stepTermKeys(step).map(k=>VALUES[k]);
  if(terms.length>2){
    if(step.op==='series'){
      // correct: sum of all N terms. distractors: drop one term at a time
      // (three of the N possible "forgot a value" variants).
      const sum=terms.reduce((s,v)=>s+v,0);
      wrong1=sum-terms[0]; wrong2=sum-terms[1]; wrong3=sum-terms[2];
    } else {
      wrong1=terms.reduce((s,v)=>s+v,0);       // added instead of using the reciprocal formula
      wrong2=combine('parallel',terms[0],terms[1]); // paralleled only two of the terms (forgot the rest)
      wrong3=terms[0];                          // used just one value
    }
    return shuffle([
      {label:fmtO(correct),type:'correct'},
      {label:fmtO(wrong1),type:'wrong'},
      {label:fmtO(wrong2),type:'wrong'},
      {label:fmtO(wrong3),type:'wrong'},
    ]);
  }
  if(step.op==='series'){
    wrong1=combine('parallel',a,b); // used the wrong rule (paralleled instead of adding)
    wrong2=a;                        // forgot to include the second value
    wrong3=b;                        // forgot to include the first value
  } else {
    wrong1=combine('series',a,b);   // used the wrong rule (added instead of paralleling)
    wrong2=a;                        // forgot to include the second value
    wrong3=a*b;                      // forgot to divide by the sum (classic parallel slip)
  }
  return shuffle([
    {label:fmtO(correct),type:'correct'},
    {label:fmtO(wrong1),type:'wrong'},
    {label:fmtO(wrong2),type:'wrong'},
    {label:fmtO(wrong3),type:'wrong'},
  ]);
}
const QUESTION_BUILDERS = COMBINE_STEPS.map(step=>()=>buildStepOptions(step));
// ── layout switching — shows exactly one of the four <g id="layoutN"> groups ──
function showLayout(n){
  for(let i=0;i<=3;i++){
    const g=document.getElementById('layout'+i);
    if(g) g.setAttribute('display', i===n?'inline':'none');
  }
}

// ── box highlight colours — a layout is shown twice: once right after its
// step is solved (only the freshly-created box gets its own colour; the
// NEXT question's inputs stay the default colour so nothing gives away what
// to look at before the student actually sees that question), and again
// when the student advances to that next question (now its inputs light up
// too). Recomputed fresh every call, so Back/Next/jump can't leave stale
// colours behind. ──
function colourForCls(cls){
  const map={c1:'var(--colour-resistor-combo1)',c2:'var(--colour-resistor-combo2)',c3:'var(--colour-resistor-combo3)',c4:'var(--colour-resistor-combo4)',c5:'var(--colour-resistor-combo5)',ct:'var(--colour-resistor-total)'};
  return map[cls] || 'var(--colour-resistor)';
}
function applyLayoutColours(stepIndex, highlightNext){
  const step=COMBINE_STEPS[stepIndex];
  const layoutN=step.layoutAfter;
  const nextStep=COMBINE_STEPS[stepIndex+1];
  const keys=new Set([step.key]);
  if(nextStep) stepTermKeys(nextStep).forEach(k=>keys.add(k));
  keys.forEach(k=>{
    const el=document.getElementById('L'+layoutN+'-box-'+k);
    if(el) el.setAttribute('stroke','var(--colour-resistor)');
  });
  const ownEl=document.getElementById('L'+layoutN+'-box-'+step.key);
  if(ownEl) ownEl.setAttribute('stroke', colourForCls(step.cls));
  if(highlightNext && nextStep){
    const nextTerms=stepTermKeys(nextStep);
    const colour = nextTerms.length>2 ? 'var(--colour-resistor-combo5)' : colourForCls(nextStep.cls);
    nextTerms.forEach(k=>{
      const el=document.getElementById('L'+layoutN+'-box-'+k);
      if(el) el.setAttribute('stroke', colour);
    });
  }
}

// ── generic check/working — driven entirely by COMBINE_STEPS, so adding,
// removing or reordering steps needs no changes below this point ──

function showStepWorking(n){
  const step=COMBINE_STEPS[n-1];
  const a=VALUES[step.a], b=VALUES[step.b], result=VALUES[step.key];
  const lbl=`<span class="${step.cls}">${step.label}</span>`;
  let html;
  const termKeys=stepTermKeys(step), termLabels=stepTermLabels(step);
  if(termKeys.length>2){
    const vals=termKeys.map(k=>VALUES[k]);
    const namesJoined = termLabels.slice(0,-1).join(', ')+' and '+termLabels[termLabels.length-1];
    if(step.op==='series'){
      html = `
        <div class="wline">${namesJoined} are all in series here — just add them:</div>
        <div class="wlabel">Formula:</div>
        <div class="formula-row">${lbl} = ${termLabels.join(' + ')}</div>
        <div class="wlabel">Substituting values:</div>
        <div class="formula-row">${lbl} = ${vals.map(fmtO0).join(' + ')}</div>
        <div class="wline total">${lbl} = <span class="cr">${fmtO(result)}</span></div>`;
    } else {
      const recip=x=>(1/x).toFixed(5);
      const sum=vals.reduce((s,v)=>s+1/v,0);
      html = `
        <div class="wline">${namesJoined} are all in parallel with each other:</div>
        <div class="wlabel">Formula:</div>
        <div class="formula-row">${lbl} = ${frac('1', termLabels.map(l=>frac('1',l)).join(' + '))}</div>
        <div class="wlabel">Substituting values:</div>
        <div class="formula-row">${lbl} = ${frac('1', vals.map(v=>frac('1',fmtO0(v))).join(' + '))}</div>
        <div class="wlabel">Calculating denominators:</div>
        <div class="formula-row">${lbl} = ${frac('1', vals.map(recip).join(' + '))}</div>
        <div class="wlabel">Summing:</div>
        <div class="formula-row">${lbl} = ${frac('1',sum.toFixed(5))}</div>
        <div class="wline total">${lbl} = <span class="cr">${fmtO(result)}</span></div>`;
    }
    return html;
  }
  if(step.op==='series'){
    html = `
      <div class="wline">${step.aLabel} and ${step.bLabel} are in series here — just add them:</div>
      <div class="wlabel">Formula:</div>
      <div class="formula-row">${lbl} = ${step.aLabel} + ${step.bLabel}</div>
      <div class="wlabel">Substituting values:</div>
      <div class="formula-row">${lbl} = ${fmtO0(a)} + ${fmtO0(b)}</div>
      <div class="wline total">${lbl} = <span class="cr">${fmtO(result)}</span></div>`;
  } else {
    const recip=x=>(1/x).toFixed(5);
    const sum=(1/a+1/b);
    html = `
      <div class="wline">${step.aLabel} and ${step.bLabel} are the circuit's two parallel branches:</div>
      <div class="wlabel">Formula:</div>
      <div class="formula-row">${lbl} = ${frac('1',`${frac('1',step.aLabel)} + ${frac('1',step.bLabel)}`)}</div>
      <div class="wlabel">Substituting values:</div>
      <div class="formula-row">${lbl} = ${frac('1',`${frac('1',fmtO0(a))} + ${frac('1',fmtO0(b))}`)}</div>
      <div class="wlabel">Calculating denominators:</div>
      <div class="formula-row">${lbl} = ${frac('1',`${recip(a)} + ${recip(b)}`)}</div>
      <div class="wlabel">Summing:</div>
      <div class="formula-row">${lbl} = ${frac('1',sum.toFixed(5))}</div>
      <div class="wline total">${lbl} = <span class="cr">${fmtO(result)}</span></div>`;
  }
  return html;
}



// ── dev: ?xy=1 shows a coordinate ruler over the diagram ──
function buildXYRuler(){
  const g=document.getElementById('xyRuler');
  if(!g || g.dataset.built) return;
  g.dataset.built='1';
  const vb=document.getElementById('circuitSvg').viewBox.baseVal;
  const W=vb.width, H=vb.height, hy=H-10, vx=10, col='#ff00ff';
  let s=`<line x1="0" y1="${hy}" x2="${W}" y2="${hy}" stroke="${col}" opacity="0.6"/>`;
  for(let x=0;x<=W;x+=10){const M=x%50===0;s+=`<line x1="${x}" y1="${hy-(M?10:5)}" x2="${x}" y2="${hy}" stroke="${col}" opacity="0.6"/>`;if(M)s+=`<text x="${x}" y="${hy-13}" fill="${col}" font-size="8" text-anchor="middle">${x}</text>`;}
  s+=`<line x1="${vx}" y1="0" x2="${vx}" y2="${H}" stroke="${col}" opacity="0.6"/>`;
  for(let y=0;y<=H;y+=10){const M=y%50===0;s+=`<line x1="${vx}" y1="${y}" x2="${vx+(M?10:5)}" y2="${y}" stroke="${col}" opacity="0.6"/>`;if(M)s+=`<text x="${vx+13}" y="${y+3}" fill="${col}" font-size="8">${y}</text>`;}
  g.innerHTML=s;
}
function setXY(on){ if(on) buildXYRuler(); const g=document.getElementById('xyRuler'); if(g) g.setAttribute('display', on?'inline':'none'); }
window.setXY = setXY;

// ── engine bindings ──
// Each question is one COMBINE_STEPS entry; options/working come straight from it.
const QUESTIONS = LEGACY_QS.map((q, i) => ({
  leftPanel: 'circuit',
  text: () => q.text,
  hint: () => q.hint,
  options: () => QUESTION_BUILDERS[i](),
  correctExplain: () => `${COMBINE_STEPS[i].label} = ${fmtO(VALUES[COMBINE_STEPS[i].key])}`,
  working: () => showStepWorking(i + 1),
}));

// The diagram swaps layout as steps are solved: the layout after this step once answered, otherwise
// the layout the previous step left behind (with this step's inputs lit).
RENDER_EXTRA = () => {
  const n = cur + 1;
  if (!COMBINE_STEPS[n - 1]) return;
  const answered = Q[cur] && Q[cur].ans;
  showLayout(answered ? COMBINE_STEPS[n - 1].layoutAfter : (n === 1 ? 0 : COMBINE_STEPS[n - 2].layoutAfter));
  if (answered) applyLayoutColours(n - 1, false);

};
