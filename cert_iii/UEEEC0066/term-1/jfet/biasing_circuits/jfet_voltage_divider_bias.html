<!--
  Voltage-divider-bias N-channel JFET DC analysis, 6 questions, cloned from
  UEEEC0066/jfet/biasing_circuits/jfet_self_bias.html (same 6-question shape,
  same structure as UEEEC0066/bjt/biasing_circuits/bjt_npn_base_bias.html
  underneath). The circuit diagram (RG1/RG2/RD/RS, VDD, Q1) is the user's
  own — RG1/RG2 replace self-
  bias's single RG with an actual voltage divider across VDD.

  Calculation method taught: V_GS is still GIVEN per example (read off a
  device curve/datasheet in the real lesson) — the one piece of starting
  data shown on the circuit permanently, not asked as a question. Unlike
  self-bias, V_G is NOT pinned to 0 V here — it's set by the RG1/RG2
  divider, DERIVED as Q1 below (the student should reason their way to it
  rather than have it handed to them). Because the gate draws no current,
  the divider is always perfectly "unloaded" regardless of how large
  RG1/RG2 are — only their RATIO sets V_G, unlike a BJT voltage divider
  where base current always loads it at least a little. From there:
    Q1  V_G  = V_DD × R_G2 / (R_G1 + R_G2)   (unloaded divider — I_G ≈ 0)
    Q2  V_S  = V_G − V_GS
    Q3  I_DS = V_S / R_S
    Q4  V_D  = V_DD − (I_DS × R_D)
    Q5  V_DG = V_D − V_G   (no longer always equals V_D — only true when
                             V_G happens to be 0, unlike self-bias)
    Q6  V_DS = V_D − V_S
-->

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════

    // Topology: voltage-divider bias, single-stage N-channel JFET. VDD —RD—
    // Drain; VDD —RG1—Gate—RG2— Common (RG1/RG2 form an ordinary voltage
    // divider — since the gate draws no current, none of the divider's
    // current is ever diverted into it, so it behaves as a perfectly
    // unloaded divider no matter how large RG1/RG2 are); Source —RS—
    // Common (its voltage drop IS V_S, same self-bias-style G-S loop as
    // jfet_self_bias.html, just built on top of a non-zero V_G now).
    //
    // V_GS is taken as GIVEN per example — in the real lesson it's read off
    // the device's transfer curve/datasheet for the desired operating
    // point; here it's just a set teaching value, shown permanently on the
    // circuit (not a quiz question). V_G is DERIVED (Q1) from RG1/RG2 —
    // everything else follows from V_G and V_GS.
    const EXAMPLE_SETS = {
      example1: { vdd: 12, rg1: 500000, rg2: 100000, rd: 820, rs: 1000, vgs: -1 }, // rd deliberately ≠ rs — otherwise the Q3 "used RD instead of RS" distractor would show the same digits as the correct answer
      example2: { vdd: 15, rg1: 680000, rg2: 120000, rd: 1200, rs: 1500, vgs: -2 },
      example3: { vdd: 9, rg1: 680000, rg2: 150000, rd: 470, rs: 1000, vgs: -1.5 }
    };
    let quizMode = 'example1';
    let V = { ...EXAMPLE_SETS.example1 };

    // ══════════════════════════════════════════════════════════════════════
    // QUESTION TEXT
    // ══════════════════════════════════════════════════════════════════════
    const QUESTION_TEXT = [
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">gate voltage</span> V<sub>G</sub> at the gate of Q1?',
        hint: 'R<sub>G1</sub> and R<sub>G2</sub> form a voltage divider straight across V<sub>DD</sub>. No current flows into the gate, so none of the divider\'s current is diverted away — apply the voltage-divider formula as if the gate weren\'t even connected there.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">source voltage</span> V<sub>S</sub> at the source of Q1?',
        hint: 'No current flows into the gate, so there\'s no voltage drop across R<sub>G</sub> — the gate sits at V<sub>G</sub> = 0 V. Rearrange the self-bias relationship V<sub>GS</sub> = V<sub>G</sub> − V<sub>S</sub> to find V<sub>S</sub>.'
      },
      {
        text: 'What is the <span style="color:var(--colour-current)">drain current</span> I<sub>DS</sub> flowing through R<sub>S</sub>?',
        hint: 'In self-bias, the drain-source current is the only current flowing through R<sub>S</sub> to common. Apply Ohm\'s Law across R<sub>S</sub>.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">drain voltage</span> V<sub>D</sub>?',
        hint: 'Find the voltage dropped across R<sub>D</sub>, then subtract it from V<sub>DD</sub>.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">drain-gate voltage</span> V<sub>DG</sub>?',
        hint: 'V<sub>DG</sub> is the difference between the drain and gate voltages — both measured with respect to common.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">drain-source voltage</span> V<sub>DS</sub>?',
        hint: 'V<sub>DS</sub> is the difference between the drain and source voltages — both measured with respect to common.'
      }
    ];

    // ══════════════════════════════════════════════════════════════════════
    // END CIRCUIT CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT SIMULATION
    // ══════════════════════════════════════════════════════════════════════

    // ── curated resistor/supply/VGS pools for Randomise mode ──
    // RG1/RG2 carry no DC current at all (the gate draws none), so their
    // exact values don't affect the maths — only their ratio does. RG1
    // (top, VDD side) kept noticeably larger than RG2 (bottom, common
    // side) since a typical JFET divider biases the gate to a modest
    // fraction of VDD, not half of it.
    const RG1_POOL = [220000, 270000, 330000, 390000, 470000, 560000, 680000, 820000, 1000000];
    const RG2_POOL = [39000, 47000, 56000, 68000, 82000, 100000, 120000, 150000];
    const RD_POOL = [220, 270, 330, 390, 470, 560, 680, 820, 1000, 1200, 1500, 1800, 2200];
    const RS_POOL = [330, 470, 560, 680, 820, 1000, 1200, 1500, 1800, 2200];
    const VDD_POOL = [9, 12, 15, 18, 20];
    const VGS_POOL = [-1, -1.5, -2, -2.5, -3, -3.5, -4];
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    // Retries until the combination keeps V_G and V_D comfortably away from
    // the rails — voltage-divider bias has no feedback loop here to correct
    // a bad RG1/RG2/RD/RS/VGS combination, so a plain random pick can easily
    // land V_G or V_D near 0 or near V_DD, neither of which makes for a
    // sensible example.
    function randomValues() {
      for (let attempt = 0; attempt < 25; attempt++) {
        const vals = { vdd: pick(VDD_POOL), rg1: pick(RG1_POOL), rg2: pick(RG2_POOL), rd: pick(RD_POOL), rs: pick(RS_POOL), vgs: pick(VGS_POOL) };
        // RD===RS would make the "used RD instead of RS" distractor in Q3
        // show the exact same digits as the correct answer.
        if (vals.rd === vals.rs) continue;
        const vg = vals.vdd * vals.rg2 / (vals.rg1 + vals.rg2);
        if (vg < vals.vdd * 0.1 || vg > vals.vdd * 0.5) continue; // keep the divider fraction sensible
        const vs = vg - vals.vgs;
        if (vs <= 0) continue;
        const ids = vs / vals.rs;
        const vd = vals.vdd - ids * vals.rd;
        if (vd < vals.vdd * 0.15 || vd > vals.vdd * 0.9) continue;
        if (vd <= vs) continue; // keep V_DS positive (JFET stays in saturation, not triode)
        return vals;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    function fmtO0(v) {
      if (v >= 1e6) return parseFloat((v / 1e6).toFixed(2)) + 'MΩ';
      if (v >= 1000) return parseFloat((v / 1000).toFixed(2)) + 'kΩ';
      return parseFloat(v.toFixed(2)) + 'Ω';
    }
    function fmtO0Parts(v) {
      if (v >= 1e6) return { num: String(parseFloat((v / 1e6).toFixed(2))), unit: ' MΩ' };
      if (v >= 1000) return { num: String(parseFloat((v / 1000).toFixed(2))), unit: ' kΩ' };
      return { num: String(parseFloat(v.toFixed(2))), unit: ' Ω' };
    }
    function fmtA(a) { if (a === 0) return '0 A'; const x = Math.abs(a); if (x >= 1) return parseFloat(a.toFixed(3)) + ' A'; if (x >= 0.001) return parseFloat((a * 1000).toFixed(2)) + ' mA'; return parseFloat((a * 1e6).toFixed(1)) + ' µA'; }
    // Bias-point voltages in this range are always written in volts, never
    // millivolts, by convention — so the V/mV cutoff sits at 0.1 V rather
    // than 1 V.
    function fmtV(v) { if (v === 0) return '0 V'; const a = Math.abs(v); if (a >= 0.1) return parseFloat(v.toFixed(2)) + ' V'; if (a >= 0.001) return parseFloat((v * 1000).toFixed(2)) + ' mV'; return parseFloat((v * 1e6).toFixed(1)) + ' µV'; }
    function fmtVParts(v) { if (v === 0) return { val: '0', unit: 'V' }; const a = Math.abs(v); if (a >= 0.1) return { val: String(parseFloat(v.toFixed(2))), unit: 'V' }; if (a >= 0.001) return { val: String(parseFloat((v * 1000).toFixed(2))), unit: 'mV' }; return { val: String(parseFloat((v * 1e6).toFixed(1))), unit: 'µV' }; }

    // ── derived (recomputed whenever the value set changes) ──
    let VG, VGS, VS, IDS, VRD, VD, VDG, VDS;
    function recompute() {
      VG = V.vdd * V.rg2 / (V.rg1 + V.rg2); // unloaded voltage divider — no gate current to divert
      VGS = V.vgs;                    // given per example
      VS = VG - VGS;                  // rearranged self-bias relationship
      IDS = VS / V.rs;                // Ohm's Law across RS (the only current through it)
      VRD = IDS * V.rd;
      VD = V.vdd - VRD;
      VDG = VD - VG;                  // = VD, since VG = 0
      VDS = VD - VS;
    }

    // ── mode switching ──
    function refreshLabels() {

      // distractors: flipped the ratio (used RG1 in the numerator instead of RG2), assumed an even 50/50 divider, confused with the given VGS
      return shuffle([

        { label: `<span class="colour-voltage">V<sub>G</sub></span> = <span class="colour-supply">V<sub>DD</sub></span> × ${frac('<span class="colour-resistor">R<sub>G1</sub></span>', '<span class="colour-resistor">R<sub>G1</sub></span> + <span class="colour-resistor">R<sub>G2</sub></span>')} = ${V.vdd} V × ${frac(fmtO0(V.rg1), fmtO0(V.rg1) + ' + ' + fmtO0(V.rg2))} ≈ ${fmtV(V.vdd * V.rg1 / (V.rg1 + V.rg2))}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>G</sub></span> = ${frac('<span class="colour-supply">V<sub>DD</sub></span>', '2')} = ${frac(`${V.vdd} V`, '2')} = ${fmtV(V.vdd / 2)}`, type: 'wrong' },

    function buildQ2Options() {
      // correct: VG - VGS
      // distractors: took VGS literally as VS (sign error), forgot to subtract VGS at all (thinks VS = VG), doubled the magnitude of VGS's contribution
      return shuffle([

        { label: `<span class="colour-voltage">V<sub>S</sub></span> = <span class="colour-jfet">V<sub>GS</sub></span> = ${fmtV(VGS)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>S</sub></span> = <span class="colour-voltage">V<sub>G</sub></span> = ${fmtV(VG)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>S</sub></span> = <span class="colour-voltage">V<sub>G</sub></span> − 2×<span class="colour-jfet">V<sub>GS</sub></span> = ${fmtV(VG)} − 2×(${fmtV(VGS)}) ≈ ${fmtV(VG - 2 * VGS)}`, type: 'wrong' },

    function buildQ3Options() {
      // correct: VS / RS
      // distractors: used RD instead of RS, inverted the fraction, used VG instead of VS
      return shuffle([
        { label: `<span class="colour-current">I<sub>DS</sub></span> = ${frac('<span class="colour-voltage">V<sub>S</sub></span>', '<span class="colour-resistor">R<sub>S</sub></span>')} = ${frac(fmtV(VS), fmtO0(V.rs))} ≈ ${fmtA(IDS)}`, type: 'correct' },
        { label: `<span class="colour-current">I<sub>DS</sub></span> = ${frac('<span class="colour-voltage">V<sub>S</sub></span>', '<span class="colour-resistor">R<sub>D</sub></span>')} = ${frac(fmtV(VS), fmtO0(V.rd))} ≈ ${fmtA(VS / V.rd)}`, type: 'wrong' },
        { label: `<span class="colour-current">I<sub>DS</sub></span> = ${frac('<span class="colour-resistor">R<sub>S</sub></span>', '<span class="colour-voltage">V<sub>S</sub></span>')} = ${frac(fmtO0(V.rs), fmtV(VS))} ≈ ${Number((V.rs / VS).toFixed(2))}`, type: 'wrong' },
        { label: `<span class="colour-current">I<sub>DS</sub></span> = ${frac('<span class="colour-voltage">V<sub>G</sub></span>', '<span class="colour-resistor">R<sub>S</sub></span>')} = ${frac(fmtV(VG), fmtO0(V.rs))} ≈ ${fmtA(VG / V.rs)}`, type: 'wrong' },
      ]);
    }
    function buildQ4Options() {
      // correct: VDD - IDS*RD
      // distractors: used RG1 instead of RD, forgot to subtract from VDD, added instead of subtracting
      return shuffle([
        { label: `<span class="colour-voltage">V<sub>D</sub></span> = <span class="colour-supply">V<sub>DD</sub></span> − (<span class="colour-current">I<sub>DS</sub></span>×<span class="colour-resistor">R<sub>D</sub></span>) = ${V.vdd} V − (${fmtA(IDS)}×${fmtO0(V.rd)}) ≈ ${fmtV(VD)}`, type: 'correct' },
        { label: `<span class="colour-voltage">V<sub>D</sub></span> = <span class="colour-supply">V<sub>DD</sub></span> − (<span class="colour-current">I<sub>DS</sub></span>×<span class="colour-resistor">R<sub>G1</sub></span>) = ${V.vdd} V − (${fmtA(IDS)}×${fmtO0(V.rg1)}) ≈ ${fmtV(V.vdd - IDS * V.rg1)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>D</sub></span> = <span class="colour-current">I<sub>DS</sub></span>×<span class="colour-resistor">R<sub>D</sub></span> = ${fmtA(IDS)}×${fmtO0(V.rd)} ≈ ${fmtV(IDS * V.rd)}`, type: 'wrong' },

    function buildQ5Options() {
      // correct: VD - VG
      // distractors: confused with VRD (the drop across RD), used VDD directly, added VS instead of subtracting VG
      return shuffle([

        { label: `<span class="colour-voltage">V<sub>DG</sub></span> = <span class="colour-supply">V<sub>DD</sub></span> = ${fmtV(V.vdd)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>DG</sub></span> = <span class="colour-voltage">V<sub>D</sub></span> + <span class="colour-voltage">V<sub>S</sub></span> = ${fmtV(VD)} + ${fmtV(VS)} ≈ ${fmtV(VD + VS)}`, type: 'wrong' },

      return shuffle([

    // ── circuit-specific SVG annotation show/hide ──
    // (overrides the fmtVParts above — same 0.1 V cutoff, kept in sync)
    function fmtVParts(v) {
      if (v === 0) return { val: '0', unit: 'V' };

      if (a >= 0.1) return { val: v.toFixed(2), unit: 'V' };
      if (a >= 0.001) return { val: (v * 1000).toFixed(2), unit: 'mV' };

    }

        options: QUESTION_BUILDERS[2],
        correctExplain: () => {
      
      return `I<sub>DS</sub> = ${fmtA(IDS)}`;
    },
        working: () => {
      
      
      
      return `
    <div class="working-line">In self-bias, the drain-source current is the only current flowing through <span class="colour-resistor">R<sub>S</sub></span> to common — apply Ohm's Law:</div>

    <div class="working-step">Drain current:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>DS</sub></span> = ${frac('<span class="colour-voltage">V<sub>S</sub></span>', '<span class="colour-resistor">R<sub>S</sub></span>')}</div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>DS</sub></span> = ${frac(fmtV(VS), fmtO0(V.rs))}</div>
    <div class="working-total"><span class="colour-current">I<sub>DS</sub></span> = <span class="colour-result">${fmtA(IDS)}</span></div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[3].text === 'function' ? QUESTION_TEXT[3].text() : QUESTION_TEXT[3].text),
        hint: () => QUESTION_TEXT[3].hint,
        options: QUESTION_BUILDERS[3],
        correctExplain: () => {
      
      return `V<sub>D</sub> = ${fmtV(VD)}`;
    },
        working: () => {
      
      
      
      return `
    <div class="working-line">Find the voltage dropped across <span class="colour-resistor">R<sub>D</sub></span>, then subtract it from <span class="colour-supply">V<sub>DD</sub></span>:</div>

    <div class="working-step">Step 1. Use Ohm's Law to calculate the voltage drop over RD:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>RD</sub></span> = <span class="colour-current">I<sub>DS</sub></span> × <span class="colour-resistor">R<sub>D</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>RD</sub></span> = ${fmtA(IDS)} × ${fmtO0(V.rd)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>RD</sub></span> = <span class="colour-result">${fmtV(VRD)}</span></div>

    <div class="working-step">Step 2. Deduct the voltage drop over <span class="colour-voltage">V<sub>RD</sub></span> from the supply voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>D</sub></span> = <span class="colour-supply">V<sub>DD</sub></span> − <span class="colour-voltage">V<sub>RD</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>D</sub></span> = ${V.vdd} V − ${fmtV(VRD)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>D</sub></span> = <span class="colour-result">${fmtV(VD)}</span></div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[4].text === 'function' ? QUESTION_TEXT[4].text() : QUESTION_TEXT[4].text),
        hint: () => QUESTION_TEXT[4].hint,
        options: QUESTION_BUILDERS[4],
        correctExplain: () => {
      
      return `V<sub>DG</sub> = ${fmtV(VDG)}`;
    },
        working: () => {
      
      
      
      return `
    <div class="working-line"><span class="colour-voltage">V<sub>DG</sub></span> is the difference between the drain and gate voltages, both measured with respect to common:</div>

    <div class="working-step">Drain-gate voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>DG</sub></span> = <span class="colour-voltage">V<sub>D</sub></span> − <span class="colour-voltage">V<sub>G</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>DG</sub></span> = ${fmtV(VD)} − ${fmtV(VG)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>DG</sub></span> = <span class="colour-result">${fmtV(VDG)}</span></div>
    <div class="working-line" style="margin-top:.6rem">Unlike self-bias, <span class="colour-voltage">V<sub>DG</sub></span> is NOT the same number as <span class="colour-voltage">V<sub>D</sub></span> here — that shortcut only worked when <span class="colour-voltage">V<sub>G</sub></span> was pinned at 0 V. With the gate now sitting at ${fmtV(VG)}, you have to actually subtract it.</div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[5].text === 'function' ? QUESTION_TEXT[5].text() : QUESTION_TEXT[5].text),
        hint: () => QUESTION_TEXT[5].hint,
        options: QUESTION_BUILDERS[5],
        correctExplain: () => {
      
      return `V<sub>DS</sub> = ${fmtV(VDS)}`;
    },
        working: () => {
      
      
      
      return `
    <div class="working-line"><span class="colour-voltage">V<sub>DS</sub></span> is the difference between the drain and source voltages, both measured with respect to common:</div>

    <div class="working-step">Drain-source voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>DS</sub></span> = <span class="colour-voltage">V<sub>D</sub></span> − <span class="colour-voltage">V<sub>S</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>DS</sub></span> = ${fmtV(VD)} − ${fmtV(VS)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>DS</sub></span> = <span class="colour-result">${fmtV(VDS)}</span></div>`;
    },
      },
    ];

    // Meters reveal progressively: the question's `enter` state until it is
    // answered, then its `reveal` state.
    RENDER_EXTRA = function () {
      applyCircuitState(Q[cur].ans ? CIRCUIT_STATES[cur].reveal : CIRCUIT_STATES[cur].enter);
    };

    // Summary page: everything revealed, component values on top.
    SUMMARY_CIRCUIT_REF = { id: null, label: 'Circuit Diagram', viewBox: null };
    SUMMARY_EXTRA = function () {
      applyCircuitState(CIRCUIT_STATES[CIRCUIT_STATES.length - 1].reveal);
      document.getElementById('summaryContent').insertAdjacentHTML('afterbegin', `<div class="summary-values">
    <span style="color:var(--colour-supply);font-weight:bold">V<sub>DD</sub></span> = <span style="color:var(--colour-supply)">${V.vdd} V</span>&nbsp;&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>G1</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rg1)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>G2</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rg2)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>D</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rd)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>S</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rs)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-jfet-labels);font-weight:bold">V<sub>GS</sub></span> = <span style="color:var(--colour-jfet-labels)">${fmtV(V.vgs)}</span>
  </div>`);
    };

    initQuizNav();
    setMode('example1');      // builds the value set, then resetQuiz()
    {
      const p = new URLSearchParams(location.search);
      const rKeys = ['vdd', 'rg1', 'rg2', 'rd', 'rs', 'vgs'];
      if (rKeys.every(k => p.has(k))) {
        const vals = {}; rKeys.forEach(k => vals[k] = +p.get(k));
        quizMode = 'custom'; V = vals; recompute(); refreshLabels();
        ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
          const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
          if (b) b.classList.toggle('active', false);
        });
        resetQuiz();
      }
    }
    initQuizFromURL();
  </script>
</body>
