            </g>

            <!-- ════════════════════ QUESTION 5 ════════════════════ -->

            <!-- ══ V_CE INDICATOR ══ -->
            <g id="vceInd" display="none" transform="translate(360,232)">
              <line x1="0" y1="0" x2="10" y2="0" style="stroke: var(--colour-red)" stroke-width="2" />
              <line x1="0" y1="50" x2="10" y2="50" style="stroke: var(--colour-red)" stroke-width="2" />
              <line x1="10" y1="0" x2="10" y2="50" style="stroke: var(--colour-red)" stroke-width="2" />
              <text x="20" y="20" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="14"
                font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CE</tspan></text>
              <text id="vceValue" x="20" y="40" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="13"
                font-weight="bold">—</text>
            </g>

            <!-- ════════════════════ QUESTION 6 ════════════════════ -->

            <!-- ══ V_CE(ideal) INDICATOR — a design benchmark, not a measurable node, so it gets its own colour ══ -->
            <g id="idealVceInd" display="none" transform="translate(400,310)">
              <text x="0" y="-6" style="fill: var(--colour-ideal)" text-anchor="start" font-size="13"
                font-weight="bold">V<tspan baseline-shift="sub" font-size="9">CE</tspan> (ideal)</text>
              <text id="idealVceValue" x="0" y="13" style="fill: var(--colour-ideal)" text-anchor="start" font-size="13"
                font-weight="bold">—</text>
            </g>

            <!-- ════════════════════ GAIN INDICATOR ════════════════════ -->
            <g id="gainInd" display="none" transform="translate(395,270)">
              <text x="0" y="-12" style="fill: var(--colour-gain)" text-anchor="middle" font-size="14" letter-spacing=".05em">|A<tspan baseline-shift="sub" font-size="8">v</tspan>|</text>
              <text id="gainValue" x="0" y="6" style="fill: var(--colour-text)" text-anchor="middle" font-size="15" font-weight="bold">—</text>
            </g>

          </g><!-- /circuitGroup -->

          <!-- ══ XY RULER (dev tool, off by default) ══ -->
          <g id="xyRuler" display="none"></g>
        </svg>
      </div>
    </div>

    <!-- ════════════════════ QUESTION FRAMEWORK - DO NOT CHANGE MANUALLY ════════════════════ -->

    <!-- RIGHT: question -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

    <!-- Zoom modal -->
    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalVoltLabel">Circuit Diagram — 12 V Supply</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg"
          font-family="'Share Tech Mono',monospace"></svg>
      </div>
    </div>

  </div>

  <script>Shapes.use('test-equipment', 'circuit-components', 'bjt-symbols');</script>
  <script>
    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════

    // Topology: classic voltage-divider bias, single-stage NPN.
    // VCC —R1— [Base node] —R2— GND, base node also feeds Q1's base.
    // VCC —RC— Q1 collector; Q1 emitter —RE— GND.
    const VBE = 0.6; // silicon NPN base-emitter drop, assumed constant

    const EXAMPLE_SETS = {
      example1: { vcc: 12, r1: 33000, r2: 6800, rc: 1800, re: 390 },
      example2: { vcc: 15, r1: 47000, r2: 8200, rc: 2200, re: 560 },
      example3: { vcc: 9,  r1: 22000, r2: 3900, rc: 1200, re: 270 }
    };
    let quizMode = 'example1';
    let V = { ...EXAMPLE_SETS.example1 };

    // ══════════════════════════════════════════════════════════════════════
    // QUESTION TEXT
    // ══════════════════════════════════════════════════════════════════════
    const QUESTION_TEXT = [
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">base voltage</span> V<sub>B</sub> at the junction of R1 and R2?',
        hint: 'Treat R1 and R2 as a simple voltage divider from V<sub>CC</sub> to ground — the base draws very little current compared to the divider current.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">emitter voltage</span> V<sub>E</sub>?',
        hint: 'A forward-biased silicon base-emitter junction drops approximately 0.6 V (<span class="colour-bjt">V<sub>BE</sub> (on)</span>).'
      },
      {
        text: 'What is the <span style="color:var(--colour-current)">emitter current</span> I<sub>E</sub>?',
        hint: 'Apply Ohm\'s law to R<sub>E</sub>, using the emitter voltage from Q2.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">collector voltage</span> V<sub>C</sub>?',
        hint: 'Assume I<sub>C</sub> ≈ I<sub>E</sub> (base current is small). Find the voltage dropped across R<sub>C</sub>, then subtract it from V<sub>CC</sub>.'
      },
      {
        text: 'What is the <span class="colour-gain">voltage gain</span> |A<sub>v</sub>| of this common-emitter stage?',
        hint: 'For a common-emitter amplifier, |A<sub>v</sub>| ≈ R<sub>C</sub> / R<sub>E</sub> (AC gain approximation).'
      },
      {
        text: 'Under normal operating conditions, what is the expected <span style="color:var(--colour-signal)">DC voltage</span> and <span style="color:var(--colour-signal)">AC signal behaviour</span> at the Load terminal (L)?',
        hint: 'Consider what <span class="ccap">C<sub>OUT</sub></span> does to the DC level, how a common-emitter stage affects the signal phase, and the gain you found in Q5.'
      }
    ];

    // ══════════════════════════════════════════════════════════════════════
    // END CIRCUIT CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT SIMULATION
    // ══════════════════════════════════════════════════════════════════════

    // ── curated resistor/supply pools for Randomise mode (kept in realistic
    //    ranges for a bias network, unlike a plain E12 sweep) ──
    const R1_POOL = [4700, 6800, 8200, 10000, 12000, 15000, 18000, 22000, 27000, 33000, 39000, 47000];
    const R2_POOL = [1000, 1200, 1500, 1800, 2200, 2700, 3300, 3900, 4700, 5600, 6800, 8200];
    const RC_POOL = [220, 270, 330, 390, 470, 560, 680, 820, 1000, 1200, 1500, 1800, 2200];
    const RE_POOL = [100, 120, 150, 180, 220, 270, 330, 390, 470, 560, 680, 820, 1000];
    const VCC_POOL = [9, 12, 15, 18, 20];
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    // Retries until the combination keeps Q1 in the active region (VE has a
    // healthy margin above 0 and VCE has a healthy margin above 0) — a plain
    // random pick can otherwise land the transistor in cutoff or saturation,
    // which makes for a nonsensical "troubleshoot the amplifier" quiz.
    function randomValues() {
      for (let attempt = 0; attempt < 25; attempt++) {
        const vals = { vcc: pick(VCC_POOL), r1: pick(R1_POOL), r2: pick(R2_POOL), rc: pick(RC_POOL), re: pick(RE_POOL) };
        // R1===R2 or RC===RE would make one of the "wrong resistor"/"ratio
        // swapped" distractors an exact duplicate of the correct answer —
        // both pools share several overlapping values, so this is reachable.
        if (vals.r1 === vals.r2 || vals.rc === vals.re) continue;
        const vb = vals.vcc * vals.r2 / (vals.r1 + vals.r2);
        const ve = vb - VBE;
        if (ve < 0.3) continue;
        const ie = ve / vals.re;
        const vc = vals.vcc - ie * vals.rc;
        if (vc - ve < 1 || vc > vals.vcc - 0.3) continue;
        return vals;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    function fmtO0(v) { return v >= 1000 ? parseFloat((v / 1000).toFixed(2)) + 'kΩ' : parseFloat(v.toFixed(2)) + 'Ω'; }
    function fmtO0Parts(v) { if (v >= 1000) return { num: String(parseFloat((v / 1000).toFixed(2))), unit: ' kΩ' }; return { num: String(parseFloat(v.toFixed(2))), unit: ' Ω' }; }
    function fmtA(a) { const x = Math.abs(a); if (x >= 1) return parseFloat(a.toFixed(3)) + ' A'; if (x >= 0.001) return parseFloat((a * 1000).toFixed(2)) + ' mA'; return parseFloat((a * 1e6).toFixed(1)) + ' µA'; }
    function fmtV(v) { const a = Math.abs(v); if (a >= 1) return parseFloat(v.toFixed(2)) + ' V'; if (a >= 0.001) return parseFloat((v * 1000).toFixed(2)) + ' mV'; return parseFloat((v * 1e6).toFixed(1)) + ' µV'; }

    // ── derived (recomputed whenever the value set changes) ──
    let VB, VE, IE, IC, VRC, VC;
    function recompute() {
      VB = V.vcc * V.r2 / (V.r1 + V.r2);
      VE = VB - VBE;
      IE = VE / V.re;
      IC = IE;
      VRC = IC * V.rc;
      VC = V.vcc - VRC;
    }

    // ── mode switching ──
    function refreshLabels() {
      ['r1', 'r2', 'rc', 're'].forEach(r => {
        const p = fmtO0Parts(V[r]);
        document.getElementById('lbl-' + r).innerHTML =
          `<tspan fill="var(--colour-text)">${p.num}</tspan><tspan fill="var(--colour-resistor-labels)">${p.unit}</tspan>`;
      });
      document.getElementById('vccValue').innerHTML = `<tspan fill="var(--colour-text)">${V.vcc}</tspan><tspan fill="var(--colour-supply)"> V</tspan>`;
      document.getElementById('panelVoltLabel').textContent = V.vcc + ' V';
      const mt = document.getElementById('modalVoltLabel');
      if (mt) mt.textContent = `Circuit Diagram — ${V.vcc} V Supply`;
    }
    function setMode(mode) {
      quizMode = mode;
      V = (mode === 'randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
      recompute();
      refreshLabels();
      ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
        const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (b) b.classList.toggle('active', m === mode);
      });
      resetQuiz();
    }

    function buildQ1Options() {
      // correct: VCC * R2/(R1+R2)
      // distractors: ratio swapped, assumed midpoint, forgot the divider entirely
      return shuffle([
        { label: fmtV(VB), type: 'correct' },
        { label: fmtV(V.vcc * V.r1 / (V.r1 + V.r2)), type: 'wrong' },
        { label: fmtV(V.vcc / 2), type: 'wrong' },
        { label: fmtV(V.vcc), type: 'wrong' },
      ]);
    }
    function buildQ2Options() {
      // correct: VB - 0.6
      // distractors: sign error, forgot the VBE drop, wrong VBE assumption (germanium-like 0.3V)
      return shuffle([
        { label: fmtV(VE), type: 'correct' },
        { label: fmtV(VB + VBE), type: 'wrong' },
        { label: fmtV(VB), type: 'wrong' },
        { label: fmtV(VB - 0.3), type: 'wrong' },
      ]);
    }
    function buildQ3Options() {
      // correct: VE / RE
      // distractors: wrong resistor, wrong voltage (VB instead of VE), wrong reference (VCC-VE)
      return shuffle([
        { label: fmtA(IE), type: 'correct' },
        { label: fmtA(VE / V.rc), type: 'wrong' },
        { label: fmtA(VB / V.re), type: 'wrong' },
        { label: fmtA((V.vcc - VE) / V.re), type: 'wrong' },
      ]);
    }
    function buildQ4Options() {
      // correct: VCC - IE*RC
      // distractors: ignored RC drop entirely, added instead of subtracting, wrong resistor (RE) —
      // note: "VCC - IE*RE" is NOT used here since IE*RE ≡ VE by definition, which would make it
      // an exact duplicate of a "VCC - VE" style distractor for every possible circuit
      return shuffle([
        { label: fmtV(VC), type: 'correct' },
        { label: fmtV(IE * V.rc), type: 'wrong' },
        { label: fmtV(V.vcc + IE * V.rc), type: 'wrong' },
        { label: fmtV(V.vcc - VE), type: 'wrong' },
      ]);
    }
    function buildQ5Options() {
      const gainNum = V.rc / V.re;
      function fmtGain(g) { return parseFloat(g.toFixed(2)).toString(); }
      return shuffle([
        { label: fmtGain(gainNum),                type: 'correct' },
        { label: fmtGain(V.re / V.rc),            type: 'wrong' },
        { label: fmtGain((V.rc + V.re) / V.re),   type: 'wrong' },
        { label: fmtGain(V.rc / (V.rc + V.re)),   type: 'wrong' },
      ]);
    }
    function buildQ6Options() {
      // Graphical options: mini multimeter (DC level) + sine wave + p-p indicator.
      // Correct: DC = 0 V (COUT blocks DC), inverted (CE phase inversion), >10 mV (amplified).
      function optSvg(reading, sinePath, ppText) {
        const mCol = 'var(--colour-supply)', sCol = 'var(--colour-ui-primary)', lCol = 'var(--colour-label)';
        return `<svg viewBox="0 0 290 70" style="width:min(260px,100%);height:auto;display:block;overflow:visible" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(35,35)">
            <circle cx="0" cy="0" r="28" fill="#111c24" stroke="${mCol}" stroke-width="2"/>
            <line x1="-12" y1="-18" x2="12" y2="-18" stroke="${mCol}" stroke-width="1.5"/>
            <line x1="-12" y1="-13" x2="12" y2="-13" stroke="${mCol}" stroke-width="1.5" stroke-dasharray="3,2"/>
            <text x="0" y="4" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">${reading}</text>
            <text x="0" y="18" font-family="sans-serif" font-size="9" fill="${mCol}" text-anchor="middle">V DC</text>
          </g>
          <g transform="translate(100,35)">
            <line x1="0" y1="-16" x2="79" y2="-16" stroke="${lCol}" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
            <line x1="0" y1="16" x2="79" y2="16" stroke="${lCol}" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
            <path d="${sinePath}" fill="none" stroke="${sCol}" stroke-width="2" stroke-linecap="round"/>
            <line x1="80" y1="-16" x2="80" y2="16" stroke="${lCol}" stroke-width="1.5"/>
            <polygon points="80,-16 77,-10 83,-10" fill="${lCol}"/>
            <polygon points="80,16 77,10 83,10" fill="${lCol}"/>
            <text x="88" y="-5" font-family="'Share Tech Mono',monospace" font-size="13" fill="${lCol}" text-anchor="start">${ppText}</text>
            <text x="88" y="13" font-family="'Share Tech Mono',monospace" font-size="13" fill="${lCol}" text-anchor="start">p-p</text>
          </g>
        </svg>`;
      }
      const INPHASE = 'M 0,0 C 8,-18 22,-18 30,0 C 38,18 52,18 60,0';
      const INVERTED = 'M 0,0 C 8,18 22,18 30,0 C 38,-18 52,-18 60,0';
      const INPHASE_BIG = 'M 0,0 C 8,-37 22,-37 30,0 C 38,37 52,37 60,0';
      const INVERTED_BIG = 'M 0,0 C 8,37 22,37 30,0 C 38,-37 52,-37 60,0';
      const vcReading = VC.toFixed(2);
      return shuffle([
        { label: optSvg(vcReading, INPHASE, '10 mV'), type: 'wrong' },
        { label: optSvg(vcReading, INVERTED, '10 mV'), type: 'wrong' },
        { label: optSvg('0.00', INPHASE_BIG, '10 mV'), type: 'wrong' },
        { label: optSvg('0.00', INVERTED_BIG, '10 mV'), type: 'correct' },
        { label: optSvg(vcReading, INVERTED_BIG, '10 mV'), type: 'wrong' },
      ]);
    }

    // ── circuit-specific SVG annotation show/hide ──
    function fmtVParts(v) {
      const a = Math.abs(v);
      if (a >= 1) return { val: String(parseFloat(v.toFixed(2))), unit: 'V' };
      if (a >= 0.001) return { val: String(parseFloat((v * 1000).toFixed(2))), unit: 'mV' };
      return { val: String(parseFloat((v * 1e6).toFixed(1))), unit: 'µV' };
    }
    function setMeter(id, v) {
      const p = fmtVParts(v);
      document.getElementById(id + 'Value').textContent = p.val;
      document.getElementById(id + 'Unit').textContent = p.unit;
      document.getElementById(id).setAttribute('display', 'inline');
    }
    function showVB() { setMeter('meterVB', VB); }
    function hideVB() { document.getElementById('meterVB').setAttribute('display', 'none'); }
    function showVE() { setMeter('meterVE', VE); }
    function hideVE() { document.getElementById('meterVE').setAttribute('display', 'none'); }
    function fmtAParts(a) {
      const x = Math.abs(a);
      if (x >= 1) return { val: String(parseFloat(a.toFixed(3))), unit: 'A' };
      if (x >= 0.001) return { val: String(parseFloat((a * 1000).toFixed(2))), unit: 'mA' };
      return { val: String(parseFloat((a * 1e6).toFixed(1))), unit: 'µA' };
    }
    function showIE() {
      const p = fmtAParts(IE);
      document.getElementById('ieValue').textContent = p.val;
      document.getElementById('ieUnit').textContent = p.unit;
      document.getElementById('ieInd').setAttribute('display', 'inline');
    }
    function hideIE() { document.getElementById('ieInd').setAttribute('display', 'none'); }
    function showVC() { setMeter('meterVC', VC); }
    function hideVC() { document.getElementById('meterVC').setAttribute('display', 'none'); }
    function showGain() {
      const gainNum = V.rc / V.re;
      document.getElementById('gainValue').textContent = '≈ ' + parseFloat(gainNum.toFixed(2));
      document.getElementById('gainInd').setAttribute('display', 'inline');
    }
    function hideGain() { document.getElementById('gainInd').setAttribute('display', 'none'); }

    // ── Circuit state table — one row per question, cumulative reveal ──
    const CIRCUIT_STATES = [
      { enter: { vb:false, ve:false, ie:false, vc:false, gain:false }, reveal: { vb:true,  ve:false, ie:false, vc:false, gain:false } }, // Q1 → VB
      { enter: { vb:true,  ve:false, ie:false, vc:false, gain:false }, reveal: { vb:true,  ve:true,  ie:false, vc:false, gain:false } }, // Q2 → VE
      { enter: { vb:true,  ve:true,  ie:false, vc:false, gain:false }, reveal: { vb:true,  ve:true,  ie:true,  vc:false, gain:false } }, // Q3 → IE
      { enter: { vb:true,  ve:true,  ie:true,  vc:false, gain:false }, reveal: { vb:true,  ve:true,  ie:true,  vc:true,  gain:false } }, // Q4 → VC
      { enter: { vb:true,  ve:true,  ie:true,  vc:true,  gain:false }, reveal: { vb:true,  ve:true,  ie:true,  vc:true,  gain:true  } }, // Q5 → gain
      { enter: { vb:true,  ve:true,  ie:true,  vc:true,  gain:true  }, reveal: { vb:true,  ve:true,  ie:true,  vc:true,  gain:true  } }, // Q6 → load terminal
    ];

    function applyCircuitState(s) {
      s.vb   ? showVB()   : hideVB();
      s.ve   ? showVE()   : hideVE();
      s.ie   ? showIE()   : hideIE();
      s.vc   ? showVC()   : hideVC();
      s.gain ? showGain() : hideGain();
    }

    const QUESTION_BUILDERS = [
      buildQ1Options, buildQ2Options, buildQ3Options,
      buildQ4Options, buildQ5Options, buildQ6Options,
    ];

    // ══════════════════════════════════════════════════════════════════════
    // END CIRCUIT SIMULATION
    // ══════════════════════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic, unchanged from the resistor-quiz template
    // ══════════════════════════════════════════════════════════════════════

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ─── DEV: jump straight to a question for testing ──────────────────────
       Console:   jump(5)            → go to Q5
                  jump(5, true)      → go to Q5 already answered (banner + reveal)
       URL:       ?q=5               → loads straight on Q5
                  ?q=5&ans=1         → loads on Q5, answered
                  ?q=s               → loads straight on the summary (see jumpToSummary below) */

    /* ─── DEV: jump straight to the summary, auto-answering every question ──
       (correctly, so the summary has real banners/workings to review) ────
       Console:   jumpToSummary()
       URL:       ?q=s */

    // Only show the back link if there's actually somewhere to go back to —
    // history.length is 1 when this page was opened directly (new tab, bookmark,
    // double-click) rather than reached by clicking a link from a menu page.
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    /* ─── DEV: xy ruler overlay, for lining up SVG coordinates by eye ────────
       Console:   setXY(1) / setXY(0)     URL: ?xy=1 */

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — quiz-engine.js format. Texts/hints come from QUESTION_TEXT
    // above; options from QUESTION_BUILDERS; the banner and worked solution
    // are functions of the live component values, so Example 1/2/3 and
    // Randomise (setMode → resetQuiz) just work.
    // ══════════════════════════════════════════════════════════════════════
    const QUESTIONS = [
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[0].text === 'function' ? QUESTION_TEXT[0].text() : QUESTION_TEXT[0].text),
        hint: () => QUESTION_TEXT[0].hint,
        options: QUESTION_BUILDERS[0],
        correctExplain: () => {
      
      return `V<sub>B</sub> = ${fmtV(VB)}`;
    },
        working: () => {
      
      
      
      return `
    <div class="working-line">Since the base draws very little current compared to the divider current flowing through <span class="colour-resistor">R<sub>1</sub></span> and <span class="colour-resistor">R<sub>2</sub></span>, treat <span class="colour-resistor">R<sub>1</sub></span>–<span class="colour-resistor">R<sub>2</sub></span> as a simple voltage divider from <span class="colour-supply">V<sub>CC</sub></span> to ground:</div>

    <div class="working-step">Base voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> × ${frac('<span class="colour-resistor">R<sub>2</sub></span>', '<span class="colour-resistor">R<sub>1</sub></span> + <span class="colour-resistor">R<sub>2</sub></span>')}</div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>B</sub></span> = ${V.vcc} V × ${frac(fmtO0(V.r2), fmtO0(V.r1) + ' + ' + fmtO0(V.r2))}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-result">${fmtV(VB)}</span></div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[1].text === 'function' ? QUESTION_TEXT[1].text() : QUESTION_TEXT[1].text),
        hint: () => QUESTION_TEXT[1].hint,
        options: QUESTION_BUILDERS[1],
        correctExplain: () => {
      
      return `V<sub>E</sub> = ${fmtV(VE)}`;
    },
        working: () => {
      
      
      
      return `
    <div class="working-line">A forward-biased silicon base-emitter junction drops approximately <b>0.6 V</b>(<span class="colour-bjt">V<sub>BE</sub> (on)</span>). The emitter voltage is the base voltage minus this drop:</div>

    <div class="working-step">Emitter voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-voltage">V<sub>B</sub></span> − <span class="colour-bjt">V<sub>BE</sub>(on)</span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>E</sub></span> = ${fmtV(VB)} − 0.6 V</div>
    <div class="working-total"><span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-result">${fmtV(VE)}</span></div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[2].text === 'function' ? QUESTION_TEXT[2].text() : QUESTION_TEXT[2].text),
        hint: () => QUESTION_TEXT[2].hint,
        options: QUESTION_BUILDERS[2],
        correctExplain: () => {
      
      return `I<sub>E</sub> = ${fmtA(IE)}`;
    },
        working: () => {
      
      
      
      return `
    <div class="working-line">Apply Ohm's law to <span class="colour-resistor">R<sub>E</sub></span>, using the emitter voltage found in Q2:</div>

    <div class="working-step">Emitter current:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>E</sub></span> = ${frac('<span class="colour-voltage">V<sub>E</sub></span>', '<span class="colour-resistor">R<sub>E</sub></span>')}</div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>E</sub></span> = ${frac(fmtV(VE), fmtO0(V.re))}</div>
    <div class="working-total"><span class="colour-current">I<sub>E</sub></span> = <span class="colour-result">${fmtA(IE)}</span></div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[3].text === 'function' ? QUESTION_TEXT[3].text() : QUESTION_TEXT[3].text),
        hint: () => QUESTION_TEXT[3].hint,
        options: QUESTION_BUILDERS[3],
        correctExplain: () => {
      
      return `V<sub>C</sub> = ${fmtV(VC)}`;
    },
        working: () => {
      
      
      
      return `
    <div class="working-line">Base current is small, so assume <span class="colour-bjt">I<sub>C</sub> ≈ I<sub>E</sub></span> = ${fmtA(IE)}. Find the voltage dropped across <span class="colour-resistor">R<sub>C</sub></span>, then subtract it from <span class="colour-supply">V<sub>CC</sub></span>:</div>

    <div class="working-step">Step 1. Use Ohm's Law to calculate the voltage drop over RC:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>RC</sub></span> = <span class="colour-current">I<sub>C</sub></span> × <span class="colour-resistor">R<sub>C</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>RC</sub></span> = ${fmtA(IE)} × ${fmtO0(V.rc)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>RC</sub></span> = <span class="colour-result">${fmtV(VRC)}</span></div>

    <div class="working-step">Step 2. Deduct the voltage drop over <span class="colour-voltage">V<sub>RC</sub></span> from the supply voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-voltage">V<sub>RC</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = ${V.vcc} V − ${fmtV(VRC)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">${fmtV(VC)}</span></div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[4].text === 'function' ? QUESTION_TEXT[4].text() : QUESTION_TEXT[4].text),
        hint: () => QUESTION_TEXT[4].hint,
        options: QUESTION_BUILDERS[4],
        correctExplain: () => {
      const gainNum = V.rc / V.re;
      
      return `|A<sub>v</sub>| ≈ <span class="colour-result">${gainNum.toFixed(2)}</span>`;
    },
        working: () => {
      
      
      const gainNum = V.rc / V.re;
      const gain = gainNum.toFixed(2);
      
      return `
    <div class="working-step">Voltage gain of common-emitter stage</div>
    <div class="working-formula-row"><span class="colour-gain">|A<sub>v</sub>|</span> ≈ ${frac('<span class="colour-resistor">R<sub>C</sub></span>', '<span class="colour-resistor">R<sub>E</sub></span>')}</div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-gain">|A<sub>v</sub>|</span> ≈ ${frac(fmtO0(V.rc), fmtO0(V.re))}</div>
    <div class="working-total"><span class="colour-gain">|A<sub>v</sub>|</span> ≈ <span class="colour-result">${gain}</span></div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[5].text === 'function' ? QUESTION_TEXT[5].text() : QUESTION_TEXT[5].text),
        hint: () => QUESTION_TEXT[5].hint,
        options: QUESTION_BUILDERS[5],
        correctExplain: () => {
      
      return 'DC = 0 V, inverted signal, amplified (p-p &gt; 10 mV)';
    },
        working: () => {
      
      
      const gainNum = V.rc / V.re;
      const gain = gainNum.toFixed(2);
      const voutPP = (gainNum * 10).toFixed(1);
      
      return `
    <div class="working-label">DC level at L</div>
    <div class="working-line"><span class="ccap">C<sub>OUT</sub></span> is a coupling capacitor — it blocks DC and passes only the AC signal. No matter what <span class="colour-voltage">V<sub>C</sub></span> is (${fmtV(VC)} in this example), the DC level at the load terminal is <span class="colour-voltage">0 V</span>.</div>
    <div class="working-label">AC phase at L</div>
    <div class="working-line">Common-emitter configuration: a rising input at the base increases collector current, increasing the voltage drop across <span class="colour-resistor">R<sub>C</sub></span> and pulling <span class="colour-voltage">V<sub>C</sub></span> <b>lower</b>. The signal passed through <span class="ccap">C<sub>OUT</sub></span> to L is therefore <span class="colour-voltage">inverted</span> — 180° out of phase with V<sub>S</sub>.</div>
    <div class="working-step">Output amplitude (using gain from Q5)</div>
    <div class="working-formula-row"><span class="csignal">V<sub>L p-p</sub></span> ≈ <span class="colour-gain">|A<sub>v</sub>|</span> × <span class="csignal">V<sub>S</sub></span></div>
    <div class="working-formula-row"><span class="csignal">V<sub>L p-p</sub></span> ≈ ${gain} × 10 mV</div>
    <div class="working-total"><span class="csignal">V<sub>L p-p</sub></span> ≈ <span class="colour-result">${voutPP} mV p-p</span></div>
    <div class="working-formula-row">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(amplified, so p-p &gt; 10 mV)&nbsp;<span class="colour-result">✓</span></div>`;
    },
      },
    ];

    // Meters reveal progressively: the question's `enter` state until it is
    // answered, then its `reveal` state.
    RENDER_EXTRA = function () {
      applyCircuitState(Q[cur].ans ? CIRCUIT_STATES[cur].reveal : CIRCUIT_STATES[cur].enter);
    };

    // Summary page: everything revealed, component values on top.
    SUMMARY_CIRCUIT_REF = { id: null, label: 'Circuit Diagram', viewBox: null };
    SUMMARY_EXTRA = function () {
      applyCircuitState(CIRCUIT_STATES[CIRCUIT_STATES.length - 1].reveal);
      document.getElementById('summaryContent').insertAdjacentHTML('afterbegin', `<div class="summary-values">
    <span style="color:var(--colour-supply);font-weight:bold">V<sub>CC</sub></span> = <span style="color:var(--colour-supply)">${V.vcc} V</span>&nbsp;&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>1</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.r1)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>2</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.r2)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>C</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rc)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>E</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.re)}</span>
  </div>`);
    };

    initQuizNav();
    setMode('example1');      // builds the value set, then resetQuiz()
    {
      const p = new URLSearchParams(location.search);
      const rKeys = ['vcc', 'r1', 'r2', 'rc', 're'];
      if (rKeys.every(k => p.has(k))) {
        const vals = {}; rKeys.forEach(k => vals[k] = +p.get(k));
        quizMode = 'custom'; V = vals; recompute(); refreshLabels();
        ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
          const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
          if (b) b.classList.toggle('active', false);
        });
        resetQuiz();
      }
    }
    initQuizFromURL();
  </script>
