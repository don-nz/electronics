<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../../assets/theme-init.js"></script>
  <script src="../../../../assets/shapes.js"></script>
  <script src="../../../../assets/quiz-engine.js"></script>
  <title>BJT PNP AC Fault Diagnosis Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <script src="../../../../assets/breadcrumb.js" defer></script>
    <style>
    :root {
            --colour-grid: rgba(0,229,255,.06);
        }

    header h1 {
      font-family: 'Orbitron', sans-serif; font-size: clamp(1.3rem,4vw,2rem);
      font-weight: 900; letter-spacing: .12em; color: var(--colour-ui-primary);
      text-shadow: 0 0 30px rgba(0,229,255,.5); text-transform: uppercase;
    }

    .quiz-wrap { width: 100%; max-width: clamp(900px,80vw,1200px); display: flex; flex-direction: column; gap: 1.5rem; }
    @media(min-width:900px) {
      .quiz-wrap { display: grid; grid-template-columns: minmax(280px, 580px) 1fr; gap: 1.2rem; align-items: start; }
    }

    .circuit-panel {
      background: rgba(0,0,0,.25); border: 1px solid var(--colour-border);
      border-radius: 4px; padding: .8rem; position: relative; cursor: zoom-in;
    }

    .diagram-modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(5,8,16,.88); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1.2rem; }

    .modal-inner { position: relative; background: rgba(0,0,0,.35); border: 1px solid var(--colour-border); border-radius: 6px; padding: .8rem; max-width: min(92vw,700px); max-height: 92vh; width: 100%; display: flex; flex-direction: column; gap: .5rem; cursor: zoom-out; }

    .modal-close { font-family: 'Share Tech Mono', monospace; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; background: rgba(255,61,154,.08); border: 1px solid rgba(255,61,154,.35); color: #ff3d9a; border-radius: 3px; padding: .3rem .7rem; }
    .progress-wrap { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; }

    .progress-dot.done { background: var(--colour-progress); border-color: var(--colour-progress); }
    .progress-dot.active { background: var(--colour-ui-primary); border-color: var(--colour-ui-primary); box-shadow: 0 0 6px rgba(0,229,255,.6); }

    .menu-link { margin-left: auto; font-size: .65rem; color: var(--colour-ui-primary); text-decoration: none; letter-spacing: .08em; padding: .15rem .5rem; border: 1px solid rgba(0,229,255,.25); border-radius: 3px; }

    .option-btn {
      width: 100%; padding: .7rem 1rem; border-radius: 3px;
      border: 1px solid var(--colour-border); background: rgba(255,255,255,.02);
      color: var(--colour-text); font-family: 'Share Tech Mono', monospace;
      font-size: .82rem; text-align: left; cursor: pointer;
      transition: border-color .15s, background .15s; display: flex; align-items: flex-start; gap: .7rem;
    }
    .option-btn:hover:not(:disabled) { border-color: rgba(0,229,255,.4); background: rgba(0,229,255,.05); }
    .option-btn.selected { border-color: rgba(0,229,255,.6); background: rgba(0,229,255,.08); color: var(--colour-ui-primary); }
    .option-btn.correct { border-color: var(--colour-ui-correct); background: rgba(0,255,153,.08); color: var(--colour-ui-correct); }
    .option-btn.wrong { border-color: var(--colour-ui-wrong); background: rgba(255,61,154,.08); color: var(--colour-ui-wrong); }

    .option-letter { font-family: 'Orbitron', sans-serif; font-size: .7rem; font-weight: 700; min-width: 22px; padding-top: .1rem; }

    .result-icon { font-size: 1.1rem; margin-left: auto; padding-top: .05rem; }

    .result-banner.correct { display: flex; background: rgba(0,255,153,.08); border: 1px solid rgba(0,255,153,.3); color: var(--colour-ui-correct); }
    .result-banner.wrong { display: flex; background: rgba(255,61,154,.08); border: 1px solid rgba(255,61,154,.3); color: var(--colour-ui-wrong); }
    .working-box { display: none; background: rgba(0,0,0,.2); border: 1px solid var(--colour-border); border-radius: 4px; padding: 1.1rem 1.3rem; }

    .working-section { font-family: 'Orbitron', sans-serif; font-size: .65rem; letter-spacing: .15em; color: var(--colour-label); text-transform: uppercase; margin: 1rem 0 .5rem; }
    .working-line { font-size: .8rem; line-height: 1.7; margin-bottom: .2rem; }
    .working-step { font-size: .8rem; font-weight: bold; color: var(--colour-ui-primary); margin-top: .8rem; }
    .working-formula-row { font-size: .85rem; line-height: 2; margin-left: 1rem; }
    .working-label { font-size: .75rem; color: var(--colour-label); margin-top: .3rem; margin-left: 1rem; }
    .working-total { font-size: .9rem; font-weight: bold; margin-left: 1rem; margin-top: .2rem; }
    .working-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .2em; line-height: 1.2; }
    .working-frac .num { border-bottom: 1px solid; padding-bottom: .1em; font-size: .85em; }
    .working-frac .den { padding-top: .1em; font-size: .85em; }

    .colour-bjt { color: var(--colour-bjt); }
    .colour-result { color: #00ff99; }

    .diagnosis-block { display: flex; flex-direction: column; gap: .6rem; margin: .5rem 0; }
    .symptom-item { background: rgba(0,0,0,.15); border-left: 2px solid var(--colour-border); border-radius: 2px; padding: .5rem .8rem; }
    .symptom-title { font-size: .8rem; font-weight: bold; color: #c0d4e8; margin-bottom: .25rem; }
    .symptom-body { font-size: .76rem; line-height: 1.65; color: var(--colour-label); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .55rem .9rem; border-radius: 3px; font-family: 'Share Tech Mono', monospace;
      font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
      cursor: pointer; border: 1px solid; width: 130px; text-align: center;
    }
    .btn-check { background: rgba(0,255,153,.1); border-color: rgba(0,255,153,.4); color: var(--colour-progress); }
    .btn-check:hover:not(:disabled) { background: rgba(0,255,153,.2); }

    .btn-next { background: rgba(0,229,255,.1); border-color: rgba(0,229,255,.4); color: var(--colour-ui-primary); }
    .btn-next:hover { background: rgba(0,229,255,.2); }
    .btn-prev { background: rgba(90,122,154,.1); border-color: rgba(90,122,154,.4); color: var(--colour-label); }
    .btn-prev:hover { background: rgba(90,122,154,.2); }
    .btn-summary { background: rgba(167,139,250,.12); border-color: rgba(167,139,250,.4); color: #a78bfa; }
    .btn-summary:hover { background: rgba(167,139,250,.22); }
    .btn-shuffle { background: rgba(255,107,53,.1); border-color: rgba(255,107,53,.4); color: #ff6b35; margin-left: auto; }
    .btn-shuffle:hover { background: rgba(255,107,53,.2); }

    .summary-item { border: 1px solid var(--colour-border); border-radius: 4px; padding: .9rem 1rem; margin-bottom: 1rem; background: rgba(0,0,0,.15); }
    
    /* quiz-common.css gives every .option-btn span flex:1, which (with the engine's
       result icon) squeezes these two-line options into half the row. Keep the icon small. */
    .option-btn span.result-icon { flex: 0 0 auto; }
  </style>
</head>

<div class="crumb" id="crumb" data-current="Troubleshooter"></div>
<header>
  <h1>PNP AC Fault Diagnosis</h1>
  <p>Output Waveform Analysis · Common‑Emitter PNP Amplifier · BC557</p>
</header>

<div class="quiz-wrap">

  <!-- LEFT: circuit diagram -->
  <div class="circuit-col">
    <div class="mode-toggle">

      </div>
    </div>
    <div class="circuit-panel" onclick="openModal()" title="Click to zoom">
      <div class="panel-label">AC Amplifier Circuit — V<sub>CC</sub> = <span id="panelVcc">12</span> V</div>
      <div class="zoom-hint">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
          <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="6" y1="8" x2="10" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="8" y1="6" x2="8" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Zoom
      </div>

      <svg id="circuitSvg" viewBox="0 0 580 700" xmlns="http://www.w3.org/2000/svg" font-family="'Share Tech Mono',monospace">
        <defs>
          

          <!-- ══ VOLTMETER SHAPE ══ -->

             <!-- TOP CENTER    - no translate
                  TOP RIGHT     - transform="translate(25, 0)
                  TOP LEFT      - transform="translate(-25, 0)
                  BOTTOM CENTER - transform="scale(1, -1)
                  BOTTOM RIGHT  - transform="scale(1, -1) translate(-25, 0)
                  BOTTOM LEFT   - transform="scale(1, -1) translate(25, 0)          
             -->

          <!-- ══ AC SIGNAL SOURCE SHAPE — circle with one sine cycle ══ -->

        </defs>

        <g id="circuitGroup" transform="translate(60,5)">

          <!-- Datasheet table -->
          <g transform="translate(-55,0)">
            <rect x="0" y="0" width="130" height="145" rx="4" style="fill:rgba(0,0,0,.25)" stroke="var(--colour-bjt)" stroke-width="1"/>
            <text x="6" y="13" style="fill:var(--colour-text)" font-size="9" font-weight="bold" letter-spacing=".03em">BC557 — TYPICAL RATINGS</text>
            <line x1="6" y1="19" x2="124" y2="19" style="stroke:var(--colour-border)" stroke-width="1"/>
            <text x="6" y="32" style="fill:var(--colour-bjt)" font-size="12">V<tspan baseline-shift="sub" font-size="6.5">EB</tspan>(on)</text>
            <text x="124" y="32" style="fill:var(--colour-text)" text-anchor="end" font-size="12">0.6 V typ</text>
            <text x="6" y="49" style="fill:var(--colour-bjt)" font-size="12">V<tspan baseline-shift="sub" font-size="6.5">EC</tspan>(sat)</text>
            <text x="124" y="49" style="fill:var(--colour-text)" text-anchor="end" font-size="12">0.2 V typ</text>
            <text x="6" y="66" style="fill:var(--colour-bjt)" font-size="12">V<tspan baseline-shift="sub" font-size="6.5">CEO</tspan>(max)</text>
            <text x="124" y="66" style="fill:var(--colour-text)" text-anchor="end" font-size="12">45 V</text>
            <text x="6" y="83" style="fill:var(--colour-bjt)" font-size="12">I<tspan baseline-shift="sub" font-size="6.5">C</tspan>(max)</text>
            <text x="124" y="83" style="fill:var(--colour-text)" text-anchor="end" font-size="12">100 mA</text>
            <text x="6" y="100" style="fill:var(--colour-bjt)" font-size="12">P<tspan baseline-shift="sub" font-size="6.5">D</tspan>(max)</text>
            <text x="124" y="100" style="fill:var(--colour-text)" text-anchor="end" font-size="12">500 mW</text>
            <text x="6" y="117" style="fill:var(--colour-bjt)" font-size="12">h<tspan baseline-shift="sub" font-size="6.5">FE</tspan> (β)</text>
            <text x="124" y="117" style="fill:var(--colour-text)" text-anchor="end" font-size="12">75–800</text>
            <text x="6" y="134" style="fill:var(--colour-bjt)" font-size="12">I<tspan baseline-shift="sub" font-size="6.5">CBO</tspan></text>
            <text x="124" y="134" style="fill:var(--colour-text)" text-anchor="end" font-size="12">&lt;15 nA</text>
          </g>

          <!-- ════════════════════ WIRES ════════════════════ -->

          <!-- ── BASE VERTICAL (R1/R2 base-bias rail, x=100) ── -->
          <line x1="100" y1="50" x2="100" y2="650" style="stroke: var(--colour-series)" stroke-width="2" />
          <circle cx="100" cy="50" r="5" style="fill: var(--colour-series)" />
          <circle cx="100" cy="650" r="5" style="fill: var(--colour-series)" />

          <!-- ── RC RAIL VERTICAL (RE/RC rail, x=340) ── -->
          <line x1="340" y1="50" x2="340" y2="317" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Top to Emitter pin -->
          <circle cx="340" cy="50" r="5" style="fill: var(--colour-series)" />
          <line x1="340" y1="384" x2="340" y2="650" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Collector pin to GND -->
          <circle cx="340" cy="650" r="5" style="fill: var(--colour-series)" />

          <!-- ── LEFT VERTICAL (Source AC to GND rail) ── -->
          <line x1="-20" y1="376" x2="-20" y2="650" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Top to Emitter pin -->
          <circle cx="-20" cy="650" r="5" style="fill: var(--colour-series)" />

          <!-- ── RIGHT OUTPUT VERTICAL ── -->
          <line x1="460" y1="415" x2="460" y2="650" style="stroke: var(--colour-series)" stroke-width="2" /><!-- RL top to GND -->
          <circle cx="460" cy="650" r="5" style="fill: var(--colour-series)" />

          <!-- ── TOP HORIZONTAL (VCC rail) ── -->
          <line x1="90" y1="50" x2="350" y2="50" style="stroke: var(--colour-series)" stroke-width="2" />

          <!-- ── CENTRE HORIZONTAL (Vs → BJT base) ── -->
          <line x1="4" y1="350" x2="309" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Vs to C_in -->

          <!-- ── OUTPUT HORIZONTAL ── -->
          <line x1="340" y1="415" x2="460" y2="415" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Collector to C_out -->

          <!-- ── BOTTOM HORIZONTAL (GND rail) ── -->
          <line x1="-30" y1="650" x2="470" y2="650" style="stroke: var(--colour-series)" stroke-width="2" /><!-- GND rail extended right to RL -->


          <!-- ════════════════════ NODES ════════════════════ -->

          <!-- ── NODE B (junction of R1/R2 rail and base wire) ── -->
          <circle cx="100" cy="350" r="5" style="fill: var(--colour-series)" />
          <g id="nodeB_lbl" transform="translate(125,330)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5" />
            <text x="0" y="5" style="fill: var(--colour-node)" text-anchor="middle" font-size="14" font-weight="bold">B</text>
          </g>

          <!-- ── NODE E (top of BJT — emitter in PNP) ── -->
          <g id="nodeE_lbl" transform="translate(320,305)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5" />
            <text x="0" y="5" style="fill: var(--colour-node)" text-anchor="middle" font-size="14" font-weight="bold">E</text>
          </g>

          <!-- ── NODE C (bottom of BJT — collector in PNP) ── -->
          <circle cx="340" cy="415" r="5" style="fill: var(--colour-series)" /><!-- Collector node junction -->
          <g id="nodeC_lbl" transform="translate(320,400)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5" />
            <text x="0" y="5" style="fill: var(--colour-node)" text-anchor="middle" font-size="14" font-weight="bold">C</text>
          </g>

          <!-- ════════════════════ VCC ════════════════════ -->
          <g transform="translate(180,-1)">
            <line x1="40" y1="50" x2="40" y2="30" style="stroke:var(--colour-supply)" stroke-width="2"/>
            <line x1="0" y1="30" x2="80" y2="30" style="stroke:var(--colour-supply)" stroke-width="2"/>
            <text x="0" y="15" style="fill:var(--colour-supply)" text-anchor="start" font-size="15" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
            <line x1="50" y1="10" x2="50" y2="20" style="stroke:var(--colour-text)" stroke-width="1"/>
            <line x1="46" y1="15" x2="54" y2="15" style="stroke:var(--colour-text)" stroke-width="1"/>
            <text id="vccVal" x="60" y="20" style="fill:var(--colour-text)" font-size="14" font-weight="bold">12V</text>
          </g>

          <!-- ════════════════════ GND ════════════════════ -->
          <g transform="translate(265,650)">
            <line x1="0" y1="0" x2="0" y2="15" style="stroke:var(--colour-gnd)" stroke-width="2"/>
            <line x1="-14" y1="15" x2="14" y2="15" style="stroke:var(--colour-gnd)" stroke-width="2"/>
            <line x1="-9" y1="20" x2="9" y2="20" style="stroke:var(--colour-gnd)" stroke-width="1.5"/>
            <line x1="-4" y1="25" x2="4" y2="25" style="stroke:var(--colour-gnd)" stroke-width="1.5"/>
          </g>

          <!-- ════════════════════ BJT ════════════════════ -->
          <!-- ════ (Q1 — BC557) ════ -->
          <g transform="translate(326,350)">
            <use href="#bjt-pnp-shape"/>
            <text x="-25" y="-18" fill="var(--colour-bjt-labels)" text-anchor="middle" font-size="14" font-weight="bold">Q1</text>
            <text x="-20" y="28" fill="var(--colour-bjt-labels)" text-anchor="end" font-size="12">BC557</text>
          </g>

          <!-- ════════════════════ RESISTORS ════════════════════ -->
          <!-- R1 (VCC → Base node) -->
          <g transform="translate(85,170)">
            <rect x="0" y="0" width="30" height="80" rx="3" style="fill:var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">R1</text>
            <text id="r1Val" x="55" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="13">6.8kΩ</text>
          </g>
          <!-- R2 (Base node → GND) -->
          <g transform="translate(85,445)">
            <rect x="0" y="0" width="30" height="80" rx="3" style="fill:var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">R2</text>
            <text id="r2Val" x="55" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="13">27kΩ</text>
          </g>
          <!-- RE (VCC → Emitter, top right) -->
          <g transform="translate(325,140)">
            <rect x="0" y="0" width="30" height="80" rx="3" style="fill:var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">RE</text>
            <text id="reVal" x="55" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="13">390Ω</text>
          </g>
          <!-- RC (Collector → GND, bottom right) -->
          <g transform="translate(325,500)">
            <rect x="0" y="0" width="30" height="80" rx="3" style="fill:var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">RC</text>
            <text id="rcVal" x="55" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="13">1.2kΩ</text>
          </g>
          <!-- RL (Collector output → GND) -->
          <g transform="translate(445,455)">
            <rect x="0" y="0" width="30" height="80" rx="3" style="fill:var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text x="-14" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">RL</text>
            <text x="50" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="13">10kΩ</text>
          </g>

          <!-- ════════════════════ CAPACITORS ════════════════════ -->

          <!-- ════ C_in (input coupling capacitor, in base wire) ════ -->
          <g id="cinGroup" transform="translate(50,350)">
            <use href="#cap-shape"/>
            <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="13" font-weight="bold">C<tspan baseline-shift="sub" font-size="9">IN</tspan></text>
            <text x="0" y="25" fill="var(--colour-text)" text-anchor="middle" font-size="12"><tspan fill="var(--colour-text)">10</tspan><tspan fill="var(--colour-capacitor-labels)"> µF</tspan></text>
          </g>

          <!-- ════ C_out (output coupling capacitor, collector to RL) ════ -->
          <g id="coutGroup" transform="translate(430,415)">
            <use href="#cap-shape"/>
            <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="13" font-weight="bold">C<tspan baseline-shift="sub" font-size="9">OUT</tspan></text>
            <text x="0" y="25" fill="var(--colour-text)" text-anchor="middle" font-size="12"><tspan fill="var(--colour-text)">10</tspan><tspan fill="var(--colour-capacitor-labels)"> µF</tspan></text>
          </g>

            <!-- ════════════════════ AC INPUT COMPONENTS ════════════════════ -->

            <text x="25" y="35" style="fill: var(--colour-signal)" text-anchor="middle" font-size="13" font-weight="bold">V<tspan baseline-shift="sub" font-size="9">S</tspan></text>
              <text id="vsValue" x="-25" y="-35" style="fill: var(--colour-signal)" text-anchor="start" font-size="12"

          <!-- ════════════════════ VOLTAGE INDICATORS (revealed on answer) ════════════════════ -->
          <g id="voltageLabels" display="none">
            <!-- VB — right of R1, probe points toward base node (100,350) -->
            <g transform="translate(180,280)">
              <use href="#probe-wire" transform="rotate(135) translate(30,0)" />

              <text x="-25" y="-35" style="fill: var(--colour-voltage-label)" text-anchor="middle" font-size="14" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">B</tspan></text>
              <text id="voltVBVal" x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle" font-size="15" font-weight="bold">—</text>

            <!-- VE — right of RE, probe points toward emitter node (340,317) -->
            <g transform="translate(265,250)">
              <use href="#probe-wire" transform="rotate(45) translate(30,0)" />
              <use href="#meter-shape" />
              <text x="-25" y="-35" style="fill: var(--colour-voltage-label)" text-anchor="middle" font-size="14" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">E</tspan></text>
              <text id="voltVEVal" x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle" font-size="15" font-weight="bold">—</text>
              <text x="0" y="22" style="fill: var(--colour-red)" text-anchor="middle" font-size="14">V</text>
            </g>
            <!-- VC — between base rail and RC, probe points toward collector node (340,415) -->
            <g transform="translate(265,445)">
              <use href="#probe-wire" transform="rotate(315) translate(30,0)" />
              <use href="#meter-shape" />
              <text x="-25" y="-35" style="fill: var(--colour-voltage-label)" text-anchor="middle" font-size="14" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">C</tspan></text>
              <text id="voltVCVal" x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle" font-size="15" font-weight="bold">—</text>
              <text x="0" y="22" style="fill: var(--colour-red)" text-anchor="middle" font-size="14">V</text>
            </g>
            <!-- VEC — right of BJT, same format as Quiz 4 -->
            <g transform="translate(365,350)">
              <text x="0" y="0" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="14" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">EC</tspan></text>
              <text id="vecValue" x="0" y="20" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="13" font-weight="bold">—</text>
            </g>
          </g>

        </g><!-- /circuitGroup -->
        <g id="xyRuler" display="none"></g>
      </svg>
    </div><!-- /circuit-panel -->

    <!-- Zoom modal -->
    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">

</div><!-- /quiz-wrap -->

  <script>Shapes.use('test-equipment', 'bjt-symbols', 'circuit-components');</script>
<script>

  // ── Component sets ──
  const EXAMPLE_SETS = {
    example1: { vcc: 12, r1: 6800,  r2: 27000, rc: 1200, re: 390  },
    example2: { vcc: 15, r1: 10000, r2: 39000, rc: 1800, re: 560  },
    example3: { vcc: 9,  r1: 4700,  r2: 18000, rc: 820,  re: 270  },
  };
  let quizMode = 'example1';
  let V = { ...EXAMPLE_SETS.example1 };

  function fmtR(r)    { return r >= 1000 ? parseFloat((r/1000).toFixed(1)) + 'kΩ' : r + 'Ω'; }
  function fmtRtxt(r) { return r >= 1000 ? parseFloat((r/1000).toFixed(1)) + ' kΩ' : r + ' Ω'; }
  function fmtRk(r)   { return parseFloat((r/1000).toFixed(1)) + 'k'; }

  function calcHealthy(v) {
    const VB = v.vcc * v.r2 / (v.r1 + v.r2);
    const VE = VB + 0.6;
    const IE = (v.vcc - VE) / v.re;
    const VC = IE * v.rc;
    return { VB, VE, IE, VC, VEC: VE - VC };
  }
  function calcSaturation(v) {
    const VC = v.rc * (v.vcc - 0.2) / (v.rc + v.re);
    return { VC, VE: VC + 0.2 };
  }
  function calcRCHigh(v, h) {
    const VC = h.IE * v.rc * 1.5;
    return { VB: h.VB, VE: h.VE, VC, VEC: h.VE - VC, RC2: v.rc * 1.5 };
  }

  function getFaultVoltages() {
    const h = calcHealthy(V), sat = calcSaturation(V), rch = calcRCHigh(V, h);
    return [
      { vb: V.vcc.toFixed(2),  ve: V.vcc.toFixed(2),  vc: '0.00',            vec: V.vcc.toFixed(2) + ' V' },
      { vb: '0.00',            ve: sat.VE.toFixed(2),  vc: sat.VC.toFixed(2), vec: '0.20 V'                },
      { vb: h.VB.toFixed(2),   ve: h.VE.toFixed(2),    vc: rch.VC.toFixed(2), vec: rch.VEC.toFixed(2) + ' V' },
    ];
  }

  function updateCircuitLabels() {
    document.getElementById('vccVal').textContent   = V.vcc + 'V';
    document.getElementById('panelVcc').textContent = V.vcc;
    document.getElementById('r1Val').textContent    = fmtR(V.r1);
    document.getElementById('r2Val').textContent    = fmtR(V.r2);
    document.getElementById('reVal').textContent    = fmtR(V.re);
    document.getElementById('rcVal').textContent    = fmtR(V.rc);
  }

  function randomValues() {
    const pool = [
      { vcc: 12, r1: 6800,  r2: 27000, rc: 1200, re: 390  },
      { vcc: 15, r1: 10000, r2: 39000, rc: 1800, re: 560  },
      { vcc: 9,  r1: 4700,  r2: 18000, rc: 820,  re: 270  },
      { vcc: 12, r1: 8200,  r2: 33000, rc: 1500, re: 470  },
      { vcc: 15, r1: 12000, r2: 47000, rc: 2200, re: 680  },
      { vcc: 9,  r1: 3900,  r2: 15000, rc: 680,  re: 220  },
    ];
    let pick;
    do { pick = pool[Math.floor(Math.random() * pool.length)]; }
    while (pick.vcc === V.vcc && pick.r1 === V.r1);
    return { ...pick };
  }

  function setMode(mode) {
    quizMode = mode;
    V = mode === 'randomise' ? randomValues() : { ...EXAMPLE_SETS[mode] };
    ['example1','example2','example3','randomise'].forEach(m => {
      const el = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
      if (el) el.classList.toggle('active', m === mode);
    });
    updateCircuitLabels();
    resetQuiz();
  }

  // ── Option pools for each question (shuffled at runtime) ──
  const SCENARIO_OPTIONS = [
    // Q1: Cutoff — correct answer is r2_open
    [
      { key: 'r2_open', label: 'R2 has gone open circuit', sub: 'Base pulled up toward V<sub>CC</sub> — PNP turns OFF (cutoff)', correct: true },
      { key: 'r1_open', label: 'R1 has gone open circuit', sub: 'Base pulled down toward GND — PNP floods into saturation', correct: false },
      { key: 'rc_high', label: 'RC has increased in value', sub: 'DC bias point shifts — causes asymmetric clipping, not a dead signal', correct: false },
      { key: 're_high', label: 'RE has increased in value', sub: 'DC bias point shifts — waveform clips asymmetrically from the other side', correct: false },
    ],
    // Q2: Saturation — correct answer is r1_open
    [
      { key: 'r1_open', label: 'R1 has gone open circuit', sub: 'V<sub>B</sub> drops to near GND via R2 — massive I<sub>B</sub> drives PNP deep into saturation', correct: true },
      { key: 'r2_open', label: 'R2 has gone open circuit', sub: 'V<sub>B</sub> rises toward V<sub>CC</sub> — PNP cuts off, producing a flat 0 V line', correct: false },
      { key: 'rc_high', label: 'RC has increased in value', sub: 'Bias shifts — only the peak tips clip asymmetrically, not the entire positive half', correct: false },
      { key: 're_low', label: 'RE has decreased in value', sub: 'More current flows but the transistor remains in the active region — no saturation', correct: false },
    ],
    // Q3: Asymmetric clipping — correct answer is rc_high
    [
      { key: 'rc_high', label: 'RC has increased in value', sub: 'More drop across R<sub>C</sub> → V<sub>C</sub> rises toward V<sub>E</sub> rail — positive peaks run out of headroom and clip', correct: true },
      { key: 're_high', label: 'RE has increased in value', sub: 'Less I<sub>E</sub> → less drop across R<sub>C</sub> → V<sub>C</sub> falls toward GND — it is the NEGATIVE peaks that would clip first', correct: false },
      { key: 'r1_open', label: 'R1 has gone open circuit', sub: 'Saturation — the entire positive half would be flattened, not just the peak tips', correct: false },
      { key: 'r2_open', label: 'R2 has gone open circuit', sub: 'Cutoff — output would be completely flat at 0 V, not a clipped sine', correct: false },
    ],
  ];

  // ── State ──

  function buildWorkings() {
    const h   = calcHealthy(V);
    const sat = calcSaturation(V);
    const rch = calcRCHigh(V, h);
    const RC2disp = rch.RC2 >= 1000 ? parseFloat((rch.RC2/1000).toFixed(2)) + ' kΩ' : rch.RC2 + ' Ω';
    const ceiling   = (h.VE - 0.2).toFixed(2);
    const headroom  = (h.VE - 0.2 - rch.VC).toFixed(2);
    const healthyHR = (h.VE - 0.2 - h.VC).toFixed(2);
    const r1k = fmtRk(V.r1), r2k = fmtRk(V.r2);

    return [
      // Q1: R2 open → cutoff
      () => `
        <div class="working-section">Identifying the fault:</div>
        <div class="diagnosis-block">
          <div class="symptom-item">
            <div class="symptom-title">Symptom 1: Output scope trace is completely flat at 0&thinsp;V</div>
            <div class="symptom-body">The AC signal has disappeared entirely — the scope shows a flat 0&thinsp;V line. No AC variation at the collector means collector current has dropped to zero. The transistor has been switched fully off (cutoff).</div>
          </div>
          <div class="symptom-item">
            <div class="symptom-title">Symptom 2: Base voltage has risen to V<sub>CC</sub> (<span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-result">${V.vcc.toFixed(2)} V</span>)</div>
            <div class="symptom-body">With R<sub>2</sub> open, the GND-side pull-down of the voltage divider is lost. Only R<sub>1</sub> (${fmtRtxt(V.r1)}) remains, connecting the base directly to the ${V.vcc}&thinsp;V rail with no return path to GND. V<sub>B</sub> rises to V<sub>CC</sub>.</div>
          </div>
          <div class="symptom-item">
            <div class="symptom-title">Symptom 3: PNP forward-bias condition cannot be met — cutoff confirmed</div>
            <div class="symptom-body">For a PNP BJT to conduct, V<sub>E</sub> must be at least 0.6&thinsp;V above V<sub>B</sub> (V<sub>E</sub> = V<sub>B</sub> + 0.6). With V<sub>B</sub> = ${V.vcc}&thinsp;V, V<sub>E</sub> would need to reach ${(V.vcc + 0.6).toFixed(1)}&thinsp;V — impossible, since V<sub>CC</sub> = ${V.vcc}&thinsp;V is the supply ceiling. The E-B junction stays reverse-biased.</div>
          </div>
          <div class="symptom-item">
            <div class="symptom-title">Symptom 4: I<sub>E</sub> = 0 → V<sub>E</sub> = V<sub>CC</sub>, V<sub>C</sub> = 0 V — voltages confirm cutoff (<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">0.00 V</span>)</div>
            <div class="symptom-body">With the BJT in cutoff no current flows. There is no drop across R<sub>E</sub>, so V<sub>E</sub> rises to V<sub>CC</sub>. There is no drop across R<sub>C</sub>, so V<sub>C</sub> is pulled to 0&thinsp;V through R<sub>C</sub> to GND. These readings confirm the flat 0&thinsp;V scope trace.</div>
          </div>
        </div>
        <div class="working-section">Applying the formulas:</div>
        <div class="working-step">Base voltage (R<sub>2</sub> open — only R<sub>1</sub> remains, connecting base to V<sub>CC</sub>):</div>
        <div class="working-total"><span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> = <span class="colour-result">${V.vcc.toFixed(2)} V</span></div>
        <div class="working-step">PNP forward-bias check:</div>
        <div class="working-formula-row">V<sub>E</sub> required = <span class="colour-voltage">V<sub>B</sub></span> + 0.6 = ${V.vcc} + 0.6 = ${(V.vcc + 0.6).toFixed(1)}&thinsp;V — exceeds V<sub>CC</sub> ceiling → <strong>CUTOFF</strong></div>
        <div class="working-step">Emitter current (no forward bias, transistor off):</div>
        <div class="working-total"><span class="colour-current">I<sub>E</sub></span> = <span class="colour-result">0 mA</span></div>
        <div class="working-step">Emitter voltage (I<sub>E</sub> = 0 → no drop across R<sub>E</sub>):</div>
        <div class="working-formula-row"><span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-current">I<sub>E</sub></span> × <span class="colour-resistor">R<sub>E</sub></span> = ${V.vcc} − 0 × ${fmtRtxt(V.re)}</div>
        <div class="working-total"><span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-result">${V.vcc.toFixed(2)} V</span></div>
        <div class="working-step">Collector voltage (I<sub>C</sub> = 0 → no drop across R<sub>C</sub>):</div>
        <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-current">I<sub>C</sub></span> × <span class="colour-resistor">R<sub>C</sub></span> = 0 × ${fmtRtxt(V.rc)}</div>
        <div class="working-total"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">0.00 V</span></div>
        <div class="working-step">Emitter-to-collector voltage:</div>
        <div class="working-formula-row">V<sub>EC</sub> = <span class="colour-voltage">V<sub>E</sub></span> − <span class="colour-voltage">V<sub>C</sub></span> = ${V.vcc.toFixed(2)} − 0.00</div>
        <div class="working-total">V<sub>EC</sub> = <span class="colour-result">${V.vcc.toFixed(2)} V</span></div>`,

      // Q2: R1 open → saturation
      () => `
        <div class="working-section">Identifying the fault:</div>
        <div class="diagnosis-block">
          <div class="symptom-item">
            <div class="symptom-title">Symptom 1: Positive half of the output waveform is completely flat</div>
            <div class="symptom-body">PNP output is 180° inverted: the positive AC output peak corresponds to V<sub>C</sub> trying to <em>rise</em>. If V<sub>C</sub> is already pinned at the saturation ceiling, it cannot rise any further — the positive half flattens entirely. The negative half swings V<sub>C</sub> downward freely, so it is unaffected.</div>
          </div>
          <div class="symptom-item">
            <div class="symptom-title">Symptom 2: Base voltage has dropped to 0 V (<span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-result">0.00 V</span>)</div>
            <div class="symptom-body">With R<sub>1</sub> open, the V<sub>CC</sub>-side supply to the voltage divider is lost. Only R<sub>2</sub> (${fmtRtxt(V.r2)}) remains, pulling the base directly to GND. V<sub>B</sub> ≈ 0&thinsp;V.</div>
          </div>
          <div class="symptom-item">
            <div class="symptom-title">Symptom 3: Massive V<sub>EB</sub> forward bias — transistor driven into <strong>deep saturation</strong></div>
            <div class="symptom-body">With V<sub>B</sub> ≈ 0&thinsp;V, V<sub>EB</sub> = V<sub>E</sub> − V<sub>B</sub> ≈ V<sub>E</sub> — many volts of forward bias. The transistor is flooded with base current and driven hard into saturation. V<sub>EC</sub>(sat) ≈ 0.2&thinsp;V clamps the collector.</div>
          </div>
          <div class="symptom-item">
            <div class="symptom-title">Symptom 4: V<sub>C</sub> pinned at the saturation ceiling — voltages confirm saturation (<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">${sat.VC.toFixed(2)} V</span>, was ${h.VC.toFixed(2)} V)</div>
            <div class="symptom-body">In saturation V<sub>EC</sub>(sat) = 0.2&thinsp;V, so V<sub>C</sub> = V<sub>E</sub> − 0.2. The collector is pinned hard against the ceiling with zero headroom above it, confirming why the positive output half is entirely flat.</div>
          </div>
        </div>
        <div class="working-section">Applying the formulas:</div>
        <div class="working-step">Base voltage (R<sub>1</sub> open — only R<sub>2</sub> remains, pulling base to GND):</div>
        <div class="working-total"><span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-result">0.00 V</span></div>
        <div class="working-step">Saturation condition: V<sub>EC</sub>(sat) = 0.2 V → V<sub>E</sub> = V<sub>C</sub> + 0.2</div>
        <div class="working-step">Solving V<sub>C</sub> in saturation — setting I<sub>E</sub> ≈ I<sub>C</sub> (large β):</div>
        <div class="working-formula-row">${frac('<span class="colour-supply">V<sub>CC</sub></span> − V<sub>C</sub> − 0.2', '<span class="colour-resistor">R<sub>E</sub></span>')} = ${frac('V<sub>C</sub>', '<span class="colour-resistor">R<sub>C</sub></span>')}</div>
        <div class="working-label">Substituting values:</div>
        <div class="working-formula-row">${frac(V.vcc + ' − V<sub>C</sub> − 0.2', V.re)} = ${frac('V<sub>C</sub>', V.rc)}</div>
        <div class="working-total"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">${sat.VC.toFixed(2)} V</span> &nbsp;(healthy: ${h.VC.toFixed(2)} V)</div>
        <div class="working-step">Emitter voltage:</div>
        <div class="working-formula-row"><span class="colour-voltage">V<sub>E</sub></span> = V<sub>C</sub> + 0.2 = ${sat.VC.toFixed(2)} + 0.2</div>
        <div class="working-total"><span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-result">${sat.VE.toFixed(2)} V</span>, &nbsp;V<sub>EC</sub> = <span class="colour-result">0.20 V</span> ✓</div>
        <div class="working-step">Headroom analysis:</div>
        <div class="working-formula-row">Headroom above V<sub>C</sub> = (V<sub>E</sub> − 0.2) − V<sub>C</sub> = ${sat.VE.toFixed(2)} − 0.2 − ${sat.VC.toFixed(2)} = <span class="colour-result">0 V</span> — completely zero, positive output half entirely flat</div>`,

      // Q3: RC high → asymmetric top clip
      () => `
        <div class="working-section">Identifying the fault:</div>
        <div class="diagnosis-block">
          <div class="symptom-item">
            <div class="symptom-title">Symptom 1: Only the positive output peaks are clipped — the negative half is clean</div>
            <div class="symptom-body">Asymmetric clipping means the DC bias point has shifted toward one rail. PNP output is 180° inverted, so a clipped positive peak means V<sub>C</sub> is trying to rise but is hitting a ceiling. A component that raises V<sub>C</sub> without disturbing V<sub>B</sub> or V<sub>E</sub> is the likely fault — R<sub>C</sub> is the only candidate.</div>
          </div>
          <div class="symptom-item">
            <div class="symptom-title">Symptom 2: V<sub>B</sub>, V<sub>E</sub> and I<sub>E</sub> are all unchanged — bias chain intact</div>
            <div class="symptom-body">Voltage measurements confirm V<sub>B</sub> = ${h.VB.toFixed(2)}&thinsp;V and V<sub>E</sub> = ${h.VE.toFixed(2)}&thinsp;V — exactly as the healthy circuit calculates. R<sub>C</sub> does not appear in the divider or the V<sub>E</sub> = V<sub>B</sub> + 0.6 formula, so the entire bias chain is unaffected. This rules out any fault in R<sub>1</sub>, R<sub>2</sub> or R<sub>E</sub>.</div>
          </div>
          <div class="symptom-item">
            <div class="symptom-title">Symptom 3: V<sub>C</sub> has risen (<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">${rch.VC.toFixed(2)} V</span>, was ${h.VC.toFixed(2)} V)</div>
            <div class="symptom-body">The same I<sub>E</sub> now flows through a larger R<sub>C</sub> (≈ ${RC2disp}), producing a larger voltage drop. V<sub>C</sub> = I<sub>E</sub> × R<sub>C new</sub> has risen toward the saturation ceiling, confirming R<sub>C</sub> as the fault.</div>
          </div>
          <div class="symptom-item">
            <div class="symptom-title">Symptom 4: Headroom above V<sub>C</sub> is reduced — positive peaks clip (${headroom} V, was ${healthyHR} V)</div>
            <div class="symptom-body">The saturation ceiling is V<sub>E</sub> − 0.2 = ${ceiling}&thinsp;V. With V<sub>C</sub> now at ${rch.VC.toFixed(2)}&thinsp;V, there is only ${headroom}&thinsp;V of headroom before saturation — less than half the healthy ${healthyHR}&thinsp;V. Any AC swing above this clips the positive output peaks.</div>
          </div>
        </div>
        <div class="working-section">Applying the formulas:</div>
        <div class="working-step">Unchanged bias (R<sub>C</sub> does not appear in the divider formula):</div>
        <div class="working-formula-row"><span class="colour-voltage">V<sub>B</sub></span> = ${V.vcc} V × ${frac(r2k, r1k + ' + ' + r2k)} = <span class="colour-result">${h.VB.toFixed(2)} V</span> — unchanged</div>
        <div class="working-formula-row"><span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-voltage">V<sub>B</sub></span> + 0.6 V = <span class="colour-result">${h.VE.toFixed(2)} V</span> — unchanged</div>
        <div class="working-formula-row"><span class="colour-current">I<sub>E</sub></span> = ${frac(V.vcc + ' − ' + h.VE.toFixed(2) + ' V', fmtRtxt(V.re))} = <span class="colour-result">${(h.IE*1000).toFixed(2)} mA</span> — unchanged</div>
        <div class="working-step">Faulted collector voltage (R<sub>C</sub> ≈ ×1.5 = ${RC2disp}):</div>
        <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-current">I<sub>E</sub></span> × R<sub>C new</sub> = ${(h.IE*1000).toFixed(2)} mA × ${RC2disp} = <span class="colour-result">${rch.VC.toFixed(2)} V</span> ↑ &nbsp;(was ${h.VC.toFixed(2)} V)</div>

        <div class="working-formula-row">Saturation ceiling = V<sub>E</sub> − V<sub>EC</sub>(sat) = ${h.VE.toFixed(2)} − 0.2 = <span class="colour-result">${ceiling} V</span></div>

        <div class="working-section">PNP rule for R<sub>C</sub> drift:</div>
        <div class="working-line">R<sub>C</sub> <strong>increases</strong> → V<sub>C</sub> <strong>rises</strong> → headroom above shrinks → <strong>positive peaks clip first</strong></div>

    document.getElementById('voltVCVal').textContent = v.vc;
    document.getElementById('vecValue').textContent = v.vec;
    document.getElementById('voltageLabels').removeAttribute('display');
  }

  function hideVoltageIndicators() {
    document.getElementById('voltageLabels').setAttribute('display', 'none');
  }
