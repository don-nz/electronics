  <script>
    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════

    // Topology: PNP voltage-divider bias, single-stage.
    // VCC —R1— [Base node] —R2— GND; base node feeds Q1's base.
    // VCC —RE— Q1 emitter; Q1 collector —RC— GND.
    // Key PNP difference: VE = VB + VEB(on); IE = (VCC − VE) / RE; VC = IC × RC.
    const VBE = 0.6; // silicon PNP emitter-base drop (VEB = VE − VB = 0.6 V)

    const EXAMPLE_SETS = {
      example1: { vcc: 12, r1: 6800,  r2: 27000, rc: 1200, re: 390 },
      example2: { vcc: 15, r1: 8200,  r2: 33000, rc: 1800, re: 560 },
      example3: { vcc: 9,  r1: 4700,  r2: 18000, rc: 820,  re: 270 }
    };
    let quizMode = 'example1';
    let V = { ...EXAMPLE_SETS.example1 };

    // ══════════════════════════════════════════════════════════════════════
    // QUESTION TEXT
    // ══════════════════════════════════════════════════════════════════════
    const QUESTION_TEXT = [
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">base voltage</span> V<sub>B</sub> at the junction of R1 and R2?',
        hint: 'Treat R1 and R2 as a simple voltage divider from V<sub>CC</sub> to ground — the base draws very little current compared to the divider current.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">emitter voltage</span> V<sub>E</sub>?',
        hint: 'A forward-biased silicon emitter-base junction drops approximately 0.6 V (<span class="colour-bjt">V<sub>EB</sub> (on)</span>). For a PNP transistor, the emitter sits <em>above</em> the base in potential.'
      },
      {
        text: 'What is the <span style="color:var(--colour-current)">emitter current</span> I<sub>E</sub>?',
        hint: 'Apply Ohm\'s law to R<sub>E</sub>. For PNP, current flows <em>from</em> V<sub>CC</sub> <em>through</em> R<sub>E</sub> to the emitter — the voltage across R<sub>E</sub> is V<sub>CC</sub> − V<sub>E</sub>.'
      },
      {
        text: 'What is the <span style="color:var(--colour-current)">collector current</span> I<sub>C</sub>?',
        hint: 'Assume I<sub>C</sub> ≈ I<sub>E</sub> — base current is small compared to collector and emitter currents in a transistor with high β.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">collector voltage</span> V<sub>C</sub>?',
        hint: 'For PNP, R<sub>C</sub> connects the collector to GND. Current flows from the collector through R<sub>C</sub> to ground — so V<sub>C</sub> is the voltage dropped across R<sub>C</sub>, measured above GND.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">emitter-to-collector voltage</span> V<sub>EC</sub>?',
        hint: 'V<sub>EC</sub> = V<sub>E</sub> − V<sub>C</sub>. This is the PNP equivalent of V<sub>CE</sub> for NPN — it should be a positive value when the transistor is in the active region.'
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT SIMULATION
    // ══════════════════════════════════════════════════════════════════════

    // ── pools for Randomise mode (kept in realistic ranges for PNP bias) ──
    // For PNP: R1 (VCC→Base) is smaller than R2 (Base→GND) so VB sits in the
    // upper portion of the supply — opposite to the NPN convention.
    const R1_POOL = [1000, 1200, 1500, 1800, 2200, 2700, 3300, 3900, 4700, 5600, 6800, 8200];
    const R2_POOL = [4700, 6800, 8200, 10000, 12000, 15000, 18000, 22000, 27000, 33000, 39000, 47000];
    const RC_POOL = [220, 270, 330, 390, 470, 560, 680, 820, 1000, 1200, 1500, 1800, 2200];
    const RE_POOL = [100, 120, 150, 180, 220, 270, 330, 390, 470, 560, 680, 820, 1000];
    const VCC_POOL = [9, 12, 15, 18, 20];
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function randomValues() {
      for (let attempt = 0; attempt < 25; attempt++) {
        const vals = { vcc: pick(VCC_POOL), r1: pick(R1_POOL), r2: pick(R2_POOL), rc: pick(RC_POOL), re: pick(RE_POOL) };
        // RC===RE would make the "wrong resistor" distractor an exact
        // duplicate of the correct answer — both pools share several
        // overlapping values, so this is reachable.
        if (vals.rc === vals.re) continue;
        const vb = vals.vcc * vals.r2 / (vals.r1 + vals.r2);
        if (vb < vals.vcc * 0.55) continue;  // VB must be in upper half for PNP
        const ve = vb + VBE;
        if (ve >= vals.vcc - 0.3) continue;   // VE must be safely below VCC
        const ie = (vals.vcc - ve) / vals.re;
        const vc = ie * vals.rc;
        if (vc >= ve - 1.0) continue;          // VEC must be > 1 V (active region)
        if (vc < 0.3) continue;                // VC must be above GND
        return vals;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    function fmtO0(v) { return v >= 1000 ? parseFloat((v / 1000).toFixed(2)) + 'kΩ' : parseFloat(v.toFixed(2)) + 'Ω'; }
    function fmtO0Parts(v) { if (v >= 1000) return { num: String(parseFloat((v / 1000).toFixed(2))), unit: ' kΩ' }; return { num: String(parseFloat(v.toFixed(2))), unit: ' Ω' }; }
    function fmtA(a) { const x = Math.abs(a); if (x >= 1) return parseFloat(a.toFixed(3)) + ' A'; if (x >= 0.001) return parseFloat((a * 1000).toFixed(2)) + ' mA'; return parseFloat((a * 1e6).toFixed(1)) + ' µA'; }
    function fmtV(v) { const a = Math.abs(v); if (a >= 1) return parseFloat(v.toFixed(2)) + ' V'; if (a >= 0.001) return parseFloat((v * 1000).toFixed(2)) + ' mV'; return parseFloat((v * 1e6).toFixed(1)) + ' µV'; }

    // ── derived values (recomputed whenever the value set changes) ──
    let VB, VE, IE, IC, VRC, VC, VEC;
    function recompute() {
      VB  = V.vcc * V.r2 / (V.r1 + V.r2); // voltage divider — same formula as NPN
      VE  = VB + VBE;                       // PNP: emitter is 0.6 V above base
      IE  = (V.vcc - VE) / V.re;            // PNP: current flows VCC→RE→Emitter
      IC  = IE;                             // IC ≈ IE (β >> 1)
      VRC = IC * V.rc;                      // voltage drop across RC
      VC  = VRC;                            // PNP: RC connects Collector→GND, so VC = IC×RC
      VEC = VE - VC;                        // emitter-to-collector voltage
    }

    // ── mode switching ──
    function refreshLabels() {
      ['r1', 'r2', 'rc', 're'].forEach(r => {
        const p = fmtO0Parts(V[r]);
        document.getElementById('lbl-' + r).innerHTML =
          `<tspan fill="var(--colour-text)">${p.num}</tspan><tspan fill="var(--colour-resistor-labels)">${p.unit}</tspan>`;
      });
      document.getElementById('vccValue').innerHTML = `<tspan fill="var(--colour-text)">${V.vcc}</tspan><tspan fill="var(--colour-supply)"> V</tspan>`;
      document.getElementById('panelVoltLabel').textContent = V.vcc + ' V';
      const mt = document.getElementById('modalVoltLabel');
      if (mt) mt.textContent = `Circuit Diagram — ${V.vcc} V Supply`;
    }
    function setMode(mode) {
      quizMode = mode;
      V = (mode === 'randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
      recompute();
      refreshLabels();
      ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
        const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (b) b.classList.toggle('active', m === mode);
      });
      resetQuiz();
    }

    function buildQ1Options() {
      return shuffle([
        { label: `<span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> × ${frac('<span class="colour-resistor">R2</span>', '<span class="colour-resistor">R1</span> + <span class="colour-resistor">R2</span>')} = ${V.vcc} V × ${frac(`${fmtO0(V.r2)}`, `${fmtO0(V.r1)} + ${fmtO0(V.r2)}`)} ≈ ${fmtV(VB)}`, type: 'correct' },
        { label: `<span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> × ${frac('<span class="colour-resistor">R1</span>', '<span class="colour-resistor">R1</span> + <span class="colour-resistor">R2</span>')} = ${V.vcc} V × ${frac(`${fmtO0(V.r1)}`, `${fmtO0(V.r1)} + ${fmtO0(V.r2)}`)} ≈ ${fmtV(V.vcc * V.r1 / (V.r1 + V.r2))}`, type: 'wrong' }, // ratio swapped
        { label: `<span class="colour-voltage">V<sub>B</sub></span> = ${frac('<span class="colour-supply">V<sub>CC</sub></span>', '2')} = ${frac(`${V.vcc} V`, '2')} = ${fmtV(V.vcc / 2)}`, type: 'wrong' }, // assumed midpoint
        { label: `<span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> = ${fmtV(V.vcc)}`, type: 'wrong' }, // forgot divider
      ]);
    }
    function buildQ2Options() {
      return shuffle([
        { label: `<span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-voltage">V<sub>B</sub></span> + <span class="colour-bjt">V<sub>EB</sub></span> = ${fmtV(VB)} + 0.6 V = ${fmtV(VE)}`, type: 'correct' },
        { label: `<span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-voltage">V<sub>B</sub></span> − <span class="colour-bjt">V<sub>EB</sub></span> = ${fmtV(VB)} − 0.6 V ≈ ${fmtV(VB - VBE)}`, type: 'wrong' }, // sign error (NPN formula)
        { label: `<span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-voltage">V<sub>B</sub></span> = ${fmtV(VB)}`, type: 'wrong' }, // forgot VEB drop
        { label: `<span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-voltage">V<sub>B</sub></span> + 0.3 V = ${fmtV(VB)} + 0.3 V ≈ ${fmtV(VB + 0.3)}`, type: 'wrong' }, // wrong VEB (germanium-like 0.3 V)
      ]);
    }
    function buildQ3Options() {
      return shuffle([
        { label: `<span class="colour-current">I<sub>E</sub></span> = ${frac('<span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-voltage">V<sub>E</sub></span>', '<span class="colour-resistor">R<sub>E</sub></span>')} = ${frac(`${V.vcc} V − ${fmtV(VE)}`, fmtO0(V.re))} ≈ ${fmtA(IE)}`, type: 'correct' },
        { label: `<span class="colour-current">I<sub>E</sub></span> = ${frac('<span class="colour-voltage">V<sub>E</sub></span>', '<span class="colour-resistor">R<sub>E</sub></span>')} = ${frac(fmtV(VE), fmtO0(V.re))} ≈ ${fmtA(VE / V.re)}`, type: 'wrong' }, // NPN formula (wrong for PNP)
        { label: `<span class="colour-current">I<sub>E</sub></span> = ${frac('<span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-voltage">V<sub>E</sub></span>', '<span class="colour-resistor">R<sub>C</sub></span>')} = ${frac(`${V.vcc} V − ${fmtV(VE)}`, fmtO0(V.rc))} ≈ ${fmtA((V.vcc - VE) / V.rc)}`, type: 'wrong' }, // wrong resistor
        { label: `<span class="colour-current">I<sub>E</sub></span> = ${frac('<span class="colour-voltage">V<sub>B</sub></span>', '<span class="colour-resistor">R<sub>E</sub></span>')} = ${frac(fmtV(VB), fmtO0(V.re))} ≈ ${fmtA(VB / V.re)}`, type: 'wrong' }, // wrong voltage node
      ]);
    }
    function buildQ4Options() {
      return shuffle([
        { label: `<span class="colour-current">I<sub>C</sub></span> ≈ <span class="colour-current">I<sub>E</sub></span> = ${fmtA(IC)}`, type: 'correct' },
        { label: `<span class="colour-current">I<sub>C</sub></span> = <span class="colour-current">I<sub>E</sub></span> × 0.5 = ${fmtA(IC)} × 0.5 ≈ ${fmtA(IC * 0.5)}`, type: 'wrong' }, // arbitrary halving
        { label: `<span class="colour-current">I<sub>C</sub></span> = ${frac('<span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-voltage">V<sub>B</sub></span>', '<span class="colour-resistor">R<sub>C</sub></span> + <span class="colour-resistor">R<sub>E</sub></span>')} = ${frac(`${V.vcc} V − ${fmtV(VB)}`, `${fmtO0(V.rc)} + ${fmtO0(V.re)}`)} ≈ ${fmtA((V.vcc - VB) / (V.rc + V.re))}`, type: 'wrong' }, // wrong formula
        { label: `<span class="colour-current">I<sub>C</sub></span> = ${frac('<span class="colour-voltage">V<sub>B</sub></span>', '<span class="colour-resistor">R<sub>C</sub></span>')} = ${frac(fmtV(VB), fmtO0(V.rc))} ≈ ${fmtA(VB / V.rc)}`, type: 'wrong' }, // confused VB with VC
      ]);
    }
    function buildQ5Options() {
      // note: "VCC - IC*RC" is NOT used here since IC*RC ≡ VC by definition in this circuit,
      // which would make it an exact duplicate of a "VCC - VC" style distractor for every
      // possible circuit — replaced with a distinct mistake (added VCC instead of it being absent)
      return shuffle([
        { label: `<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-current">I<sub>C</sub></span>×<span class="colour-resistor">R<sub>C</sub></span> = ${fmtA(IC)}×${fmtO0(V.rc)} ≈ ${fmtV(VC)}`, type: 'correct' },
        { label: `<span class="colour-voltage">V<sub>C</sub></span> = (<span class="colour-current">I<sub>C</sub></span>×<span class="colour-resistor">R<sub>C</sub></span>) + <span class="colour-supply">V<sub>CC</sub></span> = (${fmtA(IC)}×${fmtO0(V.rc)}) + ${V.vcc} V ≈ ${fmtV(IC * V.rc + V.vcc)}`, type: 'wrong' }, // added VCC (it plays no part in VC here)
        { label: `<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-current">I<sub>C</sub></span>×<span class="colour-resistor">R<sub>E</sub></span> = ${fmtA(IC)}×${fmtO0(V.re)} ≈ ${fmtV(IC * V.re)}`, type: 'wrong' }, // wrong resistor
        { label: `<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-voltage">V<sub>C</sub></span> = ${V.vcc} V − ${fmtV(VC)} ≈ ${fmtV(V.vcc - VC)}`, type: 'wrong' }, // arithmetic complement
      ]);
    }
    function buildQ6Options() {
      return shuffle([
        { label: `<span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-voltage">V<sub>E</sub></span> − <span class="colour-voltage">V<sub>C</sub></span> = ${fmtV(VE)} − ${fmtV(VC)} = ${fmtV(VEC)}`, type: 'correct' },
        { label: `<span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-voltage">V<sub>C</sub></span> − <span class="colour-voltage">V<sub>E</sub></span> = ${fmtV(VC)} − ${fmtV(VE)} ≈ ${fmtV(VC - VE)}`, type: 'wrong' }, // inverted (VCE — NPN convention)
        { label: `<span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-voltage">V<sub>E</sub></span> − <span class="colour-voltage">V<sub>B</sub></span> = ${fmtV(VE)} − ${fmtV(VB)} ≈ ${fmtV(VE - VB)}`, type: 'wrong' }, // confused with VEB
        { label: `<span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-voltage">V<sub>E</sub></span> = ${V.vcc} V − ${fmtV(VE)} ≈ ${fmtV(V.vcc - VE)}`, type: 'wrong' }, // treated the collector as if it were at 0 V
      ]);
    }

    // ── SVG indicator helpers ──
    function fmtVParts(v) {
      const a = Math.abs(v);
      if (a >= 1) return { val: String(parseFloat(v.toFixed(2))), unit: 'V' };
      if (a >= 0.001) return { val: String(parseFloat((v * 1000).toFixed(2))), unit: 'mV' };
      return { val: String(parseFloat((v * 1e6).toFixed(1))), unit: 'µV' };
    }
    function setMeter(id, v) {
      const p = fmtVParts(v);
      document.getElementById(id + 'Value').textContent = p.val;
      document.getElementById(id + 'Unit').textContent = p.unit;
      document.getElementById(id).setAttribute('display', 'inline');
    }
    function fmtAParts(a) {
      const x = Math.abs(a);
      if (x >= 1) return { val: String(parseFloat(a.toFixed(3))), unit: 'A' };
      if (x >= 0.001) return { val: String(parseFloat((a * 1000).toFixed(2))), unit: 'mA' };
      return { val: String(parseFloat((a * 1e6).toFixed(1))), unit: 'µA' };
    }
    function showVB() { setMeter('meterVB', VB); }
    function hideVB() { document.getElementById('meterVB').setAttribute('display', 'none'); }
    function showVE() { setMeter('meterVE', VE); }
    function hideVE() { document.getElementById('meterVE').setAttribute('display', 'none'); }
    function showIE() {
      const p = fmtAParts(IE);

      document.getElementById('ieUnit').textContent = p.unit;

    function showVC() { setMeter('meterVC', VC); }

    function showVEC() {
      const p = fmtVParts(VEC);

      document.getElementById('vecInd').setAttribute('display', 'inline');
    }
    function hideVEC() { document.getElementById('vecInd').setAttribute('display', 'none'); }

    // ── Circuit state table — one entry per question, cumulative reveal ──
    const CIRCUIT_STATES = [
      { enter:  { vb:false, ve:false, ie:false, ic:false, vc:false, vec:false },
        reveal: { vb:true,  ve:false, ie:false, ic:false, vc:false, vec:false } }, // Q1 → VB
      { enter:  { vb:true,  ve:false, ie:false, ic:false, vc:false, vec:false },
        reveal: { vb:true,  ve:true,  ie:false, ic:false, vc:false, vec:false } }, // Q2 → VE
      { enter:  { vb:true,  ve:true,  ie:false, ic:false, vc:false, vec:false },
        reveal: { vb:true,  ve:true,  ie:true,  ic:false, vc:false, vec:false } }, // Q3 → IE
      { enter:  { vb:true,  ve:true,  ie:true,  ic:false, vc:false, vec:false },
        reveal: { vb:true,  ve:true,  ie:true,  ic:true,  vc:false, vec:false } }, // Q4 → IC
      { enter:  { vb:true,  ve:true,  ie:true,  ic:true,  vc:false, vec:false },
        reveal: { vb:true,  ve:true,  ie:true,  ic:true,  vc:true,  vec:false } }, // Q5 → VC
      { enter:  { vb:true,  ve:true,  ie:true,  ic:true,  vc:true,  vec:false },
        reveal: { vb:true,  ve:true,  ie:true,  ic:true,  vc:true,  vec:true  } }, // Q6 → VEC

    function applyCircuitState(s) {
      s.vb  ? showVB()  : hideVB();
      s.ve  ? showVE()  : hideVE();
      s.ie  ? showIE()  : hideIE();
      s.ic  ? showIC()  : hideIC();

    const QUESTION_BUILDERS = [
      buildQ1Options, buildQ2Options, buildQ3Options,

    // ── per-question check + worked solution ──

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic
    // ══════════════════════════════════════════════════════════════════════

      return `I<sub>C</sub> = ${fmtA(IC)}`;
    },
        working: () => {
      
      
      return `
    <div class="working-line">Base current is small compared to collector and emitter current (β is large), so we assume <span class="colour-bjt">I<sub>C</sub> ≈ I<sub>E</sub></span>:</div>
    <div class="working-step">Collector current:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>C</sub></span> ≈ <span class="colour-current">I<sub>E</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>C</sub></span> ≈ ${fmtA(IE)}</div>
    <div class="working-total"><span class="colour-current">I<sub>C</sub></span> = <span class="colour-result">${fmtA(IC)}</span></div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[4].text === 'function' ? QUESTION_TEXT[4].text() : QUESTION_TEXT[4].text),
        hint: () => QUESTION_TEXT[4].hint,
        options: QUESTION_BUILDERS[4],
        correctExplain: () => {
      
      return `V<sub>C</sub> = ${fmtV(VC)}`;
    },
        working: () => {
      
      
      return `
    <div class="working-line">For a PNP transistor, <span class="colour-resistor">R<sub>C</sub></span> connects the collector directly to GND. Current flows <b>from</b> the collector <b>through</b> <span class="colour-resistor">R<sub>C</sub></span> to ground, so the collector voltage above GND equals the voltage dropped across <span class="colour-resistor">R<sub>C</sub></span>:</div>
    <div class="working-step">Voltage across RC (= VC above GND):</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-current">I<sub>C</sub></span> × <span class="colour-resistor">R<sub>C</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = ${fmtA(IC)} × ${fmtO0(V.rc)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">${fmtV(VC)}</span></div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[5].text === 'function' ? QUESTION_TEXT[5].text() : QUESTION_TEXT[5].text),
        hint: () => QUESTION_TEXT[5].hint,
        options: QUESTION_BUILDERS[5],
        correctExplain: () => {
      
      return `V<sub>EC</sub> = ${fmtV(VEC)}`;
    },
        working: () => {
      
      
      return `
    <div class="working-line">V<sub>EC</sub> is the emitter-to-collector voltage — the PNP equivalent of V<sub>CE</sub> for NPN. A positive V<sub>EC</sub> (emitter above collector) confirms the transistor is operating in the active region and is not saturated (<span class="colour-bjt">V<sub>EC</sub>(sat) ≈ 0.2 V</span>):</div>
    <div class="working-step">Emitter-to-collector voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-voltage">V<sub>E</sub></span> − <span class="colour-voltage">V<sub>C</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>EC</sub></span> = ${fmtV(VE)} − ${fmtV(VC)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-result">${fmtV(VEC)}</span></div>
    <div class="working-line">${VEC > 1 ? `V<sub>EC</sub> > 1 V — transistor is in the <b>active region</b> <span class="colour-result">✓</span>` : `V<sub>EC</sub> is low — check the bias network.`}</div>`;
    },
      },
    ];

    // Meters reveal progressively: the question's `enter` state until it is
    // answered, then its `reveal` state.
    RENDER_EXTRA = function () {
      applyCircuitState(Q[cur].ans ? CIRCUIT_STATES[cur].reveal : CIRCUIT_STATES[cur].enter);
    };

    // Summary page: everything revealed, component values on top.
    SUMMARY_CIRCUIT_REF = { id: null, label: 'Circuit Diagram', viewBox: null };
    SUMMARY_EXTRA = function () {
      applyCircuitState(CIRCUIT_STATES[CIRCUIT_STATES.length - 1].reveal);
      document.getElementById('summaryContent').insertAdjacentHTML('afterbegin', `<div class="summary-values">
    <span style="color:var(--colour-supply);font-weight:bold">V<sub>CC</sub></span> = <span style="color:var(--colour-supply)">${V.vcc} V</span>&nbsp;&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>1</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.r1)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>2</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.r2)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>C</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rc)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>E</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.re)}</span>
  </div>`);
    };

    initQuizNav();
    setMode('example1');      // builds the value set, then resetQuiz()
    {
      const p = new URLSearchParams(location.search);
      const rKeys = ['vcc', 'r1', 'r2', 'rc', 're'];
      if (rKeys.every(k => p.has(k))) {
        const vals = {}; rKeys.forEach(k => vals[k] = +p.get(k));
        quizMode = 'custom'; V = vals; recompute(); refreshLabels();
        ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
          const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
          if (b) b.classList.toggle('active', false);
        });
        resetQuiz();
      }
    }
    initQuizFromURL();
  </script>
</body>
