  <script>
    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════

    // Topology: fixed/base bias, single-stage PNP, with a POSITIVE supply
    // rail (+VCC) — the physical mirror-image of bjt_pnp_base_bias_neg.html's approach.
    // The emitter ties directly to +VCC (the "high" reference), while both
    // the base (via RB) and the collector (via RC) are pulled down toward
    // GND. This is the same physical layout as bjt_npn_base_bias.html's NPN
    // base-bias circuit, just complemented (PNP, current direction and
    // junction drop both reversed) — see bjt_pnp_base_bias_neg.html for the OTHER
    // valid PNP mirroring convention (same physical layout as NPN, but with
    // a negative supply rail instead of a positive one).
    const VBE = 0.6; // silicon PNP emitter-base drop (VEB = VE − VB = 0.6 V), assumed constant

    const EXAMPLE_SETS = {
      example1: { vcc: 12, rb: 1000000, rc: 820, beta: 200 }, // rc deliberately not 1000 — RB/RC=1000 would make the Q2 "used RC" distractor show the same digits as the correct answer (just a different unit)
      example2: { vcc: 15, rb: 680000, rc: 2200, beta: 150 },
      example3: { vcc: 9, rb: 1500000, rc: 470, beta: 250 }
    };
    let quizMode = 'example1';
    let V = { ...EXAMPLE_SETS.example1 };

    // ══════════════════════════════════════════════════════════════════════
    // QUESTION TEXT
    // ══════════════════════════════════════════════════════════════════════
    const QUESTION_TEXT = [
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">base voltage</span> V<sub>B</sub> at the base of Q1?',
        hint: 'The emitter is tied directly to the +V<sub>CC</sub> rail — there\'s no emitter resistor in this circuit — so V<sub>E</sub> = V<sub>CC</sub>. For PNP, <span class="colour-bjt">V<sub>EB</sub>(on)</span> ≈ 0.6 V means the emitter sits above the base.'
      },
      {
        text: 'What is the <span style="color:var(--colour-current)">base current</span> I<sub>B</sub> flowing through R<sub>B</sub>?',
        hint: 'R<sub>B</sub> connects the base to GND, not to the supply rail. Apply Ohm\'s law using the base voltage found in Q1.'
      },
      {
        text: '', // dynamic — set by updateQ3Question(), since it embeds the current β value
        hint: 'In a fixed/base-bias circuit, I<sub>C</sub> is set directly by the transistor\'s current gain — there\'s no emitter resistor to compensate for β varying between transistors.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">collector voltage</span> V<sub>C</sub>?',
        hint: 'R<sub>C</sub> connects the collector to GND, not to the supply rail. Apply Ohm\'s law to find the voltage dropped across R<sub>C</sub> — that drop IS V<sub>C</sub>, measured above ground.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">emitter-collector voltage</span> V<sub>EC</sub>?',
        hint: 'V<sub>EC</sub> is the difference between the emitter and collector voltages — both measured with respect to ground.'
      }
    ];

    // ══════════════════════════════════════════════════════════════════════
    // END CIRCUIT CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT SIMULATION
    // ══════════════════════════════════════════════════════════════════════

    // ── curated resistor/supply pools for Randomise mode ──
    // RB sits far higher than a voltage-divider bias network's resistors —
    // it alone sets IB via VB/RB, so it needs to be large (hundreds of kΩ to
    // a few MΩ) to keep IB down in the realistic tens-of-µA range.
    const RB_POOL = [470000, 560000, 680000, 820000, 1000000, 1200000, 1500000, 1800000, 2200000];
    const RC_POOL = [220, 270, 330, 390, 470, 560, 680, 820, 1000, 1200, 1500, 1800, 2200];
    const VCC_POOL = [9, 12, 15, 18, 20];
    const BETA_POOL = [100, 120, 150, 180, 200, 220, 250, 280, 300];
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    // Retries until the combination keeps Q1 comfortably in the active region
    // — fixed bias has no feedback to correct a bad RB/β combination, so a
    // plain random pick can easily land VC near 0 (deep saturation-adjacent)
    // or near VCC (VEC too small, near cutoff), neither of which makes for a
    // sensible example.
    function randomValues() {
      for (let attempt = 0; attempt < 25; attempt++) {
        const vals = { vcc: pick(VCC_POOL), rb: pick(RB_POOL), rc: pick(RC_POOL), beta: pick(BETA_POOL) };
        // RB===RC*1000 would make the "used RC instead of RB" distractor in
        // Q2 display the exact same digits as the correct answer, just one
        // unit prefix over (e.g. "11.4 µA" vs "11.4 mA") — RB_POOL is these
        // same E12-style mantissas scaled by 1000, so this is reachable.
        if (vals.rb === vals.rc * 1000) continue;
        const vb = vals.vcc - VBE;
        const ib = vb / vals.rb;
        const ic = vals.beta * ib;
        const vc = ic * vals.rc;
        if (vc < vals.vcc * 0.1 || vc > vals.vcc * 0.85) continue;
        return vals;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    function fmtO0(v) {
      if (v >= 1e6) return parseFloat((v / 1e6).toFixed(2)) + 'MΩ';
      if (v >= 1000) return parseFloat((v / 1000).toFixed(2)) + 'kΩ';
      return parseFloat(v.toFixed(2)) + 'Ω';
    }
    function fmtO0Parts(v) {
      if (v >= 1e6) return { num: String(parseFloat((v / 1e6).toFixed(2))), unit: ' MΩ' };
      if (v >= 1000) return { num: String(parseFloat((v / 1000).toFixed(2))), unit: ' kΩ' };
      return { num: String(parseFloat(v.toFixed(2))), unit: ' Ω' };
    }
    function fmtA(a) { if (a === 0) return '0 A'; const x = Math.abs(a); if (x >= 1) return parseFloat(a.toFixed(3)) + ' A'; if (x >= 0.001) return parseFloat((a * 1000).toFixed(2)) + ' mA'; return parseFloat((a * 1e6).toFixed(1)) + ' µA'; }
    // Junction drops like VBE (0.6 V) are always written in volts, never
    // millivolts, by convention — so the V/mV cutoff sits at 0.1 V rather
    // than 1 V, matching how the datasheet itself writes "0.6 V typ".
    function fmtV(v) { if (v === 0) return '0 V'; const a = Math.abs(v); if (a >= 0.1) return parseFloat(v.toFixed(2)) + ' V'; if (a >= 0.001) return parseFloat((v * 1000).toFixed(2)) + ' mV'; return parseFloat((v * 1e6).toFixed(1)) + ' µV'; }
    function fmtVParts(v) { const a = Math.abs(v); if (a >= 0.1) return { val: String(parseFloat(v.toFixed(2))), unit: 'V' }; if (a >= 0.001) return { val: String(parseFloat((v * 1000).toFixed(2))), unit: 'mV' }; return { val: String(parseFloat((v * 1e6).toFixed(1))), unit: 'µV' }; }

    // ── derived (recomputed whenever the value set changes) ──
    // NOTE: VEC (not VCE) — for PNP the conventional quantity is emitter-to-
    // collector voltage, which comes out positive in the active region here.
    let VB, IB, IC, VRC, VC, VEC;
    function recompute() {
      VB = V.vcc - VBE;   // VE = VCC (no emitter resistor); PNP needs VE > VB, so VB = VE − VEB(on)
      IB = VB / V.rb;     // RB spans Base(VB) to GND(0V): voltage across it is simply VB
      IC = V.beta * IB;   // set directly by current gain — no RE to compensate for β
      VRC = IC * V.rc;
      VC = VRC;           // RC spans Collector to GND(0V), so VC IS the RC drop itself
      VEC = V.vcc - VC;   // VEC = VE - VC = VCC - VC
    }

    // ── mode switching ──
    function refreshLabels() {
      ['rb', 'rc'].forEach(r => {
        const p = fmtO0Parts(V[r]);
        document.getElementById('lbl-' + r).innerHTML =
          `<tspan fill="var(--colour-text)">${p.num}</tspan><tspan fill="var(--colour-resistor-labels)">${p.unit}</tspan>`;
      });
      document.getElementById('vccValue').innerHTML = `<tspan fill="var(--colour-text)">${V.vcc}</tspan><tspan fill="var(--colour-supply)"> V</tspan>`;
      document.getElementById('meterVEValue').textContent = V.vcc; // VE = VCC exactly, always
      document.getElementById('panelVoltLabel').textContent = V.vcc + ' V';
      const mt = document.getElementById('modalVoltLabel');
      if (mt) mt.textContent = `Circuit Diagram — ${V.vcc} V Supply`;
    }
    function setMode(mode) {
      quizMode = mode;
      V = (mode === 'randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
      recompute();
      refreshLabels();
      ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
        const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (b) b.classList.toggle('active', m === mode);
      });
      resetQuiz();
    }

    function buildQ1Options() {
      // correct: VCC - VEB (since VE = VCC and PNP needs VE > VB)
      // distractors: sign error (added VEB instead of subtracting), forgot VEB entirely, confused with the drop itself
      return shuffle([
        { label: `<span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-bjt">V<sub>EB</sub></span> = ${V.vcc} V − 0.6 V = ${fmtV(VB)}`, type: 'correct' },
        { label: `<span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> + <span class="colour-bjt">V<sub>EB</sub></span> = ${V.vcc} V + 0.6 V ≈ ${fmtV(V.vcc + VBE)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> = ${fmtV(V.vcc)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-bjt">V<sub>EB</sub></span> = ${fmtV(VBE)}`, type: 'wrong' },
      ]);
    }
    function buildQ2Options() {
      // correct: VB / RB  — RB spans Base to GND (0 V)
      // distractors: used VCC directly (forgot to subtract VBE first), sign error on VBE, used RC instead of RB
      return shuffle([
        { label: `<span class="colour-current">I<sub>B</sub></span> = ${frac('<span class="colour-voltage">V<sub>B</sub></span>', '<span class="colour-resistor">R<sub>B</sub></span>')} = ${frac(fmtV(VB), fmtO0(V.rb))} ≈ ${fmtA(IB)}`, type: 'correct' },
        { label: `<span class="colour-current">I<sub>B</sub></span> = ${frac('<span class="colour-supply">V<sub>CC</sub></span>', '<span class="colour-resistor">R<sub>B</sub></span>')} = ${frac(`${V.vcc} V`, fmtO0(V.rb))} ≈ ${fmtA(V.vcc / V.rb)}`, type: 'wrong' },
        { label: `<span class="colour-current">I<sub>B</sub></span> = ${frac('<span class="colour-supply">V<sub>CC</sub></span> + <span class="colour-bjt">V<sub>EB</sub></span>', '<span class="colour-resistor">R<sub>B</sub></span>')} = ${frac(`${V.vcc} V + 0.6 V`, fmtO0(V.rb))} ≈ ${fmtA((V.vcc + VBE) / V.rb)}`, type: 'wrong' },
        { label: `<span class="colour-current">I<sub>B</sub></span> = ${frac('<span class="colour-voltage">V<sub>B</sub></span>', '<span class="colour-resistor">R<sub>C</sub></span>')} = ${frac(fmtV(VB), fmtO0(V.rc))} ≈ ${fmtA(VB / V.rc)}`, type: 'wrong' },
      ]);
    }
    function buildQ3Options() {
      // correct: beta * IB
      // distractors: inverted (IB/beta), forgot to multiply by beta at all, added instead of multiplying
      return shuffle([
        { label: `<span class="colour-current">I<sub>C</sub></span> = <span class="colour-bjt">β</span> × <span class="colour-current">I<sub>B</sub></span> = ${V.beta} × ${fmtA(IB)} ≈ ${fmtA(IC)}`, type: 'correct' },
        { label: `<span class="colour-current">I<sub>C</sub></span> = ${frac('<span class="colour-current">I<sub>B</sub></span>', '<span class="colour-bjt">β</span>')} = ${frac(fmtA(IB), V.beta)} ≈ ${fmtA(IB / V.beta)}`, type: 'wrong' },
        { label: `<span class="colour-current">I<sub>C</sub></span> = <span class="colour-current">I<sub>B</sub></span> = ${fmtA(IB)}`, type: 'wrong' },
        { label: `<span class="colour-current">I<sub>C</sub></span> = <span class="colour-current">I<sub>B</sub></span> + <span class="colour-bjt">β</span> = ${fmtA(IB)} + ${V.beta} ≈ ${fmtA(IB + V.beta)}`, type: 'wrong' },
      ]);
    }
    function buildQ4Options() {
      // correct: IC*RC  — RC spans Collector to GND, so this IS VC directly
      // distractors: negative-supply-style formula (subtracted from VCC), used RB instead of RC, added VCC unnecessarily
      return shuffle([
        { label: `<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-current">I<sub>C</sub></span>×<span class="colour-resistor">R<sub>C</sub></span> = ${fmtA(IC)}×${fmtO0(V.rc)} ≈ ${fmtV(VC)}`, type: 'correct' },
        { label: `<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> − (<span class="colour-current">I<sub>C</sub></span>×<span class="colour-resistor">R<sub>C</sub></span>) = ${V.vcc} V − (${fmtA(IC)}×${fmtO0(V.rc)}) ≈ ${fmtV(V.vcc - IC * V.rc)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-current">I<sub>C</sub></span>×<span class="colour-resistor">R<sub>B</sub></span> = ${fmtA(IC)}×${fmtO0(V.rb)} ≈ ${fmtV(IC * V.rb)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> + (<span class="colour-current">I<sub>C</sub></span>×<span class="colour-resistor">R<sub>C</sub></span>) = ${V.vcc} V + (${fmtA(IC)}×${fmtO0(V.rc)}) ≈ ${fmtV(V.vcc + IC * V.rc)}`, type: 'wrong' },
      ]);
    }
    function buildQ5Options() {
      // correct: VE - VC = VCC - VC
      // distractors: forgot to subtract from VCC (showed the RC drop itself), forgot the RC drop entirely, wrong junction (VC+VBE)
      return shuffle([
        { label: `<span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-voltage">V<sub>C</sub></span> = ${V.vcc} V − ${fmtV(VC)} ≈ ${fmtV(VEC)}`, type: 'correct' },
        { label: `<span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-voltage">V<sub>C</sub></span> = ${fmtV(VC)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> = ${fmtV(V.vcc)}`, type: 'wrong' },
        { label: `<span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-voltage">V<sub>C</sub></span> + <span class="colour-bjt">V<sub>BE</sub></span> = ${fmtV(VC)} + 0.6 V ≈ ${fmtV(VC + VBE)}`, type: 'wrong' },
      ]);
    }

    // ── circuit-specific SVG annotation show/hide ──
    // (overrides the fmtVParts above — same 0.1 V cutoff, kept in sync)
    function fmtVParts(v) {
      const a = Math.abs(v);
      if (a >= 0.1) return { val: v.toFixed(2), unit: 'V' };
      if (a >= 0.001) return { val: (v * 1000).toFixed(2), unit: 'mV' };
      return { val: (v * 1e6).toFixed(1), unit: 'µV' };
    }
    function setMeter(id, v) {
      const p = fmtVParts(v);
      document.getElementById(id + 'Value').textContent = p.val;
      document.getElementById(id + 'Unit').textContent = p.unit;
      document.getElementById(id).setAttribute('display', 'inline');
    }
    function showVB() { setMeter('meterVB', VB); }
    function hideVB() { document.getElementById('meterVB').setAttribute('display', 'none'); }
    function fmtAParts(a) {
      const x = Math.abs(a);
      if (x >= 1) return { val: a.toFixed(3), unit: 'A' };
      if (x >= 0.001) return { val: (a * 1000).toFixed(2), unit: 'mA' };

    // ── Circuit state table — one row per question, cumulative reveal ──
    const CIRCUIT_STATES = [
      {

    const QUESTION_BUILDERS = [

    <div class="working-line"><span class="colour-resistor">R<sub>C</sub></span> connects the collector directly to GND (0 V) — the voltage dropped across <span class="colour-resistor">R<sub>C</sub></span> IS <span class="colour-voltage">V<sub>C</sub></span>, measured above ground:</div>

    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-current">I<sub>C</sub></span> × <span class="colour-resistor">R<sub>C</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = ${fmtA(IC)} × ${fmtO0(V.rc)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">${fmtV(VC)}</span></div>
    <div class="working-line" style="margin-top:.6rem">This differs from the negative-supply version, where R<sub>C</sub> bridges the collector to −V<sub>CC</sub>, so its formula adds the R<sub>C</sub> drop to the (negative) rail voltage. Here R<sub>C</sub>'s far end is at GND, so V<sub>C</sub> is simply the R<sub>C</sub> drop itself — always positive.</div>`;
    },
      },
      {
        leftPanel: 'circuit',
        text: () => (typeof QUESTION_TEXT[4].text === 'function' ? QUESTION_TEXT[4].text() : QUESTION_TEXT[4].text),
        hint: () => QUESTION_TEXT[4].hint,
        options: QUESTION_BUILDERS[4],
        correctExplain: () => {
      
      return `V<sub>EC</sub> = ${fmtV(VEC)}`;
    },
        working: () => {
      
      
      
      return `
    <div class="working-line"><span class="colour-voltage">V<sub>EC</sub></span> is the difference between the emitter and collector voltages, both measured with respect to ground:</div>

    <div class="working-step">Emitter-collector voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-voltage">V<sub>E</sub></span> − <span class="colour-voltage">V<sub>C</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>EC</sub></span> = ${V.vcc} V − ${fmtV(VC)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-result">${fmtV(VEC)}</span></div>
    <div class="working-line" style="margin-top:.6rem">V<sub>C</sub> sits between 0 V and +V<sub>CC</sub> here — the collector never goes negative in this version — and V<sub>EC</sub> comes out positive, as it must be for the transistor to be in the active region.</div>`;
    },
      },
    ];

    // Meters reveal progressively: the question's `enter` state until it is
    // answered, then its `reveal` state.
    RENDER_EXTRA = function () {
      applyCircuitState(Q[cur].ans ? CIRCUIT_STATES[cur].reveal : CIRCUIT_STATES[cur].enter);
    };

    // Summary page: everything revealed, component values on top.
    SUMMARY_CIRCUIT_REF = { id: null, label: 'Circuit Diagram', viewBox: null };
    SUMMARY_EXTRA = function () {
      applyCircuitState(CIRCUIT_STATES[CIRCUIT_STATES.length - 1].reveal);
      document.getElementById('summaryContent').insertAdjacentHTML('afterbegin', `<div class="summary-values">
    <span style="color:var(--colour-supply);font-weight:bold">V<sub>CC</sub></span> = <span style="color:var(--colour-supply)">${V.vcc} V</span>&nbsp;&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>B</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rb)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>C</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rc)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-bjt);font-weight:bold">β</span> = <span style="color:var(--colour-bjt)">${V.beta}</span>
  </div>`);
    };

    initQuizNav();
    setMode('example1');      // builds the value set, then resetQuiz()
    {
      const p = new URLSearchParams(location.search);
      const rKeys = ['vcc', 'rb', 'rc', 'beta'];
      if (rKeys.every(k => p.has(k))) {
        const vals = {}; rKeys.forEach(k => vals[k] = +p.get(k));
        quizMode = 'custom'; V = vals; recompute(); refreshLabels();
        ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
          const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
          if (b) b.classList.toggle('active', false);
        });
        resetQuiz();
      }
    }
    initQuizFromURL();
  </script>
