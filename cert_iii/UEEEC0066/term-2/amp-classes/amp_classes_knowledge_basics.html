<!--
  Source material: the teacher's own "Classes of amplifier operation"
  objectives page (Purpose + 13 bullet objectives), a printed Review
  Questions sheet (20 questions), an answer sheet for Section 6, and two
  circuit figures (Figure 1: complementary push-pull class B; Figure 2:
  complementary class AB with a diode bias string). Same policy as this
  project's other review-sheet-backed quizzes: the review questions are
  REFERENCE ONLY for topic coverage, never copied — every question below,
  including its wording and numbers, is original.

  Circuits are redrawn fresh (not traced from the photographed figures) and
  follow the diff_amp_knowledge_basics.html diagram standard: all reference
  circuits live as static <g id="fig-..."> groups inside <defs>, shown via
  the single <use id="circuitRefUse"> in the visible #circuitSvg, swapped per
  question by quiz-engine.js's showCircuitRef() from each question's own
  circuitId / circuitViewBox fields. Shared parts (BJT, resistor, capacitor,
  diode and ground shapes) are copied verbatim from the master shape files.

  Calculation questions (Q6, Q7) randomise their values on every resetQuiz()
  (RESET_EXTRA, also called once at load so ?q=N deep-links always have valid
  values — see reset_extra_skipped_on_deep_link.md in the memory folder).
  Every wrong option is a specific, plausible mis-derivation (forgetting
  the ÷2 in Pout, forgetting both rails in Pin, inverting efficiency).

  Being built in one pass: all 16 questions cover the 13 objectives.
-->

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    // ── Randomised calculation values (Q6, Q7) ──
    // Picked fresh on every resetQuiz() via RESET_EXTRA, and once at load so
    // a ?q=N deep-link (which skips RESET_EXTRA) still has valid values.
    function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function fmtNum(n) { return Number(n.toFixed(2)).toString(); }
    function fmtPct(x) { return Number((x * 100).toFixed(1)).toString() + '%'; }

    let Q6V = {}, Q7V = {};
    function randomizeCalcs() {
      // Q6: maximum output power, ideal (output swings the full rail voltage).
      const vcc6 = randPick([12, 15, 18, 20, 25]);
      const rl6 = randPick([4, 8, 16]);
      Q6V = { vcc: vcc6, rl: rl6, pout: (vcc6 * vcc6) / (2 * rl6) };

      // Q7: efficiency from average supply current. Pin = 2·VCC·I, so
      // η = VCC/(4·RL·I). Rejection-sample so η sits in a realistic class B
      // range (25–75%), not >100% or absurdly low.
      let v;
      do {
        const vcc = randPick([12, 15, 18, 20, 25]);
        const rl = randPick([4, 8, 16]);
        const iMa = randPick([200, 300, 400, 500, 530, 600, 800]);
        v = { vcc, rl, iMa, eta: vcc / (4 * rl * (iMa / 1000)) };
      } while (!(v.eta >= 0.25 && v.eta <= 0.75));
      v.pout = (v.vcc * v.vcc) / (2 * v.rl);
      v.pin = 2 * v.vcc * (v.iMa / 1000);
      Q7V = v;
    }
    randomizeCalcs();

    const QUESTIONS = [
      {
        // Objective: list the main classes and describe the differences
        // between them (conduction angle). Columns are the four classes.
        kind: 'match',
        columns: () => ['Class A', 'Class B', 'Class AB', 'Class C'],
        text: () => `Each description below matches one class of amplifier operation, by how much of the input cycle each device conducts. <b style="color:var(--colour-ui-primary)">Place</b> each one under its class.`,
        hint: () => `Conduction angle is the portion of the full 360° input cycle during which an output device is switched on. Class A is the only class where the device conducts the whole time.`,
        options: () => shuffle([
          { label: 'Conducts for the full 360° of the input cycle', col: 0 },
          { label: 'Each device conducts for exactly half the cycle (180°)', col: 1 },
          { label: 'Each device conducts for more than half the cycle, but less than the whole', col: 2 },
          { label: 'Conducts for less than half the cycle (under 180°)', col: 3 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 classes correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} classes correctly matched`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Misplaced:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">Conduction angle sets the class:</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Class A</b>: the device is never switched off, so it conducts through the full 360° of the input.</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Class B</b>: each device conducts for one half cycle only, so 180° each — the push-pull pair shares the full cycle.</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Class AB</b>: a small forward bias keeps each device on a little past its half cycle, so each conducts for more than 180° but less than 360°.</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Class C</b>: the device is biased off, so it only conducts for a short burst at the peaks, under 180°.</div>
    ${mistakeLine}`;
        }
      },
      {
        // Objective: maximum efficiency of class A.
        text: () => `What is the <b style="color:var(--colour-ui-primary)">maximum theoretical efficiency</b> of a class A amplifier with a resistive load?`,
        hint: () => `Class A runs its device at a constant quiescent current all the time, so most of the supply power is wasted as heat at idle. Only a fraction of the supply is delivered to the load even at best.`,
        options: () => shuffle([
          { label: '25%', type: 'correct' },
          { label: '50%', type: 'wrong' },
          { label: '78.5%', type: 'wrong' },
          { label: '100%', type: 'wrong' },
        ]),
        correctExplain: () => `A resistive-loaded class A stage reaches a maximum of <b>25%</b>`,
        working: () => `
    <div class="working-step">Why class A is so inefficient:</div>
    <div class="working-line">The device conducts all the time, drawing its quiescent current from the supply even with no signal. At best, the peak output swing is half the supply voltage and the average supply current is roughly the same whether there's a signal or not, which limits the best case to <b style="color:var(--colour-ui-correct)">25%</b> for a resistive load.</div>
    <div class="working-line" style="margin-top:.6rem">A transformer-coupled class A stage can reach 50%, because it removes the DC drop across a resistive load — but the figure 25% is the one for a resistive load.</div>`
      },
      {
        // Objective: maximum efficiency of class B (ideal), and why it is higher.
        text: () => `What is the <b style="color:var(--colour-ui-primary)">maximum theoretical efficiency</b> of an ideal class B push-pull amplifier?`,
        hint: () => `In class B, each device draws current only when it is conducting. The ideal figure comes from the peak output power of a sine wave divided by the average supply power.`,
        options: () => shuffle([
          { label: '25%', type: 'wrong' },
          { label: '50%', type: 'wrong' },
          { label: '78.5%', type: 'correct' },
          { label: '90%', type: 'wrong' },
        ]),

          { label: 'Smoother reproduction of low-level signals near 0V', type: 'correct' },
          { label: 'Higher efficiency than class B', type: 'wrong' },
          { label: 'Needs no bias circuitry at all', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are genuine advantages`;
        },
        working: () => `
    <div class="working-line">The diode bias string gives class AB its cleaner output around <span class="colour-voltage">0V</span>, which is exactly where class B suffers from crossover distortion.</div>
    <div class="working-line" style="margin-top:.6rem">The trade-off is efficiency: class AB is <b style="color:var(--colour-ui-wrong)">slightly less</b> efficient than class B, not more, because both devices draw a little quiescent current. The bias circuit is also needed, so it is not "no bias circuitry".</div>`
      }
    ];

    // Fixed diagram swap is done by quiz-engine.js's showCircuitRef() from
    // each question's circuitId/circuitViewBox; no per-question JS needed.

    RESET_EXTRA = randomizeCalcs;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
</html>
