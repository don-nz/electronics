<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../../assets/theme-init.js"></script>
  <script src="../../../../assets/quiz-engine.js"></script>
  <title>Complete Power Amplifier Stages Knowledge Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../assets/quiz-common.css">
  <script src="../../../../assets/breadcrumb.js" defer></script>
  <style>
    .blk-box { fill: var(--colour-panel); stroke: var(--colour-ui-primary); stroke-width: 1.5px; }
    .blk-label { fill: var(--colour-ui-primary); font-size: 15px; font-weight: 700; text-anchor: middle; }
    .blk-sub { fill: var(--colour-text); font-size: 12px; text-anchor: middle; }
    .blk-plus-minus { fill: var(--colour-supply); font-size: 20px; text-anchor: middle; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 14px; font-weight: 700; }
    .fb-line { stroke: var(--colour-series); stroke-width: 2px; fill: none; }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ── BLOCK SHAPES ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="block-box-shape">
        <rect width="120" height="60" rx="4" />
      </g>


      <g id="cap-shape">
        <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
        <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
        <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      </g>

      <g id="ground-shape">
        <line x1="0" y1="0" x2="0" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
        <line x1="-14" y1="15" x2="14" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
        <line x1="-9" y1="20" x2="9" y2="20" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
        <line x1="-4" y1="25" x2="4" y2="25" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
      </g>

      <g id="resistor-vertical">
        <rect x="-15" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)"
          stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
      </g>

      <g id="resistor-horizontal">
        <rect x="-40" y="-15" width="80" height="30" rx="3" style="fill: var(--colour-panel)"
          stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
      </g>

      <g id="plus-minus-circle">
        <circle cx="0" cy="0" r="15" style="fill: var(--colour-panel)"
          stroke="var(--colour-signal)" stroke-width="2" filter="url(#glow)" />
      </g>

      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ── FIG-DISCRETE-STAGES: complete discrete amplifier ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="fig-discrete-stages">

        <!-- ── LINES FIRST: signal path and feedback loop ── -->
        <!-- Horizontal Vin to VOut -->
        <line x1="20" y1="110" x2="600" y2="110" class="fb-line" />
        <circle cx="20" cy="110" r="5" style="fill: var(--colour-signal)" />
        <circle cx="600" cy="110" r="5" style="fill: var(--colour-signal)" />

        <!-- Output to Differential Input -->
        <line x1="550" y1="110" x2="550" y2="250" class="fb-line" />
        <line x1="550" y1="250" x2="120" y2="250" class="fb-line" />
        <line x1="120" y1="250" x2="120" y2="140" class="fb-line" />

        <!-- Vertical to Gnd -->
        <line x1="300" y1="250" x2="300" y2="380" class="fb-line" />

        <!-- ── Blocks and components over the lines ── -->
        <g transform="translate(60,80)">
          <use href="#block-box-shape" class="blk-box" />
          <text class="blk-label" x="60" y="26">Differential</text>
          <text class="blk-label" x="60" y="44">input</text>
        </g>
        
        <g transform="translate(220,80)">
          <use href="#block-box-shape" class="blk-box" />
          <text class="blk-label" x="60" y="26">VAS</text>
          <text class="blk-sub" x="60" y="44">voltage amplification</text>
        </g>

        <g transform="translate(380,80)">
          <use href="#block-box-shape" class="blk-box" />
          <text class="blk-label" x="60" y="26">Output</text>
          <text class="blk-sub" x="60" y="44">stage (AB)</text>
        </g>

        <text class="ckt-io-label" x="0" y="100">Vin</text>
        <text class="ckt-io-label" x="600" y="100" text-anchor="start">Vout</text>

        <!-- ── R5: feedback resistor on the loop ── -->
        <g transform="translate(400,250)">
          <use href="#resistor-horizontal" />
          <text class="ckt-r-label" x="-10" y="-20" text-anchor="start">R5</text>
        </g>

        <!-- ── R4: resistor from the feedback node to ground ── -->
        <g transform="translate(300,280)">
          <use href="#resistor-vertical" />
          <text class="ckt-r-label" x="-40" y="40" text-anchor="start">R4</text>
        </g>

        <use href="#ground-shape" transform="translate(300,380)" />

        <text class="blk-sub" x="130" y="50" text-anchor="start">global feedback loop</text>

        <g transform="translate(40,130)">
          <use href="#plus-minus-circle" />
          <text class="blk-plus-minus" x="0" y="7" text-anchor="start">+</text>
        </g>
        <g transform="translate(140,160)">
          <use href="#plus-minus-circle" />
          <text class="blk-plus-minus" x="0" y="5" text-anchor="start">–</text>
        </g>
      </g>

    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="Complete Power Amplifier Stages"></div>
  <header>
    <h1>Complete Power Amplifier Stages</h1>
    <p>Differential Input · Voltage Amplification Stage · Output Stage · Global Feedback</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel">
        <div class="panel-label" id="circuitRefLabel">Complete discrete amplifier (block diagram)</div>
        <svg id="circuitSvg" viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg">
          <use id="circuitRefUse" href="#fig-discrete-stages" />
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>

          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>

    function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function fmtR(r) { const s = r >= 1000 ? (r / 1000).toString().replace('.', 'k') + 'Ω' : r + 'Ω'; return `<span class="colour-resistor">${s}</span>`; }
    function fmtNum(n) { return Number(n.toPrecision(4)).toString(); }

    let G = {};
    function randomizeGain() {
      const r4 = randPick([1000, 2200, 4700, 6800]);
      const r5 = randPick([22000, 47000, 100000, 150000]);
      G = { r4, r5, acl: 1 + r5 / r4 };
    }
    randomizeGain();

    const QUESTIONS = [
      {
        leftPanel: 'circuit',
        circuitId: 'fig-discrete-stages',
        circuitLabel: 'Complete discrete amplifier (block diagram)',
        circuitViewBox: '0 0 660 450',
        text: () => `Looking at the diagram below, which stage takes the input signal and the feedback signal and compares them?`,
        hint: () => `It is the first stage, and it is built around a matched pair of transistors.`,
        options: () => shuffle([
          { label: 'The <span class="colour-bjt">differential input stage</span>', type: 'correct' },
          { label: 'The <span class="colour-bjt">output stage</span>', type: 'wrong' },
          { label: 'The <span class="colour-gain">voltage amplification stage</span>', type: 'wrong' },
          { label: 'The <span class="colour-resistor">feedback resistor network</span> alone', type: 'wrong' },
        ]),
        correctExplain: () => `The <b class="colour-bjt">differential input stage</b> compares the input and feedback signals`,
        working: () => `
    <div class="working-line">A <span class="colour-bjt">matched pair of transistors</span> amplifies the difference between the non-inverting input and the feedback at the inverting input. Any error appears as a difference, which the stage amplifies.</div>
    <div class="working-total">The feedback network does not compare anything itself: it only returns part of the output to this stage.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'fig-discrete-stages',
        circuitLabel: 'Complete discrete amplifier (block diagram)',
        circuitViewBox: '0 0 660 450',
        text: () => `Looking at the same diagram, what is the main job of the stage after the differential input?`,
        hint: () => `Think about what the output stage needs in order to deliver current to the load.`,
        options: () => shuffle([
          { label: 'It provides the main <span class="colour-gain">voltage gain</span>, so the output stage receives a large signal to drive', type: 'correct' },
          { label: 'It provides the only path for the <span class="colour-resistor">feedback</span> to the input', type: 'wrong' },
          { label: 'It supplies the load <span class="colour-power">power</span> directly', type: 'wrong' },
          { label: 'It sets the <span class="colour-voltage">supply voltage</span> to the rails', type: 'wrong' },
        ]),
        correctExplain: () => `The voltage amplification stage provides the main <span class="colour-gain">voltage gain</span>`,
        working: () => `
    <div class="working-line">The differential stage has only <span class="colour-gain">modest gain</span>. The voltage amplification stage increases the <span class="colour-voltage">voltage level</span> to a size the output stage can use, and the output stage then supplies current to the load.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'fig-discrete-stages',
        circuitLabel: 'Complete discrete amplifier (block diagram)',
        circuitViewBox: '0 0 660 450',
        text: () => `Looking at the same diagram, which class of operation does the output stage use, and why?`,
        hint: () => `Look for the bias that keeps both output devices slightly on around 0V.`,
        options: () => shuffle([
          { label: '<span class="colour-bjt">Class AB</span>, with a small forward bias so both output devices are slightly on around 0V', type: 'correct' },
          { label: '<span class="colour-bjt">Class A</span>, with both devices on all the time at full current', type: 'wrong' },
          { label: '<span class="colour-bjt">Class C</span>, with the devices conducting for less than half the cycle', type: 'wrong' },
          { label: '<span class="colour-bjt">Class B</span> with no bias at all, which causes no crossover distortion', type: 'wrong' },
        ]),
        correctExplain: () => `The output stage is <b class="colour-bjt">class AB</b>, biased slightly on to avoid crossover distortion`,
        working: () => `
    <div class="working-line">A small forward bias between the output bases (set by the <span class="colour-diode">bias diodes</span>) keeps both output devices slightly on at 0V, so the output hands over smoothly between the halves.</div>
    <div class="working-total">Without that bias the stage would be class B, and crossover distortion would appear near 0V.</div>`
      },
      {
        kind: 'multi',
        leftPanel: 'circuit',
        circuitId: 'fig-discrete-stages',
        circuitLabel: 'Complete discrete amplifier (block diagram)',
        circuitViewBox: '0 0 660 450',
        text: () => `Click <b style="color:var(--colour-ui-primary)">every</b> component that forms the <b style="color:var(--colour-ui-primary)">global negative feedback</b> network in the diagram.`,
        hint: () => `Global feedback goes from the output all the way back to the input stage.`,
        options: () => shuffle([
          { label: 'The <span class="colour-resistor">resistor</span> from the output back to the (−) input', type: 'correct' },
          { label: 'The <span class="colour-resistor">resistor</span> from the (−) input to ground', type: 'correct' },
          { label: 'The output stage <span class="colour-bjt">devices</span> themselves', type: 'wrong' },
          { label: 'The <span class="colour-supply">supply rails</span>', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> form the global feedback network`;
        },
        working: () => `
    <div class="working-line">The <span class="colour-resistor">feedback resistor</span> carries part of the output back to the input stage, and the <span class="colour-resistor">resistor to ground</span> sets how much of that signal is returned. Together they set the <span class="colour-gain">closed-loop gain</span>.</div>`
      },
      {
        text: () => `If a <span class="colour-cap">capacitor</span> is placed in series with the <span class="colour-resistor">resistor to ground</span>, so that the feedback resistor to ground has no DC path, what is the <b style="color:var(--colour-ui-primary)">DC voltage gain</b> of the amplifier?`,
        hint: () => `At DC the <span class="colour-cap">capacitor</span> is an open circuit, so the <span class="colour-resistor">resistor to ground</span> is removed from the feedback network. What is left?`,
        options: () => shuffle([
          { label: '<span class="colour-gain">Unity (one)</span>', type: 'correct' },
          { label: 'The same as the <span class="colour-gain">AC gain</span>', type: 'wrong' },
          { label: '<span class="colour-gain">Zero</span>', type: 'wrong' },
          { label: 'Very high, because there is no feedback at DC', type: 'wrong' },
        ]),
        correctExplain: () => `At DC the amplifier is a voltage follower with gain <b class="colour-gain">one</b>`,
        working: () => `
    <div class="working-line">With the <span class="colour-cap">capacitor</span> open at DC, the only feedback path is the <span class="colour-resistor">feedback resistor</span> alone. For a non-inverting amplifier the gain is <span class="colour-gain">1 + R<sub>f</sub>/R<sub>g</sub></span>, and with <span class="colour-resistor">R<sub>g</sub></span> removed the second term disappears, leaving <span class="colour-gain">unity gain</span> at DC.</div>
    <div class="working-total">This keeps the DC output steady, while the <span class="colour-gain">AC gain</span> stays high. This is the same DC-stabilising idea as in the output configuration questions.</div>`
      },
      {
        text: () => `In the complete amplifier, the feedback network uses <b><span class="colour-resistor">R<sub>5</sub></span> = ${fmtR(G.r5)}</b> and <b><span class="colour-resistor">R<sub>4</sub></span> = ${fmtR(G.r4)}</b>. Calculate the <b style="color:var(--colour-ui-primary)">closed-loop AC voltage gain</b>.`,
        hint: () => `For this non-inverting feedback arrangement, <span class="colour-gain">A<sub>CL</sub></span> = 1 + <span class="colour-resistor">R<sub>5</sub></span>/<span class="colour-resistor">R<sub>4</sub></span>.`,
        options: () => shuffle([
          { label: `<span class="colour-gain">A<sub>CL</sub></span> = 1 + ${frac('R<sub>5</sub>', 'R<sub>4</sub>')} = 1 + ${frac(fmtR(G.r5), fmtR(G.r4))} = <b><span class="colour-gain">${fmtNum(G.acl)}</span></b>`, type: 'correct' },
          { label: `<span class="colour-gain">A<sub>CL</sub></span> = ${frac('R<sub>5</sub>', 'R<sub>4</sub>')} = ${frac(fmtR(G.r5), fmtR(G.r4))} = <b><span class="colour-gain">${fmtNum(G.r5 / G.r4)}</span></b>`, type: 'wrong' },
          { label: `<span class="colour-gain">A<sub>CL</sub></span> = 1 − ${frac('R<sub>5</sub>', 'R<sub>4</sub>')} = 1 − ${frac(fmtR(G.r5), fmtR(G.r4))} = <b><span class="colour-gain">${fmtNum(1 - G.r5 / G.r4)}</span></b>`, type: 'wrong' },
          { label: `<span class="colour-gain">A<sub>CL</sub></span> = 1 + ${frac('R<sub>4</sub>', 'R<sub>5</sub>')} = 1 + ${frac(fmtR(G.r4), fmtR(G.r5))} = <b><span class="colour-gain">${fmtNum(1 + G.r4 / G.r5)}</span></b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<span class="colour-gain">A<sub>CL</sub></span> = 1 + <span class="colour-resistor">R<sub>5</sub></span>/<span class="colour-resistor">R<sub>4</sub></span> = <b><span class="colour-result">${fmtNum(G.acl)}</span></b>`,
        working: () => `
    <div class="working-formula-row"><span class="colour-gain">A<sub>CL</sub></span> = 1 + ${frac('<span class="colour-resistor">R<sub>5</sub></span>', '<span class="colour-resistor">R<sub>4</sub></span>')}</div>
    <div class="working-label">Substituting <span class="colour-resistor">R<sub>5</sub></span> = ${fmtR(G.r5)}, <span class="colour-resistor">R<sub>4</sub></span> = ${fmtR(G.r4)}:</div>
    <div class="working-formula-row"><span class="colour-gain">A<sub>CL</sub></span> = 1 + ${frac(fmtR(G.r5), fmtR(G.r4))}</div>
    <div class="working-total"><span class="colour-gain">A<sub>CL</sub></span> ≈ <span class="colour-result">${fmtNum(G.acl)}</span></div>
    <div class="working-line" style="margin-top:.6rem">The "1" is the non-inverting input's own gain, and <span class="colour-resistor">R<sub>5</sub></span>/<span class="colour-resistor">R<sub>4</sub></span> is the extra gain set by the feedback divider.</div>`
      },
      {
        kind: 'match',
        columns: () => ['Differential input', 'Voltage amplification', 'Output stage', 'Feedback network'],
        text: () => `Each description below belongs to one stage of the complete amplifier. <b style="color:var(--colour-ui-primary)">Place</b> each one under its stage.`,
        hint: () => `Work from the input: the first stage compares, the next amplifies voltage, the output stage supplies current, and the feedback returns part of the output.`,
        options: () => shuffle([
          { label: 'Compares the input with the returned feedback signal', col: 0 },
          { label: 'Provides the main <span class="colour-gain">voltage gain</span> for the output stage', col: 1 },
          { label: 'Supplies the <span class="colour-current">current</span> needed by the load', col: 2 },
          { label: 'Returns a fraction of the output to the input', col: 3 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 stages correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} stages correctly matched`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Misplaced:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-line">Each stage has one job: the <span class="colour-bjt">differential stage</span> compares, the voltage stage amplifies, the <span class="colour-bjt">output stage</span> drives the load, and the <span class="colour-resistor">feedback network</span> returns the output to the input.</div>
    ${mistakeLine}`;
        }
      }
    ];

    RESET_EXTRA = randomizeGain;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
</html>
