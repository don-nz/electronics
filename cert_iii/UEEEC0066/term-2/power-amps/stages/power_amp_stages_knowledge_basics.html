<!--
  Source material: the teacher's own "Complete power amplifier circuits"
  objectives page (stages objectives), a printed review sheet (Figures 1 and 2
  and their questions), and an answer sheet for Section 8. The review material
  is REFERENCE ONLY — every question below, including its numbers and wording,
  is original.

  The reference figure is a block diagram of a complete discrete amplifier
  (differential input, voltage amplification stage, output stage, global
  feedback network), drawn fresh in the same <defs> standard as the other
  power-amp quizzes: lines first, then the blocks over them, shown via the
  single <use id="circuitRefUse"> in #circuitSvg.

  The closed-loop gain (Q5) is randomised on every resetQuiz() (RESET_EXTRA,
  and once at load for ?q=N deep-links).
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../../assets/theme-init.js"></script>
  <script src="../../../../assets/quiz-engine.js"></script>
  <title>Complete Power Amplifier Stages Knowledge Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../assets/quiz-common.css">
  <script src="../../../../assets/breadcrumb.js" defer></script>
  <style>
    .blk-box { fill: var(--colour-panel); stroke: var(--colour-ui-primary); stroke-width: 1.5px; }
    .blk-label { fill: var(--colour-ui-primary); font-size: 15px; font-weight: 700; text-anchor: middle; }
    .blk-sub { fill: var(--colour-text); font-size: 12px; text-anchor: middle; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 14px; font-weight: 700; }
    .fb-line { stroke: var(--colour-series); stroke-width: 2px; fill: none; }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ── BLOCK SHAPES ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="block-box-shape">
        <rect width="120" height="60" rx="4" />
      </g>

      <g id="ground-shape">
        <line x1="0" y1="0" x2="0" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
        <line x1="-14" y1="15" x2="14" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
        <line x1="-9" y1="20" x2="9" y2="20" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
        <line x1="-4" y1="25" x2="4" y2="25" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
      </g>

      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ── FIG-DISCRETE-STAGES: complete discrete amplifier ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="fig-discrete-stages">

        <!-- ── LINES FIRST: signal path and feedback loop ── -->
        <line x1="20" y1="110" x2="60" y2="110" class="fb-line" />
        <line x1="180" y1="110" x2="220" y2="110" class="fb-line" />
        <line x1="340" y1="110" x2="380" y2="110" class="fb-line" />
        <line x1="500" y1="110" x2="600" y2="110" class="fb-line" />
        <line x1="600" y1="110" x2="600" y2="200" class="fb-line" />
        <line x1="600" y1="200" x2="120" y2="200" class="fb-line" />
        <line x1="120" y1="200" x2="120" y2="140" class="fb-line" />
        <line x1="300" y1="200" x2="300" y2="215" class="fb-line" />
        <line x1="300" y1="255" x2="300" y2="262" class="fb-line" />

        <!-- ── Blocks and components over the lines ── -->
        <g transform="translate(60,80)">
          <use href="#block-box-shape" class="blk-box" />
          <text class="blk-label" x="60" y="26">Differential</text>
          <text class="blk-label" x="60" y="44">input</text>
        </g>
        <g transform="translate(220,80)">
          <use href="#block-box-shape" class="blk-box" />
          <text class="blk-label" x="60" y="26">VAS</text>
          <text class="blk-sub" x="60" y="44">voltage amplification</text>
        </g>
        <g transform="translate(380,80)">
          <use href="#block-box-shape" class="blk-box" />
          <text class="blk-label" x="60" y="26">Output</text>
          <text class="blk-sub" x="60" y="44">stage (AB)</text>
        </g>

        <text class="ckt-io-label" x="0" y="104">Vin</text>
        <text class="ckt-io-label" x="606" y="116" text-anchor="start">Vout</text>

        <!-- ── R5: feedback resistor on the loop ── -->
        <rect x="400" y="192" width="44" height="16" rx="2" class="blk-box" />
        <text class="ckt-r-label" x="422" y="184" text-anchor="middle">R5</text>

        <!-- ── R4: resistor from the feedback node to ground ── -->
        <rect x="292" y="215" width="16" height="40" rx="2" class="blk-box" />
        <text class="ckt-r-label" x="316" y="240" text-anchor="start">R4</text>
        <use href="#ground-shape" transform="translate(300,262)" />

        <text class="blk-sub" x="130" y="50" text-anchor="start">global feedback loop</text>
        <text class="blk-sub" x="130" y="190" text-anchor="start">(−) input</text>
      </g>

    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="Complete Power Amplifier Stages"></div>
  <header>
    <h1>Complete Power Amplifier Stages</h1>
    <p>Differential Input · Voltage Amplification Stage · Output Stage · Global Feedback</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel">
        <div class="panel-label" id="circuitRefLabel">Complete discrete amplifier (block diagram)</div>
        <svg id="circuitSvg" viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg">
          <use id="circuitRefUse" href="#fig-discrete-stages" />
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>

          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    // ── Randomised closed-loop gain (Q5) ──
    function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function fmtR(r) { return r >= 1000 ? (r / 1000).toString().replace('.', 'k') + 'Ω' : r + 'Ω'; }
    function fmtNum(n) { return Number(n.toPrecision(4)).toString(); }

    let G = {};
    function randomizeGain() {
      const r4 = randPick([1000, 2200, 4700, 6800]);
      const r5 = randPick([22000, 47000, 100000, 150000]);
      G = { r4, r5, acl: 1 + r5 / r4 };
    }
    randomizeGain();

    const QUESTIONS = [
      {
        // Objective: identify the differential input stage and its job.
        leftPanel: 'circuit',
        circuitId: 'fig-discrete-stages',
        circuitLabel: 'Complete discrete amplifier (block diagram)',
        circuitViewBox: '0 0 660 280',
        text: () => `Looking at the diagram below, which stage takes the input signal and the feedback signal and compares them?`,
        hint: () => `It is the first stage, and it is built around a matched pair of transistors.`,
        options: () => shuffle([
          { label: 'The differential input stage', type: 'correct' },
          { label: 'The output stage', type: 'wrong' },
          { label: 'The voltage amplification stage', type: 'wrong' },
          { label: 'The feedback resistor network alone', type: 'wrong' },
        ]),
        correctExplain: () => `The <b>differential input stage</b> compares the input and feedback signals`,
        working: () => `
    <div class="working-line">A matched pair of transistors amplifies the difference between the non-inverting input and the feedback at the inverting input. Any error appears as a difference, which the stage amplifies.</div>
    <div class="working-total">The feedback network does not compare anything itself: it only returns part of the output to this stage.</div>`
      },
      {
        // Objective: describe the voltage amplification stage.
        leftPanel: 'circuit',
        circuitId: 'fig-discrete-stages',
        circuitLabel: 'Complete discrete amplifier (block diagram)',
        circuitViewBox: '0 0 660 280',
        text: () => `Looking at the same diagram, what is the main job of the stage after the differential input?`,
        hint: () => `Think about what the output stage needs in order to deliver current to the load.`,
        options: () => shuffle([
          { label: 'It provides the main voltage gain, so the output stage receives a large signal to drive', type: 'correct' },
          { label: 'It provides the only path for the feedback to the input', type: 'wrong' },
          { label: 'It supplies the load power directly', type: 'wrong' },
          { label: 'It sets the supply voltage to the rails', type: 'wrong' },
        ]),
        correctExplain: () => `The voltage amplification stage provides the main voltage gain`,
        working: () => `
    <div class="working-line">The differential stage has only modest gain. The voltage amplification stage increases the voltage level to a size the output stage can use, and the output stage then supplies current to the load.</div>`
      },
      {
        // Objective: the output stage and its class AB bias.
        leftPanel: 'circuit',
        circuitId: 'fig-discrete-stages',
        circuitLabel: 'Complete discrete amplifier (block diagram)',
        circuitViewBox: '0 0 660 280',
        text: () => `Looking at the same diagram, which class of operation does the output stage use, and why?`,
        hint: () => `Look for the bias that keeps both output devices slightly on around 0V.`,
        options: () => shuffle([
          { label: 'Class AB, with a small forward bias so both output devices are slightly on around 0V', type: 'correct' },
          { label: 'Class A, with both devices on all the time at full current', type: 'wrong' },
          { label: 'Class C, with the devices conducting for less than half the cycle', type: 'wrong' },
          { label: 'Class B with no bias at all, which causes no crossover distortion', type: 'wrong' },
        ]),
        correctExplain: () => `The output stage is <b>class AB</b>, biased slightly on to avoid crossover distortion`,
        working: () => `
    <div class="working-line">A small forward bias between the output bases (set by the bias diodes) keeps both output devices slightly on at 0V, so the output hands over smoothly between the halves.</div>
    <div class="working-total">Without that bias the stage would be class B, and crossover distortion would appear near 0V.</div>`
      },
      {
        // Objective: global negative feedback network.
        kind: 'multi',
        leftPanel: 'circuit',
        circuitId: 'fig-discrete-stages',
        circuitLabel: 'Complete discrete amplifier (block diagram)',
        circuitViewBox: '0 0 660 280',
        text: () => `Click <b style="color:var(--colour-ui-primary)">every</b> component that forms the <b style="color:var(--colour-ui-primary)">global negative feedback</b> network in the diagram.`,
        hint: () => `Global feedback goes from the output all the way back to the input stage.`,
        options: () => shuffle([
          { label: 'The resistor from the output back to the (−) input', type: 'correct' },
          { label: 'The resistor from the (−) input to ground', type: 'correct' },
          { label: 'The output stage devices themselves', type: 'wrong' },
          { label: 'The supply rails', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> form the global feedback network`;
        },
        working: () => `
    <div class="working-line">The feedback resistor carries part of the output back to the input stage, and the resistor to ground sets how much of that signal is returned. Together they set the closed-loop gain.</div>`
      },
      {
        // Objective: predict the DC gain when a capacitor blocks the feedback resistor.
        text: () => `If a capacitor is placed in series with the resistor to ground, so that the feedback resistor to ground has no DC path, what is the <b style="color:var(--colour-ui-primary)">DC voltage gain</b> of the amplifier?`,
        hint: () => `At DC the capacitor is an open circuit, so the resistor to ground is removed from the feedback network. What is left?`,
        options: () => shuffle([
          { label: 'Unity (one)', type: 'correct' },
          { label: 'The same as the AC gain', type: 'wrong' },
          { label: 'Zero', type: 'wrong' },
          { label: 'Very high, because there is no feedback at DC', type: 'wrong' },
        ]),
        correctExplain: () => `At DC the amplifier is a voltage follower with gain <b>one</b>`,
        working: () => `
    <div class="working-line">With the capacitor open at DC, the only feedback path is the feedback resistor alone. For a non-inverting amplifier the gain is 1 + R<sub>f</sub>/R<sub>g</sub>, and with R<sub>g</sub> removed the second term disappears, leaving unity gain at DC.</div>
    <div class="working-total">This keeps the DC output steady, while the AC gain stays high. This is the same DC-stabilising idea as in the output configuration questions.</div>`
      },
      {
        // Calculation (randomised): closed-loop AC voltage gain.
        text: () => `In the complete amplifier, the feedback network uses <b>R<sub>5</sub> = ${fmtR(G.r5)}</b> and <b>R<sub>4</sub> = ${fmtR(G.r4)}</b>. Calculate the <b style="color:var(--colour-ui-primary)">closed-loop AC voltage gain</b>.`,
        hint: () => `For this non-inverting feedback arrangement, A<sub>CL</sub> = 1 + R<sub>5</sub>/R<sub>4</sub>.`,
        options: () => shuffle([
          { label: `A<sub>CL</sub> = 1 + ${frac('R<sub>5</sub>', 'R<sub>4</sub>')} = 1 + ${frac(fmtR(G.r5), fmtR(G.r4))} = <b>${fmtNum(G.acl)}</b>`, type: 'correct' },
          { label: `A<sub>CL</sub> = ${frac('R<sub>5</sub>', 'R<sub>4</sub>')} = ${frac(fmtR(G.r5), fmtR(G.r4))} = <b>${fmtNum(G.r5 / G.r4)}</b>`, type: 'wrong' },
          { label: `A<sub>CL</sub> = 1 − ${frac('R<sub>5</sub>', 'R<sub>4</sub>')} = 1 − ${frac(fmtR(G.r5), fmtR(G.r4))} = <b>${fmtNum(1 - G.r5 / G.r4)}</b>`, type: 'wrong' },
          { label: `A<sub>CL</sub> = 1 + ${frac('R<sub>4</sub>', 'R<sub>5</sub>')} = 1 + ${frac(fmtR(G.r4), fmtR(G.r5))} = <b>${fmtNum(1 + G.r4 / G.r5)}</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `A<sub>CL</sub> = 1 + R<sub>5</sub>/R<sub>4</sub> = <b>${fmtNum(G.acl)}</b>`,
        working: () => `
    <div class="working-formula-row">A<sub>CL</sub> = 1 + ${frac('R<sub>5</sub>', 'R<sub>4</sub>')}</div>
    <div class="working-label">Substituting R<sub>5</sub> = ${fmtR(G.r5)}, R<sub>4</sub> = ${fmtR(G.r4)}:</div>
    <div class="working-formula-row">A<sub>CL</sub> = 1 + ${frac(fmtR(G.r5), fmtR(G.r4))}</div>
    <div class="working-total">A<sub>CL</sub> ≈ <span class="colour-result">${fmtNum(G.acl)}</span></div>
    <div class="working-line" style="margin-top:.6rem">The "1" is the non-inverting input's own gain, and R<sub>5</sub>/R<sub>4</sub> is the extra gain set by the feedback divider.</div>`
      },
      {
        // Objective: matching each stage with its role.
        kind: 'match',
        columns: () => ['Differential input', 'Voltage amplification', 'Output stage', 'Feedback network'],
        text: () => `Each description below belongs to one stage of the complete amplifier. <b style="color:var(--colour-ui-primary)">Place</b> each one under its stage.`,
        hint: () => `Work from the input: the first stage compares, the next amplifies voltage, the output stage supplies current, and the feedback returns part of the output.`,
        options: () => shuffle([
          { label: 'Compares the input with the returned feedback signal', col: 0 },
          { label: 'Provides the main voltage gain for the output stage', col: 1 },
          { label: 'Supplies the current needed by the load', col: 2 },
          { label: 'Returns a fraction of the output to the input', col: 3 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 stages correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} stages correctly matched`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Misplaced:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-line">Each stage has one job: the differential stage compares, the voltage stage amplifies, the output stage drives the load, and the feedback network returns the output to the input.</div>
    ${mistakeLine}`;
        }
      }
    ];

    RESET_EXTRA = randomizeGain;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
</html>
