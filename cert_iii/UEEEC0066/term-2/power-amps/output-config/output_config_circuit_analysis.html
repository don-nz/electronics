<!--
  Source material: the teacher's own "Power amplifier output configurations"
  objectives page and a printed Review Questions sheet / answer sheet for
  Section 7. The review questions are REFERENCE ONLY, never copied — every
  question below is original.

  DC analysis for the complementary class AB output stage, split from
  output_config_knowledge_basics.html in the same way coupling/basics splits
  its conceptual and circuit-analysis quizzes.

  The circuit is the same complementary class AB stage as the knowledge file,
  drawn fresh and following the diff_amp / amp_classes diagram standard (lines
  drawn first, components layered over them, shared shapes in <defs>).

  Values are RANDOMISED on every resetQuiz() via RESET_EXTRA (and once at load,
  so a ?q=N deep-link always has valid values — see
  reset_extra_skipped_on_deep_link.md in the memory folder). The symmetric
  supply means the base voltages are fixed at ±0.6V; the bias current, the
  maximum power and the output-device currents all depend on the random
  supply, bias resistor and load.

  Each wrong option is a specific, plausible mistake: forgetting the diode drop,
  using both diode drops, forgetting the square in the power formula, and
  using the rail voltage instead of the peak.
-->

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    // ── Randomised DC values ──
    // Picked fresh on every resetQuiz() via RESET_EXTRA, and once at load so
    // a ?q=N deep-link (which skips RESET_EXTRA) still has valid values.
    function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function fmtNum(n) { return Number(n.toPrecision(3)).toString(); }
    function fmtR(r) { return r >= 1000 ? (r / 1000).toString().replace('.', 'k') + 'Ω' : r + 'Ω'; }

    let V = {};
    function randomizeDC() {
      // Symmetric ±VCC, equal bias resistors R1 = R2, load RL.
      const vcc = randPick([12, 15, 18, 20, 22, 25]);
      const r = randPick([1500, 2200, 2400, 4700]);
      const rl = randPick([4, 8, 16]);
      const I = (vcc - 0.6) / r;               // bias string current = quiescent current
      V = {
        vcc, r, rl, I,
        iQ: I,
        pmax: (vcc * vcc) / (2 * rl),
      };
    }
    randomizeDC();

    const QUESTIONS = [
      {
        // Quiescent current in the output devices: I = (VCC − 0.6V)/R1.
        leftPanel: 'circuit',
        circuitId: 'fig-class-ab',
        circuitLabel: 'Complementary class AB output stage',
        circuitViewBox: '0 0 360 490',
        text: () => `Looking at the circuit below, the supply is <b>±${V.vcc} V</b> and <b>R1 = R2 = ${fmtR(V.r)}</b>. Calculate the <b style="color:var(--colour-ui-primary)">quiescent current</b> in the output devices.`,
        hint: () => `The top of R1 is at +V<sub>CC</sub> and its lower end is the Q1 base, about 0.6V. The drop across R1 is therefore V<sub>CC</sub> − 0.6V, not the full rail.`,
        options: () => shuffle([
          { label: `<span class="colour-current">I<sub>Q</sub></span> = ${frac('<span class="colour-voltage">V<sub>CC</sub></span> − 0.6V', '<span class="colour-resistor">R1</span>')} = ${frac(`<span class="colour-voltage">${V.vcc}</span> − 0.6V`, `<span class="colour-resistor">${fmtR(V.r)}</span>`)} = <b class="colour-result">${fmtNum(V.iQ * 1000)} mA</b>`, type: 'correct' },
          { label: `<span class="colour-current">I<sub>Q</sub></span> = ${frac('<span class="colour-voltage">V<sub>CC</sub></span>', '<span class="colour-resistor">R1</span>')} = ${frac(`<span class="colour-voltage">${V.vcc}</span>`, `<span class="colour-resistor">${fmtR(V.r)}</span>`)} = <b>${fmtNum(V.vcc / V.r * 1000)} mA</b>`, type: 'wrong' },
          { label: `<span class="colour-current">I<sub>Q</sub></span> = ${frac('<span class="colour-voltage">V<sub>CC</sub></span> − 1.2V', '<span class="colour-resistor">R1</span>')} = ${frac(`<span class="colour-voltage">${V.vcc}</span> − 1.2V`, `<span class="colour-resistor">${fmtR(V.r)}</span>`)} = <b>${fmtNum((V.vcc - 1.2) / V.r * 1000)} mA</b>`, type: 'wrong' },
          { label: `<span class="colour-current">I<sub>Q</sub></span> = ${frac('<span class="colour-voltage">V<sub>CC</sub></span> + 0.6V', '<span class="colour-resistor">R1</span>')} = ${frac(`<span class="colour-voltage">${V.vcc}</span> + 0.6V`, `<span class="colour-resistor">${fmtR(V.r)}</span>`)} = <b>${fmtNum((V.vcc + 0.6) / V.r * 1000)} mA</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<span class="colour-current">I<sub>Q</sub></span> = (<span class="colour-voltage">V<sub>CC</sub></span> − 0.6V)/<span class="colour-resistor">R1</span> = <b class="colour-result">${fmtNum(V.iQ * 1000)} mA</b>`,
        working: () => `
    <div class="working-formula-row"><span class="colour-current">I<sub>Q</sub></span> = ${frac('<span class="colour-voltage">V<sub>CC</sub></span> − <span class="colour-voltage">V<sub>B1</sub></span>', '<span class="colour-resistor">R1</span>')}</div>
    <div class="working-label">The base of Q1 sits at <span class="colour-voltage">+0.6V</span> (one diode drop below the top of the string, with the bias string balanced to <span class="colour-voltage">±0.6V</span> at the bases). Substituting:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>Q</sub></span> = ${frac(`<span class="colour-voltage">${V.vcc}</span> − 0.6`, `<span class="colour-resistor">${fmtR(V.r)}</span>`)}</div>
    <div class="working-total"><span class="colour-current">I<sub>Q</sub></span> ≈ <b class="colour-result">${fmtNum(V.iQ * 1000)} mA</b></div>
    <div class="working-line" style="margin-top:.6rem">This is the current each output device carries with no signal, so it sets the quiescent point of the class AB stage.</div>`
      },
      {
        // Maximum output power: P = VCC²/(2RL).
        leftPanel: 'circuit',
        circuitId: 'fig-class-ab',
        circuitLabel: 'Complementary class AB output stage',
        circuitViewBox: '0 0 360 490',
        text: () => `Looking at the same circuit, the supply is <b>±${V.vcc} V</b> and the load <b>R<sub>L</sub> = ${V.rl} Ω</b>. Assuming an ideal output that swings the full rail, calculate the <b style="color:var(--colour-power)">maximum output power</b> into the load.`,
        hint: () => `Peak output is the rail voltage. Convert to RMS (÷√2), then P = V²/R, which simplifies to V²/(2R).`,
        options: () => shuffle([
          { label: `<span class="colour-power">P<sub>out(max)</sub></span> = ${frac('<span class="colour-voltage">V<sub>CC</sub></span>²', '2<span class="colour-resistor">R<sub>L</sub></span>')} = ${frac(`<span class="colour-voltage">${V.vcc}</span>²`, `2 × <span class="colour-resistor">${V.rl}</span>`)} = <b class="colour-result">${fmtNum(V.pmax)} W</b>`, type: 'correct' },
          { label: `<span class="colour-power">P<sub>out(max)</sub></span> = ${frac('<span class="colour-voltage">V<sub>CC</sub></span>²', '<span class="colour-resistor">R<sub>L</sub></span>')} = ${frac(`<span class="colour-voltage">${V.vcc}</span>²`, `<span class="colour-resistor">${V.rl}</span>`)} = <b>${fmtNum(V.vcc * V.vcc / V.rl)} W</b>`, type: 'wrong' },
          { label: `<span class="colour-power">P<sub>out(max)</sub></span> = ${frac('<span class="colour-voltage">V<sub>CC</sub></span>', '2<span class="colour-resistor">R<sub>L</sub></span>')} = ${frac(`<span class="colour-voltage">${V.vcc}</span>`, `2 × <span class="colour-resistor">${V.rl}</span>`)} = <b>${fmtNum(V.vcc / (2 * V.rl))} W</b>`, type: 'wrong' },
          { label: `<span class="colour-power">P<sub>out(max)</sub></span> = ${frac('(2<span class="colour-voltage">V<sub>CC</sub></span>)²', '2<span class="colour-resistor">R<sub>L</sub></span>')} = ${frac(`${2 * V.vcc}²`, `2 × <span class="colour-resistor">${V.rl}</span>`)} = <b>${fmtNum(4 * V.pmax)} W</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<span class="colour-power">P<sub>out(max)</sub></span> = <span class="colour-voltage">V<sub>CC</sub></span>²/(2<span class="colour-resistor">R<sub>L</sub></span>) = <b class="colour-result">${fmtNum(V.pmax)} W</b>`,
        working: () => `
    <div class="working-formula-row"><span class="colour-power">P<sub>out(max)</sub></span> = ${frac('<span class="colour-voltage">V<sub>CC</sub></span>²', '2<span class="colour-resistor">R<sub>L</sub></span>')}</div>
    <div class="working-label">Substituting <span class="colour-voltage">V<sub>CC</sub></span> = <span class="colour-voltage">${V.vcc} V</span>, <span class="colour-resistor">R<sub>L</sub></span> = <span class="colour-resistor">${V.rl} Ω</span>:</div>
    <div class="working-formula-row"><span class="colour-power">P<sub>out(max)</sub></span> = ${frac(`<span class="colour-voltage">${V.vcc}</span>²`, `2 × <span class="colour-resistor">${V.rl}</span>`)}</div>
    <div class="working-total"><span class="colour-power">P<sub>out(max)</sub></span> ≈ <span class="colour-result">${fmtNum(V.pmax)} W</span></div>
    <div class="working-line" style="margin-top:.6rem">The ÷2 comes from RMS: a peak of <span class="colour-voltage">V<sub>CC</sub></span> is <span class="colour-voltage">V<sub>CC</sub></span>/√2 RMS, and that squared over <span class="colour-resistor">R<sub>L</sub></span> is <span class="colour-voltage">V<sub>CC</sub></span>²/(2<span class="colour-resistor">R<sub>L</sub></span>).</div>`
      },
      {
        // Base voltage of Q1 at zero input (fixed).
        leftPanel: 'circuit',
        circuitId: 'fig-class-ab',
        circuitLabel: 'Complementary class AB output stage',
        circuitViewBox: '0 0 360 490',
        text: () => `Looking at the same circuit, what is the DC voltage at the <b style="color:var(--colour-ui-primary)">base of Q1</b> at zero input, when the supply is symmetrical?`,
        hint: () => `Start at the output (0V) and add the base-emitter drop of Q1. Alternatively, the two diodes split the rails symmetrically.`,
        options: () => shuffle([
          { label: '<span class="colour-voltage">+0.6V</span>', type: 'correct' },
          { label: '<span class="colour-voltage">+1.2V</span>', type: 'wrong' },
          { label: '<span class="colour-voltage">0V</span>', type: 'wrong' },
          { label: `<span class="colour-voltage">+${V.vcc}V</span>`, type: 'wrong' },
        ]),
        correctExplain: () => `<span class="colour-voltage">V<sub>B1</sub></span> = <span class="colour-voltage">V<sub>E1</sub></span> + <span class="colour-voltage">V<sub>BE1</sub></span> = 0V + 0.6V = <b class="colour-result">+0.6V</b>`,
        working: () => `
    <div class="working-line">The output (emitter) sits at <span class="colour-voltage">0V</span> with no signal. Q1's base is one base-emitter drop above that: <span class="colour-voltage">V<sub>B1</sub></span> = 0 + 0.6 = <span class="colour-result">+0.6V</span>.</div>
    <div class="working-line" style="margin-top:.6rem">By symmetry, Q2's base is <span class="colour-voltage">−0.6V</span>. The two diodes between them account for the <span class="colour-voltage">1.2V</span> difference.</div>`
      },
      {
        // Collector voltage of Q1 (fixed relative to the supply).
        leftPanel: 'circuit',
        circuitId: 'fig-class-ab',
        circuitLabel: 'Complementary class AB output stage',
        circuitViewBox: '0 0 360 490',
        text: () => `Looking at the same circuit, the supply is <b>±${V.vcc} V</b>. What is the DC voltage at the <b style="color:var(--colour-ui-primary)">collector of Q1</b>?`,
        hint: () => `Q1 is an NPN driven from the positive rail, so its collector is tied directly to that rail.`,
        options: () => shuffle([
          { label: `<span class="colour-voltage">+${V.vcc} V</span>`, type: 'correct' },
          { label: `<span class="colour-voltage">−${V.vcc} V</span>`, type: 'wrong' },
          { label: '<span class="colour-voltage">0V</span>', type: 'wrong' },
          { label: `<span class="colour-voltage">+${V.vcc / 2} V</span>`, type: 'wrong' },
        ]),
        correctExplain: () => `The collector of Q1 is tied to <span class="colour-voltage">+${V.vcc} V</span>`,
        working: () => `
    <div class="working-line">Q1's collector connects straight to the positive rail, so it sits at <span class="colour-voltage">+${V.vcc} V</span>. Its emitter, at the output, is near 0V with no signal, so the transistor has about <span class="colour-voltage">${V.vcc} V</span> across it.</div>`
      },
      {
        // Bias current through R1, the same as the quiescent current.
        leftPanel: 'circuit',
        circuitId: 'fig-class-ab',
        circuitLabel: 'Complementary class AB output stage',
        circuitViewBox: '0 0 360 490',
        text: () => `Looking at the same circuit, with <b>±${V.vcc} V</b> and <b>R1 = ${fmtR(V.r)}</b>, the top of R1 is at <b>+${V.vcc} V</b>. What is the voltage across R1?`,
        hint: () => `Subtract the voltage at the bottom of R1 (the Q1 base end) from the voltage at its top.`,
        options: () => shuffle([
          { label: `<span class="colour-voltage">V<sub>R1</sub></span> = ${V.vcc} − 0.6 = <b class="colour-result">${fmtNum(V.vcc - 0.6)} V</b>`, type: 'correct' },
          { label: `<span class="colour-voltage">V<sub>R1</sub></span> = ${V.vcc} + 0.6 = <b>${fmtNum(V.vcc + 0.6)} V</b>`, type: 'wrong' },
          { label: `<span class="colour-voltage">V<sub>R1</sub></span> = ${V.vcc} = <b>${fmtNum(V.vcc)} V</b>`, type: 'wrong' },
          { label: `<span class="colour-voltage">V<sub>R1</sub></span> = 0.6 = <b>0.6 V</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<span class="colour-voltage">V<sub>R1</sub></span> = ${V.vcc} − 0.6 = <b class="colour-result">${fmtNum(V.vcc - 0.6)} V</b>`,
        working: () => `
    <div class="working-line">The top of R1 is at <span class="colour-voltage">+${V.vcc} V</span>, and its lower end is the base of Q1 at <span class="colour-voltage">+0.6V</span>. The voltage across R1 is the difference: <span class="colour-voltage">${V.vcc} − 0.6 = ${fmtNum(V.vcc - 0.6)} V</span>.</div>
    <div class="working-total">This voltage, divided by <span class="colour-resistor">R1</span>, gives the bias current that sets the quiescent current in the next question.</div>`
      }
    ];

    RESET_EXTRA = randomizeDC;
    randomizeDC();

    RENDER_EXTRA = () => {
      document.getElementById('circuitVccPos').textContent = V.vcc;
      document.getElementById('circuitVccNeg').textContent = V.vcc;
      document.getElementById('circuitR1Value').textContent = fmtR(V.r);
      document.getElementById('circuitR2Value').textContent = fmtR(V.r);
      document.getElementById('circuitRLValue').textContent = fmtR(V.rl);
    };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
