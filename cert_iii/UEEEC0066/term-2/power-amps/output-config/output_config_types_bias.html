<!--
  UEEEC0066 term 2 — power amplifiers, output configurations: identify the four class AB output stages
  and match each to the bias voltage it needs.
  Q1-Q4 each show one stage (view = darl / comp / compsym / quasi) with all four names as options;
  Q5 shows all four, labelled, and matches them to 1.2 / 1.8 / 2.4 V (teacher's values: complementary
  symmetry 1.2, Darlington 2.4, quasi-complementary 1.8, composite 1.2 — 0.6 V per junction in the bias path).
  Every stage shares the same front end: R1 current-source load from +V, the Vbias block, and the VAS
  transistor below it; output to RL. Drawn without emitter resistors so the junction count stays clear.
-->

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      darl: { box: '0 0 440 460', label: 'Class AB output stage' },
      comp: { box: '0 0 440 460', label: 'Class AB output stage' },
      compsym: { box: '0 0 440 460', label: 'Class AB output stage' },
      quasi: { box: '0 0 440 460', label: 'Class AB output stage' },
      all: { box: '0 0 890 980', label: 'The four output configurations' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'darl';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        // bbox in the svg's own coordinates (components carry their own translate)
        const bb = el.getBBox(), p = 7, M = el.getCTM && svg.getCTM() ? svg.getCTM().inverse().multiply(el.getCTM()) : null;
        let b = bb;
        if (M) {
          const xs = [], ys = [];
          [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]].forEach(([x, y]) => {
            xs.push(M.a * x + M.c * y + M.e); ys.push(M.b * x + M.d * y + M.f); });
          b = { x: Math.min(...xs), y: Math.min(...ys), width: Math.max(...xs) - Math.min(...xs), height: Math.max(...ys) - Math.min(...ys) };
        }
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [

      {
        // Identify: Darlington.
        view: 'darl',
        text: () => `Which output configuration is this class AB output stage?`,
        hint: () => `Look at each half separately. How many transistors are in it, and are they the <b>same</b> type (NPN + NPN) or <b>different</b> types (NPN + PNP)?`,
        options: () => shuffle([
          { label: 'Complementary symmetry', type: 'wrong' },
          { label: 'Darlington', type: 'correct' },
          { label: 'Quasi-complementary', type: 'wrong' },
          { label: 'Composite (complementary feedback pair)', type: 'wrong' },
        ]),
        correctExplain: () => `<b>Darlington</b> — two of the same type in each half`,
        working: () => `
    <div class="working-line"><b>Top:</b> Q1 (NPN) emitter drives Q2 (NPN) base — two NPNs, collectors on the same rail: an <b>NPN Darlington</b>.</div>
    <div class="working-line"><b>Bottom:</b> Q3 (PNP) drives Q4 (PNP) — a <b>PNP Darlington</b>.</div>
    <div class="working-line" style="margin-top:.4rem">Both halves are Darlingtons of the <b>same</b> type, so this is a <b>Darlington</b> output. Each half has a current gain of β<sub>1</sub> × β<sub>2</sub>.</div>
    
    <table class="ws-table">
      <tr><th></th><th>Top half</th><th>Bottom half</th></tr>
      <tr><th>Complementary symmetry</th><td>NPN</td><td>PNP</td></tr>
      <tr><th>Darlington</th><td>NPN + NPN</td><td>PNP + PNP</td></tr>
      <tr><th>Quasi-complementary</th><td>NPN + NPN (Darlington)</td><td>PNP + NPN (composite)</td></tr>
      <tr><th>Composite</th><td>NPN + PNP</td><td>PNP + NPN</td></tr>
    </table>
    <div class="working-total">Count the base–emitter junctions between the two ends of V<sub>bias</sub>: Q1, Q2, Q4, Q3 — <b>four</b>. Keep that in mind for the last question.</div>`
      },
      {
        // Identify: composite.
        view: 'comp',
        text: () => `Which output configuration is this class AB output stage?`,
        hint: () => `Look at each half separately. How many transistors are in it, and are they the <b>same</b> type (NPN + NPN) or <b>different</b> types (NPN + PNP)?`,
        options: () => shuffle([
          { label: 'Complementary symmetry', type: 'wrong' },
          { label: 'Darlington', type: 'wrong' },
          { label: 'Quasi-complementary', type: 'wrong' },
          { label: 'Composite (complementary feedback pair)', type: 'correct' },
        ]),
        correctExplain: () => `<b>Composite</b> — different types in each half`,
        working: () => `
    <div class="working-line"><b>Top:</b> Q1 (NPN) collector drives Q2 (PNP) base, and Q2's collector comes back to Q1's emitter — an NPN driver with a PNP output: a <b>composite pair</b>.</div>
    <div class="working-line"><b>Bottom:</b> Q3 (PNP) drives Q4 (NPN) — another composite pair.</div>
    <div class="working-line" style="margin-top:.4rem">Both halves pair <b>different</b> types, so this is a <b>composite</b> output (also called complementary feedback pairs, or Sziklai pairs). Notice the power transistors' collectors — not emitters — go to the output.</div>
    
    <table class="ws-table">
      <tr><th></th><th>Top half</th><th>Bottom half</th></tr>
      <tr><th>Complementary symmetry</th><td>NPN</td><td>PNP</td></tr>
      <tr><th>Darlington</th><td>NPN + NPN</td><td>PNP + PNP</td></tr>
      <tr><th>Quasi-complementary</th><td>NPN + NPN (Darlington)</td><td>PNP + NPN (composite)</td></tr>
      <tr><th>Composite</th><td>NPN + PNP</td><td>PNP + NPN</td></tr>
    </table>
    <div class="working-total">Count the junctions between the two ends of V<sub>bias</sub>: only Q1 and Q3 are in that path — Q2's and Q4's base–emitter junctions hang off the rails. <b>Two</b>.</div>`
      },
      {
        // Identify: complementary symmetry.
        view: 'compsym',
        text: () => `Which output configuration is this class AB output stage?`,
        hint: () => `Look at each half separately. How many transistors are in it, and are they the <b>same</b> type (NPN + NPN) or <b>different</b> types (NPN + PNP)?`,
        options: () => shuffle([
          { label: 'Complementary symmetry', type: 'correct' },
          { label: 'Darlington', type: 'wrong' },
          { label: 'Quasi-complementary', type: 'wrong' },
          { label: 'Composite (complementary feedback pair)', type: 'wrong' },
        ]),
        correctExplain: () => `<b>Complementary symmetry</b> — one NPN, one PNP`,
        working: () => `
    <div class="working-line">Just <b>one transistor per half</b>: Q1 (NPN) on top, Q2 (PNP) below, emitters joined at the output. The two are complementary (opposite types) and wired symmetrically — <b>complementary symmetry</b>.</div>
    <div class="working-line" style="margin-top:.4rem">It is the basic class AB stage. The others replace one or both single transistors with a pair to get more current gain.</div>
    
    <table class="ws-table">
      <tr><th></th><th>Top half</th><th>Bottom half</th></tr>
      <tr><th>Complementary symmetry</th><td>NPN</td><td>PNP</td></tr>
      <tr><th>Darlington</th><td>NPN + NPN</td><td>PNP + PNP</td></tr>
      <tr><th>Quasi-complementary</th><td>NPN + NPN (Darlington)</td><td>PNP + NPN (composite)</td></tr>
      <tr><th>Composite</th><td>NPN + PNP</td><td>PNP + NPN</td></tr>
    </table>
    <div class="working-total">Junctions between the two ends of V<sub>bias</sub>: Q1 and Q2 — <b>two</b>.</div>`
      },
      {
        // Identify: quasi-complementary.
        view: 'quasi',
        text: () => `Which output configuration is this class AB output stage?`,
        hint: () => `Look at each half separately. How many transistors are in it, and are they the <b>same</b> type (NPN + NPN) or <b>different</b> types (NPN + PNP)?`,
        options: () => shuffle([
          { label: 'Complementary symmetry', type: 'wrong' },
          { label: 'Darlington', type: 'wrong' },
          { label: 'Quasi-complementary', type: 'correct' },
          { label: 'Composite (complementary feedback pair)', type: 'wrong' },
        ]),
        correctExplain: () => `<b>Quasi-complementary</b> — a Darlington on top, a composite pair below`,
        working: () => `
    <div class="working-line"><b>Top:</b> Q1 (NPN) drives Q2 (NPN) — a <b>Darlington</b>.</div>
    <div class="working-line"><b>Bottom:</b> Q3 (PNP) drives Q4 (NPN) — a <b>composite pair</b>.</div>
    <div class="working-line" style="margin-top:.4rem">The two halves are built differently, and both power transistors (Q2, Q4) are <b>NPN</b>. That is a <b>quasi-complementary</b> output: "quasi" (almost) because the bottom half only <i>behaves</i> like a PNP. It was popular when good high-power PNP transistors were hard to get.</div>
    
    <table class="ws-table">
      <tr><th></th><th>Top half</th><th>Bottom half</th></tr>
      <tr><th>Complementary symmetry</th><td>NPN</td><td>PNP</td></tr>
      <tr><th>Darlington</th><td>NPN + NPN</td><td>PNP + PNP</td></tr>
      <tr><th>Quasi-complementary</th><td>NPN + NPN (Darlington)</td><td>PNP + NPN (composite)</td></tr>
      <tr><th>Composite</th><td>NPN + PNP</td><td>PNP + NPN</td></tr>
    </table>
    <div class="working-total">Junctions between the two ends of V<sub>bias</sub>: Q1 and Q2 on top (Darlington), only Q3 below (composite) — <b>three</b>.</div>`
      },
      {
        // Match each configuration to the bias voltage it needs (teacher's values, 0.6 V per junction).
        view: 'all',
        kind: 'match',
        columns: () => ['1.2 V', '1.8 V', '2.4 V'],
        text: () => `<b style="color:var(--colour-ui-primary)">Match</b> each output configuration with the <b class="colour-supply">V<sub>bias</sub></b> it needs (0.6 V per base–emitter junction).`,
        hint: () => `Count the base–emitter junctions in the path from the top of V<sub>bias</sub>, through the output, to the bottom of V<sub>bias</sub>. In a composite pair only the driver's junction is in that path.`,
        options: () => shuffle([
          { label: 'Complementary symmetry', poolHtml: 'Complementary symmetry', col: 0 },
          { label: 'Darlington', poolHtml: 'Darlington', col: 2 },
          { label: 'Quasi-complementary', poolHtml: 'Quasi-complementary', col: 1 },
          { label: 'Composite', poolHtml: 'Composite', col: 0 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 matched correctly' : `${st.opts.length - wrongCount} of ${st.opts.length} matched correctly`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Mismatched:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <table class="ws-table">
      <tr><th>Configuration</th><th>Junctions in the bias path</th><th>V<sub>bias</sub></th></tr>
      <tr><th>Complementary symmetry</th><td>NPN + PNP = 2</td><td><b>1.2 V</b></td></tr>
      <tr><th>Darlington</th><td>2 top + 2 bottom = 4</td><td><b>2.4 V</b></td></tr>
      <tr><th>Quasi-complementary</th><td>2 (Darlington) + 1 (composite) = 3</td><td><b>1.8 V</b></td></tr>
      <tr><th>Composite</th><td>driver + driver = 2</td><td><b>1.2 V</b></td></tr>
    </table>
    <div class="working-line">Each junction needs about <b>0.6 V</b> to just turn on, so V<sub>bias</sub> = 0.6 V × the number of junctions.</div>
    <div class="working-line" style="margin-top:.4rem">The composite pair is the surprise: four transistors, yet only <b>1.2 V</b>. Each power transistor's base–emitter junction sits between its rail and the driver's collector — outside the bias path — so only the two drivers count.</div>
    <div class="working-total">In practice V<sub>bias</sub> comes from a V<sub>BE</sub> multiplier set to just this value (or one diode per junction), mounted on the heatsink so it tracks the output transistors' temperature.</div>
    ${mistakeLine}`;
        }
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
