  <style>
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; text-anchor: middle; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-diode-label { fill: var(--colour-diode-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-note { fill: var(--colour-text); font-size: 13px; font-weight: 700; }
  </style>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ── BASE SHAPES ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="bjt-npn-shape">
        <circle cx="7" cy="0" r="24" fill="var(--colour-panel)" style="stroke: var(--colour-bjt)" stroke-width="2"
          filter="url(#glow)" />
        <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
        <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
      </g>

      <g id="bjt-pnp-shape">
        <circle cx="7" cy="0" r="24" fill="var(--colour-panel)" style="stroke: var(--colour-bjt)" stroke-width="2"
          filter="url(#glow)" />
        <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
        <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polygon points="2,-9 8,-20 13,-14" style="fill: var(--colour-bjt)" />
      </g>

      <g id="resistor-vertical">
        <rect x="-15" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)"
          stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
      </g>

      <g id="cap-shape">
        <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
        <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
        <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      </g>

      <g id="diode-down-shape">
        <line x1="0" y1="-20" x2="0" y2="-8" style="stroke: var(--colour-diode)" stroke-width="2" />
        <polygon points="-8,-8 8,-8 0,8" style="fill: var(--colour-diode)" />
        <line x1="-9" y1="8" x2="9" y2="8" style="stroke: var(--colour-diode)" stroke-width="2.5" />
        <line x1="0" y1="8" x2="0" y2="20" style="stroke: var(--colour-diode)" stroke-width="2" />
      </g>

      <g id="ground-shape">
        <line x1="0" y1="0" x2="0" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
        <line x1="-14" y1="15" x2="14" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
        <line x1="-9" y1="20" x2="9" y2="20" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
        <line x1="-4" y1="25" x2="4" y2="25" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
      </g>

      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ── FIG-CLASS-AB: complementary output with diode bias ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="fig-class-ab">

        <!-- ── TOP RAIL ── -->
        <line x1="80" y1="20" x2="300" y2="20" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="110" cy="20" r="5" style="fill: var(--colour-series)" />
        <circle cx="200" cy="20" r="5" style="fill: var(--colour-series)" />
        <text class="ckt-rail-label" x="305" y="25">+20V</text>

        <!-- ── BOTTOM RAIL ── -->
        <line x1="80" y1="460" x2="300" y2="460" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="110" cy="460" r="5" style="fill: var(--colour-series)" />
        <circle cx="200" cy="460" r="5" style="fill: var(--colour-series)" />
        <text class="ckt-rail-label" x="305" y="465">−20V</text>

        <!-- ── INPUT HORIZONTAL ── -->
        <line x1="50" y1="200" x2="169" y2="200" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="110" cy="200" r="5" style="fill: var(--colour-series)" />

        <!-- ── R1 R2 VERTICAL ── -->
        <line x1="110" y1="20" x2="110" y2="465" style="stroke: var(--colour-series)" stroke-width="2" />

        <!-- ── Q1 Q2 VERTICAL ── -->
        <line x1="200" y1="20" x2="200" y2="460" style="stroke: var(--colour-series)" stroke-width="2" />


        <!-- ── OUTPUT HORIZONTAL THEN VERTICAL ── -->
        <line x1="200" y1="250" x2="300" y2="250" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="200" cy="250" r="5" style="fill: var(--colour-series)" />
        <line x1="300" y1="250" x2="300" y2="380" style="stroke: var(--colour-series)" stroke-width="2" />
        <use href="#ground-shape" transform="translate(300,380)" />

        <!-- ── BIAS STRING: R1 (top rail) → N1 → D1 → D2 → N2 → R2 (bottom rail) ── -->
        <g transform="translate(110,40)">
          <use href="#resistor-vertical" />
          <text class="ckt-r-label" x="-35" y="40" text-anchor="middle">R1</text>
          <text class="ckt-value" x="40" y="40">3k9</text>
        </g>

        <g transform="translate(110,170)">
          <use href="#diode-down-shape" />
          <text class="ckt-diode-label" x="16" y="-4">D1</text>
        </g>
        <circle cx="110" cy="150" r="5" style="fill: var(--colour-series)" />
        <g transform="translate(110,250)">
          <use href="#diode-down-shape" />
          <text class="ckt-diode-label" x="16" y="-4">D2</text>
        </g>
        <circle cx="110" cy="230" r="5" style="fill: var(--colour-series)" />

        <g transform="translate(110,320)">
          <use href="#resistor-vertical" />
          <text class="ckt-r-label" x="-35" y="40" text-anchor="middle">R2</text>
          <text class="ckt-value" x="40" y="40">3k9</text>
        </g>

        <!-- ── INPUT ── -->
        <text class="ckt-io-label" x="30" y="190">Input</text>
        <use href="#cap-shape" transform="translate(90,200)" />

        <!-- ── Q1 (NPN, top): base from N1, collector to +rail, emitter to output ── -->
        <g transform="translate(186,200)">
          <use href="#bjt-npn-shape" />
          <text class="ckt-bjt-label" x="-30" y="-28">Q1</text>
        </g>

        <!-- ── Q2 (PNP, lower): base from N2, emitter to output, collector to −rail ── -->
        <g transform="translate(186,300)">
          <use href="#bjt-pnp-shape" />
          <text class="ckt-bjt-label" x="-30" y="38">Q2</text>
        </g>

        <!-- ── OUTPUT NODE ── -->
        <text class="ckt-io-label" x="225" y="240">Output</text>

        <!-- ── LOAD RL to ground ── -->
        <line x1="300" y1="250" x2="300" y2="350" style="stroke: var(--colour-series)" stroke-width="2" />
        <g transform="translate(300,270)">
          <use href="#resistor-vertical" />
          <text class="ckt-r-label" x="-35" y="40" text-anchor="middle">RL</text>
          <text class="ckt-value" x="40" y="40">8Ω</text>
        </g>
      </g>

      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ── FIG-DARLINGTON-NPN: two NPN in cascade ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="fig-darlington-npn">

        <!-- ── Horizontal Q1 Base In ── -->
        <line x1="10" y1="120" x2="70" y2="120" style="stroke: var(--colour-series)" stroke-width="2" />

        <!-- ── Q1 Collector to Q2 Collector   ── -->
        <line x1="94" y1="40" x2="214" y2="40" style="stroke: var(--colour-series)" stroke-width="2" />
        <line x1="94" y1="40" x2="94" y2="86" style="stroke: var(--colour-series)" stroke-width="2" />
        <line x1="214" y1="20" x2="214" y2="166" style="stroke: var(--colour-series)" stroke-width="2" />

        <!-- ── Q1 Emitter to Q2 Base   ── -->
        <line x1="94" y1="154" x2="94" y2="200" style="stroke: var(--colour-series)" stroke-width="2" />
        <line x1="94" y1="200" x2="183" y2="200" style="stroke: var(--colour-series)" stroke-width="2" />

        <line x1="214" y1="234" x2="214" y2="280" style="stroke: var(--colour-series)" stroke-width="2" />

        <!-- ── Junction dots ── -->
        <circle cx="214" cy="40" r="5" style="fill: var(--colour-series)" />
 
        <!-- ── Components, drawn over the lines ── -->
        <text class="ckt-io-label" x="10" y="115">B</text>
        <text class="ckt-io-label" x="220" y="26">C</text>
        <text class="ckt-io-label" x="220" y="285">E</text>

        <g transform="translate(80,120)">
          <use href="#bjt-npn-shape" />
          <text class="ckt-bjt-label" x="-30" y="-20">Q1</text>
          <text class="ckt-note" x="-62" y="64">driver</text>
        </g>
        <g transform="translate(200,200)">
          <use href="#bjt-npn-shape" />
          <text class="ckt-bjt-label" x="-30" y="-20">Q2</text>
          <text class="ckt-note" x="30" y="60">output</text>
        </g>
      </g>

    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="Output Configurations"></div>
  <header>
    <h1>Power Amplifier Output Configurations</h1>
    <p>Complementary Symmetry · Darlington &amp; Composite Pairs · Driver Transistors · V<sub>BE</sub> Multiplier · Crossover Distortion</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel">
        <div class="panel-label" id="circuitRefLabel">Reference circuit</div>
        <svg id="circuitSvg" viewBox="0 0 360 490" xmlns="http://www.w3.org/2000/svg">
          <use id="circuitRefUse" href="#fig-class-ab" />
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">

            <div class="q-num" id="qNum"></div>

              <div class="q-text" id="qText"></div>

          <div class="options" id="qOptions"></div>

              <div class="match-pool-arrow">▶</div>

          </div>

  </div>

  <script>

    const QUESTIONS = [
      {
        leftPanel: 'circuit',
        circuitId: 'fig-class-ab',
        circuitLabel: 'Complementary output with diode bias',
        circuitViewBox: '0 0 360 490',
        text: () => `Looking at the circuit below, which output configuration is this?`,
        hint: () => `Look at the output devices: one NPN on the positive rail side and one PNP on the negative rail side, with a diode bias string between their bases.`,
        options: () => shuffle([
          { label: 'Class AB complementary symmetry', type: 'correct' },
          { label: 'Class A single-ended', type: 'wrong' },
          { label: 'Simple class B push-pull using two NPN transistors', type: 'wrong' },
          { label: 'Darlington pair', type: 'wrong' },
        ]),
        correctExplain: () => `A <b>complementary</b> output with a <b>diode bias string</b> — a class AB stage`,
        working: () => `
    <div class="working-line">The two outputs are complementary: Q1 is NPN, Q2 is PNP, and both emitters join at the output. Each device drives one half of the waveform.</div>
    <div class="working-total">The diode string D1–D2 between the bases is what makes it class AB rather than class B.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'fig-class-ab',
        circuitLabel: 'Complementary output with diode bias',
        circuitViewBox: '0 0 360 490',
        text: () => `Looking at the same circuit, what voltage appears between the two bases of Q1 and Q2 at zero input?`,
        hint: () => `Each silicon diode drops about 0.6V when it is forward biased.`,
        options: () => shuffle([
          { label: '<span class="colour-voltage">1.2V</span>', type: 'correct' },
          { label: '<span class="colour-voltage">0V</span>', type: 'wrong' },
          { label: '<span class="colour-voltage">0.6V</span>', type: 'wrong' },
          { label: '<span class="colour-voltage">2.4V</span>', type: 'wrong' },
        ]),
        correctExplain: () => `Two diodes in series drop about <span class="colour-voltage">1.2V</span> between the bases`,
        working: () => `
    <div class="working-line">D1 and D2 are in series between the two bases, so their drops add: about <span class="colour-voltage">0.6V</span> + <span class="colour-voltage">0.6V</span> = <span class="colour-voltage">1.2V</span>.</div>
    <div class="working-total">That 1.2V holds both transistors slightly on at zero input, which removes the dead zone that causes crossover distortion.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'fig-darlington-npn',
        circuitLabel: 'NPN Darlington pair',
        circuitViewBox: '0 0 300 300',
        text: () => `Looking at the circuit below, which configuration is shown?`,
        hint: () => `Both transistors are the same type, and the emitter of the first feeds the base of the second.`,
        options: () => shuffle([
          { label: 'NPN Darlington pair', type: 'correct' },
          { label: 'Composite pair', type: 'wrong' },
          { label: 'Quasi-complementary pair', type: 'wrong' },
          { label: 'PNP Darlington pair', type: 'wrong' },
        ]),
        correctExplain: () => `Two NPN transistors in cascade: an <b>NPN Darlington pair</b>`,
        working: () => `
    <div class="working-line">Both devices are NPN. The emitter current of the driver Q1 becomes the base current of the output Q2, so the overall current gain is the product of the two gains.</div>
    <div class="working-line" style="margin-top:.6rem">A composite pair uses <b>different</b> types (NPN with PNP), so it is not this configuration.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'fig-darlington-npn',
        circuitLabel: 'NPN Darlington pair',
        circuitViewBox: '0 0 300 300',
        text: () => `A Darlington pair is made from two transistors with current gains <b>β<sub>1</sub></b> and <b>β<sub>2</sub></b>. What is its overall current gain, approximately?`,
        hint: () => `The driver's emitter current is the output device's base current, so the gains multiply.`,
        options: () => shuffle([
          { label: 'β<sub>1</sub> × β<sub>2</sub>', type: 'correct' },
          { label: 'β<sub>1</sub> + β<sub>2</sub>', type: 'wrong' },
          { label: 'β<sub>1</sub> ÷ β<sub>2</sub>', type: 'wrong' },
          { label: 'The larger of β<sub>1</sub> and β<sub>2</sub>', type: 'wrong' },
        ]),
        correctExplain: () => `Overall gain ≈ <b>β<sub>1</sub> × β<sub>2</sub></b>`,
        working: () => `
    <div class="working-line">I<sub>E1</sub> = I<sub>B2</sub> and I<sub>E2</sub> = β<sub>2</sub> × I<sub>B2</sub> = β<sub>2</sub> × I<sub>E1</sub> = β<sub>2</sub> × (β<sub>1</sub> × I<sub>B1</sub>).</div>
    <div class="working-total">So I<sub>E2</sub> ≈ (β<sub>1</sub> × β<sub>2</sub>) × I<sub>B1</sub>: the gains multiply, which is why a Darlington pair gives very high current gain from one input.</div>`
      },
      {
        text: () => `A <b>composite pair</b> is built from an NPN driver transistor and a PNP output transistor. What type does the combination behave as?`,
        hint: () => `A composite pair is named after the type that its overall terminal behaviour matches: the output device is the one that sets it.`,
        options: () => shuffle([
          { label: 'A PNP transistor', type: 'correct' },
          { label: 'An NPN transistor', type: 'wrong' },
          { label: 'A MOSFET', type: 'wrong' },
          { label: 'A diode', type: 'wrong' },
        ]),
        correctExplain: () => `The composite pair behaves as a <b>PNP</b>, because the PNP output device sets its type`,
        working: () => `
    <div class="working-line">The NPN driver is only there to boost the current gain, and the composite's external base and emitter behave as those of the PNP output. The composite therefore behaves as a PNP.</div>
    <div class="working-total">This is why composite pairs let a single type of output device be made from complementary parts.</div>`
      },
      {
        kind: 'multi',
        text: () => `Click <b style="color:var(--colour-ui-primary)">every</b> genuine purpose of a <b style="color:var(--colour-ui-primary)">driver transistor</b> in an output stage.`,
        hint: () => `Think about what the driver does for the output device, and what the output stage does to the stage that drives it.`,
        options: () => shuffle([
          { label: 'Increases the current gain of the output stage', type: 'correct' },
          { label: 'Reduces the loading the output stage places on the preceding stages', type: 'correct' },
          { label: 'Raises the supply voltage to the output devices', type: 'wrong' },
          { label: 'Removes the need for the output devices', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are genuine purposes of a driver`;
        },
        working: () => `
    <div class="working-line">The output device needs a large base current to supply the load. The driver supplies that current, so the stage as a whole has much higher current gain.</div>
    <div class="working-line" style="margin-top:.6rem">Because the driver's input current is small, the output stage draws little from the preceding stage, so it does not load it down. The driver does <b style="color:var(--colour-ui-wrong)">not</b> set the supply voltage or replace the output devices.</div>`
      },
      {
        text: () => `What is the main purpose of a <b style="color:var(--colour-ui-primary)">V<sub>BE</sub> multiplier</b> in a class AB output stage?`,
        hint: () => `Think about what it replaces, and why its transistor is better suited to the job than plain diodes.`,
        options: () => shuffle([
          { label: 'To provide a multiple of its own V<sub>BE</sub>, replacing two or more bias diodes and matching the output transistors more closely', type: 'correct' },
          { label: 'To amplify the input signal before the output stage', type: 'wrong' },
          { label: 'To protect the load from over-current', type: 'wrong' },
          { label: 'To convert the output from AC to DC', type: 'wrong' },
        ]),
        correctExplain: () => `It gives a multiple of V<sub>BE</sub>, replacing several bias diodes and tracking the output transistors better`,
        working: () => `
    <div class="working-line">Diodes drop a fixed voltage, which is not a good match for the output transistors' V<sub>BE</sub> as temperature changes. The V<sub>BE</sub> multiplier gives a bias voltage that is a chosen multiple of a transistor's V<sub>BE</sub>, so one transistor can set the bias needed by two or more diodes.</div>
    <div class="working-total">Because it is a transistor of the same type, it follows the temperature behaviour of the output devices more closely than diodes do.</div>`
      },
      {
        text: () => `Where is the <b style="color:var(--colour-ui-primary)">V<sub>BE</sub> multiplier</b> transistor normally physically located?`,
        hint: () => `It needs to be at the same temperature as the output transistors so that its bias tracks them.`,
        options: () => shuffle([
          { label: 'On the same heatsink as the output transistors', type: 'correct' },
          { label: 'At the far end of the circuit board, away from the heat', type: 'wrong' },
          { label: 'Inside the load', type: 'wrong' },
          { label: 'On the input coupling capacitor', type: 'wrong' },
        ]),
        correctExplain: () => `On the <b>same heatsink</b> as the output transistors, so it tracks their temperature`,
        working: () => `
    <div class="working-line">As the output transistors heat up, their V<sub>BE</sub> falls. If the multiplier sits at the same temperature, its bias falls with them and the quiescent current stays steady.</div>`
      },
      {
        kind: 'multi',
