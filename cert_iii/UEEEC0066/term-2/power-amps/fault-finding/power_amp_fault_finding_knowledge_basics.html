<!--
  Source material: the teacher's own "Complete power amplifier circuits and
  fault-finding" objectives page, a printed review sheet and an answer sheet.
  The review material is REFERENCE ONLY — every question below, including its
  numbers and wording, is original.

  The reference figure is a block diagram of a complete IC power amplifier
  (input coupling, volume control, IC power amplifier, feedback network,
  output coupling, load and heatsink), drawn in the same <defs> standard as
  the other power-amp quizzes: lines first, then the components over them.

  The maximum output power question is randomised on every resetQuiz()
  (RESET_EXTRA, and once at load for ?q=N deep-links).
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../../assets/theme-init.js"></script>
  <script src="../../../../assets/quiz-engine.js"></script>
  <title>Power Amplifier Fault-Finding Knowledge Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../assets/quiz-common.css">
  <script src="../../../../assets/breadcrumb.js" defer></script>
  <style>
    .blk-box { fill: var(--colour-panel); stroke: var(--colour-ui-primary); stroke-width: 1.5px; }
    .heatsink-box { fill: none; stroke: var(--colour-voltage-label); stroke-width: 1.5px; stroke-dasharray: 5,4; }
    .blk-label { fill: var(--colour-ui-primary); font-size: 15px; font-weight: 700; text-anchor: middle; }
    .blk-sub { fill: var(--colour-text); font-size: 12px; text-anchor: middle; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 14px; font-weight: 700; }
    .fb-line { stroke: var(--colour-series); stroke-width: 2px; fill: none; }
    .sig-line { stroke: var(--colour-signal); stroke-width: 2px; fill: none; }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- ════════════════════════════════════════════════════════════ -->
      <!--                      BLOCK SHAPES                            -->
      <!-- ════════════════════════════════════════════════════════════ -->
      <g id="ground-shape">
        <line x1="0" y1="0" x2="0" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
        <line x1="-14" y1="15" x2="14" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
        <line x1="-9" y1="20" x2="9" y2="20" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
        <line x1="-4" y1="25" x2="4" y2="25" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
      </g>

      <!-- ════════════════════════════════════════════════════════════ -->
      <!--                 COMPLETE IC POWER AMPLIFIER                  -->
      <!-- ════════════════════════════════════════════════════════════ -->
      <g id="fig-ic-amp">

        <!-- ── LINES FIRST: each wire drawn full length, components sit on top ── -->
        <!-- input signal: source to IC input, past C2 and the volume junction -->
        <line x1="20" y1="120" x2="160" y2="120" class="sig-line" />
        <!-- volume control R1: full run from the input line down to ground -->
        <line x1="100" y1="120" x2="100" y2="250" class="sig-line" />
        <!-- feedback: IC output down, along the bottom, back up into the input line -->
        <path d="M340 120 V210 H130 V120" class="fb-line" />
        <!-- output: IC output across to the load -->
        <line x1="340" y1="120" x2="540" y2="120" class="sig-line" />
        <!-- RL: full run from the output line down to ground -->
        <line x1="520" y1="120" x2="520" y2="250" class="sig-line" />
        <!-- supply: rail stub into the IC supply pin -->
        <line x1="250" y1="20" x2="250" y2="70" style="stroke: var(--colour-voltage-label)" stroke-width="2" />

        <!-- ── COMPONENTS OVER THE LINES ── -->
        <!-- C2: input coupling capacitor -->
        <rect x="70" y="105" width="20" height="30" rx="2" class="blk-box" />
        <text class="ckt-r-label" x="80" y="98" text-anchor="middle">C2</text>

        <!-- R1: volume control to ground -->
        <g transform="translate(100,190)">
          <rect x="-10" y="0" width="20" height="30" rx="2" class="blk-box" />
          <text class="ckt-r-label" x="-14" y="22" text-anchor="end">R1</text>
        </g>
        <use href="#ground-shape" transform="translate(100,250)" />

        <!-- heatsink around the IC -->
        <rect x="150" y="58" width="200" height="124" rx="4" class="heatsink-box" />
        <text class="ckt-rail-label" x="158" y="52" text-anchor="start">heatsink</text>

        <!-- IC block -->
        <g transform="translate(160,70)">
          <rect width="180" height="100" rx="4" class="blk-box" />
          <text class="blk-label" x="90" y="36">IC power</text>
          <text class="blk-label" x="90" y="54">amplifier</text>
          <text class="blk-sub" x="90" y="76">(e.g. LM383)</text>
        </g>

        <!-- R3 and C3: feedback network, in series in the feedback path -->
        <rect x="220" y="200" width="20" height="20" rx="2" class="blk-box" />
        <text class="ckt-r-label" x="230" y="236" text-anchor="middle">R3</text>
        <rect x="280" y="200" width="20" height="20" rx="2" class="blk-box" />
        <text class="ckt-r-label" x="290" y="236" text-anchor="middle">C3</text>

        <!-- C4: output coupling capacitor -->
        <rect x="380" y="105" width="20" height="30" rx="2" class="blk-box" />
        <text class="ckt-r-label" x="390" y="98" text-anchor="middle">C4</text>

        <!-- RL: load to ground -->
        <g transform="translate(508,150)">
          <rect x="0" y="0" width="24" height="40" rx="2" class="blk-box" />
          <text class="ckt-r-label" x="34" y="24">RL</text>
        </g>
        <use href="#ground-shape" transform="translate(520,250)" />

        <text class="ckt-io-label" x="20" y="112">Input</text>
        <text class="ckt-rail-label" x="258" y="18">+Vs</text>
        <text class="ckt-io-label" x="450" y="112">Output</text>
      </g>

    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="Power Amplifier Fault-Finding"></div>
  <header>
    <h1>Power Amplifier Fault-Finding</h1>
    <p>Complete IC Amplifiers · Heatsinking · Fault Symptoms · Output Power</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel">
        <div class="panel-label" id="circuitRefLabel">Complete IC power amplifier (block diagram)</div>
        <svg id="circuitSvg" viewBox="0 0 580 280" xmlns="http://www.w3.org/2000/svg">
          <use id="circuitRefUse" href="#fig-ic-amp" />
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>

          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    // ── Randomised maximum output power (last question) ──
    function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function fmtNum(n) { return Number(n.toPrecision(3)).toString(); }

    let P = {};
    function randomizePower() {
      const vp = randPick([20, 25, 30, 35]);
      const rl = randPick([4, 8]);
      P = { vp, rl, pmax: (vp * vp) / (2 * rl) };
    }
    randomizePower();

    const QUESTIONS = [
      {
        // Symptom: C2 open.
        leftPanel: 'circuit',
        circuitId: 'fig-ic-amp',
        circuitLabel: 'Complete IC power amplifier (block diagram)',
        circuitViewBox: '0 0 580 280',
        text: () => `Looking at the diagram, the input coupling capacitor <b style="color:var(--colour-ui-primary)">C2</b> develops an open circuit. What happens to the output?`,
        hint: () => `Think about whether any input signal can reach the IC through C2.`,
        options: () => shuffle([
          { label: 'No input signal reaches the IC, so there is no output signal', type: 'correct' },
          { label: 'The output is clipped at both peaks', type: 'wrong' },
          { label: 'The output doubles in amplitude', type: 'wrong' },
          { label: 'Only the negative half of the output is lost', type: 'wrong' },
        ]),
        correctExplain: () => `An open <b>C2</b> stops the input signal reaching the IC: no output`,
        working: () => `
    <div class="working-line">C2 is the series coupling capacitor between the input and the IC. With it open, the signal path is broken, so the IC receives nothing to amplify. The supply is normal, so the symptom is silence with the IC still powered.</div>`
      },
      {
        // Symptom: C3 open (no negative feedback).
        leftPanel: 'circuit',
        circuitId: 'fig-ic-amp',
        circuitLabel: 'Complete IC power amplifier (block diagram)',
        circuitViewBox: '0 0 580 280',
        text: () => `Looking at the same diagram, <b style="color:var(--colour-ui-primary)">C3</b> develops an open circuit in the feedback network. What is the effect on the amplifier?`,
        hint: () => `What does the feedback network do to the gain, and what happens to the gain without it?`,
        options: () => shuffle([
          { label: 'The gain becomes very high, and the output is distorted by clipping at the top and bottom', type: 'correct' },
          { label: 'The gain falls to unity, and the output is a clean copy of the input', type: 'wrong' },
          { label: 'The IC stops drawing supply current', type: 'wrong' },
          { label: 'No change, because C3 only affects the DC level', type: 'wrong' },
        ]),
        correctExplain: () => `Without the feedback path the gain is very high and the output clips`,
        working: () => `
    <div class="working-line">The feedback network sets the closed-loop gain. Removing C3 removes the negative feedback, so the amplifier runs close to its open-loop gain. The output swings past the rails and is clipped at the top and bottom.</div>`
      },
      {
        // Symptom: R3 open, same feedback path.
        leftPanel: 'circuit',
        circuitId: 'fig-ic-amp',
        circuitLabel: 'Complete IC power amplifier (block diagram)',
        circuitViewBox: '0 0 580 280',
        text: () => `Looking at the same diagram, <b style="color:var(--colour-ui-primary)">R3</b> develops an open circuit. Which earlier fault does this most closely match?`,
        hint: () => `Both R3 and C3 are in series in the same feedback path to the IC.`,
        options: () => shuffle([
          { label: 'C3 open circuit, because both remove the negative feedback path', type: 'correct' },
          { label: 'C2 open circuit, because both are in the signal path', type: 'wrong' },
          { label: 'C4 open circuit, because both are at the output', type: 'wrong' },
          { label: 'C1 open circuit, because both are on the supply', type: 'wrong' },
        ]),
        correctExplain: () => `An open <b>R3</b> removes the feedback path, just like an open C3`,
        working: () => `
    <div class="working-line">R3 and C3 are in series in the same feedback path, so an open in either removes the negative feedback. The symptom is the same: very high gain with the output clipped.</div>`
      },
      {
        // Heatsink detached.
        leftPanel: 'circuit',
        circuitId: 'fig-ic-amp',
        circuitLabel: 'Complete IC power amplifier (block diagram)',
        circuitViewBox: '0 0 580 280',
        text: () => `Looking at the same diagram, the IC becomes detached from its <b style="color:var(--colour-ui-primary)">heatsink</b>. What is the most likely result?`,
        hint: () => `The IC dissipates a lot of power as heat when it drives a load.`,
        options: () => shuffle([
          { label: 'It overheats, which may damage or destroy the IC', type: 'correct' },
          { label: 'The gain increases and the output doubles', type: 'wrong' },
          { label: 'The supply voltage rises to compensate', type: 'wrong' },
          { label: 'No effect, because the heatsink only cools the case', type: 'wrong' },
        ]),
        correctExplain: () => `Without its heatsink the IC overheats and may be destroyed`,
        working: () => `
    <div class="working-line">The IC dissipates much of its power as heat. The heatsink carries that heat away. Detached, the IC's temperature rises until it fails or shuts down, so the heatsink is a safety part of the amplifier, not an optional extra.</div>`
      },
      {
        // Purpose of heatsinking.
        text: () => `Why is heatsinking required on the power devices in an amplifier?`,
        hint: () => `Think about where the power the output device does not deliver to the load ends up.`,
        options: () => shuffle([
          { label: 'To remove the heat the devices generate, keeping them within their safe temperature', type: 'correct' },
          { label: 'To increase the gain of the output stage', type: 'wrong' },
          { label: 'To provide the bias voltage for the output devices', type: 'wrong' },
          { label: 'To filter the supply rails', type: 'wrong' },
        ]),
        correctExplain: () => `A heatsink removes heat so the devices stay within their safe temperature`,
        working: () => `
    <div class="working-line">Power that is not delivered to the load is dissipated as heat in the output devices. A heatsink gives that heat a path to the air, keeping the junction temperature below its rated limit.</div>`
      },
      {
        // Mounting two TO-220 devices on one heatsink: components needed.
        kind: 'multi',
        text: () => `Click <b style="color:var(--colour-ui-primary)">every</b> component or item needed to mount two TO-220 output transistors on one heatsink.`,
        hint: () => `The metal tab of a TO-220 is electrically connected to its collector, so think about isolation as well as heat flow.`,
        options: () => shuffle([
          { label: 'Mica washers, to electrically isolate each transistor from the heatsink', type: 'correct' },
          { label: 'Insulating bushes or spacers, to keep the mounting bolts isolated', type: 'correct' },
          { label: 'Silicon heatsink compound, to improve heat transfer', type: 'correct' },
          { label: 'A second supply rail for each transistor', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are needed for the mounting`;
        },
        working: () => `
    <div class="working-line">Each transistor's metal tab is its collector, so the two must be isolated from the heatsink and from each other. Mica washers and insulating bushes do that, while silicon compound fills the small gaps and improves heat flow.</div>
    <div class="working-total">Without isolation the collectors would short together through the common heatsink.</div>`
      },
      {
        // Single-rail IC: why C4 is in the output.
        text: () => `A power IC runs from a <b>single</b> supply rail. Its output pin sits at about half the rail voltage at DC. What is the purpose of the output coupling capacitor <b style="color:var(--colour-ui-primary)">C4</b>?`,
        hint: () => `The load must see the audio signal, but not the DC level at the output pin.`,
        options: () => shuffle([
          { label: 'It blocks the half-rail DC from the load, passing only the audio signal', type: 'correct' },
          { label: 'It sets the gain of the IC', type: 'wrong' },
          { label: 'It smooths the supply rail', type: 'wrong' },
          { label: 'It stops the output device from overheating', type: 'wrong' },
        ]),
        correctExplain: () => `C4 blocks the half-rail DC on the output pin, passing only the audio`,
        working: () => `
    <div class="working-line">With a single rail, the output pin rests at about half the supply voltage. Without C4 that DC would flow through the load, wasting power and possibly damaging the speaker. C4 passes the audio signal and blocks the DC.</div>`
      },
      {
        // Output device shorted: high current.
        text: () => `If an output transistor goes collector-to-emitter short-circuit, what is the most serious effect on the circuit?`,
        hint: () => `Think about what the rail is connected to through the load when the short is in place.`,
        options: () => shuffle([
          { label: 'A very high current flows through the output devices and the load, which can destroy the devices and damage the load', type: 'correct' },
          { label: 'The gain falls to zero, and the output is clean', type: 'wrong' },
          { label: 'The output is halved, with no other effect', type: 'wrong' },
          { label: 'No effect, because the transistor is not in the signal path', type: 'wrong' },
        ]),
        correctExplain: () => `A collector-emitter short puts the rail directly across the load: very high current and a likely device failure`,
        working: () => `
    <div class="working-line">A collector-emitter short connects one supply rail directly through the output stage to the load. The current is limited only by the load and the supply, so the devices and load can be destroyed quickly. A fuse in the supply is the usual protection.</div>`
      },
      {
        // Calculation (randomised): maximum output power.
        text: () => `A power amplifier produces a maximum undistorted peak output of <b>${P.vp} V</b> into a <b>${P.rl} Ω</b> load. Calculate the <b style="color:var(--colour-ui-primary)">maximum output power</b>.`,
        hint: () => `Convert the peak voltage to RMS first (÷ √2), then use P = V²/R. Combined, this is V<sub>p</sub>²/(2R<sub>L</sub>).`,
        options: () => shuffle([
          { label: `P<sub>max</sub> = ${frac('V<sub>p</sub>²', '2R<sub>L</sub>')} = ${frac(`${P.vp}²`, `2 × ${P.rl}`)} = <b>${fmtNum(P.pmax)} W</b>`, type: 'correct' },
          { label: `P<sub>max</sub> = ${frac('V<sub>p</sub>²', 'R<sub>L</sub>')} = ${frac(`${P.vp}²`, `${P.rl}`)} = <b>${fmtNum(P.vp * P.vp / P.rl)} W</b>`, type: 'wrong' },
          { label: `P<sub>max</sub> = ${frac('V<sub>p</sub>', '2R<sub>L</sub>')} = ${frac(`${P.vp}`, `2 × ${P.rl}`)} = <b>${fmtNum(P.vp / (2 * P.rl))} W</b>`, type: 'wrong' },
          { label: `P<sub>max</sub> = ${frac('(2V<sub>p</sub>)²', '2R<sub>L</sub>')} = ${frac(`${2 * P.vp}²`, `2 × ${P.rl}`)} = <b>${fmtNum(4 * P.pmax)} W</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `P<sub>max</sub> = V<sub>p</sub>²/(2R<sub>L</sub>) = <b>${fmtNum(P.pmax)} W</b>`,
        working: () => `
    <div class="working-formula-row">V<sub>L(rms)</sub> = V<sub>p</sub> / √2 = ${P.vp} / √2 = <span class="colour-voltage">${fmtNum(P.vp / Math.SQRT2)} V</span></div>
    <div class="working-formula-row">P<sub>max</sub> = V<sub>L(rms)</sub>² / R<sub>L</sub> = (V<sub>p</sub>²/2) / R<sub>L</sub> = ${frac(`${P.vp}²`, `2 × ${P.rl}`)} = <span class="colour-result">${fmtNum(P.pmax)} W</span></div>`
      }
    ];

    RESET_EXTRA = randomizePower;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
</html>
