<!--
  UEEEC0066 exam revision, term 2 — Book 2 Review Questions (printed booklet JZAI20260611), Section 4 — Effects of Negative Feedback
  (book questions 31–40). Options keep the booklet's A–D order so students can compare with the printed key.
  Marked per the teacher's answer key, except Q7 (key C 75% → marked D 50%) and Q19 (key B → marked A, PNP
  emitters sit 0.6 V ABOVE the base); those worked solutions carry a .key-note explaining the difference.
  Phase 1: text only (leftPanel 'none'). Phase 2 will add diagrams through the circuit panel kept in the markup.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/shapes.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>Review Questions — Section 4: Effects of Negative Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-cap-label { fill: var(--colour-capacitor-labels); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-diode-label { fill: var(--colour-diode-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-note { fill: var(--colour-text); font-size: 13px; font-weight: 700; }
    .ckt-pin { fill: var(--colour-label); font-size: 13px; font-weight: 700; }
    .ckt-block { fill: var(--colour-gain); font-size: 17px; font-weight: 700; }
    #circuitSvg { font-family: 'Share Tech Mono', monospace; }
    .ws-table { border-collapse: collapse; font-size: .85rem; margin: .2rem 0 .6rem; }
    .ws-table th, .ws-table td { border: 1px solid var(--colour-border); padding: .25rem .6rem; text-align: center; }
    .ws-table th { color: var(--colour-label); font-weight: 600; }
    .hl-box { fill: var(--colour-highlight); stroke: var(--colour-ui-primary); stroke-width: 1.5; stroke-dasharray: 6 4; }
    @media(min-width:900px) {
      .quiz-wrap { display: grid;
        grid-template-columns: minmax(340px, min(760px, 58%)) 1fr;
        gap: 1.2rem;
        align-items: start; }
    }
    .book-q { color: var(--colour-label); font-size: .78em; font-weight: 600; letter-spacing: .04em; margin-right: .35rem; }
    .key-note { margin-top: .6rem; padding: .45rem .65rem; border-left: 3px solid var(--colour-ui-wrong); background: rgba(var(--colour-ui-wrong-rgb), .08); font-size: .85rem; line-height: 1.45; }
  </style>
</head>

<body>
  <script>Shapes.use('circuit-components', 'bjt-symbols', 'diodes-led');</script>

  <div class="crumb" id="crumb" data-current="Review Questions · Section 4"></div>
  <header>
    <h1>Review Questions: Section 4</h1>
    <p>Effects of Negative Feedback · Questions 31–40</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()">
        <div class="panel-label" id="circuitRefLabel">Diagram</div>
        <svg id="circuitSvg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <g id="hlLayer"></g>
          <!-- diagrams: phase 2 -->
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 400 300', label: 'Diagram' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        const b = el.getBBox(), p = 7;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q31.
        leftPanel: 'none',
        text: () => `In the general feedback model, the sampling network:`,
        hint: () => `It "samples" the output.`,
        options: () => [
          { label: `Amplifies the signal`, type: 'wrong' },
          { label: `Generates the input signal`, type: 'wrong' },
          { label: `Extracts a portion of the output signal`, type: 'correct' },
          { label: `Sets the transistor bias`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — Extracts a portion of the output signal`,
        working: () => `<div class="working-line">The sampling network takes a <b>fraction of the output</b> (voltage or current) — often just a resistor divider — to send back to the input. The fraction is β.</div>`
      },
      {
        // Book 2 Q32.
        leftPanel: 'none',
        text: () => `The summing network:`,
        hint: () => `It sits at the input of the amplifier.`,
        options: () => [
          { label: `Combines the input signal and feedback signal`, type: 'correct' },
          { label: `Increases supply voltage`, type: 'wrong' },
          { label: `Matches impedance`, type: 'wrong' },
          { label: `Creates common-mode gain`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — Combines the input signal and feedback signal`,
        working: () => `<div class="working-line">The summing (mixing) network <b>combines the input with the fed-back signal</b>; for negative feedback the feedback subtracts, so the amplifier sees only the difference.</div>`
      },
      {
        // Book 2 Q33.
        leftPanel: 'none',
        text: () => `Negative feedback generally causes amplifier gain to:`,
        hint: () => `A<sub>CL</sub> = A<sub>OL</sub> ÷ (1 + A<sub>OL</sub>β).`,
        options: () => [
          { label: `Increase`, type: 'wrong' },
          { label: `Remain unchanged`, type: 'wrong' },
          { label: `Become unstable`, type: 'wrong' },
          { label: `Decrease`, type: 'correct' }
        ],
        correctExplain: () => `<b>D</b> — Decrease`,
        working: () => `<div class="working-line">A<sub>CL</sub> = A<sub>OL</sub> ÷ (1 + A<sub>OL</sub>β), and the bottom line is always more than 1 — the gain <b>decreases</b>. That is the price paid for the improvements below.</div>`
      },
      {
        // Book 2 Q34.
        leftPanel: 'none',
        text: () => `One advantage of negative feedback is:`,
        hint: () => `Distortion added inside the loop is fed back too.`,
        options: () => [
          { label: `Increased distortion`, type: 'wrong' },
          { label: `Reduced bandwidth`, type: 'wrong' },
          { label: `Reduced distortion`, type: 'correct' },
          { label: `Increased drift`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — Reduced distortion`,
        working: () => `<div class="working-line">Distortion produced inside the loop appears at the output, is fed back and subtracted at the input — it is <b>reduced</b> by about (1 + A<sub>OL</sub>β). The other three are all the opposite of what feedback does.</div>`
      },
      {
        // Book 2 Q35.
        leftPanel: 'none',
        text: () => `Negative feedback generally has what effect on bandwidth?`,
        hint: () => `Gain × bandwidth stays roughly constant.`,
        options: () => [
          { label: `It increases bandwidth`, type: 'correct' },
          { label: `It eliminates bandwidth limitations`, type: 'wrong' },
          { label: `It halves bandwidth`, type: 'wrong' },
          { label: `It has no effect`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — It increases bandwidth`,
        working: () => `<div class="working-line">Gain × bandwidth is roughly constant, so trading gain away <b>widens the bandwidth</b> by about (1 + A<sub>OL</sub>β). It improves the limit; it doesn't eliminate it.</div>`
      },
      {
        // Book 2 Q36.
        leftPanel: 'none',
        text: () => `When the open-loop gain is very high, the closed-loop gain is mainly determined by:`,
        hint: () => `What does A<sub>OL</sub> ÷ (1 + A<sub>OL</sub>β) become as A<sub>OL</sub> gets huge?`,
        options: () => [
          { label: `Supply voltage`, type: 'wrong' },
          { label: `Feedback network parameters`, type: 'correct' },
          { label: `Transistor beta only`, type: 'wrong' },
          { label: `Collector resistors only`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Feedback network parameters`,
        working: () => `<div class="working-line">When A<sub>OL</sub>β ≫ 1, A<sub>CL</sub> ≈ 1 ÷ β — set only by the <b>feedback network</b> (e.g. 1 + R<sub>f</sub>/R<sub>1</sub>), not by the transistors. That's why the gain is predictable and stable.</div>`
      },
      {
        // Book 2 Q37.
        leftPanel: 'none',
        text: () => `Applying negative feedback generally improves:`,
        hint: () => `Which of these is something you'd want less of, that feedback actually reduces?`,
        options: () => [
          { label: `Thermal instability`, type: 'wrong' },
          { label: `Distortion levels`, type: 'correct' },
          { label: `Component failure rates`, type: 'wrong' },
          { label: `Noise generation`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Distortion levels`,
        working: () => `<div class="working-line">Feedback <b>reduces distortion</b> (improves the distortion level). "Improves thermal instability" or "noise generation" would mean more of those — and feedback doesn't change how often components fail.</div>`
      },
      {
        // Book 2 Q38.
        leftPanel: 'none',
        text: () => `The purpose of feeding part of the output signal back to the input is to:`,
        hint: () => `Think of all the things feedback sets: gain, bandwidth, distortion, impedances.`,
        options: () => [
          { label: `Increase gain indefinitely`, type: 'wrong' },
          { label: `Remove the output stage`, type: 'wrong' },
          { label: `Control amplifier performance`, type: 'correct' },
          { label: `Increase transistor current gain`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — Control amplifier performance`,
        working: () => `<div class="working-line">Negative feedback lets the designer <b>control</b> the amplifier: a stable, predictable gain, wider bandwidth, lower distortion and chosen input/output impedances. (Increasing gain indefinitely is what <i>positive</i> feedback tends to do.)</div>`
      },
      {
        // Book 2 Q39.
        leftPanel: 'none',
        text: () => `A practical consequence of negative feedback is:`,
        hint: () => `Feedback makes the gain depend on resistors rather than transistors.`,
        options: () => [
          { label: `Improved amplifier stability`, type: 'correct' },
          { label: `Elimination of all faults`, type: 'wrong' },
          { label: `Infinite input impedance`, type: 'wrong' },
          { label: `Zero output impedance`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — Improved amplifier stability`,
        working: () => `<div class="working-line">The gain becomes <b>stable</b> — it hardly changes with temperature, transistor β or ageing. Impedances improve but never become infinite or zero.</div>`
      },
      {
        // Book 2 Q40.
        leftPanel: 'none',
        text: () => `In most amplifier applications, negative feedback is preferred because it produces:`,
        hint: () => `What is given up, and what is gained?`,
        options: () => [
          { label: `Higher distortion and lower bandwidth`, type: 'wrong' },
          { label: `Lower gain but improved overall performance`, type: 'correct' },
          { label: `Infinite gain`, type: 'wrong' },
          { label: `Elimination of phase shift`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Lower gain but improved overall performance`,
        working: () => `<div class="working-line">Feedback trades <b>gain</b> (cheap — transistors have plenty) for <b>better performance</b>: stable gain, wider bandwidth, less distortion and noise, and better impedances.</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
