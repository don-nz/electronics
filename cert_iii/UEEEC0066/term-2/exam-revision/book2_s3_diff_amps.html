<!--
  UEEEC0066 exam revision, term 2 — Book 2 Review Questions (printed booklet JZAI20260611), Section 3 — Differential Amplifiers
  (book questions 21–30). Options keep the booklet's A–D order so students can compare with the printed key.
  Marked per the teacher's answer key, except Q7 (key C 75% → marked D 50%) and Q19 (key B → marked A, PNP
  emitters sit 0.6 V ABOVE the base); those worked solutions carry a .key-note explaining the difference.
  Phase 1: text only (leftPanel 'none'). Phase 2 will add diagrams through the circuit panel kept in the markup.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/shapes.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>Book 2 Review — Section 3: Differential Amplifiers</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-cap-label { fill: var(--colour-capacitor-labels); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-diode-label { fill: var(--colour-diode-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-note { fill: var(--colour-text); font-size: 13px; font-weight: 700; }
    .ckt-pin { fill: var(--colour-label); font-size: 13px; font-weight: 700; }
    .ckt-block { fill: var(--colour-gain); font-size: 17px; font-weight: 700; }
    #circuitSvg { font-family: 'Share Tech Mono', monospace; }
    .ws-table { border-collapse: collapse; font-size: .85rem; margin: .2rem 0 .6rem; }
    .ws-table th, .ws-table td { border: 1px solid var(--colour-border); padding: .25rem .6rem; text-align: center; }
    .ws-table th { color: var(--colour-label); font-weight: 600; }
    .hl-box { fill: var(--colour-highlight); stroke: var(--colour-ui-primary); stroke-width: 1.5; stroke-dasharray: 6 4; }
    @media(min-width:900px) {
      .quiz-wrap { display: grid;
        grid-template-columns: minmax(340px, min(760px, 58%)) 1fr;
        gap: 1.2rem;
        align-items: start; }
    }
    .book-q { color: var(--colour-label); font-size: .78em; font-weight: 600; letter-spacing: .04em; margin-right: .35rem; }
    .key-note { margin-top: .6rem; padding: .45rem .65rem; border-left: 3px solid var(--colour-ui-wrong); background: rgba(var(--colour-ui-wrong-rgb), .08); font-size: .85rem; line-height: 1.45; }
  </style>
</head>

<body>
  <script>Shapes.use('circuit-components', 'bjt-symbols', 'diodes-led');</script>

  <div class="crumb" id="crumb" data-current="Book 2 Review · Section 3"></div>
  <header>
    <h1>Book 2 Review: Section 3</h1>
    <p>Differential Amplifiers · Questions 21–30</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()">
        <div class="panel-label" id="circuitRefLabel">Diagram</div>
        <svg id="circuitSvg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <g id="hlLayer"></g>
          <!-- diagrams: phase 2 -->
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 400 300', label: 'Diagram' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        const b = el.getBBox(), p = 7;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q21.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q21</span>A differential amplifier primarily amplifies:`,
        hint: () => `It's in the name.`,
        options: () => [
          { label: `The average of two signals`, type: 'wrong' },
          { label: `The difference between two signals`, type: 'correct' },
          { label: `Only positive signals`, type: 'wrong' },
          { label: `Only common-mode signals`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — The difference between two signals`,
        working: () => `<div class="working-line">V<sub>out</sub> = A<sub>d</sub> × (V<sub>1</sub> − V<sub>2</sub>). Anything common to both inputs (noise, hum) is ideally ignored.</div>`
      },
      {
        // Book 2 Q22.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q22</span>When identical signals are applied to both inputs simultaneously, the amplifier is operating in:`,
        hint: () => `The signal is common to both inputs.`,
        options: () => [
          { label: `Differential mode`, type: 'wrong' },
          { label: `Push-pull mode`, type: 'wrong' },
          { label: `Common-emitter mode`, type: 'wrong' },
          { label: `Common-mode`, type: 'correct' }
        ],
        correctExplain: () => `<b>D</b> — Common-mode`,
        working: () => `<div class="working-line">The same signal on both inputs is <b>common-mode</b>. Differential mode is when the inputs differ (e.g. equal and opposite).</div>`
      },
      {
        // Book 2 Q23.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q23</span>Ideally, the output of a differential amplifier under pure common-mode operation is:`,
        hint: () => `What is V<sub>1</sub> − V<sub>2</sub> when V<sub>1</sub> = V<sub>2</sub>?`,
        options: () => [
          { label: `Maximum`, type: 'wrong' },
          { label: `Half normal gain`, type: 'wrong' },
          { label: `Zero`, type: 'correct' },
          { label: `Saturated`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — Zero`,
        working: () => `<div class="working-line">Both collectors move by the same amount, so the difference between them is <b>zero</b>. A real amplifier has a small common-mode gain, so a little gets through.</div>`
      },
      {
        // Book 2 Q24.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q24</span>A common application of differential amplifiers is:`,
        hint: () => `Long microphone leads pick up hum on both wires equally.`,
        options: () => [
          { label: `Power supplies only`, type: 'wrong' },
          { label: `Oscillators only`, type: 'wrong' },
          { label: `Switching regulators only`, type: 'wrong' },
          { label: `Low-level microphone inputs`, type: 'correct' }
        ],
        correctExplain: () => `<b>D</b> — Low-level microphone inputs`,
        working: () => `<div class="working-line">A balanced microphone line carries the signal as a difference between two wires; hum and noise are picked up equally on both (common-mode). A differential input amplifies the tiny <b>microphone</b> signal and rejects the noise. The "only" options are all too narrow.</div>`
      },
      {
        // Book 2 Q25.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q25</span>Differential gain is:`,
        hint: () => `A<sub>d</sub> = V<sub>out</sub> ÷ (V<sub>1</sub> − V<sub>2</sub>).`,
        options: () => [
          { label: `The gain applied to the difference between the two inputs`, type: 'correct' },
          { label: `The gain applied to common-mode signals`, type: 'wrong' },
          { label: `The gain measured at DC only`, type: 'wrong' },
          { label: `The gain of the tail resistor`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — The gain applied to the difference between the two inputs`,
        working: () => `<div class="working-line"><b>A<sub>d</sub> = V<sub>out</sub> ÷ (V<sub>1</sub> − V<sub>2</sub>)</b> — the gain for the wanted (difference) signal. It should be large.</div>`
      },
      {
        // Book 2 Q26.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q26</span>Common-mode gain describes:`,
        hint: () => `A<sub>cm</sub> = V<sub>out</sub> ÷ V<sub>cm</sub>.`,
        options: () => [
          { label: `Amplification of differential signals`, type: 'wrong' },
          { label: `Amplification of signals common to both inputs`, type: 'correct' },
          { label: `Voltage gain only at one collector`, type: 'wrong' },
          { label: `Gain caused by transistor beta`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Amplification of signals common to both inputs`,
        working: () => `<div class="working-line"><b>A<sub>cm</sub> = V<sub>out</sub> ÷ V<sub>cm</sub></b> — how much of a signal common to both inputs gets through. It should be as small as possible.</div>`
      },
      {
        // Book 2 Q27.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q27</span>CMRR stands for:`,
        hint: () => `It compares the wanted gain with the unwanted gain.`,
        options: () => [
          { label: `Common Mode Rejection Ratio`, type: 'correct' },
          { label: `Common Mode Response Regulation`, type: 'wrong' },
          { label: `Collector Matching Resistance Ratio`, type: 'wrong' },
          { label: `Current Mode Rejection Response`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — Common Mode Rejection Ratio`,
        working: () => `<div class="working-line"><b>Common Mode Rejection Ratio</b> = A<sub>d</sub> ÷ A<sub>cm</sub>, often given in dB: 20 log(A<sub>d</sub> ÷ A<sub>cm</sub>).</div>`
      },
      {
        // Book 2 Q28.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q28</span>A higher CMRR generally indicates:`,
        hint: () => `CMRR = A<sub>d</sub> ÷ A<sub>cm</sub>.`,
        options: () => [
          { label: `Poor noise rejection`, type: 'wrong' },
          { label: `Lower differential gain`, type: 'wrong' },
          { label: `Better rejection of common-mode signals`, type: 'correct' },
          { label: `Increased distortion`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — Better rejection of common-mode signals`,
        working: () => `<div class="working-line">A higher CMRR means A<sub>d</sub> is much larger than A<sub>cm</sub>: the amplifier <b>rejects common-mode signals</b> (hum, noise) better while still amplifying the difference.</div>`
      },
      {
        // Book 2 Q29.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q29</span>Differential amplifiers are commonly used at the input stage of power amplifiers because they:<div style="margin-top:.45rem;font-size:.85rem;font-weight:normal"><a href="../power-amps/stages/power_amp_stages_knowledge_basics.html" target="_blank" rel="noopener">Explore the stages of a power amplifier ↗</a></div>`,
        hint: () => `Where does the feedback from the output go in a power amplifier?`,
        options: () => [
          { label: `Increase speaker power directly`, type: 'wrong' },
          { label: `Provide both inverting and non-inverting inputs while rejecting noise`, type: 'correct' },
          { label: `Eliminate the need for feedback`, type: 'wrong' },
          { label: `Operate only in Class A`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Provide both inverting and non-inverting inputs while rejecting noise`,
        working: () => `<div class="working-line">One input takes the signal (non-inverting), the other takes the <b>feedback</b> from the output (inverting); the pair amplifies the difference — the error — and rejects common noise. (Worksheet 7: TR2 takes the input, TR3 the feedback.) They make feedback possible rather than replacing it.</div>`
      },
      {
        // Book 2 Q30.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q30</span>Replacing the tail resistor with a constant-current source generally:`,
        hint: () => `A common-mode signal tries to change the tail current. What stops it?`,
        options: () => [
          { label: `Improves CMRR`, type: 'correct' },
          { label: `Reduces bandwidth`, type: 'wrong' },
          { label: `Eliminates differential gain`, type: 'wrong' },
          { label: `Reduces input impedance`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — Improves CMRR`,
        working: () => `<div class="working-line">A common-mode input tries to change the tail current. A <b>constant-current source</b> has a very high dynamic resistance and holds the tail current steady, so the common-mode gain falls sharply and <b>CMRR improves</b>. The differential gain is unaffected. (Worksheet 7: TR1.)</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
