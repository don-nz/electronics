  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      model: { box: '0 0 640 280', label: 'General feedback amplifier model' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => (svg.querySelector(`[data-view="${shownView}"]`) || svg).querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        // bbox in the svg's own coordinates (components carry their own translate)
        const bb = el.getBBox(), p = 7, M = el.getCTM && svg.getCTM() ? svg.getCTM().inverse().multiply(el.getCTM()) : null;
        let b = bb;
        if (M) {
          const xs = [], ys = [];
          [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]].forEach(([x, y]) => {
            xs.push(M.a * x + M.c * y + M.e); ys.push(M.b * x + M.d * y + M.f); });
          b = { x: Math.min(...xs), y: Math.min(...ys), width: Math.max(...xs) - Math.min(...xs), height: Math.max(...ys) - Math.min(...ys) };
        }
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q31.
        leftPanel: 'circuit',
        view: 'model',
        focus: ['SAMP'],
        text: () => `In the general model of a feedback amplifier, what does the sampling network do?`,
        hint: () => `It "samples" the output.`,
        options: () => shuffle([
          { label: `Takes a fraction of the output signal`, type: 'correct' },
          { label: `Amplifies the signal`, type: 'wrong' },
          { label: `Produces the input signal`, type: 'wrong' },
          { label: `Sets the transistor bias`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Takes a fraction of the output signal</b>`,
        working: () => `<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><line x1="30" y1="100" x2="108" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="152" y1="100" x2="600" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><circle cx="450" cy="100" r="5" style="fill: var(--colour-series)" /><line x1="450" y1="100" x2="450" y2="230" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="450" y1="230" x2="130" y2="230" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="130" y1="230" x2="130" y2="122" style="stroke: var(--colour-series)" stroke-width="2" /><polyline points="450,100 450,230 130,230 130,122" fill="none" style="stroke: var(--colour-gain)" stroke-width="4" /><circle cx="30" cy="100" r="5" style="fill: var(--colour-panel); stroke: var(--colour-series)" stroke-width="2" /><circle cx="600" cy="100" r="5" style="fill: var(--colour-panel); stroke: var(--colour-series)" stroke-width="2" /><text class="ckt-io-label" x="30" y="86" text-anchor="middle">V<tspan baseline-shift="sub" font-size="11">in</tspan></text><text class="ckt-io-label" x="600" y="86" text-anchor="middle">V<tspan baseline-shift="sub" font-size="11">out</tspan></text><text class="ckt-io-label" x="142" y="180" text-anchor="start">V<tspan baseline-shift="sub" font-size="11">f</tspan></text><text class="ckt-pin" x="62" y="146" text-anchor="middle">summing</text><text class="ckt-pin" x="62" y="160" text-anchor="middle">network</text><g transform="translate(130,100)"><circle cx="0" cy="0" r="22" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2.5" /><text class="ckt-block" x="0" y="7" text-anchor="middle">Σ</text><text class="ckt-block" x="-30" y="-8" text-anchor="middle">+</text><text class="ckt-block" x="14" y="40" text-anchor="middle">−</text></g><g transform="translate(0,0)"><rect x="210" y="72" width="110" height="56" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-note" x="265.0" y="97.0" text-anchor="middle">amplifier</text><text class="ckt-note" x="265.0" y="113.0" text-anchor="middle">A<tspan baseline-shift="sub" font-size="11">OL</tspan></text></g><g transform="translate(0,0)"><rect x="395" y="72" width="110" height="56" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-note" x="450.0" y="97.0" text-anchor="middle">sampling</text><text class="ckt-note" x="450.0" y="113.0" text-anchor="middle">network</text></g><g transform="translate(0,0)"><rect x="235" y="202" width="120" height="56" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-note" x="295.0" y="227.0" text-anchor="middle">feedback</text><text class="ckt-note" x="295.0" y="243.0" text-anchor="middle">network β</text></g><text class="ckt-note" x="462" y="170" text-anchor="start" style="fill: var(--colour-gain)">a fraction (β)</text><text class="ckt-note" x="462" y="186" text-anchor="start" style="fill: var(--colour-gain)">of V<tspan baseline-shift="sub" font-size="11">out</tspan></text></svg><div class="working-line">The sampling network takes a <b>fraction of the output</b> (voltage or current) — often just a resistor divider — to send back to the input. The fraction is β.</div>`
      },
      {
        // Book 2 Q32.
        leftPanel: 'circuit',
        view: 'model',
        focus: ['SUM'],
        text: () => `In the general feedback model, what does the summing network do?`,
        hint: () => `It sits at the input of the amplifier.`,
        options: () => shuffle([
          { label: `Combines the input signal with the feedback signal`, type: 'correct' },
          { label: `Raises the supply voltage`, type: 'wrong' },
          { label: `Matches impedances`, type: 'wrong' },
          { label: `Creates common-mode gain`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Combines the input signal with the feedback signal</b>`,
        working: () => `<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><line x1="30" y1="100" x2="108" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="152" y1="100" x2="600" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><circle cx="450" cy="100" r="5" style="fill: var(--colour-series)" /><line x1="450" y1="100" x2="450" y2="230" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="450" y1="230" x2="130" y2="230" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="130" y1="230" x2="130" y2="122" style="stroke: var(--colour-series)" stroke-width="2" /><circle cx="30" cy="100" r="5" style="fill: var(--colour-panel); stroke: var(--colour-series)" stroke-width="2" /><circle cx="600" cy="100" r="5" style="fill: var(--colour-panel); stroke: var(--colour-series)" stroke-width="2" /><text class="ckt-io-label" x="30" y="86" text-anchor="middle">V<tspan baseline-shift="sub" font-size="11">in</tspan></text><text class="ckt-io-label" x="600" y="86" text-anchor="middle">V<tspan baseline-shift="sub" font-size="11">out</tspan></text><text class="ckt-io-label" x="142" y="180" text-anchor="start">V<tspan baseline-shift="sub" font-size="11">f</tspan></text><text class="ckt-pin" x="62" y="146" text-anchor="middle">summing</text><text class="ckt-pin" x="62" y="160" text-anchor="middle">network</text><g transform="translate(130,100)"><circle cx="0" cy="0" r="22" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2.5" /><text class="ckt-block" x="0" y="7" text-anchor="middle">Σ</text><text class="ckt-block" x="-30" y="-8" text-anchor="middle">+</text><text class="ckt-block" x="14" y="40" text-anchor="middle">−</text></g><g transform="translate(0,0)"><rect x="210" y="72" width="110" height="56" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-note" x="265.0" y="97.0" text-anchor="middle">amplifier</text><text class="ckt-note" x="265.0" y="113.0" text-anchor="middle">A<tspan baseline-shift="sub" font-size="11">OL</tspan></text></g><g transform="translate(0,0)"><rect x="395" y="72" width="110" height="56" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-note" x="450.0" y="97.0" text-anchor="middle">sampling</text><text class="ckt-note" x="450.0" y="113.0" text-anchor="middle">network</text></g><g transform="translate(0,0)"><rect x="235" y="202" width="120" height="56" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-note" x="295.0" y="227.0" text-anchor="middle">feedback</text><text class="ckt-note" x="295.0" y="243.0" text-anchor="middle">network β</text></g><text class="ckt-note" x="130" y="58" text-anchor="middle" style="fill: var(--colour-signal)">V<tspan baseline-shift="sub" font-size="11">in</tspan> − V<tspan baseline-shift="sub" font-size="11">f</tspan> = error</text><text class="ckt-pin" x="130" y="42" text-anchor="middle">only the error is amplified</text></svg><div class="working-line">The summing (mixing) network <b>combines the input with the fed-back signal</b>; for negative feedback the feedback subtracts, so the amplifier sees only the difference.</div>`
      },
      {
        // Book 2 Q33.
        leftPanel: 'circuit',
        view: 'model',
        focus: ['AMP', 'BETA'],
        text: () => `What does negative feedback normally do to the gain of an amplifier?`,
        hint: () => `A<sub>CL</sub> = A<sub>OL</sub> ÷ (1 + A<sub>OL</sub>β).`,
        options: () => shuffle([
          { label: `Reduces it`, type: 'correct' },
          { label: `Increases it`, type: 'wrong' },
          { label: `Leaves it unchanged`, type: 'wrong' },
          { label: `Makes it unstable`, type: 'wrong' }

        working: () => `<table class="ws-table"><tr><th></th><th>A<sub>OL</sub></th><th>A<sub>CL</sub> (β = 0.01)</th></tr><tr><td>new transistor</td><td>1000</td><td>1000 ÷ 11 = 90.9</td></tr><tr><td>hot / higher β</td><td>2000 <span style="color: var(--colour-ui-wrong)">(+100%)</span></td><td>2000 ÷ 21 = 95.2 <span class="colour-gain">(+5%)</span></td></tr></table><div class="working-line">The gain becomes <b>stable</b> — it hardly changes with temperature, transistor β or ageing. Impedances improve but never become infinite or zero.</div>`
      },
      {
        // Book 2 Q40.
        leftPanel: 'circuit',
        view: 'model',
        text: () => `Why do most amplifiers use negative feedback?`,
        hint: () => `What is given up, and what is gained?`,
        options: () => shuffle([
          { label: `It gives up some gain in exchange for better overall performance`, type: 'correct' },
          { label: `It gives more distortion and less bandwidth`, type: 'wrong' },
          { label: `It gives infinite gain`, type: 'wrong' },
          { label: `It removes all phase shift`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>It gives up some gain in exchange for better overall performance</b>`,
        working: () => `<svg viewBox="0 0 520 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:460px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><rect x="10" y="20" width="220" height="78" rx="8" style="fill: var(--colour-panel); stroke: var(--colour-ui-wrong)" stroke-width="2" /><text class="ckt-block" x="120" y="46" text-anchor="middle" style="fill: var(--colour-ui-wrong)">give up</text><text class="ckt-note" x="30" y="76" text-anchor="start">gain ↓</text><text class="ckt-block" x="260" y="90" text-anchor="middle">⇄</text><rect x="290" y="20" width="220" height="182" rx="8" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-block" x="400" y="46" text-anchor="middle" style="fill: var(--colour-gain)">get back</text><text class="ckt-note" x="310" y="76" text-anchor="start">distortion ↓</text><text class="ckt-note" x="310" y="102" text-anchor="start">bandwidth ↑</text><text class="ckt-note" x="310" y="128" text-anchor="start">stability ↑</text><text class="ckt-note" x="310" y="154" text-anchor="start">drift and noise ↓</text><text class="ckt-note" x="310" y="180" text-anchor="start">gain set by β</text></svg><div class="working-line">Feedback trades <b>gain</b> (cheap — transistors have plenty) for <b>better performance</b>: stable gain, wider bandwidth, less distortion and noise, and better impedances.</div>`

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    // Question order is shuffled on every Restart (like the other review quizzes). The ?q=N deep-link skips
    // RESET_EXTRA (quiz-engine.js), so it still means "the Nth question as written", in the order defined above.
    const ORIGINAL_ORDER = QUESTIONS.slice();
    RESET_EXTRA = () => {
      const order = shuffle(ORIGINAL_ORDER.slice());
      QUESTIONS.length = 0;
      QUESTIONS.push(...order);
    };
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
