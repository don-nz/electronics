<!--
  UEEEC0066 exam revision, term 2 — Book 2 Review Questions (printed booklet JZAI20260611), Section 6 — Classes of Operation
  (book questions 51–60). Options keep the booklet's A–D order so students can compare with the printed key.
  Marked per the teacher's answer key, except Q7 (key C 75% → marked D 50%) and Q19 (key B → marked A, PNP
  emitters sit 0.6 V ABOVE the base); those worked solutions carry a .key-note explaining the difference.
  Phase 1: text only (leftPanel 'none'). Phase 2 will add diagrams through the circuit panel kept in the markup.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/shapes.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>Review Questions — Section 6: Classes of Operation</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-cap-label { fill: var(--colour-capacitor-labels); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-diode-label { fill: var(--colour-diode-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-note { fill: var(--colour-text); font-size: 13px; font-weight: 700; }
    .ckt-pin { fill: var(--colour-label); font-size: 13px; font-weight: 700; }
    .ckt-block { fill: var(--colour-gain); font-size: 17px; font-weight: 700; }
    #circuitSvg { font-family: 'Share Tech Mono', monospace; }
    .ws-table { border-collapse: collapse; font-size: .85rem; margin: .2rem 0 .6rem; }
    .ws-table th, .ws-table td { border: 1px solid var(--colour-border); padding: .25rem .6rem; text-align: center; }
    .ws-table th { color: var(--colour-label); font-weight: 600; }
    .hl-box { fill: var(--colour-highlight); stroke: var(--colour-ui-primary); stroke-width: 1.5; stroke-dasharray: 6 4; }
    @media(min-width:900px) {
      .quiz-wrap { display: grid;
        grid-template-columns: minmax(340px, min(760px, 58%)) 1fr;
        gap: 1.2rem;
        align-items: start; }
    }
    .book-q { color: var(--colour-label); font-size: .78em; font-weight: 600; letter-spacing: .04em; margin-right: .35rem; }
    .key-note { margin-top: .6rem; padding: .45rem .65rem; border-left: 3px solid var(--colour-ui-wrong); background: rgba(var(--colour-ui-wrong-rgb), .08); font-size: .85rem; line-height: 1.45; }
  </style>
</head>

<body>
  <script>Shapes.use('circuit-components', 'bjt-symbols', 'diodes-led');</script>

  <div class="crumb" id="crumb" data-current="Review Questions · Section 6"></div>
  <header>
    <h1>Review Questions: Section 6</h1>
    <p>Classes of Operation · Questions 51–60</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()">
        <div class="panel-label" id="circuitRefLabel">Diagram</div>
        <svg id="circuitSvg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <g id="hlLayer"></g>
          <!-- diagrams: phase 2 -->
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 400 300', label: 'Diagram' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        const b = el.getBBox(), p = 7;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q51.
        leftPanel: 'none',
        text: () => `A Class A amplifier conducts for:`,
        hint: () => `Class A is biased in the middle of its load line.`,
        options: () => [
          { label: `Less than 180°`, type: 'wrong' },
          { label: `180° exactly`, type: 'wrong' },
          { label: `360° of the input cycle`, type: 'correct' },
          { label: `More than 360°`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — 360° of the input cycle`,
        working: () => `<div class="working-line">Biased mid-way, a class A transistor conducts for the <b>whole cycle — 360°</b>. (Nothing can conduct for more than a full cycle.)</div>`
      },
      {
        // Book 2 Q52.
        leftPanel: 'none',
        text: () => `Class A amplifiers are known for:`,
        hint: () => `The transistor never switches off.`,
        options: () => [
          { label: `High efficiency`, type: 'wrong' },
          { label: `Excellent linearity`, type: 'correct' },
          { label: `No bias current`, type: 'wrong' },
          { label: `Transformer-only operation`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Excellent linearity`,
        working: () => `<div class="working-line">Conducting all the time, the transistor never crosses an off/on boundary — <b>excellent linearity</b> (low distortion). The cost is low efficiency, because a large bias current flows even with no signal.</div>`
      },
      {
        // Book 2 Q53.
        leftPanel: 'none',
        text: () => `The maximum theoretical efficiency of a resistor-loaded Class A amplifier is approximately:`,
        hint: () => `The load resistor dissipates DC power all the time.`,
        options: () => [
          { label: `25%`, type: 'correct' },
          { label: `50%`, type: 'wrong' },
          { label: `75%`, type: 'wrong' },
          { label: `100%`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — 25%`,
        working: () => `<div class="working-line">The collector resistor wastes DC power continuously, so at best <b>25%</b> of the supply power reaches the load. Transformer coupling raises this to 50% (Q7).</div>`
      },
      {
        // Book 2 Q54.
        leftPanel: 'none',
        text: () => `A Class B amplifier conducts for approximately:`,
        hint: () => `Each transistor handles one half of the wave.`,
        options: () => [
          { label: `360°`, type: 'wrong' },
          { label: `270°`, type: 'wrong' },
          { label: `180°`, type: 'correct' },
          { label: `90°`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — 180°`,
        working: () => `<div class="working-line">Biased at cut-off, each class B transistor conducts for <b>half a cycle — 180°</b>; a push-pull pair covers the whole wave between them.</div>`
      },
      {
        // Book 2 Q55.
        leftPanel: 'none',
        text: () => `A major problem associated with Class B operation is:`,
        hint: () => `Each transistor needs about 0.6 V before it conducts.`,
        options: () => [
          { label: `Thermal runaway`, type: 'wrong' },
          { label: `Crossover distortion`, type: 'correct' },
          { label: `Transformer saturation`, type: 'wrong' },
          { label: `Frequency instability`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Crossover distortion`,
        working: () => `<div class="working-line">Around 0 V neither transistor has enough V<sub>BE</sub> to conduct — a dead band of about ±0.6 V where the output is flat: <b>crossover distortion</b>.</div>`
      },
      {
        // Book 2 Q56.
        leftPanel: 'none',
        text: () => `Class AB operation is designed primarily to:`,
        hint: () => `A small bias keeps both transistors just turned on.`,
        options: () => [
          { label: `Eliminate power output`, type: 'wrong' },
          { label: `Reduce voltage gain`, type: 'wrong' },
          { label: `Reduce crossover distortion`, type: 'correct' },
          { label: `Reduce bandwidth`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — Reduce crossover distortion`,
        working: () => `<div class="working-line">A small forward bias (diodes or a V<sub>BE</sub> multiplier) keeps both transistors just conducting, so the handover at 0 V is smooth — <b>crossover distortion is removed</b>.</div>`
      },
      {
        // Book 2 Q57.
        leftPanel: 'none',
        text: () => `Class AB conduction angle is:`,
        hint: () => `Between class B and class A.`,
        options: () => [
          { label: `Exactly 180°`, type: 'wrong' },
          { label: `Exactly 360°`, type: 'wrong' },
          { label: `Less than 180°`, type: 'wrong' },
          { label: `More than 180° but less than 360°`, type: 'correct' }
        ],
        correctExplain: () => `<b>D</b> — More than 180° but less than 360°`,
        working: () => `<div class="working-line">Each class AB transistor conducts for a little <b>more than 180°</b> (the extra overlap is the bias) but well <b>under 360°</b>.</div>`
      },
      {
        // Book 2 Q58.
        leftPanel: 'none',
        text: () => `Compared with Class A, Class B amplifiers generally:`,
        hint: () => `How much current flows in class B with no signal?`,
        options: () => [
          { label: `Have lower efficiency`, type: 'wrong' },
          { label: `Have higher efficiency`, type: 'correct' },
          { label: `Have greater distortion under all conditions`, type: 'wrong' },
          { label: `Require transformers`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Have higher efficiency`,
        working: () => `<div class="working-line">With no signal a class B stage draws (almost) no current, so its maximum efficiency is about <b>78.5%</b> against class A's 25–50%. It distorts more at low levels (crossover) but not "under all conditions", and complementary stages need no transformer.</div>`
      },
      {
        // Book 2 Q59.
        leftPanel: 'none',
        text: () => `A Class C amplifier conducts for:`,
        hint: () => `Biased beyond cut-off.`,
        options: () => [
          { label: `More than 360°`, type: 'wrong' },
          { label: `Exactly 360°`, type: 'wrong' },
          { label: `Less than 180°`, type: 'correct' },
          { label: `Exactly 180°`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — Less than 180°`,
        working: () => `<div class="working-line">Biased beyond cut-off, a class C transistor conducts only in short pulses — <b>less than 180°</b> of each cycle.</div>`
      },
      {
        // Book 2 Q60.
        leftPanel: 'none',
        text: () => `Class C amplifiers are commonly used in:`,
        hint: () => `The output is a string of pulses — what can turn pulses back into a sine?`,
        options: () => [
          { label: `Audio power amplifiers`, type: 'wrong' },
          { label: `Differential amplifiers`, type: 'wrong' },
          { label: `RF applications`, type: 'correct' },
          { label: `Instrumentation amplifiers`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — RF applications`,
        working: () => `<div class="working-line">The pulses are far too distorted for audio, but in <b>RF</b> transmitters a tuned LC circuit "rings" and restores a clean sine at one frequency — with very high efficiency.</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
