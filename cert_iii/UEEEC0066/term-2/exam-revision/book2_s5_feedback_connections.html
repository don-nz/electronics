<!--
  UEEEC0066 exam revision, term 2 — Book 2 Review Questions (printed booklet JZAI20260611), Section 5 — Negative Feedback Connections
  (book questions 41–50). Options keep the booklet's A–D order so students can compare with the printed key.
  Marked per the teacher's answer key, except Q7 (key C 75% → marked D 50%) and Q19 (key B → marked A, PNP
  emitters sit 0.6 V ABOVE the base); those worked solutions carry a .key-note explaining the difference.
  Phase 1: text only (leftPanel 'none'). Phase 2 will add diagrams through the circuit panel kept in the markup.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/shapes.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>Book 2 Review — Section 5: Negative Feedback Connections</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-cap-label { fill: var(--colour-capacitor-labels); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-diode-label { fill: var(--colour-diode-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-note { fill: var(--colour-text); font-size: 13px; font-weight: 700; }
    .ckt-pin { fill: var(--colour-label); font-size: 13px; font-weight: 700; }
    .ckt-block { fill: var(--colour-gain); font-size: 17px; font-weight: 700; }
    #circuitSvg { font-family: 'Share Tech Mono', monospace; }
    .ws-table { border-collapse: collapse; font-size: .85rem; margin: .2rem 0 .6rem; }
    .ws-table th, .ws-table td { border: 1px solid var(--colour-border); padding: .25rem .6rem; text-align: center; }
    .ws-table th { color: var(--colour-label); font-weight: 600; }
    .hl-box { fill: var(--colour-highlight); stroke: var(--colour-ui-primary); stroke-width: 1.5; stroke-dasharray: 6 4; }
    @media(min-width:900px) {
      .quiz-wrap { display: grid;
        grid-template-columns: minmax(340px, min(760px, 58%)) 1fr;
        gap: 1.2rem;
        align-items: start; }
    }
    .book-q { color: var(--colour-label); font-size: .78em; font-weight: 600; letter-spacing: .04em; margin-right: .35rem; }
    .key-note { margin-top: .6rem; padding: .45rem .65rem; border-left: 3px solid var(--colour-ui-wrong); background: rgba(var(--colour-ui-wrong-rgb), .08); font-size: .85rem; line-height: 1.45; }
  </style>
</head>

<body>
  <script>Shapes.use('circuit-components', 'bjt-symbols', 'diodes-led');</script>

  <div class="crumb" id="crumb" data-current="Book 2 Review · Section 5"></div>
  <header>
    <h1>Book 2 Review: Section 5</h1>
    <p>Negative Feedback Connections · Questions 41–50</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()">
        <div class="panel-label" id="circuitRefLabel">Diagram</div>
        <svg id="circuitSvg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <g id="hlLayer"></g>
          <!-- diagrams: phase 2 -->
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 400 300', label: 'Diagram' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        const b = el.getBBox(), p = 7;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q41.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q41</span>Voltage-series feedback is commonly used to increase:`,
        hint: () => `Series mixing at the input end — what does that do to the input?`,
        options: () => [
          { label: `Output current`, type: 'wrong' },
          { label: `Input impedance`, type: 'correct' },
          { label: `Power dissipation`, type: 'wrong' },
          { label: `Distortion`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Input impedance`,
        working: () => `<div class="working-line"><b>Series</b> mixing puts the feedback voltage in series with the input, so less input current flows for the same input voltage — the <b>input impedance increases</b>. (Voltage sampling also lowers the output impedance.)</div>`
      },
      {
        // Book 2 Q42.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q42</span>Voltage-shunt feedback generally results in:`,
        hint: () => `Voltage sampling at the output end.`,
        options: () => [
          { label: `Increased input impedance`, type: 'wrong' },
          { label: `Reduced output impedance`, type: 'correct' },
          { label: `Infinite gain`, type: 'wrong' },
          { label: `Higher distortion`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Reduced output impedance`,
        working: () => `<div class="working-line"><b>Voltage</b> sampling holds the output voltage steady as the load changes — the <b>output impedance falls</b>. (Shunt mixing lowers the input impedance too, so A is the wrong way round.)</div>`
      },
      {
        // Book 2 Q43.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q43</span>Current-series feedback samples:`,
        hint: () => `The first word names what is sampled.`,
        options: () => [
          { label: `Input voltage`, type: 'wrong' },
          { label: `Output voltage`, type: 'wrong' },
          { label: `Output current`, type: 'correct' },
          { label: `Base current`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — Output current`,
        working: () => `<div class="working-line"><b>Current</b>-series feedback samples the <b>output current</b> — e.g. the voltage across an emitter resistor, which is proportional to the current through the load.</div>`
      },
      {
        // Book 2 Q44.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q44</span>Current-shunt feedback is characterized by:<div style="margin-top:.45rem;font-size:.85rem;font-weight:normal"><a href="../neg-feedback/connections/neg_feedback_knowledge_connections.html" target="_blank" rel="noopener">Explore the four feedback connections ↗</a></div>`,
        hint: () => `Read the name: first word = sampling, second word = mixing.`,
        options: () => [
          { label: `Series mixing and voltage sampling`, type: 'wrong' },
          { label: `Series mixing and current sampling`, type: 'wrong' },
          { label: `Shunt mixing and voltage sampling`, type: 'wrong' },
          { label: `Shunt mixing and current sampling`, type: 'correct' }
        ],
        correctExplain: () => `<b>D</b> — Shunt mixing and current sampling`,
        working: () => `<div class="working-line">First word, <b>current</b> → current sampling. Second word, <b>shunt</b> → shunt mixing. (Worksheet 6's R7 is a current-shunt connection.)</div>`
      },
      {
        // Book 2 Q45.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q45</span>Voltage-series feedback is commonly used in:`,
        hint: () => `High input impedance and low output impedance — what is that the ideal for?`,
        options: () => [
          { label: `Voltage amplifiers`, type: 'correct' },
          { label: `Oscillators`, type: 'wrong' },
          { label: `Power supplies only`, type: 'wrong' },
          { label: `Rectifiers`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — Voltage amplifiers`,
        working: () => `<div class="working-line">Raising the input impedance and lowering the output impedance is exactly what an ideal <b>voltage amplifier</b> needs (e.g. the non-inverting op-amp, and most power amplifiers). Oscillators use positive feedback.</div>`
      },
      {
        // Book 2 Q46.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q46</span>A major result of voltage-series feedback is:<div style="margin-top:.45rem;font-size:.85rem;font-weight:normal"><a href="../neg-feedback/connections/neg_feedback_knowledge_connections.html" target="_blank" rel="noopener">Explore the four feedback connections ↗</a></div>`,
        hint: () => `Series end → input impedance; voltage end → output impedance.`,
        options: () => [
          { label: `Reduced input impedance`, type: 'wrong' },
          { label: `Increased output impedance`, type: 'wrong' },
          { label: `Increased input impedance and reduced output impedance`, type: 'correct' },
          { label: `Increased distortion`, type: 'wrong' }
        ],
        correctExplain: () => `<b>C</b> — Increased input impedance and reduced output impedance`,
        working: () => `<div class="working-line"><b>Series</b> mixing raises the input impedance; <b>voltage</b> sampling lowers the output impedance. Both together: <b>C</b>.</div>`
      },
      {
        // Book 2 Q47.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q47</span>Current-series feedback tends to:`,
        hint: () => `Only the mixing end affects the input impedance.`,
        options: () => [
          { label: `Increase input impedance`, type: 'correct' },
          { label: `Reduce input impedance`, type: 'wrong' },
          { label: `Eliminate gain`, type: 'wrong' },
          { label: `Cause instability`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — Increase input impedance`,
        working: () => `<div class="working-line"><b>Series</b> mixing always raises the input impedance, whatever is sampled. (Current sampling raises the output impedance as well.) An unbypassed emitter resistor is a familiar example.</div>`
      },
      {
        // Book 2 Q48.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q48</span>In feedback terminology, "series mixing" means the feedback signal is:`,
        hint: () => `Series = one after the other in the input loop.`,
        options: () => [
          { label: `Magnetically coupled`, type: 'wrong' },
          { label: `Added in series with the input signal`, type: 'correct' },
          { label: `Added at the collector`, type: 'wrong' },
          { label: `Applied to the power supply`, type: 'wrong' }
        ],
        correctExplain: () => `<b>B</b> — Added in series with the input signal`,
        working: () => `<div class="working-line">The feedback <b>voltage is in series with the input voltage</b> in the input loop — e.g. fed to the emitter, or to the second input of a differential pair — so the two subtract.</div>`
      },
      {
        // Book 2 Q49.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q49</span>In feedback terminology, "shunt mixing" means the feedback signal is:`,
        hint: () => `Shunt = parallel.`,
        options: () => [
          { label: `Added in parallel with the input signal`, type: 'correct' },
          { label: `Applied to the emitter only`, type: 'wrong' },
          { label: `Applied to the collector only`, type: 'wrong' },
          { label: `Added through a transformer`, type: 'wrong' }
        ],
        correctExplain: () => `<b>A</b> — Added in parallel with the input signal`,
        working: () => `<div class="working-line">The feedback joins the input <b>at the same node</b> — in parallel — as a current, e.g. into the base (or the inverting op-amp input). The currents subtract.</div>`
      },
      {
        // Book 2 Q50.
        leftPanel: 'none',
        text: () => `<span class="book-q">BOOK Q50</span>The feedback topology selected depends primarily on the desired:`,
        hint: () => `Each connection type gives a different pair of input/output impedances.`,
        options: () => [
          { label: `Transistor type`, type: 'wrong' },
          { label: `Supply voltage`, type: 'wrong' },
          { label: `Output power`, type: 'wrong' },
          { label: `Input and output impedance characteristics`, type: 'correct' }
        ],
        correctExplain: () => `<b>D</b> — Input and output impedance characteristics`,
        working: () => `<div class="working-line">Choose <b>series or shunt</b> for the input impedance you want, and <b>voltage or current</b> sampling for the output impedance you want. All four types reduce gain and distortion; the impedances are what set them apart.</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
