  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 600 190', label: 'Three-stage amplifier' },
      twostage: { box: '0 0 610 410', label: 'Two-stage capacitor-coupled amplifier' },
      freq: { box: '0 0 560 280', label: 'Amplifier frequency response' },
      xfmr: { box: '0 0 480 400', label: 'Transformer-coupled stage' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => (svg.querySelector(`[data-view="${shownView}"]`) || svg).querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        // bbox in the svg's own coordinates (components carry their own translate)
        const bb = el.getBBox(), p = 7, M = el.getCTM && svg.getCTM() ? svg.getCTM().inverse().multiply(el.getCTM()) : null;
        let b = bb;
        if (M) {
          const xs = [], ys = [];
          [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]].forEach(([x, y]) => {
            xs.push(M.a * x + M.c * y + M.e); ys.push(M.b * x + M.d * y + M.f); });
          b = { x: Math.min(...xs), y: Math.min(...ys), width: Math.max(...xs) - Math.min(...xs), height: Math.max(...ys) - Math.min(...ys) };
        }
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q1.
        leftPanel: 'circuit',
        text: () => `What is the main reason for connecting amplifier stages one after another?`,
        hint: () => `One stage rarely does everything a system needs.`,
        options: () => shuffle([
          { label: `To raise the overall gain and combine the strengths of different stages`, type: 'correct' },
          { label: `So the stages no longer need biasing`, type: 'wrong' },
          { label: `So a lower supply voltage can be used`, type: 'wrong' },
          { label: `To make faults easier to find`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>To raise the overall gain and combine the strengths of different stages</b>`,
        working: () => `<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:560px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><line x1="69" y1="100" x2="530" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><use href="#ac-source-shape" transform="translate(45,100)" /><polygon points="110,60 110,140 190,100" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2.2" /><text class="ckt-block" x="136" y="106" text-anchor="middle">A<tspan baseline-shift="sub" font-size="12">1</tspan></text><polygon points="250,60 250,140 330,100" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2.2" /><text class="ckt-block" x="276" y="106" text-anchor="middle">A<tspan baseline-shift="sub" font-size="12">2</tspan></text><polygon points="390,60 390,140 470,100" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2.2" /><text class="ckt-block" x="416" y="106" text-anchor="middle">A<tspan baseline-shift="sub" font-size="12">3</tspan></text><rect x="530" y="88" width="14" height="24" style="fill: var(--colour-panel); stroke: var(--colour-series)" stroke-width="2" /><polygon points="544,88 564,70 564,130 544,112" style="fill: var(--colour-panel); stroke: var(--colour-series)" stroke-width="2" /><path d="M 198.0 62 q 5.5 -8 11.0 0 t 11.0 0 t 11.0 0 t 11.0 0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2" /><path d="M 338.0 62 q 5.5 -24 11.0 0 t 11.0 0 t 11.0 0 t 11.0 0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2" /><path d="M 478.0 62 q 5.5 -24 11.0 0 t 11.0 0 t 11.0 0 t 11.0 0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2" /><text class="ckt-pin" x="220" y="44" text-anchor="middle">small</text><text class="ckt-pin" x="360" y="30" text-anchor="middle">bigger</text><text class="ckt-pin" x="500" y="30" text-anchor="middle">+ current</text><text class="ckt-note" x="140" y="166" text-anchor="middle">high R<tspan baseline-shift="sub" font-size="10">in</tspan></text><text class="ckt-pin" x="140" y="184" text-anchor="middle">easy on the source</text><text class="ckt-note" x="280" y="166" text-anchor="middle">big voltage</text><text class="ckt-pin" x="280" y="184" text-anchor="middle">gain</text><text class="ckt-note" x="420" y="166" text-anchor="middle">low R<tspan baseline-shift="sub" font-size="10">out</tspan></text><text class="ckt-pin" x="420" y="184" text-anchor="middle">drives the speaker</text></svg><div class="working-line">Cascading multiplies the gains, and lets each stage do the job it is best at — e.g. a high-input-resistance first stage, a high-gain middle stage and a low-output-resistance last stage. Every stage still needs its own bias, the supply isn't reduced, and more stages make fault finding <i>harder</i>, not easier.</div>`
      },
      {
        // Book 2 Q2.
        leftPanel: 'circuit',
        view: 'main',
        text: () => `How is the total gain of several amplifier stages in cascade found?`,
        hint: () => `Stage 2 amplifies what stage 1 has already amplified.`,
        options: () => shuffle([
          { label: `Multiply the gains of the stages, each measured with the next stage connected`, type: 'correct' },
          { label: `Average the stage gains`, type: 'wrong' },
          { label: `Subtract one stage gain from the other`, type: 'wrong' },
          { label: `Add the stage gains together`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Multiply the gains of the stages, each measured with the next stage connected</b>`,
        working: () => `<svg viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><line x1="30" y1="70" x2="560" y2="70" style="stroke: var(--colour-series)" stroke-width="2" /><polygon points="170,30 170,110 250,70" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2.2" /><text class="ckt-block" x="200" y="76" text-anchor="middle">×20</text><polygon points="360,30 360,110 440,70" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2.2" /><text class="ckt-block" x="390" y="76" text-anchor="middle">×15</text><text class="ckt-value" x="95" y="58" text-anchor="middle">10 mV</text><text class="ckt-value" x="305" y="58" text-anchor="middle">200 mV</text><text class="ckt-value" x="505" y="58" text-anchor="middle">3 V</text><text class="ckt-note" x="300" y="140" text-anchor="middle">A<tspan baseline-shift="sub" font-size="11">T</tspan> = 20 × 15 = 300 (not 20 + 15 = 35)</text></svg><div class="working-line">A<sub>T</sub> = A<sub>1</sub> × A<sub>2</sub> × … — each gain measured with the next stage connected (<b>loaded</b>), because the next stage's input resistance loads the one before it. Two stages of 20 and 15 give 300, not 35. (In decibels the gains <i>add</i>, which is why dB are handy.)</div>`
      },
      {
        // Book 2 Q3.
        leftPanel: 'circuit',
        view: 'twostage',
        focus: ['C2'],
        text: () => `What is the main job of a coupling capacitor between two stages?`,
        hint: () => `What is a capacitor's reactance at 0 Hz, and at signal frequencies?`,
        options: () => shuffle([
          { label: `To let the AC signal through while blocking DC`, type: 'correct' },
          { label: `To let DC through while blocking AC`, type: 'wrong' },
          { label: `To amplify the low frequencies`, type: 'wrong' },
          { label: `To make the amplifier more efficient`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>To let the AC signal through while blocking DC</b>`,
        working: () => `<svg viewBox="0 0 600 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><text class="ckt-note" x="110" y="20" text-anchor="middle">Q1 collector</text><text class="ckt-note" x="490" y="20" text-anchor="middle">Q2 base</text><line x1="30" y1="180" x2="190" y2="180" style="stroke: var(--colour-border)" stroke-width="1.5" /><text class="ckt-pin" x="26" y="184" text-anchor="end">0 V</text><line x1="410" y1="180" x2="570" y2="180" style="stroke: var(--colour-border)" stroke-width="1.5" /><text class="ckt-pin" x="406" y="184" text-anchor="end">0 V</text><path d="M 30 70 q 20.0 -36 40.0 0 t 40.0 0 t 40.0 0 t 40.0 0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.2" /><text class="ckt-pin" x="110" y="112" text-anchor="middle">≈ 7 V DC + signal</text><line x1="200" y1="100" x2="265" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="335" y1="100" x2="400" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="265" y1="100" x2="296" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="296" y1="86" x2="296" y2="114" style="stroke: var(--colour-capacitor)" stroke-width="2.5" /><line x1="304" y1="86" x2="304" y2="114" style="stroke: var(--colour-capacitor)" stroke-width="2.5" /><line x1="304" y1="100" x2="335" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><text class="ckt-cap-label" x="300" y="76" text-anchor="middle">C2</text><path d="M 410 140 q 20.0 -36 40.0 0 t 40.0 0 t 40.0 0 t 40.0 0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.2" /><text class="ckt-pin" x="490" y="112" text-anchor="middle">≈ 2 V DC + same signal</text><text class="ckt-pin" x="300" y="140" text-anchor="middle">passes AC,</text><text class="ckt-pin" x="300" y="156" text-anchor="middle">blocks DC</text></svg><div class="working-line">At DC a capacitor is an open circuit; at signal frequencies its reactance is small. So it <b>passes the AC signal</b> to the next stage while <b>blocking DC</b> — each stage keeps its own bias. A capacitor is passive: it can't amplify anything.</div>`
      },
      {
        // Book 2 Q4.
        leftPanel: 'circuit',
        view: 'freq',
        text: () => `Fitting a larger coupling capacitor usually has which effect?`,
        hint: () => `f<sub>1</sub> = 1 ÷ 2πRC.`,
        options: () => shuffle([
          { label: `The lower cut-off frequency moves down`, type: 'correct' },
          { label: `The upper cut-off frequency moves up`, type: 'wrong' },
          { label: `Distortion increases`, type: 'wrong' },
          { label: `The gain falls`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>The lower cut-off frequency moves down</b>`,
        working: () => `<svg viewBox="0 0 560 285" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><line x1="60" y1="240" x2="525" y2="240" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="60" y1="240" x2="60" y2="40" style="stroke: var(--colour-series)" stroke-width="2" /><polygon points="525,235 535,240 525,245" style="fill: var(--colour-series)" /><polygon points="55,40 60,30 65,40" style="fill: var(--colour-series)" /><text class="ckt-note" x="50" y="60" text-anchor="end">gain</text><text class="ckt-note" x="525" y="262" text-anchor="end">frequency (log)</text><path d="M 70 215 C 110 160, 135 92, 180 84 L 380 84 C 425 92, 450 160, 500 215" fill="none" style="stroke: var(--colour-gain)" stroke-width="3" /><path d="M 30 215 C 70 160, 95 92, 140 84 L 180 84" fill="none" style="stroke: var(--colour-gain)" stroke-width="2.5" stroke-dasharray="7 5" /><line x1="168" y1="88" x2="168" y2="240" style="stroke: var(--colour-label)" stroke-width="1.5" stroke-dasharray="5 4" /><line x1="128" y1="88" x2="128" y2="240" style="stroke: var(--colour-gain)" stroke-width="1.5" stroke-dasharray="5 4" /><path d="M 162 150 L 136 150" style="stroke: var(--colour-ui-correct)" stroke-width="2.5" /><polygon points="138,144 128,150 138,156" style="fill: var(--colour-ui-correct)" /><text class="ckt-block" x="168" y="262" text-anchor="middle">f<tspan baseline-shift="sub" font-size="12">1</tspan></text><text class="ckt-note" x="128" y="280" text-anchor="middle">new f<tspan baseline-shift="sub" font-size="11">1</tspan></text><text class="ckt-note" x="150" y="196" text-anchor="start">bigger C</text></svg><div class="working-line">The coupling capacitor sets the <b>lower</b> roll-off: f<sub>1</sub> = 1 ÷ 2πRC. A bigger C gives a <b>lower f<sub>1</sub></b>, so lower frequencies (more bass) get through. The upper roll-off f<sub>2</sub> is set by small stray and transistor capacitances, not by the coupling capacitor.</div>`
      },
      {
        // Book 2 Q5.
        leftPanel: 'circuit',
        view: 'freq',
        text: () => `Which of these mainly sets the high-frequency cut-off of a multistage amplifier?`,
        hint: () => `At high frequency, which tiny capacitances start to short the signal away?`,
        options: () => shuffle([
          { label: `Stray capacitance in the circuit`, type: 'correct' },
          { label: `Coupling transformers`, type: 'wrong' },
          { label: `The supply voltage`, type: 'wrong' },
          { label: `The emitter bias`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Stray capacitance in the circuit</b>`,
        working: () => `<svg viewBox="0 0 560 285" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><line x1="60" y1="240" x2="525" y2="240" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="60" y1="240" x2="60" y2="40" style="stroke: var(--colour-series)" stroke-width="2" /><polygon points="525,235 535,240 525,245" style="fill: var(--colour-series)" /><polygon points="55,40 60,30 65,40" style="fill: var(--colour-series)" /><text class="ckt-note" x="50" y="60" text-anchor="end">gain</text><text class="ckt-note" x="525" y="262" text-anchor="end">frequency (log)</text><path d="M 70 215 C 110 160, 135 92, 180 84 L 380 84 C 425 92, 450 160, 500 215" fill="none" style="stroke: var(--colour-gain)" stroke-width="3" /><path d="M 392 86 C 425 92, 450 160, 500 215" fill="none" style="stroke: var(--colour-ui-wrong)" stroke-width="4" opacity=".55" /><line x1="392" y1="88" x2="392" y2="240" style="stroke: var(--colour-label)" stroke-width="1.5" stroke-dasharray="5 4" /><text class="ckt-block" x="392" y="262" text-anchor="middle">f<tspan baseline-shift="sub" font-size="12">2</tspan></text><text class="ckt-note" x="470" y="60" text-anchor="middle">stray C shorts</text><text class="ckt-note" x="470" y="76" text-anchor="middle">the signal here</text><text class="ckt-pin" x="110" y="60" text-anchor="middle">coupling C</text><text class="ckt-pin" x="110" y="74" text-anchor="middle">sets f₁</text></svg><div class="working-line">At high frequencies the small <b>stray</b> capacitances (wiring, and the transistor's own junction capacitances, multiplied by the Miller effect) have low reactance and shunt the signal to ground. They set f<sub>2</sub>. Coupling capacitors set f<sub>1</sub>, at the other end of the band.</div>`
      },
      {
        // Book 2 Q6.
        leftPanel: 'circuit',
        view: 'xfmr',
        focus: ['T1'],
        text: () => `Transformer coupling is especially valuable for:`,
        hint: () => `A transformer's turns ratio changes how a load "looks" from the primary side.`,
        options: () => shuffle([
          { label: `Matching the impedance of one stage to the load`, type: 'correct' },
          { label: `Removing distortion completely`, type: 'wrong' },
          { label: `Widening the bandwidth`, type: 'wrong' },
          { label: `Lowering the collector current`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Matching the impedance of one stage to the load</b>`,
        working: () => `<svg viewBox="0 0 560 170" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><rect x="232" y="30" width="22" height="100" style="fill: var(--colour-panel)" /><path d="M 240 30 a 10 10 0 0 1 0 20 a 10 10 0 0 1 0 20 a 10 10 0 0 1 0 20 a 10 10 0 0 1 0 20 a 10 10 0 0 1 0 20" fill="none" style="stroke: var(--colour-series)" stroke-width="2.2" /><rect x="304" y="30" width="18" height="100" style="fill: var(--colour-panel)" /><path d="M 316 30 a 10 10 0 0 0 0 20 a 10 10 0 0 0 0 20 a 10 10 0 0 0 0 20 a 10 10 0 0 0 0 20 a 10 10 0 0 0 0 20" fill="none" style="stroke: var(--colour-series)" stroke-width="2.2" /><line x1="275" y1="26" x2="275" y2="134" style="stroke: var(--colour-label)" stroke-width="2" /><line x1="283" y1="26" x2="283" y2="134" style="stroke: var(--colour-label)" stroke-width="2" /><text class="ckt-block" x="279" y="156" text-anchor="middle">10 : 1</text><text class="ckt-pin" x="200" y="70" text-anchor="end">looks like</text><text class="ckt-block" x="200" y="92" text-anchor="end">800 Ω</text><text class="ckt-pin" x="360" y="70" text-anchor="start">speaker</text><text class="ckt-block" x="360" y="92" text-anchor="start">8 Ω</text></svg><div class="working-line">The load seen at the primary is Z<sub>p</sub> = (N<sub>p</sub>/N<sub>s</sub>)² × Z<sub>s</sub>. Choose the turns ratio and an 8 Ω speaker can look like the few hundred ohms a stage wants — <b>impedance matching</b> for maximum power transfer. Transformers add distortion and limit bandwidth rather than improving them.</div>`
      },
      {
        // Book 2 Q7.
        leftPanel: 'circuit',
        view: 'xfmr',
        text: () => `A class A amplifier is coupled to its load through a transformer. What is the highest efficiency it could reach in theory?`,
        hint: () => `Start from the resistor-loaded figure (25%). What does the transformer remove?`,
        options: () => shuffle([
          { label: `About 50%`, type: 'correct' },
          { label: `About 25%`, type: 'wrong' },
          { label: `About 33%`, type: 'wrong' },
          { label: `About 75%`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>About 50%</b>`,
        working: () => `<div class="working-line">A resistor-loaded class A stage wastes DC power in its collector resistor: 25% at most. A transformer primary has almost no DC resistance, so that loss disappears, and the collector can swing up to 2 × V<sub>CC</sub> — the maximum rises to <b>50%</b>.</div>`
      },
      {
        // Book 2 Q8.
        leftPanel: 'circuit',
        view: 'xfmr',
        focus: ['T1'],
        text: () => `Which of these is a drawback of coupling stages with transformers?`,
        hint: () => `Think about what a transformer is physically made of.`,
        options: () => shuffle([
          { label: `They are bulky and heavy`, type: 'correct' },
          { label: `They cannot pass an AC signal`, type: 'wrong' },
          { label: `They give poor gain`, type: 'wrong' },
          { label: `They draw too much DC current`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>They are bulky and heavy</b>`,
        working: () => `<div class="working-line">An iron core and copper windings make transformers <b>large, heavy and expensive</b>, with a limited frequency response. They do pass the AC signal (that's their job) and block DC between the stages.</div>`
      },
      {
        // Book 2 Q9.
        leftPanel: 'circuit',
        view: 'twostage',
        focus: ['C2'],
        text: () => `What happens when a coupling capacitor fails open circuit?`,
        hint: () => `The capacitor is the only path the signal has to the next stage.`,
        options: () => shuffle([
          { label: `The signal no longer reaches the next stage`, type: 'correct' },
          { label: `The gain doubles`, type: 'wrong' },
          { label: `The DC bias rises sharply`, type: 'wrong' },
          { label: `The bandwidth widens`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>The signal no longer reaches the next stage</b>`,
        working: () => `<svg viewBox="0 0 600 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><text class="ckt-note" x="110" y="20" text-anchor="middle">Q1 collector</text><text class="ckt-note" x="490" y="20" text-anchor="middle">Q2 base</text><line x1="30" y1="180" x2="190" y2="180" style="stroke: var(--colour-border)" stroke-width="1.5" /><text class="ckt-pin" x="26" y="184" text-anchor="end">0 V</text><line x1="410" y1="180" x2="570" y2="180" style="stroke: var(--colour-border)" stroke-width="1.5" /><text class="ckt-pin" x="406" y="184" text-anchor="end">0 V</text><path d="M 30 70 q 20.0 -36 40.0 0 t 40.0 0 t 40.0 0 t 40.0 0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.2" /><text class="ckt-pin" x="110" y="112" text-anchor="middle">≈ 7 V DC + signal</text><line x1="200" y1="100" x2="265" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="335" y1="100" x2="400" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="265" y1="100" x2="290" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="290" y1="86" x2="290" y2="114" style="stroke: var(--colour-capacitor)" stroke-width="2.5" /><line x1="310" y1="86" x2="310" y2="114" style="stroke: var(--colour-capacitor)" stroke-width="2.5" /><line x1="310" y1="100" x2="335" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><path d="M 288 70 l 24 24 M 312 70 l -24 24" style="stroke: var(--colour-ui-wrong)" stroke-width="3" /><text class="ckt-note" x="300" y="140" text-anchor="middle">C2 open</text><line x1="410" y1="140" x2="570" y2="140" style="stroke: var(--colour-signal)" stroke-width="2.2" /><text class="ckt-pin" x="490" y="128" text-anchor="middle">≈ 2 V DC, no signal</text></svg><div class="working-line">Open, there is <b>no path for the signal</b> — the next stage receives nothing, so the output disappears (or is very weak). The DC bias doesn't change, because the capacitor was already blocking DC.</div>`

        correctExplain: () => `<b>A resistor</b>`,
        working: () => `<svg viewBox="0 0 600 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><text class="ckt-note" x="110" y="20" text-anchor="middle">Q1 collector</text><text class="ckt-note" x="490" y="20" text-anchor="middle">Q2 base</text><line x1="30" y1="180" x2="190" y2="180" style="stroke: var(--colour-border)" stroke-width="1.5" /><text class="ckt-pin" x="26" y="184" text-anchor="end">0 V</text><line x1="410" y1="180" x2="570" y2="180" style="stroke: var(--colour-border)" stroke-width="1.5" /><text class="ckt-pin" x="406" y="184" text-anchor="end">0 V</text><path d="M 30 70 q 20.0 -36 40.0 0 t 40.0 0 t 40.0 0 t 40.0 0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.2" /><text class="ckt-pin" x="110" y="112" text-anchor="middle">≈ 7 V DC + signal</text><line x1="200" y1="100" x2="265" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="335" y1="100" x2="400" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="265" y1="100" x2="296" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><line x1="296" y1="86" x2="296" y2="114" style="stroke: var(--colour-capacitor)" stroke-width="2.5" /><line x1="304" y1="86" x2="304" y2="114" style="stroke: var(--colour-capacitor)" stroke-width="2.5" /><line x1="304" y1="100" x2="335" y2="100" style="stroke: var(--colour-series)" stroke-width="2" /><text class="ckt-cap-label" x="300" y="76" text-anchor="middle">C2</text><path d="M 270 100 L 270 150 L 282 150" fill="none" style="stroke: var(--colour-series)" stroke-width="2" /><rect x="282" y="141" width="36" height="18" rx="2" style="fill: var(--colour-panel); stroke: var(--colour-resistor)" stroke-width="2" /><path d="M 318 150 L 330 150 L 330 100" fill="none" style="stroke: var(--colour-series)" stroke-width="2" /><text class="ckt-pin" x="300" y="176" text-anchor="middle">leakage = R across C2</text><path d="M 410 92 q 20.0 -32 40.0 0 t 40.0 0 t 40.0 0 t 40.0 0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.2" /><text class="ckt-pin" x="490" y="66" text-anchor="middle">DC leaks through: bias pulled up</text></svg><div class="working-line">A leaky capacitor lets a small <b>DC current</b> through its dielectric — just like a <b>resistor in parallel</b> with it. That DC reaches the next stage and upsets its bias, which is why leaky coupling capacitors cause distorted or shifted outputs.</div>`

    // Question order is shuffled on every Restart (like the other review quizzes). The ?q=N deep-link skips

    RESET_EXTRA = () => {
      const order = shuffle(ORIGINAL_ORDER.slice());
      QUESTIONS.length = 0;
      QUESTIONS.push(...order);
