="2" /><polygon points="7,0 27,-18 27,48 7,30" style="fill: var(--colour-panel); stroke: var(--colour-series)" stroke-width="2" /></g><g transform="translate(250,130)"><use href="#bjt-npn-shape" transform="translate(-14,0)" /><text class="ckt-bjt-label" x="28" y="-20" text-anchor="start">Q1</text></g><g transform="translate(250,270)"><use href="#bjt-pnp-shape" transform="translate(-14,0)" /><text class="ckt-bjt-label" x="28" y="34" text-anchor="start">Q2</text></g><line x1="251" y1="104" x2="251" y2="156" style="stroke: var(--colour-ui-wrong)" stroke-width="4" /><text class="ckt-note" x="222" y="98" text-anchor="end" style="fill: var(--colour-ui-wrong)">C–E short</text><line x1="312" y1="52" x2="312" y2="117" style="stroke: var(--colour-ui-wrong)" stroke-width="2.5" /><polygon points="306,115 318,115 312,125" style="fill: var(--colour-ui-wrong)" /><text class="ckt-pin" x="320" y="80" text-anchor="start" style="fill: var(--colour-ui-wrong)">huge</text><text class="ckt-pin" x="320" y="94" text-anchor="start" style="fill: var(--colour-ui-wrong)">current</text><text class="ckt-note" x="210" y="400" text-anchor="middle" style="fill: var(--colour-ui-wrong)">output stuck at +V<tspan baseline-shift="sub" font-size="10">CC</tspan>: fuse blows / parts overheat</text></svg><div class="working-line">A C–E short connects whatever is at the collector straight to the emitter. In an output stage that puts a rail across the load or the other transistor: <b>excessive current</b>, blown fuses, overheating, and an output stuck at a rail.</div>`

      {

" style="fill: var(--colour-gain)">narrow it down by measuring — no guessing, no swapping good parts</text><text class="ckt-note" x="300" y="142" text-anchor="middle" style="fill: var(--colour-ui-wrong); text-decoration: line-through">replace parts until it works</text></svg><div class="working-line">Working logically from symptoms → supply → stage → component <b>finds the fault faster</b> and avoids replacing good parts. It still needs measurements and circuit knowledge.</div>`

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    // Question order is shuffled on every Restart (like the other review quizzes). The ?q=N deep-link skips
    // RESET_EXTRA (quiz-engine.js), so it still means "the Nth question as written", in the order defined above.
    const ORIGINAL_ORDER = QUESTIONS.slice();
    RESET_EXTRA = () => {
      const order = shuffle(ORIGINAL_ORDER.slice());
      QUESTIONS.length = 0;
      QUESTIONS.push(...order);
    };
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
