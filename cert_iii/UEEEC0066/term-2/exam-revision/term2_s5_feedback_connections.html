        working: () => `<table class="ws-table"><tr><th></th><th>series mixing</th><th>shunt mixing</th></tr><tr><th>voltage sampling</th><td>R<sub>in</sub> ↑ &nbsp;R<sub>out</sub> ↓</td><td>R<sub>in</sub> ↓ &nbsp;R<sub>out</sub> ↓</td></tr><tr><th>current sampling</th><td>R<sub>in</sub> ↑ &nbsp;R<sub>out</sub> ↑</td><td>R<sub>in</sub> ↓ &nbsp;R<sub>out</sub> ↑</td></tr></table><div class="working-line" style="font-size:.85rem">Series mixing raises R<sub>in</sub>, shunt lowers it. Voltage sampling lowers R<sub>out</sub>, current sampling raises it.</div><div class="working-line">Choose <b>series or shunt</b> for the input impedance you want, and <b>voltage or current</b> sampling for the output impedance you want. All four types reduce gain and distortion; the impedances are what set them apart.</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    // Question order is shuffled on every Restart (like the other review quizzes). The ?q=N deep-link skips
    // RESET_EXTRA (quiz-engine.js), so it still means "the Nth question as written", in the order defined above.
    const ORIGINAL_ORDER = QUESTIONS.slice();
    RESET_EXTRA = () => {
      const order = shuffle(ORIGINAL_ORDER.slice());
      QUESTIONS.length = 0;
      QUESTIONS.push(...order);
    };
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
