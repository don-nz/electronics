<!--
  UEEEC0066 exam revision, term 2 — Book 2 Review Questions (printed booklet JZAI20260611), Section 7 — Power Amplifier Output Configurations
  (book questions 61–70). Stems and options are reworded from the handout (same question, same answer) and shuffled on every attempt.
  Marked per the teacher's answer key, except Q7 (key C 75% → marked D 50%) and Q19 (key B → marked A, PNP
  emitters sit 0.6 V ABOVE the base); those worked solutions carry a .key-note explaining the difference.
  Phase 1: text only (leftPanel 'none'). Phase 2 will add diagrams through the circuit panel kept in the markup.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/shapes.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>Review Questions — Section 7: Power Amplifier Output Configurations</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-cap-label { fill: var(--colour-capacitor-labels); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-diode-label { fill: var(--colour-diode-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-note { fill: var(--colour-text); font-size: 13px; font-weight: 700; }
    .ckt-pin { fill: var(--colour-label); font-size: 13px; font-weight: 700; }
    .ckt-block { fill: var(--colour-gain); font-size: 17px; font-weight: 700; }
    #circuitSvg { font-family: 'Share Tech Mono', monospace; }
    .ws-table { border-collapse: collapse; font-size: .85rem; margin: .2rem 0 .6rem; }
    .ws-table th, .ws-table td { border: 1px solid var(--colour-border); padding: .25rem .6rem; text-align: center; }
    .ws-table th { color: var(--colour-label); font-weight: 600; }
    .hl-box { fill: var(--colour-highlight); stroke: var(--colour-ui-primary); stroke-width: 1.5; stroke-dasharray: 6 4; }
    @media(min-width:900px) {
      .quiz-wrap { display: grid;
        grid-template-columns: minmax(340px, min(760px, 58%)) 1fr;
        gap: 1.2rem;
        align-items: start; }
    }
    .book-q { color: var(--colour-label); font-size: .78em; font-weight: 600; letter-spacing: .04em; margin-right: .35rem; }
    .key-note { margin-top: .6rem; padding: .45rem .65rem; border-left: 3px solid var(--colour-ui-wrong); background: rgba(var(--colour-ui-wrong-rgb), .08); font-size: .85rem; line-height: 1.45; }
  </style>
</head>

<body>
  <script>Shapes.use('circuit-components', 'bjt-symbols', 'diodes-led');</script>

  <div class="crumb" id="crumb" data-current="Review Questions · Section 7"></div>
  <header>
    <h1>Review Questions: Section 7</h1>
    <p>Power Amplifier Output Configurations · Questions 61–70</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()">
        <div class="panel-label" id="circuitRefLabel">Diagram</div>
        <svg id="circuitSvg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <g id="hlLayer"></g>
          <!-- diagrams: phase 2 -->
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 400 300', label: 'Diagram' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        const b = el.getBBox(), p = 7;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q61.
        leftPanel: 'none',
        text: () => `What does a push-pull amplifier use?`,
        hint: () => `One "pushes" current into the load, the other "pulls" it out.`,
        options: () => shuffle([
          { label: `Two devices, each handling opposite halves of the wave`, type: 'correct' },
          { label: `A single transistor`, type: 'wrong' },
          { label: `Four differential pairs`, type: 'wrong' },
          { label: `A bridge rectifier`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Two devices, each handling opposite halves of the wave</b>`,
        working: () => `<div class="working-line">One device <b>pushes</b> current into the load on the positive half-cycle and the other <b>pulls</b> it out on the negative half — two devices on opposite halves.</div>`
      },
      {
        // Book 2 Q62.
        leftPanel: 'none',
        text: () => `What is the main reason for using a push-pull output stage?`,
        hint: () => `Each device rests for half the cycle.`,
        options: () => shuffle([
          { label: `To raise efficiency and output power`, type: 'correct' },
          { label: `To lower the gain`, type: 'wrong' },
          { label: `To add distortion`, type: 'wrong' },
          { label: `To do away with biasing`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>To raise efficiency and output power</b>`,
        working: () => `<div class="working-line">Each device rests for half the cycle and draws little current at idle, so a push-pull stage runs in class B/AB — <b>much more efficient</b>, and able to deliver <b>more power</b> than a single class A device.</div>`
      },
      {
        // Book 2 Q63.
        leftPanel: 'none',
        text: () => `What kind of devices does a complementary-symmetry output stage use?<div style="margin-top:.45rem;font-size:.85rem;font-weight:normal"><a href="../power-amps/output-config/output_config_types_bias.html" target="_blank" rel="noopener">Explore output configurations ↗</a></div>`,
        hint: () => `"Complementary" = opposite types.`,
        options: () => shuffle([
          { label: `An NPN and a PNP transistor working as a pair`, type: 'correct' },
          { label: `Two NPN transistors only`, type: 'wrong' },
          { label: `Two PNP transistors only`, type: 'wrong' },
          { label: `Matched resistors only`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>An NPN and a PNP transistor working as a pair</b>`,
        working: () => `<div class="working-line">An <b>NPN</b> handles the positive half and a <b>PNP</b> the negative half, wired symmetrically with their emitters joined at the output.</div>`
      },
      {
        // Book 2 Q64.
        leftPanel: 'none',
        text: () => `Why is an emitter follower often used as the output stage?`,
        hint: () => `A speaker is only 4–8 Ω.`,
        options: () => shuffle([
          { label: `Its output impedance is low`, type: 'correct' },
          { label: `Its voltage gain is high`, type: 'wrong' },
          { label: `It produces high distortion`, type: 'wrong' },
          { label: `It multiplies the frequency`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Its output impedance is low</b>`,
        working: () => `<div class="working-line">An emitter follower has a <b>low output impedance</b> (and high current gain), so it can drive a low-impedance speaker without its voltage collapsing. Its voltage gain is only about 1.</div>`
      },
      {
        // Book 2 Q65.
        leftPanel: 'none',
        text: () => `Roughly what voltage gain does an emitter follower have?`,
        hint: () => `The emitter follows the base, 0.6 V lower.`,
        options: () => shuffle([
          { label: `About 1`, type: 'correct' },
          { label: `About 10`, type: 'wrong' },
          { label: `About 50`, type: 'wrong' },
          { label: `About 100`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>About 1</b>`,
        working: () => `<div class="working-line">The emitter <b>follows</b> the base (0.6 V lower), so the output swing equals the input swing: A<sub>v</sub> ≈ <b>1</b>. The gain it provides is current gain.</div>`
      },
      {
        // Book 2 Q66.
        leftPanel: 'none',
        text: () => `What is the main purpose of a Darlington pair?<div style="margin-top:.45rem;font-size:.85rem;font-weight:normal"><a href="../power-amps/output-config/output_config_types_bias.html" target="_blank" rel="noopener">Explore output configurations ↗</a></div>`,
        hint: () => `The first transistor's emitter current is the second one's base current.`,
        options: () => shuffle([
          { label: `To raise the current gain`, type: 'correct' },
          { label: `To lower the current gain`, type: 'wrong' },
          { label: `To remove the need for biasing`, type: 'wrong' },
          { label: `To add distortion`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>To raise the current gain</b>`,
        working: () => `<div class="working-line">The first transistor's emitter current drives the second one's base, so the gains multiply: β<sub>total</sub> ≈ β<sub>1</sub> × β<sub>2</sub> — a large <b>increase in current gain</b>.</div>`
      },
      {
        // Book 2 Q67.
        leftPanel: 'none',
        text: () => `In a complementary-symmetry amplifier, what does each transistor usually handle?`,
        hint: () => `NPN for one half, PNP for the other.`,
        options: () => shuffle([
          { label: `One handles the positive half-cycles and the other the negative half-cycles`, type: 'correct' },
          { label: `Each handles the whole waveform`, type: 'wrong' },
          { label: `Only noise signals`, type: 'wrong' },
          { label: `Only the bias current`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>One handles the positive half-cycles and the other the negative half-cycles</b>`,
        working: () => `<div class="working-line">The NPN conducts on the <b>positive half-cycles</b> and the PNP on the <b>negative half-cycles</b>; together they rebuild the whole wave in the load.</div>`
      },
      {
        // Book 2 Q68.
        leftPanel: 'none',
        text: () => `Why are power transistors usually mounted on heatsinks?`,
        hint: () => `P = V<sub>CE</sub> × I<sub>C</sub>.`,
        options: () => shuffle([
          { label: `They produce a lot of heat`, type: 'correct' },
          { label: `They produce RF energy`, type: 'wrong' },
          { label: `They cancel out thermal effects`, type: 'wrong' },
          { label: `Their current ratings are low`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>They produce a lot of heat</b>`,
        working: () => `<div class="working-line">Carrying amps with several volts across them, they dissipate P = V<sub>CE</sub> × I<sub>C</sub> — watts of <b>heat</b> that must be removed to keep the junction below its maximum temperature.</div>`
      },
      {
        // Book 2 Q69.
        leftPanel: 'none',
        text: () => `What is thermal runaway?`,
        hint: () => `It's a vicious circle.`,
        options: () => shuffle([
          { label: `A rise in temperature increases the current, which heats the device further`, type: 'correct' },
          { label: `The voltage gain falls to zero`, type: 'wrong' },
          { label: `The frequency response rises without limit`, type: 'wrong' },
          { label: `The supply voltage disappears`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>A rise in temperature increases the current, which heats the device further</b>`,
        working: () => `<div class="working-line">A hotter transistor has a lower V<sub>BE</sub> and passes more current; more current means more heat — and round it goes until the transistor is destroyed. Emitter resistors and a V<sub>BE</sub> multiplier on the heatsink break the circle.</div>`
      },
      {
        // Book 2 Q70.
        leftPanel: 'none',
        text: () => `Why are emitter resistors often fitted in output stages?`,
        hint: () => `Extra current → extra voltage across the resistor → less V<sub>BE</sub>.`,
        options: () => shuffle([
          { label: `For better thermal stability`, type: 'correct' },
          { label: `To add distortion`, type: 'wrong' },
          { label: `To add crossover distortion`, type: 'wrong' },
          { label: `To reduce current sharing`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>For better thermal stability</b>`,
        working: () => `<div class="working-line">Any rise in current increases the drop across the emitter resistor, which reduces V<sub>BE</sub> and pulls the current back — local negative feedback that gives <b>thermal stability</b> (and better current sharing between paralleled devices). (The 0R33s in the Audio Power Amplifier walkthrough.)</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
