<!--
  UEEEC0066 exam revision, term 2 — Worksheet 6 walkthrough (theory exam preparation worksheets,
  "Questions 1 to 5 are multiple choice. For the circuit shown", plus Q6).
  Circuit: two direct-coupled NPN common-emitter stages (Q1, Q2); global negative feedback through
  R7 + C2 from Q2's emitter back to Q1's base. As on the worksheet drawing, the R7 wire crosses
  Q1's emitter lead with no junction dot — drawn here with a hop so it reads as no connection.
  That makes the feedback current-derived (emitter of Q2, I_E x R6) and shunt-fed (into Q1's base).
  Q1 to Q5 keep the worksheet's option order (a to d); Q6 shows a feedback block diagram (view 'block').
  Each question highlights the parts it is about (focus: [...]) — never the answer.
-->

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 660 480', label: 'Two-stage amplifier' },
      block: { box: '0 0 500 285', label: 'Negative feedback — block diagram' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => (svg.querySelector(`[data-view="${shownView}"]`) || svg).querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        // bbox in the svg's own coordinates (components carry their own translate)
        const bb = el.getBBox(), p = 7, M = el.getCTM && svg.getCTM() ? svg.getCTM().inverse().multiply(el.getCTM()) : null;
        let b = bb;
        if (M) {
          const xs = [], ys = [];
          [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]].forEach(([x, y]) => {
            xs.push(M.a * x + M.c * y + M.e); ys.push(M.b * x + M.d * y + M.f); });
          b = { x: Math.min(...xs), y: Math.min(...ys), width: Math.max(...xs) - Math.min(...xs), height: Math.max(...ys) - Math.min(...ys) };
        }
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    // Colour helpers (same as the neg-feedback quizzes): gains in colour-gain, β in colour-bjt.
    const cG = t => `<b class="colour-gain">${t}</b>`, cB = t => `<b class="colour-bjt">${t}</b>`;
    const AOL = cG('A<sub>OL</sub>'), ACL = cG('A<sub>CL</sub>'), BETA = cB('β'), LG = cG('A<sub>OL</sub>β');

    const QUESTIONS = [

      {
        // Worksheet Q1 — type of global negative feedback.
        focus: ['R7', 'C2'],
        text: () => `Which type of global negative feedback is provided by resistor <b class="colour-resistor">R7</b><div style="margin-top:.45rem;font-size:.85rem;font-weight:normal"><a href="../neg-feedback/connections/neg_feedback_knowledge_connections.html" target="_blank" rel="noopener">Explore the four feedback connections ↗</a></div>`,
        hint: () => `Two questions: what does <span class="colour-resistor">R7</span> sample at the output end (a collector = voltage, an emitter resistor = current), and where does it feed in at the input end (a base = shunt, an emitter = series)? Follow the <span class="colour-resistor">R7</span> wire carefully — it crosses <span class="colour-bjt">Q1</span>'s emitter lead without a dot.`,
        options: () => [
          { label: 'Voltage-derived shunt-fed', type: 'wrong' },
          { label: 'Voltage-derived series-fed', type: 'wrong' },
          { label: 'Current-derived shunt-fed', type: 'correct' },
          { label: 'Current-derived series-fed', type: 'wrong' },
        ],
        correctExplain: () => `<b>Current-derived shunt-fed</b> — taken from <span class="colour-bjt">Q2</span>'s emitter, fed into <span class="colour-bjt">Q1</span>'s base`,
        working: () => `
    <div class="working-step">Output end — what is sampled?</div>
    <div class="working-line"><span class="colour-resistor">R7</span> (through <span class="colour-cap">C2</span>) connects to <b><span class="colour-bjt">Q2</span>'s emitter</b>, the top of <span class="colour-resistor">R6</span>. The voltage there is <span class="colour-current">I<sub>E</sub></span> × <span class="colour-resistor">R6</span>, which follows the <b>output current</b> (<span class="colour-current">I<sub>E</sub></span> ≈ <span class="colour-current">I<sub>C</sub></span>, the current through <span class="colour-resistor">R5</span>). A sample proportional to output current = <b>current-derived</b>. (Taken from <span class="colour-bjt">Q2</span>'s collector it would be voltage-derived.)</div>
    <div class="working-step" style="margin-top:.6rem">Input end — where does it go in?</div>
    <div class="working-line">The other end of <span class="colour-resistor">R7</span> goes to <b><span class="colour-bjt">Q1</span>'s base</b> — the same node the input signal arrives at through <span class="colour-cap">C1</span>. Feedback joined in parallel with the input = <b>shunt-fed</b>. The <span class="colour-resistor">R7</span> wire crosses <span class="colour-bjt">Q1</span>'s emitter lead with no dot, so it is <i>not</i> connected to the emitter (that would be series-fed).</div>
    <div class="working-step" style="margin-top:.6rem">Check it is negative:</div>
    <div class="working-line">Base of <span class="colour-bjt">Q1</span> rises → <span class="colour-bjt">Q1</span>'s collector falls (inverts) → <span class="colour-bjt">Q2</span>'s base falls → <span class="colour-bjt">Q2</span>'s emitter falls (follows, no inversion). The signal returned to <span class="colour-bjt">Q1</span>'s base is <b>opposite</b> to the input, so it subtracts: negative feedback ✓</div>
    <div class="working-total">Current-derived shunt-fed is also called <b>current-shunt</b> feedback.</div>`
      },
      {
        // Worksheet Q2 — effect on Rin and Rout.
        focus: ['R7', 'C2'],
        text: () => `The type of global negative feedback provided by <b class="colour-resistor">R7</b> will cause<div style="margin-top:.45rem;font-size:.85rem;font-weight:normal"><a href="../neg-feedback/connections/neg_feedback_knowledge_connections.html" target="_blank" rel="noopener">Explore the four feedback connections ↗</a></div>`,
        hint: () => `The output end decides <span class="colour-impedance">R<sub>out</sub></span> (current-derived holds the output current steady), the input end decides <span class="colour-impedance">R<sub>in</sub></span> (shunt-fed puts a path in parallel with the input).`,
        options: () => [
          { label: `The <span class="colour-impedance">output resistance</span> to increase and the <span class="colour-impedance">input resistance</span> to increase`, type: 'wrong' },
          { label: `The <span class="colour-impedance">output resistance</span> to increase and the <span class="colour-impedance">input resistance</span> to decrease`, type: 'correct' },
          { label: `The <span class="colour-impedance">output resistance</span> to decrease and the <span class="colour-impedance">input resistance</span> to increase`, type: 'wrong' },
          { label: `The <span class="colour-impedance">output resistance</span> to decrease and the <span class="colour-impedance">input resistance</span> to decrease`, type: 'wrong' },
        ],
        correctExplain: () => `<span class="colour-impedance">R<sub>out</sub></span> increases (current-derived), <span class="colour-impedance">R<sub>in</sub></span> decreases (shunt-fed)`,
        working: () => `
    <table class="ws-table">
      <tr><th></th><th>Series-fed</th><th>Shunt-fed</th></tr>
      <tr><th>Input resistance</th><td>increases</td><td><b>decreases</b></td></tr>
      <tr><th></th><th>Voltage-derived</th><th>Current-derived</th></tr>
      <tr><th>Output resistance</th><td>decreases</td><td><b>increases</b></td></tr>
    </table>
    <div class="working-line"><b>Current-derived:</b> the feedback fights any change in output <i>current</i>, so the output behaves more like a current source — <span class="colour-impedance">R<sub>out</sub></span> goes <b>up</b>.</div>
    <div class="working-line"><b>Shunt-fed:</b> <span class="colour-resistor">R7</span> hangs another path off the input node, in parallel with the bias resistors and <span class="colour-bjt">Q1</span>'s base — <span class="colour-impedance">R<sub>in</sub></span> goes <b>down</b>.</div>
    <div class="working-total">Remember it as: each end works on its own — the input end sets <span class="colour-impedance">R<sub>in</sub></span>, the output end sets <span class="colour-impedance">R<sub>out</sub></span>.</div>`
      },
      {
        // Worksheet Q3 — effect on overall gain.
        focus: ['R7', 'C2'],
        text: () => `The global negative feedback provided by <b class="colour-resistor">R7</b> will cause the overall gain of the two-stage amplifier to:`,
        hint: () => `Negative feedback subtracts part of the output from the input. What does that do to the signal the amplifier actually amplifies?`,
        options: () => [
          { label: 'Increase', type: 'wrong' },
          { label: 'Decrease', type: 'correct' },
          { label: 'Remain the same', type: 'wrong' },
          { label: 'Increase or decrease depending on the values of the other feedback resistors', type: 'wrong' },
        ],
        correctExplain: () => `The overall gain <b>decreases</b>`,
        working: () => `
    <div class="working-line">With negative feedback the amplifier only amplifies the <b>difference</b> between the input and the fed-back signal, so for the same input the output is smaller:</div>
    <div class="working-line" style="margin-top:.4rem"><span class="colour-gain">A<sub>CL</sub></span> = ${frac('<span class="colour-gain">A<sub>OL</sub></span>', '1 + <span class="colour-gain">A<sub>OL</sub>β</span>')} — the bottom line is always bigger than 1, so <span class="colour-gain">A<sub>CL</sub></span> &lt; <span class="colour-gain">A<sub>OL</sub></span>.</div>
    <div class="working-total">Negative feedback <b>always</b> lowers the gain — that is the price paid for everything else it improves (stability, bandwidth, distortion). Only <i>positive</i> feedback raises gain.</div>`
      },
      {
        // Worksheet Q4 — effect on bandwidth and distortion.
        focus: ['R7', 'C2'],
        text: () => `In what way will the global negative feedback provided by <b class="colour-resistor">R7</b> affect the overall <b>distortion</b> and <b>bandwidth</b> of the two-stage amplifier?`,
        hint: () => `Gain × bandwidth stays roughly constant. And distortion is an unwanted part of the output — what does feedback do with it?`,
        options: () => [
          { label: 'Bandwidth will decrease and distortion will decrease', type: 'wrong' },
          { label: 'Bandwidth will decrease and distortion will increase', type: 'wrong' },
          { label: 'Bandwidth will increase and distortion will decrease', type: 'correct' },
          { label: 'Bandwidth will increase and distortion will increase', type: 'wrong' },
        ],
        correctExplain: () => `Bandwidth <b>increases</b>, distortion <b>decreases</b>`,
        working: () => `
    <div class="working-line"><b>Bandwidth:</b> gain × bandwidth is roughly constant for an amplifier. Feedback trades gain away, so the bandwidth widens by about the same factor (1 + <span class="colour-gain">A<sub>OL</sub>β</span>).</div>
    <div class="working-line" style="margin-top:.4rem"><b>Distortion:</b> any distortion the transistors add appears at the output, is fed back, and is subtracted at the input in anti-phase — it is reduced by about the same factor (1 + <span class="colour-gain">A<sub>OL</sub>β</span>).</div>
    <div class="working-total">Lower gain buys wider bandwidth, lower distortion, steadier gain and less noise picked up inside the loop.</div>`
      },
      {
        // Worksheet Q5 — AC/DC feedback (C2 in series with R7).
        focus: ['R7', 'C2'],
        text: () => `In terms of the type of signal fed back, the global feedback network provided by <b class="colour-resistor">R7</b> and <b class="colour-cap">C2</b> will be:`,
        hint: () => `<span class="colour-cap">C2</span> is in series with <span class="colour-resistor">R7</span>. What does a capacitor do to DC, and what does it do to AC?`,
        options: () => [
          { label: 'AC only', type: 'correct' },
          { label: 'DC only', type: 'wrong' },
          { label: 'Both AC and DC', type: 'wrong' },
          { label: 'A specific frequency set by <span class="colour-resistor">R7</span> and <span class="colour-cap">C2</span>', type: 'wrong' },
        ],
        correctExplain: () => `<b>AC only</b> — <span class="colour-cap">C2</span> blocks DC`,
        working: () => `
    <div class="working-line"><b class="colour-cap">C2</b> is in series with <span class="colour-resistor">R7</span>, and a capacitor is an open circuit to DC. No DC current can flow in the feedback path, so the feedback acts on the <b>AC (signal)</b> only.</div>
    <div class="working-line" style="margin-top:.4rem">That is deliberate: <span class="colour-bjt">Q2</span>'s emitter and <span class="colour-bjt">Q1</span>'s base sit at different DC voltages, and joining them through <span class="colour-resistor">R7</span> alone would upset <span class="colour-bjt">Q1</span>'s bias. <span class="colour-cap">C2</span> lets the signal feedback work without disturbing either stage's DC conditions.</div>
    <div class="working-total">A series R and C on its own doesn't pick out one frequency — that needs a tuned (LC) circuit. Above a few hertz <span class="colour-cap">C2</span> is effectively a short to the signal.</div>`
      },
      {
        // Worksheet Q6 — closed-loop gain from A_OL and β.
        // Colours as in the neg-feedback quizzes: gains (A_OL, A_CL, A_OLβ) colour-gain, β colour-bjt.
        view: 'block',
        text: () => `An amplifier has an open-loop gain of ${AOL} = <b>1,000</b> and a feedback factor of ${BETA} = <b>0.02</b>. Calculate the amplifier's closed-loop voltage gain, ${ACL}.`,
        hint: () => `${ACL} = ${AOL} ÷ (1 + ${LG}). Work out the loop gain ${LG} first.`,
        options: () => shuffle([
          { label: `${ACL} = ${frac(AOL, `1 + ${AOL}${BETA}`)} = ${frac('1000', '1 + 1000 × 0.02')} = <b class="colour-result">47.6</b>`, type: 'correct' },
          { label: `${ACL} = ${frac('1', BETA)} = ${frac('1', '0.02')} = <b class="colour-result">50</b>`, type: 'wrong' },
          { label: `${ACL} = ${frac(AOL, `1 + ${BETA}`)} = ${frac('1000', '1 + 0.02')} = <b class="colour-result">980.4</b>`, type: 'wrong' },
          { label: `${ACL} = ${AOL} × ${BETA} = 1000 × 0.02 = <b class="colour-result">20</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `${ACL} = 1000 ÷ 21 = <b class="colour-result">47.6</b>`,
        working: () => `
    <div class="working-step">Step 1 — loop gain:</div>
    <div class="working-line">${LG} = 1000 × 0.02 = <b>20</b></div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — closed-loop gain:</div>
    <div class="working-line">${ACL} = ${frac(AOL, `1 + ${LG}`)} = ${frac('1000', '1 + 20')} = <b style="color:var(--colour-ui-correct)">47.6</b></div>
    <div class="working-total"><b>50</b> (1 ÷ ${BETA}) is the <i>ideal</i> answer, true only when ${LG} is very large. Here the loop gain is just 20, so the real gain falls about 5% short of it. <b>980</b> forgets to multiply ${BETA} by ${AOL}, and <b>20</b> is the loop gain ${LG}, not the closed-loop gain.</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
