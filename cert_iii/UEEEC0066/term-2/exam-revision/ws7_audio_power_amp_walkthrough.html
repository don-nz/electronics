<!--
  UEEEC0066 exam revision, term 2 — Worksheet 7 walkthrough (theory exam preparation worksheets).
  Circuit (redrawn from the worksheet): ±30 V discrete audio power amplifier.
    TR1, TR5  PNP constant current sources: two diodes from +30 V (47k to 0 V) fix their bases 1.2 V
              below the rail; R1 500R → 1.2 mA tail for the input pair, R5 100R → 6 mA load for TR4.
    TR2, TR3  PNP long-tailed pair (differential input). TR2 base: input via C1 10uF, R4 10k to 0 V.
              TR3 base: NFB from the output through Rf1 22k; Rf2 1k + C2 47uF to 0 V (AC gain 23, DC gain 1).
              Collector loads R2 / R3 2k2 to −30 V; TR2's collector drives TR4's base.
    TR4       NPN voltage amplifier stage, Cdom 47pF collector-to-base.
    Vbias     drawn as on the worksheet: an unspecified bias block between the drivers' bases.
    TR6+TR7   top composite (complementary feedback) pair: NPN driver, PNP power device, 100R base–emitter.
    TR8+TR9   bottom composite pair: PNP driver, NPN power device, 100R base–emitter.
    0R33 x2   in the power devices' collector leads, either side of OUT.
  Wires crossing without a dot are drawn with hops (the NFB line over the VAS column, TR4's base line
  over TR3's collector lead).
  Conventions: V_BE = 0.6 V; "absolute maximum" power and sensitivity take V_p = the rail (30 V).
  (e) Vbias = 2 x 0.6 = 1.2 V — composite pairs put only the drivers' junctions in the bias path.
  Each question highlights the parts it is about (focus: [...]) — never the answer.
-->

    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 1000 1000', label: 'Worksheet 7 — power amplifier' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        const b = el.getBBox(), p = 7;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [

      {
        // (a) general purpose.
        focus: ['TR7', 'TR9'],
        text: () => `What is the general purpose of this type of amplifier?`,
        hint: () => `Look at the supply rails (±30 V), the 0.33 Ω resistors and the big output transistors. What sort of load needs that much current?`,
        options: () => shuffle([
          { label: 'An <b>audio power amplifier</b> — it delivers enough voltage <i>and current</i> (power) to drive a low-impedance loudspeaker', type: 'correct' },
          { label: 'A <b>small-signal preamplifier</b> — it only raises a microphone\'s millivolt signal to line level', type: 'wrong' },
          { label: 'A <b>regulated power supply</b> — it holds the output at a fixed DC voltage', type: 'wrong' },
          { label: 'An <b>oscillator</b> — it produces its own sine wave with no input', type: 'wrong' },
        ]),
        correctExplain: () => `An audio <b>power</b> amplifier, to drive a loudspeaker`,
        working: () => `
    <div class="working-line">Every stage is there to get a large signal into a <b>low-impedance load</b> (4–8 Ω): a differential input, a voltage amplifier, then a push-pull output stage of power transistors on ±30 V rails, with 0.33 Ω emitter resistors that only make sense at amps of current.</div>
    <div class="working-total">A preamplifier gives voltage gain only, at milliamps. A power amplifier provides <b>current gain</b> too — that is what a speaker needs.</div>`
      },
      {
        // (b) class.
        focus: ['VBIAS', 'TR6', 'TR8'],
        text: () => `In which "class" does this amplifier operate?`,

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
