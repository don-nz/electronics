    rel="stylesheet">

  <style>

    .ckt-cap-label { fill: var(--colour-capacitor-labels); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-diode-label { fill: var(--colour-diode-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }

    .ws-table { border-collapse: collapse; font-size: .85rem; margin: .2rem 0 .6rem; }
    .ws-table th, .ws-table td { border: 1px solid var(--colour-border); padding: .25rem .6rem; text-align: center; }
    .ws-table th { color: var(--colour-label); font-weight: 600; }

    .key-note { margin-top: .6rem; padding: .45rem .65rem; border-left: 3px solid var(--colour-ui-wrong); background: rgba(var(--colour-ui-wrong-rgb), .08); font-size: .85rem; line-height: 1.45; }

<body>
  <script>Shapes.use('circuit-components', 'bjt-symbols', 'diodes-led');</script>

  <div class="crumb" id="crumb" data-current="Review Questions · Section 1"></div>
  <header>
    <h1>Review Questions: Section 1</h1>
    <p>Capacitive &amp; Transformer Coupling · Questions 1–10</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()">
        <div class="panel-label" id="circuitRefLabel">Diagram</div>
        <svg id="circuitSvg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <g id="hlLayer"></g>
          <!-- diagrams: phase 2 -->
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 400 300', label: 'Diagram' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        const b = el.getBBox(), p = 7;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q1.
        leftPanel: 'none',
        text: () => `What is the main reason for connecting amplifier stages one after another?`,
        hint: () => `One stage rarely does everything a system needs.`,
        options: () => shuffle([
          { label: `To raise the overall gain and combine the strengths of different stages`, type: 'correct' },
          { label: `So the stages no longer need biasing`, type: 'wrong' },
          { label: `So a lower supply voltage can be used`, type: 'wrong' },
          { label: `To make faults easier to find`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>To raise the overall gain and combine the strengths of different stages</b>`,
        working: () => `<div class="working-line">Cascading multiplies the gains, and lets each stage do the job it is best at — e.g. a high-input-resistance first stage, a high-gain middle stage and a low-output-resistance last stage. Every stage still needs its own bias, the supply isn't reduced, and more stages make fault finding <i>harder</i>, not easier.</div>`
      },
      {
        // Book 2 Q2.
        leftPanel: 'none',
        text: () => `How is the total gain of several amplifier stages in cascade found?`,
        hint: () => `Stage 2 amplifies what stage 1 has already amplified.`,
        options: () => shuffle([
          { label: `Multiply the gains of the stages, each measured with the next stage connected`, type: 'correct' },
          { label: `Average the stage gains`, type: 'wrong' },
          { label: `Subtract one stage gain from the other`, type: 'wrong' },
          { label: `Add the stage gains together`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Multiply the gains of the stages, each measured with the next stage connected</b>`,
        working: () => `<div class="working-line">A<sub>T</sub> = A<sub>1</sub> × A<sub>2</sub> × … — each gain measured with the next stage connected (<b>loaded</b>), because the next stage's input resistance loads the one before it. Two stages of 20 and 15 give 300, not 35. (In decibels the gains <i>add</i>, which is why dB are handy.)</div>`
      },
      {
        // Book 2 Q3.
        leftPanel: 'none',
        text: () => `What is the main job of a coupling capacitor between two stages?`,
        hint: () => `What is a capacitor's reactance at 0 Hz, and at signal frequencies?`,
        options: () => shuffle([
          { label: `To let the AC signal through while blocking DC`, type: 'correct' },
          { label: `To let DC through while blocking AC`, type: 'wrong' },
          { label: `To amplify the low frequencies`, type: 'wrong' },
          { label: `To make the amplifier more efficient`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>To let the AC signal through while blocking DC</b>`,
        working: () => `<div class="working-line">At DC a capacitor is an open circuit; at signal frequencies its reactance is small. So it <b>passes the AC signal</b> to the next stage while <b>blocking DC</b> — each stage keeps its own bias. A capacitor is passive: it can't amplify anything.</div>`
      },
      {
        // Book 2 Q4.
        leftPanel: 'none',
        text: () => `Fitting a larger coupling capacitor usually has which effect?`,
        hint: () => `f<sub>1</sub> = 1 ÷ 2πRC.`,
        options: () => shuffle([
          { label: `The lower cut-off frequency moves down`, type: 'correct' },
          { label: `The upper cut-off frequency moves up`, type: 'wrong' },
          { label: `Distortion increases`, type: 'wrong' },
          { label: `The gain falls`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>The lower cut-off frequency moves down</b>`,
        working: () => `<div class="working-line">The coupling capacitor sets the <b>lower</b> roll-off: f<sub>1</sub> = 1 ÷ 2πRC. A bigger C gives a <b>lower f<sub>1</sub></b>, so lower frequencies (more bass) get through. The upper roll-off f<sub>2</sub> is set by small stray and transistor capacitances, not by the coupling capacitor.</div>`
      },
      {
        // Book 2 Q5.
        leftPanel: 'none',
        text: () => `Which of these mainly sets the high-frequency cut-off of a multistage amplifier?`,
        hint: () => `At high frequency, which tiny capacitances start to short the signal away?`,
        options: () => shuffle([
          { label: `Stray capacitance in the circuit`, type: 'correct' },
          { label: `Coupling transformers`, type: 'wrong' },
          { label: `The supply voltage`, type: 'wrong' },
          { label: `The emitter bias`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Stray capacitance in the circuit</b>`,
        working: () => `<div class="working-line">At high frequencies the small <b>stray</b> capacitances (wiring, and the transistor's own junction capacitances, multiplied by the Miller effect) have low reactance and shunt the signal to ground. They set f<sub>2</sub>. Coupling capacitors set f<sub>1</sub>, at the other end of the band.</div>`
      },
      {
        // Book 2 Q6.
        leftPanel: 'none',
        text: () => `Transformer coupling is especially valuable for:`,
        hint: () => `A transformer's turns ratio changes how a load "looks" from the primary side.`,
        options: () => shuffle([
          { label: `Matching the impedance of one stage to the load`, type: 'correct' },
          { label: `Removing distortion completely`, type: 'wrong' },
          { label: `Widening the bandwidth`, type: 'wrong' },
          { label: `Lowering the collector current`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Matching the impedance of one stage to the load</b>`,
        working: () => `<div class="working-line">The load seen at the primary is Z<sub>p</sub> = (N<sub>p</sub>/N<sub>s</sub>)² × Z<sub>s</sub>. Choose the turns ratio and an 8 Ω speaker can look like the few hundred ohms a stage wants — <b>impedance matching</b> for maximum power transfer. Transformers add distortion and limit bandwidth rather than improving them.</div>`
      },
      {
        // Book 2 Q7.
        leftPanel: 'none',
        text: () => `A class A amplifier is coupled to its load through a transformer. What is the highest efficiency it could reach in theory?`,
        hint: () => `Start from the resistor-loaded figure (25%). What does the transformer remove?`,
        options: () => shuffle([
          { label: `About 50%`, type: 'correct' },
          { label: `About 25%`, type: 'wrong' },
          { label: `About 33%`, type: 'wrong' },
          { label: `About 75%`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>About 50%</b>`,
        working: () => `<div class="working-line">A resistor-loaded class A stage wastes DC power in its collector resistor: 25% at most. A transformer primary has almost no DC resistance, so that loss disappears, and the collector can swing up to 2 × V<sub>CC</sub> — the maximum rises to <b>50%</b>.<div class="key-note">⚠ The printed answer key gives <b>75%</b>. 75% isn't a class A figure — 78.5% is the class B maximum. The textbook transformer-coupled class A maximum is <b>50%</b>, which is what this quiz marks.</div></div>`
      },
      {
        // Book 2 Q8.
        leftPanel: 'none',
        text: () => `Which of these is a drawback of coupling stages with transformers?`,
        hint: () => `Think about what a transformer is physically made of.`,
        options: () => shuffle([
          { label: `They are bulky and heavy`, type: 'correct' },
          { label: `They cannot pass an AC signal`, type: 'wrong' },
          { label: `They give poor gain`, type: 'wrong' },
          { label: `They draw too much DC current`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>They are bulky and heavy</b>`,
        working: () => `<div class="working-line">An iron core and copper windings make transformers <b>large, heavy and expensive</b>, with a limited frequency response. They do pass the AC signal (that's their job) and block DC between the stages.</div>`
      },
      {
        // Book 2 Q9.
        leftPanel: 'none',
        text: () => `What happens when a coupling capacitor fails open circuit?`,
        hint: () => `The capacitor is the only path the signal has to the next stage.`,
        options: () => shuffle([
          { label: `The signal no longer reaches the next stage`, type: 'correct' },
          { label: `The gain doubles`, type: 'wrong' },
          { label: `The DC bias rises sharply`, type: 'wrong' },
          { label: `The bandwidth widens`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>The signal no longer reaches the next stage</b>`,
        working: () => `<div class="working-line">Open, there is <b>no path for the signal</b> — the next stage receives nothing, so the output disappears (or is very weak). The DC bias doesn't change, because the capacitor was already blocking DC.</div>`
      },
      {
        // Book 2 Q10.
        leftPanel: 'none',
        text: () => `A coupling capacitor that has become leaky acts roughly as if it had which part connected across it?`,
        hint: () => `"Leaky" means a small current flows through the dielectric.`,
        options: () => shuffle([
          { label: `A resistor`, type: 'correct' },
          { label: `A diode`, type: 'wrong' },
          { label: `A transistor`, type: 'wrong' },
          { label: `An inductor`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>A resistor</b>`,
        working: () => `<div class="working-line">A leaky capacitor lets a small <b>DC current</b> through its dielectric — just like a <b>resistor in parallel</b> with it. That DC reaches the next stage and upsets its bias, which is why leaky coupling capacitors cause distorted or shifted outputs.</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
