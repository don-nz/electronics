<!--
  UEEEC0066 exam revision, term 2 — Book 2 Review Questions (printed booklet JZAI20260611), Section 2 — Direct Coupling & Introduction to Differential Amplifiers
  (book questions 11–20). Stems and options are reworded from the handout (same question, same answer) and shuffled on every attempt.
  Marked per the teacher's answer key, except Q7 (key C 75% → marked D 50%) and Q19 (key B → marked A, PNP
  emitters sit 0.6 V ABOVE the base); those worked solutions carry a .key-note explaining the difference.
  Phase 1: text only (leftPanel 'none'). Phase 2 will add diagrams through the circuit panel kept in the markup.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/shapes.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>Review Questions — Section 2: Direct Coupling &amp; Intro to Differential Amplifiers</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-cap-label { fill: var(--colour-capacitor-labels); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-diode-label { fill: var(--colour-diode-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-note { fill: var(--colour-text); font-size: 13px; font-weight: 700; }
    .ckt-pin { fill: var(--colour-label); font-size: 13px; font-weight: 700; }
    .ckt-block { fill: var(--colour-gain); font-size: 17px; font-weight: 700; }
    #circuitSvg { font-family: 'Share Tech Mono', monospace; }
    .ws-table { border-collapse: collapse; font-size: .85rem; margin: .2rem 0 .6rem; }
    .ws-table th, .ws-table td { border: 1px solid var(--colour-border); padding: .25rem .6rem; text-align: center; }
    .ws-table th { color: var(--colour-label); font-weight: 600; }
    .hl-box { fill: var(--colour-highlight); stroke: var(--colour-ui-primary); stroke-width: 1.5; stroke-dasharray: 6 4; }
    @media(min-width:900px) {
      .quiz-wrap { display: grid;
        grid-template-columns: minmax(340px, min(760px, 58%)) 1fr;
        gap: 1.2rem;
        align-items: start; }
    }
    .book-q { color: var(--colour-label); font-size: .78em; font-weight: 600; letter-spacing: .04em; margin-right: .35rem; }
    .key-note { margin-top: .6rem; padding: .45rem .65rem; border-left: 3px solid var(--colour-ui-wrong); background: rgba(var(--colour-ui-wrong-rgb), .08); font-size: .85rem; line-height: 1.45; }
  </style>
</head>

<body>
  <script>Shapes.use('circuit-components', 'bjt-symbols', 'diodes-led');</script>

  <div class="crumb" id="crumb" data-current="Review Questions · Section 2"></div>
  <header>
    <h1>Review Questions: Section 2</h1>
    <p>Direct Coupling &amp; Intro to Differential Amplifiers · Questions 11–20</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()">
        <div class="panel-label" id="circuitRefLabel">Diagram</div>
        <svg id="circuitSvg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <g id="hlLayer"></g>
          <!-- diagrams: phase 2 -->
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 400 300', label: 'Diagram' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        // bbox in the svg's own coordinates (components carry their own translate)
        const bb = el.getBBox(), p = 7, M = el.getCTM && svg.getCTM() ? svg.getCTM().inverse().multiply(el.getCTM()) : null;
        let b = bb;
        if (M) {
          const xs = [], ys = [];
          [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]].forEach(([x, y]) => {
            xs.push(M.a * x + M.c * y + M.e); ys.push(M.b * x + M.d * y + M.f); });
          b = { x: Math.min(...xs), y: Math.min(...ys), width: Math.max(...xs) - Math.min(...xs), height: Math.max(...ys) - Math.min(...ys) };
        }
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q11.
        leftPanel: 'none',
        text: () => `Another name for direct coupling is:`,
        hint: () => `With no capacitor or transformer between the stages, what else gets through besides the signal?`,
        options: () => shuffle([
          { label: `DC coupling`, type: 'correct' },
          { label: `AC coupling`, type: 'wrong' },
          { label: `Transformer coupling`, type: 'wrong' },
          { label: `Optical coupling`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>DC coupling</b>`,
        working: () => `<div class="working-line">The stages are joined by a wire (or resistor), so DC passes from one stage to the next as well as AC — <b>DC coupling</b>. "AC coupling" is the capacitor-coupled kind.</div>`
      },
      {
        // Book 2 Q12.
        leftPanel: 'none',
        text: () => `What is a key benefit of direct coupling between stages?`,
        hint: () => `No coupling capacitor means no f<sub>1</sub>.`,
        options: () => shuffle([
          { label: `It amplifies right down to DC (0 Hz)`, type: 'correct' },
          { label: `It is highly efficient`, type: 'wrong' },
          { label: `It matches impedances automatically`, type: 'wrong' },
          { label: `Its only benefit is fewer parts`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>It amplifies right down to DC (0 Hz)</b>`,
        working: () => `<div class="working-line">Without coupling capacitors there is no lower roll-off: the amplifier works <b>all the way down to 0 Hz (DC)</b>. Op-amps, instrumentation amplifiers and modern power amplifiers rely on it. It does save parts, but that isn't its only benefit.</div>`
      },
      {
        // Book 2 Q13.
        leftPanel: 'none',
        text: () => `What is a key drawback of direct coupling between stages?`,
        hint: () => `If DC passes between stages, so does any slow change in DC.`,
        options: () => shuffle([
          { label: `Drift in DC levels and supply changes are passed on and amplified`, type: 'correct' },
          { label: `The gain is poor`, type: 'wrong' },
          { label: `A lot of signal is lost in the coupling`, type: 'wrong' },
          { label: `The bandwidth is narrow`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Drift in DC levels and supply changes are passed on and amplified</b>`,
        working: () => `<div class="working-line">Any DC shift in an early stage — from temperature or supply changes — is passed on and <b>amplified by every following stage</b>, so the output drifts. Differential input stages and negative feedback are the usual cures.</div>`
      },
      {
        // Book 2 Q14.
        leftPanel: 'none',
        text: () => `Which statement describes a directly coupled amplifier?`,
        hint: () => `What sets the next transistor's base voltage when there's no capacitor in the way?`,
        options: () => shuffle([
          { label: `The DC conditions of one stage set the bias of the next`, type: 'correct' },
          { label: `Capacitors join the stages`, type: 'wrong' },
          { label: `Transformers join the stages`, type: 'wrong' },
          { label: `Each stage is isolated from the others`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>The DC conditions of one stage set the bias of the next</b>`,
        working: () => `<div class="working-line">The DC voltage at one stage's output <b>is</b> the next stage's bias — e.g. Q1's collector voltage is Q2's base voltage. That's why directly coupled stages have to be designed (and fault-found) together.</div>`
      },
      {
        // Book 2 Q15.
        leftPanel: 'none',
        text: () => `What is a differential amplifier commonly called?`,
        hint: () => `Two transistors share one emitter resistor — the "tail".`,
        options: () => shuffle([
          { label: `A long-tailed pair`, type: 'correct' },
          { label: `A Darlington pair`, type: 'wrong' },
          { label: `A Sziklai pair`, type: 'wrong' },
          { label: `A complementary pair`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>A long-tailed pair</b>`,
        working: () => `<div class="working-line">The two emitters share a common resistor or current source called the <b>tail</b>, hence <b>long-tail(ed) pair</b>. Darlington and Sziklai pairs boost current gain; a complementary pair is an NPN/PNP push-pull output.</div>`
      },
      {
        // Book 2 Q16.
        leftPanel: 'none',
        text: () => `In a balanced NPN differential amplifier, how do the two collector currents normally compare?`,
        hint: () => `Matched transistors, same base voltage.`,
        options: () => shuffle([
          { label: `They are equal, each carrying half of the tail current`, type: 'correct' },
          { label: `Both are zero`, type: 'wrong' },
          { label: `They depend only on β`, type: 'wrong' },
          { label: `They don't depend on the tail current`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>They are equal, each carrying half of the tail current</b>`,
        working: () => `<div class="working-line">With matched transistors and equal base voltages the tail current splits evenly: I<sub>C1</sub> = I<sub>C2</sub> = I<sub>tail</sub> ÷ 2.</div>`
      },
      {
        // Book 2 Q17.
        leftPanel: 'none',
        text: () => `What name is given to the combined emitter current of a differential pair?`,
        hint: () => `It flows in the shared emitter resistor.`,
        options: () => shuffle([
          { label: `Tail current`, type: 'correct' },
          { label: `Collector current`, type: 'wrong' },
          { label: `Bias current`, type: 'wrong' },
          { label: `Leakage current`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Tail current</b>`,
        working: () => `<div class="working-line">I<sub>E1</sub> + I<sub>E2</sub> flows through the shared emitter resistor (or current source) — the <b>tail current</b>.</div>`
      },
      {
        // Book 2 Q18.
        leftPanel: 'none',
        text: () => `Why might a trimpot be connected between the two emitters of a differential amplifier?`,
        hint: () => `Real transistors are never perfectly matched.`,
        options: () => shuffle([
          { label: `To balance the DC conditions of the two sides`, type: 'correct' },
          { label: `For frequency compensation`, type: 'wrong' },
          { label: `To control the gain`, type: 'wrong' },
          { label: `For thermal protection`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>To balance the DC conditions of the two sides</b>`,
        working: () => `<div class="working-line">Small differences in V<sub>BE</sub> and β make one side carry more current. A trimpot between the emitters (wiper to the tail) shifts the share until the collectors are equal — the <b>DC balance</b> (offset) adjustment.</div>`
      },
      {
        // Book 2 Q19.
        leftPanel: 'none',
        text: () => `Where do the emitters of a PNP differential amplifier usually sit?`,
        hint: () => `In a PNP transistor, which terminal is more positive — base or emitter?`,
        options: () => shuffle([
          { label: `About 0.6 V higher than the bases`, type: 'correct' },
          { label: `About 0.6 V lower than the bases`, type: 'wrong' },
          { label: `At 0 V (ground)`, type: 'wrong' },
          { label: `At the negative supply rail`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>About 0.6 V higher than the bases</b>`,
        working: () => `<div class="working-line">A PNP conducts when its emitter is <b>more positive</b> than its base by V<sub>EB</sub> ≈ 0.6 V. With the bases at 0 V the emitters sit at about <b>+0.6 V</b>. "0.6 V below the base" is the NPN case.<div class="key-note">⚠ The printed answer key gives <b>0.6 V below the base</b>, which is true for an <i>NPN</i> pair. For a PNP pair the emitters are 0.6 V <b>above</b> the bases, which is what this quiz marks.</div></div>`
      },
      {
        // Book 2 Q20.
        leftPanel: 'none',
        text: () => `In a differential amplifier, what happens if one transistor turns fully off?`,
        hint: () => `The tail current is fixed by the tail resistor or current source.`,
        options: () => shuffle([
          { label: `The other transistor carries the whole tail current`, type: 'correct' },
          { label: `The tail current stops`, type: 'wrong' },
          { label: `The gain drops to zero`, type: 'wrong' },
          { label: `Both collector currents fall to half`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>The other transistor carries the whole tail current</b>`,
        working: () => `<div class="working-line">The tail current doesn't depend on how it is shared, so if one transistor cuts off <b>the other carries all of it</b>. This is what limits a differential amplifier with a large input — it simply steers the whole tail current to one side.</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    // Question order is shuffled on every Restart (like the other review quizzes). The ?q=N deep-link skips
    // RESET_EXTRA (quiz-engine.js), so it still means "the Nth question as written", in the order defined above.
    const ORIGINAL_ORDER = QUESTIONS.slice();
    RESET_EXTRA = () => {
      const order = shuffle(ORIGINAL_ORDER.slice());
      QUESTIONS.length = 0;
      QUESTIONS.push(...order);
    };
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
