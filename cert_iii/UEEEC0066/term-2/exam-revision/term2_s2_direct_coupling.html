            xs.push(M.a * x + M.c * y + M.e); ys.push(M.b * x + M.d * y + M.f); });

        working: () => `<svg viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:.2rem 0 .6rem;font-family:'Share Tech Mono', monospace"><rect x="10" y="30" width="160" height="60" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-note" x="90.0" y="56.0" text-anchor="middle">Q1 warms up</text><text class="ckt-pin" x="90.0" y="74.0" text-anchor="middle">collector drifts 0.05 V</text><line x1="170" y1="60" x2="212" y2="60" style="stroke: var(--colour-series)" stroke-width="2" /><polygon points="210,54 210,66 220,60" style="fill: var(--colour-series)" /><rect x="220" y="30" width="160" height="60" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-note" x="300.0" y="56.0" text-anchor="middle">passed straight on</text><text class="ckt-pin" x="300.0" y="74.0" text-anchor="middle">stage 2 gain × 100</text><line x1="380" y1="60" x2="422" y2="60" style="stroke: var(--colour-series)" stroke-width="2" /><polygon points="420,54 420,66 430,60" style="fill: var(--colour-series)" /><rect x="430" y="30" width="160" height="60" rx="6" style="fill: var(--colour-panel); stroke: var(--colour-gain)" stroke-width="2" /><text class="ckt-note" x="510.0" y="56.0" text-anchor="middle">output drifts</text><text class="ckt-pin" x="510.0" y="74.0" text-anchor="middle">5 V — off centre</text></svg><div class="working-line">Any DC shift in an early stage — from temperature or supply changes — is passed on and <b>amplified by every following stage</b>, so the output drifts. Differential input stages and negative feedback are the usual cures.</div>`

" x="346" y="35" text-anchor="start">+V<tspan baseline-shift="sub" font-size="12">CC</tspan></text><text class="ckt-rail-label" x="346" y="405" text-anchor="start">−V<tspan baseline-shift="sub" font-size="12">EE</tspan></text><text class="ckt-io-label" x="50" y="208" text-anchor="middle">V<tspan baseline-shift="sub" font-size="11">1</tspan></text><text class="ckt-io-label" x="410" y="208" text-anchor="middle">V<tspan baseline-shift="sub" font-size="11">2</tspan></text><text class="ckt-io-label" x="80" y="148" text-anchor="middle">out<tspan baseline-shift="sub" font-size="10">1</tspan></text><text class="ckt-io-label" x="380" y="148" text-anchor="middle">out<tspan baseline-shift="sub" font-size="10">2</tspan></text><g transform="translate(150,50)"><use href="#resistor-vertical" /><text class="ckt-r-label" x="-22" y="46" text-anchor="end">RC1</text></g><g transform="translate(310,50)"><use href="#resistor-vertical" /><text class="ckt-r-label" x="22" y="46" text-anchor="start">RC2</text></g><g transform="translate(230,305)"><use href="#resistor-vertical" /><text class="ckt-r-label" x="22" y="46" text-anchor="start">RE</text></g><g transform="translate(150,220)"><use href="#bjt-npn-shape" transform="translate(-14,0)" /><text class="ckt-bjt-label" x="28" y="-14" text-anchor="start">Q1</text></g><g transform="translate(310,220)"><use href="#bjt-npn-shape" transform="translate(14,0) scale(-1,1)" /><text class="ckt-bjt-label" x="-28" y="-14" text-anchor="end">Q2</text></g><line x1="165" y1="134" x2="165" y2="150" style="stroke: var(--colour-current)" stroke-width="2.5" /><polygon points="159,148 171,148 165,158" style="fill: var(--colour-current)" /><text class="ckt-note" x="174" y="150" text-anchor="start" style="fill: var(--colour-current)">0.5 mA</text><line x1="295" y1="134" x2="295" y2="150" style="stroke: var(--colour-current)" stroke-width="2.5" /><polygon points="289,148 301,148 295,158" style="fill: var(--colour-current)" /><text class="ckt-note" x="286" y="150" text-anchor="end" style="fill: var(--colour-current)">0.5 mA</text><line x1="215" y1="300" x2="215" y2="337" style="stroke: var(--colour-current)" stroke-width="2.5" /><polygon points="209,335 221,335 215,345" style="fill: var(--colour-current)" /><text class="ckt-note" x="205" y="330" text-anchor="end" style="fill: var(--colour-current)">1 mA tail</text></svg><div class="working-line">With matched transistors and equal base voltages the tail current splits evenly: I<sub>C1</sub> = I<sub>C2</sub> = I<sub>tail</sub> ÷ 2.</div>`
