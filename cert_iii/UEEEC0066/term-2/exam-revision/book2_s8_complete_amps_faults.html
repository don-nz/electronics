<!--
  UEEEC0066 exam revision, term 2 — Book 2 Review Questions (printed booklet JZAI20260611), Section 8 — Complete Power Amplifiers & Fault Finding
  (book questions 71–80). Stems and options are reworded from the handout (same question, same answer) and shuffled on every attempt.
  Marked per the teacher's answer key, except Q7 (key C 75% → marked D 50%) and Q19 (key B → marked A, PNP
  emitters sit 0.6 V ABOVE the base); those worked solutions carry a .key-note explaining the difference.
  Phase 1: text only (leftPanel 'none'). Phase 2 will add diagrams through the circuit panel kept in the markup.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/shapes.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>Review Questions — Section 8: Complete Power Amplifiers &amp; Fault Finding</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-cap-label { fill: var(--colour-capacitor-labels); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-diode-label { fill: var(--colour-diode-labels); font-size: 15px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-note { fill: var(--colour-text); font-size: 13px; font-weight: 700; }
    .ckt-pin { fill: var(--colour-label); font-size: 13px; font-weight: 700; }
    .ckt-block { fill: var(--colour-gain); font-size: 17px; font-weight: 700; }
    #circuitSvg { font-family: 'Share Tech Mono', monospace; }
    .ws-table { border-collapse: collapse; font-size: .85rem; margin: .2rem 0 .6rem; }
    .ws-table th, .ws-table td { border: 1px solid var(--colour-border); padding: .25rem .6rem; text-align: center; }
    .ws-table th { color: var(--colour-label); font-weight: 600; }
    .hl-box { fill: var(--colour-highlight); stroke: var(--colour-ui-primary); stroke-width: 1.5; stroke-dasharray: 6 4; }
    @media(min-width:900px) {
      .quiz-wrap { display: grid;
        grid-template-columns: minmax(340px, min(760px, 58%)) 1fr;
        gap: 1.2rem;
        align-items: start; }
    }
    .book-q { color: var(--colour-label); font-size: .78em; font-weight: 600; letter-spacing: .04em; margin-right: .35rem; }
    .key-note { margin-top: .6rem; padding: .45rem .65rem; border-left: 3px solid var(--colour-ui-wrong); background: rgba(var(--colour-ui-wrong-rgb), .08); font-size: .85rem; line-height: 1.45; }
  </style>
</head>

<body>
  <script>Shapes.use('circuit-components', 'bjt-symbols', 'diodes-led');</script>

  <div class="crumb" id="crumb" data-current="Review Questions · Section 8"></div>
  <header>
    <h1>Review Questions: Section 8</h1>
    <p>Complete Power Amplifiers &amp; Fault Finding · Questions 71–80</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()">
        <div class="panel-label" id="circuitRefLabel">Diagram</div>
        <svg id="circuitSvg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
          <g id="hlLayer"></g>
          <!-- diagrams: phase 2 -->
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 400 300', label: 'Diagram' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        const b = el.getBBox(), p = 7;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [
      {
        // Book 2 Q71.
        leftPanel: 'none',
        text: () => `What is the input stage of many power amplifiers?<div style="margin-top:.45rem;font-size:.85rem;font-weight:normal"><a href="../power-amps/stages/power_amp_stages_knowledge_basics.html" target="_blank" rel="noopener">Explore the stages of a power amplifier ↗</a></div>`,
        hint: () => `It compares the input with the feedback.`,
        options: () => shuffle([
          { label: `A differential amplifier`, type: 'correct' },
          { label: `A rectifier`, type: 'wrong' },
          { label: `A class C stage`, type: 'wrong' },
          { label: `A transformer-coupled stage`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>A differential amplifier</b>`,
        working: () => `<div class="working-line">A <b>differential amplifier</b> (long-tailed pair) compares the input with the fed-back output and amplifies the difference, rejecting common noise.</div>`
      },
      {
        // Book 2 Q72.
        leftPanel: 'none',
        text: () => `What does the voltage amplifier stage mainly supply?`,
        hint: () => `It's in the name — the VAS.`,
        options: () => shuffle([
          { label: `Voltage gain`, type: 'correct' },
          { label: `Current gain only`, type: 'wrong' },
          { label: `Regulation of the supply`, type: 'wrong' },
          { label: `Temperature compensation`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Voltage gain</b>`,
        working: () => `<div class="working-line">The <b>voltage amplifier stage</b> (VAS), usually a class A common-emitter stage, provides most of the amplifier's <b>voltage gain</b>, swinging the drive nearly rail to rail.</div>`
      },
      {
        // Book 2 Q73.
        leftPanel: 'none',
        text: () => `What is the purpose of a driver stage?`,
        hint: () => `Power transistors need a lot of base current.`,
        options: () => shuffle([
          { label: `To give the output transistors enough drive`, type: 'correct' },
          { label: `To reduce the output current`, type: 'wrong' },
          { label: `To remove the feedback`, type: 'wrong' },
          { label: `To add crossover distortion`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>To give the output transistors enough drive</b>`,
        working: () => `<div class="working-line">The power transistors need much more base current than the VAS can supply. <b>Driver</b> transistors boost it, giving enough <b>drive for the output transistors</b>.</div>`
      },
      {
        // Book 2 Q74.
        leftPanel: 'none',
        text: () => `What is the output stage of a power amplifier mainly responsible for?`,
        hint: () => `Its voltage gain is about 1.`,
        options: () => shuffle([
          { label: `Delivering the power to the load`, type: 'correct' },
          { label: `Providing high voltage gain`, type: 'wrong' },
          { label: `Frequency compensation`, type: 'wrong' },
          { label: `Matching the input impedance`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Delivering the power to the load</b>`,
        working: () => `<div class="working-line">The output stage has a voltage gain of about 1 but a huge current gain — its job is <b>delivering power to the load</b> (the speaker).</div>`
      },
      {
        // Book 2 Q75.
        leftPanel: 'none',
        text: () => `When fault finding an amplifier, what should normally be checked first?`,
        hint: () => `Nothing works without its supply.`,
        options: () => shuffle([
          { label: `The power supply voltages`, type: 'correct' },
          { label: `Every transistor, by replacing it`, type: 'wrong' },
          { label: `Every capacitor, by replacing it`, type: 'wrong' },
          { label: `Every trimpot, by adjusting it`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>The power supply voltages</b>`,
        working: () => `<div class="working-line"><b>Check the supply rails first</b> — a missing or wrong rail explains many symptoms at once, and it takes seconds. Replacing parts or turning trimpots before measuring wastes time and can cause new faults.</div>`
      },
      {
        // Book 2 Q76.
        leftPanel: 'none',
        text: () => `Which of these could leave an amplifier with no output signal at all?`,
        hint: () => `Which one would stop the amplifier working altogether?`,
        options: () => shuffle([
          { label: `An open supply rail`, type: 'correct' },
          { label: `Too much gain`, type: 'wrong' },
          { label: `Better feedback`, type: 'wrong' },
          { label: `Too much bandwidth`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>An open supply rail</b>`,
        working: () => `<div class="working-line">With an <b>open supply rail</b> the stages have no power, so there is no output at all. The other options would change the output, not remove it.</div>`
      },
      {
        // Book 2 Q77.
        leftPanel: 'none',
        text: () => `An amplifier shows heavy crossover distortion. What is the most likely cause?`,
        hint: () => `What removes crossover distortion in a working amplifier?`,
        options: () => shuffle([
          { label: `The output-stage bias is wrong`, type: 'correct' },
          { label: `The collector voltage is too high`, type: 'wrong' },
          { label: `The speaker leads are open`, type: 'wrong' },
          { label: `There is too much negative feedback`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>The output-stage bias is wrong</b>`,
        working: () => `<div class="working-line">Crossover distortion appears when the class AB bias is missing or too low — e.g. a shorted V<sub>BE</sub> multiplier or diode, or a misadjusted bias preset: <b>incorrect output-stage bias</b>. Open speaker leads give no sound at all.</div>`
      },
      {
        // Book 2 Q78.
        leftPanel: 'none',
        text: () => `A transistor has failed with a short from collector to emitter. What might this cause?`,
        hint: () => `Nothing is left to limit the current through it.`,
        options: () => shuffle([
          { label: `Too much current being drawn`, type: 'correct' },
          { label: `Normal operation`, type: 'wrong' },
          { label: `Less current drawn from the supply`, type: 'wrong' },
          { label: `Better efficiency`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>Too much current being drawn</b>`,
        working: () => `<div class="working-line">A C–E short connects whatever is at the collector straight to the emitter. In an output stage that puts a rail across the load or the other transistor: <b>excessive current</b>, blown fuses, overheating, and an output stuck at a rail.</div>`
      },
      {
        // Book 2 Q79.
        leftPanel: 'none',
        text: () => `Comparing measured voltages with the expected values mainly checks:`,
        hint: () => `DC voltages show whether each stage is biased correctly.`,
        options: () => shuffle([
          { label: `The circuit's operating conditions`, type: 'correct' },
          { label: `How the board looks`, type: 'wrong' },
          { label: `The component colour codes`, type: 'wrong' },
          { label: `The speaker impedance`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>The circuit's operating conditions</b>`,
        working: () => `<div class="working-line">Measured DC voltages show the <b>operating conditions</b> — whether each stage is biased correctly. The stage whose voltages are wrong is where the fault is.</div>`
      },
      {
        // Book 2 Q80.
        leftPanel: 'none',
        text: () => `Why is a systematic approach to fault finding preferred?`,
        hint: () => `Compare it with replacing parts at random.`,
        options: () => shuffle([
          { label: `It saves time and avoids replacing parts that aren't faulty`, type: 'correct' },
          { label: `It guarantees there are no faulty parts`, type: 'wrong' },
          { label: `It does away with measurements`, type: 'wrong' },
          { label: `It means you don't need to understand the circuit`, type: 'wrong' }
        ]),
        correctExplain: () => `<b>It saves time and avoids replacing parts that aren't faulty</b>`,
        working: () => `<div class="working-line">Working logically from symptoms → supply → stage → component <b>finds the fault faster</b> and avoids replacing good parts. It still needs measurements and circuit knowledge.</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
