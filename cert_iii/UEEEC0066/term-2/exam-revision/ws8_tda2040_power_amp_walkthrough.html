<!--
  UEEEC0066 exam revision, term 2 — Worksheet 8 walkthrough (theory exam preparation worksheets).
  Circuit (redrawn from the worksheet): TDA2040 power amplifier IC on a single +20 V supply.
    Input IN → C7 2.2uF → pin 1 (+). Bias: R1 22K / R2 20K divider (decoupled by C4 22uF) → R6 22K → pin 1.
    The input wire hops the R1/R2 column, as on the worksheet drawing.
    Feedback: R4 22K output → pin 2; R3 680R + C3 22uF pin 2 → 0 V (AC gain 1 + 22k/680 = 33.4, DC gain 1).
    Pin 5 +20 V (C2 220uF, C1 100nF decoupling), pin 3 0 V. Output pin 4 → C6 2200uF → K1 8R speaker;
    R5 4.7R + C5 100nF Zobel network from the output to 0 V.
    The Pentawatt package (top right) is a sketch for question (l); its tag is joined to pin 3 (datasheet).
  Conventions: "absolute theoretical" swing = 0 to 20 V (10 V peak); P = Vp^2 / 2RL.
  Each question highlights the parts it is about (focus: [...]) — never the answer.
-->

  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // Each question names the parts it is about (focus: [...data-part names]); they get a dashed
    // highlight box behind them. A question may also pick another drawing (view) in the same svg.
    const VIEWS = {
      main: { box: '0 0 950 650', label: 'Worksheet 8 — TDA2040 amplifier' }
    };
    let shownView = null;
    function showFocus() {
      const data = QUESTIONS[cur] || {};
      const svg = document.getElementById('circuitSvg');
      const view = data.view || 'main';
      if (view !== shownView) {
        svg.querySelectorAll('[data-view]').forEach(g => { g.style.display = g.dataset.view === view ? '' : 'none'; });
        svg.setAttribute('viewBox', VIEWS[view].box);
        document.getElementById('circuitRefLabel').textContent = VIEWS[view].label;
        shownView = view;
      }
      const layer = document.getElementById('hlLayer');
      layer.innerHTML = '';
      (data.focus || []).forEach(n => svg.querySelectorAll(`[data-part="${n}"]`).forEach(el => {
        const b = el.getBBox(), p = 7;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'hl-box');
        r.setAttribute('x', b.x - p); r.setAttribute('y', b.y - p);
        r.setAttribute('width', b.width + 2 * p); r.setAttribute('height', b.height + 2 * p);
        r.setAttribute('rx', 9);
        layer.appendChild(r);
      }));
    }

    const QUESTIONS = [

      {
        // (a) name the device.
        focus: ['IC1'],
        text: () => `Name the device <b>IC1</b> (not its part number).`,
        hint: () => `It has + and − inputs and one output, like an op-amp — but look at the load it drives directly.`,
        options: () => shuffle([
          { label: 'An <b>audio power amplifier IC</b> — a power op-amp with a built-in class AB output stage that drives the speaker directly', type: 'correct' },
          { label: 'A <b>voltage regulator</b>', type: 'wrong' },
          { label: 'A <b>comparator</b>', type: 'wrong' },
          { label: 'A <b>555 timer</b>', type: 'wrong' },
        ]),
        correctExplain: () => `An audio power amplifier IC (a power op-amp)`,
        working: () => `
    <div class="working-line">The symbol is an op-amp triangle: a non-inverting input (pin 1), an inverting input (pin 2), supply pins (5 and 3) and an output (pin 4). Inside, the TDA2040 is a complete power amplifier — differential input, voltage amplifier and a class AB output stage able to deliver a few amps.</div>
    <div class="working-total">It's the same block diagram as the discrete amplifier of Worksheet 7, squeezed into a 5-pin package (Pentawatt) that bolts to a heatsink. A regulator in a similar package has only 3 pins and no inputs.</div>`
      },
      {
        // (b) DC voltage on pin 4.
        focus: ['R1', 'R2', 'R6', 'C3'],
        text: () => `What DC voltage would you expect to measure on <b>pin 4</b>?`,
        hint: () => `R1 and R2 set the DC level at pin 1 (through R6). C3 blocks DC in the feedback leg, so what is the DC gain from pin 1 to pin 4?`,
        options: () => shuffle([
          { label: `About <b>9.5 V</b> — roughly half the supply: 20 × ${frac('20 k', '22 k + 20 k')} = 9.52 V, followed by pin 4 at a DC gain of 1`, type: 'correct' },
          { label: '<b>0 V</b> — an amplifier output sits at 0 V with no signal', type: 'wrong' },
          { label: '<b>20 V</b> — pin 4 is connected to the supply', type: 'wrong' },
          { label: `About <b>317 V</b> — 9.52 V × the gain of 33.4`, type: 'wrong' },
        ]),
        correctExplain: () => `About <b>9.5 V</b> (half the supply)`,
        working: () => `
    <div class="working-step">Step 1 — the bias at pin 1:</div>
    <div class="working-line">V = 20 × ${frac('R2', 'R1 + R2')} = 20 × ${frac('20 k', '42 k')} = <b>9.52 V</b> at the R1/R2 junction (C4 smooths it). R6 carries it to pin 1 — almost no DC current flows into the input, so there's no drop across R6.</div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — the DC gain:</div>
    <div class="working-line">C3 blocks DC, so for DC there is no path through R3: gain = 1 + R4/∞ = 1. Pin 4 follows pin 1: <b style="color:var(--colour-ui-correct)">≈ 9.5 V</b>.</div>
    <div class="working-total">On a single supply the output must sit near the <b>middle</b> (½ × 20 V = 10 V) so it can swing up and down by the same amount. A ±supply amplifier would sit at 0 V instead.</div>`
      },
      {
        // (c) purpose of C6.
        focus: ['C6'],
        text: () => `What is the purpose of capacitor <b class="colour-cap">C6</b>?`,
        hint: () => `Pin 4 sits at about 10 V DC. What would that do to a speaker connected straight to it?`,
        options: () => shuffle([
          { label: 'The <b>output coupling capacitor</b> — it blocks the ≈10 V DC at pin 4 from the speaker but passes the audio signal', type: 'correct' },
          { label: '<b>Power-supply decoupling</b> — it stores charge for the output stage', type: 'wrong' },
          { label: 'Part of the <b>Zobel network</b> that keeps the amplifier stable', type: 'wrong' },
          { label: 'It sets the <b>closed-loop gain</b> with R4', type: 'wrong' },
        ]),
        correctExplain: () => `Output coupling — blocks the DC, passes the audio`,
        working: () => `
    <div class="working-line">With a single supply the output rests at about half the supply. Connected directly, that DC would push a steady current through the 8 Ω speaker coil — wasting power, offsetting the cone and possibly burning the coil. <b class="colour-cap">C6</b> blocks the DC and lets the AC signal through.</div>
    <div class="working-total">It has to be huge (2200 µF) because the speaker's resistance is so low — the next question shows why. The Zobel network is R5 + C5; supply decoupling is C1 and C2.</div>`
      },
      {
        // (d) f1 caused by C6.
        focus: ['C6', 'SPK'],
        text: () => `What is the lower roll-off frequency (f<sub>1</sub>) caused by capacitor <b class="colour-cap">C6</b>?`,
        hint: () => `C6 is in series with the 8 Ω speaker: f<sub>1</sub> = 1 ÷ (2πRC). The amplifier's own output resistance is close to zero.`,
        options: () => shuffle([
          { label: `f<sub>1</sub> = ${frac('1', '2π × 8 × 2200 µF')} = <b>9.04 Hz</b>`, type: 'correct' },
          { label: `f<sub>1</sub> = ${frac('1', '2π × 4.7 × 2200 µF')} = <b>15.4 Hz</b>`, type: 'wrong' },
          { label: `f<sub>1</sub> = ${frac('1', '8 × 2200 µF')} = <b>56.8 Hz</b>`, type: 'wrong' },
          { label: `f<sub>1</sub> = ${frac('1', '2π × 22 k × 2200 µF')} = <b>0.003 Hz</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `f<sub>1</sub> = 1 ÷ (2π × 8 × 0.0022) = <b>9.04 Hz</b>`,
        working: () => `
    <div class="working-line">f<sub>1</sub> = ${frac('1', '2πR<sub>L</sub>C6')} = ${frac('1', '2π × 8 × 0.0022')} = ${frac('1', '0.1106')} = <b style="color:var(--colour-ui-correct)">9.04 Hz</b></div>
    <div class="working-total">Well below the 20 Hz bottom of the audio band, so the bass is not cut. The resistance is the <b>speaker</b> (8 Ω), not R5 — at these low frequencies C5 (100 nF) is an open circuit, so the Zobel branch carries nothing. Leaving out 2π gives 56.8 Hz.</div>`
      },
      {
        // (e) closed-loop gain.
        focus: ['R4', 'R3'],
        text: () => `What is the closed-loop gain of this amplifier?`,
        hint: () => `The signal goes into the non-inverting input (pin 1); R4 and R3 feed part of the output back to pin 2.`,
        options: () => shuffle([
          { label: `A<sub>CL</sub> = 1 + ${frac('R4', 'R3')} = 1 + ${frac('22 k', '680')} = <b>33.4</b>`, type: 'correct' },
          { label: `A<sub>CL</sub> = ${frac('R4', 'R3')} = ${frac('22 k', '680')} = <b>32.4</b>`, type: 'wrong' },
          { label: `A<sub>CL</sub> = 1 + ${frac('R3', 'R4')} = 1 + ${frac('680', '22 k')} = <b>1.03</b>`, type: 'wrong' },
          { label: `A<sub>CL</sub> = 1 + ${frac('R4', 'R6')} = 1 + ${frac('22 k', '22 k')} = <b>2</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `A<sub>CL</sub> = 1 + 22 000/680 = <b>33.4</b>`,
        working: () => `
    <div class="working-line">Non-inverting: A<sub>CL</sub> = 1 + ${frac('R4', 'R3')} = 1 + ${frac('22 000', '680')} = 1 + 32.35 = <b style="color:var(--colour-ui-correct)">33.4</b> &nbsp;(≈ 30.5 dB)</div>
    <div class="working-total">This is the AC gain — C3 is a short to audio. For DC, C3 is open and the gain falls to 1 (that is what keeps pin 4 at half supply). <b>32.4</b> is the inverting formula, but the signal enters the + input.</div>`
      },
      {
        // (f) maximum output swing.
        focus: ['IC1'],
        text: () => `What is the absolute theoretical maximum output voltage swing for this amplifier?`,
        hint: () => `There is only one supply, +20 V and 0 V. The output can't go below 0 V or above +20 V.`,
        options: () => shuffle([
          { label: '<b>20 V peak-to-peak</b> — from 0 V up to +20 V, i.e. ±10 V (10 V peak) around the 10 V resting point', type: 'correct' },
          { label: '<b>40 V peak-to-peak</b> — from −20 V to +20 V', type: 'wrong' },
          { label: '<b>10 V peak-to-peak</b> — from 10 V up to 20 V only', type: 'wrong' },
          { label: '<b>14.1 V peak-to-peak</b> — 20 V ÷ √2', type: 'wrong' },
        ]),
        correctExplain: () => `20 V p-p (10 V peak)`,
        working: () => `
    <div class="working-line">The output rests at ≈10 V. It can rise to the +20 V supply and fall to 0 V (pin 3) — no further. So the largest swing is 0 → 20 V: <b style="color:var(--colour-ui-correct)">20 V p-p</b>, which is a <b>10 V peak</b> sine either side of the resting point.</div>
    <div class="working-total">This is why the output is biased at half supply: anywhere else, one half of the wave would hit a limit first and the swing would be smaller. There's no negative rail, so 40 V p-p is impossible. (Real devices lose a volt or two at each end.)</div>`
      },
      {
        // (g) sensitivity.
        focus: ['IN', 'C7'],
        text: () => `What is the <b>sensitivity</b> of this amplifier (maximum RMS input before clipping)?`,
        hint: () => `Largest output = 10 V peak. Convert to RMS, then divide by the closed-loop gain (33.4).`,
        options: () => shuffle([
          { label: `V<sub>in(rms)</sub> = ${frac('10 ÷ √2', '33.4')} = ${frac('7.07 V', '33.4')} = <b>212 mV rms</b>`, type: 'correct' },
          { label: `V<sub>in</sub> = ${frac('10 V', '33.4')} = <b>300 mV</b>`, type: 'wrong' },
          { label: `V<sub>in(rms)</sub> = ${frac('20 ÷ √2', '33.4')} = <b>424 mV rms</b>`, type: 'wrong' },
          { label: `V<sub>in(rms)</sub> = 10 ÷ √2 = <b>7.07 V rms</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `7.07 V ÷ 33.4 = <b>212 mV rms</b>`,
        working: () => `
    <div class="working-step">Step 1 — largest RMS output:</div>
    <div class="working-line">V<sub>out(p)</sub> = 10 V &nbsp;→&nbsp; V<sub>out(rms)</sub> = 10 ÷ √2 = <b>7.07 V</b></div>
    <div class="working-step" style="margin-top:.6rem">Step 2 — back through the gain:</div>
    <div class="working-line">V<sub>in(rms)</sub> = 7.07 ÷ 33.4 = <b style="color:var(--colour-ui-correct)">0.212 V rms (212 mV)</b></div>
    <div class="working-total"><b>300 mV</b> is the peak, not RMS. <b>424 mV</b> treats the 20 V p-p swing as if it were the peak.</div>`
      },
      {
        // (h) maximum power.
        focus: ['SPK'],
        text: () => `What is the absolute theoretical maximum power this amplifier can produce in the load?`,
        hint: () => `P = V<sub>p</sub>² ÷ 2R<sub>L</sub>, with the 10 V peak from the swing question and the 8 Ω speaker.`,
        options: () => shuffle([
          { label: `P<sub>max</sub> = ${frac('V<sub>p</sub>²', '2R<sub>L</sub>')} = ${frac('10²', '2 × 8')} = <b>6.25 W</b>`, type: 'correct' },
          { label: `P<sub>max</sub> = ${frac('20²', '2 × 8')} = <b>25 W</b>`, type: 'wrong' },
          { label: `P<sub>max</sub> = ${frac('10²', '8')} = <b>12.5 W</b>`, type: 'wrong' },
          { label: `P<sub>max</sub> = ${frac('7.07²', '2 × 8')} = <b>3.13 W</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `10² ÷ 16 = <b>6.25 W</b>`,
        working: () => `
    <div class="working-line">P<sub>max</sub> = ${frac('V<sub>rms</sub>²', 'R<sub>L</sub>')} = ${frac('7.07²', '8')} = ${frac('V<sub>p</sub>²', '2R<sub>L</sub>')} = ${frac('100', '16')} = <b style="color:var(--colour-ui-correct)">6.25 W</b></div>
    <div class="working-total"><b>25 W</b> uses the whole 20 V supply as the peak — but on a single supply the peak is only half of it. <b>12.5 W</b> treats the peak as RMS; <b>3.13 W</b> divides by 2 twice (RMS <i>and</i> the 2 in the formula).</div>`
      },
      {
        // (i) C3 open circuit.
        focus: ['C3'],
        text: () => `What would be the effect on the amplifier's performance if capacitor <b class="colour-cap">C3</b> went open circuit due to a fault?`,
        hint: () => `With C3 open, R3 is disconnected. The gain formula is 1 + R4/R3 — what happens as R3 becomes infinite?`,
        options: () => shuffle([
          { label: 'The AC gain falls from <b>33.4 to 1</b> — the amplifier becomes a voltage follower, so the output is about 33× quieter; the DC conditions are unchanged', type: 'correct' },
          { label: 'The gain rises to the open-loop value and the output clips heavily', type: 'wrong' },
          { label: 'Pin 4 drops to 0 V and there is no output at all', type: 'wrong' },
          { label: 'No change — C3 only affects frequencies below 1 Hz', type: 'wrong' },
        ]),
        correctExplain: () => `Gain drops to 1 — very low volume; DC stays at ≈9.5 V`,
        working: () => `
    <div class="working-line">C3 normally makes R3 the bottom half of the feedback divider for AC. Open-circuit, R3 is gone: the <b>whole</b> output is fed back to pin 2 through R4 (with no current in R4, there's no drop across it).</div>
    <div class="working-line" style="margin-top:.4rem">A<sub>CL</sub> = 1 + 22k/∞ = <b>1</b>: a unity-gain follower. The output now only matches the input — about <b>33× (30 dB) quieter</b>.</div>
    <div class="working-total">DC was already at gain 1, so pin 4 still sits at ≈9.5 V. The fault shows as <b>low volume</b> with an undistorted signal — a clue for fault finding.</div>`
      },
      {
        // (j) R4 open circuit.
        focus: ['R4'],
        text: () => `What would be the effect on the amplifier's performance if resistor <b class="colour-resistor">R4</b> went open circuit due to a fault?`,
        hint: () => `R4 is the only connection from the output back to the inverting input. What gain does an op-amp have with no feedback?`,
        options: () => shuffle([
          { label: 'All negative feedback is lost — the IC runs at its huge <b>open-loop gain</b>, the output saturates near a supply rail, and any signal is severely clipped and distorted', type: 'correct' },
          { label: 'The gain falls to 1 and the volume drops', type: 'wrong' },
          { label: 'The gain doubles and the sound gets louder but stays clean', type: 'wrong' },
          { label: 'No change — R3 alone still sets the gain', type: 'wrong' },
        ]),
        correctExplain: () => `No feedback: open-loop gain, output saturated and heavily distorted`,
        working: () => `
    <div class="working-line">With R4 open nothing comes back from the output: A<sub>CL</sub> = 1 + ∞/680 → the full <b>open-loop gain</b> (tens of thousands). Even the DC feedback is lost — pin 2 just sits wherever R3/C3 leave it, while pin 1 is at 9.5 V — so the output is driven hard towards a <b>rail</b> and stays there (saturated).</div>
    <div class="working-total">The symptom is <b>no proper output</b>: pin 4 stuck near 0 V or 20 V instead of ≈9.5 V, and any sound grossly distorted. Compare the C3 fault: a <i>too-low</i> gain, but clean.</div>`
      },
      {
        // (k) 4 Ω speaker.
        focus: ['SPK', 'C6'],
        text: () => `What would be the effect on the amplifier's performance if the speaker was replaced with one having an impedance of <b>4 Ω</b>?`,
        hint: () => `The voltage swing is set by the supply and doesn't change. Look at P = V<sub>p</sub>² ÷ 2R<sub>L</sub> and at f<sub>1</sub> = 1 ÷ 2πR<sub>L</sub>C6.`,
        options: () => shuffle([
          { label: 'Maximum power <b>doubles</b> to 12.5 W (and the IC delivers twice the current, so it runs hotter), and f<sub>1</sub> <b>doubles</b> to about 18 Hz — a little less bass', type: 'correct' },
          { label: 'Maximum power <b>halves</b> to 3.1 W and f<sub>1</sub> halves to 4.5 Hz', type: 'wrong' },
          { label: 'The voltage gain doubles to about 67', type: 'wrong' },
          { label: 'Nothing changes — the amplifier doesn\'t depend on the load', type: 'wrong' },
        ]),
        correctExplain: () => `Power doubles (12.5 W), current and heat rise, f<sub>1</sub> rises to ≈18 Hz`,
        working: () => `
    <div class="working-step">Power:</div>
    <div class="working-line">P<sub>max</sub> = ${frac('10²', '2 × 4')} = <b>12.5 W</b> — twice the 6.25 W into 8 Ω. The peak current doubles too (10 V ÷ 4 Ω = 2.5 A), so the IC dissipates more and needs a good heatsink.</div>
    <div class="working-step" style="margin-top:.6rem">Low-frequency response:</div>
    <div class="working-line">f<sub>1</sub> = ${frac('1', '2π × 4 × 2200 µF')} = <b>18.1 Hz</b> — still about at the bottom of the audio band, but the deepest bass is rolled off a little more.</div>
    <div class="working-total">The gain is set by R4/R3, which don't change. Halving the load halves R<sub>L</sub> in both formulas — it doubles the power and doubles f<sub>1</sub>.</div>`
      },
      {
        // (l) metal tag.
        focus: ['TAB'],
        text: () => `What, if anything, should the <b>metal tag</b> of IC1 be connected to?`,
        hint: () => `The tag is there to get heat out. Inside the package it is joined to one of the pins — the TDA2040 datasheet says pin 3 (−V<sub>s</sub>). What is pin 3 connected to in this circuit?`,
        options: () => shuffle([
          { label: 'A <b>heatsink</b>. The tag is internally connected to pin 3 (−V<sub>s</sub>), which is 0 V here, so it can be bolted to an earthed heatsink or chassis', type: 'correct' },
          { label: '<b>Nothing</b> — the tag is only for mounting and can be left in free air', type: 'wrong' },
          { label: 'The <b>+20 V supply</b>, to share the supply current', type: 'wrong' },
          { label: 'The <b>output (pin 4)</b>, so the speaker current can flow through it', type: 'wrong' },
        ]),
        correctExplain: () => `A heatsink — the tag is at pin 3 (0 V here)`,
        working: () => `
    <div class="working-line">At several watts the IC must get rid of its heat through the tag, so it is bolted to a <b>heatsink</b> (with heatsink compound).</div>
    <div class="working-line" style="margin-top:.4rem">The tag is not isolated: it is internally connected to <b>pin 3</b>, the negative supply pin. In this single-supply circuit pin 3 is <b>0 V</b>, so the heatsink can be earthed or be the chassis.</div>
    <div class="working-total">In a split-supply (±V) design pin 3 is at −V<sub>s</sub>, so the tag would need an <b>insulating washer and bush</b> to keep it off an earthed chassis — otherwise it shorts the negative rail.</div>`
      },
    ];

    QUESTIONS.forEach(q => { if (!q.leftPanel) q.leftPanel = 'circuit'; });   // every question shows the drawing
    RENDER_EXTRA = showFocus;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
