<!--
  Differential amplifier DC bias — step-by-step walkthrough, in the same style as
  coupling_circuit_analysis.html: one circuit, Example 1/2/3/Randomise, and a small
  value badge appears on the diagram as each question is answered.

  Circuit: the discrete "long-tail pair" — two matched NPN transistors (Q1 inverting input,
  Q2 non-inverting input) with collector resistors RC1 = RC2, base resistors RB1 = RB2 to
  ground, and one shared emitter resistor RE (the tail) returning to the negative rail −VEE.
  Both sides of the pair are identical, so one set of values describes both.

  Method (the order of the questions):
    1. VB1 = VB2 ≈ 0 V            (bases sit at ground through RB; base current is negligible)
    2. VE1 = VE2 = VB − VBE       = 0 − 0.6 = −0.6 V
    3. IT = (VE − (−VEE)) / RE    the tail current, set by RE alone
    4. IC1 = IC2 = IT / 2         identical transistors share the tail current equally
    5. VC1 = VC2 = VCC − IC × RC
    6. VCE = VC − VE              each transistor's quiescent collector-emitter voltage

  V holds the independent values (rails, RC, RE, RB, VBE); D holds everything derived
  (recompute()). options() is called once per resetQuiz(), so setMode() always recomputes
  before resetQuiz().
-->

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // VALUES — V: independent values; D: derived (recompute())
    // ══════════════════════════════════════════════════════════════════════
    // vee is the MAGNITUDE of the negative rail (−VEE = −vee V).
    const EXAMPLE_SETS = {
      example1: { vcc: 12, vee: 12, rc: 2200, re: 4700, rb: 39e3, vbe: 0.6 },
      example2: { vcc: 15, vee: 15, rc: 3300, re: 6800, rb: 47e3, vbe: 0.6 },
      example3: { vcc: 9, vee: 9, rc: 1800, re: 3300, rb: 33e3, vbe: 0.6 },
    };
    const VCC_POOL = [9, 12, 15, 18];
    const VEE_POOL = [9, 12, 15, 18];
    const RC_POOL = [1000, 1500, 1800, 2200, 2700, 3300, 4700];
    const RE_POOL = [2200, 3300, 4700, 5600, 6800, 8200, 10000];
    const RB_POOL = [27e3, 33e3, 39e3, 47e3, 56e3];
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

    let V = {}, D = {}, quizMode = 'example1';

    // Retries until both transistors sit comfortably in the active region: a sensible
    // drop across RC (so the output has something to swing) and VCE of at least 2 V.
    function randomValues() {
      for (let attempt = 0; attempt < 50; attempt++) {
        const v = { vcc: pick(VCC_POOL), vee: pick(VEE_POOL), rc: pick(RC_POOL), re: pick(RE_POOL), rb: pick(RB_POOL), vbe: 0.6 };
        const it = (v.vee - v.vbe) / v.re, ic = it / 2, vrc = ic * v.rc, vc = v.vcc - vrc;
        if (vrc < 1 || vrc > v.vcc * 0.6) continue;
        if (vc - (-v.vbe) < 2) continue;
        return v;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    function recompute() {
      D.VB = 0;                              // bases approximated at 0 V
      D.VE = D.VB - V.vbe;                   // −0.6 V
      D.IT = (D.VE - (-V.vee)) / V.re;       // (−0.6 − (−VEE)) / RE
      D.IC = D.IT / 2;                       // identical transistors share the tail current
      D.VRC = D.IC * V.rc;
      D.VC = V.vcc - D.VRC;
      D.VCE = D.VC - D.VE;
    }

    // ── formatting ──
    const MINUS = '−';
    function sig3(v) { return parseFloat(Number(v).toPrecision(3)); }
    function fmtR(v) { return v >= 1000 ? sig3(v / 1000) + 'kΩ' : sig3(v) + 'Ω'; }
    function fmtV(v) { return (v < 0 ? MINUS : '') + Math.abs(v).toFixed(2) + ' V'; }
    function fmtVs(v) { return (v < 0 ? MINUS : '') + sig3(Math.abs(v)) + 'V'; }   // short, for the diagram
    function fmtA(a) {
      const x = Math.abs(a), s = a < 0 ? MINUS : '';
      if (x >= 1) return s + x.toFixed(2) + ' A';
      if (x >= 0.001) return s + (x * 1000).toFixed(2) + ' mA';
      return s + (x * 1e6).toFixed(1) + ' µA';
    }
    function fmtAs(a) { return fmtA(a).replace(' ', ''); }

    // distinct wrong values: nudge any that collide with the correct label or each other
    function distinct(correctLabel, wrongs, fmt) {
      const used = new Set([correctLabel]);
      return wrongs.map(w => {
        let val = w, label = fmt(val), tries = 0;
        while (used.has(label) && tries < 40) { val = w * (1 + 0.15 * (tries + 1)); label = fmt(val); tries++; }
        used.add(label);
        return { val, label };
      });
    }

    function refreshLabels() {
      const ge = id => document.getElementById(id);
      ge('lblVCC').textContent = '+' + V.vcc + 'V';
      ge('lblVEE').textContent = MINUS + V.vee + 'V';
      ge('lblRC1').textContent = fmtR(V.rc);
      ge('lblRC2').textContent = fmtR(V.rc);
      ge('lblRB1').textContent = fmtR(V.rb);
      ge('lblRB2').textContent = fmtR(V.rb);
      ge('lblRE').textContent = fmtR(V.re);
      ge('panelVoltLabel').textContent = V.vcc === V.vee ? `±${V.vcc} V` : `+${V.vcc} V / ${MINUS}${V.vee} V`;
      ge('modalTitle').textContent = `Discrete differential amplifier — ${ge('panelVoltLabel').textContent} supplies`;
    }

    function setMode(mode) {
      quizMode = mode;
      V = (mode === 'randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
      recompute();
      refreshLabels();
      clearRevealHighlights();
      ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
        const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (b) b.classList.toggle('active', m === mode);
      });
      resetQuiz();
    }

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS
    // ══════════════════════════════════════════════════════════════════════
    const cV = s => `<b class="colour-voltage">${s}</b>`;
    const cI = s => `<b class="colour-current">${s}</b>`;
    const cR = s => `<b class="colour-resistor">${s}</b>`;
    const sup = s => `<b class="colour-supply">${s}</b>`;
    const VB = cV('V<sub>B1</sub>') + ' and ' + cV('V<sub>B2</sub>');
    const VBs = cV('V<sub>B</sub>'), VEs = cV('V<sub>E</sub>'), VCs = cV('V<sub>C</sub>');
    const ITs = cI('I<sub>T</sub>'), ICs = cI('I<sub>C</sub>');
    const REs = cR('R<sub>E</sub>'), RCs = cR('R<sub>C</sub>');
    const VEEs = sup('V<sub>EE</sub>'), VCCs = sup('V<sub>CC</sub>');

    const QUESTIONS = [
      // 1 ── base voltages
      {
        text: () => `What is the DC voltage at the two bases, ${VB}? (Approximate each base as sitting at ground.)`,
        hint: () => `Each base connects to ground through its own resistor (R<sub>B1</sub>/R<sub>B2</sub>). A transistor draws only a tiny base current, so almost no voltage is dropped across that resistor.`,
        options: () => shuffle([
          { label: `${VBs} ≈ 0 V`, type: 'correct' },
          { label: `${VBs} ≈ +0.6 V`, type: 'wrong' },
          { label: `${VBs} ≈ ${MINUS}0.6 V`, type: 'wrong' },
          { label: `${VBs} ≈ ${MINUS}${V.vee} V (the negative rail)`, type: 'wrong' },
        ]),
        correctExplain: () => `${VB} ≈ 0 V`,
        working: () => `
    <div class="working-line">R<sub>B1</sub> and R<sub>B2</sub> tie each base to ground, and the base current they carry is only a few microamps. Across ${fmtR(V.rb)} that is a few tenths of a volt at most — small enough to ignore.</div>
    <div class="working-total">${VB} ≈ <span class="cr">0 V</span> — the bases sit at ground. Everything else in the bias calculation hangs from this.</div>`
      },
      // 2 ── emitter voltage
      {
        text: () => `What is the DC voltage at the emitters, ${cV('V<sub>E1</sub>')} and ${cV('V<sub>E2</sub>')}? (V<sub>BE</sub> = ${V.vbe} V)`,
        hint: () => `An NPN transistor's emitter sits one V<sub>BE</sub> below its base: ${VEs} = ${VBs} − V<sub>BE</sub>.`,
        options: () => shuffle([
          { label: `${VEs} = ${VBs} − V<sub>BE</sub> = 0 − ${V.vbe} = ${MINUS}${V.vbe} V`, type: 'correct' },
          { label: `${VEs} = ${VBs} + V<sub>BE</sub> = 0 + ${V.vbe} = +${V.vbe} V`, type: 'wrong' },
          { label: `${VEs} = ${VBs} = 0 V`, type: 'wrong' },
          { label: `${VEs} = ${VEEs} = ${MINUS}${V.vee} V`, type: 'wrong' },
        ]),
        correctExplain: () => `${VEs} = ${MINUS}${V.vbe} V`,
        working: () => `
    <div class="working-formula-row">${VEs} = ${VBs} − V<sub>BE</sub> = 0 − ${V.vbe} V</div>
    <div class="working-total">${VEs} = <span class="cr">${MINUS}${V.vbe} V</span> — the emitter sits ${V.vbe} V <i>below</i> the base, so it is slightly negative. Both emitters join at this one point.</div>`
      },
      // 3 ── tail current
      {
        text: () => `What is the tail current ${ITs} flowing through ${REs} = ${fmtR(V.re)}?`,
        hint: () => `The tail resistor has ${VEs} at its top and the negative supply ${MINUS}${V.vee} V at its bottom: ${ITs} = (${VEs} − (−${VEEs})) / ${REs}.`,
        options: () => {
          const c = fmtA(D.IT);
          const w = distinct(c, [V.vee / V.re, (V.vee + V.vbe) / V.re, V.vbe / V.re], fmtA);
          return shuffle([
            { label: `${ITs} = ${frac(`${VEs} − (−${VEEs})`, REs)} = ${frac(`${MINUS}${V.vbe} − (${MINUS}${V.vee})`, fmtR(V.re))} ≈ ${c}`, type: 'correct' },
            { label: `${ITs} = ${frac(VEEs, REs)} = ${frac(`${V.vee} V`, fmtR(V.re))} ≈ ${w[0].label}`, type: 'wrong' },
            { label: `${ITs} = ${frac(`${VEs} + ${VEEs}`, REs)} = ${frac(`${V.vee + V.vbe} V`, fmtR(V.re))} ≈ ${w[1].label}`, type: 'wrong' },
            { label: `${ITs} = ${frac(VEs, REs)} = ${frac(`${V.vbe} V`, fmtR(V.re))} ≈ ${w[2].label}`, type: 'wrong' },
          ]);
        },
        correctExplain: () => `${ITs} ≈ ${fmtA(D.IT)}`,
        working: () => `
    <div class="working-line">${REs} connects the shared emitter point (${VEs} = ${MINUS}${V.vbe} V) to the negative rail (${MINUS}${V.vee} V), so the voltage across it is the difference:</div>
    <div class="working-formula-row">V<sub>RE</sub> = ${VEs} − (−${VEEs}) = ${MINUS}${V.vbe} − (${MINUS}${V.vee}) = ${(V.vee - V.vbe).toFixed(2)} V</div>
    <div class="working-formula-row">${ITs} = ${frac('V<sub>RE</sub>', REs)} = ${frac(`${(V.vee - V.vbe).toFixed(2)} V`, fmtR(V.re))}</div>
    <div class="working-total">${ITs} ≈ <span class="cr">${fmtA(D.IT)}</span> — set by ${REs} alone, not by the signal. Using the full ${V.vee} V would forget the ${V.vbe} V that is already used up at the emitters.</div>`
      },
      // 4 ── collector currents
      {
        text: () => `What is the collector current in each transistor, ${cI('I<sub>C1</sub>')} and ${cI('I<sub>C2</sub>')}?`,
        hint: () => `Q1 and Q2 are identical and their bases are at the same voltage, so they share the tail current equally.`,
        options: () => {
          const c = fmtA(D.IC);
          const w = distinct(c, [D.IT, D.IT * 2, D.IT / 4], fmtA);
          return shuffle([
            { label: `${ICs} = ${frac(ITs, '2')} = ${frac(fmtA(D.IT), '2')} ≈ ${c}`, type: 'correct' },
            { label: `${ICs} = ${ITs} ≈ ${w[0].label}`, type: 'wrong' },
            { label: `${ICs} = 2 × ${ITs} ≈ ${w[1].label}`, type: 'wrong' },
            { label: `${ICs} = ${frac(ITs, '4')} ≈ ${w[2].label}`, type: 'wrong' },
          ]);
        },
        correctExplain: () => `${ICs} = ${ITs} / 2 ≈ ${fmtA(D.IC)}`,
        working: () => `
    <div class="working-line">${ITs} enters the shared emitter point and splits between the two emitters. The transistors are matched and see the same base voltage, so it divides equally. (Collector current ≈ emitter current.)</div>
    <div class="working-formula-row">${cI('I<sub>C1</sub>')} = ${cI('I<sub>C2</sub>')} = ${frac(ITs, '2')} = ${frac(fmtA(D.IT), '2')}</div>
    <div class="working-total">${ICs} ≈ <span class="cr">${fmtA(D.IC)}</span> each. In a balanced pair, any signal that pushes one side's current up pulls the other down by the same amount — the total ${ITs} stays constant.</div>`
      },
      // 5 ── collector voltages
      {
        text: () => `What is the DC voltage at each collector, ${cV('V<sub>C1</sub>')} and ${cV('V<sub>C2</sub>')}? (${RCs} = ${fmtR(V.rc)} on both sides.)`,
        hint: () => `Start from the positive rail and subtract the drop across the collector resistor: ${VCs} = ${VCCs} − (${ICs} × ${RCs}).`,
        options: () => {
          const c = fmtV(D.VC);
          const w = distinct(c, [D.VRC, V.vcc + D.VRC, V.vcc - D.IT * V.rc], fmtV);
          return shuffle([
            { label: `${VCs} = ${VCCs} − (${ICs} × ${RCs}) = ${V.vcc} − (${fmtA(D.IC)} × ${fmtR(V.rc)}) ≈ ${c}`, type: 'correct' },
            { label: `${VCs} = ${ICs} × ${RCs} = ${fmtA(D.IC)} × ${fmtR(V.rc)} ≈ ${w[0].label}`, type: 'wrong' },
            { label: `${VCs} = ${VCCs} + (${ICs} × ${RCs}) = ${V.vcc} + ${D.VRC.toFixed(2)} ≈ ${w[1].label}`, type: 'wrong' },
            { label: `${VCs} = ${VCCs} − (${ITs} × ${RCs}) = ${V.vcc} − (${fmtA(D.IT)} × ${fmtR(V.rc)}) ≈ ${w[2].label}`, type: 'wrong' },
          ]);
        },
        correctExplain: () => `${VCs} ≈ ${fmtV(D.VC)}`,
        working: () => `
    <div class="working-formula-row">V<sub>RC</sub> = ${ICs} × ${RCs} = ${fmtA(D.IC)} × ${fmtR(V.rc)} ≈ ${D.VRC.toFixed(2)} V</div>
    <div class="working-formula-row">${VCs} = ${VCCs} − V<sub>RC</sub> = ${V.vcc} − ${D.VRC.toFixed(2)}</div>
    <div class="working-total">${cV('V<sub>C1</sub>')} = ${cV('V<sub>C2</sub>')} ≈ <span class="cr">${fmtV(D.VC)}</span> — the quiescent output level. Only one transistor's current flows through each ${RCs}, so use ${ICs} here, not the whole ${ITs}.</div>`
      },
      // 6 ── VCE
      {
        text: () => `What is the collector-emitter voltage ${cV('V<sub>CE</sub>')} of each transistor?`,
        hint: () => `${cV('V<sub>CE</sub>')} = ${VCs} − ${VEs}, remembering that ${VEs} is negative.`,
        options: () => {
          const c = fmtV(D.VCE);
          const w = distinct(c, [D.VC, D.VC + D.VE, V.vcc + V.vee], fmtV);
          return shuffle([
            { label: `${cV('V<sub>CE</sub>')} = ${VCs} − ${VEs} = ${fmtV(D.VC)} − (${MINUS}${V.vbe} V) ≈ ${c}`, type: 'correct' },
            { label: `${cV('V<sub>CE</sub>')} = ${VCs} ≈ ${w[0].label}`, type: 'wrong' },
            { label: `${cV('V<sub>CE</sub>')} = ${VCs} + ${VEs} = ${fmtV(D.VC)} + (${MINUS}${V.vbe} V) ≈ ${w[1].label}`, type: 'wrong' },
            { label: `${cV('V<sub>CE</sub>')} = ${VCCs} − (−${VEEs}) = ${V.vcc} + ${V.vee} ≈ ${w[2].label}`, type: 'wrong' },
          ]);
        },
        correctExplain: () => `${cV('V<sub>CE</sub>')} ≈ ${fmtV(D.VCE)}`,
        working: () => `
    <div class="working-formula-row">${cV('V<sub>CE</sub>')} = ${VCs} − ${VEs} = ${fmtV(D.VC)} − (${MINUS}${V.vbe} V)</div>
    <div class="working-total">${cV('V<sub>CE</sub>')} ≈ <span class="cr">${fmtV(D.VCE)}</span> — subtracting a negative adds ${V.vbe} V. This is comfortably above saturation (a fraction of a volt) and below the ${V.vcc + V.vee} V between the rails, so both transistors are in the active region and ready to amplify.</div>`
      },
    ];
    QUESTIONS.forEach(q => { q.leftPanel = 'circuit'; });

    // ── reveal: each badge appears once its question is answered, with a highlighter-
    // marker rect behind each line of text. SVG <text> has no background paint, so the
    // rect is sized from the line's own getBBox() the first time it is shown (after the
    // display flip — a hidden element has no box to measure) and built once per mode;
    // setMode() clears them because the numbers (and so the widths) change. ──
    const HL_PAD_LEFT = 0;
    const HL_PAD_RIGHT = -2;   // small trim: per-glyph extents already end at the last glyph's advance
    const HL_PAD_Y = -2;
    // Only the VALUE is highlighted (not the label or the "=" / "≈"): the range of characters
    // after the first equals sign up to the next one (e.g. "I C1 = 1.21mA = I C2" → "1.21mA").
    // Indices follow the rendered text, so the source's whitespace is collapsed the same way
    // the browser does; a text with no equals sign (a label on its own) gets no highlight.
    function valueCharRange(t) {
      const s = t.textContent.replace(/\s+/g, ' ').trim();
      if (s.length !== t.getNumberOfChars()) return undefined;   // can't map reliably — leave whole text
      let a = s.search(/[=≈]/);
      if (a < 0) return null;
      let b = s.slice(a + 1).search(/[=≈]/);
      b = b < 0 ? s.length : a + 1 + b;
      a++;
      while (a < b && s[a] === ' ') a++;
      while (b > a && s[b - 1] === ' ') b--;
      return [a, b];
    }
    function addRevealHighlight(el) {
      if (el.hasAttribute('data-hl-built')) return;
      const texts = el.tagName.toLowerCase() === 'text' ? [el] : el.querySelectorAll('text');
      texts.forEach(t => {
        const range = valueCharRange(t);
        if (range === null) return;
        // One rect per VISUAL line, from the glyph extents themselves, so each highlight
        // starts and ends where its own line does — left-aligned for text-anchor="start",
        // right-aligned for "end" — rather than one block sized to the widest line. A new
        // line begins where a glyph sits below the previous line or its x jumps backwards.
        const lines = [];
        let cur = null, prevX = -Infinity;
        for (let i = 0; i < t.getNumberOfChars(); i++) {
          if (range && (i < range[0] || i >= range[1])) continue;
          const e = t.getExtentOfChar(i);
          if (!e.width && !e.height) continue;
          if (!cur || e.x < prevX - 0.5 || e.y >= cur.y1 - 1) {
            cur = { x0: e.x, y0: e.y, x1: e.x + e.width, y1: e.y + e.height };
            lines.push(cur);
          } else {
            cur.x0 = Math.min(cur.x0, e.x); cur.y0 = Math.min(cur.y0, e.y);
            cur.x1 = Math.max(cur.x1, e.x + e.width); cur.y1 = Math.max(cur.y1, e.y + e.height);
          }
          prevX = e.x;
        }
        lines.forEach(l => {
          const w = l.x1 - l.x0;
          const rightTrim = Math.min(-HL_PAD_RIGHT, w * 0.15);   // never clip a short label
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', l.x0 - HL_PAD_LEFT);
          rect.setAttribute('y', l.y0 - HL_PAD_Y);
          rect.setAttribute('width', w + HL_PAD_LEFT - rightTrim);
          rect.setAttribute('height', (l.y1 - l.y0) + HL_PAD_Y * 2);
          rect.setAttribute('rx', 3);
          rect.style.fill = 'var(--colour-highlight)';
          t.parentNode.insertBefore(rect, t);
        });
      });
      el.setAttribute('data-hl-built', 'true');
    }
    function clearRevealHighlights() {
      document.querySelectorAll('#circuitSvg [data-hl-built]').forEach(el => {
        el.removeAttribute('data-hl-built');
        el.querySelectorAll('rect').forEach(r => r.remove());
      });
    }

    RENDER_EXTRA = () => {
      const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
      const reveal = (id, on) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.setAttribute('display', on ? 'inline' : 'none');
        if (on) addRevealHighlight(el);
      };
      // values first, so a highlight is measured against the final text
      set('valVE', fmtVs(D.VE)); set('valIT', fmtAs(D.IT)); set('valIC', fmtAs(D.IC));
      set('valVC1', fmtVs(D.VC)); set('valVC2', fmtVs(D.VC)); set('valVCE', fmtVs(D.VCE));
      reveal('revealVB', Q[0].ans);
      reveal('revealVE', Q[1].ans);
      reveal('revealIT', Q[2].ans);
      reveal('revealIC', Q[3].ans);
      reveal('revealVC', Q[4].ans);
      reveal('revealVCE', Q[5].ans);
    };

    // Summary: the circuit values used, above the per-question review.
    SUMMARY_CIRCUIT_REF = { id: '', label: '', viewBox: '' };
    SUMMARY_EXTRA = () => {
      const box = `<div style="border:1px solid var(--colour-border);border-radius:4px;padding:.9rem 1.2rem;margin-bottom:1.2rem;font-size:.82rem;line-height:2.2;">
        <b class="colour-supply">V<sub>CC</sub></b> = ${V.vcc} V &nbsp;
        <b class="colour-supply">V<sub>EE</sub></b> = ${MINUS}${V.vee} V &nbsp;
        <b class="colour-resistor">R<sub>C1</sub> = R<sub>C2</sub></b> = ${fmtR(V.rc)} &nbsp;
        <b class="colour-resistor">R<sub>B1</sub> = R<sub>B2</sub></b> = ${fmtR(V.rb)} &nbsp;
        <b class="colour-resistor">R<sub>E</sub></b> = ${fmtR(V.re)} &nbsp;
        V<sub>BE</sub> = ${V.vbe} V
      </div>`;
      document.getElementById('summaryContent').insertAdjacentHTML('afterbegin', box);
    };

    initQuizNav();
    setMode('example1');
    initQuizFromURL();
    // The highlights are measured from glyph extents, which shift when the web font arrives;
    // measure again once fonts are ready so each rect sits exactly behind its value.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { clearRevealHighlights(); RENDER_EXTRA(); });
  </script>
</body>

</html>
