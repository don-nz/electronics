<!--
  2026-10: the circuit CALCULATION questions (IT, IC, VC, re, AV(Diff), AV(CM), CMRR, VB3 for both circuits) were removed from this quiz
  because diff_amp_dc_bias_analysis.html and diff_amp_ccs_analysis.html cover them step by step. What remains is the knowledge side:
  applications, how the circuit works, what the gain terms and CMRR mean, and how the constant-current-source tail and trimpot differ.
  The notes below still describe the original, longer version.

   Topic coverage follows a DC-then-AC-then-CMRR progression over two circuit TYPES, but every component value, circuit
  layout and specific question wording is original, independently computed
  from scratch (see each calculation question's own working() for the
  derivation).

  One objective is deliberately NOT covered here: "Verify the correct
  operation of a discrete transistor differential amplifier" — hands-on
  bench work, not a knowledge quiz, matching this project's own established
  precedent (e.g. coupling_knowledge_direct.html's own header note) of
  covering only the CALCULATE/predict/describe/explain half of an objective
  list and leaving physical verification for the bench. "Calculate AND
  measure" objectives are covered for their CALCULATE half only, same
  policy.

  Three circuits: own component values
  throughout, independently computed and cross-checked (see each
  calculation question's own working() for the derivation). The SVG itself
  (shapes, wiring, comments) is the user's own hand-drawn work, built in his
  own working file and pasted in here wholesale — ids/layout/comments are
  his, left exactly as he drew them (see his own box-comments inside the
  <defs> below for the wiring breakdown; Claude's role was wiring these
  circuits into the QUESTIONS[] array and writing the questions around
  them, not drawing them).

  1. `base-diff-amp-2-bjt` — the baseline case: two matched NPN transistors
     (Q1/Q2), separate collector resistors (RC1=RC2=5k6) to a shared +15V
     rail, separate base resistors (RB1=RB2=39k) returning each base to its
     own floating 0V ground symbol (NOT to −VEE — a separate ground
     reference from the ±15V supply rails, same as the source sheet's own
     Figure 1 topology), and a single shared "tail" resistor (RE=8k2) from
     the joined emitters down to −15V. β=200 throughout, matching this
     project's own established convention (e.g. coupling_knowledge_direct.
     html's Q1).

  2. `base-diff-amp-3-bjt` — identical Q1/Q2/RC1/RC2/RB1/RB2 (so the ONLY
     thing that changes between the two circuits is the tail itself — a
     deliberate one-variable-at-a-time comparison for the CMRR-improvement
     questions at the end). The plain RE tail resistor is replaced by a
     third transistor, Q3, run as a constant-current source: a zener diode
     (D1, Vz=5.6V) referenced off 0V through a bias resistor RB3 sets Q3's
     own base at VB3 = −(VEE−Vz) (the zener's cathode sits at the RB3/base
     junction, its anode toward −VEE, so it regulates that junction to sit
     Vz ABOVE the −VEE rail, not Vz below 0V — a deliberately-verified
     distinction, see Q15's own working()), and Q3's own emitter resistor
     RE3=3k3 sets the actual tail current from there. The current source's
     own OUTPUT impedance (180kΩ, far higher than any practical resistor
     could give) is simply GIVEN where needed (Q18) rather than derived
     from Q3's own hybrid parameters — same simplifying-given convention
     the source sheet's own Review Q8 already uses ("given the impedance of
     the current source is 80k"), not a new invention.

  3. `diff-amp-common-re-dc-balance` — `base-diff-amp-2-bjt` plus RV1, a
     trimpot wired directly between Q1 and Q2's own emitters (wiper feeding
     down to RE), covering a PRACTICAL objective none of the DC/AC
     calculation questions reach: even a "matched" real transistor pair has
     small manufacturing tolerances left over once built, so a trimpot lets
     that residual DC imbalance (VC1 ≠ VC2) be nulled out by hand — see the
     two dedicated questions near the end for the full explanation. No new
     DC/AC numbers needed here; RV1 doesn't change any existing formula,
     it's a real-world complement to the theoretical matched-pair
     explanation already covered earlier in the quiz.

  Shapes in this file's own <defs> (none of them exist in any other quiz's
  own <defs> — cross-file <use> doesn't work under file://, so every
  quiz's shapes are its own local copy, per this project's established
  convention): `zener-right/down/left/up` (a zener symbol — cathode bar
  bent into the usual "Z" kink — for D1) and `ground-shape` (a standard
  3-tier shrinking-bar ground symbol, for RB1/RB2/RB3's own return to
  0V — a DIFFERENT reference from the ±15V rails, so a plain rail line
  would be misleading here), plus `resistor-horizontal` and
  `trimpot-horizontal` (RB3 and RV1 both run horizontally, unlike every
  other resistor in this file).

  All DC/AC values below independently Python-verified before writing:
  Circuit A (2-BJT) — VE1=−0.6V, IT≈1.756mA, IC1≈0.878mA, VC1≈10.08V,
  re≈29.6Ω, AV(Diff)≈94.6, AV(CM)≈0.341, CMRR≈48.8dB. Circuit B (3-BJT) —

  AV(Diff)≈81.6, AV(CM)≈0.01556, CMRR≈74.4dB — a ≈25.6dB CMRR improvement

  RB/RC/RE/RE3/Vz as the original hand-drawn circuits, so no question
  text/options/workings needed recalculating, only circuitId/circuitViewBox

  coupling_knowledge_direct.html) — any needed explanation of why a
  distractor is wrong lives in that question's own working() instead.

                <text id="value-re" x="40" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">3k3Ω</text>
              </g>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── DIODE BETWEEN Q3 BASE AND BOTTOM HORIZONTAL RAIL  ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="200" y1="480" x2="200" y2="680" style="stroke: var(--colour-series)" stroke-width="2" />
              <g transform="translate(200,620)">
                <use href="#zener-up" />
                <text x="-30" y="10" fill="var(--colour-diode)" text-anchor="middle" font-size="16"
                  font-weight="bold">D1</text>
                <text id="value-d1" x="35" y="10" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">5.6V</text>
              </g>
              <circle cx="200" cy="480" r="5" style="fill: var(--colour-series)" />
              <circle cx="200" cy="680" r="5" style="fill: var(--colour-series)" />
            </g>

          </defs>
        </svg>
        <svg id="circuitSvg" viewBox="0 -20 640 600" xmlns="http://www.w3.org/2000/svg">
          <use id="circuitRefUse" href="#base-diff-amp-2-bjt" />
        </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>

          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>

  </div>

  <script>Shapes.use('diodes-led', 'circuit-components', 'bjt-symbols');</script>
  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';
    // One constant per distinct circuit HEIGHT, not one per circuitId —
    // the trimpot circuit shares the 2-BJT circuit's own bounds exactly
    // (RV1 sits inside the existing wiring, doesn't extend it), so it
    // reuses VIEWBOX_2BJT rather than getting a third constant of its own.
    const VIEWBOX_2BJT = '0 -20 640 600'; // base-diff-amp-2-bjt + diff-amp-common-re-dc-balance
    const VIEWBOX_3BJT = '0 -20 640 740'; // base-diff-amp-3-bjt — taller, extends down through the CCS stage
    DEFAULT_CIRCUIT_VIEWBOX = VIEWBOX_2BJT;

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: "State typical applications for differential amplifiers."
        leftPanel: 'none',
        kind: 'multi',
        text: () => `<b style="color:var(--colour-ui-primary)">Click</b> every genuine typical application of a differential amplifier.`,
        hint: () => `Think about what a differential amplifier is actually GOOD at — amplifying a difference while ignoring whatever's common to both inputs.`,
        options: () => shuffle([
          { label: `Instrumentation/measurement amplifiers — amplifying a small wanted signal while rejecting noise common to both inputs`, type: 'correct' },
          { label: `The input stage of an operational amplifier (op-amp)`, type: 'correct' },
          { label: `Rejecting a common-mode interference signal (e.g. mains hum) picked up equally by both inputs`, type: 'correct' },
          { label: `A single-ended audio volume control` },
          { label: `A digital logic AND gate` },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are genuine applications`;
        },
        working: () => `
    <div class="working-line">A differential amplifier is built specifically to amplify the <b style="color:var(--colour-ui-correct)">DIFFERENCE</b> between two inputs while rejecting whatever's <b style="color:var(--colour-ui-correct)">COMMON</b> to both — exactly why it underpins instrumentation/measurement amplifiers, sits at the input of practically every op-amp ever made, and is the standard tool for rejecting common-mode interference like mains hum.</div>
    <div class="working-total">A volume control and a logic AND gate aren't differential-amplifier applications at all — neither one cares about the DIFFERENCE between two separate input signals.</div>`
      },
      {
        // Objective: "Identify the circuit of a discrete transistor differential amplifier."
        leftPanel: 'circuit',
        circuitId: 'base-diff-amp-2-bjt',
        circuitLabel: 'Resistor-tail differential amplifier',
        circuitViewBox: VIEWBOX_2BJT,
        text: () => `Which feature of the circuit below identifies it as a differential amplifier, rather than two separate single-ended stages sharing a supply?`,
        hint: () => `Look at what Q1 and Q2's own emitters actually do.`,
        options: () => shuffle([
          { label: `Q1 and Q2's emitters join together at a single shared node (the "tail"), rather than each having its own separate emitter resistor to a rail`, type: 'correct' },
          { label: `Each transistor has its own separate collector resistor` },
          { label: `Both transistors share the same +15V rail` },
          { label: `Each transistor has its own separate input` },
        ]),
        correctExplain: () => `Q1 and Q2's emitters join at one shared tail node`,
        working: () => `
    <div class="working-line">The <b style="color:var(--colour-ui-correct)">shared tail node</b> is what makes this a genuine differential PAIR rather than two independent stages — one combined tail current that continuously re-apportions itself between Q1 and Q2 depending on which base sits higher.</div>
    <div class="working-total">Separate collector resistors, a shared supply rail, and separate inputs are all completely normal features of ANY two ordinary CE stages, differential or not — none of them, on their own, creates the differential relationship. Only the shared emitter node does that.</div>`
      },
      {
        // Objective: "Explain the operation of a discrete transistor differential amplifier."
        leftPanel: 'none',
        text: () => `How does a differential amplifier actually produce its output?`,
        hint: () => `Think about what the shared tail current is free to do as the two base voltages move relative to each other.`,
        options: () => shuffle([
          { label: `The shared tail current splits between Q1 and Q2 according to the DIFFERENCE between the two base voltages — the output is the difference between the two resulting collector voltages`, type: 'correct' },
          { label: `Each transistor amplifies its own input completely independently, with no interaction between the two sides at all` },
          { label: `The output is the SUM of the two input voltages, amplified` },
          { label: `Only one transistor conducts at a time, like a digital switch` },
        ]),
        correctExplain: () => `The tail current splits by the difference between the two inputs; output = difference between the two collector voltages`,
        working: () => `
    <div class="working-line">Both transistors stay <b style="color:var(--colour-ui-correct)">conducting simultaneously</b> — the shared tail current is essentially fixed by the tail itself, and just re-apportions between the two sides in proportion to the DIFFERENCE between the two base voltages. Tip one base higher and more of that fixed current flows through its own side, pulling its own collector voltage down further than the other — that difference between the two collector voltages IS the output.</div>
    <div class="working-total">The two sides absolutely DO interact (that's the entire point of the shared tail), the output tracks the DIFFERENCE rather than the sum, and neither transistor ever fully switches off like a digital comparator would — it's an analogue re-apportioning, not an on/off switch.</div>`
      },
      {
        // Objective: "Describe the terms differential gain, common-mode gain, CMRR" — differential gain.
        leftPanel: 'none',
        text: () => `What does the term <i>differential gain</i> (A<sub>V(Diff)</sub>) describe?`,
        hint: () => `Think about which of the two input "modes" this gain figure actually applies to.`,
        options: () => shuffle([
          { label: `The gain applied to the DIFFERENCE between the two input signals — how much a differential (out-of-phase) input gets amplified`, type: 'correct' },
          { label: `The gain applied when both inputs receive the exact same signal simultaneously` },
          { label: `The overall voltage gain of a single, ordinary (non-differential) CE stage` },
          { label: `The ratio between the two input voltages` },
        ]),
        correctExplain: () => `The gain applied to the DIFFERENCE between the two inputs`,
        working: () => `
    <div class="working-line">Differential gain is specifically the gain applied to a <b style="color:var(--colour-ui-correct)">DIFFERENTIAL</b> input — a signal applied out-of-phase between the two inputs (or to just one, with the other held steady). It's the gain the differential amplifier is actually DESIGNED to deliver.</div>
    <div class="working-total">The same-signal-on-both-inputs case is common-mode gain instead (next question) — a completely different, ideally much SMALLER figure. And it's not a ratio between the two raw input voltages either — gain always relates an OUTPUT to an input, never one input to another.</div>`
      },
      {
        leftPanel: 'none',
        text: () => `What does the term <i>common-mode gain</i> (A<sub>V(CM)</sub>) describe?`,
        hint: () => `"Common-mode" means the same signal appearing on BOTH inputs at once.`,
        options: () => shuffle([
          { label: `The gain applied when the SAME signal is present on both inputs simultaneously — ideally as close to zero as possible`, type: 'correct' },
          { label: `The gain applied to the difference between the two inputs` },
          { label: `The gain of the output stage only, ignoring the input stage entirely` },
          { label: `The gain measured with one input grounded and the other left open-circuit` },
        ]),
        correctExplain: () => `The gain applied when the same signal sits on both inputs at once — ideally near zero`,
        working: () => `
    <div class="working-line">A truly IDEAL differential amplifier would have <b style="color:var(--colour-ui-correct)">zero</b> common-mode gain — a signal appearing equally on both inputs (interference, mains hum, etc) should cancel out entirely rather than reach the output at all. Real circuits only approach this; common-mode gain is how far short of zero they actually fall.</div>
    <div class="working-total">The difference-gain case is differential gain instead (previous question) — a deliberately LARGE figure, the opposite design goal from common-mode gain.</div>`
      },
      {
        leftPanel: 'none',
        text: () => `What does CMRR (common-mode rejection ratio) describe, and what does a HIGHER CMRR mean?`,
        hint: () => `CMRR compares the two gain figures from the previous two questions.`,
        options: () => shuffle([
          { label: `CMRR = AV(Diff)/AV(CM) (often expressed in dB) — a HIGHER CMRR means the amplifier is BETTER at rejecting common-mode signals while still amplifying the wanted differential signal`, type: 'correct' },
          { label: `CMRR = AV(CM)/AV(Diff) — a higher CMRR means WORSE common-mode rejection` },
          { label: `CMRR is simply the total voltage gain of the amplifier` },
          { label: `A higher CMRR means the amplifier amplifies common-mode signals MORE strongly` },
        ]),
        correctExplain: () => `CMRR = AV(Diff)/AV(CM); higher CMRR = better common-mode rejection`,
        working: () => `
    <div class="working-line">CMRR directly compares the two gains from the last two questions: <b style="color:var(--colour-ui-correct)">AV(Diff) ÷ AV(CM)</b>. The bigger that ratio, the more the amplifier favours a wanted DIFFERENTIAL signal over unwanted COMMON-MODE interference — so a HIGHER CMRR is always the better outcome.</div>
    <div class="working-total">Flipping the ratio upside down would make a WORSE amplifier (bigger AV(CM) relative to AV(Diff)) score a higher number — backwards. CMRR is specifically a RATIO of the two gains, not the total gain on its own, and it has nothing to do with amplifying common-mode signals more — the entire goal is the opposite.</div>`
      },
      {
        // Identify the CCS-tail circuit.
        leftPanel: 'circuit',
        circuitId: 'base-diff-amp-3-bjt',
        circuitLabel: 'CCS-tail differential amplifier',
        circuitViewBox: VIEWBOX_3BJT,
        text: () => `Looking at the circuit below, which feature identifies it as using a CONSTANT-CURRENT-SOURCE tail, rather than the plain resistor tail from the earlier questions?`,
        hint: () => `Look at what replaced the simple tail resistor.`,
        options: () => shuffle([
          { label: `The tail resistor is replaced by a third transistor (Q3), biased by its own zener reference — the tail current is now set by Q3's own bias network, not simply by VEE/RE`, type: 'correct' },
          { label: `RC1 and RC2 are still present` },
          { label: `Both circuits use the same ±15V dual supply` },
          { label: `Q1 and Q2 are still a matched pair` },
        ]),
        correctExplain: () => `The plain tail resistor is replaced by a current-source transistor (Q3) with its own zener-referenced bias network`,
        working: () => `
    <div class="working-line">Q1, Q2, RC1, RC2, RB1 and RB2 are all completely UNCHANGED from the resistor-tail version — the ONLY thing that's different is what the two emitters join down into: here, it's <b style="color:var(--colour-ui-correct)">Q3's own current-source bias network</b> (zener D1 + R1 + RE3) instead of a single plain resistor.</div>
    <div class="working-total">RC1/RC2 being present, the shared ±15V supply, and Q1/Q2 still being matched are all true of BOTH circuits — none of them is what makes THIS one the CCS version specifically.</div>`
      },
      {
        // Objective: "Explain how constant current source bias improves CMRR."
        leftPanel: 'none',
        text: () => `Comparing a resistor-tail differential amplifier (CMRR ≈ 48.8dB) with the constant-current-source version of the same circuit (CMRR ≈ 74.4dB), WHY does a constant-current-source tail give such a dramatic CMRR improvement over a plain resistor tail?`,
        hint: () => `Look at what actually changed the most between the two circuits' own AV(Diff) and AV(CM) figures.`,
        options: () => shuffle([
          { label: `A CCS has a MUCH higher output impedance than any practical tail resistor, and AV(CM) = RC/(2×Rtail) — a bigger Rtail makes AV(CM) much smaller, which makes CMRR = AV(Diff)/AV(CM) much bigger, while AV(Diff) barely changes at all`, type: 'correct' },
          { label: `A CCS makes AV(Diff) much larger, which is what improves CMRR` },
          { label: `A CCS removes the need for RC1/RC2 entirely` },
          { label: `A CCS makes Q1 and Q2 match each other more closely` },
        ]),
        correctExplain: () => `CCS's own far higher output impedance shrinks AV(CM) dramatically while AV(Diff) stays roughly the same, so their ratio (CMRR) rises sharply`,
        working: () => `
    <div class="working-line">Track the actual numbers: <b style="color:var(--colour-ui-correct)">AV(Diff)</b> barely moved (94.6 → 81.6), but <b style="color:var(--colour-ui-correct)">AV(CM)</b> collapsed by over 20× (0.341 → 0.0156) — entirely because the current source's own 180kΩ output impedance is SO much bigger than any practical 8k2Ω tail resistor could ever be, and AV(CM) = RC/(2×Rtail) shrinks as Rtail grows.</div>
    <div class="working-total">Since CMRR = AV(Diff)/AV(CM), a nearly-unchanged numerator over a dramatically SMALLER denominator is exactly what drives CMRR up so sharply. RC1/RC2 are still fully present in both circuits, and Q1/Q2's own matching is a separate consideration entirely from the tail's own impedance.</div>`
      },
      {
        // DC balance in practice — identify the trimpot's own role.
        leftPanel: 'circuit',
        circuitId: 'diff-amp-common-re-dc-balance',
        circuitLabel: 'DC-balance trimpot',
        circuitViewBox: VIEWBOX_2BJT,
        text: () => `Looking at the circuit below, what has been added compared to the basic resistor-tail version, and what is it for?`,
        hint: () => `Look at exactly where RV1 sits — not in parallel with anything, but directly in the wire between two particular points.`,
        options: () => shuffle([
          { label: `<b class="colour-resistor">RV1</b> — a small trimpot wired between Q1 and Q2's own emitters, with its wiper feeding the tail current down to RE — used to manually correct the small DC imbalance real transistors produce in practice`, type: 'correct' },
          { label: `<b class="colour-resistor">RV1</b> — a trimpot that replaces RE entirely and sets the whole tail current by itself` },
          { label: `<b class="colour-resistor">RV1</b> — a trimpot used to adjust the differential gain, AV(Diff)` },
          { label: `<b class="colour-resistor">RV1</b> — a trimpot added in series with RC1 to protect Q1 from overcurrent` },
        ]),
        correctExplain: () => `RV1 — a trimpot between Q1/Q2's own emitters, used to null real-world DC imbalance`,
        working: () => `
    <div class="working-line"><b class="colour-resistor">RV1</b> sits directly in the wire joining Q1's own emitter to Q2's own emitter — NOT in parallel with RE, and NOT anywhere near RC1/RC2. Its wiper (the middle tap) is what actually feeds down to RE, so sliding the wiper shifts slightly more of the pot's own resistance to one side or the other.</div>
    <div class="working-total">That lets you manually trim out the small DC imbalance (<b style="color:var(--colour-ui-correct)">VC1 ≠ VC2</b>) that real, not-quite-perfectly-matched transistors always produce in practice — a PRACTICAL complement to the THEORETICAL matched-pair explanation from earlier. It doesn't replace RE, doesn't touch the differential gain formula at all, and has nothing to do with protecting Q1 from overcurrent.</div>`
      },
      {
        // DC balance in practice — why it's needed at all.
        leftPanel: 'none',
        text: () => `Why is a trimpot like RV1 needed at all, given Q1 and Q2 are supposed to be a matched pair?`,
        hint: () => `Think about what "matched" actually means for two real, physically separate transistors — is it ever perfect?`,
        options: () => shuffle([
          { label: `Even transistors sold as a "matched pair" have small manufacturing tolerances (slightly different VBE, β) — enough to leave a small but real DC imbalance that no amount of THEORETICAL analysis can remove, only practical trimming can`, type: 'correct' },
          { label: `Q1 and Q2 are never actually intended to match at all — the trimpot is what makes them match` },
          { label: `RE always has 10% tolerance, which the trimpot is there to compensate for` },
          { label: `The circuit doesn't work at all without a trimpot fitted` },
        ]),
        correctExplain: () => `Even a "matched pair" has small real-world tolerances — the trimpot corrects for that in practice`,
        working: () => `
    <div class="working-line">Every calculation in the circuit walkthroughs assumed Q1 and Q2 are <b style="color:var(--colour-ui-correct)">perfectly</b> matched — same VBE, same β — so the tail current splits exactly 50/50. Real transistors, even ones sold as a matched pair, never hit that exactly; there's always some small manufacturing tolerance left over.</div>
    <div class="working-total">That residual mismatch is a PRACTICAL problem, not something more theory can fix — RV1 lets a technician trim it out by hand once the circuit is built. An RE tolerance wouldn't explain an imbalance either, since RE is shared equally by both sides — it would shift the TOTAL tail current up or down, not favour one side over the other. And the circuit works fine without RV1 fitted, just with a little more DC offset than ideal.</div>`
      },
    ];

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
