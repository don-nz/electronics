<!--
  Differential amplifier — differential mode vs common mode, a step-by-step walkthrough in the same style
  as diff_amp_dc_bias_analysis.html and diff_amp_ccs_analysis.html: one circuit, Example 1/2/3/Randomise, and a
  small value badge appears on the diagram as each question is answered.

  The idea: a differential amplifier has TWO MODES of operation, and ANY pair of inputs is a mix of them.
      differential input   Vd = V1 − V2            (the difference — the wanted signal)
      common-mode input    Vc = (V1 + V2) / 2      (what both inputs share — unwanted interference)
  The amplifier treats them very differently:
      AV(Diff) = RC / (2 × re)          big
      AV(CM)   = RC / (2 × RE)          small
  and the output at Q1's collector (Out 1; Q1 is the inverting side) is the sum of the two responses:
      Vout = −( AV(Diff) × Vd + AV(CM) × Vc )

  Method (the order of the questions):
    1. Vd = V1 − V2
    2. Vc = (V1 + V2) / 2
    3. AV(Diff) = RC / (2 re)        re is given (it comes from the DC bias — see the DC bias walkthrough)
    4. AV(CM)   = RC / (2 RE)
    5. Vo(diff) = −AV(Diff) × Vd     the output due to the differential part alone
    6. Vo(CM)   = −AV(CM) × Vc       the output due to the common-mode part alone
    7. Vout = Vo(diff) + Vo(CM)
    8. how many times bigger the differential part's output is than the common-mode part's
    9. one input driven, the other grounded: what are Vd and Vc?

  V holds the independent values; D holds everything derived (recompute()). options() is called once per
  resetQuiz(), so setMode() always recomputes before resetQuiz(). The re value is derived here from the DC
  bias (VE = −0.6 V, IT = (VEE − 0.6) / RE, IC = IT / 2, re = 26 mV / IC) but is GIVEN in the question.
  The component values are this page's own. The simplified circuit drawing is this page's own too, built from
  the shared shapes — bias resistors RB1/RB2 are shown but are not used in any calculation.
-->

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // VALUES — V: independent values; D: derived (recompute())
    // ══════════════════════════════════════════════════════════════════════
    // v1, v2 are the two input signals in mV (signed). rtail is the shared tail resistor RE. vs is the
    // single-input test value used by the last question. vee is the MAGNITUDE of the negative rail.
    const EXAMPLE_SETS = {
      example1: { vcc: 15, vee: 15, rc: 5600, rtail: 8200, v1: 5, v2: 1, vs: 6, vbe: 0.6 },
      example2: { vcc: 12, vee: 12, rc: 4700, rtail: 6800, v1: 2, v2: -6, vs: 4, vbe: 0.6 },
      example3: { vcc: 15, vee: 15, rc: 3300, rtail: 4700, v1: 4, v2: -2, vs: 8, vbe: 0.6 },
    };
    const RAIL_POOL = [12, 15];
    const RC_POOL = [2200, 3300, 4700, 5600];
    const RTAIL_POOL = [3900, 4700, 5600, 6800, 8200, 10000];
    const SIG_POOL = [-8, -6, -5, -4, -3, -2, 2, 3, 4, 5, 6, 8];
    const VS_POOL = [3, 4, 5, 6, 8, 10];
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

    let V = {}, D = {}, quizMode = 'example1';

    // Retries until: the tail current is sensible (1–3.5 mA), the differential part's output stays under 1 V,
    // and the four wrong answers to question 1 and 2 cannot collide with the right ones.
    function randomValues() {
      for (let attempt = 0; attempt < 200; attempt++) {
        const rail = pick(RAIL_POOL);
        const v = { vcc: rail, vee: rail, rc: pick(RC_POOL), rtail: pick(RTAIL_POOL), v1: pick(SIG_POOL), v2: pick(SIG_POOL), vs: pick(VS_POOL), vbe: 0.6 };
        const vd = v.v1 - v.v2, vc = (v.v1 + v.v2) / 2;
        if (vd === 0 || vc === 0) continue;
        if (v.v1 === 3 * v.v2 || v.v2 === 3 * v.v1) continue;
        if (Math.abs(vd) > 14) continue;
        const it = (v.vee - v.vbe) / v.rtail;
        if (it < 0.001 || it > 0.0035) continue;
        const re = 0.026 / (it / 2);
        if (Math.abs(v.rc / (2 * re) * vd) > 900) continue;
        return v;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    function recompute() {
      D.Vd = V.v1 - V.v2;                       // differential-mode input
      D.Vc = (V.v1 + V.v2) / 2;                 // common-mode input
      D.IT = (V.vee - V.vbe) / V.rtail;         // tail current: the bases sit at 0 V, so VE = −VBE
      D.IC = D.IT / 2;
      D.re = 0.026 / D.IC;                      // each transistor's internal emitter resistance (given in the questions)
      D.Ad = sig3(V.rc / (2 * D.re));           // the gains are rounded to 3 s.f. here so the outputs below agree with
      D.Acm = sig3(V.rc / (2 * V.rtail));       // the figures a student sees (94.6 × 4 mV = 378.4 mV exactly)
      D.Vod = -D.Ad * D.Vd;                     // output (mV) due to the differential part, at Out 1
      D.Voc = -D.Acm * D.Vc;                    // output (mV) due to the common-mode part
      D.Vout = D.Vod + D.Voc;
      D.ratio = Math.abs(D.Vod / D.Voc);
      D.CMRR = 20 * Math.log10(D.Ad / D.Acm);
    }

    // ── formatting ──
    const MINUS = '−';
    function sig3(v) { return parseFloat(Number(v).toPrecision(3)); }
    function sig4(v) { return parseFloat(Number(v).toPrecision(4)); }
    function fmtR(v) { return v >= 1000 ? sig3(v / 1000) + 'kΩ' : sig3(v) + 'Ω'; }
    function fmtOhm(v) { return sig3(v) + ' Ω'; }
    function fmtSM(v) { return (v > 0 ? '+' : v < 0 ? MINUS : '') + Math.abs(v) + ' mV'; }          // an input, in mV (with sign)
    function fmtM(v) { return (v < 0 ? MINUS : '') + Math.abs(v) + ' mV'; }
    function fmtOut(v, f = sig3) { const x = Math.abs(v), s = v < 0 ? MINUS : ''; return x >= 1000 ? s + f(x / 1000) + ' V' : s + f(x) + ' mV'; }   // an output given in mV
    function fmtOut4(v) { return fmtOut(v, sig4); }
    function fmtG(g) { return String(sig3(g)); }

    // distinct wrong values: nudge any that collide with the correct label or each other
    function distinct(correctLabel, wrongs, fmt) {
      const used = new Set([correctLabel]);
      return wrongs.map(w => {
        let val = w, label = fmt(val), tries = 0;
        while (used.has(label) && tries < 40) { val = w * (1 + 0.15 * (tries + 1)); label = fmt(val); tries++; }
        used.add(label);
        return { val, label };
      });
    }

    // ── reveal: each badge appears once its question is answered, with a highlighter-
    // marker rect behind each line of text (see diff_amp_dc_bias_analysis.html for the
    // full explanation). Built once per mode; setMode() clears them because the numbers
    // (and so the widths) change. ──
    const HL_PAD_LEFT = 0;
    const HL_PAD_RIGHT = -2;
    const HL_PAD_Y = -2;
    // Only the VALUE is highlighted (not the label or the "=" / "≈"): the range of characters
    // after the first equals sign up to the next one (e.g. "I C1 = 1.21mA = I C2" → "1.21mA").
    // Indices follow the rendered text, so the source's whitespace is collapsed the same way
    // the browser does; a text with no equals sign (a label on its own) gets no highlight.
    function valueCharRange(t) {
      const s = t.textContent.replace(/\s+/g, ' ').trim();
      if (s.length !== t.getNumberOfChars()) return undefined;   // can't map reliably — leave whole text
      let a = s.search(/[=≈]/);
      if (a < 0) return null;
      let b = s.slice(a + 1).search(/[=≈]/);
      b = b < 0 ? s.length : a + 1 + b;
      a++;
      while (a < b && s[a] === ' ') a++;
      while (b > a && s[b - 1] === ' ') b--;
      return [a, b];
    }
    function addRevealHighlight(el) {
      if (el.hasAttribute('data-hl-built')) return;
      const texts = el.tagName.toLowerCase() === 'text' ? [el] : el.querySelectorAll('text');
      texts.forEach(t => {
        const range = valueCharRange(t);
        if (range === null) return;
        const lines = [];
        let cur = null, prevX = -Infinity;
        for (let i = 0; i < t.getNumberOfChars(); i++) {
          if (range && (i < range[0] || i >= range[1])) continue;
          const e = t.getExtentOfChar(i);
          if (!e.width && !e.height) continue;
          if (!cur || e.x < prevX - 0.5 || e.y >= cur.y1 - 1) {
            cur = { x0: e.x, y0: e.y, x1: e.x + e.width, y1: e.y + e.height };
            lines.push(cur);
          } else {
            cur.x0 = Math.min(cur.x0, e.x); cur.y0 = Math.min(cur.y0, e.y);
            cur.x1 = Math.max(cur.x1, e.x + e.width); cur.y1 = Math.max(cur.y1, e.y + e.height);
          }
          prevX = e.x;
        }
        lines.forEach(l => {
          const w = l.x1 - l.x0;
          const rightTrim = Math.min(-HL_PAD_RIGHT, w * 0.15);
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', l.x0 - HL_PAD_LEFT);
          rect.setAttribute('y', l.y0 - HL_PAD_Y);
          rect.setAttribute('width', w + HL_PAD_LEFT - rightTrim);
          rect.setAttribute('height', (l.y1 - l.y0) + HL_PAD_Y * 2);
          rect.setAttribute('rx', 3);
          rect.style.fill = 'var(--colour-highlight)';
          t.parentNode.insertBefore(rect, t);
        });
      });
      el.setAttribute('data-hl-built', 'true');
    }
    function clearRevealHighlights() {
      document.querySelectorAll('#circuitSvg [data-hl-built]').forEach(el => {
        el.removeAttribute('data-hl-built');
        el.querySelectorAll('rect').forEach(r => r.remove());
      });
    }

    RENDER_EXTRA = () => {
      const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
      const reveal = (id, on) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.setAttribute('display', on ? 'inline' : 'none');
        if (on) addRevealHighlight(el);
      };
      // the two inputs are always shown (known values)
      set('valV1', fmtSM(V.v1).replace(' ', '')); set('valV2', fmtSM(V.v2).replace(' ', ''));
      // values first, so a highlight is measured against the final text
      set('valVD', fmtM(D.Vd).replace(' ', '')); set('valVC', fmtM(D.Vc).replace(' ', ''));
      set('valAD', fmtG(D.Ad)); set('valAC', fmtG(D.Acm));
      set('valOD', fmtOut(D.Vod).replace(' ', '')); set('valOC', fmtOut(D.Voc).replace(' ', '')); set('valOUT', fmtOut(D.Vout, sig4).replace(' ', ''));
      ['revealVD', 'revealVC', 'revealAD', 'revealAC', 'revealOD', 'revealOC', 'revealOUT']
        .forEach((id, i) => reveal(id, Q[i].ans));
    };

    // Summary: the circuit values used, above the per-question review.
    SUMMARY_CIRCUIT_REF = { id: '', label: '', viewBox: '' };
    SUMMARY_EXTRA = () => {
      const box = `<div style="border:1px solid var(--colour-border);border-radius:4px;padding:.9rem 1.2rem;margin-bottom:1.2rem;font-size:.82rem;line-height:2.2;">
        <b class="colour-voltage">v<sub>1</sub></b> = ${fmtSM(V.v1)} &nbsp;
        <b class="colour-voltage">v<sub>2</sub></b> = ${fmtSM(V.v2)} &nbsp;
        <b class="colour-resistor">R<sub>C</sub></b> = ${fmtR(V.rc)} &nbsp;
        <b class="colour-resistor">R<sub>E</sub></b> = ${fmtR(V.rtail)} &nbsp;
        <b class="colour-bjt">r<sub>e</sub></b> ≈ ${fmtOhm(D.re)} &nbsp;
        <b class="colour-supply">±V</b> = ${V.vcc} V
      </div>`;
      document.getElementById('summaryContent').insertAdjacentHTML('afterbegin', box);
    };

    initQuizNav();
    setMode('example1');
    initQuizFromURL();
    // The highlights are measured from glyph extents, which shift when the web font arrives;
    // measure again once fonts are ready so each rect sits exactly behind its value.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { clearRevealHighlights(); RENDER_EXTRA(); });
  </script>
</body>
