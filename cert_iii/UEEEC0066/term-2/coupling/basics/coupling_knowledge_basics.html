<!--
  TEMPLATE FILE — read before cloning for a new weekly quiz (see
  ../../bjt/basics/bjt_knowledge_basics.html's own header comment for the
  full explanation of why this structure is mandatory even for a one-
  question file).

  This file uses a data-driven quiz engine: a single `QUESTIONS` array (in
  the <script>, search "QUESTIONS —") drives one generic HTML panel and a
  generic set of engine functions (renderQuestion, checkAnswer,
  nextQuestion, etc). There is deliberately NO per-question HTML or
  per-question JS function. Built on the shared cert_iii/assets/
  quiz-engine.js engine from the start (project convention for all new
  quizzes).

  Source material: coupling_objectives.webp (lesson objectives) plus 13
  IMG_29xx.webp photos of the textbook and the teacher's whiteboard,
  covering: the 3 main coupling methods (capacitive/transformer/direct,
  plus the teacher's own "light/IR" aside), overall gain of a cascaded
  amplifier (multiply ratios, ADD dB values), the factors affecting the
  lower/upper roll-off frequencies (f1/f2), the "cascading two stages does
  NOT preserve the combined -3dB bandwidth" gotcha, and interstage
  coupling-capacitor sizing (f1 = 1/(2*pi*RT*Cc)). Applies equally to BJT
  and FET multistage amplifiers per the lesson objectives, so this file
  intentionally uses no device-specific accent colour (--colour-ui-primary
  throughout, not --colour-bjt/--colour-jfet/--colour-mosfet).

  NOTE for whoever reviews/extends this: the source photos have a gap —
  IMG_2908, IMG_2909 and IMG_2911 don't exist (filenames jump 2907 -> 2910,
  then 2910-2 -> 2912), matching Don's own warning that he "missed a couple
  of the whiteboard points at the end". The visible content flows sensibly
  around the gaps (Factors affecting f1/f2 -> [gap] -> BJT inter-electrode
  capacitance example -> other stray C/L factors -> [gap] -> interstage
  coupling -> determining cap size), but whatever was on the missing
  board(s) isn't reflected here. Not yet covered at all: "describe the
  advantages/disadvantages of DIRECT coupling" (only capacitive/transformer
  have an adv/disadv question so far) and "predict the effect of typical
  faults in a capacitively coupled amplifier" (that's a fault-finding-style
  quiz of its own, same shape as ../../bjt/fault_finding/ — not attempted
  here). Add questions for these once there's source content to build them
  from, rather than inventing values.

  Being built as a first version per Don's own request — add further
  questions one at a time per his own direction from here, same convention
  as jfet_knowledge_basics.html.
-->

  <style>
    /* Q1's block-diagram (input/interstage/output coupling) — plain SVG
       shapes styled with currentColor-ish theme tokens, same convention as
       every other page-local circuit diagram in this project. Q8's own
       Figure 8 (Thevenin-equivalent two-stage coupling) reuses the same
       .coupling-diagram-wire/-cap classes for its own plain wires/cap, but
       needs its own resistor/source colour classes since it's drawing
       real component symbols (R/Vs), not the abstract stage-triangles Q1
       uses. Both diagrams now live in <defs> and are swapped into the one
       visible #circuitSvg via CIRCUIT_SVG_ID's own <use> — see each
       question's own circuitId field. */
    .coupling-diagram-label { font-family: var(--font-body); font-size: 13px; fill: var(--colour-label); text-anchor: middle; }
    .coupling-diagram-letter { font-family: var(--font-body); font-size: 15px; font-weight: 700; fill: var(--colour-ui-primary); text-anchor: middle; }
    .coupling-diagram-stage { fill: none; stroke: var(--colour-ui-primary); stroke-width: 2; }
    .coupling-diagram-wire { stroke: var(--colour-ui-primary); stroke-width: 1.5; fill: none; }
    .coupling-diagram-cap { stroke: var(--colour-ui-primary); stroke-width: 2; }
    .fig8-box { fill: none; stroke: var(--colour-label); stroke-width: 1.5; }
    .fig8-r { fill: var(--colour-panel); stroke: var(--colour-resistor); stroke-width: 2; }
    .fig8-r-label { fill: var(--colour-resistor-labels); font-size: 13px; font-weight: 700; }
    .fig8-vs { fill: none; stroke: var(--colour-signal); stroke-width: 2; }
    .fig8-vs-label { fill: var(--colour-signal-labels); font-size: 13px; font-weight: 700; }
    .fig8-cc-label { fill: var(--colour-capacitor-labels); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .fig8-value { fill: var(--colour-text); font-size: 13px; font-weight: 700; text-anchor: middle; }

    /* Review-question circuit labels (Q1-22/26-28) — BJT/JFET single- and
       two-stage amplifiers, plus the transformer-coupled output stage.
       Same colour-by-component-type convention as .fig8-r-label/-vs-label
       above, just reused across several new figures instead of one. */
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 15px; font-weight: 700; }
    .ckt-c-label { fill: var(--colour-capacitor-labels); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .ckt-value { fill: var(--colour-text); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 13px; font-weight: 700; }
    .ckt-jfet-label { fill: var(--colour-jfet-labels); font-size: 13px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 14px; font-weight: 700; text-anchor: middle; }
    .ckt-gnd-label { fill: var(--colour-current); font-size: 13px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-text); font-size: 13px; }
  </style>

<body>
  <div class="crumb" id="crumb" data-current="Coupling Basics"></div>
  <header>
    <h1>Coupling Methods</h1>
    <p>Conceptual Questions · Capacitive &amp; Transformer Coupling · Multistage Amplifiers (BJT &amp; FET)</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <!-- LEFT: circuit diagram, swapped per-question via circuitId (see
         quiz-engine.js's own showCircuitRef()/CIRCUIT_SVG_ID mechanism). -->
    <div class="circuit-col">
      <div class="circuit-panel">
        <div class="panel-label" id="circuitRefLabel">Figure 1 — 3-stage cascaded amplifier</div>
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
          <defs>
            <g id="cap-shape">
              <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
              <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
              <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
            </g>

            <!-- ══ Review-question shapes (Section 1, Q1-22/26-28) — BJT/
                 JFET bodies and the resistor box are copied verbatim from
                 ../../../working/transformer_circuit.html (that file's own
                 master copy) per this project's usual "edit master first,
                 copy into consuming files" convention. voltage-divider-bias
                 is ALSO copied verbatim from there — the same generic,
                 unlabelled 4-resistor BJT frame that file's own
                 voltageDivider-Q1-R1-R4/Q2-R5-R8 build on, reused here the
                 same way for Figure 1 and Figure 3's own first stage.
                 jfet-single-stage-bias is a NEW analogous frame (no
                 existing master anywhere in the project) for a plain
                 gate-resistor-biased JFET stage — same rail/footprint
                 convention (340 wide, VCC rail y=20, common rail y=535,
                 device row y≈250) so it drops into the same coupling-cap/
                 bypass-cap wiring patterns as the BJT frame, but the LEFT
                 side only runs gate-tap→RG→common (no VCC connection, a
                 JFET gate draws no bias current) rather than a full
                 divider. transformer-shape is also new (no transformer
                 symbol exists anywhere in this project's shape masters) —
                 two mirrored coil arcs either side of a 2-line laminated-
                 core mark, zero-based on the primary coil's own centre
                 line so it drops in via a plain translate() like every
                 other component here. ── -->
            <g id="bjt-npn-shape">
              <circle cx="7" cy="0" r="24" style="fill: var(--colour-panel); stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
              <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
              <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
              <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
              <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
              <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
            </g>

            <g id="jfet-n-shape">
              <circle cx="7" cy="0" r="30" fill="var(--colour-panel)" style="stroke: var(--colour-jfet)" stroke-width="2" filter="url(#glow)" />
              <line x1="-30" y1="7" x2="0" y2="7" style="stroke: var(--colour-jfet)" stroke-width="2" />
              <rect x="0" y="-20" width="4" height="40" style="fill: var(--colour-jfet)" />
              <line x1="0" y1="-15" x2="15" y2="-15" style="stroke: var(--colour-jfet)" stroke-width="2" />
              <line x1="14" y1="-15" x2="14" y2="-40" style="stroke: var(--colour-jfet)" stroke-width="2" />
              <line x1="0" y1="15" x2="15" y2="15" style="stroke: var(--colour-jfet)" stroke-width="2" />
              <line x1="14" y1="15" x2="14" y2="40" style="stroke: var(--colour-jfet)" stroke-width="2" />
              <polygon points="-8,3 -8,12 2,7" style="fill: var(--colour-jfet)" />
            </g>

            <g id="resistor-vertical">
              <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
            </g>

            <g id="transformer-shape">
              <path d="M 0,-40 A 10,10 0 0 1 0,-20 A 10,10 0 0 1 0,0 A 10,10 0 0 1 0,20 A 10,10 0 0 1 0,40" fill="none" style="stroke: var(--colour-series)" stroke-width="2.5" />
              <line x1="14" y1="-45" x2="14" y2="45" style="stroke: var(--colour-label)" stroke-width="2" />
              <line x1="20" y1="-45" x2="20" y2="45" style="stroke: var(--colour-label)" stroke-width="2" />
              <path d="M 34,-40 A 10,10 0 0 0 34,-20 A 10,10 0 0 0 34,0 A 10,10 0 0 0 34,20 A 10,10 0 0 0 34,40" fill="none" style="stroke: var(--colour-series)" stroke-width="2.5" />
            </g>

            <!-- ══ Generic BJT divider-bias frame — footprint 340×535,
                 zero-based (translate(X,Y) lands on its own top-left
                 corner): VCC rail y=20, common rail y=535, base tap
                 (0,190)-(100,190), collector tap (240,190)-(340,190),
                 R1/R2 (base divider, x=85) at y=60/370, R3/R4 (collector/
                 emitter, x=225) at y=60/370, Q at (226,255). ══ -->
            <g id="voltage-divider-bias">
              <line x1="0" y1="20" x2="340" y2="20" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="0" y1="535" x2="340" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="0" y1="190" x2="100" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="100" cy="190" r="5" style="fill: var(--colour-series)" />
              <line x1="240" y1="190" x2="340" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="240" cy="190" r="5" style="fill: var(--colour-series)" />
              <line x1="100" y1="255" x2="209" y2="255" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="100" cy="255" r="5" style="fill: var(--colour-series)" />
              <line x1="100" y1="20" x2="100" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="100" cy="20" r="5" style="fill: var(--colour-series)" />
              <circle cx="100" cy="535" r="5" style="fill: var(--colour-series)" />
              <line x1="240" y1="20" x2="240" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="240" cy="20" r="5" style="fill: var(--colour-series)" />
              <circle cx="240" cy="535" r="5" style="fill: var(--colour-series)" />
              <g transform="translate(226,255)"><use href="#bjt-npn-shape" /></g>
              <g transform="translate(85,60)"><use href="#resistor-vertical" /></g>
              <g transform="translate(85,370)"><use href="#resistor-vertical" /></g>
              <g transform="translate(225,60)"><use href="#resistor-vertical" /></g>
              <g transform="translate(225,370)"><use href="#resistor-vertical" /></g>
            </g>

            <!-- ══ Generic JFET gate-resistor-bias frame — same 340×535
                 footprint/rail convention as voltage-divider-bias, but the
                 LEFT side only runs gate-tap(0,255)-(100,255) down through
                 RG (x=85,y=370) to the common rail — no VCC connection at
                 all on that side. RD (x=225,y=60) and RS (x=225,y=370)
                 sit on the drain/source rail exactly like RC/RE do in the
                 BJT frame. Q at (226,248) — shifted 7px up from the BJT
                 frame's own (226,255) so jfet-n-shape's own gate lead
                 (local y=+7, vs bjt-npn-shape's base lead at local y=0)
                 lands exactly on the y=255 gate-tap row. ══ -->
            <g id="jfet-single-stage-bias">
              <line x1="0" y1="20" x2="340" y2="20" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="0" y1="535" x2="340" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="0" y1="255" x2="100" y2="255" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="100" cy="255" r="5" style="fill: var(--colour-series)" />
              <line x1="100" y1="255" x2="100" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="100" cy="535" r="5" style="fill: var(--colour-series)" />
              <line x1="240" y1="190" x2="340" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="240" cy="190" r="5" style="fill: var(--colour-series)" />
              <line x1="240" y1="20" x2="240" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="240" cy="20" r="5" style="fill: var(--colour-series)" />
              <circle cx="240" cy="535" r="5" style="fill: var(--colour-series)" />
              <g transform="translate(226,248)"><use href="#jfet-n-shape" /></g>
              <g transform="translate(85,370)"><use href="#resistor-vertical" /></g>
              <g transform="translate(225,60)"><use href="#resistor-vertical" /></g>
              <g transform="translate(225,370)"><use href="#resistor-vertical" /></g>
            </g>

            <!-- ══ BJT single-stage reference circuit — voltage-divider-
                 bias with own values R1=91k/R2=24k/R3=8k2/R4=3k9,
                 C1=2µF input, C2=1µF output, β=120, +9V. NO emitter
                 bypass cap at all (R4 sits bare, unlike the two-stage
                 cascade's own first stage below) — deliberately, since
                 that's exactly why the "which components set f1" answer
                 here is just "C1 and C2", not a third bypass-cap factor
                 (contrast the JFET stage further down, where a THIRD
                 cap — a source bypass — does count). ══ -->
            <g id="fig-bjt-single-stage">
              <use href="#voltage-divider-bias" />
              <line x1="-90" y1="190" x2="0" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="340" y1="190" x2="430" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <use href="#cap-shape" transform="translate(-30,190)" />
              <use href="#cap-shape" transform="translate(370,190)" />
              <text x="-30" y="160" class="ckt-c-label">C1</text>
              <text x="-30" y="225" class="ckt-value">2µF</text>
              <text x="370" y="160" class="ckt-c-label">C2</text>
              <text x="370" y="225" class="ckt-value">1µF</text>
              <text x="-95" y="175" class="ckt-io-label" text-anchor="end">Input</text>
              <text x="435" y="175" class="ckt-io-label">Output</text>
              <text x="255" y="235" class="ckt-bjt-label">Q1, β = 120</text>
              <g transform="translate(85,60)"><text x="15" y="-8" class="ckt-r-label" text-anchor="middle">R1</text><text x="15" y="103" class="ckt-value">91kΩ</text></g>
              <g transform="translate(85,370)"><text x="15" y="-8" class="ckt-r-label" text-anchor="middle">R2</text><text x="15" y="103" class="ckt-value">24kΩ</text></g>
              <g transform="translate(225,60)"><text x="15" y="-8" class="ckt-r-label" text-anchor="middle">R3</text><text x="15" y="103" class="ckt-value">8k2Ω</text></g>
              <g transform="translate(225,370)"><text x="15" y="-8" class="ckt-r-label" text-anchor="middle">R4</text><text x="15" y="103" class="ckt-value">3k9Ω</text></g>
              <text x="360" y="5" class="ckt-rail-label">+9V</text>
              <text x="10" y="560" class="ckt-gnd-label">Common</text>
            </g>

            <!-- ══ JFET common-source stage — reworked with its own
                 values (RG=1M2/RD=4k7/RS=1k5, C1=220nF input, RL=1k8
                 load, +18V) rather than the handout's. Deliberately the
                 SAME RG/RD/RS/C-equivalent values as the two-stage
                 cascade's own second stage further down — this stage
                 design is genuinely reused twice, same as it always was,
                 just with fresh numbers throughout. ══ -->
            <g id="fig-jfet-single-stage">
              <use href="#jfet-single-stage-bias" />
              <line x1="-90" y1="255" x2="0" y2="255" style="stroke: var(--colour-series)" stroke-width="2" />
              <use href="#cap-shape" transform="translate(-30,255)" />
              <text x="-30" y="225" class="ckt-c-label">C1</text>
              <text x="-30" y="290" class="ckt-value">220nF</text>
              <text x="-95" y="240" class="ckt-io-label" text-anchor="end">Input</text>
              <line x1="240" y1="300" x2="330" y2="300" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="330" y1="300" x2="330" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <use href="#cap-shape" transform="translate(330,460) rotate(90)" />
              <text x="360" y="465" class="ckt-c-label">C3</text>
              <line x1="340" y1="190" x2="400" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <use href="#cap-shape" transform="translate(370,190)" />
              <text x="370" y="160" class="ckt-c-label">C2</text>
              <line x1="400" y1="190" x2="460" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="340" y1="535" x2="460" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="460" y1="190" x2="460" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <g transform="translate(445,300)">
                <use href="#resistor-vertical" />
                <text x="15" y="-8" class="ckt-r-label" text-anchor="middle">RL</text>
                <text x="15" y="103" class="ckt-value">1k8Ω</text>
              </g>
              <text x="270" y="220" class="ckt-jfet-label">Q1</text>
              <g transform="translate(85,370)"><text x="15" y="-8" class="ckt-r-label" text-anchor="middle">RG</text><text x="15" y="103" class="ckt-value">1M2</text></g>
              <g transform="translate(225,60)"><text x="15" y="-8" class="ckt-r-label" text-anchor="middle">RD</text><text x="15" y="103" class="ckt-value">4k7Ω</text></g>
              <g transform="translate(225,370)"><text x="15" y="-8" class="ckt-r-label" text-anchor="middle">RS</text><text x="15" y="103" class="ckt-value">1k5Ω</text></g>
              <text x="360" y="5" class="ckt-rail-label">+18V</text>
              <text x="10" y="560" class="ckt-gnd-label">Common</text>
            </g>

            <!-- ══ Two-stage BJT + JFET cascade — reworked with fresh
                 values throughout: BJT stage (voltage-divider-bias,
                 RB1=180k/RC=6k8/RB2=39k/RE=1k8, β=250, emitter bypass
                 C2=82µF) feeding the SAME JFET stage design as above
                 (RG=1M2/RD=4k7/RS=1k5) through interstage cap C3=220nF.
                 Both stages share one +18V/Common rail pair. Every gain/
                 f1 figure in Q16-21 below was independently computed from
                 THESE values (see each question's own working()), not
                 copied from anywhere. ══ -->
            <g id="fig-two-stage-bjt-jfet">
              <g transform="translate(0,0)"><use href="#voltage-divider-bias" /></g>
              <g transform="translate(500,0)"><use href="#jfet-single-stage-bias" /></g>
              <line x1="340" y1="20" x2="500" y2="20" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="340" y1="535" x2="500" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />

              <!-- Stage 1 input C1 -->
              <line x1="-90" y1="190" x2="0" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <use href="#cap-shape" transform="translate(-30,190)" />
              <text x="-30" y="160" class="ckt-c-label">C1</text>
              <text x="-30" y="225" class="ckt-value">1.5µF</text>
              <text x="-95" y="175" class="ckt-io-label" text-anchor="end">Input</text>

              <!-- Stage 1 emitter bypass (RE = R4 slot) -->
              <line x1="240" y1="300" x2="330" y2="300" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="330" y1="300" x2="330" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <use href="#cap-shape" transform="translate(330,460) rotate(90)" />
              <text x="360" y="465" class="ckt-c-label">C2</text>
              <text x="360" y="485" class="ckt-value">82µF</text>

              <!-- Interstage coupling C3, collector (stage1) -> gate (stage2) -->
              <line x1="340" y1="190" x2="420" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="420" y1="190" x2="420" y2="255" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="420" y1="255" x2="500" y2="255" style="stroke: var(--colour-series)" stroke-width="2" />

    // ══════════════════════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: "Identify capacitive and transformer coupling in
        // multistage transistor amplifiers given a schematic diagram" —
        // uses the always-static #circuitCol diagram above (mirrors the
        // textbook's own "Figure 2" 3-stage block diagram). 2 of the 4
        // labelled points are genuinely both "interstage coupling", so
        // this is a 4-option/3-column match, not a 1-to-1 one.
        leftPanel: 'circuit',
        circuitId: 'fig-coupling-stages',
        circuitLabel: 'Figure 1 — 3-stage cascaded amplifier',
        circuitViewBox: '0 0 700 210',
        kind: 'match',
        columns: () => ['Input coupling', 'Interstage coupling', 'Output coupling'],
        text: () => `Look at <b style="color:var(--colour-ui-primary)">Figure 1</b>. <b style="color:var(--colour-ui-primary)">Place</b> each labelled capacitor under the type of coupling it provides.`,
        hint: () => `"Interstage" just means "between two amplifier stages" — as opposed to between the signal source and the first stage, or between the last stage and the load.`,
        options: () => shuffle([
          { label: 'Capacitor A', col: 0 },
          { label: 'Capacitor B', col: 1 },
          { label: 'Capacitor C', col: 1 },
          { label: 'Capacitor D', col: 2 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 capacitors correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} capacitors correctly matched`;
        },
        working: () => `
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Capacitor A</b> sits between the signal source and Stage 1 — <b>input coupling</b>.</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Capacitors B and C</b> each sit between two amplifier stages (Stage 1→2, Stage 2→3) — <b>interstage coupling</b>. A 3-stage amplifier has 2 interstage coupling capacitors, one per join.</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Capacitor D</b> sits between the last stage and the load — <b>output coupling</b>.</div>
    <div class="working-total">Every one of these does the same job wherever it sits: block DC, pass the AC signal.</div>`
      },
      {
        // Objective: "List three methods for coupling stages in a
        // multistage amplifier". The whiteboard also mentions a 4th
        // "light/IR" method as an aside, separate from the textbook's own
        // "three main ways" list — included here as a wrong option with an
        // explanatory (not dismissive) working note, not as a 4th correct
        // answer, to stay faithful to the objective's own wording.
        kind: 'multi',
        text: () => `<b style="color:var(--colour-ui-primary)">Click</b> the <b style="color:var(--colour-ui-correct)">three</b> main methods used to couple stages together in a multistage transistor amplifier.`,
        hint: () => `Think about what physically sits between two stages to pass the signal from one to the next.`,
        options: () => shuffle([
          { label: 'Capacitive coupling', type: 'correct' },
          { label: 'Transformer (magnetic) coupling', type: 'correct' },
          { label: 'Direct coupling', type: 'correct' },
          { label: 'Optical/infrared (IR) coupling', type: 'wrong' },
          { label: 'Resistive-only coupling', type: 'wrong' },
          { label: 'Wireless RF coupling', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are the three main coupling methods`;
        },
        working: () => `
    <div class="working-step">The three main coupling methods:</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Capacitive coupling</b> — a series capacitor between stages.</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Transformer (magnetic) coupling</b> — a transformer's primary/secondary windings link the stages.</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Direct coupling</b> — stages wired straight together, no capacitor or transformer in between.</div>
    <div class="working-step" style="margin-top:.6rem">Optical/infrared coupling is real (e.g. an opto-isolator between stages) but it's a less common, specialised method — not one of the three main ones this objective is asking for. "Resistive-only" and "wireless RF" coupling aren't standard multistage-amplifier coupling methods at all.</div>`
      },
      {
        // Objective: "Describe the advantages, disadvantages and
        // characteristics of capacitive and transformer coupling in
        // multistage transistor amplifiers." Direct coupling's own
        // adv/disadv aren't in the source material yet (see file header
        // note) — only capacitive vs transformer are covered here.
        kind: 'match',
        columns: () => ['Capacitive Coupling', 'Transformer Coupling'],
        text: () => `Each feature below describes either <b style="color:var(--colour-ui-primary)">capacitive</b> or <b style="color:var(--colour-ui-primary)">transformer</b> coupling. <b style="color:var(--colour-ui-primary)">Place</b> each one under the correct method.`,
        hint: () => `Which method uses a physical winding/turns-ratio, and which one is just a single component in series with the signal path?`,
        options: () => shuffle([
          { label: `Uses a series capacitor between stages — blocks DC while still passing the AC signal`, col: 0 },
          { label: `Small, light and inexpensive — the most commonly used coupling method`, col: 0 },
          { label: `Low-frequency response is limited by the coupling capacitor's own reactance (Xc) — this sets f1`, col: 0 },
          { label: `Uses a transformer's primary/secondary windings — magnetically linked, no direct electrical connection between stages`, col: 1 },
          { label: `Can provide impedance matching between stages, via the transformer's turns ratio`, col: 1 },
          { label: `Bulky, heavy and comparatively expensive; frequency response is limited at BOTH low and high frequencies`, col: 1 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 6 features correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} features correctly matched`;
        },
        working: () => `
    <div class="working-line"><b style="color:var(--colour-ui-primary)">Capacitive coupling</b> is just one component (a capacitor) in series with the signal path — cheap, small and light, which is why it's the default choice. Its downside is purely a frequency-response one: the smaller Xc gets as frequency rises, the better it passes the signal, but at low frequencies Xc grows large enough to start attenuating the signal — that's exactly what sets the lower roll-off frequency f1.</div>
    <div class="working-line"><b style="color:var(--colour-ui-primary)">Transformer coupling</b> trades that simplicity for a genuine advantage capacitive coupling can't offer at all — impedance matching via the turns ratio — at the cost of size, weight, cost, and a frequency response that's limited at both ends (winding inductance/leakage and stray capacitance affect high AND low frequencies, not just low).</div>`
      },
      {
        // Objective: "Calculate and measure the total gain of a
        // capacitively coupled two stage transistor amplifier (without
        // global feedback)". Plain multiply-the-ratios calculation —
