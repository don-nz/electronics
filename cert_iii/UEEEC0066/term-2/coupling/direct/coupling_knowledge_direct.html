  <script>
    CIRCUIT_SVG_ID = 'circuitSvg';

    // QUESTIONS
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Objective: "Identify direct coupling... given a schematic diagram."
        leftPanel: 'none',
        text: () => `What single feature of a multistage amplifier's own schematic tells you its stages are <b style="color:var(--colour-ui-primary)">directly</b> coupled, rather than capacitively coupled?`,
        hint: () => `Think about what's physically sitting in the signal path between the two stages — or rather, what ISN'T.`,
        options: () => shuffle([
          { label: `There's no capacitor (or transformer) anywhere between the two stages — just a plain wire`, type: 'correct' },
          { label: `The interstage coupling capacitor's value is unusually large` },
          { label: `Both stages are biased from the same supply rail` },
          { label: `The circuit uses an odd number of transistors` },
        ]),
        correctExplain: () => `No capacitor or transformer at all between the stages — just a plain wire`,
        working: () => `
    <div class="working-line">Direct coupling means exactly what it says: one stage's output connects <b style="color:var(--colour-ui-correct)">straight into</b> the next stage's input, with nothing in between — no capacitor, no transformer. That's the one feature to look for on a schematic.</div>
    <div class="working-total">Sharing a supply rail is completely normal for capacitively- or transformer-coupled stages too — it says nothing about the coupling method itself.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'fig-direct-two-stage',
        circuitLabel: 'Two-stage direct-coupled amplifier',
        circuitViewBox: '-80 -20 900 600',
        text: () => `Looking at the circuit below, which connection is what actually identifies it as direct-coupled?`,
        hint: () => `Trace the wire leaving Q1's own collector all the way to Q2.`,
        options: () => shuffle([
          { label: `Q1's collector wires straight into Q2's base, with nothing else in between`, type: 'correct' },
          { label: `R4 sitting in Q1's own emitter lead` },
          { label: `Both stages being biased from the same +18V rail` },
          { label: `Q2 having its own separate RC2/RE2 resistors` },
        ]),
        correctExplain: () => `Q1's collector connects straight into Q2's base — no capacitor, no resistor, nothing`,
        working: () => `
    <div class="working-line">Follow the wire from Q1's own collector — it runs straight across to Q2's base with no component of any kind sitting in it. That unbroken wire IS the direct coupling.</div>
    <div class="working-total">RE (in either stage), the shared supply rail, and Q2 having its own RC2/RE2 are all completely normal features of an ordinary CE stage — none of them, on their own, says anything about HOW the two stages are coupled together.</div>`
      },
      {
        // Objective: advantages of direct coupling.
        leftPanel: 'none',
        kind: 'multi',
        text: () => `<b style="color:var(--colour-ui-primary)">Click</b> every genuine advantage of direct coupling below.`,
        hint: () => `Think about what a SERIES coupling capacitor always costs you, frequency-response-wise and component-count-wise — direct coupling has neither cost.`,
        options: () => shuffle([
          { label: `Can amplify DC and very low-frequency signals — there's no series capacitor to create a lower roll-off (f1) at all`, type: 'correct' },
          { label: `Needs fewer components than capacitive coupling — no interstage coupling capacitor to select or fit`, type: 'correct' },
          { label: `Each stage's own DC bias point is completely independent of every other stage` },
          { label: `Improves the amplifier's upper roll-off (f2) frequency` },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are genuine advantages`;
        },
        working: () => `
    <div class="working-line">With no series capacitor anywhere in the signal path, there's nothing to create a lower roll-off frequency at all — direct coupling can amplify true <b style="color:var(--colour-ui-correct)">DC</b>, right down to 0Hz. It also needs <b style="color:var(--colour-ui-correct)">fewer components</b> than an equivalent capacitively-coupled design, since there's no interstage coupling capacitor to buy, fit, or pick a value for.</div>
    <div class="working-total">Every stage's own DC bias point is the OPPOSITE of independent — it depends directly on the stage before it (see the next question). And direct coupling has no effect on f2 at all — f2 is set by parallel/stray capacitance, not by anything a coupling METHOD changes.</div>`
      },
      {
        // Objective: disadvantages of direct coupling.
        leftPanel: 'none',
        kind: 'multi',
        text: () => `<b style="color:var(--colour-ui-primary)">Click</b> every genuine disadvantage of direct coupling below.`,
        hint: () => `With no capacitor blocking DC between stages, what happens to a small DC error once it reaches the NEXT stage's own base?`,
        options: () => shuffle([
          { label: `A temperature-induced DC drift in an early stage is passed straight on AND amplified by every later stage`, type: 'correct' },
          { label: `Every stage's own bias point depends on the stage before it, making the whole bias network harder to design`, type: 'correct' },
          { label: `It can only ever be used for exactly two stages` },
          { label: `It requires a coupling capacitor rated for an unusually high working voltage` },
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          return `Options <b>${nums}</b> are genuine disadvantages`;
        },
        working: () => `
    <div class="working-line">Because there's no capacitor to block it, any small DC drift in an early stage (from temperature, component ageing, etc) passes straight through to every later stage — and gets <b style="color:var(--colour-ui-correct)">amplified</b> at each one along the way, same as a real signal would be. That also means every stage's own Q-point depends on the one before it, so the whole bias chain has to be designed together rather than one stage at a time.</div>
    <div class="working-total">There's no hard limit on the NUMBER of directly-coupled stages, and direct coupling has nothing to do with capacitor voltage ratings at all — it has no coupling capacitor to rate in the first place.</div>`
      },
      {
        leftPanel: 'circuit',
        circuitId: 'fig-direct-two-stage',
        circuitLabel: 'Two-stage direct-coupled amplifier',
        circuitViewBox: '-80 -20 900 600',
        text: () => `Calculate V<sub>B1</sub> — the DC base voltage of Q1.`,
        hint: () => `V<sub>B1</sub> = V<sub>CC</sub> × R<sub>B2</sub>/(R<sub>B1</sub>+R<sub>B2</sub>)`,
        options: () => shuffle([
          { label: `<b class="colour-voltage">VB1</b> = <b class="colour-voltage">VCC</b> × ${frac('<b class="colour-resistor">RB2</b>', '<b class="colour-resistor">RB1</b>+<b class="colour-resistor">RB2</b>')} = 18V × ${frac('18kΩ', '100kΩ')} ≈ 3.24V`, type: 'correct' },
