<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    Negative Feedback Overview — a review of the whole negative feedback lesson, built from the class
    notes and the board work. It covers what the Basics and Connections quizzes leave out: positive
    vs negative feedback, deriving the general feedback equation, why a huge open-loop gain gives a
    "rock steady" closed-loop gain (and low distortion), the op amp as a feedback system, AC / DC /
    frequency-selective feedback, why an unbypassed RE works, local vs global feedback, and why a
    connection has to suit the number of stages (the feedback must stay negative).

    Circuits and graphs are static <g id="fig-..."> groups inside <defs>, shown through the single
    <use id="circuitRefUse"> in #circuitSvg and swapped per question by quiz-engine.js's
    showCircuitRef() from each question's circuitId / circuitViewBox (same standard as
    neg_feedback_knowledge_connections.html). Q9's feedback factor is randomised on every
    resetQuiz() via RESET_EXTRA, and once at load so ?q=N deep-links have valid values.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../../assets/theme-init.js"></script>
  <script src="../../../../assets/shapes.js"></script>
  <script src="../../../../assets/quiz-engine.js"></script>
  <title>Negative Feedback Overview Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../../assets/quiz-common.css">
  <script src="../../../../assets/breadcrumb.js" defer></script>
  <style>
    .ckt-r-label { fill: var(--colour-resistor-labels); font-size: 16px; font-weight: 700; }
    .ckt-c-label { fill: var(--colour-capacitor); font-size: 16px; font-weight: 700; }
    .ckt-value { fill: var(--colour-text); font-size: 14px; font-weight: 700; text-anchor: middle; }
    .ckt-bjt-label { fill: var(--colour-bjt-labels); font-size: 16px; font-weight: 700; }
    .ckt-rail-label { fill: var(--colour-voltage-label); font-size: 16px; font-weight: 700; }
    .ckt-io-label { fill: var(--colour-signal); font-size: 16px; font-weight: 700; }
    .ckt-note { fill: var(--colour-text); font-size: 13px; font-weight: 700; }
    .gr-axis { stroke: var(--colour-text); stroke-width: 1.5px; fill: none; }
    .gr-curve { stroke: var(--colour-series); stroke-width: 2.5px; fill: none; }
    .gr-wave { stroke: var(--colour-signal); stroke-width: 2.5px; fill: none; }
    .gr-mid { stroke: var(--colour-border); stroke-width: 1px; stroke-dasharray: 4 3; }
    .gr-tick { fill: var(--colour-text); font-size: 11px; text-anchor: middle; }
    .gr-lab { stroke: var(--colour-panel); stroke-width: 3px; paint-order: stroke; }
    .gr-title { fill: var(--colour-ui-primary); font-size: 15px; font-weight: 700;  stroke: var(--colour-panel); stroke-width: 4px; paint-order: stroke; }
    /* tiny symbols inside the "which signals does it pass" chips */
    .sym { width: 74px; height: 34px; flex: none; margin-right: .5rem; vertical-align: middle; }
    .sym * { stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .sym .dot { fill: currentColor; stroke: none; }
  </style>
</head>

    // ── Small colour helpers (the shared .colour-* classes) ──
    const gain  = (s) => `<b class="colour-gain">${s}</b>`;
    const beta  = `<b class="colour-bjt">β</b>`;
    const volt  = (s) => `<b class="colour-voltage">${s}</b>`;
    const res   = (s) => `<b class="colour-resistor">${s}</b>`;
    const AOL   = gain('A<sub>OL</sub>');
    const ACL   = gain('A<sub>CL</sub>');
    const VIN   = volt('V<sub>in</sub>');
    const VOUT  = volt('V<sub>out</sub>');

    function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function fmtNum(n) { return Number(n.toPrecision(3)).toString(); }
    function kOhm(r) { const t = r >= 1000 ? (r / 1000) + 'k' : r + 'Ω'; return `<span class="colour-resistor">${t}</span>`; }

    // ── Randomised values (Q9) ──
    // Picked fresh on every resetQuiz() via RESET_EXTRA, and once at load so a ?q=N
    // deep-link (which skips RESET_EXTRA) still has valid values.
    let Q6V = {};
    function randomizeCalcs() {
      // Q9: β for the non-inverting op amp, β = R1/(R1 + Rf). Rejection-sample so the
      // four candidate answers are all distinct.
      let a;
      do {
        const r1 = randPick([1000, 2000, 4700, 10000]);
        const rf = randPick([9000, 18000, 22000, 47000]);
        a = { r1, rf, beta: r1 / (r1 + rf) };
        a.cands = [a.beta, rf / (r1 + rf), r1 / rf, 1 + rf / r1];
      } while (new Set(a.cands.map(x => Math.round(x * 1000) / 1000)).size !== 4);
      Q6V = a;
    }
    randomizeCalcs();

    // ── Q3: the derivation, one valid order (each line comes from the one before it) ──
    // The first line is given in the question; the five lines after it are what the student orders.
    const DERIVE_START = `${gain('A')} × ${volt('V<sub>A</sub>')} = ${VOUT}`;
    const DERIVE_VA = `${volt('V<sub>A</sub>')} = ${VIN} − ${beta} × ${VOUT}`;   // what the summing network delivers
    const DERIVE = [
      ['d2', `${gain('A')} × (${VIN} − ${beta} × ${VOUT}) = ${VOUT}`],
      ['d3', `(${gain('A')} × ${VIN}) − (${gain('A')} × ${beta} × ${VOUT}) = ${VOUT}`],
      ['d4', `${gain('A')} × ${VIN} = ${VOUT} + (${gain('A')} × ${beta} × ${VOUT})`],
      ['d5', `${gain('A')} × ${VIN} = ${VOUT} × (1 + (${gain('A')} × ${beta}))`],
      ['d6', `${frac(VOUT, VIN)} = ${frac(gain('A'), `1 + (${gain('A')} × ${beta})`)}`]
    ];

    // ── Q12: the correction chain when V_E rises, one valid (strict) order ──
    // Step 1 (V_E rises) is given in the question, so the student only orders the three that follow it.
    const RE_START = `${volt('V<sub>E</sub>')} ↑`;

      ['c3', `<b class="colour-current">I<sub>C</sub></b> ↓`],

      {

          { label: 'Adds to the original input', col: 0 },

          { label: 'Subtracts from the original input', col: 1 },

    <div class="working-line" style="margin-top:.6rem"><b style="color:var(--colour-ui-correct)">Frequency-selective feedback</b> puts a filter (high-pass, low-pass, band-pass or band-stop) in the feedback path, so negative feedback is applied to a range of frequencies but not to all of them.</div>`
      },

      // ── Q11: which signals does each feedback element pass? ──
      {
        kind: 'match',
        columns: () => ['AC and DC', 'AC only', 'DC only'],
        text: () => `Each symbol below is the <b style="color:var(--colour-ui-primary)">only</b> thing in a feedback path, apart from the wire. <b style="color:var(--colour-ui-primary)">Place</b> each one under the signals the feedback will apply to.`,
        hint: () => `A capacitor is an open circuit to DC but passes AC; an inductor is the other way round. Ask what is left over once the path has been blocked or shunted away.`,
        options: () => shuffle([
          { label: symChip('wire', 'Plain wire'), col: 0 },
          { label: symChip('res', 'Resistor'), col: 0 },
          { label: symChip('cap', 'Series capacitor'), col: 1 },
          { label: symChip('xfmr', 'Transformer'), col: 1 },
          { label: symChip('ind', 'Series inductor'), col: 2 },
          { label: symChip('rcgnd', 'Resistor, then a capacitor to ground'), col: 2 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 6 correctly sorted' : `${st.opts.length - wrongCount} of ${st.opts.length} correctly sorted`;
        },
        working: () => `
    <div class="working-line"><b style="color:var(--colour-ui-correct)">AC and DC:</b> a plain wire or a resistor (non-reactive parts) passes both.</div>
    <div class="working-line" style="margin-top:.6rem"><b style="color:var(--colour-ui-correct)">AC only:</b> a series capacitor blocks DC, and a transformer has no DC path between its windings, so only the changing signal gets through.</div>
    <div class="working-line" style="margin-top:.6rem"><b style="color:var(--colour-ui-correct)">DC only:</b> a series inductor blocks AC and passes DC. A capacitor to ground after a resistor does the same job a different way: it shunts the AC to ground, leaving only DC to carry on.</div>`
      },

      // ── Q12: why an unbypassed RE gives negative feedback (order the correction chain) ──
      {
        kind: 'match',
        order: true,
        numbered: true,
        keepPicker: true,
        orderCols: 2,
        prefilled: [RE_START],   // step 1 is given (locked), so the steps to click are numbered 2 to 4
        leftPanel: 'circuit',
        circuitId: 'fig-ce-re',
        circuitLabel: 'Common-emitter stage, unbypassed RE',
        circuitViewBox: '0 0 340 340',
        columns: () => RE_CHAIN.map((_, i) => `${i + 2}`),
        text: () => `${volt('V<sub>B</sub>')} is held <b>fixed</b> by the base divider (${res('R<sub>B1</sub>')} and ${res('R<sub>B2</sub>')}); the signal ${VIN} arrives through the coupling capacitor. Something makes ${volt('V<sub>E</sub>')} rise (step 1), so the unbypassed ${res('R<sub>E</sub>')} corrects it. Click the next ${RE_CHAIN.length} steps of the correction in order — a number appears beside each one, 2 to ${RE_CHAIN.length + 1}.`,
        hint: () => `${volt('V<sub>BE</sub>')} = ${volt('V<sub>B</sub>')} − ${volt('V<sub>E</sub>')}. With ${volt('V<sub>B</sub>')} fixed, think about what a change in ${volt('V<sub>E</sub>')} does to ${volt('V<sub>BE</sub>')}, and what ${volt('V<sub>BE</sub>')} controls.`,
        options: () => shuffle(RE_CHAIN.map(([key, label], i) => ({
          label: `<span>${label}</span>`, key, col: i,
          after: i ? [RE_CHAIN[i - 1][0]] : []
        }))),
        correctExplain: (st) => {
          const ok = st.opts.filter((o, i) => orderChipOk(st, i)).length;
          return ok === st.opts.length ? `All ${st.opts.length} steps are in the right order` : `${ok} of ${st.opts.length} steps in the right place`;
        },
        working: () => `
    <div class="working-line">${volt('V<sub>E</sub>')} ↑ → with ${volt('V<sub>B</sub>')} fixed, ${volt('V<sub>BE</sub>')} = ${volt('V<sub>B</sub>')} − ${volt('V<sub>E</sub>')} falls ↓ → the transistor conducts less, so <b class="colour-current">I<sub>C</sub></b> ↓ (and ${res('R<sub>E</sub>')}'s current with it) → the voltage across ${res('R<sub>E</sub>')}, ${volt('V<sub>E</sub>')}, falls back ↓.</div>
    <div class="working-line" style="margin-top:.6rem">The change at the emitter has been <b style="color:var(--colour-ui-correct)">corrected</b>: negative feedback.</div>
    <div class="working-line" style="margin-top:.6rem">It also reduces the gain. Without ${res('R<sub>E</sub>')} the stage gain is ${frac(res('R<sub>C</sub>'), `<b class="colour-bjt">r<sub>e</sub>′</b>`)}; with unbypassed ${res('R<sub>E</sub>')} it becomes ${frac(res('R<sub>C</sub>'), `<b class="colour-bjt">r<sub>e</sub>′</b> + ${res('R<sub>E</sub>')}`)}, which is smaller.</div>`
      },

      // ── Q13: local vs global feedback ──
      {
        kind: 'match',
        leftPanel: 'circuit',
        circuitId: 'fig-two-stage',
        circuitLabel: 'Two-stage amplifier with R9 fed back from the output',
        circuitViewBox: '0 0 510 390',
        columns: () => ['Local feedback', 'Global feedback'],
        text: () => `${res('R<sub>8</sub>')} gives Q2 feedback on its own, while ${res('R<sub>9</sub>')} returns the final output to Q1. <b style="color:var(--colour-ui-primary)">Place</b> each description under the kind of feedback it describes.`,
        hint: () => `Count how many stages the feedback path covers: one stage on its own, or the whole amplifier.`,
        options: () => shuffle([
          { label: `${res('R<sub>8</sub>')}, the emitter resistor of Q2`, col: 0 },
          { label: 'Applied to a single stage', col: 0 },
          { label: 'Improves the performance of that stage only', col: 0 },
          { label: `${res('R<sub>9</sub>')}, from the output back to the emitter of Q1`, col: 1 },
          { label: 'Applied across the whole (or a large section of) the amplifier', col: 1 },
          { label: 'Improves the overall performance of the whole amplifier', col: 1 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 6 correctly sorted' : `${st.opts.length - wrongCount} of ${st.opts.length} correctly sorted`;
        },
        working: () => `
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Local feedback</b> is applied to a single stage and improves that stage only. ${res('R<sub>4</sub>')} does this for stage 1 and ${res('R<sub>8</sub>')} for stage 2.</div>
    <div class="working-line" style="margin-top:.6rem"><b style="color:var(--colour-ui-correct)">Global feedback</b> is applied across the whole amplifier (or a large section of it) and improves the overall performance. ${res('R<sub>9</sub>')}, returning the final output to the first stage, provides it, working together with ${res('R<sub>4</sub>')}.</div>`
      },

      // ── Q14: why a connection must suit the number of stages (feedback must stay negative) ──
      {
        kind: 'match',
        leftPanel: 'circuit',
        circuitId: 'fig-two-stage',
        circuitLabel: 'Two-stage amplifier with R9 fed back from the output',
        circuitViewBox: '0 0 510 390',
        columns: () => ['An even number of stages', 'An odd number of stages (or a single stage)'],
        text: () => `Not every negative feedback connection can be applied to every amplifier — the feedback has to <b>remain negative</b>. <b style="color:var(--colour-ui-primary)">Place</b> each connection under the number of stages it needs.`,
        hint: () => `Count the inversions between the point the feedback is taken from and the point it is fed into: a collector stage inverts the signal, an emitter does not. Series feedback goes into an emitter; shunt feedback goes into a base.`,
        options: () => shuffle([
          { label: 'Voltage-series (taken from a collector, fed into an emitter)', col: 0 },
          { label: 'Current-shunt (taken from an emitter, fed into a base)', col: 0 },
          { label: 'Voltage-shunt (taken from a collector, fed into a base)', col: 1 },
          { label: 'Current-series (taken from an emitter, fed into an emitter)', col: 1 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 connections correctly placed' : `${st.opts.length - wrongCount} of ${st.opts.length} connections correctly placed`;
        },
        working: () => `
    <div class="working-line">Feedback is negative only when it is fed back with the <b>right phase</b>. Each stage from base to collector gives one inversion; an <b>odd</b> number of inversions means the signal comes back inverted, and an <b>even</b> number means it comes back in phase.</div>
    <div class="working-line" style="margin-top:.6rem">An in-phase signal fed into a <b>base</b> adds to the input, which is positive feedback. So feedback fed into a base needs an inversion somewhere along the way.</div>
    <div class="working-line" style="margin-top:.6rem">The same in-phase signal fed into an <b>emitter</b> subtracts from V<sub>BE</sub>, which is negative, so series feedback into an emitter needs the signal to come back in phase.</div>
    <div class="working-line" style="margin-top:.6rem"><b style="color:var(--colour-ui-correct)">Voltage-series</b>: from a collector (an inversion for every stage) into an emitter, so the number of stages must be <b>even</b>, as with ${res('R<sub>9</sub>')} on the circuit. <b style="color:var(--colour-ui-correct)">Voltage-shunt</b>: from a collector into a base, so <b>odd or single</b>. <b style="color:var(--colour-ui-correct)">Current-series</b>: from an emitter (one less inversion) into an emitter, so <b>odd or single</b>; with a single stage it is just ${res('R<sub>E</sub>')}. <b style="color:var(--colour-ui-correct)">Current-shunt</b>: from an emitter into a base, so <b>even</b>.</div>`
      }
    ];

    // Each question's circuitId/circuitViewBox handles the figure swap through
    // quiz-engine.js's showCircuitRef(); nothing extra is needed here.

    RESET_EXTRA = randomizeCalcs;

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
