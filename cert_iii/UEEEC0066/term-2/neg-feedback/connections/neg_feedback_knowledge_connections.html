<!--
  Source material: the teacher's own "Negative feedback connections"
  objectives page (Purpose + 7 bullet objectives), a printed Review Questions
  sheet (16 questions, 4 circuit figures) and an answer sheet for Section 5.
  Same policy as this project's other review-sheet-backed quizzes: the review
  questions are REFERENCE ONLY for topic coverage, never copied — every
  question below, including its wording and numbers, is original.

  Circuits are redrawn fresh (not traced from the photographed figures) and
  follow the diff_amp_knowledge_basics.html diagram standard: static
  <g id="fig-..."> reference circuits inside <defs>, shown via the single
  <use id="circuitRefUse"> in #circuitSvg and swapped per question by
  quiz-engine.js's showCircuitRef() from each question's circuitId /
  circuitViewBox. Shared parts (op-amp, resistor, ground and BJT shapes) are
  defined once in <defs>.

  Four basic connections are named by how the feedback is MIXED at the input
  (series or shunt) and how the output is SAMPLED (voltage or current):
  voltage-series, voltage-shunt, current-series, current-shunt.

  Calculation questions (Q8, Q9) randomise their component values on every
  resetQuiz() (RESET_EXTRA, also called once at load so ?q=N deep-links always
  have valid values — see reset_extra_skipped_on_deep_link.md in the memory
  folder). Every wrong option is a specific, plausible mistake (dropping the
  "1 +", dropping the minus sign, inverting the ratio).

  All 13 questions cover the 7 objectives.
-->

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    // ── Randomised calculation values (Q8, Q9) ──
    // Picked fresh on every resetQuiz() via RESET_EXTRA, and once at load so
    // a ?q=N deep-link (which skips RESET_EXTRA) still has valid values.
    function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function fmtNum(n) { return Number(n.toPrecision(3)).toString(); }
    function kOhm(r) { const t = r >= 1000 ? (r / 1000) + 'k' : r + 'Ω'; return `<span class="colour-resistor">${t}</span>`; }

    let Q8V = {}, Q9V = {};
    function randomizeCalcs() {
      // Q8: non-inverting gain, ideal op amp: Av = 1 + Rf/R1.
      // Rejection-sample so the four candidate answers are all distinct.
      let a;
      do {
        const r1 = randPick([1000, 2200, 4700, 10000]);
        const rf = randPick([10000, 22000, 47000, 100000]);
        a = { r1, rf, av: 1 + rf / r1, beta: r1 / (r1 + rf) };
        a.cands = [a.av, rf / r1, r1 / rf, 1 - rf / r1];
      } while (new Set(a.cands.map(x => Math.round(x * 100) / 100)).size !== 4);
      Q8V = a;

      // Q9: inverting gain, ideal op amp: Av = −Rf/Rin.
      let b;
      do {
        const rin = randPick([1000, 2200, 4700, 10000]);
        const rf = randPick([10000, 22000, 47000, 100000]);
        b = { rin, rf, av: -rf / rin };
        b.cands = [b.av, -b.av, -(1 + rf / rin), -(rin / rf)];
      } while (new Set(b.cands.map(x => Math.round(x * 100) / 100)).size !== 4);
      Q9V = b;
    }
    randomizeCalcs();

    const QUESTIONS = [
      {
        // Name the connection: non-inverting op amp (figure shown).
        leftPanel: 'circuit',
        circuitId: 'fig-noninv',
        circuitLabel: 'Non-inverting op amp',
        circuitViewBox: '0 0 340 340',
        text: () => `Looking at the circuit below, which of the four basic negative feedback connections does it use?`,
        hint: () => `Look at two things: how the feedback signal is connected to the input (series or shunt), and what part of the output it samples (the output voltage or the output current).`,
        options: () => shuffle([
          { label: 'Voltage-series', type: 'correct' },
          { label: 'Voltage-shunt', type: 'wrong' },
          { label: 'Current-series', type: 'wrong' },
          { label: 'Current-shunt', type: 'wrong' },
        ]),
        correctExplain: () => `The non-inverting op amp is a <b>voltage-series</b> connection`,
        working: () => `
    <div class="working-line">The feedback from <span class="colour-resistor">Rf</span> and <span class="colour-resistor">R1</span> is taken from the output <b style="color:var(--colour-ui-correct)">voltage</b> (it is a divider across <span class="colour-voltage">Vout</span>), so the connection <b>samples voltage</b>.</div>
    <div class="working-line" style="margin-top:.6rem">The feedback voltage is connected to the (−) input in <b style="color:var(--colour-ui-correct)">series</b> with <span class="colour-voltage">Vin</span> (the input voltage and the feedback voltage add in the input loop), so it <b>mixes in series</b>. Voltage + series = <b>voltage-series</b>.</div>`
      },
      {
        // Name the connection: inverting op amp (figure shown).
        leftPanel: 'circuit',
        circuitId: 'fig-inv',
        circuitLabel: 'Inverting op amp',
        circuitViewBox: '0 0 340 340',
        text: () => `Looking at the circuit below, which of the four basic negative feedback connections does it use?`,
        hint: () => `Look at where the feedback resistor meets the (−) input. Is the feedback signal in parallel with the input signal, or in series with it?`,
        options: () => shuffle([
          { label: 'Voltage-shunt', type: 'correct' },
          { label: 'Voltage-series', type: 'wrong' },
          { label: 'Current-series', type: 'wrong' },
          { label: 'Current-shunt', type: 'wrong' },
        ]),
        correctExplain: () => `The inverting op amp is a <b>voltage-shunt</b> connection`,
        working: () => `
    <div class="working-line"><span class="colour-resistor">Rf</span> takes its feedback from the output <b style="color:var(--colour-ui-correct)">voltage</b>, so the connection <b>samples voltage</b>.</div>
    <div class="working-line" style="margin-top:.6rem">Both <span class="colour-voltage">Vin</span> (through <span class="colour-resistor">Rin</span>) and the feedback current arrive at the same (−) node, so the feedback is connected in <b style="color:var(--colour-ui-correct)">shunt</b> (in parallel) with the input. Voltage + shunt = <b>voltage-shunt</b>.</div>`
      },
      {
        // Name the connection: emitter resistor, no bypass capacitor.
        leftPanel: 'circuit',
        circuitId: 'fig-ce-re',
        circuitLabel: 'Common-emitter stage, unbypassed RE',
        circuitViewBox: '0 0 340 340',
        text: () => `Looking at the circuit below, the emitter resistor <b style="color:var(--colour-ui-primary)">RE</b> has no bypass capacitor. Which negative feedback connection does it provide?`,
        hint: () => `RE carries the emitter current, which is the same as the load current in this stage. Is that a voltage or a current being sampled, and is the feedback in series or in parallel with the base input?`,
        options: () => shuffle([
          { label: 'Current-series', type: 'correct' },
          { label: 'Voltage-series', type: 'wrong' },
          { label: 'Voltage-shunt', type: 'wrong' },
          { label: 'Current-shunt', type: 'wrong' },
        ]),
        correctExplain: () => `The unbypassed emitter resistor gives a <b>current-series</b> connection`,
        working: () => `
    <div class="working-line"><span class="colour-resistor">RE</span> sees the emitter current, which is the same current the stage delivers to its output, so the connection <b style="color:var(--colour-ui-correct)">samples current</b>.</div>
    <div class="working-line" style="margin-top:.6rem">The voltage developed across <span class="colour-resistor">RE</span> is in <b style="color:var(--colour-ui-correct)">series</b> with the base-emitter input loop, so the feedback is series mixed. Current + series = <b>current-series</b>.</div>`
      },
      {
        // Match: the four connections, one description each.
        kind: 'match',
        columns: () => ['Voltage-series', 'Voltage-shunt', 'Current-series', 'Current-shunt'],
        text: () => `Each description below matches one of the four basic connections. <b style="color:var(--colour-ui-primary)">Place</b> each one under the connection it describes.`,
        hint: () => `Start with the output: does the connection sample the output voltage or the output current? Then look at the input: is the feedback in series with the input or in shunt (parallel) with it?`,
        options: () => shuffle([
          { label: 'Feedback in series with the input, samples the output voltage', col: 0 },
          { label: 'Feedback in parallel with the input, samples the output voltage', col: 1 },
          { label: 'Feedback in series with the input, samples the output current', col: 2 },
          { label: 'Feedback in parallel with the input, samples the output current', col: 3 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 connections correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} connections correctly matched`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Misplaced:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">Two independent choices give the four names:</div>
    <div class="working-line"><b>Sampling</b>: voltage sampling takes a fraction of <span class="colour-voltage">Vout</span>; current sampling takes a fraction of <span class="colour-current">Iout</span> (for example, a resistor in the output or emitter path).</div>
