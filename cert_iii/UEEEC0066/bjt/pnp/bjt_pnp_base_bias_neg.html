<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJT Base Bias Quiz — PNP</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
    <style>
        .progress-wrap {
      display: flex;
      gap: .4rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    </style>
</head>

<body>
<div class="crumb" id="crumb" data-current="Quiz 3"></div>
  <header>
    <h1>BJT Base Bias — PNP</h1>
    <p>DC Analysis · Fixed-Bias (Base Bias) Single-Stage PNP Amplifier</p>
  </header>

  <div class="quiz-wrap">

    <!-- LEFT: circuit diagram -->
    <div class="circuit-col">
      <div class="mode-toggle">
        <div class="mode-seg" id="modeSeg">
          <button id="modeExample1" class="active" onclick="setMode('example1')">Example 1</button>
          <button id="modeExample2" onclick="setMode('example2')">Example 2</button>
          <button id="modeExample3" onclick="setMode('example3')">Example 3</button>
          <button id="modeRandomise" onclick="setMode('randomise')">Randomise</button>
        </div>
      </div>
      <div class="circuit-panel" onclick="openModal()" title="Click to zoom">
        <div class="panel-label">Circuit Diagram — <span id="panelVoltLabel">−12 V</span> Supply</div>
        <div class="zoom-hint">
          <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none" />
            <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <line x1="6" y1="8" x2="10" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="8" y1="6" x2="8" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Zoom
        </div>

        <svg id="circuitSvg" viewBox="-90 0 610 560" xmlns="http://www.w3.org/2000/svg"
          font-family="'Share Tech Mono',monospace">

          <!-- ════════════════════ DEFINITIONS ════════════════════ -->

          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <!-- ══ PNP BJT SHAPE — collector top (via RC to the negative
                 rail), emitter bottom (direct to ground); arrow points
                 TOWARD the base, on the emitter arm ══ -->
            <g id="bjt-pnp-shape">
              <circle cx="7" cy="0" r="24" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2"
                filter="url(#glow)" />
              <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
              <!-- base lead -->
              <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
              <!-- base bar -->
              <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
              <!-- collector -->
              <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
              <!-- emitter -->
              <polygon points="2,9 8,20 13,14" style="fill: var(--colour-bjt)" />
              <!-- PNP arrow, pointing toward base (on emitter) -->
            </g>

            <!-- ══ PROBE WIRE — 30px dashed stub; rotate() on <use> points it in any direction ══ -->
            <line id="probe-wire" x1="0" y1="0" x2="30" y2="0"
              style="stroke: var(--colour-red)" stroke-width="1.5" stroke-dasharray="4,3" opacity=".8" />

            <!-- ══ VOLTMETER SHAPE ══ -->
            <g id="meter-shape">
              <circle cx="0" cy="0" r="30" style="fill: var(--colour-meter-fill); stroke: var(--colour-red)"
                stroke-width="1.5" filter="url(#glow)" />
              <line x1="-15" y1="-20" x2="15" y2="-20" style="stroke: var(--colour-red)" stroke-width="1.5"/>
              <line x1="-15" y1="-14" x2="15" y2="-14" style="stroke: var(--colour-red)" stroke-width="1.5" stroke-dasharray="3,2"/>
            </g>

            <!-- ══ AMMETER BADGE — defined once, instanced with <use> ══ -->
            <g id="ammeter-shape">
              <circle cx="0" cy="0" r="30" style="fill: var(--colour-ammeter-fill); stroke: var(--colour-current)"
                stroke-width="1.5" filter="url(#glow)" />
            </g>

          </defs>

          <!-- ════════════════════ CIRCUIT GROUP ════════════════════ -->

          <!-- ══ Used to move the entire circuit by (X,Y) pixels ══ -->
          <g id="circuitGroup" transform="translate(0,5)">

          <!-- ════════════════════ BJT DATASHEET REFERENCE TABLE ════════════════════ -->

          <g id="datasheetTable" transform="translate(-90,0)">
            <rect x="0" y="0" width="130" height="145" rx="4" style="fill: rgba(0,0,0,.25)" stroke="var(--colour-bjt)" stroke-width="1" />
            <text x="6" y="13" style="fill: var(--colour-text)" text-anchor="start" font-size="9" font-weight="bold" letter-spacing=".03em">BC557 — TYPICAL RATINGS</text>
            <line x1="6" y1="19" x2="134" y2="19" style="stroke: var(--colour-border)" stroke-width="1" />

            <text x="6" y="32" style="fill: var(--colour-bjt)" font-size="12">V<tspan baseline-shift="sub" font-size="6.5">EB</tspan>(on)</text>
            <text x="124" y="32" style="fill: var(--colour-text)" text-anchor="end" font-size="12">0.6 V typ</text>

            <text x="6" y="49" style="fill: var(--colour-bjt)" font-size="12">V<tspan baseline-shift="sub" font-size="6.5">EC</tspan>(sat)</text>
            <text x="124" y="49" style="fill: var(--colour-text)" text-anchor="end" font-size="12">0.2 V typ</text>

            <text x="6" y="66" style="fill: var(--colour-bjt)" font-size="12">V<tspan baseline-shift="sub" font-size="6.5">CEO</tspan>(max)</text>
            <text x="124" y="66" style="fill: var(--colour-text)" text-anchor="end" font-size="12">45 V</text>

            <text x="6" y="83" style="fill: var(--colour-bjt)" font-size="12">I<tspan baseline-shift="sub" font-size="6.5">C</tspan>(max)</text>
            <text x="124" y="83" style="fill: var(--colour-text)" text-anchor="end" font-size="12">100 mA</text>

            <text x="6" y="100" style="fill: var(--colour-bjt)" font-size="12">P<tspan baseline-shift="sub" font-size="6.5">D</tspan>(max)</text>
            <text x="124" y="100" style="fill: var(--colour-text)" text-anchor="end" font-size="12">500 mW</text>

            <text x="6" y="117" style="fill: var(--colour-bjt)" font-size="12">h<tspan baseline-shift="sub" font-size="6.5">FE</tspan> (β)</text>
            <text x="124" y="117" style="fill: var(--colour-text)" text-anchor="end" font-size="12">75–800</text>

            <text x="6" y="134" style="fill: var(--colour-bjt)" font-size="12">I<tspan baseline-shift="sub" font-size="6.5">CBO</tspan></text>
            <text x="124" y="134" style="fill: var(--colour-text)" text-anchor="end" font-size="12">&lt;15 nA</text>
          </g>

          <!-- ════════════════════ WIRES ════════════════════ -->

          <!-- ── LEFT VERTICAL (base-bias rail, x=100) ── -->
          <line x1="100" y1="50" x2="100" y2="355" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to Base turn -->

          <!-- ── RIGHT VERTICAL (collector/emitter rail, x=340) ── -->
          <line x1="340" y1="50" x2="340" y2="321" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to RC -->
          <line x1="340" y1="389" x2="340" y2="500" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Emitter pin straight down to GND (no RE) -->

          <!-- ── TOP HORIZONTAL ── -->
          <line x1="80" y1="50" x2="360" y2="50" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail (RB column to RC column) -->
          <circle cx="100" cy="50" r="5" style="fill: var(--colour-series)" />
          <circle cx="340" cy="50" r="5" style="fill: var(--colour-series)" />

          <!-- ── CENTRE HORIZONTAL ── -->
          <line x1="100" y1="355" x2="309" y2="355" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node across to transistor base pin -->

          <!-- ── BOTTOM HORIZONTAL ── -->
          <line x1="80" y1="500" x2="360" y2="500" style="stroke: var(--colour-series)" stroke-width="2" /><!-- GND rail (R2 column to RE column) -->
          <circle cx="340" cy="500" r="5" style="fill: var(--colour-series)" />

          <!-- ════════════════════ NODES ════════════════════ -->

          <!-- ── NODE B  ── -->
          <g id="nodeB_lbl" transform="translate(270,330)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5" />
            <text x="0" y="5" style="fill: var(--colour-node)" text-anchor="middle" font-size="14"
              font-weight="bold">B</text>
          </g>

          <!-- ── NODE C ── -->
          <g id="nodeC_lbl" transform="translate(370,310)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5" />
            <text x="0" y="5" style="fill: var(--colour-node)" text-anchor="middle" font-size="14"
              font-weight="bold">C</text>
          </g>

          <!-- ── NODE E ── -->
          <g id="nodeE_lbl" transform="translate(370,400)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5" />
            <text x="0" y="5" style="fill: var(--colour-node)" text-anchor="middle" font-size="14"
              font-weight="bold">E</text>
          </g>

          <!-- ════════════════════ VCC ════════════════════ -->

          <g id="vccGroup" transform="translate(180,-1)">
            <line x1="40" y1="50" x2="40" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
            <line x1="0" y1="30" x2="80" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
            <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15"
              font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
            <!-- no separate hand-drawn polarity symbol — the "−" is already
                 part of the value text below, so a second one would double up -->
            <text id="vccValue" x="46" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14"
              font-weight="bold">−12V</text>
            </g>

          <!-- ════════════════════ GND SYMBOL ════════════════════ -->

          <g id="gndGroup" transform="translate(220,501)">
            <line x1="0" y1="0" x2="0" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
            <line x1="-14" y1="15" x2="14" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
            <line x1="-9" y1="20" x2="9" y2="20" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
            <line x1="-4" y1="25" x2="4" y2="25" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
          </g>

          <!-- ════════════════════ Q1 — PNP ════════════════════ -->

          <g id="q1Group" transform="translate(326,355)">
            <use href="#bjt-pnp-shape" />
            <text id="nm-q1" x="-25" y="-15" fill="var(--colour-bjt-labels)" text-anchor="middle" font-size="14"
              font-weight="bold">Q1</text>
            <text id="lbl-q1" x="-20" y="25" fill="var(--colour-bjt-labels)" text-anchor="end" font-size="12">BC557</text>
          </g>

          <!--═══════════════════ RESISTORS ════════════════════ -->

          <!-- ══ RB ══ -->
          <g id="rbGroup" transform="translate(85,160)">
            <rect id="box-rb" x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)"
              stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
            <text id="nm-rb" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14"
              font-weight="bold">RB</text>
            <text id="lbl-rb" x="60" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle"
              font-size="14">1.00MΩ</text>
          </g>

          <!-- ══ RC ══ -->
          <g id="rcGroup" transform="translate(325,160)">
            <rect id="box-rc" x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)"
              stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
            <text id="nm-rc" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14"
              font-weight="bold">RC</text>
            <text id="lbl-rc" x="60" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle"
              font-size="14">1.00kΩ</text>
          </g>

          <!-- ══ V_E METER ══ -->
          <g id="meterVE" transform="translate(420,455)">
            <use href="#probe-wire" transform="rotate(225) translate(30,0)" />
            <use href="#meter-shape" />
            <text x="20" y="-35" style="fill: var(--colour-voltage-label)" text-anchor="middle" font-size="14"
              font-weight="bold">V<tspan baseline-shift="sub" font-size="10">E</tspan></text>
            <text x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle"
              font-size="15" font-weight="bold">0</text>
            <text x="0" y="22" style="fill: var(--colour-red)" text-anchor="middle"
              font-size="14">V</text>
          </g>

         <!-- ════════════════════ QUESTION 1 ════════════════════ -->

          <!-- ══ V_B METER ══ -->
          <g id="meterVB" display="none" transform="translate(220,275)">
            <use href="#probe-wire" transform="rotate(45) translate(30,0)" />
            <use href="#meter-shape" />
            <text x="20" y="-35" style="fill: var(--colour-voltage-label)" text-anchor="middle" font-size="14"
              font-weight="bold">V<tspan baseline-shift="sub" font-size="10">B</tspan></text>
            <text id="meterVBValue" x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle"
              font-size="15" font-weight="bold">—</text>
            <text id="meterVBUnit" x="0" y="22" style="fill: var(--colour-red)" text-anchor="middle"
              font-size="14">V</text>
          </g>

         <!-- ════════════════════ QUESTION 2 ════════════════════ -->

          <!-- ══ I_B INDICATOR — in-line badge, sits directly on the base wire ══ -->
          <g id="ibInd" display="none" transform="translate(150,355)">
            <use href="#ammeter-shape" />
            <text x="0" y="-45" style="fill: var(--colour-current)" text-anchor="middle" font-size="14"
              font-weight="bold">I<tspan baseline-shift="sub" font-size="10">B</tspan></text>
            <text id="ibValue" x="0" y="-2" style="fill: var(--colour-text)" text-anchor="middle"
              font-size="15" font-weight="bold">—</text>
            <text id="ibUnit" x="0" y="15" style="fill: var(--colour-current)" text-anchor="middle"
              font-size="12">µA</text>
          </g>

         <!-- ════════════════════ QUESTION 3 ════════════════════ -->

         <!-- ══ I_C INDICATOR ══ -->
          <g id="icInd" display="none" transform="translate(340,100)">
            <use href="#ammeter-shape" />
            <text x="30" y="-25" style="fill: var(--colour-current)" text-anchor="middle" font-size="14"
              font-weight="bold">I<tspan baseline-shift="sub" font-size="10">C</tspan></text>
            <text id="icValue" x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle"
              font-size="15" font-weight="bold">—</text>
            <text id="icUnit" x="0" y="22" style="fill: var(--colour-current)" text-anchor="middle"
              font-size="12">mA</text>
          </g>

         <!-- ════════════════════ QUESTION 4 ════════════════════ -->

          <!-- ══ V_C METER ══ -->
          <g id="meterVC" display="none" transform="translate(420,255)">
            <use href="#probe-wire" transform="rotate(135) translate(30,0)" />
            <use href="#meter-shape" />
            <text x="20" y="-35" style="fill: var(--colour-voltage-label)" text-anchor="middle" font-size="14"
              font-weight="bold">V<tspan baseline-shift="sub" font-size="10">C</tspan></text>
            <text id="meterVCValue" x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle"
              font-size="15" font-weight="bold">—</text>
            <text id="meterVCUnit" x="0" y="22" style="fill: var(--colour-red)" text-anchor="middle"
              font-size="14">V</text>
          </g>

        <!-- ════════════════════ QUESTION 5 ════════════════════ -->

        <!-- ══ V_EC INDICATOR ══ -->
          <g id="vecInd" display="none" transform="translate(350,330)">
            <text x="20" y="20" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="14"
              font-weight="bold">V<tspan baseline-shift="sub" font-size="10">EC</tspan></text>
            <text id="vecValue" x="20" y="40" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="13"
              font-weight="bold">—</text>
          </g>

          </g><!-- /circuitGroup -->

          <!-- ══ XY RULER (dev tool, off by default) ══ -->
          <g id="xyRuler" display="none"></g>
        </svg>
      </div>
    </div>

    <!-- ════════════════════ QUESTION FRAMEWORK - DO NOT CHANGE MANUALLY ════════════════════ -->

    <!-- RIGHT: question -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div class="progress-dot" id="dot-q1"></div>
          <div class="progress-dot" id="dot-q2"></div>
          <div class="progress-dot" id="dot-q3"></div>
          <div class="progress-dot" id="dot-q4"></div>
          <div class="progress-dot" id="dot-q5"></div>
          <span class="progress-label" id="progressLabel">1 / 5</span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Q1 — base voltage -->
        <div class="q-panel" id="q1Panel">
          <div class="q-header">
            <div class="q-num">Q1</div>
            <div>
              <div class="q-text" id="q1Text"></div>
              <div class="q-hint" id="q1Hint"></div>
            </div>
          </div>
          <div class="options" id="q1Options"></div>
          <div class="result-banner" id="q1Banner"><span id="q1Icon"></span>&nbsp;<span id="q1BannerText"></span></div>
          <div class="working-box" id="q1Working">
            <div class="working-title">Worked Solution</div>
            <div id="q1WorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-check" id="q1Check" onclick="checkQ1()" disabled>Check</button>
            <button class="btn btn-next" id="q1Next" onclick="showQuestion(2)" style="display:none">Next →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Q2 — base current -->
        <div class="q-panel" id="q2Panel" style="display:none">
          <div class="q-header">
            <div class="q-num">Q2</div>
            <div>
              <div class="q-text" id="q2Text"></div>
              <div class="q-hint" id="q2Hint"></div>
            </div>
          </div>
          <div class="options" id="q2Options"></div>
          <div class="result-banner" id="q2Banner"><span id="q2Icon"></span>&nbsp;<span id="q2BannerText"></span></div>
          <div class="working-box" id="q2Working">
            <div class="working-title">Worked Solution</div>
            <div id="q2WorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="q2Back" onclick="backFromQ2()">← Prev</button>
            <button class="btn btn-check" id="q2Check" onclick="checkQ2()" disabled>Check</button>
            <button class="btn btn-next" id="q2Next" onclick="showQuestion(3)" style="display:none">Next →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Q3 — collector current -->
        <div class="q-panel" id="q3Panel" style="display:none">
          <div class="q-header">
            <div class="q-num">Q3</div>
            <div>
              <div class="q-text" id="q3Text"></div>
              <div class="q-hint" id="q3Hint"></div>
            </div>
          </div>
          <div class="options" id="q3Options"></div>
          <div class="result-banner" id="q3Banner"><span id="q3Icon"></span>&nbsp;<span id="q3BannerText"></span></div>
          <div class="working-box" id="q3Working">
            <div class="working-title">Worked Solution</div>
            <div id="q3WorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="q3Back" onclick="backFromQ3()">← Prev</button>
            <button class="btn btn-check" id="q3Check" onclick="checkQ3()" disabled>Check</button>
            <button class="btn btn-next" id="q3Next" onclick="showQuestion(4)" style="display:none">Next →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Q4 — collector voltage -->
        <div class="q-panel" id="q4Panel" style="display:none">
          <div class="q-header">
            <div class="q-num">Q4</div>
            <div>
              <div class="q-text" id="q4Text"></div>
              <div class="q-hint" id="q4Hint"></div>
            </div>
          </div>
          <div class="options" id="q4Options"></div>
          <div class="result-banner" id="q4Banner"><span id="q4Icon"></span>&nbsp;<span id="q4BannerText"></span></div>
          <div class="working-box" id="q4Working">
            <div class="working-title">Worked Solution</div>
            <div id="q4WorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="q4Back" onclick="backFromQ4()">← Prev</button>
            <button class="btn btn-check" id="q4Check" onclick="checkQ4()" disabled>Check</button>
            <button class="btn btn-next" id="q4Next" onclick="showQuestion(5)" style="display:none">Next →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Q5 — collector-emitter voltage -->
        <div class="q-panel" id="q5Panel" style="display:none">
          <div class="q-header">
            <div class="q-num">Q5</div>
            <div>
              <div class="q-text" id="q5Text"></div>
              <div class="q-hint" id="q5Hint"></div>
            </div>
          </div>
          <div class="options" id="q5Options"></div>
          <div class="result-banner" id="q5Banner"><span id="q5Icon"></span>&nbsp;<span id="q5BannerText"></span></div>
          <div class="working-box" id="q5Working">
            <div class="working-title">Worked Solution</div>
            <div id="q5WorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="q5Back" onclick="backFromQ5()">← Prev</button>
            <button class="btn btn-check" id="q5Check" onclick="checkQ5()" disabled>Check</button>
            <button class="btn btn-summary" id="q5Summary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

    <!-- Zoom modal -->
    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalVoltLabel">Circuit Diagram — −12 V Supply</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="-90 0 610 560" xmlns="http://www.w3.org/2000/svg"
          font-family="'Share Tech Mono',monospace"></svg>
      </div>
    </div>

  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════

    // Topology: fixed/base bias, single-stage PNP, with a NEGATIVE supply
    // rail (−VCC) rather than mirroring the circuit by physical position.
    // Emitter tied directly to GND (0 V, the "high" reference for this
    // circuit); −VCC —RB— Base; −VCC —RC— Q1 collector. V.vcc is stored as
    // a positive magnitude (e.g. 12, meaning the rail sits at −12 V) — every
    // formula below explicitly negates it where the rail itself is used.
    const VBE = 0.6; // silicon PNP emitter-base drop (VEB = VE − VB = 0.6 V), assumed constant

    const EXAMPLE_SETS = {
      example1: { vcc: 12, rb: 1000000, rc: 820, beta: 200 }, // rc deliberately not 1000 — RB/RC=1000 would make the Q2 "used RC" distractor show the same digits as the correct answer (just a different unit)
      example2: { vcc: 15, rb: 680000, rc: 2200, beta: 150 },
      example3: { vcc: 9, rb: 1500000, rc: 470, beta: 250 }
    };
    let quizMode = 'example1';
    let V = { ...EXAMPLE_SETS.example1 };

    const QUIZ_QUESTION_COUNT = 5;
    const QIDS = Array.from({ length: QUIZ_QUESTION_COUNT }, (_, i) => 'q' + (i + 1));

    // ══════════════════════════════════════════════════════════════════════
    // QUESTION TEXT
    // ══════════════════════════════════════════════════════════════════════
    const QUESTIONS = [
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">base voltage</span> V<sub>B</sub> at the base of Q1?',
        hint: 'The emitter is tied directly to ground — there\'s no emitter resistor in this circuit — so V<sub>E</sub> = 0 V. For PNP, <span class="colour-bjt">V<sub>EB</sub>(on)</span> ≈ 0.6 V means the emitter sits above the base — so the base itself is <em>negative</em>.'
      },
      {
        text: 'What is the <span style="color:var(--colour-current)">base current</span> I<sub>B</sub> flowing through R<sub>B</sub>?',
        hint: 'R<sub>B</sub> connects the base to the <em>negative</em> supply rail (−V<sub>CC</sub>), not to ground. Apply Kirchhoff\'s Voltage Law around that loop and rearrange for I<sub>B</sub>.'
      },
      {
        text: '', // dynamic — set by updateQ3Question(), since it embeds the current β value
        hint: 'In a fixed/base-bias circuit, I<sub>C</sub> is set directly by the transistor\'s current gain — there\'s no emitter resistor to compensate for β varying between transistors.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">collector voltage</span> V<sub>C</sub>?',
        hint: 'R<sub>C</sub> connects the collector to the <em>negative</em> supply rail (−V<sub>CC</sub>), not to ground. Find the voltage dropped across R<sub>C</sub>, then add it to the rail voltage.'
      },
      {
        text: 'What is the <span style="color:var(--colour-voltage-label)">emitter-collector voltage</span> V<sub>EC</sub>?',
        hint: 'V<sub>EC</sub> is the difference between the emitter and collector voltages — both measured with respect to ground.'
      }
    ];
    QUESTIONS.forEach((q, i) => {
      document.getElementById('q' + (i + 1) + 'Text').innerHTML = q.text;
      document.getElementById('q' + (i + 1) + 'Hint').innerHTML = q.hint;
    });

    // Q3's text embeds the live β value, so it's rebuilt whenever V changes
    // (called from refreshLabels(), which runs on every setMode()).
    function updateQ3Question() {
      const q3 = document.getElementById('q3Text');
      if (q3) {
        q3.innerHTML = `β = ${V.beta} for this transistor. What is the <span style="color:var(--colour-current)">collector current</span> I<sub>C</sub>?`;
      }
    }

    // ══════════════════════════════════════════════════════════════════════
    // END CIRCUIT CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════════════════════
    // CIRCUIT SIMULATION
    // ══════════════════════════════════════════════════════════════════════

    // ── curated resistor/supply pools for Randomise mode ──
    // RB sits far higher than a voltage-divider bias network's resistors —
    // it alone sets IB via VCC/RB, so it needs to be large (hundreds of kΩ to
    // a few MΩ) to keep IB down in the realistic tens-of-µA range.
    const RB_POOL = [470000, 560000, 680000, 820000, 1000000, 1200000, 1500000, 1800000, 2200000];
    const RC_POOL = [220, 270, 330, 390, 470, 560, 680, 820, 1000, 1200, 1500, 1800, 2200];
    const VCC_POOL = [9, 12, 15, 18, 20];
    const BETA_POOL = [100, 120, 150, 180, 200, 220, 250, 280, 300];
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    // Retries until the combination keeps Q1 comfortably in the active region
    // — fixed bias has no feedback to correct a bad RB/β combination, so a
    // plain random pick can easily land VC near 0 (near cutoff, VEC too
    // small) or near −VCC (deep saturation-adjacent), neither of which makes
    // for a sensible example. VC is negative here (below ground), so the
    // bound is checked against −VCC rather than 0..VCC.
    function randomValues() {
      for (let attempt = 0; attempt < 25; attempt++) {
        const vals = { vcc: pick(VCC_POOL), rb: pick(RB_POOL), rc: pick(RC_POOL), beta: pick(BETA_POOL) };
        // RB===RC*1000 would make the "used RC instead of RB" distractor in
        // Q2 display the exact same digits as the correct answer, just one
        // unit prefix over (e.g. "11.4 µA" vs "11.4 mA") — RB_POOL is these
        // same E12-style mantissas scaled by 1000, so this is reachable.
        if (vals.rb === vals.rc * 1000) continue;
        const vb = -VBE;
        const ib = (vb + vals.vcc) / vals.rb;
        const ic = vals.beta * ib;
        const vc = ic * vals.rc - vals.vcc;
        if (vc < -vals.vcc * 0.9 || vc > -vals.vcc * 0.15) continue;
        return vals;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    const LETTERS = ['A', 'B', 'C', 'D'];
    function fmtO0(v) {
      if (v >= 1e6) return parseFloat((v / 1e6).toFixed(2)) + 'MΩ';
      if (v >= 1000) return parseFloat((v / 1000).toFixed(2)) + 'kΩ';
      return parseFloat(v.toFixed(2)) + 'Ω';
    }
    function fmtO0Parts(v) {
      if (v >= 1e6) return { num: String(parseFloat((v / 1e6).toFixed(2))), unit: ' MΩ' };
      if (v >= 1000) return { num: String(parseFloat((v / 1000).toFixed(2))), unit: ' kΩ' };
      return { num: String(parseFloat(v.toFixed(2))), unit: ' Ω' };
    }
    function fmtA(a) { if (a === 0) return '0 A'; const x = Math.abs(a); if (x >= 1) return parseFloat(a.toFixed(3)) + ' A'; if (x >= 0.001) return parseFloat((a * 1000).toFixed(2)) + ' mA'; return parseFloat((a * 1e6).toFixed(1)) + ' µA'; }
    // Junction drops like VBE (0.6 V) are always written in volts, never
    // millivolts, by convention — so the V/mV cutoff sits at 0.1 V rather
    // than 1 V, matching how the datasheet itself writes "0.6 V typ".
    function fmtV(v) { if (v === 0) return '0 V'; const a = Math.abs(v); if (a >= 0.1) return parseFloat(v.toFixed(2)) + ' V'; if (a >= 0.001) return parseFloat((v * 1000).toFixed(2)) + ' mV'; return parseFloat((v * 1e6).toFixed(1)) + ' µV'; }
    function fmtVParts(v) { const a = Math.abs(v); if (a >= 0.1) return { val: String(parseFloat(v.toFixed(2))), unit: 'V' }; if (a >= 0.001) return { val: String(parseFloat((v * 1000).toFixed(2))), unit: 'mV' }; return { val: String(parseFloat((v * 1e6).toFixed(1))), unit: 'µV' }; }
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }

    // ── derived (recomputed whenever the value set changes) ──
    // NOTE: VEC (not VCE) — for PNP the conventional quantity is emitter-to-
    // collector voltage, which comes out positive in the active region here.
    // (VCE = -VEC would be negative under this negative-supply scheme, which
    // reads as confusing even though it's not "wrong" — VEC matches how
    // bjt_pnp_voltage_divider.html labels the same quantity.)
    let VB, IB, IC, VRC, VC, VEC;
    function recompute() {
      VB = -VBE;                      // VE = 0 (no emitter resistor); PNP needs VE > VB, so VB = VE − VEB(on) = −0.6, fixed regardless of RB
      IB = (VB + V.vcc) / V.rb;       // RB spans Base(VB) to the −VCC rail: voltage across it is VB − (−VCC) = VB + VCC
      IC = V.beta * IB;               // set directly by current gain — no RE to compensate for β
      VRC = IC * V.rc;
      VC = VRC - V.vcc;                // RC spans Collector(VC) to the −VCC rail: VC = −VCC + IC×RC
      VEC = -VC;                       // VEC = VE - VC = 0 - VC = -VC (positive, since VC is negative here)
    }

    // ── mode switching ──
    function refreshLabels() {
      ['rb', 'rc'].forEach(r => {
        const p = fmtO0Parts(V[r]);
        document.getElementById('lbl-' + r).innerHTML =
          `<tspan fill="var(--colour-text)">${p.num}</tspan><tspan fill="var(--colour-resistor-labels)">${p.unit}</tspan>`;
      });
      document.getElementById('vccValue').innerHTML = `<tspan fill="var(--colour-text)">−${V.vcc}</tspan><tspan fill="var(--colour-supply)"> V</tspan>`;
      document.getElementById('panelVoltLabel').textContent = '−' + V.vcc + ' V';
      const mt = document.getElementById('modalVoltLabel');
      if (mt) mt.textContent = `Circuit Diagram — −${V.vcc} V Supply`;
      updateQ3Question();
    }
    function setMode(mode) {
      quizMode = mode;
      V = (mode === 'randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
      recompute();
      refreshLabels();
      ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
        const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (b) b.classList.toggle('active', m === mode);
      });
      resetQuiz();
    }

    const Q = {};
    let cur = 'q1';

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

    function buildQ1Options() {
      // correct: -VEB (-0.6 V, since VE = 0 and PNP needs VE > VB)
      // distractors: sign error (positive 0.6), forgot VEB entirely (0), confused with -VCC
      return shuffle([
        { label: fmtV(VB), type: 'correct' },
        { label: fmtV(VBE), type: 'wrong' },
        { label: fmtV(0), type: 'wrong' },
        { label: fmtV(-V.vcc), type: 'wrong' },
      ]);
    }
    function buildQ2Options() {
      // correct: (VB + VCC) / RB  — RB spans Base to the −VCC rail
      // distractors: NPN-style formula (forgetting the rail is negative), forgot VB entirely, used RC instead of RB
      return shuffle([
        { label: fmtA(IB), type: 'correct' },
        { label: fmtA((V.vcc - VB) / V.rb), type: 'wrong' },
        { label: fmtA(V.vcc / V.rb), type: 'wrong' },
        { label: fmtA((VB + V.vcc) / V.rc), type: 'wrong' },
      ]);
    }
    function buildQ3Options() {
      // correct: beta * IB
      // distractors: inverted (IB/beta), forgot to multiply by beta at all, added instead of multiplying
      return shuffle([
        { label: fmtA(IC), type: 'correct' },
        { label: fmtA(IB / V.beta), type: 'wrong' },
        { label: fmtA(IB), type: 'wrong' },
        { label: fmtA(IB + V.beta), type: 'wrong' },
      ]);
    }
    function buildQ4Options() {
      // correct: IC*RC - VCC  — RC spans Collector to the −VCC rail
      // distractors: NPN-style formula (VCC-IC*RC, forgetting the rail is negative), used RB instead of RC, forgot the rail entirely
      return shuffle([
        { label: fmtV(VC), type: 'correct' },
        { label: fmtV(V.vcc - IC * V.rc), type: 'wrong' },
        { label: fmtV(IC * V.rb - V.vcc), type: 'wrong' },
        { label: fmtV(IC * V.rc), type: 'wrong' },
      ]);
    }
    function buildQ5Options() {
      // correct: VE - VC = -VC (since VE = 0 here)
      // distractors: sign error (VC itself, negative), used VCC directly, wrong junction (VC+VBE)
      return shuffle([
        { label: fmtV(VEC), type: 'correct' },
        { label: fmtV(VC), type: 'wrong' },
        { label: fmtV(V.vcc), type: 'wrong' },
        { label: fmtV(VC + VBE), type: 'wrong' },
      ]);
    }

    // ── engine: generic option rendering — leave unchanged ──
    function renderOptions(qid) {
      const st = Q[qid], c = document.getElementById(qid + 'Options'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        btn.addEventListener('click', () => selectOption(qid, i));
        c.appendChild(btn);
      });
    }
    function selectOption(qid, i) {
      if (Q[qid].ans) return;
      Q[qid].sel = i;
      document.getElementById(qid + 'Check').disabled = false;
      document.querySelectorAll('#' + qid + 'Options .option-btn').forEach((b, idx) => b.classList.toggle('selected', idx === i));
    }
    function markOptions(qid, sel, cor, ok) {
      document.querySelectorAll('#' + qid + 'Options .option-btn').forEach((btn, i) => {
        btn.disabled = true;
        if (i === cor) { btn.classList.remove('selected'); btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
        else if (i === sel && !ok) { btn.classList.remove('selected'); btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
        else btn.classList.add('dimmed');
      });
    }
    function setBanner(qid, ok, correctText) {
      const banner = document.getElementById(qid + 'Banner');
      document.getElementById(qid + 'Icon').textContent = ok ? '✓' : '✗';
      if (ok) { banner.className = 'result-banner correct'; document.getElementById(qid + 'BannerText').innerHTML = `Correct! ${correctText}`; }
      else { banner.className = 'result-banner wrong'; document.getElementById(qid + 'BannerText').innerHTML = `The correct answer is ${correctText}`; }
    }

    // ── circuit-specific SVG annotation show/hide ──
    // (overrides the fmtVParts above — same 0.1 V cutoff, kept in sync)
    function fmtVParts(v) {
      const a = Math.abs(v);
      if (a >= 0.1) return { val: v.toFixed(2), unit: 'V' };
      if (a >= 0.001) return { val: (v * 1000).toFixed(2), unit: 'mV' };
      return { val: (v * 1e6).toFixed(1), unit: 'µV' };
    }
    function setMeter(id, v) {
      const p = fmtVParts(v);
      document.getElementById(id + 'Value').textContent = p.val;
      document.getElementById(id + 'Unit').textContent = p.unit;
      document.getElementById(id).setAttribute('display', 'inline');
    }
    function showVB() { setMeter('meterVB', VB); }
    function hideVB() { document.getElementById('meterVB').setAttribute('display', 'none'); }
    function fmtAParts(a) {
      const x = Math.abs(a);
      if (x >= 1) return { val: a.toFixed(3), unit: 'A' };
      if (x >= 0.001) return { val: (a * 1000).toFixed(2), unit: 'mA' };
      return { val: (a * 1e6).toFixed(1), unit: 'µA' };
    }
    function showIB() {
      const p = fmtAParts(IB);
      document.getElementById('ibValue').textContent = p.val;
      document.getElementById('ibUnit').textContent = p.unit;
      document.getElementById('ibInd').setAttribute('display', 'inline');
    }
    function hideIB() { document.getElementById('ibInd').setAttribute('display', 'none'); }
    function showIC() {
      const p = fmtAParts(IC);
      document.getElementById('icValue').textContent = p.val;
      document.getElementById('icUnit').textContent = p.unit;
      document.getElementById('icInd').setAttribute('display', 'inline');
    }
    function hideIC() { document.getElementById('icInd').setAttribute('display', 'none'); }
    function showVC() { setMeter('meterVC', VC); }
    function hideVC() { document.getElementById('meterVC').setAttribute('display', 'none'); }
    function showVEC() { const p = fmtVParts(VEC); document.getElementById('vecValue').innerHTML = `<tspan fill="var(--colour-text)">${p.val}</tspan><tspan fill="var(--colour-supply)"> ${p.unit}</tspan>`; document.getElementById('vecInd').setAttribute('display', 'inline'); }
    function hideVEC() { document.getElementById('vecInd').setAttribute('display', 'none'); }

    // ── Circuit state table — one row per question, cumulative reveal ──
    const CIRCUIT_STATES = [
      {
        enter: { vb: false, ib: false, ic: false, vc: false, vec: false },
        reveal: { vb: true, ib: false, ic: false, vc: false, vec: false }
      }, // Q1 → V_B
      {
        enter: { vb: true, ib: false, ic: false, vc: false, vec: false },
        reveal: { vb: true, ib: true, ic: false, vc: false, vec: false }
      }, // Q2 → I_B
      {
        enter: { vb: true, ib: true, ic: false, vc: false, vec: false },
        reveal: { vb: true, ib: true, ic: true, vc: false, vec: false }
      }, // Q3 → I_C
      {
        enter: { vb: true, ib: true, ic: true, vc: false, vec: false },
        reveal: { vb: true, ib: true, ic: true, vc: true, vec: false }
      }, // Q4 → V_C
      {
        enter: { vb: true, ib: true, ic: true, vc: true, vec: false },
        reveal: { vb: true, ib: true, ic: true, vc: true, vec: true }
      }, // Q5 → V_EC
    ];

    function applyCircuitState(s) {
      s.vb ? showVB() : hideVB();
      s.ib ? showIB() : hideIB();
      s.ic ? showIC() : hideIC();
      s.vc ? showVC() : hideVC();
      s.vec ? showVEC() : hideVEC();
    }

    const QUESTION_BUILDERS = [
      buildQ1Options, buildQ2Options, buildQ3Options,
      buildQ4Options, buildQ5Options,
    ];

    function checkQ1() {
      const st = Q.q1; if (st.ans || st.sel === null) return; st.ans = true;
      const ok = st.sel === st.cor;
      markOptions('q1', st.sel, st.cor, ok);
      setBanner('q1', ok, `V<sub>B</sub> = ${fmtV(VB)}`);
      showQ1Working();
      applyCircuitState(CIRCUIT_STATES[0].reveal);
      advanceQuestion(1);
    }
    function showQ1Working() {
      const box = document.getElementById('q1Working');
      box.className = 'working-box visible';
      document.getElementById('q1WorkingContent').innerHTML = `
    <div class="working-line">The emitter is tied directly to ground — there's no emitter resistor in this circuit — so <span class="colour-voltage">V<sub>E</sub></span> = 0 V. For PNP, the emitter sits <em>above</em> the base by <span class="colour-bjt">V<sub>EB</sub>(on)</span> ≈ 0.6 V:</div>

    <div class="working-step">Base voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-voltage">V<sub>E</sub></span> − <span class="colour-bjt">V<sub>EB</sub>(on)</span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>B</sub></span> = 0 V − 0.6 V</div>
    <div class="working-total"><span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-result">${fmtV(VB)}</span></div>
    <div class="working-line" style="margin-top:.6rem">Notice this doesn't depend on <span class="colour-resistor">R<sub>B</sub></span> at all — unlike voltage-divider bias, the base voltage here is fixed entirely by <span class="colour-bjt">V<sub>EB</sub></span>. It's negative because the base sits below the grounded emitter — that's what a PNP transistor needs to conduct.</div>`;
    }

    function checkQ2() {
      const st = Q.q2; if (st.ans || st.sel === null) return; st.ans = true;
      const ok = st.sel === st.cor;
      markOptions('q2', st.sel, st.cor, ok);
      setBanner('q2', ok, `I<sub>B</sub> = ${fmtA(IB)}`);
      showQ2Working();
      applyCircuitState(CIRCUIT_STATES[1].reveal);
      advanceQuestion(2);
    }
    function showQ2Working() {
      const box = document.getElementById('q2Working');
      box.className = 'working-box visible';
      document.getElementById('q2WorkingContent').innerHTML = `
    <div class="working-line"><span class="colour-resistor">R<sub>B</sub></span> connects the base to the <em>negative</em> supply rail (−V<sub>CC</sub>), not to ground — apply Kirchhoff's Voltage Law around that loop:</div>

    <div class="working-step">Base current:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>B</sub></span> = ${frac('<span class="colour-voltage">V<sub>B</sub></span> − (−<span class="colour-supply">V<sub>CC</sub></span>)', '<span class="colour-resistor">R<sub>B</sub></span>')} = ${frac('<span class="colour-voltage">V<sub>B</sub></span> + <span class="colour-supply">V<sub>CC</sub></span>', '<span class="colour-resistor">R<sub>B</sub></span>')}</div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>B</sub></span> = ${frac(`(${fmtV(VB)}) + ${V.vcc} V`, fmtO0(V.rb))}</div>
    <div class="working-total"><span class="colour-current">I<sub>B</sub></span> = <span class="colour-result">${fmtA(IB)}</span></div>
    <div class="working-line" style="margin-top:.6rem">This differs from NPN's fixed bias, where R<sub>B</sub> bridges V<sub>CC</sub> down to V<sub>B</sub>, so its formula subtracts V<sub>B</sub> from V<sub>CC</sub>. Here R<sub>B</sub>'s far end is at −V<sub>CC</sub>, not +V<sub>CC</sub>, so the two voltages add instead.</div>`;
    }

    function checkQ3() {
      const st = Q.q3; if (st.ans || st.sel === null) return; st.ans = true;
      const ok = st.sel === st.cor;
      markOptions('q3', st.sel, st.cor, ok);
      setBanner('q3', ok, `I<sub>C</sub> = ${fmtA(IC)}`);
      showQ3Working();
      applyCircuitState(CIRCUIT_STATES[2].reveal);
      advanceQuestion(3);
    }
    function showQ3Working() {
      const box = document.getElementById('q3Working');
      box.className = 'working-box visible';
      document.getElementById('q3WorkingContent').innerHTML = `
    <div class="working-line">The collector current in a fixed/base-bias circuit is set directly by the transistor's current gain <span class="colour-bjt">β (h<sub>FE</sub>)</span> — for this transistor, β = ${V.beta}:</div>

    <div class="working-step">Collector current:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>C</sub></span> = <span class="colour-bjt">β</span> × <span class="colour-current">I<sub>B</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>C</sub></span> = ${V.beta} × ${fmtA(IB)}</div>
    <div class="working-total"><span class="colour-current">I<sub>C</sub></span> = <span class="colour-result">${fmtA(IC)}</span></div>
    <div class="working-line" style="margin-top:.6rem">This is the key weakness of fixed/base bias: <span class="colour-current">I<sub>C</sub></span> depends directly on β, which varies significantly between transistors and with temperature — there's nothing in this circuit to compensate for that, unlike voltage-divider bias.</div>`;
    }

    function checkQ4() {
      const st = Q.q4; if (st.ans || st.sel === null) return; st.ans = true;
      const ok = st.sel === st.cor;
      markOptions('q4', st.sel, st.cor, ok);
      setBanner('q4', ok, `V<sub>C</sub> = ${fmtV(VC)}`);
      showQ4Working();
      applyCircuitState(CIRCUIT_STATES[3].reveal);
      advanceQuestion(4);
    }
    function showQ4Working() {
      const box = document.getElementById('q4Working');
      box.className = 'working-box visible';
      document.getElementById('q4WorkingContent').innerHTML = `
    <div class="working-line"><span class="colour-resistor">R<sub>C</sub></span> connects the collector to the <em>negative</em> supply rail (−V<sub>CC</sub>), not to ground. Find the voltage dropped across <span class="colour-resistor">R<sub>C</sub></span>, then add it to the rail voltage:</div>

    <div class="working-step">Step 1. Use Ohm's Law to calculate the voltage drop over RC:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>RC</sub></span> = <span class="colour-current">I<sub>C</sub></span> × <span class="colour-resistor">R<sub>C</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>RC</sub></span> = ${fmtA(IC)} × ${fmtO0(V.rc)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>RC</sub></span> = <span class="colour-result">${fmtV(VRC)}</span></div>

    <div class="working-step">Step 2. Add the voltage drop over <span class="colour-voltage">V<sub>RC</sub></span> to the (negative) rail voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = −<span class="colour-supply">V<sub>CC</sub></span> + <span class="colour-voltage">V<sub>RC</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = −${V.vcc} V + ${fmtV(VRC)}</div>
    <div class="working-total"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">${fmtV(VC)}</span></div>
    <div class="working-line" style="margin-top:.6rem">This differs from NPN's fixed bias, where R<sub>C</sub> bridges V<sub>CC</sub> down to V<sub>C</sub>, so its formula subtracts the R<sub>C</sub> drop from V<sub>CC</sub>. Here R<sub>C</sub>'s far end is at −V<sub>CC</sub>, so the drop is added instead — and V<sub>C</sub> itself comes out negative, sitting between −V<sub>CC</sub> and ground.</div>`;
    }

    function checkQ5() {
      const st = Q.q5; if (st.ans || st.sel === null) return; st.ans = true;
      const ok = st.sel === st.cor;
      markOptions('q5', st.sel, st.cor, ok);
      setBanner('q5', ok, `V<sub>EC</sub> = ${fmtV(VEC)}`);
      showQ5Working();
      applyCircuitState(CIRCUIT_STATES[4].reveal);
      advanceQuestion(5);
    }
    function showQ5Working() {
      const box = document.getElementById('q5Working');
      box.className = 'working-box visible';
      document.getElementById('q5WorkingContent').innerHTML = `
    <div class="working-line"><span class="colour-voltage">V<sub>EC</sub></span> is the difference between the emitter and collector voltages, both measured with respect to ground:</div>

    <div class="working-step">Emitter-collector voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-voltage">V<sub>E</sub></span> − <span class="colour-voltage">V<sub>C</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>EC</sub></span> = 0 V − (${fmtV(VC)})</div>
    <div class="working-total"><span class="colour-voltage">V<sub>EC</sub></span> = <span class="colour-result">${fmtV(VEC)}</span></div>
    <div class="working-line" style="margin-top:.6rem">V<sub>C</sub> comes out negative here — the collector sits below ground, between 0 V and the −V<sub>CC</sub> rail — but V<sub>EC</sub> itself is still positive, as it must be for the transistor to be in the active region.</div>`;
    }

    // ── navigation ──
    function resetQuestion(qid) {
      const st = Q[qid];
      st.sel = null; st.ans = false;
      renderOptions(qid);
      document.getElementById(qid + 'Banner').className = 'result-banner';
      document.getElementById(qid + 'Working').className = 'working-box';
      const chk = document.getElementById(qid + 'Check'); chk.style.display = 'inline-block'; chk.disabled = true;
      const nxt = document.getElementById(qid + 'Next'); if (nxt) nxt.style.display = 'none';
    }
    function backFromQ2() { resetQuestion('q1'); resetQuestion('q2'); showQuestion(1); }
    function backFromQ3() { resetQuestion('q2'); resetQuestion('q3'); showQuestion(2); }
    function backFromQ4() { resetQuestion('q3'); resetQuestion('q4'); showQuestion(3); }
    function backFromQ5() { resetQuestion('q4'); resetQuestion('q5'); showQuestion(4); }

    function showSummary() {
      cur = 'summary';
      QIDS.forEach(q => document.getElementById(q + 'Panel').style.display = 'none');
      document.getElementById('summaryPanel').style.display = 'block';
      applyCircuitState(CIRCUIT_STATES[CIRCUIT_STATES.length - 1].reveal);
      const vals = `<div class="summary-values">
    <span style="color:var(--colour-supply);font-weight:bold">V<sub>CC</sub></span> = <span style="color:var(--colour-supply)">−${V.vcc} V</span>&nbsp;&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>B</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rb)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-resistor-labels);font-weight:bold">R<sub>C</sub></span> = <span style="color:var(--colour-resistor-labels)">${fmtO0(V.rc)}</span>&nbsp;&nbsp;
    <span style="color:var(--colour-bjt);font-weight:bold">β</span> = <span style="color:var(--colour-bjt)">${V.beta}</span>
  </div>`;
      const items = QIDS.map((qid, i) => {
        const st = Q[qid];
        const qtext = document.querySelector('#' + qid + 'Panel .q-text').innerHTML;
        const ans = (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
        const ok = st.sel === st.cor;
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        const working = document.getElementById(qid + 'WorkingContent').innerHTML;
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${qtext}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${working}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = vals + items;
      QIDS.forEach(q => { const d = document.getElementById('dot-' + q); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    // ══════════════════════════════════════════════════════════════════════
    // END CIRCUIT SIMULATION
    // ══════════════════════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic, unchanged from the resistor-quiz template
    // ══════════════════════════════════════════════════════════════════════

    function updateProgress() {
      QIDS.forEach(q => {
        const d = document.getElementById('dot-' + q); if (!d) return;
        d.className = 'progress-dot';
        if (q === cur) d.classList.add('active'); else if (Q[q].ans) d.classList.add('done');
      });
      const n = QIDS.indexOf(cur) + 1;
      const lbl = document.getElementById('progressLabel'); if (lbl && n > 0) lbl.textContent = n + ' / ' + QUIZ_QUESTION_COUNT;
    }

    function advanceQuestion(n) {
      const qid = 'q' + n;
      document.getElementById(qid + 'Check').style.display = 'none';
      const isLast = (n === QUIZ_QUESTION_COUNT);
      document.getElementById(qid + (isLast ? 'Summary' : 'Next')).style.display = 'inline-block';
      updateProgress();
    }

    function showQuestion(n) {
      const qid = 'q' + n;
      cur = qid;
      QIDS.forEach(q => document.getElementById(q + 'Panel').style.display = 'none');
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById(qid + 'Panel').style.display = 'flex';
      const s = Q[qid].ans ? CIRCUIT_STATES[n - 1].reveal : CIRCUIT_STATES[n - 1].enter;
      applyCircuitState(s);
      updateProgress();
    }

    function resetQuiz() {
      QIDS.forEach((qid, i) => {
        const opts = QUESTION_BUILDERS[i]();
        Q[qid] = { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
        renderOptions(qid);
        document.getElementById(qid + 'Banner').className = 'result-banner';
        document.getElementById(qid + 'Working').className = 'working-box';
        const chk = document.getElementById(qid + 'Check');
        if (chk) { chk.style.display = 'inline-block'; chk.disabled = true; }
        const isLast = i === QIDS.length - 1;
        const adv = document.getElementById(qid + (isLast ? 'Summary' : 'Next'));
        if (adv) adv.style.display = 'none';
      });
      document.getElementById('summaryPanel').style.display = 'none';
      showQuestion(1);
    }

    // ── zoom modal ──
    function openModal() {
      const src = document.getElementById('circuitSvg'), dst = document.getElementById('modalSvg');
      dst.innerHTML = src.innerHTML; dst.setAttribute('viewBox', src.getAttribute('viewBox'));
      document.getElementById('diagramModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('diagramModal').classList.remove('open');
      document.getElementById('modalSvg').innerHTML = '';
      document.body.style.overflow = '';
    }
    function handleModalClick(e) { if (e.target.closest('.modal-close')) return; closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    setMode('example1');

    /* ─── DEV: jump straight to a question for testing ──────────────────────
       Console:   jump(5)            → go to Q5
                  jump(5, true)      → go to Q5 already answered (banner + reveal)
       URL:       ?q=5               → loads straight on Q5
                  ?q=5&ans=1         → loads on Q5, answered
                  ?q=s               → loads straight on the summary (see jumpToSummary below) */
    function jump(n, answered) {
      if (n < 1 || n > QUIZ_QUESTION_COUNT) { console.warn('jump: no question', n); return; }
      showQuestion(n);
      if (answered) {
        const st = Q['q' + n];
        if (st) { st.sel = st.cor; }
        const check = window['checkQ' + n];
        if (typeof check === 'function') check();
      }
    }
    window.jump = jump;

    /* ─── DEV: jump straight to the summary, auto-answering every question ──
       (correctly, so the summary has real banners/workings to review) ────
       Console:   jumpToSummary()
       URL:       ?q=s */
    function jumpToSummary() {
      for (let i = 1; i <= QUIZ_QUESTION_COUNT; i++) {
        const st = Q['q' + i];
        if (!st || st.ans) continue;
        st.sel = st.cor;
        const check = window['checkQ' + i];
        if (typeof check === 'function') check();
      }
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    function goBack(e) { e.preventDefault(); history.back(); }
    // Only show the back link if there's actually somewhere to go back to —
    // history.length is 1 when this page was opened directly (new tab, bookmark,
    // double-click) rather than reached by clicking a link from a menu page.
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    /* ─── DEV: xy ruler overlay, for lining up SVG coordinates by eye ────────
       Console:   setXY(1) / setXY(0)     URL: ?xy=1 */
    function buildXYRuler() {
      const g = document.getElementById('xyRuler');
      if (g.dataset.built) return;
      g.dataset.built = '1';
      const vb = document.getElementById('circuitSvg').viewBox.baseVal;
      const W = vb.width, H = vb.height;
      const hy = H - 10, vx = 10, col = '#ff00ff';
      let svg = `<line x1="0" y1="${hy}" x2="${W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let x = 0; x <= W; x += 10) {
        const major = (x % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${x}" y1="${hy - len}" x2="${x}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${x}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${x}</text>`;
      }
      svg += `<line x1="${vx}" y1="0" x2="${vx}" y2="${H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let y = 0; y <= H; y += 10) {
        const major = (y % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${vx}" y1="${y}" x2="${vx + len}" y2="${y}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${vx + 13}" y="${y + 3}" fill="${col}" font-size="8" text-anchor="start">${y}</text>`;
      }
      g.innerHTML = svg;
    }
    function setXY(on) {
      if (on) buildXYRuler();
      document.getElementById('xyRuler').setAttribute('display', on ? 'inline' : 'none');
    }
    window.setXY = setXY;

    {
      const p = new URLSearchParams(location.search);
      const rKeys = ['vcc', 'rb', 'rc', 'beta'];
      if (rKeys.every(k => p.has(k))) {
        const vals = {}; rKeys.forEach(k => vals[k] = +p.get(k));
        quizMode = 'custom'; V = vals; recompute(); refreshLabels();
        ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
          const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
          if (b) b.classList.toggle('active', false);
        });
        resetQuiz();
      }
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
      if (p.has('xy')) setXY(+p.get('xy') === 1);
    }
    /* ──────────────────────────────────────────────────────────────────────── */
  </script>
</body>
