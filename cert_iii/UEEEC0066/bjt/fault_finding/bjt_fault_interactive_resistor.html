<!--
  EXPLORATORY TESTBED — external RESISTOR faults (R1/R2/RC/RE, each
  either fully OPEN-circuit or gone HIGH in value), the third fault
  family in this series after the external-component testbed
  (bjt_fault_interactive.html — C1/C2 open, R1 high) and the
  internal-BJT-lead testbed (bjt_fault_interactive_internal.html —
  base/emitter/collector open/short). Originally built with a SHORT
  fault alongside OPEN for each resistor (matching the internal-lead
  file's own open/short pairing) — corrected once the user re-read the
  actual class notes, which pair OPEN with HIGH instead. The 4 short
  questions were replaced with HIGH ones at their same array positions
  (preserving the fixed randomised question order); the short-circuit
  visual machinery (short-R1/R2/RC/RE groups, syncResistorShort()) was
  removed entirely since nothing uses it any more.

  Fault markers: data.openResistor shows a small X (fault-x-<key>) and
  data.highResistor shows a distinct up-arrow (fault-high-<key>, added
  directly by the user on RE first, then rolled out to R1/R2/RC) — two
  separate symbols, not shared, so OPEN and HIGH read as visually
  distinct fault types at a glance (see syncResistorFaults()). The
  resistor's own on-screen label always stays at its nominal printed
  value either way, matching the external-component testbed's own
  R1-high fault (which shows no marker at all — a technician can't see
  a drifted value, only measure its effect). HIGH faults use a mult=2
  convention (double the nominal value) for all four resistors, matching
  that same file's own R1: 120kΩ→240kΩ precedent exactly.

  Same static CE voltage-divider reference circuit (ce-fault-circuit),
  same WIRES/NODES/PRETEND METERS convention, and the same generalised
  interactive-circuit engine (ALL_INTERACTIVE_KEYS / TARGET_GROUP_ID /
  wireComponentClicks / paintComponent / syncInteractiveVisuals /
  syncMeterValues / syncScopeShapes) as the other two files — see the
  internal-lead file's own header comment for the full HEALTHY circuit-
  value derivation (VTH=1.33V, RTH=13.3kΩ, IB≈10.8µA, IE≈IC≈2.2mA,
  VB≈1.2V, VE≈0.6V, VC≈8.1V, VBE=0.6V — the teacher's course-standard
  value).

  Several fault-analysis subtleties worth knowing when reading the
  QUESTIONS array: R1-open remains its own standalone full-cutoff case
  (VB pinned to a clean 0V, everything downstream dead) — with no SHORT
  faults left in this file, it no longer has a DC-identical twin the way
  it did against R2-short in the original design. RC's own two faults
  (open/high) are the SMALLEST-footprint faults in this file — RC sits
  outside the base-bias
  feedback loop entirely, so RC-open leaves VB/VE/IE untouched and
  RC-high leaves ALL of VB/VE/IC/IE untouched, only VC (and, for
  RC-high, the AC gain) moving. RC-high is also the ONLY fault anywhere
  in this file where the output gets BIGGER rather than smaller or dead
  — Av=RC/(RE+re′) roughly doubles along with RC itself. R2-high is
  surprisingly the most dramatic HIGH fault of the four (current more
  than doubles, VC nearly halves) since R2 sets VTH directly — a bigger
  swing than R1-high's own comparatively modest, well-documented
  behaviour (see the external-component testbed's own header comment).
  RE-open produces a genuinely FLOATING VE (shown as "float", not a
  clean 0V) since there's no ground return at all, distinct from every
  other fault in this file, all of which keep a clean, stable reading of
  some kind.
-->

       shared .circuit-panel still sets cursor:zoom-in unconditionally for
       every other page that DOES have one, so override it back to default
       here rather than changing that shared rule for one page. */
    .circuit-panel { cursor: default; }
    @media(min-width:900px) {
      .quiz-wrap { display: grid;
        /* A fixed 760px cap (rather than a percentage, like quiz-common.css's
           own shared default of minmax(340px,52%)) meant the RIGHT column
           kept shrinking as a proportion of ever-wider viewports once the
           left column maxed out — squeezing the question column's own
           nav-button row down to ~300px around 900-1400px wide, narrow
           enough to wrap the Restart button onto its own line despite

        align-items: start; }
    }
    /* Interactive-circuit questions (see interactiveCircuit flag) —
       .comp-interactive is added/removed per-target by
       syncInteractiveVisuals(), only on whichever of the 12 possible
       targets (6 components, 4 meters, 2 scopes) the CURRENT question
       actually uses. Hover
       affordance uses filter, NOT stroke — any CSS rule (even this
       non-!important one) always wins over a presentation attribute set
       via JS, so a stroke-based hover rule on the same hl-<key> rect
       paintComponent() manages would silently override its selection-
       state colour for as long as the mouse stayed put after a click
       (this was a real, reported bug: deselecting while still hovering
       left the highlight box visibly stuck, only clearing once the
       mouse moved to a different component and this rule stopped
       applying — filter never touches the same attribute, so it can't
       fight with paintComponent() no matter how the two overlap). */
    .comp-interactive { cursor: pointer; }
    .comp-interactive:hover { filter: brightness(1.15); }

        <polyline id="bjt-collector" points="14,-48 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />

      <!-- 2. WAVEFORM CH1 (Yellow Input) -->
      <path id="wave-ch1" d="M -26 0 C -23.4 -14, -18.2 -14, -15.6 0 C -13 14, -7.8 14, -5.2 0 C -2.6 -14, 2.6 -14, 5.2 0 C 7.8 14, 13 14, 15.6 0 C 18.2 -14, 23.4 -14, 26 0" style="stroke: var(--colour-scope-input); fill: none;" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"></path>

      <line id="flat-ch2" x1="-26" y1="0" x2="26" y2="0" style="stroke: var(--colour-scope-output)" stroke-width="0.75"></line>

      <!-- ══ 3 COMBINATION SHAPES ══ -->

      <!-- Combination A: Channel 1 Only -->
      <!-- Scaled down from wave-ch1's own native amplitude, purely so the
           scope icon has visible headroom (this file never actually shows

      <g id="scope-ch1-only">
        <use href="#scope-base"></use>
        <g clip-path="url(#scope-screen-clip)">
          <use href="#wave-ch1" transform="scale(1, 0.45)"></use>
        </g>
      </g>

      <!-- Combination A: Channel 1 Only -->
      <g id="scope-ch1-flat-only">
        <use href="#scope-base"></use>
        <g clip-path="url(#scope-screen-clip)">
          <use href="#flat-ch1"></use>

      <g id="scope-ch2-small-only">

  <script>
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
    const DEFAULT_VIEWBOX = '-10 -100 690 670';
    // Stacked numerator/denominator fraction, same helper + .working-frac
    // CSS (already in quiz-common.css) as bjt_npn_troubleshoot_dc.html's
    // own fault-analysis workings.
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see bjt_knowledge_basics.html's header comment for the
    // full field reference. External resistor faults (R1/R2/RC/RE, open
    // and short) — see this file's own header comment for the cross-
    // question relationships (R1-open≡R2-short, R1-short≈R2-open, RC's
    // own faults being the smallest-footprint pair, RE-open's floating
    // VE). VCE_sat=0.2V used throughout for any fault landing the
    // transistor in saturation, matching this project's own established
    // convention (bjt_npn_troubleshoot_dc.html and the original
    // bjt_knowledge_bjt_fault_finding.html both use the same value).
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // RE HIGH: RE doubles in value (270Ω→540Ω, mult=2 — same
        // magnitude convention as R1-high in the external-component
        // testbed). Per the teacher's own course model, the base-bias
        // divider is treated as STIFF enough that VB (and hence VE)
        // don't move when RE changes — only the emitter current (via
        // Ohm's Law directly on the now-bigger RE) and everything
        // downstream of it respond. This is a coarser, teaching-level
        // simplification of the full Thevenin recompute (which would
        // give small but real shifts in VB/VE too — see R1-high/R2-high
        // for where that full recompute IS used) — matched here
        // specifically because the teacher's own worked answer for this
        // exact question states VB and VE unchanged, IC/IE down, VC up.
        //   IE = IC = VE / RE = 0.6 V / 540 Ω = 1.11 mA (was 2.18 mA)
        //   VC = 12 V − 1.11 mA × 1.8 kΩ = 10.00 V (up from 8.10 V)
        // VB/VE stay at their healthy 1.2 V / 0.6 V — genuinely UNAFFECTED
        // in this model, not just "too small a shift to show".
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        kind: 'multi',
        interactiveCircuit: true,
        highResistor: 'RE',
        meterOverride: (answered) => answered
          ? {
            VB: { value: '1.2', unit: 'V' },
            VC: { value: '10.00', unit: 'V', up: true, delta: '+1.90V' },
            VE: { value: '0.6', unit: 'V' },
            IC: { value: '1.11', unit: 'mA', up: false, delta: '−1.06mA' },
            IE: { value: '1.11', unit: 'mA', up: false, delta: '−1.07mA' },
          }
          : {
            VB: { value: '?', unit: 'V' }, VC: { value: '?', unit: 'V' },
            VE: { value: '?', unit: 'V' }, IC: { value: '?', unit: 'mA' }, IE: { value: '?', unit: 'mA' },
          },
        scopeOverride: (answered) => answered ? { SCOPE_OUT: 'scope-ch2-only' } : null,
        text: () => 'Fault: <b style="color:var(--colour-resistor-labels)">RE</b> has gone <b style="color:var(--colour-ui-wrong)">HIGH</b> in value.',
        hint: () => 'The base divider is comparatively stiff against RE\'s own value — treat VB, and hence VE, as fixed at their healthy readings. If VE stays the same but RE doubles, what does Ohm\'s Law say has to happen to IE?',
        options: () => shuffle([
          { key: 'VB', label: 'VB meter', type: 'wrong' },
          { key: 'VC', label: 'VC meter', type: 'correct' },
          { key: 'VE', label: 'VE meter', type: 'wrong' },
          { key: 'IC', label: 'IC ammeter', type: 'correct' },
          { key: 'IE', label: 'IE ammeter', type: 'correct' },
          { key: 'SCOPE_OUT', label: 'Output scope', type: 'correct' },
          { key: 'SCOPE_IN', label: 'Input scope', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const keys = st.opts.map(o => o.type === 'correct' ? o.key : null).filter(Boolean).join(', ');
          return `${keys} — VB and VE are held fixed by the stiff divider, so only the emitter current (and everything downstream of it) responds`;
        },
        working: (st) => {
          const wrongKeys = st.opts.map(o => o.type === 'wrong' ? o.key : null).filter(Boolean).join(', ');
          return `
    <div class="working-section">Identifying the fault:</div>
    <div class="diagnosis-block">
      <div class="symptom-item">
        <div class="symptom-title">Symptom 1: VB and VE stay exactly at their healthy values</div>
        <div class="symptom-body">The divider (<span class="colour-resistor">R<sub>1</sub></span>/<span class="colour-resistor">R<sub>2</sub></span>) is treated as stiff enough that its own output voltage doesn't depend on what <span class="colour-resistor">R<sub>E</sub></span> happens to be — <span class="colour-voltage">V<sub>B</sub></span> stays at 1.2 V, and since <span class="colour-bjt">V<sub>BE</sub></span> is fixed, <span class="colour-voltage">V<sub>E</sub></span> stays at 0.6 V too. Neither one has any path back to <span class="colour-resistor">R<sub>E</sub></span>'s own value in this model.</div>
      </div>
      <div class="symptom-item">
        <div class="symptom-title">Symptom 2: the SAME emitter voltage now has to push current through a BIGGER resistor</div>
        <div class="symptom-body">With <span class="colour-voltage">V<sub>E</sub></span> unchanged and <span class="colour-resistor">R<sub>E</sub></span> doubled, Ohm's Law (<span class="colour-current">I<sub>E</sub></span> = <span class="colour-voltage">V<sub>E</sub></span>/<span class="colour-resistor">R<sub>E</sub></span>) forces the current to roughly halve — a direct, mechanical consequence of the fixed-VE model, not a base-drive calculation.</div>
      </div>
      <div class="symptom-item">
        <div class="symptom-title">Symptom 3: less collector current means less drop across RC, so VC rises</div>
        <div class="symptom-body">Same reasoning as every other fault in this file that drops collector current: less current through <span class="colour-resistor">R<sub>C</sub></span> means less voltage dropped across it, so <span class="colour-voltage">V<sub>C</sub></span> moves up toward <span class="colour-supply">V<sub>CC</sub></span>.</div>
      </div>
    </div>
    <div class="working-section">Applying the formulas:</div>

    <div class="working-formula-row"><span class="colour-current">I<sub>E</sub></span> = <span class="colour-current">I<sub>B</sub></span> + <span class="colour-current">I<sub>C</sub></span> = 1.55 µA + 0.31 mA</div>
    <div class="working-total"><span class="colour-current">I<sub>E</sub></span> = <span class="colour-result">0.31 mA</span></div>

    <div class="working-step">Emitter, base and collector voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-current">I<sub>E</sub></span> × <span class="colour-resistor">R<sub>E</sub></span> = 0.31 mA × 270 Ω</div>
    <div class="working-total"><span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-result">0.08 V</span></div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-voltage">V<sub>E</sub></span> + <span class="colour-bjt">V<sub>BE</sub></span> = 0.08 V + 0.6 V</div>
    <div class="working-total"><span class="colour-voltage">V<sub>B</sub></span> = <span class="colour-result">0.68 V</span></div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-current">I<sub>C</sub></span> × <span class="colour-resistor">R<sub>C</sub></span> = 12 V − 0.31 mA × 1.8 kΩ</div>
    <div class="working-total"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">11.44 V</span></div>

    <div class="working-step" style="margin-top:.6rem">Output scope:</div>
    <div class="working-line">Gain drops as IE falls, but not dramatically enough to show as a visibly smaller trace — the honest choice is the same full-scale shape as healthy.</div>
    <div class="working-step" style="margin-top:.6rem">${wrongKeys} — untouched:</div>
    <div class="working-line">The input scope probes the external signal source directly, upstream of the whole amplifier — nothing happening inside the amplifier can reach back and change what the signal generator itself is producing.</div>`;
        }
      },
      {
        // RE OPEN: the natural LIMIT of RE-high's own "stiff divider"
        // model (see that question) taken to RE→∞. VB and VE are STILL
        // held fixed at their healthy values (1.2V/0.6V — the divider
        // doesn't feed back from RE either way, open or high), and
        // IE=VE/RE now genuinely hits exactly 0 as RE→∞, giving IC=0 and
        // VC=VCC exactly — matches the teacher's own notes precisely:
        // "VB VE - same, IC=0, VC=VCC". This REPLACES an earlier, more
        // rigorous first-principles version of this question (which
        // computed VB as the divider's true UNLOADED voltage, ≈1.33V,
        // and left VE as a genuinely undefined "float") — that version
        // was internally consistent but didn't match how the course
        // actually teaches this fault, so it was dropped in favour of
        // the same simplified model already confirmed for RE-high.
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        kind: 'multi',
        interactiveCircuit: true,
        openResistor: 'RE',
        meterOverride: (answered) => answered
          ? {
            VB: { value: '1.2', unit: 'V' },
            VC: { value: '12.0', unit: 'V', up: true, delta: '+3.90V' },
            VE: { value: '0.6', unit: 'V' },
            IC: { value: '0.00', unit: 'mA', up: false, delta: '−2.17mA' },
            IE: { value: '0.00', unit: 'mA', up: false, delta: '−2.18mA' },
          }
          : {
            VB: { value: '?', unit: 'V' }, VC: { value: '?', unit: 'V' },
            VE: { value: '?', unit: 'V' }, IC: { value: '?', unit: 'mA' }, IE: { value: '?', unit: 'mA' },
          },
        text: () => 'Fault: <b style="color:var(--colour-resistor-labels)">RE</b> has failed <b style="color:var(--colour-ui-wrong)">OPEN</b>-circuit.',
        hint: () => 'Same stiff-divider reasoning as RE going high, just taken to the extreme — VB and VE are held fixed at their healthy readings. If VE stays the same but RE is now infinite, what does Ohm\'s Law say IE has to be?',
        options: () => shuffle([
          { key: 'VB', label: 'VB meter', type: 'wrong' },
          { key: 'VC', label: 'VC meter', type: 'correct' },
          { key: 'VE', label: 'VE meter', type: 'wrong' },
          { key: 'IC', label: 'IC ammeter', type: 'correct' },
          { key: 'IE', label: 'IE ammeter', type: 'correct' },
          { key: 'SCOPE_OUT', label: 'Output scope', type: 'correct' },
          { key: 'SCOPE_IN', label: 'Input scope', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const keys = st.opts.map(o => o.type === 'correct' ? o.key : null).filter(Boolean).join(', ');
          return `${keys} — VB and VE are held fixed by the stiff divider, so only the emitter current (now zero) and everything downstream of it responds`;
        },
        working: (st) => {
          const wrongKeys = st.opts.map(o => o.type === 'wrong' ? o.key : null).filter(Boolean).join(', ');
          return `
    <div class="working-section">Identifying the fault:</div>
    <div class="diagnosis-block">
      <div class="symptom-item">
        <div class="symptom-title">Symptom 1: VB and VE stay exactly at their healthy values</div>
        <div class="symptom-body">Same stiff-divider reasoning as RE going high — the divider's own output doesn't depend on <span class="colour-resistor">R<sub>E</sub></span>, so <span class="colour-voltage">V<sub>B</sub></span> stays at 1.2 V and <span class="colour-voltage">V<sub>E</sub></span> stays at 0.6 V, regardless of whether <span class="colour-resistor">R<sub>E</sub></span> is doubled or fully open.</div>
      </div>
      <div class="symptom-item">
        <div class="symptom-title">Symptom 2: the SAME emitter voltage across an INFINITE resistance forces IE to exactly zero</div>
        <div class="symptom-body">Ohm's Law (<span class="colour-current">I<sub>E</sub></span> = <span class="colour-voltage">V<sub>E</sub></span>/<span class="colour-resistor">R<sub>E</sub></span>) taken to its limit: as <span class="colour-resistor">R<sub>E</sub></span> → ∞, <span class="colour-current">I<sub>E</sub></span> → 0 exactly — this is the same model as RE-high, just pushed all the way to a full break.</div>
      </div>
      <div class="symptom-item">
        <div class="symptom-title">Symptom 3: zero collector current means VC rises all the way to VCC</div>
        <div class="symptom-body">With <span class="colour-current">I<sub>C</sub></span> = 0, nothing drops across <span class="colour-resistor">R<sub>C</sub></span> at all, so <span class="colour-voltage">V<sub>C</sub></span> rises to meet <span class="colour-supply">V<sub>CC</sub></span> directly.</div>
      </div>
    </div>
    <div class="working-section">Applying the formulas:</div>

    <div class="working-step">Emitter voltage — held fixed by the stiff divider, not recalculated:</div>
    <div class="working-line"><span class="colour-voltage">V<sub>E</sub></span> = <span class="colour-result">0.6 V</span> (unchanged from healthy)</div>

    <div class="working-step">Emitter current — Ohm's Law with RE now infinite:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>E</sub></span> = ${frac('<span class="colour-voltage">V<sub>E</sub></span>', '<span class="colour-resistor">R<sub>E</sub></span>')} = ${frac('0.6 V', '∞')}</div>
    <div class="working-total"><span class="colour-current">I<sub>E</sub></span> = <span class="colour-result">0.00 mA</span></div>
    <div class="working-line">(<span class="colour-current">I<sub>C</sub></span> follows <span class="colour-current">I<sub>E</sub></span> to the same 0.00 mA.)</div>

    <div class="working-step">Collector voltage:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-supply">V<sub>CC</sub></span> − <span class="colour-current">I<sub>C</sub></span> × <span class="colour-resistor">R<sub>C</sub></span></div>
    <div class="working-label">Substituting values:</div>
    <div class="working-formula-row"><span class="colour-voltage">V<sub>C</sub></span> = 12 V − 0.00 mA × 1.8 kΩ</div>
    <div class="working-total"><span class="colour-voltage">V<sub>C</sub></span> = <span class="colour-result">12.0 V</span></div>

    <div class="working-step" style="margin-top:.6rem">Output scope:</div>
    <div class="working-line">A fully cut-off transistor can't amplify anything — the output is completely dead.</div>
    <div class="working-step" style="margin-top:.6rem">${wrongKeys} — untouched:</div>
    <div class="working-line"><span class="colour-voltage">V<sub>B</sub></span> and <span class="colour-voltage">V<sub>E</sub></span> stay healthy for the reason above, and the input scope is upstream of the whole amplifier regardless of what's wrong inside it.</div>`;
        }
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isAnswerCorrect(data, st) {
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ') : '—';
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    // ── INTERACTIVE CIRCUIT (any question with interactiveCircuit:true) ──
    // Wires EVERY selectable thing on the circuit — the 6 components
    // (C1/C2/R1/R2/RC/RE), the 4 DC meters (VB/VC/VE/IE), and the 2
    // scope icons (SCOPE_IN/SCOPE_OUT) — up to the SAME st.sel/
    // selectOption() state every other multi-select question already
    // uses. Originally just the 6 components (Q1); generalised so a
    // question can pick ANY subset of this whole universe as its own
    // options() list (e.g. "which meters/scopes would show an affected
    // reading" uses VB/VC/VE/IE/SCOPE_OUT/SCOPE_IN instead). Each key
    // maps to its own real SVG group id — components/scopes use
    // comp-<key>, but the meters/ammeter keep their own pre-existing
    // meterVB/meterVC/meterVE/ammeterIEGroup ids rather than being renamed.
    const ALL_INTERACTIVE_KEYS = ['C1', 'C2', 'R1', 'R2', 'RC', 'RE', 'VB', 'VC', 'VE', 'IC', 'IE', 'SCOPE_IN', 'SCOPE_OUT'];
    const TARGET_GROUP_ID = {
      C1: 'comp-C1', C2: 'comp-C2', R1: 'comp-R1', R2: 'comp-R2', RC: 'comp-RC', RE: 'comp-RE',
      VB: 'meterVB', VC: 'meterVC', VE: 'meterVE', IC: 'ammeterICGroup', IE: 'ammeterIEGroup',
      SCOPE_IN: 'comp-SCOPE_IN', SCOPE_OUT: 'comp-SCOPE_OUT',
    };

    function wireComponentClicks() {
      ALL_INTERACTIVE_KEYS.forEach(key => {
        const g = document.getElementById(TARGET_GROUP_ID[key]);
        if (!g) return;
        g.addEventListener('click', () => {
          const data = QUESTIONS[cur], st = Q[cur];
          if (!data.interactiveCircuit || st.ans) return;
          const idx = st.opts.findIndex(o => o.key === key);
          if (idx >= 0) selectOption(idx);
        });
      });
    }

    // Colour a single target's highlight frame + badge for its current
    // state — selection-pending (blue), or post-answer correct/wrong/missed
    // (same green/red/amber convention as every option-btn elsewhere).
    function paintComponent(key, idx, st, answered) {
      const hl = document.getElementById('hl-' + key), badge = document.getElementById('badge-' + key);
      if (!hl || !badge) return;
      const selected = st.sel.includes(idx);
      const isCorrect = st.opts[idx].type === 'correct';
      if (!answered) {
        hl.setAttribute('stroke', selected ? 'var(--colour-ui-primary)' : 'transparent');
        hl.setAttribute('fill', selected ? 'rgba(var(--colour-ui-primary-rgb),.1)' : 'none');
        badge.textContent = selected ? '✓' : '';
        badge.setAttribute('fill', 'var(--colour-ui-primary)');
      } else if (isCorrect) {
        hl.setAttribute('stroke', selected ? 'var(--colour-ui-correct)' : 'var(--colour-ui-restart)');
        hl.setAttribute('stroke-dasharray', selected ? 'none' : '4,3');
        hl.setAttribute('fill', selected ? 'rgba(var(--colour-ui-correct-rgb),.12)' : 'none');
        badge.textContent = selected ? '✓' : '?';
        badge.setAttribute('fill', selected ? 'var(--colour-ui-correct)' : 'var(--colour-ui-restart)');
      } else {
        hl.setAttribute('stroke', selected ? 'var(--colour-ui-wrong)' : 'transparent');
        hl.setAttribute('stroke-dasharray', 'none');
        hl.setAttribute('fill', selected ? 'rgba(var(--colour-ui-wrong-rgb),.12)' : 'none');
        badge.textContent = selected ? '✗' : '';
        badge.setAttribute('fill', 'var(--colour-ui-wrong)');
      }
      if (!answered || isCorrect) hl.removeAttribute('stroke-dasharray');
    }

    // Single pass over the WHOLE interactive universe, every render,
    // whether the current question is interactive or not — for each key,
    // either paint it (if it's actually one of the CURRENT question's own
    // options) or blank it back out (if it isn't, e.g. every question
    // that isn't interactiveCircuit at all, or an interactive question
    // that only uses SOME of the 12 possible keys — Q1 doesn't touch
    // VB/VC/VE/IE/SCOPE_*, and the meter question doesn't touch the 6
    // components, so both need the OTHER half explicitly reset, not just
    // left however the previous question happened to leave them).
    function syncInteractiveVisuals(data, st) {
      ALL_INTERACTIVE_KEYS.forEach(key => {
        const g = document.getElementById(TARGET_GROUP_ID[key]);
        const idx = (data.interactiveCircuit && st.opts) ? st.opts.findIndex(o => o.key === key) : -1;
        if (g) g.classList.toggle('comp-interactive', idx >= 0);
        if (idx >= 0) {
          paintComponent(key, idx, st, st.ans);
        } else {
          const hl = document.getElementById('hl-' + key), badge = document.getElementById('badge-' + key);
          if (hl) { hl.setAttribute('stroke', 'transparent'); hl.setAttribute('fill', 'none'); hl.removeAttribute('stroke-dasharray'); }
          if (badge) badge.textContent = '';
        }
      });
    }

    // ── METER VALUES — dynamic per question ──
    // VB/VC/VE/IE always showed one hardcoded HEALTHY reading before —
    // now overridable per-question (e.g. "?" until answered, then the
    // real faulted number) via an optional data.meterOverride(answered)
    // function returning {VB:{value,unit}, ...} for whichever meters it
    // cares about. Every question that doesn't define one falls back to
    // HEALTHY_METERS unchanged.
    // IC = β×IB = 200×10.848µA ≈ 2.17mA — genuinely a hair below IE's
    // 2.18mA (IC = IE − IB), not the same rounded figure copy-pasted from
    // the IE ammeter's own placeholder. VBE=0.6V (the teacher's course-
    // standard value, updated project-wide from the earlier 0.7V).
    const HEALTHY_METERS = {
      VB: { value: '1.2', unit: 'V' }, VC: { value: '8.1', unit: 'V' },
      VE: { value: '0.6', unit: 'V' }, IC: { value: '2.17', unit: 'mA' }, IE: { value: '2.18', unit: 'mA' },
    };
    const METER_TEXT_ID = {
      VB: ['meterVBValue', 'meterVBUnit'], VC: ['meterVCValue', 'meterVCUnit'],
      VE: ['meterVEValue', 'meterVEUnit'], IC: ['ammeterICValue', 'ammeterICUnit'], IE: ['ammeterValue', 'ammeterUnit'],
    };
    // Up/down ghost — arrow + delta shown beside a meter once its
    // question's meterOverride reveals a real (non-healthy) reading, same
    // CLR_UP/CLR_DOWN + ⬆/⬇ convention as bjt_npn_troubleshoot_dc.html's
    // own addGhost(). That file computes deltas live from a circuit
    // engine; this one has no such engine (values are curated per
    // question), so a meterOverride entry just states its own `up`
    // (boolean) and `delta` (pre-formatted string like "+3.4V") directly
    // alongside `value`/`unit` — reusing TARGET_GROUP_ID for the group id
    // since it already maps VB/VC/VE/IE to meterVB/meterVC/meterVE/
    // ammeterIEGroup.
    function addGhost(groupId, wentUp, deltaStr) {
      const g = document.getElementById(groupId + 'Ghost'); if (!g) return;
      const clr = wentUp ? 'var(--colour-up)' : 'var(--colour-down)';
      document.getElementById(groupId + 'GhostText').setAttribute('fill', clr);
      document.getElementById(groupId + 'GhostArrow').textContent = wentUp ? '⬆' : '⬇';
      document.getElementById(groupId + 'GhostDelta').textContent = deltaStr;
      g.setAttribute('display', 'inline');
    }
    function removeGhost(groupId) {
      const g = document.getElementById(groupId + 'Ghost'); if (g) g.setAttribute('display', 'none');
    }
    function syncMeterValues(data, st) {
      const override = data.meterOverride ? data.meterOverride(st.ans) : null;
      Object.keys(METER_TEXT_ID).forEach(key => {
        const state = (override && override[key]) ? override[key] : HEALTHY_METERS[key];
        const [valId, unitId] = METER_TEXT_ID[key];
        const valEl = document.getElementById(valId), unitEl = document.getElementById(unitId);
        if (valEl) valEl.textContent = state.value;
        if (unitEl) unitEl.textContent = state.unit;
        if (state.up !== undefined) addGhost(TARGET_GROUP_ID[key], state.up, state.delta);
        else removeGhost(TARGET_GROUP_ID[key]);
      });
    }

    // ── SCOPE WAVEFORMS — dynamic per question ──
    // SCOPE_IN/SCOPE_OUT always showed one hardcoded pair of shapes before
    // (healthy wave in, flat line out — exactly Q1's own C1/C2-open
    // premise). Now overridable per-question via an optional
    // data.scopeOverride(answered) hook, same "conceal until answered"
    // convention as meterOverride — before a question is answered, any
    // scope that's one of ITS OWN clickable options stays at the neutral
    // Q1-matching default rather than revealing early (an interactive
    // question that includes SCOPE_OUT as a clickable option would
    // otherwise give the answer away visually before the student commits
    // to one), then reveals the fault-accurate shape once answered.
    const HEALTHY_SCOPES = { SCOPE_IN: 'scope-ch1-only', SCOPE_OUT: 'scope-ch2-flat-only' };
    const SCOPE_SHAPE_ID = { SCOPE_IN: 'scopeShape-SCOPE_IN', SCOPE_OUT: 'scopeShape-SCOPE_OUT' };
    function syncScopeShapes(data, st) {
      const override = data.scopeOverride ? data.scopeOverride(st.ans) : null;
      Object.keys(SCOPE_SHAPE_ID).forEach(key => {
        const shapeId = (override && override[key]) ? override[key] : HEALTHY_SCOPES[key];
        const el = document.getElementById(SCOPE_SHAPE_ID[key]);
        if (el) el.setAttribute('href', '#' + shapeId);
      });
    }

    // ── RESISTOR FAULTS — visual only, not clickable/gradable ──
    // Optional data.openResistor OR data.highResistor: 'R1'|'R2'|'RC'|'RE'
    // both show the same small X marker overlaid on that resistor's own
    // body (see the fault-x-<key> groups inside each comp-<key> group).
    // Deliberately shared visual for two different fault types: an X
    // reads as "current no longer takes this resistor's own printed
    // value" whether that's because it's fully open (openResistor) or
    // because its actual value has drifted HIGH of what's printed
    // (highResistor, e.g. R1: 120kΩ→240kΩ) — the resistor's own on-screen
    // label always stays at its NOMINAL printed value either way (a real
    // technician can't see a drifted value, only measure its effect), so
    // the X is the only visual cue either fault happened at all;
    // everything else the student learns comes from the numbers. 'inline',
    // not '' when showing — clearing an inline style would just fall back
    // to the markup's own display="none" attribute (a real cascade trap
    // hit and fixed earlier in this project's own BJT-lead fault markers).
    const RESISTOR_KEYS = ['R1', 'R2', 'RC', 'RE'];
    function syncResistorFaults(data) {
      RESISTOR_KEYS.forEach(key => {
        const xMark = document.getElementById('fault-x-' + key);
        if (xMark) xMark.style.display = (data.openResistor === key) ? 'inline' : 'none';
        const highMark = document.getElementById('fault-high-' + key);
        if (highMark) highMark.style.display = (data.highResistor === key) ? 'inline' : 'none';
      });
    }

    // This quiz only ever shows the one static ce-fault-circuit, so it's
    // rendered as real inline SVG content directly inside circuitRefSvg
    // now (not a <defs>+<use> reference swapped by id) — needed so Q1's
    // own components are individually clickable, which a <use>-cloned
    // shadow tree can't support (a click on any part of a <use> instance
    // only ever targets the <use> element itself, not its internal
    // children). showCircuitRef() no longer swaps WHICH circuit is shown,
    // just the label/viewBox.
    function showCircuitRef(id, label, viewBox) {
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
      document.getElementById('circuitRefSvg').setAttribute('viewBox', viewBox || DEFAULT_VIEWBOX);
      if (xyOn) buildXYRuler();
    }

    /* ─── DEV: xy ruler overlay, for lining up SVG coordinates by eye ────────
       Console:   setXY(1) / setXY(0)     URL: ?xy=1 */
    let xyOn = false;
    function buildXYRuler() {
      const g = document.getElementById('xyRuler');
      if (!g) return;
      const vb = document.getElementById('circuitRefSvg').viewBox.baseVal;
      const offX = vb.x, offY = vb.y, W = vb.width, H = vb.height;
      const hy = offY + H - 10, vx = offX + 10, col = '#ff00ff';
      let svg = `<line x1="${offX}" y1="${hy}" x2="${offX + W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let x = 0; x <= W; x += 10) {
        const gx = offX + x, major = (Math.round(gx) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${gx}" y1="${hy - len}" x2="${gx}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${gx}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${Math.round(gx)}</text>`;
      }
      svg += `<line x1="${vx}" y1="${offY}" x2="${vx}" y2="${offY + H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let y = 0; y <= H; y += 10) {
        const gy = offY + y, major = (Math.round(gy) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${vx}" y1="${gy}" x2="${vx + len}" y2="${gy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${vx + 13}" y="${gy + 3}" fill="${col}" font-size="8" text-anchor="start">${Math.round(gy)}</text>`;
      }
      g.innerHTML = svg;
    }
    function setXY(on) {
      xyOn = on;
      const g = document.getElementById('xyRuler');
      if (!g) return;
      if (on) buildXYRuler();
      g.setAttribute('display', on ? 'inline' : 'none');
    }
    window.setXY = setXY;

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      // Any interactiveCircuit question has no separate option list at
      // all — the circuit diagram itself is the click surface (see
      // wireComponentClicks()/syncInteractiveVisuals()). Every other
      // question keeps the normal button list.
      document.getElementById('qOptions').style.display = data.interactiveCircuit ? 'none' : '';
      if (!data.interactiveCircuit) renderOptions();
      syncInteractiveVisuals(data, st);
      syncMeterValues(data, st);
      syncScopeShapes(data, st);
      syncResistorFaults(data);

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        const selectedNames = data.interactiveCircuit
          ? [...st.sel].sort((a, b) => a - b).map(i => st.opts[i].key)
          : [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]);
        selList.textContent = st.sel.length
          ? `Selected: ${selectedNames.join(', ')}`
          : (data.interactiveCircuit ? 'Click the meters on the circuit to select your answer (look for ?).' : 'Click the options above to select your answer.');
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (multi ? st.sel.length === 0 : st.sel === null);
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      showCircuitRef('ce-fault-circuit', data.circuitLabel);
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function scrollToQuestionTop() {
      document.getElementById('qPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); scrollToQuestionTop(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        Q[i].ans = false;
        Q[i].sel = isMulti(QUESTIONS[i]) ? [] : null;
      }
      renderQuestion();
      scrollToQuestionTop();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
      scrollToQuestionTop();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      showCircuitRef('ce-fault-circuit', 'Common Emitter (voltage-divider bias, RE unbypassed)');
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }


    buildProgressDots();
    wireComponentClicks();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) {
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      }
      goToQuestion(n);
      if (answered) {
        Q[cur].sel = Array.isArray(Q[cur].cor) ? [...Q[cur].cor] : Q[cur].cor;
        checkAnswer();
      }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
      if (p.has('xy')) setXY(+p.get('xy') === 1);
    }
  </script>
</body>
