<!--
  Knowledge quiz for the "BJT amplifier AC parameters" lesson (4 objectives,
  photographed lesson-note page): (1) calculate Av/Zin/Zout for common
  emitter, (2) calculate Av/Zin/Zout for common collector, (3) measure
  unloaded vs loaded voltage gain, (4) measure frequency response.

  Objectives 3 and 4 say "measure" (bench-practical wording), but unlike
  digital_knowledge_boolean_algebra.html's deferred DMM/logic-probe
  objective (which genuinely needs physical hardware in hand), both of
  these have a rich calculable/interpretable knowledge core: "why does
  loaded gain drop, and by how much" and "what causes the low/high-
  frequency rolloff, and how do you read bandwidth off a response curve"
  are exactly the concepts a student needs BEFORE the bench measurement
  makes sense — so both are covered here as knowledge questions rather
  than deferred.

  ONE worked NPN stage (BC549, β=200 assumed throughout — same transistor
  family as the rest of UEEEC0066) is used for both configurations: Q1-5
  wire it as common-emitter (unbypassed RE — the "swamped" amplifier
  already familiar from bjt_knowledge_amp_config_peaks.html), then Q7-8
  rewire the SAME transistor as common-collector (collector tied straight
  to VCC, output taken from the emitter) — same component-value philosophy
  as that file's own NPN/PNP mirror pair. Q6 bridges the two: the Zin
  formula (R1∥R2∥β×RE) turns out to be structurally IDENTICAL between CE
  and CC — it's Zout and Av that differ, driven by topology (which
  terminal the output is taken from), not by which resistor values are
  plugged in. That's the same "topology, not resistor values, decides the
  formula" lesson peaks.html's Q9 (common base) already established, now
  extended to Zin/Zout as well as Av.

  Circuit diagrams (ce-divider-ac / cc-divider-ac) use the same large-scale
  WIRES/NODES layout convention as bjt_npn_voltage_divider_ac.html —
  explicit LEFT/CENTER/RIGHT VERTICAL + TOP/BOTTOM/CENTRE/OUTPUT HORIZONTAL
  wire sections, every individual wire segment trailing-commented with what
  it connects, resistors drawn as a box with a separate name/value label
  pair, VCC/GND as their own labelled groups — rather than this file's
  original compact thevenin.html-style scaffold. Trimmed to what a
  knowledge quiz needs (no mode-toggle, oscilloscope, or load terminal —
  RL only ever appears in Q9-10's question text, never the diagram). NODE
  B and NODE C/E mark the exact points that file's own DC-voltage meters
  would probe — reused here for Zin/Zout (AC resistance) instead, since
  that's what this quiz actually asks about.

  Approximation formulas used (standard "beta model", ignoring ro —
  consistent with this project's established CE/CC gain formulas from
  bjt_knowledge_amp_config_peaks.html, extended to Zin/Zout):
    CE (unbypassed RE): Zb ≈ β×RE, Zin = R1∥R2∥Zb, Zout ≈ RC, Av ≈ -RC/RE
    CC (emitter follower): Zb ≈ β×RE, Zin = R1∥R2∥Zb,
                            Zout ≈ RE∥re′ (≈re′, since RE≫re′), Av ≈ RE/(RE+re′)

  Q9-10 (loaded vs unloaded gain) reuse the CE stage's own numbers and
  introduce the voltage-divider relationship Av,loaded = Av,unloaded ×
  RL/(RL+Zout) — deliberately tying straight back to Zout from Q4, so the
  "why calculate Zout at all" payoff lands immediately rather than Zout
  being calculated once and never used again.

  Q11-12 (frequency response) use a NEW non-circuit reference diagram,
  `freq-response-graph` — a simplified Bode-magnitude sketch with fL/fH
  marked at the -3dB (0.707×Amid) points and concrete example frequencies
  printed on it (100 Hz / 100 kHz), read directly for a bandwidth
  calculation. Since this diagram has a different (wider) aspect ratio
  than the tall circuit diagrams, `circuitViewBox` was added as a new
  per-question field — showCircuitRef() now also sets circuitRefSvg's
  viewBox attribute, defaulting to the CE/CC circuits' box when a
  question doesn't specify one. This is a local, one-file addition to the
  engine (each bjt_knowledge_*.html file keeps its own copy of the v2
  engine — there's no shared/imported JS to update project-wide).

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <title>BJT Knowledge Quiz — Amplifier AC Parameters</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    .progress-wrap { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; }
    @media(min-width:900px) {
      /* Circuit viewBox is ~690x570 (the large-scale WIRES-format rebuild —
         same rough size as bjt_npn_voltage_divider_ac.html's own 700x560),
         much wider than the compact 140x200 box quiz-common.css's default
         minmax(340px, 52%) column was originally sized around — a fixed
         760px cap (not a %) so it renders at roughly the same on-screen
         HEIGHT as that file's circuit rather than staying narrow and
         looking squashed. Same fix, same reasoning, same file it's matching. */
      .quiz-wrap { display: grid;
        grid-template-columns: minmax(340px, 760px) 1fr;
        gap: 1.2rem;
        align-items: start; }
    }
  </style>
</head>

<body>
  <!-- Hidden defs: CE and CC versions of the same NPN voltage-divider stage,
       built in bjt_npn_voltage_divider_ac.html's own large-scale WIRES/
       NODES format (see the file header comment above), plus a standalone
       frequency-response Bode sketch for Q11-12. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- ══ NPN BJT SHAPE ══ -->
      <g id="bjt-npn-shape">
        <circle cx="7" cy="0" r="24" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
        <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
        <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
      </g>

      <!-- ══ AC SIGNAL SOURCE SHAPE — circle with one sine cycle ══ -->
      <g id="ac-source-shape">
        <circle cx="0" cy="0" r="24" fill="none" style="stroke: var(--colour-signal)" stroke-width="2" filter="url(#glow)" />
        <path d="M -16,0 C -11,-14 -5,-14 0,0 C 5,14 11,14 16,0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- ══ AMMETER BADGE — same shape as bjt_npn_voltage_divider_ac.html's own ammeter-shape ══ -->
      <g id="ammeter-shape">
        <circle cx="0" cy="0" r="30" style="fill: var(--colour-ammeter-fill); stroke: var(--colour-current)" stroke-width="1.5" filter="url(#glow)" />
      </g>

      <!-- ══ COUPLING CAPACITOR SHAPE — two plates, reused for Cin and Cout ══ -->
      <g id="cap-shape">
        <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
        <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
        <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      </g>

      <!-- ══════════════════════════════════════════════════════════════════
           Common Emitter — voltage-divider bias, RE UNBYPASSED (swamped).
           Large-scale WIRES/NODES/component-group layout — same convention
           as bjt_npn_voltage_divider_ac.html (explicit LEFT/CENTER/RIGHT
           VERTICAL + TOP/BOTTOM/CENTRE/OUTPUT HORIZONTAL wire sections,
           each wire individually commented; resistors as boxes with a
           separate name/value label pair; VCC/GND as their own labelled
           groups), trimmed to what a knowledge quiz actually needs — no
           mode-toggle, no oscilloscope, no load terminal (this file's
           worked values never change, and Q9-10 introduce RL only in the
           question text, not the diagram). NODE B/C mark the exact same
           electrical points that file's meters would probe — here labelled
           Zin/Zout (input/output RESISTANCE) rather than a DC voltage,
           since that's what this quiz actually asks about. ══════════════ -->
      <g id="ce-divider-ac">

        <!-- ════════════════════ WIRES ════════════════════ -->

        <!-- ── LEFT VERTICAL (AC source ground return, x=30) ── -->
        <line x1="30" y1="279" x2="30" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Source return down to GND level -->

        <!-- ── CENTER VERTICAL (R1/R2 line, base-bias rail, x=200) ── -->
        <line x1="200" y1="50" x2="200" y2="80" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to R1 -->
        <line x1="200" y1="160" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R1 down to Base node -->
        <line x1="200" y1="255" x2="200" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node down to R2 -->
        <line x1="200" y1="430" x2="200" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R2 down to GND rail -->

        <!-- ── RIGHT VERTICAL (collector/emitter rail, x=440) ── -->
        <line x1="440" y1="50" x2="440" y2="80" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to RC -->
        <line x1="440" y1="160" x2="440" y2="221" style="stroke: var(--colour-series)" stroke-width="2" /><!-- RC down to Collector pin -->
        <line x1="440" y1="289" x2="440" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Emitter pin down to RE -->
        <line x1="440" y1="430" x2="440" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- RE down to GND rail -->

        <!-- ── TOP HORIZONTAL ── -->
        <line x1="180" y1="50" x2="460" y2="50" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail (R1 column to RC column) -->
        <circle cx="200" cy="50" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="50" r="5" style="fill: var(--colour-series)" />

        <!-- ── BOTTOM HORIZONTAL ── -->
        <line x1="10" y1="520" x2="620" y2="520" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="200" cy="520" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="520" r="5" style="fill: var(--colour-series)" />

        <!-- ── CENTRE HORIZONTAL ── -->
        <line x1="200" y1="255" x2="409" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node across to transistor base pin -->
        <line x1="54" y1="255" x2="96" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Source to Cin -->
        <line x1="104" y1="255" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Cin to Base node -->

        <!-- ── OUTPUT HORIZONTAL ── -->
        <line x1="440" y1="210" x2="600" y2="210" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Collector pin, through Cout, to output -->

        <!-- ════════════════════ NODES ════════════════════ -->

        <!-- ── NODE B — Zin is looked up from here, rightward into the base ── -->
        <circle cx="200" cy="255" r="5" style="fill: var(--colour-series)" />
        <text x="180" y="240" style="fill: var(--colour-gain)" font-size="15" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">b &#10145;</tspan></text>
        <text x="380" y="240" style="fill: var(--colour-gain)" font-size="15" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">in &#10145;</tspan></text>

        <!-- ── NODE C — Zout is looked back into from here, source zeroed ── -->
        <circle cx="440" cy="210" r="5" style="fill: var(--colour-series)" />
        <text x="480" y="238" style="fill: var(--colour-gain)" font-size="15" text-anchor="middle" font-weight="bold"><tspan baseline-shift="40%">&#11013;</tspan> Z<tspan baseline-shift="sub" font-size="13">out</tspan></text>

        <!-- ════════════════════ AC INPUT COMPONENTS ════════════════════ -->

        <circle cx="30" cy="520" r="5" style="fill: var(--colour-signal)" /><!-- Connection to Common -->
        <g transform="translate(30,255)">
          <use href="#ac-source-shape" />
          <text x="0" y="-35" style="fill: var(--colour-signal)" text-anchor="middle" font-size="13" font-weight="bold">input</text>
        </g>

        <g transform="translate(100,255)">
          <use href="#cap-shape" />
          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="13" font-weight="bold">C<tspan baseline-shift="sub" font-size="9">IN</tspan></text>
        </g>

        <!-- ════════════════════ AC OUTPUT COMPONENTS ════════════════════ -->

        <g transform="translate(540,210)">
          <use href="#cap-shape" />
          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="13" font-weight="bold">C<tspan baseline-shift="sub" font-size="9">OUT</tspan></text>
        </g>
        <g id="outputTerminalPlain">
          <circle cx="600" cy="210" r="5" style="fill: var(--colour-signal)" />
          <text x="580" y="365" style="fill: var(--colour-signal)" text-anchor="start" font-size="13" font-weight="bold">output</text>
          <circle cx="600" cy="520" r="5" style="fill: var(--colour-signal)" />

          <!-- ── OUTPUT VERTICAL WIRES WITH ARROWS ── -->
          <line x1="600" y1="220" x2="600" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Horizontal to "output" -->
          <polygon points="594,230 606,230 600,220" style="fill: var(--colour-series)" /><!-- Arrow pointing up -->
          <line x1="600" y1="375" x2="600" y2="510" style="stroke: var(--colour-series)" stroke-width="2" /><!-- "output" to GND -->
          <polygon points="594,500 606,500 600,510" style="fill: var(--colour-series)" /><!-- Arrow pointing down -->

        </g>
        <g id="outputTerminalLoad" display="none" transform="translate(617,210)">
          <circle cx="0" cy="0" r="16" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5" />
          <text x="0" y="5" style="fill: var(--colour-signal)" text-anchor="middle" font-size="13" font-weight="bold">L</text>
          <text x="0" y="-25" style="fill: var(--colour-signal)" text-anchor="middle" font-size="15">R<tspan baseline-shift="sub" font-size="10">L</tspan></text>
          <text x="0" y="30" style="fill: var(--colour-signal)" text-anchor="middle" font-size="11">(load)</text>
        </g>

        <!-- ════════════════════ VCC ════════════════════ -->

        <g transform="translate(280,-1)">
          <line x1="40" y1="50" x2="40" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
          <line x1="0" y1="30" x2="80" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
          <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
          <!-- hand-drawn "+" -->
          <line x1="50" y1="10" x2="50" y2="20" style="stroke: var(--colour-text)" stroke-width="1.0" />
          <line x1="46" y1="15" x2="54" y2="15" style="stroke: var(--colour-text)" stroke-width="1.0" />
          <text x="60" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14" font-weight="bold">12 V</text>
        </g>

        <!-- ════════════════════ COMMON LABEL ════════════════════ -->

        <text x="120" y="535" fill="var(--colour-gnd)" text-anchor="middle" font-size="14" font-weight="bold">Common</text>

        <!-- ════════════════════ Q1 — NPN ════════════════════ -->

        <g transform="translate(426,256)">
          <use href="#bjt-npn-shape" />
          <text x="-15" y="-25" fill="var(--colour-bjt-labels)" text-anchor="middle" font-size="14" font-weight="bold">Q1</text>
          <text x="0" y="40" fill="var(--colour-bjt-labels)" text-anchor="end" font-size="12">BC549</text>
          <text x="35" y="20" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="14" font-weight="bold">β = 200</text>
        </g>

        <!-- ════════════════════ RESISTORS ════════════════════ -->

        <!-- ── R1 ── -->
        <g transform="translate(185,80)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14" font-weight="bold">R1</text>
          <text x="60" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14">120 kΩ</text>
        </g>

        <!-- ── R2 ── -->
        <g transform="translate(185,350)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14" font-weight="bold">R2</text>
          <text x="60" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14">15 kΩ</text>
        </g>

        <!-- ── RC ── -->
        <g transform="translate(425,80)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14" font-weight="bold">RC</text>
          <text x="60" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14">1.8 kΩ</text>
        </g>

        <!-- ── RE ── -->
        <g transform="translate(425,350)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14" font-weight="bold">RE</text>
          <text x="60" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14">270 Ω</text>
        </g>

      </g>

      <!-- ══════════════════════════════════════════════════════════════════
           Common Collector (emitter follower) — SAME layout convention and
           SAME transistor/bias-network coordinates as ce-divider-ac above;
           only the RIGHT VERTICAL/OUTPUT HORIZONTAL wiring and RESISTORS
           differ: no RC (collector ties straight to VCC — AC-common,
           matching bjt_knowledge_amp_config.html's own abstract
           amp-common-collector shape), output taken from NODE E (the
           emitter) instead of NODE C. ══════════════════════════════════ -->
      <g id="cc-divider-ac">

        <!-- ════════════════════ WIRES ════════════════════ -->

        <!-- ── LEFT VERTICAL (AC source ground return, x=30) ── -->
        <line x1="30" y1="279" x2="30" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Source return down to GND level -->

        <!-- ── CENTER VERTICAL (R1/R2 line, base-bias rail, x=200) ── -->
        <line x1="200" y1="50" x2="200" y2="80" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to R1 -->
        <line x1="200" y1="160" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R1 down to Base node -->
        <line x1="200" y1="255" x2="200" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node down to R2 -->
        <line x1="200" y1="430" x2="200" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R2 down to GND rail -->

        <!-- ── RIGHT VERTICAL (collector/emitter rail, x=440) ── -->
        <line x1="440" y1="50" x2="440" y2="221" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail straight down to Collector pin — no RC, collector is AC-common -->
        <line x1="440" y1="289" x2="440" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Emitter pin down to RE -->
        <line x1="440" y1="430" x2="440" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- RE down to GND rail -->

        <!-- ── TOP HORIZONTAL ── -->
        <line x1="180" y1="50" x2="460" y2="50" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail (R1 column to RC column) -->
        <circle cx="200" cy="50" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="50" r="5" style="fill: var(--colour-series)" />

        <!-- ── BOTTOM HORIZONTAL ── -->
        <line x1="10" y1="520" x2="620" y2="520" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="30" cy="520" r="5" style="fill: var(--colour-series)" />
        <circle cx="200" cy="520" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="520" r="5" style="fill: var(--colour-series)" />

        <!-- ── CENTRE HORIZONTAL ── -->
        <line x1="200" y1="255" x2="409" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node across to transistor base pin -->
        <line x1="54" y1="255" x2="96" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Source to Cin -->
        <line x1="104" y1="255" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Cin to Base node -->

        <!-- ── OUTPUT HORIZONTAL ── -->
        <line x1="440" y1="300" x2="600" y2="300" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Collector pin, through Cout, to output -->

        <!-- ════════════════════ NODES ════════════════════ -->

        <!-- ── NODE B — Zin is looked up from here, rightward into the base ── -->
        <circle cx="200" cy="255" r="5" style="fill: var(--colour-series)" />

  <script>
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }
    const DEFAULT_VIEWBOX = '-10 -10 690 570';

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see bjt_knowledge_basics.html's header comment for the
    // full field reference. `circuitViewBox` is a new optional field (see
    // this file's own header comment) — omit it to use DEFAULT_VIEWBOX.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'For this <b class="colour-bjt">common-emitter</b> stage, with its emitter resistor <b class="colour-resistor">R<sub>E</sub></b> left UNBYPASSED, what is the approximate <b style="color:var(--colour-ui-primary)">AC resistance</b> looking directly <b style="color:var(--colour-ui-primary)">INTO</b> the <b style="color:var(--colour-ui-primary)">BASE</b>, <b class="colour-resistor">Z<sub>b</sub></b>?',
        hint: () => 'Every unit of base current has to supply β times as much emitter current — so from the base\'s point of view, RE looks β times BIGGER than it really is, not smaller.',
        options: () => shuffle([
          { label: 'Zb ≈ β × RE', type: 'correct' },
          { label: 'Zb ≈ RE / β', type: 'wrong' },
          { label: 'Zb ≈ β × RC', type: 'wrong' },
          { label: 'Zb ≈ RE (β has no effect looking into the base)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>b</sub></b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">R<sub>E</sub></b>',
        working: () => `
    <div class="working-step">Full form, then the approximation:</div>
    <div class="working-line">The exact relationship is <b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (r<sub>e</sub>′ + <b class="colour-resistor">R<sub>E</sub></b>), where r<sub>e</sub>′ is the transistor's own internal AC emitter resistance (≈26mV/IE). Since <b class="colour-resistor">R<sub>E</sub></b> here is hundreds of ohms and r<sub>e</sub>′ is typically only a few to a few tens of ohms, r<sub>e</sub>′ is negligible next to <b class="colour-resistor">R<sub>E</sub></b> — leaving the approximation:</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>b</sub></b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">R<sub>E</sub></b></div>
    <div class="working-total">This quiz uses <b class="colour-bjt">β</b> = 200 for every worked example (a reasonable mid-range value for a BC549, hFE 110–800 typ).</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'Using <b class="colour-bjt">β</b> = 200 and <b class="colour-resistor">R<sub>E</sub></b> = 270 Ω, what is <b class="colour-resistor">Z<sub>b</sub></b>?',
        hint: () => 'Zb ≈ β × RE = 200 × 270 Ω.',
        options: () => shuffle([
          { label: 'Zb ≈ 54 kΩ', type: 'correct' },
          { label: 'Zb ≈ 1.35 Ω (divided instead of multiplied)', type: 'wrong' },
          { label: 'Zb ≈ 360 kΩ (used RC = 1.8 kΩ instead of RE)', type: 'wrong' },
          { label: 'Zb ≈ 270 Ω (forgot β entirely)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>b</sub></b> ≈ 54 kΩ',
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>b</sub></b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">R<sub>E</sub></b> = 200 × 270 Ω</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>b</sub></b> ≈ 54,000 Ω = 54 kΩ — keep this value, it's used again in the next question.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => '<b class="colour-resistor">R1</b> = 120 kΩ and <b class="colour-resistor">R2</b> = 15 kΩ also connect to the base. What is the <b style="color:var(--colour-ui-primary)">TOTAL AC input resistance</b> <b class="colour-resistor">Z<sub>in</sub></b> seen by the signal source, combining <b class="colour-resistor">R1</b>, <b class="colour-resistor">R2</b> and <b class="colour-resistor">Z<sub>b</sub></b> (≈54 kΩ, from Q2)?',
        hint: () => 'Looking into the base node from the source\'s point of view, R1, R2 and Zb are all three connected between that same node and ground (or VCC, which is AC ground) — that\'s three resistances in PARALLEL, not in series.',
        options: () => shuffle([
          { label: 'Zin = R1∥R2∥Zb ≈ 10.7 kΩ', type: 'correct' },
          { label: 'Zin = R1 + R2 + Zb = 189 kΩ (added them in series)', type: 'wrong' },
          { label: 'Zin ≈ 13.3 kΩ (used only R1∥R2, forgot Zb entirely)', type: 'wrong' },
          { label: 'Zin ≈ 54 kΩ (used only Zb, forgot R1/R2 entirely)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>in</sub></b> = R1∥R2∥<b class="colour-resistor">Z<sub>b</sub></b> ≈ 10.7 kΩ',
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>in</sub></b> = R1 ∥ R2 ∥ <b class="colour-resistor">Z<sub>b</sub></b></div>
    <div class="working-line">${frac('1', '<b class="colour-resistor">Z<sub>in</sub></b>')} = ${frac('1', '120,000')} + ${frac('1', '15,000')} + ${frac('1', '54,000')} ≈ 0.0000935 Ω⁻¹</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>in</sub></b> ≈ 10,693 Ω ≈ 10.7 kΩ — notice this ends up much closer to R1∥R2 (13.3 kΩ) than to Zb (54 kΩ) alone, since the SMALLEST of three parallel resistances always dominates the combination.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'Still this <b class="colour-bjt">common-emitter</b> stage: what is the approximate <b style="color:var(--colour-ui-primary)">AC OUTPUT resistance</b> <b class="colour-resistor">Z<sub>out</sub></b>, looking back <b style="color:var(--colour-ui-primary)">INTO</b> the collector terminal (with the AC source zeroed)?',
        hint: () => 'Zero the source, then look back into the collector node. The transistor\'s own internal output resistance (ro) is assumed very high compared to RC in this approximation, so it\'s ignored — leaving only whatever is directly wired to that node.',
        options: () => shuffle([
          { label: 'Zout ≈ RC', type: 'correct' },
          { label: 'Zout ≈ RE', type: 'wrong' },
          { label: 'Zout ≈ Zin', type: 'wrong' },
          { label: 'Zout ≈ RC ∥ RE', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b>',
        working: () => `
    <div class="working-line">With the source zeroed, the only thing directly wired to the collector node (besides the transistor's internal, very-high ro — ignored here) is <b class="colour-resistor">R<sub>C</sub></b> itself, running up to the AC-grounded <b class="colour-supply">V<sub>CC</sub></b> rail.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b> = 1.8 kΩ</div>
    <div class="working-total">This is why <b class="colour-resistor">Z<sub>out</sub></b> for a common-emitter stage is usually fairly HIGH (equal to whatever RC happens to be) — a fact that turns out to matter a lot once a load is connected (Q9-10).</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'Using the approximation formula (ignoring r<sub>e</sub>′), what is the magnitude of this <b class="colour-bjt">common-emitter</b> stage\'s <b style="color:var(--colour-ui-primary)">voltage gain</b> <b class="colour-gain">|A<sub>v</sub>|</b>? (<b class="colour-resistor">R<sub>C</sub></b> = 1.8 kΩ, <b class="colour-resistor">R<sub>E</sub></b> = 270 Ω)',
        hint: () => '|Av| ≈ RC / RE for a common-emitter stage with an unbypassed emitter — same formula this quiz family has used before.',
        options: () => shuffle([
          { label: '|Av| ≈ 6.67', type: 'correct' },
          { label: '|Av| ≈ 0.15 (inverted the ratio — RE/RC)', type: 'wrong' },
          { label: '|Av| ≈ 1800 (forgot to divide by RE)', type: 'wrong' },
          { label: '|Av| ≈ 1530 (subtracted RE from RC instead of dividing)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-gain">|A<sub>v</sub>|</b> ≈ R<sub>C</sub>/R<sub>E</sub> ≈ 6.67',
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${frac('<b class="colour-resistor">R<sub>C</sub></b>', '<b class="colour-resistor">R<sub>E</sub></b>')} = ${frac('1800 Ω', '270 Ω')}</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ 6.67 — keep this value, Q9-10 use it again once a load is connected.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'Common-emitter and common-collector stages use the exact <b style="color:var(--colour-ui-primary)">SAME approximation formula</b> for one of these three AC parameters — same formula, just different numbers plugged in. Which one?',
        hint: () => 'Zin only ever depends on R1, R2 and Zb ≈ β×RE — none of that changes meaning between configurations. Zout and Av, on the other hand, depend on exactly WHERE the output is taken from (collector vs emitter) — which is precisely what differs between the two.',
        options: () => shuffle([
          { label: 'Zin', type: 'correct' },
          { label: 'Zout', type: 'wrong' },
          { label: 'Av', type: 'wrong' },

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // (Same as bjt_knowledge_basics.html's engine, plus the circuitViewBox
    // addition described in this file's header comment.)
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isAnswerCorrect(data, st) {
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ') : '—';
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function showCircuitRef(id, label, viewBox, loadTerminal, ammeter) {
      document.getElementById('circuitRefUse').setAttribute('href', '#' + id);
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
      document.getElementById('circuitRefSvg').setAttribute('viewBox', viewBox || DEFAULT_VIEWBOX);
      document.getElementById('outputTerminalPlain').setAttribute('display', loadTerminal ? 'none' : 'inline');
      document.getElementById('outputTerminalLoad').setAttribute('display', loadTerminal ? 'inline' : 'none');
      document.getElementById('ieInd').setAttribute('display', ammeter ? 'inline' : 'none');
    }

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      renderOptions();

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ')}`
          : 'Click the options above to select your answer.';
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (multi ? st.sel.length === 0 : st.sel === null);
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      showCircuitRef(data.circuitId, data.circuitLabel, data.circuitViewBox, data.circuitLoad, data.circuitAmmeter);
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        Q[i].ans = false;
        Q[i].sel = isMulti(QUESTIONS[i]) ? [] : null;
      }
      renderQuestion();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      showCircuitRef('ce-divider-ac', 'Common Emitter (voltage-divider bias, RE unbypassed)', DEFAULT_VIEWBOX);
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    // ── zoom modal ──
    function openModal() {
      const src = document.getElementById('circuitRefSvg'), dst = document.getElementById('modalSvg');
      dst.innerHTML = src.innerHTML; dst.setAttribute('viewBox', src.getAttribute('viewBox'));
      document.getElementById('modalTitle').textContent = document.getElementById('circuitRefLabel').textContent;
      document.getElementById('diagramModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('diagramModal').classList.remove('open');
      document.getElementById('modalSvg').innerHTML = '';
      document.body.style.overflow = '';
    }
    function handleModalClick(e) { if (e.target.closest('.modal-close')) return; closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) {
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      }
      goToQuestion(n);
      if (answered) {
        Q[cur].sel = Array.isArray(Q[cur].cor) ? [...Q[cur].cor] : Q[cur].cor;
        checkAnswer();
      }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
    }
  </script>
</body>
