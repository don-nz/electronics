<!--
  Knowledge quiz for the "BJT amplifier AC parameters" lesson (4 objectives,
  photographed lesson-note page): (1) calculate Av/Zin/Zout for common
  emitter, (2) calculate Av/Zin/Zout for common collector, (3) measure
  unloaded vs loaded voltage gain, (4) measure frequency response.

  Objectives 3 and 4 say "measure" (bench-practical wording), but unlike
  digital_knowledge_boolean_algebra.html's deferred DMM/logic-probe
  objective (which genuinely needs physical hardware in hand), both of
  these have a rich calculable/interpretable knowledge core: "why does
  loaded gain drop, and by how much" and "what causes the low/high-
  frequency rolloff, and how do you read bandwidth off a response curve"
  are exactly the concepts a student needs BEFORE the bench measurement
  makes sense — so both are covered here as knowledge questions rather
  than deferred.

  ONE worked NPN stage (BC549, β=200 assumed throughout — same transistor
  family as the rest of UEEEC0066) is used for both configurations: Q1-5
  wire it as common-emitter (unbypassed RE — the "swamped" amplifier
  already familiar from bjt_knowledge_amp_config_peaks.html), then Q7-8
  rewire the SAME transistor as common-collector (collector tied straight
  to VCC, output taken from the emitter) — same component-value philosophy
  as that file's own NPN/PNP mirror pair. Q6 bridges the two: the Zin
  formula (R1∥R2∥β×RE) turns out to be structurally IDENTICAL between CE
  and CC — it's Zout and Av that differ, driven by topology (which
  terminal the output is taken from), not by which resistor values are
  plugged in. That's the same "topology, not resistor values, decides the
  formula" lesson peaks.html's Q9 (common base) already established, now
  extended to Zin/Zout as well as Av.

  Approximation formulas used (standard "beta model", ignoring ro —
  consistent with this project's established CE/CC gain formulas from
  bjt_knowledge_amp_config_peaks.html, extended to Zin/Zout):
    CE (unbypassed RE): Zb ≈ β×RE, Zin = R1∥R2∥Zb, Zout ≈ RC, Av ≈ -RC/RE
    CC (emitter follower): Zb ≈ β×RE, Zin = R1∥R2∥Zb,
                            Zout ≈ RE∥re′ (≈re′, since RE≫re′), Av ≈ RE/(RE+re′)

  Q9-10 (loaded vs unloaded gain) reuse the CE stage's own numbers and
  introduce the voltage-divider relationship Av,loaded = Av,unloaded ×
  RL/(RL+Zout) — deliberately tying straight back to Zout from Q4, so the
  "why calculate Zout at all" payoff lands immediately rather than Zout
  being calculated once and never used again.

  Q11-12 (frequency response) use a NEW non-circuit reference diagram,
  `freq-response-graph` — a simplified Bode-magnitude sketch with fL/fH
  marked at the -3dB (0.707×Amid) points and concrete example frequencies
  printed on it (100 Hz / 100 kHz), read directly for a bandwidth
  calculation. Since this diagram has a different (wider) aspect ratio
  than the tall circuit diagrams, `circuitViewBox` was added as a new
  per-question field — showCircuitRef() now also sets circuitRefSvg's
  viewBox attribute, defaulting to the CE/CC circuits' box when a
  question doesn't specify one. This is a local, one-file addition to the
  engine (each bjt_knowledge_*.html file keeps its own copy of the v2
  engine — there's no shared/imported JS to update project-wide).

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.
-->

  <script>
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }
    const DEFAULT_VIEWBOX = '-40 0 260 200';

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see bjt_knowledge_basics.html's header comment for the
    // full field reference. `circuitViewBox` is a new optional field (see

    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'For this <b class="colour-bjt">common-emitter</b> stage, with its emitter resistor <b class="colour-resistor">R<sub>E</sub></b> left UNBYPASSED, what is the approximate AC resistance looking directly INTO THE BASE, <b class="colour-resistor">Z<sub>b</sub></b>?',
        hint: () => 'Every unit of base current has to supply β times as much emitter current — so from the base\'s point of view, RE looks β times BIGGER than it really is, not smaller.',
        options: () => shuffle([
          { label: 'Zb ≈ β × RE', type: 'correct' },
          { label: 'Zb ≈ RE / β', type: 'wrong' },
          { label: 'Zb ≈ β × RC', type: 'wrong' },
          { label: 'Zb ≈ RE (β has no effect looking into the base)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>b</sub></b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">R<sub>E</sub></b>',
        working: () => `
    <div class="working-step">Full form, then the approximation:</div>
    <div class="working-line">The exact relationship is <b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (r<sub>e</sub>′ + <b class="colour-resistor">R<sub>E</sub></b>), where r<sub>e</sub>′ is the transistor's own internal AC emitter resistance (≈26mV/IE). Since <b class="colour-resistor">R<sub>E</sub></b> here is hundreds of ohms and r<sub>e</sub>′ is typically only a few to a few tens of ohms, r<sub>e</sub>′ is negligible next to <b class="colour-resistor">R<sub>E</sub></b> — leaving the approximation:</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>b</sub></b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">R<sub>E</sub></b></div>
    <div class="working-total">This quiz uses <b class="colour-bjt">β</b> = 200 for every worked example (a reasonable mid-range value for a BC549, hFE 110–800 typ).</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'Using <b class="colour-bjt">β</b> = 200 and <b class="colour-resistor">R<sub>E</sub></b> = 270 Ω, what is <b class="colour-resistor">Z<sub>b</sub></b>?',
        hint: () => 'Zb ≈ β × RE = 200 × 270 Ω.',
        options: () => shuffle([
          { label: 'Zb ≈ 54 kΩ', type: 'correct' },
          { label: 'Zb ≈ 1.35 Ω (divided instead of multiplied)', type: 'wrong' },
          { label: 'Zb ≈ 360 kΩ (used RC = 1.8 kΩ instead of RE)', type: 'wrong' },
          { label: 'Zb ≈ 270 Ω (forgot β entirely)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>b</sub></b> ≈ 54 kΩ',
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>b</sub></b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">R<sub>E</sub></b> = 200 × 270 Ω</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>b</sub></b> ≈ 54,000 Ω = 54 kΩ — keep this value, it's used again in the next question.</div>`
      },
      {

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // (Same as bjt_knowledge_basics.html's engine, plus the circuitViewBox
    // addition described in this file's header comment.)
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isAnswerCorrect(data, st) {
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ') : '—';
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function showCircuitRef(id, label, viewBox) {
      document.getElementById('circuitRefUse').setAttribute('href', '#' + id);
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
      document.getElementById('circuitRefSvg').setAttribute('viewBox', viewBox || DEFAULT_VIEWBOX);
    }

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      renderOptions();

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ')}`
          : 'Click the options above to select your answer.';
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (multi ? st.sel.length === 0 : st.sel === null);
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      showCircuitRef(data.circuitId, data.circuitLabel, data.circuitViewBox);
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        Q[i].ans = false;
        Q[i].sel = isMulti(QUESTIONS[i]) ? [] : null;
      }
      renderQuestion();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      showCircuitRef('ce-divider-ac', 'Common Emitter (voltage-divider bias, RE unbypassed)', DEFAULT_VIEWBOX);
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) {
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      }
      goToQuestion(n);
      if (answered) {
        Q[cur].sel = Array.isArray(Q[cur].cor) ? [...Q[cur].cor] : Q[cur].cor;
        checkAnswer();
      }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
    }
  </script>
</body>
