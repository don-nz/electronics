<!--
  Stretch-learning quiz: Thévenin's theorem applied to voltage-divider bias.
  Leads the student from "here's a shortcut formula for VB" (already used in
  bjt_knowledge_biasing.html) to "here's WHY that shortcut works, and
  precisely when it stops working" — by formally reducing the R1/R2/VCC
  network to its VTH/RTH Thévenin equivalent, deriving the full KVL loop
  equation, and identifying the stiff-divider condition (RTH << (β+1)×RE)
  that the earlier quiz's approximation silently assumed. Q6 explicitly
  reconnects to bjt_knowledge_biasing.html's "R2 fails open" question,
  resolving it rigorously instead of by hand-wave. Includes two light
  numeric questions (compute VTH; contrast exact vs approximate VB for a
  weak divider) — deliberately not a full numeric-mastery drill like the
  npn/pnp voltage-divider DC-analysis quizzes.

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the architecture. Add/reorder questions
  by editing the QUESTIONS array only.
-->

      <!-- ── "after": Thévenin equivalent — R1/R2/VCC collapsed into a single
           VTH source in series with RTH. Drawn as its own short, separate

      <g id="npn-thevenin-equiv">
        <line x1="20" y1="15" x2="65" y2="15" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <text x="42" y="8" style="fill: var(--colour-supply)" font-size="12" text-anchor="middle" font-weight="bold">V<tspan baseline-shift="sub" font-size="8">TH</tspan></text>
        <line x1="80" y1="15" x2="120" y2="15" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <text x="100" y="8" style="fill: var(--colour-supply)" font-size="12" text-anchor="middle" font-weight="bold">+V<tspan baseline-shift="sub" font-size="8">CC</tspan></text>
        <line x1="20" y1="185" x2="120" y2="185" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <use href="#mgnd" transform="translate(70,185)" />
        <line x1="45" y1="15" x2="45" y2="100" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <use href="#mres" transform="translate(45,58)" /><text x="29" y="62" style="fill: var(--colour-resistor-labels)" font-size="9" text-anchor="end">RTH</text>
        <line x1="45" y1="100" x2="73" y2="100" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <line x1="104" y1="15" x2="104" y2="66" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <use href="#mres" transform="translate(104,40)" /><text x="120" y="44" style="fill: var(--colour-resistor-labels)" font-size="9" text-anchor="start">RC</text>
        <line x1="104" y1="134" x2="104" y2="185" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <use href="#mres" transform="translate(104,160)" /><text x="120" y="164" style="fill: var(--colour-resistor-labels)" font-size="9" text-anchor="start">RE</text>
        <text x="65" y="90" style="fill: var(--colour-voltage-label)" font-size="9" text-anchor="middle" font-weight="bold">V<tspan baseline-shift="sub" font-size="6.5">B</tspan></text>
        <text x="110" y="70" style="fill: var(--colour-voltage-label)" font-size="9" text-anchor="start" font-weight="bold">V<tspan baseline-shift="sub" font-size="6.5">C</tspan></text>
        <text x="110" y="135" style="fill: var(--colour-voltage-label)" font-size="9" text-anchor="start" font-weight="bold">V<tspan baseline-shift="sub" font-size="6.5">E</tspan></text>
        <g transform="translate(90,100)"><use href="#mbjt-npn-standard" /></g>

  <script>
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see bjt_knowledge_basics.html's header comment for the
    // full field reference. This file only uses the default 'circuit'
    // leftPanel (a single reference diagram, picked per-question via
    // circuitId) — no shapeGrid, since there's nothing to visually
    // recognise here, just formulas/concepts to reason through.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'npn-divider-pos',
        circuitLabel: 'NPN Voltage-Divider Bias (R1/R2 intact)',
        text: () => 'Looking into the <b class="colour-resistor">R1</b>/<b class="colour-resistor">R2</b> divider network from the base (with the transistor\'s base disconnected), <b class="colour-gain">Thévenin\'s theorem</b> says this network of two resistors and a voltage source can always be replaced by...?',
        hint: () => 'Thévenin\'s theorem applies to ANY linear network of resistors and independent sources, viewed from a pair of terminals — it doesn\'t care that this particular network happens to be a voltage divider.',
        options: () => shuffle([
          { label: 'A single voltage source VTH in series with a single resistance RTH', type: 'correct' },
          { label: 'A single resistance equal to R1 + R2', type: 'wrong' },
          { label: 'A single current source equal to IB', type: 'wrong' },
          { label: 'Nothing — Thévenin\'s theorem only applies to circuits with no resistors', type: 'wrong' },
        ]),
        correctExplain: () => 'a single <b class="colour-supply">V<sub>TH</sub></b> in series with a single <b class="colour-resistor">R<sub>TH</sub></b>',
        working: () => `
    <div class="working-step">Thévenin's theorem, in general:</div>
    <div class="working-line">Any network of linear resistors and independent sources, viewed from two terminals, behaves EXACTLY like a single voltage source in series with a single resistor — no matter how many components are hidden inside. From the base's point of view, it can't tell the difference between the real <b class="colour-resistor">R1</b>/<b class="colour-resistor">R2</b>/<b class="colour-supply">V<sub>CC</sub></b> network and its much simpler Thévenin equivalent.</div>
    <div class="working-total">This is the whole point of doing a Thévenin reduction here: two resistors and a supply are harder to reason about directly than a single <b class="colour-supply">V<sub>TH</sub></b> and a single <b class="colour-resistor">R<sub>TH</sub></b> — the rest of this quiz finds out exactly what those two values are, and what they let us calculate.</div>`
      },
      {
        circuitId: 'npn-divider-pos',
        circuitLabel: 'NPN Voltage-Divider Bias (R1/R2 intact)',
        text: () => 'What is <b class="colour-supply">V<sub>TH</sub></b> — the Thévenin voltage seen looking into the <b class="colour-resistor">R1</b>/<b class="colour-resistor">R2</b> network from the base — equal to?',
        hint: () => 'VTH is defined as the OPEN-CIRCUIT voltage at the terminals — i.e. exactly the voltage you\'d get assuming no base current flows at all. Sound familiar?',
        options: () => shuffle([
          { label: 'VTH = VCC × R2 / (R1 + R2)', type: 'correct' },
          { label: 'VTH = VCC × R1 / (R1 + R2)', type: 'wrong' },
          { label: 'VTH = VCC × (R1 + R2) / R2', type: 'wrong' },
          { label: 'VTH = VCC / (R1 + R2)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-supply">V<sub>TH</sub></b> = <b class="colour-supply">V<sub>CC</sub></b> × R2 / (R1 + R2)',
        working: () => `
    <div class="working-step">Open-circuit voltage — remove the base entirely:</div>
    <div class="working-line">With nothing connected to the base terminal, no current can leave through it — so (to a very good approximation) <b class="colour-resistor">R1</b> and <b class="colour-resistor">R2</b> carry exactly the same current, and Ohm's Law + Kirchhoff's Voltage Law split <b class="colour-supply">V<sub>CC</sub></b> across them in proportion to their resistance.</div>
    <div class="working-formula-row"><b class="colour-supply">V<sub>TH</sub></b> = <b class="colour-supply">V<sub>CC</sub></b> × ${frac('<b class="colour-resistor">R<sub>2</sub></b>', '<b class="colour-resistor">R<sub>1</sub></b> + <b class="colour-resistor">R<sub>2</sub></b>')}</div>
    <div class="working-total">This is exactly the "stiff divider" formula you've already used for <b class="colour-voltage">V<sub>B</sub></b> — the only difference is that now it has a formal name (<b class="colour-supply">V<sub>TH</sub></b>) and a precise justification (it's the Thévenin open-circuit voltage), rather than just an assumption.</div>`
      },
      {
        circuitId: 'npn-divider-pos',
        circuitLabel: 'NPN Voltage-Divider Bias (R1/R2 intact)',
        text: () => 'What is <b class="colour-resistor">R<sub>TH</sub></b> — the Thévenin resistance seen looking into the <b class="colour-resistor">R1</b>/<b class="colour-resistor">R2</b> network from the base — equal to?',
        hint: () => 'To find Thévenin resistance: replace every independent voltage source with a short circuit (VCC → 0 V), then find the resistance between the two terminals. With VCC shorted straight to ground, how are R1 and R2 now connected to each other, electrically?',
        options: () => shuffle([
          { label: 'RTH = R1 ∥ R2 = (R1 × R2) / (R1 + R2)', type: 'correct' },
          { label: 'RTH = R1 + R2', type: 'wrong' },
          { label: 'RTH = R1 − R2', type: 'wrong' },
          { label: 'RTH = R1 × R2 (no division)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">R<sub>TH</sub></b> = R1 ∥ R2',
        working: () => `
    <div class="working-step">Zero the source, then look at the terminals:</div>
    <div class="working-line">Replacing <b class="colour-supply">V<sub>CC</sub></b> with a short to ground ties the TOP of <b class="colour-resistor">R1</b> to the SAME node as the BOTTOM of <b class="colour-resistor">R2</b> (both become ground). Seen from the base terminal, <b class="colour-resistor">R1</b> and <b class="colour-resistor">R2</b> now both run from the base node to that same ground node — which is exactly the definition of two resistors in parallel.</div>
    <div class="working-formula-row"><b class="colour-resistor">R<sub>TH</sub></b> = <b class="colour-resistor">R<sub>1</sub></b> ∥ <b class="colour-resistor">R<sub>2</sub></b> = ${frac('<b class="colour-resistor">R<sub>1</sub></b> × <b class="colour-resistor">R<sub>2</sub></b>', '<b class="colour-resistor">R<sub>1</sub></b> + <b class="colour-resistor">R<sub>2</sub></b>')}</div>
    <div class="working-total">Notice <b class="colour-resistor">R<sub>TH</sub></b> is always SMALLER than either <b class="colour-resistor">R1</b> or <b class="colour-resistor">R2</b> alone — that turns out to matter a lot in a couple of questions' time.</div>`
      },
      {
        circuitId: 'npn-thevenin-equiv',
        circuitLabel: 'Thévenin Equivalent (VTH / RTH)',
        text: () => 'Once the <b class="colour-resistor">R1</b>/<b class="colour-resistor">R2</b>/<b class="colour-supply">V<sub>CC</sub></b> network is replaced by its <b class="colour-supply">V<sub>TH</sub></b>/<b class="colour-resistor">R<sub>TH</sub></b> Thévenin equivalent, what does Kirchhoff\'s Voltage Law say about the base loop?',
        hint: () => 'Trace the loop: VTH source → RTH → base-emitter junction (a VBE drop) → RE → back to ground. Every one of those is a voltage drop, and KVL says they must all add up to VTH.',
        options: () => shuffle([
          { label: 'VTH = IB×RTH + VBE + IE×RE', type: 'correct' },
          { label: 'VTH = VBE + IE×RE (RTH doesn\'t appear in the equation)', type: 'wrong' },
          { label: 'VTH = IB×RTH only (VBE and RE don\'t matter)', type: 'wrong' },
          { label: 'VTH = IC×RC + VCE', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-supply">V<sub>TH</sub></b> = <b class="colour-current">I<sub>B</sub></b>×<b class="colour-resistor">R<sub>TH</sub></b> + <b class="colour-bjt">V<sub>BE</sub></b> + <b class="colour-current">I<sub>E</sub></b>×<b class="colour-resistor">R<sub>E</sub></b>',
        working: () => `
    <div class="working-step">Kirchhoff's Voltage Law — all the way around the base loop:</div>
    <div class="working-formula-row"><b class="colour-supply">V<sub>TH</sub></b> = <b class="colour-current">I<sub>B</sub></b>×<b class="colour-resistor">R<sub>TH</sub></b> + <b class="colour-bjt">V<sub>BE</sub></b> + <b class="colour-current">I<sub>E</sub></b>×<b class="colour-resistor">R<sub>E</sub></b></div>
    <div class="working-line">Substituting <b class="colour-current">I<sub>E</sub></b> ≈ (<b class="colour-bjt">β</b>+1)×<b class="colour-current">I<sub>B</sub></b> and solving for <b class="colour-current">I<sub>B</sub></b>:</div>
    <div class="working-formula-row"><b class="colour-current">I<sub>B</sub></b> = ${frac('<b class="colour-supply">V<sub>TH</sub></b> − <b class="colour-bjt">V<sub>BE</sub></b>', '<b class="colour-resistor">R<sub>TH</sub></b> + (<b class="colour-bjt">β</b>+1)×<b class="colour-resistor">R<sub>E</sub></b>')}</div>
    <div class="working-total">This is the FULL, exact equation for <b class="colour-current">I<sub>B</sub></b> — notice it includes an <b class="colour-current">I<sub>B</sub></b>×<b class="colour-resistor">R<sub>TH</sub></b> term that the simple "<b class="colour-voltage">V<sub>B</sub></b> ≈ <b class="colour-supply">V<sub>TH</sub></b>" shortcut quietly drops entirely.</div>`
      },
      {
        circuitId: 'npn-thevenin-equiv',
        circuitLabel: 'Thévenin Equivalent (VTH / RTH)',
        text: () => 'The commonly used shortcut <b class="colour-voltage">V<sub>B</sub></b> ≈ <b class="colour-supply">V<sub>TH</sub></b> (ignoring the <b class="colour-current">I<sub>B</sub></b>×<b class="colour-resistor">R<sub>TH</sub></b> term entirely) is only a good approximation when...?',
        hint: () => 'Look at the full IB equation from the last question. For that IB×RTH term to end up negligible compared to everything else in the denominator, how does RTH need to compare to (β+1)×RE?',
        options: () => shuffle([
          { label: 'RTH is small compared to (β+1)×RE — i.e. a "stiff" divider', type: 'correct' },
          { label: 'β is very large, regardless of any resistor values', type: 'wrong' },
          { label: 'R1 is exactly equal to R2', type: 'wrong' },
          { label: 'RE is removed from the circuit entirely', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">R<sub>TH</sub></b> ≪ (<b class="colour-bjt">β</b>+1)×<b class="colour-resistor">R<sub>E</sub></b>',
        working: () => `
    <div class="working-line">Look again at <b class="colour-current">I<sub>B</sub></b> = (<b class="colour-supply">V<sub>TH</sub></b> − <b class="colour-bjt">V<sub>BE</sub></b>) / (<b class="colour-resistor">R<sub>TH</sub></b> + (<b class="colour-bjt">β</b>+1)×<b class="colour-resistor">R<sub>E</sub></b>). If <b class="colour-resistor">R<sub>TH</sub></b> is tiny next to (<b class="colour-bjt">β</b>+1)×<b class="colour-resistor">R<sub>E</sub></b>, the denominator barely changes whether <b class="colour-resistor">R<sub>TH</sub></b> is there or not — so the voltage dropped across it (<b class="colour-current">I<sub>B</sub></b>×<b class="colour-resistor">R<sub>TH</sub></b>) becomes negligibly small too, and <b class="colour-voltage">V<sub>B</sub></b> ends up essentially equal to <b class="colour-supply">V<sub>TH</sub></b>.</div>
    <div class="working-total">This is the formal version of "stiff divider": <b class="colour-resistor">R<sub>TH</sub></b> ≪ (<b class="colour-bjt">β</b>+1)×<b class="colour-resistor">R<sub>E</sub></b> — not just "R1 and R2 are small", but specifically small COMPARED TO the emitter resistance reflected into the base circuit. Get this wrong (weak divider, low β, or small RE) and the shortcut quietly gives the wrong answer without any obvious warning sign.</div>`
      },
      {
        circuitId: 'npn-divider-pos',
        circuitLabel: 'NPN Voltage-Divider Bias (R1/R2 intact)',
        kind: 'multi',
        text: () => 'If <b class="colour-resistor">R<sub>2</sub></b> failed <b style="color:var(--colour-ui-wrong)">open</b>, what happens to <b class="colour-supply">V<sub>TH</sub></b> and <b class="colour-resistor">R<sub>TH</sub></b> — and how does that explain why <b class="colour-voltage">V<sub>B</sub></b> actually DROPS instead of rising toward <b class="colour-supply">V<sub>CC</sub></b>? <b style="color:var(--colour-ui-primary)">Select</b> every option that applies.',
        hint: () => 'Take R2 → ∞ in both the VTH formula and the RTH formula separately, and see what each one tends toward.',
        options: () => shuffle([
          { label: 'VTH rises toward VCC (as R2 → ∞, the ratio R2/(R1+R2) → 1)', type: 'correct' },
          { label: 'RTH also rises — toward R1 (since R1 ∥ R2 → R1 as R2 → ∞) — making the IB×RTH term no longer negligible', type: 'correct' },
          { label: 'RTH drops to 0', type: 'wrong' },
          { label: 'VTH drops to 0', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const letters = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${letters}</b> — both <b class="colour-supply">V<sub>TH</sub></b> AND <b class="colour-resistor">R<sub>TH</sub></b> rise`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Both quantities move — options ${correctNums}:</div>
    <div class="working-line">It's tempting to plug R2 = ∞ into just the <b class="colour-supply">V<sub>TH</sub></b> formula and conclude <b class="colour-voltage">V<sub>B</sub></b> should rise toward <b class="colour-supply">V<sub>CC</sub></b>. But <b class="colour-resistor">R<sub>TH</sub></b> = <b class="colour-resistor">R1</b> ∥ <b class="colour-resistor">R2</b> ALSO shoots up toward <b class="colour-resistor">R1</b> — often tens of kΩ — completely breaking the stiff-divider condition (<b class="colour-resistor">R<sub>TH</sub></b> ≪ (<b class="colour-bjt">β</b>+1)×<b class="colour-resistor">R<sub>E</sub></b>) from the previous question.</div>
    <div class="working-total">With <b class="colour-resistor">R<sub>TH</sub></b> no longer negligible, the full equation <b class="colour-current">I<sub>B</sub></b> = (<b class="colour-supply">V<sub>TH</sub></b> − <b class="colour-bjt">V<sub>BE</sub></b>) / (<b class="colour-resistor">R<sub>TH</sub></b> + (<b class="colour-bjt">β</b>+1)×<b class="colour-resistor">R<sub>E</sub></b>) takes over — and with <b class="colour-resistor">R<sub>TH</sub></b> now huge, <b class="colour-current">I<sub>B</sub></b> collapses to almost nothing, which in turn drags <b class="colour-voltage">V<sub>B</sub></b> down toward just <b class="colour-bjt">V<sub>BE</sub></b> instead of up toward <b class="colour-supply">V<sub>CC</sub></b>. This is exactly what you found earlier when R2 failed open — now you can see precisely why, instead of just knowing that it happens.</div>
    <div class="working-step" style="margin-top:.6rem">Not what happens — options ${wrongNums}:</div>
    <div class="working-line"><b class="colour-resistor">R<sub>TH</sub></b> can only shrink toward 0 if a resistor shorts, not opens — an open R2 removes a parallel path, which always INCREASES resistance. And <b class="colour-supply">V<sub>TH</sub></b> rises, it doesn't collapse to 0, since <b class="colour-resistor">R1</b> is still there connecting the base toward <b class="colour-supply">V<sub>CC</sub></b>.</div>`;
        }
      },
      {
        circuitId: 'npn-divider-pos',
        circuitLabel: 'NPN Voltage-Divider Bias (R1/R2 intact)',
        text: () => 'For <b class="colour-resistor">R1</b> = 10 kΩ, <b class="colour-resistor">R2</b> = 2.2 kΩ, <b class="colour-supply">V<sub>CC</sub></b> = 12 V, what is <b class="colour-supply">V<sub>TH</sub></b>?',
        hint: () => 'VTH = VCC × R2 / (R1 + R2) = 12 × 2200 / (10000 + 2200).',
        options: () => shuffle([
          { label: '≈ 2.16 V', type: 'correct' },
          { label: '≈ 9.84 V (used R1 in the numerator instead of R2)', type: 'wrong' },
          { label: '≈ 6.00 V (assumed R1 = R2)', type: 'wrong' },
          { label: '= 12 V (forgot the divider entirely)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-supply">V<sub>TH</sub></b> ≈ 2.16 V',
        working: () => `
    <div class="working-formula-row"><b class="colour-supply">V<sub>TH</sub></b> = <b class="colour-supply">V<sub>CC</sub></b> × ${frac('<b class="colour-resistor">R<sub>2</sub></b>', '<b class="colour-resistor">R<sub>1</sub></b> + <b class="colour-resistor">R<sub>2</sub></b>')}</div>
    <div class="working-formula-row"><b class="colour-supply">V<sub>TH</sub></b> = 12 V × ${frac('2200 Ω', '10000 Ω + 2200 Ω')} = 12 V × 0.1803</div>
    <div class="working-total"><b class="colour-supply">V<sub>TH</sub></b> ≈ 2.16 V — keep these component values, they're used again in the next question.</div>`
      },
      {
        circuitId: 'npn-thevenin-equiv',
        circuitLabel: 'Thévenin Equivalent (VTH / RTH)',
        text: () => 'Same ratio as before, but a much <b style="color:var(--colour-ui-wrong)">weaker</b> divider: <b class="colour-resistor">R1</b> = 100 kΩ, <b class="colour-resistor">R2</b> = 22 kΩ, <b class="colour-supply">V<sub>CC</sub></b> = 12 V, <b class="colour-resistor">R<sub>E</sub></b> = 100 Ω, <b class="colour-bjt">β</b> = 50. <b class="colour-supply">V<sub>TH</sub></b> still works out to ≈2.16 V, and <b class="colour-resistor">R<sub>TH</sub></b> ≈ 18.0 kΩ. Using the FULL equation, what is the actual <b class="colour-voltage">V<sub>B</sub></b> — and how does it compare to the <b class="colour-supply">V<sub>TH</sub></b> approximation?',
        hint: () => 'First find IB = (VTH − VBE) / (RTH + (β+1)×RE), then VB = VBE + IE×RE. Compare (β+1)×RE here to RTH — is this circuit "stiff" or not?',
        options: () => shuffle([
          { label: 'VB ≈ 0.94 V — much LOWER than VTH (2.16 V), because RTH (18.0 kΩ) is no longer small compared to (β+1)×RE (5.1 kΩ)', type: 'correct' },
          { label: 'VB ≈ 2.16 V — same as VTH, because the approximation always holds regardless of component values', type: 'wrong' },
          { label: 'VB ≈ 2.16 V — same as VTH, because β is high enough to make RTH\'s effect negligible here', type: 'wrong' },
          { label: 'VB becomes negative', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-voltage">V<sub>B</sub></b> ≈ 0.94 V — well below <b class="colour-supply">V<sub>TH</sub></b>',
        working: () => `
    <div class="working-step">Full calculation:</div>
    <div class="working-formula-row"><b class="colour-current">I<sub>B</sub></b> = ${frac('2.16 V − 0.6 V', '18.0 kΩ + (51 × 100 Ω)')} = ${frac('1.56 V', '18.0 kΩ + 5.1 kΩ')} ≈ 67.6 µA</div>
    <div class="working-formula-row"><b class="colour-current">I<sub>E</sub></b> ≈ (<b class="colour-bjt">β</b>+1)×<b class="colour-current">I<sub>B</sub></b> = 51 × 67.6 µA ≈ 3.448 mA</div>
    <div class="working-formula-row"><b class="colour-voltage">V<sub>B</sub></b> = <b class="colour-bjt">V<sub>BE</sub></b> + <b class="colour-current">I<sub>E</sub></b>×<b class="colour-resistor">R<sub>E</sub></b> = 0.6 V + (3.448 mA × 100 Ω) ≈ 0.94 V</div>
    <div class="working-total">Compare this to the earlier example (R1=10 kΩ, R2=2.2 kΩ, RE=470 Ω, RTH ≈ 1.8 kΩ, (β+1)RE ≈ 94.5 kΩ) where RTH was less than 2% of (β+1)×RE and the shortcut held well. Here <b class="colour-resistor">R<sub>TH</sub></b> (18.0 kΩ) is more than 3× (<b class="colour-bjt">β</b>+1)×<b class="colour-resistor">R<sub>E</sub></b> (5.1 kΩ) — the stiff-divider condition fails badly, and <b class="colour-voltage">V<sub>B</sub></b> ends up less than half of <b class="colour-supply">V<sub>TH</sub></b>. Same divider ratio, wildly different real-world answer — which is exactly why checking RTH against (β+1)×RE matters before trusting the shortcut.</div>`
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // (Identical to bjt_knowledge_basics.html's engine.)
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isAnswerCorrect(data, st) {
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ') : '—';
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function showCircuitRef(id, label) {
      document.getElementById('circuitRefUse').setAttribute('href', '#' + id);
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
    }

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      renderOptions();

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ')}`
          : 'Click the options above to select your answer.';
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (multi ? st.sel.length === 0 : st.sel === null);
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      showCircuitRef(data.circuitId, data.circuitLabel);
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        Q[i].ans = false;
        Q[i].sel = isMulti(QUESTIONS[i]) ? [] : null;
      }
      renderQuestion();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      showCircuitRef('npn-divider-pos', 'Reference Circuit');
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) {
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      }
      goToQuestion(n);
      if (answered) {
        Q[cur].sel = Array.isArray(Q[cur].cor) ? [...Q[cur].cor] : Q[cur].cor;
        checkAnswer();
      }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
    }
  </script>
