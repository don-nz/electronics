<!--
  Primer quiz for the "BJT amplifier configurations" lesson objectives:
  identifying Common Emitter / Common Collector / Common Base from a
  schematic, their input/output/common terminals, how quiescent values
  react to an AC signal, input-output phase relationship, and the main
  characteristics/applications of each. Also includes a conceptual (non-
  numeric) intro to the two factors limiting max peak-to-peak output
  voltage. Deliberately stops short of numeric gain/Vpp calculation and
  measurement — those objectives belong to a future dedicated analysis
  quiz, same split as bjt_knowledge_biasing.html vs the numeric DC-analysis
  quizzes.

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the architecture. Add/reorder questions
  by editing the QUESTIONS array only.
-->

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">

    #shapeGridCells { grid-template-columns: repeat(3, 1fr); }

    /* Q1's match columns hold full labelled schematics (not compact gate
       icons like the sibling quizzes' match questions), so the usual
       4-per-row layout — set inline via JS, hence needing !important to
       override here — leaves them too small to read the input/output/
       common labels on a phone. Force 2 per row below 480px instead. */
    @media (max-width: 480px) {
      #matchColumns { grid-template-columns: repeat(2, 1fr) !important; }
    }
  </style>
</head>

<body>

  <script>
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see bjt_knowledge_basics.html's header comment for the
    // full field reference. This file only uses leftPanel 'shapeGrid' (the
    // 3-circuit recognition grid) and the default 'circuit' (a single
    // reference diagram, picked per-question via circuitId).
    // ══════════════════════════════════════════════════════════════════════

    const AMP_CIRCUITS = [
      { id: 'amp-common-emitter', label: 'Common Emitter', inputBase: true, outputCollector: true, inverting: true, dualGain: true, unityVoltageGain: false, unityCurrentGain: false },
      { id: 'amp-common-collector', label: 'Common Collector', inputBase: true, outputCollector: false, inverting: false, dualGain: false, unityVoltageGain: true, unityCurrentGain: false },
      { id: 'amp-common-base', label: 'Common Base', inputBase: false, outputCollector: true, inverting: false, dualGain: false, unityVoltageGain: false, unityCurrentGain: true },
    ];

    const QUESTIONS = [
      {
        // Objective: identify Common Emitter / Common Collector / Common
        // Base by sight. kind:'match' with shape-based columns (the 3
        // circuit diagrams), same pattern as digital_knowledge_logic_
        // gates.html's gate-symbol matching question — but 6 pool items
        // against only 3 columns, since 3 of the names are deliberately
        // wrong. Wrong items use `col: null` — the CORRECT move for one of
        // these is to leave it sitting in the pool, untouched. That works
        // with zero engine changes to the match-correctness check itself
        // (`st.place[i] === st.cor[i]`): an unplaced item's `place` is
        // already `null`, so it naturally compares equal to a `null` `cor`.
        // What DID need a small engine change: the "ready to check" gate
        // and the pool's "needs a pick" prompt, both of which used to
        // require every pool item to be placed — now they only require
        // items with a real column (col !== null) to be placed.
        leftPanel: 'none',
        kind: 'match',
        // Taller canvas than the other circuit-diagram contexts (which
        // stay at the default -38 0 220 200) — just a bit more headroom
        // above/below the schematic for this question specifically.
        shapeViewBox: '-38 -15 220 230',
        columns: () => [
          { shapeId: 'amp-common-emitter' },
          { shapeId: 'amp-common-collector' },
          { shapeId: 'amp-common-base' },
        ],
        text: () => 'Each of the three amplifier configurations is shown below. <span style="color:var(--colour-ui-primary)">Place</span> each name that belongs to one of them in its box. Three of the six names don\'t belong to any of these circuits — leave those where they are.',
        hint: () => 'Work out which terminal carries the input, which carries the output, and which is tied to AC ground (the "common" terminal) in each diagram — that\'s exactly what each configuration is named after. If a name doesn\'t describe one of these three terminal arrangements, leave it in the pool.',
        options: () => shuffle([
          { label: 'Common Emitter', col: 0 },
          { label: 'Common Collector', col: 1 },
          { label: 'Common Base', col: 2 },
          { label: 'Follower', col: null },
          { label: 'Unity Gain', col: null },
          { label: 'Darlington Pair', col: null },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 6 names correctly sorted' : `${st.opts.length - wrongCount} of ${st.opts.length} names correctly sorted`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Misplaced:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">The three configurations:</div>
    <div class="working-line"><b class="colour-bjt">Common Emitter</b> — input at the base, output at the collector, emitter tied to AC ground. <b class="colour-bjt">Common Collector</b> — input at the base, output at the emitter, collector tied to AC ground (via the supply's decoupling capacitor). <b class="colour-bjt">Common Base</b> — input at the emitter, output at the collector, base tied to AC ground.</div>

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // (Identical to bjt_knowledge_basics.html's engine.)
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isMatch(data) { return data.kind === 'match'; }
    // A match question is ready to check once every item that HAS a real
    // column (col !== null) has been placed. Items with col:null are
    // correctly left in the pool — they don't need to be touched at all.
    function matchReady(st) { return st.opts.every((o, i) => o.col === null || st.place[i] !== null); }
    function isAnswerCorrect(data, st) {
      if (isMatch(data)) return st.place.every((p, i) => p === st.cor[i]);
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (isMatch(data)) {
        const correctCount = st.place.filter((p, i) => p === st.cor[i]).length;
        return `${correctCount} / ${st.opts.length} correctly sorted`;
      }
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      const asLabel = i => data.leftPanel === 'shapeGrid' ? (i + 1) : LETTERS[i];
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(asLabel).join(', ') : '—';
    }
    // Fills in the fully-correct answer for a question without marking it
    // answered — used by jump()/jumpToSummary() to fast-forward prior
    // questions.
    function fillCorrectSelection(i) {
      const data = QUESTIONS[i], st = Q[i];
      if (isMatch(data)) st.place = st.cor.slice();
      else if (isMulti(data)) st.sel = [...st.cor];
      else st.sel = st.cor;
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function renderShapeGrid() {
      const st = Q[cur], data = QUESTIONS[cur];
      // Most shapeGrid questions show the tall circuit schematics (their
      // own viewBox, -38 0 220 200); Q3's wave shapes are wide/short and
      // need a different box entirely — `shapeViewBox` lets a question
      // override the default rather than forcing every shape into one
      // fixed aspect ratio.
      const viewBox = data.shapeViewBox || '-38 0 220 200';
      const c = document.getElementById('shapeGridCells'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const cell = document.createElement('div'); cell.className = 'shape-cell';
        const selected = st.sel.includes(i);
        if (st.ans) {
          if (opt.type === 'correct') cell.classList.add(selected ? 'correct' : 'missed');
          else cell.classList.add(selected ? 'wrong' : 'dimmed');
        } else {
          if (selected) cell.classList.add('selected');
          cell.addEventListener('click', () => selectOption(i));
        }
        cell.innerHTML = `<span class="shape-num">${i + 1}</span><svg viewBox="${viewBox}"><use href="#${opt.shapeId}"/></svg>`;
        c.appendChild(cell);
      });
    }

    // ── kind:'match' — same drag-into-column technique as digital_
    // knowledge_logic_gates.html's Q2/Q3, adapted for this file's own
    // circuit-diagram viewBox (-30 0 200 200) rather than the compact
    // gate-icon one. Pool items here are always plain text (no shapeId),
    // but matchChipContent still branches on it for consistency/reuse.
    // `viewBox` defaults the same way renderShapeGrid()'s does, so a
    // question can set shapeViewBox to give its columns more/less canvas
    // (e.g. taller) independently of every other circuit-diagram context.
    function matchChipContent(opt, viewBox) {
      return opt.shapeId
        ? `<svg viewBox="${viewBox}" style="width:100%;max-width:150px;height:auto;display:block;margin:0 auto"><use href="#${opt.shapeId}"/></svg>`
        : opt.label;
    }

    function renderMatch() {
      const st = Q[cur], data = QUESTIONS[cur];
      const cols = data.columns();
      const viewBox = data.shapeViewBox || '-38 0 220 200';
      // Pool/placed chips can use a different viewBox than the column
      // titles — needed when the pool items are a different shape (e.g.
      // Q6's wide/short wave-pair icons vs its tall circuit-schematic
      // columns). Falls back to the column viewBox when unset.
      const poolViewBox = data.poolViewBox || viewBox;

      // While a term is picked up, only that same chip (to allow cancelling
      // the pick) and the columns stay clickable — every other pool word and
      // every already-placed word are locked, so a student can't
      // accidentally swap their pick or clear a previous answer mid-placement.
      const picking = st.sel !== null;
      // Only count items that actually still need placing — items with
      // col:null are meant to stay in the pool forever, so their presence
      // there shouldn't keep prompting the student to do something.
      const poolHasItems = st.opts.some((o, i) => o.col !== null && st.place[i] === null);
      const needsPick = !st.ans && !picking && poolHasItems;
      document.getElementById('matchPoolRow').classList.toggle('needs-pick', needsPick);
      document.getElementById('matchPool').classList.toggle('needs-pick', needsPick);

      const pool = document.getElementById('matchPool');
      pool.innerHTML = '';
      st.opts.forEach((opt, i) => {
        if (st.place[i] !== null) return;
        const chip = document.createElement('button');
        const isPicked = st.sel === i;
        chip.className = 'match-chip' + (isPicked ? ' picked' : '');
        // Once answered, matchReady() guarantees every item still sitting
        // here has col:null — i.e. correctly left untouched.
        if (st.ans) chip.classList.add('correct');
        chip.innerHTML = matchChipContent(opt, poolViewBox);
        chip.disabled = st.ans || (picking && !isPicked);
        if (!chip.disabled) chip.addEventListener('click', (e) => { e.stopPropagation(); selectPoolItem(i); });
        pool.appendChild(chip);
      });

      const colsEl = document.getElementById('matchColumns');
      colsEl.innerHTML = '';
      colsEl.style.gridTemplateColumns = `repeat(${Math.min(cols.length, 4)}, 1fr)`;
      cols.forEach((col, colIdx) => {
        const colDiv = document.createElement('div');
        colDiv.className = 'match-column';
        colDiv.addEventListener('click', () => assignToColumn(colIdx));

        const arrow = document.createElement('div'); arrow.className = 'match-col-arrow'; arrow.textContent = '▼';
        const title = document.createElement('div'); title.className = 'match-col-title';
        title.innerHTML = (typeof col === 'string') ? col : `<svg viewBox="${viewBox}" style="width:100%;max-width:150px;display:block;margin:0 auto"><use href="#${col.shapeId}"/></svg>`;
        const items = document.createElement('div'); items.className = 'match-col-items';

        st.opts.forEach((opt, i) => {
          if (st.place[i] !== colIdx) return;
          const chip = document.createElement('button');
          chip.className = 'match-chip';
          chip.innerHTML = matchChipContent(opt, poolViewBox);
          if (st.ans) {
            chip.disabled = true;
            chip.classList.add(st.place[i] === st.cor[i] ? 'correct' : 'wrong');
          } else {
            chip.disabled = picking;
            if (!chip.disabled) chip.addEventListener('click', (e) => { e.stopPropagation(); unassignItem(i); });
          }
          items.appendChild(chip);
        });

        colDiv.append(arrow, title, items);
        colDiv.classList.toggle('droppable', !st.ans && picking);
        colsEl.appendChild(colDiv);
      });
    }

    function selectPoolItem(i) {
      const st = Q[cur];
      if (st.ans) return;
      st.sel = (st.sel === i) ? null : i;
      renderQuestion();
    }

    function assignToColumn(colIdx) {
      const st = Q[cur];
      if (st.ans || st.sel === null) return;
      st.place[st.sel] = colIdx;
      st.sel = null;
      renderQuestion();
    }

    function unassignItem(i) {
      const st = Q[cur];
      if (st.ans) return;
      st.place[i] = null;
      renderQuestion();
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function showCircuitRef(id, label) {
      document.getElementById('circuitRefUse').setAttribute('href', '#' + id);
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
    }

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      document.getElementById('qMatch').style.display = isMatch(data) ? 'flex' : 'none';
      document.getElementById('qOptions').style.display = isMatch(data) ? 'none' : '';
      if (isMatch(data)) {
        renderMatch();
      } else if (data.leftPanel === 'shapeGrid') {
        document.getElementById('qOptions').innerHTML = '';
        renderShapeGrid();
      } else {
        renderOptions();
      }

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => data.leftPanel === 'shapeGrid' ? (i + 1) : LETTERS[i]).join(', ')}`
          : 'Click the options above to select your answer.';
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (
        isMatch(data) ? !matchReady(st) :
        (multi ? st.sel.length === 0 : st.sel === null)
      );
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      // Left panel is 3-way: the single reference circuit (default), the
      // shapeGrid recognition panel (leftPanel:'shapeGrid'), or neither
      // (match questions build their own columns/pool layout on the right
      // instead — leftPanel:'none').
      const panelMode = data.leftPanel === 'shapeGrid' ? 'shapeGrid' : (data.leftPanel === 'none' ? 'none' : 'circuit');
      document.querySelector('.circuit-panel').style.display = panelMode === 'circuit' ? '' : 'none';
      document.getElementById('qShapeGridPanel').style.display = panelMode === 'shapeGrid' ? 'block' : 'none';
      if (panelMode === 'circuit') showCircuitRef(data.circuitId, data.circuitLabel);
      // With no left panel at all, quiz-common.css's .single-col collapses
      // the 2-column grid (circuit-col + questions-col) down to one
      // centred column at desktop widths — without this, match questions
      // stay confined to the questions-col's ~48% share of the page even
      // though the (empty) circuit-col track is still reserved.
      document.getElementById('quizWrap').classList.toggle('single-col', panelMode === 'none');
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMatch(data)) { if (!matchReady(st)) return; }
      else if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        const data = QUESTIONS[i];
        Q[i].ans = false;
        if (isMatch(data)) { Q[i].place = Q[i].opts.map(() => null); Q[i].sel = null; }
        else Q[i].sel = isMulti(data) ? [] : null;
      }
      renderQuestion();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMatch(data)) {
          const cor = opts.map(o => o.col);
          return { sel: null, ans: false, cor, opts, place: opts.map(() => null) };
        }
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      document.querySelector('.circuit-panel').style.display = '';
      document.getElementById('qShapeGridPanel').style.display = 'none';
      document.getElementById('quizWrap').classList.remove('single-col');
      showCircuitRef('amp-common-emitter', 'Reference Circuit');
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) { fillCorrectSelection(i); Q[i].ans = true; }
      goToQuestion(n);
      if (answered) { fillCorrectSelection(cur); checkAnswer(); }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        fillCorrectSelection(i);
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
    }
  </script>
</body>
