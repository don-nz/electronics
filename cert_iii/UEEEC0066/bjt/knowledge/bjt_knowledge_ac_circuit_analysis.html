<!--
  Knowledge quiz for deriving the AC-EQUIVALENT circuit from a DC-biased
  BJT amplifier — built from a conversation about how to TEACH this
  specific transform, not from a photographed objectives page. The user's
  own lesson notes show a standard RB1/RB2 voltage-divider CE stage (with
  C1/C2 coupling caps) alongside its already-simplified AC-equivalent
  redraw, and asked for a step-by-step way to bridge from one to the
  other. The three steps landed on (and taught here in that order):
    Step 1 — coupling capacitors (C1, C2) become AC shorts (plain wire)
    Step 2 — VCC becomes an AC short to 0V, merging with the ground rail
    Step 3 — redraw each component against the rail it now actually
             connects to (RB1/RB2 end up in parallel, base-to-common;
             RC/RE end up collector-to-common / emitter-to-common)

  This quiz is deliberately DERIVATION-ONLY — no Zin/Zout/Av numbers are
  calculated here (that's bjt_knowledge_ac_parameters.html's job). This
  file is the missing "why" that feeds INTO that one: Q9 explicitly
  bridges to Zin = RB1∥RB2∥Zb without computing it, since that's exactly
  the formula ac_parameters.html's own Q3/Q7 already exercise numerically.
  Component names (RB1/RB2 rather than R1/R2) intentionally match the
  user's own lesson-note naming rather than this project's usual R1/R2
  convention, since this quiz is teaching directly from that material.

  FOUR circuit states, switched via the usual per-question `circuitId`
  (same v2-engine mechanism as ce-divider-ac/cc-divider-ac/freq-response-
  graph in bjt_knowledge_ac_parameters.html — see that file's header
  comment for the core QUESTIONS[]-driven engine this one reuses verbatim):

    dc-circuit    — the original DC bias circuit (VCC/0V rails, C1/C2
                    caps) — coordinates reused verbatim from
                    ac_parameters.html's own ce-divider-ac (RB1/RB2/RC/RE
                    in the same positions as that file's R1/R2/RC/RE),
                    with the rails widened into full-width lines (rather
                    than that file's compact VCC/GND symbol groups) since
                    the whole point here is to visually MERGE them later.
    step1-circuit — identical layout to dc-circuit; C1/C2 replaced with a
                    plain wire plus a small "→ short" annotation.
    step2-circuit — identical to step1-circuit; VCC rail recoloured to
                    the ground colour and its label struck through, with
                    a dashed connector drawn to the 0V rail showing they
                    are now the same AC node.
    step3-circuit — a genuinely NEW layout (own `circuitViewBox`,
                    narrower/shorter than the other three) matching the
                    user's own redrawn AC-equivalent: three rails (base,
                    collector, AC-common) instead of two, with RB1/RB2/
                    RC/RE each redrawn hanging between the rail they
                    actually connect to and the shared AC-common rail.

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.
-->

  <script>

    const QUESTIONS = [
      {
        circuitId: 'dc-circuit',
        circuitLabel: 'Original DC Bias Circuit',
        text: () => 'Before simplifying anything, here\'s the rule this whole process rests on. A correctly-sized coupling capacitor like <b class="colour-cap">C1</b> or <b class="colour-cap">C2</b> behaves very differently for AC signals than it does for DC. What does it look like to <b style="color:var(--colour-ui-primary)">EACH</b>?',
        hint: () => 'Capacitor reactance is Xc = 1/(2πfC). At DC, f = 0. At the signal frequencies these are chosen for, Xc is deliberately made tiny.',
        options: () => shuffle([
          { label: 'To DC: an OPEN circuit (blocks it). To AC: effectively a SHORT circuit (passes it).', type: 'correct' },
          { label: 'To DC: a SHORT circuit. To AC: an OPEN circuit.', type: 'wrong' },
          { label: 'The same both times — always a short circuit.', type: 'wrong' },
          { label: 'The same both times — always an open circuit.', type: 'wrong' },
        ]),
        correctExplain: () => 'To DC: OPEN. To AC: effectively a SHORT.',
        working: () => `
    <div class="working-line">Capacitor reactance: <b class="colour-cap">X<sub>C</sub></b> = 1 / (2π<b class="colour-gain">f</b><b class="colour-cap">C</b>).</div>
    <div class="working-line">At <b>DC</b>, <b class="colour-gain">f</b> = 0, so <b class="colour-cap">X<sub>C</sub></b> is infinite — an OPEN circuit. That's exactly why a coupling capacitor can block the DC bias voltage from one stage leaking into the next.</div>
    <div class="working-total">At the <b>AC</b> signal frequencies <b class="colour-cap">C1</b>/<b class="colour-cap">C2</b> are chosen for, <b class="colour-cap">C</b> is picked large enough that <b class="colour-cap">X<sub>C</sub></b> is negligibly small — effectively a SHORT circuit (plain wire). This is the entire justification for Step 1.</div>`
      },
      {
        circuitId: 'step1-circuit',
        circuitLabel: 'Step 1 — Coupling Capacitors Removed',
        text: () => 'Step 1 applied: with <b class="colour-cap">C1</b> and <b class="colour-cap">C2</b> now treated as AC shorts (plain wires), what does the <b style="color:var(--colour-ui-primary)">BASE</b> of <b class="colour-bjt">Q1</b> now <b style="color:var(--colour-ui-primary)">connect</b> directly to?',
        hint: () => 'Follow the wire where C1 used to be — it now runs straight through.',
        options: () => shuffle([
          { label: 'The external input signal source', type: 'correct' },
          { label: '+VCC', type: 'wrong' },
          { label: '0V / ground', type: 'wrong' },
          { label: 'Nothing — the base is now disconnected', type: 'wrong' },
        ]),
        correctExplain: () => 'The input source — <b class="colour-cap">C1</b> is now just a wire.',
        working: () => `
    <div class="working-line">With <b class="colour-cap">C1</b> treated as a short, the gap that used to separate the input source from the base-bias node disappears — it's now one continuous wire.</div>
    <div class="working-total">The <b class="colour-bjt">base</b> of <b class="colour-bjt">Q1</b> is now directly connected to the external <b class="colour-signal">input</b> signal source (and, via <b class="colour-resistor">RB1</b>/<b class="colour-resistor">RB2</b>, still to the bias network too — that's Step 2 and 3's job to sort out).</div>`
      },
      {
        circuitId: 'step1-circuit',
        circuitLabel: 'Step 1 — Coupling Capacitors Removed',
        text: () => 'Same idea, the other side: with <b class="colour-cap">C2</b> now a short, what does the <b style="color:var(--colour-ui-primary)">COLLECTOR</b> of <b class="colour-bjt">Q1</b> now <b style="color:var(--colour-ui-primary)">connect</b> directly to?',
        hint: () => 'Follow the wire where C2 used to be.',
        options: () => shuffle([
          { label: 'The output', type: 'correct' },
          { label: '+VCC', type: 'wrong' },
          { label: '0V / ground', type: 'wrong' },
          { label: 'RE', type: 'wrong' },
        ]),
        correctExplain: () => 'The output — <b class="colour-cap">C2</b> is now just a wire.',
        working: () => `
    <div class="working-total">Same logic as Q2, mirrored on the output side: with <b class="colour-cap">C2</b> shorted, the <b class="colour-bjt">collector</b> is now directly wired straight through to the <b class="colour-signal">output</b>.</div>`
      },
      {
        circuitId: 'step1-circuit',
        circuitLabel: 'Step 1 — Coupling Capacitors Removed',
        text: () => 'A real DC supply like <b class="colour-supply">VCC</b> has almost zero internal AC impedance — it\'s built to hold a rock-steady voltage no matter what current is drawn — and is usually decoupled further with a large capacitor right at the supply pin. <b style="color:var(--colour-ui-primary)">What</b> does <b class="colour-supply">VCC</b> look like to an <b style="color:var(--colour-ui-primary)">AC signal</b>?',
        hint: () => 'Same logic as Q1, applied to a voltage SOURCE instead of a capacitor: something that never changes value looks like...',
        options: () => shuffle([
          { label: 'Effectively a SHORT to AC ground (0V for AC signals, even though it\'s well above 0V for DC)', type: 'correct' },
          { label: 'A very large AC resistance', type: 'wrong' },
          { label: 'An open circuit for AC', type: 'wrong' },
          { label: 'It depends on how much current RC draws', type: 'wrong' },
        ]),
        correctExplain: () => 'Effectively an AC short to ground.',
        working: () => `
    <div class="working-line">A perfect voltage source has zero internal impedance — its voltage can't be pushed or pulled by whatever the AC signal does to it, which is exactly the definition of a short circuit for signal purposes. Real supplies get very close to this thanks to bulk decoupling capacitance.</div>
    <div class="working-total">So while <b class="colour-supply">VCC</b> sits at, say, +12V for DC bias purposes, for the AC signal specifically it behaves exactly like 0V ground. This is the entire justification for Step 2.</div>`
      },
      {
        circuitId: 'step2-circuit',
        circuitLabel: 'Step 2 — VCC Merged with 0V',
        kind: 'multi',
        text: () => 'Step 2 applied — <b class="colour-supply">VCC</b> is now treated as an AC short to <b style="color:var(--colour-gnd)">0V</b>, shown here as the dashed line merging the two rails. <b style="color:var(--colour-ui-primary)">Select</b> the terminals that are now <b style="color:var(--colour-ui-primary)">connected to</b> same merged <b style="color:var(--colour-gnd)">0V</b> rail.',
        hint: () => 'Look at which resistor terminals were originally wired straight to +VCC or straight to 0V — not to the base node or the collector node.',
        options: () => shuffle([
          { label: 'RB1 (top terminal)', type: 'correct' },
          { label: 'RC (top terminal)', type: 'correct' },
          { label: 'RB2 (bottom terminal)', type: 'correct' },
          { label: 'RE (bottom terminal)', type: 'correct' },
          { label: 'The base node', type: 'wrong' },
          { label: 'C1\'s input-side plate', type: 'wrong' },
        ]),
        correctExplain: (st) => {
          const letters = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${letters}</b> — every terminal originally wired to +VCC or 0V`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-line">In the ORIGINAL DC circuit, <b class="colour-resistor">RB1</b>'s top and <b class="colour-resistor">RC</b>'s top were wired to <b class="colour-supply">+VCC</b>; <b class="colour-resistor">RB2</b>'s bottom and <b class="colour-resistor">RE</b>'s bottom were wired to 0V. Now that those two rails are the same AC node, all four of those terminals are too — options ${correctNums}.</div>
    <div class="working-total">The base node and C1's input-side plate are untouched by this step — they were never wired to VCC or 0V in the first place, so Step 2 has no effect on them.</div>`;
        }
      },
      {
        circuitId: 'step2-circuit',
        circuitLabel: 'Step 2 — VCC Merged with 0V',
        text: () => 'Why is it valid to merge <b class="colour-supply">VCC</b> and 0V into ONE common AC rail, even though they\'re obviously different DC voltages?',
        hint: () => 'Think back to the previous question\'s reasoning.',
        options: () => shuffle([
          { label: 'Neither rail changes value — for AC (which only cares about things that wiggle), two rails that never move are indistinguishable', type: 'correct' },
          { label: 'Because VCC is always higher in voltage than 0V', type: 'wrong' },
          { label: 'Because they happen to be connected by a wire in this particular diagram', type: 'wrong' },
          { label: 'Because the coupling capacitors make them electrically equal', type: 'wrong' },
        ]),
        correctExplain: () => 'Neither rail changes value — AC only cares about what wiggles.',
        working: () => `
    <div class="working-total">AC analysis only cares about the SIGNAL — the part that changes over time. Both VCC and 0V are fixed, unmoving DC references. A signal riding on either one sees the exact same thing: nothing moving. That's what makes them interchangeable as an AC reference, regardless of how far apart their actual DC voltages are.</div>`
      },
      {
        circuitId: 'step2-circuit',
        circuitLabel: 'Step 2 — VCC Merged with 0V',
        text: () => 'Now that <b class="colour-resistor">RB1</b>\'s top and <b class="colour-resistor">RB2</b>\'s bottom both sit on the same AC-common rail, how are <b class="colour-resistor">RB1</b> and <b class="colour-resistor">RB2</b> related to each other for AC signals?',
        hint: () => 'Both now run directly between the SAME two points: the base node, and AC common.',
        options: () => shuffle([
          { label: 'They\'re now in PARALLEL — both connected directly between the base and AC common', type: 'correct' },
          { label: 'They\'re still in series with each other', type: 'wrong' },
          { label: 'They\'re disconnected from each other now', type: 'wrong' },
          { label: 'They cancel out and can be removed entirely', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">RB1</b> ∥ <b class="colour-resistor">RB2</b> — both directly between the base and AC common.',
        working: () => `
    <div class="working-line">Two components sharing BOTH endpoints are, by definition, in parallel — and that's exactly what's happened here once VCC and 0V became the same node.</div>
    <div class="working-total">This is the whole reason <b class="colour-resistor">RB1</b>∥<b class="colour-resistor">RB2</b> shows up as a single combined term when calculating the AC input resistance looking into the base — it isn't a coincidence of the formula, it's a direct consequence of this step.</div>`

        circuitLabel: 'Step 3 — Redrawn AC-Equivalent Circuit',

        hint: () => 'They didn\'t get merged into a rail like VCC did — they were replaced by a plain wire back in Step 1.',

        working: () => `

    <div class="working-total">Contrast that with <b class="colour-supply">VCC</b> and 0V: they didn't vanish — they MERGED into the AC-common rail, and every resistor that used to connect to either one is still right here, just redrawn hanging off that shared rail instead.</div>`

        circuitLabel: 'Step 3 — Redrawn AC-Equivalent Circuit',
        text: () => 'Looking at this final AC-equivalent circuit: besides the transistor\'s own base impedance, which two resistors end up in parallel with it when you go to calculate the AC input resistance looking into the base?',
        hint: () => 'Same two resistors from a couple of questions ago — they never left, they just got redrawn.',
        options: () => shuffle([
          { label: '<b class="colour-resistor">RB1</b> and <b class="colour-resistor">RB2</b>', type: 'correct' },
          { label: '<b class="colour-resistor">RC</b> and <b class="colour-resistor">RE</b>', type: 'wrong' },
          { label: 'Just <b class="colour-resistor">RE</b>', type: 'wrong' },
          { label: 'None — only the transistor\'s own impedance matters', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">RB1</b> and <b class="colour-resistor">RB2</b> — both tied between the base and AC common.',
        working: () => `
    <div class="working-total">This is exactly the bridge into <b class="colour-resistor">Z<sub>in</sub></b> = RB1∥RB2∥<b class="colour-resistor">Z<sub>b</sub></b> — the same formula bjt_knowledge_ac_parameters.html's Zin questions already put numbers into. This quiz doesn't compute that value; it just shows where the "RB1∥RB2" part of that formula actually comes from.</div>`
      },
      {
        circuitId: 'step3-circuit',
        circuitViewBox: STEP3_VIEWBOX,
        circuitLabel: 'Step 3 — Redrawn AC-Equivalent Circuit',
        text: () => 'Put it all together: which statement correctly summarises the 3-step process for turning a DC bias circuit into its AC-equivalent circuit?',
        hint: () => 'Check each step against what it actually does to the caps, to VCC, and to the layout.',
        options: () => shuffle([
          { label: 'Step 1: treat coupling capacitors as shorts. Step 2: treat VCC as an AC short to 0V, merging it with the ground rail. Step 3: redraw each component against the rail it now actually connects to.', type: 'correct' },
          { label: 'Step 1: treat VCC as an open circuit. Step 2: remove all resistors. Step 3: redraw with the transistor in the centre.', type: 'wrong' },
          { label: 'Step 1: remove the transistor. Step 2: treat capacitors as opens. Step 3: reconnect everything to 0V only.', type: 'wrong' },
          { label: 'Step 1: treat coupling capacitors as opens. Step 2: treat VCC as an open circuit. Step 3: redraw with the capacitors still in place.', type: 'wrong' },
        ]),
        correctExplain: () => 'Caps → shorts, VCC → AC-common (merges with 0V), then redraw against the new common rail.',
        working: () => `
    <div class="working-line">Step 1 (Q1-3): coupling capacitors are AC shorts — plain wire.</div>
    <div class="working-line">Step 2 (Q4-7): VCC is an AC short to 0V — the two rails merge into one "AC common," which is exactly why RB1 and RB2 end up in parallel (and RC/RE each end up between their transistor terminal and that same common rail).</div>
    <div class="working-total">Step 3 (Q8-9): redraw with nothing left pointing at a now-nonexistent VCC rail — every resistor's "other" end lands on the same shared AC-common rail, which is what makes the whole circuit click into the clean shape this quiz's final diagram shows.</div>`
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // (Same as bjt_knowledge_basics.html's engine.)
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isAnswerCorrect(data, st) {
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ') : '—';
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function showCircuitRef(id, label, viewBox) {
      document.getElementById('circuitRefUse').setAttribute('href', '#' + id);
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
      document.getElementById('circuitRefSvg').setAttribute('viewBox', viewBox || DEFAULT_VIEWBOX);
      if (xyOn) buildXYRuler();
    }

    /* ─── DEV: xy ruler overlay, for lining up SVG coordinates by eye ────────
       Console:   setXY(1) / setXY(0)     URL: ?xy=1
       Rebuilt on every showCircuitRef() call (not build-once-and-cache like
       bjt_knowledge_basics.html's original) since this file's viewBox
       changes per question (dc/step1/step2 vs. step3's own STEP3_VIEWBOX) —
       a cached ruler would drift out of alignment the moment the diagram
       switched to a different box. */
    let xyOn = false;
    function buildXYRuler() {
      const g = document.getElementById('xyRuler');
      if (!g) return;
      const vb = document.getElementById('circuitRefSvg').viewBox.baseVal;
      const offX = vb.x, offY = vb.y, W = vb.width, H = vb.height;
      const hy = offY + H - 10, vx = offX + 10, col = '#ff00ff';
      let svg = `<line x1="${offX}" y1="${hy}" x2="${offX + W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let x = 0; x <= W; x += 10) {
        const gx = offX + x, major = (Math.round(gx) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${gx}" y1="${hy - len}" x2="${gx}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${gx}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${Math.round(gx)}</text>`;
      }
      svg += `<line x1="${vx}" y1="${offY}" x2="${vx}" y2="${offY + H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let y = 0; y <= H; y += 10) {
        const gy = offY + y, major = (Math.round(gy) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${vx}" y1="${gy}" x2="${vx + len}" y2="${gy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${vx + 13}" y="${gy + 3}" fill="${col}" font-size="8" text-anchor="start">${Math.round(gy)}</text>`;
      }
      g.innerHTML = svg;
    }
    function setXY(on) {
      xyOn = on;
      const g = document.getElementById('xyRuler');
      if (!g) return;
      if (on) buildXYRuler();
      g.setAttribute('display', on ? 'inline' : 'none');
    }
    window.setXY = setXY;

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      renderOptions();

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ')}`
          : 'Click the options above to select your answer.';
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (multi ? st.sel.length === 0 : st.sel === null);
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      showCircuitRef(data.circuitId, data.circuitLabel, data.circuitViewBox);
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        Q[i].ans = false;
        Q[i].sel = isMulti(QUESTIONS[i]) ? [] : null;
      }
      renderQuestion();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      showCircuitRef('dc-circuit', 'Original DC Bias Circuit', DEFAULT_VIEWBOX);
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    // ── zoom modal ──
    function openModal() {
      const src = document.getElementById('circuitRefSvg'), dst = document.getElementById('modalSvg');
      dst.innerHTML = src.innerHTML; dst.setAttribute('viewBox', src.getAttribute('viewBox'));
      document.getElementById('modalTitle').textContent = document.getElementById('circuitRefLabel').textContent;
      document.getElementById('diagramModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('diagramModal').classList.remove('open');
      document.getElementById('modalSvg').innerHTML = '';
      document.body.style.overflow = '';
    }
    function handleModalClick(e) { if (e.target.closest('.modal-close')) return; closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) {
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      }
      goToQuestion(n);
      if (answered) {
        Q[cur].sel = Array.isArray(Q[cur].cor) ? [...Q[cur].cor] : Q[cur].cor;
        checkAnswer();
      }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
      if (p.has('xy')) setXY(+p.get('xy') === 1);
    }
  </script>
