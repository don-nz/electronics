<!--
  Knowledge quiz completing the AC-parameters lesson's "measure loaded vs
  unloaded gain" objective (the original bjt_knowledge_ac_parameters.html
  covered this with Q10-11 before the file was split; those questions
  didn't survive into bjt_knowledge_ac_params_ce.html — see that file's
  own header comment). User: *"I would like to create one more quiz to
  complete the lesson. bjt_knowledge_ac_params_loading. Can you show the
  circuit as it looks in bjt_knowledge_ac_circuit_analysis.html q10 and
  adjust it like this: 1. move output in slightly, extend the top and
  bottom rails slightly, and add a resistor shape based on VC but
  labelled RL and give it a value - maybe 5K ohms."*

  Circuit: bjt_knowledge_ac_circuit_analysis.html's own `step3-circuit`
  (its Q10/final AC-equivalent redraw — RB1∥RB2 on the base rail, RC and
  RE each hanging off their own transistor terminal down to the shared
  AC-common rail) cloned into this file verbatim, with the requested
  additions only: the output tap/probe moved in from x=560 to x=530, the
  top and AC-common rails both extended from x=560/580 out to x=650, and
  a new resistor RL (5 kΩ) added in that freed space — hanging from the
  SAME collector rail RC hangs from, down to the SAME AC-common rail, i.e.
  wired in PARALLEL with RC, matching how an external load is actually
  connected in a real circuit. RL's own value (5 kΩ) is shown beside its
  box — a deliberate departure from ac_circuit_analysis.html's own
  "derivation-only, no values" convention for RB1/RB2/RC/RE, since this
  file's whole point is a numeric loaded-gain calculation RL needs a
  concrete value for.

  Q1 establishes the core concept before any calculation: RL represents
  an EXTERNAL load (whatever's actually connected to receive the output
  signal — the next stage, a speaker, test equipment), NOT a property of
  the amplifier stage itself. The most common confusion this tests for is
  RL vs Zout — students often conflate "the load resistance" with "the
  amplifier's own output resistance," when the two are genuinely distinct
  quantities that together form a voltage divider (Av,loaded =
  Av,unloaded × RL/(RL+Zout), already taught numerically in
  bjt_knowledge_ac_params_ce.html's sibling files' own loaded-gain
  questions before the split — this file is where that concept now lives
  for the whole AC-parameters lesson).

  Q2 introduces `ce-divider-ac-unloaded` — bjt_knowledge_ac_params_ce.html's
  own `ce-divider-ac` circuit, cloned verbatim in its fully-revealed Q5
  state (re′/Zb/Zin/Zout badges all shown), used as a static recap: no
  reveal-toggle JS needed, since this file only ever shows it fully
  answered. User: *"Can you now add the circuit from
  ac_parameters/bjt_knowledge_ac_params_ce.html Q5 as the circuit for the
  new quiz Q2. Q2. We previously determined the gain for this circuit to
  be |Av| ≈ 6.44. What is the correct representation for this value?"*
  Correct answer: A_v(unloaded) — that 6.44 figure was calculated with
  nothing connected at the output at all, matching Q1's own RL-vs-Zout
  distinction: once RL is connected (Q1's own circuit), the SAME stage's
  gain becomes A_v(loaded) instead, a lower number. "A_v(RC)" and
  "A_v(out)" are invented non-standard names (distractors, not real
  terms); "A_v(loaded)" is the wrong TIME, not the wrong idea — it's the
  correct term for a DIFFERENT number (after RL is connected).

  Q3 reuses Q2's `ce-divider-ac-unloaded` circuit (which the user hand-
  edited between turns to drop the Zb/Zin badges — not needed for a
  loaded-gain calculation, decided in conversation — and add a
  `gainInd` "|Av| ≈ 6.44" readout plus an "10 mV p-p" label on the input
  source, both anticipating this question) and asks the reader to apply
  that gain: Vout = VS × Av ≈ 64.4 mV (p-p). Distractors: divide instead
  of multiply, add instead of multiply, and multiply by RC instead of Av
  — the last one a direct callback to Q2's own "Av(RC) isn't a real
  thing" lesson. Working explicitly notes this is still the UNLOADED
  figure, previewing that connecting Q1's RL would pull it down.

  Q4-5 introduce `ce-divider-ac-loaded` — a new circuit, cloned from
  Q2-3's own `ce-divider-ac-unloaded` per: *"For Q4 and Q5 I would like to
  add a load to the circuit. Continue OUTPUT HORIZONTAL wire to x2=600 and
  create a new LOAD VERTICAL wire from there to GND. AV(unloaded) shoud
  now dissapear. Also add a resistor RL at the same height as RE on that
  line."* The existing output tap/Cout/probe (x=500) is untouched; the
  same horizontal wire simply continues past it to x=600, where RL (5 kΩ)
  hangs on a new vertical branch down to AC common — in parallel with RC,
  matching Q1's own step3-circuit-loaded convention exactly. No `gainInd`
  group on this circuit at all (not toggled — simply absent), since the
  unloaded reading doesn't apply once RL is connected.

  Q4 mirrors Q2 in the opposite direction: same four terminology options,
  but now Av(loaded) is correct and Av(unloaded) is the trap (right idea,
  wrong moment — that's the number from BEFORE RL was connected).

  Q5-6 (originally a single question, split per the user's own follow-up —
  see below) both compute the SAME Av(loaded) ≈ 4.73 via two different
  formulas, deliberately kept as separate questions rather than folded
  into one multi-method working, so each formula gets its own dedicated
  moment: Q5 is "the class/textbook formula" — Av(loaded) =
  (RC∥RL)/(RE+re′), a direct extension of the unloaded Av formula with
  RC∥RL swapping in for RC on its own. Q6 is the ALTERNATIVE shortcut —
  Av(loaded) = Av(unloaded) × RL/(RL+Zout) — reusing the Av(unloaded)
  figure already established in Q2-3 rather than recomputing RC∥RL from
  scratch, framed explicitly as "because we already had Av(unloaded), we
  could have used an alternative formula." User: *"The book has this
  formula for Av loaded = (Rc||RL) / (re + RE). Can you please: Move
  current Q5 to Q6 and word it something like - Because we already had Av
  unloaded, we could have used an alternative formula to calculate Av
  loaded. Make Q5 this the class formula?"* Q5's distractors: forgot RL
  entirely (≈6.44, literally the unloaded answer), RC+RL in series instead
  of parallel (≈24.32), re′ left out of the denominator (≈4.90). Q6 kept
  its original three distractors (numerator/denominator swapped ≈1.71,
  added instead of divided ≈9.22, fraction inverted ≈8.76) — those remain
  valid critiques of the RL/(RL+Zout) formula specifically, unchanged by
  the split.

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.
-->

    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

    // full field reference. Currently Q1-6.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'step3-circuit-loaded',
        circuitLabel: 'AC-Equivalent Circuit — Output Loaded with RL',
        text: () => 'A new resistor <b class="colour-resistor">R<sub>L</sub></b> = 5 kΩ has been added to this AC-equivalent circuit, connected between the collector rail and AC common — in <b style="color:var(--colour-ui-primary)">parallel</b> with <b class="colour-resistor">R<sub>C</sub></b>. What does <b class="colour-resistor">R<sub>L</sub></b> represent in this AC-equivalent circuit representation?',
        hint: () => 'Think about what\'s physically connected to the amplifier\'s output terminal in a real circuit — the next stage, a speaker, a test instrument — and how that\'s different from a property of the amplifier stage itself.',
        options: () => shuffle([
          { label: 'The LOAD — the resistance of whatever external device is connected to receive the amplifier\'s output signal (e.g. the next stage, a speaker, test equipment)', type: 'correct' },
          { label: 'An additional input resistance, changing Zin', type: 'wrong' },
          { label: 'An additional output resistance — it becomes part of Zout itself', type: 'wrong' },
          { label: 'The transistor\'s own internal collector-to-emitter resistance', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">R<sub>L</sub></b> is the LOAD — an external resistance connected to the output, not a property of the amplifier itself',
        working: () => `
    <div class="working-line"><b class="colour-resistor">R<sub>L</sub></b> sits OUTSIDE the amplifier stage entirely — it's whatever real-world device is connected to receive the amplified signal. It has no effect on <b class="colour-resistor">Z<sub>in</sub></b> (it's nowhere near the base) and it doesn't change the transistor's own internal behaviour, so options about Zin or the transistor's own resistance are both wrong.</div>
    <div class="working-line">The trickier wrong answer is "it becomes part of Zout" — a common mix-up. <b class="colour-resistor">Z<sub>out</sub></b> is a property of the AMPLIFIER STAGE itself (looking back into the collector with the source zeroed — here that's ≈RC), fixed regardless of what gets connected afterwards. <b class="colour-resistor">R<sub>L</sub></b> is a completely separate resistance that the amplifier now happens to be driving.</div>
    <div class="working-total"><b class="colour-resistor">R<sub>L</sub></b> and <b class="colour-resistor">Z<sub>out</sub></b> are two DISTINCT resistances that together form a voltage divider at the output node: <b class="colour-gain">A<sub>v,loaded</sub></b> = <b class="colour-gain">A<sub>v,unloaded</sub></b> × RL/(RL+Zout). Keep that distinction in mind — the next questions build on it.</div>`
      },
      {
        circuitId: 'ce-divider-ac-unloaded',
        circuitViewBox: CE_VIEWBOX,
        circuitLabel: 'Common Emitter — no RL connected',
        text: () => 'We previously determined the voltage gain for THIS circuit — no <b class="colour-resistor">R<sub>L</sub></b> connected — to be <b class="colour-gain">|A<sub>v</sub>|</b> ≈ 6.44. What is the correct representation for this value?',
        hint: () => 'This number was calculated with nothing connected at the output at all — just Cout and an open probe point.',
        options: () => shuffle([
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(out)</tspan>', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(RC)</tspan>', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan>', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(unloaded)</tspan>', type: 'correct' },
        ]),
        correctExplain: () => '<b class="colour-gain">A<sub>v(unloaded)</sub></b> — no RL was connected when this value was calculated',
        working: () => `
    <div class="working-line">Back in <b class="colour-bjt">bjt_knowledge_ac_params_ce.html</b>, <b class="colour-gain">|A<sub>v</sub>|</b> ≈ 6.44 was calculated from <b class="colour-gain">A<sub>v</sub></b> ≈ R<sub>C</sub>/(R<sub>E</sub>+r<sub>e</sub>′) — a formula that only ever involves components INSIDE the amplifier stage itself. No load was connected at the output at all.</div>
    <div class="working-line">"A<tspan baseline-shift="sub" font-size="11">v(RC)</tspan>" and "A<tspan baseline-shift="sub" font-size="11">v(out)</tspan>" aren't standard names for this at all — gain isn't labelled after a single component or generically after "the output." And "A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan>" is specifically wrong here: LOADED gain is what you get AFTER connecting RL and it pulls the gain down — this 6.44 figure is the number BEFORE that happens.</div>
    <div class="working-total">The correct term is <b class="colour-gain">A<sub>v(unloaded)</sub></b> — the gain of the amplifier stage on its own, with nothing connected to draw current from the output. Once <b class="colour-resistor">R<sub>L</sub></b> is connected (as in Q1's circuit), that value drops to <b class="colour-gain">A<sub>v(loaded)</sub></b> instead.</div>`
      },
      {
        circuitId: 'ce-divider-ac-unloaded',
        circuitViewBox: CE_VIEWBOX,
        circuitLabel: 'Common Emitter — no RL connected',
        text: () => 'The AC input source is <b class="colour-signal">10 mV p-p</b>. Using <b class="colour-gain">A<sub>v(unloaded)</sub></b> ≈ 6.44, what will the output signal\'s amplitude be?',
        hint: () => 'Vout = VS × Av — plug in this circuit\'s own unloaded gain.',
        options: () => shuffle([
          { label: 'Vout = VS × Av = 10 mV × 6.44 ≈ 64.4 mV (p-p)', type: 'correct' },
          { label: 'Vout = VS ÷ Av = 10 mV ÷ 6.44 ≈ 1.55 mV (p-p)', type: 'wrong' },
          { label: 'Vout = VS + Av = 10 mV + 6.44 ≈ 16.44 mV (p-p)', type: 'wrong' },
          { label: 'Vout = VS × RC = 10 mV × 1.8 kΩ ≈ 18,000 mV (p-p)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-signal">V<sub>out</sub></b> = V<sub>S</sub> × A<sub>v</sub> ≈ 64.4 mV (p-p)',
        working: () => `
    <div class="working-formula-row"><b class="colour-signal">V<sub>out</sub></b> = V<sub>S</sub> × <b class="colour-gain">A<sub>v</sub></b> = 10 mV × 6.44</div>
    <div class="working-total"><b class="colour-signal">V<sub>out</sub></b> ≈ 64.4 mV (p-p) — voltage gain is just a multiplier on the input swing, nothing more. Dividing instead of multiplying, or adding the two numbers together, both ignore what "gain" actually means. Multiplying by RC (1.8 kΩ) instead of Av mixes up a RESISTANCE with a (unitless) GAIN figure — the same "Av(RC) isn't a real thing" mix-up from the previous question.</div>
    <div class="working-line">This is still the UNLOADED figure — this circuit has no RL connected (Q2). Connect the 5 kΩ RL from Q1 and this same 10 mV p-p input would produce a SMALLER output, since Av,loaded &lt; Av,unloaded.</div>`
      },
      {
        circuitId: 'ce-divider-ac-loaded',
        circuitViewBox: CE_VIEWBOX,
        circuitLabel: 'Common Emitter — RL connected',
        text: () => 'We have added a component with a resistance to the output — <b class="colour-resistor">R<sub>L</sub></b> = 5 kΩ, wired in parallel with <b class="colour-resistor">R<sub>C</sub></b>. What is the correct term for the gain achieved by the circuit with this component added?',
        hint: () => 'Same idea as Q2, the opposite direction — this time RL genuinely IS connected.',
        options: () => shuffle([
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(unloaded)</tspan>', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(out)</tspan>', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(RC)</tspan>', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan>', type: 'correct' },
        ]),
        correctExplain: () => '<b class="colour-gain">A<sub>v(loaded)</sub></b> — RL is now connected, drawing current from the output',
        working: () => `
    <div class="working-line">This is the mirror image of Q2. Back then, nothing was connected at the output, so that stage's own gain was <b class="colour-gain">A<sub>v(unloaded)</sub></b>. Now <b class="colour-resistor">R<sub>L</sub></b> is genuinely connected — drawing current away from the output node — so the correct term flips to <b class="colour-gain">A<sub>v(loaded)</sub></b>.</div>
    <div class="working-total">"A<tspan baseline-shift="sub" font-size="11">v(RC)</tspan>" and "A<tspan baseline-shift="sub" font-size="11">v(out)</tspan>" are still not real terms — same reasoning as Q2. And "A<tspan baseline-shift="sub" font-size="11">v(unloaded)</tspan>" is now the wrong TIME rather than the wrong idea: that's the number from BEFORE RL was connected, not the number now.</div>`
      },
      {
        circuitId: 'ce-divider-ac-loaded',
        circuitViewBox: CE_VIEWBOX,
        circuitLabel: 'Common Emitter — RL connected',
        text: () => 'Your textbook gives a direct formula for this: <b class="colour-gain">A<sub>v(loaded)</sub></b> = (RC∥RL)/(RE+re′) — the same unloaded-gain formula, just with RC∥RL in place of RC on its own. What will the new gain be?',
        hint: () => 'Combine RC∥RL first, then divide by (RE+re′) — same shape as the unloaded Av formula from Q2-3, just with RC swapped out.',
        options: () => shuffle([
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan> = (RC∥RL)/(RE+re′) = 1,324 Ω/279.57 Ω ≈ 4.73', type: 'correct' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan> = RC/(RE+re′) = 1,800 Ω/279.57 Ω ≈ 6.44 (forgot to combine RL in at all — that\'s just the unloaded answer again)', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan> = (RC+RL)/(RE+re′) = 6,800 Ω/279.57 Ω ≈ 24.32 (added RC and RL in series instead of combining them in parallel)', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan> = (RC∥RL)/RE = 1,324 Ω/270 Ω ≈ 4.90 (left re′ out of the denominator)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-gain">A<sub>v(loaded)</sub></b> = (RC∥RL)/(RE+re′) ≈ 4.73',
        working: () => `
    <div class="working-formula-row">RC∥RL = ${frac('1,800 × 5,000', '1,800 + 5,000')} ≈ 1,324 Ω</div>
    <div class="working-formula-row"><b class="colour-gain">A<sub>v(loaded)</sub></b> = ${frac('RC∥RL', 'RE + r<sub>e</sub>′')} = ${frac('1,324 Ω', '279.57 Ω')}</div>
    <div class="working-total"><b class="colour-gain">A<sub>v(loaded)</sub></b> ≈ 4.73 — noticeably lower than the unloaded 6.44 (Q2-3). RL only ever shows up here as part of RC∥RL — it's exactly as if RL were just another resistor sitting in parallel with RC, because electrically, that's exactly what it is.</div>`
      },
      {
        circuitId: 'ce-divider-ac-loaded',
        circuitViewBox: CE_VIEWBOX,
        circuitLabel: 'Common Emitter — RL connected',
        text: () => 'Because we already worked out <b class="colour-gain">A<sub>v(unloaded)</sub></b> back in Q2-3, we could have used an ALTERNATIVE formula to reach the same loaded-gain answer, without recomputing RC∥RL from scratch. What does that alternative method give?',
        hint: () => 'Av,loaded = Av,unloaded × RL/(RL+Zout) — a voltage-divider fraction applied directly to the unloaded gain you already have.',
        options: () => shuffle([
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan> = A<tspan baseline-shift="sub" font-size="11">v(unloaded)</tspan> × RL/(RL+Zout) = 6.44 × 5 kΩ/(5 kΩ+1.8 kΩ) ≈ 4.73', type: 'correct' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan> = A<tspan baseline-shift="sub" font-size="11">v(unloaded)</tspan> × RC/(RC+RL) = 6.44 × 1.8 kΩ/(1.8 kΩ+5 kΩ) ≈ 1.71 (swapped which resistor is on top)', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan> = A<tspan baseline-shift="sub" font-size="11">v(unloaded)</tspan> + RL/Zout = 6.44 + 5 kΩ/1.8 kΩ ≈ 9.22 (added instead of using the voltage-divider fraction)', type: 'wrong' },
          { label: 'A<tspan baseline-shift="sub" font-size="11">v(loaded)</tspan> = A<tspan baseline-shift="sub" font-size="11">v(unloaded)</tspan> × (RL+Zout)/RL = 6.44 × 6.8 kΩ/5 kΩ ≈ 8.76 (fraction upside down)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-gain">A<sub>v(loaded)</sub></b> ≈ 4.73 — matches Q5\'s answer exactly',
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">A<sub>v(loaded)</sub></b> = 6.44 × ${frac('5,000 Ω', '5,000 Ω + 1,800 Ω')} = 6.44 × 0.735</div>
    <div class="working-total"><b class="colour-gain">A<sub>v(loaded)</sub></b> ≈ 4.73 — exactly the same answer as Q5's own (RC∥RL)/(RE+re′) formula, just reached without recomputing RC∥RL from scratch. Both formulas describe the SAME physical fact: RL and Zout form a voltage divider at the output, and RL/(RL+Zout) is always less than 1, so the loaded gain can only ever be lower than the unloaded gain — never higher.</div>`
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // (Same as bjt_knowledge_basics.html's engine.)
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isAnswerCorrect(data, st) {
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ') : '—';
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function showCircuitRef(id, label, viewBox) {
      document.getElementById('circuitRefUse').setAttribute('href', '#' + id);
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
      document.getElementById('circuitRefSvg').setAttribute('viewBox', viewBox || DEFAULT_VIEWBOX);
      if (xyOn) buildXYRuler();
    }

    /* Swaps the on-diagram gain readout from "Av ≈ 6.44" to the correctly-
       subscripted "Av(unloaded) ≈ 6.44" once Q2 (idx1) has been answered —
       same "reveal once answered, stays revealed" convention as the rest
       of this project's progressive-reveal circuits. */
    function updateGainLabel() {
      const answered = Q[1] && Q[1].ans;
      document.getElementById('av-unloaded-before').setAttribute('display', answered ? 'none' : 'inline');
      document.getElementById('av-unloaded-after').setAttribute('display', answered ? 'inline' : 'none');
    }

    /* ─── DEV: xy ruler overlay, for lining up SVG coordinates by eye ────────
       Console:   setXY(1) / setXY(0)     URL: ?xy=1 */
    let xyOn = false;
    function buildXYRuler() {
      const g = document.getElementById('xyRuler');
      if (!g) return;
      const vb = document.getElementById('circuitRefSvg').viewBox.baseVal;
      const offX = vb.x, offY = vb.y, W = vb.width, H = vb.height;
      const hy = offY + H - 10, vx = offX + 10, col = '#ff00ff';
      let svg = `<line x1="${offX}" y1="${hy}" x2="${offX + W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let x = 0; x <= W; x += 10) {
        const gx = offX + x, major = (Math.round(gx) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${gx}" y1="${hy - len}" x2="${gx}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${gx}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${Math.round(gx)}</text>`;
      }
      svg += `<line x1="${vx}" y1="${offY}" x2="${vx}" y2="${offY + H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let y = 0; y <= H; y += 10) {
        const gy = offY + y, major = (Math.round(gy) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${vx}" y1="${gy}" x2="${vx + len}" y2="${gy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${vx + 13}" y="${gy + 3}" fill="${col}" font-size="8" text-anchor="start">${Math.round(gy)}</text>`;
      }
      g.innerHTML = svg;
    }
    function setXY(on) {
      xyOn = on;
      const g = document.getElementById('xyRuler');
      if (!g) return;
      if (on) buildXYRuler();
      g.setAttribute('display', on ? 'inline' : 'none');
    }
    window.setXY = setXY;

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      renderOptions();

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ')}`
          : 'Click the options above to select your answer.';
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (multi ? st.sel.length === 0 : st.sel === null);
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      showCircuitRef(data.circuitId, data.circuitLabel, data.circuitViewBox);
      updateGainLabel();
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function scrollToQuestionTop() {
      document.getElementById('qPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); scrollToQuestionTop(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        Q[i].ans = false;
        Q[i].sel = isMulti(QUESTIONS[i]) ? [] : null;
      }
      renderQuestion();
      scrollToQuestionTop();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
      scrollToQuestionTop();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      showCircuitRef('step3-circuit-loaded', 'AC-Equivalent Circuit — Output Loaded with RL', DEFAULT_VIEWBOX);
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    // ── zoom modal ──
    function openModal() {
      const src = document.getElementById('circuitRefSvg'), dst = document.getElementById('modalSvg');
      dst.innerHTML = src.innerHTML; dst.setAttribute('viewBox', src.getAttribute('viewBox'));
      document.getElementById('modalTitle').textContent = document.getElementById('circuitRefLabel').textContent;
      document.getElementById('diagramModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('diagramModal').classList.remove('open');
      document.getElementById('modalSvg').innerHTML = '';
      document.body.style.overflow = '';
    }
    function handleModalClick(e) { if (e.target.closest('.modal-close')) return; closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) {
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      }
      goToQuestion(n);
      if (answered) {
        Q[cur].sel = Array.isArray(Q[cur].cor) ? [...Q[cur].cor] : Q[cur].cor;
        checkAnswer();
      }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
      if (p.has('xy')) setXY(+p.get('xy') === 1);
    }
  </script>
