<!--
  Knowledge quiz for the "BJT amplifier AC parameters" lesson (4 objectives,
  photographed lesson-note page): (1) calculate Av/Zin/Zout for common
  emitter, (2) calculate Av/Zin/Zout for common collector, (3) measure
  unloaded vs loaded voltage gain, (4) measure frequency response.

  Objectives 3 and 4 say "measure" (bench-practical wording), but unlike
  digital_knowledge_boolean_algebra.html's deferred DMM/logic-probe
  objective (which genuinely needs physical hardware in hand), both of
  these have a rich calculable/interpretable knowledge core: "why does
  loaded gain drop, and by how much" and "what causes the low/high-
  frequency rolloff, and how do you read bandwidth off a response curve"
  are exactly the concepts a student needs BEFORE the bench measurement
  makes sense — so both are covered here as knowledge questions rather
  than deferred.

  ONE worked NPN stage (BC549, β=200 assumed throughout — same transistor
  family as the rest of UEEEC0066) is used for both configurations: Q1-6
  wire it as common-emitter (unbypassed RE — the "swamped" amplifier
  already familiar from bjt_knowledge_amp_config_peaks.html), then Q7-9
  rewire the SAME transistor as common-collector (collector tied straight
  to VCC, output taken from the emitter) — same component-value philosophy
  as that file's own NPN/PNP mirror pair. Q6 bridges the two: the Zin
  formula (R1∥R2∥β×(RE+re′)) turns out to be structurally IDENTICAL between
  CE and CC — it's Zout and Av that differ, driven by topology (which
  terminal the output is taken from), not by which resistor values are
  plugged in. That's the same "topology, not resistor values, decides the
  formula" lesson peaks.html's Q9 (common base) already established, now
  extended to Zin/Zout as well as Av.

  re′ (the transistor's own internal AC emitter resistance, ≈26mV/IE) is
  calculated as its OWN first question for each configuration (Q1 for CE,
  Q7 for CC) rather than folded into the Zb/Zin working or dropped as
  negligible — matching how the lesson itself was taught: re′ derived
  first, then carried into Zb = β×(RE+re′) and Av = RC/(RE+re′) [CE] or
  RE/(RE+re′) [CC] explicitly, not approximated away. Each configuration's
  IE is a DC-analysis result taken as GIVEN (shown on the diagram via the
  same ammeter-badge convention bjt_npn_voltage_divider_ac.html uses for
  its own DC current readouts) — this file only covers AC parameters, not
  the DC bias derivation itself. Once each stage's own re′ question is
  answered, its value stays visible directly on the diagram too — a small
  `r_e′ ≈ ...` readout just below that stage's own `β = 200` label
  (`reRevealCe`/`reRevealCc`, toggled by `updateReReveal()` on every
  render based on `Q[0].ans`/`Q[6].ans` — persists regardless of which
  question is currently on screen, same "once revealed, stays revealed"
  convention as the rest of this project's progressive-reveal circuits).

  Q2 asks for Zb as ONE combined question (the formula AND its numeric
  result together, e.g. "Zb = β×(RE+re′) = 200×(270 Ω+9.57 Ω) ≈ 55.9 kΩ"
  as a single option) rather than a separate formula-choice question
  followed by a separate calculate-the-number question — deliberately
  matching Q1/Q7's own format (each option is a full working, not just a
  bare final value), after the user asked for Zb to "look like Q1."

  Circuit diagrams (ce-divider-ac / cc-divider-ac) use the same large-scale
  WIRES/NODES layout convention as bjt_npn_voltage_divider_ac.html —
  explicit LEFT/CENTER/RIGHT VERTICAL + TOP/BOTTOM/CENTRE/OUTPUT HORIZONTAL
  wire sections, every individual wire segment trailing-commented with what
  it connects, resistors drawn as a box with a separate name/value label
  pair, VCC/GND as their own labelled groups — rather than this file's
  original compact thevenin.html-style scaffold. Trimmed to what a
  knowledge quiz needs (no mode-toggle, oscilloscope, or load terminal —
  RL only ever appears in Q10-11's question text, never the diagram). NODE
  B and NODE C/E mark the exact points that file's own DC-voltage meters
  would probe — reused here for Zin/Zout (AC resistance) instead, since
  that's what this quiz actually asks about.

  Formulas used (standard "beta model", ignoring ro — consistent with this
  project's established CE/CC gain formulas from
  bjt_knowledge_amp_config_peaks.html, extended to Zin/Zout, WITH re′ kept
  in rather than approximated away — see re′ note above):
    CE (unbypassed RE): Zb = β×(RE+re′), Zin = R1∥R2∥Zb, Zout ≈ RC,
                         Av ≈ -RC/(RE+re′)
    CC (emitter follower): Zb = β×(RE+re′), Zin = R1∥R2∥Zb,
                            Zout ≈ RE∥re′ (≈re′, since RE≫re′), Av ≈ RE/(RE+re′)

  Q10-11 (loaded vs unloaded gain) reuse the CE stage's own numbers and
  introduce the voltage-divider relationship Av,loaded = Av,unloaded ×
  RL/(RL+Zout) — deliberately tying straight back to Zout from Q4, so the
  "why calculate Zout at all" payoff lands immediately rather than Zout
  being calculated once and never used again.

  Q12-13 (frequency response) use a NEW non-circuit reference diagram,
  `freq-response-graph` — a simplified Bode-magnitude sketch with fL/fH
  marked at the -3dB (0.707×Amid) points and concrete example frequencies
  printed on it (100 Hz / 100 kHz), read directly for a bandwidth
  calculation. Since this diagram has a different (wider) aspect ratio
  than the tall circuit diagrams, `circuitViewBox` was added as a new
  per-question field — showCircuitRef() now also sets circuitRefSvg's
  viewBox attribute, defaulting to the CE/CC circuits' box when a
  question doesn't specify one. This is a local, one-file addition to the
  engine (each bjt_knowledge_*.html file keeps its own copy of the v2
  engine — there's no shared/imported JS to update project-wide).

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine, last file
  in the ac_parameters family to move over. This file's own showCircuitRef
  was the most bespoke of the family — BOTH a loadTerminal toggle
  (outputTerminalPlain/outputTerminalLoad, unused by any other file in
  this folder) AND dual-ammeter dispatch gated by circuit id (ieInd only
  for cc-divider-ac, ieIndCe only for ce-divider-ac) — so both now live in
  CIRCUIT_REF_EXTRA rather than the shared showCircuitRef itself.
  DEFAULT_CIRCUIT_VIEWBOX=DEFAULT_VIEWBOX covers the freq-response-graph's
  own different-aspect-ratio circuitViewBox override already (no new
  engine feature needed). SUMMARY_CIRCUIT_REF points at ce-divider-ac.
  RENDER_EXTRA re-runs updateReReveal/updateZReveal (both CE- and
  CC-suffixed badge ids together) every render.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>BJT Knowledge Quiz — Amplifier AC Parameters</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    .progress-wrap { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; }
    @media(min-width:900px) {
      /* Circuit viewBox is ~690x570 (the large-scale WIRES-format rebuild —
         same rough size as bjt_npn_voltage_divider_ac.html's own 700x560),
         much wider than the compact 140x200 box quiz-common.css's default
         minmax(340px, 52%) column was originally sized around — a fixed
         760px cap (not a %) so it renders at roughly the same on-screen
         HEIGHT as that file's circuit rather than staying narrow and
         looking squashed. Same fix, same reasoning, same file it's matching. */
      .quiz-wrap { display: grid;
        grid-template-columns: minmax(340px, 760px) 1fr;
        gap: 1.2rem;
        align-items: start; }
    }
  </style>
</head>

<body>
  <!-- Hidden defs: CE and CC versions of the same NPN voltage-divider stage,
       built in bjt_npn_voltage_divider_ac.html's own large-scale WIRES/
       NODES format (see the file header comment above), plus a standalone
       frequency-response Bode sketch for Q12-13. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- ══ NPN BJT SHAPE ══ -->
      <g id="bjt-npn-shape">
        <circle cx="7" cy="0" r="24" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
        <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
        <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
      </g>

      <!-- ══ AC SIGNAL SOURCE SHAPE — circle with one sine cycle ══ -->
      <g id="ac-source-shape">
        <circle cx="0" cy="0" r="24" fill="none" style="stroke: var(--colour-signal)" stroke-width="2" filter="url(#glow)" />
        <path d="M -16,0 C -11,-14 -5,-14 0,0 C 5,14 11,14 16,0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- ══ AMMETER BADGE — same shape as bjt_npn_voltage_divider_ac.html's own ammeter-shape ══ -->
      <g id="ammeter-shape">
        <circle cx="0" cy="0" r="30" style="fill: var(--colour-ammeter-fill); stroke: var(--colour-current)" stroke-width="1.5" filter="url(#glow)" />
      </g>

      <!-- ══ Z-VALUE METER BADGE — same solid-over-dashed dial-line motif as
           bjt_npn_voltage_divider_ac.html's own voltmeter "meter-shape",
           recoloured to --colour-gain (the same colour the Zb/Zin/Zout
           arrow-labels already use) instead of that file's --colour-red,
           since these badges are revealing a Z value, not a DC voltage. ══ -->
      <g id="z-meter-shape">
        <circle cx="0" cy="0" r="25" style="fill: var(--colour-meter-fill); stroke: var(--colour-gain)" stroke-width="1.5" filter="url(#glow)" />
      </g>

      <!-- ══ COUPLING CAPACITOR SHAPE — two plates, reused for Cin and Cout ══ -->
      <g id="cap-shape">
        <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
        <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
        <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      </g>

      <!-- ══════════════════════════════════════════════════════════════════
           Common Emitter — voltage-divider bias, RE UNBYPASSED (swamped).
           Large-scale WIRES/NODES/component-group layout — same convention
           as bjt_npn_voltage_divider_ac.html (explicit LEFT/CENTER/RIGHT
           VERTICAL + TOP/BOTTOM/CENTRE/OUTPUT HORIZONTAL wire sections,
           each wire individually commented; resistors as boxes with a
           separate name/value label pair; VCC/GND as their own labelled
           groups), trimmed to what a knowledge quiz actually needs — no
           mode-toggle, no oscilloscope, no load terminal (this file's
           worked values never change, and Q10-11 introduce RL only in the
           question text, not the diagram). NODE B/C mark the exact same
           electrical points that file's meters would probe — here labelled
           Zin/Zout (input/output RESISTANCE) rather than a DC voltage,
           since that's what this quiz actually asks about. ══════════════ -->
      <g id="ce-divider-ac">

        <!-- ════════════════════ WIRES ════════════════════ -->

        <!-- ── LEFT VERTICAL (AC source ground return, x=30) ── -->
        <line x1="30" y1="279" x2="30" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Source return down to GND level -->

        <!-- ── CENTER VERTICAL (R1/R2 line, base-bias rail, x=200) ── -->
        <line x1="200" y1="50" x2="200" y2="80" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to R1 -->
        <line x1="200" y1="160" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R1 down to Base node -->
        <line x1="200" y1="255" x2="200" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node down to R2 -->
        <line x1="200" y1="430" x2="200" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R2 down to GND rail -->

        <!-- ── RIGHT VERTICAL (collector/emitter rail, x=440) ── -->
        <line x1="440" y1="50" x2="440" y2="80" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to RC -->
        <line x1="440" y1="160" x2="440" y2="221" style="stroke: var(--colour-series)" stroke-width="2" /><!-- RC down to Collector pin -->
        <line x1="440" y1="289" x2="440" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Emitter pin down to RE -->
        <line x1="440" y1="430" x2="440" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- RE down to GND rail -->

        <!-- ── TOP HORIZONTAL ── -->
        <line x1="180" y1="50" x2="460" y2="50" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail (R1 column to RC column) -->
        <circle cx="200" cy="50" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="50" r="5" style="fill: var(--colour-series)" />

        <!-- ── BOTTOM HORIZONTAL ── -->
        <line x1="10" y1="520" x2="620" y2="520" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="200" cy="520" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="520" r="5" style="fill: var(--colour-series)" />

        <!-- ── CENTRE HORIZONTAL ── -->
        <line x1="54" y1="255" x2="409" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- BSource to transistor base pin -->
        <line x1="104" y1="255" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Cin to Base node -->

        <!-- ── OUTPUT HORIZONTAL ── -->
        <line x1="440" y1="210" x2="600" y2="210" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Collector pin, through Cout, to output -->

        <!-- ════════════════════ NODES ════════════════════ -->

        <!-- ── NODE B — Zin is looked up from here, rightward into the base ── -->
        <circle cx="200" cy="255" r="5" style="fill: var(--colour-series)" />
        <text x="370" y="240" style="fill: var(--colour-gain)" font-size="16" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">b &#10145;</tspan></text>
        <text x="170" y="240" style="fill: var(--colour-gain)" font-size="16" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">in &#10145;</tspan></text>

        <!-- ── Z-VALUE BADGES — hidden until their own question is answered,
             toggled via updateZReveal(). Zb sits shifted left of its own
             arrow-label to stay clear of the transistor. ── -->
        <g id="zbBadgeCe" display="none" transform="translate(340,200)">
          <use href="#z-meter-shape" />
          <text x="0" y="2" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">55.9</text>
          <text x="0" y="19" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>
        <g id="zinBadgeCe" display="none" transform="translate(140,200)">
          <use href="#z-meter-shape" />
          <text x="0" y="2" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">10.77</text>
          <text x="0" y="19" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>

        <!-- ── NODE C — Zout is looked back into from here, source zeroed ── -->
        <circle cx="440" cy="210" r="5" style="fill: var(--colour-series)" />
        <text x="480" y="190" style="fill: var(--colour-gain)" font-size="16" text-anchor="middle" font-weight="bold"><tspan baseline-shift="-70%">&#11013;</tspan> Z<tspan baseline-shift="sub" font-size="13">out</tspan></text>
        <g id="zoutBadgeCe" display="none" transform="translate(510,160)">
          <use href="#z-meter-shape" />
          <text x="0" y="2" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">1.8</text>
          <text x="0" y="19" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>

        <!-- ════════════════════ AC INPUT COMPONENTS ════════════════════ -->

        <circle cx="30" cy="520" r="5" style="fill: var(--colour-signal)" /><!-- Connection to Common -->
        <g transform="translate(30,255)">
          <use href="#ac-source-shape" />
          <text x="0" y="-35" style="fill: var(--colour-signal)" text-anchor="middle" font-size="16" font-weight="bold">input</text>
        </g>

        <g transform="translate(80,255)">
          <use href="#cap-shape" />
          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16" font-weight="bold">C<tspan baseline-shift="sub" font-size="13">IN</tspan></text>
        </g>

        <!-- ════════════════════ AC OUTPUT COMPONENTS ════════════════════ -->

        <g transform="translate(570,210)">
          <use href="#cap-shape" />
          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16" font-weight="bold">C<tspan baseline-shift="sub" font-size="13">OUT</tspan></text>
        </g>
        <g id="outputTerminalPlain">
          <circle cx="600" cy="210" r="5" style="fill: var(--colour-signal)" />
          <text x="580" y="365" style="fill: var(--colour-signal)" text-anchor="start" font-size="16" font-weight="bold">output</text>
          <circle cx="600" cy="520" r="5" style="fill: var(--colour-signal)" />

          <!-- ── OUTPUT VERTICAL WIRES WITH ARROWS ── -->
          <line x1="600" y1="220" x2="600" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Horizontal to "output" -->
          <polygon points="594,230 606,230 600,220" style="fill: var(--colour-series)" /><!-- Arrow pointing up -->
          <line x1="600" y1="375" x2="600" y2="510" style="stroke: var(--colour-series)" stroke-width="2" /><!-- "output" to GND -->
          <polygon points="594,500 606,500 600,510" style="fill: var(--colour-series)" /><!-- Arrow pointing down -->

        </g>
        <g id="outputTerminalLoad" display="none" transform="translate(617,210)">
          <circle cx="0" cy="0" r="16" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5" />
          <text x="0" y="5" style="fill: var(--colour-signal)" text-anchor="middle" font-size="13" font-weight="bold">L</text>
          <text x="0" y="-25" style="fill: var(--colour-signal)" text-anchor="middle" font-size="15">R<tspan baseline-shift="sub" font-size="10">L</tspan></text>
          <text x="0" y="30" style="fill: var(--colour-signal)" text-anchor="middle" font-size="11">(load)</text>
        </g>

        <!-- ════════════════════ VCC ════════════════════ -->

        <g transform="translate(280,-1)">
          <line x1="40" y1="50" x2="40" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
          <line x1="0" y1="30" x2="80" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
          <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
          <!-- hand-drawn "+" -->
          <line x1="50" y1="10" x2="50" y2="20" style="stroke: var(--colour-text)" stroke-width="1.0" />
          <line x1="46" y1="15" x2="54" y2="15" style="stroke: var(--colour-text)" stroke-width="1.0" />
          <text x="60" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14" font-weight="bold">12 V</text>
        </g>

        <!-- ════════════════════ COMMON LABEL ════════════════════ -->

        <text x="120" y="540" fill="var(--colour-gnd)" text-anchor="middle" font-size="14" font-weight="bold">Common</text>

        <!-- ════════════════════ Q1 — NPN ════════════════════ -->

        <g transform="translate(426,256)">
          <use href="#bjt-npn-shape" />
          <text x="-15" y="-25" fill="var(--colour-bjt-labels)" text-anchor="middle" font-size="14" font-weight="bold">Q1</text>
          <text x="0" y="40" fill="var(--colour-bjt-labels)" text-anchor="end" font-size="12">BC549</text>
          <text x="40" y="5" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="14" font-weight="bold">β = 200</text>
          <!-- ── re' reveal — hidden until Q1 is answered, toggled via updateReReveal() ── -->
          <text id="reRevealCe" display="none" x="25" y="40" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="13" font-weight="bold">r<tspan baseline-shift="sub" font-size="10">e</tspan>′ ≈ 9.57 Ω</text>
        </g>

        <!-- ════════════════════ RESISTORS ════════════════════ -->

        <!-- ── R1 ── -->
        <g transform="translate(185,80)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">R1</text>
          <text x="60" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">120 kΩ</text>
        </g>

        <!-- ── R2 ── -->
        <g transform="translate(185,350)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">R2</text>
          <text x="60" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">15 kΩ</text>
        </g>

        <!-- ── RC ── -->
        <g transform="translate(425,80)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">RC</text>
          <text x="60" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">1.8 kΩ</text>
        </g>

        <!-- ── RE ── -->
        <g transform="translate(425,350)">

        text: () => 'Before any AC parameter can be worked out, the transistor\'s own internal <b style="color:var(--colour-ui-primary)">AC emitter resistance</b> <b class="colour-bjt">r<sub>e</sub>′</b> is needed first. DC analysis of this <b class="colour-bjt">common-emitter</b> stage already gives <b class="colour-current">I<sub>E</sub></b> ≈ 2.716 mA. What is <b class="colour-bjt">r<sub>e</sub>′</b>?',
        hint: () => 're′ = VT/IE, using the standard room-temperature approximation VT ≈ 26 mV.',
        options: () => shuffle([
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 mV', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 mV', '2.716 mA')} ≈ 9.57 Ω`, type: 'correct' },

    <div class="working-total"><b class="colour-bjt">r<sub>e</sub>′</b> ≈ 9.57 Ω — small next to RE (270 Ω) here, but not thrown away: keep this value, every AC parameter from here on uses it.</div>`

          const letters = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `Options <b>${letters}</b> — coupling caps limit the LOW end, internal/stray capacitance limits the HIGH end`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? LETTERS[i] : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? LETTERS[i] : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">The two real causes — options ${correctNums}:</div>
    <div class="working-line">LOW frequencies: coupling capacitors (Cin, Cout) and any emitter bypass capacitor are only "invisible" (near-zero reactance) once f is high enough. As f drops toward 0, Xc=1/(2πfC) grows, and they start dropping real signal voltage across themselves instead of passing it through.</div>
    <div class="working-line">HIGH frequencies: the transistor's own internal junction capacitances (Cbe, Cbc — Cbc's effect is magnified further by the Miller effect) plus any stray wiring capacitance start to look like a short to ground as f rises and their reactance shrinks, diverting signal away instead of amplifying it.</div>
    <div class="working-step" style="margin-top:.6rem">The two swapped (wrong) claims — options ${wrongNums}:</div>
    <div class="working-line">These simply swap which capacitor type is responsible for which end — a common mix-up. Coupling caps are large-value, physical, deliberately-placed components that matter when their reactance is HIGH (low f). Internal junction capacitances are tiny, unavoidable, built into the transistor, and matter when their reactance is LOW (high f) — opposite behaviour, opposite end of the spectrum.</div>`;
        }
      },
      {
        circuitId: 'freq-response-graph',
        circuitViewBox: '0 0 350 190',
        circuitLabel: 'Frequency Response (Bode Magnitude Sketch)',
        text: () => 'The diagram marks <b class="colour-gain">f<sub>L</sub></b> and <b class="colour-gain">f<sub>H</sub></b> — the two frequencies where gain has dropped to 0.707× (−3 dB below) its flat midband value. What is this amplifier\'s <b style="color:var(--colour-ui-primary)">bandwidth</b> (BW = fH − fL)?',
        hint: () => 'Read fL and fH directly off the diagram, then subtract.',
        options: () => shuffle([
          { label: 'BW ≈ 99.9 kHz', type: 'correct' },
          { label: 'BW ≈ 100 kHz (forgot to subtract <b class="colour-gain">fL</b>)', type: 'wrong' },
          { label: 'BW ≈ 200 kHz (added <b class="colour-gain">fL</b> and <b class="colour-gain">fH</b> instead of subtracting)', type: 'wrong' },
          { label: 'BW = 100 Hz (used <b class="colour-gain">fL</b> only)', type: 'wrong' },
        ]),
        correctExplain: () => 'BW = fH − fL ≈ 99.9 kHz',
        working: () => `
    <div class="working-formula-row">BW = <b class="colour-gain">f<sub>H</sub></b> − <b class="colour-gain">f<sub>L</sub></b> = 100,000 Hz − 100 Hz</div>
    <div class="working-total">BW = 99,900 Hz ≈ 99.9 kHz — the range of frequencies where the amplifier delivers (at least) 0.707× its best midband gain. Below fL or above fH, gain keeps falling further the further you go.</div>`
      },
    ];
    /* re' reveal on the diagram itself, once each stage's own re'
       question has been answered — Q1 (index 0) for CE, Q7 (index 6) for
       CC. Persists regardless of which question is currently on screen
       (unlike the ammeter badges, which only show for their own
       question) — this is "now-known information", same convention as
       the rest of this project's progressive-reveal circuits. Called on
       every renderQuestion(), not just when Q1/Q7 themselves are current. */
    function updateReReveal() {
      document.getElementById('reRevealCe').setAttribute('display', Q[0].ans ? 'inline' : 'none');
      document.getElementById('reRevealCc').setAttribute('display', Q[6].ans ? 'inline' : 'none');
    }

    /* Zb/Zin/Zout value badges — same "reveal once answered, stays
       revealed" convention as updateReReveal() above. CE: Zb=Q2(idx1),
       Zin=Q3(idx2), Zout=Q4(idx3). CC: Zb/Zin both reveal together off
       Q8(idx7) — CC never asks Zb as its own separate question, it's only
       ever computed as part of Q8's own Zin working, so there's no
       earlier "Zb answered" moment to hook for CC specifically. Zout=Q9
       (idx8). */
    function updateZReveal() {
      document.getElementById('zbBadgeCe').setAttribute('display', Q[1].ans ? 'inline' : 'none');
      document.getElementById('zinBadgeCe').setAttribute('display', Q[2].ans ? 'inline' : 'none');
      document.getElementById('zoutBadgeCe').setAttribute('display', Q[3].ans ? 'inline' : 'none');
      document.getElementById('zbBadgeCc').setAttribute('display', Q[7].ans ? 'inline' : 'none');
      document.getElementById('zinBadgeCc').setAttribute('display', Q[7].ans ? 'inline' : 'none');
      document.getElementById('zoutBadgeCc').setAttribute('display', Q[8].ans ? 'inline' : 'none');
    }

    RENDER_EXTRA = () => { updateReReveal(); updateZReveal(); };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
