<!--
  Knowledge quiz cloned by the user from bjt_knowledge_ac_params_ce_bypassed.html
  (which remains unchanged), then hand-modified to split the single RE into
  TWO series resistors, RE1 and RE2, with the bypass capacitor CE re-wired
  to sit in parallel with RE2 ONLY (tapping the node between RE1 and RE2,
  not the emitter pin directly). User: *"I've created a new file... which
  is a copy of bjt_knowledge_ac_params_ce_bypassed but with the additional
  resistor added and the circuit arranged to fit everything in. RE is now
  2 - RE1 and RE2. Can you make the necessary changes to the circuit
  questions and framework to allow for the additional resistor? Maybe
  halve the original RE and make both RE1 and RE2 135 ohms. Can you also
  recreate the same questions for this new circuit?"* This is the classic
  PARTIALLY BYPASSED (partially swamped) emitter configuration — RE1 =
  RE2 = 135 Ω (so RE1+RE2 = 270 Ω, identical total DC emitter resistance
  to every other file in this family, keeping IE≈2.716mA and re′≈9.57Ω
  unchanged throughout).

  THE KEY IDEA: a bypass capacitor blocks DC entirely, so DC bias only
  ever cares about the TOTAL series resistance in the emitter leg
  (RE1+RE2=270Ω) — same IE, same re′ as the fully-unbypassed and
  fully-bypassed files, regardless of where CE taps in. AC behaviour is
  what changes: CE shorts RE2 to AC ground, but RE1 sits ABOVE that tap
  point (between the emitter pin and the RE1/RE2 junction), so RE1 is
  NOT shorted — it stays fully in the AC emitter path. Only RE2 drops
  out. This makes the circuit a genuine THIRD point on the swamped-vs-
  bypassed spectrum, sitting between the other two files' extremes:
    Zb   = β×(RE1+re′)     = 200×(135+9.57)   ≈ 28.9 kΩ
                              (unbypassed: β×(RE1+RE2+re′)≈55.9kΩ;
                               fully bypassed: β×re′≈1.91kΩ)
    Zin  = R1∥R2∥Zb         ≈ 9.13 kΩ (unbypassed 10.77kΩ; fully
                              bypassed 1.67kΩ — genuinely intermediate)
    Av   ≈ RC/(RE1+re′)     = 1800/144.57      ≈ 12.45
                              (unbypassed ≈6.44; fully bypassed ≈188 —
                               roughly double the unbypassed gain, nowhere
                               near the fully-bypassed extreme)
  re′ (Q1) and Zout (Q4) are UNCHANGED from every sibling file in this
  family — re′ only depends on IE (fixed by RE1+RE2 total, untouched by
  where CE taps in); Zout only depends on the collector side, which no
  emitter-leg change can reach. Both questions say so explicitly.

  Q2 and Q5's distractors deliberately include BOTH neighbouring files'
  own correct answers as wrong options here (β×(RE1+RE2+re′)≈55.9kΩ and
  RC/(RE1+RE2+re′)≈6.44 — "forgot RE2 is bypassed, used the full
  unbypassed formula"; β×re′≈1.91kΩ and RC/re′≈188 — "bypassed too much,
  RE1 isn't shorted") — a genuinely on-topic trap testing whether the
  student has actually tracked which resistor sits where relative to the
  capacitor's tap point, not a filler wrong answer.

  Circuit diagram: the user's own hand-built large-scale WIRES/NODES
  layout (rearranged/compacted from ce_bypassed.html's own circuit to fit
  the extra resistor), group id renamed `ce-divider-ac-part-bypassed` for
  this file's own clarity (self-contained defs, no shared JS/ID-clash risk
  project-wide). RE1 sits directly below the emitter pin; the bypass
  branch taps off the RE1/RE2 junction node and runs right, down through
  the rotated `cap-shape` symbol (as `ce_bypassed.html` uses), to GND;
  RE2 sits on the same original vertical wire, below the tap point.

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.
-->

          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

    <!-- Zoom modal — copies circuitRefSvg's current innerHTML/viewBox in on open. -->
    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalTitle">Reference Circuit</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="-10 -10 690 570" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

  </div>

  <script>
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }
    const DEFAULT_VIEWBOX = '-10 -10 690 570';

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — Q1-5, cloned from bjt_knowledge_ac_params_ce_bypassed.html's
    // own Q1-5. Q1 (re′) and Q4 (Zout) are formula-identical to every
    // sibling file — a bypass capacitor doesn't touch DC bias or the
    // collector side. Q2 (Zb), Q3 (Zin) and Q5 (Av) use RE1 ONLY (RE2 is
    // shorted to AC ground by CE) — see the file's own header comment for
    // the full formula summary. See bjt_knowledge_basics.html's header
    // comment for the full field reference.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'ce-divider-ac-part-bypassed',
        circuitLabel: 'Common Emitter (RE1 unbypassed + RE2 bypassed)',
        circuitAmmeter: true,
        text: () => 'What is <b class="colour-bjt">r<sub>e</sub>′</b> for this <b style="color:var(--colour-ui-primary)">common-emitter</b> stage when the emitter is <b style="color:var(--colour-ui-primary)">partially bypassed</b>?',
        hint: () => 're′ = VT/IE, using the standard room-temperature approximation VT ≈ 26 mV.',
        options: () => shuffle([
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 mV', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 mV', '2.716 mA')} ≈ 9.57 Ω`, type: 'correct' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 V', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 V', '2.716 mA')} ≈ 9,573 Ω`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ 26 Ω`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('<b class="colour-current">I<sub>E</sub></b>', '26 mV')} ≈ ${frac('2.716 mA', '26 mV')} ≈ 0.104 Ω`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-bjt">r<sub>e</sub>′</b> ≈ 9.57 Ω',
        working: () => `
    <div class="working-formula-row"><b class="colour-bjt">r<sub>e</sub>′</b> = ${frac('V<sub>T</sub>', 'I<sub>E</sub>')} ≈ ${frac('26 mV', '2.716 mA')}</div>
    <div class="working-total"><b class="colour-bjt">r<sub>e</sub>′</b> ≈ 9.57 Ω — identical to both the fully-unbypassed and fully-bypassed circuits' own re′, since RE1+RE2 (270 Ω) is the same total DC emitter resistance every version of this circuit uses, and a bypass capacitor can never change a DC quantity regardless of where it taps in. Keep this value, every AC parameter from here on uses it.</div>`
      },
      {
        circuitId: 'ce-divider-ac-part-bypassed',
        circuitLabel: 'Common Emitter (RE1 unbypassed + RE2 bypassed)',
        text: () => 'The bypass capacitor <b class="colour-cap">C<sub>E</sub></b> taps the node BETWEEN <b class="colour-resistor">R<sub>E1</sub></b> and <b class="colour-resistor">R<sub>E2</sub></b>, shorting only <b class="colour-resistor">R<sub>E2</sub></b> to AC ground — <b class="colour-resistor">R<sub>E1</sub></b> sits above that node, between the emitter pin and the tap, so it stays fully in the AC path. What is the <b style="color:var(--colour-ui-primary)">AC</b> resistance looking directly into the base, <b class="colour-resistor">Z<sub>b</sub></b>?',
        hint: () => 'Only RE2 is shorted out — RE1 is NOT bypassed, it\'s still in series with re′ in the AC emitter leg. Zb = β × (RE1 + re′).',
        options: () => shuffle([
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">RE1</b> + <b class="colour-bjt">re′</b>) = 200 × (135 Ω + 9.57 Ω) ≈ 28.9 kΩ`, type: 'correct' },
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">RE1</b> + <b class="colour-resistor">RE2</b> + <b class="colour-bjt">re′</b>) = 200 × (135 Ω + 135 Ω + 9.57 Ω) ≈ 55.9 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">β</b> × <b class="colour-bjt">re′</b> = 200 × 9.57 Ω ≈ 1.91 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">Zb</b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">RE1</b> = 200 × 135 Ω ≈ 27 kΩ`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">R<sub>E1</sub></b> + r<sub>e</sub>′) ≈ 28.9 kΩ',
        working: () => `
    <div class="working-line"><b class="colour-cap">C<sub>E</sub></b> shorts <b class="colour-resistor">R<sub>E2</sub></b> to AC ground, so ONLY <b class="colour-resistor">R<sub>E2</sub></b> drops out of the AC emitter leg. <b class="colour-resistor">R<sub>E1</sub></b> sits between the emitter pin and the bypassed node, so it's still fully there, still reflected into the base β times bigger — same as re′.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">R<sub>E1</sub></b> + r<sub>e</sub>′) = 200 × (135 Ω + 9.57 Ω)</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>b</sub></b> ≈ 28,914 Ω ≈ 28.9 kΩ — sitting neatly between the fully-unbypassed circuit's own Zb (≈55.9 kΩ, using RE1+RE2) and the fully-bypassed circuit's own Zb (≈1.91 kΩ, using neither). Keep this value, it's used again in the next question.</div>`
      },
      {
        circuitId: 'ce-divider-ac-part-bypassed',
        circuitLabel: 'Common Emitter (RE1 unbypassed + RE2 bypassed)',
        text: () => 'What is the <b style="color:var(--colour-ui-primary)">AC</b> input resistance <b class="colour-resistor">Z<sub>in</sub></b> seen by the signal source?',
        hint: () => 'Same shape as always: R1, R2 and Zb are all three connected between the base node and AC ground — three resistances in PARALLEL.',
        options: () => shuffle([
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b>∥<b class="colour-resistor">R2</b>∥<b class="colour-gain">Zb</b> = 120 kΩ∥15 kΩ∥28.9 kΩ ≈ 9.13 kΩ', type: 'correct' },
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b> + <b class="colour-resistor">R2</b> + <b class="colour-gain">Zb</b> = 120 kΩ + 15 kΩ + 28.9 kΩ ≈ 163.9 kΩ', type: 'wrong' },
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b>∥<b class="colour-resistor">R2</b> = 120 kΩ∥15 kΩ ≈ 13.3 kΩ', type: 'wrong' },
          { label: '<b class="colour-gain">Zin</b> ≈ <b class="colour-gain">Zb</b> = 28.9 kΩ', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>in</sub></b> = R1∥R2∥<b class="colour-resistor">Z<sub>b</sub></b> ≈ 9.13 kΩ',
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>in</sub></b> = R1 ∥ R2 ∥ <b class="colour-resistor">Z<sub>b</sub></b></div>
    <div class="working-line">${frac('1', '<b class="colour-resistor">Z<sub>in</sub></b>')} = ${frac('1', '120,000')} + ${frac('1', '15,000')} + ${frac('1', '28,914')} ≈ 0.0001096 Ω⁻¹</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>in</sub></b> ≈ 9,125 Ω ≈ 9.13 kΩ — genuinely intermediate between the fully-unbypassed circuit's own Zin (≈10.77 kΩ, where R1∥R2 dominated) and the fully-bypassed circuit's own Zin (≈1.67 kΩ, where Zb dominated): here Zb (28.9 kΩ) is bigger than R1∥R2 (13.3 kΩ) but not by nearly as much as in the fully-unbypassed case, so it pulls Zin down further than the unbypassed circuit without swinging all the way to dominate it outright.</div>`
      },
      {
        circuitId: 'ce-divider-ac-part-bypassed',
        circuitLabel: 'Common Emitter (RE1 unbypassed + RE2 bypassed)',
        text: () => 'What is the approximate <b style="color:var(--colour-ui-primary)">AC</b> output resistance <b class="colour-resistor">Z<sub>out</sub></b>, looking back into the collector terminal?',
        hint: () => 'Zero the source, then look back into the collector node — same question as always, and neither emitter-leg resistor nor the bypass cap has any path to this node at all.',
        options: () => shuffle([
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RC</b>', type: 'correct' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RE1</b> + <b class="colour-resistor">RE2</b>', type: 'wrong' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-gain">Zin</b>', type: 'wrong' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RC</b> ∥ (<b class="colour-resistor">RE1</b> + <b class="colour-resistor">RE2</b>)', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b>',
        working: () => `
    <div class="working-line">With the source zeroed, the only thing directly wired to the collector node (besides the transistor's internal, very-high ro — ignored here) is <b class="colour-resistor">R<sub>C</sub></b> itself, running up to the AC-grounded <b class="colour-supply">V<sub>CC</sub></b> rail.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b> = 1.8 kΩ</div>
    <div class="working-total">Unchanged from every sibling circuit in this family — <b class="colour-cap">C<sub>E</sub></b>, <b class="colour-resistor">R<sub>E1</sub></b> and <b class="colour-resistor">R<sub>E2</sub></b> all sit on the EMITTER side, with no path to the collector node this question is looking into. Zout only ever depends on what's actually wired to the collector.</div>`
      },
      {
        circuitId: 'ce-divider-ac-part-bypassed',
        circuitLabel: 'Common Emitter (RE1 unbypassed + RE2 bypassed)',
        text: () => 'What is the voltage gain <b class="colour-gain">|A<sub>v</sub>|</b> of this common-emitter stage, with <b class="colour-resistor">R<sub>E2</sub></b> bypassed but <b class="colour-resistor">R<sub>E1</sub></b> left in the AC path?',
        hint: () => 'Only RE1 stays in the AC emitter leg — |Av| ≈ RC / (RE1 + re′), not RC/(RE1+RE2+re′) and not RC/re′.',
        options: () => shuffle([
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RC</b>', '<b class="colour-resistor">RE1</b>+<b class="colour-bjt">re′</b>')} = ${frac('1800 Ω', '144.57 Ω')} ≈ 12.45`, type: 'correct' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RC</b>', '<b class="colour-resistor">RE1</b>+<b class="colour-resistor">RE2</b>+<b class="colour-bjt">re′</b>')} = ${frac('1800 Ω', '279.57 Ω')} ≈ 6.44`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RC</b>', '<b class="colour-bjt">re′</b>')} = ${frac('1800 Ω', '9.57 Ω')} ≈ 188`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RC</b>', '<b class="colour-resistor">RE1</b>')} = ${frac('1800 Ω', '135 Ω')} ≈ 13.33`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-gain">|A<sub>v</sub>|</b> ≈ R<sub>C</sub>/(R<sub>E1</sub>+r<sub>e</sub>′) ≈ 12.45',
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${frac('<b class="colour-resistor">R<sub>C</sub></b>', '<b class="colour-resistor">R<sub>E1</sub></b> + r<sub>e</sub>′')} = ${frac('1800 Ω', '144.57 Ω')}</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ 12.45 — roughly DOUBLE the fully-unbypassed circuit's own 6.44, but nowhere near the fully-bypassed circuit's own 188. Partially bypassing the emitter is a genuine middle ground: removing RE2 from the AC path buys back some gain without giving up all the stability RE1 still provides, since Av here still depends partly on a real resistor (RE1) and not on re′ alone.</div>`
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // (Same as bjt_knowledge_basics.html's engine.)
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isAnswerCorrect(data, st) {
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ') : '—';
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function showCircuitRef(id, label, viewBox, loadTerminal, ammeter) {
      document.getElementById('circuitRefUse').setAttribute('href', '#' + id);
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
      document.getElementById('circuitRefSvg').setAttribute('viewBox', viewBox || DEFAULT_VIEWBOX);
      document.getElementById('ieIndCe').setAttribute('display', ammeter ? 'inline' : 'none');
      if (xyOn) buildXYRuler();
    }

    /* re' reveal on the diagram itself, once Q1 has been answered. Persists
       regardless of which question is currently on screen (unlike the
       ammeter badge, which only shows for its own question) — this is
       "now-known information", same convention as the rest of this
       project's progressive-reveal circuits. */
    function updateReReveal() {
      document.getElementById('reRevealCe').setAttribute('display', Q[0].ans ? 'inline' : 'none');
    }

    /* Zb/Zin/Zout value badges — same "reveal once answered, stays
       revealed" convention as updateReReveal() above. Zb=Q2(idx1),
       Zin=Q3(idx2), Zout=Q4(idx3). */
    function updateZReveal() {
      document.getElementById('zbBadgeCe').setAttribute('display', Q[1].ans ? 'inline' : 'none');
      document.getElementById('zinBadgeCe').setAttribute('display', Q[2].ans ? 'inline' : 'none');
      document.getElementById('zoutBadgeCe').setAttribute('display', Q[3].ans ? 'inline' : 'none');
    }

    /* ─── DEV: xy ruler overlay, for lining up SVG coordinates by eye ────────
       Console:   setXY(1) / setXY(0)     URL: ?xy=1 */
    let xyOn = false;
    function buildXYRuler() {
      const g = document.getElementById('xyRuler');
      if (!g) return;
      const vb = document.getElementById('circuitRefSvg').viewBox.baseVal;
      const offX = vb.x, offY = vb.y, W = vb.width, H = vb.height;
      const hy = offY + H - 10, vx = offX + 10, col = '#ff00ff';
      let svg = `<line x1="${offX}" y1="${hy}" x2="${offX + W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let x = 0; x <= W; x += 10) {
        const gx = offX + x, major = (Math.round(gx) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${gx}" y1="${hy - len}" x2="${gx}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${gx}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${Math.round(gx)}</text>`;
      }
      svg += `<line x1="${vx}" y1="${offY}" x2="${vx}" y2="${offY + H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let y = 0; y <= H; y += 10) {
        const gy = offY + y, major = (Math.round(gy) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${vx}" y1="${gy}" x2="${vx + len}" y2="${gy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${vx + 13}" y="${gy + 3}" fill="${col}" font-size="8" text-anchor="start">${Math.round(gy)}</text>`;
      }
      g.innerHTML = svg;
    }
    function setXY(on) {
      xyOn = on;
      const g = document.getElementById('xyRuler');
      if (!g) return;
      if (on) buildXYRuler();
      g.setAttribute('display', on ? 'inline' : 'none');
    }
    window.setXY = setXY;

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      renderOptions();

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ')}`
          : 'Click the options above to select your answer.';
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (multi ? st.sel.length === 0 : st.sel === null);
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      showCircuitRef(data.circuitId, data.circuitLabel, data.circuitViewBox, data.circuitLoad, data.circuitAmmeter);
      updateReReveal();
      updateZReveal();
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function scrollToQuestionTop() {
      document.getElementById('qPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); scrollToQuestionTop(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        Q[i].ans = false;
        Q[i].sel = isMulti(QUESTIONS[i]) ? [] : null;
      }
      renderQuestion();
      scrollToQuestionTop();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
      scrollToQuestionTop();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      showCircuitRef('ce-divider-ac-part-bypassed', 'Common Emitter (RE1 unbypassed + RE2 bypassed)', DEFAULT_VIEWBOX);
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    // ── zoom modal ──
    function openModal() {
      const src = document.getElementById('circuitRefSvg'), dst = document.getElementById('modalSvg');
      dst.innerHTML = src.innerHTML; dst.setAttribute('viewBox', src.getAttribute('viewBox'));
      document.getElementById('modalTitle').textContent = document.getElementById('circuitRefLabel').textContent;
      document.getElementById('diagramModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('diagramModal').classList.remove('open');
      document.getElementById('modalSvg').innerHTML = '';
      document.body.style.overflow = '';
    }
    function handleModalClick(e) { if (e.target.closest('.modal-close')) return; closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) {
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      }
      goToQuestion(n);
      if (answered) {
        Q[cur].sel = Array.isArray(Q[cur].cor) ? [...Q[cur].cor] : Q[cur].cor;
        checkAnswer();
      }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
      if (p.has('xy')) setXY(+p.get('xy') === 1);
    }
  </script>
</body>
