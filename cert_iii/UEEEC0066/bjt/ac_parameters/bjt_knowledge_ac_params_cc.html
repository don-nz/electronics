<!--
  Knowledge quiz split out of bjt_knowledge_ac_parameters.html (which
  remains the full, original file, unchanged). This file's 5 questions
  were reworked to directly MIRROR bjt_knowledge_ac_params_ce.html's own
  Q1-5 (re′, Zb, Zin, Zout, Av) — same wording, same option shapes, same
  distractor-mistake types — with the numbers and (where the underlying
  physics genuinely differs by topology) the formula adjusted for the
  common-collector circuit. User: *"Can you please rework the questions
  for the common collector quiz to mirror the common emitter? So the 5
  questions will be worded the same, the answers will be the same but
  adjusted for the change in circuit."* This REPLACES the file's earlier
  content, which mirrored the original bjt_knowledge_ac_parameters.html's
  own old Q7-11 (a 3-question CC block followed by 2 CE loaded-gain
  questions bundled in only because of how that file's own numbering
  fell) — the loaded-gain pair is no longer covered by this file.

  (File was originally named bjt_knowledge_ac_params_cb.html — "cb" read
  as common-base by mistake — then renamed by the user to _cc to match
  its actual common-collector content, before this rework.)

  ONE worked NPN stage (BC549, β=200 assumed) is used, wired as a
  common-collector (emitter-follower) stage: collector tied straight to
  VCC (AC-common), output taken from the emitter. re′ is calculated as
  its own first question (Q1) rather than approximated away, then carried
  into Zb = β×(RE+re′) and Av = RE/(RE+re′) explicitly — exactly
  mirroring how the CE file threads re′ through Zb and Av. IE is a
  DC-analysis result taken as GIVEN (shown via an ammeter badge, same
  convention bjt_npn_voltage_divider_ac.html uses). Once Q1 is answered,
  re′'s value stays visible directly on the diagram — `reRevealCc`,
  toggled by `updateReReveal()` based on `Q[0].ans`.

  Q4 (Zout) is the one question whose CORRECT ANSWER genuinely can't be a
  literal mirror of CE's — CE's Zout≈RC because the collector is directly
  wired to a resistor; CC's own Zout≈RE∥re′ (≈re′, since RE≫re′) because
  the emitter looks back through the transistor into a low reflected
  base-side impedance. The QUESTION's wording/shape still mirrors CE's Q4
  exactly ("what is the approximate AC output resistance, looking back
  into the — terminal"), and one of CE's own wrong-answer flavours ("used
  RE alone, ignoring re′") reappears here as a genuine, on-topic
  distractor rather than a borrowed one, since that IS a real mistake
  this formula invites.

  Zb/Zin/Zout value-meter badges (`zbBadgeCc`/`zinBadgeCc`/`zoutBadgeCc`)
  reveal on the diagram once their own question is answered — Zb on Q2,
  Zin on Q3, Zout on Q4 — via `updateZReveal()`, the exact same reveal
  timing bjt_knowledge_ac_params_ce.html uses for its own three badges
  (Q[1]/Q[2]/Q[3]), now that this file's questions are ordered the same
  way (previously Zb/Zin revealed together off a single combined
  question, since Zb was never its own question before this rework).

  Formulas used (standard "beta model", ignoring ro):
    Zb = β×(RE+re′), Zin = R1∥R2∥Zb, Zout ≈ RE∥re′ (≈re′ since RE≫re′),
    Av ≈ RE/(RE+re′)

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine, same
  recipe as the rest of the ac_parameters family: CIRCUIT_SVG_ID=
  'circuitRefSvg', DEFAULT_CIRCUIT_VIEWBOX=DEFAULT_VIEWBOX,
  CIRCUIT_REF_EXTRA toggles the ieInd ammeter (this file's own id, NOT
  ieIndCe — a common-collector stage, not common-emitter),
  SUMMARY_CIRCUIT_REF points at cc-divider-ac, RENDER_EXTRA re-runs
  updateReReveal/updateZReveal (Cc-suffixed badge ids) every render.
-->

<body>
  <!-- Hidden defs: the CC version of the NPN voltage-divider stage, built
       in bjt_npn_voltage_divider_ac.html's own large-scale WIRES/NODES
       format (see the file header comment above). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- ══ NPN BJT SHAPE ══ -->
      <g id="bjt-npn-shape">
        <circle cx="7" cy="0" r="24" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
        <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
        <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
      </g>

      <!-- ══ AC SIGNAL SOURCE SHAPE — circle with one sine cycle ══ -->
      <g id="ac-source-shape">
        <circle cx="0" cy="0" r="24" fill="none" style="stroke: var(--colour-signal)" stroke-width="2" filter="url(#glow)" />
        <path d="M -16,0 C -11,-14 -5,-14 0,0 C 5,14 11,14 16,0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- ══ AMMETER BADGE — same shape as bjt_npn_voltage_divider_ac.html's own ammeter-shape ══ -->
      <g id="ammeter-shape">
        <circle cx="0" cy="0" r="30" style="fill: var(--colour-ammeter-fill); stroke: var(--colour-current)" stroke-width="1.5" filter="url(#glow)" />
      </g>

      <!-- ══ Z-VALUE METER BADGE — same solid-over-dashed dial-line motif as
           bjt_npn_voltage_divider_ac.html's own voltmeter "meter-shape",
           recoloured to the colour-gain token (the same colour the
           Zb/Zin/Zout arrow-labels already use) instead of that file's
           colour-red token, since these badges are revealing a Z value,
           not a DC voltage. ══ -->
      <g id="z-meter-shape">
        <circle cx="0" cy="0" r="25" style="fill: var(--colour-meter-fill); stroke: var(--colour-gain)" stroke-width="1.5" filter="url(#glow)" />
      </g>

      <!-- ══ COUPLING CAPACITOR SHAPE — two plates, reused for Cin and Cout ══ -->
      <g id="cap-shape">
        <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
        <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
        <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      </g>

      <!-- ══════════════════════════════════════════════════════════════════
           Common Collector (emitter follower) — voltage-divider bias.
           Large-scale WIRES/NODES/component-group layout — same convention
           as bjt_npn_voltage_divider_ac.html (explicit LEFT/CENTER/RIGHT
           VERTICAL + TOP/BOTTOM/CENTRE/OUTPUT HORIZONTAL wire sections,
           each wire individually commented; resistors as boxes with a
           separate name/value label pair; VCC/GND as their own labelled
           groups). No RC (collector ties straight to VCC — AC-common),
           output taken from NODE E (the emitter). ═══════════════════════ -->
      <g id="cc-divider-ac">

        <!-- ════════════════════ WIRES ════════════════════ -->

        <!-- ── LEFT VERTICAL (AC source ground return) ── -->
        <!-- See AC INPUT COMPONENTS for split line -->

        <!-- ── CENTER VERTICAL (R1/R2 line, base-bias rail, x=200) ── -->
        <line x1="200" y1="50" x2="200" y2="80" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to R1 -->
        <line x1="200" y1="160" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R1 down to Base node -->
        <line x1="200" y1="255" x2="200" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node down to R2 -->
        <line x1="200" y1="430" x2="200" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R2 down to GND rail -->

        <!-- ── RIGHT VERTICAL (collector/emitter rail, x=440) ── -->
        <line x1="440" y1="50" x2="440" y2="211" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail straight down to Collector pin — no RC, collector is AC-common -->
        <line x1="440" y1="269" x2="440" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Emitter pin down to GND rail -->

        <!-- ── TOP HORIZONTAL ── -->
        <line x1="180" y1="50" x2="460" y2="50" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail (R1 column to RC column) -->
        <circle cx="200" cy="50" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="50" r="5" style="fill: var(--colour-series)" />

        <!-- ── BOTTOM HORIZONTAL ── -->
        <line x1="10" y1="520" x2="620" y2="520" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="30" cy="520" r="5" style="fill: var(--colour-series)" />
        <circle cx="200" cy="520" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="520" r="5" style="fill: var(--colour-series)" />

        <!-- ── CENTRE HORIZONTAL ── -->
        <line x1="30" y1="235" x2="409" y2="235" style="stroke: var(--colour-series)" stroke-width="2" /><!-- BSource to transistor base pin -->

        <!-- ── OUTPUT HORIZONTAL ── -->
        <line x1="440" y1="290" x2="600" y2="290" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Collector pin, through Cout, to output -->

        <!-- ════════════════════ NODES ════════════════════ -->

        <!-- ── NODE B — Zin is looked up from here, rightward into the base ── -->
        <circle cx="200" cy="235" r="5" style="fill: var(--colour-series)" />
        <text x="370" y="220" style="fill: var(--colour-gain)" font-size="15" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">b &#10145;</tspan></text>
        <text x="170" y="220" style="fill: var(--colour-gain)" font-size="15" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">in &#10145;</tspan></text>

        <!-- ── Z-VALUE BADGES — hidden until their own question is answered,
             toggled via updateZReveal(). Zin sits shifted left of its own
             arrow-label to stay clear of the transistor (mirrors CE's Zb
             treatment — CE/CC have Zb/Zin on opposite sides of NODE B). ── -->
        <g id="zbBadgeCc" display="none" transform="translate(340,180)">
          <use href="#z-meter-shape" />
          <text x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">203.5</text>
          <text x="0" y="20" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>
        <g id="zinBadgeCc" display="none" transform="translate(140,180)">
          <use href="#z-meter-shape" />
          <text x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">7.93</text>
          <text x="0" y="20" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>

        <!-- ── NODE E — Zout is looked back into from here, source zeroed ── -->
        <circle cx="440" cy="290" r="5" style="fill: var(--colour-series)" />
        <text x="480" y="310" style="fill: var(--colour-gain)" font-size="15" text-anchor="middle" font-weight="bold"><tspan baseline-shift="10%">&#11013;</tspan> Z<tspan baseline-shift="sub" font-size="13">out</tspan></text>
        <g id="zoutBadgeCc" display="none" transform="translate(510,350)">
          <use href="#z-meter-shape" />
          <text x="0" y="4" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">17</text>
          <text x="0" y="20" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">&#937;</text>
        </g>

        <!-- ════════════════════ AC INPUT COMPONENTS ════════════════════ -->
        <g id="outputTerminalPlain">

          <!-- ── INPUT VERTICAL WIRES WITH ARROWS ── -->
          <circle cx="30" cy="235" r="5" style="fill: var(--colour-signal)" />

          <polygon points="24,255,36,255 30,245" style="fill: var(--colour-series)" /><!-- Arrow pointing up -->
          <line x1="30" y1="250" x2="30" y2="370" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Horizontal to "input" -->

          <text x="5" y="382" style="fill: var(--colour-signal)" text-anchor="start" font-size="16" font-weight="bold">input</text>

          <line x1="30" y1="390" x2="30" y2="500" style="stroke: var(--colour-series)" stroke-width="2" /><!-- "input" to GND -->
          <polygon points="24,500 36,500 30,510" style="fill: var(--colour-series)" /><!-- Arrow pointing down -->

          <circle cx="30" cy="520" r="5" style="fill: var(--colour-signal)" />

        </g>
        <g transform="translate(60,235)">
          <use href="#cap-shape" />
          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16" font-weight="bold">C<tspan baseline-shift="sub" font-size="13">IN</tspan></text>
        </g>


        <!-- ════════════════════ AC OUTPUT COMPONENTS ════════════════════ -->

        <g transform="translate(560,290)">
          <use href="#cap-shape" />
          <text x="0" y="27" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16" font-weight="bold">C<tspan baseline-shift="sub" font-size="13">OUT</tspan></text>
        </g>

        <!-- ── OUTPUT VERTICAL WIRES WITH ARROWS ── -->
        <circle cx="600" cy="290" r="5" style="fill: var(--colour-signal)" />

        <polygon points="594,320 606,320 600,310" style="fill: var(--colour-series)" /><!-- Arrow pointing up -->
        <line x1="600" y1="300" x2="600" y2="405" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Horizontal to "output" -->

        <text x="580" y="418" style="fill: var(--colour-signal)" text-anchor="start" font-size="16" font-weight="bold">output</text>

        <line x1="600" y1="425" x2="600" y2="510" style="stroke: var(--colour-series)" stroke-width="2" /><!-- "output" to GND -->
        <polygon points="594,500 606,500 600,510" style="fill: var(--colour-series)" /><!-- Arrow pointing down -->

        <circle cx="600" cy="520" r="5" style="fill: var(--colour-signal)" />

        <!-- ════════════════════ VCC ════════════════════ -->

        <g transform="translate(280,-1)">
          <line x1="40" y1="50" x2="40" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
          <line x1="0" y1="30" x2="80" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
          <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
          <!-- hand-drawn "+" -->
          <line x1="50" y1="10" x2="50" y2="20" style="stroke: var(--colour-text)" stroke-width="1.0" />
          <line x1="46" y1="15" x2="54" y2="15" style="stroke: var(--colour-text)" stroke-width="1.0" />
          <text x="60" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14" font-weight="bold">12 V</text>
        </g>

        <!-- ════════════════════ COMMON LABEL ════════════════════ -->

        <text x="120" y="540" fill="var(--colour-gnd)" text-anchor="middle" font-size="14" font-weight="bold">Common</text>

        <!-- ════════════════════ BJT — NPN ════════════════════ -->

        <g transform="translate(426,235)">
          <use href="#bjt-npn-shape" />
          <text x="-15" y="-25" fill="var(--colour-bjt-labels)" text-anchor="middle" font-size="14" font-weight="bold">Q1</text>
          <text x="0" y="40" fill="var(--colour-bjt-labels)" text-anchor="end" font-size="12">BC549</text>
          <text x="35" y="-5" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="14" font-weight="bold">β = 200</text>
          <!-- ── re' reveal — hidden until Q1 is answered, toggled via updateReReveal() ── -->
          <text id="reRevealCc" display="none" x="35" y="20" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="13" font-weight="bold">r<tspan baseline-shift="sub" font-size="10">e</tspan>′ ≈ 17.3 Ω</text>
        </g>

        <!-- ════════════════════ RESISTORS ════════════════════ -->

        <!-- ── R1 ── -->
        <g transform="translate(185,80)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="20" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">R1</text>
          <text x="60" y="20" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">47 kΩ</text>
        </g>

        <!-- ── R2 ── -->
        <g transform="translate(185,350)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">R2</text>
          <text x="60" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">10 kΩ</text>
        </g>

        <!-- ── RE ── -->
        <g transform="translate(425,350)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">RE</text>
          <text x="60" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">1 kΩ</text>
        </g>

        <!-- ── IE INDICATOR — shown only for Q1 (re' calc), toggled via circuitAmmeter flag ── -->
        <g id="ieInd" display="none" transform="translate(440,475)">
          <use href="#ammeter-shape" />
          <text x="-35" y="-20" style="fill: var(--colour-current)" text-anchor="middle" font-size="14" font-weight="bold">I<tspan baseline-shift="sub" font-size="10">E</tspan></text>
          <text x="0" y="-2" style="fill: var(--colour-text)" text-anchor="middle" font-size="15" font-weight="bold">1.505</text>
          <text x="0" y="15" style="fill: var(--colour-current)" text-anchor="middle" font-size="12">mA</text>
        </g>

      </g>
    </defs>
  </svg>

            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

    <!-- Zoom modal — copies circuitRefSvg's current innerHTML/viewBox in on open. -->
    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalTitle">Reference Circuit</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="-10 -10 690 570" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

  </div>

  <script>
    const DEFAULT_VIEWBOX = '-10 -10 690 570';
    CIRCUIT_SVG_ID = 'circuitRefSvg';
    DEFAULT_CIRCUIT_VIEWBOX = DEFAULT_VIEWBOX;
    CIRCUIT_REF_EXTRA = (id, loadTerminal, ammeter) => {
      document.getElementById('ieInd').setAttribute('display', ammeter ? 'inline' : 'none');
    };
    SUMMARY_CIRCUIT_REF = { id: 'cc-divider-ac', label: 'Common Collector (voltage-divider bias, emitter follower)', viewBox: DEFAULT_VIEWBOX };

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — Q1-5, mirroring bjt_knowledge_ac_params_ce.html's own
    // Q1-5 wording/shape exactly (re′, Zb, Zin, Zout, Av), values/formula
    // adjusted for this common-collector circuit. See that file's own
    // QUESTIONS array to compare side by side. See
    // bjt_knowledge_basics.html's header comment for the full field
    // reference.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'cc-divider-ac',
        circuitLabel: 'Common Collector (voltage-divider bias, emitter follower)',
        circuitAmmeter: true,
        text: () => 'What is <b class="colour-bjt">r<sub>e</sub>′</b> for this <b style="color:var(--colour-ui-primary)">common-collector</b> stage?',
        hint: () => 're′ = VT/IE, using the standard room-temperature approximation VT ≈ 26 mV.',
        options: () => shuffle([
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 mV', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 mV', '1.505 mA')} ≈ 17.3 Ω`, type: 'correct' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 V', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 V', '1.505 mA')} ≈ 17,280 Ω`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ 26 Ω`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('<b class="colour-current">I<sub>E</sub></b>', '26 mV')} ≈ ${frac('1.505 mA', '26 mV')} ≈ 0.058 Ω`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-bjt">r<sub>e</sub>′</b> ≈ 17.3 Ω',
        working: () => `
    <div class="working-formula-row"><b class="colour-bjt">r<sub>e</sub>′</b> = ${frac('V<sub>T</sub>', 'I<sub>E</sub>')} ≈ ${frac('26 mV', '1.505 mA')}</div>
    <div class="working-total"><b class="colour-bjt">r<sub>e</sub>′</b> ≈ 17.3 Ω — small next to RE (1 kΩ) here, but not thrown away: keep this value, every AC parameter from here on uses it.</div>`
      },
      {
        circuitId: 'cc-divider-ac',
        circuitLabel: 'Common Collector (voltage-divider bias, emitter follower)',
        text: () => 'What is the <b style="color:var(--colour-ui-primary)">AC</b> resistance looking directly into the base, <b class="colour-resistor">Z<sub>b</sub></b>?',
        hint: () => 'Every unit of base current has to supply β times as much emitter current — so from the base\'s point of view, whatever sits in the emitter leg (RE, plus the transistor\'s own re′) looks β times BIGGER than it really is. Zb = β × (RE + re′).',
        options: () => shuffle([
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">RE</b> + <b class="colour-bjt">re′</b>) = 200 × (1000 Ω + 17.3 Ω) ≈ 203.5 kΩ`, type: 'correct' },
          { label: `<b class="colour-gain">Zb</b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">RE</b> = 200 × 1000 Ω ≈ 200 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">RE</b> − <b class="colour-bjt">re′</b>) = 200 × (1000 Ω − 17.3 Ω) ≈ 196.5 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">Zb</b> = (<b class="colour-resistor">RE</b> + <b class="colour-bjt">re′</b>) / <b class="colour-bjt">β</b> = 1017.3 Ω / 200 ≈ 5.09 Ω`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">R<sub>E</sub></b> + r<sub>e</sub>′) ≈ 203.5 kΩ',
        working: () => `
    <div class="working-line">Every unit of base current supplies β times as much emitter current, so anything in the emitter leg — RE AND the transistor's own internal AC emitter resistance re′ — both get reflected into the base β times bigger.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">R<sub>E</sub></b> + r<sub>e</sub>′) = 200 × (1000 Ω + 17.3 Ω)</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>b</sub></b> ≈ 203,460 Ω ≈ 203.5 kΩ — only a little above the RE-only approximation (200 kΩ), since re′ is small next to RE here. This quiz uses <b class="colour-bjt">β</b> = 200 for every worked example (a reasonable mid-range value for a BC549, hFE 110–800 typ). Keep this value, it's used again in the next question.</div>`
      },
      {
        circuitId: 'cc-divider-ac',
        circuitLabel: 'Common Collector (voltage-divider bias, emitter follower)',
        text: () => 'What is the <b style="color:var(--colour-ui-primary)">AC</b> input resistance <b class="colour-resistor">Z<sub>in</sub></b> seen by the signal source?',
        hint: () => 'Looking into the base node from the source\'s point of view, R1, R2 and Zb are all three connected between that same node and ground (or VCC, which is AC ground) — that\'s three resistances in PARALLEL, not in series.',
        options: () => shuffle([
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b>∥<b class="colour-resistor">R2</b>∥<b class="colour-gain">Zb</b> = 47 kΩ∥10 kΩ∥203.5 kΩ ≈ 7.93 kΩ', type: 'correct' },
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b> + <b class="colour-resistor">R2</b> + <b class="colour-gain">Zb</b> = 47 kΩ + 10 kΩ + 203.5 kΩ ≈ 260.5 kΩ', type: 'wrong' },
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b>∥<b class="colour-resistor">R2</b> = 47 kΩ∥10 kΩ ≈ 8.25 kΩ', type: 'wrong' },
          { label: '<b class="colour-gain">Zin</b> ≈ <b class="colour-gain">Zb</b> = 203.5 kΩ', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>in</sub></b> = R1∥R2∥<b class="colour-resistor">Z<sub>b</sub></b> ≈ 7.93 kΩ',
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>in</sub></b> = R1 ∥ R2 ∥ <b class="colour-resistor">Z<sub>b</sub></b></div>
    <div class="working-line">${frac('1', '<b class="colour-resistor">Z<sub>in</sub></b>')} = ${frac('1', '47,000')} + ${frac('1', '10,000')} + ${frac('1', '203,500')} ≈ 0.0001262 Ω⁻¹</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>in</sub></b> ≈ 7,925 Ω ≈ 7.93 kΩ — barely above the RE-only version of this same calculation (7.92 kΩ), since Zb landing a little higher (re′ included) makes almost no difference once it's in parallel with the much smaller R1∥R2 (8.25 kΩ) — the SMALLEST of three parallel resistances always dominates the combination.</div>`
      },
      {
        circuitId: 'cc-divider-ac',
        circuitLabel: 'Common Collector (voltage-divider bias, emitter follower)',
        text: () => 'What is the approximate <b style="color:var(--colour-ui-primary)">AC</b> output resistance <b class="colour-resistor">Z<sub>out</sub></b>, looking back into the emitter terminal?',
        hint: () => 'Zero the source, then look back into the emitter node. Unlike the collector in a common-emitter stage, the emitter here also has a path back through the transistor into the low-impedance source — reflected by 1/β, that path is small enough to dominate over RE itself: Zout ≈ RE∥re′.',
        options: () => shuffle([
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RE</b>∥<b class="colour-bjt">re′</b>', type: 'correct' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RE</b>', type: 'wrong' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-gain">Zin</b>', type: 'wrong' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RE</b> ∥ <b class="colour-resistor">R1</b>∥<b class="colour-resistor">R2</b>', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>E</sub></b>∥r<sub>e</sub>′',
        working: () => `
    <div class="working-line">With the source zeroed, looking back into the emitter node sees TWO parallel paths: <b class="colour-resistor">R<sub>E</sub></b> itself, and the transistor's own internal r<sub>e</sub>′ reflected back through from the (near-zero) source side. Because r<sub>e</sub>′ (17.3 Ω) is so much smaller than <b class="colour-resistor">R<sub>E</sub></b> (1000 Ω), it dominates the parallel combination.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>E</sub></b>∥r<sub>e</sub>′ = ${frac('1000 × 17.3', '1000 + 17.3')} ≈ 17 Ω</div>
    <div class="working-total">This is why <b class="colour-resistor">Z<sub>out</sub></b> for a common-collector (emitter-follower) stage is usually fairly LOW — the exact opposite of a common-emitter stage's Zout≈RC, which is usually fairly HIGH — a big part of why emitter followers are used as buffer stages.</div>`
      },
      {
        circuitId: 'cc-divider-ac',
        circuitLabel: 'Common Collector (voltage-divider bias, emitter follower)',
        text: () => 'What is the voltage gain <b class="colour-gain">|A<sub>v</sub>|</b> of this <b style="color:var(--colour-ui-primary)">common-collector</b> stage?',
        hint: () => '|Av| ≈ RE / (RE + re′) for a common-collector (emitter-follower) stage.',
        options: () => shuffle([
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RE</b>', '<b class="colour-resistor">RE</b>+<b class="colour-bjt">re′</b>')} = ${frac('1000 Ω', '1017.3 Ω')} ≈ 0.983`, type: 'correct' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RE</b>', '<b class="colour-resistor">RE</b>')} = ${frac('1000 Ω', '1000 Ω')} ≈ 1`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RE</b>+<b class="colour-bjt">re′</b>', '<b class="colour-resistor">RE</b>')} = ${frac('1017.3 Ω', '1000 Ω')} ≈ 1.017`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ <b class="colour-resistor">R<sub>E</sub></b> ≈ 1000`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-gain">|A<sub>v</sub>|</b> ≈ R<sub>E</sub>/(R<sub>E</sub>+r<sub>e</sub>′) ≈ 0.983',
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${frac('<b class="colour-resistor">R<sub>E</sub></b>', '<b class="colour-resistor">R<sub>E</sub></b> + r<sub>e</sub>′')} = ${frac('1000 Ω', '1017.3 Ω')}</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ 0.983 — always just under 1 for an emitter follower, only exactly 1 if re′ is (incorrectly) ignored entirely.</div>`
      },
    ];
    /* re' reveal on the diagram itself, once Q1 has been answered. Persists
       regardless of which question is currently on screen (unlike the
       ammeter badge, which only shows for its own question) — this is
       "now-known information", same convention as the rest of this
       project's progressive-reveal circuits. */
    function updateReReveal() {
      document.getElementById('reRevealCc').setAttribute('display', Q[0].ans ? 'inline' : 'none');
    }

    /* Zb/Zin/Zout value badges — same "reveal once answered, stays
       revealed" convention as updateReReveal() above. Zb=Q2(idx1),
       Zin=Q3(idx2), Zout=Q4(idx3) — mirrors
       bjt_knowledge_ac_params_ce.html's own reveal timing exactly, now
       that this file's questions are ordered the same way. */
    function updateZReveal() {
      document.getElementById('zbBadgeCc').setAttribute('display', Q[1].ans ? 'inline' : 'none');
      document.getElementById('zinBadgeCc').setAttribute('display', Q[2].ans ? 'inline' : 'none');
      document.getElementById('zoutBadgeCc').setAttribute('display', Q[3].ans ? 'inline' : 'none');
    }

    RENDER_EXTRA = () => { updateReReveal(); updateZReveal(); };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
