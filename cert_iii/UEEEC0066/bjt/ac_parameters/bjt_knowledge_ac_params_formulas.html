<!--
  "Quick reinforcement" quiz for the AC-parameters lesson, distinct from
  every other file in this folder: those are all CALCULATE-a-number quizzes
  tied to one specific circuit's own resistor values. This one drills the
  FORMULAS themselves — symbolic, no numbers — across all four circuit
  variants this lesson covers: common emitter (bjt_knowledge_ac_params_ce.
  html), common collector (_cc.html), CE with the emitter fully bypassed
  (_ce_bypassed.html), and CE with the emitter only partially bypassed
  (_ce_part_bypassed.html). User: *"I'd like to create a quick quiz for ac
  parameters that reinforces the formulas used to work out the AC values...
  I'd like to cover the formulas for different circuits - common emitter,
  common [collector], emitter bypass, partial emitter bypass. Can I start
  with just 1 question and build from there? Q1. Zin ="*

  Q1 REBUILT same session, immediate follow-up, replacing an earlier plain-MC
  draft of this same question. User: *"I'd like to approach this in a
  different way to the other quizzes in this section. Zin = RB1 || RB2 ||
  Beta x (RE + re) (colour coded and using numerator over denominator
  format). This formula is used to calculate the AC input resistance for a
  circuit. Choose all circuits that it is used with. See Q1 of
  bjt_knowledge_biasing.html for an example of the format I would like."*
  Confirmed via question: replace the old MC-only Q1 rather than keep both.

  Format ported from bjt_knowledge_biasing.html's own Q1: a formula is shown
  once, then a `leftPanel:'shapeGrid'` multi-select grid of small circuit
  thumbnails lets the student pick every circuit that formula genuinely
  applies to — testing formula-to-circuit RECOGNITION, not just formula
  recall in isolation. Engine gained the full shapeGrid apparatus (was
  previously the simpler no-diagram engine copied from digital_knowledge_
  logic_families.html) — circuit-col/circuit-panel/shapeGridPanel restored,
  `.single-col` dropped, `renderShapeGrid()`/`showCircuitRef()` ported in
  verbatim from bjt_knowledge_biasing.html. `kind:'match'` support kept too,
  even though unused so far, since a future question in this quiz (matching
  each circuit type to its own Zb formula) is an obvious, likely next step.

  Four NEW mini circuit thumbnails built for the shapeGrid (140×200 viewBox,
  same coordinate scale/primitives as bjt_knowledge_biasing.html's own
  6-circuit grid — mbjt-npn-standard/mres/mgnd copied verbatim, plus a new
  mcap primitive for the bypass-capacitor variants that file never needed):
  `mini-ce` (voltage-divider bias, RC top, RE bottom, no bypass — literally
  bjt_knowledge_biasing.html's own npn-divider-pos topology, redrawn since
  this is a separate file), `mini-cc` (same base-divider, but the collector
  wire runs straight to +VCC with NO RC box, output implicitly the emitter —
  the common-collector topology), `mini-ce-bypassed` (mini-ce plus a bypass
  capacitor branch in parallel with the FULL RE), `mini-ce-part-bypassed`
  (mini-ce but RE split into two smaller stacked boxes RE1/RE2, with the
  bypass capacitor in parallel with ONLY the lower one, RE2 — matching
  bjt_knowledge_ac_params_ce_part_bypassed.html's own real topology).
  Deliberately no text captions on the thumbnails (matching biasing.html's
  own convention) — the whole point is visual topology recognition, not
  label-reading.

  The formula given — Zin = RB1∥RB2∥β×(RE+re′) — is CE's own Zin/Zb shape
  (see bjt_knowledge_ac_params_ce.html's own Q2/Q3). Verified against every
  sibling file's own Zb formula before writing this question (not assumed):
  CE and CC both genuinely use β×(RE+re′) — confirmed identical in
  bjt_knowledge_ac_params_cc.html's own Q2, since Zb is a base-side property
  that doesn't care whether the output is later tapped from the collector
  (CE) or the emitter (CC). The two bypass variants do NOT match: fully-
  bypassed uses β×re′ alone (no RE term at all — bjt_knowledge_ac_params_ce_
  bypassed.html Q2), and partially-bypassed uses β×(RE1+re′) — a different
  SYMBOL (RE1, the still-unbypassed portion) substituted in place of the
  full RE (bjt_knowledge_ac_params_ce_part_bypassed.html Q2) — a deliberate
  "looks similar, wrong resistor" near-miss distractor circuit. So the
  correct answer is exactly 2 of the 4 shown circuits: Common Emitter and
  Common Collector.

  "Colour coded and using numerator over denominator format" (the user's
  own formatting instruction) went through a few rounds before landing on
  its final form. First pass left the ∥ terms inline (no literal division).
  User then asked for "3 layers" — tried stacking RB1/RB2/β×(RE+re′) as 3
  rows with divider lines, but that's mathematically wrong (reads as nested
  DIVISION, not parallel combination) — user caught this mid-turn ("isn't
  it: 1"). Fixed to the actual textbook identity: Zin = 1/(1/RB1 + 1/RB2 +
  1/[...]), via `frac('1', denominatorString)`. Final refinement, matching
  a hand-drawn class-notes sketch: each reciprocal term ALSO renders as its
  own small stacked fraction (frac() nested two levels deep), not inline
  "1/RB1" text — `.working-frac`'s existing CSS (inline-flex column,
  vertical-align:middle) handles the nesting with zero new CSS. Applies to
  every question below.

  Question-pool randomization added: `resetQuiz()` calls `shuffle(QUESTIONS)`
  before mapping to `Q[]` state, same convention as digital_gate_
  identification.html — every question in the pool appears, just reordered
  fresh on every page load and every "↺ Restart" click.

  Q2 and Q3 added same session, immediate follow-up. User: *"Can you add the
  same question but for the 2 other circuits? ie partially bypassed and
  fully bypassed? The same mini circuit selections are perfect."* Same 4
  circuits, same shapeGrid, same question SHAPE as Q1 — only the formula
  shown and which circuit(s) count as correct change. Refactored `options`
  into a shared `gridOptions(correctIds)` builder (`GRID_CIRCUIT_IDS` is now
  just a flat 4-id array, no per-question `matches` flag baked in) so all
  three questions reuse one small helper instead of three separate shuffle/
  map blocks. Q2: Zin using β×re′ (fully-bypassed Zb, no RE term at all) —
  matches ONLY mini-ce-bypassed, the other 3 circuits all keep at least a
  partial RE term in their own Zb. Q3: Zin using β×(RE1+re′) (partially-
  bypassed Zb) — matches ONLY mini-ce-part-bypassed; CE/CC use the full RE
  (not RE1) and the fully-bypassed circuit has no resistor term at all, so
  neither is a valid near-miss here despite superficial shape similarity.

  Q4 added same session, immediate follow-up — a `kind:'match'` question,
  the FIRST in this file to actually use it (kept wired in since Q1's own
  build but unused until now). User: *"I'd like to add a question based on:
  UEEEC0069 -> digital_knowledge_logic_gates.html -> Q2. The 4 mini circuits
  will be below and the names of each in the select box. The idea is match
  the name to the circuit."* Ported that file's own Q2 pattern exactly:
  `columns()` returns the 4 mini circuits as `{ shapeId }` (rendered as SVG
  thumbnails instead of text column headers), `options()` is the POOL — 4
  plain-text circuit names the student drags/clicks into the column they
  belong under. `col` index for each pool option is looked up via
  `GRID_CIRCUIT_IDS.indexOf(id)` rather than hardcoded 0-3, so the match
  stays correct even if that array's order ever changes.

  Upgrading `matchChipContent()`/`renderMatch()` to support `{shapeId}`
  columns required porting logic_gates.html's more capable version wholesale
  (the version copied in earlier only handled plain-string columns, since no
  question needed shapes-as-columns until now) — column titles now render
  via `<svg viewBox="0 0 140 200"><use href="#id"/></svg>`, this file's own
  mini-circuit viewBox convention (logic_gates.html's own version uses ITS
  gate shapes' 96-unit viewBox instead — swapped for the correct one here,
  not copied verbatim). Also ported a `.match-chip-shape` CSS override into
  this file's own `<head>` (logic_gates.html defines it locally too, not in
  quiz-common.css) — unused by Q4 itself (the pool holds text, not shapes)
  but kept for parity/future use.

  `leftPanel` gained a third value, `'none'` (Q4 uses it) — collapses the
  layout to a single centred column via `.quiz-wrap.single-col` (already
  defined in quiz-common.css, added when logic_gates.html was built) rather
  than showing an empty/irrelevant circuit-panel. Replaced the old inline
  circuit-panel-visibility lines in `renderQuestion()` with a dedicated
  `swapLeftPanel(mode)` function (ported from logic_gates.html's own,
  extended with the 3rd default/circuitId-reference mode this file still
  needs for parity with its siblings, even though no question here uses it
  yet).

  Q5 added same session, immediate follow-up — same match mechanic as Q4
  (circuits as `{shapeId}` columns), but pool = re′ CALCULATIONS instead of
  names. User: *"I'd like to match the re calculation to the correct
  circuit. Can you list the 4 re calculations and match them to the
  circuit? You can leave all 4 options at the top even after selected. That
  way we are covered for the duplicate."* The "duplicate" is real, not
  hypothetical: CE, CE-bypassed and CE-part-bypassed share an IDENTICAL DC
  bias network (same R1/R2/RC/total-RE — a bypass cap is AC-only, doesn't
  touch DC bias at all), so all three have the exact same IE≈2.716mA and
  therefore the exact same re′≈9.57Ω (verified against each sibling file's
  own Q1, not assumed). Offered the user two concrete designs before
  building — (A) 4 separate pool chips, 3 reading identical text, each
  still mapped 1:1 to its own circuit column, vs (B) only 2 unique chips
  that stay permanently visible/reusable across multiple columns (their own
  literal "leave all 4 at the top" suggestion, but requiring a new many-to-
  one match paradigm). User picked (A) — no engine paradigm change needed,
  same shape as Q4.

  (A) still needed ONE real fix: the SHARED `isAnswerCorrect`/`selectedLabel`
  match-grading logic checks `place[i]===cor[i]` — exact OPTION IDENTITY
  per column, not value. With 3 physically-identical chips, a student who
  correctly reasons "these 3 circuits all need the 9.57Ω calc" could easily
  place the "wrong" (but textually identical) chip-instance under a given
  column and get marked wrong despite a fully correct answer — an
  unacceptable grading bug for an assessment tool, not a hypothetical edge
  case. Fixed generically (not just patched for this one question) via a
  new opt-in `matchByLabel: true` question flag: `resetQuiz()` now also
  builds `st.corLabel[col] = <canonical label for that column>` for every
  match question; a new `matchColumnCorrect(st, c)` checks "is there
  EXACTLY ONE chip under column c, and does ITS LABEL match corLabel[c]"
  (still requires exactly one per column, so stacking two chips onto one
  circuit and leaving another empty is still correctly marked wrong — not
  accidentally rewarded by the looser label check). `isAnswerCorrect`/
  `selectedLabel` branch on `data.matchByLabel`; Q4 (no duplicates, no flag)
  is completely unaffected, still uses the original exact-index check.

  Q5's SUBJECT corrected same session, immediate follow-up. User: *"I made
  a mistake with what I was asking. I should have asked for RB. Can you
  please change the options and question to RB? The values can be
  removed."* Swapped from re′ calculations to RB1/RB2 base-bias resistor
  values — same underlying pedagogical point (a bypass capacitor changes
  nothing about the base-bias divider, exactly as it changes nothing about
  IE/re′) and the same 3-vs-1 duplicate shape (RB1=120kΩ/RB2=15kΩ for CE/
  CE-bypassed/CE-part-bypassed, verified via each file's own R1/R2 label
  text; RB1=47kΩ/RB2=10kΩ for CC), so the `matchByLabel` engine fix above
  still applies unchanged. "The values can be removed" — dropped the 26mV/
  IE-style CALCULATION entirely (RB1/RB2 are simply given component values,
  nothing to derive, unlike re′ which needed a division), while keeping the
  actual kΩ numbers themselves, since removing those too would leave no way
  to tell the four options apart at all. `matchByLabel`/`leftPanel`/`kind`/
  `columns` all left unchanged from the original build — only `text`/
  `hint`/`options`/`correctExplain`/`working` were rewritten.

  Q5's SUBJECT corrected AGAIN, same session, immediate follow-up. User:
  *"I stuffed up again. Zb not Rb. I'm not concentrating."* Swapped RB1/RB2
  → Zb. Checked first rather than assuming the same duplicate shape still
  applied: Zb genuinely differs across all 4 circuits (55.9/203.5/1.91/
  28.9 kΩ, verified via each sibling file's own Q2 — Zb is precisely the
  ONE AC quantity that DOES depend on how much of RE survives the bypass,
  unlike re′/RB1/RB2 which are all untouched by it). Since there's no
  duplicate this time, removed `matchByLabel: true` and reverted
  `correctExplain`/`working` to the same plain exact-index style Q4 already
  uses, rather than leaving the now-unnecessary matchByLabel machinery
  wired into a question that doesn't need it.

  Q6 added same session, immediate follow-up — a genuinely NEW match
  mechanic, not a copy of Q4/Q5's shape. User, having just been told Zout
  ≈RC for 3 circuits and ≈RE∥re′ for the 4th: *"Can you list the 2 Zout
  formulas in the options box and show the 4 circuits. Match the formula to
  the circuit. Don't remove the formula when assigned to a circuit - ie all
  4 in box at top when completed the choices."* This is a real interaction
  paradigm shift from every match question so far: instead of one-option-
  per-column (even the duplicate-tolerant Q5 still had exactly 4 pool
  chips for 4 columns), here ONE formula must be assignable to MULTIPLE
  columns simultaneously (Zout≈RC to 3 different circuits at once) while
  the pool stays permanently visible/reusable — literally the "Option B"
  design offered (and declined) back when Q5 was first being designed,
  now genuinely needed.

  New `reusablePool: true` question flag, engine-wide: state changes from
  per-OPTION (`st.place[i] = column`) to per-COLUMN (`st.assign[colIdx] =
  option index`), since a single option can now belong to several columns
  at once — the old per-option model has no way to represent that. New
  `options()` shape: `{label, cols: [colIdx, ...]}` — the list of columns
  that option is a valid fill for, replacing the old single `col` field.
  Added a parallel render path (`renderMatchReusable()`,
  `selectPoolItemReusable()`, `assignToColumnReusable()`,
  `unassignColumnReusable()`) rather than overloading the existing
  `renderMatch()`/`selectPoolItem()`/etc. — the pool-never-empties behaviour
  and per-column assignment lookup are different enough mechanically that
  branching deep inside the existing functions would have made both harder
  to follow. `isAnswerCorrect`/`selectedLabel`/`fillCorrectSelection`/
  `checkAnswer`/`backQuestion`/`resetQuiz` (the shared engine functions
  touched by every match variant) each gained a `data.reusablePool` branch;
  Q4/Q5 (neither reusablePool) are unaffected, still resolve to their own
  original code paths.

  MIGRATED to the shared engine, `assets/quiz-engine.js`, same session,
  immediate follow-up — Phase 3 of a wider cert_iii migration (see the
  project's own "assets/quiz-engine.js migration assessment"; Phase 2 was
  the two `*_basics.html` templates). This file was picked to go first
  BECAUSE it had the newest mechanics (`matchByLabel`, `reusablePool`) —
  migrating it required actually adding those to the shared engine for the
  first time, not just reusing what Phase 2 already built. Also added to
  the shared engine as part of this migration: `showCircuitRef()` (this
  file's own default/'circuit' leftPanel fallback, dormant here since every
  question uses 'shapeGrid' or 'none', but real code this file already had
  and future circuit-per-question files will need) and two configurable
  globals, `SHAPE_VIEWBOX`/`MATCH_COL_TITLE_MAX_WIDTH` (this file's mini
  circuits render on a `0 0 140 200` viewBox, genuinely different from
  bjt_knowledge_basics.html's/digital_knowledge_basics.html's small BJT/
  waveform shapes on `-32 -36 96 76` — set as globals right after this
  file's own `<script src="quiz-engine.js">` tag, before resetQuiz()).
  `GRID_CIRCUIT_IDS`/`gridOptions()` (this file's own mini-circuit id list
  and options-builder helper) stay inline — genuinely page-specific, not
  shared-engine material. `swapLeftPanel()` needed no changes at all — this
  file's own version was already a strict SUBSET of the Phase-2 shared one
  (same shapeGrid/none/circuit-fallback logic, just without a 'viz' branch
  it never needed), so it was simply deleted in favour of the shared one.

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <title>BJT Knowledge Quiz — AC Parameters (Formula Review)</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <style>
    .formula-card {
      background: var(--colour-panel);
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-lg, 10px);
      padding: .9rem 1rem;
      margin-bottom: .8rem;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: .02em;
    }
    /* Q4-Q6 used to show a 3-term reciprocal-sum denominator (1/RB1 +
       1/RB2 + 1/[...]) here, which wrapped its third term onto its own
       row on phone-width screens at the default 1.2rem — this size was
       tuned for that. Q4-6 were later simplified to the plain "∥"
       shorthand (RB1∥RB2∥[...], one line, no fraction at all), which
       doesn't need shrinking on its own — but the override is left in
       place since it's still harmless/sensible for a formula-card in
       general, and Q2's own fraction options still benefit from it. */
    @media (max-width: 480px) {
      .formula-card { font-size: .88rem; }
      /* The shared .shape-grid is a fixed 4-column layout regardless of
         item count or screen width — fine on desktop, but crams every
         shapeGrid question in this file (Q4-6's circuit thumbnails, Q2's
         fraction-heavy formula boxes) into ~85px-wide cells on a 390px
         phone. Every shapeGrid question in this file only ever shows 2 or
         4 items, so 2 columns fits both cleanly — Q4-6's own 2-item grids
         fill the full row width instead of sitting at 1/4 width with two
         empty trailing cells, and Q2's 4 fraction boxes get roughly
         double the room. */
      #shapeGridCells { grid-template-columns: repeat(2, 1fr); }
      /* Q3's own correct/distractor options nest a reciprocal-sum fraction
         inside an outer fraction (three .working-frac levels stacked) —
         same wrapping risk as the sibling per-circuit files' own Zin
         options, same fix (see cert_iii_nested_frac_mobile_shrink memory):
         shrink just these option labels on phone width. (Q11-13's own
         Av-loaded options used to nest RC∥RL/RE∥RL the same way, but that
         got unwieldy — they were reverted to the plain "∥" shorthand, so
         this class is only load-bearing for Q3 now.) */
      .frac-option { font-size: .82em; }
    }
    /* Shape-valued match chips (none yet in this file, kept for parity
       with digital_knowledge_logic_gates.html's own match engine) */
    .match-chip-shape { padding: .15rem .3rem; }
    .match-col-items .match-chip-shape { width: auto; margin: 0 auto; }
    /* .match-col-title is styled uppercase site-wide for its normal case
       (a plain TEXT column title, e.g. digital_knowledge_logic_gates.html's
       gate names) — Q1 here uses shapeId circuit thumbnails as column
       titles instead of text, and that uppercase inherits down into any
       <text> drawn INSIDE the diagram (Common/Input/Output labels), which
       was never the intent. Reset it on the svg itself — resetting on a
       `text`/`tspan` descendant selector doesn't reach content painted via
       <use>, since the cloned instance isn't addressable that way; the
       inherited property still flows down from a real ancestor node like
       the svg element itself, so resetting there works. */
    .match-col-title svg { text-transform: none; }
  </style>
</head>

<body>
  <!-- Hidden defs: mini circuit-topology thumbnails for the shapeGrid
       recognition question — see header comment for what each represents.
       Deliberately stripped of resistor VALUES and text captions, same
       convention as bjt_knowledge_biasing.html's own thumbnail grid. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- ── shared primitives ── -->
      <g id="mbjt-npn-standard">
        <circle cx="7" cy="0" r="24" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
        <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />

      </g>

      <g id="mres-small"><rect x="-6" y="-10" width="12" height="20" rx="2" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="1.5" /></g>
      <g id="mcap">
        <line x1="-7" y1="-3" x2="7" y2="-3" style="stroke: var(--colour-capacitor)" stroke-width="2" />

        <line x1="-7" y1="3" x2="7" y2="3" style="stroke: var(--colour-capacitor)" stroke-width="2" />
      </g>
      <g id="mgnd">
        <line x1="0" y1="0" x2="0" y2="6" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
        <line x1="-9" y1="6" x2="9" y2="6" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
        <line x1="-5.5" y1="10" x2="5.5" y2="10" style="stroke: var(--colour-gnd)" stroke-width="1.2" />
        <line x1="-2.5" y1="14" x2="2.5" y2="14" style="stroke: var(--colour-gnd)" stroke-width="1.2" />
      </g>

      <!-- ── 1. Common Emitter — voltage-divider bias, RC + RE, no bypass ── -->
      <g id="mini-ce">
        <!-- VCC -->
        <line x1="20" y1="15" x2="150" y2="15" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <text x="70" y="8" style="fill: var(--colour-supply)" font-size="12" text-anchor="middle" font-weight="bold">+V<tspan baseline-shift="sub" font-size="8">CC</tspan></text>
        <!-- common ground line -->
        <line x1="20" y1="190" x2="150" y2="190" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <text x="75" y="199" style="fill: var(--colour-gnd)" font-size="9" text-anchor="middle" font-weight="bold">Common</text>
        <!-- VCC to common via RB1 and RB2 -->
        <line x1="45" y1="15" x2="45" y2="190" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <use href="#mres" transform="translate(45,58)" />
        <text x="20" y="62" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="12" font-weight="bold">R<tspan baseline-shift="-30%">B1</tspan></text>
        <use href="#mres" transform="translate(45,142)" />
        <text x="20" y="146" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="12" font-weight="bold">R<tspan baseline-shift="-30%">B2</tspan></text>
        <!-- Input to BJT -->
        <line x1="25" y1="100" x2="73" y2="100" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <text x="25" y="95" style="fill: var(--colour-signal)" font-size="7" text-anchor="middle" font-weight="bold">Input</text>
        <!-- VCC to BJT via RC -->
        <line x1="104" y1="15" x2="104" y2="66" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <use href="#mres" transform="translate(104,40)" />
        <text x="80" y="44" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="12" font-weight="bold">R<tspan baseline-shift="-30%">C</tspan></text>
        <!-- BJT to Common via RE -->
        <line x1="104" y1="134" x2="104" y2="190" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <use href="#mres" transform="translate(104,160)" />
        <text x="80" y="164" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="12" font-weight="bold">R<tspan baseline-shift="-30%">E</tspan></text>
        <!-- Output Vertical-->
        <line x1="105" y1="65" x2="130" y2="65" style="stroke: var(--colour-series)" stroke-width="1.5" />
        <text x="124" y="74" style="fill: var(--colour-signal)" font-size="7" text-anchor="middle" font-weight="bold">Output</text>
        <!-- BJT -->
        <g transform="translate(90,100)"><use href="#mbjt-npn-standard" /></g>
