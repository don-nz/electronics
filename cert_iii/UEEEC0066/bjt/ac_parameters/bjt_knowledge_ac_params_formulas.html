<!--
  "Quick reinforcement" quiz for the AC-parameters lesson, distinct from
  every other file in this folder: those are all CALCULATE-a-number quizzes
  tied to one specific circuit's own resistor values. This one drills the
  FORMULAS themselves — symbolic, no numbers — across all four circuit
  variants this lesson covers: common emitter (bjt_knowledge_ac_params_ce.
  html), common collector (_cc.html), CE with the emitter fully bypassed
  (_ce_bypassed.html), and CE with the emitter only partially bypassed
  (_ce_part_bypassed.html). User: *"I'd like to create a quick quiz for ac
  parameters that reinforces the formulas used to work out the AC values...
  I'd like to cover the formulas for different circuits - common emitter,
  common [collector], emitter bypass, partial emitter bypass. Can I start
  with just 1 question and build from there? Q1. Zin ="*

  Q1 REBUILT same session, immediate follow-up, replacing an earlier plain-MC
  draft of this same question. User: *"I'd like to approach this in a
  different way to the other quizzes in this section. Zin = RB1 || RB2 ||
  Beta x (RE + re) (colour coded and using numerator over denominator
  format). This formula is used to calculate the AC input resistance for a
  circuit. Choose all circuits that it is used with. See Q1 of
  bjt_knowledge_biasing.html for an example of the format I would like."*
  Confirmed via question: replace the old MC-only Q1 rather than keep both.

  Format ported from bjt_knowledge_biasing.html's own Q1: a formula is shown
  once, then a `leftPanel:'shapeGrid'` multi-select grid of small circuit
  thumbnails lets the student pick every circuit that formula genuinely
  applies to — testing formula-to-circuit RECOGNITION, not just formula
  recall in isolation. Engine gained the full shapeGrid apparatus (was
  previously the simpler no-diagram engine copied from digital_knowledge_
  logic_families.html) — circuit-col/circuit-panel/shapeGridPanel restored,
  `.single-col` dropped, `renderShapeGrid()`/`showCircuitRef()` ported in
  verbatim from bjt_knowledge_biasing.html. `kind:'match'` support kept too,
  even though unused so far, since a future question in this quiz (matching
  each circuit type to its own Zb formula) is an obvious, likely next step.

  Four NEW mini circuit thumbnails built for the shapeGrid (140×200 viewBox,
  same coordinate scale/primitives as bjt_knowledge_biasing.html's own
  6-circuit grid — mbjt-npn-standard/mres/mgnd copied verbatim, plus a new
  mcap primitive for the bypass-capacitor variants that file never needed):
  `mini-ce` (voltage-divider bias, RC top, RE bottom, no bypass — literally
  bjt_knowledge_biasing.html's own npn-divider-pos topology, redrawn since
  this is a separate file), `mini-cc` (same base-divider, but the collector
  wire runs straight to +VCC with NO RC box, output implicitly the emitter —
  the common-collector topology), `mini-ce-bypassed` (mini-ce plus a bypass
  capacitor branch in parallel with the FULL RE), `mini-ce-part-bypassed`
  (mini-ce but RE split into two smaller stacked boxes RE1/RE2, with the
  bypass capacitor in parallel with ONLY the lower one, RE2 — matching
  bjt_knowledge_ac_params_ce_part_bypassed.html's own real topology).
  Deliberately no text captions on the thumbnails (matching biasing.html's
  own convention) — the whole point is visual topology recognition, not
  label-reading.

  The formula given — Zin = RB1∥RB2∥β×(RE+re′) — is CE's own Zin/Zb shape
  (see bjt_knowledge_ac_params_ce.html's own Q2/Q3). Verified against every
  sibling file's own Zb formula before writing this question (not assumed):
  CE and CC both genuinely use β×(RE+re′) — confirmed identical in
  bjt_knowledge_ac_params_cc.html's own Q2, since Zb is a base-side property
  that doesn't care whether the output is later tapped from the collector
  (CE) or the emitter (CC). The two bypass variants do NOT match: fully-
  bypassed uses β×re′ alone (no RE term at all — bjt_knowledge_ac_params_ce_
  bypassed.html Q2), and partially-bypassed uses β×(RE1+re′) — a different
  SYMBOL (RE1, the still-unbypassed portion) substituted in place of the
  full RE (bjt_knowledge_ac_params_ce_part_bypassed.html Q2) — a deliberate
  "looks similar, wrong resistor" near-miss distractor circuit. So the
  correct answer is exactly 2 of the 4 shown circuits: Common Emitter and
  Common Collector.

  "Colour coded and using numerator over denominator format" (the user's
  own formatting instruction) went through a few rounds before landing on
  its final form. First pass left the ∥ terms inline (no literal division).
  User then asked for "3 layers" — tried stacking RB1/RB2/β×(RE+re′) as 3
  rows with divider lines, but that's mathematically wrong (reads as nested
  DIVISION, not parallel combination) — user caught this mid-turn ("isn't
  it: 1"). Fixed to the actual textbook identity: Zin = 1/(1/RB1 + 1/RB2 +
  1/[...]), via `frac('1', denominatorString)`. Final refinement, matching
  a hand-drawn class-notes sketch: each reciprocal term ALSO renders as its
  own small stacked fraction (frac() nested two levels deep), not inline
  "1/RB1" text — `.working-frac`'s existing CSS (inline-flex column,
  vertical-align:middle) handles the nesting with zero new CSS. Applies to
  every question below.

  Question-pool randomization added: `resetQuiz()` calls `shuffle(QUESTIONS)`
  before mapping to `Q[]` state, same convention as digital_gate_
  identification.html — every question in the pool appears, just reordered
  fresh on every page load and every "↺ Restart" click.

  Q2 and Q3 added same session, immediate follow-up. User: *"Can you add the
  same question but for the 2 other circuits? ie partially bypassed and
  fully bypassed? The same mini circuit selections are perfect."* Same 4
  circuits, same shapeGrid, same question SHAPE as Q1 — only the formula
  shown and which circuit(s) count as correct change. Refactored `options`
  into a shared `gridOptions(correctIds)` builder (`GRID_CIRCUIT_IDS` is now
  just a flat 4-id array, no per-question `matches` flag baked in) so all
  three questions reuse one small helper instead of three separate shuffle/
  map blocks. Q2: Zin using β×re′ (fully-bypassed Zb, no RE term at all) —
  matches ONLY mini-ce-bypassed, the other 3 circuits all keep at least a
  partial RE term in their own Zb. Q3: Zin using β×(RE1+re′) (partially-
  bypassed Zb) — matches ONLY mini-ce-part-bypassed; CE/CC use the full RE
  (not RE1) and the fully-bypassed circuit has no resistor term at all, so
  neither is a valid near-miss here despite superficial shape similarity.

  Q4 added same session, immediate follow-up — a `kind:'match'` question,
  the FIRST in this file to actually use it (kept wired in since Q1's own
  build but unused until now). User: *"I'd like to add a question based on:
  UEEEC0069 -> digital_knowledge_logic_gates.html -> Q2. The 4 mini circuits
  will be below and the names of each in the select box. The idea is match
  the name to the circuit."* Ported that file's own Q2 pattern exactly:
  `columns()` returns the 4 mini circuits as `{ shapeId }` (rendered as SVG
  thumbnails instead of text column headers), `options()` is the POOL — 4
  plain-text circuit names the student drags/clicks into the column they
  belong under. `col` index for each pool option is looked up via
  `GRID_CIRCUIT_IDS.indexOf(id)` rather than hardcoded 0-3, so the match
  stays correct even if that array's order ever changes.

  Upgrading `matchChipContent()`/`renderMatch()` to support `{shapeId}`
  columns required porting logic_gates.html's more capable version wholesale
  (the version copied in earlier only handled plain-string columns, since no
  question needed shapes-as-columns until now) — column titles now render
  via `<svg viewBox="0 0 140 200"><use href="#id"/></svg>`, this file's own
  mini-circuit viewBox convention (logic_gates.html's own version uses ITS
  gate shapes' 96-unit viewBox instead — swapped for the correct one here,
  not copied verbatim). Also ported a `.match-chip-shape` CSS override into
  this file's own `<head>` (logic_gates.html defines it locally too, not in
  quiz-common.css) — unused by Q4 itself (the pool holds text, not shapes)
  but kept for parity/future use.

  `leftPanel` gained a third value, `'none'` (Q4 uses it) — collapses the
  layout to a single centred column via `.quiz-wrap.single-col` (already
  defined in quiz-common.css, added when logic_gates.html was built) rather
  than showing an empty/irrelevant circuit-panel. Replaced the old inline
  circuit-panel-visibility lines in `renderQuestion()` with a dedicated
  `swapLeftPanel(mode)` function (ported from logic_gates.html's own,
  extended with the 3rd default/circuitId-reference mode this file still
  needs for parity with its siblings, even though no question here uses it
  yet).

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.
-->

  <script>
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see bjt_knowledge_basics.html's header comment for the
    // full field reference. This file also uses leftPanel 'shapeGrid' (see
    // bjt_knowledge_biasing.html's own header comment for that mechanic).
    // resetQuiz() shuffles this array's ORDER on every load/restart (same
    // convention as digital_gate_identification.html) — every question in
    // the pool still appears, just in a random order each time, not a
    // fixed Q1/Q2/Q3 sequence.
    // Currently Q1-3 — same 4-circuit shapeGrid reused by all three, each
    // asking which circuit(s) a different Zb variant's Zin formula applies
    // to (unbypassed CE+CC / fully bypassed / partially bypassed).
    // ══════════════════════════════════════════════════════════════════════

    const GRID_CIRCUIT_IDS = ['mini-ce', 'mini-cc', 'mini-ce-bypassed', 'mini-ce-part-bypassed'];
    // Shared options()-builder for every question in this quiz — same 4
    // circuits every time, only WHICH id(s) count as correct changes.
    function gridOptions(correctIds) {
      return () => shuffle(GRID_CIRCUIT_IDS.map(id => ({ label: id, type: correctIds.includes(id) ? 'correct' : 'wrong', shapeId: id })));
    }

    const QUESTIONS = [
      {
        leftPanel: 'shapeGrid',
        kind: 'multi',
        text: () => `
    <div class="formula-card"><b class="colour-gain">Z<sub>in</sub></b> = ${frac(
      '1',
      `${frac('1', '<b class="colour-resistor">R<sub>B1</sub></b>')} + ${frac('1', '<b class="colour-resistor">R<sub>B2</sub></b>')} + ${frac('1', '<b class="colour-bjt">β</b>×(<b class="colour-resistor">R<sub>E</sub></b>+<b class="colour-bjt">r<sub>e</sub>′</b>)')}`
    )}</div>
    This formula is used to calculate the AC input resistance for a circuit. <b style="color:var(--colour-ui-primary)">Click</b> every circuit below that it applies to.`,
        hint: () => 'Ask: does this circuit\'s FULL emitter resistor sit in the AC signal path, with no capacitor bypassing any part of it? A bypass capacitor — full or partial — changes what "RE" means in the formula, even if the rest of the shape still looks familiar.',
        options: gridOptions(['mini-ce', 'mini-cc']),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(' & ');
          return `Circuits <b>${nums}</b> — Common Emitter and Common Collector`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(' & ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(' & ');
          return `
    <div class="working-step">Circuits ${correctNums} — Common Emitter and Common Collector:</div>
    <div class="working-line">Both circuits have their FULL emitter resistor <b class="colour-resistor">RE</b> sitting in the AC signal path with no bypass capacitor anywhere near it — so from the base's point of view, <b class="colour-bjt">β</b> multiplies the WHOLE (<b class="colour-resistor">RE</b> + <b class="colour-bjt">re′</b>) combination. This formula doesn't care whether the amplified output happens to be taken from the collector (CE) or the emitter (CC) — <b class="colour-gain">Zb</b> is purely a base-side property, decided entirely by what's in the emitter leg.</div>
    <div class="working-step" style="margin-top:.6rem">Circuits ${wrongNums} — don't match:</div>
    <div class="working-line">The fully-bypassed CE circuit shorts <b class="colour-resistor">RE</b> out of the AC path entirely with a bypass capacitor — its own Zb formula is just <b class="colour-bjt">β</b> × <b class="colour-bjt">re′</b>, with no RE term left at all.</div>
    <div class="working-total">The partially-bypassed CE circuit only bypasses PART of the emitter resistance — its own Zb formula uses <b class="colour-resistor">RE1</b> (the still-unbypassed portion) in place of the full <b class="colour-resistor">RE</b>. It LOOKS similar to this formula's shape, but a genuinely different resistor is being substituted in — a common trap if you're pattern-matching on shape alone rather than checking exactly which resistor sits in the AC path.</div>`;
        }
      },
      {
        leftPanel: 'shapeGrid',
        kind: 'multi',
        text: () => `
    <div class="formula-card"><b class="colour-gain">Z<sub>in</sub></b> = ${frac(
      '1',
      `${frac('1', '<b class="colour-resistor">R<sub>B1</sub></b>')} + ${frac('1', '<b class="colour-resistor">R<sub>B2</sub></b>')} + ${frac('1', '<b class="colour-bjt">β</b>×<b class="colour-bjt">r<sub>e</sub>′</b>')}`
    )}</div>
    This formula is used to calculate the AC input resistance for a circuit. <b style="color:var(--colour-ui-primary)">Click</b> every circuit below that it applies to.`,
        hint: () => 'Ask: is the emitter resistor shorted completely out of the AC path by a bypass capacitor, leaving NOTHING but re′ in the base-impedance term?',
        options: gridOptions(['mini-ce-bypassed']),
        correctExplain: (st) => {
          const num = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join('');
          return `Circuit <b>${num}</b> — CE with the emitter fully bypassed`;
        },
        working: (st) => {
          const correctNum = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join('');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(' & ');
          return `
    <div class="working-step">Circuit ${correctNum} — CE, fully bypassed:</div>
    <div class="working-line">A bypass capacitor shorts the ENTIRE <b class="colour-resistor">RE</b> to AC ground — from the base's point of view, the emitter leg contains nothing but the transistor's own <b class="colour-bjt">re′</b>. No resistor term survives in <b class="colour-gain">Zb</b> at all.</div>
    <div class="working-step" style="margin-top:.6rem">Circuits ${wrongNums} — don't match:</div>
    <div class="working-line">Common Emitter and Common Collector both keep the FULL <b class="colour-resistor">RE</b> in the AC path — their own Zb is β×(RE+re′), a genuinely bigger formula than this one. The partially-bypassed circuit keeps its unbypassed portion (<b class="colour-resistor">RE1</b>) in the formula too — β×(RE1+re′) — close in shape, but still has a resistor term this fully-bypassed formula simply doesn't have.</div>`;
        }
      },
      {
        leftPanel: 'shapeGrid',
        kind: 'multi',
        text: () => `
    <div class="formula-card"><b class="colour-gain">Z<sub>in</sub></b> = ${frac(
      '1',
      `${frac('1', '<b class="colour-resistor">R<sub>B1</sub></b>')} + ${frac('1', '<b class="colour-resistor">R<sub>B2</sub></b>')} + ${frac('1', '<b class="colour-bjt">β</b>×(<b class="colour-resistor">R<sub>E1</sub></b>+<b class="colour-bjt">r<sub>e</sub>′</b>)')}`
    )}</div>
    This formula is used to calculate the AC input resistance for a circuit. <b style="color:var(--colour-ui-primary)">Click</b> every circuit below that it applies to.`,
        hint: () => 'Ask: is the emitter resistance split into two separate resistors, with only ONE of them (RE1) still sitting in the AC path — the other shorted out by its own bypass capacitor?',
        options: gridOptions(['mini-ce-part-bypassed']),
        correctExplain: (st) => {
          const num = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join('');
          return `Circuit <b>${num}</b> — CE with the emitter partially bypassed`;
        },
        working: (st) => {
          const correctNum = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join('');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(' & ');
          return `
    <div class="working-step">Circuit ${correctNum} — CE, partially bypassed:</div>
    <div class="working-line">Only the LOWER portion of the split emitter resistance (<b class="colour-resistor">RE2</b>) is shorted to AC ground by its own bypass capacitor — <b class="colour-resistor">RE1</b>, the still-unbypassed portion, remains in the AC path and keeps its own place in <b class="colour-gain">Zb</b>'s formula.</div>
    <div class="working-step" style="margin-top:.6rem">Circuits ${wrongNums} — don't match:</div>
    <div class="working-line">Common Emitter and Common Collector both use the FULL <b class="colour-resistor">RE</b> (not just a portion of it) — β×(RE+re′), a genuinely different resistor. The fully-bypassed circuit has no resistor term left at all — β×re′ — since its entire RE is bypassed, not just part of it.</div>`;
        }
      },
      {
        leftPanel: 'none',
        kind: 'match',
        columns: () => GRID_CIRCUIT_IDS.map(id => ({ shapeId: id })),
        text: () => 'Match each circuit below to its correct name.',
        hint: () => 'Check three things: is there a resistor at the top (RC)? Is there a bypass capacitor at all? If there is one, does it sit beside the WHOLE emitter resistor, or just part of a SPLIT one?',
        options: () => shuffle([
          { label: 'Common Emitter', col: GRID_CIRCUIT_IDS.indexOf('mini-ce') },
          { label: 'Common Collector', col: GRID_CIRCUIT_IDS.indexOf('mini-cc') },
          { label: 'CE — Fully Bypassed', col: GRID_CIRCUIT_IDS.indexOf('mini-ce-bypassed') },
          { label: 'CE — Partially Bypassed', col: GRID_CIRCUIT_IDS.indexOf('mini-ce-part-bypassed') },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 circuits named correctly' : `${st.opts.length - wrongCount} of ${st.opts.length} circuits named correctly`;
        },
        working: (st) => {
          const mistakes = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).map(o => o.label);
          const mistakeLine = mistakes.length
            ? `<div class="working-step" style="margin-top:.6rem">Misplaced:</div><div class="working-line">${mistakes.join(', ')}</div>`
            : '';
          return `
    <div class="working-step">Reading each circuit:</div>
    <div class="working-line"><b class="colour-gain">Common Emitter</b> — a resistor at the top (RC), a single resistor at the bottom (RE), no bypass capacitor anywhere. <b class="colour-gain">Common Collector</b> — same base-divider, but NO resistor at the top at all — a straight wire to +VCC — the giveaway that this stage has no RC and the output must come from the emitter instead.</div>
    <div class="working-line" style="margin-top:.4rem"><b class="colour-gain">CE — Fully Bypassed</b> — RC present, plus a bypass capacitor sitting alongside the WHOLE emitter resistor. <b class="colour-gain">CE — Partially Bypassed</b> — RC present, the emitter resistor split into two stacked resistors, with the bypass capacitor only alongside the LOWER one.</div>
    ${mistakeLine}`;
        }
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // (Same as bjt_knowledge_biasing.html's own engine — leftPanel
    // 'shapeGrid' support plus 'multi'/'match' kinds.)
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isMatch(data) { return data.kind === 'match'; }

    // ── kind:'match' — columns() may return plain strings OR `{ shapeId }`
    // (rendered as one of this file's own mini circuit thumbnails instead
    // of text — see digital_knowledge_logic_gates.html's own Q2 for the
    // pattern this was ported from). Pool/placed chips work the same way
    // via opt.shapeId, though no question here uses that side of it yet.
    function matchChipContent(opt, constrained) {
      if (!opt.shapeId) return opt.label;
      const svgStyle = constrained ? 'width:100%;max-width:92px;height:auto;display:block' : 'width:92px;height:auto;display:block';
      return `<svg viewBox="0 0 140 200" style="${svgStyle}"><use href="#${opt.shapeId}"/></svg>`;
    }
    function renderMatch() {
      const st = Q[cur], data = QUESTIONS[cur];
      const cols = data.columns();

      const picking = st.sel !== null;
      const poolHasItems = st.opts.some((_, i) => st.place[i] === null);
      const needsPick = !st.ans && !picking && poolHasItems;
      document.getElementById('matchPoolRow').classList.toggle('needs-pick', needsPick);
      document.getElementById('matchPool').classList.toggle('needs-pick', needsPick);

      const pool = document.getElementById('matchPool');
      pool.innerHTML = '';
      st.opts.forEach((opt, i) => {
        if (st.place[i] !== null) return;
        const chip = document.createElement('button');
        const isPicked = st.sel === i;
        chip.className = 'match-chip' + (isPicked ? ' picked' : '') + (opt.shapeId ? ' match-chip-shape' : '');
        chip.innerHTML = matchChipContent(opt);
        chip.disabled = st.ans || (picking && !isPicked);
        if (!chip.disabled) chip.addEventListener('click', (e) => { e.stopPropagation(); selectPoolItem(i); });
        pool.appendChild(chip);
      });

      const colsEl = document.getElementById('matchColumns');
      colsEl.innerHTML = '';
      const maxCols = window.innerWidth < 500 ? 2 : 4;
      colsEl.style.gridTemplateColumns = `repeat(${Math.min(cols.length, maxCols)}, 1fr)`;
      cols.forEach((col, colIdx) => {
        const colDiv = document.createElement('div');
        colDiv.className = 'match-column';
        colDiv.addEventListener('click', () => assignToColumn(colIdx));

        const arrow = document.createElement('div'); arrow.className = 'match-col-arrow'; arrow.textContent = '▼';
        const title = document.createElement('div'); title.className = 'match-col-title';
        title.innerHTML = (typeof col === 'string') ? col : `<svg viewBox="0 0 140 200" style="width:100%;max-width:110px;display:block;margin:0 auto"><use href="#${col.shapeId}"/></svg>`;
        const items = document.createElement('div'); items.className = 'match-col-items';

        st.opts.forEach((opt, i) => {
          if (st.place[i] !== colIdx) return;
          const chip = document.createElement('button');
          chip.className = 'match-chip' + (opt.shapeId ? ' match-chip-shape' : '');
          chip.innerHTML = matchChipContent(opt, true);
          if (st.ans) {
            chip.disabled = true;
            chip.classList.add(st.place[i] === st.cor[i] ? 'correct' : 'wrong');
          } else {
            chip.disabled = picking;
            if (!chip.disabled) chip.addEventListener('click', (e) => { e.stopPropagation(); unassignItem(i); });
          }
          items.appendChild(chip);
        });

        colDiv.append(arrow, title, items);
        colDiv.classList.toggle('droppable', !st.ans && picking);
        colsEl.appendChild(colDiv);
      });
    }
    function selectPoolItem(i) {
      const st = Q[cur];
      if (st.ans) return;
      st.sel = (st.sel === i) ? null : i;
      renderQuestion();
    }
    function assignToColumn(colIdx) {
      const st = Q[cur];
      if (st.ans || st.sel === null) return;
      st.place[st.sel] = colIdx;
      st.sel = null;
      renderQuestion();
    }
    function unassignItem(i) {
      const st = Q[cur];
      if (st.ans) return;
      st.place[i] = null;
      renderQuestion();
    }

    // ── leftPanel:'shapeGrid' — ported from bjt_knowledge_biasing.html.
    function renderShapeGrid() {
      const st = Q[cur];
      const c = document.getElementById('shapeGridCells'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const cell = document.createElement('div'); cell.className = 'shape-cell';
        const selected = st.sel.includes(i);
        if (st.ans) {
          if (opt.type === 'correct') cell.classList.add(selected ? 'correct' : 'missed');
          else cell.classList.add(selected ? 'wrong' : 'dimmed');
        } else {
          if (selected) cell.classList.add('selected');
          cell.addEventListener('click', () => selectOption(i));
        }
        cell.innerHTML = `<span class="shape-num">${i + 1}</span><svg viewBox="0 0 140 200"><use href="#${opt.shapeId}"/></svg>`;
        c.appendChild(cell);
      });
    }

    function showCircuitRef(id, label) {
      document.getElementById('circuitRefUse').setAttribute('href', '#' + id);
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
    }

    // leftPanel: 'shapeGrid' (the 4-circuit grid) | 'none' (no left column
    // at all — collapses to single-col, for match questions with their own
    // full-width columns) | unset (a single circuitId reference diagram,
    // unused so far in this file but kept for parity with its siblings).
    function swapLeftPanel(mode) {
      document.getElementById('qShapeGridPanel').style.display = mode === 'shapeGrid' ? 'block' : 'none';
      document.querySelector('.circuit-panel').style.display = (mode === 'shapeGrid' || mode === 'none') ? 'none' : '';
      document.querySelector('.circuit-col').style.display = mode === 'none' ? 'none' : '';
      document.getElementById('quizWrap').classList.toggle('single-col', mode === 'none');
    }

    function isAnswerCorrect(data, st) {
      if (isMatch(data)) return st.place.every((p, i) => p === st.cor[i]);
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (isMatch(data)) {
        const correctCount = st.place.filter((p, i) => p === st.cor[i]).length;
        return `${correctCount} / ${st.opts.length} correctly placed`;
      }
      const asLabel = i => data.leftPanel === 'shapeGrid' ? (i + 1) : LETTERS[i];
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(asLabel).join(', ') : '—';
    }
    function fillCorrectSelection(i) {
      const data = QUESTIONS[i], st = Q[i];
      if (isMatch(data)) st.place = st.cor.slice();
      else if (isMulti(data)) st.sel = [...st.cor];
      else st.sel = st.cor;
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur], multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        const selected = multi ? st.sel.includes(i) : i === st.sel;
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (opt.type === 'correct') {
            const missed = multi && !selected;
            btn.classList.add(missed ? 'missed' : 'correct');
            btn.innerHTML += `<span class="result-icon">${missed ? '○' : '✓'}</span>`;
          } else if (selected) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
          else btn.classList.add('dimmed');
        } else {
          if (selected) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text(st);
      document.getElementById('qHint').innerHTML = data.hint(st);

      swapLeftPanel(data.leftPanel);
      if (data.leftPanel !== 'shapeGrid' && data.leftPanel !== 'none') showCircuitRef(data.circuitId, data.circuitLabel);

      document.getElementById('qMatch').style.display = isMatch(data) ? 'flex' : 'none';
      document.getElementById('qOptions').style.display = (isMatch(data) || data.leftPanel === 'shapeGrid') ? 'none' : '';
      if (isMatch(data)) {
        renderMatch();
      } else if (data.leftPanel === 'shapeGrid') {
        renderShapeGrid();
      } else {
        renderOptions();
      }

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        const asLabel = i => data.leftPanel === 'shapeGrid' ? (i + 1) : LETTERS[i];
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(asLabel).join(', ')}`
          : (data.leftPanel === 'shapeGrid' ? 'Click the circuits above to select your answer.' : 'Click every option that applies.');
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (
        isMatch(data) ? !st.place.every(p => p !== null) :
        (multi ? st.sel.length === 0 : st.sel === null)
      );
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMatch(data)) { if (!st.place.every(p => p !== null)) return; }
      else if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function scrollToQuestionTop() {
      document.getElementById('qPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); scrollToQuestionTop(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        const data = QUESTIONS[i];
        Q[i].ans = false;
        if (isMatch(data)) { Q[i].place = Q[i].opts.map(() => null); Q[i].sel = null; }
        else Q[i].sel = isMulti(data) ? [] : null;
      }
      renderQuestion();
      scrollToQuestionTop();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
      scrollToQuestionTop();
    }

    function resetQuiz() {
      shuffle(QUESTIONS);
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMatch(data)) {
          const cor = opts.map(o => o.col);
          return { sel: null, ans: false, cor, opts, place: opts.map(() => null) };
        }
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text(st)}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) { fillCorrectSelection(i); Q[i].ans = true; }
      goToQuestion(n);
      if (answered) { fillCorrectSelection(cur); checkAnswer(); }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        fillCorrectSelection(i);
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
    }
  </script>
</body>
