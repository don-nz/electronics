<!--
  Knowledge quiz cloned from bjt_knowledge_ac_params_ce.html (which
  remains unchanged) at the user's request: *"Can you please clone the ce
  quiz and add a bypass capacitor between RE and GND? I am interested in
  seeing how the calculations work with one in."* Same worked NPN stage
  (BC549, β=200, R1=120kΩ/R2=15kΩ/RC=1.8kΩ/RE=270Ω/VCC=12V, IE≈2.716mA —
  ALL identical to the unbypassed file, since a bypass capacitor only
  changes AC behaviour, not the DC bias point), now with a bypass
  capacitor CE wired in parallel with RE, straight to AC ground.

  THE ACTUAL PAYOFF (what changes vs. the unbypassed/"swamped" version):
  at signal frequencies CE looks like a short, so RE is entirely removed
  from the AC emitter leg — the base now only ever "sees" the
  transistor's own re′ reflected by β, not (RE+re′). This changes THREE
  of the five formulas:
    Zb   = β×re′            (was β×(RE+re′) — RE has dropped out)
    Zin  = R1∥R2∥Zb         (same shape, but Zb is now MUCH smaller —
                              ≈1.91kΩ vs ≈55.9kΩ unbypassed — so Zb
                              becomes the smallest of the three parallel
                              resistances and DOMINATES Zin, the exact
                              opposite of the unbypassed circuit where
                              R1∥R2 dominated)
    Av   ≈ RC/re′            (was RC/(RE+re′) — re′ alone in the
                              denominator gives roughly a 29× bigger
                              gain, ≈188 vs ≈6.44 unbypassed)
  re′ (Q1) and Zout (Q4) are UNCHANGED from the unbypassed file — re′
  only depends on IE, which the bypass cap can't touch (DC bias is
  unaffected); Zout only depends on the collector side (≈RC), which the
  emitter-side bypass cap has no path to. Both questions explicitly say
  so in their own `working` text, since "which formulas change and which
  don't" is exactly the point of this file existing.

  This is the classic swamped-vs-bypassed trade-off: the unbypassed
  ("swamped") stage trades away gain for a STABLE Av that barely depends
  on β or temperature (since re′ is swamped by the much larger RE); this
  bypassed stage trades that stability away for maximum gain, since Av
  now depends directly on re′ — which itself depends on IE, which drifts
  with temperature and varies BJT-to-BJT. Q5's working makes this
  explicit.

  Circuit diagram: identical `ce-divider-ac`-style large-scale WIRES/
  NODES layout (renamed `ce-divider-ac-bypassed` to keep this file's own
  copy clearly distinct — no shared JS/defs file exists project-wide, so
  there's no risk of an ID clash with the unbypassed file, this is purely
  for a reader's clarity), with one addition: a new parallel branch off
  the emitter node (same node RE's own top lead connects to), running
  right of RE, down through a new bypass-capacitor symbol (`cap-shape`
  reused, rotated 90° so its plates read as horizontal bars across a
  VERTICAL wire instead of Cin/Cout's own horizontal orientation),
  labelled C_E, landing back on the GND rail.

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.

  Migrated to the shared cert_iii/assets/quiz-engine.js engine, same
  recipe as bjt_knowledge_ac_params_ce.html: CIRCUIT_SVG_ID='circuitRefSvg',
  DEFAULT_CIRCUIT_VIEWBOX=DEFAULT_VIEWBOX, CIRCUIT_REF_EXTRA toggles the
  ieIndCe ammeter, SUMMARY_CIRCUIT_REF points at ce-divider-ac-bypassed,
  RENDER_EXTRA re-runs updateReReveal/updateZReveal every render.
-->

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

    <!-- Zoom modal — copies circuitRefSvg's current innerHTML/viewBox in on open. -->
    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalTitle">Reference Circuit</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="-10 -10 690 570" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

  </div>

  <script>
    const DEFAULT_VIEWBOX = '-10 -10 690 570';
    CIRCUIT_SVG_ID = 'circuitRefSvg';
    DEFAULT_CIRCUIT_VIEWBOX = DEFAULT_VIEWBOX;
    CIRCUIT_REF_EXTRA = (id, loadTerminal, ammeter) => {
      document.getElementById('ieIndCe').setAttribute('display', ammeter ? 'inline' : 'none');
    };
    SUMMARY_CIRCUIT_REF = { id: 'ce-divider-ac-bypassed', label: 'Common Emitter (voltage-divider bias, RE bypassed)', viewBox: DEFAULT_VIEWBOX };

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — Q1-5, cloned from bjt_knowledge_ac_params_ce.html's own
    // Q1-5. Q1 (re′) and Q4 (Zout) are formula-identical to that file — the
    // bypass capacitor doesn't touch DC bias or the collector side. Q2
    // (Zb), Q3 (Zin) and Q5 (Av) use the bypassed-RE formulas instead. See
    // bjt_knowledge_basics.html's header comment for the full field
    // reference.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'ce-divider-ac-bypassed',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE bypassed)',
        circuitAmmeter: true,
        text: () => 'What is <b class="colour-bjt">r<sub>e</sub>′</b> for this <b style="color:var(--colour-ui-primary)">common-emitter</b> stage when the emitter is <b style="color:var(--colour-ui-primary)">bypassed</b>?',
        hint: () => 're′ = VT/IE, using the standard room-temperature approximation VT ≈ 26 mV.',
        options: () => shuffle([
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 mV', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 mV', '2.716 mA')} ≈ 9.57 Ω`, type: 'correct' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 V', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 V', '2.716 mA')} ≈ 9,573 Ω`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ 26 Ω`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('<b class="colour-current">I<sub>E</sub></b>', '26 mV')} ≈ ${frac('2.716 mA', '26 mV')} ≈ 0.104 Ω`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-bjt">r<sub>e</sub>′</b> ≈ 9.57 Ω',
        working: () => `
    <div class="working-formula-row"><b class="colour-bjt">r<sub>e</sub>′</b> = ${frac('V<sub>T</sub>', 'I<sub>E</sub>')} ≈ ${frac('26 mV', '2.716 mA')}</div>
    <div class="working-total"><b class="colour-bjt">r<sub>e</sub>′</b> ≈ 9.57 Ω — identical to the unbypassed circuit's own re′, since the bypass capacitor only changes AC behaviour, never the DC bias point (and IE) it's derived from. Keep this value, every AC parameter from here on uses it.</div>`
      },
      {
        circuitId: 'ce-divider-ac-bypassed',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE bypassed)',
        text: () => 'The bypass capacitor <b class="colour-cap">C<sub>E</sub></b> is a short circuit at signal frequencies, connecting the emitter directly to AC ground. What is the <b style="color:var(--colour-ui-primary)">AC</b> resistance looking directly into the base, <b class="colour-resistor">Z<sub>b</sub></b>, now?',
        hint: () => 'With CE shorting the emitter to AC ground, RE is no longer part of the AC emitter leg at all — the base only ever sees the transistor\'s own re′, reflected by β. Zb = β × re′.',
        options: () => shuffle([
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">β</b> × <b class="colour-bjt">re′</b> = 200 × 9.57 Ω ≈ 1.91 kΩ`, type: 'correct' },
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">RE</b> + <b class="colour-bjt">re′</b>) = 200 × (270 Ω + 9.57 Ω) ≈ 55.9 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">Zb</b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">RE</b> = 200 × 270 Ω ≈ 54 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">re′</b> / <b class="colour-bjt">β</b> = 9.57 Ω / 200 ≈ 0.048 Ω`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × r<sub>e</sub>′ ≈ 1.91 kΩ',
        working: () => `
    <div class="working-line"><b class="colour-cap">C<sub>E</sub></b> shorts <b class="colour-resistor">R<sub>E</sub></b> to AC ground, so it drops out of the AC emitter leg entirely — only the transistor's own internal r<sub>e</sub>′ is left there, still reflected into the base β times bigger.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × r<sub>e</sub>′ = 200 × 9.57 Ω</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>b</sub></b> ≈ 1,915 Ω ≈ 1.91 kΩ — dramatically SMALLER than the unbypassed circuit's own Zb (≈55.9 kΩ), since re′ alone (9.57 Ω) is so much smaller than RE+re′ (279.57 Ω). Keep this value, it's used again in the next question.</div>`
      },
      {
        circuitId: 'ce-divider-ac-bypassed',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE bypassed)',
        text: () => 'What is the <b style="color:var(--colour-ui-primary)">AC</b> input resistance <b class="colour-resistor">Z<sub>in</sub></b> seen by the signal source?',
        hint: () => 'Same shape as always: R1, R2 and Zb are all three connected between the base node and AC ground — three resistances in PARALLEL. This time Zb itself is the small one.',
        options: () => shuffle([
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b>∥<b class="colour-resistor">R2</b>∥<b class="colour-gain">Zb</b> = 120 kΩ∥15 kΩ∥1.91 kΩ ≈ 1.67 kΩ', type: 'correct' },
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b> + <b class="colour-resistor">R2</b> + <b class="colour-gain">Zb</b> = 120 kΩ + 15 kΩ + 1.91 kΩ ≈ 136.9 kΩ', type: 'wrong' },
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b>∥<b class="colour-resistor">R2</b> = 120 kΩ∥15 kΩ ≈ 13.3 kΩ', type: 'wrong' },
          { label: '<b class="colour-gain">Zin</b> ≈ <b class="colour-gain">Zb</b> = 1.91 kΩ', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>in</sub></b> = R1∥R2∥<b class="colour-resistor">Z<sub>b</sub></b> ≈ 1.67 kΩ',
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>in</sub></b> = R1 ∥ R2 ∥ <b class="colour-resistor">Z<sub>b</sub></b></div>
    <div class="working-line">${frac('1', '<b class="colour-resistor">Z<sub>in</sub></b>')} = ${frac('1', '120,000')} + ${frac('1', '15,000')} + ${frac('1', '1,915')} ≈ 0.000597 Ω⁻¹</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>in</sub></b> ≈ 1,674 Ω ≈ 1.67 kΩ — this time it's <b class="colour-resistor">Z<sub>b</sub></b> (1.91 kΩ) that's the SMALLEST of the three parallel resistances, so it dominates the combination — the exact opposite of the unbypassed circuit, where R1∥R2 (13.3 kΩ) was the smallest and Zb barely mattered. Bypassing RE doesn't just change Av — it swings which term controls Zin too.</div>`
      },
      {
        circuitId: 'ce-divider-ac-bypassed',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE bypassed)',
        text: () => 'What is the approximate <b style="color:var(--colour-ui-primary)">AC</b> output resistance <b class="colour-resistor">Z<sub>out</sub></b>, looking back into the collector terminal?',
        hint: () => 'Zero the source, then look back into the collector node — same question as always, and the emitter-side bypass cap has no path to this node at all.',
        options: () => shuffle([
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RC</b>', type: 'correct' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RE</b>', type: 'wrong' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-gain">Zin</b>', type: 'wrong' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RC</b> ∥ <b class="colour-resistor">RE</b>', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b>',
        working: () => `
    <div class="working-line">With the source zeroed, the only thing directly wired to the collector node (besides the transistor's internal, very-high ro — ignored here) is <b class="colour-resistor">R<sub>C</sub></b> itself, running up to the AC-grounded <b class="colour-supply">V<sub>CC</sub></b> rail.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b> = 1.8 kΩ</div>
    <div class="working-total">Unchanged from the unbypassed circuit — <b class="colour-cap">C<sub>E</sub></b> and <b class="colour-resistor">R<sub>E</sub></b> both sit on the EMITTER side, with no path to the collector node this question is looking into. Zout only ever depends on what's actually wired to the collector.</div>`
      },
      {
        circuitId: 'ce-divider-ac-bypassed',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE bypassed)',
        text: () => 'What is the voltage gain <b class="colour-gain">|A<sub>v</sub>|</b> of this common-emitter stage, now that RE is bypassed?',
        hint: () => 'With RE shorted out of the AC path by CE, |Av| ≈ RC / re′ — re′ alone in the denominator, not (RE+re′).',
        options: () => shuffle([
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RC</b>', '<b class="colour-bjt">re′</b>')} = ${frac('1800 Ω', '9.57 Ω')} ≈ 188`, type: 'correct' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RC</b>', '<b class="colour-resistor">RE</b>+<b class="colour-bjt">re′</b>')} = ${frac('1800 Ω', '279.57 Ω')} ≈ 6.44`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RC</b>', '<b class="colour-resistor">RE</b>')} = ${frac('1800 Ω', '270 Ω')} ≈ 6.67`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-bjt">re′</b>', '<b class="colour-resistor">RC</b>')} = ${frac('9.57 Ω', '1800 Ω')} ≈ 0.0053`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-gain">|A<sub>v</sub>|</b> ≈ R<sub>C</sub>/r<sub>e</sub>′ ≈ 188',
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${frac('<b class="colour-resistor">R<sub>C</sub></b>', 'r<sub>e</sub>′')} = ${frac('1800 Ω', '9.57 Ω')}</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ 188 — roughly 29× the unbypassed circuit's own 6.44, since re′ alone (9.57 Ω) replaces the much larger RE+re′ (279.57 Ω) in the denominator. This is the classic swamped-vs-bypassed trade-off: the unbypassed ("swamped") stage sacrifices gain for an Av that barely moves with β or temperature, because re′ is swamped by the much bigger RE; THIS stage sacrifices that stability for maximum gain, since Av now depends directly on re′ — which itself depends on IE, and drifts with temperature and varies transistor-to-transistor.</div>`
      },
    ];

    /* re' reveal on the diagram itself, once Q1 has been answered. Persists
       regardless of which question is currently on screen (unlike the
       ammeter badge, which only shows for its own question) — this is
       "now-known information", same convention as the rest of this
       project's progressive-reveal circuits. */
    function updateReReveal() {
      document.getElementById('reRevealCe').setAttribute('display', Q[0].ans ? 'inline' : 'none');
    }

    /* Zb/Zin/Zout value badges — same "reveal once answered, stays
       revealed" convention as updateReReveal() above. Zb=Q2(idx1),
       Zin=Q3(idx2), Zout=Q4(idx3). */
    function updateZReveal() {
      document.getElementById('zbBadgeCe').setAttribute('display', Q[1].ans ? 'inline' : 'none');
      document.getElementById('zinBadgeCe').setAttribute('display', Q[2].ans ? 'inline' : 'none');
      document.getElementById('zoutBadgeCe').setAttribute('display', Q[3].ans ? 'inline' : 'none');
    }

    RENDER_EXTRA = () => { updateReReveal(); updateZReveal(); };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
