<!--
  Knowledge quiz for the "BJT amplifier AC parameters" lesson — COMMON
  EMITTER half only. Split out of bjt_knowledge_ac_parameters.html (which
  remains the full, original file, unchanged) at the user's request, as
  the first of what may become several smaller topic-specific quizzes.
  This file covers exactly that original file's Q1-5: calculate re′, Zb,
  Zin, Zout and Av for a common-emitter (voltage-divider bias, RE
  unbypassed) stage. The Q6 "bridge" question, the common-collector
  questions (old Q7-9), loaded-gain (old Q10-11) and frequency response
  (old Q12-13) are NOT included here — see bjt_knowledge_ac_parameters.html
  for those, or bjt_knowledge_ac_params_cb.html for the common-collector +
  loaded-gain split.

  ONE worked NPN stage (BC549, β=200 assumed — same transistor family as
  the rest of UEEEC0066) is used throughout.

  re′ (the transistor's own internal AC emitter resistance, ≈26mV/IE) is
  calculated as its own first question (Q1) rather than folded into the
  Zb/Zin working or dropped as negligible — matching how the lesson itself
  was taught: re′ derived first, then carried into Zb = β×(RE+re′) and
  Av = RC/(RE+re′) explicitly, not approximated away. IE is a DC-analysis
  result taken as GIVEN (shown on the diagram via an ammeter-badge, same
  convention bjt_npn_voltage_divider_ac.html uses for its own DC current
  readouts) — this file only covers AC parameters, not the DC bias
  derivation itself. Once Q1 is answered, re′'s value stays visible
  directly on the diagram too — a small `r_e′ ≈ ...` readout just below
  the transistor's own `β = 200` label (`reRevealCe`, toggled by
  `updateReReveal()` on every render based on `Q[0].ans` — persists
  regardless of which question is currently on screen, same "once
  revealed, stays revealed" convention as the rest of this project's
  progressive-reveal circuits).

  Q2 asks for Zb as ONE combined question (the formula AND its numeric
  result together, e.g. "Zb = β×(RE+re′) = 200×(270 Ω+9.57 Ω) ≈ 55.9 kΩ"
  as a single option) rather than a separate formula-choice question
  followed by a separate calculate-the-number question.

  Circuit diagram (ce-divider-ac) uses the same large-scale WIRES/NODES
  layout convention as bjt_npn_voltage_divider_ac.html — explicit
  LEFT/CENTER/RIGHT VERTICAL + TOP/BOTTOM/CENTRE/OUTPUT HORIZONTAL wire
  sections, every individual wire segment trailing-commented with what it
  connects, resistors drawn as a box with a separate name/value label
  pair, VCC/GND as their own labelled groups. NODE B and NODE C mark the
  exact points that file's own DC-voltage meters would probe — reused
  here for Zin/Zout (AC resistance) instead.

  Formulas used (standard "beta model", ignoring ro), for CE with
  unbypassed RE: Zb = β×(RE+re′), Zin = R1∥R2∥Zb, Zout ≈ RC,
  Av ≈ -RC/(RE+re′).

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.
-->

<html lang="en">

    rel="stylesheet">

         same rough size as bjt_npn_voltage_divider_ac.html's own 700x560),

         minmax(340px, 52%) column was originally sized around — a fixed

<body>
  <!-- Hidden defs: the CE version of the NPN voltage-divider stage, built
       in bjt_npn_voltage_divider_ac.html's own large-scale WIRES/NODES
       format (see the file header comment above). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- ══ NPN BJT SHAPE ══ -->
      <g id="bjt-npn-shape">
        <circle cx="7" cy="0" r="24" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
        <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
        <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
        <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
        <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
      </g>

      <!-- ══ AC SIGNAL SOURCE SHAPE — circle with one sine cycle ══ -->
      <g id="ac-source-shape">
        <circle cx="0" cy="0" r="24" fill="none" style="stroke: var(--colour-signal)" stroke-width="2" filter="url(#glow)" />
        <path d="M -16,0 C -11,-14 -5,-14 0,0 C 5,14 11,14 16,0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- ══ AMMETER BADGE — same shape as bjt_npn_voltage_divider_ac.html's own ammeter-shape ══ -->
      <g id="ammeter-shape">
        <circle cx="0" cy="0" r="30" style="fill: var(--colour-ammeter-fill); stroke: var(--colour-current)" stroke-width="1.5" filter="url(#glow)" />
      </g>

      <!-- ══ Z-VALUE METER BADGE — same solid-over-dashed dial-line motif as
           bjt_npn_voltage_divider_ac.html's own voltmeter "meter-shape",
           recoloured to the colour-gain token (the same colour the
           Zb/Zin/Zout arrow-labels already use) instead of that file's
           colour-red token, since these badges are revealing a Z value,
           not a DC voltage. ══ -->
      <g id="z-meter-shape">
        <circle cx="0" cy="0" r="25" style="fill: var(--colour-meter-fill); stroke: var(--colour-gain)" stroke-width="1.5" filter="url(#glow)" />
      </g>

      <!-- ══ COUPLING CAPACITOR SHAPE — two plates, reused for Cin and Cout ══ -->
      <g id="cap-shape">
        <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
        <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
        <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      </g>

      <!-- ══════════════════════════════════════════════════════════════════
           Common Emitter — voltage-divider bias, RE UNBYPASSED (swamped).
           Large-scale WIRES/NODES/component-group layout — same convention
           as bjt_npn_voltage_divider_ac.html (explicit LEFT/CENTER/RIGHT
           VERTICAL + TOP/BOTTOM/CENTRE/OUTPUT HORIZONTAL wire sections,
           each wire individually commented; resistors as boxes with a
           separate name/value label pair; VCC/GND as their own labelled
           groups). NODE B/C mark the exact same electrical points that
           file's meters would probe — here labelled Zin/Zout (input/output
           RESISTANCE) rather than a DC voltage. ══════════════════════════ -->
      <g id="ce-divider-ac">

        <!-- ════════════════════ WIRES ════════════════════ -->

        <!-- ── LEFT VERTICAL (AC source ground return) ── -->
        <!-- See AC INPUT COMPONENTS for split line -->
        
        <!-- ── CENTER VERTICAL (R1/R2 line, base-bias rail, x=200) ── -->
        <line x1="200" y1="50" x2="200" y2="80" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to R1 -->
        <line x1="200" y1="160" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R1 down to Base node -->
        <line x1="200" y1="255" x2="200" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node down to R2 -->
        <line x1="200" y1="430" x2="200" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R2 down to GND rail -->

        <!-- ── RIGHT VERTICAL (collector/emitter rail, x=440) ── -->
        <line x1="440" y1="50" x2="440" y2="243" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to  Collector pin -->
        <line x1="440" y1="299" x2="440" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Emitter pin down to GND rail -->

        <!-- ── TOP HORIZONTAL ── -->
        <line x1="180" y1="50" x2="460" y2="50" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail (R1 column to RC column) -->
        <circle cx="200" cy="50" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="50" r="5" style="fill: var(--colour-series)" />

        <!-- ── BOTTOM HORIZONTAL ── -->
        <line x1="10" y1="520" x2="620" y2="520" style="stroke: var(--colour-series)" stroke-width="2" />
        <circle cx="200" cy="520" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="520" r="5" style="fill: var(--colour-series)" />

        <!-- ── CENTRE HORIZONTAL ── -->
        <line x1="30" y1="275" x2="409" y2="275" style="stroke: var(--colour-series)" stroke-width="2" /><!-- BSource to transistor base pin -->

        <!-- ── OUTPUT HORIZONTAL ── -->
        <line x1="440" y1="220" x2="600" y2="220" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Collector pin, through Cout, to output -->

        <!-- ════════════════════ NODES ════════════════════ -->

        <!-- ── NODE B — Zin is looked up from here, rightward into the base ── -->
        <circle cx="200" cy="275" r="5" style="fill: var(--colour-series)" />
        <text x="370" y="260" style="fill: var(--colour-gain)" font-size="16" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">b &#10145;</tspan></text>
        <text x="170" y="260" style="fill: var(--colour-gain)" font-size="16" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">in &#10145;</tspan></text>

        <!-- ── Z-VALUE BADGES — hidden until their own question is answered,
             toggled via updateZReveal(). Zb sits shifted left of its own
             arrow-label to stay clear of the transistor. ── -->
        <g id="zbBadgeCe" display="none" transform="translate(340,220)">
          <use href="#z-meter-shape" />
          <text x="0" y="2" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">55.9</text>
          <text x="0" y="19" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>
        <g id="zinBadgeCe" display="none" transform="translate(140,220)">
          <use href="#z-meter-shape" />
          <text x="0" y="2" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">10.77</text>
          <text x="0" y="19" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>

        <!-- ── NODE C — Zout is looked back into from here, source zeroed ── -->
        <circle cx="440" cy="220" r="5" style="fill: var(--colour-series)" />
        <text x="490" y="200" style="fill: var(--colour-gain)" font-size="16" text-anchor="middle" font-weight="bold"><tspan baseline-shift="-70%">&#11013;</tspan> Z<tspan baseline-shift="sub" font-size="13">out</tspan></text>
        <g id="zoutBadgeCe" display="none" transform="translate(510,160)">
          <use href="#z-meter-shape" />
          <text x="0" y="2" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">1.8</text>
          <text x="0" y="19" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>

        <!-- ════════════════════ AC INPUT COMPONENTS ════════════════════ -->
        <g id="outputTerminalPlain">

          <!-- ── INPUT VERTICAL WIRES WITH ARROWS ── -->
          <circle cx="30" cy="275" r="5" style="fill: var(--colour-signal)" />

          <polygon points="24,295,36,295 30,285" style="fill: var(--colour-series)" /><!-- Arrow pointing up -->
          <line x1="30" y1="285" x2="30" y2="370" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Horizontal to "input" -->

          <text x="5" y="382" style="fill: var(--colour-signal)" text-anchor="start" font-size="16" font-weight="bold">input</text>

          <line x1="30" y1="390" x2="30" y2="500" style="stroke: var(--colour-series)" stroke-width="2" /><!-- "input" to GND -->
          <polygon points="24,500 36,500 30,510" style="fill: var(--colour-series)" /><!-- Arrow pointing down -->

          <circle cx="30" cy="520" r="5" style="fill: var(--colour-signal)" />

        </g>
        <g transform="translate(80,275)">
          <use href="#cap-shape" />
          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16" font-weight="bold">C<tspan baseline-shift="sub" font-size="13">IN</tspan></text>
        </g>

        <!-- ════════════════════ AC OUTPUT COMPONENTS ════════════════════ -->

        <g transform="translate(570,220)">
          <use href="#cap-shape" />
          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16" font-weight="bold">C<tspan baseline-shift="sub" font-size="13">OUT</tspan></text>
        </g>
        <g id="outputTerminalPlain">
          <circle cx="600" cy="220" r="5" style="fill: var(--colour-signal)" />
          <text x="580" y="365" style="fill: var(--colour-signal)" text-anchor="start" font-size="16" font-weight="bold">output</text>
          <circle cx="600" cy="520" r="5" style="fill: var(--colour-signal)" />

          <!-- ── OUTPUT VERTICAL WIRES WITH ARROWS ── -->
          <line x1="600" y1="230" x2="600" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Horizontal to "output" -->
          <polygon points="594,240 606,240 600,230" style="fill: var(--colour-series)" /><!-- Arrow pointing up -->
          <line x1="600" y1="395" x2="600" y2="510" style="stroke: var(--colour-series)" stroke-width="2" /><!-- "output" to GND -->
          <polygon points="594,500 606,500 600,510" style="fill: var(--colour-series)" /><!-- Arrow pointing down -->

        </g>

        <!-- ════════════════════ VCC ════════════════════ -->

        <g transform="translate(280,-1)">
          <line x1="40" y1="50" x2="40" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
          <line x1="0" y1="30" x2="80" y2="30" style="stroke: var(--colour-supply)" stroke-width="2" />
          <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
          <!-- hand-drawn "+" -->
          <line x1="50" y1="10" x2="50" y2="20" style="stroke: var(--colour-text)" stroke-width="1.0" />
          <line x1="46" y1="15" x2="54" y2="15" style="stroke: var(--colour-text)" stroke-width="1.0" />
          <text x="60" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14" font-weight="bold">12 V</text>
        </g>

        <!-- ════════════════════ COMMON LABEL ════════════════════ -->

        <text x="120" y="540" fill="var(--colour-gnd)" text-anchor="middle" font-size="14" font-weight="bold">Common</text>

        <!-- ════════════════════ BJT — NPN ════════════════════ -->

        <g transform="translate(426,276)">
          <use href="#bjt-npn-shape" />
          <text x="-15" y="-25" fill="var(--colour-bjt-labels)" text-anchor="middle" font-size="14" font-weight="bold">Q1</text>
          <text x="0" y="40" fill="var(--colour-bjt-labels)" text-anchor="end" font-size="12">BC549</text>
          <text x="35" y="-5" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="14" font-weight="bold">β = 200</text>
          <!-- ── re' reveal — hidden until Q1 is answered, toggled via updateReReveal() ── -->
          <text id="reRevealCe" display="none" x="35" y="20" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="13" font-weight="bold">r<tspan baseline-shift="sub" font-size="10">e</tspan>′ ≈ 17.3 Ω</text>
        </g>

        <!-- ════════════════════ RESISTORS ════════════════════ -->

        <!-- ── R1 ── -->
        <g transform="translate(185,80)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">R1</text>
          <text x="60" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">120 kΩ</text>
        </g>

        <!-- ── R2 ── -->
        <g transform="translate(185,350)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">R2</text>
          <text x="60" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">15 kΩ</text>
        </g>

        <!-- ── RC ── -->
        <g transform="translate(425,80)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">RC</text>
          <text x="60" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">1.8 kΩ</text>
        </g>

        <!-- ── RE ── -->
        <g transform="translate(425,350)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">RE</text>
          <text x="60" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">270 Ω</text>
        </g>

        <!-- ── IE INDICATOR — shown only for Q1 (re' calc), toggled via circuitAmmeter flag ── -->
        <g id="ieIndCe" display="none" transform="translate(440,475)">
          <use href="#ammeter-shape" />
          <text x="-35" y="-20" style="fill: var(--colour-current)" text-anchor="middle" font-size="14" font-weight="bold">I<tspan baseline-shift="sub" font-size="10">E</tspan></text>
          <text x="0" y="-2" style="fill: var(--colour-text)" text-anchor="middle" font-size="15" font-weight="bold">2.716</text>
          <text x="0" y="15" style="fill: var(--colour-current)" text-anchor="middle" font-size="12">mA</text>
        </g>

      </g>
    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="AC Parameters — Common Emitter"></div>
  <header>
    <h1>BJT Amplifier: AC Parameters — Common Emitter</h1>
    <p>Voltage Gain · Input &amp; Output Resistance · Common-Emitter (Voltage-Divider Bias, Unbypassed RE)</p>

  <div class="quiz-wrap">

    <!-- LEFT: circuit diagram -->
    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()" title="Click to zoom">
        <div class="panel-label" id="circuitRefLabel">Reference Circuit</div>
        <div class="zoom-hint">
          <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none" />
            <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />

        </svg>
      </div>

    <!-- RIGHT: question -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

    <!-- Zoom modal — copies circuitRefSvg's current innerHTML/viewBox in on open. -->
    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalTitle">Reference Circuit</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="-10 -10 690 570" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

  </div>

  <script>
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }
    const DEFAULT_VIEWBOX = '-10 -10 690 570';

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — Q1-5 of the original bjt_knowledge_ac_parameters.html,
    // unchanged in content and numbering. See bjt_knowledge_basics.html's
    // header comment for the full field reference.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        circuitAmmeter: true,
        text: () => 'What is <b class="colour-bjt">r<sub>e</sub>′</b> for this <b style="color:var(--colour-ui-primary)">common-emitter</b> stage?',
        hint: () => 're′ = VT/IE, using the standard room-temperature approximation VT ≈ 26 mV.',
        options: () => shuffle([
          { label: `re′ ≈ ${frac('26 mV', 'I<sub>E</sub>')} ≈ ${frac('26 mV', '2.716 mA')} ≈ 9.57 Ω`, type: 'correct' },
          { label: `re′ ≈ ${frac('26 V', 'I<sub>E</sub>')} ≈ ${frac('26 V', '2.716 mA')} ≈ 9,573 Ω`, type: 'wrong' },
          { label: 're′ ≈ 26 Ω', type: 'wrong' },
          { label: `re′ ≈ ${frac('I<sub>E</sub>', '26 mV')} ≈ ${frac('2.716 mA', '26 mV')} ≈ 0.104 Ω`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-bjt">r<sub>e</sub>′</b> ≈ 9.57 Ω',
        working: () => `
    <div class="working-formula-row"><b class="colour-bjt">r<sub>e</sub>′</b> = ${frac('V<sub>T</sub>', 'I<sub>E</sub>')} ≈ ${frac('26 mV', '2.716 mA')}</div>
    <div class="working-total"><b class="colour-bjt">r<sub>e</sub>′</b> ≈ 9.57 Ω — small next to RE (270 Ω) here, but not thrown away: keep this value, every AC parameter from here on uses it.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'What is the <b style="color:var(--colour-ui-primary)">AC</b> resistance looking directly into the base, <b class="colour-resistor">Z<sub>b</sub></b>?',
        hint: () => 'Every unit of base current has to supply β times as much emitter current — so from the base\'s point of view, whatever sits in the emitter leg (RE, plus the transistor\'s own re′) looks β times BIGGER than it really is. Zb = β × (RE + re′).',
        options: () => shuffle([
          { label: `Zb = β × (RE + re′) = 200 × (270 Ω + 9.57 Ω) ≈ 55.9 kΩ`, type: 'correct' },
          { label: `Zb ≈ β × RE = 200 × 270 Ω ≈ 54 kΩ`, type: 'wrong' },
          { label: `Zb = β × (RE − re′) = 200 × (270 Ω − 9.57 Ω) ≈ 52.1 kΩ`, type: 'wrong' },
          { label: `Zb = (RE + re′) / β = 279.57 Ω / 200 ≈ 1.4 Ω`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">R<sub>E</sub></b> + r<sub>e</sub>′) ≈ 55.9 kΩ',
        working: () => `
    <div class="working-line">Every unit of base current supplies β times as much emitter current, so anything in the emitter leg — RE AND the transistor's own internal AC emitter resistance re′ — both get reflected into the base β times bigger.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">R<sub>E</sub></b> + r<sub>e</sub>′) = 200 × (270 Ω + 9.57 Ω)</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>b</sub></b> ≈ 55,914 Ω ≈ 55.9 kΩ — only a little above the RE-only approximation (54 kΩ), since re′ is small next to RE here. This quiz uses <b class="colour-bjt">β</b> = 200 for every worked example (a reasonable mid-range value for a BC549, hFE 110–800 typ). Keep this value, it's used again in the next question.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'What is the <b style="color:var(--colour-ui-primary)">AC</b> input resistance <b class="colour-resistor">Z<sub>in</sub></b> seen by the signal source?',
        hint: () => 'Looking into the base node from the source\'s point of view, R1, R2 and Zb are all three connected between that same node and ground (or VCC, which is AC ground) — that\'s three resistances in PARALLEL, not in series.',
        options: () => shuffle([
          { label: 'Zin = R1∥R2∥Zb = 120 kΩ∥15 kΩ∥55.9 kΩ ≈ 10.77 kΩ', type: 'correct' },
          { label: 'Zin = R1 + R2 + Zb = 120 kΩ + 15 kΩ + 55.9 kΩ ≈ 190.9 kΩ', type: 'wrong' },
          { label: 'Zin = R1∥R2 = 120 kΩ∥15 kΩ ≈ 13.3 kΩ', type: 'wrong' },
          { label: 'Zin ≈ Zb = 55.9 kΩ', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>in</sub></b> = R1∥R2∥<b class="colour-resistor">Z<sub>b</sub></b> ≈ 10.77 kΩ',
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>in</sub></b> = R1 ∥ R2 ∥ <b class="colour-resistor">Z<sub>b</sub></b></div>
    <div class="working-line">${frac('1', '<b class="colour-resistor">Z<sub>in</sub></b>')} = ${frac('1', '120,000')} + ${frac('1', '15,000')} + ${frac('1', '55,914')} ≈ 0.0000929 Ω⁻¹</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>in</sub></b> ≈ 10,766 Ω ≈ 10.77 kΩ — barely above the RE-only version of this same calculation (10.7 kΩ), since Zb landing a little higher (re′ included) makes almost no difference once it's in parallel with the much smaller R1∥R2 (13.3 kΩ) — the SMALLEST of three parallel resistances always dominates the combination.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'What is the approximate <b style="color:var(--colour-ui-primary)">AC</b> output resistance <b class="colour-resistor">Z<sub>out</sub></b>, looking back into the collector terminal?',
        hint: () => 'Zero the source, then look back into the collector node. The transistor\'s own internal output resistance (ro) is assumed very high compared to RC in this approximation, so it\'s ignored — leaving only whatever is directly wired to that node.',
        options: () => shuffle([
          { label: 'Zout ≈ RC', type: 'correct' },
          { label: 'Zout ≈ RE', type: 'wrong' },
          { label: 'Zout ≈ Zin', type: 'wrong' },
          { label: 'Zout ≈ RC ∥ RE', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b>',
        working: () => `
    <div class="working-line">With the source zeroed, the only thing directly wired to the collector node (besides the transistor's internal, very-high ro — ignored here) is <b class="colour-resistor">R<sub>C</sub></b> itself, running up to the AC-grounded <b class="colour-supply">V<sub>CC</sub></b> rail.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b> = 1.8 kΩ</div>
    <div class="working-total">This is why <b class="colour-resistor">Z<sub>out</sub></b> for a common-emitter stage is usually fairly HIGH (equal to whatever RC happens to be) — a fact that matters a lot once a load is connected to the output, which is covered in a separate quiz.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'What is the voltage gain <b class="colour-gain">|A<sub>v</sub>|</b> of this common-emitter stage?',
        hint: () => '|Av| ≈ RC / (RE + re′) for a common-emitter stage with an unbypassed emitter.',
        options: () => shuffle([
          { label: `|Av| ≈ ${frac('RC', 'RE+re′')} = ${frac('1800 Ω', '279.57 Ω')} ≈ 6.44`, type: 'correct' },
          { label: `|Av| ≈ ${frac('RC', 'RE')} = ${frac('1800 Ω', '270 Ω')} ≈ 6.67`, type: 'wrong' },
          { label: `|Av| ≈ ${frac('RE+re′', 'RC')} = ${frac('279.57 Ω', '1800 Ω')} ≈ 0.155`, type: 'wrong' },
          { label: '|Av| ≈ R<sub>C</sub> ≈ 1800', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-gain">|A<sub>v</sub>|</b> ≈ R<sub>C</sub>/(R<sub>E</sub>+r<sub>e</sub>′) ≈ 6.44',
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${frac('<b class="colour-resistor">R<sub>C</sub></b>', '<b class="colour-resistor">R<sub>E</sub></b> + r<sub>e</sub>′')} = ${frac('1800 Ω', '279.57 Ω')}</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ 6.44 — a little below the RE-only approximation (6.67), since re′ adds a bit more to the denominator.</div>`
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — generic; driven entirely by QUESTIONS[] via index.
    // (Same as bjt_knowledge_basics.html's engine.)
    // ══════════════════════════════════════════════════════════════════════

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isAnswerCorrect(data, st) {
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ') : '—';
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }

    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    function showCircuitRef(id, label, viewBox, loadTerminal, ammeter) {
      document.getElementById('circuitRefUse').setAttribute('href', '#' + id);
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
      document.getElementById('circuitRefSvg').setAttribute('viewBox', viewBox || DEFAULT_VIEWBOX);
      document.getElementById('ieIndCe').setAttribute('display', ammeter ? 'inline' : 'none');
      if (xyOn) buildXYRuler();
    }

    /* re' reveal on the diagram itself, once Q1 has been answered. Persists
       regardless of which question is currently on screen (unlike the
       ammeter badge, which only shows for its own question) — this is
       "now-known information", same convention as the rest of this
       project's progressive-reveal circuits. */
    function updateReReveal() {
      document.getElementById('reRevealCe').setAttribute('display', Q[0].ans ? 'inline' : 'none');
    }

    /* Zb/Zin/Zout value badges — same "reveal once answered, stays
       revealed" convention as updateReReveal() above. Zb=Q2(idx1),
       Zin=Q3(idx2), Zout=Q4(idx3). */
    function updateZReveal() {
      document.getElementById('zbBadgeCe').setAttribute('display', Q[1].ans ? 'inline' : 'none');
      document.getElementById('zinBadgeCe').setAttribute('display', Q[2].ans ? 'inline' : 'none');
      document.getElementById('zoutBadgeCe').setAttribute('display', Q[3].ans ? 'inline' : 'none');
    }

    /* ─── DEV: xy ruler overlay, for lining up SVG coordinates by eye ────────
       Console:   setXY(1) / setXY(0)     URL: ?xy=1 */
    let xyOn = false;
    function buildXYRuler() {
      const g = document.getElementById('xyRuler');
      if (!g) return;
      const vb = document.getElementById('circuitRefSvg').viewBox.baseVal;
      const offX = vb.x, offY = vb.y, W = vb.width, H = vb.height;
      const hy = offY + H - 10, vx = offX + 10, col = '#ff00ff';
      let svg = `<line x1="${offX}" y1="${hy}" x2="${offX + W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let x = 0; x <= W; x += 10) {
        const gx = offX + x, major = (Math.round(gx) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${gx}" y1="${hy - len}" x2="${gx}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${gx}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${Math.round(gx)}</text>`;
      }
      svg += `<line x1="${vx}" y1="${offY}" x2="${vx}" y2="${offY + H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let y = 0; y <= H; y += 10) {
        const gy = offY + y, major = (Math.round(gy) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${vx}" y1="${gy}" x2="${vx + len}" y2="${gy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${vx + 13}" y="${gy + 3}" fill="${col}" font-size="8" text-anchor="start">${Math.round(gy)}</text>`;
      }
      g.innerHTML = svg;
    }
    function setXY(on) {
      xyOn = on;
      const g = document.getElementById('xyRuler');
      if (!g) return;
      if (on) buildXYRuler();
      g.setAttribute('display', on ? 'inline' : 'none');
    }
    window.setXY = setXY;

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      renderOptions();

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        selList.textContent = st.sel.length
          ? `Selected: ${[...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ')}`
          : 'Click the options above to select your answer.';
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      check.disabled = st.ans || (multi ? st.sel.length === 0 : st.sel === null);
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      showCircuitRef(data.circuitId, data.circuitLabel, data.circuitViewBox, data.circuitLoad, data.circuitAmmeter);
      updateReReveal();
      updateZReveal();
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data) ? st.sel.length === 0 : st.sel === null) return;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function scrollToQuestionTop() {
      document.getElementById('qPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); scrollToQuestionTop(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        Q[i].ans = false;
        Q[i].sel = isMulti(QUESTIONS[i]) ? [] : null;
      }
      renderQuestion();
      scrollToQuestionTop();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
      scrollToQuestionTop();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      showCircuitRef('ce-divider-ac', 'Common Emitter (voltage-divider bias, RE unbypassed)', DEFAULT_VIEWBOX);
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    // ── zoom modal ──
    function openModal() {
      const src = document.getElementById('circuitRefSvg'), dst = document.getElementById('modalSvg');
      dst.innerHTML = src.innerHTML; dst.setAttribute('viewBox', src.getAttribute('viewBox'));
      document.getElementById('modalTitle').textContent = document.getElementById('circuitRefLabel').textContent;
      document.getElementById('diagramModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('diagramModal').classList.remove('open');
      document.getElementById('modalSvg').innerHTML = '';
      document.body.style.overflow = '';
    }
    function handleModalClick(e) { if (e.target.closest('.modal-close')) return; closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    buildProgressDots();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) {
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      }
      goToQuestion(n);
      if (answered) {
        Q[cur].sel = Array.isArray(Q[cur].cor) ? [...Q[cur].cor] : Q[cur].cor;
        checkAnswer();
      }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
      if (p.has('xy')) setXY(+p.get('xy') === 1);
    }
  </script>
