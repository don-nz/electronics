<!--
  Knowledge quiz for the "BJT amplifier AC parameters" lesson — COMMON
  EMITTER half only. Split out of bjt_knowledge_ac_parameters.html (which
  remains the full, original file, unchanged) at the user's request, as
  the first of what may become several smaller topic-specific quizzes.
  This file covers exactly that original file's Q1-5: calculate re′, Zb,
  Zin, Zout and Av for a common-emitter (voltage-divider bias, RE
  unbypassed) stage. The Q6 "bridge" question, the common-collector
  questions (old Q7-9), loaded-gain (old Q10-11) and frequency response
  (old Q12-13) are NOT included here — see bjt_knowledge_ac_parameters.html
  for those, or bjt_knowledge_ac_params_cb.html for the common-collector +
  loaded-gain split.

  ONE worked NPN stage (BC549, β=200 assumed — same transistor family as
  the rest of UEEEC0066) is used throughout.

  re′ (the transistor's own internal AC emitter resistance, ≈26mV/IE) is
  calculated as its own first question (Q1) rather than folded into the
  Zb/Zin working or dropped as negligible — matching how the lesson itself
  was taught: re′ derived first, then carried into Zb = β×(RE+re′) and
  Av = RC/(RE+re′) explicitly, not approximated away. IE is a DC-analysis
  result taken as GIVEN (shown on the diagram via an ammeter-badge, same
  convention bjt_npn_voltage_divider_ac.html uses for its own DC current
  readouts) — this file only covers AC parameters, not the DC bias
  derivation itself. Once Q1 is answered, re′'s value stays visible
  directly on the diagram too — a small `r_e′ ≈ ...` readout just below
  the transistor's own `β = 200` label (`reRevealCe`, toggled by
  `updateReReveal()` on every render based on `Q[0].ans` — persists
  regardless of which question is currently on screen, same "once
  revealed, stays revealed" convention as the rest of this project's
  progressive-reveal circuits).

  Q2 asks for Zb as ONE combined question (the formula AND its numeric
  result together, e.g. "Zb = β×(RE+re′) = 200×(270 Ω+9.57 Ω) ≈ 55.9 kΩ"
  as a single option) rather than a separate formula-choice question
  followed by a separate calculate-the-number question.

  Circuit diagram (ce-divider-ac) uses the same large-scale WIRES/NODES
  layout convention as bjt_npn_voltage_divider_ac.html — explicit
  LEFT/CENTER/RIGHT VERTICAL + TOP/BOTTOM/CENTRE/OUTPUT HORIZONTAL wire
  sections, every individual wire segment trailing-commented with what it
  connects, resistors drawn as a box with a separate name/value label
  pair, VCC/GND as their own labelled groups. NODE B and NODE C mark the
  exact points that file's own DC-voltage meters would probe — reused
  here for Zin/Zout (AC resistance) instead.

  Formulas used (standard "beta model", ignoring ro), for CE with
  unbypassed RE: Zb = β×(RE+re′), Zin = R1∥R2∥Zb, Zout ≈ RC,
  Av ≈ -RC/(RE+re′).

  MIGRATED to the shared engine, `assets/quiz-engine.js`, same session,
  immediate follow-up — Phase 3 continues (see the project's own
  "assets/quiz-engine.js migration assessment"). This file needed a THIRD
  new configurable hook beyond what its own siblings (ac_circuit_analysis.
  html, ac_params_formulas.html) had already added: `RENDER_EXTRA`, an
  optional callback fired at the end of every renderQuestion() — this
  file's own `updateReReveal()`/`updateZReveal()` (the progressive-reveal
  re′/Zb/Zin/Zout badges, which persist once their own question is
  answered regardless of which question is currently showing) need to run
  on EVERY render, not just when the circuit swaps (that's what
  `CIRCUIT_REF_EXTRA` is for — this file's own ammeter badge, `ieIndCe`,
  uses that hook instead, since it only needs to react to circuit swaps).
  `updateReReveal()`/`updateZReveal()` themselves stay inline — genuinely
  page-specific (their own hardcoded badge element ids).

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture. Add/reorder
  questions by editing the QUESTIONS array only.
-->

       fraction (1/(1/R1+1/R2+1/Zb), doubled up for the numeric substitution
       underneath) — up to 8 stacked .working-frac elements side by side in
       one option button, which crams and wraps awkwardly on phone-width

<body>

        <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      </g>

        <line x1="200" y1="160" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R1 down to Base node -->
        <line x1="200" y1="255" x2="200" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node down to R2 -->
        <line x1="200" y1="430" x2="200" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- R2 down to GND rail -->

        <!-- ── RIGHT VERTICAL (collector/emitter rail, x=440) ── -->
        <line x1="440" y1="50" x2="440" y2="243" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail down to  Collector pin -->
        <line x1="440" y1="299" x2="440" y2="520" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Emitter pin down to GND rail -->

        <!-- ── TOP HORIZONTAL ── -->
        <line x1="180" y1="50" x2="460" y2="50" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail (R1 column to RC column) -->
        <circle cx="200" cy="50" r="5" style="fill: var(--colour-series)" />
        <circle cx="440" cy="50" r="5" style="fill: var(--colour-series)" />

        <circle cx="440" cy="520" r="5" style="fill: var(--colour-series)" />

        <!-- ── CENTRE HORIZONTAL ── -->
        <line x1="30" y1="275" x2="409" y2="275" style="stroke: var(--colour-series)" stroke-width="2" /><!-- BSource to transistor base pin -->

        <!-- ── OUTPUT HORIZONTAL ── -->
        <line x1="440" y1="220" x2="600" y2="220" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Collector pin, through Cout, to output -->

        <!-- ════════════════════ NODES ════════════════════ -->

        <!-- ── NODE B — Zin is looked up from here, rightward into the base ── -->
        <circle cx="200" cy="275" r="5" style="fill: var(--colour-series)" />

        <!-- ── ZB -->
        <text x="370" y="260" style="fill: var(--colour-gain)" font-size="16" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">b &#10145;</tspan></text>
        <g id="zbBadgeCe" display="none" transform="translate(340,220)">
          <use href="#z-meter-shape" />
          <text x="0" y="2" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">55.9</text>
          <text x="0" y="19" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>

        <!-- ── ZC -->
        <text x="170" y="260" style="fill: var(--colour-gain)" font-size="16" text-anchor="middle" font-weight="bold">Z<tspan baseline-shift="sub" font-size="13">in &#10145;</tspan></text>
        <g id="zinBadgeCe" display="none" transform="translate(140,220)">
          <use href="#z-meter-shape" />
          <text x="0" y="2" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">10.77</text>
          <text x="0" y="19" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>

        <!-- ── ZOUT -->
        <circle cx="440" cy="220" r="5" style="fill: var(--colour-series)" />
        <text x="490" y="200" style="fill: var(--colour-gain)" font-size="16" text-anchor="middle" font-weight="bold"><tspan baseline-shift="-70%">&#11013;</tspan> Z<tspan baseline-shift="sub" font-size="13">out</tspan></text>
        <g id="zoutBadgeCe" display="none" transform="translate(510,160)">
          <use href="#z-meter-shape" />
          <text x="0" y="2" style="fill: var(--colour-text)" text-anchor="middle" font-size="14" font-weight="bold">1.8</text>
          <text x="0" y="19" style="fill: var(--colour-gain)" text-anchor="middle" font-size="12">k&#937;</text>
        </g>

        <!-- ════════════════════ AC INPUT COMPONENTS ════════════════════ -->
        <g id="outputTerminalPlain">

          <!-- ── INPUT VERTICAL WIRES WITH ARROWS ── -->

          <polygon points="24,295,36,295 30,285" style="fill: var(--colour-series)" /><!-- Arrow pointing up -->
          <line x1="30" y1="285" x2="30" y2="370" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Horizontal to "input" -->

          <text x="5" y="382" style="fill: var(--colour-signal)" text-anchor="start" font-size="16" font-weight="bold">input</text>

          <line x1="30" y1="390" x2="30" y2="500" style="stroke: var(--colour-series)" stroke-width="2" /><!-- "input" to GND -->
          <polygon points="24,500 36,500 30,510" style="fill: var(--colour-series)" /><!-- Arrow pointing down -->

          <circle cx="30" cy="520" r="5" style="fill: var(--colour-signal)" />

        </g>
        <g transform="translate(80,275)">
          <use href="#cap-shape" />
          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16" font-weight="bold">C<tspan baseline-shift="sub" font-size="13">IN</tspan></text>
        </g>

        <!-- ════════════════════ AC OUTPUT COMPONENTS ════════════════════ -->

        <g transform="translate(570,220)">
          <use href="#cap-shape" />
          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16" font-weight="bold">C<tspan baseline-shift="sub" font-size="13">OUT</tspan></text>
        </g>
        <g id="outputTerminalPlain">
          <circle cx="600" cy="220" r="5" style="fill: var(--colour-signal)" />
          <text x="580" y="365" style="fill: var(--colour-signal)" text-anchor="start" font-size="16" font-weight="bold">output</text>
          <circle cx="600" cy="520" r="5" style="fill: var(--colour-signal)" />

          <!-- ── OUTPUT VERTICAL WIRES WITH ARROWS ── -->
          <line x1="600" y1="230" x2="600" y2="350" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Horizontal to "output" -->
          <polygon points="594,240 606,240 600,230" style="fill: var(--colour-series)" /><!-- Arrow pointing up -->
          <line x1="600" y1="370" x2="600" y2="510" style="stroke: var(--colour-series)" stroke-width="2" /><!-- "output" to GND -->
          <polygon points="594,500 606,500 600,510" style="fill: var(--colour-series)" /><!-- Arrow pointing down -->

        </g>

        <!-- ════════════════════ VCC ════════════════════ -->

        <g transform="translate(280,-1)">

          <text x="60" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14" font-weight="bold">12 V</text>
        </g>

        <!-- ════════════════════ COMMON LABEL ════════════════════ -->

        <text x="120" y="540" fill="var(--colour-gnd)" text-anchor="middle" font-size="14" font-weight="bold">Common</text>

        <!-- ════════════════════ BJT — NPN ════════════════════ -->

        <g transform="translate(426,276)">
          <use href="#bjt-npn-shape" />
          <text x="-15" y="-25" fill="var(--colour-bjt-labels)" text-anchor="middle" font-size="14" font-weight="bold">Q1</text>

          <text x="60" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">15 kΩ</text>
        </g>

        <!-- ── RC ── -->
        <g transform="translate(425,80)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">RC</text>
          <text x="60" y="30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">1.8 kΩ</text>
        </g>

        <!-- ── RE ── -->
        <g transform="translate(425,350)">
          <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
          <text x="-15" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16" font-weight="bold">RE</text>
          <text x="60" y="60" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">270 Ω</text>
        </g>

        <!-- ── IE INDICATOR — shown only for Q1 (re' calc), toggled via circuitAmmeter flag ── -->
        <g id="ieIndCe" display="none" transform="translate(440,475)">

        </g>

      </g>
    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="AC Parameters — Common Emitter"></div>
  <header>
    <h1>BJT Amplifier: AC Parameters — Common Emitter</h1>

  <div class="quiz-wrap">

          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

    <!-- Zoom modal — copies circuitRefSvg's current innerHTML/viewBox in on open. -->
    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalTitle">Reference Circuit</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="-10 -10 690 570" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

  </div>

  <script>
    // LETTERS and frac() now come from the shared assets/quiz-engine.js.
    const DEFAULT_VIEWBOX = '-10 -10 690 570';

    // This file's own reference circuit swap config — see quiz-engine.js's
    // own header comment for what each of these globals does.
    CIRCUIT_SVG_ID = 'circuitRefSvg';
    DEFAULT_CIRCUIT_VIEWBOX = DEFAULT_VIEWBOX;
    CIRCUIT_REF_EXTRA = (id, loadTerminal, ammeter) => {
      document.getElementById('ieIndCe').setAttribute('display', ammeter ? 'inline' : 'none');
    };
    SUMMARY_CIRCUIT_REF = { id: 'ce-divider-ac', label: 'Common Emitter (voltage-divider bias, RE unbypassed)', viewBox: DEFAULT_VIEWBOX };

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — Q1-5 of the original bjt_knowledge_ac_parameters.html,
    // unchanged in content and numbering. See bjt_knowledge_basics.html's
    // header comment for the full field reference.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        circuitAmmeter: true,
        text: () => 'What is <b class="colour-bjt">r<sub>e</sub>′</b> for this <b style="color:var(--colour-ui-primary)">common-emitter</b> stage?',
        hint: () => 're′ = VT/IE, using the standard room-temperature approximation VT ≈ 26 mV.',
        options: () => shuffle([
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 mV', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 mV', '2.716 mA')} ≈ 9.57 Ω`, type: 'correct' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 V', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 V', '2.716 mA')} ≈ 9,573 Ω`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ 26 Ω`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('<b class="colour-current">I<sub>E</sub></b>', '26 mV')} ≈ ${frac('2.716 mA', '26 mV')} ≈ 0.104 Ω`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-bjt">r<sub>e</sub>′</b> ≈ 9.57 Ω',
        working: () => `
    <div class="working-formula-row"><b class="colour-bjt">r<sub>e</sub>′</b> = ${frac('V<sub>T</sub>', 'I<sub>E</sub>')} ≈ ${frac('26 mV', '2.716 mA')}</div>
    <div class="working-total"><b class="colour-bjt">r<sub>e</sub>′</b> ≈ 9.57 Ω — small next to RE (270 Ω) here, but not thrown away: keep this value, every AC parameter from here on uses it.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'What is the <b style="color:var(--colour-ui-primary)">AC</b> resistance looking directly into the base, <b class="colour-resistor">Z<sub>b</sub></b>?',
        hint: () => 'Every unit of base current has to supply β times as much emitter current — so from the base\'s point of view, whatever sits in the emitter leg (RE, plus the transistor\'s own re′) looks β times BIGGER than it really is. Zb = β × (RE + re′).',
        options: () => shuffle([
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">RE</b> + <b class="colour-bjt">re′</b>) = 200 × (270 Ω + 9.57 Ω) ≈ 55.9 kΩ`, type: 'correct' },
          { label: `<b class="colour-gain">Zb</b> ≈ <b class="colour-bjt">β</b> × <b class="colour-resistor">RE</b> = 200 × 270 Ω ≈ 54 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">Zb</b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">RE</b> − <b class="colour-bjt">re′</b>) = 200 × (270 Ω − 9.57 Ω) ≈ 52.1 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">Zb</b> = (<b class="colour-resistor">RE</b> + <b class="colour-bjt">re′</b>) / <b class="colour-bjt">β</b> = 279.57 Ω / 200 ≈ 1.4 Ω`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">R<sub>E</sub></b> + r<sub>e</sub>′) ≈ 55.9 kΩ',
        working: () => `
    <div class="working-line">Every unit of base current supplies β times as much emitter current, so anything in the emitter leg — RE AND the transistor's own internal AC emitter resistance re′ — both get reflected into the base β times bigger.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>b</sub></b> = <b class="colour-bjt">β</b> × (<b class="colour-resistor">R<sub>E</sub></b> + r<sub>e</sub>′) = 200 × (270 Ω + 9.57 Ω)</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>b</sub></b> ≈ 55,914 Ω ≈ 55.9 kΩ — only a little above the RE-only approximation (54 kΩ), since re′ is small next to RE here. This quiz uses <b class="colour-bjt">β</b> = 200 for every worked example (a reasonable mid-range value for a BC549, hFE 110–800 typ). Keep this value, it's used again in the next question.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'What is the <b style="color:var(--colour-ui-primary)">AC</b> input resistance <b class="colour-resistor">Z<sub>in</sub></b> seen by the signal source?',
        hint: () => 'Looking into the base node from the source\'s point of view, R1, R2 and Zb are all three connected between that same node and ground (or VCC, which is AC ground) — that\'s three resistances in PARALLEL, not in series.',
        options: () => shuffle([
          { label: `<span class="frac-option"><b class="colour-gain">Zin</b> = ${frac('1', `${frac('1', '<b class="colour-resistor">R1</b>')} + ${frac('1', '<b class="colour-resistor">R2</b>')} + ${frac('1', '<b class="colour-gain">Zb</b>')}`)} = ${frac('1', `${frac('1', '120 kΩ')} + ${frac('1', '15 kΩ')} + ${frac('1', '55.9 kΩ')}`)} ≈ 10.77 kΩ</span>`, type: 'correct' },
          { label: '<b class="colour-gain">Zin</b> = <b class="colour-resistor">R1</b> + <b class="colour-resistor">R2</b> + <b class="colour-gain">Zb</b> = 120 kΩ + 15 kΩ + 55.9 kΩ ≈ 190.9 kΩ', type: 'wrong' },
          { label: `<span class="frac-option"><b class="colour-gain">Zin</b> = ${frac('1', `${frac('1', '<b class="colour-resistor">R1</b>')} + ${frac('1', '<b class="colour-resistor">R2</b>')}`)} = ${frac('1', `${frac('1', '120 kΩ')} + ${frac('1', '15 kΩ')}`)} ≈ 13.3 kΩ</span>`, type: 'wrong' },
          { label: '<b class="colour-gain">Zin</b> ≈ <b class="colour-gain">Zb</b> = 55.9 kΩ', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>in</sub></b> = R1∥R2∥<b class="colour-resistor">Z<sub>b</sub></b> ≈ 10.77 kΩ',
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>in</sub></b> = R1 ∥ R2 ∥ <b class="colour-resistor">Z<sub>b</sub></b></div>
    <div class="working-line">${frac('1', '<b class="colour-resistor">Z<sub>in</sub></b>')} = ${frac('1', '120,000')} + ${frac('1', '15,000')} + ${frac('1', '55,914')} ≈ 0.0000929 Ω⁻¹</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>in</sub></b> ≈ 10,766 Ω ≈ 10.77 kΩ — barely above the RE-only version of this same calculation (10.7 kΩ), since Zb landing a little higher (re′ included) makes almost no difference once it's in parallel with the much smaller R1∥R2 (13.3 kΩ) — the SMALLEST of three parallel resistances always dominates the combination.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'What is the approximate <b style="color:var(--colour-ui-primary)">AC</b> output resistance <b class="colour-resistor">Z<sub>out</sub></b>, looking back into the collector terminal?',
        hint: () => 'Zero the source, then look back into the collector node. The transistor\'s own internal output resistance (ro) is assumed very high compared to RC in this approximation, so it\'s ignored — leaving only whatever is directly wired to that node.',
        options: () => shuffle([
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RC</b>', type: 'correct' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RE</b>', type: 'wrong' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-gain">Zin</b>', type: 'wrong' },
          { label: '<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RC</b> ∥ <b class="colour-resistor">RE</b>', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b>',
        working: () => `
    <div class="working-line">With the source zeroed, the only thing directly wired to the collector node (besides the transistor's internal, very-high ro — ignored here) is <b class="colour-resistor">R<sub>C</sub></b> itself, running up to the AC-grounded <b class="colour-supply">V<sub>CC</sub></b> rail.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>C</sub></b> = 1.8 kΩ</div>
    <div class="working-total">This is why <b class="colour-resistor">Z<sub>out</sub></b> for a common-emitter stage is usually fairly HIGH (equal to whatever RC happens to be) — a fact that matters a lot once a load is connected to the output, which is covered in a separate quiz.</div>`
      },
      {
        circuitId: 'ce-divider-ac',
        circuitLabel: 'Common Emitter (voltage-divider bias, RE unbypassed)',
        text: () => 'What is the voltage gain <b class="colour-gain">|A<sub>v</sub>|</b> of this common-emitter stage?',
        hint: () => '|Av| ≈ RC / (RE + re′) for a common-emitter stage with an unbypassed emitter.',
        options: () => shuffle([
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RC</b>', '<b class="colour-resistor">RE</b>+<b class="colour-bjt">re′</b>')} = ${frac('1800 Ω', '279.57 Ω')} ≈ 6.44`, type: 'correct' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RC</b>', '<b class="colour-resistor">RE</b>')} = ${frac('1800 Ω', '270 Ω')} ≈ 6.67`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">RE</b>+<b class="colour-bjt">re′</b>', '<b class="colour-resistor">RC</b>')} = ${frac('279.57 Ω', '1800 Ω')} ≈ 0.155`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ <b class="colour-resistor">R<sub>C</sub></b> ≈ 1800`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-gain">|A<sub>v</sub>|</b> ≈ R<sub>C</sub>/(R<sub>E</sub>+r<sub>e</sub>′) ≈ 6.44',
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${frac('<b class="colour-resistor">R<sub>C</sub></b>', '<b class="colour-resistor">R<sub>E</sub></b> + r<sub>e</sub>′')} = ${frac('1800 Ω', '279.57 Ω')}</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ 6.44 — a little below the RE-only approximation (6.67), since re′ adds a bit more to the denominator.</div>`
      },
    ];


    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — now shared: assets/quiz-engine.js (loaded in <head>)
    // provides shuffle/frac/isMulti/isAnswerCorrect/selectedLabel/
    // buildProgressDots/renderOptions/selectOption/showCircuitRef/
    // buildXYRuler/setXY/renderQuestion/checkAnswer/nextQuestion/
    // backQuestion/goToQuestion/resetQuiz/showSummary/openModal/
    // closeModal/goBack/jump/jumpToSummary — nothing here should need to
    // change when questions are added/reordered. Only this file's own
    // progressive-reveal badge functions remain inline below.
    // ══════════════════════════════════════════════════════════════════════

    /* re' reveal on the diagram itself, once Q1 has been answered. Persists
       regardless of which question is currently on screen (unlike the
       ammeter badge, which only shows for its own question) — this is
       "now-known information", same convention as the rest of this
       project's progressive-reveal circuits. */
    function updateReReveal() {
      document.getElementById('reRevealCe').setAttribute('display', Q[0].ans ? 'inline' : 'none');
    }

    /* Zb/Zin/Zout value badges — same "reveal once answered, stays
       revealed" convention as updateReReveal() above. Zb=Q2(idx1),
       Zin=Q3(idx2), Zout=Q4(idx3). */
    function updateZReveal() {
      document.getElementById('zbBadgeCe').setAttribute('display', Q[1].ans ? 'inline' : 'none');
      document.getElementById('zinBadgeCe').setAttribute('display', Q[2].ans ? 'inline' : 'none');
      document.getElementById('zoutBadgeCe').setAttribute('display', Q[3].ans ? 'inline' : 'none');
    }

    RENDER_EXTRA = () => { updateReReveal(); updateZReveal(); };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>

</html>
