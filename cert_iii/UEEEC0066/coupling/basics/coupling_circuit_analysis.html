<!--
  TEMPLATE FILE — read before cloning for a new weekly quiz (see
  ../../bjt/basics/bjt_knowledge_basics.html's own header comment for the
  full explanation of why this structure is mandatory even for a one-
  question file).

  This file uses a data-driven quiz engine: a single `QUESTIONS` array (in
  the <script>, search "QUESTIONS —") drives one generic HTML panel and a
  generic set of engine functions (renderQuestion, checkAnswer,
  nextQuestion, etc). There is deliberately NO per-question HTML or
  per-question JS function. Built on the shared cert_iii/assets/
  quiz-engine.js engine, same convention as every other quiz in this
  project.

  Circuit source: Don's own hand-built ../../../working/transformer_circuit.html
  (a two-stage voltage-divider-bias BJT amplifier, capacitively coupled via
  C1 between Stage 1's collector and Stage 2's base). The <defs> shapes and
  circuit markup below are copied directly from that file (bjt-npn-shape,
  resistor-vertical, cap-shape, the reusable voltage-divider-bias template,
  vd1/vd2 instances, the interstage join with C1, the R8 bypass cap C2,
  and the output load RL) — edit the working file first if the circuit
  itself needs to change, then re-copy here, same "master shape lives
  elsewhere" convention as every other quiz that copies from assets/shapes/.

  Circuit values actually used (read straight off the diagram):
    VCC = 12V, VBE = 0.6V (both stages)
    Stage 1 (Q1, BC-style NPN, β1=300): R1=80kΩ, R2=20kΩ, R3=5.6kΩ,
      R4=1.8kΩ — R4 is UNBYPASSED (no cap shown across it).
    Interstage coupling: C1 = 330nF, between Stage 1's collector and
      Stage 2's base.
    Stage 2 (Q2, β2=400): R5=100kΩ, R6=15kΩ, R7=4.2kΩ, R8=680Ω — R8 IS
      bypassed (C2, "BYPASS R8" group), so Stage 2's own AC gain doesn't
      involve R8 at all.
    Output load: RL=10kΩ, wired straight across Stage 2's own output/
      Common rails (no output coupling cap drawn yet) — doesn't change any
      of the 10 formulas below (RL only ever enters as the parallel AC
      load on R7 for AV2, exactly as it would with a coupling cap there
      too; it never affects Stage 2's own DC bias point, which is set
      purely by its base/emitter loop).

  Formula conventions — DC bias (VB/VE/IC/VC) is new ground for this
  project (the existing bjt/ac_parameters/*.html files all take IE as
  GIVEN rather than deriving it — see that folder's own header comments).
  Standard approximate voltage-divider method used here, valid because the
  divider current is comfortably bigger than the base current it has to
  supply in both stages (~36x for Stage 1, ~30x for Stage 2 — a "stiff"
  divider, so approximating VB = VCC×R2/(R1+R2) while ignoring IB loading
  the divider is a safe approximation, not just a shortcut):
    VB = VCC × R2/(R1+R2),  VE = VB − VBE,  IC ≈ IE = VE/RE,
    VC = VCC − IC×RC.
  AC parameters follow the SAME conventions as bjt/ac_parameters/
  bjt_knowledge_ac_params_ce.html (unbypassed) and _ce_bypassed.html
  (bypassed) exactly — same 26mV constant, same Zb/Zin shape:
    re′ = 26mV/IE
    Zb (unbypassed, Stage 1)  = β×(RE+re′)
    Zb (bypassed, Stage 2)    = β×re′
    Rin(stage) = R1∥R2∥Zb  (three-way reciprocal sum)
  Loaded gain (Stage 1's RC loaded by Stage 2's own Rin, through C1 —
  Stage 1 is unbypassed so R4 stays in the denominator):
    AV1 = −(R3∥Rin2)/(R4+re1′)
  Stage 2's own gain (bypassed, loaded by RL):
    AV2 = −(R7∥RL)/re2′
  AVT = AV1×AV2 — POSITIVE (non-inverting overall), since two inverting
  CE stages cancel each other's inversion.
  f1 (lower roll-off set by the interstage cap) uses the SAME formula this
  project's own coupling_knowledge_basics.html Q8 already established
  (RT = Rout(stage1)+Rin(stage2), no other f1 convention exists anywhere
  else in the project to match instead):
    f1 = 1/(2π×RT×C1),  RT = R3 + Rin2   (Zout(stage1) ≈ R3)
  All 10 values independently verified with a standalone Python script
  before being written into the QUESTIONS[] options/working below — see
  the numbers reproduced in each question's own `working` field.

  "Known values" reveal strip — the project's established convention
  (bjt_knowledge_ac_params_ce.html's own re′/Zb/Zin/Zout badges) places a
  small badge directly on the diagram at the exact node each value
  belongs to. This circuit doesn't have the spare room for that — cramming
  two full stages into one diagram leaves no clean gap near the relevant
  nodes big enough for a badge+label without colliding with a resistor,
  wire or the other stage. Adapted instead as a plain text strip below the
  full circuit (10 slots, revealed left-to-right/top-to-bottom as their
  own question is answered) — same "reveal once answered, stays revealed"
  behaviour, same RENDER_EXTRA mechanism, just laid out in open space
  instead of on the schematic itself.

  Being built as a first version per Don's own request — this is the
  companion CALCULATION exercise to coupling_knowledge_basics.html (the
  conceptual quiz already covering coupling methods/adv-disadv/f1-factors
  for this same "coupling" topic).
-->

    const QUESTIONS = [
      {
        leftPanel: 'circuit',
        text: () => `What is <b class="colour-voltage">V<sub>B1</sub></b>, the DC base voltage of <b class="colour-bjt">Q1</b>?`,
        hint: () => `The divider current through <b class="colour-resistor">R1</b>/<b class="colour-resistor">R2</b> (≈120µA) is far bigger than the base current Q1 actually draws from it (≈3µA) — safe to use the simple unloaded divider formula: VB = <b class="colour-voltage">VCC</b> × <b class="colour-resistor">R2</b>/(<b class="colour-resistor">R1</b>+<b class="colour-resistor">R2</b>).`,
        options: () => shuffle([
          { label: `<b class="colour-voltage">VB1</b> = <b class="colour-voltage">VCC</b> × ${frac('<b class="colour-resistor">R2</b>', '<b class="colour-resistor">R1</b>+<b class="colour-resistor">R2</b>')} = 12V × ${frac('20kΩ', '100kΩ')} ≈ 2.40 V`, type: 'correct' },
          { label: `<b class="colour-voltage">VB1</b> = <b class="colour-voltage">VCC</b> × ${frac('<b class="colour-resistor">R1</b>', '<b class="colour-resistor">R1</b>+<b class="colour-resistor">R2</b>')} = 12V × ${frac('80kΩ', '100kΩ')} ≈ 9.60 V`, type: 'wrong' },

          { label: `<b class="colour-voltage">VB1</b> ≈ 1.80 V`, type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-voltage">V<sub>B1</sub></b> ≈ 2.40 V',
        working: () => `
    <div class="working-formula-row"><b class="colour-voltage">V<sub>B1</sub></b> = <b class="colour-voltage">V<sub>CC</sub></b> × ${frac('<b class="colour-resistor">R2</b>', '<b class="colour-resistor">R1</b>+<b class="colour-resistor">R2</b>')} = 12V × ${frac('20kΩ', '100kΩ')}</div>
    <div class="working-total"><b class="colour-voltage">V<sub>B1</sub></b> ≈ 2.40 V — <b class="colour-resistor">R1</b> and <b class="colour-resistor">R2</b> form a simple voltage divider from <b class="colour-voltage">VCC</b> to Common, and the base draws so little current from it (≈3µA, next to the divider's own ≈120µA) that ignoring that loading is a safe approximation. 9.60V is what you'd get from putting <b class="colour-resistor">R1</b> on top of the fraction instead of <b class="colour-resistor">R2</b> — always the resistor whose junction you're NOT measuring across that sits on top.</div>`
      },
      {
        leftPanel: 'circuit',
        text: () => `What is <b class="colour-voltage">V<sub>E1</sub></b>, the DC emitter voltage of <b class="colour-bjt">Q1</b>?`,

        options: () => shuffle([
          { label: `<b class="colour-voltage">VE1</b> = <b class="colour-voltage">VB1</b> − <b class="colour-voltage">V<sub>BE</sub></b> = 2.40V − 0.6V ≈ 1.80 V`, type: 'correct' },

          { label: `<b class="colour-voltage">VE1</b> = <b class="colour-voltage">VB1</b> + <b class="colour-voltage">V<sub>BE</sub></b> = 2.40V + 0.6V ≈ 3.00 V`, type: 'wrong' },
          { label: `<b class="colour-voltage">VE1</b> ≈ <b class="colour-voltage">V<sub>BE</sub></b> = 0.60 V`, type: 'wrong' },

        correctExplain: () => '<b class="colour-voltage">V<sub>E1</sub></b> ≈ 1.80 V',
        working: () => `
    <div class="working-formula-row"><b class="colour-voltage">V<sub>E1</sub></b> = <b class="colour-voltage">V<sub>B1</sub></b> − <b class="colour-voltage">V<sub>BE</sub></b> = 2.40V − 0.6V</div>
    <div class="working-total"><b class="colour-voltage">V<sub>E1</sub></b> ≈ 1.80 V — the base-emitter junction always drops about 0.6V for a forward-biased silicon BJT, so the emitter always sits 0.6V BELOW the base, never above it. Mixing up VB and VE here is the single most common slip in this whole calculation chain.</div>`
      },
      {
        leftPanel: 'circuit',
        text: () => `What is <b class="colour-current">I<sub>C1</sub></b>, Q1's DC collector current?`,

          { label: `<b class="colour-current">IC1</b> ≈ <b class="colour-current">IE1</b> = ${frac('<b class="colour-voltage">VE1</b>', '<b class="colour-resistor">R4</b>')} = ${frac('1.80V', '1.8kΩ')} ≈ 1.00 mA`, type: 'correct' },

    <div class="working-total"><b class="colour-current">IC1</b> ≈ 1.00 mA — all of VE1 sits across <b class="colour-resistor">R4</b> (that's what defines the emitter node), so IE1 comes straight from Ohm's law there. IC and IE are close enough (<b class="colour-bjt">β</b>=300) to treat as equal for every practical purpose from here on — but don't mistake either of them for IB1, the much smaller base current that's actually flowing INTO the base (IE1 = IB1×(β1+1), so IB1 is smaller by a factor of over 300, not the same current at all).</div>`

      {
        leftPanel: 'circuit',

        correctExplain: () => '<b class="colour-voltage">V<sub>C1</sub></b> ≈ 6.40 V',
        working: () => `
    <div class="working-formula-row"><b class="colour-voltage">VC1</b> = <b class="colour-voltage">V<sub>CC</sub></b> − <b class="colour-current">IC1</b> × <b class="colour-resistor">R3</b> = 12V − (1.00mA × 5.6kΩ)</div>

    <div class="working-total"><b class="colour-bjt">re1′</b> ≈ 26.0 Ω — keep this value, it feeds directly into both <b class="colour-gain">RIN1</b> and <b class="colour-gain">AV1</b> next. Same 26mV/IE formula as every other BJT AC-parameter calculation in this project (see bjt/ac_parameters). IE1 landing on a clean 1.00mA here makes <b class="colour-bjt">re1′</b> come out to exactly the 26mV constant itself — a coincidence of these particular resistor values, not a shortcut you can rely on generally.</div>`

        options: () => shuffle([

          { label: `<b class="colour-gain">RIN1</b> = <b class="colour-resistor">R1</b>+<b class="colour-resistor">R2</b>+[<b class="colour-bjt">β1</b>×(<b class="colour-resistor">R4</b>+<b class="colour-bjt">re1′</b>)] = 80kΩ+20kΩ+548kΩ ≈ 648 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">RIN1</b> ≈ <b class="colour-resistor">R1</b>∥<b class="colour-resistor">R2</b> = 80kΩ∥20kΩ ≈ 16.0 kΩ`, type: 'wrong' },
          { label: `<b class="colour-gain">RIN1</b> ≈ <b class="colour-bjt">β1</b>×(<b class="colour-resistor">R4</b>+<b class="colour-bjt">re1′</b>) = 300×1826Ω ≈ 548 kΩ`, type: 'wrong' },

      },
      {
        leftPanel: 'circuit',
        text: () => `What is <b class="colour-gain">A<sub>V1</sub></b>, Stage 1's loaded voltage gain? (Through <b class="colour-cap">C1</b>, Stage 1's collector is loaded by Stage 2's own input resistance, <b class="colour-gain">RIN2</b> ≈ 4.69 kΩ.)`,

          { label: `<b class="colour-gain">AV1</b> = −${frac('<b class="colour-resistor">R3</b>', '<b class="colour-resistor">R4</b>+<b class="colour-bjt">re1′</b>')} = −${frac('5.6kΩ', '1826Ω')} ≈ −3.07`, type: 'wrong' },
          { label: `<b class="colour-gain">AV1</b> = −${frac('<b class="colour-resistor">R3</b>∥<b class="colour-gain">RIN2</b>', '<b class="colour-bjt">re1′</b>')} = −${frac('2.55kΩ', '26.0Ω')} ≈ −98.1`, type: 'wrong' },

    <div class="working-total"><b class="colour-gain">AVT</b> ≈ +226 — POSITIVE, because each common-emitter stage inverts the signal on its own (a 180° phase flip), and two flips cancel out, leaving the overall output IN PHASE with the original input. Multiplying the more-precise pre-rounding values (−1.398, −161.5) rather than the rounded headline answers (−1.40, −161) is why this doesn't land on EXACTLY 1.40×161=225.4 — a small, normal rounding-cascade difference, not an error.</div>`

    <div class="working-total"><b class="colour-cap">f1</b> ≈ 46.9 Hz — sitting comfortably below the audio band's usual 20Hz lower limit, so <b class="colour-cap">C1</b> isn't the thing narrowing this amplifier's bandwidth at the low end. Mixing up nF and pF on the capacitor value is a 1000× error, exactly like the re′ V/mV slip from earlier in this quiz.</div>`
