<!--
  Rearranging formulas — practice, one algebra step per question. College edition.

  Pick a formula, then work through making each variable the subject one step at a time: every
  step is a question with one correct next line and three invalid ones. A run uses the chosen
  formula's problems once each, in random order, with the steps of each problem always in order.

  No shared engine is used: the page is self-contained apart from the site chrome (same look and
  JavaScript footprint as the other college exercises). The formula data is the FORMULAS array
  in the script; add a formula by appending an entry (id, title, shown, blurb, problems).
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rearranging Formulas — UEEEC0066</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --colour-bg: #f8f9fa;
      --colour-panel: #ffffff;
      --colour-border: #d0d5dd;
      --colour-text: #1d2939;
      --colour-text-strong: #002664;
      --colour-label: #475467;
      --colour-label-rgb: 71, 84, 103;
      --colour-grid: rgba(0, 38, 100, 0.04);

      --colour-ui-primary: #002664;
      --colour-ui-primary-rgb: 0, 38, 100;
      --colour-ui-correct: #087443;
      --colour-ui-correct-rgb: 8, 116, 67;
      --colour-ui-wrong: #d92d20;
      --colour-ui-wrong-rgb: 217, 45, 32;

      --c-voltage: #d92d20; --c-current: #087443; --c-resistor: #a21caf;
      --c-cap: #1d4ed8; --c-gain: #6d28d9; --c-power: #0e7490;

      --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Public Sans', system-ui, -apple-system, sans-serif;

      --radius-lg: 6px;
      --radius-sm: 4px;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    body.dark-theme {
      --colour-bg: #121824;
      --colour-panel: #1a2232;
      --colour-border: #2e3c54;
      --colour-text: #e2e8f0;
      --colour-text-strong: #ffffff;
      --colour-label: #94a3b8;
      --colour-label-rgb: 148, 163, 184;
      --colour-grid: rgba(255, 255, 255, 0.03);

      --colour-ui-primary: #38bdf8;
      --colour-ui-primary-rgb: 56, 189, 248;
      --colour-ui-correct: #34d399;
      --colour-ui-correct-rgb: 52, 211, 153;
      --colour-ui-wrong: #f87171;
      --colour-ui-wrong-rgb: 248, 113, 113;

      --c-voltage: #f87171; --c-current: #34d399; --c-resistor: #e879f9;
      --c-cap: #60a5fa; --c-gain: #a78bfa; --c-power: #22d3ee;

      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--colour-bg);
      color: var(--colour-text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;

      background-size: 40px 40px;

    header { margin-bottom: 1.5rem; width: 100%; max-width: 1000px; }
    header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 4vw, 2.2rem);

    .site-copyright {

    /* ── symbol colours used inside equations ── */
    .colour-voltage { color: var(--c-voltage); }
    .colour-current { color: var(--c-current); }
    .colour-resistor { color: var(--c-resistor); }
    .colour-cap { color: var(--c-cap); }
    .colour-gain { color: var(--c-gain); }
    .colour-power { color: var(--c-power); }

    /* ── stacked fractions and raised exponents ── */
    .working-frac { display: inline-flex; flex-direction: column; text-align: center; vertical-align: middle; margin: 0 .2rem; }
    .working-frac .num { border-bottom: 1px solid currentColor; padding: 0 .2rem; }
    .working-frac .den { padding: 0 .2rem; }
    .pow { display: inline-flex; align-items: flex-start; white-space: nowrap; margin-top: 1.1em; vertical-align: baseline; }
    .pow-base { font-size: 1.45em; line-height: 1; margin-top: .15em; }
    .pow-exp { display: inline-flex; align-items: center; font-size: .78em; margin-left: .15em; transform: translateY(-1.15em); }
    .pow-exp .pow-par { font-size: 1.9em; font-weight: 200; line-height: 1; }
    .pow > .pow-par { font-size: 1.9em; font-weight: 200; line-height: 1; }
    .pow-exp .working-frac .den, .pow-exp .working-frac .num { padding: 0 .15rem; }
    .opt .pow-exp, .working .pow-exp { font-size: .92em; }

    /* ── picker ── */
    .picker-intro { text-align: center; color: var(--colour-label); font-size: .88rem; margin-bottom: 1.1rem; }
    .formula-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .8rem; }
    @media (min-width: 900px) { .formula-grid { grid-template-columns: repeat(4, 1fr); } }
    .formula-card {
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: .6rem;
      padding: 1rem .6rem; min-height: 9.5rem; text-align: center; cursor: pointer;
      border: 1px solid var(--colour-border); border-radius: var(--radius-lg);
      background: var(--colour-panel); color: var(--colour-text); font: inherit;

      border-color: var(--colour-ui-primary);

      box-shadow: 0 0 0 2px rgba(var(--colour-ui-primary-rgb), .3);

    .formula-title { font-weight: 700; font-size: .85rem; }
    .formula-eq { font-size: 1.05rem; }
    .formula-blurb { font-size: .72rem; color: var(--colour-label); }

    /* ── quiz ── */
    .q-progress { font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--colour-label); }
    .q-title { margin-top: .5rem; font-weight: 700; font-size: .98rem; line-height: 1.45; }
    .eq-strip {
      margin: .8rem 0 .3rem; padding: .7rem 1rem;
      border: 1px solid var(--colour-border); border-radius: var(--radius-lg);
      background: rgba(var(--colour-ui-primary-rgb), .06); font-size: 1.15rem; text-align: center;
    }
    .eq-label { display: block; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--colour-label); margin-bottom: .2rem; }
    .eq-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .4rem .7rem; }
    .eq-arrow { color: var(--colour-label); }
    .eq-step:last-child { font-weight: 700; }
    .q-goal { font-size: .85rem; color: var(--colour-label); margin: .4rem 0 .9rem; line-height: 1.5; }
    .opts { display: flex; flex-direction: column; gap: .5rem; }
    .opt {
      display: flex; align-items: center; gap: .8rem; width: 100%; text-align: left;
      padding: .55rem .8rem; border: 1px solid var(--colour-border); border-radius: var(--radius-lg);

      transition: border-color .15s, background .15s;
    }
    .opt:hover:not(:disabled) { border-color: var(--colour-ui-primary); }
    .opt.selected { border-color: var(--colour-ui-primary); background: rgba(var(--colour-ui-primary-rgb), .1); }
    .opt.correct { border-color: var(--colour-ui-correct); background: rgba(var(--colour-ui-correct-rgb), .1); }
    .opt.wrong { border-color: var(--colour-ui-wrong); background: rgba(var(--colour-ui-wrong-rgb), .1); }
    .opt.dim { opacity: .5; }
    .opt:disabled { cursor: default; }
    .opt-letter { font-weight: 800; font-size: .78rem; color: var(--colour-label); min-width: 1rem; }
    .opt-body { flex: 1; min-width: 0; }
    .opt-mark { font-weight: 800; }
    .opt.correct .opt-mark { color: var(--colour-ui-correct); }
    .opt.wrong .opt-mark { color: var(--colour-ui-wrong); }
    .banner { margin-top: .9rem; padding: .6rem .9rem; border-radius: var(--radius-lg); font-size: .88rem; font-weight: 600; }
    .banner.correct { background: rgba(var(--colour-ui-correct-rgb), .12); color: var(--colour-ui-correct); }
    .banner.wrong { background: rgba(var(--colour-ui-wrong-rgb), .12); color: var(--colour-ui-wrong); }
    .working { margin-top: .9rem; padding: .8rem 1rem; border: 1px solid var(--colour-border); border-radius: var(--radius-lg); font-size: .9rem; line-height: 1.6; }
    .working-title { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--colour-label); margin-bottom: .4rem; }
    .working-line, .working-formula-row, .working-total { margin: .35rem 0; }
    .working-total { padding-top: .45rem; border-top: 1px solid var(--colour-border); font-weight: 600; }
    .btn-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.1rem; }
    .btn {
      padding: .5rem 1.1rem; border: 1px solid var(--colour-border); border-radius: var(--radius-lg);
      background: transparent; color: var(--colour-label); cursor: pointer; font-family: inherit;
      font-size: .78rem; font-weight: 700; letter-spacing: .04em; transition: background .15s, color .15s, border-color .15s;
    }
    .btn:hover:not(:disabled) { color: var(--colour-text); border-color: var(--colour-ui-primary); }
    .btn.primary { border-color: var(--colour-ui-primary); color: var(--colour-ui-primary); background: rgba(var(--colour-ui-primary-rgb), .1); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn:focus-visible, .opt:focus-visible, .formula-card:focus-visible { outline: 2px solid var(--colour-ui-primary); outline-offset: 2px; }
    .sum-score { font-size: 1.1rem; font-weight: 800; color: var(--colour-ui-primary); margin-bottom: .8rem; }
    .sum-item { padding: .6rem 0; border-top: 1px solid var(--colour-border); font-size: .88rem; line-height: 1.5; }
    .sum-item .ok { color: var(--colour-ui-correct); font-weight: 800; }
    .sum-item .no { color: var(--colour-ui-wrong); font-weight: 800; }
  </style>

<body>
  <header>
    <h1>Rearranging Formulas</h1>
    <p>Pick a Formula · Make the Subject · One Step at a Time</p>
  </header>

  <div class="main-wrap">
    <div class="card-top-bar">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark and light theme">
        <span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span>
      </button>
    </div>

    <div class="card" id="picker">
      <p class="picker-intro">Choose a formula, then work through the steps to make each variable the subject.</p>
      <div class="formula-grid" id="formulaGrid" role="group" aria-label="Formulas"></div>
      <div class="picker-actions"><button class="btn primary" id="startBtn" disabled>Next →</button></div>
    </div>

    <div class="card" id="quiz" style="display:none"></div>
  </div>

  <footer>Electronics // Cert III // UEEEC0066</footer>

  <script>
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-theme');
      try { localStorage.setItem('tafe-quiz-theme', isDark ? 'dark' : 'light'); } catch (e) { }
      updateThemeToggleUI(isDark);
    }
    function updateThemeToggleUI(isDark) {
      const icon = document.getElementById('themeIcon'), label = document.getElementById('themeLabel');
      if (icon && label) { icon.textContent = isDark ? '☀️' : '🌙'; label.textContent = isDark ? 'Light Mode' : 'Dark Mode'; }
    }
    (function initTheme() {
      let isDark = false;
      try { isDark = localStorage.getItem('tafe-quiz-theme') === 'dark'; } catch (e) { }
      document.body.classList.toggle('dark-theme', isDark);
      updateThemeToggleUI(isDark);
    })();
  </script>
  <script>
    function frac(num, den) { return `<span class="working-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`; }
    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    const LETTERS = ['A', 'B', 'C', 'D'];

    // ── symbol helpers: same colours as the rest of the course ──
    const V = '<b class="colour-voltage">V</b>';
    const I = '<b class="colour-current">I</b>';
    const R = '<b class="colour-resistor">R</b>';
    const F = '<b class="colour-gain">f</b>';
    const C = '<b class="colour-cap">C</b>';
    const PI2 = '2π';
    const XC = '<b class="colour-cap">X<sub>C</sub></b>';
    const AVDB = '<b class="colour-gain">A<sub>V(dB)</sub></b>';
    const VIN = '<b class="colour-voltage">V<sub>in</sub></b>';
    const VOUT = '<b class="colour-voltage">V<sub>out</sub></b>';
    const LOGQ = `log(${frac(VOUT, VIN)})`;                  // log(Vout / Vin)
    // base raised to a (stacked) exponent with tall brackets: 10^( A / 20 )
    const pw = (base, exp) => `<span class="pow"><span class="pow-base">${base}</span><span class="pow-exp"><span class="pow-par">(</span>${exp}<span class="pow-par">)</span></span></span>`;
    const POW = pw('10', frac(AVDB, '20'));                  // 10^(AV(dB) / 20)
    const APDB = '<b class="colour-gain">A<sub>P(dB)</sub></b>';
    const PIN = '<b class="colour-power">P<sub>in</sub></b>';
    const POUT = '<b class="colour-power">P<sub>out</sub></b>';
    const LOGP = `log(${frac(POUT, PIN)})`;                  // log(Pout / Pin)
    const POW10 = pw('10', frac(APDB, '10'));                // 10^(AP(dB) / 10)
    const XL = '<b class="colour-cap">X<sub>L</sub></b>';
    const L = '<b class="colour-cap">L</b>';
    const X = ' × ', EQ = ' = ';

    const FORMULAS = [
      {
        id: 'ohm',
        title: "Ohm's law",
        shown: `${V}${EQ}${I}${X}${R}`,
        blurb: 'Make V, I or R the subject',
        problems: [
      {
        name: "make R the subject",
        start: `${I} = ${frac(V, R)}`,
        target: R,
        steps: [
          {
            goal: `${R} is stuck underneath ${V}, so it is being <b>divided</b> into it. Undo the divide by ${R} by doing the opposite to <b>both</b> sides.`,
            line: `${I}${X}${R}${EQ}${V}`,
            wrong: [
              `${frac(I, R)}${EQ}${V}`,
              `${I}${EQ}${V}${X}${R}`,
              `${I} + ${R}${EQ}${V}`,
            ],
            why: `The opposite of ÷${R} is ×${R}. Multiply <b>both</b> sides by ${R}: on the right, ${frac(V, R)}${X}${R} cancels to ${V}; on the left, ${I} picks up the ${R}.`,
          },
          {
            goal: `${R} is now multiplied by ${I}. Undo it with the opposite operation on both sides.`,
            line: `${R}${EQ}${frac(V, I)}`,
            wrong: [
              `${R}${EQ}${V}${X}${I}`,
              `${R}${EQ}${frac(I, V)}`,
              `${R}${EQ}${V} − ${I}`,
            ],
            why: `The opposite of ×${I} is ÷${I}. Divide <b>both</b> sides by ${I}: the left becomes ${R}, the right becomes ${frac(V, I)}.`,
          },
        ],
      },
      {
        name: "make V the subject",
        start: `${R}${EQ}${frac(V, I)}`,
        target: V,
        steps: [
          {
            goal: `${V} is divided by ${I}. Get it out of the fraction by doing the opposite to <b>both</b> sides.`,
            line: `${R}${X}${I}${EQ}${V}`,
            wrong: [
              `${frac(R, I)}${EQ}${V}`,
              `${R} + ${I}${EQ}${V}`,
              `${R}${EQ}${V}${X}${I}`,
            ],
            why: `The opposite of ÷${I} is ×${I}. Multiply <b>both</b> sides by ${I}: on the right the ${I} cancels leaving ${V}; on the left ${R} becomes ${R}${X}${I}.`,
          },
          {
            goal: `The unknown is on the right-hand side. Write the equation with ${V} as the subject, on the left.`,
            line: `${V}${EQ}${R}${X}${I}`,
            wrong: [
              `${V}${EQ}${frac(R, I)}`,
              `${V}${EQ}${R} + ${I}`,
              `${V}${EQ}${frac(I, R)}`,
            ],
            why: `If a = b then b = a. Nothing about the values changes — you are only swapping sides so the subject is on the left.`,
          },
        ],
      },
      {
        name: "make I the subject",
        start: `${V}${EQ}${I}${X}${R}`,
        target: I,
        steps: [
          {
            goal: `${I} is multiplied by ${R}. Undo that by doing the opposite to <b>both</b> sides.`,
            line: `${frac(V, R)}${EQ}${I}`,
            wrong: [
              `${V} − ${R}${EQ}${I}`,
              `${V}${X}${R}${EQ}${I}`,
              `${V}${EQ}${frac(I, R)}`,
            ],
            why: `The opposite of ×${R} is ÷${R}. Divide <b>both</b> sides by ${R}: the right becomes ${I}, the left becomes ${frac(V, R)}.`,
          },
          {
            goal: `Write it with ${I} as the subject on the left.`,
            line: `${I}${EQ}${frac(V, R)}`,
            wrong: [
              `${I}${EQ}${frac(R, V)}`,
              `${I}${EQ}${V}${X}${R}`,
              `${I}${EQ}${V} − ${R}`,
            ],
            why: `Swap the two sides. ${frac(V, R)}${EQ}${I} and ${I}${EQ}${frac(V, R)} say exactly the same thing.`,
          },
        ],
      },
        ],
      },
      {
        id: 'rc',
        title: 'Frequency (RC)',
        shown: `${F}${EQ}${frac('1', `${PI2}${X}${R}${X}${C}`)}`,
        blurb: 'Make R or C the subject',
        problems: [
      {
        name: "make R the subject",
        start: `${F}${EQ}${frac('1', `${PI2}${X}${R}${X}${C}`)}`,
        target: R,
        steps: [
          {
            goal: `${R} is part of the bottom line, multiplied by ${PI2} and ${C}. Multiply <b>both</b> sides by ${R} to bring it out of the fraction.`,
            line: `${F}${X}${R}${EQ}${frac('1', `${PI2}${X}${C}`)}`,
            wrong: [
              `${frac(F, R)}${EQ}${frac('1', `${PI2}${X}${C}`)}`,
              `${F}${EQ}${frac('1', `${PI2}${X}${C}`)}`,
              `${F}${X}${R}${EQ}${frac('1', `${PI2}${X}${R}${X}${C}`)}`,
            ],
            why: `Multiplying the right side by ${R} cancels the ${R} on the bottom, leaving ${frac('1', `${PI2}${X}${C}`)}. The left side must be multiplied by ${R} too: ${F}${X}${R}. Doing it to one side only (or dropping the ${R} without multiplying the left) breaks the equation.`,
          },
          {
            goal: `${R} is now multiplied by ${F}. Do the opposite to <b>both</b> sides so ${R} is on its own.`,
            line: `${R}${EQ}${frac('1', `${PI2}${X}${F}${X}${C}`)}`,
            wrong: [
              `${R}${EQ}${frac(F, `${PI2}${X}${C}`)}`,
              `${R}${EQ}${frac('1', `${PI2}${X}${C}`)} − ${F}`,
              `${R}${EQ}${PI2}${X}${F}${X}${C}`,
            ],
            why: `Divide <b>both</b> sides by ${F}. The left becomes ${R}; on the right, ${frac('1', `${PI2}${X}${C}`)} divided by ${F} puts the ${F} underneath alongside ${PI2} and ${C}.`,
          },
        ],
      },
      {
        name: "make C the subject",
        start: `${F}${EQ}${frac('1', `${PI2}${X}${R}${X}${C}`)}`,
        target: C,
        steps: [
          {
            goal: `${C} is part of the bottom line, multiplied by ${PI2} and ${R}. Multiply <b>both</b> sides by ${C} to bring it out of the fraction.`,
            line: `${F}${X}${C}${EQ}${frac('1', `${PI2}${X}${R}`)}`,
            wrong: [
              `${frac(F, C)}${EQ}${frac('1', `${PI2}${X}${R}`)}`,
              `${F}${EQ}${frac('1', `${PI2}${X}${R}`)}`,
              `${F}${X}${C}${EQ}${frac('1', `${PI2}${X}${R}${X}${C}`)}`,
            ],
            why: `Multiplying the right side by ${C} cancels the ${C} on the bottom, leaving ${frac('1', `${PI2}${X}${R}`)}. The left side must be multiplied by ${C} too: ${F}${X}${C}.`,
          },
          {
            goal: `${C} is now multiplied by ${F}. Do the opposite to <b>both</b> sides so ${C} is on its own.`,
            line: `${C}${EQ}${frac('1', `${PI2}${X}${F}${X}${R}`)}`,
            wrong: [
              `${C}${EQ}${frac(F, `${PI2}${X}${R}`)}`,
              `${C}${EQ}${frac('1', `${PI2}${X}${R}`)} − ${F}`,
              `${C}${EQ}${PI2}${X}${F}${X}${R}`,
            ],
            why: `Divide <b>both</b> sides by ${F}. The left becomes ${C}; on the right the ${F} goes underneath alongside ${PI2} and ${R}. The result has the same shape as the ${R} version — ${R} and ${C} swap places.`,
          },
        ],
      },
        ],
      },
      {
        id: 'xc',
        title: 'Capacitive reactance',
        shown: `${XC}${EQ}${frac('1', `${PI2}${X}${F}${X}${C}`)}`,
        blurb: 'Make f or C the subject',
        problems: [
      {
        name: "make f the subject",
        start: `${XC}${EQ}${frac('1', `${PI2}${X}${F}${X}${C}`)}`,
        target: F,
        steps: [
          {
            goal: `${F} is part of the bottom line, multiplied by ${PI2} and ${C}. Multiply <b>both</b> sides by ${F} to bring it out of the fraction.`,
            line: `${XC}${X}${F}${EQ}${frac('1', `${PI2}${X}${C}`)}`,
            wrong: [
              `${frac(XC, F)}${EQ}${frac('1', `${PI2}${X}${C}`)}`,
              `${XC}${EQ}${frac('1', `${PI2}${X}${C}`)}`,
              `${XC}${X}${F}${EQ}${frac('1', `${PI2}${X}${F}${X}${C}`)}`,
            ],
            why: `Multiplying the right side by ${F} cancels the ${F} on the bottom, leaving ${frac('1', `${PI2}${X}${C}`)}. The left side must be multiplied by ${F} too: ${XC}${X}${F}.`,
          },
          {
            goal: `${F} is now multiplied by ${XC}. Do the opposite to <b>both</b> sides so ${F} is on its own.`,
            line: `${F}${EQ}${frac('1', `${PI2}${X}${XC}${X}${C}`)}`,
            wrong: [
              `${F}${EQ}${frac(XC, `${PI2}${X}${C}`)}`,
              `${F}${EQ}${frac('1', `${PI2}${X}${C}`)} − ${XC}`,
              `${F}${EQ}${PI2}${X}${XC}${X}${C}`,
            ],
            why: `Divide <b>both</b> sides by ${XC}. The left becomes ${F}; on the right the ${XC} goes underneath alongside ${PI2} and ${C}. The same pattern as making R or C the subject of f = 1/(2πRC).`,
          },
        ],
      },
      {
        name: "make C the subject",
        start: `${XC}${EQ}${frac('1', `${PI2}${X}${F}${X}${C}`)}`,
        target: C,
        steps: [
          {
            goal: `${C} is part of the bottom line, multiplied by ${PI2} and ${F}. Multiply <b>both</b> sides by ${C} to bring it out of the fraction.`,
            line: `${XC}${X}${C}${EQ}${frac('1', `${PI2}${X}${F}`)}`,
            wrong: [
              `${frac(XC, C)}${EQ}${frac('1', `${PI2}${X}${F}`)}`,
              `${XC}${EQ}${frac('1', `${PI2}${X}${F}`)}`,
              `${XC}${X}${C}${EQ}${frac('1', `${PI2}${X}${F}${X}${C}`)}`,
            ],
            why: `Multiplying the right side by ${C} cancels the ${C} on the bottom, leaving ${frac('1', `${PI2}${X}${F}`)}. The left side must be multiplied by ${C} too: ${XC}${X}${C}.`,
          },
          {
            goal: `${C} is now multiplied by ${XC}. Do the opposite to <b>both</b> sides so ${C} is on its own.`,
            line: `${C}${EQ}${frac('1', `${PI2}${X}${F}${X}${XC}`)}`,
            wrong: [
              `${C}${EQ}${frac(XC, `${PI2}${X}${F}`)}`,
              `${C}${EQ}${frac('1', `${PI2}${X}${F}`)} − ${XC}`,
              `${C}${EQ}${PI2}${X}${F}${X}${XC}`,
            ],
            why: `Divide <b>both</b> sides by ${XC}. The left becomes ${C}; on the right the ${XC} goes underneath alongside ${PI2} and ${F}.`,
          },
        ],
      },
        ],
      },
      {
        id: 'db',
        title: 'Decibel voltage gain',
        shown: `${AVDB}${EQ}20${X}${LOGQ}`,
        blurb: 'Make V<sub>in</sub> the subject',
        problems: [
      {
        name: "make V<sub>in</sub> the subject",
        start: `${AVDB}${EQ}20${X}${LOGQ}`,
        target: VIN,
        steps: [
          {
            goal: `The 20 is multiplying the log. Undo it by doing the opposite to <b>both</b> sides.`,
            line: `${frac(AVDB, '20')}${EQ}${LOGQ}`,
            wrong: [
              `${AVDB} − 20${EQ}${LOGQ}`,
              `${AVDB}${X}20${EQ}${LOGQ}`,
              `${frac(AVDB, '20')}${EQ}${frac('log(' + VOUT + ')', 'log(' + VIN + ')')}`,
            ],
            why: `The opposite of ×20 is ÷20. Divide <b>both</b> sides by 20. (The log of a ratio can't be split into one log over another — leave ${LOGQ} as it is.)`,
          },
          {
            goal: `Now ${VIN} is trapped inside a log. The opposite of log (base 10) is 10 to the power of — do it to <b>both</b> sides.`,
            line: `${POW}${EQ}${frac(VOUT, VIN)}`,
            wrong: [
              `${frac(AVDB, '20')}${EQ}${pw('10', frac(VOUT, VIN))}`,
              `10${X}${frac(AVDB, '20')}${EQ}${frac(VOUT, VIN)}`,
              `<span class="pow"><span class="pow-par">(</span>${frac(AVDB, '20')}<span class="pow-par">)</span><span class="pow-exp pow-plain">10</span></span>${EQ}${frac(VOUT, VIN)}`,
            ],
            why: `Raising 10 to a power undoes a base-10 log: 10<sup>log(x)</sup> = x. Apply it to <b>both</b> sides — the whole left side becomes the power, and the log on the right disappears leaving ${frac(VOUT, VIN)}.`,
          },
          {
            goal: `${VIN} is on the bottom of the fraction. Multiply <b>both</b> sides by ${VIN} to bring it up.`,
            line: `${VIN}${X}${POW}${EQ}${VOUT}`,
            wrong: [
              `${frac(POW, VIN)}${EQ}${VOUT}`,
              `${VIN}${EQ}${VOUT}${X}${POW}`,
              `${VIN} + ${POW}${EQ}${VOUT}`,
            ],
            why: `Multiplying the right side by ${VIN} cancels the ${VIN} underneath, leaving ${VOUT}. The left side gets ×${VIN} as well, so it becomes ${VIN}${X}${POW}.`,
          },
          {
            goal: `${VIN} is now multiplied by ${POW}. Do the opposite to <b>both</b> sides so ${VIN} stands alone.`,
            line: `${VIN}${EQ}${frac(VOUT, POW)}`,
            wrong: [
              `${VIN}${EQ}${VOUT}${X}${POW}`,
              `${VIN}${EQ}${frac(POW, VOUT)}`,
              `${VIN}${EQ}${VOUT} − ${POW}`,
            ],
            why: `Divide <b>both</b> sides by ${POW}. The left becomes ${VIN}; the right becomes ${frac(VOUT, POW)}. In words: the input voltage is the output voltage divided by the voltage gain, where the gain ratio is 10 to the power of (dB ÷ 20).`,
          },
        ],
      },
        ],
      },
      {
        id: 'dbp',
        title: 'Decibel power gain',
        shown: `${APDB}${EQ}10${X}${LOGP}`,
        blurb: 'Make P<sub>in</sub> the subject',
        problems: [
      {
        name: "make P<sub>in</sub> the subject",
        start: `${APDB}${EQ}10${X}${LOGP}`,
        target: PIN,
        steps: [
          {
            goal: `The 10 is multiplying the log. Undo it by doing the opposite to <b>both</b> sides.`,
            line: `${frac(APDB, '10')}${EQ}${LOGP}`,
            wrong: [
              `${APDB} − 10${EQ}${LOGP}`,
              `${APDB}${X}10${EQ}${LOGP}`,
              `${frac(APDB, '10')}${EQ}${frac('log(' + POUT + ')', 'log(' + PIN + ')')}`,
            ],
            why: `The opposite of ×10 is ÷10. Divide <b>both</b> sides by 10. (The log of a ratio can't be split into one log over another — leave ${LOGP} as it is.)`,
          },
          {
            goal: `Now ${PIN} is trapped inside a log. The opposite of log (base 10) is 10 to the power of — do it to <b>both</b> sides.`,
            line: `${POW10}${EQ}${frac(POUT, PIN)}`,
            wrong: [
              `${frac(APDB, '10')}${EQ}${pw('10', frac(POUT, PIN))}`,
              `10${X}${frac(APDB, '10')}${EQ}${frac(POUT, PIN)}`,
              `<span class="pow"><span class="pow-par">(</span>${frac(APDB, '10')}<span class="pow-par">)</span><span class="pow-exp pow-plain">10</span></span>${EQ}${frac(POUT, PIN)}`,
            ],
            why: `Raising 10 to a power undoes a base-10 log: 10<sup>log(x)</sup> = x. Apply it to <b>both</b> sides — the whole left side becomes the power, and the log on the right disappears leaving ${frac(POUT, PIN)}.`,
          },
          {
            goal: `${PIN} is on the bottom of the fraction. Multiply <b>both</b> sides by ${PIN} to bring it up.`,
            line: `${PIN}${X}${POW10}${EQ}${POUT}`,
            wrong: [
              `${frac(POW10, PIN)}${EQ}${POUT}`,
              `${PIN}${EQ}${POUT}${X}${POW10}`,
              `${PIN} + ${POW10}${EQ}${POUT}`,
            ],
            why: `Multiplying the right side by ${PIN} cancels the ${PIN} underneath, leaving ${POUT}. The left side gets ×${PIN} as well, so it becomes ${PIN}${X}${POW10}.`,
          },
          {
            goal: `${PIN} is now multiplied by ${POW10}. Do the opposite to <b>both</b> sides so ${PIN} stands alone.`,
            line: `${PIN}${EQ}${frac(POUT, POW10)}`,
            wrong: [
              `${PIN}${EQ}${POUT}${X}${POW10}`,
              `${PIN}${EQ}${frac(POW10, POUT)}`,
              `${PIN}${EQ}${POUT} − ${POW10}`,
            ],
            why: `Divide <b>both</b> sides by ${POW10}. The left becomes ${PIN}; the right becomes ${frac(POUT, POW10)}. Note the 10 in the exponent's denominator: power ratios use 10 log, voltage ratios use 20 log.`,
          },
        ],
      },
        ],
      },
      {
        id: 'xl',
        title: 'Inductive reactance',
        shown: `${XL}${EQ}${PI2}${X}${F}${X}${L}`,
        blurb: 'Make f or L the subject',
        problems: [
      {
        name: "make f the subject",
        start: `${XL}${EQ}${PI2}${X}${F}${X}${L}`,
        target: F,
        steps: [
          {
            goal: `${F} is multiplied by ${PI2} and ${L}. Start by undoing the ${L}: do the opposite to <b>both</b> sides.`,
            line: `${frac(XL, L)}${EQ}${PI2}${X}${F}`,
            wrong: [
              `${XL} − ${L}${EQ}${PI2}${X}${F}`,
              `${XL}${X}${L}${EQ}${PI2}${X}${F}`,
              `${XL}${EQ}${frac(`${PI2}${X}${F}`, L)}`,
            ],
            why: `The opposite of ×${L} is ÷${L}. Divide <b>both</b> sides by ${L}: on the right the ${L} cancels, leaving ${PI2}${X}${F}; on the left ${XL} goes over ${L}.`,
          },
          {
            goal: `${F} is still multiplied by ${PI2}. Do the opposite to <b>both</b> sides.`,
            line: `${frac(XL, `${PI2}${X}${L}`)}${EQ}${F}`,
            wrong: [
              `${frac(XL, L)}${EQ}${F}`,
              `${frac(`${XL}${X}${PI2}`, L)}${EQ}${F}`,
              `${frac(XL, L)} − ${PI2}${EQ}${F}`,
            ],
            why: `The opposite of ×${PI2} is ÷${PI2}. Divide <b>both</b> sides by ${PI2}: the right becomes ${F}; the left becomes ${frac(XL, `${PI2}${X}${L}`)} (the ${PI2} joins the ${L} underneath).`,
          },
          {
            goal: `Write it with ${F} as the subject on the left.`,
            line: `${F}${EQ}${frac(XL, `${PI2}${X}${L}`)}`,
            wrong: [
              `${F}${EQ}${frac(`${PI2}${X}${L}`, XL)}`,
              `${F}${EQ}${XL}${X}${PI2}${X}${L}`,
              `${F}${EQ}${XL} − ${PI2}${X}${L}`,
            ],
            why: `Swap the two sides — the equation says exactly the same thing, with the subject on the left.`,
          },
        ],
      },
      {
        name: "make L the subject",
        start: `${XL}${EQ}${PI2}${X}${F}${X}${L}`,
        target: L,
        steps: [
          {
            goal: `${L} is multiplied by ${PI2} and ${F}. Start by undoing the ${F}: do the opposite to <b>both</b> sides.`,
            line: `${frac(XL, F)}${EQ}${PI2}${X}${L}`,
            wrong: [
              `${XL} − ${F}${EQ}${PI2}${X}${L}`,
              `${XL}${X}${F}${EQ}${PI2}${X}${L}`,
              `${XL}${EQ}${frac(`${PI2}${X}${L}`, F)}`,
            ],
            why: `The opposite of ×${F} is ÷${F}. Divide <b>both</b> sides by ${F}: on the right the ${F} cancels, leaving ${PI2}${X}${L}; on the left ${XL} goes over ${F}.`,
          },
          {
            goal: `${L} is still multiplied by ${PI2}. Do the opposite to <b>both</b> sides.`,
            line: `${frac(XL, `${PI2}${X}${F}`)}${EQ}${L}`,
            wrong: [
              `${frac(XL, F)}${EQ}${L}`,
              `${frac(`${XL}${X}${PI2}`, F)}${EQ}${L}`,
              `${frac(XL, F)} − ${PI2}${EQ}${L}`,
            ],
            why: `The opposite of ×${PI2} is ÷${PI2}. Divide <b>both</b> sides by ${PI2}: the right becomes ${L}; the left becomes ${frac(XL, `${PI2}${X}${F}`)} (the ${PI2} joins the ${F} underneath).`,
          },
          {
            goal: `Write it with ${L} as the subject on the left.`,
            line: `${L}${EQ}${frac(XL, `${PI2}${X}${F}`)}`,
            wrong: [
              `${L}${EQ}${frac(`${PI2}${X}${F}`, XL)}`,
              `${L}${EQ}${XL}${X}${PI2}${X}${F}`,
              `${L}${EQ}${XL} − ${PI2}${X}${F}`,
            ],
            why: `Swap the two sides — the equation says exactly the same thing, with the subject on the left.`,
          },
        ],
      },
        ],
      },
    ];


    // ── a run: the chosen formula's problems once each, random order, steps in order ──
    let chosenId = null, formula = null, run = [], idx = 0, picked = null, checked = false, results = [];

    function buildRun() {
      run = [];
      const problems = shuffle(formula.problems.slice());
      problems.forEach((p, pi) => {
        p.steps.forEach((s, si) => {
          const history = [p.start, ...p.steps.slice(0, si).map(prev => prev.line)];
          run.push({
            title: `<b>${formula.title}</b> — problem ${pi + 1} of ${problems.length}: ${p.name}.<br>Step ${si + 1} of ${p.steps.length}: which line comes next?`,
            history, goal: s.goal, why: s.why, line: s.line, target: p.target, last: si === p.steps.length - 1,
            options: shuffle([{ label: s.line, correct: true }, ...s.wrong.map(w => ({ label: w, correct: false }))]),
          });
        });
      });
    }

    function renderPicker() {
      const grid = document.getElementById('formulaGrid');
      grid.innerHTML = FORMULAS.map(f => `
        <button type="button" class="formula-card${f.id === chosenId ? ' selected' : ''}" data-id="${f.id}" aria-pressed="${f.id === chosenId}">
          <span class="formula-title">${f.title}</span>
          <span class="formula-eq">${f.shown}</span>
          <span class="formula-blurb">${f.blurb}</span>
        </button>`).join('');
      grid.querySelectorAll('.formula-card').forEach(b => b.addEventListener('click', () => { chosenId = b.dataset.id; renderPicker(); }));
      document.getElementById('startBtn').disabled = !chosenId;
    }

    function startRun() {
      formula = FORMULAS.find(f => f.id === chosenId);
      if (!formula) return;
      buildRun(); idx = 0; picked = null; checked = false; results = [];
      document.getElementById('picker').style.display = 'none';
      document.getElementById('quiz').style.display = '';
      renderQuestion();
      window.scrollTo(0, 0);
    }
    function toPicker() {
      document.getElementById('quiz').style.display = 'none';
      document.getElementById('picker').style.display = '';
      renderPicker();
      window.scrollTo(0, 0);
    }

    function renderQuestion() {
      const q = run[idx];
      const strip = `<div class="eq-strip"><span class="eq-label">Equation so far</span><span class="eq-line">${q.history.map(h => `<span class="eq-step">${h}</span>`).join('<span class="eq-arrow">→</span>')}</span></div>`;
      const opts = q.options.map((o, i) => {
        let cls = 'opt', mark = '';
        if (checked) {
          if (o.correct) { cls += ' correct'; mark = '✓'; }
          else if (i === picked) { cls += ' wrong'; mark = '✗'; }
          else cls += ' dim';
        } else if (i === picked) cls += ' selected';
        return `<button type="button" class="${cls}" data-i="${i}"${checked ? ' disabled' : ''}>
          <span class="opt-letter">${LETTERS[i]}</span><span class="opt-body">${o.label}</span><span class="opt-mark">${mark}</span></button>`;
      }).join('');
      const ok = checked && q.options[picked] && q.options[picked].correct;
      const banner = checked ? `<div class="banner ${ok ? 'correct' : 'wrong'}">${ok ? 'Correct!' : 'Not quite.'} ${ok ? '' : 'The correct line is: '}${q.line}</div>` : '';
      const working = checked ? `<div class="working"><div class="working-title">Worked Solution</div>
          <div class="working-line">${q.why}</div>
          <div class="working-formula-row">${q.history[q.history.length - 1]} &nbsp;→&nbsp; ${q.line}</div>
          ${q.last ? `<div class="working-total">Done: ${q.target} is now the subject — ${q.line}</div>` : `<div class="working-line">Next step: carry on from ${q.line}.</div>`}</div>` : '';
      const lastQ = idx === run.length - 1;
      document.getElementById('quiz').innerHTML = `
        <div class="q-progress">Question ${idx + 1} of ${run.length}</div>
        <div class="q-title">${q.title}</div>
        ${strip}
        <div class="q-goal">${q.goal}</div>
        <div class="opts">${opts}</div>
        ${banner}${working}
        <div class="btn-row">
          ${checked ? `<button class="btn primary" id="nextBtn">${lastQ ? 'See Summary →' : 'Next →'}</button>`
                    : `<button class="btn primary" id="checkBtn"${picked === null ? ' disabled' : ''}>Check</button>`}
          <button class="btn" id="restartBtn">↺ Restart</button>
          <button class="btn" id="formulasBtn">← Formulas</button>
        </div>`;
      const quiz = document.getElementById('quiz');
      quiz.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { if (!checked) { picked = +b.dataset.i; renderQuestion(); } }));
      const c = document.getElementById('checkBtn'); if (c) c.addEventListener('click', check);
      const n = document.getElementById('nextBtn'); if (n) n.addEventListener('click', next);
      document.getElementById('restartBtn').addEventListener('click', startRun);
      document.getElementById('formulasBtn').addEventListener('click', toPicker);
    }

    function check() {
      if (picked === null) return;
      checked = true;
      results.push(run[idx].options[picked].correct);
      renderQuestion();
    }
    function next() {
      if (idx < run.length - 1) { idx++; picked = null; checked = false; renderQuestion(); }
      else renderSummary();
    }
    function renderSummary() {
      const score = results.filter(Boolean).length;
      document.getElementById('quiz').innerHTML = `
        <div class="q-progress">Summary</div>
        <div class="sum-score">${score} of ${run.length} correct</div>
        ${run.map((q, i) => `<div class="sum-item"><span class="${results[i] ? 'ok' : 'no'}">${results[i] ? '✓' : '✗'}</span> Q${i + 1} — ${q.line}</div>`).join('')}
        <div class="btn-row">
          <button class="btn primary" id="restartBtn">↺ Restart</button>
          <button class="btn" id="formulasBtn">← Formulas</button>
        </div>`;
      document.getElementById('restartBtn').addEventListener('click', startRun);
      document.getElementById('formulasBtn').addEventListener('click', toPicker);
    }

    document.getElementById('startBtn').addEventListener('click', startRun);
    renderPicker();
  </script>
