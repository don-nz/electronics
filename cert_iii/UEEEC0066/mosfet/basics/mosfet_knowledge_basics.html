<!--
  MOSFET counterpart to ../../jfet/basics/jfet_knowledge_basics.html — same
  4-question structure (Q1 shapeGrid symbol-ID, Q2/Q3 kind:'fill' terminal
  labelling, Q4 kind:'match' device comparison), same shared engine
  (assets/quiz-engine.js), rebuilt content where the electronics genuinely
  differs rather than a search-and-replace of that file:

    - Q1's validity rule is different from the JFET version. A JFET symbol
      has ONE rule (one arrow, on the gate lead). A MOSFET symbol has TWO
      independent things going on: the CHANNEL LINE (broken=enhancement,
      solid=depletion — always a valid reading either way, never a
      validity error) and the ARROW (exactly one, on the substrate/body
      lead only, in=N-channel/out=P-channel — THIS is the rule the error
      variants break, same "wrong lead / too many arrows" error family as
      the JFET quiz's own Q1, just moved from the gate lead to the
      substrate lead). See ../../../assets/shapes/mosfet-symbols.svg's own
      header comment for the full shape set (edit there first).
    - Q2/Q3 use a FIXED terminal layout (Drain always top, Source always
      bottom, Gate always left) rather than the JFET quiz's flipped
      top/bottom variant per question — the MOSFET base shape only has one
      gate-position geometry (no "gate near top" mirror was ever drawn),
      so there's nothing to flip. Q2/Q3 differ only in shapeId (N-channel
      enhancement vs P-channel enhancement), which is enough to exercise
      both channel-type readings without needing a second circuit layout.
    - Q4 compares MOSFET against JFET (not BJT) — the natural next
      comparison once a student already knows JFET basics, and the one
      this course's own folder structure (mosfet/ sitting beside jfet/)
      invites. Genuinely different content from the JFET quiz's own
      JFET-vs-BJT Q4: insulated gate vs reverse-biased junction gate,
      near-zero-but-real leakage current vs even-closer-to-zero-but-ESD-
      fragile, and the JFET's single depletion-only behaviour vs a
      MOSFET's two distinct enhancement/depletion modes.

  Built on the shared engine, assets/quiz-engine.js.
-->

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field

    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Mirrors jfet_knowledge_basics.html's own Q1 structurally — 8
        // shapes, 4 valid — but the validity RULE is MOSFET-specific: one
        // arrow, on the SUBSTRATE lead (not gate), in=N/out=P. See
        // ../../../assets/shapes/mosfet-symbols.svg's own header comment.
        leftPanel: 'shapeGrid',
        kind: 'multi',
        shapeViewBox: '-55 -55 110 110',
        text: () => `<b style="color:var(--colour-ui-primary)">Click</b> every shape below that is a <b class="colour-mosfet">valid</b> MOSFET transistor symbol. There are <b style="color:var(--colour-ui-correct)">4 correct</b> shapes among the 8 shown.`,
        hint: () => `A valid symbol has exactly one arrow, on the substrate/body lead (never the drain or source lead). Pointing IN toward the channel means N-channel; pointing OUT means P-channel. Whether the channel line is broken or solid is NEVER a validity error — it just tells you enhancement or depletion.`,
        options: () => shuffle([
          { label: 'N-channel, enhancement (broken channel)', type: 'correct', shapeId: 'mosfet-n-e-shape' },
          { label: 'N-channel, depletion (solid channel)',    type: 'correct', shapeId: 'mosfet-n-d-shape' },
          { label: 'P-channel, enhancement (broken channel)', type: 'correct', shapeId: 'mosfet-p-e-shape' },
          { label: 'P-channel, depletion (solid channel)',    type: 'correct', shapeId: 'mosfet-p-d-shape' },
          { label: 'Arrow on drain lead, pointing in',  type: 'wrong', shapeId: 'mosfet-error-wronglead-in' },
          { label: 'Arrow on drain lead, pointing out', type: 'wrong', shapeId: 'mosfet-error-wronglead-out' },
          { label: 'Two arrows (drain &amp; source), both pointing in',  type: 'wrong', shapeId: 'mosfet-error-double-in' },
          { label: 'Two arrows (drain &amp; source), both pointing out', type: 'wrong', shapeId: 'mosfet-error-double-out' }
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(n => n).join(', ');
          return `Shapes <b>${nums}</b> are the valid MOSFET symbols`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Valid symbols — shapes ${correctNums}:</div>
    <div class="working-line">Each has exactly one arrow, on the <b style="color:var(--colour-ui-correct)">substrate/body lead</b>. The arrow points <b style="color:var(--colour-ui-correct)">into</b> the channel for N-channel, or <b style="color:var(--colour-ui-correct)">out of</b> the channel for P-channel. Whether the channel line is drawn broken (enhancement — no channel until V<sub>GS</sub> induces one) or solid (depletion — already conducts at V<sub>GS</sub>=0) is a separate, independent choice — it never affects whether the symbol is valid.</div>
    <div class="working-step" style="margin-top:.6rem">Invalid symbols — shapes ${wrongNums}:</div>
    <div class="working-line">Each breaks the one-arrow-on-the-substrate rule: two of them put their single arrow on a <b style="color:var(--colour-ui-wrong)">drain/source lead</b> instead — an arrow never belongs there — and the other two put <b style="color:var(--colour-ui-wrong)">two arrows</b> on the symbol at once (also on the wrong leads), when a real MOSFET symbol only ever has one, on the substrate.</div>`;
        }
      },
      {
        leftPanel: 'circuit',
        kind: 'fill',
        circuitConfig: { shapeId: 'mosfet-n-e-shape' },
        slotIds: ['slotBoxTop', 'slotBoxG', 'slotBoxBottom'],
        text: () => `This is an <b style="color:var(--colour-ui-primary)">N-channel MOSFET</b> (enhancement mode). <b style="color:var(--colour-ui-primary)">Click</b> a name below, then <b style="color:var(--colour-ui-primary)">click</b> the terminal it belongs to.`,
        hint: () => `A MOSFET's usable terminals here are Gate, Drain and Source. Three of the names below belong to a different transistor family entirely — they won't fit anywhere on this diagram.`,
        options: () => shuffle(mosfetFillOptions()),
        correctExplain: mosfetFillCorrectExplain,
        working: mosfetFillWorking
      },
      {
        // Same fixed layout as Q2 — only the symbol changes (P-channel
        // enhancement instead of N-channel). Drain is still top, Source
        // still bottom; only the substrate arrow direction differs, which
        // doesn't move any terminal's position.
        leftPanel: 'circuit',
        kind: 'fill',
        circuitConfig: { shapeId: 'mosfet-p-e-shape' },
        slotIds: ['slotBoxTop', 'slotBoxG', 'slotBoxBottom'],
        text: () => `This is a <b style="color:var(--colour-ui-primary)">P-channel MOSFET</b> (enhancement mode). <b style="color:var(--colour-ui-primary)">Click</b> a name below, then <b style="color:var(--colour-ui-primary)">click</b> the terminal it belongs to.`,
        hint: () => `Same 3 terminals as the N-channel device — only the substrate arrow direction differs, which doesn't change where Gate, Drain or Source sit. Three of the names below still belong to a different transistor family entirely.`,
        options: () => shuffle(mosfetFillOptions()),
        correctExplain: mosfetFillCorrectExplain,
        working: mosfetFillWorking
      },
      {
        // Objective: MOSFET vs JFET — the genuine differences once a
        // student already knows JFET basics (gate construction, gate
        // current/ESD sensitivity, enhancement-vs-depletion availability).
        // No circuit panel needed — leftPanel left unset, defaults to
        // 'none'.
        kind: 'match',
        columns: () => ['JFET', 'MOSFET'],
        text: () => `Each feature below describes either a <b class="colour-jfet">JFET</b> or a <b class="colour-mosfet">MOSFET</b>. <b style="color:var(--colour-ui-primary)">Place</b> each one under the correct device.`,
        hint: () => `Think about what physically separates the gate from the channel in each device — a reverse-biased junction, or an insulating layer with no junction at all?`,
        options: () => shuffle([
          { label: 'Gate is a reverse-biased PN junction', col: 0 },
          { label: 'Gate is insulated by a layer of oxide, with no PN junction at all', col: 1 },
          { label: 'Gate current is extremely small but technically non-zero (reverse-junction leakage)', col: 0 },
          { label: 'Gate current is even closer to zero — but the gate oxide is fragile and can be destroyed by static discharge (ESD)', col: 1 },
          { label: 'Only one type exists — always conducts fully at VGS=0, only ever turned further OFF as VGS increases in magnitude', col: 0 },
          { label: 'Comes in two distinct types — enhancement (OFF at VGS=0, needs a threshold voltage to turn on) and depletion (ON at VGS=0, like a JFET)', col: 1 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 6 features correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} features correctly matched`;
        },
        working: () => `
    <div class="working-line">A <b class="colour-jfet">JFET</b>'s gate is a reverse-biased PN junction — current flow is blocked, but a real (tiny) leakage current still technically flows across it.</div>
    <div class="working-line">A <b class="colour-mosfet">MOSFET</b>'s gate sits on top of a thin insulating oxide layer — there is no junction at all, so gate current is even closer to true zero. The trade-off is physical fragility: that thin oxide layer can be punctured by static electricity, which is why MOSFETs need ESD-safe handling that JFETs don't.</div>
    <div class="working-total">The enhancement/depletion split is a MOSFET-only concept: a <b class="colour-jfet">JFET</b> is inherently depletion-only (built with a channel already there, only ever narrowed by V<sub>GS</sub>), while a <b class="colour-mosfet">MOSFET</b> can be manufactured either way — enhancement (the far more common type in real circuits) or depletion.</div>`
      }
    ];

    // ── Fixed terminal-labelling click routing (Q2/Q3 share one layout) ──
    const SLOT_COL = { slotBoxTop: 0, slotBoxG: 1, slotBoxBottom: 2 };
    ['slotBoxTop', 'slotBoxG', 'slotBoxBottom'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => slotClicked(SLOT_COL[id]));
    });

    // Shared by Q2 (N-channel) and Q3 (P-channel) — the terminal names, and
    // what counts as correct/mislabelled, don't depend on channel type.
    function mosfetFillOptions() {
      return [
        { label: 'Drain',     poolHtml: 'Drain',     col: 0 },
        { label: 'Gate',      poolHtml: 'Gate',      col: 1 },
        { label: 'Source',    poolHtml: 'Source',    col: 2 },
        { label: 'Base',      poolHtml: 'Base' },
        { label: 'Emitter',   poolHtml: 'Emitter' },
        { label: 'Collector', poolHtml: 'Collector' }
      ];
    }
    function mosfetFillCorrectExplain(st) {
      const wrongCount = st.slotPlaced.filter((p, slot) => p !== st.cor[slot]).length;
      return wrongCount === 0 ? 'All 3 terminals correctly labelled' : `${st.slotPlaced.length - wrongCount} of ${st.slotPlaced.length} terminals correctly labelled`;
    }
    function mosfetFillWorking(st) {
      const mistakes = st.slotPlaced
        .map((p, slot) => p !== st.cor[slot] ? st.opts[p]?.label ?? '(left blank)' : null)
        .filter(Boolean);
      const mistakeLine = mistakes.length
        ? `<div class="working-step" style="margin-top:.6rem">Mislabelled:</div><div class="working-line">${mistakes.join(', ')}</div>`
        : '';
      return `
    <div class="working-step">A MOSFET's 3 usable terminals:</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Drain</b> and <b style="color:var(--colour-ui-correct)">Source</b> are the two ends of the channel current flows through. <b style="color:var(--colour-ui-correct)">Gate</b> is the insulated control terminal — the voltage between gate and source is what controls how much current flows through the channel.</div>
    <div class="working-step" style="margin-top:.6rem">Why Base, Emitter and Collector don't belong:</div>
    <div class="working-line">Those are BJT terminal names, not MOSFET ones. A MOSFET is controlled by a <em>voltage</em> at an insulated gate, with no equivalent to a BJT's forward-biased base-emitter junction at all.</div>
    ${mistakeLine}`;
    }

    function applyMosfetCircuitConfig(cfg) {
      document.getElementById('mosfetTerminalUse').setAttribute('href', '#' + cfg.shapeId);
    }

    RENDER_EXTRA = () => {
      document.getElementById('fillPoolWrap').style.display = isFill(QUESTIONS[cur]) ? '' : 'none';
      const cfg = QUESTIONS[cur].circuitConfig;
      if (cfg) applyMosfetCircuitConfig(cfg);
    };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
</html>
