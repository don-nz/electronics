<!--
  MOSFET Amplifiers — Voltage-Divider Bias, Common Source. New lesson quiz
  covering the teacher's "MOSFET amplifiers" objectives sheet (UEEEC0066):
  symbols, junction bias conditions, terminal current/voltage direction,
  operating principles, transfer characteristics, MOSFET-vs-JFET biasing and
  amp-config similarities/differences, DC bias calculation, gain/Zin/Zout for
  a Common Source stage, phase relationship, maximum peak-to-peak output
  swing, and low-frequency response. This is the first dedicated MOSFET
  amplifier lesson in this course (mosfet/ is a brand-new topic folder,
  alongside bjt/ and jfet/) — there is no prior MOSFET biasing_circuits or
  ac_parameters file to split this across the way the BJT/JFET topics do, so
  one file carries the whole lesson, built directly on the shared engine,
  assets/quiz-engine.js.

  Architecture is a deliberate merge of two existing patterns rather than a
  straight clone of either:
    - The DC voltage-divider bias chain (VG -> IDS -> VS -> VD) follows
      ../../bjt/biasing_circuits/bjt_npn_voltage_divider.html's own
      progressive-reveal-meter convention (a meter badge on the diagram,
      hidden until its own question is answered).
    - The AC parameters (gm, Zin, Zout, Av) and the coupling-cap/Zin-Zout
      diagram layout follow ../../jfet/ac_parameters/jfet_self_bias_ac_params.html
      almost directly — the drain/source column (VDD-RD-Q1-RS-Common) is
      structurally identical to that file's own self-bias column.

  The ONE deliberate topology difference from the JFET file, and the whole
  reason this lesson needed a NEW circuit rather than reusing that one: this
  is an ENHANCEMENT-mode N-channel MOSFET. It conducts ZERO current at
  VGS = 0 — there is no channel at all until VGS is pushed above the
  threshold VTH. A JFET's self-bias trick (RG straight to ground, letting
  IDS-through-RS bootstrap its own negative VGS) relies on the JFET already
  conducting fully at VGS = 0; that mechanism simply cannot start an
  enhancement MOSFET at all. So this circuit uses a real R1/R2 voltage
  divider to force VG positive, exactly like a BJT — this is a genuine,
  teachable structural difference between JFET and MOSFET bias networks
  (see Q5 and the closing Q18), not a cosmetic relabelling.

  One worked N-channel enhancement MOSFET stage is used throughout — chosen
  so every derived number comes out clean AND the two output-swing headroom
  calculations land on the SAME value (see Q17), which is a genuine, welcome
  property of this component set, not a contrived coincidence hidden from
  the student:
    VDD=12V, R1=600kΩ, R2=300kΩ, RD=5.0kΩ, RS=1.0kΩ (unbypassed),
    2N7000-style device: VTH=2.0V typ, k=1.0 mA/V² typ, CIN=1.0µF, COUT=2.0µF.
    VG=4V -> (solving ID=k(VGS-VTH)² with VGS=VG-ID·RS simultaneously,
    rejecting the non-physical root) -> IDS=1.0mA, VS=1.0V, VGS=3.0V,
    VD=7.0V, VDS=6.0V (saturation confirmed: VDS ≥ VGS-VTH = 1V).
    gm=2k(VGS-VTH)=2.0mA/V, Zin=R1∥R2=200kΩ, Zout≈RD=5.0kΩ,
    Av=gm·RD/(1+gm·RS)=10/3≈3.33, f1=1/(2π·Zin·CIN)≈0.8Hz,
    max symmetrical output swing ≈10Vpp (both headroom calculations in Q17
    happen to give exactly 5V — a clean teaching example, not fudged).

  MOSFET symbol (mosfet-n-e-shape) is a new shape, built for this file (no
  MOSFET symbol existed anywhere in assets/shapes/ before now) — it deliberately
  draws the channel as THREE BROKEN segments (enhancement mode: no channel
  exists until induced) rather than JFET-style one continuous bar, with the
  substrate arrow drawn pointing IN toward the channel (N-channel convention,
  same reading as the arrow already taught in
  ../../reviews/mosfet_review_quiz.html's own substrate-arrow question).
  Simplified schematic, consistent with this project's existing simplified
  BJT/JFET symbol shapes — not pixel-exact to any single textbook standard.

  Deliberately scoped to Common Source only. A Common Drain (source-
  follower) sibling, mirroring how jfet_self_bias_ac_params_cd.html sits
  beside its own CS file, is a natural next file but not built here — the
  amp-config/biasing objectives this lesson needs are already exercised via
  the CS stage, and Q18 closes the loop on the MOSFET-vs-JFET bias-network
  difference without needing a second full circuit.
-->

      {

        text: () => `Using <b class="colour-voltage">V<sub>GS</sub></b> = V<sub>G</sub> − I<sub>D</sub>·R<sub>S</sub> together with the square-law equation <b class="colour-current">I<sub>D</sub></b> = k(V<sub>GS</sub> − V<sub>th</sub>)², solve for the Q-point drain current <b class="colour-current">I<sub>D</sub></b>.`,

        options: () => shuffle([
          { label: `Substituting gives I<sub>D</sub>² − 5I<sub>D</sub> + 4 = 0, so I<sub>D</sub> = 1 mA or 4 mA. The 4 mA root gives V<sub>GS</sub> = 4−4 = 0 V (below V<sub>th</sub>, not physical) — so <b class="colour-current">I<sub>D</sub></b> = <b>1.0 mA</b>`, type: 'correct' },
