<!--
  MOSFET Self-Bias — DEPLETION-mode N-channel, Common Source, RS bypassed.
  Based on ../../jfet/biasing_circuits/jfet_self_bias.html's own topology and
  teaching method, extended with the AC parameters (gm, Zin, Zout, Av,
  loaded gain, output swing) that file's own AC-params sibling
  (../../jfet/ac_parameters/jfet_self_bias_ac_params.html) covers separately
  — combined into one file here, the same "whole lesson in one file"
  approach already used by ../amplifiers/mosfet_voltage_divider_cs.html.

  Why DEPLETION mode, not enhancement: self-bias (RG straight to Common, no
  divider) only works on a device that already conducts at VGS=0 — a
  depletion-mode MOSFET does (built with a channel already there, exactly
  like a JFET), so it can bootstrap its own negative VGS across RS the same
  way a JFET does. An enhancement-mode MOSFET conducts ZERO current at
  VGS=0, so self-bias has nothing to start from — that's exactly why
  mosfet_voltage_divider_cs.html (enhancement mode) needed a real R1/R2
  divider instead. See that file's own Q5/Q18 for the fully worked-through
  reasoning; this file is the other half of that same comparison, not a
  contradiction of it.

  Depletion-mode MOSFETs obey the SAME Shockley/transconductance equations
  as a JFET (ID = IDSS(1−VGS/VP)², gm = gm0(1−VGS/VP), gm0 = 2·IDSS/|VP|) —
  which is exactly why this file can lift jfet_self_bias.html's calculation
  method almost unchanged. Deliberately reuses that file's own device
  numbers (IDSS=8mA, VP=−4V, VGS=−2V → IDS=2.0mA, gm=2.0mA/V) for a direct
  cross-reference a student may already recognise from the JFET AC-params
  quiz.

  Component values (VDD=15V, RG=1.0MΩ, RD=4.0kΩ, RS=1.0kΩ) were chosen so
  VDS lands on a clean 5.0V — VDS is treated as a second GIVEN design value
  here (alongside VGS), the same way a real datasheet/curve-derived Q-point
  gives you both, and Q3 asks the student to combine it with VS (from Q2)
  to find VD — a genuinely different derivation path to VD than
  jfet_self_bias.html's own Q4 (VDD − IDS·RD), used deliberately so VRD
  (Q4) and IDS (Q5) can instead be derived FROM VD, in the order the
  teacher's own question list asked for.

  RS is bypassed by CS for AC (drawn on the diagram) — unlike
  jfet_self_bias_ac_params.html's own self-bias stage, which deliberately
  leaves RS unbypassed to teach source degeneration. Here, only the
  bypassed (full-gain, Av=gm·RD) case is asked, since the biasing method
  (DC Q-point set via RS) and the AC gain behaviour (RS shorted for AC) are
  independent design choices — bypassing RS is the standard way to get a
  stable self-bias DC point WITHOUT sacrificing AC gain to degeneration.

  MOSFET symbol (mosfet-n-d-shape, depletion — solid channel) copied from
  ../../../assets/shapes/mosfet-symbols.html (edit there first, then re-copy
  here) — the first quiz page in this project to use the depletion variant.

  Built directly on the shared engine, assets/quiz-engine.js.
-->

          <text x="0" y="-25" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16" font-weight="bold">C<tspan baseline-shift="sub" font-size="13">OUT</tspan></text>
        </g>

      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `What is the gate voltage <b class="colour-voltage">V<sub>G</sub></b> of this self-biased <b class="colour-mosfet">MOSFET</b>?`,

          { label: `<b class="colour-voltage">V<sub>G</sub></b> = <b class="colour-current">I<sub>G</sub></b> × <b class="colour-resistor">R<sub>G</sub></b> = 0 A × 1.0 MΩ = <b>0.0 V</b>`, type: 'correct' },

        ]),
        correctExplain: () => `<b class="colour-voltage">V<sub>G</sub></b> = 0 V (no gate current → no drop across R<sub>G</sub>)`,
        working: () => `
    <div class="working-line">A MOSFET's gate is insulated — essentially zero current flows into it, regardless of <b class="colour-resistor">R<sub>G</sub></b>'s value. Ohm's Law says a resistor with no current through it drops no voltage at all.</div>
    <div class="working-formula-row"><b class="colour-voltage">V<sub>G</sub></b> = <b class="colour-current">I<sub>G</sub></b> × <b class="colour-resistor">R<sub>G</sub></b> = 0 A × 1.0 MΩ = 0.0 V</div>
    <div class="working-total">Keep this — every step from here builds on <b class="colour-voltage">V<sub>G</sub></b> = 0 V.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `What is the source voltage <b class="colour-voltage">V<sub>S</sub></b>?`,

          { label: `<b class="colour-voltage">V<sub>S</sub></b> = <b class="colour-voltage">V<sub>GS</sub></b> = <b>-2.0 V</b>`, type: 'wrong' },
          { label: `<b class="colour-voltage">V<sub>S</sub></b> = <b class="colour-voltage">V<sub>G</sub></b> = <b>0.0 V</b>`, type: 'wrong' },

        ]),
        correctExplain: () => `<b class="colour-voltage">V<sub>S</sub></b> = V<sub>G</sub> − V<sub>GS</sub> = <b>2.0 V</b>`,
        working: () => `
    <div class="working-formula-row"><b class="colour-voltage">V<sub>S</sub></b> = <b class="colour-voltage">V<sub>G</sub></b> − <b class="colour-voltage">V<sub>GS</sub></b> = 0.0 V − (-2.0 V)</div>
    <div class="working-total"><b class="colour-voltage">V<sub>S</sub></b> = 2.0 V. This IS the self-bias mechanism: the channel current flowing down through <b class="colour-resistor">R<sub>S</sub></b> builds this 2.0 V itself, which — combined with <b class="colour-voltage">V<sub>G</sub></b>=0 — is exactly what produces the -2.0 V <b class="colour-voltage">V<sub>GS</sub></b> the device needs.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `This stage is designed to operate at a quiescent <b class="colour-voltage">V<sub>DS</sub></b> of <b>5.0 V</b>. What is the drain voltage <b class="colour-voltage">V<sub>D</sub></b>?`,
        hint: () => `VDS = VD − VS — rearrange for VD, using VS from Q2.`,
        options: () => shuffle([
          { label: `<b class="colour-voltage">V<sub>D</sub></b> = <b class="colour-voltage">V<sub>DS</sub></b> + <b class="colour-voltage">V<sub>S</sub></b> = 5.0 + 2.0 = <b>7.0 V</b>`, type: 'correct' },
          { label: `<b class="colour-voltage">V<sub>D</sub></b> = <b class="colour-voltage">V<sub>DS</sub></b> − <b class="colour-voltage">V<sub>S</sub></b> = 5.0 − 2.0 = <b>3.0 V</b>`, type: 'wrong' },
          { label: `<b class="colour-voltage">V<sub>D</sub></b> = <b class="colour-voltage">V<sub>DS</sub></b> = <b>5.0 V</b>`, type: 'wrong' },
          { label: `<b class="colour-voltage">V<sub>D</sub></b> = <b class="colour-supply">V<sub>DD</sub></b> − <b class="colour-voltage">V<sub>DS</sub></b> = 15 − 5 = <b>10.0 V</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-voltage">V<sub>D</sub></b> = <b class="colour-voltage">V<sub>DS</sub></b> + <b class="colour-voltage">V<sub>S</sub></b> = <b>7.0 V</b>`,
        working: () => `
    <div class="working-formula-row"><b class="colour-voltage">V<sub>D</sub></b> = <b class="colour-voltage">V<sub>DS</sub></b> + <b class="colour-voltage">V<sub>S</sub></b> = 5.0 V + 2.0 V</div>
    <div class="working-total"><b class="colour-voltage">V<sub>D</sub></b> = 7.0 V.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `What voltage <b class="colour-resistor">V<sub>RD</sub></b> is dropped across <b class="colour-resistor">R<sub>D</sub></b>?`,

        ]),
        correctExplain: () => `<b class="colour-resistor">V<sub>RD</sub></b> = <b class="colour-supply">V<sub>DD</sub></b> − <b class="colour-voltage">V<sub>D</sub></b> = <b>8.0 V</b>`,
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">V<sub>RD</sub></b> = <b class="colour-supply">V<sub>DD</sub></b> − <b class="colour-voltage">V<sub>D</sub></b> = 15.0 V − 7.0 V</div>
    <div class="working-total"><b class="colour-resistor">V<sub>RD</sub></b> = 8.0 V.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `What is the drain current <b class="colour-current">I<sub>D</sub></b> flowing through <b class="colour-resistor">R<sub>D</sub></b> (and <b class="colour-resistor">R<sub>S</sub></b>)?`,
        hint: () => `Apply Ohm's Law across RD, using VRD from Q4.`,
        options: () => shuffle([
          { label: `<b class="colour-current">I<sub>D</sub></b> = ${frac('<b class="colour-resistor">V<sub>RD</sub></b>', '<b class="colour-resistor">R<sub>D</sub></b>')} = ${frac('8.0 V', '4.0 kΩ')} = <b>2.0 mA</b>`, type: 'correct' },
          { label: `<b class="colour-current">I<sub>D</sub></b> = ${frac('<b class="colour-resistor">V<sub>RD</sub></b>', '<b class="colour-resistor">R<sub>S</sub></b>')} = ${frac('8.0 V', '1.0 kΩ')} = <b>8.0 mA</b>`, type: 'wrong' },
          { label: `<b class="colour-current">I<sub>D</sub></b> = ${frac('<b class="colour-resistor">R<sub>D</sub></b>', '<b class="colour-resistor">V<sub>RD</sub></b>')} = ${frac('4.0 kΩ', '8.0 V')} ≈ <b>0.5 Ω<sup>-1</sup></b>`, type: 'wrong' },
          { label: `<b class="colour-current">I<sub>D</sub></b> = ${frac('<b class="colour-voltage">V<sub>S</sub></b>', '<b class="colour-resistor">R<sub>D</sub></b>')} = ${frac('2.0 V', '4.0 kΩ')} = <b>0.5 mA</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-current">I<sub>D</sub></b> = ${frac('V<sub>RD</sub>', 'R<sub>D</sub>')} = <b>2.0 mA</b>`,
        working: () => `
    <div class="working-formula-row"><b class="colour-current">I<sub>D</sub></b> = ${frac('<b class="colour-resistor">V<sub>RD</sub></b>', '<b class="colour-resistor">R<sub>D</sub></b>')} = ${frac('8.0 V', '4.0 kΩ')}</div>
    <div class="working-line">Two independent cross-checks confirm this: <b class="colour-current">I<sub>D</sub></b> = ${frac('<b class="colour-voltage">V<sub>S</sub></b>', '<b class="colour-resistor">R<sub>S</sub></b>')} = ${frac('2.0 V', '1.0 kΩ')} = 2.0 mA (Ohm's Law on <b class="colour-resistor">R<sub>S</sub></b> instead), and the Shockley equation <b class="colour-current">I<sub>D</sub></b>=<b class="colour-current">I<sub>DSS</sub></b>(1−${frac('<b class="colour-voltage">V<sub>GS</sub></b>', '<b class="colour-voltage">V<sub>P</sub></b>')})²=8×(1−0.5)²=2.0mA using the datasheet values shown on the diagram.</div>
    <div class="working-total"><b class="colour-current">I<sub>D</sub></b> = 2.0 mA. All three methods agree.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `Before the output clips, what is the maximum <b style="color:var(--colour-ui-primary)">symmetrical peak-to-peak</b> output voltage swing at the drain?`,
        hint: () => `Work out the headroom UP (toward VDD, cutoff) and DOWN (toward the triode boundary, VDS=VGS−VP) — then take twice the SMALLER of the two.`,
        options: () => shuffle([
          { label: `Up: <b class="colour-supply">V<sub>DD</sub></b>−<b class="colour-voltage">V<sub>D</sub></b>=15−7=8.0V. Down: <b class="colour-voltage">V<sub>D</sub></b>−(<b class="colour-voltage">V<sub>S</sub></b>+(<b class="colour-voltage">V<sub>GS</sub></b>−<b class="colour-voltage">V<sub>P</sub></b>))=7−(2+2)=3.0V. Smaller is 3.0V, so max swing = 2×3.0 = <b>6.0 V<sub>pp</sub></b>`, type: 'correct' },
          { label: `Up: <b class="colour-supply">V<sub>DD</sub></b>−<b class="colour-voltage">V<sub>D</sub></b>=15−7=8.0V, so max swing = <b>8.0 V<sub>pp</sub></b>`, type: 'wrong' },
          { label: `Max swing = <b class="colour-supply">V<sub>DD</sub></b> = <b>15.0 V<sub>pp</sub></b>`, type: 'wrong' },
          { label: `Down: <b class="colour-voltage">V<sub>D</sub></b>−<b class="colour-voltage">V<sub>S</sub></b>=7−2=5.0V. Up: <b class="colour-supply">V<sub>DD</sub></b>−<b class="colour-voltage">V<sub>D</sub></b>=15−7=8.0V. Smaller is 5.0V, so max swing = 2×5.0 = <b>10.0 V<sub>pp</sub></b>`, type: 'wrong' },
        ]),
        correctExplain: () => `Max swing = 2 × 3.0 V = <b>6.0 V<sub>pp</sub></b>`,
        working: () => `
    <div class="working-line"><b>Upward headroom</b> (toward cutoff, <b class="colour-current">I<sub>D</sub></b>→0, <b class="colour-voltage">V<sub>D</sub></b>→<b class="colour-supply">V<sub>DD</sub></b>): <b class="colour-supply">V<sub>DD</sub></b>−<b class="colour-voltage">V<sub>D</sub></b> = 15−7 = 8.0 V.</div>
    <div class="working-line" style="margin-top:.4rem"><b>Downward headroom</b> (toward the triode boundary): <b class="colour-voltage">V<sub>DS</sub></b> can only fall until <b class="colour-voltage">V<sub>DS</sub></b>=<b class="colour-voltage">V<sub>GS</sub></b>−<b class="colour-voltage">V<sub>P</sub></b>=(-2)−(-4)=2.0V, i.e. until <b class="colour-voltage">V<sub>D</sub></b>=<b class="colour-voltage">V<sub>S</sub></b>+2.0=4.0V. That's <b class="colour-voltage">V<sub>D</sub></b>−4.0 = 7−4 = 3.0 V of downward room.</div>
    <div class="working-total">The limiting side is the SMALLER headroom (3.0 V, downward) — the output can only swing 3.0 V before hitting the triode boundary, even though there's 8.0 V of room upward. Max symmetrical swing = 2×3.0 = <b>6.0 V<sub>pp</sub></b> (±3.0 V peak), centred on the 7.0 V Q-point.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `What is the transconductance <b class="colour-mosfet">g<sub>m</sub></b> at this stage's own Q-point?`,
        hint: () => `gm = gm0×(1−VGS/VP), using gm0 straight off the datasheet card, and the given VGS/VP.`,
        options: () => shuffle([
          { label: `<b class="colour-mosfet">g<sub>m</sub></b> = g<sub>m0</sub>×(1−${frac('<b class="colour-voltage">V<sub>GS</sub></b>', '<b class="colour-voltage">V<sub>P</sub></b>')}) = 4.0×(1−${frac('-2', '-4')}) = 4.0×0.5 = <b>2.0 mA/V</b>`, type: 'correct' },
          { label: `<b class="colour-mosfet">g<sub>m</sub></b> = g<sub>m0</sub> = <b>4.0 mA/V</b>`, type: 'wrong' },

          { label: `<b class="colour-mosfet">g<sub>m</sub></b> = ${frac('<b class="colour-current">I<sub>D</sub></b>', '<b class="colour-voltage">V<sub>GS</sub></b>')} = ${frac('2.0 mA', '-2.0 V')} = <b>-1.0 mA/V</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-mosfet">g<sub>m</sub></b> = g<sub>m0</sub>×(1−${frac('V<sub>GS</sub>', 'V<sub>P</sub>')}) = <b>2.0 mA/V</b>`,
        working: () => `
    <div class="working-line">Like a JFET, a depletion-mode MOSFET's transconductance isn't a fixed device constant — it depends on where the Q-point sits between <b class="colour-voltage">V<sub>GS</sub></b>=0 (<b class="colour-mosfet">g<sub>m</sub></b>=g<sub>m0</sub>, maximum) and <b class="colour-voltage">V<sub>GS</sub></b>=<b class="colour-voltage">V<sub>P</sub></b> (<b class="colour-mosfet">g<sub>m</sub></b>=0, pinched off). g<sub>m0</sub>=4.0 mA/V is read straight off the datasheet card — no need to derive it.</div>
    <div class="working-formula-row"><b class="colour-mosfet">g<sub>m</sub></b> = g<sub>m0</sub>×(1−${frac('<b class="colour-voltage">V<sub>GS</sub></b>', '<b class="colour-voltage">V<sub>P</sub></b>')}) = 4.0×(1−0.5)</div>
    <div class="working-total"><b class="colour-mosfet">g<sub>m</sub></b> = 2.0 mA/V — exactly half of g<sub>m0</sub>, since this Q-point sits exactly halfway between V<sub>GS</sub>=0 and pinch-off. Keep this value, the next few AC-parameter questions all use it.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `<b class="colour-resistor">R<sub>S</sub></b> is bypassed by <b class="colour-capacitor">C<sub>S</sub></b> for AC signals, so the source sits at AC ground. Using <b class="colour-mosfet">g<sub>m</sub></b> from the previous question, what is the unloaded voltage gain <b class="colour-gain">|A<sub>v</sub>|</b> of this stage?`,
        hint: () => `|Av| = gm×RD, since RS is bypassed — no degeneration term needed.`,
        options: () => shuffle([
          { label: `<b class="colour-gain">|Av|</b> = <b class="colour-mosfet">g<sub>m</sub></b>×<b class="colour-resistor">RD</b> = 2.0×4.0 = <b>8.0</b>`, type: 'correct' },
          { label: `<b class="colour-gain">|Av|</b> = ${frac('<b class="colour-mosfet">g<sub>m</sub></b>×<b class="colour-resistor">RD</b>', '1 + <b class="colour-mosfet">g<sub>m</sub></b>×<b class="colour-resistor">RS</b>')} = ${frac('8.0', '3.0')} ≈ <b>2.67</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> = g<sub>m0</sub>×<b class="colour-resistor">RD</b> = 4.0×4.0 = <b>16.0</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> = ${frac('<b class="colour-resistor">RD</b>', '<b class="colour-mosfet">g<sub>m</sub></b>')} = ${frac('4.0', '2.0')} = <b>2.0</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">|A<sub>v</sub>|</b> = <b class="colour-mosfet">g<sub>m</sub></b>×<b class="colour-resistor">R<sub>D</sub></b> = <b>8.0</b> (<b class="colour-resistor">R<sub>S</sub></b> bypassed)`,
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> = <b class="colour-mosfet">g<sub>m</sub></b> × <b class="colour-resistor">R<sub>D</sub></b> = 2.0 mA/V × 4.0 kΩ</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> = 8.0. With <b class="colour-capacitor">C<sub>S</sub></b> shorting <b class="colour-resistor">R<sub>S</sub></b> to AC ground, none of <b class="colour-resistor">R<sub>S</sub></b> appears in the gain formula at all — this is the FULL gain the device can give at this Q-point, unlike jfet_self_bias_ac_params.html's own deliberately-unbypassed stage.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `What is the AC input resistance <b class="colour-resistor">Z<sub>in</sub></b> seen by the signal source?`,
        hint: () => `Same reasoning as a JFET self-bias stage — the gate draws no current, and nothing else is wired between the gate node and VDD, so only RG matters.`,
        options: () => shuffle([
          { label: `<b class="colour-gain">Zin</b> = <b class="colour-resistor">RG</b> = <b>1.0 MΩ</b>`, type: 'correct' },
          { label: `<b class="colour-gain">Zin</b> = <b class="colour-resistor">RG</b> ∥ <b class="colour-resistor">RD</b> ≈ <b>4.0 kΩ</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">Zin</b> = <b class="colour-resistor">RD</b> = <b>4.0 kΩ</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">Zin</b> = <b class="colour-resistor">RS</b> = <b>1.0 kΩ</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-resistor">Z<sub>in</sub></b> = <b class="colour-resistor">R<sub>G</sub></b> = <b>1.0 MΩ</b>`,
        working: () => `
    <div class="working-line">Unlike a divider-biased stage (which would put R1 in parallel too), self-bias has nothing at all connecting the gate node to <b class="colour-supply">V<sub>DD</sub></b> — <b class="colour-resistor">R<sub>G</sub></b> is the only path to ground.</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>in</sub></b> = <b class="colour-resistor">R<sub>G</sub></b> = 1.0 MΩ.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `What is the approximate AC output resistance <b class="colour-resistor">Z<sub>out</sub></b>, looking back into the drain?`,
        hint: () => `Same idealisation as every other Common Source stage in this course — the transistor's own output resistance is assumed very high, so only RD matters.`,
        options: () => shuffle([
          { label: `<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RD</b> = <b>4.0 kΩ</b>`, type: 'correct' },
          { label: `<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RS</b> = <b>1.0 kΩ</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">Zout</b> ≈ <b class="colour-gain">Zin</b> = <b>1.0 MΩ</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RD</b> ∥ <b class="colour-resistor">RS</b> ≈ <b>0.8 kΩ</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>D</sub></b> = <b>4.0 kΩ</b>`,
        working: () => `
    <div class="working-line">With the source zeroed, the only thing wired to the drain node (besides the transistor's own very-high internal resistance, ignored here) is <b class="colour-resistor">R<sub>D</sub></b>, running up to the AC-grounded <b class="colour-supply">V<sub>DD</sub></b> rail.</div>
    <div class="working-total"><b class="colour-resistor">Z<sub>out</sub></b> ≈ 4.0 kΩ.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `A <b>10 kΩ</b> load <b class="colour-resistor">R<sub>L</sub></b> is connected to the output. What is the loaded voltage gain <b class="colour-gain">|A<sub>v</sub>|</b>?`,
        hint: () => `The load appears in parallel with RD for AC signals — find RD∥RL first, then |Av|=gm×(RD∥RL).`,
        options: () => shuffle([
          { label: `<b class="colour-resistor">RD</b>∥<b class="colour-resistor">RL</b> = ${frac('1', `${frac('1', '4.0 kΩ')} + ${frac('1', '10 kΩ')}`)} ≈ 2.857 kΩ; <b class="colour-gain">|Av|</b> = 2.0×2.857 ≈ <b>5.71</b>`, type: 'correct' },
          { label: `<b class="colour-gain">|Av|</b> = <b class="colour-mosfet">g<sub>m</sub></b>×<b class="colour-resistor">RD</b> = <b>8.0</b>`, type: 'wrong' },
          { label: `<b class="colour-resistor">RD</b>+<b class="colour-resistor">RL</b>=14 kΩ; <b class="colour-gain">|Av|</b> = 2.0×14 = <b>28.0</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> = <b class="colour-mosfet">g<sub>m</sub></b>×<b class="colour-resistor">RL</b> = 2.0×10 = <b>20.0</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">|A<sub>v</sub>|</b> = <b class="colour-mosfet">g<sub>m</sub></b>×(<b class="colour-resistor">R<sub>D</sub></b>∥<b class="colour-resistor">R<sub>L</sub></b>) ≈ <b>5.71</b>`,
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">R<sub>D</sub></b>∥<b class="colour-resistor">R<sub>L</sub></b> = ${frac('<b class="colour-resistor">R<sub>D</sub></b> × <b class="colour-resistor">R<sub>L</sub></b>', '<b class="colour-resistor">R<sub>D</sub></b> + <b class="colour-resistor">R<sub>L</sub></b>')} = ${frac('4.0 × 10', '4.0 + 10')} ≈ 2.857 kΩ</div>
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> = g<sub>m</sub> × (<b class="colour-resistor">R<sub>D</sub></b>∥<b class="colour-resistor">R<sub>L</sub></b>) = 2.0 mA/V × 2.857 kΩ</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ 5.71 — lower than the unloaded 8.0, because the load resistor steals some of the drain current's voltage-developing ability away from R<sub>D</sub>.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `With a <b>200 mV peak-to-peak</b> input signal, what is the resulting <b style="color:var(--colour-ui-primary)">loaded</b> output signal <b class="colour-signal">V<sub>out</sub></b>?`,
        hint: () => `Vout = Vin × Av(loaded), using the gain from the previous question.`,
        options: () => shuffle([
          { label: `<b class="colour-signal">V<sub>out</sub></b> = <b class="colour-signal">V<sub>in</sub></b> × <b class="colour-gain">Av(loaded)</b> = 200 mV × 5.71 ≈ <b>1.14 V<sub>pp</sub></b>`, type: 'correct' },
          { label: `<b class="colour-signal">V<sub>out</sub></b> = <b class="colour-signal">V<sub>in</sub></b> × <b class="colour-gain">Av(unloaded)</b> = 200 mV × 8.0 = <b>1.60 V<sub>pp</sub></b>`, type: 'wrong' },
          { label: `<b class="colour-signal">V<sub>out</sub></b> = ${frac('<b class="colour-signal">V<sub>in</sub></b>', '<b class="colour-gain">Av(loaded)</b>')} = ${frac('200 mV', '5.71')} ≈ <b>35 mV<sub>pp</sub></b>`, type: 'wrong' },
          { label: `<b class="colour-signal">V<sub>out</sub></b> = 2×<b class="colour-signal">V<sub>in</sub></b>×<b class="colour-gain">Av(loaded)</b> = 2×200 mV×5.71 ≈ <b>2.29 V<sub>pp</sub></b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-signal">V<sub>out</sub></b> = <b class="colour-signal">V<sub>in</sub></b> × <b class="colour-gain">A<sub>v</sub>(loaded)</b> ≈ <b>1.14 V<sub>pp</sub></b>`,
        working: () => `
    <div class="working-formula-row"><b class="colour-signal">V<sub>out</sub></b> = <b class="colour-signal">V<sub>in</sub></b> × <b class="colour-gain">A<sub>v</sub>(loaded)</b> = 200 mV<sub>pp</sub> × 5.71</div>
    <div class="working-total"><b class="colour-signal">V<sub>out</sub></b> ≈ 1.14 V<sub>pp</sub> — comfortably inside the 6.0 V<sub>pp</sub> maximum swing found earlier, so this signal doesn't clip.</div>`
      },
      {
        circuitId: 'mosfet-self-bias-cs',
        circuitLabel: 'Self-Bias, Common Source (depletion mode)',
        text: () => `If <b class="colour-resistor">R<sub>D</sub></b> were increased from 4.0 kΩ to <b>5.0 kΩ</b> — with <b class="colour-current">I<sub>D</sub></b> staying at 2.0 mA, since it's set entirely by <b class="colour-resistor">R<sub>S</sub></b> and the given <b class="colour-voltage">V<sub>GS</sub></b>, independent of <b class="colour-resistor">R<sub>D</sub></b> — what changes, and what's the real trade-off?</b>`,
        hint: () => `Recompute VRD, VD and VDS at the new RD, then compare Av=gm×RD before and after.`,
        options: () => shuffle([
          { label: `<b class="colour-gain">Av</b> rises from 8.0 to 10.0 (a genuine 25% gain increase, since Av=<b class="colour-mosfet">g<sub>m</sub></b>×<b class="colour-resistor">R<sub>D</sub></b> scales directly with <b class="colour-resistor">R<sub>D</sub></b>) — but <b class="colour-voltage">V<sub>D</sub></b> falls from 7.0V to 5.0V, so <b class="colour-voltage">V<sub>DS</sub></b> shrinks from 5.0V to 3.0V, leaving only 1.0V of margin above the 2.0V triode boundary (down from 3.0V before) — higher <b class="colour-resistor">R<sub>D</sub></b> trades away output-swing headroom (and raises <b class="colour-gain">Z<sub>out</sub></b>) in exchange for gain`, type: 'correct' },
          { label: `<b class="colour-current">I<sub>D</sub></b> increases along with <b class="colour-resistor">R<sub>D</sub></b>, since more resistance means more voltage is available to drive current`, type: 'wrong' },
          { label: `There is no trade-off at all — increasing R<sub>D</sub> only ever improves performance, with no downside`, type: 'wrong' },
          { label: `Increasing R<sub>D</sub> REDUCES the gain, since a bigger resistor limits current flow more`, type: 'wrong' },
        ]),
        correctExplain: () => `Gain rises (8.0→10.0) but at the cost of reduced output headroom (<b class="colour-voltage">V<sub>DS</sub></b>: 5.0V→3.0V) and higher <b class="colour-gain">Z<sub>out</sub></b>`,
        working: () => `
    <div class="working-line">In self-bias, <b class="colour-current">I<sub>D</sub></b> is fixed entirely by <b class="colour-voltage">V<sub>GS</sub></b> (given) and <b class="colour-resistor">R<sub>S</sub></b> — <b class="colour-resistor">R<sub>D</sub></b> never enters that relationship at all, so changing <b class="colour-resistor">R<sub>D</sub></b> alone cannot change <b class="colour-current">I<sub>D</sub></b>, <b class="colour-voltage">V<sub>GS</sub></b>, <b class="colour-voltage">V<sub>S</sub></b> or <b class="colour-mosfet">g<sub>m</sub></b>.</div>
    <div class="working-line" style="margin-top:.4rem">At <b class="colour-resistor">R<sub>D</sub></b>=5.0kΩ: <b class="colour-resistor">V<sub>RD</sub></b>=<b class="colour-current">I<sub>D</sub></b>×<b class="colour-resistor">R<sub>D</sub></b>=2.0×5.0=10.0V, so <b class="colour-voltage">V<sub>D</sub></b>=<b class="colour-supply">V<sub>DD</sub></b>−<b class="colour-resistor">V<sub>RD</sub></b>=15−10=5.0V, and <b class="colour-voltage">V<sub>DS</sub></b>=<b class="colour-voltage">V<sub>D</sub></b>−<b class="colour-voltage">V<sub>S</sub></b>=5.0−2.0=3.0V — still above the 2.0V triode boundary (<b class="colour-voltage">V<sub>GS</sub></b>−<b class="colour-voltage">V<sub>P</sub></b>), but with far less margin than the original 3.0V of headroom.</div>
    <div class="working-line" style="margin-top:.4rem">Meanwhile <b class="colour-gain">Av</b>=<b class="colour-mosfet">g<sub>m</sub></b>×<b class="colour-resistor">R<sub>D</sub></b>=2.0×5.0=10.0, up from 8.0 — a real, direct gain benefit.</div>
    <div class="working-total">Increasing <b class="colour-resistor">R<sub>D</sub></b> is a genuine gain-vs-headroom trade-off, not a free improvement: more gain and more <b class="colour-gain">Z<sub>out</sub></b> (worse for driving low-impedance loads, see Q11's own loaded-gain drop), less room for the output to swing before clipping. Push <b class="colour-resistor">R<sub>D</sub></b> too far and <b class="colour-voltage">V<sub>D</sub></b> eventually drops below the triode boundary entirely, and the stage stops amplifying linearly at all.</div>`
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — shared: assets/quiz-engine.js. Only this file's own
    // progressive-reveal badge function remains inline below.
    // ══════════════════════════════════════════════════════════════════════

    function updateReveals() {
      document.getElementById('meterVG').setAttribute('display', Q[0].ans ? 'inline' : 'none');   // Q1: VG
      document.getElementById('meterVS').setAttribute('display', Q[1].ans ? 'inline' : 'none');   // Q2: VS
      document.getElementById('meterVD').setAttribute('display', Q[2].ans ? 'inline' : 'none');   // Q3: VD
      document.getElementById('meterVRD').setAttribute('display', Q[3].ans ? 'inline' : 'none'); // Q4: VRD
      document.getElementById('idsIndMosfet').setAttribute('display', Q[4].ans ? 'inline' : 'none'); // Q5: ID
      document.getElementById('idsIndMosfetTop').setAttribute('display', Q[4].ans ? 'inline' : 'none'); // Q5: ID (top badge, same current)
      document.getElementById('gmRevealMosfet').setAttribute('display', Q[6].ans ? 'inline' : 'none'); // Q7: gm
      document.getElementById('zinBadgeMosfet').setAttribute('display', Q[8].ans ? 'inline' : 'none'); // Q9: Zin
      document.getElementById('zoutBadgeMosfet').setAttribute('display', Q[9].ans ? 'inline' : 'none'); // Q10: Zout

      // Q11 (index 10) introduces the 10kΩ load — its own question text is
      // ABOUT the loaded circuit, so swap on arrival at that question (cur),
      // not on it being answered, the same way the reference circuit itself
      // would change the moment a loaded question comes up.
      const loaded = cur >= 10;
      document.getElementById('outputUnloaded').setAttribute('display', loaded ? 'none' : 'inline');
      document.getElementById('outputLoaded').setAttribute('display', loaded ? 'inline' : 'none');
    }

    RENDER_EXTRA = updateReveals;

    // Deliberately NO RESET_EXTRA shuffle here, unlike this project's exam/
    // knowledge quizzes — this quiz is a genuine step-by-step derivation
    // (VG -> VS -> VD -> VRD -> ID -> ... -> Av(loaded) -> Vout), each
    // question's own answer feeding the next one's calculation, AND
    // updateReveals() above indexes Q[0]..Q[9] positionally to reveal the
    // right diagram badge at the right step. Randomising QUESTIONS would
    // break both the calculation chain and the reveal mapping.

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
