<!--
  Exam-revision quiz mirroring the teacher's "Worksheet 2" handout (UEEEC0066
  Theory exam preparation worksheets, doc JZ20250619 V10, page 2 of 9)
  question-for-question: an NPN COMMON COLLECTOR (emitter-follower) stage,
  voltage-divider bias. R3 IS the emitter resistor (RE) — the collector
  ties straight to VCC, there is no separate collector resistor. Example 1's
  values are the worksheet's own numbers exactly (R1=180k, R2=180k, R3=3k3,
  BC549 β=400, Vcc=15V).

  Circuit `cc-divider-ac` and every AC-parameter question (re′/Zb/Zin/Zout/
  Av) are ported near-verbatim from bjt_knowledge_ac_params_cc.html — same
  wording, option shape and distractor types, values rescaled to this
  worksheet's own component values. DC questions (VB/VE/IC/VC) combine that
  file's own VE=VB−0.6/IE=VE/RE convention with VC=VCC directly (no drop,
  since the collector ties straight to the rail in a CC stage) — a
  combination not needed anywhere else in the project since no other CC
  quiz derives DC values from scratch. Amp-config/phase/typical-use mirror
  bjt_knowledge_amp_config.html's CC-specific text (buffer/isolator, no
  phase inversion).

  Mode-switching (EXAMPLE_SETS/setMode/recompute/refreshLabels/
  randomValues) is the same page-local pattern as bjt_knowledge_basics.html
  (this project's TEMPLATE FILE for combining it with the shared
  quiz-engine.js) and bjt_review_worksheet1.html (the sibling file built
  alongside this one).
-->

    const EXAMPLE_SETS = {
      example1: { r1: 180000, r2: 180000, re: 3300, beta: 400, vcc: 15 },
      example2: { r1: 100000, r2: 100000, re: 2200, beta: 300, vcc: 12 },

    };

    let V = { ...EXAMPLE_SETS.example1 };

    const R_POOL = [68000, 82000, 100000, 120000, 150000, 180000, 220000];
    const RE_POOL = [1000, 1200, 1500, 1800, 2200, 2700, 3300, 3900, 4700];
    const BETA_POOL = [200, 300, 350, 400, 450];
    const VCC_POOL = [9, 12, 15, 18];
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function randomValues() {
      for (let attempt = 0; attempt < 25; attempt++) {
        const vals = { r1: pick(R_POOL), r2: pick(R_POOL), re: pick(RE_POOL), beta: pick(BETA_POOL), vcc: pick(VCC_POOL) };
        const vb = vals.vcc * vals.r2 / (vals.r1 + vals.r2);
        const ve = vb - VBE;
        if (ve < 0.5 || ve > vals.vcc - 1) continue;
        return vals;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    function fmtR(v) { return v >= 1000 ? (Math.round(v / 10) / 100) + ' kΩ' : Math.round(v) + ' Ω'; }
    function fmtOhm1(v) { return v.toFixed(1) + ' Ω'; }
    function fmtK2(v) { return (v / 1000).toFixed(2) + ' kΩ'; }
    function fmtV2(v) { return v.toFixed(2) + ' V'; }
    function fmtMA3(v) { return (v * 1000).toFixed(3) + ' mA'; }
    function fmtGain(v) { return v.toFixed(3); }

    let VB, VE, IE, IC, VC, reP, ZbVal, RinVal, RoutVal, AvVal;
    function recompute() {
      VB = V.vcc * V.r2 / (V.r1 + V.r2);
      VE = VB - VBE;
      IE = VE / V.re;
      IC = IE;
      VC = V.vcc; // collector tied straight to VCC — no collector resistor in a CC stage
      reP = 0.026 / IE;
      ZbVal = V.beta * (V.re + reP);
      RinVal = 1 / (1 / V.r1 + 1 / V.r2 + 1 / ZbVal);
      RoutVal = (V.re * reP) / (V.re + reP);
      AvVal = V.re / (V.re + reP);
    }

    function refreshLabels() {
      document.getElementById('lbl-r1').textContent = fmtR(V.r1);
      document.getElementById('lbl-r2').textContent = fmtR(V.r2);
      document.getElementById('lbl-re').textContent = fmtR(V.re);
      document.getElementById('vccValue').textContent = V.vcc;
      document.getElementById('betaValue').textContent = V.beta;
      document.getElementById('ieIndValue').textContent = trimNum(IC * 1000, 3);
      document.getElementById('icIndValue').textContent = trimNum(IC * 1000, 3);
      document.getElementById('meterVBValue').textContent = trimNum(VB, 2);
      document.getElementById('meterVEValue').textContent = trimNum(VE, 2);
      document.getElementById('meterVCValue').textContent = trimNum(VC, 2);
      document.getElementById('avUnloadedValue').textContent = trimNum(AvVal, 3);
      document.getElementById('reRevealValue').textContent = trimNum(reP, 1);
      document.getElementById('zbBadgeValue').textContent = trimNum(ZbVal / 1000, 1);
      document.getElementById('zinBadgeValue').textContent = trimNum(RinVal / 1000, 2);
      document.getElementById('zoutBadgeValue').textContent = trimNum(RoutVal, 1);
    }

    function setMode(mode) {
      quizMode = mode;
      V = (mode === 'randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
      recompute();
      refreshLabels();
      ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
        const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (b) b.classList.toggle('active', m === mode);
      });
      resetQuiz();
    }
