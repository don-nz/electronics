<!--
  FET Amplifier Applications — Exam Revision Quiz, built from the same
  teacher's 40-question "FET Revision Quiz" sample paper (UEEEC0066 Topics
  6-8) that jfet_review_quiz.html and mosfet_review_quiz.html already draw
  from. This one covers the device-AGNOSTIC amplifier-configuration content
  (common-source/drain/gate behaviour that applies to a JFET or a MOSFET
  alike) rather than JFET-only or MOSFET-only facts — a companion to those
  two device-specific quizzes, not a replacement for either.

  Source mapping (sample paper's own numbering, cross-checked against the
  teacher's own answer key):
    - Sample Q31-40 (the sample paper's own "Amplifier Applications"
      section) -> kept together as ONE complete section here, exactly as
      printed, including the MOSFET-flavoured items inside it (Q31, 33, 36,
      37) — they're genuinely about amplifier applications, not just device
      trivia, so splitting them out into mosfet_review_quiz.html instead
      would have fragmented this section for no real benefit.
    - Sample Q12 and Q14-19 -> an earlier, ungrouped block of generic FET
      amplifier-configuration questions (page 1's own section header for
      this block wasn't available when this file was built) that don't
      belong to either the MOSFET-specific quiz or a section header of
      their own — folded in here since every one of them is genuinely a
      device-agnostic "how does a CS/CD/CG amplifier behave" question, the
      same kind of content as the printed Amplifier Applications section.

  Sample Q20 ("small-signal dynamic resistance of the source ≈ 1/gm") is
  the exact same question as sample Q38, word for word and same correct
  answer — merged into one (kept as Q38's own position in the running
  order below) rather than asking it twice.

  Sample Q39 ("increasing VDS beyond pinch-off keeps ID nearly constant")
  is conceptually the same ground jfet_review_quiz.html's own "past
  pinch-off" question already covers — kept here anyway (reworded
  differently, generic "FET" phrasing rather than JFET-specific) since it's
  part of the sample paper's own printed Amplifier Applications section,
  which this file keeps intact rather than picking apart further.

  Built on the shared cert_iii/assets/quiz-engine.js engine, cloned from
  UEEEC0069/knowledge/digital_knowledge_logic_families.html's own minimal
  single-column (leftPanel:'none' throughout, no shapes/circuit panel)
  skeleton — same reasoning as mosfet_review_quiz.html: no diagrams needed
  for any of this content.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../assets/theme-init.js"></script>
  <script src="../../assets/quiz-engine.js"></script>
  <title>FET Amplifier Applications — Exam Revision</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/quiz-common.css">
  <script src="../../assets/breadcrumb.js" defer></script>
  <style>
    .progress-wrap { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  </style>
</head>

<body>
  <div class="crumb" id="crumb" data-current="Exam Revision"></div>
  <header>
    <h1>FET Amplifier Applications: Exam Revision Quiz</h1>
    <p>Common Source · Common Drain · Common Gate · Gain &amp; Loading (JFET &amp; MOSFET)</p>
  </header>

  <div class="quiz-wrap single-col" id="quizWrap">

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->
        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Sample Q15.
        text: () => 'In a <b style="color:var(--colour-ui-primary)">common-source</b> amplifier, the AC input signal is applied to which terminal?',
        hint: () => 'The configuration is named after whichever terminal is common to both the input and output loops — the input never goes there.',
        options: () => shuffle([
          { label: 'Source', type: 'wrong' },
          { label: 'Gate', type: 'correct' },
          { label: 'Drain', type: 'wrong' },
          { label: 'Substrate', type: 'wrong' },
        ]),
        correctExplain: () => 'A common-source amplifier\'s input is applied to the <b>Gate</b>',
        working: () => `<div class="working-line">"Common source" means the Source terminal is the one shared (AC-grounded) between input and output loops — the input signal instead drives the <b style="color:var(--colour-ui-correct)">Gate</b>, and the amplified output is taken from the Drain.</div>`
      },
      {
        // Sample Q17.
        text: () => 'In a <b style="color:var(--colour-ui-primary)">common-gate</b> amplifier, the AC input signal is applied to which terminal?',
        hint: () => 'The Gate terminal is the one held at AC ground in this configuration — so it can\'t also be where the input goes.',
        options: () => shuffle([
          { label: 'Drain', type: 'wrong' },
          { label: 'Source', type: 'correct' },
          { label: 'Gate', type: 'wrong' },
          { label: 'Substrate', type: 'wrong' },
        ]),
        correctExplain: () => 'A common-gate amplifier\'s input is applied to the <b>Source</b>',
        working: () => `<div class="working-line">Common gate is the mirror image of common source: the Gate is the terminal held at AC ground, so the input signal instead drives the <b style="color:var(--colour-ui-correct)">Source</b>, with the output still taken from the Drain.</div>`
      },
      {
        // Sample Q12.
        text: () => `The voltage gain of a <b style="color:var(--colour-ui-primary)">common-source</b> FET amplifier is approximately equal to which expression?`,
        hint: () => 'This is the exact same relationship the AC current-source model\'s own gm × vgs is built from — just multiplied through the drain resistor.',
        options: () => shuffle([
          { label: `<span class="colour-jfet">g<sub>m</sub></span> × <span class="colour-resistor">R<sub>S</sub></span>`, type: 'wrong' },
          { label: `<span class="colour-jfet">g<sub>m</sub></span> × <span class="colour-resistor">R<sub>D</sub></span>`, type: 'correct' },
          { label: `<span class="colour-voltage">V<sub>GS</sub></span> / <span class="colour-current">I<sub>D</sub></span>`, type: 'wrong' },
          { label: `<span class="colour-current">I<sub>D</sub></span> × <span class="colour-voltage">V<sub>DS</sub></span>`, type: 'wrong' },
        ]),
        correctExplain: () => `Common-source voltage gain ≈ <b><span class="colour-jfet">g<sub>m</sub></span> × <span class="colour-resistor">R<sub>D</sub></span></b>`,
        working: () => `<div class="working-line">The AC drain current is <span class="colour-jfet">g<sub>m</sub></span> × <span class="colour-voltage">v<sub>gs</sub></span>. That current develops an output voltage across <span class="colour-resistor">R<sub>D</sub></span>, so the voltage gain works out to <b style="color:var(--colour-ui-correct)"><span class="colour-jfet">g<sub>m</sub></span> × <span class="colour-resistor">R<sub>D</sub></span></b> — the drain resistor, not the source resistor, is what the output signal actually develops across.</div>`
      },
      {
        // Sample Q14.
        text: () => 'The AC output resistance looking back into a <b style="color:var(--colour-ui-primary)">common-source</b> stage is mainly set by which component?',
        hint: () => 'Looking back INTO the drain from the load, ignoring the (very high) resistance the FET itself contributes.',
        options: () => shuffle([
          { label: `<span class="colour-voltage">V<sub>DS</sub></span>`, type: 'wrong' },
          { label: `<span class="colour-resistor">R<sub>D</sub></span>`, type: 'correct' },
          { label: `<span class="colour-resistor">R<sub>S</sub></span>`, type: 'wrong' },
          { label: `<span class="colour-jfet">g<sub>m</sub></span>`, type: 'wrong' },
        ]),
        correctExplain: () => `A common-source stage's output resistance is set mainly by <b><span class="colour-resistor">R<sub>D</sub></span></b>`,
        working: () => `<div class="working-line">The FET itself behaves as a near-ideal current source in its active/saturation region, contributing a very high resistance of its own (often modelled as effectively infinite for hand calculations). Looking back into the drain, the dominant, much smaller resistance actually setting the output impedance is simply <b style="color:var(--colour-ui-correct)"><span class="colour-resistor">R<sub>D</sub></span></b>.</div>`
      },
      {
        // Sample Q16.
        text: () => 'In a <b style="color:var(--colour-ui-primary)">common-drain</b> amplifier (source follower), the voltage gain is approximately',
        hint: () => 'This configuration is used as a buffer, not a voltage amplifier — think about what "follower" in its other name implies about the output tracking the input.',
        options: () => shuffle([
          { label: 'slightly less than 1.', type: 'correct' },
          { label: `equal to <span class="colour-jfet">g<sub>m</sub></span> × <span class="colour-resistor">R<sub>D</sub></span>.`, type: 'wrong' },
          { label: 'zero.', type: 'wrong' },
          { label: 'greater than 1.', type: 'wrong' },
        ]),
        correctExplain: () => 'A common-drain (source follower) stage has a voltage gain <b>slightly less than 1</b>',
        working: () => `<div class="working-line">"Source follower" describes exactly what this stage does — the output at the Source tracks (follows) the input at the Gate almost exactly, minus a small loss. Voltage gain is <b style="color:var(--colour-ui-correct)">always slightly less than 1</b>, never more, and this configuration is used for its high input/low output impedance as a buffer, not for voltage gain.</div>`
      },
      {
        // Sample Q18.
        text: () => 'A technician describes an FET amplifier\'s output as "<b style="color:var(--colour-ui-primary)">loaded</b>." What does that actually mean?',
        hint: () => 'Compare it to the OPPOSITE case — an amplifier with nothing at all connected to its output.',
        options: () => shuffle([
          { label: 'The output is left open', type: 'wrong' },
          { label: 'Something is connected to the output', type: 'correct' },
          { label: 'The gate is shorted', type: 'wrong' },
          { label: 'The output is connected only to RD', type: 'wrong' },
        ]),
        correctExplain: () => 'A "loaded" output means <b>something external is connected to the output</b>',
        working: () => `<div class="working-line">An unloaded ("open") output only has to drive <span class="colour-resistor">R<sub>D</sub></span> itself. A <b style="color:var(--colour-ui-correct)">loaded</b> output has some external load resistance connected as well (in parallel with <span class="colour-resistor">R<sub>D</sub></span>), which pulls the effective output resistance down and typically reduces the stage's overall voltage gain compared to the unloaded case.</div>`
      },
      {
        // Sample Q19.
        text: () => 'What effect does adding a <b style="color:var(--colour-ui-primary)">source bypass capacitor</b> have in a common-source amplifier?',
        hint: () => 'The bypass cap only affects AC signals — the DC bias point across RS is untouched.',
        options: () => shuffle([
          { label: 'Increase AC gain', type: 'correct' },
          { label: 'Block DC', type: 'wrong' },
          { label: 'Stabilize bias', type: 'wrong' },
          { label: 'Decrease AC gain', type: 'wrong' },
        ]),
        correctExplain: () => 'A source bypass capacitor <b>increases the AC gain</b>',
        working: () => `<div class="working-line"><span class="colour-resistor">R<sub>S</sub></span> is still needed to set the DC bias point — the bypass capacitor only shorts it out for AC signals, leaving the Q-point untouched. With <span class="colour-resistor">R<sub>S</sub></span> removed from the AC gain formula, the gain rises from <span class="colour-jfet">g<sub>m</sub></span>×R<sub>D</sub>/(1+<span class="colour-jfet">g<sub>m</sub></span>R<sub>S</sub>) up to the full <span class="colour-jfet">g<sub>m</sub></span>×R<sub>D</sub> — a genuine <b style="color:var(--colour-ui-correct)">AC gain increase</b>, at the cost of losing the extra Q-point stability the unbypassed R<sub>S</sub> was providing.</div>`
      },
      {
        // Sample Q31.
        text: () => 'A <b style="color:var(--colour-ui-primary)">common-source</b> <b class="colour-mosfet">MOSFET</b> amplifier inverts the input signal by how many degrees?',
        hint: () => 'Same phase relationship as a BJT\'s own common-emitter stage.',
        options: () => shuffle([
          { label: '180°', type: 'correct' },
          { label: '0°', type: 'wrong' },
          { label: '90°', type: 'wrong' },
          { label: '45°', type: 'wrong' },
        ]),
        correctExplain: () => 'A common-source amplifier inverts the signal by <b>180°</b>',
        working: () => `<div class="working-line">As the gate voltage rises, the channel conducts harder, pulling more current through <span class="colour-resistor">R<sub>D</sub></span> and DROPPING the drain voltage — output falls as input rises, and vice versa. That's a full <b style="color:var(--colour-ui-correct)">180°</b> phase inversion, exactly like a BJT common-emitter stage.</div>`
      },
      {
        // Sample Q32.
        text: () => 'What voltage gain does a <b style="color:var(--colour-ui-primary)">common-drain</b> amplifier provide?',
        hint: () => 'Same configuration as the earlier "source follower" question — just asked from the "gain classification" angle instead of a number.',
        options: () => shuffle([
          { label: 'High voltage gain', type: 'wrong' },
          { label: 'Unity voltage gain', type: 'correct' },
          { label: 'Negative gain', type: 'wrong' },
          { label: 'Zero current gain', type: 'wrong' },
        ]),
        correctExplain: () => 'A common-drain amplifier provides approximately <b>unity voltage gain</b>',
        working: () => `<div class="working-line">"Unity gain" is the standard way of classifying a source follower's voltage gain — always close to, but never quite, 1. It's chosen for its impedance-buffering ability, not for amplifying voltage.</div>`
      },
      {
        // Sample Q33.
        text: () => 'What does the <b style="color:var(--colour-ui-primary)">gate oxide</b> layer in a <b class="colour-mosfet">MOSFET</b> provide?',
        hint: () => 'The same property tested from a different angle earlier in this quiz — what does that insulating layer do to the gate\'s own input resistance?',
        options: () => shuffle([
          { label: 'Low input resistance', type: 'wrong' },
          { label: 'Very high input resistance', type: 'correct' },
          { label: 'Moderate resistance', type: 'wrong' },
          { label: 'No resistance', type: 'wrong' },
        ]),
        correctExplain: () => 'The gate oxide gives a MOSFET its <b>very high input resistance</b>',
        working: () => `<div class="working-line">The thin silicon-dioxide layer between gate and channel is an insulator, not a conductor — it blocks any real DC current from reaching the gate at all, which is exactly what gives a MOSFET its characteristic <b style="color:var(--colour-ui-correct)">very high</b> input resistance.</div>`
      },
      {
        // Sample Q34 (same concept as sample Q19, worded slightly
        // differently in the source — kept as its own item since the
        // source paper asks it twice with different option sets).
        text: () => 'If <span class="colour-resistor">R<sub>S</sub></span> is bypassed in a common-source circuit, what happens to the amplifier?',
        hint: () => 'Same underlying reasoning as the earlier source-bypass-capacitor question.',
        options: () => shuffle([
          { label: 'DC bias is destroyed', type: 'wrong' },
          { label: 'AC gain increases', type: 'correct' },
          { label: 'AC gain decreases', type: 'wrong' },
          { label: `<span class="colour-jfet">g<sub>m</sub></span> decreases`, type: 'wrong' },
        ]),
        correctExplain: () => 'Bypassing R<sub>S</sub> makes the <b>AC gain increase</b>',
        working: () => `<div class="working-line">The bypass capacitor only shorts <span class="colour-resistor">R<sub>S</sub></span> for AC signals, leaving the DC operating point completely intact — so DC bias is NOT destroyed. Removing <span class="colour-resistor">R<sub>S</sub></span> from the AC gain path is exactly what <b style="color:var(--colour-ui-correct)">increases the AC gain</b>, and it has no effect on the device's own <span class="colour-jfet">g<sub>m</sub></span> at all (that's a property of the transistor itself, not the external bias network).</div>`
      },
      {
        // Sample Q35.
        text: () => 'What is a <b style="color:var(--colour-ui-primary)">common-source</b> amplifier typically used for?',
        hint: () => 'This is the "textbook default" configuration for a reason.',
        options: () => shuffle([
          { label: 'Current buffering', type: 'wrong' },
          { label: 'Voltage amplification', type: 'correct' },
          { label: 'Power supply regulation', type: 'wrong' },
          { label: 'Oscillation', type: 'wrong' },
        ]),
        correctExplain: () => 'A common-source amplifier is typically used for <b>voltage amplification</b>',
        working: () => `<div class="working-line">Common source is the general-purpose voltage amplifier configuration — real usable gain (<span class="colour-jfet">g<sub>m</sub></span> × <span class="colour-resistor">R<sub>D</sub></span>), which is exactly why it's the default choice whenever the job is simply "amplify this voltage signal." Current buffering is closer to what a source follower (common drain) provides instead.</div>`
      },
      {
        // Sample Q36.
        text: () => `A <b class="colour-mosfet">MOSFET</b>'s threshold voltage, <span class="colour-voltage">V<sub>th</sub></span>, is defined as the value of <span class="colour-voltage">V<sub>GS</sub></span> at which what happens?`,
        hint: () => 'This is specifically about the ENHANCEMENT-mode behaviour — the channel doesn\'t exist below this voltage at all.',
        options: () => shuffle([
          { label: `<span class="colour-current">I<sub>D</sub></span> = 0`, type: 'wrong' },
          { label: `<span class="colour-voltage">V<sub>DS</sub></span> = 0`, type: 'wrong' },
          { label: 'A conducting channel forms', type: 'correct' },
          { label: `<span class="colour-jfet">g<sub>m</sub></span> = 0`, type: 'wrong' },
        ]),
        correctExplain: () => `<span class="colour-voltage">V<sub>th</sub></span> is the <span class="colour-voltage">V<sub>GS</sub></span> value at which <b>a conducting channel forms</b>`,
        working: () => `<div class="working-line">Below <span class="colour-voltage">V<sub>th</sub></span>, an enhancement-mode MOSFET has no channel at all and <span class="colour-current">I<sub>D</sub></span> is zero — but <span class="colour-current">I<sub>D</sub></span> = 0 is the CONSEQUENCE of there being no channel, not the definition of <span class="colour-voltage">V<sub>th</sub></span> itself. <span class="colour-voltage">V<sub>th</sub></span> is specifically the gate-source voltage at which <b style="color:var(--colour-ui-correct)">a conducting channel first forms</b> beneath the gate.</div>`
      },
      {
        // Sample Q37.
        text: () => `What is a genuine <b style="color:var(--colour-ui-primary)">advantage</b> of using a <b class="colour-mosfet">MOSFET</b> instead of a <b class="colour-bjt">BJT</b>?`,
        hint: () => 'This follows directly from how each device\'s control terminal is actually built.',
        options: () => shuffle([
          { label: 'Lower switching speed', type: 'wrong' },
          { label: 'Higher input resistance', type: 'correct' },
          { label: 'Lower input resistance', type: 'wrong' },
          { label: 'Higher gate current', type: 'wrong' },
        ]),
        correctExplain: () => 'A MOSFET\'s key advantage over a BJT is its <b>higher input resistance</b>',
        working: () => `<div class="working-line">A MOSFET's insulated gate draws essentially no DC current at all, giving it a dramatically <b style="color:var(--colour-ui-correct)">higher input resistance</b> than a BJT's forward-biased base-emitter junction, which needs a real, non-zero base current to operate. MOSFETs are generally FASTER switches than BJTs (not slower), and their gate current is lower, not higher.</div>`
      },
      {
        // Sample Q20/Q38 (identical questions in the source, merged into
        // one — see this file's own header comment).
        text: () => 'Looking into the <b style="color:var(--colour-ui-primary)">Source</b> terminal itself, what is the small-signal dynamic resistance there approximately equal to?',
        hint: () => 'The reciprocal of the one parameter that describes how strongly the gate voltage controls the drain current.',
        options: () => shuffle([
          { label: `<span class="colour-resistor">R<sub>S</sub></span>`, type: 'wrong' },
          { label: `1 / <span class="colour-jfet">g<sub>m</sub></span>`, type: 'correct' },
          { label: `<span class="colour-jfet">g<sub>m</sub></span>`, type: 'wrong' },
          { label: `<span class="colour-resistor">R<sub>D</sub></span>`, type: 'wrong' },
        ]),
        correctExplain: () => `The Source's own small-signal resistance is <b>1 / g<sub>m</sub></b>`,
        working: () => `<div class="working-line">Ignoring any external <span class="colour-resistor">R<sub>S</sub></span>, the Source terminal's own intrinsic small-signal resistance is <b style="color:var(--colour-ui-correct)">1 / <span class="colour-jfet">g<sub>m</sub></span></b> — this is exactly why a source follower's output impedance is so low, and why a common-gate stage's input impedance (looking into the Source) is likewise low.</div>`
      },
      {
        // Sample Q39.
        text: () => 'In an FET biased <b style="color:var(--colour-ui-primary)">beyond pinch-off</b>, what happens to <span class="colour-current">I<sub>D</sub></span> as <span class="colour-voltage">V<sub>DS</sub></span> keeps increasing?',
        hint: () => 'The whole reason this "flat" region of the output curve makes an FET useful as a predictable amplifier.',
        options: () => shuffle([
          { label: `<span class="colour-current">I<sub>D</sub></span> decreases sharply`, type: 'wrong' },
          { label: `<span class="colour-current">I<sub>D</sub></span> stays nearly constant`, type: 'correct' },
          { label: `<span class="colour-current">I<sub>D</sub></span> increases linearly`, type: 'wrong' },
          { label: `<span class="colour-jfet">g<sub>m</sub></span> drops to zero`, type: 'wrong' },
        ]),
        correctExplain: () => `Beyond pinch-off, <b><span class="colour-current">I<sub>D</sub></span> stays nearly constant</b> as V<sub>DS</sub> rises`,
        working: () => `<div class="working-line">Once the channel has pinched off, the device behaves as a near-ideal constant-current source set by the gate voltage alone — further increases in <span class="colour-voltage">V<sub>DS</sub></span> barely move <span class="colour-current">I<sub>D</sub></span> at all. This flat region of the output characteristic is exactly what makes an FET's drain current predictable and usable for amplification, regardless of small variations in supply or load voltage.</div>`
      },
      {
        // Sample Q40.
        text: () => 'When a <b class="colour-mosfet">MOSFET</b> is used purely as a <b style="color:var(--colour-ui-primary)">switch</b>, it operates between which two regions?',
        hint: () => 'A switch needs to be fully OFF in one state and behave like a low-resistance closed contact in the other — neither of those is the flat "active" amplifier region.',
        options: () => shuffle([
          { label: 'Cutoff and ohmic (linear) region', type: 'correct' },
          { label: 'Cutoff and saturation', type: 'wrong' },
          { label: 'Saturation and ohmic region', type: 'wrong' },
          { label: 'Breakdown and cutoff', type: 'wrong' },
        ]),
        correctExplain: () => 'A MOSFET switch operates between <b>cutoff and the ohmic (linear) region</b>',
        working: () => `<div class="working-line">Fully OFF is <b style="color:var(--colour-ui-correct)">cutoff</b> (no channel, no conduction). Fully ON, a switch is driven hard into the <b style="color:var(--colour-ui-correct)">ohmic/linear (triode)</b> region — deliberately kept OUT of the flat saturation/active region a linear amplifier stage would use, since a good switch wants to look like a simple low-value resistor when closed, not a constant-current source.</div>`
      },
    ];

    // Randomise question ORDER (not just each question's own options) on
    // every load and every Restart — same pattern as bjt_review_quiz.html,
    // jfet_review_quiz.html and mosfet_review_quiz.html's own RESET_EXTRA.
    // resetQuiz() itself (see quiz-engine.js) automatically skips this
    // whenever the URL already carries a ?q=N param, so ?q=N stays a
    // reliable fixed-order deep-link for debugging — no extra code needed
    // here for that.
    RESET_EXTRA = () => shuffle(QUESTIONS);

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
