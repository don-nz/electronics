<!--
  MOSFET Exam Revision Quiz — built from the same teacher's 40-question "FET
  Revision Quiz" sample paper (UEEEC0066 Topics 6-8) that jfet_review_quiz.html
  already covers, but pulling out the MOSFET-ONLY content that file's own
  header comment deliberately excluded ("MOSFET-only trivia with no JFET
  equivalent... is dropped rather than taught wrong"): enhancement/depletion
  mode operation, gate-oxide construction, the substrate-arrow symbol,
  shorted-drain fault, the k/Vth relationship, MOSFET biasing stability, and
  saturation-region operation.

  Source mapping (sample paper's own numbering, cross-checked against the
  teacher's own answer key):
    - Sample Q13 (input resistance)          -> Q1 below
    - Sample Q21 (depletion-mode VGS=0) and
      Sample Q22 (enhancement-mode threshold) -> ONE consolidated kind:'match'
                                                  question instead of 2
                                                  separate near-identical MCQs
                                                  (same reuse-over-
                                                  transcription approach as
                                                  jfet_review_quiz.html)
    - Sample Q23 (substrate arrow)            -> Q3 below
    - Sample Q24 (shorted drain fault)         -> Q4 below
    - Sample Q25 (k relates ID to VGS)         -> Q5 below
    - Sample Q26 (most stable biasing)         -> Q6 below
    - Sample Q30 (saturation region condition) -> Q7 below

  Sample Q27-29 (IDSS/pinch-off/small-signal current source) sit inside the
  sample paper's own "MOSFET Types & Biasing" section header but are
  genuinely JFET content (JFET-only terms IDSS/VP/pinch-off) — already
  covered by jfet_review_quiz.html's own questions, so not duplicated here.
  Sample Q40 (MOSFET-as-switch regions) and the MOSFET-specific questions
  inside the sample paper's own "Amplifier Applications" section (Q31, 33,
  36, 37) went into the separate amplifier_applications_review_quiz.html
  instead, alongside the rest of that section.

  This course's own curriculum (see jfet/index.html) has no dedicated MOSFET
  week — this quiz exists purely to make use of the sample paper's own
  MOSFET content rather than let it go to waste, not because MOSFETs are
  formally taught. Kept deliberately small (7 questions) rather than padded
  with invented content.

  Built on the shared cert_iii/assets/quiz-engine.js engine, cloned from
  UEEEC0069/knowledge/digital_knowledge_logic_families.html's own minimal
  single-column (leftPanel:'none' throughout, no shapes/circuit panel)
  skeleton — this content needs no diagrams, so there's no shape-grid/
  circuit-panel markup to carry at all.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../assets/theme-init.js"></script>
  <script src="../../assets/quiz-engine.js"></script>
  <title>MOSFET Knowledge Quiz — Exam Revision</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/quiz-common.css">
  <script src="../../assets/breadcrumb.js" defer></script>
  <style>
    .progress-wrap { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  </style>
</head>

<body>
  <div class="crumb" id="crumb" data-current="Exam Revision"></div>
  <header>
    <h1>MOSFET: Exam Revision Quiz</h1>
    <p>Types &amp; Operation · Biasing · Construction · Faults</p>
  </header>

  <div class="quiz-wrap single-col" id="quizWrap">

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->
        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Sample Q13.
        text: () => 'How would you describe the <b style="color:var(--colour-ui-primary)">input resistance</b> (looking into the gate) of a <b class="colour-mosfet">MOSFET</b>?',
        hint: () => 'Think about what actually separates the gate terminal from the channel underneath it — is there any direct electrical path at all?',
        options: () => shuffle([
          { label: 'Very low', type: 'wrong' },
          { label: 'Very high', type: 'correct' },
          { label: 'Moderate', type: 'wrong' },
          { label: 'Zero', type: 'wrong' },
        ]),
        correctExplain: () => 'A MOSFET\'s gate input resistance is <b>very high</b>',
        working: () => `<div class="working-line">A MOSFET's gate is insulated from the channel by a thin layer of silicon dioxide (the "gate oxide") — there is no direct conducting path between gate and channel at all, only a capacitive coupling. That insulation is why essentially no DC current ever flows into the gate, giving a MOSFET an <b style="color:var(--colour-ui-correct)">extremely high</b> input resistance, typically even higher than a JFET's already-high reverse-biased-junction gate.</div>`
      },
      {
        // Sample Q21 + Q22 consolidated into one kind:'match' question,
        // same reuse-over-transcription approach as jfet_review_quiz.html's
        // own amplifier-configuration matches.
        kind: 'match',
        columns: () => ['Depletion-mode', 'Enhancement-mode'],
        text: () => `Each description below matches one type of <b class="colour-mosfet">MOSFET</b>. <b style="color:var(--colour-ui-primary)">Place</b> each one under the correct type.`,
        hint: () => 'One type is built with a channel already there, ready to conduct before any gate voltage is even applied. The other has no channel at all until the gate voltage crosses a threshold.',
        options: () => shuffle([
          { label: 'Can conduct with V<sub>GS</sub> = 0 — a channel already exists at zero bias', col: 0 },
          { label: 'Requires a gate-source voltage above a threshold before it conducts at all', col: 1 },
          { label: 'Manufactured with a physical channel already built in', col: 0 },
          { label: 'Has no conducting channel until the gate voltage induces one', col: 1 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 4 correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} correctly matched`;
        },
        working: () => `
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Depletion-mode</b> MOSFETs are built with a channel physically present during manufacture — they conduct at <span class="colour-voltage">V<sub>GS</sub></span> = 0, and a gate voltage of the right polarity DEPLETES (narrows) that existing channel, reducing current.</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Enhancement-mode</b> MOSFETs have no channel at all until a gate-source voltage past the threshold (<span class="colour-voltage">V<sub>th</sub></span>) actually induces one — the gate voltage ENHANCES (creates) the channel from nothing, rather than just narrowing one that was already there.</div>`
      },
      {
        // Sample Q23.
        text: () => 'On a <b class="colour-mosfet">MOSFET</b> schematic symbol, what does the arrow drawn on the substrate/body lead actually indicate?',
        hint: () => 'This is the same kind of information an arrow indicates on a BJT or JFET symbol — think about what varies between an N-channel and P-channel device.',
        options: () => shuffle([
          { label: 'Voltage polarity', type: 'wrong' },
          { label: 'Channel type', type: 'correct' },
          { label: 'Current flow', type: 'wrong' },
          { label: 'None of these', type: 'wrong' },
        ]),
        correctExplain: () => 'The substrate arrow indicates the MOSFET\'s <b>channel type</b> (N-channel or P-channel)',
        working: () => `<div class="working-line">Just like the arrow on a BJT's emitter or a JFET's gate, the substrate arrow on a MOSFET symbol is a channel-type marker rather than a literal current-direction or voltage indicator — an arrow pointing IN marks an <b style="color:var(--colour-ui-correct)">N-channel</b> device, and an arrow pointing OUT marks a <b style="color:var(--colour-ui-correct)">P-channel</b> device.</div>`
      },
      {
        // Sample Q24.
        text: () => 'A solder bridge <b style="color:var(--colour-ui-primary)">shorts the drain</b> of a <b class="colour-mosfet">MOSFET</b> amplifier stage directly to the supply rail. What effect does this have on the amplifier\'s output?',
        hint: () => 'Think about what a MOSFET amplifier stage actually needs to happen at the drain node in order to produce ANY output signal at all.',
        options: () => shuffle([
          { label: 'No source current', type: 'wrong' },
          { label: '<span class="colour-current">I<sub>D</sub></span> becomes very small', type: 'wrong' },
          { label: 'Infinite gain', type: 'wrong' },
          { label: 'No drain voltage swing', type: 'correct' },
        ]),
        correctExplain: () => 'A shorted drain produces <b>no drain voltage swing</b> at all',
        working: () => `<div class="working-line">An amplifier's output signal is a voltage SWING at the drain node, produced by the changing drain current developing a changing voltage across <span class="colour-resistor">R<sub>D</sub></span>. If the drain is instead bridged straight to the supply rail, that node is pinned at a fixed voltage no matter what the channel current does — so <b style="color:var(--colour-ui-correct)">there's no drain voltage swing</b>, and the stage produces no usable AC output.</div>`
      },
      {
        // Sample Q25.
        text: () => `A <b class="colour-mosfet">MOSFET</b>'s drain current equation includes a device parameter <i>k</i>. What relationship does <i>k</i> actually describe?`,
        hint: () => 'Think about which two quantities the drain-current equation itself is actually solving for and starting from.',
        options: () => shuffle([
          { label: `<span class="colour-voltage">V<sub>GS</sub></span> to <span class="colour-voltage">V<sub>DS</sub></span>`, type: 'wrong' },
          { label: `<span class="colour-jfet">g<sub>m</sub></span> to <span class="colour-current">I<sub>D</sub></span>`, type: 'wrong' },
          { label: `<span class="colour-current">I<sub>D</sub></span> to <span class="colour-voltage">V<sub>GS</sub></span>`, type: 'correct' },
          { label: `<span class="colour-current">I<sub>D</sub></span> to <span class="colour-voltage">V<sub>DS</sub></span>`, type: 'wrong' },
        ]),
        correctExplain: () => `<i>k</i> relates <b><span class="colour-current">I<sub>D</sub></span> to <span class="colour-voltage">V<sub>GS</sub></span></b>`,
        working: () => `<div class="working-line">The standard MOSFET square-law equation, <span class="colour-current">I<sub>D</sub></span> = <i>k</i>(<span class="colour-voltage">V<sub>GS</sub></span> − <span class="colour-voltage">V<sub>th</sub></span>)², is exactly what it looks like: a formula for drain current in terms of gate-source voltage (above threshold). <i>k</i> is the scaling constant (set by the device's own physical construction) that links those two quantities — <b style="color:var(--colour-ui-correct)"><span class="colour-current">I<sub>D</sub></span> to <span class="colour-voltage">V<sub>GS</sub></span></b>, not to <span class="colour-voltage">V<sub>DS</sub></span> or <span class="colour-jfet">g<sub>m</sub></span> directly.</div>`
      },
      {
        // Sample Q26.
        text: () => `Which biasing method gives the <b style="color:var(--colour-ui-primary)">most stable</b> operating point for a <b class="colour-mosfet">MOSFET</b> amplifier stage?`,
        hint: () => 'The same reasoning that makes voltage-divider bias the stable choice for a BJT or JFET stage applies here too.',
        options: () => shuffle([
          { label: 'Zero bias', type: 'wrong' },
          { label: 'Voltage-divider bias', type: 'correct' },
          { label: 'Self-bias', type: 'wrong' },
          { label: 'Fixed bias', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Voltage-divider bias</b> gives the most stable operating point',
        working: () => `<div class="working-line">A stiff resistive divider sets a fixed gate voltage that barely moves regardless of any individual device's own spread in threshold voltage or transconductance — exactly the same reasoning that already makes voltage-divider bias the preferred, most stable choice for BJT and JFET stages alike. Fixed bias and zero bias both leave the Q-point riding directly on the device's own characteristics, with no correction at all.</div>`
      },
      {
        // Sample Q30.
        text: () => `A <b class="colour-mosfet">MOSFET</b> is operating in its <b style="color:var(--colour-ui-primary)">saturation (active)</b> region when which condition holds?`,
        hint: () => 'This is the MOSFET equivalent of a JFET being biased "past pinch-off" — the channel needs to have already pinched off at the drain end.',
        options: () => shuffle([
          { label: `<span class="colour-voltage">V<sub>DS</sub></span> < V<sub>GS</sub> − V<sub>th</sub>`, type: 'wrong' },
          { label: `<span class="colour-voltage">V<sub>DS</sub></span> ≥ V<sub>GS</sub> − V<sub>th</sub>`, type: 'correct' },
          { label: `<span class="colour-voltage">V<sub>GS</sub></span> = 0`, type: 'wrong' },
          { label: `<span class="colour-voltage">V<sub>DS</sub></span> = 0`, type: 'wrong' },
        ]),
        correctExplain: () => `Saturation requires <b>V<sub>DS</sub> ≥ V<sub>GS</sub> − V<sub>th</sub></b>`,
        working: () => `<div class="working-line">Once <span class="colour-voltage">V<sub>DS</sub></span> reaches or exceeds (<span class="colour-voltage">V<sub>GS</sub></span> − <span class="colour-voltage">V<sub>th</sub></span>), the channel has pinched off at the drain end and <span class="colour-current">I<sub>D</sub></span> levels off, controlled almost entirely by <span class="colour-voltage">V<sub>GS</sub></span> rather than <span class="colour-voltage">V<sub>DS</sub></span> — the flat, usable-as-an-amplifier region. Below that threshold, the device is instead in the ohmic/linear (triode) region, behaving more like a voltage-controlled resistor.</div>`
      },
    ];

    // Randomise question ORDER (not just each question's own options) on
    // every load and every Restart — same pattern as bjt_review_quiz.html
    // and jfet_review_quiz.html's own RESET_EXTRA. resetQuiz() itself (see
    // quiz-engine.js) automatically skips this whenever the URL already
    // carries a ?q=N param, so ?q=N stays a reliable fixed-order deep-link
    // for debugging — no extra code needed here for that.
    RESET_EXTRA = () => shuffle(QUESTIONS);

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
</html>
