<!--
  JFET Exam Revision Quiz (V1) — built from the teacher's own 40-question
  "FET Revision Quiz" sample paper (UEEEC0066 Topics 6-8). That paper mixes
  JFET and MOSFET questions under one "FET" umbrella, but this course's own
  curriculum (see jfet/index.html) only teaches JFETs — there is no MOSFET
  week anywhere in UEEEC0066. So this V1 deliberately covers ONLY the ~30 of
  40 sample questions that are genuinely JFET content (or have a clean JFET
  restatement); the MOSFET-only trivia with no JFET equivalent (enhancement-
  mode operation, gate-oxide construction, substrate-arrow symbol reading,
  the k/Vth equations, MOSFET-as-switch regions) is dropped rather than
  taught wrong. Duplicate sample questions asking the same thing twice
  (e.g. Q16/Q32 both "common-drain gain ≈1", Q19/Q34 both "bypassed RS
  raises AC gain", Q20/Q38 both "source resistance ≈ 1/gm") are merged into
  one question each.

  Same reuse-over-transcription approach as bjt_review_quiz.html:
    - Terminal names (sample Q1)   -> kind:'fill' click-a-name-then-a-
                                       terminal diagram, reused verbatim from
                                       basics/jfet_knowledge_basics.html's Q2
                                       (N-channel circuitConfig), instead of
                                       a bare "which of these are the 3
                                       terminals" MCQ.
    - Symbols (sample Q4)          -> shapeGrid multi "click every valid
                                       JFET symbol", reused verbatim from
                                       basics/jfet_knowledge_basics.html's Q1
                                       (same 8-shape defs).
    - Amp configs (sample Q12,15-
      18,20,31,32,35,37,38)        -> TWO kind:'match' questions (input/
                                       common-terminal identification, and
                                       gain/phase/use characteristics)
                                       instead of 8 separate scattered MCQs.
    - JFET vs BJT (sample Q37's
      "advantage over BJTs")       -> the existing kind:'match' JFET-vs-BJT
                                       question from basics.html's own Q4,
                                       reused verbatim as a wrap-up.
    - Self-bias resistor count/
      DC-analysis (sample Q8,10)   -> a worked numeric IDS calculation using
                                       the exact VG=0/VS=-VGS/IDS=VS·RS⁻¹
                                       formula chain from
                                       biasing_circuits/jfet_self_bias.html,
                                       with a pointer to that interactive
                                       simulator for further randomised
                                       practice.

  Faults (sample Q11,24) stay plain MCQ with a hint pointing at
  fault_finding/jfet_fault_interactive_internal.html and _resistor.html —
  those click-the-circuit DC-meter troubleshooters are a different, non-
  quiz-engine bespoke architecture and can't be folded into a QUESTIONS[]
  entry, same reasoning as the BJT review quiz's own fault section.

  Built on the shared cert_iii/assets/quiz-engine.js engine, cloned from
  basics/jfet_knowledge_basics.html's own TEMPLATE FILE skeleton (defs,
  fill-mechanic CSS and circuitPanelFill markup all copied from there
  unchanged) — same "one generic QUESTIONS[] array, no per-question HTML"
  structure as every other file in this project.
-->
<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../assets/theme-init.js"></script>
  <script src="../../assets/quiz-engine.js"></script>
  <title>JFET Knowledge Quiz — Exam Revision</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/quiz-common.css">
  <script src="../../assets/breadcrumb.js" defer></script>
  <style>
    .progress-wrap { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }

    /* kind:'fill' (Q1) — click-a-name-then-click-a-terminal labelling,
       copied unchanged from basics/jfet_knowledge_basics.html's own
       <style> block (see that file's header comment for why this needs
       page-local CSS rather than shared quiz-common.css classes). */
    .circuit-panel { cursor: default; }
    .fill-pool-wrap { margin-top: .8rem; }
    .fill-pool-row { display: flex; align-items: center; gap: .5rem; }
    .fill-pool-arrow { font-size: 1rem; color: var(--colour-ui-primary); opacity: 0; transition: opacity .15s; }
    .fill-pool-row.needs-pick .fill-pool-arrow { opacity: 1; animation: fillArrowBounce .8s ease-in-out infinite; }
    @keyframes fillArrowBounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    .fill-pool {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .5rem;
      padding: .8rem;
      border: 2px dashed var(--colour-border);
      border-radius: var(--radius-lg);
      background: rgba(var(--colour-label-rgb), .05);
      min-height: 3rem;
      transition: border-color .15s, background .15s;
    }
    .fill-pool.needs-pick {
      border-color: var(--colour-ui-primary);
      border-style: solid;
      background: rgba(var(--colour-ui-primary-rgb), .06);
      animation: matchPoolPulse 1.1s ease-in-out infinite;
    }
    .fill-pool .match-chip { min-width: 84px; text-align: center; }
    .circuit-slot-box { fill: var(--colour-panel); stroke: var(--colour-ui-primary); stroke-width: 1.5px; stroke-dasharray: 4,3; cursor: pointer; }
    .circuit-slot-box.filled { stroke-dasharray: none; }
    .circuit-slot-box.correct { stroke: var(--colour-ui-correct); }
    .circuit-slot-box.wrong { stroke: #ff3d66; }
    .circuit-slot-box.correct, .circuit-slot-box.wrong { cursor: default; }
    .jfet-slot-html {
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-body); font-size: 15px; font-weight: 700;
      color: var(--colour-ui-primary); text-align: center; line-height: 1;
      pointer-events: none; width: 100%; height: 100%;
    }
    .jfet-slot-html.correct { color: var(--colour-ui-correct); }
    .jfet-slot-html.wrong { color: #ff3d66; }
  </style>
</head>

<body>
  <!-- Hidden defs: JFET schematic symbols used by Q2's shapeGrid, and the
       Q1 terminal-fill diagram's symbol — copied unchanged from

       edit the master file first. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="b" />

        <line x1="10" y1="15" x2="10" y2="50" style="stroke: var(--colour-jfet)" stroke-width="2" />

        <circle cx="10" cy="50" r="2.5" style="fill: var(--colour-jfet)" />

        <line x1="10" y1="15" x2="10" y2="50" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <line x1="-10" y1="15" x2="10" y2="15" style="stroke: var(--colour-jfet)" stroke-width="2" />

        <circle cx="10" cy="-50" r="2.5" style="fill: var(--colour-jfet)" />
        <circle cx="10" cy="50" r="2.5" style="fill: var(--colour-jfet)" />

      <g id="jfet-error-wronglead-in"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="6,-30 14,-30 10,-22" style="fill: var(--colour-jfet)" /></g>
      <g id="jfet-error-wronglead-out"><use href="#jfet-base-frame-gate-top" /><use href="#jfet-circle" /><polygon points="6,-24 14,-24 10,-32" style="fill: var(--colour-jfet)" /></g>
      <g id="jfet-error-double-in"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="6,-30 14,-30 10,-22" style="fill: var(--colour-jfet)" /><polygon points="6,30 14,30 10,22" style="fill: var(--colour-jfet)" /></g>
      <g id="jfet-error-double-out"><use href="#jfet-base-frame-gate-top" /><use href="#jfet-circle" /><polygon points="6,-24 14,-24 10,-32" style="fill: var(--colour-jfet)" /><polygon points="6,24 14,24 10,32" style="fill: var(--colour-jfet)" /></g>
    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="Exam Revision"></div>
  <header>
    <h1>JFET Amplifiers: Exam Revision Quiz</h1>
    <p>Fundamentals · Operation · Biasing · Amplifier Configurations · Faults · JFET vs BJT</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <!-- LEFT: shape grid (leftPanel:'shapeGrid') or Q1's terminal-labelling
         diagram (leftPanel:'circuit', kind:'fill') -->
    <div class="circuit-col">
      <div id="qShapeGridPanel" style="display:none">
        <div class="panel-label">Click the shapes to select your answer</div>
        <div class="shape-grid" id="shapeGridCells"></div>
      </div>

      <div class="circuit-panel" id="circuitPanelFill" style="display:none">
        <div class="panel-label">Click a name below, then click a terminal</div>
        <svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg">
          <use id="jfetTerminalUse" href="#jfet-n-circle" transform="translate(220,150)" />

          <line x1="230" y1="100" x2="230" y2="64" style="stroke: var(--colour-jfet)" stroke-width="1.5" stroke-dasharray="3,2" />
          <line x1="230" y1="200" x2="230" y2="236" style="stroke: var(--colour-jfet)" stroke-width="1.5" stroke-dasharray="3,2" />
          <line id="gateLeaderLine" x1="170" y1="160" x2="130" y2="160" style="stroke: var(--colour-jfet)" stroke-width="1.5" stroke-dasharray="3,2" />

          <g id="slotBoxTop" class="circuit-slot-box" transform="translate(170,30)">
            <rect width="120" height="34" rx="4" />
            <foreignObject x="0" y="0" width="120" height="34">
              <div xmlns="http://www.w3.org/1999/xhtml" id="slotBoxTopText" class="jfet-slot-html"></div>
            </foreignObject>
          </g>
          <g id="slotBoxG" class="circuit-slot-box" transform="translate(10,143)">
            <rect width="120" height="34" rx="4" />
            <foreignObject x="0" y="0" width="120" height="34">
              <div xmlns="http://www.w3.org/1999/xhtml" id="slotBoxGText" class="jfet-slot-html"></div>
            </foreignObject>
          </g>
          <g id="slotBoxBottom" class="circuit-slot-box" transform="translate(170,236)">
            <rect width="120" height="34" rx="4" />
            <foreignObject x="0" y="0" width="120" height="34">

    <!-- RIGHT: question -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>

          </div>

          <div class="fill-pool-wrap" id="fillPoolWrap" style="display:none">
            <div class="fill-pool-row" id="fillPoolRow">
              <div class="fill-pool-arrow">▶</div>

          </div>

          <div class="options" id="qOptions"></div>

            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>

          </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>

  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      // ── Fundamentals & Symbols ──────────────────────────────────────
      {
        // Sample Q1 ("the three terminals of a JFET are...") upgraded from
        // a bare MCQ into the interactive diagram-labelling mechanic,
        // reused verbatim from basics/jfet_knowledge_basics.html's own Q2.
        leftPanel: 'circuit',
        kind: 'fill',
        circuitConfig: { shapeId: 'jfet-n-circle', topKey: 'D', gateOffset: 10 },
        get slotIds() { return jfetSlotIds(this.circuitConfig); },
        text: () => `This is an <b style="color:var(--colour-ui-primary)">N-channel JFET</b>. <b style="color:var(--colour-ui-primary)">Click</b> a name below, then <b style="color:var(--colour-ui-primary)">click</b> the terminal it belongs to.`,
        hint: () => `A JFET only has 3 terminals. Three of the names below belong to a different transistor family entirely — they won't fit anywhere on this diagram.`,
        options: () => shuffle(jfetFillOptions()),
        correctExplain: jfetFillCorrectExplain,
        working: jfetFillWorking
      },
      {
        // Sample Q4 ("the schematic symbol...shows the arrow...") upgraded
        // to shapeGrid multi-select, reused verbatim from basics.html's Q1.
        leftPanel: 'shapeGrid',
        kind: 'multi',
        shapeViewBox: '-55 -55 110 110',
        text: () => `<b style="color:var(--colour-ui-primary)">Click</b> every shape below that is a <b class="colour-jfet">valid</b> JFET transistor symbol. There are <b style="color:var(--colour-ui-correct)">4 correct</b> shapes among the 8 shown.`,
        hint: () => 'A valid symbol has exactly one arrow, on the gate lead (the horizontal one) — never on the drain or source lead. The arrow points INTO the channel for N-channel, or OUT of the channel for P-channel. The circle is optional — it doesn\'t change which symbols are valid.',
        options: () => shuffle([
          { label: 'N-channel, circle',    type: 'correct', shapeId: 'jfet-n-circle' },
          { label: 'P-channel, circle',    type: 'correct', shapeId: 'jfet-p-circle' },
          { label: 'N-channel, no circle', type: 'correct', shapeId: 'jfet-n-nocircle' },
          { label: 'P-channel, no circle', type: 'correct', shapeId: 'jfet-p-nocircle' },
          { label: 'Arrow on drain/source lead, pointing in',  type: 'wrong', shapeId: 'jfet-error-wronglead-in' },
          { label: 'Arrow on drain/source lead, pointing out', type: 'wrong', shapeId: 'jfet-error-wronglead-out' },
          { label: 'Two arrows, both pointing in',  type: 'wrong', shapeId: 'jfet-error-double-in' },
          { label: 'Two arrows, both pointing out', type: 'wrong', shapeId: 'jfet-error-double-out' }
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(n => n).join(', ');
          return `Shapes <b>${nums}</b> are the valid JFET symbols`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Valid symbols — shapes ${correctNums}:</div>
    <div class="working-line">Each has exactly one arrow, on the <b style="color:var(--colour-ui-correct)">gate lead</b>. The arrow points <b style="color:var(--colour-ui-correct)">into</b> the channel for N-channel, or <b style="color:var(--colour-ui-correct)">out of</b> the channel for P-channel.</div>
    <div class="working-step" style="margin-top:.6rem">Invalid symbols — shapes ${wrongNums}:</div>
    <div class="working-line">Each breaks the one-arrow-on-the-gate rule: two put the arrow on a <b style="color:var(--colour-ui-wrong)">drain/source lead</b>, and two put <b style="color:var(--colour-ui-wrong)">two arrows</b> on the symbol at once.</div>`;
        }
      },
      {
        text: () => 'An N-channel JFET\'s channel is made from N-type material. Which charge carrier does most of the work of carrying current through it?',
        hint: () => 'N-type material\'s majority carriers follow directly from its doping — no different from any other N-type semiconductor.',
        options: () => shuffle([
          { label: 'Electrons', type: 'correct' },
          { label: 'Holes', type: 'wrong' },
          { label: 'Both electrons and holes', type: 'wrong' },
          { label: 'No carriers', type: 'wrong' },
        ]),
        correctExplain: () => 'An N-channel JFET conducts primarily via <b>electrons</b>',
        working: () => `<div class="working-line">The N-channel is doped N-type material, so its majority carriers are <b style="color:var(--colour-ui-correct)">electrons</b>. A JFET is a <b>unipolar</b> device — only one carrier type does the work of conducting current through the channel.</div>`
      },
      {
        text: () => 'For a JFET to operate normally as an amplifier, how must its gate-source junction be biased?',
        hint: () => 'Think about what keeps gate current near zero, and how the depletion region needs to behave to control the channel.',
        options: () => shuffle([
          { label: 'Forward biased', type: 'wrong' },
          { label: 'Reverse biased', type: 'correct' },
          { label: 'Shorted to the source', type: 'wrong' },
          { label: 'At zero bias', type: 'wrong' },
        ]),
        correctExplain: () => 'The gate-source junction is normally <b>reverse biased</b>',
        working: () => `<div class="working-line">A JFET's gate is a PN junction against the channel. Keeping it <b style="color:var(--colour-ui-correct)">reverse biased</b> widens the depletion region into the channel as <span class="colour-voltage">V<sub>GS</sub></span> becomes more negative (N-channel), narrowing the conducting path and reducing drain current — that's the entire control mechanism.</div>
    <div class="working-line" style="margin-top:.4rem">Because a reverse-biased junction conducts essentially zero current, almost no current ever flows into the gate — the direct reason a JFET's input resistance is so high.</div>`
      },
      {
        text: () => 'How would you describe a JFET\'s gate input resistance compared to a BJT\'s base?',
        hint: () => 'Directly follows from how the gate-source junction is normally biased.',
        options: () => shuffle([
          { label: 'Roughly the same', type: 'wrong' },
          { label: 'Noticeably lower', type: 'wrong' },
          { label: 'Slightly lower', type: 'wrong' },
          { label: 'Dramatically higher', type: 'correct' },
        ]),
        correctExplain: () => `A JFET's gate input resistance is <b>dramatically higher</b> than a BJT's base`,
        working: () => `<div class="working-line">Directly follows from the gate-source junction always being <b style="color:var(--colour-ui-correct)">reverse biased</b> — a reverse-biased junction draws only a tiny leakage current no matter what voltage is applied, so the gate looks like an extremely high resistance (typically hundreds of MΩ or more) to whatever is driving it. A BJT's forward-biased base-emitter junction, by contrast, draws a real, non-trivial base current.</div>`
      },

      // ── JFET Operation & Characteristics ──────────────────────────────
      {
        text: () => 'When a technician plots a JFET\'s transfer characteristic on a graph, which two quantities go on the axes?',
        hint: () => 'The transfer curve is what links the input control voltage to the output current.',
        options: () => shuffle([
          { label: 'Drain current vs. gate-source voltage', type: 'correct' },
          { label: 'Source current vs. drain voltage', type: 'wrong' },
          { label: 'Input resistance vs. frequency', type: 'wrong' },
          { label: 'Gate current vs. gate voltage', type: 'wrong' },
        ]),
        correctExplain: () => `The transfer curve plots <b><span class="colour-current">I<sub>D</sub></span> vs. <span class="colour-voltage">V<sub>GS</sub></span></b>`,
        working: () => `<div class="working-line">The transfer curve is the graph of <b style="color:var(--colour-ui-correct)">drain current (<span class="colour-current">I<sub>D</sub></span>)</b> against <b style="color:var(--colour-ui-correct)">gate-source voltage (<span class="colour-voltage">V<sub>GS</sub></span>)</b> — it shows exactly how the gate voltage controls channel current, running from <span class="colour-current">I<sub>D</sub></span> = <span class="colour-current">I<sub>DSS</sub></span> at <span class="colour-voltage">V<sub>GS</sub></span> = 0 down to <span class="colour-current">I<sub>D</sub></span> = 0 at <span class="colour-voltage">V<sub>GS</sub></span> = <span class="colour-voltage">V<sub>P</sub></span> (pinch-off).</div>`
      },
      {
        text: () => 'Which ratio does a JFET\'s transconductance (gm) actually describe?',
        hint: () => 'Same idea as a BJT\'s β — how much does the output change for a given change at the input?',
        options: () => shuffle([

    ];

    // ── Configurable JFET terminal-labelling circuit (Q1) — copied
    // unchanged from basics/jfet_knowledge_basics.html. ──
    const SLOT_COL = { slotBoxTop: 0, slotBoxG: 1, slotBoxBottom: 2 };
    ['slotBoxTop', 'slotBoxG', 'slotBoxBottom'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => slotClicked(SLOT_COL[id]));
    });
    function jfetSlotIds(cfg) {
      return cfg.topKey === 'D' ? ['slotBoxTop', 'slotBoxG', 'slotBoxBottom'] : ['slotBoxBottom', 'slotBoxG', 'slotBoxTop'];
    }
    function applyJfetCircuitConfig(cfg) {
      document.getElementById('jfetTerminalUse').setAttribute('href', '#' + cfg.shapeId);
      SLOT_COL.slotBoxTop = cfg.topKey === 'D' ? 0 : 2;
      SLOT_COL.slotBoxBottom = cfg.topKey === 'D' ? 2 : 0;
      const gateY = 150 + cfg.gateOffset;
      const line = document.getElementById('gateLeaderLine');
      line.setAttribute('y1', gateY);
      line.setAttribute('y2', gateY);
      document.getElementById('slotBoxG').setAttribute('transform', `translate(10,${143 + (cfg.gateOffset - 10)})`);
    }
    function jfetFillOptions() {
      return [
        { label: 'Drain',     poolHtml: 'Drain',     col: 0 },
        { label: 'Gate',      poolHtml: 'Gate',      col: 1 },
        { label: 'Source',    poolHtml: 'Source',    col: 2 },
        { label: 'Base',      poolHtml: 'Base' },
        { label: 'Emitter',   poolHtml: 'Emitter' },
        { label: 'Collector', poolHtml: 'Collector' }
      ];
    }
    function jfetFillCorrectExplain(st) {
      const wrongCount = st.slotPlaced.filter((p, slot) => p !== st.cor[slot]).length;
      return wrongCount === 0 ? 'All 3 terminals correctly labelled' : `${st.slotPlaced.length - wrongCount} of ${st.slotPlaced.length} terminals correctly labelled`;
    }
    function jfetFillWorking(st) {
      const mistakes = st.slotPlaced
        .map((p, slot) => p !== st.cor[slot] ? st.opts[p]?.label ?? '(left blank)' : null)
        .filter(Boolean);
      const mistakeLine = mistakes.length
        ? `<div class="working-step" style="margin-top:.6rem">Mislabelled:</div><div class="working-line">${mistakes.join(', ')}</div>`
        : '';
      return `
    <div class="working-step">A JFET's 3 terminals:</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Drain</b> and <b style="color:var(--colour-ui-correct)">Source</b> are the two ends of the channel current flows through. <b style="color:var(--colour-ui-correct)">Gate</b> is the control terminal — the voltage between gate and source is what controls how much current flows through the channel.</div>
    <div class="working-step" style="margin-top:.6rem">Why Base, Emitter and Collector don't belong:</div>
    <div class="working-line">Those are BJT terminal names, not JFET ones.</div>
    ${mistakeLine}`;
    }

    RENDER_EXTRA = () => {
      document.getElementById('fillPoolWrap').style.display = isFill(QUESTIONS[cur]) ? '' : 'none';
      const cfg = QUESTIONS[cur].circuitConfig;
      if (cfg) applyJfetCircuitConfig(cfg);
    };

    // Randomise question ORDER (not just each question's own options) on
    // every load and every Restart — same reasoning and pattern as
    // bjt_review_quiz.html's own RESET_EXTRA (itself matching
    // digital_gate_identification.html's precedent): a short revision
    // session should draw from across the whole quiz, not always start
    // at Q1. Safe even though Q1's circuitConfig-driven diagram is unique
    // to this array position — RENDER_EXTRA reapplies it fresh from
    // QUESTIONS[cur] on every render regardless of where Q1 lands.
    RESET_EXTRA = () => shuffle(QUESTIONS);

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
</html>
