<!--
  Exam-revision quiz mirroring the teacher's own "Worksheet 1" handout
  (UEEEC0066 Theory exam preparation worksheets, doc JZ20250619 V10, page 1
  of 9) question-for-question: an NPN common-emitter stage, voltage-divider
  bias, UNBYPASSED emitter resistor. Example 1's component values are the
  worksheet's own numbers exactly (R1=220k, R2=47k, R3=5k6, R4=1k5, BC549
  β=550, Vcc=10V) — Example 2/3/Randomise are additional realistic value
  sets for repeat practice, same convention as bjt_knowledge_basics.html
  (the project's own TEMPLATE FILE for this mode-switching pattern — see
  its header comment; EXAMPLE_SETS/setMode/recompute/refreshLabels/
  randomValues are page-local code on top of the shared quiz-engine.js, not
  a core-engine feature).

  Circuit `ce-divider-ac` is bjt_knowledge_ac_params_ce.html's own circuit
  def, unchanged in topology (R1/R2 divider, separate RC and RE, BC549) —
  only the value labels are now dynamic (id'd text nodes updated by
  refreshLabels()) instead of hardcoded, since this file needs its values
  to change with the mode toggle.

  Reused content (see the "3 exam-revision quizzes" plan for the full
  reuse map): DC questions (VB/VE/IC/VC) mirror bjt_npn_voltage_divider.
  html's own wording; config/bias-type/phase/typical-use mirror bjt_
  knowledge_amp_config.html's CE-specific text; re′/Zb/Rin/Rout/unloaded Av
  mirror bjt_knowledge_ac_params_ce.html's Q1-5 formula/option shape;
  bypassed Av mirrors ce_bypassed.html; bypassed+loaded Av mirrors
  bjt_knowledge_ac_params_loading.html's Q5/Q6 RC∥RL method (denominator
  swapped to re′ alone, since R4 is bypassed here). The two fault questions
  (R1 open, R2 increased) and the dB-conversion question have no existing
  template anywhere in the project — authored fresh in the same style
  (formula + hint + full working, genuine "common mistake" distractors).

  Same data-driven QUESTIONS[] engine as bjt_knowledge_basics.html — see
  that file's header comment for the core architecture.
-->

    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalTitle">Reference Circuit</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="-10 -10 690 570" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

  </div>

  <script>
    const DEFAULT_VIEWBOX = '-10 -50 690 620';
    CIRCUIT_SVG_ID = 'circuitRefSvg';
    DEFAULT_CIRCUIT_VIEWBOX = DEFAULT_VIEWBOX;
    SUMMARY_CIRCUIT_REF = { id: 'ce-divider-ac', label: 'Common Emitter (voltage-divider bias, R4 unbypassed)', viewBox: DEFAULT_VIEWBOX };

    // ══════════════════════════════════════════════════════════════════════
    // MODE-SWITCHING — page-local pattern copied from bjt_knowledge_basics.
    // html (this project's TEMPLATE FILE for combining EXAMPLE_SETS/setMode
    // with the shared quiz-engine.js). Example 1 = the worksheet's own
    // numbers exactly.
    // ══════════════════════════════════════════════════════════════════════
    const VBE = 0.6;
    const RL_FIXED = 10000; // the worksheet's own "loaded with a 10kΩ resistor" value (part r)

    const EXAMPLE_SETS = {
      example1: { r1: 220000, r2: 47000, rc: 5600, re: 1500, beta: 550, vcc: 10 },
      example2: { r1: 100000, r2: 22000, rc: 3300, re: 680, beta: 300, vcc: 12 },
      example3: { r1: 150000, r2: 33000, rc: 4700, re: 1000, beta: 450, vcc: 15 },
    };
    let quizMode = 'example1';
    let V = { ...EXAMPLE_SETS.example1 };

    const R1_POOL = [100000, 120000, 150000, 180000, 220000, 270000];
    const R2_POOL = [22000, 27000, 33000, 39000, 47000, 56000];
    const RC_POOL = [2200, 2700, 3300, 3900, 4700, 5600];
    const RE_POOL = [680, 820, 1000, 1200, 1500];
    const BETA_POOL = [200, 300, 400, 550];
    const VCC_POOL = [9, 10, 12, 15];
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function randomValues() {
      for (let attempt = 0; attempt < 25; attempt++) {
        const vals = { r1: pick(R1_POOL), r2: pick(R2_POOL), rc: pick(RC_POOL), re: pick(RE_POOL), beta: pick(BETA_POOL), vcc: pick(VCC_POOL) };
        const vb = vals.vcc * vals.r2 / (vals.r1 + vals.r2);
        const ve = vb - VBE;
        if (ve < 0.3) continue;
        const ie = ve / vals.re;
        const vc = vals.vcc - ie * vals.rc;
        if (vc - ve < 1 || vc > vals.vcc - 0.3) continue;
        return vals;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    function fmtR(v) { return v >= 1000 ? (Math.round(v / 10) / 100) + ' kΩ' : Math.round(v) + ' Ω'; }
    function fmtOhm1(v) { return v.toFixed(1) + ' Ω'; }
    function fmtK2(v) { return (v / 1000).toFixed(2) + ' kΩ'; }
    function fmtV2(v) { return v.toFixed(2) + ' V'; }
    function fmtMA3(v) { return (v * 1000).toFixed(3) + ' mA'; }
    function fmtGain(v) { return v.toFixed(2); }
    function fmtDb(v) { return v.toFixed(2) + ' dB'; }

    let VB, VE, IE, IC, VC, reP, ZbVal, RinVal, AvU, AvDb, AvByp, AvBypLoaded;
    function recompute() {
      VB = V.vcc * V.r2 / (V.r1 + V.r2);
      VE = VB - VBE;
      IE = VE / V.re;
      IC = IE;
      VC = V.vcc - IC * V.rc;
      reP = 0.026 / IE;
      ZbVal = V.beta * (V.re + reP);
      RinVal = 1 / (1 / V.r1 + 1 / V.r2 + 1 / ZbVal);
      AvU = V.rc / (V.re + reP);
      AvDb = 20 * Math.log10(AvU);
      AvByp = V.rc / reP;
      const rcRl = 1 / (1 / V.rc + 1 / RL_FIXED);
      AvBypLoaded = rcRl / reP;
    }

    function refreshLabels() {
      document.getElementById('lbl-r1').textContent = fmtR(V.r1);
      document.getElementById('lbl-r2').textContent = fmtR(V.r2);
      document.getElementById('lbl-rc').textContent = fmtR(V.rc);
      document.getElementById('lbl-re').textContent = fmtR(V.re);
      document.getElementById('vccValue').textContent = V.vcc;
      document.getElementById('betaValue').textContent = V.beta;
      document.getElementById('ieIndValue').textContent = trimNum(IC * 1000, 3);
      document.getElementById('icIndValue').textContent = trimNum(IC * 1000, 3);
      document.getElementById('meterVBValue').textContent = trimNum(VB, 2);
      document.getElementById('meterVEValue').textContent = trimNum(VE, 2);
      document.getElementById('meterVCValue').textContent = trimNum(VC, 2);
      document.getElementById('avUnloadedValue').textContent = trimNum(AvU, 2);
      document.getElementById('avBypassedValue').textContent = trimNum(AvByp, 2);
      document.getElementById('avBypLoadedValue').textContent = trimNum(AvBypLoaded, 2);
      document.getElementById('reRevealValue').textContent = trimNum(reP, 1);
      document.getElementById('zbBadgeValue').textContent = trimNum(ZbVal / 1000, 1);
      document.getElementById('zinBadgeValue').textContent = trimNum(RinVal / 1000, 2);
      document.getElementById('zoutBadgeValue').textContent = trimNum(V.rc / 1000, 2);
    }

    function setMode(mode) {
      quizMode = mode;
      V = (mode === 'randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
      recompute();
      refreshLabels();
      ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
        const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (b) b.classList.toggle('active', m === mode);
      });
      resetQuiz();
    }

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — a) through r), same order as the worksheet.
    // ══════════════════════════════════════════════════════════════════════
    const QUESTIONS = [
      { // a) name device
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'What <b style="color:var(--colour-ui-primary)">device</b> is Q1 in this circuit?',
        hint: () => 'Read the part number printed directly below the transistor symbol on the diagram.',
        options: () => shuffle([
          { label: 'NPN <b style="color:var(--colour-bjt-labels)">BJT (BC549)</b>', type: 'correct' },
          { label: 'PNP <b style="color:var(--colour-bjt-labels)">BJT (BC549)</b>', type: 'wrong' },
          { label: 'NPN <b style="color:var(--colour-bjt-labels)">BJT (2N3904)</b>', type: 'wrong' },
          { label: 'N-CHANNEL <b style="color:var(--colour-jfet-labels)">JFET (BC549)</b>', type: 'wrong' },
        ]),
        correctExplain: () => 'Q1 is a <b class="colour-bjt">BC549</b>.',
        working: () => `<div class="working-line">The label directly under the transistor symbol reads <b class="colour-bjt">BC549</b> — a general-purpose NPN silicon BJT, the same device family used throughout this course.</div>`,
      },
      { // b) bias type
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'What <b style="color:var(--colour-ui-primary)">type of bias</b> is used in this circuit?',
        hint: () => 'Count how many resistors set the base voltage, and whether they form a divider between VCC and ground.',
        options: () => shuffle([
          { label: 'Voltage-divider bias', type: 'correct' },
          { label: 'Base bias', type: 'wrong' },
          { label: 'Collector-feedback bias', type: 'wrong' },
          { label: 'Emitter bias', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Voltage-divider bias</b>.',
        working: () => `<div class="working-line">R1 (top) and R2 (bottom) form a two-resistor divider between VCC and common, setting a fixed base voltage largely independent of β — the defining feature of voltage-divider bias.</div>`,
      },
      { // c) amp config
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'What <b style="color:var(--colour-ui-primary)">amplifier configuration</b> is this?',
        hint: () => 'The input is applied to the base and the output is taken from the collector — the emitter (though unbypassed here) is the terminal common to both loops.',
        options: () => shuffle([
          { label: 'Common Emitter', type: 'correct' },
          { label: 'Common Collector', type: 'wrong' },
          { label: 'Common Base', type: 'wrong' },
          { label: 'Common Drain', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Common Emitter</b>.',
        working: () => `<div class="working-line">Signal in at the base, signal out at the collector, emitter common to both — this is a Common Emitter stage, whether or not R4 happens to be bypassed.</div>`,
      },
      { // d) phase relationship
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'What is the <b style="color:var(--colour-ui-primary)">phase relationship</b> between input and output?',
        hint: () => 'A rising base voltage increases IC, pulling MORE voltage across R3 — what does that leave at the collector?',
        options: () => shuffle([
          { label: 'Inverted (180° out of phase)', type: 'correct' },
          { label: 'In phase (0°)', type: 'wrong' },
          { label: '90° leading', type: 'wrong' },
          { label: 'Depends on the load', type: 'wrong' },
        ]),
        correctExplain: () => '<b>Inverted (180° out of phase)</b>.',
        working: () => `<div class="working-line">A rising input increases I<sub>C</sub>, which pulls more voltage across R3, leaving LESS at the collector — output falls when input rises, a 180° phase flip. This is characteristic of every Common Emitter stage.</div>`,
      },
      { // e) VB
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'Calculate the <b class="colour-voltage">base voltage V<sub>B</sub></b>.',
        hint: () => 'Treat R1 and R2 as a simple voltage divider from VCC to common — the base draws very little current compared to the divider current.',
        options: () => shuffle([
          { label: `<b class="colour-voltage">VB</b> = <b class="colour-supply">VCC</b> × ${frac('<b class="colour-resistor">R2</b>', '<b class="colour-resistor">R1</b>+<b class="colour-resistor">R2</b>')} = ${V.vcc} × ${frac(`${fmtR(V.r2)}`, `${fmtR(V.r1)}+${fmtR(V.r2)}`)} ≈ ${fmtV2(VB)}`, type: 'correct' },
          { label: `<b class="colour-voltage">VB</b> = <b class="colour-supply">VCC</b> × ${frac('<b class="colour-resistor">R1</b>', '<b class="colour-resistor">R1</b>+<b class="colour-resistor">R2</b>')} = ${V.vcc} × ${frac(`${fmtR(V.r1)}`, `${fmtR(V.r1)}+${fmtR(V.r2)}`)} ≈ ${fmtV2(V.vcc * V.r1 / (V.r1 + V.r2))}`, type: 'wrong' },
          { label: `<b class="colour-voltage">VB</b> = ${frac('<b class="colour-supply">VCC</b>', '2')} = ${frac(`${V.vcc} V`, '2')} ≈ ${fmtV2(V.vcc / 2)}`, type: 'wrong' },
          { label: `<b class="colour-voltage">VB</b> = <b class="colour-supply">VCC</b> ≈ ${fmtV2(V.vcc)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-voltage">V<sub>B</sub></b> ≈ ${fmtV2(VB)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-voltage">V<sub>B</sub></b> = ${frac('<b class="colour-supply">V<sub>CC</sub></b> × <b class="colour-resistor">R2</b>', '<b class="colour-resistor">R1</b> + <b class="colour-resistor">R2</b>')} = ${frac(`${V.vcc} V × ${fmtR(V.r2)}`, `${fmtR(V.r1)} + ${fmtR(V.r2)}`)}</div>
    <div class="working-total"><b class="colour-voltage">V<sub>B</sub></b> ≈ ${fmtV2(VB)}</div>`,
      },
      { // f) VE
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'Calculate the <b class="colour-voltage">emitter voltage V<sub>E</sub></b>.',
        hint: () => 'A forward-biased silicon base-emitter junction drops approximately 0.6 V.',
        options: () => shuffle([
          { label: `<b class="colour-voltage">VE</b> = <b class="colour-voltage">VB</b> − 0.6 V = ${fmtV2(VB)} − 0.6 V ≈ ${fmtV2(VE)}`, type: 'correct' },
          { label: `<b class="colour-voltage">VE</b> = <b class="colour-voltage">VB</b> + 0.6 V ≈ ${fmtV2(VB + VBE)}`, type: 'wrong' },
          { label: `<b class="colour-voltage">VE</b> = <b class="colour-voltage">VB</b> ≈ ${fmtV2(VB)}`, type: 'wrong' },
          { label: `<b class="colour-voltage">VE</b> = 0.6 V`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-voltage">V<sub>E</sub></b> ≈ ${fmtV2(VE)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-voltage">V<sub>E</sub></b> = <b class="colour-voltage">V<sub>B</sub></b> − 0.6 V = ${fmtV2(VB)} − 0.6 V</div>
    <div class="working-total"><b class="colour-voltage">V<sub>E</sub></b> ≈ ${fmtV2(VE)}</div>`,
      },
      { // g) IC
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        circuitAmmeter: true,
        text: () => 'Calculate the <b class="colour-current">collector current I<sub>C</sub></b>.',
        hint: () => 'Apply Ohm\'s Law across R4 to find IE, then use IC ≈ IE (base current is comparatively tiny).',
        options: () => shuffle([
          { label: `<b class="colour-current">IC</b> ≈ <b class="colour-current">IE</b> = ${frac('<b class="colour-voltage">VE</b>', '<b class="colour-resistor">R4</b>')} = ${frac(fmtV2(VE), fmtR(V.re))} ≈ ${fmtMA3(IC)}`, type: 'correct' },
          { label: `<b class="colour-current">IC</b> = ${frac('<b class="colour-voltage">VB</b>', '<b class="colour-resistor">R4</b>')} = ${frac(fmtV2(VB), fmtR(V.re))} ≈ ${fmtMA3(VB / V.re)}`, type: 'wrong' },
          { label: `<b class="colour-current">IC</b> = ${frac('<b class="colour-voltage">VE</b>', '<b class="colour-resistor">R3</b>')} = ${frac(fmtV2(VE), fmtR(V.rc))} ≈ ${fmtMA3(VE / V.rc)}`, type: 'wrong' },
          { label: `<b class="colour-current">IC</b> = ${frac('<b class="colour-resistor">R4</b>', '<b class="colour-voltage">VE</b>')} ≈ ${(V.re / VE).toFixed(4)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-current">I<sub>C</sub></b> ≈ ${fmtMA3(IC)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-current">I<sub>E</sub></b> = ${frac('<b class="colour-voltage">V<sub>E</sub></b>', '<b class="colour-resistor">R4</b>')} = ${frac(fmtV2(VE), fmtR(V.re))}</div>
    <div class="working-total"><b class="colour-current">I<sub>C</sub></b> ≈ <b class="colour-current">I<sub>E</sub></b> ≈ ${fmtMA3(IC)}</div>`,
      },
      { // h) VC
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        circuitAmmeter: true,
        text: () => 'Calculate the <b class="colour-voltage">collector voltage V<sub>C</sub></b>.',
        hint: () => 'Find the voltage dropped across R3, then subtract it from VCC.',
        options: () => shuffle([
          { label: `<b class="colour-voltage">VC</b> = <b class="colour-supply">VCC</b> − (<b class="colour-current">IC</b>×<b class="colour-resistor">R3</b>) = ${V.vcc} V − (${fmtMA3(IC)}×${fmtR(V.rc)}) ≈ ${fmtV2(VC)}`, type: 'correct' },
          { label: `<b class="colour-voltage">VC</b> = <b class="colour-current">IC</b>×<b class="colour-resistor">R3</b> = ${fmtMA3(IC)}×${fmtR(V.rc)} ≈ ${fmtV2(IC * V.rc)}`, type: 'wrong' },
          { label: `<b class="colour-voltage">VC</b> = <b class="colour-supply">VCC</b> − (<b class="colour-current">IC</b>×<b class="colour-resistor">R4</b>) = ${V.vcc} V − (${fmtMA3(IC)}×${fmtR(V.re)}) ≈ ${fmtV2(V.vcc - IC * V.re)}`, type: 'wrong' },
          { label: `<b class="colour-voltage">VC</b> = <b class="colour-supply">VCC</b> + (<b class="colour-current">IC</b>×<b class="colour-resistor">R3</b>) = ${V.vcc} V + (${fmtMA3(IC)}×${fmtR(V.rc)}) ≈ ${fmtV2(V.vcc + IC * V.rc)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-voltage">V<sub>C</sub></b> ≈ ${fmtV2(VC)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-voltage">V<sub>C</sub></b> = <b class="colour-supply">V<sub>CC</sub></b> − (<b class="colour-current">I<sub>C</sub></b> × <b class="colour-resistor">R3</b>) = ${V.vcc} V − (${fmtMA3(IC)} × ${fmtR(V.rc)})</div>
    <div class="working-total"><b class="colour-voltage">V<sub>C</sub></b> ≈ ${fmtV2(VC)}</div>`,
      },
      { // i) fault: R1 open
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'What would happen to <b class="colour-voltage">V<sub>C</sub></b> if <b style="color:var(--colour-ui-primary)">R1 went open circuit</b>?',
        hint: () => 'If R1 opens, is there still a path pulling the base UP towards VCC, or does R2 now dominate and pull the base LOW?',
        options: () => shuffle([
          { label: 'VC rises towards VCC — with no path to VCC, R2 pulls the base to 0 V, the transistor turns off (cutoff), IC ≈ 0', type: 'correct' },
          { label: 'VC falls to near 0 V — the transistor saturates', type: 'wrong' },
          { label: 'VC stays the same — R1 has no effect on the base once biased', type: 'wrong' },
          { label: 'VC drops slightly, then the circuit oscillates', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-voltage">VC</b> rises towards <b class="colour-supply">VCC</b> (transistor cuts off).',
        working: () => `
    <div class="working-line">R1 is the only path from VCC to the base. If it opens, R2 alone connects the base to common, pulling VB (and hence VE, IE, IC) to ≈ 0.</div>
    <div class="working-total">With IC ≈ 0, there is almost no drop across R3, so <b class="colour-voltage">VC</b> rises to nearly <b class="colour-supply">VCC</b>.</div>`,
      },
      { // j) fault: R2 increased
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'What would happen to <b class="colour-current">I<sub>C</sub></b> if <b style="color:var(--colour-ui-primary)">R2 increased in value</b>?',
        hint: () => 'R2 sets the fraction of VCC that reaches the base (VB = VCC×R2/(R1+R2)) — what happens to that fraction if R2 gets bigger?',
        options: () => shuffle([
          { label: 'IC increases — a bigger R2 raises VB, which raises VE and IE', type: 'correct' },
          { label: 'IC decreases — a bigger R2 restricts more current from flowing', type: 'wrong' },
          { label: 'IC is unaffected — the divider is "stiff" so R2 never matters', type: 'wrong' },
          { label: 'IC immediately drops to zero', type: 'wrong' },
        ]),
        correctExplain: () => '<b class="colour-current">IC</b> increases.',
        working: () => `
    <div class="working-line">VB = VCC × R2/(R1+R2) — increasing R2 increases this fraction, raising VB.</div>
    <div class="working-total">A higher VB gives a higher VE (=VB−0.6V), and IE=VE/R4 rises with it, so <b class="colour-current">IC</b> ≈ <b class="colour-current">IE</b> increases too.</div>`,
      },
      { // k) re'
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        circuitAmmeter: true,
        text: () => 'Calculate the <b class="colour-bjt">dynamic emitter resistance r<sub>e</sub>′</b>.',
        hint: () => 're′ = 26mV / IE, using the standard room-temperature approximation.',
        options: () => shuffle([
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 mV', '<b class="colour-current">I<sub>E</sub></b>')} ≈ ${frac('26 mV', fmtMA3(IE))} ≈ ${fmtOhm1(reP)}`, type: 'correct' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('26 V', '<b class="colour-current">I<sub>E</sub></b>')} = ${frac('26 V', fmtMA3(IE))} ≈ ${fmtOhm1(reP * 1000)}`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ 26 Ω`, type: 'wrong' },
          { label: `<b class="colour-bjt">re′</b> ≈ ${frac('<b class="colour-current">I<sub>E</sub></b>', '26 mV')} = ${frac(fmtMA3(IE), '26 mV')} ≈ ${(IE * 1000 / 26).toFixed(4)} Ω`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-bjt">r<sub>e</sub>′</b> ≈ ${fmtOhm1(reP)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-bjt">r<sub>e</sub>′</b> = ${frac('V<sub>T</sub>', 'I<sub>E</sub>')} ≈ ${frac('26 mV', fmtMA3(IE))}</div>
    <div class="working-total"><b class="colour-bjt">r<sub>e</sub>′</b> ≈ ${fmtOhm1(reP)} — small next to R4 (${fmtR(V.re)}) here, but not thrown away: every AC parameter from here on uses it.</div>`,
      },
      { // l) unloaded Av
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'Calculate the <b style="color:var(--colour-ui-primary)">unloaded voltage gain</b> <b class="colour-gain">|A<sub>v</sub>|</b>.',
        hint: () => '|Av| ≈ R3 / (R4 + re′) for a common-emitter stage with an unbypassed emitter.',
        options: () => shuffle([
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">R3</b>', '<b class="colour-resistor">R4</b>+<b class="colour-bjt">re′</b>')} = ${frac(fmtR(V.rc), `${fmtR(V.re)}+${fmtOhm1(reP)}`)} ≈ ${fmtGain(AvU)}`, type: 'correct' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">R3</b>', '<b class="colour-resistor">R4</b>')} = ${frac(fmtR(V.rc), fmtR(V.re))} ≈ ${fmtGain(V.rc / V.re)}`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">R4</b>+<b class="colour-bjt">re′</b>', '<b class="colour-resistor">R3</b>')} = ${frac(`${fmtR(V.re)}+${fmtOhm1(reP)}`, fmtR(V.rc))} ≈ ${fmtGain((V.re + reP) / V.rc)}`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ <b class="colour-resistor">R3</b> ≈ ${fmtR(V.rc)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${fmtGain(AvU)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${frac('<b class="colour-resistor">R3</b>', '<b class="colour-resistor">R4</b> + r<sub>e</sub>′')} = ${frac(fmtR(V.rc), `${fmtR(V.re)} + ${fmtOhm1(reP)}`)}</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${fmtGain(AvU)}</div>`,
      },
      { // m) gain in dB
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'Convert the unloaded voltage gain to <b style="color:var(--colour-ui-primary)">decibels</b>.',
        hint: () => 'AV(dB) = 20 × log₁₀(Vout/Vin) — the unloaded gain you already calculated IS Vout/Vin, so plug it straight in.',
        options: () => shuffle([
          { label: `<b class="colour-gain">Av(dB)</b> = 20 × log₁₀(<b class="colour-gain">Av</b>) = 20 × log₁₀(${fmtGain(AvU)}) ≈ ${fmtDb(AvDb)}`, type: 'correct' },
          { label: `<b class="colour-gain">Av(dB)</b> = 10 × log₁₀(<b class="colour-gain">Av</b>) = 10 × log₁₀(${fmtGain(AvU)}) ≈ ${fmtDb(AvDb / 2)}`, type: 'wrong' },
          { label: `<b class="colour-gain">Av(dB)</b> = log₁₀(<b class="colour-gain">Av</b>) = log₁₀(${fmtGain(AvU)}) ≈ ${fmtDb(AvDb / 20)}`, type: 'wrong' },
          { label: `<b class="colour-gain">Av(dB)</b> = 20 × ln(<b class="colour-gain">Av</b>) = 20 × ln(${fmtGain(AvU)}) ≈ ${fmtDb(20 * Math.log(AvU))}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">Av(dB)</b> ≈ ${fmtDb(AvDb)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">Av(dB)</b> = 20 × log₁₀(<b class="colour-gain">Av</b>) = 20 × log₁₀(${fmtGain(AvU)})</div>
    <div class="working-total"><b class="colour-gain">Av(dB)</b> ≈ ${fmtDb(AvDb)}</div>`,
      },
      { // n) Rin
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'Calculate the amplifier\'s <b style="color:var(--colour-ui-primary)">input resistance</b> <b class="colour-gain">R<sub>IN</sub></b>.',
        hint: () => 'First reflect the emitter leg into the base: Rb = β×(R4+re′). Then R1, R2 and Rb are all three connected from the base node to common (or VCC, which is AC ground) — three resistances in PARALLEL.',
        options: () => shuffle([
          { label: `<span class="frac-option"><b class="colour-gain">RIN</b> = R1∥R2∥Rb, Rb=β(R4+re′)=${V.beta}×(${fmtR(V.re)}+${fmtOhm1(reP)})≈${fmtK2(ZbVal)} → RIN = ${frac('1', `${frac('1', fmtR(V.r1))}+${frac('1', fmtR(V.r2))}+${frac('1', fmtK2(ZbVal))}`)} ≈ ${fmtK2(RinVal)}</span>`, type: 'correct' },
          { label: `<b class="colour-gain">RIN</b> = R1+R2+Rb = ${fmtR(V.r1)}+${fmtR(V.r2)}+${fmtK2(ZbVal)} ≈ ${fmtK2(V.r1 + V.r2 + ZbVal)}`, type: 'wrong' },
          { label: `<span class="frac-option"><b class="colour-gain">RIN</b> = R1∥R2 = ${frac('1', `${frac('1', fmtR(V.r1))}+${frac('1', fmtR(V.r2))}`)} ≈ ${fmtK2(1 / (1 / V.r1 + 1 / V.r2))}</span>`, type: 'wrong' },
          { label: `<b class="colour-gain">RIN</b> ≈ Rb = β×R4 = ${V.beta}×${fmtR(V.re)} ≈ ${fmtK2(V.beta * V.re)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">R<sub>IN</sub></b> = R1∥R2∥Rb ≈ ${fmtK2(RinVal)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">Rb</b> = β × (R4 + re′) = ${V.beta} × (${fmtR(V.re)} + ${fmtOhm1(reP)}) ≈ ${fmtK2(ZbVal)}</div>
    <div class="working-formula-row"><b class="colour-gain">R<sub>IN</sub></b> = R1 ∥ R2 ∥ Rb</div>
    <div class="working-total"><b class="colour-gain">R<sub>IN</sub></b> ≈ ${fmtK2(RinVal)} — the SMALLEST of the three parallel resistances (usually R1∥R2) always dominates.</div>`,
      },
      { // o) Rout
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'Calculate the amplifier\'s <b style="color:var(--colour-ui-primary)">output resistance</b> <b class="colour-gain">R<sub>OUT</sub></b>.',
        hint: () => 'Zero the source, then look back into the collector node. The transistor\'s own internal output resistance is assumed very high, so it\'s ignored.',
        options: () => shuffle([
          { label: `<b class="colour-gain">ROUT</b> ≈ <b class="colour-resistor">R3</b> = ${fmtR(V.rc)}`, type: 'correct' },
          { label: `<b class="colour-gain">ROUT</b> ≈ <b class="colour-resistor">R4</b> = ${fmtR(V.re)}`, type: 'wrong' },
          { label: `<b class="colour-gain">ROUT</b> ≈ <b class="colour-gain">RIN</b> ≈ ${fmtK2(RinVal)}`, type: 'wrong' },
          { label: `<b class="colour-gain">ROUT</b> ≈ R3∥R4 ≈ ${fmtR(1 / (1 / V.rc + 1 / V.re))}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">R<sub>OUT</sub></b> ≈ <b class="colour-resistor">R3</b> = ${fmtR(V.rc)}`,
        working: () => `<div class="working-line">With the source zeroed, the only thing directly wired to the collector node (besides the transistor's very-high internal ro, ignored here) is R3 itself, running up to the AC-grounded VCC rail.</div>
    <div class="working-total"><b class="colour-gain">R<sub>OUT</sub></b> ≈ <b class="colour-resistor">R3</b> = ${fmtR(V.rc)}</div>`,
      },
      { // p) typical use
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'What is a <b style="color:var(--colour-ui-primary)">typical use</b> for this configuration?',
        hint: () => 'It provides significant voltage gain AND significant current gain at the same time — the other two configurations each sacrifice one type of gain.',
        options: () => shuffle([
          { label: 'General-purpose small-signal voltage amplifier', type: 'correct' },
          { label: 'Buffer/isolator stage (unity voltage gain)', type: 'wrong' },
          { label: 'High-frequency RF/communications amplifier', type: 'wrong' },
          { label: 'Precision current source only', type: 'wrong' },
        ]),
        correctExplain: () => '<b>General-purpose small-signal voltage amplifier</b>.',
        working: () => `<div class="working-line">Common Emitter is the most commonly used general-purpose stage, since it's the only one of the three BJT configurations offering both significant voltage gain and significant current gain simultaneously.</div>`,
      },
      { // q) bypassed gain
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'If R4 were <b style="color:var(--colour-ui-primary)">bypassed</b> with a large capacitor, what would the new voltage gain be?',
        hint: () => 'With R4 shorted out of the AC path, |Av| ≈ R3/re′ — re′ alone in the denominator, not (R4+re′).',
        options: () => shuffle([
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">R3</b>', '<b class="colour-bjt">re′</b>')} = ${frac(fmtR(V.rc), fmtOhm1(reP))} ≈ ${fmtGain(AvByp)}`, type: 'correct' },
          { label: `<b class="colour-gain">|Av|</b> unchanged ≈ ${fmtGain(AvU)}`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-bjt">re′</b>', '<b class="colour-resistor">R3</b>')} = ${frac(fmtOhm1(reP), fmtR(V.rc))} ≈ ${fmtGain(reP / V.rc)}`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> ≈ ${frac('<b class="colour-resistor">R3</b>', '<b class="colour-resistor">R4</b>')} = ${frac(fmtR(V.rc), fmtR(V.re))} ≈ ${fmtGain(V.rc / V.re)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${fmtGain(AvByp)}`,
        working: () => `
    <div class="working-line">Bypassing R4 shorts it out of the AC signal path entirely (it still sets the DC bias point) — only re′ is left in the denominator.</div>
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${frac('<b class="colour-resistor">R3</b>', 'r<sub>e</sub>′')} = ${frac(fmtR(V.rc), fmtOhm1(reP))}</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ ${fmtGain(AvByp)} — much larger than the unbypassed gain (${fmtGain(AvU)}), the trade-off being much less stability against β/temperature variation.</div>`,
      },
      { // r) bypassed + loaded
        circuitId: 'ce-divider-ac', circuitLabel: 'Common Emitter (voltage-divider bias, R4 unbypassed)',
        text: () => 'With R4 still <b style="color:var(--colour-ui-primary)">bypassed</b>, what is the voltage gain if the output is now <b style="color:var(--colour-ui-primary)">loaded</b> with a 10 kΩ resistor?',
        hint: () => 'Combine R3∥RL first, then divide by re′ alone (R4 is still bypassed) — same shape as the bypassed gain formula, just with R3∥RL swapped in for R3.',
        options: () => shuffle([
          { label: `<b class="colour-gain">Av(loaded)</b> = ${frac('R3∥RL', '<b class="colour-bjt">re′</b>')} = ${frac(fmtR(1 / (1 / V.rc + 1 / RL_FIXED)), fmtOhm1(reP))} ≈ ${fmtGain(AvBypLoaded)}`, type: 'correct' },
          { label: `<b class="colour-gain">Av(loaded)</b> = ${frac('R3', '<b class="colour-bjt">re′</b>')} = ${frac(fmtR(V.rc), fmtOhm1(reP))} ≈ ${fmtGain(AvByp)}`, type: 'wrong' },
          { label: `<b class="colour-gain">Av(loaded)</b> = ${frac('R3+RL', '<b class="colour-bjt">re′</b>')} = ${frac(`${fmtR(V.rc)}+10 kΩ`, fmtOhm1(reP))} ≈ ${fmtGain((V.rc + RL_FIXED) / reP)}`, type: 'wrong' },
          { label: `<b class="colour-gain">Av(loaded)</b> = <b class="colour-gain">Av(unloaded, bypassed)</b> × ${frac('R3+RL', 'RL')} = ${fmtGain(AvByp)} × ${frac(`${fmtR(V.rc)}+10 kΩ`, '10 kΩ')} ≈ ${fmtGain(AvByp * (V.rc + RL_FIXED) / RL_FIXED)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">Av(loaded)</b> ≈ ${fmtGain(AvBypLoaded)}`,
        working: () => `
    <div class="working-formula-row">R3∥RL = ${frac(`${fmtR(V.rc)} × 10 kΩ`, `${fmtR(V.rc)} + 10 kΩ`)} ≈ ${fmtR(1 / (1 / V.rc + 1 / RL_FIXED))}</div>
    <div class="working-formula-row"><b class="colour-gain">Av(loaded)</b> = ${frac('R3∥RL', 'r<sub>e</sub>′')} = ${frac(fmtR(1 / (1 / V.rc + 1 / RL_FIXED)), fmtOhm1(reP))}</div>
    <div class="working-total"><b class="colour-gain">Av(loaded)</b> ≈ ${fmtGain(AvBypLoaded)} — lower than the unloaded bypassed gain (${fmtGain(AvByp)}), since the load resistor always pulls the effective collector-side resistance down.</div>`,
      },
    ];

    /* DC-chain meters — same "reveal once answered, stays revealed"
       convention as jfet_review_worksheet3.html's own VG/VS/IDS/VD reveal.
       VB=Q5(idx4=e), VE=Q6(idx5=f), IC=Q7(idx6=g), VC=Q8(idx7=h). */
    function updateDcReveal() {
      document.getElementById('meterVB').setAttribute('display', Q[4].ans ? 'inline' : 'none');
      document.getElementById('meterVE').setAttribute('display', Q[5].ans ? 'inline' : 'none');
      document.getElementById('ieInd').setAttribute('display', Q[6].ans ? 'inline' : 'none');
      document.getElementById('icInd').setAttribute('display', Q[6].ans ? 'inline' : 'none');
      document.getElementById('meterVC').setAttribute('display', Q[7].ans ? 'inline' : 'none');
    }
    /* Av(unloaded)=Q12(idx11=l), Av(bypassed)=Q17(idx16=q), Av(bypassed+loaded)=Q18(idx17=r). */
    function updateAvReveal() {
      document.getElementById('avUnloadedReveal').setAttribute('display', Q[11].ans ? 'inline' : 'none');
      document.getElementById('avBypassedReveal').setAttribute('display', Q[16].ans ? 'inline' : 'none');
      document.getElementById('avBypLoadedReveal').setAttribute('display', Q[17].ans ? 'inline' : 'none');
    }
    /* re'/Zb/Zin/Zout progressive-reveal badges — same convention.
       re'=Q11(idx10=k), Zb/Zin folded into Q14(idx13=n)'s own
       badge set (both reveal together since n) is a single combined
       question here), Zout=Q15(idx14=o). */
    function updateReReveal() {
      document.getElementById('reRevealWs1').setAttribute('display', Q[10].ans ? 'inline' : 'none');
    }
    function updateZReveal() {
      const rinAnswered = Q[13].ans;
      document.getElementById('zbBadgeWs1').setAttribute('display', rinAnswered ? 'inline' : 'none');
      document.getElementById('zinBadgeWs1').setAttribute('display', rinAnswered ? 'inline' : 'none');
      document.getElementById('zoutBadgeWs1').setAttribute('display', Q[14].ans ? 'inline' : 'none');
    }
    RENDER_EXTRA = () => { updateDcReveal(); updateReReveal(); updateAvReveal(); updateZReveal(); };

    initQuizNav();
    setMode('example1'); // calls resetQuiz() internally, after applying V
    initQuizFromURL();
  </script>
