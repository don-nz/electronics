<!--
  Exam-revision quiz mirroring the teacher's "Worksheet 3" handout (UEEEC0066
  Theory exam preparation worksheets, doc JZ20250619 V10, page 3 of 9)
  question-for-question: an N-channel JFET self-bias Common Source stage
  with RS BYPASSED (C3) and a loaded output (RL=20kΩ). Example 1's values
  are the worksheet's own numbers exactly (RD=3k3, RG=1M5, RS=1k2, RL=20k,
  VDD=12V, VGS=-2.1V and gm=4700µS BOTH GIVEN directly — not derived from
  gm0/VP the way ../ac_parameters/jfet_self_bias_ac_params.html does).

  RS being bypassed here (confirmed against the exam formula sheet: it
  lists Av(Unloaded)=Gm×RD with no RS term at all — no unbypassed-CS-with-
  degeneration formula appears anywhere on the sheet, so the exam expects
  students to use the bypassed form) means the Av/Zin/Zout formulas used
  here are the SIMPLE bypassed forms, genuinely different from
  jfet_self_bias_ac_params.html's own unbypassed Av=gm×RD/(1+gm×RS).

  Circuit `jfet-self-bias-loaded-ac` extends jfet_self_bias_ac_params.html's
  own jfet-self-bias-ac circuit defs with two new elements neither JFET
  quiz file has needed before: a bypass capacitor C3 in parallel with RS
  (a branch wire off the source node, through a cap, back to common), and
  a real RL load resistor + second coupling cap after COUT (previously
  every project file's "output" was just an open probe point). DC-chain
  questions (VG/VS/IDS/VD) mirror ../biasing_circuits/jfet_self_bias.html's
  own Q1-4 wording/shape (VGS given, VG=0 derived, not the other way
  round). Rin/Rout mirror jfet_self_bias_ac_params.html's Q2/Q4 verbatim.
  The RD-increase fault question, the loaded-gain question (adapting
  bjt_knowledge_ac_params_loading.html's RC∥RL / divider-shortcut methods
  to Gm×(RD∥RL)), the unloaded-output-signal question (adapting that same
  file's Vout=Vs×Av pattern) and the f1 corner-frequency question have no
  existing template anywhere in the project — authored fresh in the same
  house style.

  Mode-switching (EXAMPLE_SETS/setMode/recompute/refreshLabels/
  randomValues) is the same page-local pattern as bjt_knowledge_basics.html
  and the two BJT worksheet quizzes built alongside this one.
-->

    // bjt_knowledge_basics.html. Example 1 = the worksheet's own numbers.
    // VGS and gm are both GIVEN directly here (not derived from gm0/VP the
    // way jfet_self_bias_ac_params.html does) — matching the worksheet.
    // ══════════════════════════════════════════════════════════════════════
    const C1_FIXED = 10e-9; // the worksheet's own C1 = 10nF, a fixed given value

    const EXAMPLE_SETS = {
      example1: { rd: 3300, rg: 1500000, rs: 1200, rl: 20000, vdd: 12, vgs: -2.1, gm: 0.0047 },
      example2: { rd: 2200, rg: 1000000, rs: 1000, rl: 15000, vdd: 15, vgs: -1.8, gm: 0.004 },
      example3: { rd: 4700, rg: 2200000, rs: 1500, rl: 22000, vdd: 18, vgs: -2.5, gm: 0.005 },
    };
    let quizMode = 'example1';
    let V = { ...EXAMPLE_SETS.example1 };

    const RD_POOL = [1000, 1500, 1800, 2200, 2700, 3300, 3900, 4700];
    const RG_POOL = [470000, 680000, 1000000, 1200000, 1500000, 1800000, 2200000];
    const RS_POOL = [560, 680, 820, 1000, 1200, 1500, 1800];
    const RL_POOL = [10000, 12000, 15000, 18000, 20000, 22000];
    const VDD_POOL = [9, 12, 15, 18];
    const VGS_POOL = [-1, -1.2, -1.5, -1.8, -2, -2.1, -2.5, -3];
    const GM_POOL = [0.003, 0.0035, 0.004, 0.0045, 0.0047, 0.005, 0.0055];
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function randomValues() {
      for (let attempt = 0; attempt < 25; attempt++) {
        const vals = { rd: pick(RD_POOL), rg: pick(RG_POOL), rs: pick(RS_POOL), rl: pick(RL_POOL), vdd: pick(VDD_POOL), vgs: pick(VGS_POOL), gm: pick(GM_POOL) };
        const vs = -vals.vgs;
        const ids = vs / vals.rs;
        const vd = vals.vdd - ids * vals.rd;
        if (vd < vals.vdd * 0.15 || vd > vals.vdd * 0.9) continue;
        if (vd <= vs) continue;
        return vals;
      }
      return { ...EXAMPLE_SETS.example1 };
    }

    function fmtR(v) {
      if (v >= 1e6) return (Math.round(v / 1e4) / 100) + ' MΩ';
      if (v >= 1000) return (Math.round(v / 10) / 100) + ' kΩ';
      return Math.round(v) + ' Ω';
    }
    function fmtV2(v) { return v.toFixed(2) + ' V'; }
    function fmtMA3(v) { return (v * 1000).toFixed(3) + ' mA'; }
    function fmtGm(v) { return (v * 1e6).toFixed(0) + ' µS'; }
    function fmtGain(v) { return v.toFixed(2); }
    function fmtHz(v) { return v.toFixed(2) + ' Hz'; }

    let VG, VS, IDS, VD, AvU, RDRL, AvL, VoutU, f1;
    function recompute() {
      VG = 0;
      VS = VG - V.vgs;
      IDS = VS / V.rs;
      VD = V.vdd - IDS * V.rd;
      AvU = V.gm * V.rd;
      RDRL = 1 / (1 / V.rd + 1 / V.rl);
      AvL = V.gm * RDRL;
      VoutU = 0.1 * AvU; // 100mV peak input
      f1 = 1 / (2 * Math.PI * V.rg * C1_FIXED);
    }

    function refreshLabels() {
      document.getElementById('lbl-rd').textContent = fmtR(V.rd);
      document.getElementById('lbl-rg').textContent = fmtR(V.rg);
      document.getElementById('lbl-rs').textContent = fmtR(V.rs);
      document.getElementById('lbl-rl').textContent = fmtR(V.rl);
      document.getElementById('vddValue').textContent = V.vdd;
      document.getElementById('gmValue').textContent = (V.gm * 1e6).toFixed(0);
      document.getElementById('vgsMeterValue').textContent = trimNum(V.vgs, 1);
      document.getElementById('idsIndValue').textContent = trimNum(IDS * 1000, 3);
      document.getElementById('meterVGValue').textContent = trimNum(VG, 2);
      document.getElementById('meterVSValue').textContent = trimNum(VS, 2);
      document.getElementById('meterVDValue').textContent = trimNum(VD, 2);
      document.getElementById('zinBadgeValue').textContent = trimNum(V.rg / 1e6, 2);
      document.getElementById('zoutBadgeValue').textContent = trimNum(V.rd / 1000, 2);
    }

    function setMode(mode) {
      quizMode = mode;
      V = (mode === 'randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
      recompute();
      refreshLabels();
      ['example1', 'example2', 'example3', 'randomise'].forEach(m => {
        const b = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (b) b.classList.toggle('active', m === mode);
      });
      resetQuiz();
    }

        options: () => shuffle([

          { label: `<b class="colour-gain">Av(loaded)</b> = <b class="colour-jfet">Gm</b> × <b class="colour-resistor">R<sub>D</sub></b> = ${fmtGain(AvU)}`, type: 'wrong' },
          { label: `<b class="colour-gain">Av(loaded)</b> = <b class="colour-jfet">Gm</b> × (<b class="colour-resistor">R<sub>D</sub></b>+<b class="colour-resistor">R<sub>L</sub></b>) ≈ ${fmtGain(V.gm * (V.rd + V.rl))}`, type: 'wrong' },
          { label: `<b class="colour-gain">Av(loaded)</b> = <b class="colour-gain">Av(unloaded)</b> × ${frac('R<sub>D</sub>+R<sub>L</sub>', 'R<sub>L</sub>')} ≈ ${fmtGain(AvU * (V.rd + V.rl) / V.rl)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">Av(loaded)</b> ≈ ${fmtGain(AvL)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-resistor">R<sub>D</sub></b>∥<b class="colour-resistor">R<sub>L</sub></b> = ${frac(`${fmtR(V.rd)} × ${fmtR(V.rl)}`, `${fmtR(V.rd)} + ${fmtR(V.rl)}`)} ≈ ${fmtR(RDRL)}</div>
    <div class="working-formula-row"><b class="colour-gain">Av(loaded)</b> = <b class="colour-jfet">Gm</b> × (<b class="colour-resistor">R<sub>D</sub></b>∥<b class="colour-resistor">R<sub>L</sub></b>) = ${fmtGm(V.gm)} × ${fmtR(RDRL)}</div>
    <div class="working-total"><b class="colour-gain">Av(loaded)</b> ≈ ${fmtGain(AvL)} — lower than the unloaded gain (${fmtGain(AvU)}), since the load resistor always pulls the effective drain-side resistance down. (Equivalently: Av(loaded) = Av(unloaded) × <b class="colour-resistor">R<sub>L</sub></b>/(<b class="colour-resistor">R<sub>L</sub></b>+<b class="colour-gain">R<sub>out</sub></b>).)</div>`,
      },
      { // l) Rin
        circuitId: 'jfet-self-bias-loaded-ac', circuitLabel: 'Common Source (self-bias, RS bypassed, loaded)',
        text: () => 'Calculate the amplifier\'s <b style="color:var(--colour-ui-primary)">input resistance</b> <b class="colour-gain">R<sub>IN</sub></b>.',
        hint: () => 'The gate draws essentially zero current — so from the source\'s point of view, the ONLY path to ground is whatever resistor is actually wired there.',
        options: () => shuffle([
          { label: `<b class="colour-gain">R<sub>IN</sub></b> = <b class="colour-resistor">R<sub>G</sub></b> = ${fmtR(V.rg)}`, type: 'correct' },
          { label: `<b class="colour-gain">R<sub>IN</sub></b> = <b class="colour-jfet">Gm</b> × <b class="colour-resistor">R<sub>G</sub></b> ≈ ${fmtR(V.gm * V.rg)}`, type: 'wrong' },
          { label: `<b class="colour-gain">R<sub>IN</sub></b> = ${frac('1', '<b class="colour-resistor">R<sub>G</sub></b>')}`, type: 'wrong' },
          { label: `<b class="colour-gain">R<sub>IN</sub></b> ≈ ${frac('1', '<b class="colour-jfet">Gm</b>')} = ${fmtR(1 / V.gm)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">R<sub>IN</sub></b> = <b class="colour-resistor">R<sub>G</sub></b> = ${fmtR(V.rg)}`,
        working: () => `
    <div class="working-line">The gate junction is reverse biased and draws no current, so <b class="colour-resistor">R<sub>G</sub></b> is the only thing loading the source — nothing about Gm, <b class="colour-resistor">R<sub>S</sub></b> or the transistor enters this at all.</div>
    <div class="working-formula-row"><b class="colour-gain">R<sub>IN</sub></b> = <b class="colour-resistor">R<sub>G</sub></b> = ${fmtR(V.rg)}</div>
    <div class="working-total">This is exactly why JFET amplifier stages are prized for very high input impedance.</div>`,
      },
      { // m) Rout
        circuitId: 'jfet-self-bias-loaded-ac', circuitLabel: 'Common Source (self-bias, RS bypassed, loaded)',
        text: () => 'Calculate the amplifier\'s <b style="color:var(--colour-ui-primary)">output resistance</b> <b class="colour-gain">R<sub>OUT</sub></b>.',
        hint: () => 'Zero the source, then look back into the drain node. The transistor\'s own internal drain resistance is assumed very high, so it\'s ignored.',
        options: () => shuffle([
          { label: `<b class="colour-gain">R<sub>OUT</sub></b> ≈ <b class="colour-resistor">R<sub>D</sub></b> = ${fmtR(V.rd)}`, type: 'correct' },
          { label: `<b class="colour-gain">R<sub>OUT</sub></b> ≈ <b class="colour-resistor">R<sub>S</sub></b> = ${fmtR(V.rs)}`, type: 'wrong' },
          { label: `<b class="colour-gain">R<sub>OUT</sub></b> ≈ <b class="colour-gain">R<sub>IN</sub></b> = ${fmtR(V.rg)}`, type: 'wrong' },
          { label: `<b class="colour-gain">R<sub>OUT</sub></b> ≈ <b class="colour-resistor">R<sub>D</sub></b>∥<b class="colour-resistor">R<sub>L</sub></b> ≈ ${fmtR(RDRL)}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">R<sub>OUT</sub></b> ≈ <b class="colour-resistor">R<sub>D</sub></b> = ${fmtR(V.rd)}`,
        working: () => `<div class="working-line">With the source zeroed, the only thing directly wired to the drain node (besides the transistor's very-high internal drain resistance, ignored here) is <b class="colour-resistor">R<sub>D</sub></b> itself, running up to the AC-grounded <b class="colour-supply">V<sub>DD</sub></b> rail.</div>
    <div class="working-total"><b class="colour-gain">R<sub>OUT</sub></b> ≈ <b class="colour-resistor">R<sub>D</sub></b> = ${fmtR(V.rd)}</div>`,
      },
      { // n) unloaded output signal
        circuitId: 'jfet-self-bias-loaded-ac', circuitLabel: 'Common Source (self-bias, RS bypassed, loaded)',
        text: () => 'For a 100 mV (peak) input signal, calculate the <b style="color:var(--colour-ui-primary)">unloaded output signal voltage</b>.',
        hint: () => 'Vout = Vin × Av — use this circuit\'s own unloaded gain.',
        options: () => shuffle([
          { label: `<b class="colour-gain">Vout</b> = <b class="colour-voltage">Vin</b> × <b class="colour-gain">Av(unloaded)</b> = 100 mV × ${fmtGain(AvU)} ≈ ${(VoutU * 1000).toFixed(0)} mV peak`, type: 'correct' },
          { label: `<b class="colour-gain">Vout</b> = <b class="colour-voltage">Vin</b> × <b class="colour-gain">Av(loaded)</b> ≈ ${(0.1 * AvL * 1000).toFixed(0)} mV peak`, type: 'wrong' },
          { label: `<b class="colour-gain">Vout</b> = ${frac('<b class="colour-voltage">Vin</b>', '<b class="colour-gain">Av(unloaded)</b>')} ≈ ${(0.1 / AvU * 1000).toFixed(2)} mV peak`, type: 'wrong' },
          { label: `<b class="colour-gain">Vout</b> = <b class="colour-voltage">Vin</b> + <b class="colour-gain">Av(unloaded)</b> ≈ ${(0.1 + AvU).toFixed(2)} V peak`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">Vout(unloaded)</b> ≈ ${(VoutU * 1000).toFixed(0)} mV peak`,
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">Vout</b> = <b class="colour-voltage">Vin</b> × <b class="colour-gain">Av(unloaded)</b> = 100 mV × ${fmtGain(AvU)}</div>
    <div class="working-total"><b class="colour-gain">Vout</b> ≈ ${(VoutU * 1000).toFixed(0)} mV peak (${VoutU.toFixed(3)} V)</div>`,
      },
      { // o) f1
        circuitId: 'jfet-self-bias-loaded-ac', circuitLabel: 'Common Source (self-bias, RS bypassed, loaded)',
        text: () => 'Calculate the lower cutoff frequency <b class="colour-gain">f<sub>1</sub></b> due to <b class="colour-cap">C<sub>1</sub></b> and <b class="colour-gain">R<sub>IN</sub></b>.',
        hint: () => '<b class="colour-gain">f<sub>1</sub></b> = 1/(2π×<b class="colour-gain">R<sub>IN</sub></b>×<b class="colour-cap">C<sub>1</sub></b>) — <b class="colour-gain">R<sub>IN</sub></b> here is just <b class="colour-resistor">R<sub>G</sub></b>, since that\'s the amplifier\'s own input resistance.',
        options: () => shuffle([
          { label: `<b class="colour-gain">f<sub>1</sub></b> = ${frac('1', `2π×<b class="colour-gain">R<sub>IN</sub></b>×<b class="colour-cap">C<sub>1</sub></b>`)} = ${frac('1', `2π×${fmtR(V.rg)}×10 nF`)} ≈ ${fmtHz(f1)}`, type: 'correct' },
          { label: `<b class="colour-gain">f<sub>1</sub></b> = ${frac('1', `<b class="colour-gain">R<sub>IN</sub></b>×<b class="colour-cap">C<sub>1</sub></b>`)} ≈ ${fmtHz(f1 * 2 * Math.PI)}`, type: 'wrong' },
          { label: `<b class="colour-gain">f<sub>1</sub></b> = 2π×<b class="colour-gain">R<sub>IN</sub></b>×<b class="colour-cap">C<sub>1</sub></b> ≈ ${(1 / f1).toExponential(3)} Hz`, type: 'wrong' },
          { label: `<b class="colour-gain">f<sub>1</sub></b> = ${frac('1', '2π×<b class="colour-cap">C<sub>1</sub></b>')} ≈ ${fmtHz(1 / (2 * Math.PI * C1_FIXED))}`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">f<sub>1</sub></b> ≈ ${fmtHz(f1)}`,
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">f<sub>1</sub></b> = ${frac('1', `2π × <b class="colour-gain">R<sub>IN</sub></b> × <b class="colour-cap">C<sub>1</sub></b>`)} = ${frac('1', `2π × ${fmtR(V.rg)} × 10 nF`)}</div>
    <div class="working-total"><b class="colour-gain">f<sub>1</sub></b> ≈ ${fmtHz(f1)} — a very LOW cutoff, a direct consequence of <b class="colour-gain">R<sub>IN</sub></b> being so large (<b class="colour-resistor">R<sub>G</sub></b> alone) on a JFET stage.</div>`,
      },
    ];

    /* DC-chain meters — same "reveal once answered, stays revealed"
       convention as jfet_self_bias.html's own VG/VS/IDS/VD progressive
       reveal. VG=Q5(idx4=e), VS=Q6(idx5=f), IDS=Q7(idx6=g), VD=Q8(idx7=h). */
    function updateDcReveal() {
      document.getElementById('meterVG').setAttribute('display', Q[4].ans ? 'inline' : 'none');
      document.getElementById('meterVS').setAttribute('display', Q[5].ans ? 'inline' : 'none');
      document.getElementById('idsInd').setAttribute('display', Q[6].ans ? 'inline' : 'none');
      document.getElementById('meterVD').setAttribute('display', Q[7].ans ? 'inline' : 'none');
    }
    /* Zin=Q12(idx11=l), Zout=Q13(idx12=m). */
    function updateZReveal() {
      document.getElementById('zinBadgeWs3').setAttribute('display', Q[11].ans ? 'inline' : 'none');
      document.getElementById('zoutBadgeWs3').setAttribute('display', Q[12].ans ? 'inline' : 'none');
    }
    RENDER_EXTRA = () => { updateDcReveal(); updateZReveal(); };

    initQuizNav();
    setMode('example1');
    initQuizFromURL();
  </script>
