<!--
  TEMPLATE FILE — read before cloning for a new weekly quiz.

  This file uses a data-driven quiz engine: a single `QUESTIONS` array (in the
  <script>, search "QUESTIONS —") drives one generic HTML panel and a generic
  set of engine functions (renderQuestion, checkAnswer, nextQuestion, etc).
  There is deliberately NO per-question HTML or per-question JS function.

  When cloning this file for a new quiz — even one that starts with just ONE
  question — KEEP THIS STRUCTURE. Do not revert to a hardcoded per-question
  panel just because there's only one entry.

  Built on the shared cert_iii/assets/quiz-engine.js engine from the start
  (project convention for all new quizzes). This is the JFET counterpart to
  UEEEC0066/bjt/basics/bjt_knowledge_basics.html — Q1 deliberately mirrors
  that file's own Q1 (leftPanel:'shapeGrid', kind:'multi', "click every
  valid symbol"), against the class objective "Draw and identify the
  schematic symbols for N-channel and P-channel JFETs."

  The 8 shapeIds used below (jfet-n-circle, jfet-p-circle, jfet-n-nocircle,
  jfet-p-nocircle, jfet-error-wronglead-in, jfet-error-wronglead-out,
  jfet-error-double-in, jfet-error-double-out) are copied from the master
  reference ../../../assets/shapes/jfet-symbols.svg — edit shapes there
  first, then re-copy into this <defs> block (cross-file SVG <use>/fetch()
  is blocked under file://, same reasoning as every other master-shape file
  in this project). See that master file's own header comment for why
  there's no "flipped" variant here, unlike the BJT set: the JFET arrow
  lives on the gate lead, which a drain/source top-bottom swap never
  touches, so a "flipped" JFET shape would be pixel-identical to the
  unflipped one.

  Being built one question at a time, same as the BJT fault-finding quiz —
  do not batch-draft further questions ahead of the user's own direction.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../assets/theme-init.js"></script>
  <script src="../../../assets/quiz-engine.js"></script>
  <title>JFET Knowledge Quiz 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../assets/quiz-common.css">
  <script src="../../../assets/breadcrumb.js" defer></script>
  <style>
    /* Q2 (kind:'fill') — click-a-name-then-click-a-terminal labelling,
       ported from UEEEC0069/exercises/digital_circuit_derivation_ab.html
       (the only other file using kind:'fill' so far). That file's own
       version of these rules also covers a "circuit vs pool" pointer arrow
       and a multi-question persistent diagram — neither needed here, since
       this quiz's diagram only ever shows one fill question at a time in
       the normal two-column circuit-col/questions-col layout, so only the
       pool box + terminal-slot-box styling is copied over. */
    .circuit-panel { cursor: default; }
    .fill-pool-wrap { margin-top: .8rem; }
    .fill-pool-row { display: flex; align-items: center; gap: .5rem; }
    .fill-pool-arrow { font-size: 1rem; color: var(--colour-ui-primary); opacity: 0; transition: opacity .15s; }
    .fill-pool-row.needs-pick .fill-pool-arrow { opacity: 1; animation: fillArrowBounce .8s ease-in-out infinite; }
    @keyframes fillArrowBounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    .fill-pool {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .5rem;
      padding: .8rem;
      border: 2px dashed var(--colour-border);
      border-radius: var(--radius-lg);
      background: rgba(var(--colour-label-rgb), .05);
      min-height: 3rem;
      transition: border-color .15s, background .15s;
    }
    .fill-pool.needs-pick {
      border-color: var(--colour-ui-primary);
      border-style: solid;
      background: rgba(var(--colour-ui-primary-rgb), .06);
      animation: matchPoolPulse 1.1s ease-in-out infinite;
    }
    .fill-pool .match-chip { min-width: 84px; text-align: center; }
    /* Opaque (not translucent) fill — these boxes sit on top of the
       terminal's leader line, and a see-through fill would let the line
       visibly cross through the label text sitting on top of it. */
    .circuit-slot-box { fill: var(--colour-panel); stroke: var(--colour-ui-primary); stroke-width: 1.5px; stroke-dasharray: 4,3; cursor: pointer; }
    .circuit-slot-box.filled { stroke-dasharray: none; }
    .circuit-slot-box.correct { stroke: var(--colour-ui-correct); }
    .circuit-slot-box.wrong { stroke: #ff3d66; }
    .circuit-slot-box.correct, .circuit-slot-box.wrong { cursor: default; }
    .jfet-slot-html {
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-body); font-size: 15px; font-weight: 700;
      color: var(--colour-ui-primary); text-align: center; line-height: 1;
      pointer-events: none; width: 100%; height: 100%;
    }
    .jfet-slot-html.correct { color: var(--colour-ui-correct); }
    .jfet-slot-html.wrong { color: #ff3d66; }
  </style>
</head>

<body>
  <!-- Hidden defs: JFET schematic symbols used by Q1's shapeGrid — copied
       from ../../../assets/shapes/jfet-symbols.svg, edit there first. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>

      <rect id="jfet-channel" x="-10" y="-25" width="4" height="50" style="fill: var(--colour-jfet)" />
      <!-- jfet-base-frame's gate lead sits at y=10 — closer to the bottom
           lead than the top one. That's not arbitrary: a JFET symbol's
           gate position along the channel is what tells a technician
           which lead is source (always the one nearer the gate) — so
           jfet-base-frame's bottom-biased gate makes ITS bottom lead read
           as source. jfet-base-frame-gate-top mirrors the gate to y=-10
           (same offset, opposite side) so its TOP lead reads as source
           instead. Named for the GEOMETRY (which lead the gate sits
           near), not a channel type — gate position and N/P channel are
           independent, so this frame gets used both by an actual
           P-channel symbol needing source-on-top (jfet-p-circle, used by
           Q3 below) AND by some of Q1's error variants, purely for
           visual variety unrelated to channel type. -->
      <g id="jfet-base-frame">
        <use href="#jfet-channel" />
        <line x1="10" y1="-15" x2="10" y2="-50" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <line x1="-10" y1="-15" x2="10" y2="-15" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <line x1="10" y1="15" x2="10" y2="50" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <line x1="-10" y1="15" x2="10" y2="15" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <line x1="-50" y1="10" x2="-9" y2="10" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <circle cx="10" cy="-50" r="2.5" style="fill: var(--colour-jfet)" />
        <circle cx="10" cy="50" r="2.5" style="fill: var(--colour-jfet)" />
        <circle cx="-50" cy="10" r="2.5" style="fill: var(--colour-jfet)" />
      </g>
      <g id="jfet-base-frame-gate-top">
        <use href="#jfet-channel" />
        <line x1="10" y1="-15" x2="10" y2="-50" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <line x1="-10" y1="-15" x2="10" y2="-15" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <line x1="10" y1="15" x2="10" y2="50" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <line x1="-10" y1="15" x2="10" y2="15" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <line x1="-50" y1="-10" x2="-9" y2="-10" style="stroke: var(--colour-jfet)" stroke-width="2" />
        <circle cx="10" cy="-50" r="2.5" style="fill: var(--colour-jfet)" />
        <circle cx="10" cy="50" r="2.5" style="fill: var(--colour-jfet)" />
        <circle cx="-50" cy="-10" r="2.5" style="fill: var(--colour-jfet)" />
      </g>
      <circle id="jfet-circle" cx="0" cy="0" r="38" fill="none" stroke="var(--colour-jfet)" stroke-width="2" filter="url(#glow)" />

      <!-- 4 valid symbols: N-channel (gate arrow points IN, toward the
           channel) / P-channel (points OUT, away) × circle / no-circle.
           jfet-p-circle/jfet-p-nocircle use jfet-base-frame-gate-top
           (gate near the TOP lead) — arrow polygons are the N-channel
           ones with y negated to match. -->
      <g id="jfet-n-circle"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="-24,16 -24,4 -14,10" style="fill: var(--colour-jfet)" /></g>
      <g id="jfet-p-circle"><use href="#jfet-base-frame-gate-top" /><use href="#jfet-circle" /><polygon points="-24,-16 -24,-4 -34,-10" style="fill: var(--colour-jfet)" /></g>
      <g id="jfet-n-nocircle"><use href="#jfet-base-frame" /><polygon points="-24,16 -24,4 -14,10" style="fill: var(--colour-jfet)" /></g>
      <g id="jfet-p-nocircle"><use href="#jfet-base-frame-gate-top" /><polygon points="-22,-16 -22,-4 -32,-10" style="fill: var(--colour-jfet)" /></g>

      <!-- 4 error variants: arrow(s) on the drain/source leads instead of
           the gate lead. Split 2-and-2 between jfet-base-frame (gate near
           bottom) and jfet-base-frame-gate-top (gate near top), so gate
           position varies across Q1's whole 8-shape set instead of only
           ever matching N=bottom/P=top — that pairing was never an
           electrical rule, just how the two valid demo symbols above
           happened to be drawn. This makes sure students can't pattern-
           match "top = wrong"/"bottom = valid" off gate position alone;
           only the one-arrow-on-the-gate rule actually determines
           validity. -->
      <g id="jfet-error-wronglead-in"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="6,-30 14,-30 10,-22" style="fill: var(--colour-jfet)" /></g>
      <g id="jfet-error-wronglead-out"><use href="#jfet-base-frame-gate-top" /><use href="#jfet-circle" /><polygon points="6,-24 14,-24 10,-32" style="fill: var(--colour-jfet)" /></g>
      <g id="jfet-error-double-in"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="6,-30 14,-30 10,-22" style="fill: var(--colour-jfet)" /><polygon points="6,30 14,30 10,22" style="fill: var(--colour-jfet)" /></g>
      <g id="jfet-error-double-out"><use href="#jfet-base-frame-gate-top" /><use href="#jfet-circle" /><polygon points="6,-24 14,-24 10,-32" style="fill: var(--colour-jfet)" /><polygon points="6,24 14,24 10,32" style="fill: var(--colour-jfet)" /></g>
    </defs>
  </svg>

  <div class="crumb" id="crumb" data-current="Fundamentals"></div>
  <header>
    <h1>JFET Knowledge</h1>
    <p>Conceptual Questions · N-Channel &amp; P-Channel JFETs</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <!-- LEFT: shape grid (leftPanel:'shapeGrid') or static circuit
         (leftPanel:'circuit', default display:none — swapLeftPanel()
         shows/hides it per question). -->
    <div class="circuit-col">
      <div id="qShapeGridPanel" style="display:none">
        <div class="panel-label">Click the shapes to select your answer</div>
        <div class="shape-grid" id="shapeGridCells"></div>
      </div>

      <!-- Q2/Q3's terminal-labelling diagram (kind:'fill') — ONE shared,
           configurable circuit (not two hand-duplicated panels like
           before). The markup itself is fixed: Gate is always the left
           slot; "top"/"bottom" are always the same two screen positions.
           What varies per question is which shapeId is shown and which of
           Drain/Source occupies the top vs bottom slot — see each
           question's own `circuitConfig` field and applyJfetCircuitConfig()
           in the <script> below. A <foreignObject>-based click target (see
           this file's own <style> block header comment for why kind:'fill'
           needs page-local CSS/markup rather than shared quiz-common.css
           classes). -->
      <div class="circuit-panel" id="circuitPanelFill" style="display:none">
        <div class="panel-label">Click a name below, then click a terminal</div>
        <svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg">
          <use id="jfetTerminalUse" href="#jfet-n-circle" transform="translate(220,150)" />

          <!-- Top/bottom leader lines — fixed screen positions, independent
               of which terminal currently occupies top vs bottom. -->
          <line x1="230" y1="100" x2="230" y2="64" style="stroke: var(--colour-jfet)" stroke-width="1.5" stroke-dasharray="3,2" />
          <line x1="230" y1="200" x2="230" y2="236" style="stroke: var(--colour-jfet)" stroke-width="1.5" stroke-dasharray="3,2" />
          <!-- Gate leader line — NOT fixed. The gate wire's own exit point
               moves per circuitConfig.gateOffset (jfet-base-frame vs
               jfet-base-frame-gate-top put it at a different height — see
               that <defs> comment), so this line and slotBoxG below both have
               to follow it or they'd visually disconnect from the wire.
               y1/y2 and slotBoxG's own transform are both set in JS by
               applyJfetCircuitConfig(). -->
          <line id="gateLeaderLine" x1="170" y1="160" x2="130" y2="160" style="stroke: var(--colour-jfet)" stroke-width="1.5" stroke-dasharray="3,2" />

          <!-- Click handlers are attached in JS (see SLOT_COL below), not
               inline onclick — which "col" index each box represents
               changes per question's circuitConfig. -->
          <g id="slotBoxTop" class="circuit-slot-box" transform="translate(170,30)">
            <rect width="120" height="34" rx="4" />
            <foreignObject x="0" y="0" width="120" height="34">
              <div xmlns="http://www.w3.org/1999/xhtml" id="slotBoxTopText" class="jfet-slot-html"></div>
            </foreignObject>
          </g>
          <g id="slotBoxG" class="circuit-slot-box" transform="translate(10,143)">
            <rect width="120" height="34" rx="4" />
            <foreignObject x="0" y="0" width="120" height="34">
              <div xmlns="http://www.w3.org/1999/xhtml" id="slotBoxGText" class="jfet-slot-html"></div>
            </foreignObject>
          </g>
          <g id="slotBoxBottom" class="circuit-slot-box" transform="translate(170,236)">
            <rect width="120" height="34" rx="4" />
            <foreignObject x="0" y="0" width="120" height="34">
              <div xmlns="http://www.w3.org/1999/xhtml" id="slotBoxBottomText" class="jfet-slot-html"></div>
            </foreignObject>
          </g>
        </svg>
      </div>
    </div>

    <!-- RIGHT: question -->
    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <!-- Single reusable question panel — populated from QUESTIONS[cur] by renderQuestion() -->
        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>

          <!-- Fill-in pool — shown only for kind:'fill' questions (Q2),
               toggled via RENDER_EXTRA below. -->
          <div class="fill-pool-wrap" id="fillPoolWrap" style="display:none">
            <div class="fill-pool-row" id="fillPoolRow">
              <div class="fill-pool-arrow">▶</div>
              <div class="fill-pool" id="fillPool"></div>
            </div>
          </div>

          <div class="options" id="qOptions"></div>
          <div class="match-wrap" id="qMatch" style="display:none">
            <div class="match-pool-row" id="matchPoolRow">
              <div class="match-pool-arrow">▶</div>
              <div class="match-pool" id="matchPool"></div>
            </div>
            <div class="match-columns" id="matchColumns"></div>
          </div>
          <div class="bits-wrap" id="qBits" style="display:none">
            <table class="bits-table">
              <thead>
                <tr>
                  <th rowspan="2">Value</th>
                  <th>2<sup>3</sup></th>
                  <th>2<sup>2</sup></th>
                  <th>2<sup>1</sup></th>
                  <th>2<sup>0</sup></th>
                </tr>
                <tr>
                  <th>8</th>
                  <th>4</th>
                  <th>2</th>
                  <th>1</th>
                </tr>
              </thead>
              <tbody id="bitsBody"></tbody>
            </table>
          </div>
          <div class="bits-wrap" id="qTruth" style="display:none">
            <div class="truth-toggle" id="truthToggle" style="display:none"></div>
            <table class="bits-table">
              <thead>
                <tr>
                  <th id="truthInputHead" colspan="3">Inputs</th>
                  <th id="truthOutputHead">Output</th>
                </tr>
                <tr id="truthColLabels"></tr>
              </thead>
              <tbody id="truthBody"></tbody>
            </table>
          </div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <!-- Summary -->
        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — see quiz-engine.js's own header comment for the full field
    // reference. Add, remove, split or reorder questions by editing this
    // array only — nothing in the engine needs to change.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        // Mirrors bjt_knowledge_basics.html's own Q1 exactly: multi-select
        // shape-grid, valid symbols mixed with plausible-error variants.
        // JFET's rule is "exactly one arrow, on the GATE lead" (in = N-
        // channel, out = P-channel) instead of BJT's "on the emitter arm" —
        // see jfet-symbols.svg's header comment for why there's no
        // "flipped" set here (only 4 valid shapes, not 8).
        leftPanel: 'shapeGrid',
        kind: 'multi',
        // The shared SHAPE_VIEWBOX default ('-32 -36 96 76') is tuned for
        // bjt-symbols.svg's much smaller coordinate range — jfet-symbols.svg's
        // shapes span roughly ±50 units (longer drain/source/gate leads),
        // so they overflow/clip under the default. Same fix as
        // bjt_knowledge_amp_config.html's own oversized shapes: override per
        // question rather than touching the shared global.
        shapeViewBox: '-55 -55 110 110',
        text: () => `<b style="color:var(--colour-ui-primary)">Click</b> every shape below that is a <b class="colour-jfet">valid</b> JFET transistor symbol. There are <b style="color:var(--colour-ui-correct)">4 correct</b> shapes among the 8 shown.`,
        hint: () => 'A valid symbol has exactly one arrow, on the gate lead (the horizontal one) — never on the drain or source lead. The arrow points INTO the channel for N-channel, or OUT of the channel for P-channel. The circle is optional — it doesn\'t change which symbols are valid.',
        options: () => shuffle([
          { label: 'N-channel, circle',    type: 'correct', shapeId: 'jfet-n-circle' },
          { label: 'P-channel, circle',    type: 'correct', shapeId: 'jfet-p-circle' },
          { label: 'N-channel, no circle', type: 'correct', shapeId: 'jfet-n-nocircle' },
          { label: 'P-channel, no circle', type: 'correct', shapeId: 'jfet-p-nocircle' },
          { label: 'Arrow on drain/source lead, pointing in',  type: 'wrong', shapeId: 'jfet-error-wronglead-in' },
          { label: 'Arrow on drain/source lead, pointing out', type: 'wrong', shapeId: 'jfet-error-wronglead-out' },
          { label: 'Two arrows, both pointing in',  type: 'wrong', shapeId: 'jfet-error-double-in' },
          { label: 'Two arrows, both pointing out', type: 'wrong', shapeId: 'jfet-error-double-out' }
        ]),
        correctExplain: (st) => {
          const nums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(n => n).join(', ');
          return `Shapes <b>${nums}</b> are the valid JFET symbols`;
        },
        working: (st) => {
          const correctNums = st.opts.map((o, i) => o.type === 'correct' ? i + 1 : null).filter(Boolean).join(', ');
          const wrongNums = st.opts.map((o, i) => o.type === 'wrong' ? i + 1 : null).filter(Boolean).join(', ');
          return `
    <div class="working-step">Valid symbols — shapes ${correctNums}:</div>
    <div class="working-line">Each has exactly one arrow, on the <b style="color:var(--colour-ui-correct)">gate lead</b>. The arrow points <b style="color:var(--colour-ui-correct)">into</b> the channel for N-channel, or <b style="color:var(--colour-ui-correct)">out of</b> the channel for P-channel. The circle is a drawing style, not a rule — both circled and uncircled forms are valid.</div>
    <div class="working-line" style="margin-top:.4rem">Unlike a BJT, there's no separate "flipped" variant to watch for here — swapping drain and source top-to-bottom doesn't change the symbol at all, since neither lead carries an arrow.</div>
    <div class="working-step" style="margin-top:.6rem">Invalid symbols — shapes ${wrongNums}:</div>
    <div class="working-line">Each breaks the one-arrow-on-the-gate rule: two of them put the arrow on a <b style="color:var(--colour-ui-wrong)">drain/source lead</b> — an arrow never belongs there — and the other two put <b style="color:var(--colour-ui-wrong)">two arrows</b> on the symbol at once, when a real JFET only ever has one.</div>`;
        }
      },
      {
        // kind:'fill' — click a name, then click a terminal (see quiz-
        // engine.js's own header comment for the mechanic; ported from
        // digital_circuit_derivation_ab.html, the only other file using
        // it). Pool mixes the 3 real JFET terminal names (col:0/1/2, bound
        // to whichever DOM slot is currently at that position — see
        // jfetSlotIds()) with 3 BJT terminal names as distractors —
        // deliberately no `col` on those, so they can never register as
        // any slot's correct answer.
        //
        // circuitConfig drives the shared #circuitPanelFill diagram (see
        // applyJfetCircuitConfig() below): N-channel symbol, Drain on top.
        leftPanel: 'circuit',
        kind: 'fill',
        circuitConfig: { shapeId: 'jfet-n-circle', topKey: 'D', gateOffset: 10 },
        get slotIds() { return jfetSlotIds(this.circuitConfig); },
        text: () => `This is an <b style="color:var(--colour-ui-primary)">N-channel JFET</b>. <b style="color:var(--colour-ui-primary)">Click</b> a name below, then <b style="color:var(--colour-ui-primary)">click</b> the terminal it belongs to.`,
        hint: () => `A JFET only has 3 terminals. Three of the names below belong to a different transistor family entirely — they won't fit anywhere on this diagram.`,
        options: () => shuffle(jfetFillOptions()),
        correctExplain: jfetFillCorrectExplain,
        working: jfetFillWorking
      },
      {
        // Same kind:'fill' mechanic as Q2 — this time P-channel, with
        // Source on top and Drain on bottom (Gate stays left either way).
        // Purely a circuitConfig change; no new HTML or slot ids needed.
        leftPanel: 'circuit',
        kind: 'fill',
        circuitConfig: { shapeId: 'jfet-p-circle', topKey: 'S', gateOffset: -10 },
        get slotIds() { return jfetSlotIds(this.circuitConfig); },
        text: () => `This is a <b style="color:var(--colour-ui-primary)">P-channel JFET</b>. <b style="color:var(--colour-ui-primary)">Click</b> a name below, then <b style="color:var(--colour-ui-primary)">click</b> the terminal it belongs to.`,
        hint: () => `Same 3 terminals as the N-channel device — this time Source is on top and Drain is on the bottom. Three of the names below still belong to a different transistor family entirely — they won't fit anywhere on this diagram.`,
        options: () => shuffle(jfetFillOptions()),
        correctExplain: jfetFillCorrectExplain,
        working: jfetFillWorking
      },
      {
        // Objective: JFET vs BJT — the fundamental construction/control
        // differences (voltage- vs current-controlled, input impedance,
        // unipolar vs bipolar), as a bridge from "what does a JFET look
        // like" (Q1-Q3) to "why choose one over the other" — a contrast
        // later biasing/AC-parameter quizzes lean on repeatedly. Plain
        // text columns (no shapeId), same kind:'match' pattern as
        // digital_knowledge_logic_families.html's characteristic-matching
        // question. No circuit panel needed — leftPanel left unset,
        // defaults to 'none' (see quiz-engine.js's own panelMode logic).
        kind: 'match',
        columns: () => ['JFET', 'BJT'],
        text: () => `Each feature below describes either a <b class="colour-jfet">JFET</b> or a <b class="colour-bjt">BJT</b>. <b style="color:var(--colour-ui-primary)">Place</b> each one under the correct device.`,
        hint: () => `Think about what actually CONTROLS the output current in each device — a voltage, or a current? That single question answers half of these.`,
        options: () => shuffle([
          { label: 'Controlled by an input VOLTAGE (VGS) rather than an input current', col: 0 },
          { label: 'Controlled by an input CURRENT (IB) rather than an input voltage', col: 1 },
          { label: 'Extremely high input impedance — its control terminal draws almost no current', col: 0 },
          { label: 'Comparatively low input impedance — its control terminal must draw a real, non-zero current to operate', col: 1 },
          { label: 'Unipolar device — conducts using only ONE type of charge carrier (majority carriers)', col: 0 },
          { label: 'Bipolar device — conducts using BOTH electrons and holes as charge carriers', col: 1 },
        ]),
        correctExplain: (st) => {
          const wrongCount = st.opts.filter((o, i) => st.place[i] !== st.cor[i]).length;
          return wrongCount === 0 ? 'All 6 features correctly matched' : `${st.opts.length - wrongCount} of ${st.opts.length} features correctly matched`;
        },
        working: () => `
    <div class="working-line">A <b class="colour-jfet">JFET</b>'s gate is a reverse-biased PN junction — it draws essentially zero gate current, so the device is controlled purely by the gate-source <b>voltage</b> (V<sub>GS</sub>), and that same reverse-biased junction is why its input impedance is so high.</div>
    <div class="working-line">A <b class="colour-bjt">BJT</b>'s base-emitter junction is forward-biased in normal operation — it needs a real base <b>current</b> (I<sub>B</sub>) to turn the device on, which is also why its input impedance is comparatively low.</div>
    <div class="working-total">The unipolar/bipolar split follows the same logic: a <b class="colour-jfet">JFET</b>'s channel conducts with only majority carriers (electrons in N-channel, holes in P-channel) — hence "unipolar" — while a <b class="colour-bjt">BJT</b> relies on both electron AND hole flow to work, hence "bi-polar."</div>`
      }
    ];

    // ── Configurable JFET terminal-labelling circuit (Q2/Q3) ──
    // The diagram markup itself (leader lines, the 3 slot-box positions)
    // is fixed in the HTML — Gate is always the left slot; "top"/"bottom"
    // are always the same two screen positions. What varies per question
    // is purely data, via circuitConfig:
    //   shapeId    — which channel symbol to show
    //   topKey     — 'D' or 'S': whichever terminal sits in the top slot
    //                (the other one takes the bottom slot)
    //   gateOffset — how far off-centre the symbol's OWN gate wire sits
    //                (10 for jfet-n-circle/jfet-base-frame, -10 for
    //                jfet-p-circle/jfet-base-frame-gate-top — see that
    //                <defs> comment for why this isn't arbitrary: the gate's
    //                position is what marks which lead is source). The
    //                gate leader line and slotBoxG must follow this or
    //                they'd visually disconnect from the wire.
    const SLOT_COL = { slotBoxTop: 0, slotBoxG: 1, slotBoxBottom: 2 };
    ['slotBoxTop', 'slotBoxG', 'slotBoxBottom'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => slotClicked(SLOT_COL[id]));
    });
    // col 0 = Drain's slot id, col 2 = Source's slot id, wherever each
    // currently sits on screen (col 1 = Gate, always slotBoxG). Single
    // source of truth for both the click-routing (SLOT_COL, below) and
    // each question's own `slotIds` getter, so they can never drift out
    // of sync with each other.
    function jfetSlotIds(cfg) {
      return cfg.topKey === 'D' ? ['slotBoxTop', 'slotBoxG', 'slotBoxBottom'] : ['slotBoxBottom', 'slotBoxG', 'slotBoxTop'];
    }
    // Never rebuilds the slot boxes themselves — only their transform/
    // position and the <use> href/gate-leader geometry — since
    // RENDER_EXTRA (which calls this) runs AFTER renderFill() on every
    // render, including re-renders triggered by clicking within the SAME
    // question. Regenerating the boxes' own markup here would wipe out
    // whatever renderFill() just placed in them.
    function applyJfetCircuitConfig(cfg) {
      document.getElementById('jfetTerminalUse').setAttribute('href', '#' + cfg.shapeId);
      SLOT_COL.slotBoxTop = cfg.topKey === 'D' ? 0 : 2;
      SLOT_COL.slotBoxBottom = cfg.topKey === 'D' ? 2 : 0;
      // Gate wire's own exit point sits at (circle centre y) + gateOffset
      // — 150 is jfetTerminalUse's own translate(220,150). slotBoxG's
      // default transform (10,143) was tuned for gateOffset=10 (N), so
      // shift it by the same delta gateOffset moves by from that baseline.
      const gateY = 150 + cfg.gateOffset;
      const line = document.getElementById('gateLeaderLine');
      line.setAttribute('y1', gateY);
      line.setAttribute('y2', gateY);
      document.getElementById('slotBoxG').setAttribute('transform', `translate(10,${143 + (cfg.gateOffset - 10)})`);
    }

    // Shared by Q2 (N-channel) and Q3 (P-channel) — the terminal names, and
    // what counts as correct/mislabelled, don't depend on channel type.
    function jfetFillOptions() {
      return [
        { label: 'Drain',     poolHtml: 'Drain',     col: 0 },
        { label: 'Gate',      poolHtml: 'Gate',      col: 1 },
        { label: 'Source',    poolHtml: 'Source',    col: 2 },
        { label: 'Base',      poolHtml: 'Base' },
        { label: 'Emitter',   poolHtml: 'Emitter' },
        { label: 'Collector', poolHtml: 'Collector' }
      ];
    }
    function jfetFillCorrectExplain(st) {
      const wrongCount = st.slotPlaced.filter((p, slot) => p !== st.cor[slot]).length;
      return wrongCount === 0 ? 'All 3 terminals correctly labelled' : `${st.slotPlaced.length - wrongCount} of ${st.slotPlaced.length} terminals correctly labelled`;
    }
    function jfetFillWorking(st) {
      const mistakes = st.slotPlaced
        .map((p, slot) => p !== st.cor[slot] ? st.opts[p]?.label ?? '(left blank)' : null)
        .filter(Boolean);
      const mistakeLine = mistakes.length
        ? `<div class="working-step" style="margin-top:.6rem">Mislabelled:</div><div class="working-line">${mistakes.join(', ')}</div>`
        : '';
      return `
    <div class="working-step">A JFET's 3 terminals:</div>
    <div class="working-line"><b style="color:var(--colour-ui-correct)">Drain</b> and <b style="color:var(--colour-ui-correct)">Source</b> are the two ends of the channel current flows through. <b style="color:var(--colour-ui-correct)">Gate</b> is the control terminal — the voltage between gate and source is what controls how much current flows through the channel.</div>
    <div class="working-step" style="margin-top:.6rem">Why Base, Emitter and Collector don't belong:</div>
    <div class="working-line">Those are BJT terminal names, not JFET ones. A JFET is a completely different device — it's controlled by a <em>voltage</em> at the gate rather than a <em>current</em> into a base, and it doesn't have anything corresponding to a BJT's base-emitter junction.</div>
    ${mistakeLine}`;
    }

    RENDER_EXTRA = () => {
      document.getElementById('fillPoolWrap').style.display = isFill(QUESTIONS[cur]) ? '' : 'none';
      // Only one #circuitPanelFill div exists now, so quiz-engine.js's own
      // swapLeftPanel() already shows/hides it correctly (leftPanel:
      // 'circuit' on Q2/Q3, 'shapeGrid' on Q1) — no override needed here
      // any more. Just apply the current question's own circuitConfig.
      const cfg = QUESTIONS[cur].circuitConfig;
      if (cfg) applyJfetCircuitConfig(cfg);
    };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
</html>
