<!--
  EXPLORATORY TESTBED — internal JFET faults (gate/drain/source lead or
  junction failures INSIDE the transistor package itself), cloned from
  UEEEC0066/bjt/fault_finding/bjt_fault_interactive_internal.html — same
  generalised interactive-circuit engine (ALL_INTERACTIVE_KEYS /
  TARGET_GROUP_ID / wireComponentClicks / paintComponent /
  syncInteractiveVisuals / syncMeterValues), same click-the-circuit format,
  same "click every reading that would show an affected value" mechanic.
  The circuit and meters are jfet_self_bias.html's own self-bias circuit
  (RG/RD/RS, VDD, J1, Example 1: VDD=12V, RG=1MΩ, RD=820Ω, RS=1kΩ,
  VGS=-2.5V, no mode toggle here — this testbed only needs one fixed
  example) — see that file for the full calculation-quiz version this one
  borrows its component values from.

  Healthy baseline (recomputed here, not copied from a live V.* object —
  this file has no Example/Randomise mode toggle, just the one fixed set):
    V_G = 0 V (no gate current, no drop across R_G)
    V_S = V_G − V_GS = 0 − (−2.5) = 2.5 V
    I_DS = V_S / R_S = 2.5 / 1000 = 2.5 mA
    V_D = V_DD − I_DS×R_D = 12 − 2.05 = 9.95 V
    V_DG = V_D − V_G = 9.95 V
    V_DS = V_D − V_S = 7.45 V

  A JFET's fault physics genuinely differs from a BJT's, not just in the
  labels — see UEEEC0066/jfet/biasing_circuits/jfet_self_bias.html's own
  history for the reasoning, confirmed with the teacher before building:
    - A BJT has TWO separate current paths (base loop, collector loop),
      which is why base-open/emitter-open are DC-identical but
      collector-open is distinctly different. A JFET only has ONE series
      current path (VDD→RD→channel→RS→common), so DRAIN-open and
      SOURCE-open become JFET's own DC-identical twin pair instead —
      Q1/Q2 below.
    - Gate-open has no clean deterministic DC answer for a JFET (a
      floating gate is genuinely erratic in real life) — deliberately
      NOT covered here.
    - Gate-drain short can't be solved with this quiz's simplified model
      either — forcing VG=VD doesn't pin VGS to anything, and solving it
      for real needs the device's actual transconductance curve
      (IDSS/VP), which jfet_self_bias.html's whole "VGS is a given
      teaching value" simplification deliberately avoids. Also NOT
      covered.
    - Gate-source short IS solvable, with one flagged simplifying
      assumption: forcing VGS=0V means the JFET is fully on, and treating
      "fully on" as a near-zero-resistance channel (D≈S≈G) turns it into
      a plain VDD→RD→(RG∥RS) divider — see Q3's own comment.
    - Drain-source short is cleanly solvable with NO extra assumptions —
      shorting D to S removes the JFET from the circuit entirely (the
      channel becomes irrelevant), leaving a plain VDD→RD→RS divider —
      see Q4's own comment.
  Final fault set (4 questions, not 6 like the BJT original): drain-open,
  source-open, gate-source short, drain-source short.

  Symbol: jfet-n-shape-large (copied from assets/shapes/jfet-symbols.svg —
  edit there first), an exact 2x scale of jfet-n-shape, built specifically
  for this file so open/short fault markers have room to read clearly on
  individual leads — same rationale as bjt-npn-shape-large in the BJT
  original. Each lead (jfet-gate/jfet-drain/jfet-source) has its own id so
  syncLeadFaults() can recolour one independently; jfet-drain/jfet-source
  are small <g> wrappers (each lead is a jog + a vertical run, not one
  polyline like a BJT's diagonal arms) with the fault colour cascading to
  their bare child <line>s via ordinary SVG stroke inheritance.

  Check button starts enabled (not gated on a selection) and reveals every
  correct answer if clicked with nothing picked — same "stuck student"
  fix applied to jfet_self_bias.html/jfet_voltage_divider_bias.html, baked
  in here from the start rather than retrofitted later.
-->

      <div class="symptom-item">
        <div class="symptom-title">Symptom: VD, VS and IDS match the gate-source short's numbers exactly — but VG doesn't</div>
        <div class="symptom-body">Shorting drain to source removes the JFET from the equation entirely — the channel plays no role, so the circuit becomes a plain <span class="colour-resistor">R<sub>D</sub></span>/<span class="colour-resistor">R<sub>S</sub></span> divider, same as the gate-source short's own simplification. The two faults coincidentally produce the SAME V<sub>D</sub>/V<sub>S</sub>/I<sub>DS</sub> numbers — but here the gate is untouched (still 0 V via <span class="colour-resistor">R<sub>G</sub></span>), where the gate-source short pulled it up to 6.59 V too. <span class="colour-voltage">V<sub>G</sub></span>, <span class="colour-voltage">V<sub>GS</sub></span>, <span class="colour-voltage">V<sub>DG</sub></span> and <span class="colour-voltage">V<sub>DS</sub></span> are what actually distinguish the two faults.</div>
      </div>
    </div>
    <div class="working-section">Applying the formulas:</div>
    <div class="working-step">Shorted node voltage (plain divider, JFET no longer involved):</div>
    <div class="working-formula-row">V<sub>X</sub> = <span class="colour-supply">V<sub>DD</sub></span> × ${frac('<span class="colour-resistor">R<sub>S</sub></span>', '<span class="colour-resistor">R<sub>D</sub></span> + <span class="colour-resistor">R<sub>S</sub></span>')} = 12 V × ${frac('1 kΩ', '1.82 kΩ')}</div>
    <div class="working-total">V<sub>X</sub> = <span class="colour-result">6.59 V</span></div>
    <div class="working-line"><span class="colour-voltage">V<sub>D</sub></span> = <span class="colour-voltage">V<sub>S</sub></span> = <span class="colour-result">6.59 V</span></div>
    <div class="working-step">Current through the RD-RS series path:</div>
    <div class="working-formula-row"><span class="colour-current">I<sub>DS</sub></span> = ${frac('<span class="colour-supply">V<sub>DD</sub></span>', '<span class="colour-resistor">R<sub>D</sub></span> + <span class="colour-resistor">R<sub>S</sub></span>')} = ${frac('12 V', '1.82 kΩ')}</div>
    <div class="working-total"><span class="colour-current">I<sub>DS</sub></span> = <span class="colour-result">6.59 mA</span></div>
    <div class="working-step">Gate is untouched — the gate loop never involved the drain/source path:</div>
    <div class="working-line"><span class="colour-voltage">V<sub>G</sub></span> = <span class="colour-result">0.00 V</span></div>
    <div class="working-step">Gate-source, drain-gate, drain-source voltages:</div>
    <div class="working-line"><span class="colour-voltage">V<sub>GS</sub></span> = 0 − 6.59 = <span class="colour-result">−6.59 V</span> &nbsp;|&nbsp; <span class="colour-voltage">V<sub>DG</sub></span> = 6.59 − 0 = <span class="colour-result">6.59 V</span> &nbsp;|&nbsp; <span class="colour-voltage">V<sub>DS</sub></span> = 6.59 − 6.59 = <span class="colour-result">0.00 V</span> (forced exactly by the short)</div>
    <div class="working-line" style="margin-top:.6rem">A large negative <span class="colour-voltage">V<sub>GS</sub></span> like this is consistent with a real device already sitting well past pinch-off/cutoff — one way a dead drain-source short could plausibly happen in practice.</div>`
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // GENERIC ENGINE — same shape as bjt_fault_interactive_internal.html
    // ══════════════════════════════════════════════════════════════════════
    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function isMulti(data) { return data.kind === 'multi'; }
    function isAnswerCorrect(data, st) {
      if (!isMulti(data)) return st.sel === st.cor;
      const a = [...st.sel].sort((x, y) => x - y), b = [...st.cor].sort((x, y) => x - y);
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    function selectedLabel(data, st) {
      if (!isMulti(data)) return (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
      return st.sel.length ? [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]).join(', ') : '—';
    }

    let Q = [];
    let cur = 0;

    function buildProgressDots() {
      document.getElementById('progressDots').innerHTML =
        QUESTIONS.map((_, i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
    }
    function updateProgress() {
      QUESTIONS.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        d.className = 'progress-dot';
        if (i === cur) d.classList.add('active'); else if (Q[i].ans) d.classList.add('done');
      });
      document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    }

    function renderOptions() {
      const st = Q[cur], data = QUESTIONS[cur];
      const multi = isMulti(data);
      const c = document.getElementById('qOptions'); c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        if (st.ans) {
          btn.disabled = true;
          if (multi) {
            const selected = st.sel.includes(i);
            if (opt.type === 'correct') { btn.classList.add(selected ? 'correct' : 'missed'); if (selected) btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else { btn.classList.add(selected ? 'wrong' : 'dimmed'); if (selected) btn.innerHTML += `<span class="result-icon">✗</span>`; }
          } else {
            if (i === st.cor) { btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
            else if (i === st.sel) { btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
            else btn.classList.add('dimmed');
          }
        } else {
          if (multi ? st.sel.includes(i) : i === st.sel) btn.classList.add('selected');
          btn.addEventListener('click', () => selectOption(i));
        }
        c.appendChild(btn);
      });
    }

    function selectOption(i) {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) {
        const pos = st.sel.indexOf(i);
        if (pos >= 0) st.sel.splice(pos, 1); else st.sel.push(i);
      } else {
        st.sel = i;
      }
      renderQuestion();
    }

    // ── INTERACTIVE CIRCUIT ──
    const ALL_INTERACTIVE_KEYS = ['RG', 'RD', 'RS', 'VG', 'VS', 'VGS', 'VD', 'VDG', 'VDS', 'IDS'];
    const TARGET_GROUP_ID = {
      RG: 'comp-RG', RD: 'comp-RD', RS: 'comp-RS',
      VG: 'meterVG', VS: 'meterVS', VGS: 'meterVGS', VD: 'meterVD', VDG: 'meterVDG', VDS: 'meterVDS',
      IDS: 'ammeterIDSGroup',
    };

    function wireComponentClicks() {
      ALL_INTERACTIVE_KEYS.forEach(key => {
        const g = document.getElementById(TARGET_GROUP_ID[key]);
        if (!g) return;
        g.addEventListener('click', () => {
          const data = QUESTIONS[cur], st = Q[cur];
          if (!data.interactiveCircuit || st.ans) return;
          const idx = st.opts.findIndex(o => o.key === key);
          if (idx >= 0) selectOption(idx);
        });
      });
    }

    function paintComponent(key, idx, st, answered) {
      const hl = document.getElementById('hl-' + key), badge = document.getElementById('badge-' + key);
      if (!hl || !badge) return;
      const selected = st.sel.includes(idx);
      const isCorrect = st.opts[idx].type === 'correct';
      if (!answered) {
        hl.setAttribute('stroke', selected ? 'var(--colour-ui-primary)' : 'transparent');
        hl.setAttribute('fill', selected ? 'rgba(var(--colour-ui-primary-rgb),.1)' : 'none');
        badge.textContent = selected ? '✓' : '';
        badge.setAttribute('fill', 'var(--colour-ui-primary)');
      } else if (isCorrect) {
        hl.setAttribute('stroke', selected ? 'var(--colour-ui-correct)' : 'var(--colour-ui-restart)');
        hl.setAttribute('stroke-dasharray', selected ? 'none' : '4,3');
        hl.setAttribute('fill', selected ? 'rgba(var(--colour-ui-correct-rgb),.12)' : 'none');
        badge.textContent = selected ? '✓' : '?';
        badge.setAttribute('fill', selected ? 'var(--colour-ui-correct)' : 'var(--colour-ui-restart)');
      } else {
        hl.setAttribute('stroke', selected ? 'var(--colour-ui-wrong)' : 'transparent');
        hl.setAttribute('stroke-dasharray', 'none');
        hl.setAttribute('fill', selected ? 'rgba(var(--colour-ui-wrong-rgb),.12)' : 'none');
        badge.textContent = selected ? '✗' : '';
        badge.setAttribute('fill', 'var(--colour-ui-wrong)');
      }
      if (!answered || isCorrect) hl.removeAttribute('stroke-dasharray');
    }

    function syncInteractiveVisuals(data, st) {
      ALL_INTERACTIVE_KEYS.forEach(key => {
        const g = document.getElementById(TARGET_GROUP_ID[key]);
        const idx = (data.interactiveCircuit && st.opts) ? st.opts.findIndex(o => o.key === key) : -1;
        if (g) g.classList.toggle('comp-interactive', idx >= 0);
        if (idx >= 0) {
          paintComponent(key, idx, st, st.ans);
        } else {
          const hl = document.getElementById('hl-' + key), badge = document.getElementById('badge-' + key);
          if (hl) { hl.setAttribute('stroke', 'transparent'); hl.setAttribute('fill', 'none'); hl.removeAttribute('stroke-dasharray'); }
          if (badge) badge.textContent = '';
        }
      });
    }

    // ── METER VALUES ──
    const HEALTHY_METERS = {
      VG: { value: '0.00', unit: 'V' }, VS: { value: '2.50', unit: 'V' }, VGS: { value: '-2.50', unit: 'V' },
      VD: { value: '9.95', unit: 'V' }, VDG: { value: '9.95', unit: 'V' }, VDS: { value: '7.45', unit: 'V' },
      IDS: { value: '2.50', unit: 'mA' },
    };
    const METER_TEXT_ID = {
      VG: ['meterVGValue', 'meterVGUnit'], VS: ['meterVSValue', 'meterVSUnit'], VGS: ['meterVGSValue', 'meterVGSUnit'],
      VD: ['meterVDValue', 'meterVDUnit'], VDG: ['meterVDGValue', 'meterVDGUnit'], VDS: ['meterVDSValue', 'meterVDSUnit'],
      IDS: ['ammeterIDSValue', 'ammeterIDSUnit'],
    };
    function addGhost(groupId, wentUp, deltaStr) {
      const g = document.getElementById(groupId + 'Ghost'); if (!g) return;
      const clr = wentUp ? 'var(--colour-up)' : 'var(--colour-down)';
      document.getElementById(groupId + 'GhostText').setAttribute('fill', clr);
      document.getElementById(groupId + 'GhostArrow').textContent = wentUp ? '⬆' : '⬇';
      document.getElementById(groupId + 'GhostDelta').textContent = deltaStr;
      g.setAttribute('display', 'inline');
    }
    function removeGhost(groupId) {
      const g = document.getElementById(groupId + 'Ghost'); if (g) g.setAttribute('display', 'none');
    }
    function syncMeterValues(data, st) {
      const override = data.meterOverride ? data.meterOverride(st.ans) : null;
      Object.keys(METER_TEXT_ID).forEach(key => {
        const state = (override && override[key]) ? override[key] : HEALTHY_METERS[key];
        const [valId, unitId] = METER_TEXT_ID[key];
        const valEl = document.getElementById(valId), unitEl = document.getElementById(unitId);
        if (valEl) valEl.textContent = state.value;
        if (unitEl) unitEl.textContent = state.unit;
        if (state.up !== undefined) addGhost(TARGET_GROUP_ID[key], state.up, state.delta);
        else removeGhost(TARGET_GROUP_ID[key]);
      });
    }

    // ── INTERNAL JFET LEAD FAULTS ──
    const LEAD_HEALTHY_STROKE = 'var(--colour-jfet)';
    const LEAD_IDS = ['jfet-drain', 'jfet-source'];
    function syncLeadFaults(data) {
      const faulted = data.faultedLeads || [];
      LEAD_IDS.forEach(id => {
        const lead = document.getElementById(id);
        const mark = document.getElementById('fault-x-' + id);
        const isFaulted = faulted.includes(id);
        if (lead) lead.style.stroke = isFaulted ? 'var(--colour-ui-wrong)' : LEAD_HEALTHY_STROKE;
        if (mark) mark.style.display = isFaulted ? 'inline' : 'none';
      });
    }

    // ── INTERNAL SHORT MARKERS ──
    const SHORT_PATH_ID = { GS: 'short-GS', DS: 'short-DS' };
    function syncInternalShort(data) {
      Object.keys(SHORT_PATH_ID).forEach(key => {
        const el = document.getElementById(SHORT_PATH_ID[key]);
        if (el) el.style.display = (data.shortedPair === key) ? 'inline' : 'none';
      });
    }

    function showCircuitRef(id, label, viewBox) {
      document.getElementById('circuitRefLabel').textContent = label || 'Reference Circuit';
      document.getElementById('circuitRefSvg').setAttribute('viewBox', viewBox || DEFAULT_VIEWBOX);
      if (xyOn) buildXYRuler();
    }

    let xyOn = false;
    function buildXYRuler() {
      const g = document.getElementById('xyRuler');
      if (!g) return;
      const vb = document.getElementById('circuitRefSvg').viewBox.baseVal;
      const offX = vb.x, offY = vb.y, W = vb.width, H = vb.height;
      const hy = offY + H - 10, vx = offX + 10, col = '#ff00ff';
      let svg = `<line x1="${offX}" y1="${hy}" x2="${offX + W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let x = 0; x <= W; x += 10) {
        const gx = offX + x, major = (Math.round(gx) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${gx}" y1="${hy - len}" x2="${gx}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${gx}" y="${hy - 13}" fill="${col}" font-size="8" text-anchor="middle">${Math.round(gx)}</text>`;
      }
      svg += `<line x1="${vx}" y1="${offY}" x2="${vx}" y2="${offY + H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
      for (let y = 0; y <= H; y += 10) {
        const gy = offY + y, major = (Math.round(gy) % 50 === 0), len = major ? 10 : 5;
        svg += `<line x1="${vx}" y1="${gy}" x2="${vx + len}" y2="${gy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
        if (major) svg += `<text x="${vx + 13}" y="${gy + 3}" fill="${col}" font-size="8" text-anchor="start">${Math.round(gy)}</text>`;
      }
      g.innerHTML = svg;
    }
    function setXY(on) {
      xyOn = on;
      const g = document.getElementById('xyRuler');
      if (!g) return;
      if (on) buildXYRuler();
      g.setAttribute('display', on ? 'inline' : 'none');
    }
    window.setXY = setXY;

    function renderQuestion() {
      const data = QUESTIONS[cur], st = Q[cur];
      const multi = isMulti(data);

      document.getElementById('qNum').textContent = 'Q' + (cur + 1);
      document.getElementById('qText').innerHTML = data.text();
      document.getElementById('qHint').innerHTML = data.hint();

      document.getElementById('qOptions').style.display = data.interactiveCircuit ? 'none' : '';
      if (!data.interactiveCircuit) renderOptions();
      syncInteractiveVisuals(data, st);
      syncMeterValues(data, st);
      syncLeadFaults(data);
      syncInternalShort(data);

      const selList = document.getElementById('qSelectedList');
      if (multi) {
        selList.style.display = '';
        const selectedNames = data.interactiveCircuit
          ? [...st.sel].sort((a, b) => a - b).map(i => st.opts[i].key)
          : [...st.sel].sort((a, b) => a - b).map(i => LETTERS[i]);
        selList.textContent = st.sel.length
          ? `Selected: ${selectedNames.join(', ')}`
          : (data.interactiveCircuit ? 'Click the meters on the circuit to select your answer (look for ?).' : 'Click the options above to select your answer.');
      } else {
        selList.style.display = 'none';
      }

      const banner = document.getElementById('qBanner');
      if (st.ans) {
        const ok = isAnswerCorrect(data, st);
        banner.className = 'result-banner ' + (ok ? 'correct' : 'wrong');
        document.getElementById('qIcon').textContent = ok ? '✓' : '✗';
        document.getElementById('qBannerText').innerHTML = ok ? `Correct! ${data.correctExplain(st)}` : `The correct answer is ${data.correctExplain(st)}`;
      } else {
        banner.className = 'result-banner';
      }

      const working = document.getElementById('qWorking');
      working.className = 'working-box' + (st.ans ? ' visible' : '');
      document.getElementById('qWorkingContent').innerHTML = st.ans ? data.working(st) : '';

      document.getElementById('qBack').style.display = cur > 0 ? 'inline-block' : 'none';
      const check = document.getElementById('qCheck');
      check.style.display = st.ans ? 'none' : 'inline-block';
      // Check is never blocked on a selection — a stuck student can click
      // it cold and it substitutes the correct answer (see checkAnswer()),
      // same fix applied to jfet_self_bias.html/jfet_voltage_divider_bias.html.
      check.disabled = st.ans;
      const isLast = cur === QUESTIONS.length - 1;
      document.getElementById('qNext').style.display = (st.ans && !isLast) ? 'inline-block' : 'none';
      document.getElementById('qSummary').style.display = (st.ans && isLast) ? 'inline-block' : 'none';

      showCircuitRef('jfet-fault-circuit', data.circuitLabel);
      updateProgress();
    }

    function checkAnswer() {
      const st = Q[cur], data = QUESTIONS[cur];
      if (st.ans) return;
      if (isMulti(data)) { if (st.sel.length === 0) st.sel = [...st.cor]; }
      else if (st.sel === null) st.sel = st.cor;
      st.ans = true;
      renderQuestion();
      document.getElementById('qBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function scrollToQuestionTop() {
      document.getElementById('qPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function nextQuestion() { if (cur < QUESTIONS.length - 1) { cur++; renderQuestion(); scrollToQuestionTop(); } }

    function backQuestion() {
      if (cur <= 0) return;
      cur--;
      for (let i = cur; i < QUESTIONS.length; i++) {
        Q[i].ans = false;
        Q[i].sel = isMulti(QUESTIONS[i]) ? [] : null;
      }
      renderQuestion();
      scrollToQuestionTop();
    }

    function goToQuestion(n) {
      cur = Math.max(0, Math.min(QUESTIONS.length - 1, n - 1));
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
      scrollToQuestionTop();
    }

    function resetQuiz() {
      Q = QUESTIONS.map(data => {
        const opts = data.options();
        if (isMulti(data)) {
          const cor = opts.map((o, i) => o.type === 'correct' ? i : -1).filter(i => i >= 0);
          return { sel: [], ans: false, cor, opts };
        }
        return { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
      });
      cur = 0;
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById('qPanel').style.display = 'flex';
      renderQuestion();
    }

    function showSummary() {
      document.getElementById('qPanel').style.display = 'none';
      document.getElementById('summaryPanel').style.display = 'block';
      showCircuitRef('jfet-fault-circuit', 'Self-Bias N-Channel JFET Amplifier');
      const items = QUESTIONS.map((data, i) => {
        const st = Q[i];
        const ans = selectedLabel(data, st);
        const ok = isAnswerCorrect(data, st);
        const colour = ok ? 'var(--colour-ui-correct)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${data.text()}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${st.ans ? data.working(st) : ''}</div>
    </div>`;
      }).join('');
      document.getElementById('summaryContent').innerHTML = items;
      QUESTIONS.forEach((_, i) => { const d = document.getElementById('dot-' + i); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    buildProgressDots();
    wireComponentClicks();
    resetQuiz();

    function goBack(e) { e.preventDefault(); history.back(); }
    if (history.length > 1) {
      document.getElementById('menuLink').style.display = '';
    }

    function jump(n, answered) {
      if (n < 1 || n > QUESTIONS.length) { console.warn('jump: no question', n); return; }
      for (let i = 0; i < n - 1; i++) {
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      }
      goToQuestion(n);
      if (answered) {
        Q[cur].sel = Array.isArray(Q[cur].cor) ? [...Q[cur].cor] : Q[cur].cor;
        checkAnswer();
      }
    }
    window.jump = jump;

    function jumpToSummary() {
      QUESTIONS.forEach((_, i) => {
        if (Q[i].ans) return;
        Q[i].sel = Array.isArray(Q[i].cor) ? [...Q[i].cor] : Q[i].cor;
        Q[i].ans = true;
      });
      showSummary();
    }
    window.jumpToSummary = jumpToSummary;

    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) { if (p.get('q') === 's') jumpToSummary(); else jump(+p.get('q'), p.has('ans')); }
      if (p.has('xy')) setXY(+p.get('xy') === 1);
    }
  </script>
