<!--
  Knowledge quiz for JFET amplifier AC parameters — SELF-BIAS Common Source,
  RS unbypassed. The JFET counterpart to
  ../../bjt/ac_parameters/bjt_knowledge_ac_params_ce.html — same
  architecture, same "one worked stage, progressive-reveal diagram badges"
  approach, same shared quiz-engine.js — but the actual electrical content
  is genuinely different, not a search-and-replace of the BJT file:

    - re′ (BJT) has no JFET equivalent — a BJT's β is (approximately)
      constant regardless of bias point, so re′=26mV/IE is a one-step
      lookup. A JFET's transconductance gm is NOT constant — it depends on
      WHERE the Q-point sits between VGS=0 (gm=gm0, maximum) and VGS=VP
      (gm=0, pinched off): gm = gm0×(1 − VGS/VP). Q1 asks for gm at this
      stage's own Q-point, given gm0 (a datasheet parameter, shown on the
      diagram the same way β=200 was given directly in the BJT file) —
      this is a genuinely JFET-specific calculation, not a relabelled
      re′ question.
    - Zb (BJT) — the "β multiplies whatever's in the emitter leg" step —
      has NO JFET equivalent at all, because a JFET's gate draws
      (essentially) zero current. There's nothing to reflect. Q2 asks for
      Zin directly (= RG, full stop); Q3 is a dedicated conceptual
      question asking WHY no Zb-style step was needed, so this genuine
      simplification doesn't get glossed over as "the JFET version was
      just easier" without understanding why.
    - Zout ≈ RD (drain looks into a near-ideal current source in parallel
      with RD, same ro-ignored idealisation the BJT file uses for RC) —
      the one part of this quiz that IS a direct structural parallel to
      the BJT version, since the physics (transistor's own output
      resistance assumed very high, only the external resistor matters)
      really is the same idea in both device families.
    - Av = −gm×RD / (1 + gm×RS) — the self-bias equivalent of the BJT's
      Av ≈ −RC/(RE+re′), with RS unbypassed providing the same source
      (emitter) degeneration effect. Deliberately left un-simplified (RS
      not dropped, no bypass cap) for the same reason the BJT file keeps
      RE unbypassed: it's the genuinely general formula, and a "bypassed"
      sibling file can drop the (1+gm×RS) term explicitly later, the same
      way bjt_knowledge_ac_params_ce_bypassed.html did for RE.

  ONE worked N-channel JFET self-bias stage is used throughout: 2N5459,
  IDSS = 8 mA, VP = −4 V, gm0 = 2×IDSS/|VP| = 4 mA/V (all given, shown on
  the diagram). RG = 1 MΩ, RS = 1 kΩ (unbypassed), RD = 2.2 kΩ, VDD = 15 V.
  The DC Q-point (VGS = −2 V, IDS = 2 mA) is GIVEN on the diagram via an
  ammeter-style IDS badge (same convention as the BJT file's IE badge) —
  deliberately the exact same Q-point numbers already used in
  ../../reviews/jfet_review_quiz.html's own self-bias IDS calculation
  question, so a student who did that one recognises these values. This
  file only covers AC parameters, not the DC bias derivation (see
  ../biasing_circuits/jfet_self_bias.html for that).

  Circuit diagram (jfet-self-bias-ac) uses the same large-scale WIRES/NODES
  layout convention as the BJT file, simplified for self-bias's own
  topology: RG runs from the gate node straight to COMMON (not to VDD —
  unlike a BJT's R1/R2 divider, self-bias has nothing at all connecting
  the gate side to the supply rail), so there's no "top rail spanning both
  columns" the way the BJT file needed one for R1 and RC to share VDD —
  only RD taps VDD here. That's a real, visible topology difference this
  diagram is drawn to show, not hidden by forcing the BJT layout to fit.

  JFET symbol shape (jfet-n-shape) copied from
  ../biasing_circuits/jfet_self_bias.html's own defs (itself copied from
  assets/shapes/jfet-symbols.svg) for visual consistency with that file's
  DC-analysis diagram of the same physical circuit.

  Built directly on the shared engine, assets/quiz-engine.js — same
  "one generic QUESTIONS[] array, no per-question HTML" structure as
  every other file in this project. See bjt_knowledge_ac_params_ce.html's
  own header comment for the RENDER_EXTRA / progressive-reveal-badge
  pattern this file reuses (updateGmReveal/updateZReveal).
-->

        <line x1="200" y1="440" x2="200" y2="540" style="stroke: var(--colour-series)" stroke-width="2" /><!-- RG down to Common rail -->

          <div class="options" id="qOptions"></div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>
            <button class="btn btn-check" id="qCheck" onclick="checkAnswer()" disabled>Check</button>
            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-summary" id="qSummary" onclick="showSummary()" style="display:none">See Summary →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">
            <div class="summary-title">Quiz Summary</div>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

    <!-- Zoom modal -->
    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalTitle">Reference Circuit</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="-10 -10 660 570" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

  </div>

  <script>
    const DEFAULT_VIEWBOX = '-10 -10 660 570';

    CIRCUIT_SVG_ID = 'circuitRefSvg';
    DEFAULT_CIRCUIT_VIEWBOX = DEFAULT_VIEWBOX;
    // No CIRCUIT_REF_EXTRA needed — the IDS badges are always visible now
    // (see their own comments above), not gated behind a circuit swap.
    SUMMARY_CIRCUIT_REF = { id: 'jfet-self-bias-ac', label: 'Common Source (self-bias, RS unbypassed)', viewBox: DEFAULT_VIEWBOX };

    // ══════════════════════════════════════════════════════════════════════
    // QUESTIONS — gm, Zin, why-no-Zb, Zout, Av for a self-bias JFET CS stage.
    // ══════════════════════════════════════════════════════════════════════

    const QUESTIONS = [
      {
        circuitId: 'jfet-self-bias-ac',
        circuitLabel: 'Common Source (self-bias, RS unbypassed)',
        text: () => `What is <b class="colour-jfet">g<sub>m</sub></b> at this stage's own Q-point?`,
        hint: () => `Unlike a BJT's β, a JFET's gm isn't constant — it depends on where VGS sits between 0 and VP. gm = gm0 × (1 − VGS/VP), using the gm0, VGS and VP already given on the diagram.`,
        options: () => shuffle([
          { label: `<b class="colour-jfet">g<sub>m</sub></b> = g<sub>m0</sub> × (1 − ${frac('<b class="colour-voltage">V<sub>GS</sub></b>', '<b class="colour-voltage">V<sub>P</sub></b>')}) = 4 × (1 − ${frac('-2', '-4')}) = 4 × 0.5 = <b>2 mA/V</b>`, type: 'correct' },
          { label: `<b class="colour-jfet">g<sub>m</sub></b> = g<sub>m0</sub> × ${frac('<b class="colour-voltage">V<sub>GS</sub></b>', '<b class="colour-voltage">V<sub>P</sub></b>')} = 4 × ${frac('-2', '-4')} = 4 × 0.5 = <b>2 mA/V</b> (forgot the "1 −")`, type: 'wrong' },
          { label: `<b class="colour-jfet">g<sub>m</sub></b> = ${frac('g<sub>m0</sub>', '<b class="colour-current">I<sub>DSS</sub></b>')} = ${frac('4 mA/V', '8 mA')} = <b>0.5 V<sup>-1</sup></b>`, type: 'wrong' },
          { label: `<b class="colour-jfet">g<sub>m</sub></b> = g<sub>m0</sub> = <b>4 mA/V</b> (this is only true at VGS = 0)`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-jfet">g<sub>m</sub></b> = g<sub>m0</sub> × (1 − V<sub>GS</sub>/V<sub>P</sub>) ≈ <b>2 mA/V</b>`,
        working: () => `
    <div class="working-line">A JFET's transconductance falls off linearly from its maximum (g<sub>m0</sub>, at V<sub>GS</sub>=0) to zero (at V<sub>GS</sub>=V<sub>P</sub>, fully pinched off) — it is NOT a fixed device constant the way a BJT's β is treated.</div>
    <div class="working-formula-row"><b class="colour-jfet">g<sub>m</sub></b> = g<sub>m0</sub> × (1 − ${frac('<b class="colour-voltage">V<sub>GS</sub></b>', '<b class="colour-voltage">V<sub>P</sub></b>')}) = 4 mA/V × (1 − ${frac('-2 V', '-4 V')})</div>
    <div class="working-total"><b class="colour-jfet">g<sub>m</sub></b> ≈ 2 mA/V — exactly half of g<sub>m0</sub>, because this Q-point sits exactly halfway between V<sub>GS</sub>=0 and pinch-off. Keep this value, every AC parameter from here on uses it.</div>`
      },
      {
        circuitId: 'jfet-self-bias-ac',
        circuitLabel: 'Common Source (self-bias, RS unbypassed)',
        text: () => `What is the <b style="color:var(--colour-ui-primary)">AC</b> input resistance <b class="colour-resistor">Z<sub>in</sub></b> seen by the signal source?`,
        hint: () => `The gate itself draws essentially zero current (that reverse-biased junction again) — so from the source's point of view, the ONLY path to ground is whatever resistor is actually wired there.`,
        options: () => shuffle([
          { label: `<b class="colour-gain">Zin</b> = <b class="colour-resistor">RG</b> = <b>1.0 MΩ</b>`, type: 'correct' },
          { label: `<b class="colour-gain">Zin</b> = g<sub>m</sub> × <b class="colour-resistor">RG</b> = 2 mA/V × 1 MΩ = <b>2,000 MΩ</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">Zin</b> = ${frac('1', '<b class="colour-resistor">RG</b>')} = ${frac('1', '1 MΩ')} = <b>1 µS</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">Zin</b> ≈ ${frac('1', 'g<sub>m</sub>')} = ${frac('1', '2 mA/V')} = <b>500 Ω</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-resistor">Z<sub>in</sub></b> = <b class="colour-resistor">R<sub>G</sub></b> = <b>1.0 MΩ</b>`,
        working: () => `
    <div class="working-line">Nothing about g<sub>m</sub>, RS or the transistor's own gain enters this at all — the gate junction is reverse biased and draws no current, so R<sub>G</sub> is the only thing loading the source.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>in</sub></b> = <b class="colour-resistor">R<sub>G</sub></b> = 1.0 MΩ</div>
    <div class="working-total">This is exactly why JFET (and MOSFET) amplifier stages are prized for very high input impedance — Z<sub>in</sub> can be pushed as high as R<sub>G</sub> is made, limited only by leakage and bias-stability concerns, not by any device-internal current-reflection limit.</div>`
      },
      {
        circuitId: 'jfet-self-bias-ac',
        circuitLabel: 'Common Source (self-bias, RS unbypassed)',
        text: () => `The BJT common-emitter version of this quiz needed a separate "<b class="colour-bjt">Z<sub>b</sub></b>" step (β × whatever's in the emitter leg) before it could find Z<sub>in</sub>. Why did THIS calculation skip that step entirely?`,
        hint: () => `Zb exists because a BJT's base current is a real, non-zero current that has to be supplied — think about what current actually flows into a JFET's gate.`,
        options: () => shuffle([
          { label: `A JFET's gate current is essentially zero, so there's no base-side current for anything in the source leg to "reflect" into — unlike a BJT, where every unit of base current supplies β times as much emitter current`, type: 'correct' },
          { label: `RS (1 kΩ) is simply too small a value for its effect to matter, the same way RE's contribution was small in the BJT version`, type: 'wrong' },
          { label: `Self-bias circuits don't have an emitter-equivalent resistor at all`, type: 'wrong' },
          { label: `gm is too small compared to β for the reflection effect to be worth calculating`, type: 'wrong' },
        ]),
        correctExplain: () => `A JFET's <b>gate current is essentially zero</b> — there's nothing for RS to reflect into`,
        working: () => `
    <div class="working-line">A BJT's base-emitter junction is forward biased — a real base current I<sub>B</sub> has to flow to turn the device on at all, and Kirchhoff's Current Law means every unit of that current supplies β times as much emitter current. That's precisely WHY anything sitting in the emitter leg (RE, re′) gets multiplied by β when reflected into the base circuit.</div>
    <div class="working-line" style="margin-top:.4rem">A JFET's gate-source junction is reverse biased instead — essentially zero gate current flows, regardless of what RS is doing in the source leg. With no base-side current to relate anything to, there is nothing to reflect, and no β-style multiplier to apply. Z<sub>in</sub> is just whatever resistor is physically wired from gate to ground.</div>
    <div class="working-total">This is the direct, mechanistic reason a JFET's input impedance can be so much higher than a BJT's — not just "JFETs happen to have high impedance," but a specific consequence of near-zero gate current removing an entire calculation step altogether.</div>`
      },
      {
        circuitId: 'jfet-self-bias-ac',
        circuitLabel: 'Common Source (self-bias, RS unbypassed)',
        text: () => `What is the approximate <b style="color:var(--colour-ui-primary)">AC</b> output resistance <b class="colour-resistor">Z<sub>out</sub></b>, looking back into the drain terminal?`,
        hint: () => `Zero the source, then look back into the drain node. The transistor's own internal drain resistance (rd) is assumed very high compared to RD in this approximation, so it's ignored — leaving only whatever is directly wired to that node.`,
        options: () => shuffle([
          { label: `<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RD</b>`, type: 'correct' },
          { label: `<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RS</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">Zout</b> ≈ <b class="colour-gain">Zin</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">Zout</b> ≈ <b class="colour-resistor">RD</b> ∥ <b class="colour-resistor">RS</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>D</sub></b>`,
        working: () => `
    <div class="working-line">With the source zeroed, the only thing directly wired to the drain node (besides the transistor's internal, very-high r<sub>d</sub> — ignored here) is <b class="colour-resistor">R<sub>D</sub></b> itself, running up to the AC-grounded <b class="colour-supply">V<sub>DD</sub></b> rail.</div>
    <div class="working-formula-row"><b class="colour-resistor">Z<sub>out</sub></b> ≈ <b class="colour-resistor">R<sub>D</sub></b> = 2.2 kΩ</div>
    <div class="working-total">Exactly the same reasoning as a BJT common-emitter stage's Z<sub>out</sub> ≈ R<sub>C</sub> — whichever device sits between drain/collector and the AC-grounded supply rail, its own output resistance is assumed high enough to ignore, leaving only the external resistor.</div>`
      },
      {
        circuitId: 'jfet-self-bias-ac',
        circuitLabel: 'Common Source (self-bias, RS unbypassed)',
        text: () => `What is the voltage gain <b class="colour-gain">|A<sub>v</sub>|</b> of this self-bias stage?`,
        hint: () => `|Av| = gm×RD / (1 + gm×RS) for a common-source stage with an unbypassed source resistor — the same "degeneration" shape as a BJT's RC/(RE+re′), just built from gm instead of 1/re′.`,
        options: () => shuffle([
          { label: `<b class="colour-gain">|Av|</b> = ${frac('g<sub>m</sub>×<b class="colour-resistor">RD</b>', '1 + g<sub>m</sub>×<b class="colour-resistor">RS</b>')} = ${frac('2×2.2', '1 + 2×1')} = ${frac('4.4', '3')} ≈ <b>1.47</b>`, type: 'correct' },
          { label: `<b class="colour-gain">|Av|</b> = g<sub>m</sub> × <b class="colour-resistor">RD</b> = 2 mA/V × 2.2 kΩ = <b>4.4</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> = ${frac('<b class="colour-resistor">RD</b>', 'g<sub>m</sub>×<b class="colour-resistor">RS</b>')} = ${frac('2.2', '2×1')} = <b>1.1</b>`, type: 'wrong' },
          { label: `<b class="colour-gain">|Av|</b> = ${frac('1 + g<sub>m</sub>×<b class="colour-resistor">RS</b>', 'g<sub>m</sub>×<b class="colour-resistor">RD</b>')} = ${frac('3', '4.4')} ≈ <b>0.68</b>`, type: 'wrong' },
        ]),
        correctExplain: () => `<b class="colour-gain">|A<sub>v</sub>|</b> = g<sub>m</sub>R<sub>D</sub> / (1 + g<sub>m</sub>R<sub>S</sub>) ≈ <b>1.47</b>`,
        working: () => `
    <div class="working-formula-row"><b class="colour-gain">|A<sub>v</sub>|</b> = ${frac('g<sub>m</sub> × <b class="colour-resistor">R<sub>D</sub></b>', '1 + g<sub>m</sub> × <b class="colour-resistor">R<sub>S</sub></b>')} = ${frac('2 mA/V × 2.2 kΩ', '1 + 2 mA/V × 1 kΩ')} = ${frac('4.4', '3')}</div>
    <div class="working-total"><b class="colour-gain">|A<sub>v</sub>|</b> ≈ 1.47 — notice this is quite a bit LOWER than the BJT common-emitter stage's gain (≈6.44) from a similar-sized load resistor. JFETs typically have much lower transconductance than BJTs at comparable bias currents, which is the direct reason JFET voltage-amplifier stages usually give up some gain in exchange for their far higher input impedance.</div>`
      },
    ];

    // ══════════════════════════════════════════════════════════════════════
    // QUIZ ENGINE — shared: assets/quiz-engine.js. Only this file's own
    // progressive-reveal badge functions remain inline below.
    // ══════════════════════════════════════════════════════════════════════

    /* gm reveal on the diagram itself, once Q1 has been answered. Persists
       regardless of which question is currently on screen. */
    function updateGmReveal() {
      document.getElementById('gmRevealJfet').setAttribute('display', Q[0].ans ? 'inline' : 'none');
    }

    /* Zin/Zout value badges — Zin=Q2(idx1), Zout=Q4(idx3) (Q3/idx2 is the
       conceptual "why no Zb" question, no badge of its own). */
    function updateZReveal() {
      document.getElementById('zinBadgeJfet').setAttribute('display', Q[1].ans ? 'inline' : 'none');
      document.getElementById('zoutBadgeJfet').setAttribute('display', Q[3].ans ? 'inline' : 'none');
    }

    RENDER_EXTRA = () => { updateGmReveal(); updateZReveal(); };

    initQuizNav();
    resetQuiz();
    initQuizFromURL();
  </script>
</body>
