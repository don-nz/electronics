<!--
  Knowledge quiz for JFET amplifier AC parameters — SELF-BIAS Common Drain
  (Source Follower). Sibling to jfet_self_bias_ac_params.html (Common
  Source) — same worked device, same self-bias network, same architecture
  and shared quiz-engine.js — but NOT a search-and-replace of that file.
  Reused where the physics genuinely doesn't change, rebuilt where it does:

    - gm at the Q-point (Q1) and Zin = RG (Q2) — IDENTICAL reasoning and
      IDENTICAL numbers to the Common Source file. Neither of these
      depends on where the output happens to be taken from: gm is a
      property of the device at this bias point, and Zin only cares about
      what's wired from gate to ground (RG, unchanged). Kept here, with
      the same values, so this file is self-contained and a student who's
      only done the CD quiz isn't missing a step — but see that CS file's
      own header comment for the full "why no Zb" reasoning behind Zin,
      not repeated here to avoid duplicating it verbatim.
    - NO RD at all — Q3 is a new conceptual question this file needed
      that the CS version didn't: why does a source follower drop the
      drain resistor entirely (drain tied straight to VDD)? Because the
      output is taken from the SOURCE, not the drain — the drain only
      has to sit at AC ground to complete the current path, it never
      needs to develop an output voltage swing of its own.
    - Zout = RS ∥ (1/gm), looking into the SOURCE — genuinely different
      physics from the CS file's Zout ≈ RD. This is the textbook
      source-follower result: the transistor's own 1/gm sits in parallel
      with RS, and since 1/gm is usually much smaller than RS, it's what
      actually dominates — this is WHY a source follower has such low
      output impedance, the mirror-image reason the CS file's Zin is so
      HIGH.
    - Av = gm×RS / (1 + gm×RS) — always < 1, never inverts. The
      source-follower gain formula, structurally the reciprocal shape of
      the CS file's Av = gm×RD/(1+gm×RS): same denominator, but RS moves
      into the numerator instead of RD, and gm×RS ≥ 0 in the denominator
      guarantees the whole thing can never reach or exceed 1. Genuinely
      new formula, not a relabelling.

  ONE worked N-channel JFET self-bias stage — SAME device and SAME Q-point
  as jfet_self_bias_ac_params.html: 2N5459, IDSS = 8 mA, VP = −4 V,
  gm0 = 4 mA/V, RG = 1 MΩ, RS = 1 kΩ, VDD = 15 V, VGS = −2 V, IDS = 2 mA
  (GIVEN, same ammeter/voltmeter-badge convention as the CS file). Using
  the exact same numbers as the CS sibling is deliberate — it isolates
  the topology change (no RD, output from source) as the ONLY thing
  that's different between the two files, rather than also changing the
  bias point and muddying what's actually being taught.

  Circuit diagram (jfet-self-bias-cd) is the CS file's own diagram with
  RD deleted (drain wired straight to VDD) and the output tap moved from
  the drain node down to the source node — a real, visible topology
  change, not hidden by reusing the CS layout unmodified.

  Built directly on the shared engine, assets/quiz-engine.js — same
  "one generic QUESTIONS[] array, no per-question HTML" structure as
  every other file in this project.
-->
