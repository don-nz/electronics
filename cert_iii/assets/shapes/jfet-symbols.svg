<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 700" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for JFET schematic symbols. Same
    ROLE as bjt-symbols.svg in this same folder (that file was the baseline
    this one was built from): edit-here-first reference, NOT included at
    runtime — copy the <defs> block, or the specific <g> ids a quiz needs,
    into that quiz page's own <defs> (cross-file SVG <use>/fetch() is
    blocked under file://).

    Redrawn from a real textbook reference (user-supplied photo, "JFET-N-
    Channel and P-channel Schematic Symbol") rather than reusing bjt-
    symbols.svg's diagonal-collector/emitter-arm geometry — a real JFET
    symbol looks meaningfully different from a BJT's:
      - The channel is drawn as a SOLID FILLED bar, not a plain stroked
        line.
      - Drain and source leads don't run straight off the bar's top/bottom
        — each has its own short horizontal jog off the bar's corner
        before turning vertical (not diagonal arms like a BJT's collector/
        emitter, and not a plain straight extension either).
      - The gate lead meets the bar's edge directly, OFF-CENTRE — nearer
        the source end than the drain end (per the identification set's
        own current geometry below; the circuit-diagram symbol's gate sits
        at its own y-offset, since the two families were redrawn
        separately) — not at the vertical midpoint.
      - Every lead on the identification-set shapes ends in a small
        terminal dot (G, D and S all have one); the circuit-diagram symbol
        (jfet-n-shape/jfet-p-shape) deliberately has none — see its own
        section below for why.

    The arrow rule itself carries over unchanged from the first version of
    this file: exactly one arrow, on the GATE lead, pointing INTO the
    channel (right) for N-channel or OUT of the channel (left) for
    P-channel — confirmed against the reference photo, which shows exactly
    this convention for both symbols. Also unchanged: there is no
    "flipped" (drain/source swapped) variant, since neither diagonal-free
    lead carries an arrow to make a swap visually distinct — see the
    original reasoning, still valid with the new geometry.

    Used by UEEEC0066/jfet/basics/jfet_knowledge_basics.html's own Q1
    (mirrors bjt_knowledge_basics.html's Q1: click every valid symbol).

    Two distinct families, matching bjt-symbols.svg's own split:

    1. CIRCUIT-DIAGRAM SYMBOL — jfet-n-shape / jfet-p-shape. One fixed
       orientation each, used as an actual component inside a wired bias-
       circuit diagram (added for UEEEC0066/jfet/basics/jfet_self_bias.html).
       Originally built to match bjt-npn-shape/bjt-pnp-shape's own circle
       radius and lead-tip coordinates (so it could drop into a circuit
       still wired for a BJT placeholder) — since redrawn by the user to
       match their own hand-drawn self-bias lesson diagram instead, once
       that circuit's real wiring existed to draw to. No longer tied to the
       BJT shapes' geometry at all: circle r=30 (not 24); the channel is a
       THIN bar (width 4, not 8) sitting at the circle's own left/centre
       (x=0-4, not offset right); the gate lead meets the bar directly on
       its long edge, off-centre in y (y=7, not the circle's own y=0); and
       the drain/source leads no longer run straight off the bar's ends —
       each has its own short horizontal jog (a "step" from the bar's
       corner out to x=15) before turning vertical up/down to its tip. This
       jog is the visually distinctive feature that makes the symbol read
       as a proper drain/gate/source JFET rather than a generic 3-terminal
       transistor blob. No terminal dots here (unlike the identification-
       set shapes below) — bjt-npn-shape doesn't have any either, so this
       keeps the two families visually consistent within their own
       category. Lead tips: gate (-30,7), drain (14,-40), source (14,40) —
       any file embedding this shape must wire to THESE coordinates (from
       the shape's own local origin), not the old BJT-matching ones.

    2. SCHEMATIC IDENTIFICATION SET — jfet-n-circle / jfet-p-circle / etc
       (originally the only thing in this file — see below).
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-jfet: #c084fc;
        --colour-bg: #0a0d14;
        --colour-text: #c8d8e8;
      }
    </style>

    <!-- ── 1. Circuit-diagram symbols (one fixed orientation each) ── -->
    <g id="jfet-n-shape">
      <circle cx="7" cy="0" r="30" fill="var(--colour-panel)" style="stroke: var(--colour-jfet)" stroke-width="2" filter="url(#glow)" />
      <line x1="-30" y1="7" x2="0" y2="7" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <rect x="0" y="-20" width="4" height="40" style="fill: var(--colour-jfet)" />
      <line x1="0" y1="-15" x2="15" y2="-15" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="14" y1="-15" x2="14" y2="-40" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="0" y1="15" x2="15" y2="15" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="14" y1="15" x2="14" y2="40" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <polygon points="-8,3 -8,12 2,7" style="fill: var(--colour-jfet)" />
    </g>
    <g id="jfet-p-shape">
      <circle cx="7" cy="0" r="30" fill="var(--colour-panel)" style="stroke: var(--colour-jfet)" stroke-width="2" filter="url(#glow)" />
      <line x1="-30" y1="7" x2="0" y2="7" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <rect x="0" y="-20" width="4" height="40" style="fill: var(--colour-jfet)" />
      <line x1="0" y1="-15" x2="15" y2="-15" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="14" y1="-15" x2="14" y2="-40" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="0" y1="15" x2="15" y2="15" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="14" y1="15" x2="14" y2="40" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <polygon points="2,3 2,12 -8,7" style="fill: var(--colour-jfet)" />
    </g>

    <!-- ── 2. Schematic identification set — shared pieces ──
         Redrawn to match the same rectangle-with-horizontal-jogs style as
         jfet-n-shape/jfet-p-shape above (ported from the user's own edits
         in jfet_knowledge_basics.html — edit there first, then re-copy
         here, same as always). Channel bar: thin solid filled rect, off-
         centre to the left (x=-10 to -6). Drain/source leads: each has its
         own short horizontal jog from the bar's corner out to x=10, then
         turns vertical, exiting through the circle boundary (r=38) with a
         terminal dot at the very end. Gate lead: horizontal, meeting the
         bar's edge directly at y=10 (noticeably below centre, i.e. nearer
         the source end — flipped from this file's own previous version,
         which had it nearer the drain end; matches the reference photo as
         redrawn). -->
    <rect id="jfet-channel" x="-10" y="-25" width="4" height="50" style="fill: var(--colour-jfet)" />
    <g id="jfet-base-frame">
      <use href="#jfet-channel" />
      <line x1="10" y1="-15" x2="10" y2="-50" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="-10" y1="-15" x2="10" y2="-15" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="10" y1="15" x2="10" y2="50" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="-10" y1="15" x2="10" y2="15" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="-50" y1="10" x2="-9" y2="10" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <circle cx="10" cy="-50" r="2.5" style="fill: var(--colour-jfet)" />
      <circle cx="10" cy="50" r="2.5" style="fill: var(--colour-jfet)" />
      <circle cx="-50" cy="10" r="2.5" style="fill: var(--colour-jfet)" />
    </g>
    <circle id="jfet-circle" cx="0" cy="0" r="38" fill="none" stroke="var(--colour-jfet)" stroke-width="2" filter="url(#glow)" />

    <!-- 4 valid symbols: N-channel (gate arrow points IN, toward the
         channel) / P-channel (points OUT, away) × circle / no-circle. -->
    <g id="jfet-n-circle"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="-24,16 -24,4 -14,10" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-p-circle"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="-24,16 -24,4 -34,10" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-n-nocircle"><use href="#jfet-base-frame" /><polygon points="-24,16 -24,4 -14,10" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-p-nocircle"><use href="#jfet-base-frame" /><polygon points="-22,16 -22,4 -32,10" style="fill: var(--colour-jfet)" /></g>

    <!-- 4 error variants — arrow(s) on the drain/source leads instead of
         the gate lead, which is left bare. -->
    <g id="jfet-error-wronglead-in"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="6,-30 14,-30 10,-22" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-error-wronglead-out"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="6,-24 14,-24 10,-32" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-error-double-in"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="6,-30 14,-30 10,-22" style="fill: var(--colour-jfet)" /><polygon points="6,30 14,30 10,22" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-error-double-out"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="6,-24 14,-24 10,-32" style="fill: var(--colour-jfet)" /><polygon points="6,24 14,24 10,32" style="fill: var(--colour-jfet)" /></g>
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="var(--colour-bg)" />
  <text x="370" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">JFET SYMBOLS — MASTER REFERENCE</text>
  <text x="370" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>

  <!-- Row 0: circuit-diagram symbols -->
  <text x="20" y="80" fill="var(--colour-text)" font-size="12" font-weight="bold">Circuit-diagram symbol</text>
  <g transform="translate(100,150) scale(1.4)">
    <use href="#jfet-n-shape" />
    <text y="55" fill="var(--colour-text)" font-size="10" text-anchor="middle">jfet-n-shape</text>
  </g>
  <g transform="translate(280,150) scale(1.4)">
    <use href="#jfet-p-shape" />
    <text y="55" fill="var(--colour-text)" font-size="10" text-anchor="middle">jfet-p-shape</text>
  </g>

  <!-- Row 1: valid circle variants -->
  <text x="20" y="260" fill="var(--colour-text)" font-size="12" font-weight="bold">Valid — circle</text>
  <g transform="translate(130,340)"><use href="#jfet-n-circle" /><text y="70" fill="#00ff99" font-size="9" text-anchor="middle">n-channel ✓</text></g>
  <g transform="translate(330,340)"><use href="#jfet-p-circle" /><text y="70" fill="#00ff99" font-size="9" text-anchor="middle">p-channel ✓</text></g>

  <!-- Row 2: valid no-circle variants -->
  <text x="450" y="260" fill="var(--colour-text)" font-size="12" font-weight="bold">Valid — no circle</text>
  <g transform="translate(560,340)"><use href="#jfet-n-nocircle" /><text y="70" fill="#00ff99" font-size="9" text-anchor="middle">n-channel ✓</text></g>
  <g transform="translate(680,340)"><use href="#jfet-p-nocircle" /><text y="70" fill="#00ff99" font-size="9" text-anchor="middle">p-channel ✓</text></g>

  <!-- Row 3: error variants -->
  <text x="20" y="500" fill="var(--colour-text)" font-size="12" font-weight="bold">Invalid</text>
  <g transform="translate(130,580)"><use href="#jfet-error-wronglead-in" /><text y="70" fill="#ff3d9a" font-size="9" text-anchor="middle">wronglead-in ✗</text></g>
  <g transform="translate(330,580)"><use href="#jfet-error-wronglead-out" /><text y="70" fill="#ff3d9a" font-size="9" text-anchor="middle">wronglead-out ✗</text></g>
  <g transform="translate(530,580)"><use href="#jfet-error-double-in" /><text y="70" fill="#ff3d9a" font-size="9" text-anchor="middle">double-in ✗</text></g>
  <g transform="translate(680,580)"><use href="#jfet-error-double-out" /><text y="70" fill="#ff3d9a" font-size="9" text-anchor="middle">double-out ✗</text></g>
</svg>
