<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 560" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for JFET schematic symbols. Same
    ROLE as bjt-symbols.svg in this same folder (that file was the baseline
    this one was built from): edit-here-first reference, NOT included at
    runtime — copy the <defs> block, or the specific <g> ids a quiz needs,
    into that quiz page's own <defs> (cross-file SVG <use>/fetch() is
    blocked under file://).

    Redrawn from a real textbook reference (user-supplied photo, "JFET-N-
    Channel and P-channel Schematic Symbol") rather than reusing bjt-
    symbols.svg's diagonal-collector/emitter-arm geometry — a real JFET
    symbol looks meaningfully different from a BJT's:
      - The channel is drawn as a SOLID FILLED bar, not a plain stroked
        line.
      - Drain and source leads run STRAIGHT vertically off the top/bottom
        of the bar (not diagonal arms like a BJT's collector/emitter).
      - The gate lead meets the bar OFF-CENTRE — noticeably closer to the
        drain end than the source end in the reference photo — not at the
        vertical midpoint.
      - Every lead ends in a small terminal dot (G, D and S all have one)
        — the reference photo draws these consistently, so they're kept
        here too.

    The arrow rule itself carries over unchanged from the first version of
    this file: exactly one arrow, on the GATE lead, pointing INTO the
    channel (right) for N-channel or OUT of the channel (left) for
    P-channel — confirmed against the reference photo, which shows exactly
    this convention for both symbols. Also unchanged: there is no
    "flipped" (drain/source swapped) variant, since neither diagonal-free
    lead carries an arrow to make a swap visually distinct — see the
    original reasoning, still valid with the new geometry.

    Used by UEEEC0066/jfet/basics/jfet_knowledge_basics.html's own Q1
    (mirrors bjt_knowledge_basics.html's Q1: click every valid symbol).
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-jfet: #c084fc;
        --colour-bg: #0a0d14;
        --colour-text: #c8d8e8;
      }
    </style>

    <!-- ── shared pieces ──
         Channel bar: solid filled rect, NOT a stroked line (unlike BJT's
         base spine). Drain/source leads: straight vertical lines off the
         bar's top/bottom, exiting through the circle boundary (r=38) with
         a terminal dot at the very end — matching the reference photo's
         leads clearly poking out past the circle. Gate lead: horizontal,
         meeting the bar at y=-10 (noticeably above centre, i.e. nearer
         the drain end — matches the photo's off-centre gate). -->
    <rect id="jfet-channel" x="-4" y="-25" width="8" height="50" style="fill: var(--colour-jfet)" />
    <g id="jfet-base-frame">
      <use href="#jfet-channel" />
      <line x1="0" y1="-25" x2="0" y2="-50" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="0" y1="25" x2="0" y2="50" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <line x1="-50" y1="-10" x2="-4" y2="-10" style="stroke: var(--colour-jfet)" stroke-width="2" />
      <circle cx="0" cy="-50" r="2.5" style="fill: var(--colour-jfet)" />
      <circle cx="0" cy="50" r="2.5" style="fill: var(--colour-jfet)" />
      <circle cx="-50" cy="-10" r="2.5" style="fill: var(--colour-jfet)" />
    </g>
    <circle id="jfet-circle" cx="0" cy="0" r="38" fill="none" stroke="var(--colour-jfet)" stroke-width="2" filter="url(#glow)" />

    <!-- 4 valid symbols: N-channel (gate arrow points IN, toward the
         channel) / P-channel (points OUT, away) × circle / no-circle. -->
    <g id="jfet-n-circle"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="-14,-16 -14,-4 -4,-10" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-p-circle"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="-4,-16 -4,-4 -14,-10" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-n-nocircle"><use href="#jfet-base-frame" /><polygon points="-14,-16 -14,-4 -4,-10" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-p-nocircle"><use href="#jfet-base-frame" /><polygon points="-4,-16 -4,-4 -14,-10" style="fill: var(--colour-jfet)" /></g>

    <!-- 4 error variants — arrow(s) on the drain/source leads instead of
         the gate lead, which is left bare. -->
    <g id="jfet-error-wronglead-in"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="-4,-38 4,-38 0,-30" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-error-wronglead-out"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="-4,-30 4,-30 0,-38" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-error-double-in"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="-4,-38 4,-38 0,-30" style="fill: var(--colour-jfet)" /><polygon points="-4,38 4,38 0,30" style="fill: var(--colour-jfet)" /></g>
    <g id="jfet-error-double-out"><use href="#jfet-base-frame" /><use href="#jfet-circle" /><polygon points="-4,-30 4,-30 0,-38" style="fill: var(--colour-jfet)" /><polygon points="-4,30 4,30 0,38" style="fill: var(--colour-jfet)" /></g>
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="var(--colour-bg)" />
  <text x="370" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">JFET SYMBOLS — MASTER REFERENCE</text>
  <text x="370" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>

  <!-- Row 1: valid circle variants -->
  <text x="20" y="100" fill="var(--colour-text)" font-size="12" font-weight="bold">Valid — circle</text>
  <g transform="translate(130,180)"><use href="#jfet-n-circle" /><text y="70" fill="#00ff99" font-size="9" text-anchor="middle">n-channel ✓</text></g>
  <g transform="translate(330,180)"><use href="#jfet-p-circle" /><text y="70" fill="#00ff99" font-size="9" text-anchor="middle">p-channel ✓</text></g>

  <!-- Row 2: valid no-circle variants -->
  <text x="450" y="100" fill="var(--colour-text)" font-size="12" font-weight="bold">Valid — no circle</text>
  <g transform="translate(560,180)"><use href="#jfet-n-nocircle" /><text y="70" fill="#00ff99" font-size="9" text-anchor="middle">n-channel ✓</text></g>
  <g transform="translate(680,180)"><use href="#jfet-p-nocircle" /><text y="70" fill="#00ff99" font-size="9" text-anchor="middle">p-channel ✓</text></g>

  <!-- Row 3: error variants -->
  <text x="20" y="340" fill="var(--colour-text)" font-size="12" font-weight="bold">Invalid</text>
  <g transform="translate(130,420)"><use href="#jfet-error-wronglead-in" /><text y="70" fill="#ff3d9a" font-size="9" text-anchor="middle">wronglead-in ✗</text></g>
  <g transform="translate(330,420)"><use href="#jfet-error-wronglead-out" /><text y="70" fill="#ff3d9a" font-size="9" text-anchor="middle">wronglead-out ✗</text></g>
  <g transform="translate(530,420)"><use href="#jfet-error-double-in" /><text y="70" fill="#ff3d9a" font-size="9" text-anchor="middle">double-in ✗</text></g>
  <g transform="translate(680,420)"><use href="#jfet-error-double-out" /><text y="70" fill="#ff3d9a" font-size="9" text-anchor="middle">double-out ✗</text></g>
</svg>
