<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for logic gate symbols, both the
    traditional (distinctive/MIL-STD) shapes and the IEC 60617 rectangular
    ("new") equivalents — e.g. the OR gate's curved shield shape vs a
    rectangle marked "≥1".

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page, because
    cross-file SVG <use> and fetch() are both blocked under file:// in
    Chromium (verified directly — see ic-packages.svg in this same folder
    for the full explanation). Keep this as the edit-here-first master copy
    and copy its defs into each quiz's own hidden <defs> block instead.

    Each gate has a matched pair of ids: "-trad" (traditional/distinctive
    shape) and "-iec" (IEC rectangular shape). Both are drawn in the same
    local coordinate frame (leads included) so either can be dropped
    straight into a shapeGrid cell, whose viewBox is a fixed
    "-32 -36 96 76" across every quiz — see renderShapeGrid() in any of the
    UEEEC0069 digital quizzes. Body footprint: x -8..24, y -16..16. Input
    lead(s) run x -24..-8; output lead runs x 24..44 (with an open bubble at
    x≈28 for the inverted/NOT variants).

    The AND/NAND "&" glyph is explicitly set to Arial/sans-serif rather than
    the page's Share Tech Mono — that webfont's actual "&" is a stylized
    loop that reads as a "6" (confirmed directly: render the character on
    its own at a large size to see it), which is fine for body text but
    made the gate symbol genuinely ambiguous. "≥1"/"=1"/"1" don't have this
    problem, so they're left in the default font.

    Used by digital_knowledge_logic_gates.html and
    digital_knowledge_logic_combos.html — copy the defs you need the same
    way for any future quiz that calls for them.

    Gate colour is a theme-aware CSS custom property, the colour hyphen bjt
    token (see the shapes below for the exact syntax), matching the same
    token every quiz page's quiz-common.css already defines — NOT a
    hardcoded hex, so a copy pasted into a quiz's own defs block
    automatically follows that page's light/dark theme. Because this file
    is also opened standalone (it is a REFERENCE file, not runtime included,
    see above), the style block right below defines that same token itself
    so the shapes still render correctly with no quiz page's CSS around them.
    NOTE: SVG comments are parsed as strict XML here (unlike the lenient
    HTML parsing quiz pages get under file://) — never write a literal
    double hyphen inside a comment in THIS file, it breaks the page with a
    parse error; that's why this comment spells out "hyphen" instead.
  -->
  <style>:root { --colour-bjt: #ffb454; }</style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <!-- ── shared leads ── -->
    <g id="gate-lead-in2">
      <line x1="-24" y1="-8" x2="-8" y2="-8" stroke="var(--colour-bjt)" stroke-width="2" />
      <line x1="-24" y1="8" x2="-8" y2="8" stroke="var(--colour-bjt)" stroke-width="2" />
    </g>
    <g id="gate-lead-in1">
      <line x1="-24" y1="0" x2="-8" y2="0" stroke="var(--colour-bjt)" stroke-width="2" />
    </g>
    <!-- OR/NOR body has a concave back — at y=±8 the curve sits at x≈-4.6,
         not -8, so these leads run a little further in to actually meet it -->
    <g id="gate-lead-in2-or">
      <line x1="-24" y1="-8" x2="-4.6" y2="-8" stroke="var(--colour-bjt)" stroke-width="2" />
      <line x1="-24" y1="8" x2="-4.6" y2="8" stroke="var(--colour-bjt)" stroke-width="2" />
    </g>
    <!-- XOR/XNOR adds an extra curve (endpoints x=-14, bulging to x=-3 at
         y=0) in front of that same concave back — at y=±8 that curve sits
         at x≈-9.9, so leads stop exactly there instead of crossing past it
         into the gap before the main body -->
    <g id="gate-lead-in2-xor">
      <line x1="-24" y1="-8" x2="-9.9" y2="-8" stroke="var(--colour-bjt)" stroke-width="2" />
      <line x1="-24" y1="8" x2="-9.9" y2="8" stroke="var(--colour-bjt)" stroke-width="2" />
    </g>
    <g id="gate-lead-out">
      <line x1="24" y1="0" x2="44" y2="0" stroke="var(--colour-bjt)" stroke-width="2" />
    </g>
    <g id="gate-lead-out-inv">
      <circle cx="28" cy="0" r="4" fill="none" stroke="var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
      <line x1="32" y1="0" x2="44" y2="0" stroke="var(--colour-bjt)" stroke-width="2" />
    </g>

    <!-- ── shared bodies ── -->
    <path id="gate-and-body" d="M -8,-16 L 8,-16 A 16,16 0 0 1 8,16 L -8,16 Z"
      fill="none" stroke="var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
    <path id="gate-or-body" d="M -8,-16 Q 8,-16 24,0 Q 8,16 -8,16 Q 1,0 -8,-16 Z"
      fill="none" stroke="var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
    <path id="gate-xor-extra" d="M -14,-16 Q -3,0 -14,16"
      fill="none" stroke="var(--colour-bjt)" stroke-width="2" />
    <path id="gate-tri-body" d="M -8,-16 L -8,16 L 24,0 Z"
      fill="none" stroke="var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
    <rect id="gate-rect-body" x="-8" y="-16" width="32" height="32"
      fill="none" stroke="var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />

    <!-- ── AND / NAND ── -->
    <g id="gate-and-trad"><use href="#gate-lead-in2" /><use href="#gate-and-body" /><use href="#gate-lead-out" /></g>
    <g id="gate-nand-trad"><use href="#gate-lead-in2" /><use href="#gate-and-body" /><use href="#gate-lead-out-inv" /></g>
    <g id="gate-and-iec"><use href="#gate-lead-in2" /><use href="#gate-rect-body" /><text x="8" y="-13" text-anchor="middle" dominant-baseline="hanging" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="var(--colour-bjt)">&amp;</text><use href="#gate-lead-out" /></g>
    <g id="gate-nand-iec"><use href="#gate-lead-in2" /><use href="#gate-rect-body" /><text x="8" y="-13" text-anchor="middle" dominant-baseline="hanging" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="var(--colour-bjt)">&amp;</text><use href="#gate-lead-out-inv" /></g>

    <!-- ── OR / NOR ── -->
    <g id="gate-or-trad"><use href="#gate-lead-in2-or" /><use href="#gate-or-body" /><use href="#gate-lead-out" /></g>
    <g id="gate-nor-trad"><use href="#gate-lead-in2-or" /><use href="#gate-or-body" /><use href="#gate-lead-out-inv" /></g>
    <g id="gate-or-iec"><use href="#gate-lead-in2" /><use href="#gate-rect-body" /><text x="8" y="-13" text-anchor="middle" dominant-baseline="hanging" font-size="11" fill="var(--colour-bjt)">&#8805;1</text><use href="#gate-lead-out" /></g>
    <g id="gate-nor-iec"><use href="#gate-lead-in2" /><use href="#gate-rect-body" /><text x="8" y="-13" text-anchor="middle" dominant-baseline="hanging" font-size="11" fill="var(--colour-bjt)">&#8805;1</text><use href="#gate-lead-out-inv" /></g>

    <!-- ── XOR / XNOR (OR body + extra curved line at the input side) ── -->
    <g id="gate-xor-trad"><use href="#gate-lead-in2-xor" /><use href="#gate-xor-extra" /><use href="#gate-or-body" /><use href="#gate-lead-out" /></g>
    <g id="gate-xnor-trad"><use href="#gate-lead-in2-xor" /><use href="#gate-xor-extra" /><use href="#gate-or-body" /><use href="#gate-lead-out-inv" /></g>
    <g id="gate-xor-iec"><use href="#gate-lead-in2" /><use href="#gate-rect-body" /><text x="8" y="-13" text-anchor="middle" dominant-baseline="hanging" font-size="11" fill="var(--colour-bjt)">=1</text><use href="#gate-lead-out" /></g>
    <g id="gate-xnor-iec"><use href="#gate-lead-in2" /><use href="#gate-rect-body" /><text x="8" y="-13" text-anchor="middle" dominant-baseline="hanging" font-size="11" fill="var(--colour-bjt)">=1</text><use href="#gate-lead-out-inv" /></g>

    <!-- ── BUFFER / NOT (single input) ── -->
    <g id="gate-buffer-trad"><use href="#gate-lead-in1" /><use href="#gate-tri-body" /><use href="#gate-lead-out" /></g>
    <g id="gate-not-trad"><use href="#gate-lead-in1" /><use href="#gate-tri-body" /><use href="#gate-lead-out-inv" /></g>
    <g id="gate-buffer-iec"><use href="#gate-lead-in1" /><use href="#gate-rect-body" /><text x="8" y="-13" text-anchor="middle" dominant-baseline="hanging" font-size="12" fill="var(--colour-bjt)">1</text><use href="#gate-lead-out" /></g>
    <g id="gate-not-iec"><use href="#gate-lead-in1" /><use href="#gate-rect-body" /><text x="8" y="-13" text-anchor="middle" dominant-baseline="hanging" font-size="12" fill="var(--colour-bjt)">1</text><use href="#gate-lead-out-inv" /></g>
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="#0a0d14" />
  <text x="300" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">LOGIC GATE SHAPES — MASTER REFERENCE</text>
  <text x="300" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>
  <text x="140" y="80" fill="#a6aebe" font-size="11" text-anchor="middle" letter-spacing="1">TRADITIONAL</text>
  <text x="390" y="80" fill="#a6aebe" font-size="11" text-anchor="middle" letter-spacing="1">IEC / RECTANGULAR (NEW)</text>

  <!-- Row: AND / NAND -->
  <text x="15" y="116" fill="#c8d8e8" font-size="13" font-weight="bold">AND</text>
  <g transform="translate(140,110) scale(1.6)">
    <use href="#gate-and-trad" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>
  <g transform="translate(390,110) scale(1.6)">
    <use href="#gate-and-iec" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>

  <!-- Row: NAND -->
  <text x="15" y="211" fill="#c8d8e8" font-size="13" font-weight="bold">NAND</text>
  <g transform="translate(140,205) scale(1.6)">
    <use href="#gate-nand-trad" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>
  <g transform="translate(390,205) scale(1.6)">
    <use href="#gate-nand-iec" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>

  <!-- Row: OR -->
  <text x="15" y="306" fill="#c8d8e8" font-size="13" font-weight="bold">OR</text>
  <g transform="translate(140,300) scale(1.6)">
    <use href="#gate-or-trad" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>
  <g transform="translate(390,300) scale(1.6)">
    <use href="#gate-or-iec" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>

  <!-- Row: NOR -->
  <text x="15" y="401" fill="#c8d8e8" font-size="13" font-weight="bold">NOR</text>
  <g transform="translate(140,395) scale(1.6)">
    <use href="#gate-nor-trad" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>
  <g transform="translate(390,395) scale(1.6)">
    <use href="#gate-nor-iec" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>

  <!-- Row: XOR -->
  <text x="15" y="496" fill="#c8d8e8" font-size="13" font-weight="bold">XOR</text>
  <g transform="translate(140,490) scale(1.6)">
    <use href="#gate-xor-trad" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>
  <g transform="translate(390,490) scale(1.6)">
    <use href="#gate-xor-iec" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>

  <!-- Row: XNOR -->
  <text x="15" y="591" fill="#c8d8e8" font-size="13" font-weight="bold">XNOR</text>
  <g transform="translate(140,585) scale(1.6)">
    <use href="#gate-xnor-trad" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>
  <g transform="translate(390,585) scale(1.6)">
    <use href="#gate-xnor-iec" />
    <text x="-34" y="-8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="-34" y="8" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>

  <!-- Row: BUFFER (single input) -->
  <text x="15" y="666" fill="#c8d8e8" font-size="13" font-weight="bold">BUFFER</text>
  <g transform="translate(140,680) scale(1.6)">
    <use href="#gate-buffer-trad" />
    <text x="-34" y="0" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>
  <g transform="translate(390,680) scale(1.6)">
    <use href="#gate-buffer-iec" />
    <text x="-34" y="0" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>

  <!-- Row: NOT (single input) -->
  <text x="15" y="761" fill="#c8d8e8" font-size="13" font-weight="bold">NOT</text>
  <g transform="translate(140,775) scale(1.6)">
    <use href="#gate-not-trad" />
    <text x="-34" y="0" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>
  <g transform="translate(390,775) scale(1.6)">
    <use href="#gate-not-iec" />
    <text x="-34" y="0" text-anchor="end" font-size="8" fill="#5a7a9a">I/P</text>
    <text x="54" y="0" text-anchor="start" font-size="8" fill="#5a7a9a">O/P</text>
  </g>
</svg>
