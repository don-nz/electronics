    UEEEC0069/term-2/knowledge/digital_knowledge_counters.html (ctr-block,

    UEEEC0069/term-2/exercises/counters/digital_counter_timing_diagram.html

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page, because
    cross-file SVG <use> and fetch() are both blocked under file:// in
    Chromium (see ic-packages.html in this same folder for the full
    explanation). Keep this as the edit-here-first master copy.

    NOTES
      - The timing diagrams were generated by a one-off script, so they are
        fixed examples rather than something to edit by hand. To make another,
        use the recipe in the generator note below.
      - ctr-block is a 4-bit counter (Q3..Q0) with a NEGATIVE-edge clock and
        an active-HIGH clear; the ctr-up/down blocks are 3-bit (Q2..Q0) and
        carry "UP"/"DOWN" in their label. Positive-edge variants have no bubble.

    Timing-diagram generator note:
    # Generator used for the two timing-diagram symbols below (not kept as a separate file):
    # seq = value of the counter before edge 0, then after each rising edge; nbits outputs; P = px per clock;
    # CLK rises mid-period, outputs change instantly at each rising edge, dashed guides at the edges.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
