<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flip-Flop / Latch Shapes — Master Reference</title>
<style>html, body { margin: 0; background: #0a0d14; }</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1670 1900" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for flip-flop/latch schematic
    symbols. Every symbol here comes in two forms, matching logic-gates.
    html's own traditional (distinctive/MIL-STD shape) vs IEC 60617
    (rectangular, "new") split:

    - SR LATCH: nor-sr-latch-trad/-iec and nand-sr-latch-trad/-iec — the
      SAME cross-coupled-gate circuit, drawn either with curved/distinctive
      gate bodies or with IEC rectangles marked & / greater-or-equal-1.
    - D FLIP-FLOP: dff-pos-edge-iec/dff-neg-edge-iec are the familiar block
      symbol (what the requesting textbook photo showed); dff-pos-edge-trad/
      dff-neg-edge-trad instead show the classic GATE-LEVEL construction —
      a master-slave pair of the same 4-NAND D-latch used inside the NAND
      SR latch above, clocked in antiphase. See section 2 below for the
      full derivation; get this one wrong and the "traditional" symbol
      teaches the wrong thing, so it's worth reading before editing it.

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page, because
    cross-file SVG <use> and fetch() are both blocked under file:// in
    Chromium (verified directly — see ic-packages.html in this same folder
    for the full explanation). Keep this as the edit-here-first master copy.

    Uses the same CSS custom-property colour tokens as the live quiz pages
    (see bjt-symbols.html's own header comment for why), backed by a local
    :root block below so the file still renders correctly opened standalone.
    Single accent token throughout (colour hyphen bjt) — same monochrome-
    orange convention as logic-gates.html, since these are the same gate
    family just wired into a small circuit instead of shown as a bare icon.
    (SVG comments are parsed as strict XML here — never write a literal
    double hyphen inside a comment in THIS file, it breaks the page with a
    parse error; that's why this paragraph spells "hyphen" out instead.)

    Unlike logic-gates.html's bare gate icons (deliberately label-free, so a
    consuming quiz can name its own inputs), pin names here ARE baked into
    the symbol — D/CLK/Q/complement(Q)/PRE/CLR/S/R never mean anything else
    on a flip-flop, the same reasoning bjt-symbols.html gives for baking in
    its B/E/C-labelled variants.

    Overline (complement) labels use an inline text-decoration:overline
    <tspan> directly on the SINGLE character/word it covers — deliberately
    NOT the shared border-top .ovl technique from digital_review_quiz_1_
    part2.html's own header comment: that technique exists specifically to
    fix text-decoration:overline failing to stack when NESTED or to show a
    gap between two ADJACENT bars with nothing between them. Neither case
    occurs here — every overline below covers one isolated pin name, never
    nested inside another and never touching a second bar — so plain
    text-decoration:overline (standard SVG/CSS, no extra markup needed) is
    safe. If a future shape here ever needs two complemented names sitting
    directly next to each other with no separator, revisit that decision.

    Four groups:

    1. CROSS-COUPLED SR LATCHES — nor-sr-latch-trad/-iec and nand-sr-latch-
       trad/-iec. Top gate takes the outer R (or complement(S) for NAND)
       input plus a feedback tap from the bottom gate's own output, and
       outputs Q; bottom gate mirrors that with S (or complement(R)) plus a
       feedback tap from the top gate's output, and outputs complement(Q).
       The -trad/-iec pair of each family is geometrically IDENTICAL except
       for the gate body (curved shape vs IEC rectangle + & / greater-or-
       equal-1 glyph) — same bubble position, feedback wiring, input/output
       leads and labels in both, so the truth table (verified against
       digital_flip_flop_diagram.html's own GATE_CONFIG, which drives its
       NOR/NAND latch-builder toggle off these same Set/Reset/Hold/Invalid
       rules) is identical either way; only the drawing style differs.

    2. D-TYPE FLIP-FLOP, IEC BLOCK — dff-pos-edge-iec / dff-neg-edge-iec. A
       plain rectangular block with D and CLK leads on the left, Q and
       complement(Q) on the right, and (negative-edge) a small inversion
       bubble on the CLK lead — the block symbol the requesting textbook
       photo showed.

    3. D-TYPE FLIP-FLOP, TRADITIONAL GATE-LEVEL — dff-pos-edge-trad /
       dff-neg-edge-trad. The classic master-slave construction: TWO
       copies of a 4-NAND gated D-latch (steering gates G1=NAND(D,EN),
       G2=NAND(EN,G1) feeding a cross-coupled NAND latch identical to
       nand-sr-latch's own core — verified: EN=0 gives S-bar=R-bar=1,
       Hold; EN=1 gives S-bar=complement(D), R-bar=D, so Q tracks D),
       cascaded MASTER then SLAVE with a single inverter between them so
       the two stages are never transparent at the same time:
         - positive-edge: master enabled by complement(CLK) (transparent
           while CLK=0, so it tracks D), slave enabled directly by CLK
           (transparent while CLK=1). While CLK=0 the master follows D;
           the instant CLK rises, the master freezes (holding whatever D
           was right at that edge) and the slave opens, copying that
           frozen value straight to Q — so Q updates AT the rising edge.
         - negative-edge: the same pair with the inverter moved to the
           OTHER stage (master gets CLK directly, slave gets complement
           (CLK)) — by the same argument, Q now updates at the FALLING
           edge.
       9 NAND gates total per symbol (4 master + 4 slave + 1 clock
       inverter). No PRESET/CLEAR version of these exists yet — wiring
       asynchronous override into the master-slave core correctly would
       need a 3rd input on 8 of those 9 gates, a big enough jump in
       complexity/risk that it was deliberately left for a follow-up
       rather than guessed at here.

    4. PRESET/CLEAR EXTENSIONS — dff-ah-pre-clr (active-high) and
       dff-al-pre-clr (active-low, with inversion bubbles) add a PRE lead
       above and a CLR lead below. Composed via <use> onto the IEC block
       body ONLY (see point 3 above for why not the traditional one) into
       the 4 ready-to-drop-in ids covering every edge×polarity combination
       — dff-pos-ah-iec, dff-neg-ah-iec, dff-pos-al-iec, dff-neg-al-iec.

    Not currently used by any quiz — copy the specific ids a new question
    needs when it needs them.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-dff: #54c0ff;
        --colour-bg: #0a0d14;
        --colour-text: #c8d8e8;
      }
    </style>

    <!-- ══════════════════ 1a. NOR SR LATCH — traditional ══════════════════
         Zero-based: drop straight into a circuit with translate(x,y) — that
         point lands on the symbol's own top-left corner. Footprint 290×220. -->
    <g id="nor-sr-latch-trad">
     <g transform="translate(140,110)">
      <!-- Top NOR gate — mirror of the bottom gate across y=0 -->
      <path d="M -35 -50 C -15 -50 5 -65 25 -80 C -5 -95 -15 -110 -35 -110 C -22 -90 -22 -70 -35 -50 Z"
        fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <circle cx="31" cy="-80" r="6" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />

      <!-- Bottom NOR gate -->
      <path d="M -35 50 C -15 50 5 65 25 80 C -5 95 -15 110 -35 110 C -22 90 -22 70 -35 50 Z"
        fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <circle cx="31" cy="80" r="6" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />

      <!-- Outer inputs: R into the top gate, S into the bottom gate -->
      <line x1="-120" y1="-95" x2="-28" y2="-95" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-128" y="-90" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">R</text>

      <line x1="-120" y1="95" x2="-28" y2="95" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-128" y="100" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">S</text>

      <!-- Feedback: top gate's output (Q) taps into the bottom gate's inner input -->
      <path d="M 37 -80 L 80 -80 L 80 -10 L -60 40 L -60 65 L -28 65" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="80" cy="-80" r="3" style="fill: var(--colour-dff)" />

      <!-- Feedback: bottom gate's output (complement(Q)) taps into the top gate's inner input -->
      <path d="M 37 80 L 90 80 L 90 10 L -70 -40 L -70 -65 L -28 -65" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="90" cy="80" r="3" style="fill: var(--colour-dff)" />

      <!-- Outputs -->
      <line x1="80" y1="-80" x2="130" y2="-80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="138" y="-75" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>

      <line x1="90" y1="80" x2="130" y2="80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="138" y="85" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
     </g>
    </g>

    <!-- ══════════════════ 1b. NAND SR LATCH — traditional ══════════════════
         Zero-based, footprint 290×220 (same convention as nor-sr-latch-trad). -->
    <g id="nand-sr-latch-trad">
     <g transform="translate(140,110)">
      <!-- Top NAND gate -->
      <path d="M -35 -110 L 5 -110 A 30 30 0 0 1 5 -50 L -35 -50 Z"
        fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <circle cx="41" cy="-80" r="6" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />

      <!-- Bottom NAND gate -->
      <path d="M -35 50 L 5 50 A 30 30 0 0 1 5 110 L -35 110 Z"
        fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <circle cx="41" cy="80" r="6" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />

      <!-- Outer inputs: complement(S) into the top gate, complement(R) into the bottom gate -->
      <line x1="-120" y1="-95" x2="-35" y2="-95" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-128" y="-90" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">S</tspan></text>

      <line x1="-120" y1="95" x2="-35" y2="95" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-128" y="100" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">R</tspan></text>

      <!-- Feedback: top gate's output (Q) taps into the bottom gate's inner input -->
      <path d="M 47 -80 L 80 -80 L 80 -10 L -60 40 L -60 65 L -35 65" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="80" cy="-80" r="3" style="fill: var(--colour-dff)" />

      <!-- Feedback: bottom gate's output (complement(Q)) taps into the top gate's inner input -->
      <path d="M 47 80 L 90 80 L 90 10 L -70 -40 L -70 -65 L -35 -65" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="90" cy="80" r="3" style="fill: var(--colour-dff)" />

      <!-- Outputs -->
      <line x1="80" y1="-80" x2="130" y2="-80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="138" y="-75" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>

      <line x1="90" y1="80" x2="130" y2="80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="138" y="85" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
     </g>
    </g>

    <!-- ══════════════════ 1c. NOR SR LATCH — IEC ══════════════════
         Same wiring as nor-sr-latch-trad, drawn as a block symbol instead
         (matches the teacher's own convention). Zero-based, footprint
         270×180 — translate(x,y) lands on the top-left corner. -->
    <g id="nor-sr-latch-iec">
     <g transform="translate(135,90)">
      <rect x="-75" y="-90" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />

      <!-- S input -->
      <line x1="-135" y1="-45" x2="-75" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-60" y="-34" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">S</text>

      <!-- R input -->
      <line x1="-135" y1="45" x2="-75" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-60" y="55" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">R</text>

      <!-- Q / complement(Q) outputs -->
      <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>

      <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
     </g>
    </g>

    <!-- ══════════════════ 1d. NAND SR LATCH — IEC ══════════════════
         Zero-based, footprint 270×180 (same convention as nor-sr-latch-iec). -->
    <g id="nand-sr-latch-iec">
     <g transform="translate(135,90)">
      <rect x="-75" y="-90" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />

      <!-- S input -->
      <line x1="-135" y1="-45" x2="-75" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-60" y="-34" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">S</tspan></text>

      <!-- R input -->
      <line x1="-135" y1="45" x2="-75" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-60" y="55" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">R</tspan></text>

      <!-- Q / complement(Q) outputs -->
      <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>

      <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
     </g>
    </g>

    <!-- ══════════════════ 2a. D FLIP-FLOP BODY, IEC (positive edge) ══════════════════
         Zero-based, footprint 270×180 — translate(x,y) lands on the
         top-left corner. -->
    <g id="dff-pos-edge-iec">
     <g transform="translate(135,90)">
      <rect x="-75" y="-90" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />

      <!-- D input -->
      <line x1="-135" y1="-45" x2="-75" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-60" y="-34" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">D</text>

      <!-- CLK input -->
      <line x1="-135" y1="45" x2="-75" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <path d="M -75 30 L -55 45 L -75 60" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-48" y="52" font-size="20" font-weight="bold" style="fill: var(--colour-dff)">CLK</text>

      <!-- Q / complement(Q) outputs -->
      <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>

      <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
     </g>
    </g>

    <!-- ══════════════════ 2b. D FLIP-FLOP BODY, IEC (negative edge) ══════════════════
         Zero-based, footprint 270×180 (same convention as dff-pos-edge-iec). -->
    <g id="dff-neg-edge-iec">
     <g transform="translate(135,90)">
      <rect x="-75" y="-90" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />

      <!-- D input -->
      <line x1="-135" y1="-45" x2="-75" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-60" y="-34" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">D</text>

      <!-- CLK input, with inversion bubble on the lead -->
      <line x1="-135" y1="45" x2="-93" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="-84" cy="45" r="8" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <path d="M -75 30 L -55 45 L -75 60" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-48" y="52" font-size="20" font-weight="bold" style="fill: var(--colour-dff)">CLK</text>

      <!-- Q / complement(Q) outputs -->
      <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>

      <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
     </g>
    </g>

    <!-- ══════════════════ 3. D FLIP-FLOP, TRADITIONAL GATE-LEVEL ══════════════════
         _nand2 / _nand-d-latch-stage are internal helper pieces (leading
         underscore = not meant to be used standalone) shared by both the
         positive- and negative-edge master-slave circuits below. -->
    <g id="_nand2">
      <path d="M -35 -30 L 5 -30 A 30 30 0 0 1 5 30 L -35 30 Z" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <circle cx="41" cy="0" r="6" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
    </g>

    <!-- One 4-NAND gated D-latch: D pin at (-355,-110), EN entry at
         (-500,0), Q out at (130,-80), complement(Q) out at (130,80) — all
         in this group's own local frame, ready to <use> and wire up.
         G1=NAND(D,EN), G2=NAND(EN,G1); the core (right-hand pair) is the
         exact same cross-coupled NAND latch as nand-sr-latch, fed S-bar=G1,
         R-bar=G2. Truth table: EN=0 -> G1=1,G2=1 -> Hold. EN=1 -> G1=
         complement(D), G2=D -> Q follows D. -->
    <g id="_nand-d-latch-stage">
      <g transform="translate(-320,-95)"><use href="#_nand2" /></g>
      <g transform="translate(-320,95)"><use href="#_nand2" /></g>

      <!-- EN, split to both steering gates -->
      <line x1="-500" y1="0" x2="-420" y2="0" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="-420" cy="0" r="3" style="fill: var(--colour-dff)" />
      <line x1="-420" y1="-80" x2="-420" y2="80" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <line x1="-420" y1="-80" x2="-355" y2="-80" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <line x1="-420" y1="80" x2="-355" y2="80" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />

      <!-- G1 output -> core's top (S-bar) input, branching down to G2 -->
      <line x1="-273" y1="-95" x2="-35" y2="-95" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="-250" cy="-95" r="3" style="fill: var(--colour-dff)" />
      <line x1="-250" y1="-95" x2="-250" y2="110" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <line x1="-250" y1="110" x2="-355" y2="110" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />

      <!-- G2 output -> core's bottom (R-bar) input -->
      <line x1="-273" y1="95" x2="-35" y2="95" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />

      <!-- Core: cross-coupled NAND latch, identical to nand-sr-latch's own -->
      <path d="M -35 -110 L 5 -110 A 30 30 0 0 1 5 -50 L -35 -50 Z" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <circle cx="41" cy="-80" r="6" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <path d="M -35 50 L 5 50 A 30 30 0 0 1 5 110 L -35 110 Z" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <circle cx="41" cy="80" r="6" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <path d="M 47 -80 L 80 -80 L 80 -10 L -60 40 L -60 65 L -35 65" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="80" cy="-80" r="3" style="fill: var(--colour-dff)" />
      <path d="M 47 80 L 90 80 L 90 10 L -70 -40 L -70 -65 L -35 -65" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="90" cy="80" r="3" style="fill: var(--colour-dff)" />
      <line x1="80" y1="-80" x2="130" y2="-80" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <line x1="90" y1="80" x2="130" y2="80" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
    </g>

    <!-- Positive-edge: master enabled by complement(CLK), slave by CLK.
         Zero-based, footprint 1740×475 — translate(x,y) lands on the
         top-left corner (roomy: this is a 9-gate circuit, not an icon). -->
    <g id="dff-pos-edge-trad">
     <g transform="translate(840,125)">
