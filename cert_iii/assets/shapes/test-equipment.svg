<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for the test/measurement equipment
    overlaid on a circuit diagram (as opposed to circuit-components.svg,
    which covers actual circuit elements, and bjt-symbols.svg, which covers
    the transistor itself): voltmeter, ammeter, probe wire, and the
    oscilloscope family.

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page, because
    cross-file SVG <use> and fetch() are both blocked under file:// in
    Chromium (verified directly — see ic-packages.svg in this same folder
    for the full explanation). Keep this as the edit-here-first master copy.

    Uses the same CSS custom-property colour tokens as the live quiz pages
    (backed by a local :root block below), so a shape copies straight into
    a quiz's own defs with zero find/replace. The oscilloscope's inner
    screen fill (#0d1117) and its two waveform colours (#ffcc00 CH1 yellow,
    #00ffff CH2 cyan) are literal hex in every source file too — they
    haven't been promoted to CSS custom-property tokens in quiz-common.css,
    so this file keeps them literal as well rather than inventing new tokens
    that don't exist yet.

    BUG FIXED HERE — scope-screen-clip: every quiz that has an oscilloscope
    (npn_quiz_2.html, pnp_quiz_2.html, pnp_troubleshoot_quiz_1.html)
    references clip-path="url(#scope-screen-clip)" on the waveform groups,
    but none of them actually DEFINE a <clipPath> with that id — it's a
    latent no-op in all three (an unresolvable clip-path reference just
    means "no clipping happens," not an error), so the waveforms currently
    render unclipped in every live quiz. This file adds the real
    <clipPath>, matching scope-base's inner screen rect exactly. Consider
    backporting the same <clipPath> into those 3 quiz files if you want the
    clipping to actually take effect there too.

    multimeter-dc-probe (found only in npn_quiz_2.html) was NOT migrated
    here — it's confirmed dead code (defined but never <use>'d anywhere)
    and stylistically diverges from meter-shape (different colour token,
    hardcoded fill, baked-in static "1.46 V" text), so it reads as an
    abandoned draft rather than a real duplicate worth consolidating.

    Not currently used by any quiz — copy the specific ids a new question
    needs when it needs them.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-bg: #0a0d14;
        --colour-text: #c8d8e8;
        --colour-red: #ff3333;
        --colour-meter-fill: #200808;
        --colour-ammeter-fill: #081a08;
        --colour-current: #39FF14;
        --colour-scope: #a6aebe;
        --colour-series: #00e5ff;
      }
    </style>

    <!-- ══ PROBE WIRE — 30px dashed stub; rotate() on <use> points it in any direction ══ -->
    <line id="probe-wire" x1="0" y1="0" x2="30" y2="0"
      style="stroke: var(--colour-red)" stroke-width="1.5" stroke-dasharray="4,3" opacity=".8" />

    <!-- ══ VOLTMETER ══ -->
    <g id="meter-shape">
      <circle cx="0" cy="0" r="30" style="fill: var(--colour-meter-fill); stroke: var(--colour-red)"
        stroke-width="1.5" filter="url(#glow)" />
      <line x1="-15" y1="-20" x2="15" y2="-20" style="stroke: var(--colour-red)" stroke-width="1.5" />
      <line x1="-15" y1="-14" x2="15" y2="-14" style="stroke: var(--colour-red)" stroke-width="1.5" stroke-dasharray="3,2" />
    </g>

    <!-- ══ AMMETER BADGE ══ -->
    <g id="ammeter-shape">
      <circle cx="0" cy="0" r="30" style="fill: var(--colour-ammeter-fill); stroke: var(--colour-current)"
        stroke-width="1.5" filter="url(#glow)" />
    </g>

    <!-- ══ OSCILLOSCOPE ══ -->
    <clipPath id="scope-screen-clip">
      <rect x="-28" y="-18" width="56" height="36" rx="3" ry="3" />
    </clipPath>

    <g id="scope-base">
      <rect x="-35" y="-25" width="70" height="50" rx="6" ry="6" style="fill: var(--colour-meter-fill); stroke: var(--colour-scope)" stroke-width="1.5" filter="url(#glow)"></rect>
      <rect x="-28" y="-18" width="56" height="36" rx="3" ry="3" style="fill: #0d1117; stroke: var(--colour-scope)" stroke-width="1" opacity="0.8"></rect>
      <line x1="-26" y1="0" x2="26" y2="0" style="stroke: var(--colour-scope)" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.4"></line>
      <line x1="0" y1="-16" x2="0" y2="16" style="stroke: var(--colour-scope)" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.4"></line>
    </g>

    <path id="wave-ch1" d="M -26 0 C -23.4 -14, -18.2 -14, -15.6 0 C -13 14, -7.8 14, -5.2 0 C -2.6 -14, 2.6 -14, 5.2 0 C 7.8 14, 13 14, 15.6 0 C 18.2 -14, 23.4 -14, 26 0" style="stroke: #ffcc00; fill: none;" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"></path>
    <path id="wave-ch2" d="M -26 0 C -23.4 14, -18.2 14, -15.6 0 C -13 -14, -7.8 -14, -5.2 0 C -2.6 14, 2.6 14, 5.2 0 C 7.8 -14, 13 -14, 15.6 0 C 18.2 14, 23.4 14, 26 0" style="stroke: #00ffff; fill: none;" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"></path>

    <g id="scope-ch1-only">
      <use href="#scope-base"></use>
      <g clip-path="url(#scope-screen-clip)"><use href="#wave-ch1"></use></g>
    </g>
    <g id="scope-ch2-only">
      <use href="#scope-base"></use>
      <g clip-path="url(#scope-screen-clip)"><use href="#wave-ch2"></use></g>
    </g>
    <g id="scope-dual">
      <use href="#scope-base"></use>
      <g clip-path="url(#scope-screen-clip)"><use href="#wave-ch1"></use><use href="#wave-ch2"></use></g>
    </g>

    <!-- Single master wire starting at the top edge of the scope. 6 orientations via
         transform on the <use>: none (top-center), translate(25,0)/translate(-25,0)
         (top-right/left), scale(1,-1) (bottom-center),
         scale(1,-1) translate(-25,0)/translate(25,0) (bottom-right/left). -->
    <marker id="probe-node-dot" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12">
      <circle cx="0" cy="0" r="2" style="fill: var(--colour-series); stroke: none;" />
    </marker>
    <line id="scope-wire-v" x1="0" y1="-25" x2="0" y2="-90"
      style="stroke: var(--colour-scope); stroke-width: 1.5; stroke-dasharray: 4,3; stroke-opacity: 0.8;"
      marker-end="url(#probe-node-dot)" />
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="var(--colour-bg)" />
  <text x="350" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">TEST EQUIPMENT — MASTER REFERENCE</text>
  <text x="350" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>

  <!-- Row 1: meters -->
  <text x="20" y="100" fill="var(--colour-text)" font-size="12" font-weight="bold">Meters</text>
  <g transform="translate(100,170) scale(1.4)">
    <use href="#meter-shape" />
    <text y="55" fill="var(--colour-text)" font-size="9" text-anchor="middle">meter-shape (V)</text>
  </g>
  <g transform="translate(280,170) scale(1.4)">
    <use href="#ammeter-shape" />
    <text y="55" fill="var(--colour-text)" font-size="9" text-anchor="middle">ammeter-shape</text>
  </g>
  <g transform="translate(460,170) scale(1.4)">
    <use href="#probe-wire" transform="translate(-15,0)" />
    <text y="35" fill="var(--colour-text)" font-size="9" text-anchor="middle">probe-wire</text>
  </g>

  <!-- Row 2: oscilloscope family -->
  <text x="20" y="280" fill="var(--colour-text)" font-size="12" font-weight="bold">Oscilloscope</text>
  <g transform="translate(100,350) scale(1.4)">
    <use href="#scope-base" />
    <text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">scope-base</text>
  </g>
  <g transform="translate(280,350) scale(1.4)">
    <use href="#scope-ch1-only" />
    <text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">scope-ch1-only</text>
  </g>
  <g transform="translate(460,350) scale(1.4)">
    <use href="#scope-ch2-only" />
    <text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">scope-ch2-only</text>
  </g>
  <g transform="translate(640,350) scale(1.4)">
    <use href="#scope-wire-v" />
    <use href="#scope-dual" />
    <text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">scope-dual</text>
    <text y="58" fill="#5a7a9a" font-size="8" text-anchor="middle">(+ scope-wire-v)</text>
  </g>
</svg>
