<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADC & DAC — MASTER REFERENCE</title>
<style>html, body { margin: 0; background: #0a0d14; }</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for the analogue/digital converter
    symbols. Extracted from term-2/knowledge/digital_knowledge_analogue_digital.html
    (a 6-bit ADC symbol, a 4-bit DAC symbol, and a DAC staircase output plotted
    against its ideal straight line to show linearity error) and
    term-2/exercises/analogue-digital/digital_adc_output_builder.html (3- and
    4-bit ADC symbols, adc-3 and adc-4).

    Convention: the POINT of the symbol faces the analogue side — the ADC's
    pointed end takes V-in and its flat side carries the digital outputs
    (MSB to LSB); the DAC is the mirror image.

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page, because
    cross-file SVG <use> and fetch() are both blocked under file:// in
    Chromium (see ic-packages.html in this same folder for the full
    explanation). Keep this as the edit-here-first master copy.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-panel: #0f1420;
        --colour-dff: #54c0ff;
        --colour-text: #c8d8e8;
        --colour-label: #5a7a9a;
        --colour-output-z: #67b8eb;
        --colour-switch: #38bdf8;
        --colour-signal: #ffd166;
      }
    </style>

    <!-- ══ 6-bit ADC symbol (V-in, D5 MSB … D0 LSB) ══ -->
    <g id="adc-symbol">
    <path d="M 40 60 L 80 20 L 240 20 L 240 100 L 80 100 Z" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
    <line x1="0" y1="60" x2="40" y2="60" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="0" y="45" text-anchor="start" font-size="15" font-weight="bold" style="fill: var(--colour-dff)">V<tspan font-size="10" dy="3">in</tspan></text>
    <line x1="100" y1="100" x2="100" y2="135" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="100" y="152" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">5</tspan></text>
    <line x1="124" y1="100" x2="124" y2="135" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="124" y="152" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">4</tspan></text>
    <line x1="148" y1="100" x2="148" y2="135" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="148" y="152" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">3</tspan></text>
    <line x1="172" y1="100" x2="172" y2="135" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="172" y="152" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">2</tspan></text>
    <line x1="196" y1="100" x2="196" y2="135" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="196" y="152" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">1</tspan></text>
    <line x1="220" y1="100" x2="220" y2="135" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="220" y="152" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">0</tspan></text>
    <text x="100" y="168" text-anchor="middle" font-size="11" font-weight="bold" style="fill: var(--colour-dff)">MSB</text>
    <text x="220" y="168" text-anchor="middle" font-size="11" font-weight="bold" style="fill: var(--colour-dff)">LSB</text>
    </g>

    <!-- ══ 4-bit DAC symbol (D3 MSB … D0 LSB, V-out) ══ -->
    <g id="dac-symbol">
    <path d="M 30 20 L 200 20 L 240 60 L 200 100 L 30 100 Z" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
    <line x1="240" y1="60" x2="285" y2="60" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="285" y="45" text-anchor="end" font-size="15" font-weight="bold" style="fill: var(--colour-dff)">V<tspan font-size="10" dy="3">out</tspan></text>
    <line x1="60" y1="20" x2="60" y2="-15" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="60" y="-22" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">3</tspan></text>
    <line x1="94" y1="20" x2="94" y2="-15" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="94" y="-22" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">2</tspan></text>
    <line x1="128" y1="20" x2="128" y2="-15" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="128" y="-22" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">1</tspan></text>
    <line x1="162" y1="20" x2="162" y2="-15" style="stroke: var(--colour-dff)" stroke-width="2" />
    <text x="162" y="-22" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">0</tspan></text>
    <text x="60" y="-36" text-anchor="middle" font-size="11" font-weight="bold" style="fill: var(--colour-dff)">MSB</text>
    <text x="162" y="-36" text-anchor="middle" font-size="11" font-weight="bold" style="fill: var(--colour-dff)">LSB</text>
    </g>

    <!-- ══ DAC output for a ramp of codes vs ideal line (linearity) ══ -->
    <g id="dac-ramp">
    <line x1="30" y1="190" x2="280" y2="190" style="stroke: var(--colour-label)" stroke-width="1.5" />
    <line x1="30" y1="190" x2="30" y2="20" style="stroke: var(--colour-label)" stroke-width="1.5" />
    <line x1="30" y1="190.0" x2="280" y2="38.205128205128204" style="stroke: var(--colour-signal)" stroke-width="2" stroke-dasharray="6 5" />
    <polyline points="30.0,190.0 61.2,190.0 61.2,162.3 92.5,162.3 92.5,158.2 123.8,158.2 123.8,116.2 155.0,116.2 155.0,112.1 186.2,112.1 186.2,76.2 217.5,76.2 217.5,77.2 248.8,77.2 248.8,44.4 280.0,44.4" fill="none" style="stroke: var(--colour-output-z)" stroke-width="2.5" />
    <text x="280" y="208" text-anchor="end" font-size="11" font-weight="bold" style="fill: var(--colour-label)">digital input code →</text>
    <text x="24" y="18" text-anchor="end" font-size="12" font-weight="bold" style="fill: var(--colour-label)">V</text>
    <text x="38" y="16" text-anchor="start" font-size="11" font-weight="bold" style="fill: var(--colour-signal)">dashed = ideal straight line</text>
    <text x="38" y="32" text-anchor="start" font-size="11" font-weight="bold" style="fill: var(--colour-output-z)">solid = actual DAC output</text>
    </g>

    <!-- ══ 3-bit ADC symbol (compact) ══ -->
    <g id="adc-3">
     <g transform="translate(135,80)">
      <path d="M -75 0 L -35 -45 L 75 -45 L 75 45 L -35 45 Z" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <line x1="-135" y1="0" x2="-75" y2="0" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-130" y="-8" text-anchor="start" font-size="15" font-weight="bold" style="fill: var(--colour-dff)">V<tspan font-size="10" dy="3">in</tspan></text>
      <text x="20" y="5" text-anchor="middle" font-size="12" font-weight="bold" style="fill: var(--colour-dff)">3-BIT ADC</text>
      <line x1="-25.0" y1="45" x2="-25.0" y2="80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-25.0" y="98" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">2</tspan></text>
      <line x1="20.0" y1="45" x2="20.0" y2="80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="20.0" y="98" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">1</tspan></text>
      <line x1="65.0" y1="45" x2="65.0" y2="80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="65.0" y="98" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">0</tspan></text>
     </g>
    </g>

    <!-- ══ 4-bit ADC symbol (compact) ══ -->
    <g id="adc-4">
     <g transform="translate(135,80)">
      <path d="M -75 0 L -35 -45 L 75 -45 L 75 45 L -35 45 Z" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <line x1="-135" y1="0" x2="-75" y2="0" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-130" y="-8" text-anchor="start" font-size="15" font-weight="bold" style="fill: var(--colour-dff)">V<tspan font-size="10" dy="3">in</tspan></text>
      <text x="20" y="5" text-anchor="middle" font-size="12" font-weight="bold" style="fill: var(--colour-dff)">4-BIT ADC</text>
      <line x1="-25.0" y1="45" x2="-25.0" y2="80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-25.0" y="98" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">3</tspan></text>
      <line x1="5.0" y1="45" x2="5.0" y2="80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="5.0" y="98" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">2</tspan></text>
      <line x1="35.0" y1="45" x2="35.0" y2="80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="35.0" y="98" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">1</tspan></text>
      <line x1="65.0" y1="45" x2="65.0" y2="80" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="65.0" y="98" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">D<tspan font-size="10" dy="3">0</tspan></text>
     </g>
    </g>
  </defs>

  <rect width="100%" height="100%" fill="var(--colour-panel)" />
  <text x="500" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">ADC & DAC — MASTER REFERENCE</text>
  <text x="500" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>
  <g transform="translate(20.0,55.0) scale(1.000)"><use href="#adc-symbol" /></g>
  <text x="150.0" y="248.0" fill="var(--colour-text)" font-size="10" text-anchor="middle">adc-symbol</text>
  <g transform="translate(350.0,110.0) scale(1.000)"><use href="#dac-symbol" /></g>
  <text x="495.0" y="228.0" fill="var(--colour-text)" font-size="10" text-anchor="middle">dac-symbol</text>
  <g transform="translate(680.0,70.0) scale(1.000)"><use href="#dac-ramp" /></g>
  <text x="825.0" y="303.0" fill="var(--colour-text)" font-size="10" text-anchor="middle">dac-ramp</text>
  <g transform="translate(20.0,315.0) scale(1.000)"><use href="#adc-3" /></g>
  <text x="127.5" y="513.0" fill="var(--colour-text)" font-size="10" text-anchor="middle">adc-3</text>
  <g transform="translate(350.0,315.0) scale(1.000)"><use href="#adc-4" /></g>
  <text x="457.5" y="513.0" fill="var(--colour-text)" font-size="10" text-anchor="middle">adc-4</text>
</svg>
</body>
</html>
