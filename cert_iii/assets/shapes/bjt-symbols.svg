<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 980" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for BJT transistor symbols, covering
    every variant currently duplicated across the UEEEC0066 BJT quiz files.

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page, because
    cross-file SVG <use> and fetch() are both blocked under file:// in
    Chromium (verified directly — see ic-packages.svg in this same folder
    for the full explanation). Keep this as the edit-here-first master copy.

    Unlike ic-packages.svg/logic-gates.svg (which use literal hex since they
    predate this refinement), this file uses the SAME CSS custom-property
    colour tokens as the live quiz pages, backed by a local :root block below
    so the file still renders correctly when opened standalone. This means a
    shape can be copied straight into a quiz's own defs with zero
    find/replace — the colour-bjt etc. references already match what
    quiz-common.css defines. If you add a shape that needs a token not
    already listed in :root, add it there AND confirm it exists in
    ../quiz-common.css (don't invent a new token here only).

    Two distinct families are covered:

    1. CIRCUIT-DIAGRAM SYMBOL — bjt-npn-shape / bjt-pnp-shape. One fixed
       orientation each, used as Q1 inside an actual bias-circuit diagram
       (npn_quiz_1/2/3, npn_troubleshoot_quiz_1, pnp_quiz_1/2,
       pnp_troubleshoot_quiz_1). Also duplicated a THIRD time, under the id
       "q5v-bjt", inside bjt_knowledge_quiz_1.html's Q5 interactive
       visualizer and npn_bias_simulation.html's own isolated mini-<defs> —
       both are geometrically identical to bjt-npn-standard-circle below, so
       if you touch that shape, those two embedded copies drift out of sync
       until manually re-copied.

    2. SCHEMATIC IDENTIFICATION SET — used only by bjt_knowledge_quiz_1.html
       (Q1/Q2's "click every valid/PNP symbol" and Q3's B/E/C labelling
       question). Built from a shared bjt-base-frame (leads + collector/
       emitter arms, no arrow, no circle) via <use>, then an optional circle
       and an arrow polygon placed on whichever arm represents the emitter:
         - 8 valid combos: NPN/PNP × standard/flipped × circle/no-circle
         - 4 error variants: arrow drawn on the BASE lead instead of an arm
           (2 variants), or two arrows on both arms at once (2 variants)
         - B/E/C-labelled variants: correct labelling + 3 mislabelled swaps,
           for both NPN and PNP (only 2 of the 8 are shown in the visible
           reference sheet below as a representative sample — swap-be and
           swap-bc follow the exact same pattern of moving the B/C/E text
           to a different arm; all 8 are present in <defs> for copying).

    Not currently used by any quiz — copy the specific ids a new question
    needs when it needs them.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-bjt: #ffb454;
        --colour-bg: #0a0d14;
        --colour-text: #c8d8e8;
      }
    </style>

    <!-- ── 1. Circuit-diagram symbols (one fixed orientation each) ── -->
    <g id="bjt-npn-shape">
      <circle cx="7" cy="0" r="24" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
      <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
      <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
      <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
      <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
      <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
    </g>
    <g id="bjt-pnp-shape">
      <circle cx="7" cy="0" r="24" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
      <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
      <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
      <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
      <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
      <polygon points="2,-9 8,-20 13,-14" style="fill: var(--colour-bjt)" />
    </g>

    <!-- ── 2. Schematic identification set — shared frame + circle ── -->
    <g id="bjt-base-frame">
      <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
      <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
      <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
      <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
    </g>
    <circle id="bjt-circle" cx="7" cy="0" r="24" fill="none" stroke="var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />

    <!-- 8 valid symbols -->
    <g id="bjt-npn-standard-circle"><use href="#bjt-base-frame" /><use href="#bjt-circle" /><polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-pnp-standard-circle"><use href="#bjt-base-frame" /><use href="#bjt-circle" /><polygon points="2,-9 8,-20 13,-14" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-npn-flipped-circle"><use href="#bjt-base-frame" /><use href="#bjt-circle" /><polygon points="12,-18 1,-14 6,-8" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-pnp-flipped-circle"><use href="#bjt-base-frame" /><use href="#bjt-circle" /><polygon points="2,9 8,20 13,14" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-npn-standard-nocircle"><use href="#bjt-base-frame" /><polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-pnp-standard-nocircle"><use href="#bjt-base-frame" /><polygon points="2,-9 8,-20 13,-14" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-npn-flipped-nocircle"><use href="#bjt-base-frame" /><polygon points="12,-18 1,-14 6,-8" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-pnp-flipped-nocircle"><use href="#bjt-base-frame" /><polygon points="2,9 8,20 13,14" style="fill: var(--colour-bjt)" /></g>

    <!-- 4 error variants -->
    <g id="bjt-error-base-arrow-in"><use href="#bjt-base-frame" /><use href="#bjt-circle" /><polygon points="-4,-4 2,0 -4,4" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-error-base-arrow-out"><use href="#bjt-base-frame" /><use href="#bjt-circle" /><polygon points="-10,0 -4,-4 -4,4" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-error-double-in"><use href="#bjt-base-frame" /><use href="#bjt-circle" /><polygon points="2,-9 8,-20 13,-14" style="fill: var(--colour-bjt)" /><polygon points="2,9 8,20 13,14" style="fill: var(--colour-bjt)" /></g>
    <g id="bjt-error-double-out"><use href="#bjt-base-frame" /><use href="#bjt-circle" /><polygon points="12,-18 1,-14 6,-8" style="fill: var(--colour-bjt)" /><polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" /></g>

    <!-- B/E/C-labelled variants — both use an emitter-at-bottom base symbol
         (npn-standard, pnp-flipped); only the label placement differs.
         Correct: B=base lead (left), C=top diagonal, E=bottom diagonal. -->
    <g id="bjt-npn-labels-correct">
      <use href="#bjt-npn-standard-circle" />
      <text x="-20" y="4" text-anchor="end" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">B</text>
      <text x="22" y="-24" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">C</text>
      <text x="22" y="32" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">E</text>
    </g>
    <g id="bjt-npn-labels-swap-ec">
      <use href="#bjt-npn-standard-circle" />
      <text x="-20" y="4" text-anchor="end" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">B</text>
      <text x="22" y="-24" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">E</text>
      <text x="22" y="32" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">C</text>
    </g>
    <g id="bjt-npn-labels-swap-be">
      <use href="#bjt-npn-standard-circle" />
      <text x="-20" y="4" text-anchor="end" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">E</text>
      <text x="22" y="-24" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">C</text>
      <text x="22" y="32" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">B</text>
    </g>
    <g id="bjt-npn-labels-swap-bc">
      <use href="#bjt-npn-standard-circle" />
      <text x="-20" y="4" text-anchor="end" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">C</text>
      <text x="22" y="-24" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">B</text>
      <text x="22" y="32" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">E</text>
    </g>
    <g id="bjt-pnp-labels-correct">
      <use href="#bjt-pnp-flipped-circle" />
      <text x="-20" y="4" text-anchor="end" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">B</text>
      <text x="22" y="-24" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">C</text>
      <text x="22" y="32" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">E</text>
    </g>
    <g id="bjt-pnp-labels-swap-ec">
      <use href="#bjt-pnp-flipped-circle" />
      <text x="-20" y="4" text-anchor="end" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">B</text>
      <text x="22" y="-24" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">E</text>
      <text x="22" y="32" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">C</text>
    </g>
    <g id="bjt-pnp-labels-swap-be">
      <use href="#bjt-pnp-flipped-circle" />
      <text x="-20" y="4" text-anchor="end" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">E</text>
      <text x="22" y="-24" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">C</text>
      <text x="22" y="32" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">B</text>
    </g>
    <g id="bjt-pnp-labels-swap-bc">
      <use href="#bjt-pnp-flipped-circle" />
      <text x="-20" y="4" text-anchor="end" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">C</text>
      <text x="22" y="-24" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">B</text>
      <text x="22" y="32" text-anchor="start" font-size="13" font-weight="bold" style="fill: var(--colour-bjt)">E</text>
    </g>
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="var(--colour-bg)" />
  <text x="370" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">BJT SYMBOLS — MASTER REFERENCE</text>
  <text x="370" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>

  <!-- Row 1: circuit-diagram symbols -->
  <text x="20" y="100" fill="var(--colour-text)" font-size="12" font-weight="bold">Circuit-diagram symbol</text>
  <g transform="translate(100,160) scale(1.4)">
    <use href="#bjt-npn-shape" />
    <text y="55" fill="var(--colour-text)" font-size="10" text-anchor="middle">bjt-npn-shape</text>
  </g>
  <g transform="translate(280,160) scale(1.4)">
    <use href="#bjt-pnp-shape" />
    <text y="55" fill="var(--colour-text)" font-size="10" text-anchor="middle">bjt-pnp-shape</text>
  </g>

  <!-- Row 2: valid circle variants -->
  <text x="20" y="277" fill="var(--colour-text)" font-size="12" font-weight="bold">Valid — circle</text>
  <g transform="translate(100,337) scale(1.4)"><use href="#bjt-npn-standard-circle" /><text y="55" fill="#00ff99" font-size="9" text-anchor="middle">npn-standard ✓</text></g>
  <g transform="translate(280,337) scale(1.4)"><use href="#bjt-pnp-standard-circle" /><text y="55" fill="#00ff99" font-size="9" text-anchor="middle">pnp-standard ✓</text></g>
  <g transform="translate(460,337) scale(1.4)"><use href="#bjt-npn-flipped-circle" /><text y="55" fill="#00ff99" font-size="9" text-anchor="middle">npn-flipped ✓</text></g>
  <g transform="translate(640,337) scale(1.4)"><use href="#bjt-pnp-flipped-circle" /><text y="55" fill="#00ff99" font-size="9" text-anchor="middle">pnp-flipped ✓</text></g>

  <!-- Row 3: valid no-circle variants -->
  <text x="20" y="454" fill="var(--colour-text)" font-size="12" font-weight="bold">Valid — no circle</text>
  <g transform="translate(100,514) scale(1.4)"><use href="#bjt-npn-standard-nocircle" /><text y="55" fill="#00ff99" font-size="9" text-anchor="middle">npn-standard ✓</text></g>
  <g transform="translate(280,514) scale(1.4)"><use href="#bjt-pnp-standard-nocircle" /><text y="55" fill="#00ff99" font-size="9" text-anchor="middle">pnp-standard ✓</text></g>
  <g transform="translate(460,514) scale(1.4)"><use href="#bjt-npn-flipped-nocircle" /><text y="55" fill="#00ff99" font-size="9" text-anchor="middle">npn-flipped ✓</text></g>
  <g transform="translate(640,514) scale(1.4)"><use href="#bjt-pnp-flipped-nocircle" /><text y="55" fill="#00ff99" font-size="9" text-anchor="middle">pnp-flipped ✓</text></g>

  <!-- Row 4: error variants -->
  <text x="20" y="631" fill="var(--colour-text)" font-size="12" font-weight="bold">Invalid</text>
  <g transform="translate(100,691) scale(1.4)"><use href="#bjt-error-base-arrow-in" /><text y="55" fill="#ff3d9a" font-size="9" text-anchor="middle">base-arrow-in ✗</text></g>
  <g transform="translate(280,691) scale(1.4)"><use href="#bjt-error-base-arrow-out" /><text y="55" fill="#ff3d9a" font-size="9" text-anchor="middle">base-arrow-out ✗</text></g>
  <g transform="translate(460,691) scale(1.4)"><use href="#bjt-error-double-in" /><text y="55" fill="#ff3d9a" font-size="9" text-anchor="middle">double-in ✗</text></g>
  <g transform="translate(640,691) scale(1.4)"><use href="#bjt-error-double-out" /><text y="55" fill="#ff3d9a" font-size="9" text-anchor="middle">double-out ✗</text></g>

  <!-- Row 5: B/E/C labelled — 2 representative examples (all 8 are in <defs>) -->
  <text x="20" y="808" fill="var(--colour-text)" font-size="12" font-weight="bold">B/E/C labelled (2 of 8 shown)</text>
  <g transform="translate(100,868) scale(1.4)"><use href="#bjt-npn-labels-correct" /><text y="55" fill="var(--colour-text)" font-size="9" text-anchor="middle">npn-labels-correct</text></g>
  <g transform="translate(300,868) scale(1.4)"><use href="#bjt-npn-labels-swap-ec" /><text y="55" fill="var(--colour-text)" font-size="9" text-anchor="middle">npn-labels-swap-ec</text></g>
  <text x="480" y="850" fill="#5a7a9a" font-size="9" text-anchor="start">swap-be, swap-bc and the</text>
  <text x="480" y="863" fill="#5a7a9a" font-size="9" text-anchor="start">PNP equivalents follow the</text>
  <text x="480" y="876" fill="#5a7a9a" font-size="9" text-anchor="start">same pattern — see &lt;defs&gt;</text>
</svg>
