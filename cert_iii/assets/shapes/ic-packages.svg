<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for the DIP/DIL IC package shapes.

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page.

    Why not just <use href="ic-packages.svg#dip-body"> from the quiz pages
    directly? Because these quizzes are opened as local files (file://), and
    both cross-file SVG <use> and fetch() are blocked under file:// in
    Chromium (verified directly — the exact same markup works fine over
    http:// but silently renders nothing over file://). A <link
    rel="stylesheet"> is a special case browsers allow across local files;
    SVG shape reuse is not. So there is no reliable way to share this SVG
    at runtime for a quiz opened by double-clicking — keep this file as the
    edit-here-first master copy instead, and copy its defs into each quiz's
    own hidden <defs> block (see digital_knowledge_quiz_1.html Q7 for a
    working example of the copied version in use).

    Currently used by: digital_knowledge_quiz_1.html (Q7 — "click every
    shape that shows a valid pin-1 marking on a DIP/DIL package").
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <!-- Base body: notch present (primary pin-1 method) -->
    <g id="dip-body">
      <path d="M -20,-28 L -6,-28 A 6,6 0 0 0 6,-28 L 20,-28 L 20,28 L -20,28 Z"
        fill="none" stroke="#ffb454" stroke-width="2" stroke-linejoin="round" filter="url(#glow)" />
      <rect x="-17" y="-25" width="6" height="6" fill="#ffb454" opacity="0.45" />
      <rect x="11" y="-25" width="6" height="6" fill="#ffb454" opacity="0.45" />
      <rect x="-17" y="19" width="6" height="6" fill="#ffb454" opacity="0.45" />
      <rect x="11" y="19" width="6" height="6" fill="#ffb454" opacity="0.45" />
    </g>

    <!-- Base body: no notch -->
    <g id="dip-body-nonotch">
      <rect x="-20" y="-28" width="40" height="56" fill="none" stroke="#ffb454" stroke-width="2" />
      <rect x="-17" y="-25" width="6" height="6" fill="#ffb454" opacity="0.45" />
      <rect x="11" y="-25" width="6" height="6" fill="#ffb454" opacity="0.45" />
      <rect x="-17" y="19" width="6" height="6" fill="#ffb454" opacity="0.45" />
      <rect x="11" y="19" width="6" height="6" fill="#ffb454" opacity="0.45" />
    </g>

    <!-- Notch only, no dot — VALID (notch alone is a fully standard method) -->
    <g id="dip-notch-nodot">
      <use href="#dip-body" />
    </g>

    <!-- Notch + dot agreeing (top-left) — VALID -->
    <g id="dip-notch-dot-tl">
      <use href="#dip-body" />
      <circle cx="-14" cy="-22" r="4" fill="#39FF14" filter="url(#glow)" />
    </g>

    <!-- Notch + dot contradicting (top-right) — INVALID -->
    <g id="dip-notch-dot-tr">
      <use href="#dip-body" />
      <circle cx="14" cy="-22" r="4" fill="#39FF14" filter="url(#glow)" />
    </g>

    <!-- Notch + dot contradicting (bottom-left) — INVALID -->
    <g id="dip-notch-dot-bl">
      <use href="#dip-body" />
      <circle cx="-14" cy="22" r="4" fill="#39FF14" filter="url(#glow)" />
    </g>

    <!-- Notch + dot contradicting (bottom-right) — INVALID -->
    <g id="dip-notch-dot-br">
      <use href="#dip-body" />
      <circle cx="14" cy="22" r="4" fill="#39FF14" filter="url(#glow)" />
    </g>

    <!-- No notch, dot only (top-right) — INVALID (no notch to anchor the convention) -->
    <g id="dip-nonotch-dot-tr">
      <use href="#dip-body-nonotch" />
      <circle cx="14" cy="-22" r="4" fill="#39FF14" filter="url(#glow)" />
    </g>

    <!-- No notch, dot only (bottom-left) — INVALID -->
    <g id="dip-nonotch-dot-bl">
      <use href="#dip-body-nonotch" />
      <circle cx="-14" cy="22" r="4" fill="#39FF14" filter="url(#glow)" />
    </g>

    <!-- No notch, dot only (bottom-right) — INVALID -->
    <g id="dip-nonotch-dot-br">
      <use href="#dip-body-nonotch" />
      <circle cx="14" cy="22" r="4" fill="#39FF14" filter="url(#glow)" />
    </g>
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="#0a0d14" />
  <text x="390" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">DIP/DIL PACKAGE SHAPES — MASTER REFERENCE</text>
  <text x="390" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>

  <!-- Row 1: the two base bodies + 3 valid/labelled variants -->
  <g transform="translate(80,110)">
    <use href="#dip-body" /><text y="46" fill="#c8d8e8" font-size="9" text-anchor="middle">dip-body</text>
  </g>
  <g transform="translate(220,110)">
    <use href="#dip-body-nonotch" /><text y="46" fill="#c8d8e8" font-size="9" text-anchor="middle">dip-body-nonotch</text>
  </g>
  <g transform="translate(360,110)">
    <use href="#dip-notch-nodot" /><text y="46" fill="#00ff99" font-size="9" text-anchor="middle">dip-notch-nodot ✓</text>
  </g>
  <g transform="translate(500,110)">
    <use href="#dip-notch-dot-tl" /><text y="46" fill="#00ff99" font-size="9" text-anchor="middle">dip-notch-dot-tl ✓</text>
  </g>

  <!-- Row 2: the 6 invalid variants -->
  <g transform="translate(50,250)">
    <use href="#dip-notch-dot-tr" /><text y="46" fill="#ff3d9a" font-size="9" text-anchor="middle">dip-notch-dot-tr ✗</text>
  </g>
  <g transform="translate(175,250)">
    <use href="#dip-notch-dot-bl" /><text y="46" fill="#ff3d9a" font-size="9" text-anchor="middle">dip-notch-dot-bl ✗</text>
  </g>
  <g transform="translate(300,250)">
    <use href="#dip-notch-dot-br" /><text y="46" fill="#ff3d9a" font-size="9" text-anchor="middle">dip-notch-dot-br ✗</text>
  </g>
  <g transform="translate(425,250)">
    <use href="#dip-nonotch-dot-tr" /><text y="46" fill="#ff3d9a" font-size="9" text-anchor="middle">dip-nonotch-dot-tr ✗</text>
  </g>
  <g transform="translate(550,250)">
    <use href="#dip-nonotch-dot-bl" /><text y="46" fill="#ff3d9a" font-size="9" text-anchor="middle">dip-nonotch-dot-bl ✗</text>
  </g>
  <g transform="translate(675,250)">
    <use href="#dip-nonotch-dot-br" /><text y="46" fill="#ff3d9a" font-size="9" text-anchor="middle">dip-nonotch-dot-br ✗</text>
  </g>
</svg>
