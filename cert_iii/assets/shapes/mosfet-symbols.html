<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MOSFET Symbols — Master Reference</title>
<style>html, body { margin: 0; background: #0a0d14; }</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for MOSFET schematic symbols. Same
    ROLE as bjt-symbols.html / jfet-symbols.html in this same folder: edit-
    here-first reference, NOT included at runtime — copy the <defs> block,
    or the specific <g> ids a quiz needs, into that quiz page's own <defs>
    (cross-file SVG <use>/fetch() is blocked under file://).

    Originally ported from the user's own direct edit in
    ../../UEEEC0066/mosfet/amplifiers/mosfet_voltage_divider_cs.html
    (N-channel base/enhancement/depletion split). P-channel and the 4 error
    variants below were added for
    ../../UEEEC0066/mosfet/basics/mosfet_knowledge_basics.html's own Q1
    (symbol-identification shapeGrid) — the JFET/BJT counterpart quizzes
    both need a "click every valid symbol" set with real invalid variants
    to distinguish from, which this file didn't have until now.

    Two independent rules a valid MOSFET symbol follows, mirrored from how
    ../../UEEEC0066/reviews/mosfet_review_quiz.html already teaches both
    concepts separately:
      1. Channel line style (broken vs solid) says ENHANCEMENT vs DEPLETION
        — always a valid reading either way, never a validity error.
      2. Exactly ONE arrow, on the substrate/body lead only (never the
        drain or source lead), pointing IN toward the channel for
        N-channel or OUT for P-channel — THIS is the rule Q1's error
        variants break (same "one arrow, wrong/extra placement" error
        family jfet-symbols.html already uses for its own JFET gate-lead
        arrow, adapted to the MOSFET's own substrate-lead arrow instead).

    Nine symbols, all sharing the mosfet-base-shape/-p frame:
      - mosfet-base-shape / mosfet-base-shape-p — the common N-channel /
        P-channel frames: circle body, gate lead + insulated gate plate (a
        short filled rect, NOT touching the channel bar — there's a real
        gap, since the gate oxide is an insulator), drain lead, source
        lead, and the substrate/body arrow (IN for -base-shape/N, OUT for
        -base-shape-p/P — the polygon is the ONLY difference between the
        two, mirrored around the same channel line). Both draw the
        3-segment BROKEN channel by default.
      - mosfet-n-e-shape / mosfet-p-e-shape (ENHANCEMENT) — use the base
        shape as-is; the broken channel IS the enhancement reading (no
        channel exists until VGS induces one).
      - mosfet-n-d-shape / mosfet-p-d-shape (DEPLETION) — draw one solid
        bar over the broken segments (already conducts at VGS=0).
      - mosfet-error-wronglead-in / -out — NO arrow on the substrate lead
        at all; instead, a single arrow sits on the DRAIN lead's own
        horizontal jog, pointing in/out. Breaks rule 2 (wrong lead).
      - mosfet-error-double-in / -out — same missing substrate arrow, but
        TWO arrows instead: one on the drain lead, one on the source lead,
        both pointing the same direction. Breaks rule 2 twice over (wrong
        lead AND more than one arrow).
      Error variants are all drawn on an enhancement (broken) channel —
      the channel style is irrelevant to what makes them invalid, so it's
      kept fixed for visual consistency across the 4.

    Lead tips, from the base shape's own local origin (any file embedding
    these shapes wires to these coordinates): gate (-30,24), drain
    (25,-32), source (25,40) — identical for both mosfet-base-shape and
    mosfet-base-shape-p, since only the arrow differs between them.

    Simplified schematic, consistent with this project's existing
    simplified BJT/JFET symbols — not pixel-exact to any single textbook
    standard.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-mosfet: #16c771;
        --colour-bg: #0a0d14;
        --colour-text: #c8d8e8;
      }
    </style>

    <!-- ── Shared base frame — N-channel (arrow IN) ── -->
    <g id="mosfet-base-shape">
      <circle cx="7" cy="5" r="30" fill="var(--colour-panel)" style="stroke: var(--colour-mosfet)" stroke-width="2" filter="url(#glow)" />
      <!-- gate lead -->
      <line x1="-30" y1="24" x2="-3" y2="24" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <!-- gate plate — insulated, a small gap separates it from the channel bars -->
      <rect x="-4" y="-18" width="3" height="43" style="fill: var(--colour-mosfet)" />
      <!-- 3 broken channel segments -->
      <line x1="6" y1="-18" x2="6" y2="-7" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-2" x2="6" y2="9" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="14" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <!-- drain lead -->
      <line x1="6" y1="-12" x2="25" y2="-12" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="25" y1="-11" x2="25" y2="-32" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <!-- source lead -->
      <line x1="6" y1="20" x2="25" y2="20" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="24" y1="3" x2="25" y2="40" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <!-- substrate/body line + arrow (N-channel: points IN toward the channel) -->
      <line x1="6" y1="3" x2="25" y2="3" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <polygon points="14,-3 14,9 6,3" style="fill: var(--colour-mosfet)" />
    </g>

    <!-- ── Shared base frame — P-channel (arrow OUT). Identical to
         mosfet-base-shape except the substrate arrow polygon is mirrored
         to point away from the channel instead of into it. ── -->
    <g id="mosfet-base-shape-p">
      <circle cx="7" cy="5" r="30" fill="var(--colour-panel)" style="stroke: var(--colour-mosfet)" stroke-width="2" filter="url(#glow)" />
      <line x1="-30" y1="24" x2="-3" y2="24" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <rect x="-4" y="-18" width="3" height="43" style="fill: var(--colour-mosfet)" />
      <line x1="6" y1="-18" x2="6" y2="-7" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-2" x2="6" y2="9" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="14" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-12" x2="25" y2="-12" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="25" y1="-11" x2="25" y2="-32" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="20" x2="25" y2="20" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="24" y1="3" x2="25" y2="40" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="3" x2="25" y2="3" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <polygon points="17,-3 17,9 25,3" style="fill: var(--colour-mosfet)" />
    </g>

    <!-- ── Enhancement Mode — N/P (3-segment broken channel — no channel until induced) ── -->
    <g id="mosfet-n-e-shape">
      <use href="#mosfet-base-shape" />
      <line x1="6" y1="-18" x2="6" y2="-7" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-2" x2="6" y2="9" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="14" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
    </g>
    <g id="mosfet-p-e-shape">
      <use href="#mosfet-base-shape-p" />
      <line x1="6" y1="-18" x2="6" y2="-7" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-2" x2="6" y2="9" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="14" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
    </g>

    <!-- ── Depletion Mode — N/P (solid channel — already conducts at VGS=0) ── -->
    <g id="mosfet-n-d-shape">
      <use href="#mosfet-base-shape" />
      <line x1="6" y1="-18" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
    </g>
    <g id="mosfet-p-d-shape">
      <use href="#mosfet-base-shape-p" />
      <line x1="6" y1="-18" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
    </g>

    <!-- ── Error variants — no substrate arrow; arrow(s) on the wrong
         lead(s) instead. All drawn on an enhancement (broken) channel —
         channel style doesn't affect validity, so it's kept fixed. ── -->
    <g id="mosfet-error-wronglead-in">
      <circle cx="7" cy="5" r="30" fill="var(--colour-panel)" style="stroke: var(--colour-mosfet)" stroke-width="2" filter="url(#glow)" />
      <line x1="-30" y1="24" x2="-3" y2="24" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <rect x="-4" y="-18" width="3" height="43" style="fill: var(--colour-mosfet)" />
      <line x1="6" y1="-18" x2="6" y2="-7" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-2" x2="6" y2="9" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="14" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-12" x2="25" y2="-12" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="25" y1="-11" x2="25" y2="-32" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="20" x2="25" y2="20" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="24" y1="3" x2="25" y2="40" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="3" x2="25" y2="3" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <polygon points="14,-16 14,-8 6,-12" style="fill: var(--colour-mosfet)" />
    </g>
    <g id="mosfet-error-wronglead-out">
      <circle cx="7" cy="5" r="30" fill="var(--colour-panel)" style="stroke: var(--colour-mosfet)" stroke-width="2" filter="url(#glow)" />
      <line x1="-30" y1="24" x2="-3" y2="24" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <rect x="-4" y="-18" width="3" height="43" style="fill: var(--colour-mosfet)" />
      <line x1="6" y1="-18" x2="6" y2="-7" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-2" x2="6" y2="9" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="14" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-12" x2="25" y2="-12" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="25" y1="-11" x2="25" y2="-32" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="20" x2="25" y2="20" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="24" y1="3" x2="25" y2="40" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="3" x2="25" y2="3" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <polygon points="17,-16 17,-8 25,-12" style="fill: var(--colour-mosfet)" />
    </g>
    <g id="mosfet-error-double-in">
      <circle cx="7" cy="5" r="30" fill="var(--colour-panel)" style="stroke: var(--colour-mosfet)" stroke-width="2" filter="url(#glow)" />
      <line x1="-30" y1="24" x2="-3" y2="24" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <rect x="-4" y="-18" width="3" height="43" style="fill: var(--colour-mosfet)" />
      <line x1="6" y1="-18" x2="6" y2="-7" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-2" x2="6" y2="9" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="14" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-12" x2="25" y2="-12" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="25" y1="-11" x2="25" y2="-32" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="20" x2="25" y2="20" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="24" y1="3" x2="25" y2="40" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="3" x2="25" y2="3" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <polygon points="14,-16 14,-8 6,-12" style="fill: var(--colour-mosfet)" />
      <polygon points="14,17 14,23 6,20" style="fill: var(--colour-mosfet)" />
    </g>
    <g id="mosfet-error-double-out">
      <circle cx="7" cy="5" r="30" fill="var(--colour-panel)" style="stroke: var(--colour-mosfet)" stroke-width="2" filter="url(#glow)" />
      <line x1="-30" y1="24" x2="-3" y2="24" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <rect x="-4" y="-18" width="3" height="43" style="fill: var(--colour-mosfet)" />
      <line x1="6" y1="-18" x2="6" y2="-7" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-2" x2="6" y2="9" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="14" x2="6" y2="25" style="stroke: var(--colour-mosfet)" stroke-width="3" />
      <line x1="6" y1="-12" x2="25" y2="-12" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="25" y1="-11" x2="25" y2="-32" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="20" x2="25" y2="20" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="24" y1="3" x2="25" y2="40" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <line x1="6" y1="3" x2="25" y2="3" style="stroke: var(--colour-mosfet)" stroke-width="2" />
      <polygon points="17,-16 17,-8 25,-12" style="fill: var(--colour-mosfet)" />
      <polygon points="17,17 17,23 25,20" style="fill: var(--colour-mosfet)" />
    </g>
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="var(--colour-bg)" />
  <text x="450" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">MOSFET SYMBOLS — MASTER REFERENCE</text>
  <text x="450" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>

  <text x="30" y="90" fill="var(--colour-text)" font-size="12" font-weight="bold">Valid</text>
  <g transform="translate(90,170) scale(1.4)">
    <use href="#mosfet-n-e-shape" />
    <text y="55" fill="#00ff99" font-size="10" text-anchor="middle">mosfet-n-e-shape ✓</text>
    <text y="68" fill="#5a7a9a" font-size="9" text-anchor="middle">(N, enhancement)</text>
  </g>
  <g transform="translate(270,170) scale(1.4)">
    <use href="#mosfet-n-d-shape" />
    <text y="55" fill="#00ff99" font-size="10" text-anchor="middle">mosfet-n-d-shape ✓</text>
    <text y="68" fill="#5a7a9a" font-size="9" text-anchor="middle">(N, depletion)</text>
  </g>
  <g transform="translate(450,170) scale(1.4)">
    <use href="#mosfet-p-e-shape" />
    <text y="55" fill="#00ff99" font-size="10" text-anchor="middle">mosfet-p-e-shape ✓</text>
    <text y="68" fill="#5a7a9a" font-size="9" text-anchor="middle">(P, enhancement)</text>
  </g>
  <g transform="translate(630,170) scale(1.4)">
    <use href="#mosfet-p-d-shape" />
    <text y="55" fill="#00ff99" font-size="10" text-anchor="middle">mosfet-p-d-shape ✓</text>
    <text y="68" fill="#5a7a9a" font-size="9" text-anchor="middle">(P, depletion)</text>
  </g>
  <g transform="translate(810,170) scale(1.4)">
    <use href="#mosfet-base-shape" />
    <text y="55" fill="var(--colour-text)" font-size="10" text-anchor="middle">mosfet-base-shape</text>
  </g>

  <text x="30" y="320" fill="var(--colour-text)" font-size="12" font-weight="bold">Invalid</text>
  <g transform="translate(140,400) scale(1.4)">
    <use href="#mosfet-error-wronglead-in" />
    <text y="55" fill="#ff3d9a" font-size="9" text-anchor="middle">wronglead-in ✗</text>
  </g>
  <g transform="translate(370,400) scale(1.4)">
    <use href="#mosfet-error-wronglead-out" />
    <text y="55" fill="#ff3d9a" font-size="9" text-anchor="middle">wronglead-out ✗</text>
  </g>
  <g transform="translate(600,400) scale(1.4)">
    <use href="#mosfet-error-double-in" />
    <text y="55" fill="#ff3d9a" font-size="9" text-anchor="middle">double-in ✗</text>
  </g>
  <g transform="translate(830,400) scale(1.4)">
    <use href="#mosfet-error-double-out" />
    <text y="55" fill="#ff3d9a" font-size="9" text-anchor="middle">double-out ✗</text>
  </g>
</svg>
</body>
</html>
