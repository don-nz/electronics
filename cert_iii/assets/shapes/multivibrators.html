<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multivibrator Shapes — Master Reference</title>
<style>html, body { margin: 0; background: #0a0d14; }</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for the multivibrator block
    diagrams (astable, monostable positive/negative edge) and a generic
    monostable IC wired with its timing resistor/capacitor. Extracted from
    UEEEC0069/term-2/knowledge/digital_knowledge_multivibrators.html and
    UEEEC0069/term-2/exercises/multivibrators/digital_monostable_timing_diagram.html
    (the quiz and the exercise each drew their own copy).

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page, because
    cross-file SVG <use> and fetch() are both blocked under file:// in
    Chromium (see ic-packages.html in this same folder for the full
    explanation). Keep this as the edit-here-first master copy.

    NOTES
      - The two monostable blocks come in a labelled form ("MONOSTABLE"
        across the top, as the exercise draws them) and, for the positive-
        edge block only, an unlabelled form (mv-mono-pos-block-nolabel).
        The quiz's Q5 deliberately omits the label because that question
        asks the student to identify the block; use the unlabelled one
        whenever the type is part of the question.
      - mv-mono-ic needs resistor-box-shape, cap-shape and junction-dot-shape
        (copied in below from circuit-components.html), plus the
        --colour-resistor-labels / --colour-capacitor-labels tokens.
      - The circuit uses 33k / 4.7µF as worked-example values; change the
        text to suit.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-panel: #0f1420;
        --colour-dff: #54c0ff;
        --colour-text: #c8d8e8;
        --colour-label: #5a7a9a;
        --colour-resistor: #00e5ff;
        --colour-resistor-labels: #e436de;
        --colour-capacitor: #3d7dff;
        --colour-capacitor-labels: #3d7dff;
        --colour-series: #00e5ff;
        --colour-supply: #ff4444;
        --colour-output-z: #67b8eb;
      }
    </style>

    <!-- ══ Basics copied from circuit-components.html (mv-mono-ic needs them to render) ══ -->

    <g id="resistor-box-shape">
      <rect x="-15" y="-40" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
    </g>

    <g id="cap-shape">
      <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
      <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
    </g>

    <g id="junction-dot-shape">
      <circle cx="0" cy="0" r="3" style="fill: var(--colour-series)" />
    </g>

    <!-- ══ Generic block outline and squarewave output icon ══ -->

    <g id="block-shape">
      <rect x="0" y="0" width="150" height="150" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
    </g>

    <g id="squarewave-icon">
      <polyline points="0,0 10,0 10,-25 30,-25 30,0 50,0 50,-25 60,-25" fill="none" style="stroke: var(--colour-output-z)" stroke-width="2" />
    </g>

    <!-- ══ ASTABLE — no input, one output carrying a squarewave ══ -->

    <g id="mv-astable-block">
      <use href="#block-shape" />
      <line x1="150" y1="75" x2="200" y2="75" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="270" y="65" text-anchor="end" font-size="18" font-weight="bold" style="fill: var(--colour-dff)">Output</text>
      <use href="#squarewave-icon" transform="translate(210,105)" />
    </g>

    <!-- ══ MONOSTABLE, positive-edge trigger — labelled (as the Q-builder exercise uses it) ══ -->

    <g id="mv-mono-pos-block">
     <g transform="translate(135,90)">
      <rect x="-75" y="-90" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <text x="0" y="-62" text-anchor="middle" font-size="15" font-weight="bold" style="fill: var(--colour-dff)">MONOSTABLE</text>
      <line x1="-135" y1="0" x2="-75" y2="0" style="stroke: var(--colour-dff)" stroke-width="2" />
      <path d="M -75 -15 L -55 0 L -75 15" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-48" y="7" font-size="18" font-weight="bold" style="fill: var(--colour-dff)">Trigger</text>
      <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>
      <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
     </g>
    </g>

    <!-- ══ MONOSTABLE, positive-edge trigger — NO label (the multivibrators quiz Q5 uses this one,
         since the question asks the student to identify the block) ══ -->

    <g id="mv-mono-pos-block-nolabel">
     <g transform="translate(135,90)">
      <rect x="-75" y="-90" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <line x1="-135" y1="0" x2="-75" y2="0" style="stroke: var(--colour-dff)" stroke-width="2" />
      <path d="M -75 -15 L -55 0 L -75 15" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-48" y="7" font-size="18" font-weight="bold" style="fill: var(--colour-dff)">Trigger</text>
      <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>
      <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
     </g>
    </g>

    <!-- ══ MONOSTABLE, negative-edge trigger (inversion bubble on Trigger) ══ -->

    <g id="mv-mono-neg-block">
     <g transform="translate(135,90)">
      <rect x="-75" y="-90" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <text x="0" y="-62" text-anchor="middle" font-size="15" font-weight="bold" style="fill: var(--colour-dff)">MONOSTABLE</text>
      <line x1="-135" y1="0" x2="-93" y2="0" style="stroke: var(--colour-dff)" stroke-width="2" />
      <circle cx="-84" cy="0" r="8" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <path d="M -75 -15 L -55 0 L -75 15" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="-48" y="7" font-size="18" font-weight="bold" style="fill: var(--colour-dff)">Trigger</text>
      <line x1="75" y1="-45" x2="135" y2="-45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="-34" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>
      <line x1="75" y1="45" x2="135" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="60" y="55" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
     </g>
    </g>

    <!-- ══ GENERIC MONOSTABLE IC, wired with its Rx/Cx timing components and CLR tied to +5 V.
         Deliberately NOT a specific part number's pinout. ══ -->

    <g id="mv-mono-ic">
      <!-- ════════════════════════════════════════════════════════════ -->
      <!-- ── SUPPLY RAIL ── -->
      <!-- ════════════════════════════════════════════════════════════ -->
      <line x1="120" y1="30" x2="250" y2="30" style="stroke: var(--colour-series)" stroke-width="2" />
      <text x="256" y="35" font-size="16" font-weight="bold" style="fill: var(--colour-supply)">+5 V</text>
      <circle cx="120" cy="30" r="5" style="fill: var(--colour-series)" />
      <circle cx="170" cy="30" r="5" style="fill: var(--colour-series)" />
    
      <!-- ════════════════════════════════════════════════════════════ -->
      <!-- ── CLR WIRE (rail down to the CLR pin) ── -->
      <!-- ════════════════════════════════════════════════════════════ -->
      <line x1="120" y1="30" x2="120" y2="184" style="stroke: var(--colour-series)" stroke-width="2" />
    
      <!-- ════════════════════════════════════════════════════════════ -->
      <!-- ── Rx VERTICAL (rail down to Rx/Cx pin) ── -->
      <!-- ════════════════════════════════════════════════════════════ -->
      <line x1="170" y1="30" x2="170" y2="200" style="stroke: var(--colour-series)" stroke-width="2" />
      <g transform="translate(170,85)">  <!-- ══ Rx ══ -->
        <use href="#resistor-box-shape" />
        <text x="-20" y="0" text-anchor="end" font-size="16" font-weight="bold" style="fill: var(--colour-resistor-labels)">Rx</text>
        <text x="46" y="0" text-anchor="end" font-size="16" font-weight="bold" style="fill: var(--colour-resistor-labels)">33k</text>
      </g>
    
      <!-- ════════════════════════════════════════════════════════════ -->
      <!-- ── Cx (from the Rx/Cx node across to the Cx pin) ── -->
      <!-- ════════════════════════════════════════════════════════════ -->
      <line x1="170" y1="150" x2="230" y2="150" style="stroke: var(--colour-series)" stroke-width="2" />
      <line x1="230" y1="150" x2="230" y2="200" style="stroke: var(--colour-series)" stroke-width="2" />
      <circle cx="170" cy="150" r="5" style="fill: var(--colour-series)" />
      <g transform="translate(200,150)">  <!-- ══ Cx ══ -->
        <use href="#cap-shape" />
        <text x="10" y="-4" font-size="14" font-weight="bold" style="fill: var(--colour-capacitor-labels)">+</text>
        <text x="0" y="-18" text-anchor="middle" font-size="16" font-weight="bold" style="fill: var(--colour-capacitor-labels)">Cx</text>
        <text x="0" y="32" text-anchor="middle" font-size="16" font-weight="bold" style="fill: var(--colour-capacitor-labels)">4.7µF</text>
      </g>
    
      <!-- ════════════════════════════════════════════════════════════ -->
      <!-- ── IC BODY ── -->
      <!-- ════════════════════════════════════════════════════════════ -->
      <rect x="100" y="200" width="150" height="110" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <!-- CLR pin (bubble = active-LOW) -->
      <circle cx="120" cy="192" r="8" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      <text x="120" y="228" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">CLR</tspan></text>
      <!-- Rx/Cx and Cx pins -->
      <text x="170" y="222" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">Rx/Cx</text>
      <text x="230" y="222" text-anchor="middle" font-size="13" font-weight="bold" style="fill: var(--colour-dff)">Cx</text>
      <!-- trigger input (positive edge, no bubble) -->
      <line x1="10" y1="255" x2="100" y2="255" style="stroke: var(--colour-dff)" stroke-width="2" />
      <path d="M 100 243 L 116 255 L 100 267" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="122" y="260" font-size="14" font-weight="bold" style="fill: var(--colour-dff)">TRIG</text>
      <text x="10" y="245" font-size="14" style="fill: var(--colour-label)">Trigger input</text>
      <!-- outputs -->
      <line x1="250" y1="245" x2="290" y2="245" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="240" y="250" text-anchor="end" font-size="18" font-weight="bold" style="fill: var(--colour-dff)">Q</text>
      <line x1="250" y1="290" x2="290" y2="290" style="stroke: var(--colour-dff)" stroke-width="2" />
      <text x="240" y="296" text-anchor="end" font-size="18" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>
      <text x="160" y="304" text-anchor="middle" font-size="11" style="fill: var(--colour-label)">MONOSTABLE IC</text>
    </g>
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="var(--colour-panel)" />
  <text x="480" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">MULTIVIBRATORS — MASTER REFERENCE</text>
  <text x="480" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>
  <g transform="translate(40,90)"><use href="#mv-astable-block" /></g>
  <text x="185" y="310" fill="var(--colour-text)" font-size="10" text-anchor="middle">mv-astable-block</text>
  <g transform="translate(360,90)"><use href="#mv-mono-pos-block" /></g>
  <text x="500" y="310" fill="var(--colour-text)" font-size="10" text-anchor="middle">mv-mono-pos-block</text>
  <g transform="translate(650,90)"><use href="#mv-mono-pos-block-nolabel" /></g>
  <text x="790" y="310" fill="var(--colour-text)" font-size="10" text-anchor="middle">mv-mono-pos-block-nolabel</text>
  <g transform="translate(40,350)"><use href="#mv-mono-neg-block" /></g>
  <text x="185" y="570" fill="var(--colour-text)" font-size="10" text-anchor="middle">mv-mono-neg-block</text>
  <g transform="translate(400,340)"><use href="#mv-mono-ic" /></g>
  <text x="560" y="680" fill="var(--colour-text)" font-size="10" text-anchor="middle">mv-mono-ic</text>
  <g transform="translate(790,420) scale(1.5)"><use href="#squarewave-icon" /></g>
  <text x="830" y="470" fill="var(--colour-text)" font-size="10" text-anchor="middle">squarewave-icon</text>

</svg>
</body>
</html>
