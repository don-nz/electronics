<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for passive/active circuit-element
    symbols (as opposed to test-equipment.svg, which covers the meters and
    scope used to MEASURE a circuit, and bjt-symbols.svg, which covers the
    transistor itself). Currently just two shapes, both from the AC-coupled
    amplifier quizzes (npn_quiz_2.html, pnp_quiz_2.html,
    pnp_troubleshoot_quiz_1.html) — add more circuit components here as new
    quizzes need them (an inductor, a diode, a second capacitor style, etc).

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page, because
    cross-file SVG <use> and fetch() are both blocked under file:// in
    Chromium (verified directly — see ic-packages.svg in this same folder
    for the full explanation). Keep this as the edit-here-first master copy.

    WIRING WORKFLOW — draw wires first, full length; components paint over
    them: when laying out a new circuit diagram, draw each rail as ONE
    continuous <line> running its whole length (e.g. VDD straight down to
    Common in a single line), rather than pre-cutting it into separate
    segments that stop and restart around every component along the way.
    Components are then drawn AFTER the wire in paint order (later in the
    SVG source = on top), and rely on their own OPAQUE fill —
    `fill: var(--colour-panel)`, matching the page background — to visually
    cover the stretch of wire passing behind them. That's why
    resistor-box-shape, cap-shape and cap-shape-vertical below all have a
    solid panel-coloured fill instead of `fill="none"`: it's not a styling
    preference, it's what makes this technique work. The same applies to
    the transistor body circles in bjt-symbols.svg/jfet-symbols.svg/
    mosfet-symbols.svg. Practical upshot: you never need to work out a
    component's own top/bottom pixel edge and split the wire to match it —
    draw the rail once, then place each component wherever it belongs along
    that rail, in any order, and its fill takes care of the rest.

    Uses the same CSS custom-property colour tokens as the live quiz pages
    (backed by a local :root block below), so a shape copies straight into
    a quiz's own defs with zero find/replace.

    cap-shape had a small divergence across its 3 source files — the
    background-mask rect behind the plate gap was x=-4/width=8 in
    npn_quiz_2.html and pnp_quiz_2.html, but x=-6/width=12 in
    pnp_troubleshoot_quiz_1.html (the plate lines themselves were identical
    in all three). This file uses the narrower version (2 of 3 files agree)
    as canonical — if pnp_troubleshoot_quiz_1.html's wider version was
    actually intentional for that circuit's layout, don't just overwrite it
    from here without checking why.

    diode-right/up/down/left added from a user-supplied reference HTML
    (plain 0-100 viewBox, currentColor, hand-coded per orientation). Rather
    than hand-copy 4 separate coordinate sets — the exact approach that
    produced a real bug in that reference (see below) — diode-right is the
    only hand-coded shape; the other 3 are pure transform="rotate(...)"
    wrappers around it, which is bug-proof by construction for a symmetric
    symbol like this. The reference's own "diode-down" had its cathode bar
    drawn at the ANODE (wide/base) end instead of the cathode (pointed
    apex) end — everywhere else in the reference the bar correctly sits
    against the apex, so this was a one-off coordinate slip in that one
    orientation, not a real alternate convention. Standard symbol: current
    flows from the flat/wide base (anode) through the pointed apex into
    the adjacent bar (cathode) and out the far lead — reproduced correctly
    here in all 4 orientations.

    led-fwd/led-rev, battery-shape, resistor-box-shape(-small),
    ground-shape(-small) and cap-shape-vertical were added in a follow-up
    sweep across every quiz file for generic reusable component shapes
    that had never made it into this master file — each had been
    redrawn inline, per-page, instead of centralised:
      - led-fwd/led-rev and battery-shape came from
        UEEEC0069/Reviews/digital_review_quiz_1_part1.html's own
        led-fwd/led-rev/fig5-battery (Figure 5's LED-orientation loops) —
        stripped of that page's own baked-in text labels ("D", "+", "E",
        "5V"), since a master shape should be label-free and let the
        consuming page add its own.
      - resistor-box-shape (full-size, 30×80) was never a named <g> at
        all anywhere — 31 BJT/JFET files each hand-draw an identical
        <rect width="30" height="80" rx="3"> inline per resistor
        (comp-R1/R2/RC/RE/etc.). resistor-box-shape-small (14×30)
        consolidates the separate "mres" icon-scale version used in 4
        "knowledge" quiz files.
      - ground-shape (full stem+3-bar) consolidates "gndGroup", identical
        across 9 BJT files. ground-shape-small (stem+2-bar) consolidates
        "mgnd" from the same 4 icon-scale files as resistor-box-shape-small.
      - cap-shape-vertical consolidates "mcap" (a 90°-rotated cousin of
        cap-shape, for vertical wire runs) — its own comment in the source
        files already called this out as a variant of cap-shape, so it
        belongs here alongside it rather than staying orphaned. Two of the
        4 source files diverged slightly on mcap's exact geometry (a plain
        rect+2 lines vs. an extra centre line); this file uses the
        simpler, more common version.
      - junction-dot-shape is new (a plain wire-junction dot) — every file
        that draws one just inlines a bare <circle>, so this just gives it
        a name for consistency; trivial enough that centralising it barely
        matters, but it costs nothing to have.
    None of these had a genuine reusable master shape before, and no
    conflicting FUNDAMENTALLY different geometry was found for any of
    them (only harmless scale/detail differences, noted above) — nothing
    here overwrites an intentional divergence the way the cap-shape note
    above warns about.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-panel: #0f1420;
        --colour-capacitor: #3d7dff;
        --colour-diode: #ff9933;
        --colour-gnd: #2f8f5b;
        --colour-resistor: #00e5ff;
        --colour-resistor-labels: #e436de;
        --colour-series: #00e5ff;
        --colour-signal: #ffd166;
        --colour-supply: #ff4444;
        --colour-text: #c8d8e8;
      }
    </style>

    <!-- ══ COUPLING CAPACITOR — two plates, reused for Cin and Cout ══ -->
    <g id="cap-shape">
      <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
      <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
    </g>

    <!-- ══ AC SIGNAL SOURCE — circle with one sine cycle ══ -->
    <g id="ac-source-shape">
      <circle cx="0" cy="0" r="24" fill="none" style="stroke: var(--colour-signal)" stroke-width="2" filter="url(#glow)" />
      <path d="M -16,0 C -11,-14 -5,-14 0,0 C 5,14 11,14 16,0" fill="none" style="stroke: var(--colour-signal)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- ══ DIODE — canonical orientation points right (anode on the left,
         cathode on the right; current flows left-to-right when forward
         biased). up/down/left are transform="rotate(...)" copies of this
         one shape, not separately hand-coded — see file comment. ══ -->
    <g id="diode-right">
      <line x1="-25" y1="0" x2="-10" y2="0" style="stroke: var(--colour-diode)" stroke-width="2" stroke-linecap="round" />
      <polygon points="-10,-12 -10,12 10,0" style="fill: var(--colour-diode)" filter="url(#glow)" />
      <line x1="10" y1="-12" x2="10" y2="12" style="stroke: var(--colour-diode)" stroke-width="2.5" />
      <line x1="10" y1="0" x2="25" y2="0" style="stroke: var(--colour-diode)" stroke-width="2" stroke-linecap="round" />
    </g>
    <g id="diode-down" transform="rotate(90)"><use href="#diode-right" /></g>
    <g id="diode-left" transform="rotate(180)"><use href="#diode-right" /></g>
    <g id="diode-up" transform="rotate(-90)"><use href="#diode-right" /></g>

    <!-- ══ LED — same diode triangle+bar as above, plus two "light rays"
         escaping the top corner. fwd = anode on top (lights when current
         flows top-to-bottom); rev = cathode on top (does not light for
         that same current direction). Label-free — add your own D/LED1/
         etc. text per instance. ══ -->
    <g id="led-fwd">
      <polygon points="-10,0 10,0 0,30" fill="none" style="stroke: var(--colour-diode)" stroke-width="2" />
      <line x1="-10" y1="30" x2="10" y2="30" style="stroke: var(--colour-diode)" stroke-width="2" />
      <line x1="14" y1="8" x2="21" y2="1" style="stroke: var(--colour-diode)" stroke-width="1.5" />
      <line x1="19" y1="14" x2="26" y2="7" style="stroke: var(--colour-diode)" stroke-width="1.5" />
    </g>
    <g id="led-rev">
      <line x1="-10" y1="20" x2="10" y2="20" style="stroke: var(--colour-diode)" stroke-width="2" />
      <polygon points="-10,50 10,50 0,20" fill="none" style="stroke: var(--colour-diode)" stroke-width="2" />
      <line x1="14" y1="28" x2="21" y2="21" style="stroke: var(--colour-diode)" stroke-width="1.5" />
      <line x1="19" y1="34" x2="26" y2="27" style="stroke: var(--colour-diode)" stroke-width="1.5" />
    </g>

    <!-- ══ BATTERY CELL — long thin line (+) over a short thick line (−).
         Label-free — add your own +/E/voltage text per instance. ══ -->
    <g id="battery-shape">
      <line x1="-12" y1="0" x2="12" y2="0" style="stroke: var(--colour-supply)" stroke-width="3" />
      <line x1="-6" y1="10" x2="6" y2="10" style="stroke: var(--colour-supply)" stroke-width="1.5" />
    </g>

    <!-- ══ RESISTOR — box style (the only style this project uses; no
         zigzag anywhere). Full-size consolidates 31 files' identical
         inline rect; -small consolidates the separate icon-scale "mres".
         Both are unlabelled outlines — add name/value text per instance. ══ -->
    <g id="resistor-box-shape">
      <rect x="-15" y="-40" width="30" height="80" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
    </g>
    <g id="resistor-box-shape-small">
      <rect x="-7" y="-15" width="14" height="30" rx="2" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="1.5" />
    </g>

    <!-- ══ GROUND SYMBOL — stem + 3 tiered bars. Anchored at (0,0) = the
         TOP of the stem, i.e. where the wire connects — position this
         shape's origin directly at the node it grounds. -small
         consolidates the separate icon-scale "mgnd" (stem + 2 bars). ══ -->
    <g id="ground-shape">
      <line x1="0" y1="0" x2="0" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
      <line x1="-14" y1="15" x2="14" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
      <line x1="-9" y1="20" x2="9" y2="20" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
      <line x1="-4" y1="25" x2="4" y2="25" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
    </g>
    <g id="ground-shape-small">
      <line x1="0" y1="0" x2="0" y2="6" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
      <line x1="-9" y1="6" x2="9" y2="6" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
      <line x1="-5.5" y1="10" x2="5.5" y2="10" style="stroke: var(--colour-gnd)" stroke-width="1.2" />
      <line x1="-2.5" y1="14" x2="2.5" y2="14" style="stroke: var(--colour-gnd)" stroke-width="1.2" />
    </g>

    <!-- ══ CAPACITOR — vertical-insertion variant of cap-shape above, for
         a capacitor sitting in a vertical wire run instead of horizontal. ══ -->
    <g id="cap-shape-vertical">
      <rect x="-12" y="-4" width="24" height="8" style="fill: var(--colour-panel)" />
      <line x1="-12" y1="-4" x2="12" y2="-4" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
      <line x1="-12" y1="4" x2="12" y2="4" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
    </g>

    <!-- ══ WIRE JUNCTION DOT — marks a genuine electrical connection where
         two drawn wires cross (as opposed to two wires just visually
         crossing with no connection). ══ -->
    <g id="junction-dot-shape">
      <circle cx="0" cy="0" r="3" style="fill: var(--colour-series)" />
    </g>
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="var(--colour-panel)" />
  <text x="480" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">CIRCUIT COMPONENTS — MASTER REFERENCE</text>
  <text x="480" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>

  <!-- 3 columns (x = 190/480/770), each swatch is <use> + a label ~30-65px below it — row y is the shape's own centre. -->

  <!-- Row 1: capacitors + AC source -->
  <g transform="translate(190,140) scale(2)"><use href="#cap-shape" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">cap-shape</text></g>
  <g transform="translate(480,140) scale(2)"><use href="#cap-shape-vertical" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">cap-shape-vertical</text></g>
  <g transform="translate(770,140) scale(1.6)"><use href="#ac-source-shape" /><text y="55" fill="var(--colour-text)" font-size="9" text-anchor="middle">ac-source-shape</text></g>

  <!-- Row 2: battery + 2 diode orientations -->
  <g transform="translate(190,270) scale(2)"><use href="#battery-shape" /><text y="30" fill="var(--colour-text)" font-size="9" text-anchor="middle">battery-shape</text></g>
  <g transform="translate(480,270) scale(1.4)"><use href="#diode-right" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">diode-right</text></g>
  <g transform="translate(770,270) scale(1.4)"><use href="#diode-down" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">diode-down</text></g>

  <!-- Row 3: remaining 2 diode orientations + LED fwd -->
  <g transform="translate(190,400) scale(1.4)"><use href="#diode-left" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">diode-left</text></g>
  <g transform="translate(480,400) scale(1.4)"><use href="#diode-up" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">diode-up</text></g>
  <g transform="translate(770,400) scale(1.4)"><use href="#led-fwd" /><text y="65" fill="var(--colour-text)" font-size="9" text-anchor="middle">led-fwd</text></g>

  <!-- Row 4: LED rev + resistors -->
  <g transform="translate(190,540) scale(1.4)"><use href="#led-rev" /><text y="65" fill="var(--colour-text)" font-size="9" text-anchor="middle">led-rev</text></g>
  <g transform="translate(480,550)"><use href="#resistor-box-shape" /><text y="60" fill="var(--colour-text)" font-size="9" text-anchor="middle">resistor-box-shape</text></g>
  <g transform="translate(770,550) scale(2)"><use href="#resistor-box-shape-small" /><text y="30" fill="var(--colour-text)" font-size="9" text-anchor="middle">resistor-box-shape-small</text></g>

  <!-- Row 5: ground symbols + junction dot -->
  <g transform="translate(190,700) scale(2)"><use href="#ground-shape" /><text y="30" fill="var(--colour-text)" font-size="9" text-anchor="middle">ground-shape</text></g>
  <g transform="translate(480,700) scale(3)"><use href="#ground-shape-small" /><text y="20" fill="var(--colour-text)" font-size="9" text-anchor="middle">ground-shape-small</text></g>
  <g transform="translate(770,700) scale(2.5)"><use href="#junction-dot-shape" /><text y="20" fill="var(--colour-text)" font-size="9" text-anchor="middle">junction-dot-shape</text></g>
</svg>
