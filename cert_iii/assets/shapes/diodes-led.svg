<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" font-family="'Share Tech Mono', monospace">
  <!--
    MASTER SHAPE FILE — canonical source for diode and LED schematic
    symbols. Split out of circuit-components.svg (which now covers the
    remaining passive/misc components — caps, battery, resistor box,
    ground, junction dot) into its own file, since diode/LED had grown
    into 8 shapes between them (4 rotations each) and deserved their own
    dedicated reference rather than sharing one increasingly-long sheet.

    This is a REFERENCE file only — edit the shapes here, then copy the
    <defs> block (or the specific <g> entries you need) into any quiz page
    that uses them. It is NOT included at runtime by any quiz page, because
    cross-file SVG <use> and fetch() are both blocked under file:// in
    Chromium (verified directly — see ic-packages.svg in this same folder
    for the full explanation). Keep this as the edit-here-first master copy.

    Uses the same CSS custom-property colour tokens as the live quiz pages
    (backed by a local :root block below), so a shape copies straight into
    a quiz's own defs with zero find/replace.

    Both families follow the same hand-code-one-derive-the-rest pattern:
    ONE canonical orientation is hand-coded, the other 3 are pure
    transform="rotate(...)" copies of it — bug-proof by construction for a
    symmetric symbol like this, deliberately avoiding hand-copying 4
    separate coordinate sets (see each shape's own comment below for a
    real bug that approach produced once, in the diode family's own
    original source reference).

    diode-right/up/down/left — added from a user-supplied reference HTML
    (plain 0-100 viewBox, currentColor, hand-coded per orientation).
    diode-right is the only hand-coded shape; up/down/left are
    transform="rotate(...)" copies. The reference's own "diode-down" had
    its cathode bar drawn at the ANODE (wide/base) end instead of the
    cathode (pointed apex) end — everywhere else in the reference the bar
    correctly sits against the apex, so this was a one-off coordinate slip
    in that one orientation, not a real alternate convention. Standard
    symbol: current flows from the flat/wide base (anode) through the
    pointed apex into the adjacent bar (cathode) and out the far lead —
    reproduced correctly here in all 4 orientations.

    led-up/right/down/left — filled triangle + cathode bar + 2 arrow-style
    light rays, leads on both ends. led-up is the only hand-coded shape,
    its coordinates copied verbatim from
    ../../UEEEC0069/Reviews/digital_review_quiz_1_part1.html's own
    led-body-rev (that page's Q29 already visually verified this exact
    geometry, so reusing its numbers as-is carries zero transcription
    risk); right/down/left are rotate() copies. Bar/apex marks the
    CATHODE end — current flows from the plain-lead end THROUGH the bar
    to light it. led-up conducts (lights) on BOTTOM-to-TOP current — the
    wide base (anode) sits at the bottom (y=70), the pointed apex/cathode
    bar sits at the top (y=30), so the triangle's own point direction
    already reads as "up," the same way its forward-current direction
    does — standard diode symbol reading, arrow points the way current
    flows when forward biased. led-right therefore lights on
    left-to-right current, matching diode-right's own left-to-right
    convention exactly (same rotate() angles, same resulting direction,
    for both families).

    led-up's artwork is drawn in its original 0-100 coordinate space
    (unchanged from the quiz page), wrapped in translate(-50,-50) so its
    visual centre lands on the shape's own local origin — required for
    rotate() to pivot in place rather than swinging the shape out around
    the SVG's (0,0) corner, the way diode-right's own already-centred
    (-25..25) coordinates get for free — then scale(0.5) on the outside
    of that (applied first, since SVG transforms compose right-to-left)
    to bring its footprint down from a 60×100 bounding box to 30×50,
    roughly matching diode-right's own ~50×24 footprint in overall
    area/visual weight. The original quiz page draws this LED much larger
    than a diode on its own circuit diagram, which is fine there, but a
    master shape meant to sit alongside diode-right at the same scale(1)
    needs a comparable size.

    Both families are label-free — add your own D/LED1/etc. text per
    instance in the consuming quiz page, same convention as every other
    shape in this project's master files.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      :root {
        --colour-diode: #ff9933;
        --colour-bg: #0a0d14;
        --colour-text: #c8d8e8;
      }
    </style>

    <!-- ══ DIODE — canonical orientation points right (anode on the left,
         cathode on the right; current flows left-to-right when forward
         biased). up/down/left are transform="rotate(...)" copies of this
         one shape, not separately hand-coded — see file comment. ══ -->
    <g id="diode-right">
      <line x1="-25" y1="0" x2="-10" y2="0" style="stroke: var(--colour-diode)" stroke-width="2" stroke-linecap="round" />
      <polygon points="-10,-12 -10,12 10,0" style="fill: var(--colour-diode)" filter="url(#glow)" />
      <line x1="10" y1="-12" x2="10" y2="12" style="stroke: var(--colour-diode)" stroke-width="2.5" />
      <line x1="10" y1="0" x2="25" y2="0" style="stroke: var(--colour-diode)" stroke-width="2" stroke-linecap="round" />
    </g>
    <g id="diode-down" transform="rotate(90)"><use href="#diode-right" /></g>
    <g id="diode-left" transform="rotate(180)"><use href="#diode-right" /></g>
    <g id="diode-up" transform="rotate(-90)"><use href="#diode-right" /></g>

    <!-- ══ LED — filled triangle + cathode bar + 2 arrow-style light rays,
         leads on both ends — see file comment for the full geometry/
         sizing explanation. ══ -->
    <g id="led-up">
      <g transform="scale(0.5) translate(-50,-50)">
        <line x1="50" y1="100" x2="50" y2="70" stroke="var(--colour-diode)" stroke-width="6" stroke-linecap="round" />
        <line x1="50" y1="30" x2="50" y2="0" stroke="var(--colour-diode)" stroke-width="6" stroke-linecap="round" />
        <polygon points="50,30 20,70 80,70" fill="var(--colour-diode)" />
        <line x1="20" y1="30" x2="80" y2="30" stroke="var(--colour-diode)" stroke-width="6" stroke-linecap="round" />
        <path d="M 62 54 L 78 38 M 78 38 L 70 38 M 78 38 L 78 46" stroke="var(--colour-diode)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 72 64 L 88 48 M 88 48 L 80 48 M 88 48 L 88 56" stroke="var(--colour-diode)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
    </g>
    <g id="led-right" transform="rotate(90)"><use href="#led-up" /></g>
    <g id="led-down" transform="rotate(180)"><use href="#led-up" /></g>
    <g id="led-left" transform="rotate(-90)"><use href="#led-up" /></g>
  </defs>

  <!-- ══════════════════ Visible reference sheet ══════════════════ -->
  <rect width="100%" height="100%" fill="var(--colour-bg)" />
  <text x="510" y="28" fill="#00e5ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">DIODES &amp; LEDS — MASTER REFERENCE</text>
  <text x="510" y="46" fill="#5a7a9a" font-size="10" text-anchor="middle">Edit here first, then copy the &lt;defs&gt; into any quiz page that needs them (see file comment)</text>

  <!-- 4 columns (x = 150/390/630/870), each swatch is <use> + a label ~45-65px below it — row y is the shape's own centre. -->

  <!-- Row 1: all 4 diode orientations -->
  <g transform="translate(150,180) scale(1.4)"><use href="#diode-right" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">diode-right</text></g>
  <g transform="translate(390,180) scale(1.4)"><use href="#diode-down" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">diode-down</text></g>
  <g transform="translate(630,180) scale(1.4)"><use href="#diode-left" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">diode-left</text></g>
  <g transform="translate(870,180) scale(1.4)"><use href="#diode-up" /><text y="45" fill="var(--colour-text)" font-size="9" text-anchor="middle">diode-up</text></g>

  <!-- Row 2: all 4 LED orientations -->
  <g transform="translate(150,380) scale(1.4)"><use href="#led-up" /><text y="65" fill="var(--colour-text)" font-size="9" text-anchor="middle">led-up</text></g>
  <g transform="translate(390,380) scale(1.4)"><use href="#led-right" /><text y="65" fill="var(--colour-text)" font-size="9" text-anchor="middle">led-right</text></g>
  <g transform="translate(630,380) scale(1.4)"><use href="#led-down" /><text y="65" fill="var(--colour-text)" font-size="9" text-anchor="middle">led-down</text></g>
  <g transform="translate(870,380) scale(1.4)"><use href="#led-left" /><text y="65" fill="var(--colour-text)" font-size="9" text-anchor="middle">led-left</text></g>
</svg>
