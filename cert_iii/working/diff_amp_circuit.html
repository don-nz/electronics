<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../assets/theme-init.js"></script>
  <title>Diff Amp Circuit</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/quiz-common.css">
</head>

<body>
<div class="crumb" id="crumb" data-current="Quiz 1"></div>
  <header>
    <h1>Diff Amp Circuit</h1>
    <p>AC Analysis · Coupling</p>
  </header>

        <svg id="circuitSvg" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg"
          font-family="'Share Tech Mono',monospace" shape-rendering="crispEdges">

          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      BASE SHAPES                             -->
<!-- ════════════════════════════════════════════════════════════ -->
            <!-- ════════════════════════════════════════════════════════ -->
            <!-- ── NPN BJT SHAPE ── -->
            <!-- ════════════════════════════════════════════════════════ -->
            <g id="bjt-npn-shape">
              <circle cx="7" cy="0" r="24" fill="var(--colour-panel)" style="stroke: var(--colour-bjt)" stroke-width="2"
                filter="url(#glow)" />
              <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
              <!-- base lead -->
              <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
              <!-- base bar -->
              <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
              <!-- collector -->
              <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
              <!-- emitter -->
              <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
              <!-- NPN arrow, pointing away from base -->
            </g>

            <g id="ground-shape">
              <line x1="0" y1="0" x2="0" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
              <line x1="-14" y1="15" x2="14" y2="15" style="stroke: var(--colour-gnd)" stroke-width="2" />
              <line x1="-9" y1="20" x2="9" y2="20" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
              <line x1="-4" y1="25" x2="4" y2="25" style="stroke: var(--colour-gnd)" stroke-width="1.5" />
            </g>

            <!-- ════════════════════════════════════════════════════════ -->
            <!-- ── RESISTOR SHAPES ── -->
            <!-- ════════════════════════════════════════════════════════ -->
             <g id="resistor-vertical">
              <rect x="-15" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)"
                stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
            </g>
             <g id="resistor-horizontal">
              <rect x="-40" y="-15" width="80" height="30" rx="3" style="fill: var(--colour-panel)"
                stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
            </g>

            <g id="trimpot-horizontal">
              <rect x="-40" y="15" width="80" height="4" style="fill: var(--colour-panel)" />
              <use href="#resistor-horizontal" />
              <line x1="-20" y1="20" x2="20" y2="20" style="stroke: var(--colour-resistor)" stroke-width="2" />
            </g>

            <!-- ════════════════════════════════════════════════════════ -->
            <!-- ── CAPACITOR SHAPE ── -->
            <!-- ════════════════════════════════════════════════════════ -->
            <g id="cap-shape">
              <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
              <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
              <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
            </g>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      BASE DIFF AMP CIRCUIT                   -->
<!-- ════════════════════════════════════════════════════════════ -->
            <g id="base-diff-amp-circuit">
              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── TOP HORIZONTAL ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="50" y1="20" x2="535" y2="20" style="stroke: var(--colour-series)" stroke-width="2" />

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── OUTPUT HORIZONTALS ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="100" y1="190" x2="200" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="200" cy="190" r="5" style="fill: var(--colour-series)" />

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── INPUT HORIZONTALS ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="50" y1="255" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" />
              <text x="50" y="240" style="fill: var(--colour-signal)" text-anchor="start" font-size="15"
                font-weight="bold">Input 1</text>

              <line x1="400" y1="255" x2="535" y2="255" style="stroke: var(--colour-series)" stroke-width="2" />
              <text x="480" y="240" style="fill: var(--colour-signal)" text-anchor="start" font-size="15"
                font-weight="bold">Input 2</text>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── RB1/RB2 VERTICALS TO FLOATING GROUND SYMBOLS ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="100" y1="255" x2="100" y2="415" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="100" cy="255" r="5" style="fill: var(--colour-series)" />
              <g transform="translate(100,300)"> 
                <use href="#resistor-vertical" />
                <text x="-35" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">RB1</text>
                <text id="value-rb1" x="40" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">39kΩ</text>
              </g>  
              <use href="#ground-shape" transform="translate(100,415)" />

              <line x1="485" y1="255" x2="485" y2="415" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="485" cy="255" r="5" style="fill: var(--colour-series)" />
              <g transform="translate(485,330)">
                <use href="#resistor-vertical" />
                <text x="-35" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">RB2</text>
                <text id="value-rb2" x="40" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">39kΩ</text>
              </g>
              <use href="#ground-shape" transform="translate(485,415)" />

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── BJT JOIN HORIZONTAL & 2 VERICALS ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="200" y1="255" x2="200" y2="310" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="380" y1="255" x2="380" y2="310" style="stroke: var(--colour-series)" stroke-width="2" />
              <line x1="200" y1="310" x2="380" y2="310" style="stroke: var(--colour-series)" stroke-width="2" />
        

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── RE VERTICAL  ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="290" y1="310" x2="290" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="290" cy="310" r="5" style="fill: var(--colour-series)" />

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── RC1 VERTICAL (TOP rail down to BJT) ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="200" y1="20" x2="200" y2="255" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="200" cy="20" r="5" style="fill: var(--colour-series)" />
              <g transform="translate(200,60)"> 
                <use href="#resistor-vertical" />
                <text x="-35" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">RC1</text>
                <text id="value-rc1" x="40" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">5.6kΩ</text>
              </g>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── RC2 VERTICAL (TOP rail down to BJT) ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="380" y1="20" x2="380" y2="255" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="380" cy="20" r="5" style="fill: var(--colour-series)" />
              <g transform="translate(380,60)">
                <use href="#resistor-vertical" />
                <text x="-35" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">RC2</text>
                <text id="value-rc2" x="40" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">5.6kΩ</text>
              </g>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── Q1 & Q2 — NPN ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <g transform="translate(186,255)">
                <use href="#bjt-npn-shape" />
              </g>
              <g transform="translate(394,255) scale(-1, 1)">
                <use href="#bjt-npn-shape" />
              </g>
            </g>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      2 BJT CIRCUIT                           -->
<!-- ════════════════════════════════════════════════════════════ -->
            <g id="base-diff-amp-2-bjt">
              <use href="#base-diff-amp-circuit" />

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── BOTTOM HORIZONTAL ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="50" y1="535" x2="535" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="290" cy="535" r="5" style="fill: var(--colour-series)" />

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── OUTPUTS (2 Output lines labeled 2 & 2) ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <text x="100" y="175" style="fill: var(--colour-signal)" text-anchor="start" font-size="15"
                font-weight="bold">Output 1</text>

              <line x1="380" y1="190" x2="480" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="380" cy="190" r="5" style="fill: var(--colour-series)" />
              <text x="418" y="175" style="fill: var(--colour-signal)" text-anchor="start" font-size="15"
                font-weight="bold">Output 2</text>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── TOP VCC LABEL ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <g id="topLabelGroup" transform="translate(535,-5)">
                <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15"
                  font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
                <text id="vccValue" x="30" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14"
                  font-weight="bold">+15V</text>
              </g>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── BOTTOM VCC LABEL ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <g id="bottomLabelGroup" transform="translate(535,540)">
                <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15"
                  font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
                <text id="vccValue" x="30" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14"
                  font-weight="bold">-15V</text>
              </g>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── RE ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <g transform="translate(290,370)">
                <use href="#resistor-vertical" />
                <text x="-35" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">RE</text>
                <text id="value-re" x="40" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">8.2kΩ</text>
              </g>
            </g>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      2 BJT CIRCUIT DC BALANCED               -->
<!-- ════════════════════════════════════════════════════════════ -->
            <g id="diff-amp-common-re-dc-balance">
              <use href="#base-diff-amp-2-bjt" />
              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── TRIMPOT ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <g transform="translate(290,310)">  <!-- ══ RCn ══ -->
                <use href="#trimpot-horizontal" />
                <text x="0" y="-30" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">RV1</text>
              </g>
            </g>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      3 BJT CIRCUIT                           -->
<!-- ════════════════════════════════════════════════════════════ -->
            <g id="base-diff-amp-3-bjt">
              <use href="#base-diff-amp-circuit" />

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── EXTEND RE VERTICAL  ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="290" y1="535" x2="290" y2="700" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="290" cy="310" r="5" style="fill: var(--colour-series)" />

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── BOTTOM HORIZONTAL ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="50" y1="700" x2="535" y2="700" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="290" cy="700" r="5" style="fill: var(--colour-series)" />
              <g id="bottomLabelGroup" transform="translate(535,700)">
                <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15"
                  font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
                <text id="vccValue" x="30" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14"
                  font-weight="bold">-15V</text>
              </g>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── OUTPUTS (1 Output line) ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <text x="100" y="175" style="fill: var(--colour-signal)" text-anchor="start" font-size="15"
                font-weight="bold">Output</text>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── TOP VCC LABEL ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <g id="topLabelGroup" transform="translate(535,-5)">
                <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15"
                  font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
                <text id="vccValue" x="30" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14"
                  font-weight="bold">+15V</text>
              </g>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── Q3 — NPN ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <g transform="translate(276,480)">
                <use href="#bjt-npn-shape" />
              </g>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── RE ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <g transform="translate(290,550)">
                <use href="#resistor-vertical" />
                <text x="-35" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">RE</text>
                <text id="value-re" x="40" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">8.2kΩ</text>
              </g>

              <!-- ════════════════════════════════════════════════════════ -->
              <!-- ── BASE OUTPUT THROUGH RESISTOR AND TO GROUND SYMBOL ── -->
              <!-- ════════════════════════════════════════════════════════ -->
              <line x1="200" y1="255" x2="200" y2="310" style="stroke: var(--colour-series)" stroke-width="2" />


            </g>

          </defs>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      DISPLAY CIRCUIT                         -->
<!-- ════════════════════════════════════════════════════════════ -->
          <g transform="scale(0.4)">
            <use href="#base-diff-amp-3-bjt" />

            <!-- ══ XY RULER (dev tool, off by default) ══ -->
            <g id="xyRuler" display="none"></g>
          </g>

        </svg>

</body>

</html>
