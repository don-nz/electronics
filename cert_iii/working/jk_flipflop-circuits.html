<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../assets/theme-init.js"></script>
  <title>Diff Amp Circuit</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/quiz-common.css">
</head>

<body>
<div class="crumb" id="crumb" data-current="Quiz 1"></div>
  <header>
    <h1>Diff Amp Circuit</h1>
    <p>AC Analysis · Coupling</p>
  </header>

        <svg id="circuitSvg" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg"
          font-family="'Share Tech Mono',monospace" shape-rendering="crispEdges">

          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      BASE SHAPES                             -->
<!-- ════════════════════════════════════════════════════════════ -->
      <g id="base-jk-shape" >
        <rect x="60" y="0" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
        <line x1="0" y1="30" x2="60" y2="30" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="75" y="41" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">J</text>
        <line x1="0" y1="90" x2="60" y2="90" style="stroke: var(--colour-dff)" stroke-width="2" />
        <path d="M 60 75 L 80 90 L 60 105" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="87" y="97" font-size="20" font-weight="bold" style="fill: var(--colour-dff)">CLK</text>
        <line x1="0" y1="150" x2="60" y2="150" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="75" y="161" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">K</text>
        <line x1="210" y1="45" x2="270" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="195" y="56" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">Q</text>
        <line x1="210" y1="135" x2="270" y2="135" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="195" y="145" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">Q</tspan></text>     
      </g>

      <g id="not-dot">
        <circle cx="0" cy="0" r="8" fill="var(--colour-panel)" style="stroke: var(--colour-dff)" stroke-width="2" filter="url(#glow)" />
      </g>

      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ── FLIP FLOP VARIATIONS ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="jk-pos-edge-iec">
        <use href="#base-jk-shape" />
      </g>
      
      <!-- ══ J-K FLIP-FLOP BODY, IEC (negative edge) ══ -->
      <g id="jk-neg-edge-iec">
         <use href="#base-jk-shape" />
         <use href="#not-dot" transform="translate(52,90)" />
      </g>

      <!-- ══ PRESET/CLEAR EXTENSION - Q5 ══ -->
      <g id="dff-al-pre-clr" transform="translate(0,60)">
        <use href="#base-jk-shape" />
        <line x1="135" y1="0" x2="135" y2="-50" style="stroke: var(--colour-dff)" stroke-width="2" />
        <use href="#not-dot" transform="translate(135,-8)" />
        <text x="135" y="30" text-anchor="middle" font-size="20" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">PRE</tspan></text>
        <line x1="135" y1="180" x2="135" y2="230" style="stroke: var(--colour-dff)" stroke-width="2" />
        <use href="#not-dot" transform="translate(135,188)" />
        <text x="135" y="172" text-anchor="middle" font-size="20" font-weight="bold" style="fill: var(--colour-dff)"><tspan style="text-decoration: overline">CLR</tspan></text>
      </g>

      <!-- ══ J & K both always ON - Q6 ══ -->
      <g id="jk-pos-edge-iec-jk-on" transform="translate(30,60)">
        <use href="#base-jk-shape" />
        <text x="-30" y="36" font-size="15" font-weight="bold" style="fill: var(--colour-supply)">+5V</text>
        <text x="-30" y="156" font-size="15" font-weight="bold" style="fill: var(--colour-supply)">+5V</text>
      </g>
      </defs>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      DISPLAY CIRCUIT                         -->
<!-- ════════════════════════════════════════════════════════════ -->
          <g transform="scale(0.4)">
            <use href="#dff-al-pre-clr" />

            <!-- ══ XY RULER (dev tool, off by default) ══ -->
            <g id="xyRuler" display="none"></g>
          </g>

        </svg>

</body>

</html>
