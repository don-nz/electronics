<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../assets/theme-init.js"></script>
  <title>Diff Amp Circuit</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/quiz-common.css">
</head>

<body>
  <div class="crumb" id="crumb" data-current="Quiz 1"></div>
  <header>
    <h1>Circuit builder page</h1>
  </header>

  <svg id="circuitSvg" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg"
    font-family="'Share Tech Mono',monospace" shape-rendering="crispEdges">

    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- ════════════════════════════════════════════════════════════ -->
      <!--                      BASE SHAPES                             -->
      <!-- ════════════════════════════════════════════════════════════ -->
      <!-- ══ base-jk-shape ══ -->
      <g id="base-jk-shape">
        <rect x="60" y="0" width="150" height="180" rx="4" fill="none" style="stroke: var(--colour-dff)"
          stroke-width="2" filter="url(#glow)" />
        <line x1="0" y1="30" x2="60" y2="30" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="75" y="41" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">J</text>
        <line x1="0" y1="90" x2="60" y2="90" style="stroke: var(--colour-dff)" stroke-width="2" />
        <path d="M 60 75 L 80 90 L 60 105" fill="none" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="87" y="97" font-size="20" font-weight="bold" style="fill: var(--colour-dff)">CLK</text>
        <line x1="0" y1="150" x2="60" y2="150" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="75" y="161" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">K</text>
        <line x1="210" y1="45" x2="270" y2="45" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="195" y="56" text-anchor="end" font-size="25" font-weight="bold"
          style="fill: var(--colour-dff)">Q</text>
        <line x1="210" y1="135" x2="270" y2="135" style="stroke: var(--colour-dff)" stroke-width="2" />
        <text x="195" y="145" text-anchor="end" font-size="25" font-weight="bold" style="fill: var(--colour-dff)">
          <tspan style="text-decoration: overline">Q</tspan>
        </text>
      </g>

      <!-- ══ not-dot ══ -->
      <g id="not-dot">
        <circle cx="0" cy="0" r="8" fill="var(--colour-panel)" style="stroke: var(--colour-dff)" stroke-width="2"
          filter="url(#glow)" />
      </g>


      <!-- ══ logic gates ══ -->

      <!-- ── shared leads ── -->
      <g id="gate-lead-in2">
        <line x1="0" y1="8" x2="16" y2="8" stroke="var(--colour-bjt)" stroke-width="2" />
        <line x1="0" y1="24" x2="16" y2="24" stroke="var(--colour-bjt)" stroke-width="2" />
      </g>
      <g id="gate-lead-in1">
        <line x1="0" y1="16" x2="16" y2="16" stroke="var(--colour-bjt)" stroke-width="2" />
      </g>
      <g id="gate-lead-in2-or">
        <line x1="0" y1="8" x2="19.4" y2="8" stroke="var(--colour-bjt)" stroke-width="2" />
        <line x1="0" y1="24" x2="19.4" y2="24" stroke="var(--colour-bjt)" stroke-width="2" />
      </g>
      <g id="gate-lead-out">
        <line x1="48" y1="16" x2="68" y2="16" stroke="var(--colour-bjt)" stroke-width="2" />
      </g>
      <g id="gate-lead-out-inv">
        <circle cx="52" cy="16" r="4" fill="var(--colour-panel)" stroke="var(--colour-bjt)" stroke-width="2"
          filter="url(#glow)" />
        <line x1="56" y1="16" x2="68" y2="16" stroke="var(--colour-bjt)" stroke-width="2" />
      </g>

      <!-- ── shared bodies ── -->
      <path id="gate-and-body" d="M 16,0 L 32,0 A 16,16 0 0 1 32,32 L 16,32 Z" fill="none" stroke="var(--colour-bjt)"
        stroke-width="2" filter="url(#glow)" />
      <path id="gate-or-body" d="M 16,0 Q 32,0 48,16 Q 32,32 16,32 Q 25,16 16,0 Z" fill="none"
        stroke="var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />

      <!-- ── AND / NAND ── -->
      <g id="gate-nand-trad">
        <use href="#gate-lead-in2" />
        <use href="#gate-and-body" />
        <use href="#gate-lead-out-inv" />
      </g>

      <!-- ── OR / NOR ── -->
      <g id="gate-nor-trad">
        <use href="#gate-lead-in2-or" />
        <use href="#gate-or-body" />
        <use href="#gate-lead-out-inv" />
      </g>

      <!-- ── base flip-flop internal ── -->
      <g id="base-flipflop-internal">
        <!-- top gate inputs  -->
        <text x="-10" y="13" font-size="14" font-weight="bold" text-decoration="none"
          style="fill: var(--colour-ui-primary); text-anchor: left;">S</text>
        <line x1="0" y1="8" x2="20" y2="8" stroke="var(--colour-series)" stroke-width="2" />
        <line x1="10" y1="24" x2="20" y2="24" stroke="var(--colour-series)" stroke-width="2" />
        <!-- top gate output  -->
        <line x1="88" y1="16" x2="120" y2="16" stroke="var(--colour-series)" stroke-width="2" />
        <text x="125" y="20" font-size="14" font-weight="bold"
          style="fill: var(--colour-ui-primary); text-anchor: left;">Q</text>

        <!-- top output to bottom input -->
        <line x1="10" y1="23" x2="10" y2="45" stroke="var(--colour-series)" stroke-width="2" />
        <line x1="9.5" y1="44" x2="100.5" y2="70" stroke="var(--colour-series)" stroke-width="2" />
        <line x1="100" y1="69.3" x2="100" y2="96" stroke="var(--colour-series)" stroke-width="2" />
        <circle cx="100" cy="96" r="2" fill="var(--colour-series)" style="stroke: var(--colour-series)"
          stroke-width="2" />

        <!-- bottom output to top input -->
        <text x="-10" y="110" font-size="14" font-weight="bold" text-decoration="none"
          style="fill: var(--colour-ui-primary); text-anchor: left;">R</text>
        <line x1="10" y1="69" x2="10" y2="89" stroke="var(--colour-series)" stroke-width="2" />
        <line x1="9.5" y1="69.5" x2="100.5" y2="44" stroke="var(--colour-series)" stroke-width="2" />
        <line x1="100" y1="44.7" x2="100" y2="16" stroke="var(--colour-series)" stroke-width="2" />
        <circle cx="100" cy="16" r="2" fill="var(--colour-series)" style="stroke: var(--colour-series)"
          stroke-width="2" />

        <!-- bottom gate inputs  -->
        <line x1="10" y1="88" x2="20" y2="88" stroke="var(--colour-series)" stroke-width="2" />
        <line x1="0" y1="104" x2="20" y2="104" stroke="var(--colour-series)" stroke-width="2" />
        <!-- bottom gate output  -->
        <line x1="88" y1="96" x2="120" y2="96" stroke="var(--colour-series)" stroke-width="2" />
        <text x="125" y="103" font-size="14" font-weight="bold" text-decoration="overline"
          style="fill: var(--colour-ui-primary); text-anchor: left;">Q</text>
      </g>

      <g id="nor-flip-flop-internal">
        <use href="#base-flipflop-internal" transform="translate(20,5)" />
        <use href="#gate-nor-trad" transform="translate(40,5)" />
        <use href="#gate-nor-trad" transform="translate(40,85)" />
      </g>

      <g id="nand-flip-flop-internal">
        <use href="#base-flipflop-internal" transform="translate(20,5)" />
        <use href="#gate-nand-trad" transform="translate(40,5)" />
        <use href="#gate-nand-trad" transform="translate(40,85)" />
      </g>

      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ── FLIP FLOP VARIATIONS ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="jk-pos-edge-iec">
        <use href="#base-jk-shape" />
      </g>

      <!-- ══ J-K FLIP-FLOP BODY, IEC (negative edge) ══ -->
      <g id="jk-neg-edge-iec">
        <use href="#base-jk-shape" />
        <use href="#not-dot" transform="translate(52,90)" />
      </g>

      <!-- ══ PRESET/CLEAR EXTENSION - Q5 ══ -->
      <g id="dff-al-pre-clr" transform="translate(0,60)">
        <use href="#base-jk-shape" />
        <line x1="135" y1="0" x2="135" y2="-50" style="stroke: var(--colour-dff)" stroke-width="2" />
        <use href="#not-dot" transform="translate(135,-8)" />
        <text x="135" y="30" text-anchor="middle" font-size="20" font-weight="bold" style="fill: var(--colour-dff)">
          <tspan style="text-decoration: overline">PRE</tspan>
        </text>
        <line x1="135" y1="180" x2="135" y2="230" style="stroke: var(--colour-dff)" stroke-width="2" />
        <use href="#not-dot" transform="translate(135,188)" />
        <text x="135" y="172" text-anchor="middle" font-size="20" font-weight="bold" style="fill: var(--colour-dff)">
          <tspan style="text-decoration: overline">CLR</tspan>
        </text>
      </g>

      <!-- ══ J & K both always ON - Q6 ══ -->
      <g id="jk-pos-edge-iec-jk-on" transform="translate(30,60)">
        <use href="#base-jk-shape" />
        <text x="-30" y="36" font-size="15" font-weight="bold" style="fill: var(--colour-supply)">+5V</text>
        <text x="-30" y="156" font-size="15" font-weight="bold" style="fill: var(--colour-supply)">+5V</text>
      </g>
    </defs>

    <!-- ════════════════════════════════════════════════════════════ -->
    <!--                      DISPLAY CIRCUIT                         -->
    <!-- ════════════════════════════════════════════════════════════ -->
    <g transform="scale(0.4)">
      <use href="#nor-flip-flop-internal" />

      <!-- ══ XY RULER (dev tool, off by default) ══ -->
      <g id="xyRuler" display="none"></g>
    </g>

  </svg>

</body>

</html>
