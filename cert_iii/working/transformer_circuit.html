        <svg id="circuitSvg" viewBox="0 0 910 560" xmlns="http://www.w3.org/2000/svg"
          font-family="'Share Tech Mono',monospace" shape-rendering="crispEdges">

          <!-- ════════════════════ DEFINITIONS ════════════════════ -->

          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      BASE SHAPES                             -->
<!-- ════════════════════════════════════════════════════════════ -->
            <!-- ══ NPN BJT SHAPE ══ -->
            <g id="bjt-npn-shape">
              <circle cx="7" cy="0" r="24" fill="var(--colour-panel)" style="stroke: var(--colour-bjt)" stroke-width="2"
                filter="url(#glow)" />
              <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
              <!-- base lead -->
              <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
              <!-- base bar -->
              <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
              <!-- collector -->
              <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
              <!-- emitter -->
              <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
              <!-- NPN arrow, pointing away from base -->
            </g>

            <!-- ══ Resistor Vertical ══ -->
             <g id="resistor-vertical">
              <rect x="0" y="0" width="30" height="80" rx="3" style="fill: var(--colour-panel)"
                stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)" />
            </g>

            <!-- ══  CAPACITOR SHAPE ══ -->
            <g id="cap-shape">
              <rect x="-4" y="-12" width="8" height="24" style="fill: var(--colour-panel)" />
              <line x1="-4" y1="-12" x2="-4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
              <line x1="4" y1="-12" x2="4" y2="12" style="stroke: var(--colour-capacitor)" stroke-width="2.5" />
            </g>

            <!-- ══ VOLTMETER SHAPE ══ -->
            <g id="meter-shape">
              <circle cx="0" cy="0" r="30" style="fill: var(--colour-meter-fill); stroke: var(--colour-red)"
                stroke-width="1.5" filter="url(#glow)" />
              <line x1="-15" y1="-20" x2="15" y2="-20" style="stroke: var(--colour-red)" stroke-width="1.5"/>
              <line x1="-15" y1="-14" x2="15" y2="-14" style="stroke: var(--colour-red)" stroke-width="1.5" stroke-dasharray="3,2"/>
            </g>

            <!-- ══ AMMETER BADGE — defined once, instanced with <use> ══ -->
            <g id="ammeter-shape">
              <circle cx="0" cy="0" r="30" style="fill: var(--colour-ammeter-fill); stroke: var(--colour-current)"
                stroke-width="1.5" filter="url(#glow)" />
            </g>


<!-- ════════════════════════════════════════════════════════════ -->
<!--                      VOLTAGE DIVIDER BASE                    -->
<!-- ════════════════════════════════════════════════════════════ -->
            <g id="voltage-divider-bias">
             <!-- ════════════════════ WIRES ════════════════════ -->
              <!-- ── VCC HORIZONTAL ── -->
              <line x1="0" y1="20" x2="340" y2="20" style="stroke: var(--colour-series)" stroke-width="2" /><!-- VCC rail (R1 column to RC column) -->

              <!-- ── COMMON HORIZONTAL ── -->
              <line x1="0" y1="535" x2="340" y2="535" style="stroke: var(--colour-series)" stroke-width="2" /><!-- GND rail (R2 column to RE column) -->

              <!-- ── INPUT HORIZONTAL ── -->
              <line x1="0" y1="190" x2="100" y2="190" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node across to transistor base pin -->
              <circle cx="100" cy="190" r="5" style="fill: var(--colour-series)" />

              <!-- ── OUTPUT HORIZONTAL ── -->
              <line x1="240" y1="190" x2="340" y2="190" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node across to transistor base pin -->
              <circle cx="240" cy="190" r="5" style="fill: var(--colour-series)" />
              
              <!-- ── BJT HORIZONTAL ── -->
              <line x1="100" y1="255" x2="209" y2="255" style="stroke: var(--colour-series)" stroke-width="2" /><!-- Base node across to transistor base pin -->
              <circle cx="100" cy="255" r="5" style="fill: var(--colour-series)" />

              <!-- ── RB VERTICAL (VCC rail down to Common) ── -->
              <line x1="100" y1="20" x2="100" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="100" cy="20" r="5" style="fill: var(--colour-series)" />
              <circle cx="100" cy="535" r="5" style="fill: var(--colour-series)" />

              <!-- ── RC VERTICAL (VCC rail down to Common) ── -->
              <line x1="240" y1="20" x2="240" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <circle cx="240" cy="20" r="5" style="fill: var(--colour-series)" />
              <circle cx="240" cy="535" r="5" style="fill: var(--colour-series)" />

              <!-- ════════════════════ Qn — NPN ════════════════════ -->
              <g transform="translate(226,255)">
                <use href="#bjt-npn-shape" />
              </g>

              <!--═══════════════════ RESISTORS ════════════════════ -->         
              <g transform="translate(85,60)">  <!-- ══ RN (egs R1, R5) ══ -->
                <use href="#resistor-vertical" />
              </g>
              <g transform="translate(85,370)">  <!-- ══ RN+1 (egs R2, R6) ══ -->
                <use href="#resistor-vertical" />
              </g>  
              <g transform="translate(225,60)"> <!-- ══ RN+2 (egs R3, R7) ══ -->
                <use href="#resistor-vertical" />
              </g>
              <g transform="translate(225,370)"><!-- ══ RN+3 (egs R4, R8) ══ -->
                <use href="#resistor-vertical" />
              </g>
            </g>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      VOLTAGE DIVIDER Q1 - R1 -> R4           -->
<!-- ════════════════════════════════════════════════════════════ -->
            <g id="voltageDivider-Q1-R1-R4" transform="translate(0,0)">
              <use href="#voltage-divider-bias" />

              <!-- ════════════════════ Q1 — NPN ════════════════════ -->
                <text id="beta-q1" x="255" y="235" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="12"
                font-weight="bold">β = 300</text>
                <text id="label-q1" x="255" y="285" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="14"
                  font-weight="bold">Q1</text>

              <!--═══════════════════ RESISTORS ════════════════════ -->
              <g id="r1" transform="translate(85,60)" >
                <!-- ══ R1 ══ -->
                <text id="label-r1" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">R1</text>
                <text id="value-r1" x="60" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">80kΩ</text>
              </g>
              <g id="r2" transform="translate(85,370)" >
              <!-- ══ R2 ══ -->
                <text id="label-r2" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">R2</text>
                <text id="value-r2" x="60" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">20kΩ</text>
              </g>
                <!-- ══ R3 ══ -->
              <g id="r3" transform="translate(225,60)" >
                <text id="label-r3" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">R3</text>
                <text id="value-r3" x="60" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">5k6Ω</text>
              </g>
              <g id="r4" transform="translate(225,370)" >
                <!-- ══ R4 ══ -->
                <text id="label-r4" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">R4</text>
                <text id="value-r4" x="60" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">1k8Ω</text>
              </g>
            </g>
<!-- ════════════════════════════════════════════════════════════ -->
<!--                      VOLTAGE DIVIDER Q2 - R5 -> R8           -->
<!-- ════════════════════════════════════════════════════════════ -->
            <g id="voltageDivider-Q2-R5-R8" transform="translate(0,0)">
              <use href="#voltage-divider-bias" />
              <!-- ════════════════════ Q2 — NPN ════════════════════ -->
                <text id="beta-q2" x="255" y="235" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="12"
                font-weight="bold">β = 400</text>
                <text id="label-q2" x="255" y="285" fill="var(--colour-bjt-labels)" text-anchor="start" font-size="14"
                  font-weight="bold">Q2</text>

              <!--═══════════════════ RESISTORS ════════════════════ -->
              <g id="r5" transform="translate(85,60)" >
                <!-- ══ R5 ══ -->
                <text id="label-r5" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">R5</text>
                <text id="value-r5" x="60" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">100kΩ</text>
              </g>
              <g id="r6" transform="translate(85,370)" >
              <!-- ══ R6 ══ -->
                <text id="label-r6" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">R6</text>
                <text id="value-r6" x="60" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">15kΩ</text>
              </g>
                <!-- ══ R7 ══ -->
              <g id="r7" transform="translate(225,60)" >
                <text id="label-r7" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">R7</text>
                <text id="value-r7" x="60" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">4k2Ω</text>
              </g>
              <g id="r8" transform="translate(225,370)" >
                <!-- ══ R8 ══ -->
                <text id="label-r8" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">R8</text>
                <text id="value-r8" x="60" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">680Ω</text>
              </g>
            </g>
          </defs>

<!-- ════════════════════════════════════════════════════════════ -->
<!--                      DISPLAY CIRCUIT                         -->
<!-- ════════════════════════════════════════════════════════════ -->
 
          <!-- ════════════════════ VCC LABEL ════════════════════ -->

          <g id="vccGroup" transform="translate(345,-5)">
            <text x="0" y="15" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="15"
              font-weight="bold">V<tspan baseline-shift="sub" font-size="10">CC</tspan></text>
            <text id="vccValue" x="30" y="20" style="fill: var(--colour-text)" text-anchor="start" font-size="14"
              font-weight="bold">+12V</text>
            </g>

          <!-- ════════════════════ COMMON LABEL ════════════════════ -->
          <g id="gndGroup" transform="translate(345,550)">
            <text x="0" y="0" style="fill: var(--colour-current)" text-anchor="start" font-size="15"
              font-weight="bold">Common</text>
          </g>

          <!-- ════════════════════ INPUT LABEL ════════════════════ -->
          <g id="inputGroup" transform="translate(0,175)">
            <text x="0" y="0" style="fill: var(--colour-text)" text-anchor="start" font-size="15"
              font-weight="bold">Input</text>
          </g>

          <!-- ════════════════════ OUTPUT LABEL ════════════════════ -->
          <g id="outputGroup" transform="translate(690,175)">
            <text x="0" y="0" style="fill: var(--colour-text)" text-anchor="start" font-size="15"
              font-weight="bold">Output</text>
          </g>

          <!-- ════════════════════ VOLTAGE DIVIDER 1 ════════════════════ -->
          <g id="vd1" transform="translate(0,0)">
            <use href="#voltageDivider-Q1-R1-R4" />
          </g>

          <!-- ════════════════════ VOLTAGE DIVIDER 2 ════════════════════ -->
          <g id="vd2" transform="translate(400,0)">
            <use href="#voltageDivider-Q2-R5-R8" />
          </g>

          <!-- ════════════════ WIRES TO JOIN CIRCUITS ════════════════════ -->
          <g id="joinVD1VD2" transform="translate(0,0)">
              <!-- ── VCC HORIZONTAL ── -->
              <line x1="340" y1="20" x2="400" y2="20" style="stroke: var(--colour-series)" stroke-width="2" />
              <!-- ── COMMON HORIZONTAL ── -->
              <line x1="340" y1="535" x2="400" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <!-- ── JOIN OUTPUT 1 to INPUT 2 ── -->
              <line x1="340" y1="190" x2="400" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <g id="couplingCap" transform="translate(370,190)">
                <use href="#cap-shape" />
                <text x="0" y="-20" style="fill: var(--colour-capacitor-labels)" text-anchor="middle" font-size="14"
                  font-weight="bold">C1</text>
                <text id="capValue1" x="0" y="35" style="fill: var(--colour-text)" text-anchor="middle" font-size="14"
                  font-weight="bold">330nF</text>
              </g>
          </g>

          <!-- ════════════════ BYPASS R8 ════════════════════════════ -->
          <g id="bypassR8" transform="translate(0,0)">
              <!-- ── TOP VERTICAL  ── -->
              <line x1="640" y1="300" x2="730" y2="300" style="stroke: var(--colour-series)" stroke-width="2" />
              <!-- ── BYPASS TO GROUND ── -->
              <line x1="730" y1="300" x2="730" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <!-- ── R8 BYPASS CAPACITOR ── -->
              <use href="#cap-shape" transform="translate(730,455) rotate(90)" />
                <text id="label-c2" x="760" y="460" fill="var(--colour-capacitor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">C2</text>
          </g>

          <!-- ════════════════ OUTPUT LOAD ════════════════════════════ -->
          <g id="outputLoad" transform="translate(0,0)">
              <!-- ── EXTEND OUTPUT 2  ── -->
              <line x1="740" y1="190" x2="800" y2="190" style="stroke: var(--colour-series)" stroke-width="2" />
              <!-- ── EXTEND COMMON ── -->
              <line x1="740" y1="535" x2="800" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <!-- ── JOIN OUTPUT 1 to INPUT 2 ── -->
              <line x1="800" y1="190" x2="800" y2="535" style="stroke: var(--colour-series)" stroke-width="2" />
              <!-- ── RL VERTICAL ── -->
              <g id="RL" transform="translate(785,300)">
                <use href="#resistor-vertical" />
                <text id="label-rl" x="-15" y="40" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16"
                  font-weight="bold">RL</text>
                <text id="value-rl" x="60" y="40" fill="var(--colour-text)" text-anchor="middle"
                  font-size="14">10kΩ</text>
              </g>
          </g>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!--                      QUESTIONS                               -->
  <!-- ════════════════════════════════════════════════════════════ -->

          <!-- ════════════════════ QUESTION 1 ════════════════════ -->

          <!-- ══ V_B1 METER ══ -->
          <g id="meterVB1" display="none" transform="translate(-5,255)">
            <use href="#probe-wire" transform="rotate(0) translate(30,0)" />
            <use href="#meter-shape" />
            <text x="20" y="-35" style="fill: var(--colour-voltage-label)" text-anchor="middle" font-size="14"
              font-weight="bold">V<tspan baseline-shift="sub" font-size="10">B1</tspan></text>

            <text id="meterVB1Unit" x="0" y="22" style="fill: var(--colour-red)" text-anchor="middle"

          <!-- ══ V_E1 METER ══ -->

            <text x="20" y="-35" style="fill: var(--colour-voltage-label)" text-anchor="middle" font-size="14"

            <text id="meterVE1Unit" x="0" y="22" style="fill: var(--colour-red)" text-anchor="middle"

            <text x="40" y="-20" style="fill: var(--colour-current)" text-anchor="middle" font-size="14"

        <!-- ══ Re1 INDICATOR ══ -->
          <g id="re1Ind" display="none" transform="translate(350,228)">
            <text x="20" y="20" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="14"

            <text id="re1Value" x="20" y="40" style="fill: var(--colour-voltage-label)" text-anchor="start" font-size="13"
