<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../assets/theme-init.js"></script>
  <title>Diff Amp Circuit</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/quiz-common.css">
</head>

<body>
  <div class="crumb" id="crumb" data-current="Quiz 1"></div>
  <header>
    <h1>Diff Amp Circuit</h1>
    <p>AC Analysis · Coupling</p>
  </header>

  <svg id="circuitSvg" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg"
    font-family="'Share Tech Mono',monospace" shape-rendering="crispEdges">

    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- ════════════════════════════════════════════════════════════ -->
      <!--                      BASE SHAPES                             -->
      <!-- ════════════════════════════════════════════════════════════ -->
      <g id="block-rectangle">
        <rect x="0" y="0" width="240" height="150" rx="4" fill="none" style="stroke: var(--colour-dff)"
          stroke-width="2" filter="url(#glow)" />
      </g>

      <g id="arrow-shape">
        <polygon points="0,-6 0,6 8,0" fill="var(--colour-series)"  />
      </g>

      <g id="generic-mv-text">
        <text x="90" y="10" font-size="18" font-weight="bold" style="fill: var(--colour-dff); text-anchor: middle;">Multivibrator</text>
        <text x="90" y="40" font-size="12" font-weight="bold" style="fill: var(--colour-dff); text-anchor: middle;">(Astable/Monostable/Bistable)</text>
      </g>

      <g id="generic-target-text">
        <text x="90" y="10" font-size="18" font-weight="bold" style="fill: var(--colour-dff); text-anchor: middle;">Target Block /</text>
        <text x="90" y="30" font-size="18" font-weight="bold" style="fill: var(--colour-dff); text-anchor: middle;">Subsequent Stage</text>
        <text x="90" y="50" font-size="12" font-weight="bold" style="fill: var(--colour-dff); text-anchor: middle;">(Clock, Trigger, etc)</text>
      </g>

      <!-- ════════════════════════════════════════════════════════ -->
      <!-- ──GENERIC MULTIVIBRATOR TO OUTPUT ── -->
      <!-- ════════════════════════════════════════════════════════ -->
      <g id="generic-mv-out">
        <g transform="translate(0, 0)">
          <use href="#block-rectangle" transform="translate(0,0)" />
          <use href="#generic-mv-text" transform="translate(30, 50)" />
        </g>
        <g transform="translate(250, 75)">
          <line x1="0" y1="0" x2="70" y2="0" style="stroke: var(--colour-dff)" stroke-width="2" />
          <use href="#arrow-shape" transform="translate(70, 0) rotate(0)" />
          <text x="35" y="-10" font-size="28" font-weight="bold" style="fill: var(--colour-ui-primary); text-anchor: middle;">?</text>
        </g>
        <g transform="translate(340, 0)">
          <use href="#block-rectangle" transform="translate(0,0)" />
          <use href="#generic-target-text" transform="translate(30, 50)" />
        </g>
      </g>
    </defs>

    <!-- ════════════════════════════════════════════════════════════ -->
    <!--                      DISPLAY CIRCUIT                         -->
    <!-- ════════════════════════════════════════════════════════════ -->
    <g transform="scale(0.4)">
      <use href="#generic-mv-out" />

        <!-- ══ XY RULER (dev tool, off by default) ══ -->
      <g id="xyRuler" display="none"></g>
    </g>

  </svg>

</body>

</html>
