<!--
  Resistor Circuit Quiz 3 — brought into the shared framework (quiz-engine.js, quiz-common.css) from the original
  hand-built page in quiz/resistor/. The circuit drawing, example value sets, wrong-answer logic and
  worked solutions are the original's; the question order, hints and per-question annotation states
  (CIRCUIT_STATES) are unchanged. What the diagram shows at each question is applied by
  applyCircuitState() from RENDER_EXTRA: the "enter" state on arrival and the "reveal" state once
  answered.

  Links: the Q1 hint's help button opens the matching step-by-step total-resistance walkthrough with
  the current values (and a return key) in the URL; coming back with ?goto=N lands on question N
  with the earlier ones answered.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../assets/theme-init.js"></script>
  <script src="../../assets/quiz-engine.js"></script>
  <title>Resistor Circuit Quiz 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/quiz-common.css">
  <script src="../../assets/breadcrumb.js" defer></script>
</head>

<body>
  <div class="crumb" id="crumb" data-current="Resistor Circuit Quiz 3"></div>
  <header>
    <h1>Resistor Circuit Quiz 3</h1>
    <p>Series-Parallel Ladder · Equivalent Resistance</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">

    <div class="mode-toggle">
      <div class="mode-seg" id="modeSeg">
        <button id="modeExample1" class="active" onclick="setMode('example1')">Example 1</button>
        <button id="modeExample2" onclick="setMode('example2')">Example 2</button>
        <button id="modeExample3" onclick="setMode('example3')">Example 3</button>
        <button id="modeRandomise" onclick="setMode('randomise')">Randomise</button>
      </div>
    </div>

    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()" title="Click to zoom">
        <div class="panel-label">Circuit Diagram — <span id="panelVoltLabel">20 V</span> Source</div>
        <div class="zoom-hint">
          <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none" />
            <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <line x1="6" y1="8" x2="10" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="8" y1="6" x2="8" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Zoom
        </div>
        <svg id="circuitSvg" viewBox="0 0 480 700" xmlns="http://www.w3.org/2000/svg"
           font-family="'Share Tech Mono',monospace">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- ════════════════════ WIRES ════════════════════ -->

        <!-- (cyan series rail) — grouped by geometry so a wrong connection is easy to spot. -->
        <!-- Each wire also has a short right-hand comment naming what it joins. -->

        <!-- ── LEFT VERTICAL ── -->
        <line x1="70" y1="300" x2="70"  y2="90"  style="stroke: var(--colour-series)" stroke-width="2"/><!-- Power +ve up to top rail -->
        <line x1="70"  y1="610" x2="70"  y2="330" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Bottom rail up to Power −ve -->

        <!-- ── TOP HORIZONTAL ── -->
        <line x1="70" y1="90"  x2="140" y2="90"  style="stroke: var(--colour-series)" stroke-width="2"/><!-- Top-left corner across to R1 -->
        <line x1="240" y1="90"  x2="300" y2="90"  style="stroke: var(--colour-series)" stroke-width="2"/><!-- R1 across to centre spine -->

        <!-- ── BOTTOM HORIZONTAL ── -->
        <line x1="300" y1="610" x2="240" y2="610" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Centre spine across to R6 -->
        <line x1="140" y1="610" x2="70"  y2="610" style="stroke: var(--colour-series)" stroke-width="2"/><!-- R6 across to bottom-left corner -->

        <!-- ── CENTRE VERTICAL ── -->
        <line x1="300" y1="90"  x2="300" y2="170" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Centre spine down to Group 1 top rail -->
        <line x1="230" y1="170" x2="230" y2="212" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Group 1 top rail down to R2 -->
        <line x1="370" y1="170" x2="370" y2="212" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Group 1 top rail down to R3 -->
        <line x1="230" y1="287" x2="230" y2="329" style="stroke: var(--colour-series)" stroke-width="2"/><!-- R2 down to Group 1 bottom rail -->
        <line x1="370" y1="287" x2="370" y2="329" style="stroke: var(--colour-series)" stroke-width="2"/><!-- R3 down to Group 1 bottom rail -->
        <line x1="300" y1="329" x2="300" y2="400" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Centre spine, Group 1 to Group 2 -->
        <line x1="230" y1="400" x2="230" y2="442" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Group 2 top rail down to R4 -->
        <line x1="370" y1="400" x2="370" y2="442" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Group 2 top rail down to R5 -->
        <line x1="230" y1="517" x2="230" y2="559" style="stroke: var(--colour-series)" stroke-width="2"/><!-- R4 down to Group 2 bottom rail -->
        <line x1="370" y1="517" x2="370" y2="559" style="stroke: var(--colour-series)" stroke-width="2"/><!-- R5 down to Group 2 bottom rail -->
        <line x1="300" y1="559" x2="300" y2="610" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Group 2 bottom rail down to R6 -->

        <!-- ── CENTRE HORIZONTAL ── -->
        <line x1="230" y1="170" x2="370" y2="170" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Group 1 top rail (R2 to R3) -->
        <line x1="230" y1="329" x2="370" y2="329" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Group 1 bottom rail (R2 to R3) -->
        <line x1="230" y1="400" x2="370" y2="400" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Group 2 top rail (R4 to R5) -->
        <line x1="230" y1="559" x2="370" y2="559" style="stroke: var(--colour-series)" stroke-width="2"/><!-- Group 2 bottom rail (R4 to R5) -->

        <!-- ════════════════════ NODES ════════════════════ -->

        <!-- each node's junction dot(s) and label grouped together. B appears twice -->

        <!-- same electrical node. Hidden until Q1 (total resistance) is answered — -->
        <!-- see nodesGroup in applyCircuitState. -->

        <!-- ── NODE A ── -->
        <circle cx="300" cy="170" r="5" style="fill: var(--colour-series)"/>

        <!-- ── NODE B ── -->

        <g id="nodeB1" transform="translate(280,350)">
          <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>

        <circle cx="300" cy="400" r="5" style="fill: var(--colour-series)"/>

        </g>

        <!-- ── NODE C ── -->
        <circle cx="300" cy="559" r="5" style="fill: var(--colour-series)"/>
        <g id="nodeC" transform="translate(324,580)">

        </g>
        </g>

        <!-- ════════════════════ BATTERY ════════════════════ -->

        <!-- (E, supply voltage) — group origin = wire attachment point (centre of + plate) -->
        <g id="batteryGroup" transform="translate(70,300)">

        <g id="r1Group" transform="translate(140,74)">

          <text id="nm-r1" x="50" y="-10" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="15" font-weight="bold">R1</text>
          <text id="lbl-r1" x="50" y="52" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">100Ω</text>
        </g>

        <!-- ── R2 ∥ R3 (group 1) — group origin = box top-left ── -->
        <g id="r2Group" transform="translate(214,212)">
          <rect id="box-r2" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke=var(--colour-resistor) stroke-width="2" filter="url(#glow)"/>
          <text id="nm-r2" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R2</text>
          <text id="lbl-r2" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">50Ω</text>
        </g>

        <g id="r3Group" transform="translate(354,212)">
          <rect id="box-r3" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke=var(--colour-resistor) stroke-width="2" filter="url(#glow)"/>
          <text id="nm-r3" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R3</text>
          <text id="lbl-r3" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">200Ω</text>
        </g>

        <!-- ── R4 ∥ R5 (group 2) — group origin = box top-left ── -->
        <g id="r4Group" transform="translate(214,442)">
          <rect id="box-r4" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke=var(--colour-resistor) stroke-width="2" filter="url(#glow)"/>
          <text id="nm-r4" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R4</text>
          <text id="lbl-r4" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">80Ω</text>
        </g>

        <g id="r5Group" transform="translate(354,442)">
          <rect id="box-r5" x="0" y="0" width="32" height="75" rx="3" style="fill: var(--colour-panel)" stroke=var(--colour-resistor) stroke-width="2" filter="url(#glow)"/>
          <text id="nm-r5" x="-6" y="41" fill="var(--colour-resistor-labels)" text-anchor="end" font-size="14" font-weight="bold">R5</text>
          <text id="lbl-r5" x="38" y="41" fill="var(--colour-resistor-labels)" text-anchor="start" font-size="13">80Ω</text>
        </g>

        <!-- ── R6 (series, bottom) — group origin = box top-left ── -->
        <g id="r6Group" transform="translate(140,594)">
          <rect id="box-r6" x="0" y="0" width="100" height="32" rx="3" style="fill: var(--colour-panel)" stroke=var(--colour-resistor) stroke-width="2" filter="url(#glow)"/>
          <text id="nm-r6" x="50" y="-10" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="15" font-weight="bold">R6</text>
          <text id="lbl-r6" x="50" y="52" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="16">30Ω</text>
        </g>

        <!-- ════════════════════ QUESTION INDICATORS ════════════════════ -->

        <!-- ── CURRENT INDICATOR (Q2) — total current I_T, on the main supply wire; -->
        <!-- group origin = arrow tip ── -->
        <g id="currentInd" display="none" transform="translate(70,206)">
          <line x1="0" y1="32" x2="0" y2="10" style="stroke: var(--colour-current)" stroke-width="2.5"/>
          <polygon points="0,0 -6,12 6,12" style="fill: var(--colour-current)"/>
          <text x="-30" y="-6" style="fill: var(--colour-current)" text-anchor="middle" font-size="18" font-weight="bold">I<tspan baseline-shift="sub" font-size="12">T</tspan></text>
          <text id="itValue" x="-30" y="20" style="fill: var(--colour-current)" text-anchor="middle" font-size="13" font-weight="bold">—</text>
          <text id="itUnit"  x="-30" y="37" style="fill: var(--colour-current)" text-anchor="middle" font-size="13" font-weight="bold">—</text>
        </g>

        <!-- ── EQUIVALENT-RESISTANCE LABELS (shown once Q1 is solved) ── -->
        <g id="totalsLabels" display="none">
          <!-- group 1 equivalent R2,3; group origin = heading position -->
          <g transform="translate(305,285)">
            <text x="0" y="0" style="fill: var(--colour-resistor-combo1)" text-anchor="middle" font-size="16" font-weight="bold">R<tspan baseline-shift="sub" font-size="11">2,3</tspan></text>
            <text id="lblR23" x="0" y="25" style="fill: var(--colour-resistor-combo1)" text-anchor="middle" font-size="15">—</text>
          </g>
          <!-- group 2 equivalent R4,5; group origin = heading position -->
          <g transform="translate(305,515)">
            <text x="0" y="0" style="fill: var(--colour-resistor-combo2)" text-anchor="middle" font-size="16" font-weight="bold">R<tspan baseline-shift="sub" font-size="11">4,5</tspan></text>
            <text id="lblR45" x="0" y="25" style="fill: var(--colour-resistor-combo2)" text-anchor="middle" font-size="15">—</text>
          </g>
          <!-- circuit total R_T; group origin = heading position -->
          <g transform="translate(130,370)">
            <text x="0" y="0" style="fill: var(--colour-resistor-total)" text-anchor="middle" font-size="16" font-weight="bold">R<tspan baseline-shift="sub" font-size="11">T</tspan></text>
            <text id="lblRTtot" x="0" y="25" style="fill: var(--colour-resistor-total)" text-anchor="middle" font-size="15">—</text>
          </g>
        </g>

        <!-- ── V_R3 VOLTAGE INDICATOR (shown on Q3) — across R3 (= group 1 voltage); -->
        <!-- group origin = top of spine ── -->
        <g id="vr3Ind" display="none" transform="translate(430,212)">
          <line x1="0" y1="0" x2="0" y2="75" style="stroke: var(--colour-red)" stroke-width="2"/>
          <line x1="-20" y1="0" x2="0" y2="0" style="stroke: var(--colour-red)" stroke-width="2"/>
          <line x1="-20" y1="75" x2="0" y2="75" style="stroke: var(--colour-red)" stroke-width="2"/>
          <text x="20" y="68" style="fill: var(--colour-red)" text-anchor="middle" font-size="14" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">R3</tspan></text>
          <text x="10" y="93" style="fill: var(--colour-red)" text-anchor="middle" font-size="14" font-weight="bold"><tspan id="vr3Value">—</tspan></text>
        </g>

        <!-- ── I_R2 CURRENT INDICATOR (shown on Q4) — through the R2 branch; group origin = arrow tip ── -->
        <g id="ir2Ind" display="none" transform="translate(230,208)">
          <line x1="0" y1="-30" x2="0" y2="-10" style="stroke: var(--colour-current)" stroke-width="2.5"/>
          <polygon points="0,0 -6,-11 6,-11" style="fill: var(--colour-current)"/>
          <text x="-17" y="-28" style="fill: var(--colour-current)" text-anchor="end" font-size="13" font-weight="bold">I<tspan baseline-shift="sub" font-size="9">R2</tspan></text>
          <text id="ir2Value" x="-17" y="-10" style="fill: var(--colour-current)" text-anchor="end" font-size="13" font-weight="bold">—</text>
        </g>

        <!-- ── V_R5 VOLTAGE INDICATOR (shown on Q5) — across R5 (= group 2 voltage); -->
        <!-- group origin = top of spine ── -->
        <g id="vr5Ind" display="none" transform="translate(430,442)">
          <line x1="0" y1="0" x2="0" y2="75" style="stroke: var(--colour-red)" stroke-width="2"/>
          <line x1="-20" y1="0" x2="0" y2="0" style="stroke: var(--colour-red)" stroke-width="2"/>
          <line x1="-20" y1="75" x2="0" y2="75" style="stroke: var(--colour-red)" stroke-width="2"/>
          <text x="20" y="68" style="fill: var(--colour-red)" text-anchor="middle" font-size="14" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">R5</tspan></text>
          <text x="10" y="91" style="fill: var(--colour-red)" text-anchor="middle" font-size="14" font-weight="bold"><tspan id="vr5Value">—</tspan></text>
        </g>

        <!-- ── I_R6 CURRENT INDICATOR (shown on Q6) — through the series link R6; group origin = arrow tip ── -->
        <g id="ir6Ind" display="none" transform="translate(262,610)">
          <line x1="33" y1="0" x2="10" y2="0" style="stroke: var(--colour-current)" stroke-width="2.5"/>
          <polygon points="0,0 12,-6 12,6" style="fill: var(--colour-current)"/>
          <text x="18" y="25" style="fill: var(--colour-current)" text-anchor="middle" font-size="13" font-weight="bold">I<tspan baseline-shift="sub" font-size="9">R6</tspan></text>
          <text id="ir6Value" x="18" y="45" style="fill: var(--colour-current)" text-anchor="middle" font-size="13" font-weight="bold">—</text>
        </g>

        <!-- ══ XY RULER (dev tool, off by default) — populated by buildXYRuler(), toggled by setXY() ══ -->
        <g id="xyRuler" display="none"></g>
      </svg>
      </div>
    </div>

    <div class="questions-col">
      <div class="card">
        <div class="progress-wrap">
          <div id="progressDots" style="display:contents"></div>
          <span class="progress-label" id="progressLabel"></span>
          <a id="menuLink" class="menu-link" href="#" onclick="goBack(event)" style="display:none">← Back</a>
        </div>

        <div class="q-panel" id="qPanel">
          <div class="q-header">
            <div class="q-num" id="qNum"></div>
            <div>
              <div class="q-text" id="qText"></div>
              <div class="q-hint" id="qHint"></div>
            </div>
          </div>
          <div class="options" id="qOptions"></div>
          <div class="selected-list" id="qSelectedList" style="display:none"></div>
          <div class="result-banner" id="qBanner"><span id="qIcon"></span>&nbsp;<span id="qBannerText"></span></div>
          <div class="working-box" id="qWorking">
            <div class="working-title">Worked Solution</div>
            <div id="qWorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="qBack" onclick="backQuestion()" style="display:none">← Prev</button>

            <button class="btn btn-next" id="qNext" onclick="nextQuestion()" style="display:none">Next →</button>

          </div>
        </div>

        <div id="summaryPanel" style="display:none">
          <div class="summary-head">

            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>

    <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
      <div class="modal-inner" id="modalInner">
        <div class="modal-header">
          <span class="modal-title" id="modalVoltLabel">Circuit Diagram — 20 V Source</span>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
        <svg id="modalSvg" viewBox="0 0 480 700" xmlns="http://www.w3.org/2000/svg"
          font-family="'Share Tech Mono',monospace"></svg>
      </div>
    </div>

  </div>

  <script>
const EXAMPLE_SETS = {
  example1: { r1:100, r2:50, r3:200, r4:80, r5:80,  r6:30, vs:20 },
  example2: { r1:120, r2:39, r3:150, r4:47, r5:82,  r6:27, vs:24 },
  example3: { r1:180, r2:56, r3:220, r4:68, r5:120, r6:33, vs:36 }
};
let quizMode = 'example1';
let V = { ...EXAMPLE_SETS.example1 };

// Number of questions in the chain.
// If you add or remove questions, update this AND CIRCUIT_STATES[],
// QUESTION_BUILDERS[], the buildQnOptions/checkQn function sets, and
// the matching HTML panels (q1Panel…qnPanel, q1Check…qnCheck, etc.).
const QUIZ_QUESTION_COUNT = 6;
const QIDS = Array.from({length: QUIZ_QUESTION_COUNT}, (_,i) => 'q'+(i+1));


const LEGACY_QS = [
  {
    text: 'What is the <span style="color:var(--colour-ui-primary)">total resistance</span> R<sub>T</sub> of the circuit?',
    hint: 'Combine each parallel pair (R2∥R3 and R4∥R5) first, then add the two series resistors R1 and R6.<br>Don\'t know where to start? <button type="button" class="hint-help-btn" id="helpLink" onclick="goToHelp()">Click here for help</button>'
  },
  {
    text: 'What is the <span style="color:var(--colour-current)">circuit current</span> I<sub>T</sub>?',
    hint: 'Use Ohm\'s law with the total resistance you found in Q1.'
  },

const E12_BASE=[10,12,15,18,22,27,33,39,47,56,68,82];
const E12=[]; [1,10].forEach(m=>E12_BASE.forEach(v=>E12.push(v*m)));
function pickN(arr,n){const a=[...arr],r=[];for(let i=0;i<n;i++){r.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);}return r;}
function randomValues(){

}

function fmtO(v){return v>=1000?(v/1000).toFixed(2)+' kΩ':v.toFixed(2)+' Ω';}
function fmtO0(v){return v>=1000?(v/1000).toFixed(2)+'kΩ':v+'Ω';}
function fmtA(a){const x=Math.abs(a);if(x>=1)return a.toFixed(3)+' A';if(x>=0.001)return (a*1000).toFixed(2)+' mA';return (a*1e6).toFixed(1)+' µA';}
function fmtASplit(a){const x=Math.abs(a);if(x>=1)return {num:a.toFixed(3),unit:'A'};if(x>=0.001)return {num:(a*1000).toFixed(2),unit:'mA'};return {num:(a*1e6).toFixed(1),unit:'µA'};}
function fmtV(v){const a=Math.abs(v);if(a>=1)return v.toFixed(2)+' V';if(a>=0.001)return (v*1000).toFixed(2)+' mV';return (v*1e6).toFixed(1)+' µV';}
function frac(num,den){return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;}

// ── derived (recomputed whenever the value set changes) ──
let R23,R45,RT,IT,VR3,IR2,VR5,IR6,RT_ALL,RT_G1WRONG,RT_G2WRONG;
function recompute(){
  R23  = (V.r2*V.r3) / (V.r2+V.r3);           // combo 1: R2 ∥ R3
  R45  = (V.r4*V.r5) / (V.r4+V.r5);           // combo 2: R4 ∥ R5
  RT   = V.r1 + R23 + R45 + V.r6;              // total (R1, combo1, combo2, R6 all in series)
  IT   = V.vs / RT;                            // circuit current
  VR3  = IT * R23;                             // V across R3 = V across R2 = V across the R2,3 group
  IR2  = VR3 / V.r2;                            // branch current through R2
  VR5  = IT * R45;                             // V across R5 = V across R4 = V across the R4,5 group
  IR6  = IT;                                    // R6 series link carries the full current
  // distractor R_T values (shared by Q1 and Q2)
  RT_ALL     = V.r1+V.r2+V.r3+V.r4+V.r5+V.r6;         // everything in series
  RT_G1WRONG = V.r1+(V.r2+V.r3)+R45+V.r6;             // forgot to combine R2∥R3
  RT_G2WRONG = V.r1+R23+(V.r4+V.r5)+V.r6;             // forgot to combine R4∥R5
}
