<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulators</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d14; --panel: #0f1420; --panel2: #0c1119;
            --border: #1e2d4a; --accent: #00e5ff; --accent2: #ff6b35;
            --accent3: #00ff99; --grid: rgba(0,229,255,0.06);
            --text: #c8d8e8; --label: #5a7a9a;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Share Tech Mono',monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:3rem 1.5rem; background-image: linear-gradient(var(--grid) 1px,transparent 1px), linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:40px 40px; }
        header { text-align:center; margin-bottom:3rem; }
        header h1 { font-family:'Orbitron',sans-serif; font-size:clamp(2rem,6vw,3.5rem); font-weight:900; letter-spacing:0.12em; color:var(--accent); text-shadow:0 0 40px rgba(0,229,255,0.5); text-transform:uppercase; }
        header p { margin-top:0.6rem; color:var(--label); font-size:0.8rem; letter-spacing:0.2em; text-transform:uppercase; }
        .nav { width:100%; max-width:560px; display:flex; flex-direction:column; gap:0.6rem; }
        .nav-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.1rem 1.3rem;
            background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
            text-decoration: none; color: var(--accent);
            font-family: 'Orbitron', sans-serif; font-size: 0.78rem; font-weight: 700;
            letter-spacing: 0.15em; text-transform: uppercase;
            position: relative; transition: background 0.15s, box-shadow 0.15s;
        }
        .nav-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:4px 0 0 4px; }
        .nav-card::after { content:'→'; font-size:0.9rem; opacity:0.5; transition: opacity 0.15s, transform 0.15s; transform: translateX(-4px); }
        .nav-card:hover::after { opacity:1; transform: translateX(0); }
        .nav-card.quiz  { color: var(--accent3); }
        .nav-card.quiz::before { background: var(--accent3); }
        .nav-card.quiz:hover { background: rgba(0,255,153,0.05); box-shadow: 0 0 18px rgba(0,255,153,0.08); }
        .nav-card.simulator { color: var(--accent); }
        .nav-card.simulator::before { background: var(--accent); }
        .nav-card.simulator:hover { background: rgba(0,229,255,0.05); box-shadow: 0 0 18px rgba(0,229,255,0.08); }
        .nav-card.filter { color: var(--accent2); }
        .nav-card.filter::before { background: var(--accent2); }
        .nav-card.filter:hover { background: rgba(255,107,53,0.05); box-shadow: 0 0 18px rgba(255,107,53,0.08); }
        footer { margin-top:4rem; font-size:0.65rem; color:var(--label); opacity:0.4; letter-spacing:0.15em; text-transform:uppercase; }
    </style>
</head>
<body>
    <header>
        <h1>Simulators</h1>
        <p>A collection of educational simulators &amp; utilities</p>
    </header>
    <nav class="nav">
        <a class="nav-card quiz"       href="quiz/index.html">Quizzes</a>
        <a class="nav-card simulator"  href="simulator/index.html">Simulators</a>
        <a class="nav-card filter"     href="filter/index.html">Filters</a>
    </nav>
    <footer>Select a category to begin</footer>
</body>
</html>
