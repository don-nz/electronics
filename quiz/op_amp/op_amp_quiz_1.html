<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Op-Amp Quiz 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #0a0d14;
      --panel: #0f1420;
      --border: #1e2d4a;
      --accent: #00e5ff;
      --accent2: #ff6b35;
      --accent3: #00ff99;
      --accent4: #ff3d9a;
      --accent5: #a78bfa;
      --grid: rgba(0, 229, 255, 0.06);
      --text: #c8d8e8;
      --label: #5a7a9a;
      --highlight: #ffff00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 900;
      letter-spacing: .12em;
      color: var(--accent);
      text-shadow: 0 0 30px rgba(0, 229, 255, .5);
      text-transform: uppercase;
    }

    header p {
      margin-top: .5rem;
      color: var(--label);
      font-size: .75rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    @media(min-width:900px) {
      .quiz-wrap {
        display: grid;
        grid-template-columns: minmax(340px, 52%) 1fr;
        gap: 1.2rem;
        align-items: start;
      }

      .circuit-col {
        position: sticky;
        top: 1.5rem;
      }

      .questions-col {
        min-width: 0;
      }

      .questions-col .card {
        padding: 1rem 1.1rem;
      }

      .questions-col .option-btn {
        padding: .5rem .7rem;
        font-size: .76rem;
      }

      .questions-col .q-text {
        font-size: .86rem;
      }

      .questions-col .result-banner {
        font-size: .72rem;
        padding: .5rem .8rem;
      }

      .questions-col .btn {
        width: 130px;
        font-size: .64rem;
      }

      .questions-col .working-box {
        padding: .85rem 1rem;
      }

      .questions-col .options {
        gap: .4rem;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.6rem;
    }

    .circuit-panel {
      background: rgba(0, 0, 0, .25);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .8rem;
      position: relative;
      cursor: zoom-in;
    }

    .circuit-panel svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .panel-label {
      font-size: .58rem;
      letter-spacing: .18em;
      color: var(--label);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 6px;
    }

    .q-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .q-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .q-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      padding-top: .15rem;
    }

    .q-text {
      color: #d0e4f0;
      font-size: .9rem;
      font-weight: bold;
      line-height: 1.5;
    }

    .q-hint {
      font-size: .75rem;
      color: var(--label);
      font-weight: normal;
      margin-top: .3rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }

    .option-btn {
      width: 100%;
      padding: .7rem 1rem;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .02);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: .82rem;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex;
      align-items: center;
      gap: .7rem;
    }

    .option-btn:hover:not(:disabled) {
      border-color: rgba(0, 229, 255, .4);
      background: rgba(0, 229, 255, .05);
    }

    .option-btn.selected {
      border-color: rgba(0, 229, 255, .6);
      background: rgba(0, 229, 255, .08);
      color: var(--accent);
    }

    .option-btn.correct {
      border-color: var(--accent3);
      background: rgba(0, 255, 153, .08);
      color: var(--accent3);
    }

    .option-btn.wrong {
      border-color: var(--accent4);
      background: rgba(255, 61, 154, .08);
      color: var(--accent4);
    }

    .option-btn.dimmed {
      opacity: .35;
    }

    .option-letter {
      font-family: 'Orbitron', sans-serif;
      font-size: .7rem;
      font-weight: 700;
      min-width: 22px;
    }

    .result-icon {
      font-size: 1.1rem;
      margin-left: auto;
    }

    .result-banner {
      display: none;
      padding: .65rem 1rem;
      border-radius: 3px;
      font-size: .78rem;
      font-family: 'Orbitron', sans-serif;
      align-items: center;
      gap: .6rem;
      line-height: 1.5;
    }

    .result-banner.correct {
      display: flex;
      background: rgba(0, 255, 153, .08);
      border: 1px solid rgba(0, 255, 153, .3);
      color: var(--accent3);
    }

    .result-banner.wrong {
      display: flex;
      background: rgba(255, 61, 154, .08);
      border: 1px solid rgba(255, 61, 154, .3);
      color: var(--accent4);
    }

    .working-box {
      display: none;
      background: rgba(0, 0, 0, .2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.1rem 1.3rem;
    }

    .working-box.visible {
      display: block;
    }

    .working-title {
      font-family: 'Orbitron', sans-serif;
      font-size: .62rem;
      letter-spacing: .2em;
      color: var(--label);
      text-transform: uppercase;
      margin-bottom: .7rem;
      padding-bottom: .4rem;
      border-bottom: 1px solid var(--border);
    }

    .step-label {
      font-family: 'Orbitron', sans-serif;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin: 1rem 0 .5rem;
      padding-bottom: .3rem;
      border-bottom: 1px solid var(--border);
    }

    .step-label:first-of-type {
      margin-top: 0;
    }

    .wlabel {
      font-size: .72rem;
      color: var(--label);
      margin: .5rem 0 .1rem;
    }

    .wline {
      font-size: .8rem;
      line-height: 1.7;
    }

    .wline.total {
      margin-top: .5rem;
      padding-top: .5rem;
      border-top: 1px solid var(--border);
      font-size: .85rem;
    }
    .frac { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 4px; }
    .frac .num { border-bottom:1.5px solid currentColor; padding:0 6px 2px; text-align:center; width:100%; }
    .frac .den { padding:2px 6px 0; text-align:center; width:100%; }
    .formula-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; line-height:1; padding:.5rem 0; font-size:.82rem; }
    .big-paren { display:inline-block; font-size:2em; line-height:1; transform:scaleY(1.2); margin:0 1px; }
    .big-minus { display:inline-block; font-size:2em; line-height:1; vertical-align:middle; margin:0 2px; }
    @keyframes flash-ring { 0%,100%{opacity:.9} 50%{opacity:.35} }
    .flash-ring { animation: flash-ring 1.2s ease-in-out infinite; stroke: var(--highlight); stroke-width: 3; stroke-dasharray: 8 4; }

    .ca {
      color: var(--accent);
    }

    .cg {
      color: var(--accent3);
    }

    .cr {
      color: #ff3333;
    }

    .cp {
      color: var(--accent5);
    }

    .btn-row {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      padding: .5rem 0;
      border-radius: 3px;
      font-family: 'Share Tech Mono', monospace;
      font-size: .7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
      border: 1px solid;
      width: 140px;
      text-align: center;
    }

    .btn-check {
      background: rgba(0, 255, 153, .1);
      border-color: rgba(0, 255, 153, .4);
      color: #00ff99;
    }

    .btn-check:hover:not(:disabled) {
      background: rgba(0, 255, 153, .2);
    }

    .btn-check:disabled {
      opacity: .35;
      cursor: default;
    }

    .btn-shuffle {
      background: rgba(255, 107, 53, .1);
      border-color: rgba(255, 107, 53, .4);
      color: var(--accent2);
      margin-left: auto;
    }

    .btn-shuffle:hover {
      background: rgba(255, 107, 53, .2);
    }

    .btn-next {
      background: rgba(0, 229, 255, .1);
      border-color: rgba(0, 229, 255, .4);
      color: var(--accent);
    }

    .btn-next:hover {
      background: rgba(0, 229, 255, .2);
    }

    .btn-summary {
      background: rgba(167, 139, 250, .12);
      border-color: rgba(167, 139, 250, .4);
      color: var(--accent5);
    }

    .btn-summary:hover {
      background: rgba(167, 139, 250, .22);
    }

    .summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem 0 .8rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .summary-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .summary-item {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .9rem 1rem;
      margin-bottom: 1rem;
      background: rgba(0, 0, 0, .15);
    }

    .summary-item-head {
      display: flex;
      align-items: baseline;
      gap: .6rem;
      margin-bottom: .3rem;
    }

    .summary-qnum {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: var(--accent);
      font-size: .85rem;
      white-space: nowrap;
    }

    .summary-question {
      font-size: .82rem;
      color: #d0e4f0;
      font-weight: bold;
      line-height: 1.4;
    }

    .summary-answer {
      font-size: .74rem;
      margin: .45rem 0;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: .04em;
    }

    .progress-wrap {
      display: flex;
      gap: .4rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .progress-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: transparent;
      transition: background .2s, border-color .2s;
    }

    .progress-dot.done {
      background: var(--accent3);
      border-color: var(--accent3);
    }

    .progress-dot.active {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 6px rgba(0, 229, 255, .6);
    }

    .progress-label {
      font-size: .65rem;
      color: var(--label);
      margin-left: .4rem;
      letter-spacing: .1em;
    }

    .zoom-hint {
      position: absolute;
      bottom: .6rem;
      right: .7rem;
      font-family: 'Orbitron', sans-serif;
      font-size: .55rem;
      letter-spacing: .12em;
      color: var(--label);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: .35rem;
      pointer-events: none;
      opacity: .7;
    }

    .zoom-hint svg {
      width: 13px;
      height: 13px;
      fill: var(--label);
    }

    .diagram-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(5, 8, 16, .88);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    .diagram-modal.open {
      display: flex;
    }

    .modal-inner {
      position: relative;
      background: rgba(0, 0, 0, .35);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .8rem;
      max-width: min(92vw, 900px);
      max-height: 92vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      box-shadow: 0 0 60px rgba(0, 229, 255, .08);
      cursor: zoom-out;
    }

    .modal-inner svg {
      width: 100%;
      height: auto;
      max-height: calc(92vh - 5rem);
      display: block;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: .4rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: .65rem;
      letter-spacing: .18em;
      color: var(--label);
      text-transform: uppercase;
    }

    .modal-close {
      font-family: 'Share Tech Mono', monospace;
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      background: rgba(255, 61, 154, .08);
      border: 1px solid rgba(255, 61, 154, .35);
      color: var(--accent4);
      border-radius: 3px;
      padding: .3rem .7rem;
      transition: background .15s;
    }

    .modal-close:hover {
      background: rgba(255, 61, 154, .18);
    }
  </style>
</head>

<body>
  <header>
    <h1>Op-Amp Quiz 1</h1>
    <p>Op-Amp Circuits · Identification &amp; Analysis</p>
  </header>

  <div class="quiz-wrap">

    <!-- LEFT: circuit diagram -->
    <div class="circuit-col">
      <div class="circuit-panel" onclick="openModal()" title="Click to zoom">
        <div class="panel-label" id="panelLabel">Circuit 1</div>
        <div class="zoom-hint">
          <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none" />
            <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <line x1="6" y1="8" x2="10" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="8" y1="6" x2="8" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Zoom
        </div>

        <svg id="circuitSvg" viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg"
          font-family="'Share Tech Mono',monospace">
          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <!-- Arrowhead for output wire -->
            <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 Z" fill="#00e5ff" />
            </marker>
          </defs>

          <g id="circuit4Group">
            <!-- Identical layout to circuit2 — only R1 value and R2 (→LDR) differ -->

            <!-- Op-amp body -->
            <polygon points="260,110 260,310 460,210" fill="#0f1420" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow)" />
            <text x="272" y="200" fill="#00e5ff" font-size="22" font-weight="bold">+</text>
            <text x="272" y="240" fill="#00e5ff" font-size="26" font-weight="bold">−</text>
            <text x="345" y="215" fill="#668899" font-size="13" font-style="italic" text-anchor="middle">TL072</text>

            <!-- +9V supply rail (same as circuit2) -->
            <line x1="360" y1="160" x2="360" y2="60" stroke="#ff4444" stroke-width="2" />
            <line x1="20" y1="60" x2="360" y2="60" stroke="#ff4444" stroke-width="2" />
            <circle cx="360" cy="60" r="5" fill="#ff4444" />
            <circle cx="20" cy="60" r="7" fill="#0a0d14" stroke="#ff4444" stroke-width="2" />
            <circle cx="50" cy="60" r="5" fill="#ff4444" />
            <text x="380" y="65" fill="#ff4444" font-size="17" font-weight="bold">+9V</text>

            <!-- Vee → common (single supply, same as circuit2) -->
            <line x1="360" y1="260" x2="360" y2="380" stroke="#00ff99" stroke-width="2" />
            <circle cx="360" cy="380" r="4" fill="#00ff99" />

            <!-- Output -->
            <line x1="460" y1="210" x2="580" y2="210" stroke="#00e5ff" stroke-width="2" marker-end="url(#arr)" />
            <text x="540" y="190" fill="#00e5ff" font-size="14">V<tspan baseline-shift="sub" font-size="10">out</tspan></text>

            <!-- Voltage divider → non-inverting (+) input -->
            <!-- R1: 47 kΩ fixed (was 8 kΩ in circuit2) -->
            <line x1="50" y1="65" x2="50" y2="80" stroke="#00e5ff" stroke-width="2" />
            <rect x="36" y="80" width="28" height="80" rx="3" fill="#0f1420" stroke="#00e5ff" stroke-width="2" filter="url(#glow)" />
            <text x="24" y="122" fill="#00e5ff" font-size="14" font-weight="bold" text-anchor="end">R1</text>
            <text x="76" y="122" fill="#00e5ff" font-size="13" text-anchor="start">47kΩ</text>
            <line x1="50" y1="160" x2="50" y2="190" stroke="#00e5ff" stroke-width="2" />
            <circle cx="50" cy="190" r="5" fill="#00e5ff" />
            <line x1="50" y1="190" x2="260" y2="190" stroke="#00e5ff" stroke-width="2" />
            <!-- R2: LDR (was 4 kΩ resistor in circuit2) -->
            <line x1="50" y1="190" x2="50" y2="255" stroke="#00e5ff" stroke-width="2" />
            <rect x="36" y="255" width="28" height="80" rx="3" fill="#0f1420" stroke="#00e5ff" stroke-width="2" filter="url(#glow)" />
            <text x="24" y="297" fill="#00e5ff" font-size="14" font-weight="bold" text-anchor="end">R2</text>
            <text x="76" y="297" fill="#00e5ff" font-size="13" text-anchor="start">LDR</text>
            <!-- Sun symbol (light-sensitive indicator) -->
            <g transform="translate(8,255)" stroke="#ffd700" stroke-width="1.5" stroke-linecap="round">
              <circle r="7" fill="none" />
              <line x1="0" y1="-10" x2="0" y2="-8" />
              <line x1="0" y1="10"  x2="0" y2="8"  />
              <line x1="-10" y1="0" x2="-8" y2="0" />
              <line x1="10"  y1="0" x2="8"  y2="0" />
              <line x1="-7" y1="-7" x2="-6" y2="-6" />
              <line x1="7"  y1="-7" x2="6"  y2="-6" />
              <line x1="-7" y1="7"  x2="-6" y2="6"  />
              <line x1="7"  y1="7"  x2="6"  y2="6"  />
            </g>
            <line x1="50" y1="340" x2="50" y2="380" stroke="#00e5ff" stroke-width="2" />
            <circle cx="50" cy="380" r="4" fill="#00ff99" />

            <!-- 4.5V fixed reference → inverting (−) input (same as circuit2) -->
            <line x1="140" y1="230" x2="260" y2="230" stroke="#00e5ff" stroke-width="2" />
            <circle cx="140" cy="230" r="7" fill="#0a0d14" stroke="#ff4444" stroke-width="2" />
            <text x="140" y="255" fill="#ff4444" font-size="15" font-weight="bold" text-anchor="middle">4.5V</text>

            <!-- Common rail (same as circuit2) -->
            <line x1="20" y1="380" x2="560" y2="380" stroke="#00ff99" stroke-width="2.5" />
            <circle cx="20" cy="380" r="7" fill="#0a0d14" stroke="#00ff99" stroke-width="2" />
            <circle cx="560" cy="380" r="7" fill="#0a0d14" stroke="#00ff99" stroke-width="2" />
            <text x="310" y="403" fill="#00ff99" font-size="13" text-anchor="middle" letter-spacing="3">COMMON</text>
            <line x1="240" y1="380" x2="240" y2="400" stroke="#00ff99" stroke-width="2.5" />
            <line x1="220" y1="400" x2="260" y2="400" stroke="#00ff99" stroke-width="2.5" />
            <line x1="228" y1="410" x2="252" y2="410" stroke="#00ff99" stroke-width="2" />
            <line x1="236" y1="420" x2="244" y2="420" stroke="#00ff99" stroke-width="1.5" />
            <text x="180" y="400" fill="#00ff99" font-size="15" font-weight="bold">0V</text>

            <!-- Av_OL label -->
            <text x="490" y="310" fill="#a78bfa" font-size="15" font-weight="bold">Av<tspan baseline-shift="sub" font-size="11">OL</tspan> = 200,000</text>

            <!-- highlights: R1, LDR, and + input junction -->
            <g id="annHL_R1" display="none">
              <rect x="30" y="74" width="40" height="92" rx="6" fill="none" class="flash-ring" />
            </g>
            <g id="annHL_LDR" display="none">
              <rect x="30" y="249" width="40" height="92" rx="6" fill="none" class="flash-ring" />
            </g>
            <g id="annHL_Junc" display="none">
              <circle cx="50" cy="190" r="16" fill="none" class="flash-ring" />
            </g>

  <script>
    const LETTERS = ['A', 'B', 'C', 'D'];

    // setAnn — convenience helper used inside applyAnnotations
    function frac(num, den) {
      return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
    }

    function setAnn(id, visible) {
      const el = document.getElementById(id);
      if (el) el.setAttribute('display', visible ? 'inline' : 'none');
    }

    // ════════════════════════════════════════════════════════════════════════
    // CIRCUIT DEFINITIONS
    // ════════════════════════════════════════════════════════════════════════
    // One entry per circuit diagram. The quiz engine uses this to switch the
    // correct SVG group and sync annotations automatically.
    //
    // HOW TO ADD A NEW CIRCUIT
    // ─────────────────────────
    // 1. In the SVG, wrap the new circuit in a <g id="circuitNGroup" display="none">
    //    block alongside the existing circuit groups.
    //
    // 2. Add annotation <g> elements inside that group with display="none":
    //      <g id="annMyValue" display="none">
    //        <text ...>V = 3.3 V</text>
    //      </g>
    //    Give each annotation a unique id. The SVG text stays hidden until
    //    applyAnnotations makes it visible.
    //
    // 3. Add an entry to CIRCUITS:
    //      circuitN: {
    //        groupId: 'circuitNGroup',
    //        label: 'Circuit N — Description',
    //        applyAnnotations(Q, activeQDef) {
    //          // Show annotation once the relevant question is answered:
    //          setAnn('annMyValue', !!(Q.qX && Q.qX.ans));
    //          // To vary an SVG label value between questions:
    //          //   document.getElementById('myLabel').textContent = activeQDef.id === 'qX' ? 'new' : 'default';
    //        },
    //        onReset() {
    //          // Hide every annotation and restore any mutated SVG text:
    //          setAnn('annMyValue', false);
    //        }
    //      }
    //
    // 4. Add questions that reference circuit: 'circuitN' in QUESTION_DEFS below.
    //    The engine will show/hide circuits and call applyAnnotations automatically.
    // ════════════════════════════════════════════════════════════════════════
    const CIRCUITS = {
      circuit1: {
        groupId: 'circuit1Group',
        label: 'Circuit 1',
        applyAnnotations(Q, activeQDef) {},
        onReset() {}
      },
      circuit4: {
        groupId: 'circuit4Group',
        label: 'Circuit 4',
        applyAnnotations(Q, activeQDef) {
          const onQc1 = activeQDef.id === 'qc1';
          const onQ1b = activeQDef.id === 'q1b';
          const onQ2b = activeQDef.id === 'q2b';
          setAnn('annHL_R1',   onQc1);
          setAnn('annHL_LDR',  onQc1 || onQ1b);
          setAnn('annHL_Junc', onQ2b);
        },
        onReset() {
          ['annHL_R1', 'annHL_LDR', 'annHL_Junc'].forEach(id => setAnn(id, false));
        }
      },
      circuit2: {
        groupId: 'circuit2Group',
        label: 'Circuit 2',
        applyAnnotations(Q, activeQDef) {
          const onQ6 = activeQDef.id === 'q6';
          document.getElementById('lblR2circ2').textContent = onQ6 ? '12kΩ' : '4kΩ';
          setAnn('annVplus',       !!(Q.q4 && Q.q4.ans && !onQ6));
          setAnn('annVout',        !!(Q.q5 && Q.q5.ans && !onQ6));
          setAnn('annHighlightR2', onQ6);
          setAnn('annVplus6',      !!(Q.q6 && Q.q6.ans));
          setAnn('annVout6',       !!(Q.q6 && Q.q6.ans));
        },
        onReset() {
          document.getElementById('lblR2circ2').textContent = '4kΩ';

      return QUESTION_DEFS.find(q => q.id === ORDER[idx]);
    }

    // ── UI generation ──────────────────────────────────────────────────────
    function buildUI() {
      const progressWrap = document.getElementById('progressWrap');
      QUESTION_DEFS.forEach(qdef => {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        dot.id = 'dot-' + qdef.id;
        progressWrap.appendChild(dot);
      });
      const lbl = document.createElement('span');
      lbl.className = 'progress-label';
      lbl.id = 'progressLabel';
      progressWrap.appendChild(lbl);

      const container = document.getElementById('questionsContainer');
      QUESTION_DEFS.forEach((qdef, i) => {
        const div = document.createElement('div');
        div.className = 'q-panel';
        div.id = qdef.id + 'Panel';
        if (i > 0) div.style.display = 'none';
        div.innerHTML = `
          <div class="q-header">
            <div class="q-num" id="${qdef.id}Num">Q${i + 1}</div>
            <div>
              <div class="q-text">${qdef.text}</div>
              <div class="q-hint">${qdef.hint}</div>
            </div>
          </div>
          <div class="options" id="${qdef.id}Options"></div>
          <div class="result-banner" id="${qdef.id}Banner">
            <span id="${qdef.id}Icon"></span>&nbsp;<span id="${qdef.id}BannerText"></span>
          </div>
          <div class="working-box" id="${qdef.id}Working">
            <div class="working-title">${qdef.workingTitle || 'Explanation'}</div>
            <div id="${qdef.id}WorkingContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-prev" id="${qdef.id}Back" onclick="goBack()" style="display:none">← Back</button>
            <button class="btn btn-check" id="${qdef.id}Check" onclick="checkCurrent()" disabled>Check</button>
            <button class="btn btn-next" id="${qdef.id}Advance" onclick="nextQuestion()" style="display:none">Next →</button>
            <button class="btn btn-shuffle" onclick="resetQuiz()">↺ Restart</button>
          </div>`;
        container.appendChild(div);
      });
    }

    // ── Option rendering ────────────────────────────────────────────────────
    function renderOptions(qid) {
      const st = Q[qid];
      const c = document.getElementById(qid + 'Options');
      c.innerHTML = '';
      st.opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
        btn.addEventListener('click', () => selectOption(qid, i));
        c.appendChild(btn);
      });
    }

    function selectOption(qid, i) {
      if (Q[qid].ans) return;
      Q[qid].sel = i;
      const chk = document.getElementById(qid + 'Check');
      if (chk) chk.disabled = false;
      document.querySelectorAll('#' + qid + 'Options .option-btn').forEach((b, idx) =>
        b.classList.toggle('selected', idx === i));
    }

    function markOptions(qid, sel, cor, ok) {
      document.querySelectorAll('#' + qid + 'Options .option-btn').forEach((btn, i) => {
        btn.disabled = true;
        if (i === cor) { btn.classList.remove('selected'); btn.classList.add('correct'); btn.innerHTML += `<span class="result-icon">✓</span>`; }
        else if (i === sel && !ok) { btn.classList.remove('selected'); btn.classList.add('wrong'); btn.innerHTML += `<span class="result-icon">✗</span>`; }
        else btn.classList.add('dimmed');
      });
    }

    function setBanner(qid, ok, correctText) {
      const banner = document.getElementById(qid + 'Banner');
      document.getElementById(qid + 'Icon').textContent = ok ? '✓' : '✗';
      if (ok) {
        banner.className = 'result-banner correct';
        document.getElementById(qid + 'BannerText').innerHTML = `Correct! ${correctText}`;
      } else {
        banner.className = 'result-banner wrong';
        document.getElementById(qid + 'BannerText').innerHTML = `The correct answer is: ${correctText}`;
      }
    }

    // ── Navigation ──────────────────────────────────────────────────────────
    function showQuestion(idx) {
      curIdx = idx;
      const qdef = getQDef(idx);

      QUESTION_DEFS.forEach(q => document.getElementById(q.id + 'Panel').style.display = 'none');
      document.getElementById('summaryPanel').style.display = 'none';
      document.getElementById(qdef.id + 'Panel').style.display = 'flex';
      document.querySelector('.circuit-col').style.display = '';

      // Update displayed question number to reflect ORDER position
      const numEl = document.getElementById(qdef.id + 'Num');
      if (numEl) numEl.textContent = 'Q' + (idx + 1);

      // Back button: visible only when not on first question
      const backBtn = document.getElementById(qdef.id + 'Back');
      if (backBtn) backBtn.style.display = idx > 0 ? 'inline-block' : 'none';

      // Switch circuit diagram
      Object.values(CIRCUITS).forEach(c =>
        document.getElementById(c.groupId).setAttribute('display', 'none'));
      const circuit = CIRCUITS[qdef.circuit];
      document.getElementById(circuit.groupId).setAttribute('display', 'inline');
      document.getElementById('panelLabel').textContent = circuit.label;
      circuit.applyAnnotations(Q, qdef);

      updateProgress();
    }

    function checkCurrent() {
      const qdef = getQDef(curIdx);
      const st = Q[qdef.id];
      if (st.ans || st.sel === null) return;
      st.ans = true;
      const ok = st.sel === st.cor;
      markOptions(qdef.id, st.sel, st.cor, ok);
      setBanner(qdef.id, ok, qdef.correctLabel);
      document.getElementById(qdef.id + 'Working').className = 'working-box visible';
      qdef.showWorking(document.getElementById(qdef.id + 'WorkingContent'));
      CIRCUITS[qdef.circuit].applyAnnotations(Q, qdef);
      advanceQuestion();
    }

    function advanceQuestion() {
      const qdef = getQDef(curIdx);
      const chk = document.getElementById(qdef.id + 'Check');
      if (chk) chk.style.display = 'none';
      const isLast = curIdx === ORDER.length - 1;
      const advBtn = document.getElementById(qdef.id + 'Advance');
      if (advBtn) {
        advBtn.textContent = isLast ? 'See Summary →' : 'Next →';
        advBtn.className = 'btn ' + (isLast ? 'btn-summary' : 'btn-next');
        advBtn.onclick = isLast ? showSummary : nextQuestion;
        advBtn.style.display = 'inline-block';
      }
      updateProgress();
    }

    function nextQuestion() { showQuestion(curIdx + 1); }

    function goBack() {
      if (curIdx === 0) return;
      resetQuestion(getQDef(curIdx).id);
      const prevDef = getQDef(curIdx - 1);
      resetQuestion(prevDef.id);
      showQuestion(curIdx - 1);
    }

    function resetQuestion(qid) {
      const st = Q[qid];
      st.sel = null; st.ans = false;
      renderOptions(qid);
      document.getElementById(qid + 'Banner').className = 'result-banner';
      document.getElementById(qid + 'Working').className = 'working-box';
      const chk = document.getElementById(qid + 'Check');
      if (chk) { chk.style.display = 'inline-block'; chk.disabled = true; }
      const advBtn = document.getElementById(qid + 'Advance');
      if (advBtn) advBtn.style.display = 'none';
    }

    function updateProgress() {
      ORDER.forEach((qid, i) => {
        const d = document.getElementById('dot-' + qid);
        if (!d) return;
        d.className = 'progress-dot';
        if (i === curIdx) d.classList.add('active');
        else if (Q[qid] && Q[qid].ans) d.classList.add('done');
      });
      const lbl = document.getElementById('progressLabel');
      if (lbl && curIdx >= 0) lbl.textContent = (curIdx + 1) + ' / ' + ORDER.length;
    }

    // ── Summary ─────────────────────────────────────────────────────────────
    function showSummary() {
      curIdx = -1;
      QUESTION_DEFS.forEach(q => document.getElementById(q.id + 'Panel').style.display = 'none');
      document.getElementById('summaryPanel').style.display = 'block';
      Object.values(CIRCUITS).forEach(c =>
        document.getElementById(c.groupId).setAttribute('display', 'none'));
      document.querySelector('.circuit-col').style.display = 'none';

      const items = ORDER.map((qid, i) => {
        const qdef = QUESTION_DEFS.find(q => q.id === qid);
        const st = Q[qid];
        const ans = (st.sel != null && st.opts[st.sel]) ? st.opts[st.sel].label : '—';
        const ok = st.sel === st.cor;
        const colour = ok ? 'var(--accent3)' : '#ff3366';
        const mark = ok ? '✓' : '✗';
        const working = document.getElementById(qid + 'WorkingContent').innerHTML;
        return `<div class="summary-item">
          <div class="summary-item-head"><span class="summary-qnum">Q${i + 1}</span><span class="summary-question">${qdef.text}</span></div>
          <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
          <div class="working-box visible">${working}</div>
        </div>`;
      }).join('');

      document.getElementById('summaryContent').innerHTML = items;
      ORDER.forEach(qid => { const d = document.getElementById('dot-' + qid); if (d) d.className = 'progress-dot done'; });
      document.getElementById('progressLabel').textContent = 'Complete';
    }

    // ── Full reset ───────────────────────────────────────────────────────────
    function resetQuiz() {
      // Reset all circuit state (annotations, SVG mutations)
      Object.values(CIRCUITS).forEach(c => {
        if (c.onReset) c.onReset();
        document.getElementById(c.groupId).setAttribute('display', 'none');
      });

      // Rebuild question order.
      // Currently fixed (same order as QUESTION_DEFS). To randomise within a
      // circuit group, group questions by their circuit key, shuffle each group
      // independently, then concatenate — circuit groups must stay in sequence
      // because later questions build on earlier ones within the same circuit.
      ORDER = QUESTION_DEFS.map(q => q.id);

      // Reset all question state
      ORDER.forEach(qid => {
        const qdef = QUESTION_DEFS.find(q => q.id === qid);
        const opts = qdef.buildOptions();
        Q[qid] = { sel: null, ans: false, cor: opts.findIndex(o => o.type === 'correct'), opts };
        renderOptions(qid);
        document.getElementById(qid + 'Banner').className = 'result-banner';
        document.getElementById(qid + 'Working').className = 'working-box';
        const chk = document.getElementById(qid + 'Check');
        if (chk) { chk.style.display = 'inline-block'; chk.disabled = true; }
        const advBtn = document.getElementById(qid + 'Advance');
        if (advBtn) advBtn.style.display = 'none';
      });

      document.getElementById('summaryPanel').style.display = 'none';
      curIdx = 0;
      showQuestion(0);
    }

    // ── Zoom modal ───────────────────────────────────────────────────────────
    function openModal() {
      const src = document.getElementById('circuitSvg'), dst = document.getElementById('modalSvg');
      dst.innerHTML = src.innerHTML; dst.setAttribute('viewBox', src.getAttribute('viewBox'));
      document.getElementById('modalLabel').textContent = document.getElementById('panelLabel').textContent;
      document.getElementById('diagramModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('diagramModal').classList.remove('open');
      document.getElementById('modalSvg').innerHTML = '';
      document.body.style.overflow = '';
    }
    function handleModalClick(e) { if (e.target.closest('.modal-close')) return; closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // ── Initialise ───────────────────────────────────────────────────────────
    buildUI();
    resetQuiz();

    /* ─── DEV: jump straight to a question for testing ─────────────────────
       Console:  jump(2)         → go to Q2
                 jump(2, true)   → go to Q2 already answered
       URL:      ?q=2            → loads on Q2
                 ?q=2&ans=1      → loads on Q2, answered
       Remove this block before publishing. */
    function jump(n, answered) {
      const idx = n - 1;
      if (idx < 0 || idx >= ORDER.length) { console.warn('jump: no question', n); return; }
      showQuestion(idx);
      if (answered) {
        const st = Q[getQDef(idx).id];
        if (st) st.sel = st.cor;
        checkCurrent();
      }
    }
    window.jump = jump;
    {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) jump(+p.get('q'), p.has('ans'));
    }
    /* ──────────────────────────────────────────────────────────────────────── */
  </script>
</body>
