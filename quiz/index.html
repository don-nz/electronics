<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d14; --panel: #0f1420; --panel2: #0c1119;
            --border: #1e2d4a; --grid: rgba(0,229,255,0.06);
            --text: #c8d8e8; --label: #5a7a9a;
            --subject: #00ff99; --subject-glow: rgba(0,255,153,0.5);
            --c-filter: #ff6b35; --c-resistor: #ffd166;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'Share Tech Mono',monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:3rem 1.5rem; background-image: linear-gradient(var(--grid) 1px,transparent 1px), linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:40px 40px; }
        .crumb { width:100%; max-width:560px; margin-bottom:1.5rem; font-size:0.68rem; letter-spacing:0.15em; text-transform:uppercase; }
        .crumb a { color:var(--label); text-decoration:none; transition:color 0.15s; }
        .crumb a:hover { color:var(--subject); }
        .crumb span { color:var(--subject); }
        header { text-align:center; margin-bottom:3rem; }
        header h1 { font-family:'Orbitron',sans-serif; font-size:clamp(2rem,6vw,3.5rem); font-weight:900; letter-spacing:0.12em; color:var(--subject); text-shadow:0 0 40px var(--subject-glow); text-transform:uppercase; }
        header p { margin-top:0.6rem; color:var(--label); font-size:0.8rem; letter-spacing:0.2em; text-transform:uppercase; }
        .nav { width:100%; max-width:560px; display:flex; flex-direction:column; gap:0.6rem; }
        .nav-item { display:flex; align-items:center; gap:1rem; padding:1rem 1.3rem; text-decoration:none; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:4px; transition:background 0.15s,color 0.15s; position:relative; }
        .nav-item::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c); opacity:0.7; border-radius:4px 0 0 4px; }
        .nav-item::after { content:'→'; margin-left:auto; opacity:0; color:var(--c); transition:opacity 0.15s,transform 0.15s; transform:translateX(-4px); font-size:0.8rem; }
        .nav-item:hover { color:var(--c); }
        .nav-item:hover::after { opacity:1; transform:translateX(0); }
        .nav-item.filter { --c: var(--c-filter); }
        .nav-item.filter:hover { background:rgba(255,107,53,0.05); }
        .nav-item.resistor { --c: var(--c-resistor); }
        .nav-item.resistor:hover { background:rgba(255,209,102,0.05); }
        .nav-item-title { font-family:'Orbitron',sans-serif; font-size:0.82rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--c); }
        .nav-item-icon { font-size:1.1rem; opacity:0.5; width:1.4rem; text-align:center; flex-shrink:0; }
        .nav-item-text { display:flex; flex-direction:column; gap:0.25rem; }
        .nav-item-desc { font-size:0.62rem; color:var(--label); line-height:1.5; }
        footer { margin-top:4rem; font-size:0.65rem; color:var(--label); opacity:0.4; letter-spacing:0.15em; text-transform:uppercase; }
    </style>
</head>
<body>
    <div class="crumb"><a href="../index.html">Electronics</a> / <span>Quiz</span></div>
    <header>
        <h1>Quiz</h1>
        <p>Test your understanding</p>
    </header>
    <nav class="nav">
        <a class="nav-item filter" href="filter/index.html">
            <span class="nav-item-icon">∿</span>
            <span class="nav-item-text">
                <span class="nav-item-title">Filter</span>
                <span class="nav-item-desc">Quizzes on filter gain, octaves, decades and roll-off</span>
            </span>
        </a>
        <a class="nav-item resistor" href="resistor/index.html">
            <span class="nav-item-icon">Ω</span>
            <span class="nav-item-text">
                <span class="nav-item-title">Resistor</span>
                <span class="nav-item-desc">Quizzes on resistor circuits &amp; troubleshooting</span>
            </span>
        </a>
    </nav>
    <footer>Electronics // Quiz</footer>
</body>
</html>
