<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resistor Troubleshooter Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg:#0a0d14;--panel:#0f1420;--border:#1e2d4a;
      --accent:#00e5ff;--accent2:#ff6b35;--accent3:#00ff99;
      --accent4:#ff3d9a;--accent5:#a78bfa;
      --grid:rgba(0,229,255,0.06);--text:#c8d8e8;--label:#5a7a9a;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg);color:var(--text);
      font-family:'Share Tech Mono',monospace;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;padding:2rem 1rem;
      background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:40px 40px;
    }
    header{text-align:center;margin-bottom:2rem;width:100%;}
    header h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900;letter-spacing:.12em;color:var(--accent);text-shadow:0 0 30px rgba(0,229,255,.5);text-transform:uppercase;}
    header p{margin-top:.5rem;color:var(--label);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;}

    .quiz-wrap{width:100%;max-width:1400px;display:flex;flex-direction:column;gap:1.5rem;}
    @media(min-width:900px){
      .quiz-wrap{display:grid;grid-template-columns:minmax(340px,54%) 1fr;gap:1.2rem;align-items:start;}
      .circuit-col{position:sticky;top:1.5rem;}
      .questions-col .card{padding:1rem 1.1rem;}
      .questions-col .option-btn{padding:.4rem .65rem;font-size:.74rem;}
      .questions-col .q-text{font-size:.82rem;}
      .questions-col .result-banner{font-size:.72rem;padding:.5rem .8rem;}
      .questions-col .btn{width:110px;font-size:.64rem;}
      .questions-col .working-box{padding:.75rem .9rem;}
      .questions-col .options{gap:.35rem;}
    }

    .card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1.6rem;}
    .circuit-panel{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:4px;padding:.8rem;}
    .circuit-panel svg{width:100%;height:auto;display:block;}
    .panel-label{font-size:.58rem;letter-spacing:.18em;color:var(--label);text-transform:uppercase;text-align:center;margin-bottom:6px;}

    .q-panel{display:flex;flex-direction:column;gap:1rem;}
    .q-header{display:flex;align-items:flex-start;gap:1rem;}
    .q-num{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;color:var(--accent);white-space:nowrap;padding-top:.15rem;}
    .q-text{color:#d0e4f0;font-size:.9rem;font-weight:bold;line-height:1.5;}
    .q-hint{font-size:.75rem;color:var(--label);font-weight:normal;margin-top:.3rem;}

    .options{display:flex;flex-direction:column;gap:.6rem;}
    .option-btn{width:100%;padding:.7rem 1rem;border-radius:3px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:.82rem;text-align:left;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;gap:.7rem;}
    .option-btn:hover:not(:disabled){border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.05);}
    .option-btn.selected{border-color:rgba(0,229,255,.6);background:rgba(0,229,255,.08);color:var(--accent);}
    .option-btn.correct{border-color:var(--accent3);background:rgba(0,255,153,.08);color:var(--accent3);}
    .option-btn.wrong{border-color:var(--accent4);background:rgba(255,61,154,.08);color:var(--accent4);}
    .option-btn.dimmed{opacity:.35;}
    .option-letter{font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;min-width:22px;}
    .result-icon{font-size:1.1rem;margin-left:auto;}

    .result-banner{display:none;padding:.65rem 1rem;border-radius:3px;font-size:.78rem;font-family:'Orbitron',sans-serif;align-items:center;gap:.6rem;line-height:1.5;}
    .result-banner.correct{display:flex;background:rgba(0,255,153,.08);border:1px solid rgba(0,255,153,.3);color:var(--accent3);}
    .result-banner.wrong{display:flex;background:rgba(255,61,154,.08);border:1px solid rgba(255,61,154,.3);color:var(--accent4);}

    .working-box{display:none;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:4px;padding:1.1rem 1.3rem;}
    .working-box.visible{display:block;}
    .working-title{font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:.2em;color:var(--label);text-transform:uppercase;margin-bottom:.7rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);}
    .wline{font-size:.8rem;line-height:1.8;}
    .wline.total{margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--border);}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
    .btn-row-inner{display:flex;gap:.6rem;flex-wrap:wrap;}
    .btn{padding:.5rem 0;border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s;border:1px solid;width:130px;text-align:center;}
    .btn-check{background:rgba(0,255,153,.1);border-color:rgba(0,255,153,.4);color:#00ff99;}
    .btn-check:hover:not(:disabled){background:rgba(0,255,153,.2);}
    .btn-check:disabled{opacity:.35;cursor:default;}
    .btn-next{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.4);color:var(--accent);display:none;}
    .btn-next:hover{background:rgba(0,229,255,.2);}
    .btn-prev{background:rgba(90,122,154,.1);border-color:rgba(90,122,154,.4);color:var(--label);}
    .btn-prev:hover{background:rgba(90,122,154,.2);}
    .btn-shuffle{background:rgba(255,107,53,.1);border-color:rgba(255,107,53,.4);color:var(--accent2);margin-left:auto;}
    .btn-shuffle:hover{background:rgba(255,107,53,.2);}
    .btn-summary{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.4);color:var(--accent5);}
    .btn-summary:hover{background:rgba(167,139,250,.2);}

    .progress-wrap{display:flex;gap:.4rem;align-items:center;margin-bottom:.8rem;}
    .progress-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--border);background:transparent;transition:background .2s,border-color .2s;}
    .progress-dot.done{background:var(--accent3);border-color:var(--accent3);}
    .progress-dot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px rgba(0,229,255,.6);}
    .progress-label{font-size:.65rem;color:var(--label);margin-left:.4rem;letter-spacing:.1em;}

    @keyframes pulse-ring{0%{opacity:.9;}50%{opacity:.35;}100%{opacity:.9;}}
    .target-pulse{animation:pulse-ring 1.2s ease-in-out infinite;}

    .summary-item{margin-bottom:1.2rem;padding-bottom:1.2rem;border-bottom:1px solid var(--border);}
    .summary-item:last-child{border-bottom:none;}
    .summary-q{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--accent);margin-bottom:.3rem;}
    .summary-question{font-size:.8rem;color:#d0e4f0;margin-bottom:.4rem;line-height:1.5;}
    .summary-answer{font-size:.78rem;margin-bottom:.5rem;}

    /* ── Example / Randomise mode toggle ── */
    .mode-toggle{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem;font-family:'Share Tech Mono',monospace;}
    .mode-toggle-label{font-size:.58rem;letter-spacing:.18em;color:var(--label);text-transform:uppercase;}
    .mode-seg{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;flex-wrap:wrap;}
    .mode-seg button{font-family:'Share Tech Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:.4rem .95rem;border:none;background:transparent;color:var(--label);transition:background .15s,color .15s;}
    .mode-seg button + button{border-left:1px solid var(--border);}
    .mode-seg button.active{background:rgba(0,229,255,.12);color:var(--accent);}
    .mode-seg button:not(.active):hover{background:rgba(0,229,255,.04);color:var(--text);}

    /* ── Zoom hint on circuit panel ── */
    .circuit-panel{position:relative;cursor:zoom-in;}
    .zoom-hint{
      position:absolute;bottom:.6rem;right:.7rem;
      font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:.12em;
      color:var(--label);text-transform:uppercase;
      display:flex;align-items:center;gap:.35rem;
      pointer-events:none;opacity:.7;
    }
    .zoom-hint svg{width:13px;height:13px;fill:var(--label);}

    /* ── Modal overlay ── */
    .diagram-modal{
      display:none;position:fixed;inset:0;z-index:1000;
      background:rgba(5,8,16,.88);
      backdrop-filter:blur(4px);
      align-items:center;justify-content:center;
      padding:1.2rem;
    }
    .diagram-modal.open{display:flex;}
    .modal-inner{
      position:relative;
      background:rgba(0,0,0,.35);
      border:1px solid var(--border);
      border-radius:6px;
      padding:.8rem;
      max-width:min(92vw,900px);
      max-height:92vh;
      width:100%;
      display:flex;flex-direction:column;gap:.5rem;
      box-shadow:0 0 60px rgba(0,229,255,.08);
      cursor:zoom-out;
    }
    .modal-inner svg{
      width:100%;height:auto;
      max-height:calc(92vh - 5rem);
      display:block;
    }
    .modal-header{
      display:flex;align-items:center;justify-content:space-between;
      padding-bottom:.4rem;border-bottom:1px solid var(--border);
    }
    .modal-title{
      font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.18em;
      color:var(--label);text-transform:uppercase;
    }
    .modal-close{
      font-family:'Share Tech Mono',monospace;font-size:.68rem;letter-spacing:.1em;
      text-transform:uppercase;cursor:pointer;
      background:rgba(255,61,154,.08);border:1px solid rgba(255,61,154,.35);
      color:var(--accent4);border-radius:3px;padding:.3rem .7rem;
      transition:background .15s;
    }
    .modal-close:hover{background:rgba(255,61,154,.18);}
  </style>
</head>
<body>
<header>
  <h1>Resistor Troubleshooter Quiz</h1>
  <p>Read the virtual meters — identify the correct voltage</p>
</header>

<div class="quiz-wrap">

  <!-- ════════════════════════════════════════════════
       LEFT COLUMN: circuit diagram (sticky on desktop)

       IEC convention: empty rectangle body, label above, value below.

       Wire naming standard (clockwise from battery +):
         Cyan   C1–C12  — main series rail
         Purple P1–P8   — R4/R5/R6 parallel bank
         Orange O1–O8   — R7/R8/R9 parallel bank
       Meter probe naming:
         M-Rx-L / M-Rx-R   left/right vertical drops
         M-Rx-HL / M-Rx-HR  horizontal shelf segments to badge

       ════════════════════════════════════════════════
       SVG coordinate reference (box = resistor rect)
       ────────────────────────────────────────────────
       Top rail y=200
         R1  box x100–190  y182–218  label-above y=170  value-below y=236  mid-x=145
         R2  box x230–320  y182–218  label-above y=170  value-below y=236  mid-x=275
         R3  box x360–450  y182–218  label-above y=170  value-below y=236  mid-x=405
       Purple bank  left-rail x=520  right-rail x=720
         R6  box x560–680  y42–78   label-above y=30   value-below y=96   mid-x=620
         R5  box x560–680  y182–218 label-above y=170  value-below y=236  mid-x=620
         R4  box x560–680  y322–358 label-above y=310  value-below y=376  mid-x=620
       Bottom rail y=720
         R10 box x180–340  y702–738 label-above y=690  value-below y=756  mid-x=260
       Orange bank  left-rail x=520  right-rail x=720
         R8  box x530–610  y572–608 label-above y=560  value-below y=626  mid-x=570
         R9  box x630–710  y572–608 label-above y=560  value-below y=626  mid-x=670
         R7  box x570–670  y818–854 label-above y=806  value-below y=872  mid-x=620

       Meter layout — IEC value sits 18px below box bottom.
       Probe verticals start at box bottom, clear the value text,
       then reach the shelf. Shelf = value-below y + 24.
         R1,R2,R3,R5  shelf y=260  badge top y=260
         R6            shelf y=120  badge top y=120
         R4            shelf y=400  badge top y=400
         R10           shelf y=780  badge top y=780
         R8,R9         shelf y=650  badge top y=650
         R7            shelf y=896  badge top y=896
       Badge: 58 wide × 28 tall, centred on mid-x.
              badge-left = mid-x − 29
       ════════════════════════════════════════════════ -->

  <!-- ── Diagram zoom modal ── -->
  <div class="diagram-modal" id="diagramModal" onclick="handleModalClick(event)">
    <div class="modal-inner" id="modalInner">
      <div class="modal-header">
        <span class="modal-title">Circuit Diagram — <span id="modalVoltLabel">10 V</span> Source</span>
        <button class="modal-close" onclick="closeModal()">✕ Close</button>
      </div>
      <svg id="modalSvg" viewBox="0 0 1010 1000" xmlns="http://www.w3.org/2000/svg"
           font-family="'Share Tech Mono',monospace">
        <!-- populated by JS cloneCircuit() -->
      </svg>
      <div class="modal-hint"></div>
    </div>
  </div>

  <div class="circuit-col">
    <div class="mode-toggle">
      <span class="mode-toggle-label">Values</span>
      <div class="mode-seg" id="modeSeg">
        <button id="modeExample1" class="active" onclick="setMode('example1')">Example 1</button>
        <button id="modeExample2" onclick="setMode('example2')">Example 2</button>
        <button id="modeExample3" onclick="setMode('example3')">Example 3</button>
        <button id="modeRandomise" onclick="setMode('randomise')">Randomise</button>
      </div>
    </div>
    <div class="circuit-panel" onclick="openModal()" title="Click to zoom">
      <div class="panel-label">Circuit Diagram — <span id="panelVoltLabel">10 V</span> Source</div>
      <div class="zoom-hint">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
          <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="6" y1="8" x2="10" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="8" y1="6" x2="8" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Zoom
      </div>

      <svg id="circuitSvg" viewBox="0 0 1010 1000" xmlns="http://www.w3.org/2000/svg"
           font-family="'Share Tech Mono',monospace">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- ══ translate(0,30): shifts entire circuit down 30px so R6 label is visible ══ -->
        <g transform="translate(0,30)">
        <line id="C1"  x1="50"  y1="424" x2="50"  y2="200" stroke="#00e5ff" stroke-width="2"/><!-- battery+ → top-left -->
        <line id="C2"  x1="50"  y1="200" x2="100" y2="200" stroke="#00e5ff" stroke-width="2"/><!-- top-left → left of R1 -->
        <line id="C3"  x1="190" y1="200" x2="230" y2="200" stroke="#00e5ff" stroke-width="2"/><!-- right R1 → left R2 -->
        <line id="C4"  x1="320" y1="200" x2="360" y2="200" stroke="#00e5ff" stroke-width="2"/><!-- right R2 → left R3 -->
        <line id="C5"  x1="450" y1="200" x2="500" y2="200" stroke="#00e5ff" stroke-width="2"/><!-- right R3 → purple left junction -->
        <line id="C6"  x1="740" y1="200" x2="900" y2="200" stroke="#00e5ff" stroke-width="2"/><!-- purple right junction → top-right -->
        <line id="C7a" x1="900" y1="200" x2="900" y2="398" stroke="#00e5ff" stroke-width="2"/><!-- right wall top — gap for ammeter circle -->
        <line id="C7b" x1="900" y1="482" x2="900" y2="720" stroke="#00e5ff" stroke-width="2"/><!-- right wall bottom -->
        <line id="C8"  x1="900" y1="720" x2="760" y2="720" stroke="#00e5ff" stroke-width="2"/><!-- bottom-right → orange right -->
        <line id="C9"  x1="480" y1="720" x2="340" y2="720" stroke="#00e5ff" stroke-width="2"/><!-- orange left → right of R10 -->
        <line id="C11" x1="180" y1="720" x2="50"  y2="720" stroke="#00e5ff" stroke-width="2"/><!-- left of R10 → bottom-left -->
        <line id="C12" x1="50"  y1="720" x2="50"  y2="456" stroke="#00e5ff" stroke-width="2"/><!-- bottom-left → battery− -->

        <!-- ══ R1 — IEC: empty box, label above, value below ══ -->
        <rect id="box-r1" x="100" y="182" width="90" height="36" rx="3" fill="#0f1420" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
        <text x="145" y="170" fill="#00e5ff" text-anchor="middle" font-size="16" font-weight="bold">R1</text>
        <text id="lblR1" x="145" y="236" fill="#00e5ff" text-anchor="middle" font-size="15">—</text>

        <!-- ══ R2 ══ -->
        <rect id="box-r2" x="230" y="182" width="90" height="36" rx="3" fill="#0f1420" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
        <text x="275" y="170" fill="#00e5ff" text-anchor="middle" font-size="16" font-weight="bold">R2</text>
        <text id="lblR2" x="275" y="236" fill="#00e5ff" text-anchor="middle" font-size="15">—</text>

        <!-- ══ R3 ══ -->
        <rect id="box-r3" x="360" y="182" width="90" height="36" rx="3" fill="#0f1420" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
        <text x="405" y="170" fill="#00e5ff" text-anchor="middle" font-size="16" font-weight="bold">R3</text>
        <text id="lblR3" x="405" y="236" fill="#00e5ff" text-anchor="middle" font-size="15">—</text>

        <!-- ══ PURPLE BANK — P wires ══ -->
        <line id="P7" x1="500" y1="10"  x2="500" y2="390" stroke="#a78bfa" stroke-width="2"/><!-- left rail -->
        <line id="P8" x1="740" y1="10"  x2="740" y2="390" stroke="#a78bfa" stroke-width="2"/><!-- right rail -->
        <line id="P1" x1="500" y1="10"  x2="560" y2="10"  stroke="#a78bfa" stroke-width="2"/><!-- left jn → left R6 -->
        <line id="P2" x1="680" y1="10"  x2="740" y2="10"  stroke="#a78bfa" stroke-width="2"/><!-- right R6 → right jn -->
        <line id="P3" x1="500" y1="200" x2="560" y2="200" stroke="#a78bfa" stroke-width="2"/><!-- left jn → left R5 -->
        <line id="P4" x1="680" y1="200" x2="740" y2="200" stroke="#a78bfa" stroke-width="2"/><!-- right R5 → right jn -->
        <line id="P5" x1="500" y1="390" x2="560" y2="390" stroke="#a78bfa" stroke-width="2"/><!-- left jn → left R4 -->
        <line id="P6" x1="680" y1="390" x2="740" y2="390" stroke="#a78bfa" stroke-width="2"/><!-- right R4 → right jn -->

        <!-- ══ R6 (shifted up 20px more: box y=−8–28, branch y=10) ══ -->
        <rect id="box-r6" x="560" y="-8" width="120" height="36" rx="3" fill="#0f1420" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
        <text x="620" y="-18" fill="#a78bfa" text-anchor="middle" font-size="16" font-weight="bold">R6</text>
        <text id="lblR6" x="620" y="46" fill="#a78bfa" text-anchor="middle" font-size="15">—</text>

        <!-- ══ R5 ══ -->
        <rect id="box-r5" x="560" y="182" width="120" height="36" rx="3" fill="#0f1420" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
        <text x="620" y="170" fill="#a78bfa" text-anchor="middle" font-size="16" font-weight="bold">R5</text>
        <text id="lblR5" x="620" y="236" fill="#a78bfa" text-anchor="middle" font-size="15">—</text>

        <!-- ══ R4 (shifted down 20px more: box y=372–408, branch y=390) ══ -->
        <rect id="box-r4" x="560" y="372" width="120" height="36" rx="3" fill="#0f1420" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
        <text x="620" y="360" fill="#a78bfa" text-anchor="middle" font-size="16" font-weight="bold">R4</text>
        <text id="lblR4" x="620" y="426" fill="#a78bfa" text-anchor="middle" font-size="15">—</text>

        <!-- Purple junction dots -->
        <circle cx="500" cy="200" r="7" fill="#a78bfa" filter="url(#glow)"/>
        <circle cx="740" cy="200" r="7" fill="#a78bfa" filter="url(#glow)"/>

        <!-- ══ BATTERY ══ -->
        <line x1="26" y1="424" x2="74" y2="424" stroke="#ff3333" stroke-width="4"/>
        <line x1="34" y1="456" x2="66" y2="456" stroke="#ff3333" stroke-width="2"/>
        <text x="84" y="428" fill="#ff3333" font-size="16" font-weight="bold">+</text>
        <text x="84" y="460" fill="#ff3333" font-size="16" font-weight="bold">−</text>

        <!-- ══ BATTERY VOLTAGE CIRCLE — r=42, centred left of battery ══ -->
        <!-- Probe from + terminal (y=424) down to circle top edge (y=398) -->
        <!-- Probe from − terminal (y=456) up to circle bottom edge (y=482) -->

// ── Engine API Contract ───────────────────────────────────────────────
//
// The QUIZ ENGINE calls the functions listed below. When building a new
// quiz, implement each one to match the described return shape exactly.
// Everything else in this section is a helper you can freely rewrite.
//
// ── Global: Q ──
//   Populated by newQuiz() before each quiz run. The engine reads:
//     Q.vs        — supply voltage (number)
//     Q.iTotal    — healthy total current (number, amps)
//     Q.vR<name>  — healthy voltage across each metered component
//   Simulation helpers also read Q.r<name> (component Ω values).
//   Populate all of these inside newQuiz() after choosing component values.
//
// ── calcCircuit(r1, r2, …, vs) → object ──
//   Computes voltages and currents for one set of component values.
//   Return an object whose keys match what applyMeterDisplay expects.
//   Required keys for this circuit: vR1…vR10, vR456, vR789, iTotal, i89.
//   Use Infinity for an open component; safePar() handles it gracefully.
//
// ── buildAllQuestions() → Array<question object> ──
//   Assembles the complete ordered question list for one quiz run.
//   This is the only function the engine calls to get questions — edit it
//   to change the number or type of starter questions, or their order.
//   Reads from the global Q object (populated before this is called).
//   Uses QUIZ_MAX_FAULT_QUESTIONS (in Configuration) to cap fault questions.
//
// ── buildPool() → Array<{key, fault}> ──
//   Returns all fault scenarios to draw questions from.
//     key   — component identifier string, e.g. 'r1', 'r8'
//     fault — fault mode string, e.g. 'open' or 'high'
//   Deduplicate scenarios that produce identical voltage patterns so the
//   same question cannot appear twice in one quiz.
//
// ── buildFaultQuestion(faultKey, faultType) → question object ──
//   Returns a question object (see schema below).
//
// ── buildQ3() → question object ──
//   Returns a fixed fault question shown as Q3 in every quiz.
//   Used to give students a consistent anchor question across runs.
//
// ── buildFaultExplanation(q) → HTML string ──
//   q is the question object. Returns innerHTML for the working-box shown
//   after the student answers. Use q.faultKey, q.faultType, q.faultedVals.
//
// ── applyMeterDisplay(healthy, faulted) ──
//   Updates SVG meter circles. healthy and faulted are calcCircuit() results.
//   Edit the meterKeys array inside this function to match your SVG IDs.
//
// ── applyHealthyDisplay() ──
//   Resets all meters to healthy values from the global Q object.
//   Edit the mMap object inside to match your SVG IDs.
//
// ── applyCurrentDisplay(healthyI, faultedI) / resetCurrentDisplay(i) ──
//   Updates the ammeter circle. SVG IDs: ammeterValue, ammeterUnit,
//   iOrigValue, iOrigUnit. Update these IDs in your SVG if you rename them.
//
// ── buildWorkingPD(q) → HTML string ──
//   Returns innerHTML for the working-box on potential-difference questions
//   (Q1 and Q2). Rewrite if your non-fault question format changes.
//
// ── makePDOpts(correct, allVoltages) → Array<string> ──
//   Generates 4 answer option strings for a potential-difference question.
//   correct is the right voltage (number); allVoltages is an array of all
//   healthy voltages to draw plausible distractors from.
//
// ── Question object schema ──
//   {
//     key:         null,             // unused for fault questions
//     faultKey:    string,           // e.g. 'r8'
//     label:       string,           // display name, e.g. 'R8'
//     color:       string,           // highlight colour (keep '#ffff00')
//     type:        'fault',          // engine branches on this
//     faultType:   string,           // e.g. 'open' or 'high'
//     faultedVals: object,           // return value of faultedResistors()
//     opts:        [{label, type}],  // type is 'correct' or 'wrong'; 4 entries
//     correctIdx:  number,           // index of the correct entry in opts
//     qText:       string,           // question prompt shown to student
//     qHint:       string,           // hint shown below the question
//     correctV:    null,             // null for fault questions
//   }
//
// ── SVG element IDs the engine reads ──
//   meterR<n>        — voltage number text element for component n
//   meterR<n>u       — voltage unit text element (e.g. 'V', 'mV')
//   ammeterValue     — current number text element
//   ammeterUnit      — current unit text element
//   iOrigValue       — healthy-current reference number (stays green)
//   iOrigUnit        — healthy-current reference unit
// ─────────────────────────────────────────────────────────────────────

// ── Constants ──
const E12_BASE=[10,12,15,18,22,27,33,39,47,56,68,82];
const E12=[];
[1,10,100].forEach(m=>E12_BASE.forEach(v=>E12.push(v*m)));

function pickN(arr,n){const a=[...arr],r=[];for(let i=0;i<n;i++){const idx=Math.floor(Math.random()*a.length);r.push(a.splice(idx,1)[0]);}return r;}
function par(...v){return 1/v.reduce((s,x)=>s+1/x,0);}

function fmtVS(v){
  const a=Math.abs(v);
  if(a===0) return '0V';
  if(a>=10)    return v.toFixed(2)+'V';
  if(a>=1)     return v.toFixed(3)+'V';
  if(a>=0.001) return (v*1000).toFixed(1)+'mV';
  if(a>=0.000001) return (v*1e6).toFixed(0)+'µV';
  return '0V'; // truly negligible
}
function fmtVSShort(v){
  const a=Math.abs(v);
  if(a===0)          return {num:'0',    unit:'V'};
  if(a>=10)          return {num:v.toFixed(2),         unit:'V'};
  if(a>=1)           return {num:v.toFixed(3),         unit:'V'};
  if(a>=0.001)       return {num:(v*1000).toFixed(1),  unit:'mV'};
  if(a>=0.000001)    return {num:(v*1e6).toFixed(0),   unit:'µV'};
  return {num:'0', unit:'V'};
}
function fmtΩ(v){return v>=1000?(v/1000).toFixed(2)+'kΩ':v+'Ω';}
function fmtA(a){
  const abs=Math.abs(a);
  if(abs===0) return '0A';
  if(abs>=1)     return a.toFixed(3)+' A';
  if(abs>=0.001) return (a*1000).toFixed(3)+' mA';
  return (a*1e6).toFixed(3)+' µA';
}
function fmtAShort(a){
  const abs=Math.abs(a);
  if(abs===0) return {num:'0',unit:'A'};
  if(abs>=1)     return {num:a.toFixed(3),       unit:'A'};
  if(abs>=0.001) return {num:(a*1000).toFixed(3), unit:'mA'};
  return {num:(a*1e6).toFixed(1), unit:'µA'};
}

// ══ Circuit calculation ══
// Returns {vR1..vR10, vR456, vR789, iTotal, i89} for a given set of resistor values
function calcCircuit(r1,r2,r3,r4,r5,r6,r7,r8,r9,r10,vs){
  // Handle open (Infinity) in parallel banks gracefully
  function safePar(...vals){
    const finite=vals.filter(x=>isFinite(x));
    if(finite.length===0) return Infinity;
    if(finite.length===vals.length) return par(...vals);
    return par(...finite);
  }

  const r456=safePar(r4,r5,r6);
  const r89=r8+r9; // series sub-branch
  const r789=safePar(r7,r89);

  // If any series resistor is open, no current flows
  const seriesSum=r1+r2+r3+r10;
  const bankSum=(isFinite(r456)?r456:0)+(isFinite(r789)?r789:0);
  const rTotal=seriesSum+bankSum;

  const seriesOpen=[r1,r2,r3,r10].some(x=>!isFinite(x));

  let iTotal, vR1,vR2,vR3,vR4,vR5,vR6,vR7,vR8,vR9,vR10;
  let vR456val, vR789val, i89;

  if(seriesOpen){
    // No current — full Vs appears across the open series resistor
    iTotal=0; i89=0;
    vR1=!isFinite(r1)?vs:0;
    vR2=!isFinite(r2)?vs:0;
    vR3=!isFinite(r3)?vs:0;
    vR10=!isFinite(r10)?vs:0;
    vR4=0; vR5=0; vR6=0; vR7=0; vR8=0; vR9=0;
    vR456val=0; vR789val=0;
  } else {
    iTotal=vs/rTotal;
    vR1=iTotal*r1; vR2=iTotal*r2; vR3=iTotal*r3; vR10=iTotal*r10;
    vR456val=isFinite(r456)?iTotal*r456:0;
    vR789val=isFinite(r789)?iTotal*r789:0;

    vR4=vR456val; vR5=vR456val; vR6=vR456val;
    vR7=vR789val;

    if(!isFinite(r7)&&!isFinite(r89)){
      // Entire orange bank open — shouldn't happen but safe
      vR8=0; vR9=0; i89=0;
    } else if(!isFinite(r89)){
      // R8 or R9 open — branch carries no current; open component shows bank voltage
      i89=0;
      if(!isFinite(r8)){ vR8=vR789val; vR9=0; }
      else              { vR8=0;       vR9=vR789val; }
    } else {
      i89=vR789val/r89;
      vR8=i89*r8; vR9=i89*r9;
    }
  }

  return {vR1,vR2,vR3,vR4,vR5,vR6,vR7,vR8,vR9,vR10,vR456:vR456val,vR789:vR789val,iTotal,i89};
}

// ══ Apply faulted resistor value ══
function faultedResistors(faultKey, faultType){
  const mult=10+Math.random()*10; // 10×–20× for 'high' — ensures visible change on series resistors
  const vals={
    r1:Q.r1,r2:Q.r2,r3:Q.r3,r4:Q.r4,r5:Q.r5,r6:Q.r6,
    r7:Q.r7,r8:Q.r8,r9:Q.r9,r10:Q.r10
  };
  if(faultType==='open'){
    vals[faultKey]=Infinity;
  } else {
    // Round to match fmtΩ display: 0 dp for <1000Ω, 2 dp for kΩ
    const raw=Q[faultKey]*mult;
    vals[faultKey]=raw>=1000 ? Math.round(raw/10)*10 : Math.round(raw);
  }
  return vals;
}

// ══ Update meter circles with colour coding ══
function applyMeterDisplay(healthy, faulted){
  const meterKeys=[
    ['meterR1','vR1'],['meterR2','vR2'],['meterR3','vR3'],
    ['meterR4','vR4'],['meterR5','vR5'],['meterR6','vR6'],
    ['meterR7','vR7'],['meterR8','vR8'],['meterR9','vR9'],['meterR10','vR10'],
  ];

  meterKeys.forEach(([id,key])=>{
    const el=document.getElementById(id); if(!el) return;
    const eu=document.getElementById(id+'u');
    const parent=el.parentElement;
    [...parent.children].filter(c=>c.tagName.toLowerCase()==='g').forEach(g=>g.remove());
    const fh=fmtVSShort(healthy[key]??0);
    el.textContent=fh.num; if(eu) eu.textContent=fh.unit;
    el.setAttribute('fill',CLR_NORMAL); if(eu) eu.setAttribute('fill',CLR_NORMAL);
    const circ=[...parent.children].find(c=>c.tagName.toLowerCase()==='circle');
    if(circ) circ.setAttribute('stroke',CLR_STROKE_NORMAL);
  });

  meterKeys.forEach(([id,key])=>{
    const el=document.getElementById(id); if(!el) return;
    const eu=document.getElementById(id+'u');
    const parent=el.parentElement;
    const circ=[...parent.children].find(c=>c.tagName.toLowerCase()==='circle');
    const hv=healthy[key]??0, fv=faulted[key]??0;
    const changed=(hv===0&&fv!==0)||(hv!==0&&Math.abs(fv-hv)/hv>0.0005); // >0.05% change

    const ff=fmtVSShort(fv);
    el.textContent=ff.num; if(eu) eu.textContent=ff.unit;
    if(!changed){
      el.setAttribute('fill',CLR_NORMAL); if(eu) eu.setAttribute('fill',CLR_NORMAL);
      if(circ) circ.setAttribute('stroke',CLR_STROKE_NORMAL);
    } else {
      const wentUp=fv>hv;
      const clr=wentUp?CLR_UP:CLR_DOWN;
      el.setAttribute('fill',CLR_NORMAL); if(eu) eu.setAttribute('fill',CLR_NORMAL);
      if(circ) circ.setAttribute('stroke',CLR_STROKE_NORMAL);
      addGhost(id, hv, fv, wentUp, clr);
    }
  });
}

// Ghost element: arrow + delta amount on same line below circle
function addGhost(meterId, healthyVal, faultedVal, wentUp, clr){
  const txt=document.getElementById(meterId);
  if(!txt) return;

  const existing=document.getElementById(meterId+'Ghost');
  if(existing) existing.remove();

  const parent=txt.parentElement;
  const circ=[...parent.children].find(c=>c.tagName.toLowerCase()==='circle');
  if(!circ) return;
  const cy=parseFloat(circ.getAttribute('cy'));
  const cx=parseFloat(circ.getAttribute('cx'));
  const r=parseFloat(circ.getAttribute('r'));

  const delta=Math.abs(faultedVal-healthyVal);
  const deltaStr=(wentUp?'+':'-')+fmtVS(delta);

  const ns='http://www.w3.org/2000/svg';
  const g=document.createElementNS(ns,'g');
  g.id=meterId+'Ghost';

  const line=document.createElementNS(ns,'text');
  line.setAttribute('x',cx); line.setAttribute('y',cy+r+23);
  line.setAttribute('fill',clr); line.setAttribute('text-anchor','middle');
  line.setAttribute('font-weight','bold');
  line.setAttribute('stroke',clr); line.setAttribute('stroke-width','0.8');
  line.setAttribute('font-family',"'Share Tech Mono',monospace");
  const arrowSpan=document.createElementNS(ns,'tspan');
  arrowSpan.setAttribute('font-size','30');
  arrowSpan.textContent=wentUp?'↑':'↓';
  const deltaSpan=document.createElementNS(ns,'tspan');
  deltaSpan.setAttribute('font-size','22');
  deltaSpan.setAttribute('dx','-10');
  deltaSpan.textContent=' '+deltaStr;
  line.appendChild(arrowSpan);
  line.appendChild(deltaSpan);

  g.appendChild(line);
  parent.appendChild(g);
}

function removeAllGhosts(){
  const meterIds=['meterR1','meterR2','meterR3','meterR4','meterR5','meterR6',
                  'meterR7','meterR8','meterR9','meterR10'];
  meterIds.forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    const parent=el.parentElement;
    [...parent.children].filter(c=>c.tagName.toLowerCase()==='g').forEach(g=>g.remove());
    el.setAttribute('fill',CLR_NORMAL);
    const circ=[...parent.children].find(c=>c.tagName.toLowerCase()==='circle');
    if(circ) circ.setAttribute('stroke',CLR_STROKE_NORMAL);
  });
  removeAmmeterGhost();
}

function removeAmmeterGhost(){

}

  textTop.appendChild(numSpan);

  const textBot=document.createElementNS(ns,'text');

  textBot.setAttribute('font-size','16');

  textBot.textContent=f.unit;

  g.appendChild(textTop);
  g.appendChild(textBot);
  grp.appendChild(g);
}

// ══ Update ammeter circle — text stays green, ghost shows change ══
function applyCurrentDisplay(healthyI, faultedI){
  const wentUp=faultedI>healthyI*1.0005;
  const wentDown=faultedI<healthyI*0.9995;
  const f=fmtAShort(faultedI);
  const av=document.getElementById('ammeterValue'); if(av) av.textContent=f.num;
  const au=document.getElementById('ammeterUnit');  if(au) au.textContent=f.unit;
  removeAmmeterGhost();
  if(wentUp||wentDown) addAmmeterGhost(healthyI, faultedI, wentUp, wentUp?CLR_UP:CLR_DOWN);
}

function resetCurrentDisplay(iTotal){
  const f=fmtAShort(iTotal);
  const av=document.getElementById('ammeterValue'); if(av) av.textContent=f.num;
  const au=document.getElementById('ammeterUnit');  if(au) au.textContent=f.unit;
  removeAmmeterGhost();
}

// ══ Healthy circuit display ══
function applyHealthyDisplay(){
  removeAllGhosts();
  const mMap={
    meterR1:'vR1',meterR2:'vR2',meterR3:'vR3',
    meterR4:'vR4',meterR5:'vR5',meterR6:'vR6',
    meterR7:'vR7',meterR8:'vR8',meterR9:'vR9',meterR10:'vR10'
  };
  Object.entries(mMap).forEach(([id,key])=>{
    const el=document.getElementById(id); if(!el) return;
    const eu=document.getElementById(id+'u');
    const fh=fmtVSShort(Q[key]);
    el.textContent=fh.num; if(eu) eu.textContent=fh.unit;
    el.setAttribute('fill',CLR_NORMAL); if(eu) eu.setAttribute('fill',CLR_NORMAL);
    const circ=[...el.parentElement.children].find(c=>c.tagName.toLowerCase()==='circle');
    if(circ) circ.setAttribute('stroke',CLR_STROKE_NORMAL);
  });
  resetCurrentDisplay(Q.iTotal);
  const f=fmtAShort(Q.iTotal);
  const iOV=document.getElementById('iOrigValue'); if(iOV){iOV.textContent=f.num; iOV.setAttribute('fill','#00ff99');}
  const iOU=document.getElementById('iOrigUnit');  if(iOU){iOU.textContent=' '+f.unit; iOU.setAttribute('fill','#00ff99');}
}

// ══ Neighbour lookup for distractors ══
const SERIES_RESISTORS=['r1','r2','r3','r10'];
const PURPLE_RESISTORS=['r4','r5','r6'];
const ORANGE_RESISTORS=['r7','r8','r9'];

function getNeighbour(rKey){
  if(SERIES_RESISTORS.includes(rKey)){
    const others=SERIES_RESISTORS.filter(x=>x!==rKey);
    return others[Math.floor(Math.random()*others.length)];
  }
  if(PURPLE_RESISTORS.includes(rKey)){
    const others=PURPLE_RESISTORS.filter(x=>x!==rKey);
    return others[Math.floor(Math.random()*others.length)];
  }
  const others=ORANGE_RESISTORS.filter(x=>x!==rKey);
  return others[Math.floor(Math.random()*others.length)];
}

// ══ Build fault explanation text ══
function buildFaultExplanation(q){
  const fv=q.faultedVals;
  const faultKey=q.faultKey;
  const faultType=q.faultType;
  const rl=labelFromKey(faultKey);
  const freshFaulted=calcCircuit(fv.r1,fv.r2,fv.r3,fv.r4,fv.r5,fv.r6,fv.r7,fv.r8,fv.r9,fv.r10,Q.vs);

  const allKeys=['r1','r2','r3','r4','r5','r6','r7','r8','r9','r10'];
  const healthyVals={r1:Q.vR1,r2:Q.vR2,r3:Q.vR3,r4:Q.vR4,r5:Q.vR5,r6:Q.vR6,
                     r7:Q.vR7,r8:Q.vR8,r9:Q.vR9,r10:Q.vR10};
  const faultedVoltages={r1:freshFaulted.vR1,r2:freshFaulted.vR2,r3:freshFaulted.vR3,
                          r4:freshFaulted.vR4,r5:freshFaulted.vR5,r6:freshFaulted.vR6,
                          r7:freshFaulted.vR7,r8:freshFaulted.vR8,r9:freshFaulted.vR9,
                          r10:freshFaulted.vR10};

  const increased=[], decreased=[];
  allKeys.forEach(k=>{
    const hv=healthyVals[k]??0, fv2=faultedVoltages[k]??0;
    const changed=(hv===0&&fv2!==0)||(hv!==0&&Math.abs(fv2-hv)/hv>0.0005);
    if(!changed) return;
    if(fv2>hv) increased.push({k,hv,fv:fv2});
    else decreased.push({k,hv,fv:fv2});
  });

  let html='<div style="font-size:.8rem;line-height:1.8;">';

  if(faultKey==='r7'){
    // R7 high and R7 open are indistinguishable from voltage readings
    const r89=Q.r8+Q.r9;
    const r456=1/(1/Q.r4+1/Q.r5+1/Q.r6);
    const rBase=Q.r1+Q.r2+Q.r3+r456+Q.r10;
    const rBank10=Q.r7*10*r89/(Q.r7*10+r89);
    const iHigh10=Q.vs/(rBase+rBank10);
    const iOpen=Q.vs/(rBase+r89);
    if(faultType==='open'){
      html+=`<div><b style="color:#ffaa00;">R7</b> went <b>open circuit</b> — but from voltage readings, R7 high and R7 open <b>cannot be distinguished</b>.</div>`;
    } else {
      html+=`<div><b style="color:#ffaa00;">R7</b> went high to <b>${fmtΩ(fv.r7)}</b> — but from voltage readings, R7 high and R7 open <b>cannot be distinguished</b>.</div>`;
    }
    html+=`<div style="margin-top:.5rem;padding:.4rem .6rem;border-left:2px solid #ffaa00;background:rgba(255,170,0,.05);">
      <b>Why R7 high and R7 open look identical:</b><br>
      R7 is a standalone parallel branch. Whether it goes high or open:<br>
      &nbsp;• R7 takes more (or all) of the bank voltage → <span style="color:#ffaa00;">R7 ↑</span><br>
      &nbsp;• More voltage appears across R8+R9 → both <span style="color:#ffaa00;">R8 ↑ and R9 ↑</span><br>
      All three orange resistors increasing together points to R7, not the R8+R9 branch.<br><br>
      <b>Can the ammeter reading help?</b><br>
      It gives a hint — but not a definitive answer. As R7 resistance grows, the parallel combination approaches R8+R9 = ${fmtΩ(r89)} asymptotically:<br>
      &nbsp;• R7 = ${fmtΩ(Q.r7*10)} (10× normal) → current ≈ ${fmtA(iHigh10)}<br>
      &nbsp;• R7 open → current = ${fmtA(iOpen)}<br>
      A very high R7 and an open R7 produce nearly the same ammeter reading.<br><br>
      <b>To confirm:</b> Power down and measure R7 directly — it will read very high or open (OL).
    </div>`;
  } else if((faultKey==='r8'||faultKey==='r9') && faultType==='open'){
    const partner=faultKey==='r8'?'R9':'R8';
    const openV=faultKey==='r8'?freshFaulted.vR8:freshFaulted.vR9;
    html+=`<div><b style="color:#ffaa00;">${rl}</b> went <b>open circuit</b>.</div>`;
    html+=`<div style="margin-top:.3rem;">R8 and R9 are in <b>series</b>. An open ${rl} breaks the entire R8+R9 branch — no current flows through either component.</div>`;
    html+=`<div style="margin-top:.5rem;padding:.4rem .6rem;border-left:2px solid #ffaa00;background:rgba(255,170,0,.05);">
      <b>How to identify ${rl} went open (not just high):</b><br>
      &nbsp;• <b>${partner} reads 0V</b> — no current through it, and it's a healthy resistor (V = I×R = 0) ✓<br>
      &nbsp;• ${rl} shows the full branch voltage (${fmtVS(openV)}) — an open component takes all the voltage across it<br>
      &nbsp;• R7 carries all the orange bank current → <span style="color:#ffaa00;">R7 ↑</span><br>
      <b>${partner} = 0V is the definitive clue.</b> If ${rl} had gone high, ${partner} would still show a reduced but non-zero voltage.
    </div>`;
  } else if(faultType==='open'){
    if(SERIES_RESISTORS.includes(faultKey)){
      html+=`<div><b style="color:#ffaa00;">${rl}</b> went <b>open circuit</b>.</div>`;
      html+=`<div style="margin-top:.3rem;">No current can flow — ${rl} shows the full source voltage (${fmtVS(Q.vs)}) and all other resistors show 0V.</div>`;
    } else {
      html+=`<div><b style="color:#ffaa00;">${rl}</b> went <b>open circuit</b>.</div>`;
      html+=`<div style="margin-top:.3rem;">Current continues through the remaining parallel branches. The total circuit resistance increased to <b>${freshFaulted.iTotal>0?(Q.vs/freshFaulted.iTotal).toFixed(2)+'Ω':'∞'}</b>.</div>`;
      html+=`<div style="margin-top:.3rem;color:#e8e8d0;">All parallel branches show the same voltage — we can't tell which one opened from voltage alone.</div>`;
    }
  } else {
    const newR=fv[faultKey];
    const newRTotal=Q.vs/freshFaulted.iTotal;
    html+=`<div><b style="color:#ffaa00;">${rl}</b> went high to <b>${fmtΩ(newR)}</b>.</div>`;
    html+=`<div style="margin-top:.3rem;">This caused the total circuit resistance to increase to <b>${newRTotal.toFixed(2)}Ω</b>.</div>`;

    if(faultKey==='r8'||faultKey==='r9'){
      const partner=faultKey==='r8'?'R9':'R8';
      const partnerV=faultKey==='r8'?freshFaulted.vR9:freshFaulted.vR8;
      html+=`<div style="margin-top:.5rem;padding:.4rem .6rem;border-left:2px solid #ffaa00;background:rgba(255,170,0,.05);">
        <b>How to deduce ${rl} went high:</b><br>
        R8 and R9 are in <b>series</b> with each other, forming one branch parallel to R7.<br>
        When ${rl} goes high it takes a larger share of the branch voltage → <span style="color:#ffaa00;">${rl} ↑</span>.<br>
        The reduced branch current means ${partner} receives less voltage → <span style="color:#e8e8d0;">${partner} ↓</span>.<br>
        R7 sees the increased bank voltage → <span style="color:#ffaa00;">R7 ↑</span>.<br>
        The pattern <b>${rl} ↑, ${partner} ↓, R7 ↑</b> uniquely identifies ${rl} as the faulty component.<br><br>
        <b>How to confirm high (not open):</b><br>
        ${partner} still shows ${fmtVS(partnerV)} — confirming current still flows through the branch.<br>
        If ${rl} had gone <b>open</b>, ${partner} would read exactly <b>0V</b>.
      </div>`;
    } else if(PURPLE_RESISTORS.includes(faultKey)){
      const r4v=fv.r4, r5v=fv.r5, r6v=fv.r6;
      const rBankHigh=1/(1/r4v+1/r5v+1/r6v);
      const othersOpen=PURPLE_RESISTORS.filter(k=>k!==faultKey).map(k=>Q[k]);
      const rBankOpen=1/othersOpen.reduce((s,v)=>s+1/v,0);
      const vBankHigh=freshFaulted.iTotal*rBankHigh;
      const iTotalOpen=Q.vs/(Q.r1+Q.r2+Q.r3+rBankOpen+Q.r789+Q.r10);
      const vBankOpen=iTotalOpen*rBankOpen;
      html+=`<div style="margin-top:.5rem;padding:.4rem .6rem;border-left:2px solid #ffaa00;background:rgba(255,170,0,.05);">
        <b>Why the answer is "high or open" — not just one:</b><br><br>
        <b>What actually happened — ${rl} went high to ${fmtΩ(newR)}:</b><br>
        R_bank = ${fmtΩ(Q.r4)} ∥ ${fmtΩ(Q.r5)} ∥ ${fmtΩ(Q.r6)} (with ${rl}=${fmtΩ(newR)}) = <b>${rBankHigh.toFixed(2)}Ω</b><br>
        V_bank = ${fmtA(freshFaulted.iTotal)} × ${rBankHigh.toFixed(2)}Ω = <b>${fmtVS(vBankHigh)}</b><br>
        All three branches show this same voltage. Current still flows through all three branches.<br><br>
        <b>If instead ${rl} went open:</b><br>
        R_bank = ∞ ∥ ${othersOpen.map(v=>fmtΩ(v)).join(' ∥ ')} = <b>${rBankOpen.toFixed(2)}Ω</b><br>
        V_bank = ${fmtA(iTotalOpen)} × ${rBankOpen.toFixed(2)}Ω = <b>${fmtVS(vBankOpen)}</b><br>
        ${rl} is still connected across the same two nodes — so it shows the same bank voltage.<br>
        Current continues through the other two branches normally.<br><br>
        <b>Conclusion:</b> Both faults produce the same voltage pattern across R4, R5 and R6.
        Branch current measurements would be needed to identify the exact fault.
      </div>`;
    }
  }

  // Voltage change tables — all cases except series open (where all go to 0V or Vs)
  if(!(faultType==='open' && SERIES_RESISTORS.includes(faultKey))){
    if(decreased.length){
      html+=`<div style="margin-top:.4rem;">The following potential differences <b style="color:#e8e8d0;">decreased</b>:</div>`;
      html+=`<div style="margin-top:.2rem;">`+decreased.map(({k,hv,fv:fv2})=>`<span style="color:#e8e8d0;">${labelFromKey(k)}: ${fmtVS(hv)} → ${fmtVS(fv2)}</span>`).join('&nbsp;&nbsp;')+'</div>';
    }
    if(increased.length){
      html+=`<div style="margin-top:.4rem;">The following potential differences <b style="color:#ffaa00;">increased</b>:</div>`;
      html+=`<div style="margin-top:.2rem;">`+increased.map(({k,hv,fv:fv2})=>`<span style="color:#ffaa00;">${labelFromKey(k)}: ${fmtVS(hv)} → ${fmtVS(fv2)}</span>`).join('&nbsp;&nbsp;')+'</div>';
    }
  }

  html+='</div>';
  return html;
}

function rLabel(key){return key.replace('r','R').replace('r1','R1');}
function labelFromKey(key){return key.replace(/^r/,'R');}

// ══ Build fault question ══
function buildFaultQuestion(faultKey, faultType){
  const fv=faultedResistors(faultKey, faultType);

  const purpleKeys=['r4','r5','r6'];
  const orangeKeys=['r7','r8','r9'];
  const rl=labelFromKey(faultKey);

  let correctLabel, opts;
  const seriesDistractors=[...SERIES_RESISTORS].sort(()=>Math.random()-.5);

  if(purpleKeys.includes(faultKey)){
    const cfg=FAULT_OPTIONS.purple;
    correctLabel=cfg.correct;
    opts=[
      {label:correctLabel, type:'correct'},
      ...cfg.wrongs.map(l=>({label:l, type:'wrong'})),
      {label:LABELS.seriesOpen(labelFromKey(seriesDistractors[0])), type:'wrong'},
      {label:LABELS.seriesHigh(labelFromKey(seriesDistractors[1])), type:'wrong'},
    ];
  } else if(orangeKeys.includes(faultKey)){
    if(faultKey==='r7'){
      const cfg=FAULT_OPTIONS.r7;
      correctLabel=cfg.correct;
      opts=[
        {label:correctLabel, type:'correct'},
        ...cfg.wrongs.map(l=>({label:l, type:'wrong'})),
        {label:LABELS.seriesOpen(labelFromKey(seriesDistractors[0])), type:'wrong'},
        {label:LABELS.seriesHigh(labelFromKey(seriesDistractors[1])), type:'wrong'},
      ];
    } else {
      const cfgKey=faultKey+(faultType==='high'?'High':'Open');
      const cfg=FAULT_OPTIONS[cfgKey];
      correctLabel=cfg.correct;
      opts=[{label:correctLabel, type:'correct'}, ...cfg.wrongs.map(l=>({label:l, type:'wrong'}))];
    }
  } else {
    // Series resistor — specific label, neighbour as distractor
    const neighbour=getNeighbour(faultKey);
    const nl=labelFromKey(neighbour);
    const labelFn   =faultType==='high'?LABELS.seriesHigh:LABELS.seriesOpen;
    const labelFnOpp=faultType==='high'?LABELS.seriesOpen:LABELS.seriesHigh;
    correctLabel=labelFn(rl);
    opts=[
      {label:correctLabel,    type:'correct'},
      {label:labelFnOpp(rl),  type:'wrong'},
      {label:labelFn(nl),     type:'wrong'},
      {label:labelFnOpp(nl),  type:'wrong'},
    ];
  }

  opts=opts.sort(()=>Math.random()-.5);

  return {
    key:null, faultKey, label:rl, color:'#ffff00',
    type:'fault', faultType, faultedVals:fv,
    opts, correctIdx:opts.findIndex(o=>o.type==='correct'),
    qText: LABELS.faultQuestion,
    qHint: LABELS.faultHint,
    correctV:null,
  };
}

// ══ Check if fault produces visible change on series resistors (≥0.1%) ══
function faultIsVisible(faultKey, faultType){
  const fv=faultedResistors(faultKey, faultType);
  const faulted=calcCircuit(fv.r1,fv.r2,fv.r3,fv.r4,fv.r5,fv.r6,fv.r7,fv.r8,fv.r9,fv.r10,Q.vs);
  // Check series resistors for visible change
  const THRESHOLD=0.001; // 0.1%
  const seriesChecks=[
    [Q.vR1, faulted.vR1],
    [Q.vR2, faulted.vR2],
    [Q.vR3, faulted.vR3],
    [Q.vR10, faulted.vR10],
  ];
  return seriesChecks.some(([hv,fv2])=>
    hv!==0 && Math.abs(fv2-hv)/hv >= THRESHOLD
  );
}

// ══ Build Qn pool — unique questions only ══
// Purple bank (R4/R5/R6, any type) → all produce the same indistinguishable question.
// R7 high and R7 open → same voltage pattern, grouped as one question.
// R8/R9 high vs open ARE distinguishable (partner reads 0V when open) → each is separate.
// Deduplicate by group so the same question can't appear twice in one quiz.
function buildPool(){
  const allKeys=['r1','r2','r3','r4','r5','r6','r7','r8','r9','r10'];
  const pool=[];
  allKeys.forEach(key=>{
    if(key!=='r1') pool.push({key,fault:'open'});
    pool.push({key,fault:'high'});
  });
  const visible=pool.filter(({key,fault})=>faultIsVisible(key,fault));

  // Shuffle before dedup so the representative for each ambiguous group varies
  const shuffled=[...visible].sort(()=>Math.random()-.5);
  const seen=new Set();
  return shuffled.filter(({key,fault})=>{
    const grp=['r4','r5','r6'].includes(key) ? 'purple' :
               key==='r7'                    ? 'r7-any' :
               key+'-'+fault;
    if(seen.has(grp)) return false;
    seen.add(grp);
    return true;
  });
}

// ══ Build Q3 ══
function buildQ3(){
  const fv=faultedResistors('r1','open');
  const faulted=calcCircuit(fv.r1,fv.r2,fv.r3,fv.r4,fv.r5,fv.r6,fv.r7,fv.r8,fv.r9,fv.r10,Q.vs);
  const opts=[

  ].sort(()=>Math.random()-.5);
  return {

  };
}

// ══ makePDOpts ══
function makePDOpts(correct, allVoltages){
  const used=new Set([fmtVS(correct)]);
  const distractors=[];
  [...allVoltages].sort(()=>Math.random()-.5).forEach(v=>{
    const lbl=fmtVS(v);
    if(!used.has(lbl)&&distractors.length<3){used.add(lbl);distractors.push(lbl);}
  });
  const scales=[1.5,0.5,2.0]; let si=0;
  while(distractors.length<3){
    const lbl=fmtVS(correct*scales[si++]);
    if(!used.has(lbl)){used.add(lbl);distractors.push(lbl);}
  }
  const opts=[{label:fmtVS(correct),type:'correct'},...distractors.map(l=>({label:l,type:'wrong'}))].sort(()=>Math.random()-.5);
  return {opts, correctIdx:opts.findIndex(o=>o.type==='correct')};
}

// ══ buildWorkingPD ══
function buildWorkingPD(rKey,rLabel,color,v){
  const series=['r1','r2','r3','r10'];
  if(series.includes(rKey)){
    return `<div class="wline"><span style="color:${color}">${rLabel}</span> is a <b>series</b> resistor.</div>
      <div class="wline" style="margin-top:.3rem;">I<sub>total</sub> = ${Q.vs}V ÷ ${Q.rTotal.toFixed(2)}Ω = ${fmtA(Q.iTotal)}</div>
      <div class="wline" style="margin-top:.3rem;">V = ${fmtA(Q.iTotal)} × ${fmtΩ(Q[rKey])}</div>
      <div class="wline total"><b style="color:${color}">V<sub>${rLabel}</sub> = ${fmtVS(v)}</b></div>`;
  }
  if(['r4','r5','r6'].includes(rKey)){
    return `<div class="wline"><span style="color:${color}">${rLabel}</span> is in the parallel bank R4∥R5∥R6 — all branches share the same PD.</div>
      <div class="wline" style="margin-top:.3rem;">V<sub>bank</sub> = ${fmtA(Q.iTotal)} × ${Q.r456.toFixed(2)}Ω</div>
      <div class="wline total"><b style="color:${color}">V<sub>${rLabel}</sub> = ${fmtVS(v)}</b></div>`;
  }
  if(rKey==='r7'){
    return `<div class="wline"><span style="color:${color}">R7</span> is in parallel with R8+R9 — shares the same PD.</div>
      <div class="wline" style="margin-top:.3rem;">V<sub>R789</sub> = ${fmtA(Q.iTotal)} × ${Q.r789.toFixed(2)}Ω</div>
      <div class="wline total"><b style="color:${color}">V<sub>R7</sub> = ${fmtVS(v)}</b></div>`;
  }
  return `<div class="wline"><span style="color:${color}">${rLabel}</span> is in the series sub-branch R8+R9.</div>
    <div class="wline" style="margin-top:.3rem;">V<sub>branch</sub> = ${fmtVS(Q.vR789)}, I<sub>89</sub> = ${fmtA(Q.i89)}</div>
    <div class="wline" style="margin-top:.3rem;">V = ${fmtA(Q.i89)} × ${fmtΩ(Q[rKey])}</div>
    <div class="wline total"><b style="color:${color}">V<sub>${rLabel}</sub> = ${fmtVS(v)}</b></div>`;
}

// ══ buildAllQuestions ══
// Assembles the full ordered question list for one quiz run.
// Edit here to change the number or type of starter questions.
function buildAllQuestions(){
  const allVoltages=[Q.vR1,Q.vR2,Q.vR3,Q.vR4,Q.vR789,Q.vR8,Q.vR9,Q.vR10];

  // ── Q1: PD across random series resistor ──
  const seriesPool=[
    {key:'r1', label:'R1', color:'#00e5ff', v:Q.vR1},
    {key:'r2', label:'R2', color:'#00e5ff', v:Q.vR2},
    {key:'r3', label:'R3', color:'#00e5ff', v:Q.vR3},
    {key:'r10',label:'R10',color:'#00e5ff', v:Q.vR10},
  ];
  const q1r=seriesPool[Math.floor(Math.random()*seriesPool.length)];
  const q1opts=makePDOpts(q1r.v, allVoltages.filter(x=>fmtVS(x)!==fmtVS(q1r.v)));
  const q1={key:q1r.key,label:q1r.label,color:q1r.color,type:'pd',correctV:q1r.v,
    opts:q1opts.opts,correctIdx:q1opts.correctIdx,
    qText:`What is the potential difference across <span style="color:${q1r.color};font-weight:bold;">${q1r.label}</span>?`,
    qHint:'Find the highlighted resistor and read its meter circle.',
    working:buildWorkingPD(q1r.key,q1r.label,q1r.color,q1r.v)};

  // ── Q2: PD across random parallel resistor ──
  const parallelPool=[
    {key:'r4',label:'R4',color:'#a78bfa',v:Q.vR4},
    {key:'r5',label:'R5',color:'#a78bfa',v:Q.vR4},
    {key:'r6',label:'R6',color:'#a78bfa',v:Q.vR4},
    {key:'r7',label:'R7',color:'#ff6b35',v:Q.vR789},
    {key:'r8',label:'R8',color:'#ff6b35',v:Q.vR8},
    {key:'r9',label:'R9',color:'#ff6b35',v:Q.vR9},
  ];
  const q2r=parallelPool[Math.floor(Math.random()*parallelPool.length)];
  const q2opts=makePDOpts(q2r.v, allVoltages.filter(x=>fmtVS(x)!==fmtVS(q2r.v)));
  const q2={key:q2r.key,label:q2r.label,color:q2r.color,type:'pd',correctV:q2r.v,
    opts:q2opts.opts,correctIdx:q2opts.correctIdx,
    qText:`What is the potential difference across <span style="color:${q2r.color};font-weight:bold;">${q2r.label}</span>?`,
    qHint:'Find the highlighted resistor and read its meter circle.',
    working:buildWorkingPD(q2r.key,q2r.label,q2r.color,q2r.v)};

  // ── Q3: R1 open ──
  const q3=buildQ3();

  // ── Qn pool: filtered to visible faults, capped by QUIZ_MAX_FAULT_QUESTIONS ──
  const pool=buildPool();
  const chosen=pickN(pool, Math.min(QUIZ_MAX_FAULT_QUESTIONS, pool.length));
  const qnQuestions=chosen.map(({key,fault})=>buildFaultQuestion(key,fault));

  return [q1, q2, q3, ...qnQuestions];
}

// ── newQuiz ──
function newQuiz(){
  // Reset circuit display immediately so old state doesn't linger
  highlightResistor(null);
  removeAllGhosts();

  let r1,r2,r3,r4,r5,r6,r7,r8,r9,r10,vs;
  if(quizMode==='randomise'){
    const vals=pickN(E12,10);
    [r1,r2,r3,r4,r5,r6,r7,r8,r9,r10]=vals;
    const vsOpts=[6,8,9,10,12,15,18];
    vs=vsOpts[Math.floor(Math.random()*vsOpts.length)];
  } else {
    const ex=EXAMPLE_SETS[quizMode];
    ({r1,r2,r3,r4,r5,r6,r7,r8,r9,r10,vs}=ex);
  }
  const r456=par(r4,r5,r6), r89=r8+r9, r789=par(r7,r89);
  const rTotal=r1+r2+r3+r456+r789+r10;
  const iTotal=vs/rTotal;
  const vR1=iTotal*r1, vR2=iTotal*r2, vR3=iTotal*r3;
  const vR456=iTotal*r456;
  const vR789=iTotal*r789, i89=vR789/r89;
  const vR8=i89*r8, vR9=i89*r9;
  const vR10=iTotal*r10;

  Q={r1,r2,r3,r4,r5,r6,r7,r8,r9,r10,r456,r89,r789,rTotal,vs,iTotal,i89,
     vR1,vR2,vR3,vR4:vR456,vR5:vR456,vR6:vR456,vR7:vR789,vR8,vR9,vR10,vR789};

  [['R1',r1],['R2',r2],['R3',r3],['R4',r4],['R5',r5],['R6',r6],
   ['R7',r7],['R8',r8],['R9',r9],['R10',r10]].forEach(([k,v])=>{
    const el=document.getElementById('lbl'+k); if(el) el.textContent=fmtΩ(v);
  });
  document.getElementById('BattVoltLabel').textContent=vs+'V';
  document.getElementById('panelVoltLabel').textContent=vs+' V';

  applyHealthyDisplay();

  questions=buildAllQuestions();
  answers=questions.map(()=>({selectedIdx:null,correct:null}));
  currentIdx=0;
  buildProgress();
  document.getElementById('summaryPanel').style.display='none';
  document.getElementById('questionPanel').style.display='flex';
  renderQuestion(0);
}

// ══ Progress ══
function buildProgress(){
  const wrap=document.getElementById('progressWrap'); wrap.innerHTML='';
  questions.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='progress-dot'+(i===0?' active':''); d.id='pdot'+i; wrap.appendChild(d);
  });
  const lbl=document.createElement('div');
  lbl.className='progress-label'; lbl.id='plabel';
  lbl.textContent='1 / '+questions.length; wrap.appendChild(lbl);
}
function updateProgress(){
  questions.forEach((_,i)=>{
    const d=document.getElementById('pdot'+i); if(!d) return;
    d.className='progress-dot';
    if(i===currentIdx) d.classList.add('active');
    else if(answers[i].correct!==null) d.classList.add('done');
  });
  const lbl=document.getElementById('plabel');
  if(lbl) lbl.textContent=(currentIdx+1)+' / '+questions.length;
}

// ══ Apply circuit state for current question ══
function applyQuestionState(q){
  highlightResistor(null); // always clear first
  applyHealthyDisplay();   // always reset to healthy before applying any fault
  if(q.type==='fault'){
    // Recompute faulted circuit fresh each time using current Q values
    const fv=q.faultedVals;
    const freshFaulted=calcCircuit(fv.r1,fv.r2,fv.r3,fv.r4,fv.r5,fv.r6,fv.r7,fv.r8,fv.r9,fv.r10,Q.vs);
    applyMeterDisplay(Q, freshFaulted);
    applyCurrentDisplay(Q.iTotal, freshFaulted.iTotal);
  } else {
    highlightResistor(q.key);
  }
}

// ══ renderQuestion ══
function renderQuestion(idx){
  const q=questions[idx], ans=answers[idx];
  document.getElementById('qNum').textContent='Q'+(idx+1);
  document.getElementById('qText').innerHTML=q.qText;
  document.getElementById('qHint').textContent=q.qHint;

  applyQuestionState(q);

  const opts=document.getElementById('qOptions'); opts.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button'); btn.className='option-btn';
    btn.innerHTML=`<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
    if(ans.correct!==null){
      btn.disabled=true;
      if(i===q.correctIdx){btn.classList.add('correct');btn.innerHTML+=`<span class="result-icon">✓</span>`;}
      else if(i===ans.selectedIdx&&!ans.correct){btn.classList.add('wrong');btn.innerHTML+=`<span class="result-icon">✗</span>`;}
      else btn.classList.add('dimmed');
    } else {
      if(i===ans.selectedIdx) btn.classList.add('selected');
      btn.addEventListener('click',()=>selectOpt(idx,i));
    }
    opts.appendChild(btn);
  });

  const banner=document.getElementById('qBanner'); banner.className='result-banner';
  const wbox=document.getElementById('qWorking');
  if(wbox) wbox.className='working-box';
  if(ans.correct!==null){
    document.getElementById('qIcon').textContent=ans.correct?'✓':'✗';
    if(q.type==='fault'){
      const correctLabel=q.opts[q.correctIdx].label;
      if(ans.correct){banner.className='result-banner correct';document.getElementById('qBannerText').textContent=`Correct! ${correctLabel}`;}
      else{banner.className='result-banner wrong';document.getElementById('qBannerText').textContent=`The correct answer is: ${correctLabel}`;}
      if(wbox){wbox.className='working-box visible';document.getElementById('qWorkingContent').innerHTML=buildFaultExplanation(q);}
    } else {
      const answerStr=fmtVS(q.correctV);
      if(ans.correct){banner.className='result-banner correct';document.getElementById('qBannerText').textContent=`Correct! The potential difference is ${answerStr}`;}
      else{banner.className='result-banner wrong';document.getElementById('qBannerText').textContent=`The correct answer is ${answerStr}`;}
    }
  }

  document.getElementById('btnCheck').disabled=(ans.selectedIdx===null||ans.correct!==null);
  document.getElementById('btnCheck').style.display=ans.correct!==null?'none':'inline-block';
  document.getElementById('btnNext').style.display=(ans.correct!==null&&idx<questions.length-1)?'inline-block':'none';
  document.getElementById('btnSummary').style.display=(ans.correct!==null&&idx===questions.length-1)?'inline-block':'none';
  updateProgress();
}

function selectOpt(qIdx,optIdx){
  if(answers[qIdx].correct!==null) return;
  answers[qIdx].selectedIdx=optIdx;
  document.getElementById('btnCheck').disabled=false;
  document.querySelectorAll('#qOptions .option-btn').forEach((b,i)=>b.classList.toggle('selected',i===optIdx));
}

function checkAnswer(){
  const idx=currentIdx, q=questions[idx], ans=answers[idx];
  if(ans.selectedIdx===null||ans.correct!==null) return;
  const ok=ans.selectedIdx===q.correctIdx; ans.correct=ok;
  document.querySelectorAll('#qOptions .option-btn').forEach((btn,i)=>{
    btn.disabled=true;
    if(i===q.correctIdx){btn.classList.remove('selected');btn.classList.add('correct');btn.innerHTML+=`<span class="result-icon">✓</span>`;}
    else if(i===ans.selectedIdx&&!ok){btn.classList.remove('selected');btn.classList.add('wrong');btn.innerHTML+=`<span class="result-icon">✗</span>`;}
    else btn.classList.add('dimmed');
  });
  document.getElementById('qIcon').textContent=ok?'✓':'✗';
  const banner=document.getElementById('qBanner');
  const wbox=document.getElementById('qWorking');
  if(q.type==='fault'){
    const correctLabel=q.opts[q.correctIdx].label;
    if(ok){banner.className='result-banner correct';document.getElementById('qBannerText').textContent=`Correct! ${correctLabel}`;}
    else{banner.className='result-banner wrong';document.getElementById('qBannerText').textContent=`The correct answer is: ${correctLabel}`;}
    if(wbox){wbox.className='working-box visible';document.getElementById('qWorkingContent').innerHTML=buildFaultExplanation(q);}
  } else {
    const answerStr=fmtVS(q.correctV);
    if(ok){banner.className='result-banner correct';document.getElementById('qBannerText').textContent=`Correct! The potential difference is ${answerStr}`;}
    else{banner.className='result-banner wrong';document.getElementById('qBannerText').textContent=`The correct answer is ${answerStr}`;}
  }
  document.getElementById('btnCheck').style.display='none';
  if(idx<questions.length-1) document.getElementById('btnNext').style.display='inline-block';
  else document.getElementById('btnSummary').style.display='inline-block';
  updateProgress();
}

function goNext(){if(currentIdx<questions.length-1){currentIdx++;renderQuestion(currentIdx);}}
function goPrev(){if(currentIdx>0){currentIdx--;renderQuestion(currentIdx);}}

function showSummary(){
  document.getElementById('questionPanel').style.display='none';
  document.getElementById('summaryPanel').style.display='block';
  applyHealthyDisplay();
  highlightResistor(null);
  const score=answers.filter(a=>a.correct).length, total=questions.length;
  let html=`<div style="text-align:center;padding:1rem 0 1.4rem;border-bottom:1px solid var(--border);margin-bottom:1.2rem;">
    <div style="font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;color:${score===total?'var(--accent3)':'var(--accent)'};">
      ${score} <span style="font-size:1.2rem;color:var(--label);">/ ${total}</span></div>
    <div style="font-size:.7rem;color:var(--label);letter-spacing:.15em;margin-top:.3rem;">CORRECT</div></div>`;
  questions.forEach((q,i)=>{
    const ans=answers[i], chosen=q.opts[ans.selectedIdx], ok=ans.correct;
    const correctLabel=q.type==='fault'?q.opts[q.correctIdx].label:fmtVS(q.correctV);
    html+=`<div class="summary-item">
      <div class="summary-q">Q${i+1}${q.type==='fault'?` — <span style="color:#ffaa00;">⚡ Fault</span>`:` — <span style="color:${q.color};">${q.label}</span>`}</div>
      <div class="summary-question">${q.qText}</div>
      <div class="summary-answer" style="color:${ok?'var(--accent3)':'var(--accent4)'};">
        You answered: ${chosen?.label??'—'} &nbsp;${ok?'✓':'✗'}
        ${!ok?`<span style="color:var(--label);"> → Correct: ${correctLabel}</span>`:''}
      </div>
    </div>`;
  });
  document.getElementById('summaryContent').innerHTML=html;
}

// ══ Modal zoom ══
function openModal(){
  const src=document.getElementById('circuitSvg');
  const dst=document.getElementById('modalSvg');
  dst.innerHTML=src.innerHTML;
  dst.setAttribute('viewBox', src.getAttribute('viewBox'));
  const pvl=document.getElementById('panelVoltLabel');
  document.getElementById('modalVoltLabel').textContent=pvl?pvl.textContent:'';
  document.getElementById('diagramModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('diagramModal').classList.remove('open');
  document.body.style.overflow='';
}
function handleModalClick(e){
  if(e.target.closest('.modal-close')) return;
  closeModal();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});

setMode('example1');

/* ─── DEV: jump straight to a question for testing ──────────────────────
   Console:   jump(3)            → go to Q3
              jump(3, true)      → go to Q3 already answered correctly
   URL:       ?q=3               → loads straight on Q3
              ?q=3&ans=1         → loads on Q3, answered
   Note: question count is 2 warm-up + 1 fixed + 7 fault Qs = 10 total.
   Generic — copies into any quiz unchanged; remove the block to ship clean. */
function jump(n, answered){
  if(n < 1 || n > questions.length){
    console.warn('jump: question', n, 'out of range (1–'+questions.length+')'); return;
  }
  currentIdx = n - 1;
  renderQuestion(currentIdx);
  if(answered){
    answers[currentIdx].selectedIdx = questions[currentIdx].correctIdx;
    checkAnswer();
  }
}
window.jump = jump;
{ const p = new URLSearchParams(location.search);
  if(p.has('q')) jump(+p.get('q'), p.has('ans')); }
