<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Resistance Calculation Quiz 4</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --colour-bg:#0a0d14;
      --colour-panel:#0f1420;
      --colour-border:#1e2d4a;
      --colour-ui-primary:#00e5ff; /* interface accent — headings, selected option, Next button, active progress dot (NOT a resistor colour) */
      --colour-ui-restart:#ff6b35; /* Restart/Shuffle button only */
      --colour-ui-correct:#00ff99; /* "correct answer" state — option/banner highlight, Check button, done progress dot */
      --colour-ui-wrong:#ff3d9a; /* "wrong answer" state — option/banner highlight, modal close button */
      --colour-ui-summary:#a78bfa; /* Summary button only */
      --colour-series:#00e5ff;              /* R4 + circuit lines — cyan */
      --colour-resistor:#00e5ff;            /* default colour for resistor bodies (box outlines), before grouping is revealed */
      --colour-resistor-labels:#f8f8f5;     /* default colour for resistor names (R1…) & ohms values, before grouping is revealed */
      --colour-node:#f8f8f5;                 /* node labels (A, B, C) at the circuit's junction points */
      --colour-resistor-combo1:#f209ea;     /* Group labels used to highlight resistors relating to questions */
      --colour-resistor-combo2:#FFD700; 
      --colour-resistor-combo3:#3d7dff; 
      --colour-resistor-combo4:#14ffd4; 
      --colour-resistor-combo5:#7b2ff7;
      --colour-resistor-total:#00FFFF;      /* total resistance labels */
      --colour-red:#ff3333;                 /* voltage-drop labels */
      --colour-supply:#ff4444;              /* battery / supply voltage */
      --colour-grid:rgba(0,229,255,0.06);
      --colour-text:#c8d8e8;
      --colour-label:#5a7a9a;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--colour-bg);color:var(--colour-text);
      font-family:'Share Tech Mono',monospace;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;padding:2rem 1rem;
      background-image:linear-gradient(var(--colour-grid) 1px,transparent 1px),linear-gradient(90deg,var(--colour-grid) 1px,transparent 1px);
      background-size:40px 40px;
    }
    header{text-align:center;margin-bottom:2rem;width:100%;}
    header h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900;letter-spacing:.12em;color:var(--colour-ui-primary);text-shadow:0 0 30px rgba(0,229,255,.5);text-transform:uppercase;}
    header p{margin-top:.5rem;color:var(--colour-label);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;}

    .quiz-wrap{width:100%;max-width:1400px;display:flex;flex-direction:column;gap:1.5rem;}
    @media(min-width:900px){
      .quiz-wrap{display:grid;grid-template-columns:minmax(340px,52%) 1fr;gap:1.2rem;align-items:start;}
      .circuit-col{position:sticky;top:1.5rem;}
      .questions-col{min-width:0;}
      .questions-col .card{padding:1rem 1.1rem;}
      .questions-col .option-btn{padding:.5rem .7rem;font-size:.76rem;}
      .questions-col .q-text{font-size:.86rem;}
      .questions-col .result-banner{font-size:.72rem;padding:.5rem .8rem;}
      .questions-col .btn{width:130px;font-size:.64rem;}
      .questions-col .working-box{padding:.85rem 1rem;}
      .questions-col .options{gap:.4rem;}
    }

    .card{background:var(--colour-panel);border:1px solid var(--colour-border);border-radius:4px;padding:1.6rem;}
    .circuit-panel{background:rgba(0,0,0,.25);border:1px solid var(--colour-border);border-radius:4px;padding:.8rem;position:relative;cursor:zoom-in;}
    .circuit-panel svg{width:100%;height:auto;display:block;}
    .panel-label{font-size:.58rem;letter-spacing:.18em;color:var(--colour-label);text-transform:uppercase;text-align:center;margin-bottom:6px;}

    .q-panel{display:flex;flex-direction:column;gap:1rem;}
    .q-header{display:flex;align-items:flex-start;gap:1rem;}
    .q-num{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;color:var(--colour-ui-primary);white-space:nowrap;padding-top:.15rem;}
    .q-text{color:#d0e4f0;font-size:.9rem;font-weight:bold;line-height:1.5;}
    .q-hint{font-size:.75rem;color:var(--colour-label);font-weight:normal;margin-top:.3rem;}

    .options{display:flex;flex-direction:column;gap:.6rem;}
    .option-btn{width:100%;padding:.7rem 1rem;border-radius:3px;border:1px solid var(--colour-border);background:rgba(255,255,255,.02);color:var(--colour-text);font-family:'Share Tech Mono',monospace;font-size:.82rem;text-align:left;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;gap:.7rem;}
    .option-btn:hover:not(:disabled){border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.05);}
    .option-btn.selected{border-color:rgba(0,229,255,.6);background:rgba(0,229,255,.08);color:var(--colour-ui-primary);}
    .option-btn.correct{border-color:var(--colour-ui-correct);background:rgba(0,255,153,.08);color:var(--colour-ui-correct);}
    .option-btn.wrong{border-color:var(--colour-ui-wrong);background:rgba(255,61,154,.08);color:var(--colour-ui-wrong);}
    .option-btn.dimmed{opacity:.35;}
    .option-letter{font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;min-width:22px;}
    .result-icon{font-size:1.1rem;margin-left:auto;}

    .result-banner{display:none;padding:.65rem 1rem;border-radius:3px;font-size:.78rem;font-family:'Orbitron',sans-serif;align-items:center;gap:.6rem;line-height:1.5;}
    .result-banner.correct{display:flex;background:rgba(0,255,153,.08);border:1px solid rgba(0,255,153,.3);color:var(--colour-ui-correct);}
    .result-banner.wrong{display:flex;background:rgba(255,61,154,.08);border:1px solid rgba(255,61,154,.3);color:var(--colour-ui-wrong);}

    .working-box{display:none;background:rgba(0,0,0,.2);border:1px solid var(--colour-border);border-radius:4px;padding:1.1rem 1.3rem;}
    .working-box.visible{display:block;}
    .working-title{font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:.2em;color:var(--colour-label);text-transform:uppercase;margin-bottom:.7rem;padding-bottom:.4rem;border-bottom:1px solid var(--colour-border);}
    .step-label{font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:1rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid var(--colour-border);}
    .step-label:first-of-type{margin-top:0;}
    .wlabel{font-size:.72rem;color:var(--colour-label);margin:.5rem 0 .1rem;}
    .wline{font-size:.8rem;line-height:1.7;}
    .wline.total{margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--colour-border);font-size:.85rem;}
    .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;}
    .frac .num{border-bottom:1.5px solid currentColor;padding:0 6px 2px;text-align:center;width:100%;}
    .frac .den{padding:2px 6px 0;text-align:center;width:100%;}
    .formula-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1;padding:.5rem 0;font-size:.82rem;}
    .c1{color:var(--colour-resistor-combo1);}
    .c2{color:var(--colour-resistor-combo2);}
    .c3{color:var(--colour-resistor-combo3);}
    .c4{color:var(--colour-resistor-combo4);}
    .c5{color:var(--colour-resistor-combo5);}
    .ct{color:var(--colour-resistor-total);}
    .cs{color:var(--colour-series);}
    .cr{color:var(--colour-ui-correct);}
    .cv{color:var(--colour-red);}

    .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
    .btn{padding:.5rem 0;border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s;border:1px solid;width:140px;text-align:center;}
    .btn-check{background:rgba(0,255,153,.1);border-color:rgba(0,255,153,.4);color:var(--colour-ui-correct);}
    .btn-check:hover:not(:disabled){background:rgba(0,255,153,.2);}
    .btn-check:disabled{opacity:.35;cursor:default;}
    .btn-shuffle{background:rgba(255,107,53,.1);border-color:rgba(255,107,53,.4);color:var(--colour-ui-restart);margin-left:auto;}
    .btn-shuffle:hover{background:rgba(255,107,53,.2);}
    .btn-next{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.4);color:var(--colour-ui-primary);}
    .btn-next:hover{background:rgba(0,229,255,.2);}
    .btn-prev{background:rgba(90,122,154,.1);border-color:rgba(90,122,154,.4);color:var(--colour-label);}
    .btn-prev:hover{background:rgba(90,122,154,.2);}
    .btn-summary{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.4);color:var(--colour-ui-summary);}
    .btn-summary:hover{background:rgba(167,139,250,.22);}

    .summary-head{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0 .8rem;border-bottom:1px solid var(--colour-border);margin-bottom:1rem;}
    .summary-title{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:var(--colour-ui-primary);letter-spacing:.15em;text-transform:uppercase;}
    .summary-values{background:rgba(0,0,0,.2);border:1px solid var(--colour-border);border-radius:4px;padding:.8rem 1rem;margin-bottom:1.2rem;font-size:.82rem;line-height:2.1;}
    .summary-item{border:1px solid var(--colour-border);border-radius:4px;padding:.9rem 1rem;margin-bottom:1rem;background:rgba(0,0,0,.15);}
    .summary-item-head{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.3rem;}
    .summary-qnum{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--colour-ui-primary);font-size:.85rem;white-space:nowrap;}
    .summary-question{font-size:.82rem;color:#d0e4f0;font-weight:bold;line-height:1.4;}
    .summary-answer{font-size:.74rem;margin:.45rem 0;font-family:'Orbitron',sans-serif;letter-spacing:.04em;}
    .progress-wrap{display:flex;gap:.4rem;align-items:center;margin-bottom:1rem;}
    .progress-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--colour-border);background:transparent;transition:background .2s,border-color .2s;}
    .progress-dot.done{background:var(--colour-ui-correct);border-color:var(--colour-ui-correct);}
    .progress-dot.active{background:var(--colour-ui-primary);border-color:var(--colour-ui-primary);box-shadow:0 0 6px rgba(0,229,255,.6);}
    .progress-label{font-size:.65rem;color:var(--colour-label);margin-left:.4rem;letter-spacing:.1em;}

    .zoom-hint{position:absolute;bottom:.6rem;right:.7rem;font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:.12em;color:var(--colour-label);text-transform:uppercase;display:flex;align-items:center;gap:.35rem;pointer-events:none;opacity:.7;}
    .zoom-hint svg{width:13px;height:13px;fill:var(--colour-label);}

    .diagram-modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(5,8,16,.88);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1.2rem;}
    .diagram-modal.open{display:flex;}
    .modal-inner{position:relative;background:rgba(0,0,0,.35);border:1px solid var(--colour-border);border-radius:6px;padding:.8rem;max-width:min(92vw,900px);max-height:92vh;width:100%;display:flex;flex-direction:column;gap:.5rem;box-shadow:0 0 60px rgba(0,229,255,.08);cursor:zoom-out;}
    .modal-inner svg{width:100%;height:auto;max-height:calc(92vh - 5rem);display:block;}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:.4rem;border-bottom:1px solid var(--colour-border);}
    .modal-title{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.18em;color:var(--colour-label);text-transform:uppercase;}
    .modal-close{font-family:'Share Tech Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:rgba(255,61,154,.08);border:1px solid rgba(255,61,154,.35);color:var(--colour-ui-wrong);border-radius:3px;padding:.3rem .7rem;transition:background .15s;}
    .modal-close:hover{background:rgba(255,61,154,.18);}

    /* ── Example / Randomise mode toggle ── */
    .mode-toggle{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem;font-family:'Share Tech Mono',monospace;}
    .mode-seg{display:inline-flex;border:1px solid var(--colour-border);border-radius:4px;overflow:hidden;flex-wrap:wrap;}
    .mode-seg button{font-family:'Share Tech Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:.4rem .95rem;border:none;background:transparent;color:var(--colour-label);transition:background .15s,color .15s;}
    .mode-seg button + button{border-left:1px solid var(--colour-border);}
    .mode-seg button.active{background:rgba(0,229,255,.12);color:var(--colour-ui-primary);}
    .mode-seg button:not(.active):hover{background:rgba(0,229,255,.04);color:var(--colour-text);}
  </style>
</head>
<body>
<header>
  <h1 id="pageTitle">Total Resistance Calculation Quiz 4</h1>
  <p>Step-by-Step Simplification · Total Resistance</p>
</header>

<div class="quiz-wrap">

  <!-- LEFT: circuit diagram -->
  <div class="circuit-col">
    <div class="mode-toggle" id="modeToggle">
      <div class="mode-seg" id="modeSeg">
        <button id="modeExample1" class="active" onclick="setMode('example1')">Example 1</button>
        <button id="modeExample2" onclick="setMode('example2')">Example 2</button>
        <button id="modeExample3" onclick="setMode('example3')">Example 3</button>
        <button id="modeRandomise" onclick="setMode('randomise')">Randomise</button>
      </div>
    </div>
    <div class="circuit-panel" onclick="openModal()" title="Click to zoom">
      <div class="panel-label">Circuit Diagram — <span id="panelVoltLabel">9 V</span> Source</div>
      <div class="zoom-hint">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
          <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="6" y1="8" x2="10" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="8" y1="6" x2="8" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Zoom
      </div>

      <svg id="circuitSvg" viewBox="0 0 520 560" xmlns="http://www.w3.org/2000/svg"
           font-family="'Share Tech Mono',monospace">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- ══ SHARED BATTERY (E, supply voltage) — identical in every layout, lives outside the toggle groups ══ -->
        <!-- Left vertical (upper): top-left corner (70,90) down to the battery + terminal -->
        <line x1="70"  y1="90"  x2="70"  y2="240" style="stroke: var(--colour-series)"/>
        <!-- Group origin = wire attachment point (centre of + plate) -->
        <g id="batteryGroup" transform="translate(70,240)">
          <line x1="-22" y1="0" x2="22" y2="0" style="stroke: var(--colour-red)" stroke-width="4"/>
          <line x1="-12" y1="30" x2="12" y2="30" style="stroke: var(--colour-red)" stroke-width="2"/>
          <text x="34" y="5" style="fill: var(--colour-red)" font-size="16" font-weight="bold">+</text>
          <text x="34" y="36" style="fill: var(--colour-red)" font-size="16" font-weight="bold">−</text>
          <text x="-30" y="-12" style="fill: var(--colour-supply)" font-size="15" text-anchor="end" font-weight="bold">E</text>
          <text id="battLabel" x="-30" y="50" style="fill: var(--colour-supply)" font-size="15" text-anchor="end" font-weight="bold">9V</text>
        </g>
        <!-- Left vertical (lower): battery − terminal down to the negative rail start (70,290) -->
        <line x1="70"  y1="270" x2="70"  y2="290" style="stroke: var(--colour-series)"/>
        <!-- battery connects into each layout at the fixed points (70,90) top and (70,290) bottom -->

        <!-- ══════════════════════════════════════════════════════════════
             Each <g class="circuit-layout"> below is a SELF-CONTAINED
             mini-diagram for one stage of the simplification. Only one is
             shown at a time (showLayout() in the script toggles display).
             All element ids are prefixed L0-…L5- to avoid collisions.
             Layout0 mirrors resistor_quiz_4.html's circuit exactly (same
             textbook topology) — keep the two in sync if either changes.
             To rearrange which resistors combine at which step: edit the
             COMBINE_STEPS array in the script, then update/reorder these
             layout groups (and their box sizes — see boxScale()) to match.
             ══════════════════════════════════════════════════════════════ -->

        <!-- ══ LAYOUT 0 — full circuit, nothing combined yet (exact copy of quiz_4's current SVG); Q1 asks about R3+R5 ══ -->
        <g id="layout0" class="circuit-layout">
          <!-- ══ WIRES — grouped by geometry so a wrong connection is easy to spot ══ -->

          <!-- ── LEFT VERTICAL ── -->
          <!-- Bottom-left corner up to the negative rail -->
          <line x1="70"  y1="480" x2="70"  y2="290" style="stroke: var(--colour-series)"/>

          <!-- ── RIGHT VERTICAL ── -->
          <!-- Node A stub down into R3's top terminal -->
          <line x1="435" y1="135" x2="435" y2="240" style="stroke: var(--colour-series)"/>
          <!-- R3 bottom terminal down to R5's top terminal (series link) -->
          <line x1="435" y1="240" x2="435" y2="375" style="stroke: var(--colour-series)"/>
          <!-- R5 bottom terminal down to the R5/R6 junction -->
          <line x1="435" y1="435" x2="435" y2="480" style="stroke: var(--colour-series)"/>

          <!-- ── TOP HORIZONTAL ── -->
          <!-- Top-left corner across to R1 left terminal -->
          <line x1="70"  y1="90"  x2="130" y2="90"  style="stroke: var(--colour-series)"/>
          <!-- R1 right terminal across to the corner above Node A -->
          <line x1="210" y1="90"  x2="285" y2="90"  style="stroke: var(--colour-series)"/>

          <!-- ── BOTTOM HORIZONTAL ── -->
          <!-- R5/R6 junction across to R6's right terminal -->
          <line x1="435" y1="480" x2="210" y2="480" style="stroke: var(--colour-series)"/>
          <!-- R6 left terminal across to the bottom-left corner -->
          <line x1="130" y1="480" x2="70"  y2="480" style="stroke: var(--colour-series)"/>

          <!-- ── CENTRE VERTICAL ── -->
          <!-- Corner down through Node A into R2's top terminal -->
          <line x1="285" y1="90"  x2="285" y2="180" style="stroke: var(--colour-series)"/>
          <!-- R2 bottom terminal down to the R2/R4 junction (Node B) -->
          <line x1="285" y1="240" x2="285" y2="345" style="stroke: var(--colour-series)"/>
          <!-- Connecting stub: R2/R4 junction down to the R5/R6 junction — this is what makes R2∥(R3+R5) and R4∥R6 -->
          <line x1="285" y1="345" x2="285" y2="480" style="stroke: var(--colour-series)"/>

          <!-- ── CENTRE HORIZONTAL ── -->
          <!-- Node A across to R3's column -->
          <line x1="285" y1="135" x2="435" y2="135" style="stroke: var(--colour-series)"/>
          <!-- R4 right terminal across to the R2/R4 junction (Node B) -->
          <line x1="210" y1="345" x2="285" y2="345" style="stroke: var(--colour-series)"/>
          <!-- R4 left terminal across to the negative rail (Node C) -->
          <line x1="130" y1="345" x2="70"  y2="345" style="stroke: var(--colour-series)"/>

          <!-- ══ NODES (A, B, C) — each node's junction dot and label grouped together; -->
          <!-- matches resistor_quiz_4.html's layout exactly ══ -->

          <!-- ── NODE A ── -->
          <circle cx="285" cy="135" r="5" style="fill: var(--colour-series)"/>
          <g id="L0-nodeA" transform="translate(264,136)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="-4" y="4" style="fill: var(--colour-node)" font-size="15" font-weight="bold">A</text>
          </g>

          <!-- ── NODE B ── -->
          <circle cx="285" cy="345" r="5" style="fill: var(--colour-series)"/>
          <g id="L0-nodeB1" transform="translate(310,346)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="-4" y="4" style="fill: var(--colour-node)" font-size="15" font-weight="bold">B</text>
          </g>
          <circle cx="285" cy="480" r="5" style="fill: var(--colour-series)"/>
          <g id="L0-nodeB2" transform="translate(284,506)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="-4" y="4" style="fill: var(--colour-node)" font-size="15" font-weight="bold">B</text>
          </g>

          <!-- ── NODE C ── -->
          <circle cx="70"  cy="345" r="5" style="fill: var(--colour-series)"/>
          <g id="L0-nodeC" transform="translate(46,346)">
            <circle cx="0" cy="0" r="12" fill="none" style="stroke: var(--colour-series)" stroke-width="1.5"/>
            <text x="4" y="4" style="fill: var(--colour-node)" text-anchor="end" font-size="15" font-weight="bold">C</text>
          </g>

          <g id="L0-r1Group" transform="translate(130,74)">
            <rect id="L0-box-r1" x="0" y="0" width="80" height="30" rx="3" style="fill: var(--colour-panel)" stroke="var(--colour-resistor)" stroke-width="2" filter="url(#glow)"/>
            <text id="L0-nm-r1" x="40" y="-10" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="15" font-weight="bold">R1</text>
            <text id="L0-lbl-r1" x="40" y="52" fill="var(--colour-resistor-labels)" text-anchor="middle" font-size="14">1kΩ</text>
          </g>

<script>
// ╔══════════════════════════════════════════════════════════════════════╗
// ║  HOW THIS QUIZ IS STRUCTURED (diagram-per-step variant)              ║
// ║                                                                      ║
// ║  Unlike the quiz2/3/4 template (one diagram, colour/annotation       ║
// ║  toggles), this quiz shows a DIFFERENT SVG layout at each step —     ║
// ║  each question replaces two resistor boxes with one bigger combined  ║
// ║  box, in its own <g id="layoutN"> group in the <body>. Only one      ║
// ║  layout is visible at a time (showLayout() toggles them).            ║
// ║                                                                      ║
// ║  The question logic (which resistors combine, in what order, series  ║
// ║  or parallel, options/distractors, workings) is entirely driven by   ║
// ║  the COMBINE_STEPS array below — that's the one thing you can        ║
// ║  rearrange without touching any function bodies.                     ║
// ║                                                                      ║
// ║  To rearrange the combination order or grouping:                     ║
// ║  1. Reorder/edit COMBINE_STEPS (key, a, b, op, count, layoutAfter).   ║
// ║  2. Update QUESTIONS[] text/hints to match the new order.             ║
// ║  3. Redraw/relabel the layout<N> groups in the SVG so each one shows  ║
// ║     the right boxes for that stage (box size = boxScale(count) ×     ║
// ║     the normal 30×80 / 80×30 resistor box). This is the part that     ║
// ║     needs hand (or AI) editing — the maths/questions will follow      ║
// ║     COMBINE_STEPS automatically, but the pictures won't draw          ║
// ║     themselves.                                                       ║
// ║  4. RAW_LABEL_LAYOUTS tells refreshLabels() which layouts still show  ║
// ║     each raw resistor's own value label individually — update it if   ║
// ║     a resistor now disappears at a different step.                    ║
// ║                                                                      ║
// ║  Leave the QUIZ ENGINE section (bottom of file) untouched.           ║
// ╚══════════════════════════════════════════════════════════════════════╝

// ══════════════════════════════════════════════════════════════════════
// CIRCUIT CONFIGURATION
// Edit this section for a new circuit.
// ══════════════════════════════════════════════════════════════════════

// Circuit topology: R1 series → (R2∥R3) series → [R4 ∥ (R5+R6)]
// This quiz walks the student through solving R_T by combining two resistors
// at a time — see COMBINE_STEPS below. Each step has its own SVG "layout"
// (layout0…layout5 in the <svg>), swapped in by showLayout() as the student
// progresses. To rearrange which resistors combine at which step: reorder/
// edit COMBINE_STEPS, then update the matching layout<N> groups in the SVG
// (box positions/sizes) and the QUESTIONS text above to match.
// ── Example value sets — Example 1 is the original; edit 2/3 freely ──
const EXAMPLE_SETS = {
  example1: { r1:1000, r2:2000, r3:3000, r4:4000, r5:5000, r6:6000, vs:9  },
  example2: { r1:2000, r2:1000, r3:4000, r4:3000, r5:2000, r6:5000, vs:12 },
  example3: { r1:1500, r2:3000, r3:2000, r4:1000, r5:4000, r6:2000, vs:15 }
};
let quizMode = 'example1';
let V = { ...EXAMPLE_SETS.example1 };

// Number of questions in the chain.
// If you add or remove questions, update this AND CIRCUIT_STATES[],
// QUESTION_BUILDERS[], the buildQnOptions/checkQn function sets, and
// the matching HTML panels (q1Panel…qnPanel, q1Check…qnCheck, etc.).
const QUIZ_QUESTION_COUNT = 4;
const QIDS = Array.from({length: QUIZ_QUESTION_COUNT}, (_,i) => 'q'+(i+1));

// ══════════════════════════════════════════════════════════════════════
// QUESTION TEXT — edit here to change questions and hints
// ══════════════════════════════════════════════════════════════════════
const QUESTIONS = [
  {
    text: 'What is R<sub>3,5</sub> = R3 + R5 (in series)?',
    hint: 'R3 and R5 are in series in the same branch — just add them.'
  },
  {
    text: 'What is the resistance for the parallel resistors R4 and R6?',
    hint: 'R4 and R6 are in parallel with each other — combine them with the reciprocal formula.'
  },
  {
    text: 'What is R<sub>2,3,5</sub> = R2 ∥ R<sub>3,5</sub> (in parallel)?',
    hint: 'R2 and the R<sub>3,5</sub> combination (from Q1) are in parallel with each other — combine them with the reciprocal formula.'
  },
  {
    text: 'All remaining values — R1, R<sub>2,3,5</sub> and R<sub>4,6</sub> — are in series. What is the total resistance R<sub>T</sub>?',
    hint: 'Add all three values together for the final total resistance.'
  }
];
QUESTIONS.forEach((q, i) => {
  document.getElementById('q' + (i + 1) + 'Text').innerHTML = q.text;
  document.getElementById('q' + (i + 1) + 'Hint').innerHTML = q.hint;
});

// ══════════════════════════════════════════════════════════════════════
// END CIRCUIT CONFIGURATION
// ══════════════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════════════
// CIRCUIT SIMULATION
// Rewrite this section for a new circuit topology.
// ══════════════════════════════════════════════════════════════════════

// ── E12 pool + generator for Randomise mode ──
const E12_BASE=[10,12,15,18,22,27,33,39,47,56,68,82];
const E12=[]; [1,10].forEach(m=>E12_BASE.forEach(v=>E12.push(v*m)));
function pickN(arr,n){const a=[...arr],r=[];for(let i=0;i<n;i++){r.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);}return r;}
function randomValues(){
  const a=pickN(E12,6);
  const vsOpts=[20,30,40,50,60,80,100];
  return { r1:a[0],r2:a[1],r3:a[2],r4:a[3],r5:a[4],r6:a[5],
           vs:vsOpts[Math.floor(Math.random()*vsOpts.length)] };
}

const LETTERS=['A','B','C','D'];
function fmtO(v){return v>=1000?(v/1000).toFixed(2)+' kΩ':v.toFixed(2)+' Ω';}
function fmtO0(v){return v>=1000?(v/1000).toFixed(2)+'kΩ':v+'Ω';}
function fmtA(a){const x=Math.abs(a);if(x>=1)return a.toFixed(3)+' A';if(x>=0.001)return (a*1000).toFixed(2)+' mA';return (a*1e6).toFixed(1)+' µA';}
function fmtASplit(a){const x=Math.abs(a);if(x>=1)return {num:a.toFixed(3),unit:'A'};if(x>=0.001)return {num:(a*1000).toFixed(2),unit:'mA'};return {num:(a*1e6).toFixed(1),unit:'µA'};}
function fmtV(v){const a=Math.abs(v);if(a>=1)return v.toFixed(2)+' V';if(a>=0.001)return (v*1000).toFixed(2)+' mV';return (v*1e6).toFixed(1)+' µV';}
function frac(num,den){return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;}

// ── COMBINE_STEPS: the data-driven step list — this is what to edit to  ──
// ── rearrange the quiz. Each step combines exactly two values (raw       ──
// ── resistors and/or earlier results) into one named result.             ──
// a/b: keys into VALUES (raw r1…r6, or an earlier step's key).
// op: 'series' (add) or 'parallel' (reciprocal-sum).
// count: how many ORIGINAL resistors this result represents — drives the
//        combined box's size in the SVG (see BOX_SCALE) and must match
//        whatever box you draw for layoutAfter.
// layoutAfter: which <g id="layoutN"> becomes visible once this step is solved.
// cls: the .c1…c5 colour class for this step's group colour, used in the
// worked-solution text. The matching SVG colour lives on each step's input
// boxes (in the layout where that question is asked) and its result box
// (in the layout where it's first shown) — see the layout<N> groups.
// labelLayouts: every layout that draws this result's OWN value-label box —
// usually just [layoutAfter], but a result that survives to be an input to
// a LATER (non-adjacent) step, like R35 here (created in step 1, but not
// consumed until step 4), has extra copies of its box in the layouts in
// between too, and every copy needs its text kept in sync.
// The final step (rt) combines THREE values (a,b,c) instead of two — R1,
// R2,3,5 and R4,6 are all in series with nothing left to pair up, so it's a
// straight 3-way sum rather than another binary combine. op is always
// 'series' when c is present; buildStepOptions/showStepWorking special-case it.
const COMBINE_STEPS = [
  { key:'r35',  label:'R<sub>3,5</sub>',   a:'r3', b:'r5',   aLabel:'R3', bLabel:'R5',   op:'series',   count:2, layoutAfter:1, cls:'c1', labelLayouts:[1,2] },
  { key:'r46',  label:'R<sub>4,6</sub>',   a:'r4', b:'r6',   aLabel:'R4', bLabel:'R6',   op:'parallel', count:2, layoutAfter:2, cls:'c2', labelLayouts:[2,3] },
  { key:'r235', label:'R<sub>2,3,5</sub>', a:'r2', b:'r35',  aLabel:'R2', bLabel:'R3,5', op:'parallel', count:3, layoutAfter:3, cls:'c3', labelLayouts:[3]   },
  { key:'rt',   label:'R<sub>T</sub>',     a:'r1', b:'r235', c:'r46', aLabel:'R1', bLabel:'R2,3,5', cLabel:'R4,6', op:'series', count:6, layoutAfter:4, cls:'ct', labelLayouts:[4] },
];
// Box-size multiplier for a combined resistor, by how many originals it
// represents (n=2 → 20% larger, n=3 → 30% larger, etc). A single,
// uncombined resistor (n=1) is always drawn at its normal 1.0 size.
function boxScale(n){ return n<=1 ? 1 : 1+0.1*n; }

// ── derived (recomputed whenever the value set changes) ──
let VALUES={};
function combine(op,a,b){ return op==='series' ? a+b : 1/(1/a+1/b); }
function recompute(){
  VALUES = {r1:V.r1,r2:V.r2,r3:V.r3,r4:V.r4,r5:V.r5,r6:V.r6};
  COMBINE_STEPS.forEach(step=>{
    VALUES[step.key] = step.c
      ? VALUES[step.a] + VALUES[step.b] + VALUES[step.c]
      : combine(step.op,VALUES[step.a],VALUES[step.b]);
  });
}

// ── mode switching ──
// Which layout(s) each raw resistor's value label appears in — needed
// because R1…R6 are drawn once per layout they still appear in individually.
const RAW_LABEL_LAYOUTS = {
  r1:[0,1,2,3], r2:[0,1,2], r3:[0], r4:[0,1], r5:[0], r6:[0,1],
};
function refreshLabels(){
  Object.keys(RAW_LABEL_LAYOUTS).forEach(key=>{
    RAW_LABEL_LAYOUTS[key].forEach(n=>{
      const el=document.getElementById('L'+n+'-lbl-'+key); if(el) el.textContent=fmtO0(V[key]);
    });
  });
  COMBINE_STEPS.forEach(step=>{
    step.labelLayouts.forEach(n=>{
      const el=document.getElementById('L'+n+'-lbl-'+step.key);
      if(el) el.textContent=fmtO(VALUES[step.key]);
    });
  });
  document.getElementById('panelVoltLabel').textContent=V.vs+' V';
  document.getElementById('battLabel').textContent=V.vs+'V';
  const mt=document.getElementById('modalVoltLabel');
  if(mt) mt.textContent=`Circuit Diagram — ${V.vs} V Source`;
}
function setMode(mode){
  quizMode=mode;
  V = (mode==='randomise') ? randomValues() : { ...EXAMPLE_SETS[mode] };
  recompute();
  refreshLabels();
  ['example1','example2','example3','randomise'].forEach(m=>{
    const b=document.getElementById('mode'+m.charAt(0).toUpperCase()+m.slice(1));
    if(b) b.classList.toggle('active',m===mode);
  });
  resetQuiz();   // rebuilds options for the new values and returns to Q1
}

// Applies an explicit value set (used when arriving here via quiz 4's "help"
// link, so this walkthrough shows the exact same circuit instance quiz 4 was
// asking about). The Example/Randomise toggle is hidden entirely in this case
// — those values must match quiz 4, so the student can't switch away from them.
function applyValues(vals){
  quizMode='custom';
  V=vals;
  recompute();
  refreshLabels();
  const toggle=document.getElementById('modeToggle');
  if(toggle) toggle.style.display='none';
  resetQuiz();
}

const Q={};
let cur='q1';
// Set from ?return=<quizId> — when present, the summary screen shows a link back to that quiz.
let returnTo=null;
const RETURN_URLS={ quiz4:'resistor_quiz_4.html' };
// Page heading swaps to name the quiz that sent the student here (e.g. "...Quiz 4"),
// falling back to "...Quiz 1" (this walkthrough's own name) when visited standalone.
const RETURN_TITLES={ quiz4:'4' };

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ── generic option builder — derives distractors from step.op, so adding/
// reordering COMBINE_STEPS entries needs no changes here ──
function buildStepOptions(step){
  const a=VALUES[step.a], b=VALUES[step.b];
  const correct=VALUES[step.key];
  let wrong1,wrong2,wrong3;
  if(step.c){
    const c=VALUES[step.c];
    // correct: a+b+c. distractors: each pairwise sum (forgot one of the three values)
    wrong1=a+b; wrong2=a+c; wrong3=b+c;
    return shuffle([
      {label:fmtO(correct),type:'correct'},
      {label:fmtO(wrong1),type:'wrong'},
      {label:fmtO(wrong2),type:'wrong'},
      {label:fmtO(wrong3),type:'wrong'},
    ]);
  }
  if(step.op==='series'){
    wrong1=combine('parallel',a,b); // used the wrong rule (paralleled instead of adding)
    wrong2=a;                        // forgot to include the second value
    wrong3=b;                        // forgot to include the first value
  } else {
    wrong1=combine('series',a,b);   // used the wrong rule (added instead of paralleling)
    wrong2=a;                        // forgot to include the second value
    wrong3=a*b;                      // forgot to divide by the sum (classic parallel slip)
  }
  return shuffle([
    {label:fmtO(correct),type:'correct'},
    {label:fmtO(wrong1),type:'wrong'},
    {label:fmtO(wrong2),type:'wrong'},
    {label:fmtO(wrong3),type:'wrong'},
  ]);
}
const QUESTION_BUILDERS = COMBINE_STEPS.map(step=>()=>buildStepOptions(step));
// ── engine: generic option rendering — leave unchanged ──
function renderOptions(qid){
  const st=Q[qid], c=document.getElementById(qid+'Options'); c.innerHTML='';
  st.opts.forEach((opt,i)=>{
    const btn=document.createElement('button'); btn.className='option-btn';
    btn.innerHTML=`<span class="option-letter">${LETTERS[i]}</span><span>${opt.label}</span>`;
    btn.addEventListener('click',()=>selectOption(qid,i));
    c.appendChild(btn);
  });
}
function selectOption(qid,i){
  if(Q[qid].ans) return;
  Q[qid].sel=i;
  document.getElementById(qid+'Check').disabled=false;
  document.querySelectorAll('#'+qid+'Options .option-btn').forEach((b,idx)=>b.classList.toggle('selected',idx===i));
}
function markOptions(qid,sel,cor,ok){
  document.querySelectorAll('#'+qid+'Options .option-btn').forEach((btn,i)=>{
    btn.disabled=true;
    if(i===cor){btn.classList.remove('selected');btn.classList.add('correct');btn.innerHTML+=`<span class="result-icon">✓</span>`;}
    else if(i===sel&&!ok){btn.classList.remove('selected');btn.classList.add('wrong');btn.innerHTML+=`<span class="result-icon">✗</span>`;}
    else btn.classList.add('dimmed');
  });
}
function setBanner(qid,ok,correctText){
  const banner=document.getElementById(qid+'Banner');
  document.getElementById(qid+'Icon').textContent=ok?'✓':'✗';
  if(ok){banner.className='result-banner correct';document.getElementById(qid+'BannerText').innerHTML=`Correct! ${correctText}`;}
  else{banner.className='result-banner wrong';document.getElementById(qid+'BannerText').innerHTML=`The correct answer is ${correctText}`;}
}

// ── layout switching — shows exactly one of the six <g id="layoutN"> groups ──
function showLayout(n){
  for(let i=0;i<=4;i++){
    const g=document.getElementById('layout'+i);
    if(g) g.setAttribute('display', i===n?'inline':'none');
  }
}

// ── box highlight colours — a layout is shown twice: once right after its
// step is solved (only the freshly-created box gets its own colour; the
// NEXT question's inputs stay the default colour so nothing gives away what
// to look at before the student actually sees that question), and again
// when the student advances to that next question (now its inputs light up
// too). Recomputed fresh every call, so Back/Next/jump can't leave stale
// colours behind. ──
function colourForCls(cls){
  const map={c1:'var(--colour-resistor-combo1)',c2:'var(--colour-resistor-combo2)',c3:'var(--colour-resistor-combo3)',c4:'var(--colour-resistor-combo4)',c5:'var(--colour-resistor-combo5)',ct:'var(--colour-resistor-total)'};
  return map[cls] || 'var(--colour-resistor)';
}
function applyLayoutColours(stepIndex, highlightNext){
  const step=COMBINE_STEPS[stepIndex];
  const layoutN=step.layoutAfter;
  const nextStep=COMBINE_STEPS[stepIndex+1];
  const keys=new Set([step.key]);
  if(nextStep){ keys.add(nextStep.a); keys.add(nextStep.b); if(nextStep.c) keys.add(nextStep.c); }
  keys.forEach(k=>{
    const el=document.getElementById('L'+layoutN+'-box-'+k);
    if(el) el.setAttribute('stroke','var(--colour-resistor)');
  });
  const ownEl=document.getElementById('L'+layoutN+'-box-'+step.key);
  if(ownEl) ownEl.setAttribute('stroke', colourForCls(step.cls));
  if(highlightNext && nextStep){
    const colour = nextStep.c ? 'var(--colour-resistor-combo5)' : colourForCls(nextStep.cls);
    [nextStep.a, nextStep.b, nextStep.c].filter(Boolean).forEach(k=>{
      const el=document.getElementById('L'+layoutN+'-box-'+k);
      if(el) el.setAttribute('stroke', colour);
    });
  }
}

// ── generic check/working — driven entirely by COMBINE_STEPS, so adding,
// removing or reordering steps needs no changes below this point ──
function checkStep(n){
  const qid='q'+n, st=Q[qid]; if(st.ans||st.sel===null) return; st.ans=true;
  const ok=st.sel===st.cor;
  markOptions(qid,st.sel,st.cor,ok);
  const step=COMBINE_STEPS[n-1];
  setBanner(qid,ok,`${step.label} = ${fmtO(VALUES[step.key])}`);
  showStepWorking(n);
  showLayout(step.layoutAfter);
  applyLayoutColours(n-1, false);
  advanceQuestion(n);
}
function checkQ1(){checkStep(1);}
function checkQ2(){checkStep(2);}
function checkQ3(){checkStep(3);}

function showStepWorking(n){
  const qid='q'+n, step=COMBINE_STEPS[n-1];
  const box=document.getElementById(qid+'Working'); box.className='working-box visible';
  const a=VALUES[step.a], b=VALUES[step.b], result=VALUES[step.key];
  const lbl=`<span class="${step.cls}">${step.label}</span>`;
  let html;
  if(step.c){
    const c=VALUES[step.c];
    html = `
      <div class="wline">${step.aLabel}, ${step.bLabel} and ${step.cLabel} are all in series here — just add them:</div>
      <div class="wlabel">Formula:</div>
      <div class="formula-row">${lbl} = ${step.aLabel} + ${step.bLabel} + ${step.cLabel}</div>
      <div class="wlabel">Substituting values:</div>
      <div class="formula-row">${lbl} = ${fmtO0(a)} + ${fmtO0(b)} + ${fmtO0(c)}</div>
      <div class="wline total">${lbl} = <span class="cr">${fmtO(result)}</span></div>`;
    document.getElementById(qid+'WorkingContent').innerHTML=html;
    return;
  }
  if(step.op==='series'){
    html = `
      <div class="wline">${step.aLabel} and ${step.bLabel} are in series here — just add them:</div>
      <div class="wlabel">Formula:</div>
      <div class="formula-row">${lbl} = ${step.aLabel} + ${step.bLabel}</div>
      <div class="wlabel">Substituting values:</div>
      <div class="formula-row">${lbl} = ${fmtO0(a)} + ${fmtO0(b)}</div>
      <div class="wline total">${lbl} = <span class="cr">${fmtO(result)}</span></div>`;
  } else {
    const recip=x=>(1/x).toFixed(5);
    const sum=(1/a+1/b);
    html = `
      <div class="wline">${step.aLabel} and ${step.bLabel} are the circuit's two parallel branches:</div>
      <div class="wlabel">Formula:</div>
      <div class="formula-row">${lbl} = ${frac('1',`${frac('1',step.aLabel)} + ${frac('1',step.bLabel)}`)}</div>
      <div class="wlabel">Substituting values:</div>
      <div class="formula-row">${lbl} = ${frac('1',`${frac('1',fmtO0(a))} + ${frac('1',fmtO0(b))}`)}</div>
      <div class="wlabel">Calculating denominators:</div>
      <div class="formula-row">${lbl} = ${frac('1',`${recip(a)} + ${recip(b)}`)}</div>
      <div class="wlabel">Summing:</div>
      <div class="formula-row">${lbl} = ${frac('1',sum.toFixed(5))}</div>
      <div class="wline total">${lbl} = <span class="cr">${fmtO(result)}</span></div>`;
  }
  document.getElementById(qid+'WorkingContent').innerHTML=html;
}

// ── navigation ──
function resetQuestion(qid){
  const st=Q[qid];
  st.sel=null; st.ans=false;
  renderOptions(qid);
  document.getElementById(qid+'Banner').className='result-banner';
  document.getElementById(qid+'Working').className='working-box';
  const chk=document.getElementById(qid+'Check'); chk.style.display='inline-block'; chk.disabled=true;
  const isLast = qid === QIDS[QIDS.length-1];
  const adv=document.getElementById(qid+(isLast?'Summary':'Next'));
  if(adv) adv.style.display='none';
}
// Going back to question n must also clear n itself and every question after it —
// otherwise a later question can be left in its old "answered" state (stale
// banner/marked options and stale layout) if the student changes an earlier
// answer and moves forward again without re-answering it.
function backTo(n){
  for(let i=n;i<=QUIZ_QUESTION_COUNT;i++){ resetQuestion('q'+i); }
  showQuestion(n);
}
function backFromQ2(){ backTo(1); }
function backFromQ3(){ backTo(2); }
function backFromQ4(){ backTo(3); }

function showSummary(){
  cur='summary';
  QIDS.forEach(q=>document.getElementById(q+'Panel').style.display='none');
  document.getElementById('summaryPanel').style.display='block';
  showLayout(4);
  const vals=`<div class="summary-values">
    <span style="color:var(--colour-supply);font-weight:bold">V<sub>S</sub></span> = <span style="color:var(--colour-supply)">${V.vs} V</span>&nbsp;&nbsp;&nbsp;
    <span style="font-weight:bold">R1</span> = ${fmtO0(V.r1)}&nbsp;&nbsp;
    <span style="font-weight:bold">R2</span> = ${fmtO0(V.r2)}&nbsp;&nbsp;
    <span style="font-weight:bold">R3</span> = ${fmtO0(V.r3)}&nbsp;&nbsp;
    <span style="font-weight:bold">R4</span> = ${fmtO0(V.r4)}&nbsp;&nbsp;
    <span style="font-weight:bold">R5</span> = ${fmtO0(V.r5)}&nbsp;&nbsp;
    <span style="font-weight:bold">R6</span> = ${fmtO0(V.r6)}
  </div>`;
  const items=QIDS.map((qid,i)=>{
    const st=Q[qid];
    const qtext=document.querySelector('#'+qid+'Panel .q-text').innerHTML;
    const ans=(st.sel!=null && st.opts[st.sel])?st.opts[st.sel].label:'—';
    const ok=st.sel===st.cor;
    const colour=ok?'var(--colour-ui-correct)':'#ff3366';
    const mark=ok?'✓':'✗';
    const working=document.getElementById(qid+'WorkingContent').innerHTML;
    return `<div class="summary-item">
      <div class="summary-item-head"><span class="summary-qnum">Q${i+1}</span><span class="summary-question">${qtext}</span></div>
      <div class="summary-answer" style="color:${colour}">You answered: ${ans} &nbsp; ${mark}</div>
      <div class="working-box visible">${working}</div>
    </div>`;
  }).join('');
  document.getElementById('summaryContent').innerHTML=vals+items;
  QIDS.forEach(q=>{ const d=document.getElementById('dot-'+q); if(d) d.className='progress-dot done'; });
  document.getElementById('progressLabel').textContent='Complete';

  const returnBtn=document.getElementById('returnToQuizBtn');
  const returnUrl=returnTo && RETURN_URLS[returnTo];
  returnBtn.style.display=returnUrl?'inline-block':'none';
  if(returnUrl) returnBtn.onclick=()=>{ location.href=returnUrl; };
}

function updateProgress(){
  QIDS.forEach(q=>{
    const d=document.getElementById('dot-'+q); if(!d) return;
    d.className='progress-dot';
    if(q===cur) d.classList.add('active'); else if(Q[q].ans) d.classList.add('done');
  });
  const n=QIDS.indexOf(cur)+1;
  const lbl=document.getElementById('progressLabel'); if(lbl && n>0) lbl.textContent=n+' / '+QUIZ_QUESTION_COUNT;
}

function advanceQuestion(n){
  const qid='q'+n;
  document.getElementById(qid+'Check').style.display='none';
  const isLast=(n===QUIZ_QUESTION_COUNT);
  document.getElementById(qid+(isLast?'Summary':'Next')).style.display='inline-block';
  updateProgress();
}

function showQuestion(n){
  const qid='q'+n;
  cur=qid;
  QIDS.forEach(q=>document.getElementById(q+'Panel').style.display='none');
  document.getElementById('summaryPanel').style.display='none';
  document.getElementById(qid+'Panel').style.display='flex';
  const layoutBefore = n===1 ? 0 : COMBINE_STEPS[n-2].layoutAfter;
  const ans=Q[qid].ans;
  showLayout(ans ? COMBINE_STEPS[n-1].layoutAfter : layoutBefore);
  if(ans) applyLayoutColours(n-1, false);
  else if(n>1) applyLayoutColours(n-2, true);
  updateProgress();
}

function resetQuiz(){
  QIDS.forEach((qid,i)=>{
    const opts=QUESTION_BUILDERS[i]();
    Q[qid]={sel:null,ans:false,cor:opts.findIndex(o=>o.type==='correct'),opts};
    renderOptions(qid);
    document.getElementById(qid+'Banner').className='result-banner';
    document.getElementById(qid+'Working').className='working-box';
    const chk=document.getElementById(qid+'Check');
    if(chk){ chk.style.display='inline-block'; chk.disabled=true; }
    const isLast=i===QIDS.length-1;
    const adv=document.getElementById(qid+(isLast?'Summary':'Next'));
    if(adv) adv.style.display='none';
  });
  document.getElementById('summaryPanel').style.display='none';
  showQuestion(1);
}

/* ─── DEV: jump straight to a question for testing ──────────────────────
   Console:   jump(5)            → go to Q5
              jump(5, true)      → go to Q5 already answered (banner + reveal)
   URL:       ?q=5               → loads straight on Q5
              ?q=5&ans=1         → loads on Q5, answered
   Generic — copies into any quiz unchanged; remove the block to ship clean. */
function jump(n, answered){
  if(n<1||n>QUIZ_QUESTION_COUNT){ console.warn('jump: no question', n); return; }
  showQuestion(n);
  if(answered){
    const st=Q['q'+n];
    if(st){ st.sel=st.cor; }
    const check=window['checkQ'+n];
    if(typeof check==='function') check();
  }
}
window.jump = jump;

/* ─── DEV: xy ruler overlay, for lining up SVG coordinates by eye ────────
   Console:   setXY(1)           → show the ruler
              setXY(0)           → hide the ruler
   URL:       ?xy=1              → loads with the ruler already showing
   Off (0) by default. Draws a horizontal ruler along the bottom of the
   diagram (just above the zoom hint) and a vertical ruler down the far
   left side, viewBox coordinates 0 upward in steps of 10px — minor ticks
   every 10px, numbered major ticks every 50px so the labels stay readable. */
function buildXYRuler(){
  const g=document.getElementById('xyRuler');
  if(g.dataset.built) return;
  g.dataset.built='1';
  const vb=document.getElementById('circuitSvg').viewBox.baseVal;
  const W=vb.width, H=vb.height;
  const hy=H-10;   // horizontal ruler baseline — near the bottom, above the zoom hint
  const vx=10;     // vertical ruler baseline — near the far left edge
  const col='#ff00ff';
  let svg=`<line x1="0" y1="${hy}" x2="${W}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
  for(let x=0;x<=W;x+=10){
    const major=(x%50===0), len=major?10:5;
    svg+=`<line x1="${x}" y1="${hy-len}" x2="${x}" y2="${hy}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
    if(major) svg+=`<text x="${x}" y="${hy-13}" fill="${col}" font-size="8" text-anchor="middle">${x}</text>`;
  }
  svg+=`<line x1="${vx}" y1="0" x2="${vx}" y2="${H}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
  for(let y=0;y<=H;y+=10){
    const major=(y%50===0), len=major?10:5;
    svg+=`<line x1="${vx}" y1="${y}" x2="${vx+len}" y2="${y}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
    if(major) svg+=`<text x="${vx+13}" y="${y+3}" fill="${col}" font-size="8" text-anchor="start">${y}</text>`;
  }
  g.innerHTML=svg;
}
function setXY(on){
  if(on) buildXYRuler();
  document.getElementById('xyRuler').setAttribute('display', on?'inline':'none');
}
window.setXY = setXY;
