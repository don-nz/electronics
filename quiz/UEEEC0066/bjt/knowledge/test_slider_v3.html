<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BJT Biasing Integrated Visualizer</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #121620;
            --magenta: #ff007f;
            --cyan: #00f0ff;
            --yellow: #ffee00;
            --red: #ff3344;
            --green: #00ff66; /* Flowing / OK state color */
            --text-dim: #a0aab8;
            --colour-bjt: #ffb454; /* Transistor symbol */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .graphic-container {
            width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #1f2636;
        }

        h2 {
            text-align: center;
            font-size: 1.1em;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* --- DASHED JUNCTION BOXES --- */
        .junction-box {
            border-radius: 12px;
            padding: 14px 18px;
            position: relative;
            background: rgba(255,255,255,0.02);
            box-sizing: border-box;
        }

        .box-magenta {
            border: 2px dashed var(--magenta);
            box-shadow: inset 0 0 10px rgba(255, 0, 127, 0.1);
        }

        .box-cyan {
            border: 2px dashed var(--cyan);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .box-title {
            font-weight: 800;
            font-size: 0.85em;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .box-magenta .box-title { color: var(--magenta); }
        .box-cyan .box-title { color: var(--cyan); }

        .box-subtitle {
            font-size: 0.72em;
            color: var(--text-dim);
            font-family: monospace;
            margin-bottom: 12px;
        }

        /* --- THICK GRADIENT SLIDERS FOR C & E --- */
        .horizontal-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 16px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            margin-top: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #slide-C { background: linear-gradient(to right, #2a0018, var(--magenta), #ffffff); }
        #slide-E { background: linear-gradient(to right, #001f28, var(--cyan), #ffffff); }

        .horizontal-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px #ffffff, 0 0 15px rgba(255,255,255,0.8);
            border: 2px solid var(--bg-color);
        }

        /* --- SCHEMATIC AREA --- */
        .schematic-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            margin: 10px 0;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .wire { transition: stroke 0.3s ease, stroke-width 0.3s ease, fill 0.3s ease; }

        /* Transparent overlay for Base wire slider */
        .base-slider-overlay {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
            -webkit-appearance: none;
            background: transparent;
            margin: 0;
            padding: 0;
        }

        .base-slider-overlay::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* --- FIXED CLEAN STATUS BANNER --- */
        .status-badge {
            text-align: center;
            padding: 16px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9em;
            line-height: 1.6;
            margin-top: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .status-header {
            font-size: 0.95em;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .status-line {
            margin: 4px 0;
            font-weight: 600;
        }

        .active-state {
            background: rgba(0, 255, 102, 0.12);
            border: 1px solid var(--green);
            color: var(--green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.25);
        }

        .alert-state {
            background: rgba(255, 51, 68, 0.15);
            border: 1px solid var(--red);
            color: var(--red);
            box-shadow: 0 0 15px rgba(255, 51, 68, 0.3);
        }

        .warning-state {
            background: rgba(255, 238, 0, 0.12);
            border: 1px solid var(--yellow);
            color: var(--yellow);
            box-shadow: 0 0 15px rgba(255, 238, 0, 0.25);
        }
    </style>
</head>
<body>

<div class="graphic-container">
    <h2>BJT Biasing Integrated Visualizer</h2>

    <!-- TOP DASHED BOX: C-B JUNCTION & COLLECTOR SLIDER -->
    <div class="junction-box box-magenta">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div class="box-title">C–B JUNCTION BIASING</div>
                <div class="box-subtitle">REGULATION CONDITION: REVERSE-BIASED (V<sub>C</sub> > V<sub>B</sub>)</div>
            </div>
            <span id="val-VC" style="color: var(--magenta); font-weight: bold; font-size: 1.0em;">V<sub>C</sub> = 12.0V</span>
        </div>
        <input type="range" id="slide-C" class="horizontal-slider" min="0" max="12" step="0.1" value="12">
    </div>

    <!-- SVG SCHEMATIC AREA -->
    <div class="schematic-wrapper">
        <svg id="svg-canvas" viewBox="0 0 540 220">
            <defs>
                <!-- GLOW FILTER FOR BJT SHAPE -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- ══ PRE-BUILT NPN BJT SHAPE ══ -->
                <g id="bjt-npn-shape">
                  <circle cx="7" cy="0" r="24" fill="none" style="stroke: var(--colour-bjt)" stroke-width="2" filter="url(#glow)" />
                  <line x1="-17" y1="0" x2="0" y2="0" style="stroke: var(--colour-bjt)" stroke-width="2" />
                  <!-- base lead -->
                  <line x1="0" y1="-12" x2="0" y2="12" style="stroke: var(--colour-bjt)" stroke-width="2.5" />
                  <!-- base bar -->
                  <polyline points="14,-34 14,-20 0,-8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
                  <!-- collector -->
                  <polyline points="14,34 14,20 0,8" style="stroke: var(--colour-bjt)" stroke-width="2" fill="none" stroke-linejoin="round" />
                  <!-- emitter -->
                  <polygon points="12,18 1,14 6,8" style="fill: var(--colour-bjt)" />
                  <!-- NPN arrow -->
                </g>
            </defs>

            <!-- EXTERNAL DYNAMIC SIGNAL WIRES -->
            <line id="wire-C" class="wire" x1="414" y1="0" x2="414" y2="76" stroke="var(--green)" stroke-width="6" stroke-linecap="round"/>
            <line id="wire-E" class="wire" x1="414" y1="144" x2="414" y2="220" stroke="var(--green)" stroke-width="6" stroke-linecap="round"/>
            <line id="wire-B" class="wire" x1="85" y1="110" x2="383" y2="110" stroke="var(--green)" stroke-width="6" stroke-linecap="round"/>

            <!-- BJT SHAPE -->
            <use href="#bjt-npn-shape" x="400" y="110" />

            <!-- BASE TICKS & LABELS -->
            <line x1="105" y1="100" x2="105" y2="120" stroke="#a0aab8" stroke-width="2"/>
            <text x="105" y="138" fill="#a0aab8" font-size="11" font-weight="bold" text-anchor="middle">0V</text>

            <line x1="210" y1="95" x2="210" y2="125" stroke="var(--cyan)" stroke-width="3"/>
            <text x="210" y="138" fill="var(--cyan)" font-size="12" font-weight="bold" text-anchor="middle">0.6V</text>

            <line x1="320" y1="100" x2="320" y2="120" stroke="#a0aab8" stroke-width="2"/>
            <text x="320" y="138" fill="#a0aab8" font-size="11" font-weight="bold" text-anchor="middle">5.0V</text>

            <!-- Base Knob -->
            <circle id="knob-B" cx="210" cy="110" r="10" fill="#ffffff" stroke="var(--green)" stroke-width="3" filter="drop-shadow(0px 0px 8px #ffffff)"/>

            <!-- Unified Base Readout -->
            <text x="0" y="115" fill="#ffffff" font-weight="bold" font-size="14">V<tspan baseline-shift="sub" font-size="10">B</tspan> = <tspan id="val-VB-text" fill="#ffffff">0.60V</tspan></text>

            <!-- JUNCTION BIAS READOUTS -->
            <!-- V_BC Readout (Collector Junction - Magenta) -->
            <text x="435" y="55" fill="var(--magenta)" font-weight="bold" font-size="12">
                V<tspan baseline-shift="sub" font-size="9">BC</tspan> = <tspan id="val-VBC">-11.40V</tspan>
            </text>
            <text id="bias-VBC-tag" x="435" y="70" fill="var(--green)" font-size="10" font-weight="bold">(REVERSE)</text>

            <!-- V_BE Readout (Emitter Junction - Cyan) -->
            <text x="435" y="165" fill="var(--cyan)" font-weight="bold" font-size="12">
                V<tspan baseline-shift="sub" font-size="9">BE</tspan> = <tspan id="val-VBE">+0.60V</tspan>
            </text>
            <text id="bias-VBETag" x="435" y="180" fill="var(--green)" font-size="10" font-weight="bold">(FORWARD)</text>
        </svg>

        <!-- Invisible Base Slider Overlay -->
        <input type="range" id="slide-B" class="base-slider-overlay" min="0" max="1" step="0.001" value="0.5" 
               style="left: 105px; top: 95px; width: 215px; height: 30px;">
    </div>

    <!-- BOTTOM DASHED BOX: B-E JUNCTION & EMITTER SLIDER -->
    <div class="junction-box box-cyan">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div class="box-title">B–E JUNCTION BIASING</div>
                <div class="box-subtitle">TRIGGER CONDITION: FORWARD-BIASED (V<sub>BE</sub> = V<sub>B</sub> - V<sub>E</sub> ≥ 0.6V)</div>
            </div>
            <span id="val-VE" style="color: var(--cyan); font-weight: bold; font-size: 1.0em;">V<sub>E</sub> = 0.0V</span>
        </div>
        <input type="range" id="slide-E" class="horizontal-slider" min="0" max="5" step="0.1" value="0">
    </div>

    <!-- STATUS DISPLAY BANNER -->
    <div id="status-display" class="status-badge active-state">
        ACTIVE REGION: V<sub>C</sub> > V<sub>B</sub> > V<sub>E</sub> → Normal Flow!
    </div>
</div>

<script>
    const slideC = document.getElementById('slide-C');
    const slideB = document.getElementById('slide-B');
    const slideE = document.getElementById('slide-E');

    const valVC = document.getElementById('val-VC');
    const valVBText = document.getElementById('val-VB-text');
    const valVE = document.getElementById('val-VE');

    const valVBC = document.getElementById('val-VBC');
    const biasVBCTag = document.getElementById('bias-VBC-tag');
    const valVBE = document.getElementById('val-VBE');
    const biasVBETag = document.getElementById('bias-VBETag');

    const knobB = document.getElementById('knob-B');

    const wireB = document.getElementById('wire-B');
    const wireC = document.getElementById('wire-C');
    const wireE = document.getElementById('wire-E');
    const statusDisplay = document.getElementById('status-display');

    function updateCircuit() {
        let vc = parseFloat(slideC.value);
        let pct = parseFloat(slideB.value);
        let ve = parseFloat(slideE.value);

        let vb;
        if (pct <= 0.5) {
            vb = (pct / 0.5) * 0.6;
        } else {
            vb = 0.6 + ((pct - 0.5) / 0.5) * (5.0 - 0.6);
        }

        let bx = 105 + pct * (320 - 105);
        knobB.setAttribute("cx", bx);

        valVC.innerHTML = `V<sub>C</sub> = ${vc.toFixed(1)}V`;
        valVBText.textContent = `${vb.toFixed(2)}V`;
        valVE.innerHTML = `V<sub>E</sub> = ${ve.toFixed(1)}V`;

        // Calculate Junction Voltages
        let vbe = vb - ve;
        let vbc = vb - vc;

        // ══ ENHANCED 3-STATE V_BE DISPLAY ══
        valVBE.textContent = `${vbe >= 0 ? '+' : ''}${vbe.toFixed(2)}V`;
        
        let isBeOff = false;
        if (vbe >= 0.6) {
            biasVBETag.textContent = "(FORWARD)";
            biasVBETag.setAttribute("fill", "var(--green)");
        } else if (vbe >= 0) {
            biasVBETag.textContent = "(SUB-THRESHOLD)";
            biasVBETag.setAttribute("fill", "var(--yellow)");
            isBeOff = true;
        } else {
            biasVBETag.textContent = "(REVERSE)";
            biasVBETag.setAttribute("fill", "var(--red)");
            isBeOff = true;
        }

        // Update V_BC Display (REVERSE = GREEN / OK)
        valVBC.textContent = `${vbc >= 0 ? '+' : ''}${vbc.toFixed(2)}V`;
        let isSat = false;
        if (vbc <= 0) {
            biasVBCTag.textContent = "(REVERSE)";
            biasVBCTag.setAttribute("fill", "var(--green)");
        } else {
            biasVBCTag.textContent = "(FORWARD/SAT)";
            biasVBCTag.setAttribute("fill", "var(--red)");
            isSat = true;
        }

        // ══ CLEAN STRUCTURED STATUS DISPLAY LOGIC ══
        if (isBeOff && isSat) {
            // BOTH SUB-THRESHOLD / OFF AND SATURATION
            setCircuitColors("#ff3344", 6);
            statusDisplay.className = "status-badge alert-state";
            let beMsg = vbe >= 0 
                ? `SUB-THRESHOLD (V<sub>BE</sub> = +${vbe.toFixed(2)}V < 0.6V threshold)` 
                : `REVERSE BIASED (V<sub>BE</sub> = ${vbe.toFixed(2)}V)`;
            
            statusDisplay.innerHTML = `
                <div class="status-header">MULTIPLE BIAS FAULTS DETECTED</div>
                <div class="status-line">1. Emitter: ${beMsg}</div>
                <div class="status-line">2. Collector: SATURATION (V<sub>C</sub> ≤ V<sub>B</sub>)</div>
            `;
        } else if (isBeOff) {
            // ONLY EMITTER FAULT
            let isAmber = (vbe >= 0);
            let activeColor = isAmber ? "#ffee00" : "#ff3344";
            setCircuitColors(activeColor, 6);
            statusDisplay.className = isAmber ? "status-badge warning-state" : "status-badge alert-state";
            if (vbe >= 0) {
                statusDisplay.innerHTML = `<div class="status-line">CUTOFF: V<sub>BE</sub> is +${vbe.toFixed(2)}V (Sub-Threshold, Below 0.6V Silicon Barrier)</div>`;
            } else {
                statusDisplay.innerHTML = `<div class="status-line">CUTOFF: V<sub>BE</sub> is Reverse Biased (${vbe.toFixed(2)}V)</div>`;
            }
        } else if (isSat) {
            // ONLY SATURATION FAULT
            setCircuitColors("#ff3344", 6);
            statusDisplay.className = "status-badge alert-state";
            statusDisplay.innerHTML = `<div class="status-line">SATURATION WARNING: V<sub>C</sub> set too low! (V<sub>C</sub> ≤ V<sub>B</sub>)</div>`;
        } else {
            // ALL CONDITIONS OK
            setCircuitColors("#00ff66", 6);
            statusDisplay.className = "status-badge active-state";
            statusDisplay.innerHTML = `<div class="status-line">ACTIVE REGION: V<sub>C</sub> > V<sub>B</sub> > V<sub>E</sub> → Normal Flow!</div>`;
        }
    }

    function setCircuitColors(color, width) {
        wireB.setAttribute("stroke", color);
        wireB.setAttribute("stroke-width", width);
        knobB.setAttribute("stroke", color);

        wireC.setAttribute("stroke", color);
        wireC.setAttribute("stroke-width", width);
        wireE.setAttribute("stroke", color);
        wireE.setAttribute("stroke-width", width);
    }

    slideC.addEventListener('input', updateCircuit);
    slideB.addEventListener('input', updateCircuit);
    slideE.addEventListener('input', updateCircuit);

    updateCircuit();
</script>

</body>
</html>
