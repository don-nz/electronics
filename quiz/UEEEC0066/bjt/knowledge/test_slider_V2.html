<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BJT Biasing Integrated Visualizer</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #121620;
            --magenta: #ff007f;
            --cyan: #00f0ff;
            --yellow: #ffee00;
            --red: #ff3344;
            --text-dim: #a0aab8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .graphic-container {
            width: 540px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #1f2636;
        }

        h2 {
            text-align: center;
            font-size: 1.1em;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* --- DASHED JUNCTION BOXES --- */
        .junction-box {
            border-radius: 12px;
            padding: 12px 16px;
            position: relative;
            background: rgba(255,255,255,0.02);
            margin-bottom: 15px;
        }

        .box-magenta {
            border: 2px dashed var(--magenta);
            box-shadow: inset 0 0 10px rgba(255, 0, 127, 0.1);
        }

        .box-cyan {
            border: 2px dashed var(--cyan);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .box-title {
            font-weight: 800;
            font-size: 0.85em;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .box-magenta .box-title { color: var(--magenta); }
        .box-cyan .box-title { color: var(--cyan); }

        .box-subtitle {
            font-size: 0.75em;
            color: var(--text-dim);
            font-family: monospace;
        }

        /* --- INTEGRATED SVG SCHEMATIC STYLES --- */
        .schematic-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            margin: 10px 0;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .wire { transition: stroke 0.3s ease, stroke-width 0.3s ease, fill 0.3s ease; }

        /* Transparent overlays for HTML range sliders overlaid on SVG lines */
        .slider-overlay {
            position: absolute;
            opacity: 0; /* Invisible track, knob handled by SVG rendering */
            cursor: pointer;
            z-index: 10;
        }

        /* --- STATUS DISPLAY --- */
        .status-badge {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .active-state {
            background: rgba(255, 238, 0, 0.15);
            border: 1px solid var(--yellow);
            color: var(--yellow);
            box-shadow: 0 0 15px rgba(255, 238, 0, 0.3);
        }

        .cutoff-state {
            background: rgba(255, 51, 68, 0.15);
            border: 1px solid var(--red);
            color: var(--red);
            box-shadow: 0 0 15px rgba(255, 51, 68, 0.3);
        }

        .sat-state {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        /* Native HTML range slider styling over SVG tracks */
        input[type=range].line-slider {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range].line-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="graphic-container">
    <h2>BJT Biasing Integrated Visualizer</h2>

    <!-- TOP DASHED BOX: C-B JUNCTION -->
    <div class="junction-box box-magenta">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div class="box-title">C–B JUNCTION BIASING</div>
                <div class="box-subtitle">REGULATION CONDITION: REVERSE-BIASED (V<sub>C</sub> > V<sub>B</sub>)</div>
            </div>
            <span id="val-VC" style="color: var(--magenta); font-weight: bold; font-size: 1.1em;">V<sub>C</sub> = 12.0V</span>
        </div>
    </div>

    <!-- MAIN INTEGRATED SCHEMATIC AREA -->
    <div class="schematic-wrapper">
        <svg id="svg-canvas" viewBox="0 0 480 380">
            <!-- TRANSISTOR CORE SYMBOL -->
            <circle cx="360" cy="190" r="45" stroke="#4a5568" stroke-width="2" fill="none" />
            <line x1="345" y1="160" x2="345" y2="220" stroke="#ffffff" stroke-width="5"/>
            
            <!-- COLLECTOR LINE (Top vertical slider track) -->
            <line id="wire-C" class="wire" x1="360" y1="20" x2="360" y2="170" stroke="#ff3344" stroke-width="6"/>
            <line x1="345" y1="170" x2="360" y2="170" stroke="#ffffff" stroke-width="3"/>
            <circle id="knob-C" cx="360" cy="20" r="10" fill="#ffffff" stroke="var(--magenta)" stroke-width="3" filter="drop-shadow(0px 0px 8px #ffffff)"/>

            <!-- EMITTER LINE (Bottom vertical slider track) -->
            <line id="wire-E" class="wire" x1="360" y1="210" x2="360" y2="360" stroke="#ff3344" stroke-width="6"/>
            <line x1="345" y1="210" x2="360" y2="210" stroke="#ffffff" stroke-width="3"/>
            <polygon id="arrow-E" points="353,230 367,230 360,248" fill="#ff3344" />
            <circle id="knob-E" cx="360" cy="360" r="10" fill="#ffffff" stroke="var(--cyan)" stroke-width="3" filter="drop-shadow(0px 0px 8px #ffffff)"/>

            <!-- BASE LINE (Horizontal slider track extending out left) -->
            <line id="wire-B" class="wire" x1="40" y1="190" x2="345" y2="190" stroke="#ff3344" stroke-width="6"/>
            
            <!-- BASE TICKS & LABELS (0V, 0.6V Threshold, 5.0V) -->
            <!-- Tick 0V -->
            <line x1="60" y1="180" x2="60" y2="200" stroke="#a0aab8" stroke-width="2"/>
            <text x="60" y="220" fill="#a0aab8" font-size="12" font-weight="bold" text-anchor="middle">0V</text>
            
            <!-- Tick 0.6V (Threshold) -->
            <line x1="91.68" y1="175" x2="91.68" y2="205" stroke="var(--cyan)" stroke-width="3"/>
            <text x="91.68" y="220" fill="var(--cyan)" font-size="13" font-weight="bold" text-anchor="middle">0.6V</text>
            
            <!-- Tick 5.0V -->
            <line x1="324" y1="180" x2="324" y2="200" stroke="#a0aab8" stroke-width="2"/>
            <text x="324" y="220" fill="#a0aab8" font-size="12" font-weight="bold" text-anchor="middle">5.0V</text>

            <!-- Base Knob -->
            <circle id="knob-B" cx="96.96" cy="190" r="10" fill="#ffffff" stroke="#ff3344" stroke-width="3" filter="drop-shadow(0px 0px 8px #ffffff)"/>
            
            <!-- Terminal Text Labels -->
            <text x="20" y="195" fill="#ffffff" font-weight="bold" font-size="16">B</text>
            <text x="360" y="12" fill="var(--magenta)" font-weight="bold" font-size="14" text-anchor="middle">C</text>
            <text x="360" y="378" fill="var(--cyan)" font-weight="bold" font-size="14" text-anchor="middle">E</text>
        </svg>

        <!-- Invisible HTML range inputs placed directly over the SVG tracks -->
        <!-- Base Horizontal Slider Overlay (0V to 5.0V) -->
        <input type="range" id="slide-B" class="slider-overlay line-slider" min="0" max="5.0" step="0.05" value="0.7" 
               style="left: 40px; top: 175px; width: 305px; height: 30px;">

        <!-- Collector Vertical Slider Overlay -->
        <input type="range" id="slide-C" class="slider-overlay line-slider" min="0" max="12" step="0.1" value="12" 
               style="left: 345px; top: 10px; width: 30px; height: 160px; transform: rotate(180deg); writing-mode: bt-lr; -webkit-appearance: slider-vertical;">

        <!-- Emitter Vertical Slider Overlay -->
        <input type="range" id="slide-E" class="slider-overlay line-slider" min="0" max="5" step="0.1" value="0" 
               style="left: 345px; top: 200px; width: 30px; height: 160px; -webkit-appearance: slider-vertical;">
    </div>

    <!-- MIDDLE READOUT FOR BASE -->
    <div style="text-align: center; margin-bottom: 15px;">
        <span id="val-VB" style="color: #ffffff; font-weight: bold; font-size: 1.1em; background: rgba(255,255,255,0.05); padding: 6px 16px; border-radius: 20px; border: 1px solid #333;">
            V<sub>B</sub> = 0.70V
        </span>
    </div>

    <!-- BOTTOM DASHED BOX: B-E JUNCTION -->
    <div class="junction-box box-cyan">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div class="box-title">B–E JUNCTION BIASING</div>
                <div class="box-subtitle">TRIGGER CONDITION: FORWARD-BIASED (V<sub>BE</sub> = V<sub>B</sub> - V<sub>E</sub> ≥ 0.6V)</div>
            </div>
            <span id="val-VE" style="color: var(--cyan); font-weight: bold; font-size: 1.1em;">V<sub>E</sub> = 0.0V</span>
        </div>
    </div>

    <!-- STATUS DISPLAY BANNER -->
    <div id="status-display" class="status-badge active-state">
        ACTIVE REGION: Current Flowing!
    </div>
</div>

<script>
    const slideC = document.getElementById('slide-C');
    const slideB = document.getElementById('slide-B');
    const slideE = document.getElementById('slide-E');

    const valVC = document.getElementById('val-VC');
    const valVB = document.getElementById('val-VB');
    const valVE = document.getElementById('val-VE');

    const knobB = document.getElementById('knob-B');
    const knobC = document.getElementById('knob-C');
    const knobE = document.getElementById('knob-E');

    const wireB = document.getElementById('wire-B');
    const wireC = document.getElementById('wire-C');
    const wireE = document.getElementById('wire-E');
    const arrowE = document.getElementById('arrow-E');
    const statusDisplay = document.getElementById('status-display');

    function updateCircuit() {
        let vc = parseFloat(slideC.value);
        let vb = parseFloat(slideB.value);
        let ve = parseFloat(slideE.value);

        // Update readouts
        valVC.innerHTML = `V<sub>C</sub> = ${vc.toFixed(1)}V`;
        valVB.innerHTML = `V<sub>B</sub> = ${vb.toFixed(2)}V`;
        valVE.innerHTML = `V<sub>E</sub> = ${ve.toFixed(1)}V`;

        // Update Knob Positions visually along SVG lines
        // Base Knob mapping (min 0 -> X: 60, max 5.0 -> X: 324)
        let bx = 60 + (vb / 5.0) * (324 - 60);
        knobB.setAttribute("cx", bx);

        // Collector Knob mapping (min 0 -> Y: 160, max 12 -> Y: 20)
        let cy = 160 - (vc / 12) * (160 - 20);
        knobC.setAttribute("cy", cy);

        // Emitter Knob mapping (min 0 -> Y: 360, max 5 -> Y: 220)
        let ey = 360 - (ve / 5) * (360 - 220);
        knobE.setAttribute("cy", ey);

        let vbe = vb - ve;

        // Logic checks & Color updates
        if (vbe < 0.6) {
            // CUTOFF REGION
            setCircuitColors("#ff3344", 3, "#ff3344", 3); // Red (No Flow)
            statusDisplay.className = "status-badge cutoff-state";
            statusDisplay.innerHTML = "CUTOFF: V<sub>BE</sub> < 0.6V → Transistor OFF (No Flow)";
        } else if (vc <= vb) {
            // SATURATION REGION
            setCircuitColors("#00f0ff", 5, "#00f0ff", 5); // Cyan Flow
            statusDisplay.className = "status-badge sat-state";
            statusDisplay.innerHTML = "SATURATION: V<sub>C</sub> ≤ V<sub>B</sub> → Transistor Fully ON";
        } else {
            // ACTIVE AMPLIFYING REGION
            setCircuitColors("#ffee00", 6, "#ffee00", 6); // Bright Yellow Glow
            statusDisplay.className = "status-badge active-state";
            statusDisplay.innerHTML = "ACTIVE REGION: V<sub>C</sub> > V<sub>B</sub> > V<sub>E</sub> → Normal Flow!";
        }
    }

    function setCircuitColors(baseColor, baseWidth, mainColor, mainWidth) {
        wireB.setAttribute("stroke", baseColor);
        wireB.setAttribute("stroke-width", baseWidth);
        knobB.setAttribute("stroke", baseColor);

        wireC.setAttribute("stroke", mainColor);
        wireC.setAttribute("stroke-width", mainWidth);
        wireE.setAttribute("stroke", mainColor);
        wireE.setAttribute("stroke-width", mainWidth);

        arrowE.setAttribute("fill", mainColor);
    }

    slideC.addEventListener('input', updateCircuit);
    slideB.addEventListener('input', updateCircuit);
    slideE.addEventListener('input', updateCircuit);

    // Initial render
    updateCircuit();
</script>

</body>
</html>
