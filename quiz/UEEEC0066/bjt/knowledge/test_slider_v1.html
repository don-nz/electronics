<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BJT Interactive Biasing Visualizer</title>
    <style>
        body { font-family: sans-serif; background-color: #121214; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e24; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .slider-group { margin: 15px 0; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; }
        #status-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 1.1em; }
        svg { background: #121214; border-radius: 8px; margin: 10px 0; }
        .red-flow { stroke: #ff3333; fill: #ff3333; transition: 0.3s; }
        .yellow-flow { stroke: #ffea00; fill: #ffea00; transition: 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <h2>BJT Biasing Interactive Visualizer</h2>

    <!-- Visual Circuit Area -->
    <svg width="400" height="220">
        <!-- Transistor Symbol -->
        <circle cx="200" cy="110" r="45" stroke="#aaa" stroke-width="2" fill="none" />
        <line x1="185" y1="80" x2="185" y2="140" stroke="#aaa" stroke-width="4"/>
        
        <!-- Base Line (B) -->
        <line id="path-B" x1="50" y1="110" x2="185" y2="110" class="red-flow" stroke-width="6"/>
        
        <!-- Collector Line (C) -->
        <line id="path-C" x1="200" y1="20" x2="200" y2="90" class="red-flow" stroke-width="6"/>
        <line x1="185" y1="90" x2="200" y2="90" stroke="#aaa" stroke-width="3"/>

        <!-- Emitter Line (E) -->
        <line id="path-E" x1="200" y1="130" x2="200" y2="200" class="red-flow" stroke-width="6"/>
        <line x1="185" y1="130" x2="200" y2="130" stroke="#aaa" stroke-width="3"/>
        
        <!-- Emitter Arrow -->
        <polygon id="arrow-E" points="195,150 205,150 200,165" class="red-flow" />

        <!-- Terminal Labels -->
        <text x="30" y="115" fill="#fff" font-weight="bold">B</text>
        <text x="200" y="15" fill="#fff" font-weight="bold" text-anchor="middle">C</text>
        <text x="200" y="215" fill="#fff" font-weight="bold" text-anchor="middle">E</text>
    </svg>

    <!-- Slider 1: Base -->
    <div class="slider-group">
        <label>Base Voltage ($V_B$): <span id="val-B">0.0</span> V (Turn-ON Threshold: 0.6V)</label>
        <input type="range" id="slide-B" min="0" max="5" step="0.1" value="0">
    </div>

    <!-- Slider 2: Collector -->
    <div class="slider-group">
        <label>Collector Voltage ($V_C$): <span id="val-C">12.0</span> V</label>
        <input type="range" id="slide-C" min="0" max="12" step="0.1" value="12">
    </div>

    <!-- Slider 3: Emitter -->
    <div class="slider-group">
        <label>Emitter Voltage ($V_E$): <span id="val-E">0.0</span> V</label>
        <input type="range" id="slide-E" min="0" max="5" step="0.1" value="0">
    </div>

    <!-- Status Banner -->
    <div id="status-box">State: CUTOFF (No Current Flow)</div>
</div>

<script>
    function update() {
        let VB = parseFloat(document.getElementById('slide-B').value);
        let VC = parseFloat(document.getElementById('slide-C').value);
        let VE = parseFloat(document.getElementById('slide-E').value);

        document.getElementById('val-B').innerText = VB.toFixed(1);
        document.getElementById('val-C').innerText = VC.toFixed(1);
        document.getElementById('val-E').innerText = VE.toFixed(1);

        let VBE = VB - VE;
        let VCB = VC - VB;

        let pathB = document.getElementById('path-B');
        let pathC = document.getElementById('path-C');
        let pathE = document.getElementById('path-E');
        let arrowE = document.getElementById('arrow-E');
        let statusBox = document.getElementById('status-box');

        // Logic check
        if (VBE < 0.6) {
            // CUTOFF: VB - VE is too low
            setFlow(false, false);
            statusBox.innerText = "State: CUTOFF (V_BE < 0.6V → No Base Current)";
            statusBox.style.background = "#551111";
        } else if (VC <= VB) {
            // SATURATION: VC is not higher than VB
            setFlow(true, false);
            statusBox.innerText = "State: SATURATION (V_BE ≥ 0.6V, but V_C ≤ V_B → Limited C-E Flow)";
            statusBox.style.background = "#555511";
        } else {
            // ACTIVE REGION: Both conditions met!
            setFlow(true, true);
            statusBox.innerText = "State: ACTIVE REGION (V_BE ≥ 0.6V & V_C > V_B → Full Current Flow!)";
            statusBox.style.background = "#115511";
        }

        function setFlow(baseFlowing, collectorFlowing) {
            pathB.className.baseVal = baseFlowing ? "yellow-flow" : "red-flow";
            
            let cFlow = baseFlowing && collectorFlowing;
            pathC.className.baseVal = cFlow ? "yellow-flow" : "red-flow";
            pathE.className.baseVal = cFlow ? "yellow-flow" : "red-flow";
            arrowE.className.baseVal = cFlow ? "yellow-flow" : "red-flow";
        }
    }

    document.getElementById('slide-B').addEventListener('input', update);
    document.getElementById('slide-C').addEventListener('input', update);
    document.getElementById('slide-E').addEventListener('input', update);
    update();
</script>

</body>
</html>
